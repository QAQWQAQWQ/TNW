<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pixelate Germany Outline</title>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const img = new Image();
img.crossOrigin = "anonymous";
img.onload = function() {
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    
    // Step 1: draw the source image to a small offscreen canvas (pixelate effect)
    const smallW = 80;
    const smallH = Math.round(80 * img.height / img.width);
    const small = document.createElement('canvas');
    small.width = smallW;
    small.height = smallH;
    const sctx = small.getContext('2d');
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(img, 0, 0, smallW, smallH);
    
    // Step 2: draw the small canvas scaled up to full size with smoothing disabled
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    
    // center the image
    const scale = Math.min(c.width / smallW, c.height / smallH);
    const dw = smallW * scale;
    const dh = smallH * scale;
    const dx = (c.width - dw) / 2;
    const dy = (c.height - dh) / 2;
    ctx.drawImage(small, dx, dy, dw, dh);
    
    // Step 3: convert to black and white only (pure pixel edges)
    const data = ctx.getImageData(0, 0, c.width, c.height);
    const d = data.data;
    for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        // if not pure white, make it pure black
        if (r < 240 || g < 240 || b < 240) {
            d[i] = 0; d[i+1] = 0; d[i+2] = 0;
            d[i+3] = 255;
        } else {
            d[i] = 255; d[i+1] = 255; d[i+2] = 255;
            d[i+3] = 255;
        }
    }
    ctx.putImageData(data, 0, 0);
    
    // Output as PNG
    const link = document.createElement('a');
    link.download = 'germany_pixel_outline.png';
    link.href = c.toDataURL('image/png');
    link.click();
};
img.src = 'https://aka.doubaocdn.com/s/4bLhdjGWO1';
</script>
</body>
</html>

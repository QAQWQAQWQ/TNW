 POLITICS_SUKARNO_DESC:0 "Father of Indonesian independence, leader of the Indonesian independence struggle... all these and more describe President Sukarno of the Republic of Indonesia. While reality, as always, is slightly more complex, this description is not far from the truth.\n\nThough dealing with the Japanese was necessary to maintain the young nation's independence, any clear-eyed observer can see that the benefits far outweigh the costs: Sukarno, as President, leads a rapidly rising and proudly standing nation; in a few years, his country may even possess the economic strength to rival world powers, facing an arduous and bold task.\n\nYet many years have passed, and the helmsman of this equatorial pearl faces discontent from all sides. Centralization from Java, the most prosperous island, has not been universally welcomed, and the Indonesian military has become a hotbed of extremism and radical thought. Sukarno does not fear this; he knows the respect and love of the people will see him through.\n\nWith the mandate of the people and the power of the Presidency, Indonesia will fly to the vast blue sky, no longer enslaved by anyone."

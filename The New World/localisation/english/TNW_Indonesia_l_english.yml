 INS_DUUM_suharto_despotism_party_long: "Indonesian Rescue and Unity Government - Suharto clique (Pemerintah Penyelamatan dan Kesatuan Nasional - Klik Suharto)"
 FIELD_MARSHAL_SUHARTO_DESC:0 "§LField Marshal Suharto is second in strength nationwide and third in influence. During the National Revolution, Suharto rose rapidly through the ranks to become a pivotal figure, building a considerable faction around himself. Ambitious, he always sought ways to influence President Sukarno, much to the annoyance of Vice President Hatta, who constantly checked him. No one knows where Suharto's ambition will lead him, but all expect — or fear — that he will stop at nothing to achieve his goals.§!"
 FIELD_MARSHAL_ABDUL_HARIS_NASUTION_DESC:0 "§LCommander Abdul Haris Nasution's brutality is feared not only by rebels but by his own men. These reputations are well-founded: the terror he exerts comes from his belief that he serves a greater cause, and that any price is worth paying for that cause. Everything he does is for Indonesia. Every village burned, every rebel executed, every order given — it is all for Indonesia.§!"
 GENERAL_LB_MOERDANI_DESC:0 "§LGeneral Leonardus Benjamin Moerdani's military career began with service in the student army during the National Revolution, launching his career. He made his name through his hardline, outspoken political stance and religious faith — for better or worse. In a Muslim-majority nation, his Catholicism drew endless suspicion. Yet no one ever doubted his loyalty to Indonesia and to Sukarno.§!"

 INS_Djuanda_Kartawidjaja_hog_desc: "§YPrime Minister\nPaternalistic Developmentalism§!\n--------------\n§LIn Indonesian politics, \"administrators\" and \"unity-makers\" always bicker; President Sukarno believes only a cabinet can bridge the divide and maintain national peace. The technocrat Djuanda Kartawidjaja, an eclectic national hero, is the ideal figure to lead the cabinet. A Sundanese civil engineer educated in the now-defunct Dutch \"Ethical Policy\" schools, Djuanda graduated from the Bandung Institute of Technology, joined the independence movement, and after 1949 became a mainstay of the national cabinet.\n\nYet even he, seemingly tireless, is nearing exhaustion. Through the chaos of the Sjtjidik, Natsir, and Manai eras, Djuanda was appointed by Sukarno on Hatta and Sjahrir's recommendation, his primary duty being to centralize the railways built during the Japanese occupation and rationalize the patchwork economy left by the Dutch and neglected by Japanese wartime needs. Over the past year, Djuanda, together with fellow technocrats Johannes Leimena and Roosseno, normalized Indonesia's relations with Japan.\n\nThanks to Djuanda's \"Eight-Year Development Plan,\" these efforts have borne fruit. The Djuanda cabinet, leveraging the chaos in Indochina and the Philippines, has laid the foundation for Indonesia to become Japan's primary heavy-industry outsourcing base in Southeast Asia. The future looks bright, but Djuanda's health is failing. Will he live to see his efforts bear fruit? Only time will tell. But time waits for no one.§!"
 INS_Johannes_Leimena_hog_desc: "§YPrime Minister\nChristian Democracy§!\n--------------\n§LJohannes Leimena, or J. Leimena, is a meticulously composed man. Born in Ambon in 1905 to teacher parents, he lost his father at age five. Rather than live with his stepfather like his siblings, he moved in with his uncle's family. Young Leimena thus saw hardship and family strife from an early age. His youth spanned the turbulent 1920s, and he felt firsthand the growing hatred of the Indonesian people for their Dutch rulers.\n\nAfter graduating from the Native Physician Training School, Leimena worked in hospitals across Jakarta and Bandung. When the Japanese arrived and made clear they were there to stay, Leimena had become director of the Purwakarta and Tangerang hospitals. Perhaps due to his strong Christian education, those he believed would persecute and destroy the faith made him a fierce anti-communist. Yet, in sharp contrast, Leimena also rejected the \"for the benefit of the local people\" rhetoric of the Japanese who occupied the archipelago.\n\nWhat good did the Japanese bring? Hunger? Poverty? Death? The best thing they could do for Indonesia was leave and establish a state ruled by Indonesians. This belief drove Leimena step by step to the top, until he became Sukarno's chief Foreign Minister. But this experience gave the old man some new insights. The Japanese arrival was a disaster, but beneath it lay opportunity. If millions of Japanese and their advisors came to our shores, they could build the services we desperately need — healthcare and education, especially in the outer regions. Such opportunities other nations could hardly bring.§!"
 INS_Ruslan_Abdulgani_hog_desc: "§YPrime Minister\nRevolutionary Nationalism§!\n--------------\n§L§!"
 INS_Burhanuddin_Harahap_hog_desc: "§YPrime Minister\nIslamic Modernism§!\n--------------\n§L§!"
 INS_Supomo_hog_desc: "§YPrime Minister\nSocial Nationalism§!\n--------------\n§L§!"
 INS_Johannes_Leimena_for_desc: "§YForeign Minister\nChristian Democracy§!\n--------------\n§LJohannes Leimena, or J. Leimena, is a meticulously composed man. Born in Ambon in 1905 to teacher parents, he lost his father at age five. Rather than live with his stepfather like his siblings, he moved in with his uncle's family. Young Leimena thus saw hardship and family strife from an early age. His youth spanned the turbulent 1920s, and he felt firsthand the growing hatred of the Indonesian people for their Dutch rulers.\n\nAfter graduating from the Native Physician Training School, Leimena worked in hospitals across Jakarta and Bandung. When the Japanese arrived and made clear they were there to stay, Leimena had become director of the Purwakarta and Tangerang hospitals. Perhaps due to his strong Christian education, those he believed would persecute and destroy the faith made him a fierce anti-communist. Yet, in sharp contrast, Leimena also rejected the \"for the benefit of the local people\" rhetoric of the Japanese who occupied the archipelago.\n\nWhat good did the Japanese bring? Hunger? Poverty? Death? The best thing they could do for Indonesia was leave and establish a state ruled by Indonesians. This belief drove Leimena step by step to the top, until he became Sukarno's chief Foreign Minister. But this experience gave the old man some new insights. The Japanese arrival was a disaster, but beneath it lay opportunity. If millions of Japanese and their advisors came to our shores, they could build the services we desperately need — healthcare and education, especially in the outer regions. Such opportunities other nations could hardly bring.§!"
 INS_Ruslan_Abdulgani_for_desc: "§YForeign Minister\nRevolutionary Nationalism§!\n--------------\n§L§!"
 INS_Roosseno_Surjohadikusumo_eco_desc: "§YEconomic Minister\nCorporate Statism§!\n--------------\n§LSukarno's political coalition is long-standing and broad. Many in it could, in another timeline, stand alone and decide Indonesia's fate. One of the most striking figures is Roosseno, born Roosseno Surjohadikusumo. A member of Harazin's technocrat camp, Roosseno is a fierce agitator who argues that Indonesia must be ruled by those who know best, so that even the most vulnerable and downtrodden may live with dignity and peace.\n\nBeyond the technocrats, Roosseno also associates with the Indonesian corporatists under Sukarno. The corporatists demand national reorganization to eliminate class conflict and crush the possibility of communists exploiting chaos to launch a mass uprising against the government. Roosseno is an engineer. Like any good engineer, his job is to find what is wrong with the country, find the simplest and most effective way to fix it, and ensure it never happens again. And what is the situation he faces? Claws from Washington and Tokyo gradually grip the archipelago, threatening the pitiful sovereignty they still have under the Japanese yoke.\n\nIndonesia, like any other country, is merely an engineering project. We have already laid the foundation for a truly glorious nation; all that is needed is a strong hand to guide us to the final goal.§!"
 INS_Jusuf_Wibisono_eco_desc: "§YEconomic Minister\nIslamic Conservatism§!\n--------------\n§L§!"
 INS_Bambang_Supeno_sec_desc: "§YDefense Minister\nDespotism§!\n--------------\n§LBambang Supeno is Sukarno's distant relative. He has always lived a vigorous life. His father died when he was thirteen, and he was raised by his mother. He threw himself into cricket, football, martial arts, and the Scouts. At a young age, Supeno became a charismatic leader; when the Japanese first landed on Indonesian shores and expelled the Dutch, he was elected high school student body president.\n\nSupeno naturally became a leader; it was his gift. He joined the Pembela Tanah Air, a Japanese-organized paramilitary force meant to help the Japanese Army crush remaining resistance in the archipelago. Here, Bambang Supeno first tasted how dirty, bloody, and horrifying war is. Supeno learned a lesson: in war, even with the most advanced weapons and bombs, if the man holding the weapon does not know his place in history, it is all meaningless.\n\nIt was the fighting of the terrible Second World War and the National Revolution that convinced Bambang Supeno of a simple truth. Why should the military not have more say in politics? Why condemn those who give their all for the motherland merely because they obstruct the rule of a few pampered bureaucrats? Thousands died in the fierce battles on these islands — their comrades at least should decide how to remember them.§!"
 INS_IKKC: "Indonesian Economic Development Agency"
 INS_IKKC_desc: "After the Greater East Asian War, the wartime system of forced labor conscription in Indonesia was formally ended. The establishment of the Indonesian Economic Development Agency facilitated an agreement whereby Japanese companies developing Indonesia would \"compensate\" Indonesian workers economically.\n\nYet in reality, this so-called compensation is meager, and it is increasingly believed that the fruits of development have all been stolen by the Development Agency. Compared to the wartime system, it all seems like old wine in new bottles."
 INS_Dwitungal: "The Dwitungal"
 INS_Dwitungal_desc: "\"Signed by Sukarno and Hatta on behalf of the Indonesian people.\"\n\nThus ends the Indonesian Proclamation of Independence. This brief, telegraphic statement won the recognition of all strata of Indonesian society. The character and will of millions of Indonesians are represented by these two men: President Sukarno and his Vice President Mohammad Hatta. These two are the Dwitungal of Indonesia. Sukarno is the passionate rural savior; Hatta is the calm, cosmopolitan intellectual. Together, the two leaders strive for Indonesia's development. The bond between them is unbreakable, enduring.\n\n§VFor now.§!"
 INS_Eight_Years_Development_Plan: "Eight-Year Development Plan"
 INS_Eight_Years_Development_Plan_desc: "The government's goal should be to cultivate a capable next generation, ready to take over this developing nation, and lay the groundwork for the future so that civil administration becomes the vanguard of development and construction. Such is the belief of Djuanda Kartawidjaja. The brave technocrat leads the most stable and enduring cabinet in Indonesian history.\n\nDaring to climb, seeking truth, striving to accelerate — this is the credo of Djuanda's new Eight-Year Plan, officially called the Universal Development Plan. It includes state-led heavy industry expansion, breathtaking mega-infrastructure, magnificent dams and quality roads — all, of course, relying on Japanese financial support. The plan is in its second year, and many question whether it can ever be completed."
 INS_The_Year_of_Living_Dangerously: "The Year of Living Dangerously"
 INS_The_Year_of_Living_Dangerously_desc: "It is time for Indonesia to show the world that she is a nation of fierce will and unyielding resolve. It is time for Indonesia to mobilize fully — not only in body and numbers, but in spirit, to wage a resolute struggle against those odious rebels. Everyone, especially the youth, must contribute to the nation. Ignore the slander that \"the army is nothing but undisciplined boys\"; we will achieve final victory."
 INS_On_Land_Sea_and_Air: "On Land, Sea, and Air"
 INS_On_Land_Sea_and_Air_desc: "Sukarno has won over the Navy, the Marine Corps, the Air Force, and the Army Strategic Reserve Command. Now, whether on land, sea, or in the air, there are soldiers loyal to Sukarno. But even if they are loyal to Sukarno's cause and willing to die for it, the constant fighting across the country has stretched them thin; Sukarno's professional forces are overstretched."
 INS_Tokyos_Lifeline: "Tokyo's Lifeline"
 INS_Tokyos_Lifeline_desc: "Facing dire war and conflict, even the usual swagger must be curbed. True, Sukarno nationalized the Japanese companies providing vital resources to the home islands, even seizing their funds, but Japan can only grit its teeth and choose Sukarno — the other possible Indonesian rulers are simply too anti-Japanese. Circumstances are unfortunate; Sukarno is the right man, and Japan must support him even though it loathes him."
 indonesia.100.t:0 "Civil War Begins!"
 indonesia.100.desc:0 "Sukarno is not sure which of his decisions led him to stand on his balcony overlooking an angry mob; perhaps at some point he lost sight of his original purpose and kept making decisions unrepentantly. He remembers words Hatta said long ago, his resignation letter still in Sukarno's breast pocket. \"You walked into the forest of power and lost your way.\" Is that so? Did it all start with Sukarno overreaching? Throughout his career, Sukarno feared he had not gone far enough, but in the end he stands in his office watching his people take up arms against him.\n\nNasution and Suharto have gathered their armies, barking orders over the radio, while outposts across the nation prepare to attack. He looks out at the burning city, feeling he should understand something — perhaps Sukarno should learn from all this — but he does not. Sukarno's conviction is firmer than ever. Politics has robbed him of his luxurious life; ideological struggle has dyed the streets red. At this moment, Sukarno feels no sympathy for Hatta, the man who took everything from him. No time for pity; only justice."
 indonesia.100.a:0 "For Sukarno!"
 indonesia.100.b:0 "For the People!"
 usindoflavor.1.t:0 "Spirit of the Old"
 usindoflavor.1.d:0 "\"You know, Sergeant, I was here back then.\" The Captain said to the sergeant beside him, still gazing out at the endless sea before him.\n\n\"When was that, sir?\"\n\n\"When they bombed this city to rubble,\" replied the 52-year-old Captain Kenneth Green, still looking out over the sea off Darwin. \"When I was scrambling for cover, I truly thought their landing craft would hit the beach any moment.\" A gentle breeze blew, but between them reigned a deathly silence.\n\n\"Sir, I'm sorry, we thank you again for volunteering for this mission, but if you...\"\n\n\"But if I what, Sergeant?\" The Captain turned his gaze from the sea to meet the sergeant's eyes, his voice rising an octave with a thick Australian accent: \"If I'm afraid of this mission? You Yanks need a damn volunteer, and I'm the old wreck you're looking for!\" Green tried to compose himself but failed, continuing to roar: \"I want to see these guns' bullets put into some Jap's head.\"\n\n\"Please, sir, calm down!\" The sergeant's eyes darted around, full of doubt. \"You'll jeopardize the mission!\" Green agreed, but still resented the sergeant for doubting his resolve.\n\n\"Sorry, Green, is it? I have my own reasons for being here this time.\" The Captain turned away again, gazing at the horizon where sea met sky.\n\nThe sergeant walked off the dock, head bowed in thought, leaving the old man alone with the roaring sea."
 usindoflavor.1.a:0 "The past still lingers in people's hearts."
 usindoflavor.2.t:0 "Spirit of the Young"
 usindoflavor.2.d:0 "The wind was stronger than the day before. Before sunrise, the dock's dim lights illuminated the roaring waves. The low rumble of gunfire and the heavy thud of artillery echoed across the sea, drawing closer to Darwin. It made the seven men on the dock think of the bloodshed across the water.\n\n\"Gentlemen, this is where you'll be seasick for the next three weeks or so.\" The Sergeant half-jokingly introduced the ship's deck to his squad; he was assigned to guard the vessel, whose weapons would be secretly delivered to Indonesian rebels in Borneo.\n\n\"God, I'm going to be seasick, aren't I?\" Private Robert Stevens Doe said to everyone upon boarding.\n\n\"Relax, mate, once you get used to it you won't feel a thing!\" The man behind him replied, stepping onto the deck after him.\n\n\"Yeah, once you've thrown your guts out, you won't feel a thing.\" The man in front said with a smirk, setting his M1 carbine on a crate stacked on the deck. The line got a laugh, even from the Sergeant himself. It wasn't just a joke; Doe had never seen combat, and the tales of seasickness from his comrades didn't make him feel better.\n\n\"Hey, Private,\" the Sergeant said to the frowning Doe. \"Don't worry, this is just a routine mission. Most of the ships going there make it to the other side just fine; don't make the others feel uncomfortable.\" He tried to calm the newcomer down.\n\n\"Most, sir?\" he asked. \"This isn't some ordinary mission. In the middle of the ocean, if anything goes wrong, there's nowhere to run.\"\n\n\"Then we won't run, Private.\" The Sergeant had already calmed Doe down. \"Remember your training; it'll be there when you need it.\" Doe thought it strange; the Sergeant was kind to him, not the shouting he usually endured in training. Well, this wasn't training, after all."
 usindoflavor.2.a:0 "\"Hey, the sun's coming up, let's get some sleep.\""
 usindoflavor.3.t:0 "Day Ten"
 usindoflavor.3.d:0 "The ship had been in Indonesian waters for days. This nation of over 17,000 islands was more like a water maze that sailors avoided. Looking out over the sea, nothing was visible but barren islets. Night shrouded everything in darkness; gazing into the distance was like staring into an abyss on a moonless night.\n\n\"Do you sail these waters often?\" Doe asked the captain.\n\n\"Nah, not really. Haven't been here in about a year. If you don't think about the terrible things that happen on these islands, it's actually quite comfortable.\" The captain wrinkled his nose in distaste as he said the last words. Doe waved it off, ready to ask the next question.\n\n\"Oh, come on, kid,\" the captain cut in. \"Every time you do that, I think of my son.\"\n\nDoe snickered. \"You have a son, old man?\" The air went suddenly quiet. After a few seconds, the old man replied slowly: \"Yeah, yeah. He's about your age, maybe a bit rougher. Once you meet him, you two'll be inseparable.\"\n\n\"So where is your son?\" Doe noticed the captain's downcast expression and pressed on.\n\n\"God, stop teasing me, kid, I've got work to do.\" The captain was caught off guard.\n\n\"Sorry, sir, I didn't mean anything by it.\" Doe apologized.\n\n\"Hey, look at those lights,\" Doe tried to change the subject. \"What do you think is happening over there? People are hanging out, maybe drinking somewhere, who knows? I mean...\" The captain stopped listening to Doe's chatter as he realized what it was."
 usindoflavor.3.a:0 "\"That's a Japanese ship.\""
 usindoflavor.4.t:0 "All's Fair in War"
 usindoflavor.4.d:0 "\"Are these building materials?\" The commander asked the captain with a thick Japanese accent.\n\n\"Yes, of course, sir. Steel, concrete, everything is here.\" Captain Green maintained his composure, trying to sound assertive.\n\n\"Do you know you are in a war zone?\" The commander stared him down.\n\n\"Yes, sir... but...\" The resolute image the captain had built dissipated in the cold night wind. He had been proud of daring to defy the Japanese, and had longed to face them in combat. But now he was unarmed, his earlier courage evaporating, leaving only fear.\n\n\"Is everyone present, Captain?\" The Japanese commander pointed at the crew on deck, impatiently asking his next question. \"Yes, all the crew are here.\"\n\n\"I... want... inspect...\" The Marines below deck heard the Japanese commander's voice. They gripped their M1 carbines, staying quiet, trying not to make a sound lest the soldiers discover them hiding behind a row of containers. Doe looked at the others, then at the rifle in his hands. He managed to steady himself, controlling his nerves. Boots clinked on the metal deck; footsteps came one by one, growing louder as they approached.\n\n\"I see a pair of legs,\" Doe whispered. \"I'll take care of him.\" His comrades did not know whether this was bravery or folly. But it was too late; Doe had stepped out from cover, drawing his pistol.\n\nBANG. Splash.\n\n\"Doe, you motherfucker—\" the Sergeant shouted as a terrified Japanese soldier stood on the stairs, clutching an Arisaka Type 99 and running below deck, taking aim.\n\nBANG. Splash.\n\n\"Hey,\" the commander above roared toward the sound of the shots...\""
 usindoflavor.4.a:0 "\"Is everything cleared?\""
 usindoflavor.5.t:0 "What Remains?"
 usindoflavor.5.d:0 "Evening light fell on a cold, unnamed port in Papua. People worked day and night, unloading tons of secret war matériel bound for the front. The red sun set, and night gradually took over, but work on the dock had only just begun. In the center of the dock, two men strained to lift a box marked from top to bottom with warning labels — clearly explosives.\n\n\"Alright, almost there. Steady. If it drops, the whole port goes with it, understand?\" The first soldier, a young Australian, gasped.\n\nThe second soldier was an Indonesian. He was afraid to exhale, so he said nothing, merely nodding in response. Their legs grew heavier with every step, requiring more effort each time. Finally, they set the box down at its designated spot: a dusty warehouse piled with similar crates. The box would wait here in silence until it was transported to its next destination. \"Finally! That's the heaviest one yet. What's even in it?\"\n\n\"I'd guess a whole bunch of artillery shells. They'll be gone soon, all landing on those damn enemies' heads.\"\n\nThe Indonesian soldier smiled. \"I can only say the sooner the better. Maybe you'll even get to see combat yourself.\"\n\nThe Australian was silent for a moment. \"That must be something. My father fought here for years, you know — first in the last war, then this one. I'm sure he'd be proud of me continuing the fight. But I know the old man; he'd be a bit worried too...\"\n\n\"Anyway, I'm glad you came to help, Private... uh...\""
 usindoflavor.5.a:0 "\"Green. Ethan Green. You?\""
 usindoflavor.6.t:0 "The Dividing Line"
 usindoflavor.6.d:0 "Makassar was still alive and vibrant. But Thomas Martin was about to leave the city forever. He and the rest of his unit had booked a flight for today. The plane was being serviced, and he had an hour left here. But was there any need to leave the airport? He had already said goodbye to so many: the kind old landlady, his militia friends from Sulawesi, and above all, Indah.\n\nThomas decided to stay put. At this moment, he could think of no one but Indah. The thought of her filled him with sorrow. So Thomas left his seat and squeezed over to the table where Joe and Tyrone sat playing Texas Hold'em. The cards and chatter briefly distracted him, if only for a minute.\n\nAfter two hands, Thomas grew restless. He bet two-thirds of his chips on the last round, only to lose to a slightly higher straight. In the next hand, he went all-in on three of a kind with supreme confidence, but fate had other plans, and his remaining half of the chips went in too. In subsequent hands, Thomas bet less and less until only one chip remained. A wave of frustration washed over him; he threw his cards on the table and walked slowly back to his seat.\n\nYet he could not sit still. The exit was calling him. Outside the airport lay beautiful Makassar, the kind old landlady, his militia friends, and Indah. This city had been his life for years, a sanctuary for body and soul. As an American soldier, Thomas had fought alongside Indonesian freedom fighters against Japanese troops and Indonesian collaborators, repelling attack after attack. He had grown deeply attached to the land he had protected. He could recall every street near his house, the best restaurants by the coast, even the shop where he first met Indah. How could he give all this up?\n\nThomas walked toward the exit. Though the airport terminal was crowded and his comrades were there, he did not hesitate. This was the new life he craved; he would die before leaving."
 usindoflavor.6.a:0 "America can wait for its prodigal son to return."
 usindoflavor.7.t:0 "An American Patriot Finds His True Calling"
 usindoflavor.7.d:0 "Throughout his life, Edward Forster had been a loyal Democrat. He had given his all to America: even bearing the heavy history of defeat to the Axis in the World War, Forster remained steadfast in his support for the Democratic Party, enduring all manner of hardship. Even when the Democrats formed an alliance with the Republicans, Edward's resolve did not waver; he stood faithfully on the side that truly represented American conservatism. Yet recently, things seemed to have changed. The Democratic-Republican Coalition may have held noble visions, but it had erred repeatedly in recent foreign policy, especially over Indonesia: the US-backed rebels had been crushingly defeated by Sukarno's authoritarian regime, a cause for deep regret.\n\n\"I don't think the Coalition intends to surrender to the Japs, but their incompetence has brought shame on America. I mean, have you followed the Indonesia question? After such a crushing failure, how can we believe they are still capable of leading this nation?\"\n\nOn the television, a gentleman's passionate speech caught Edward's attention. His name was Crome... something? Oh, Cromelin, that's it — John Cromelin. Though the man was a Yippie, Edward had to admit he raised some thought-provoking points: the Coalition's incompetence was not just talk; in fact, this was the first time Edward had ever agreed so fully with a politician. Cromelin's straight talk was a far cry from the Coalition's smooth rhetoric. Though Edward did not fully agree with the States' Rights platform, perhaps, he thought, these people could restore America's dignity on the world stage."
 usindoflavor.7.a:0 "The National Vanguard grows stronger."

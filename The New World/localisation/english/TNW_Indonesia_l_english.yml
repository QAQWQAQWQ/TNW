 INS_The_Banteng_And_The_White_Crescent: "The Banteng and the White Crescent"
 INS_The_Banteng_And_The_White_Crescent_desc: "Despite what propaganda may claim, Japan's primary legacy in Indonesia was not granting independence, but creating a two-party system. This anomaly was born not from goodwill but from a desire to maintain stability, preserve the authority of the Islamic Supreme Council, and foster good relations between Sukarno and Hatta.\n\nThough Indonesian politicians gripe about the existing power structure, the Indonesian National Party and the Muslim People's Party are deeply entrenched in government, unshakable. It is a festering scar on the Japanese colonial system, a shadow those invaders who set foot on Indonesian soil could never shake."
 INS_A_Nation_Of_18000_Islands: "A Nation of 18,000 Islands"
 INS_A_Nation_Of_18000_Islands_desc: "Since the concept of Indonesia emerged in the early 20th century, its meaning has never been settled. In the nation's formative years, romantic intellectuals and idealists debated endlessly: should this new state be integrated into Greater Melayu, or exist as an independent entity? Or take some other form to unify this archipelago, so diverse in race, religion, and language, that had never formed a single political entity in history?\n\nWhen the Japanese arrived, the occupation's attempt to ease its rule by stoking Indonesian nationalism inadvertently froze the archipelago's political imagination. Indonesia began to be shaped as a single entity — a centralised state under one constitution, initially even conceived as ruled by a single state party. This civic-nationalist bond arose from the shared oppression and resistance of all people under Dutch colonial rule.\n\nSince independence in 1949, this young nation has struggled to reconcile the imposed unitary system with its plural society. The Japanese occupation concentrated administrative resources and economic development on Java; though corporate investment and resource extraction brought bloody prosperity, the rigid command economy has bred much discontent. To many, this has drifted far from the ideal blueprint laid down by the nation's founders half a century ago. The scales of history are tipping; the collision of old institutions and new currents will eventually reach a breaking point."
 INS_Three_Militaries_One_Destiny: "Three Militaries, One Destiny"
 INS_Three_Militaries_One_Destiny_desc: "Though the Indonesian Armed Forces were born from a merger of regional military groups, the chaotic merger was not the main reason for the forces' troubled development. The tangled, diverse founding histories, the convoluted military structure, the competing doctrines, and the entrenched officer corps are what have led to the current predicament.\n\nThe former Dutch colonial forces, the Japanese-established Pembela Tanah Air in Java, and the Malay irregulars in Sumatra form the backbone of today's Indonesian Armed Forces. United by a shared fate, they fight for a new tomorrow, for an Indonesia that may bask in the sun."

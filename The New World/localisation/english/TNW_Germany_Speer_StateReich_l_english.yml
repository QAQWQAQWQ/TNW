 SGR_reinforce_mauritius_reunion:0 "Reinforce Mauritius and Réunion"
 SGR_reinforce_mauritius_reunion_desc:0 "Recent conflicts in the region have threatened our control of the strategic outposts of Mauritius and Réunion, and it is time to act to salvage the situation. A series of naval exercises will be held in the southwestern Indian Ocean to reaffirm our presence. The navy will spread its wings like an eagle, casting its gaze across the open ocean."

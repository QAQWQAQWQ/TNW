 speerpropaganda.1.t:0 "A Letter from the Front"
 speerpropaganda.1.desc:0 "Wilhelm skipped excitedly into the museum - yes, a museum! It was the first time in his life he had traveled into the city without his parents. Not long before, his class had won a precious outing: two teachers leading twenty-five children, around nine years old, left Elmshorn for the great city of Hamburg, where they visited a newly opened 'Civil War Museum.'\n\nEvery visitor stood in awe at what they saw. Each gallery had its own theme: 'Urban Warfare' was lined with replicas of the trenches; 'Politics' displayed a wealth of materials analyzing the roots of the civil war; 'Espionage' recounted the intrigues and maneuvering between the warring factions to gain the upper hand. Walking down the corridor to the end, the gallery door read 'Letters from the Front,' and inside were hundreds of letters written by soldiers and militiamen to their loved ones during the civil war.\n\nWilhelm peered into one of the cases holding the letters and began to read quietly:\n\n'Dearest Kriemhild, I miss you so. I want to come back to you, back to our warm little home, but I cannot.\nHeydrich's hounds are nearly upon us. Do you remember the little restaurant we ate at together last holiday? The SS hanged half the village there, and the survivors had to dig their trenches. I swear on my life I will never let such a tragedy befall you.\nPerhaps they will attack tomorrow; I must be ready. My dear, I keep your photograph at my breast. If I fall tomorrow, I can leave this world quietly whispering your name. I love you.'\n\nBeside the case, a small plaque read: 'Eberhard Jänke, killed in action.'\n\nWhen Wilhelm finished reading those cold lines, grief shook him uncontrollably. He asked his teacher: 'Sir, who is Heydrich?'\n\nA bitter expression crossed the teacher's face, but he quickly composed himself and answered softly: 'Heydrich was a man who wanted to watch the world burn, no matter the cost. Wilhelm, tell me - is that what you want? Do you want to watch the world burn?'\n\n'No!' the child shouted. 'I want a happy world! I want to live happily with Mama and Papa!'\n\nThe teacher's smile returned, and he chuckled, patting the boy's head: 'Come on, we've been here long enough.' Then he raised his voice: 'Class! Time's up. I hope this visit stays with you for the rest of your lives!'"
 speerpropaganda.1.a:0 "'Yes, sir!'"
 speerpropaganda.2.t:0 "A Real Public Trial"
 speerpropaganda.2.desc:0 "The courtroom was packed - reporters, photographers, police, and ordinary citizens alike. They had gathered, jostling and murmuring, waiting for one thing. Herbert Otto Gille, former head of the SS Security Service during the civil war, was accused of the treason of ordering the massacre of hundreds. A week earlier, he had been arrested while trying to cross the Alsace-Burgundian border.\n\nThe heavy doors swung open, and the courtroom erupted as Gille entered the dock. Some families of victims could barely contain their fury and tried to breach the railing, but police quickly restrained them. Once order was restored, the trial began. Asked if he had anything to say, the defendant stood and shouted: 'I do not recognize this court! You have no right to try me!' He ranted, his voice rising: 'Do you see this? Disorder! Decadence! Obergruppenführer Heydrich was bringing peace to Germany! A new order, a perfect new order! He would cut out Germany's rot like a tumor! Look at you - you are all pus on Germany's perfect body!'\n\nA burst of laughter cut his tirade short. Before he could react, the prosecutor pressed play on a recording.\n\n'Thank you for sponsoring our cause.' Gille's haughty voice drifted out slowly. 'My wife will be so happy with this beautiful necklace, and I'll be able to drive a new car. Now, shall we discuss more important matters?'\n\n'Mr. Gille,' the prosecutor said, switching off the recording with a smile, 'if we are the cancer or tumor of Germany, then it seems you have even less to do with health...'\n\nSuddenly, laughter rippled through the crowd, quickly spreading as more people joined in, one after another, until the whole hall rang with merriment audible even in the street. That day, all the newspapers and television news led with the story of the red-faced SS man screaming for silence. But in the end, he was drowned out by laughter."
 speerpropaganda.2.a:0 "The SS was born in shame and dies in disgrace."
 speerpropaganda.3.t:0 "The New Future of German Culinary Fashion!"
 speerpropaganda.3.desc:0 "At first the screen showed nothing, but soon a traditional German housewife appeared in a plain kitchen. 'Oh dear, I have to cook for the whole family!' she cried. 'First I must prepare my tools, step by step.' She bent down to pick up a knife, while the camera focused on a row of neatly arranged fruits. 'I'll cut these fruits...' she grumbled, slicing at them. In a moment she irritably pulled the knife out - the fruit was untouched. 'Damn, uh, I'd better check if those plates are clean.'\n\nShe reached for two plates and held them up to the camera. She looked at them with disgust. 'How cracked!' she screamed, staring at the damaged plates. 'They were fine yesterday!'\n\nJust then a door creaked open nearby, and a deep male voice called out: 'Darling!' he said cheerfully. The woman paused, set down the plates, and walked over. The camera cut to the woman and her husband embracing, him carrying a large box. 'I noticed our silverware was looking a bit worn, so I went to the shops nearby. Guess what I found!'\n\n'Show me?' his wife asked, letting him set the box on the kitchen table. 'What's so special about it?' The husband chuckled and pointed to a small label on the back of the box. The camera zoomed in - it read 'Entirely made by the German people.' She raised an eyebrow. 'Oh? You're telling me these were all made by German workers?' He nodded. 'In German factories?' He nodded again. 'German workers paid what they deserve?' He nodded once more, and his wife smiled, spreading her arms toward the camera."
 speerpropaganda.3.a:0 "'That's right! I'll never buy anything made by enslaved hands again! Only by free and happy ones!'"
 speerpropaganda.4.t:0 "Root Out Evil"
 speerpropaganda.4.desc:0 "At first the screen showed only black-and-white static, then suddenly the image snapped into focus: a man in black armor, a pistol in his left hand and a banner raised in his right. He walked slowly forward, then planted the banner firmly into the dark earth. The flag unfurled in the wind, revealing the ancient emblem of Germany to all. He stepped back, eyeing the banner with interest, then interest curdled into hostility, and hostility into a savage grin. He raised his rifle and fired at the flag.\n\nWhen the gunshot faded, he stood still. The camera panned to where the flag had fallen; nothing remained but cold, deathly silence. Seconds later, another black flag slowly rose - bearing only a black sun: Burgundy.\n\nSoon the savage laughter echoed again, and the camera recoiled, showing only ruined city walls, smoke and destruction filling the frame. The image held for nearly ten seconds before cutting again.\n\nThe scene shifted to a clean, tidy German street. A sturdy young Wehrmacht soldier in uniform was playing with two children, combing their hair and joining in their games. Nearby, the children's parents watched with happy smiles. The narrator's voice returned:\n\n'We must avoid the mistakes of the past. Once, German streets ran with blood; now, songs of peace ring in every home, through every forest and over every peak. Tomorrow, we will have a Wehrmacht with greater moral purpose - no longer manipulated by self-serving interests, no longer wielding violence.' Finally, the soldier bade the children's parents a friendly farewell and turned away."
 speerpropaganda.4.a:0 "Duty well done - making the German military a more humane place."
 speerpropaganda.5.t:0 "Fatherland"
 speerpropaganda.5.desc:0 "'Dear, the program's starting! Bring the boys over!' Hilde Schwarz's voice called through the apartment, and the family soon gathered. Günter sat on the sofa beside his wife, while Hans and little Frank played on the floor in front of the television. After a moment, familiar music drifted from the set: 'Fatherland' had begun. 'Fatherland' was a major historical series designed to teach German audiences history through entertainment, praised in newspapers and on posters.\n\n'Good morning, viewers, and welcome to Fatherland!' the host smiled at the camera. 'To my right is the renowned German medieval scholar, director of the Germania Historical Monuments, Mr. Karl Mannitius; to my left is an expert on the Second World War, war veteran Mr. Friedrich Ziepfel.' The two guests nodded to the audience. 'Tonight, we explore Germany's acknowledged historical arch-nemesis: France.'\n\nThe program ran late into the night, but for the family it felt like only minutes. The reconstructed Battle of Bouvines, where France rejected the Holy Roman Emperor's legitimate claims as feudal overlord, captivated the children; Mannitius's research on France's alliance with heretics against Germany during the Thirty Years' War gave Günter much to think about; and when the discussion turned to Prussian Queen Louise's fearless defiance of Napoleon even in defeat, Hilde could not hold back her tears.\n\nLate into the night, Günter carried the sleeping little Frank back to the bedroom, but Hans tugged at his trousers. 'Papa,' Hans's sleepy voice reached Günter's ears, 'will things like that happen again? I mean, wars and all - will France come and take our land again?' Günter thought for a moment, then patted the boy's head: 'No, my boy, never. The Führer will protect us, just as he did during the civil war.' Soon after, the family fell asleep."
 speerpropaganda.5.a:0 "'Okay, Papa!'"
 speerpropaganda.6.t:0 "Evil from Within"
 speerpropaganda.6.desc:0 "The streets of Munich were still shrouded in darkness, though the horizon was beginning to pale, heralding a new day. But Eberhard Gottlieb was already preparing his ovens to bake bread. A good baker should have fresh, steaming bread ready before everyone else arrived, shouldn't he? At five forty-five, he walked through the famous historic streets as usual, nodding to a patrol of the Ordnungspolizei. But after the patrol passed, something caught his eye - across the street, an entire wall was plastered with posters, and he drew closer to examine them.\n\nThe posters were simple and striking: a tall column stood in the center, a golden eagle perched proudly atop it. But at the base of the column, a dozen small figures busied themselves digging it up with pickaxes - some in fine clothes, some plainly dressed, but all with bulging pockets of green American dollars, glancing nervously up at the eagle. At the bottom of the poster, in large Gothic script, read 'Defend Germany!'\n\nEberhard stared at the poster for several minutes, lost in thought. Was America really behind all of this? Had they caused the economic collapse? And the wars in Russia, and the civil war... it couldn't be. But just a few short years ago, they had still been Germany's enemies. Perhaps they could take whatever they wanted from a weakened Germany... As he walked to the bakery, these thoughts lingered in Eberhard's mind, refusing to fade."
 speerpropaganda.6.a:0 "Damn Yankees..."
 speerpropaganda.7.t:0 "It Starts With You!"
 speerpropaganda.7.desc:0 "The screen showed a group of young people in traditional Hitler Youth uniforms, hiking and doing physical training. Over the crackling noise, a voiceover began - low, slow, and gentle: 'Do you think your children lack direction, lack drive? Perhaps it stems from their laziness, squandering precious time on meaningless trifles. If you are one of those worried parents, we have a simple solution!'\n\nThe scene shifted again, and a boy not yet seventeen stood straight before the camera. Though still young, he spoke with a torrent of words: 'When I first joined the Hitler Youth, I hated everything here - so orderly, like being in a cage. But after a few months, things changed. I grew stronger,' he began a marathon run on screen. 'I grew passionate,' the scene shifted to a podium where he addressed his fellow Youth members. 'I made many friends.'\n\nThe image finally settled on him chatting with other comrades as the voiceover returned. 'That's right. As you can see, it can turn any young person around! We believe all Aryans should join the Hitler Youth; this precious experience can temper and elevate both body and mind.'"
 speerpropaganda.7.a:0 "'Remember: a strong Aryan means a strong Aryan nation!'"
 speerpropaganda.8.t:0 "Beat Swords into Plowshares"
 speerpropaganda.8.desc:0 "He was a loyal soldier of the Reich, his heart filled with nothing but courage and resolve. Gunfire erupted around him, his bloodied hand clutching a pistol while the other gripped a gleaming knife. Around him lay the bodies of his fallen comrades, and beyond them, the hated Bolshevik threat. A Bolshevik banner flew beside a building across the way, the hammer and sickle in its upper corner stained with blood and smoke. The flag seemed to mock him, and he glared back in fury.\n\nThe soldier spat in disgust toward the flag and walked slowly forward. He raised the knife high, aiming at the banner. The camera drew closer. When he reached the Bolshevik foul emblem, he swung his arm down, the knife slashing toward the flag, ready to tear it to shreds - when the image cut off and slowly faded.\n\nThe image returned: a hoe driven deep into the soil. The camera pulled back as an older man toiled under the sun. The narrator's voice returned: 'After retiring from the Wehrmacht, your service never truly ends,' he intoned. 'Naturally, they are the Reich's most precious treasure. These energetic, wise veterans possess true loyalty - they are the very embodiment of the Reich's will. For those loyal and hardworking, they represent hope.'\n\nThe scene shifted to another elderly man, who walked respectfully to a cottage door, knocked softly, and handed the master a letter. 'New industries are developing rapidly, and new opportunities arise with them. If you are an experienced veteran of the armed forces, you will enjoy special hiring policies in the civil service. We will never forget your service and sacrifice; rewarding our heroes is our duty and responsibility.'"
 speerpropaganda.8.a:0 "'Never forgotten! The Reich is the people, and it shall serve the people!'"

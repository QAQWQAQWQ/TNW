 SGR_statereich_speeches:0 "Give Speeches"
 SGR_statereich_speeches_desc:0 "Though many consider the student body to be the backbone of Albert Speer's supporters, the Nazi Party remains the Sword of Damocles hanging over his head. Yet, with his personal charisma and political acumen, he can project a more appealing image within the party to placate its more moderate members."
 SGR_statereich_promises_light:0 "Symbolic Political Promises"
 SGR_statereich_promises_light_desc:0 "We must not forget those who support our regime - the students, the intellectuals, and everyone who fought bravely and sacrificed for a better future. We should make promises of symbolic reforms to soothe their sentiments."
 SGR_statereich_promises_huge:0 "Broad Political Promises"
 SGR_statereich_promises_huge_desc:0 "We need to consolidate the regime and placate the people. Whatever we say, whatever we do, whatever we promise - as long as it attracts the people's favor and turns them toward us rather than our enemies, we will carry it through. Reactionaries and dissidents may question the 'feasibility' of our plans - well, we will simply do as we please."
 SGR_statereich_charge_treason:0 "Charge §jReactionaries§! with §RTreason§!"
 SGR_statereich_charge_treason_desc:0 "We may have established our rule in Germany, but that does not mean the opposition has vanished - far from it. For too long, the reactionaries have been a thorn in our side, obstructing reform at every turn. They would do well to fall in line, or we shall teach them who truly rules Germany now. Some may find this too aggressive, but it is necessary for Germany's long-term good."
 SGR_statereich_shift_econ_liberal:0 "Shift the Economy toward §MLiberalism§!"
 SGR_statereich_shift_econ_conservative:0 "Shift the Economy toward §gConservatism§!"
 SGR_StateReich_open_pakt:0 "§YShow Pakt der Arbeit Decisions§!"
 SGR_StateReich_open_pakt_desc:0 "Click to show decisions related to rebuilding the Pakt der Arbeit."
 SGR_StateReich_close_pakt:0 "§YHide Pakt der Arbeit Decisions§!"
 SGR_StateReich_close_pakt_desc:0 "Click to hide decisions related to rebuilding the Pakt der Arbeit."
 SGR_pakt_open:0 "§YShow Pakt der Arbeit Decisions§!"
 SGR_Regime_Collapse_Impeding:0 "§xThe regime is about to collapse!§!"
 SGR_Regime_Collapse_Impeding_desc:0 "The Führer's regime is rapidly losing support - we must act decisively to restore some measure of stability! The reactionaries have set their sights on the government - hurry!"
 SGR_Repatriation_Debug:0 "Initiate Repatriation - Debug"
 SGR_Repatriation_Debug_desc:0 "Placeholder text"
 SGR_South_African_War:0 "South African War"
 SGR_South_African_War_desc:0 "War has erupted in the dark heart of Africa, and it is time to help our commissioners win the war. We can aid Schenck, Müller, and Schütthig, striking hard against South Africa and the powers backing them. We will send the necessary troops to strengthen their war-fighting capacity. According to advisors, in less than a year we can establish a loyal Boer puppet state under Albert Herzog."
 SGR_South_African_War_Withdraw:0 "Withdraw from the South African War"
 SGR_South_African_War_Withdraw_desc:0 "The situation in the South African War is uncertain, and Speer and his advisors have decided to withdraw all troops from this bloody conflict, leaving the rest to God's judgment."
 SGR_Ukraine_Question:0 "Negotiate with Ukraine"
 SGR_Ukraine_Question_desc:0 "Compared to Ostland, the situation in Ukraine is relatively stable. But we must resolve the Ukrainian question quickly. As part of foreign policy reform, changing Ukraine's status as the 'breadbasket of Europe' is urgent."
 SGR_Netherlands_Question:0 "The Dutch Question"
 SGR_Netherlands_Question_desc:0 "As all of Europe seeks refuge amid chaos, our Germanic brothers in the Netherlands have broken away from the Reich's defense system, unexpectedly declaring full independence. We need to bring the Dutch back into the Pakt der Arbeit as soon as possible."
 SGR_Denmark_Question:0 "The Danish Situation"
 SGR_Denmark_Question_desc:0 "Germanization of the northern protectorate has continued for 20 years. Denmark's future is bound to the Reich, and we must handle the volatile political situation within Denmark to bring it back into the fold of the Pakt der Arbeit."
 SGR_Bohemia_Question:0 "Return to the German Homeland, Protectorate of Bohemia and Moravia"
 SGR_Bohemia_Question_desc:0 "For twenty years, the political and economic situation of the German Reich has made Bohemia and Moravia a steadfastly loyal protectorate. Yet now, civil war has brought winds of change across Europe, and it is time to reconsider its status."
 SGR_Issue_of_Slovakia:0 "The Slovak Question"
 SGR_Issue_of_Slovakia_desc:0 "After annexing Bohemia and Moravia, the Greater German Reich sets its sights on Slovakia. Isolated and without support, they have no choice but to return to the Pakt der Arbeit; all we need do is send an ultimatum. Their choices are simple: join, or watch us crush their feeble army and march into Bratislava."
 SGR_Moskowien_Question:0 "In the Russian Heartland"
 SGR_Moskowien_Question_desc:0 "Our gaze gradually turns to the distant east, toward the plains of blood and snow. The disappearance of former commissioner Siegfried Kasche has completely reshaped the political landscape of Moscow. To ensure the Reich's prosperity, we must find a way to regain control of Moskowien."
 SGR_Take_Moskowien:0 "Prepare for Reconquest"
 SGR_Take_Moskowien_desc:0 "Reconquering the Moskowien Generalbezirk will be a brutal campaign. We advance with difficulty across a land where the fires of Europe have never died. Fortunately, the country is shattered, and its people lack the will to fight. Few partisans remain; what stands in our way are mostly cobbled-together units. Still, we must be cautious and not underestimate the difficulty of this campaign."
 SGR_Moskowien_Setup:0 "Reorganize Moskowien"
 SGR_Moskowien_Setup_desc:0 "With the vast territories of Moskowien finally back under our control, we must quickly reorganize the local administration. Alexis von Roenne will be appointed as administrator. Before we consider returning Moskowien to civilian rule, a military administration will be imposed. The locals will not like it, but they have no choice; it is better than the hollow promises of other fragmented Russian regimes."
 GER_moskowien_conquered_trigger_tt:0 "Moskowien no longer exists."
 SGR_Moskowien_Setup_tt:0 "§YMoskowien will be placed under new administration.§!"
 SGR_Kaukasien_Question:0 "The Caucasus Question"
 SGR_Kaukasien_Question_desc:0 "In the hazy chaos of the Caucasus, the Reich's most mysterious and isolated commissionerate stands. As a vital oil-producing region, we must ensure its stability so it can continue serving the interests of the Reich."
 SGR_Polish_Question:0 "The Stubborn Poles"
 SGR_Polish_Question_desc:0 "History has shown that no matter how many years pass, the Polish question remains a thorn in Germany's side. With victory in the civil war finally secured, we must turn our eyes east and settle this thornbush once and for all."
 SGR_Norwegian_Question:0 "Northern Fortress"
 SGR_Norwegian_Question_desc:0 "With the outbreak of civil war, Josef Terboven dissolved our northern commissionerate and led all its garrison troops back to Germany, sending shockwaves through the nation. Now we need to focus on this figure who claims to be Norway's new national leader; we should prepare early for Norway's future."
 SGR_Ostland_Question:0 "The Model Colony"
 SGR_Ostland_Question_desc:0 "The Ostland Generalbezirk was once hailed as the Reich's 'model colony,' a fortress of loyalty and strength, but now it lies buried in war and chaos. To secure territorial stability, we must turn our attention to Ostland and deal with it immediately."
 GER_Bohemia_Reconstruction_SGR_A:0 "Bohemian Reconstruction"
 GER_Bohemia_Reconstruction_SGR_B:0 "Bohemian Reconstruction"
 SGR_place_nukes_mauritius_reunion:0 "Deploy Nuclear Weapons in Mauritius and Réunion"
 SGR_place_nukes_mauritius_reunion_desc:0 "Germany's sword cannot point only at Europe; that is far from enough to threaten our adversaries. No, we must expand our nuclear strike range to threaten not only our opponents' core territories but also their surrounding regions. Mauritius and Réunion are the first step in ensuring our enemies are within nuclear striking distance."
 SGR_allow_reunion_nukes:0 "We have reclaimed Mauritius and Réunion."

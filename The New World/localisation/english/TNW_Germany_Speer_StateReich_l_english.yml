 TNO_SGR_Decisions_GUI_regime_lean_text:0 "The §Yregime§! currently leans..."
 TNO_SGR_Decisions_GUI_desc_text:0 "§YRegime Stability§!: £GFX_regime_stability_texticon [?SGRRegimeStability|W%]\n\n£GFX_regime_stability_texticon §YRegime Stability§! is critical to the long-term survival of the §OFührer§!'s regime. It is affected by §gcontroversial decisions§!, such as taking actions contrary to prevailing §Bsocial attitudes§! when they lean §Rconservative§! or §Greformist§!. Regime Stability also converges toward £GFX_stability_texticon §WNational Stability§! and is influenced by that value. If £GFX_regime_stability_texticon §YRegime Stability§! falls below §Y30%§!, the §Oregime§! is likely to collapse!\n\n§BSocial Outlook§!: £social_outlook_texticon [getLeaningPivot]([?SGRSocietyLevel|+2]/[getSGRLimits])\n\n§BSocial Outlook§! is [getSGROutlook], changing at a rate of [?SGRSocietyTick|+]/§Y14 days§!\n\n£social_outlook_texticon §BSocial Outlook§! measures the worldview of the §gGerman people§!, shaped by §Qeconomic reforms§!, §Oregime lean§!, and other factors, and changes over time. If the §Ogovernment§! leans the opposite way, £GFX_regime_stability_texticon §YRegime Stability§! will begin to decline!\n\n£SGR_econ_policy §gEconomic Policy§!: [getSGREconomyLean] ([?SGR_econ_lib|M0] - [?SGR_econ_con|s0])\n\n£SGR_econ_policy §gEconomic Policy§! measures our current economic stance based on our §Bactions§! during economic §Greforms§!. Maintaining a balanced or [getSGROpposingEconomy2] §geconomic policy§! will ensure continued §Ggrowth§!, while a §Rchaotic§! §geconomic policy§! will negatively impact our §Rnational debt§!, §Vinflation§!, and §KGDP growth rate§!."
 SGR_authdemvsfash_ticker_desc:0 "The §Yregime needle§! currently sits in the [getLeaningPivot] zone, currently trending [getSGRAlignmentTrend] at a rate of [?alignmentTicker|+]/§Ymonth§!.\n\n£social_outlook_texticon §BSocial Outlook§! is determined by the §Yregime lean§! and is displayed as a speedometer."

 BRG_ai_collapse.101.a:0 "As tyrants always meet their end - one way or another."
 BRG_new_era_surveillance:0 "[Root.GetBRGFocusNew_Era_Surveillance]"
 BRG_new_era_surveillance_text:0 "A New Era Surveillance"
 BRG_new_era_surveillance_desc:0 "The modern age has brought about great revolutions in the technological world, thanks, in part, to the scientific advancements of the Vaterland, which have brought the world into a new era of connection and research. One of the greatest leaps in technological possibility has come through the new reaches in photographic and videographic technologies, as the rapid happenings of the modern age can now all be captured, watched, and monitored. Although the decadent capitalists of the West will claim to use such technologies for the gross "entertainment" they fetishize, and the Slav shall bear no advanced possession of this technology for decades in their broken state, it is the perfect opportunity for us to apply such technologies to monitor the possibility of corruption within our state. Aryans are the supreme masters of this world, and we shall ensure that all citizens understand that it is the Aryan state that shall watch over and protect them, at all costs."

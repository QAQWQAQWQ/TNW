 SWE_The_Anti_Marriage_Rape_Act_of_1965:0 " §L1965§!£GFX_SWE_woman_rights_laws §hAnti-Marital Rape Act§!"
 SWE_The_Anti_Marriage_Rape_Act_of_1965_desc:0 "The legal recognition of and social attitudes toward §hmarital rape§! evolved over a §slong and winding§! process. For a long historical period, §Zrape§! was considered a §Xserious crime§!, but its definition excluded §pmarriage§!. In §L1864§!, Swedish law criminalized wife abuse, but §hmarital rape§! went unprosecuted, rooted in the widespread belief that a §Shusband§! had rights over his §Pwife's§! body and that sexual coercion within marriage was not considered an assault. This notion was deeply embedded in the §Asocial structure§! that treated §Pwomen§! as appendages of §Smen§!, and §Zrape§! was more often understood at the time as an offense against a man's '§Jhonor§!' or '§Qproperty§!.'\n\nThe §Owomen's liberation movement§! that emerged in the late §L19th century§! began to challenge this logic at its roots. §PWomen§! demanded §Keconomic independence§!, §jeducational rights§!, and the §Uright to work§!, laying the basis for independent §&legal personality§!. The §rFirst World War§! further accelerated this process in a §mconcrete way§!, as §Pwomen§! participated widely in §Asocial production§!, raising their §ustatus§! and §,self-consciousness§!. §LInto the 20th century§!, calls grew to reform the §Zrape laws§! to extend protection to §Imarried women§!, triggering fierce debate within the §iRiksdag§!. §AOpponents§! feared the law would be abused as a tool for wives to blackmail or harass husbands; especially given that §oabortion was illegal§! at the time, they worried §Pwomen§! would use §Zrape§! as grounds to obtain §oabortions§!. §nSupporters§! insisted that a woman's §Esexual autonomy§! and §hright to bodily self-determination§! must not be stripped away by §jmarital status§!, and that §Imarried women§! should enjoy the same legal protection as §Uunmarried women§!.\n\nJudicial practice also reflected the difficulty of change. As late as the §L1950s§!, §Zrape cases§! were rare in court; stringent evidence requirements and social stigmatization led many §Pvictims§! to remain silent. In §L1965§!, though §iSwedish§! law formally brought marital sex within the potential scope of rape, in practice an existing intimate relationship was often treated as a major mitigating factor, and §Zrape§! remained largely defined as a violent crime against strangers. The real turning point came in §L1984§!, when the law was revised so that judges no longer took the relationship between the §Pvictim§! and the §Qperpetrator§! into account. Only then did §hmarital rape§! begin to be treated as an §Xindependent crime§! in law and in fact, marking a §Vcritical step§! forward for §Asociety§! in both outlook and judicial practice."
 SWE_The_Parental_Leave_System_in_1974:0 " §L1974§!£GFX_SWE_medical §<Parental Leave System§!"
 SWE_The_Parental_Leave_System_in_1974_desc:0 "Under the §<Parental Leave Act§!, employees are entitled to full §<parental leave§! rights regardless of whether they receive §Eparental benefits§!, and the §lleave§! may last until the §Schild§! §fturns eighteen months§!. Additionally, while parents receive §Eparental benefits§! or §htransitional parental benefits§! from social insurance, they are likewise legally entitled to §mleave§!.\n\nUntil the §Schild§! reaches §jeight years§! or §Ucompletes first grade§!, parents may apply to §ureduce their normal working hours§! by up to §.one quarter§!.\n\nUnder the §<Leave Regulation§!, employees are also generally entitled to partial leave to care for a §Schild§!, a right extending through the school year in which the §Schild§! §nturns twelve§!.\n\nRegarding §<parental leave§!, the act allows employees to split §<parental leave§! (whether or not accompanied by §Ebenefits§!) into up to §*three periods§!, with no more than three leave periods per calendar year. Further splitting of the §lparental leave§! is possible only with the employer's consent. Note that this splitting provision does not apply to leave taken with §htransitional parental benefits§! or to §dparental education leave§!."
 SWE_The_1975_New_Abortion_Law:0 " §L1975§!£GFX_SWE_christ_laws §oNew Abortion Law§!"
 SWE_The_1975_New_Abortion_Law_desc:0 "Article 1: If a §Cwoman§! requests to terminate a pregnancy, an §oabortion§! may be performed before the end of the §L18th week§! of pregnancy, and it cannot be presumed that the §Cwoman's§! condition poses a §Xserious danger§! to her §Slife§! or §dhealth§!.\n\n§EPregnancy§! and §oabortion§! are far from black-and-white matters, often tangled in complex §Oemotional currents§!. An §Eunplanned pregnancy§! may bring a §slife crisis§!, but choosing to terminate it can also be a way out of hardship. Many people are plunged into §.grief§! because reality fell short of what they hoped.\n\n§oAbortion§! has always been a deeply controversial issue, and §Qthe debate§! repeatedly surges in §Asociety§!. In the §fprofessional field§!, one of the §Kfocal points§! hotly discussed by §jmidwives§!, §<doctors§!, and §hgynecologists§! is the §oregister for abortion care quality§!. Currently, while the §&National Board of Health and Welfare§! collects statistics, it is limited to §lage-group§! data and cannot link individual cases to specific clinics. Voices opposing personal registration stress the need to protect the identity and privacy of §pwomen§! undergoing §oabortions§!, preventing any form of disclosure.\n\nIn §iSweden§!, the §oabortion law§! rests on a §Ufirm conviction§!: that §pwomen§! know best how to govern their own §ubodies§! and §mlives§!, and need not justify their choices. The main reason women choose to terminate pregnancy is often a deep desire for §*family planning§!. In this context, §oabortion§! has become one of the most common medical procedures."
 SWE_The_1980_Law_on_Succession_to_the_Throne:0 " §L1980§!£GFX_SWE_Kings_laws §QArticle 8 of the Act of Succession§!"
 SWE_The_1980_Law_on_Succession_to_the_Throne_desc:0 "Without the joint approval of the §fKing§! and the §iRiksdag§!, no §QSwedish Royal House§! §Oprince§! or §Uprincess§! may, by §Jelection§!, §oinheritance§!, or §Pmarriage§! in §Xany way§!, take up a §Eregency position§! in a §hforeign country§!. Otherwise, the §.individual§! and their §,descendants§! automatically lose the §aright of succession to the Swedish throne§!.\n\n§uThis constitutional provision§! replaced the earlier §aline of succession§!, originally drafted to regulate the §lorder of succession§! after §sJean Baptiste Bernadotte§! was elected §mCrown Prince of Sweden§!, and establishing that §arights of succession§! began with himself. However, the §L1980§! §damendment§! changed this starting point to the §freigning King§! §hCarl XVI Gustaf§!, excluding all other branches of the §sBernadotte family§! - even if their ancestors had stood in the then-§lline of succession§!. This revision was intended to prevent the descendants of §ECharles XIV John§!, previously §oexcluded§!, from regaining succession rights. Since the §fKing's§! §Ochildren§! were minors at the time, to preserve the practical role of the §fKing's§! uncle §IPrince Bertil§! as an §Aadult heir§!, a §,transitional rule§! was specifically created allowing him to inherit the §fthrone§! after the §Qdirect descendants§! of §hCarl XVI Gustaf§!. This transitional clause lapsed automatically upon the §L1997§! death of §IPrince Bertil§!. \n\nBeyond the order of succession, §Qthe Act of Succession§! also imposes §<clear constraints§! on the royal family's §mreligious faith§!, §Pmarriage§!, and prohibition from holding §Eregencies§! in §hforeign countries§!.\n\nUnder the unamended §dAugsburg Confession§! and the §L1593§! §sUppsala Synod§! decisions, all §Qroyal family members§! must adhere to §.Evangelical Lutheranism§!, or lose the §aright of succession§!. This obligation applies to the §fmonarch§!, §Oprinces§!, and §Uprincesses§!.\n\nThe §Pmarriage clause§! provides that a §Oprince§! or §Uprincess§! who §Pmarries§! must obtain the approval of both the §fmonarch§! and the §igovernment§!, or lose §arights of succession§!. Though they may choose their spouse freely, failure to obtain this approval results in the §Zforfeiture§! of §arights of succession§!. The §fmonarch§! himself is §Xnot bound by this clause§!.\n\nFurthermore, any §Qroyal family member§! who, without the consent of the §fmonarch§! and the §iRiksdag§!, becomes §rhead of state of a foreign country§! through §oinheritance§!, §Pmarriage§!, or §Jelection§!, shall permanently and forfeit the §aright of succession to the Swedish throne§! for himself and his descendants."

 ##ideas##
 SWE_European_Lighthouse: "European Lighthouse"
 SWE_European_Lighthouse_desc: "Sixty years ago, the iron eagle of Germania had nearly conquered the entire continent, and Europe trembled in its shadow. Sweden, spared the fires of war, could not escape that pinprick of fear, its gaze fixed ever southward. For this reason, the nation guarded its most complete and unspoiled form of democracy. As the welfare state matured and the economy advanced steadily, Sweden entered its own golden age. Like a lighthouse, it stood tall on Europe's northern marches, its single light dispelling the long shadows cast by the Steel Pact.\n\nYet as time passed, the abundant welfare state gradually revealed its heavy price. The fiscal burden deepened, inequality widened, and the old lighthouse dimmed. Beneath the northern sky, the old shadows had never truly lifted.\n\nCrows cry in sorrow, faint dawn breaks in the north."
 SWE_Peoples_Home_1: "People's Home - Deep in Debt"
 SWE_Peoples_Home_1_desc: "Vast sums poured endlessly into the ocean of social spending like unceasing rivers. In policy after policy, they gradually dissolved into heavy shackles upon the state and its enterprises. Yes, this was the 'People's Home' the Social Democrats had so painstakingly built: from every Swede's birth to their last breath, their whole life unfolded under the state's protection. Every Swede felt genuine happiness and pride in this 'People's Home,' even now that it stood deep in debt."
 SWE_The_impact_of_European_integrated_economy: "The Impact of European Integrated Economy"
 SWE_The_impact_of_European_integrated_economy_desc: "After the long curtain of the Erlander era fell, Sweden's golden years came to an end. Economic growth stagnated, and beneath the calm surface, social fissures deepened. At the same time, the tide of pan-European economic integration swept in, posing a serious challenge to the unique position of this Nordic neutral.\n\nThough Stockholm repeatedly reaffirmed its absolute neutrality, the Steel Pact's influence seeped in everywhere. Caught in the cracks, the posture of economic independence grew harder to maintain, and Sweden walked a tightening wire above an indistinct future."

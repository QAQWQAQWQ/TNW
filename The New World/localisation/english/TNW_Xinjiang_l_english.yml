 POLITICS_ZHANG_ZHIZHONG_DESC:0 "Zhang Zhizhong was born in Anhui Province in 1890, and like many of his generation, he was caught up in the warlord conflicts of his youth. But unlike his peers, Zhang's fight has not yet come to an end. Zhang attended the Baoding Military Academy, and after graduating joined the National Revolutionary Army under the Kuomintang. He fought bravely and earned great merit in the Northern Expedition; during the war against Japan, Zhang put aside political differences and fought alongside his 400 million compatriots against the Japanese invasion.

 After the war began, the Japanese offensive was efficient and brutal. The Chinese army fought to the death, but still could not withstand the Japanese forces with their overwhelming advantage. Zhang led his troops in a desperate defense of Hunan, fighting the Japanese for months. But one wrong decision undid all the sacrifices of his men: Zhang somehow received word that the Japanese were about to launch a full-scale assault on Changsha, and he ordered his forces to burn the city to the ground before the Japanese attack, leaving nothing the enemy could use. In reality, this was a complete misjudgment by Zhang, and his order resulted in a world-famous tragedy: the Great Fire of Changsha. The fire took countless innocent lives, the forces defending Hunan suffered severe losses, and Hunan eventually fell. But Zhang did not give up resistance. He led his troops to Xinjiang, and announced that he would continue to resist the invaders here.

 Xinjiang is a barren land with a harsh climate, and Zhang, who fled here, felt this deeply. Zhang's forces were not the first to arrive in Xinjiang; though they were the strongest, they were not welcome here. To maintain control over Xinjiang, Zhang had to maintain a delicate balance between the Kuomintang, the Communists, and the local ethnic minorities. Day after day, year after year, Zhang patiently built up this frontier region. The old general's only hope is to see his motherland cast off its shackles and once again embrace freedom and revival."

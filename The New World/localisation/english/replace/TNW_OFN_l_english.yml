l_english:
 OFN_CAR_african_crisis:0 "Central Africa has collapsed!"
 OFN.1.t:0 "The South Africa Summit"
 OFN.1.desc:0 "The day has finally arrived that the Americans call the 'South Africa Policing Operation Summit.' The American delegation delivered an inspiring speech on the necessity of OFN unity on the battlefield, lest the organization evolve into something fragmented. The speaker noted that the Pact of Unity lacked cooperation - a fatal weakness for the Germans - while the Japanese could never organize multinational operations the way the OFN does. The American delegation also reminded attendees that indifference to South Africa's affairs would only bring threats to OFN members.\n\nThough Deputy Secretary Stikkete and some exiled government representatives led applause for McNamara's speech, with Canadian and Australian delegates following suit, others seemed hesitant.\n\nDelegates from the West Indies, Guyana, and Iceland made no secret of their opposition to war and reluctance to intervene. Iceland's first president after General Malloy Jr.'s death, Sigurbjornsson, led the opposition - known for his fierce nationalist views, he pointed out that American 'puppet states' had never been willing to risk themselves for America, and called for no blood to be spilled for the United States. His speech drew scattered applause from other delegations.\n\nThe vote will decide the final course of action, and many hold their breath: whether the OFN is an alliance of steel or merely a scrap of paper will be revealed in this moment."
 OFN.1.a:0 "For victory!"
 OFN.1.b:0 "I will not send our boys to bleed for Africa!"
 OFN.3.t:0 "Reinforcement Staff Arrives in Africa"
 OFN.3.desc:0 "War rages in the distant south. General H. Haws of the United States has ordered his subordinates to assist in establishing hospitals and managing logistics. Meanwhile, some volunteers worry about the local climate, fearing they cannot endure the heat. Nonetheless, the first contingent has set sail from Reykjavik, bound for Cape Town."
 OFN.3.a:0 "It will certainly be quite hot!"
 OFN.8.t:0 "We Must Send Troops to Africa"
 OFN.8.desc:0 "The war in South Africa burns, and the Americans have asked us to mobilize troops to defend the freedom and democracy of the South African people. Given our situation, this is not a good time to send troops to defend peace. But a request is a request, and we realize we have no choice. So today, we have sent telegrams everywhere to recruit volunteers."
 OFN.8.a:0 "Very well, proceed."
 OFN.9.t:0 "Canada Must Join the Operation!"
 OFN.9.desc:0 "South Africa is our partner in the former British Commonwealth, now being invaded by the Nazis! Even though the journey to South Africa is long, seeing our allies crying out to us under evil tyranny, we must do everything in our power to aid them!"
 OFN.9.a:0 "We shall do our duty!"
 OFN.10.t:0 "The Church Supports the War"
 OFN.10.desc:0 "Last week, several churches encouraged their congregations to enlist. They emphasized the sacrilegious acts of the Nazis, stating that the Christian faithful of Cape Town must be saved. South Africa is now the lone outpost of democracy in Africa, and in God's name, Christians will defend freedom and root out evil."
 OFN.10.a:0 "God bless our soldiers."
 OFN.11.t:0 ""
 OFN.11.desc:0 ""
 OFN.11.a:0 ""
 OFN.13.t:0 "The Spirit of '76"
 OFN.13.desc:0 "Nixon boarded Air Force One, craning his neck in the president's private compartment to look at today's briefing on the desk. As the president scanned the documents, scribbling in a yellow notepad on his lap, only the roar of engines filled the air. Near the end, Nixon stopped, eyes filled with curiosity. He read the final paragraph word by word, then picked up the phone beside him.\n\nThe CIA officer accompanying the president quietly entered, only to be confronted by Nixon, who questioned him with an almost probing intensity. 'What is this?' The officer looked at the president, then at the briefing on the desk. Was he being played?\n\n'...It should be your briefing for today, Mr. President.' The officer answered, puzzled.\n\n'I know it's a briefing, dammit, I mean what the hell does this thing say.' Nixon shouted, thrusting it at the officer's face, then stepped forward pointing at the final paragraph. The officer leaned forward, squinting. Finally he understood why the president was so enraged, and composed himself.\n\n'We believe the surge in public support caused by intervening in the South African war is merely a social phenomenon,' the officer said clearly, 'and such support can instantly reverse the frontline situation. Recent data shows our military performance correlates directly with public support.' Nixon merely nodded.\n\n'We also found that while many Americans believe this war is just, that doesn't mean they will feel the same in future conflicts.' The officer paused, hesitating whether to continue. 'I suggest you review the West Africa situation memo for details, Mr. President.'"
 OFN.13.a:0 "'Understood, keep me updated on the latest developments.'"
 OFN.13.tt:0 "§YHome Front§! §Fmechanic has been §Gunlocked§!§!."
 OFN.14.t:0 "Reports of Boer Atrocities Make Headlines"
 OFN.14.desc:0 "Desmond, a working construction worker living in New York, was heading to the grocery store to buy the latest New York Times and catch up on current events. He had discussed the South African war with colleagues for a long time that day, and could not stop thinking about it even after work.\n\nDesmond picked up a paper from the grocery store counter and began reading. At a glance, today's headline blared in bold: 'South African War Continues.' Since the war between the Reichskommissariat and the Republic began, everyone around Desmond knew he was indifferent to it. After all, what had the last American war abroad to do with this one? Desmond continued reading, scanning an article about the German offensive deep into South Africa, wondering why he should pay taxes for such a meaningless war. But as he reached the end, a new bold headline appeared: 'Boer massacre claims hundreds of lives.'\n\nDesmond was stunned, staring at the article in disbelief. Backed by Germany, the Boers had brutally raped, enslaved, and killed women and children; at least 500 had died at the hands of these invaders, and the war had only just begun. In that moment, Desmond finally understood the scale of this war and the necessity of American intervention: innocent, unarmed people's lives were in danger. Desmond imagined what would happen if his wife and children became victims of Boer atrocities. As he handed coins to the cashier, he began to wonder if he should support the war."
 OFN.14.a:0 "At the very least, we must try."
 OFN.15.t:0 "Dispatch Trucks to Transport Supplies"
 OFN.15.desc:0 "The African continent is vast, and the Reichskommissariat's cities are still a thousand miles away; we must find a solution."
 OFN.15.a:0 ""
 OFN.16.t:0 "Help Our Partners Cross the Sea"
 OFN.16.desc:0 "A telegram arrived from America last night, asking us to strengthen our operations in Africa and send more soldiers. Some of the more enlightened members of our parliament responded that our economic situation is not suited for such operations."
 OFN.16.a:0 "Of course, sir."
 OFN.16.b:0 "We cannot afford such an operation."
 OFN.17.t:0 "Do What We Must"
 OFN.17.desc:0 "The South African war broke out on the distant African continent, but we must step forward. The western sea lanes to America are vital to our national security. No one can guarantee the Pacific will always be peaceful, and we must go to Africa to secure the western shipping lanes."
 OFN.17.a:0 "Send supplies already!"
 OFN.18.t:0 ">WAR PARTY< Receives American Funding"
 OFN.18.desc:0 "The CIA has provided us with funds for more propaganda, which we can use for several goals, including building support for the war and raising our profile."
 OFN.18.a:0 "Thanks, America!"
 OFN.19.t:0 "Factory Owners Want to Sell Us Their Plant"
 OFN.19.desc:0 "A steel magnate visited the government, offering to sell us a factory cheaply - one that will soon be obsolete, and he has other projects to pursue. You could see this as his support for the war. If we accept, we will need to allocate funds to update the plant's equipment and production lines, but our soldiers in Africa need more gear."
 OFN.19.a:0 "Thanks, but no thanks."
 OFN.19.b:0 "Yes, fine."
 OFN.membership.1.t:0 "[?USA.OFN_candidate.GetName] wishes to join the Organization of Free Nations"
 OFN.membership.1.desc:0 "Following negotiations, [?USA.OFN_candidate.GetName] has formally requested to join the OFN. The United States has accepted the application, and it now falls to us to vote on approval."
 OFN.membership.1.desc_brittany_delaporte:0 "[?USA.OFN_candidate.GetName] has applied to the United States, requesting OFN membership. Per protocol, all member states must vote on this question: should [?USA.OFN_candidate.GetName] be admitted as an OFN member?"
 OFN.membership.1.desc_brittany_mordrel:0 "The Bretons have expressed their desire to join our bloc. The country is strategically located at the northwestern corner of the European continent, providing a convenient haven for naval forces in the Atlantic. Burgundy is their greatest threat, which is undoubtedly why they seek our protection."
 OFN.membership.1.a:0 "Vote in favor."
 OFN.membership.1.b:0 "Remain neutral for now, and extract some concessions from the Americans."
 OFN.membership.1.c:0 "Oppose [?USA.OFN_candidate.GetName]'s admission."
 OFN.membership.1.d:0 "We cannot afford American wrath; repay the debt we owe."
 OFN.membership.2.t:0 "[FROM.GetName] votes in favor of [?USA.OFN_candidate.GetName] joining the OFN"
 OFN.membership.2.desc:0 "[FROM.GetName] has cast a vote in favor of [?USA.OFN_candidate.GetName] joining the OFN."
 OFN.membership.2.a:0 "Excellent."
 OFN.membership.3.t:0 "[FROM.GetName] abstains on [?USA.OFN_candidate.GetName]'s OFN membership"
 OFN.membership.3.desc:0 "[FROM.GetName] has taken no position on [?USA.OFN_candidate.GetName]'s OFN membership. OFN expansion requires unanimous approval, so if we want their vote, we will need to offer them something."
 OFN.membership.3.a:0 "This is not good."
 OFN.membership.4.t:0 "[FROM.GetName] opposes [?USA.OFN_candidate.GetName] joining the OFN"
 OFN.membership.4.desc:0 "[FROM.GetName] opposes [?USA.OFN_candidate.GetName] joining the OFN. OFN expansion requires unanimous approval, and to change their minds, we will have to pay dearly."
 OFN.membership.4.a:0 "What a nuisance."
 OFN.membership.5.t:0 "Negotiate with [?USA_currently_negotiating_with.GetName]"
 OFN.membership.5.desc:0 "[?USA_currently_negotiating_with.GetName] is currently unwilling to support [?OFN_candidate.GetName]'s OFN membership. To change their minds, we may choose one of the following:\nPay [?USA_current_political_cost] Political Power\nPay [?USA_current_money_cost]M USD\n"
 OFN.membership.5.a:0 "Make concessions to them"
 OFN.membership.5.b:0 "Give them money"
 OFN.membership.5.c:0 "Forget it"
 OFN_membership_costs_trigger:0 "We have [?FROM.OFN_convince_cost_political] Political Power or [?FROM.OFN_convince_cost_money]M USD"
 OFN_membership_change_vote:0 "§GThis nation is now willing to support [?USA.OFN_candidate.GetName]'s OFN membership\n\n"
 OFN_membership_money_cost_tooltip:0 "§YThis will cost [?USA_current_money_cost]M USD§!"
 OFN_membership_political_cost_tooltip:0 "§YThis will cost [?USA_current_political_cost] Political Power.§!"
 OFN_membership_all_in_favor:0 "All OFN members unanimously approve the candidate's application"
 OFN_membership_start_negotiations:0 "§YWe will attempt to convince [FROM.GetName] through financial pressure or political concessions.§!"
 OFN_membership_scotland:0 "§YWe welcome Scotland into the §YOFN§!!§!"
 OFN_membership_negotiation_trigger:0 "We are attempting to convince an OFN member to change their position."
 USA_OFN_membership_category:0 "OFN Expansion Negotiations"
 USA_OFN_membership_category_desc:0 "A nation joining the OFN requires unanimous approval from all member states. In theory, this emphasizes equality among allies; in practice, the Americans have many ways to 'convince' dissenting members to change their minds.\n\nCurrent candidate: [?USA.OFN_candidate.GetNameWithFlag]\n\n[CAN.GetFlag][GetCanadaVote]\n[NZL.GetFlag][GetNewZealandVote]\n[AST.GetFlag][GetAustraliaVote]\n[BLZ.GetFlag][GetBelizeVote]\n[SAF.GetFlag][GetSouthAfricaVote]\n[IBR.GetFlag][GetIberiaVote]\n[ENG.GetFlag][GetEnglandVote]\n[ITA.GetFlag][GetItalyVote]"

l_english:
 WORLD_REICH.1.t: "[Get_newspaper_header]Germany's Latest Conquest"
 WORLD_REICH.1.desc: "On January 19, 1962, Eberhard Körner became the first human to walk on the moon. The space race had long been a contest between Germany, Japan, and the United States; though the Americans were first to send a human into space, the Fuehrer proudly declared that Germany's successful lunar landing had secured victory in the race.A grand ceremony is planned for Germania, where Körner and his fellow astronauts will be decorated with the Iron Cross, and a week of celebrations will be announced across the Greater German Reich.Though the United States and Japan have sent brief congratulations, President Nixon has vowed that America will be the first to establish a permanent base on the moon, and Japan soon declared it will be the first to reach Mars."
 WORLD_REICH.1.a: "Has the space race been decided?"
 WORLD_REICH.2.t: "[Get_newspaper_header]Assassin Strikes at Hitler!"
 WORLD_REICH.2.desc: "News from Germany is scattered. Rumors trickling out of Germania suggest that shortly after the lunar landing celebrations, the military and bodyguards flooded the streets and rapidly placed the city under martial law. An assassin reportedly attempted to strike the Fuehrer, but Hitler's personal bodyguard successfully intercepted him; German sources claim the man belonged to the Japanese Special Intelligence Board.Various reports of the assassination attempt have surfaced. On the streets, rival military factions stand off, demanding each other stand down, and the chain of command has collapsed. In an instant, Germany seems terribly weakened. Can the Germans, barely able to save themselves, maintain order in the New World?"
 WORLD_REICH.2.a: "Brothers quarrel among themselves..."
 WORLD_REICH.2.b: "Oh no."
 WORLD_REICH.2.c: "What on earth is this baseless accusation?"
 WORLD_REICH.3.t: "[Get_newspaper_header]Hitler Names Bormann Successor"
 WORLD_REICH.3.desc: "Following the recent attempted assassination of the Fuehrer by a suspected Special Intelligence Board agent, pressure has steadily grown for the Fuehrer to name an official successor, formally recognized by the Reichstag. After nearly a week of debate and speculation, Adolf Hitler appeared today before the Reichstag in a live television address and announced to Germany that his successor will be Martin Bormann.

The decision is seen as the most likely outcome; though some liberals and military figures have expressed concern, it is welcomed by German moderates and conservatives. With Bormann promising only minor reforms and a commitment to the Nazi cause, Albert Speer, Hermann Göring, and Reinhard Heydrich have criticized the choice as one that will surely consign Germany to a premature grave."
 WORLD_REICH.3.a: "It seems nothing will change in Germany."
 WORLD_REICH.4.t: "[Get_newspaper_header]Hitler Names Goring Successor"
 WORLD_REICH.4.desc: "Following the recent attempted assassination of the Fuehrer by a suspected Special Intelligence Board agent, pressure has steadily grown for the Fuehrer to name an official successor, formally recognized by the Reichstag. After nearly a week of debate and speculation, Adolf Hitler appeared today before the Reichstag in a live television address and announced to Germany that his successor will be Hermann Göring.

As one of the Fuehrer's oldest allies and the kindly uncle of the nation, Göring has broad support from the Nazi old guard and the Wehrmacht, but this relationship has led many to reject the decision. Albert Speer, Martin Bormann, and Reinhard Heydrich have all criticized the arrangement and vowed never to let Germany fall into the hands of a warmonger eager for war."
 WORLD_REICH.4.a: "Is war on the horizon?"
 WORLD_REICH.5.t: "[Get_newspaper_header]Hitler Names Speer Successor"
 WORLD_REICH.5.desc: "Following the recent attempted assassination of the Fuehrer by a suspected Special Intelligence Board agent, pressure has steadily grown for the Fuehrer to name an official successor, formally recognized by the Reichstag. After nearly a week of debate and speculation, Adolf Hitler appeared today before the Reichstag in a live television address and announced to Germany that his successor will be Albert Speer.

It is a deeply controversial choice. Speer is supported by the left-leaning members of the Reichstag and Germany's liberal movement, as he advocates sweeping economic and political reform. However, the decision has angered Germany's more conservative elements; Martin Bormann, Hermann Göring, and Reinhard Heydrich have all condemned the choice."
 WORLD_REICH.5.a: "A new dawn for Germany."
 WORLD_REICH.6.t: "[Get_newspaper_header]Hitler Names Heydrich Successor"
 WORLD_REICH.6.desc: "Following the recent attempted assassination of the Fuehrer by a suspected Special Intelligence Board agent, pressure has steadily grown for the Fuehrer to name an official successor, formally recognized by the Reichstag. After nearly a week of debate and speculation, Adolf Hitler appeared today before the Reichstag in a live television address and announced to Germany that his successor will be Reinhard Heydrich.

Shock and anger immediately swept the Reichstag; a quarter of delegates voted against the nomination, and another quarter abstained, the first non-unanimous vote in Reichstag history. While some praised this as ending the hostility between Germany and the SS, only a few were so forgiving; most see Heydrich as nothing more than a Burgundian puppet, and unrest has erupted across Germany."
 WORLD_REICH.6.a: "Under the Black Sun, all is well."
 WORLD_REICH.6.b: "Good God."
 WORLD_REICH.7.t: "[Get_newspaper_header]Adolf Hitler Dies"
 WORLD_REICH.7.desc: "Mourning has swept across Germany. The news first spread in Germany, then across the world: the Fuehrer of Germany, the victor of the Second World War, Adolf Hitler, has passed away. Though there had long been speculation about the Fuehrer's deteriorating health, the news still shocked all of Germany. The Reichstag has announced three months of mourning, and the Fuehrer will be buried beside his late wife, Eva Hitler; dignitaries from around the world have been invited to the funeral.

While Germany mourns, many across the world are openly celebrating the death of the man responsible for thirty years of suffering across the globe. Yet many international commentators fear that what is now called Germany or the Greater German Reich has descended into a fierce power struggle over the rightful successor to the Fuehrer."
 WORLD_REICH.7.a: "A day to remember..."
 WORLD_REICH.8.t: "[Get_newspaper_header]German Civil War"
 WORLD_REICH.8.desc: "Following Adolf Hitler's death, Germany immediately descended into chaos. Though the Fuehrer named a legal successor, powerful factions within Germany have already taken up arms against each other, each determined to steer the nation toward its own vision. The country has split; entire garrisons ignore orders from Germania and rally to the successor of their choice. While the full severity of the situation is unclear, estimates suggest Germany is either facing or already experiencing a complete collapse of central authority.

Though the fate of Germany's eastern territories is uncertain, the sudden severing of communications between Germania and her colonies has sparked speculation that these regions may also seek their own paths. One thing is certain: the collapse of this European giant has thrown the entire continent into disarray."

 WIN_jamaican_nationalism_desc:0 "The burden of the entire Federation, outside of Trinidad and Tobago, falls almost entirely on Jamaica - which contributes 43% of the Federation's revenue. This has nearly halted economic development on the island, breeding resentment toward the Federation and making it the province where nationalism is most active."
 WIN_jamaican_nationalism2:0 "Jamaican Nationalism"
 WIN_jamaican_nationalism2_desc:0 "The burden of the entire Federation, outside of Trinidad and Tobago, falls almost entirely on Jamaica - which contributes 43% of the Federation's revenue. This has nearly halted economic development on the island, breeding resentment toward the Federation and making it the province where nationalism is most active."
 WIN_jamaican_nationalism3:0 "Martial Law in Jamaica"
 WIN_jamaican_nationalism3_desc:0 "The protesters have been cowed; the politicians have fallen silent. All is calm in Kingston. Unless we have forgotten something..."
 WIN_jamaican_nationalism4:0 "Jamaica Relieved"
 WIN_jamaican_nationalism4_desc:0 "We have lightened Jamaica's burden, but the nationalists still seem very active. At least the politicians are on our side now."
 WIN_splitting_apart:0 "Splitting Apart"
 WIN_splitting_apart_desc:0 "Due to numerous factors, the West Indies stands on the brink of its third breakup. As far as we know, this may be the last, as America has grown tired of constant intervention, and even the government has avoided conscription in certain areas to prevent betrayal within the ranks."
 WIN_splitting_apart2:0 "Splitting Apart"
 WIN_splitting_apart2_desc:0 "Due to numerous factors, the West Indies stands on the brink of its third breakup. As far as we know, this may be the last, as America has grown tired of constant intervention, and even the government has avoided conscription in certain areas to prevent betrayal within the ranks."
 WIN_history_occupation:0 "History of Occupation"
 WIN_history_occupation_desc:0 "The West Indies has now been under American military occupation three times, and we must deal with its effects. Every time our industry has collapsed completely, it has left permanent scars on the economy."
 WIN_economic_meltdown:0 "Economic Meltdown"
 WIN_economic_meltdown_desc:0 "Having lost the islands that provided nearly half the West Indies Federation's revenue, the Federation's economy has entered a death spiral."
 WIN_economic_meltdown2:0 "Economic Meltdown"
 WIN_economic_meltdown2_desc:0 "To prevent the complete disintegration of the West Indian economy, the government has resorted to various measures. Though unpopular, they will prove critical to the nation's survival."
 WIN_election_workers_rights:0 "Expanded Social Welfare"
 WIN_election_workers_rights_desc:0 "The backbone of any nation is a well-fed, well-cared-for populace."

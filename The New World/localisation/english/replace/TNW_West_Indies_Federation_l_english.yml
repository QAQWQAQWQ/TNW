 POLITICS_GRANTLEY_ADAMS_WIF1_DESC:0 "Despite the growing problems of the West Indies Federation, this patchwork of former island colonies, the United States has retained faith in Prime Minister Grantley Herbert Adams. By all accounts, they have not misjudged him. Though Adams is no servile pet of Uncle Sam or the OFN, there is no denying he is a moderate - a man unwilling to rock the boat. The Prime Minister from the small island of Barbados has been a staunch liberal since his Oxford days. To that end, since his 1958 election, he has supported numerous reforms designed to integrate the Federation into the global market under American supervision. Meanwhile, a bitter rivalry has existed between Adams and the growing left-wing movement in the Caribbean. He views them as uncontrollable radicals threatening the economic freedoms he has worked to secure, while they in turn denounce him as little more than a colonial governor for America and the OFN.\n\nAs Prime Minister, one of Adams's greatest challenges has been balancing the interests of the two largest and most influential islands in the Federation - Trinidad and Jamaica - while also addressing the needs of the smaller, often-forgotten 'Ten Little Islands' including Barbados. As political tensions rise across the Federation along lines of class, race, and political division, Grantley may soon find his own mettle and that of the Federation tested."
 POLITICS_GRANTLEY_ADAMS_WIF2_DESC:0 "Both allies and opponents were stunned when Prime Minister Grantley Herbert Adams turned down the Americans. After the catastrophic secession of Jamaica and Trinidad and Tobago - the Federation's wealthiest members - the Americans undoubtedly expected Adams, their long-time partner in the islands, to meekly accept the greater support they offered, along with all the strings attached. But for whatever reason - weariness of American dominance or simple optimism - Grantley politely declined the Americans. While this has not changed the status quo between the United States and the West Indies, it was seen as a sign of greater independence for the Caribbean islands.\n\nEven so, such a move may have raised hopes among regional nationalists, and its consequences may yet hurt Adams and his people. After all, the 'Ten Little Islands' are just that: specks in the ocean. With the two largest economies gone, they may drift helplessly in a turbulent global economy. Vision or arrogance? Principle or recklessness? Now history will vindicate or condemn Grantley."
 POLITICS_GRANTLEY_ADAMS_WIF3_DESC:0 "Grantley Herbert Adams's decision to tie the rump West Indies Federation to the United States was the safe, correct choice. It also confirmed everything his political opponents had claimed in the eyes of many. After Jamaica and Trinidad and Tobago walked away, the agreement he accepted guaranteed the Federation's economic survival - but at the cost of placing the islands under near-direct rule from Washington. Every action the Grantley government wished to take required Uncle Sam's approval, every budget had to pass through Congress, and even the Federation's modest defense force now fell under U.S. Southern Command. West Indian sovereignty had become a frustration for independence-minded activists, effectively torn to shreds, existing only in the most nominal sense like a bad joke.\n\nBut Adams still considers it all a price worth paying. The loss of autonomy rankles, but it is the only way to ensure the Federation continues to exist as an entity. At least, he hopes so."
 POLITICS_ERIC_WILLIAMS_TRI_DESC:0 "Civil servant, scholar, father of the nation: Prime Minister of Trinidad and Tobago Eric Williams has certainly accomplished much in his life thus far. Born in 1911 to a wealthy family of French Creole descent, he initially seemed destined for academia rather than politics. A gifted scholar, Williams won a scholarship to Oxford University in Britain. He earned his bachelor's degree in history in 1935 and his doctorate in 1938. His thesis, 'The Economic Aspects of the Abolition of the Slave Trade and West Indian Slavery,' has since become a milestone in the historiography of the British Empire and the slavery system it administered.\n\nAfter WWII ended and Britain collapsed, Eric Williams's life changed dramatically. By the time the West Indies Federation was formed, Williams had become a leading figure in Trinidad and Tobago politics, advocating for majority rule by the islands' native peoples within the Federation to govern the defeated British, Dutch, and French Caribbean territories.\n\nWilliams planned a unified system for the West Indies Federation, believing the time for independence had come. Now he, the brilliant scholar, must undertake the task of leading Trinidad and Tobago's transition to a fully independent nation."
 POLITICS_ERIC_WILLIAMS_WIF_DESC:0 "Civil servant, scholar, father of the federation: Prime Minister of the Caribbean Federation Eric Williams has certainly accomplished much thus far. Born in 1911 to a wealthy family of French Creole descent, he initially seemed destined for academia rather than politics. A gifted scholar, Williams won a scholarship to Oxford University in Britain. He earned his bachelor's degree in history in 1935 and his doctorate in 1938. His thesis, 'The Economic Aspects of the Abolition of the Slave Trade and West Indian Slavery,' has since become a milestone in the historiography of the British Empire and the slavery system it administered.\n\nAfter WWII ended and Britain collapsed, Eric Williams's life changed dramatically. By the time the West Indies Federation was formed, Williams had become a leading figure in Trinidad and Tobago politics, advocating for majority rule by the islands' native peoples within the Federation to govern the defeated British, Dutch, and French Caribbean territories.\n\nWilliams successfully reformed the Federation into a single unified Caribbean union, and he became its first Prime Minister. The brilliant scholar will surely be kept busy trying to ease the pain of this total political and economic integration."
 POLITICS_NORMAN_MANLEY_WIF_DESC:0 "If Jamaica was the glue holding the West Indies Federation together, it is fair to say that Norman Manley bears the greatest responsibility for the continued existence of the West Indies as a single political entity. Though Manley's critics would prefer to forget, his history of fighting for the Jamaican people - his people - is a long one. During the Great Depression, Manley helped found the People's National Party and worked alongside his cousin Alexander Bustamante and his trade union.\n\nThe 1940s would be a decade of enormous change for Manley and Jamaica. First came the split between the PNP and Bustamante's Jamaica Labour Party in 1943, then the approval of universal suffrage in 1944; in the second half of that decade, this moment would irrevocably change the fate of Jamaica and its neighboring islands. The end of WWII left Jamaica without a mother country for the first time in over two centuries. With Jamaica now nominally independent, Manley won election as its first Prime Minister. But soon the Americans proposed the West Indies Federation to encompass all the former colonial islands in the region. As Prime Minister of the Federation's largest economy, Manley played a prominent role, despite his frequent clashes with his arch-rival Bustamante.\n\nThe failure of the proposed independence referendum only pushed Norman Manley to new heights. In its failure, Manley saw his mission vindicated, allowing him to push for a rewritten federal constitution to create a unified West Indies Federation. Though many deride him as a mere Washington stooge, Manley believes the positive outcome he has decided upon will speak for itself in the years to come."
 POLITICS_ALEXANDER_BUSTAMANTE_DESC:0 "Whatever one thinks of the man, there is no denying that Alexander Bustamante will be remembered as a transformative figure in Jamaican history. Born in 1884, the Jamaica Labour Party politician William Alexander Clarke was actually the cousin of former Prime Minister Norman Manley. In the 1930s, Bustamante first rose to prominence for his outspoken opposition to British colonial rule in Jamaica. His activism in support of independence led to his imprisonment beginning in 1940, for three consecutive years.\n\nSince Britain's defeat and the formation of the West Indies Federation, Bustamante has worked tirelessly for a free and independent Jamaica. The only difference is his opponent: where he once railed against the British, he now must contend with the Federation and its American masters.\n\nAs the vanguard who successfully held the independence referendum, it was natural that Bustamante assumed a leadership role in the new government. As Jamaica's first independent Prime Minister, Bustamante had achieved a lifetime's victory. Even though he reluctantly accepted Jamaica's status as an OFN 'associate member' and all the second-class status that entailed, the Prime Minister had succeeded. Jamaica was no longer a colony of an empire."
 POLITICS_ALEXANDER_BUSTAMANTE_AUTHDEM_DESC:0 "Whatever one thinks of the man, there is no denying that Alexander Bustamante will be remembered as a transformative figure in Jamaican history. Born in 1884, the Jamaica Labour Party politician William Alexander Clarke was actually the cousin of former Prime Minister Norman Manley. In the 1930s, Bustamante first rose to prominence for his outspoken opposition to British colonial rule in Jamaica. His activism in support of independence led to his imprisonment beginning in 1940, for three consecutive years.\n\nSince Britain's defeat and the formation of the West Indies Federation, Bustamante has worked tirelessly for a free and independent Jamaica. The only difference is his opponent: where he once railed against the British, he now must contend with the Federation and its American masters.\n\nAlexander Bustamante had always wanted Jamaican independence, but he never imagined it would come about the way it did. He naturally supported the Black Power protests against his long-time rival Norman Manley. However, as the protests grew more violent, Bustamante found himself unable to control the movement he nominally spoke for. Only when Manley agreed to step down in support of Bustamante and the protesters did the worst of the chaos subside. Now, as leader of an independent Jamaica, Bustamante seems to have achieved his long-held dream, with Jamaica free from America and its OFN. Yet all observers, especially Bustamante himself, are well aware: the problems plaguing Jamaica remain, treated only symptomatically."
 POLITICS_MAKANDAL_DAAGA_DESC:0 "Makandal Daaga, founder of the National Joint Action Committee, never imagined he would be the one left in charge of Trinidad and Tobago after the revolution. To be honest, the Black Power movement he helped lead neither planned nor instigated the fall of the Williams government - but fall it did. An unexpected mutiny by disaffected elements of the Trinidad Defence Force sympathetic to the protesters, combined with a sustained general strike, turned into a catastrophe that forced Williams to resign.\n\nThough Daaga lacked a firm plan forward after his stunning victory, he did not let indecision paralyze him. With the regiment's support, he declared himself interim president to establish a new government that could bring some peace to the embattled islands in the revolution's aftermath. Daaga has rolled the dice, seizing the moment in hopes of a better future for Trinidad and Tobago's African and Indian peoples. He will have his work cut out for him."

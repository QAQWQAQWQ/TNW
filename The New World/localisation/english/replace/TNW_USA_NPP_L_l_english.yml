l_english:
 POLITICS_HALL_DESC:0 "There are many words to describe Gus Hall, but \"presidential timber\" is hardly among them. Born Arvo Kusta Halberg in Minnesota's Iron Range, his father was blacklisted for organizing the Industrial Workers of the World. He grew up thereafter in a log cabin his father built, speaking Finnish with his nine siblings. At fifteen, Hall left school to work in logging camps to support the family, where he joined the Young Communist League. This earned him a trip to the Soviet Union under Bukharin, where he studied at the International Lenin School for several years. Through the storms of the 1930s, Hall made his name in strikes among steelworkers, farmers, and teamsters in Minnesota and Ohio, striking fear into police and capitalists alike.\n\nWhen the Second World War came, Hall enlisted in the Federal Navy to fight the Japanese. For much of the 1950s, he was hunted by prosecutors on charges of conspiring to overthrow the American government. His reputation grew as a prominent member of the American Communist Party; he lectured on university campuses and denounced conservatives on television. Yet Hall seemed destined for the margins of American politics — until the rise of the NPP Left propelled him to the forefront. Now, after winning the most improbable election in American history, President Hall is determined to bring those on the margins of American society to the forefront, uniting the working class to build a new United States of America that serves not the few but all the people.\n\nGus Hall's presidency will take a radical path; his program is not merely to tax the rich but to remake America's economic system entirely according to a socialist vision. He intends to purge American institutions led by reactionaries and conservatives; the old American imperialism will be replaced by the new red eagle, and the light of socialism will shine upon the world. Equal protection under law and affirmative action will be enforced. Beyond this, Hall wishes to protect and foster democratic values — even if that means the death of America's old order.\n\nPerhaps Hall has no presidential timber — but he was born to be a revolutionary."
 WORLD.726.t:0 "[Get_newspaper_header] Gus Hall sworn in as President of the United States"
 WORLD.726.desc:0 "Today, Gus Hall was sworn in as the new President of the United States. Before thousands in Washington, President Hall declared: \"For the people at home, America must be liberated from the bloodsucking capitalists.\"\n\nLong a union organizer and member of the American Communist Party, Hall's political activism has led to his arrest on multiple occasions. Yet in one of the most stunning events in American political history, these controversies did not stop him from winning the election. Anti-left protests have already sprung up across the country. President Hall seeks to unite America under the banner of working-class liberation, but his election has clearly opened a fissure in American society like none seen before."
 WORLD.726.a:0 "A red bandit in the White House? How much further can America fall?"
 WORLD.726.b:0 "A Bolshevik America? Unthinkable!"
 WORLD.726.c:0 "We have nothing to lose but our chains."
 WORLD.726.d:0 "I'm not sure what this thing does, if you see it please report it to Jinshui"
 WORLD.726.e:0 "A bold experiment — but how long can it last?"
 USA.1706.t:0 "President Hall's Inauguration"
 USA.1706.d:0 "Thousands in the crowd look positively rapturous. Faced with this string of unbelievable events, the loyal laborers of the United Auto Workers wear restless yet excited smiles. Old folks stand in the square, eyes shining, watching the President — their fathers had faced down militias at Lawrence, had pressed close to hear Eugene Debs speak in Canton, had written and resisted all their lives for a dream that might one day come true. On the other side, long-haired students and afroed activists who had resisted the South Africa War draft stand in a circle, taking turns denouncing the American system and, somewhat reluctantly, offering their blessing to the newly elected President. Most of them had expected to achieve nothing politically beyond hating America's electoral system. Though that remains the view of the vast majority, at this moment, it hardly matters.\n\nMany senators and representatives boycotted the inauguration, but the notables standing behind President Hall as he took the oath were still numerous. The Chief Justice of the Supreme Court intoned the oath without emotion, and the crowd erupted.\n\n\"My fellow Americans, citizens of the world... comrades.\"\n\nThe crowd's cheers grew deafening, nearly drowning out the new President. Street corner speeches, vigorous voting, door-to-door canvassing, and all the electoral rituals laid down by those wigged slaveowners had been endured. Against every obstacle, the bell of revolution had tolled in America."
 USA.1706.a:0 "Today, the world is shaken once more."
 USA_gus_72_thehallresidency:0 "The Hall Residency"
 USA_gus_72_thehallresidency_desc:0 "Once, it was thought the least likely place for this to happen — but now no one can deny the fact. The heart of imperialism, the last bastion of capitalism, the oldest and most stable bourgeois democracy in the world — the United States — has elected a Communist president. Few could have foreseen this moment, but it is not without precedent.\n\nIn a perfect storm created by disastrous preceding administrations and an increasingly explosive American social collapse, Gus Hall moved quickly into the White House. Endless proxy wars, the civil rights movement, ferocious attacks on unions, the growing discredit of the federal government, and the eruption of American youth radicalism. Together, these factors made the NPP's Communist faction the choice of many Americans.\n\nNow, Hall must clean up the mess left by previous administrations and begin what he was elected to do: plant the seeds of a new socialist society in the barren soil of capitalist America."
 USA_gus_72_wrangle_the_npp:0 "Internal Disputes"
 USA_gus_72_wrangle_the_npp_desc:0 "Reactionary forces react violently when they find the system they built and profited from threatened. Our unprecedented victory in 1948 gave them foresight of the threat to come. Like a dragon worrying over its hoard of gold, the elites on Capitol Hill reacted fiercely. In pure desperation, \"Lincoln's Party\" allied with slaveowners and descendants of Confederate rebels — and from this union was born a monstrous, loathsome concoction steeped in historical irony.\n\nThe few who still opposed the Republican-Democrat Coalition would not be outdone, responding with their own corrupt deals. Party members past and present justified the subsequent united front with slaveowner-Confederate descendants by quoting Benjamin Franklin: \"We must, indeed, all hang together or, most assuredly, we shall all hang separately.\" This is why America's proletariat compromised its principles, so that their beloved homeland would not become a one-party state. In the twenty years that followed, their sacrifice bought only verbal promises or inaction — and more often, betrayal.\n\nThe Hall administration entered the White House in 1973 on behalf of the despised and forgotten people. They remember well what their united front was worth to their \"allies\" in Congress. We remember the broken promises, the hollow platitudes, and the assurances always forgotten when needed. Thurmond and Jackson, Chase Smith and Schlafly — these people will receive their long-overdue reckoning, until their convention — our convention — is remade not merely in name but in spirit and vision into a true united front."
 USA_gus_72_memories_of_lincoln:0 "In Memory of Lincoln"
 USA_gus_72_memories_of_lincoln_desc:0 "There are great revolutionary moments in American history when, despite the ruling class's constant resistance, the founding ideals of America shine forth. Men of conscience take power, if only briefly; there are, of course, trials and torments along the way. The working class had barely won its freedom before it was ripped away, conquered as brutally as slaves rising against their masters.\n\nThe cycle of tragedy, however, finally broke — and it was the accomplished President Abraham Lincoln who gathered the fleeting sparks of revolution and pushed them to their apex. As America's great liberator, fighting alongside Marx on the battlefield of human emancipation, he worked tirelessly, even as racists and landowners sought to tear him apart. For the first time, rights were long vested in the oppressed. Lincoln had declared for this nation that working people possessed the strength to defeat the bourgeoisie; his conquest of the Southern slaveowners was iron-clad proof.\n\nNow, a century after Lincoln's just war, we stand on the stage of a new era of revolution no less grand than the last. This time, all citizens, regardless of skin color, will be liberated from this vile curse; no one will be a wage slave again.\n\n§RCapitalists, tremble in your foul boots, weep for your ill-gotten gains! You cannot resist, for the proletariat of America has awakened!§!"
 USA_gus_72_crush_the_fifth_column:0 "Crush the Fifth Column"
 USA_gus_72_crush_the_fifth_column_desc:0 "America's capitalists tremble in their gilded palaces, despairing over their ill-gotten gains and their dying empire. They know we are their class enemy, and that given the chance, Hall will raze their rotting system to the ground. So it is no surprise they will stop at nothing to drive their poisoned fangs into the President's body and restore the loyal lapdogs of monopoly capital to the White House. To aid this task, they will unleash their most loyal servants — the rogues of the CIA and FBI.\n\nThough federal agencies claim loyalty to the Constitution and the President, we know well where their loyalties lie. Hoover's attack dogs exist solely to harass, persecute, and murder union members and activists. The CIA is no better, but these blood-soaked murderers build their reactionary fifth columns not in the streets of Chicago and Memphis but in the jungles of Indonesia and South Africa, ready to strike from within.\n\nA divided nation cannot stand. Fifth columnists must be purged from American government — not only to bring justice to the countless they have beaten, imprisoned, and killed, but to ensure they do not undermine the President's authority and power."
 USA_gus_72_civil_rights_are_here_to_stay:0 "Clear Out Dixie"
 USA_gus_72_civil_rights_are_here_to_stay_desc:0 "Throughout American history, racism has been used as a tool of the ruling class. Initially used only to justify the crime of slavery, it later became an ideological poison, luring white workers to act against their own interests. By dividing the working class along color lines, capitalists have time and again used racism to suppress solidarity that threatened the ruling class.\n\nRacism, in the final analysis, is a heavy hammer the capitalists wield against the American worker.\n\nThis is why the capitalist lapdogs before Hall never advanced the cause of civil rights or healed the racial divisions plaguing this nation. Republicans and Democrats preferred white workers remain under the sway of backward racial chauvinism, while Black workers were terrorized and oppressed, afraid to resist their oppressors.\n\nNow that the vanguard of the American people occupies the White House, it is time to deliver the final, decisive blow against Black oppression. Those who claimed to be progressives pushed past the segregationists and passed a civil rights bill. But that was merely symbolic legislation granting Black people a modicum of freedom. We will introduce something truly revolutionary to Congress. At last, Lincoln's promise from a century ago will be fulfilled. A true civil rights bill, guaranteeing equal protection for all. Reactionaries protest that this violates states' rights. They shout from the rooftops: \"Injustice! Overreach! Socialism!\" Then we will show them socialism. We will show them what the full weight of the federal government can achieve. If the South will not enter the 20th century on its own, we are happy to kick and drag them in."
 USA_gus_72_sins_of_the_father:0 "The Sins of the Father..."
 USA_gus_72_sins_of_the_father_desc:0 "In 1925, President Calvin Coolidge prayed to Heaven for a watchdog — to protect corporate \"legitimate\" profits from workers' endless organizing. God answered generously, sending a \"righteous man\" who would one day found America's fascist secret police.\n\nDriven by an insatiable hunger for power, J. Edgar Hoover and the FBI waged open war on the working class — while Lady Justice looked away. Hoover wiretapped activists, used their families' \"well-being\" to silence them, infiltrated unions, made some disappear mysteriously, and fashioned himself into an indispensable part of America's political machine. Now even Hoover's nominal \"superiors\" tread carefully near him and his office — for one never knows what dirt he holds on you.\n\nOf course, a spymaster of Hoover's tenure has many enemies and rumors. Combine them — opportunity lies where others dare not look, and Gus Hall is not easily frightened."
 USA_gus_72_raise_the_sickle:0 "Raise the Sickle"
 USA_gus_72_raise_the_sickle_desc:0 "Hoover was not alone in suppressing the American proletariat. Since Prohibition, a host of agents, informants, and sympathizers within the police have marched to his tune, pushing from behind officials who dance to the beat of his true masters. They are his wolves in sheep's clothing, leading the flock away from green pastures and sunlight. His will is proclaimed through them, his influence spreads through them to every corner of the nation. These lackeys pervade American politics like a toxic fog, stiffening those who dare defy the will of profit before they feel the dictator's ominous shadow.\n\nYet in the end, they are only men and women, no more immune to human frailty than the common people. A good master chooses servants most like himself — and we know Hoover was a cross-dressing homosexual; how will his subordinates indulge themselves? Our people are eager to find out."
 USA_gus_72_the_african_nightmare:0 "Expose the Crimes"
 USA_gus_72_the_african_nightmare_desc:0 "Marx and Lenin both warned that every class, regardless, must first serve its own class interests. Thus it is natural for workers, regardless of race or creed, to organize for better conditions and wages; equally natural for capitalists to lie and cheat when it increases their profits. Admittedly, decades of repression have crushed the first instinct in American labor — but the latter has dominated news wherever it is reported, though it is praised as an American virtue rather than a vice.\n\nThe South Africa War is the clearest example of capitalists' inherent duplicity. America's wealthy coveted the riches of an entire continent under German fascist control, so they funded from start to finish a war of conquest marketed as liberation. Their puppets in Congress painted a free nation under attack, willfully ignoring the elements that had kept it unfree since its founding. Their mouthpieces in the media described a crusade akin to 1863, willfully ignoring the massacre of African villages by machine gun and napalm. They themselves proposed grand plans for the \"reconstruction\" of Nazi Africa: a deal, in everything but name, trading this plundered land with fascist slaveowners in exchange for United Fruit and Standard Oil interests.\n\nWhen the war ended, Americans were fully convinced these men had \"fought a good war\" in the Dark Continent. To preserve this narrative, the injustices planned and executed by these \"good soldiers\" were locked away in Pentagon archives.\n\nIn the spirit of Honest Abe, and in the name of his legacy, we will bring the truth to light."
 USA_gus_72_a_new_red_dawn:0 "A New Red Dawn"
 USA_gus_72_a_new_red_dawn_desc:0 "It is 5:30 PM Eastern Standard Time. The marble buildings along Washington's riverside glow warmly in the sunset, feathery clouds dotting the broad blue sky.\n\nSuited clerks wander the National Mall on their way home, content with their nine-to-five spreadsheet lives in four-foot cubicles. CEOs gather in the city's finest clubs and restaurants to indulge, sanctified by the almighty dollar. A mother of three trades her cashier's uniform for two hours of sleep and an apron painted with a smiling clown face. Black brothers and sisters too young crowd together for warmth, searching for landlords' cold stares as they hunt for rooms. The view over the capital closes out this quiet day: the rich begin another eight hours of rest, the poor begin another eight hours of work.\n\nTomorrow morning, an \"anonymous source\" will release our Hundred Days' work to all. No one will sit quietly as the flood of sins comes rolling in. When dawn rises over the Potomac, the countless truths the hypocrites tried to bury will be exposed by its glare, and we will strike while the iron is hot. The FBI, CIA, and NSA — institutions that have long squeezed and exploited workers on behalf of Wall Street's monopoly thieves — will crumble before the people's action.\n\n§REnjoy today's peace, for tomorrow and the decade to come, peace will be a distant memory.§!"
 USA_gus_72_civil_rights_are_here_to_stay_tt:0 "§RPresident Gus Hall§! will submit a new §GCivil Rights Act§! to Congress."
 USA_gus_72_wrangle_the_npp_tt:0 "\nSome £GFX_npp_c_texticon §KProgressive§! senators will be §R\"persuaded\"§! to support our cause."
 USA_gus_72_memories_of_lincoln_tt:0 "\n§R'Twas he who led the nineteen braves to Harpers Ferry town;\n'Twas he who made the rebel Virginia fiends shake at the sound;\nThe traitors called him traitor, and hanged him in the street;\nBut his spirit marches on!§!"
 USA_gus_72_investigation_tt:0 "§ROur investigation will take some time to bear fruit.§!"
 USA_gus_72_sins_of_the_father_tt:0 "§RThe higher they fly, the harder they fall.§!"
 USA_gus_72_crush_the_fifth_column_tt:0 "§RWe will not tolerate a reactionary fifth column.§!"
 USA_gus_72_raise_the_sickle_tt:0 "§RThe day of reckoning draws near.§!"
 USA_gus_72_a_new_red_dawn_tt:0 "§RWith the reactionary fifth column within the federal government partially pacified, we can at last begin down the long, rugged road to American socialism.§!"
 USA_Gus_Subtract_CIA_Budget:0 "\n§RTime to hit them where it hurts: capital.§!\nRemove §R25%§! of the CIA's budget."
 HAL.2.t:0 "How Does the White House Celebrate?"
 HAL.2.desc:0 "The chatter died down as Chief of Staff Tanner walked in with a folder, alongside President Hall. All eyes turned to the two men, awaiting their announcement. Before speaking, Hall gave them a flat look.\n\n\"Alright, boys, the show's about to start, and if I can't pull it off, you fools aren't just gonna stand around. Martin's counting double.\" The Defense Minister nodded with a smile, and laughter rippled through the room. \"Stand tall, like we won. Because we did win something — right here.\" Hall straightened his back and waved Tanner's folder. \"Today, we prove to America that real change begins in the streets and ghettos soaked with comrades' blood. Today, we announce that change is all America will see from now on. Every one of you should be proud of your work.\"\n\n\"Time to go upstairs. Don't keep them waiting.\"\n\nThe walk to the balcony was quiet and tense. Hall was lost in thought. These days, he spent more time thinking than acting — thinking about the next four years, holding onto Congress, the rioting in the South. From Richmond to Phoenix, redneck reactionaries were but one problem among many. But he would handle them in time.\n\nThe door opened. Morning breeze brushed his calloused skin. All his thoughts were washed away by the sea of people below him. Red, white, and black covered every inch from the South Lawn to the Washington Monument and beyond to the horizon. An invisible weight lifted from his shoulders: for the first time in decades, the old man felt his step lighten.\n\nHall took the podium, and the sea of people roared. The only thing the union man could do before the crowd's cheers overwhelmed him was to hold the bill above his head."
 HAL.2.a:0 "The road ahead is long with no return; one day, a spring breeze arrives."
 HAL.3.t:0 "Dealing with Defeat"
 HAL.3.desc:0 "\"...proved that American democracy is alive and well. Though some radicals tried to hijack it in haste, to these sinners I say: the people have spoken, and they have spoken against —\"\n\n\"Turn it off, Tanner. Those gibbering bastards have said enough.\"\n\n...\n\n\"Sir, what do we do now?\"\n\n\"Don't look so glum. Half the members of Congress just exposed themselves as hypocrites, and that's no surprise to people like us.\"\n\n\"Make no mistake: this is a terrible setback. Your brothers have had their hopes shattered again and again, three times in ten years. But setback never stopped them from fighting for the people's damn dignity; they didn't flinch an inch. Our forefathers, facing guns and scabs day after day, kept fighting the thieves who trampled their values. So why should we be scared off by a few freeloading petty bourgeois shills?\"\n\n\"Mr. President, I'll take that lesson to heart.\"\n\n\"Kid, revolutions rarely happen overnight. I'd rather have ten comrades who remember that than ten thousand who don't.\""
 HAL.3.a:0 "\"And hand me the phone; I need to have a word with my old friend Meany.\""
 HAL.4.t:0 "You've Got Mail"
 HAL.4.desc:0 "\"...sir, I must remind you, the civil war took good men on both sides. Honoring the terrorists who caused our greatest tragedy sullies their sacrifice and blah blah blah...\" President Gus Hall tossed the letter aside, adding to the mountain of junk piled up after he signed pardons. The righteous gentleman from Montgomery had even used a traitor's rag as a postage stamp! Some people's nerve...\n\nThe door swung open to reveal a paper-stuffed bag balanced on two wobbly legs. \"Hey, Tanner, have you read these?\" Hall said to the visitor.\n\nChief of Staff Jarvis Tanner hauled the bag toward the big desk, scowling, as mail of all sizes spilled onto waist-high hills. \"Reading one means you've read them all — oh, how heavy...\" he grunted, dumping the bag onto the summit like a corpse on hay, except it was paper flying everywhere instead of straw. \"That's the fifth bag this morning, sir,\" Tanner sighed. \"This won't be letting up anytime soon.\"\n\n\"The stove won't be hungry anytime soon either.\" While Tanner sorted the unclassified mail, Hall inspected the brand-new liquor cabinet in the Oval Office. He eyed a bottle of hard cider and grinned as he pulled it out. Champagne and bourbon were for petty bourgeois; real men got drunk on 80 proof. \"Alright, kid, I'm in a good mood, and cider won't drink itself.\""
 HAL.4.a:0 "That night, the two men toasted Mr. John Brown."
 HAL.5.t:0 "Dig Up the Foundations"
 HAL.5.desc:0 "\"Tell me everything you know about Hoover and Helms,\" Gus Hall commanded.\n\nDefense Minister William Martin settled slowly into his chair. \"These two gentlemen are the heads of the FBI and CIA respectively, Mr. President,\" he said rhythmically. \"To ensure national security, the federal government has repeatedly approved lowering the threshold for oversight, allowing both to operate in broader areas, and they thus use methods beyond legal jurisdiction to confront America's ideological enemies at home and abroad.\"\n\n\"Drop the double-talk, Comrade Minister,\" the President laughed, but there was no humor in it. \"Tell me straight: they're the two most capable men in the country, doing whatever they please, not giving a damn about white men lynching Black men, fascists marching in the streets, organizers disappearing by day's end while their puppets still issue orders... these two must be richer than God Himself.\" The President ran a hand through his hair. \"Am I right?\"\n\nMartin sank into his armchair, eyes avoiding the bright lights. The room was stuffy, underscoring his unspoken pressure. After adjusting his tie, he replied quietly: \"We should consider that the work of both directors is vital. If we demand too high a standard of legality, the defense mission against global fascist expansion will suffer setbacks...\"\n\n\"These setbacks can be remedied through our own will.\" Hall pulled out a dossier and showed it to Martin, rapping the kraft paper three times cheerfully. \"Of course, I understand your position. Get to work; I want to see this done as soon as possible.\"\n\nThere was nothing more to say. The President wanted evidence of corruption rife in the two agencies: as he put it, to smash rot with justice, even if it meant dismantling their defenses against Germania and Tokyo — perhaps that was the union man's intent.\n\nHall's chosen executioner was already imagining America standing naked before foreign powers."
 HAL.5.a:0 "But orders were orders, and Martin sharpened his axe."
 HAL.6.t:0 "The President's Team"
 HAL.6.desc:0 "It was an awkward meeting — America's first Communist President sat across from the second FBI Director since Hoover's death. William Ruckelshaus made small talk about photos of Hall's grandchildren. In response, Hall pursed his lips in a smile. Then came an uncomfortable silence. The President then got down to business.\n\n\"I'd like to discuss as soon as possible some files my office requested regarding the FBI's relationship with the civil rights movement.\" Hall stared at Ruckelshaus after saying this, pausing. \"I... am disturbed by most of the contents.\"\n\nHe did not need to elaborate on the threats, violence, and surveillance. The files locked in Hall's desk were filled with Black deaths and suffering. Ruckelshaus shifted in his seat. \"The FBI has always served the national interest. If in rare cases these actions exceeded reasonable limits, such as with the activist Fred Hampton, that was not FBI policy but the misconduct of a few bad actors.\"\n\nHall felt a wave of nausea but bit back his retort. The purpose of this meeting was not to exchange talking points. \"I notice that several files I formally requested regarding Martin Luther King Jr. and Malcolm X are not included.\" In his mind, the words were loaded. \"There are significant gaps in the archives of the past decade.\"\n\n\"Mr. President, bureaucracies... sometimes lose things. I know someone with your background may find this hard to understand, but — good lord.\" He shook his head. \"There's really no need to dig up the past. Trust me, it's better for everyone. Your predecessors learned that.\"\n\nHall stared at the Director, a chill running through him. The Director's words may have been offhand; most would dismiss it as bureaucratic. But he was not a fool."
 HAL.6.a: "\"That will be all, Mr. Ruckelshaus.\""
 USA_gus_72_investigation_time_tt:0 "The President touched the lock on his desk drawer. Driven by fear and outrage, a radical plan began to take shape."
 HAL.7.t:0 "Before the Speech"
 HAL.7.desc:0 "The White House was not built for such moments, staffer Alice McGrath thought. The President sat at his Oval Office desk, before a bank of network television cameras. As the one-minute warning sounded through the room, a makeup artist applied blush to Hall's sweaty face.\n\nAlice noticed there was no teleprompter, which struck her with growing alarm. Only hours earlier, she and the rest of the White House press corps had been told to prepare the office for a national televised address. Topic: unknown. What the President would do was a mystery to her, to Congress, to the Cabinet, even to the President's wife.\n\nEverything he would do was completely improvised. An acrobat without a tightrope.\n\n\"Thirty seconds to air,\" a voice called out over the bustle. A assistants scrambled for final adjustments. \"Non-essential personnel, clear the room.\"\n\nThe President was breathing hard now, seeming to melt under the bright incandescent lights. He took a long drink of water and set it absentmindedly near the corner of his desk; a staffer brushed it away. He turned the photo of his grandchildren toward himself, then closed his eyes. His image refracted a dozen times in the cameras' fisheye lenses.\n\n\"Ten, nine, eight, seven...\"\n\nGus Hall put the photo back, wiped his eyes on his sleeve. Then he straightened his back and faced the lens. A pause, and the light on the foremost camera turned red."
 HAL.7.a:0 "Broadcast begins..."
 HAL.8.t:0 "President Hall's First Address to the Nation"
 HAL.8.desc:0 "A trace of nervousness in his voice: \"My fellow Americans, when I entered the White House months ago, I promised you I was not the kind of man who follows the rules. I would bring a new style of leadership, and uncover the truths previous leaders conspired to hide, regardless of consequence, regardless of sacrifice. And now... I intend to keep that promise.\"\n\n\"Rarely in history have so many objective factors converged to press upon me, urging me to find the courage to act. This is because... because the matter is too important. Now, I am prepared to reveal the truths the government has concealed from you. Even if doing so leads me to...\"\n\nHe bowed his head to compose himself, then returned to the bright lights. \"Over the past few weeks, I have personally reviewed many FBI files on their treatment of civil rights activists. What I have seen, I can only describe as... terrifying. Endless violence, surveillance. I do not know how many people they have ruthlessly abused, but based on what I have learned, I can say with responsibility.\" He spoke tremblingly, as if vomiting forth darkness: \"I have ample evidence to believe that FBI reactionaries murdered Fred Hampton and Malcolm X, and likely Martin Luther King Jr. and others as well.\"\n\nThe Oval Office fell dead silent.\n\n\"I understand the consequences of giving this address, but they will not shake my resolve.\" His gaze sharpened. \"I will not allow these terrible truths to remain buried. I will not submit evidence to Congress, where it will only be interred. Tonight, I announce that I will use my lawful powers as President to unilaterally declassify all files regarding national security agencies' surveillance of the public, their murder of civil rights activists and all other marginalized groups. To ensure the spread of this information, I have made copies of what I consider the most important documents. If necessary, my staff will distribute them to anyone who contacts the White House.\"\n\n\"I promised you change, and I will not stop until you have truly felt it.\""
 HAL.8.a:0 "After a stunned silence, the streets erupted in anguish, fire, and violence."
 HAL.9.t:0 "After the Speech"
 HAL.9.desc:0 "Since President Hall's national address, acting FBI Director Dirk DeLoach had endured some trying days. After the unrest began, FBI field offices were attacked first, followed by an attempted bombing of headquarters; William Ruckelshaus and Mark Felt had resigned, and even DeLoach had to move his family to a hotel. By now, DeLoach was the FBI's last senior leader. And Congress's reward for his dutiful service was a hearing.\n\n\"Now, Mr. DeLoach, I...\" Angela Davis said. Once a socialist-leaning professor, she had been elected to the House. Her words were a knife wrapped in silk. \"My question is, please answer truthfully, did the FBI murder Martin Luther King Jr. and El-Hajj Malik El-Shabazz (Malcolm X) —\"\n\nHe could bear no more: \"Ms. Davis, the reports speak clearly — this is utter fabrication! I make no comment on the President's views, but as his own released materials show, he has no evidence at all —\"\n\n\"Mr. DeLoach, you won't even let me finish! We have records of surveillance and frame-up operations... what about Fred Hampton? What about the other operations President Hall mentioned?\" She pulled out a letter. \"This letter demanded that Martin Luther King Jr. commit suicide —\"\n\n\"We... we are investigating these allegations. I did not know... uh... I mean, I personally was unaware. I authorized nothing...\" His stomach knotted; he worried he would vomit. He saw the angry faces of many people. DeLoach continued: \"Things are not as the President says. We are not... the FBI is not the enemy of any Black American or anyone else; we merely... merely uphold the law.\"\n\nThe Representative shook her head in disgust and signaled to the chair that she was finished. Then the next Representative flipped on her microphone, and the agony continued."
 HAL.9.a:0 "The FBI's legitimacy has been shattered beyond repair."
 HAL.10.t:0 "Briefing at the Eleventh Hour"
 HAL.10.desc:0 "\"Turn to page twenty-four,\" said Defense Minister William Martin. He cleared his throat; the rustle of paper mingled with the war room's air conditioning.\n\n\"Operation Final Reckoning will proceed in two phases,\" he continued. \"Phase One consists of leaks released by our agents in major television networks and newspapers. Over several weeks, they will secretly receive sensitive material detailing criminal activities that American intelligence and military agencies deliberately concealed from the public. Once this material circulates, anti-government sentiment will grow, giving us ample justification to launch Phase Two.\"\n\n\"We will sweep the rot out of the capital.\" President Gus Hall stood and paced back and forth. \"No one will be spared, from the highest general to the lowliest clerk. Hundreds, thousands, tens of thousands, hundreds of thousands — in the end, it doesn't matter how many lose their jobs. I don't care if they have children to feed or alimony to pay. Their hands are stained with our comrades' blood; they must answer for it, one way or another.\" As he spoke, the union man glanced around the room, his gaze settling on a man with a cigar. \"Larry, I see that light in your eyes again. Feeling the blood rush?\"\n\nTreasury Secretary Larry Oetlior grinned, waving his favorite pastime in the air. \"Hell yes, boss,\" he said. \"I've been waiting for this; how could it not get me excited?\" The battle-hardened strike leader held up two fingers — the other three were reduced to stumps — pointing at the man beside him. \"I believe Hiss feels the same.\" Secretary of State Alger Hiss nodded in agreement.\n\nAnd as always, Vice President Paul Robeson said nothing except for an occasional yawn. No one expected him to open Martin's report. \"When you get old, you need your beauty sleep,\" people joked."
 HAL.10.a:0 "The dawn of America's labor giants is coming."
 HAL.11.t:0 "(Excerpt from House Truth and Reconciliation Committee Hearings)"
 HAL.11.desc:0 "Rep. Esme Harper (IL-15, NPP Marxist Caucus): Don't make me say it twice, Mr. Hughes, where was Bravo Company on the night of December 15?\nWitness: Lewis Hughes, Captain, 101st Airborne Division, Service #O-6772835\n\nHarper: So you maintain that when Colonel Hawkins issued the order, Bravo Company was not near Port-Fontaine at all, but as he claims, was \"pacifying guerrilla activity in the town.\"\nHughes: Yes, ma'am.\nRep. Dominick Hendricks (MS-2, NPP Marxist Caucus): [expletive], don't lie to us, Hughes. The record is clear: Second Battalion was pre-positioned to Port-Fontaine during the Christmas Blitz. You're still going to say your baby-killers vanished into thin air before their friends pulled the [expletive] trigger?\nRep. Drew Chapman (AZ-4, NPP Progressive Caucus): I simply want clarification, Captain. What did you mean earlier by \"not far from Port-Fontaine\"?\nHughes: We weren't in Port-Fontaine when it happened, really. After we took the town, battalion ordered us to push on a few miles. My men only heard about the massacre after Hawkins requested a burial detail. We didn't... really didn't... [unintelligible]\n(Hughes fell silent. Onlookers noted his eyes \"turned cloudy and distant.\")\nHarper: I think we'll stop here, Mr. Hughes. Bravo Company's deliberate inaction was itself a crime. You and your men are not innocent; you are accomplices to the deaths of 85 innocent civilians and children, because you did not even try to dissuade them, let alone expose them.\nHendricks: Nothing will change that, \"sir.\" No matter how fancifully you spin it to some tabloid. This hearing is adjourned."
 HAL.11.a:0 "(End of excerpt.)"
 HAL.12.t:0 "Recreation"
 HAL.12.desc:0 "It was noon at the steel mill, and the foundry workers clustered around the single radio in the break room, gathering for this special moment. It had become something of a new ritual for Philadelphia union members, born of a simple premise: every revelation of federal wrongdoing sharpens the proletariat's class consciousness, and the oppressors grow weaker in relative terms. That was how Rosie had put it when she convinced James to join the crowd, which smelled of half a day's work sweat. He thought the guys were just looking for an excuse to relive the feeling of Election Day '72. But either way, joining was urged on by the contest between masculine reason and camaraderie, and even more by the pleading look in her bright, large eyes.\n\nNaturally, emotion conquered reason. And so James found that when CBS reported on today's leaks, his voice joined the dozen others' baboon-like shouts: the tally of possible FBI infiltrators and strikebreakers in the Mid-Atlantic region. Sonny held a blackboard and chalk, and like everyone else, looked forward to the second half of the lunch break over the past two weeks.\n\n\"Uh... it says one... three... nine, right?\" James's blond coworker shouted over the break room din. The greasy smell of elbows and the ink of banknotes mingled in the air.\n\n\"Your ears must be broken; you're off by twelve!\" Rosie shouted, turning her head, while James tried not to let her leaning on his shoulder pin him down. Since when did she get so heavy?\n\n\"You two idiots are both wrong,\" another voice boomed — probably Corwin. \"If Cronkite says 164, then it's 164, period!\"\n\nThe impromptu debate quickly devolved into a shouting match, and James could only sigh inwardly. Only a madman would have thought gambling on the number of firings could become a pastime."
 HAL.12.a:0 "Lightness amid national tragedy."
 HAL.13.t:0 "Carrying On"
 HAL.13.desc:0 "William Martin's first — and only — impression of Langley came from its parking lot. A kaleidoscope of cars crammed the asphalt plain set in the forests of Northern Virginia. His expectations of the intelligence services were not low; he'd heard the German Ordnungspolizei headquarters was four times larger than Langley.\n\nEvergreen trees receded on both sides of the road as the limousine slowed to a stop. The Defense Minister nodded to his driver and stepped out. It was only the second time he had seen Langley, and this time it took his breath away.\n\nThe red Fords were gone, the black Mercedes vanished, the yellow Chryslers and General Motors cars were nowhere to be seen. The colorful mechanical beasts had disappeared from the plain — leaving only an empty preserve.\n\nIn the distance, the drab gray buildings crouched like a lonely giant in a clearing. It was the CIA's heart of glass and concrete, every beat sending orders to tens of thousands of agents at home and abroad. But as its employees resigned (or were fired), its pulse grew weaker. Now the heart lay empty, standing quietly in place. In a way, this dormant heart awed and frightened Martin — such a leviathan, silently suffocating beneath his hands. As long as its heart remained still, the CIA could do nothing to its enemies. When would this great dream end? Should it end? So many questions, so few answers...\n\n\"Finished looking?\" came the voice from the sedan. \"We have work to do, Martin. Come admire it again when that ugly concrete heap is in ruins.\"\n\nBefore obeying the President's order, Martin took one last look at the sleeping giant. Like Martin himself, the giant's unknown fate for good or ill lay in Gus Hall's hands."
 HAL.13.a:0 "A few doubts gnawed at the executioner's conscience."
 USA_gus_72_stop_the_infiltration:0 "End the Infiltration"
 USA_gus_72_stop_the_infiltration_desc:0 "The FBI has long delighted in making trouble for unions; now it is time to deal with them. The FBI and all its agents' infiltration of American unions will be permanently terminated. Such action is sure to win support from our old left comrades and the NPP socialists. Through budget cuts, personnel reassignments, and internal reviews, the FBI's ability to monitor union activity will be crippled. When they realize we are not worth their effort, we can get down to business..."
 USA_gus_72_stop_the_infiltration_tt:0 "§ROur strength is greater than the gold mines they hoard,\n\nGreater than their army's firepower magnified a thousandfold.\n\nOn the ruins of the old society, we will build the new world,\n\nFor the unions make us strong.§!"

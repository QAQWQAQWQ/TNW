 POLITICS_LUTZ_GRAF_KROSIGK_DESC:0 "As a conservative lawyer and notorious former Minister of Finance, Lutz Graf Schwerin von Krosigk doesn't look, at first glance, like the kind of man who would rule a strip of German territory. Appointed Minister of Finance by the hated von Papen, he kept his position after the Nazi seizure of power by bowing and scraping, blind obedience to Hitler, and sticking to the party line. He relied on his superficial talent for economic coordination to win Hitler's trust and respect, which let him survive the economic collapse of the 1950s. But this time, Hitler's respect didn't save his position.

After losing the Finance Ministry, he drifted through several government departments, becoming a wandering clerk. Then the Führer took pity on him, considering his difficult situation, and appointed him Protector of the Protectorate of Böhmen-Mähren.

Krosigk entered protectorate politics with half fear and half determination to prove his worth to the Führer. Naturally, Böhmen-Mähren as a nation is riddled with holes, with partisans frequently destroying what little infrastructure remains. Getting this protectorate operational again will take some work, and some innovation. Of course, Germany won't like this kind of innovation — but as long as they don't find out, it's fine."
 POLITICS_KURT_DALUEGE_DESC:0 "Kurt Max Franz Daluege was born in a small Silesian town, his veins forever carrying the militarism of the old German Empire. He joined the Nazi Party in his early years, then transferred to the SS, serving for a long time before the war as Chief of the Ordnungspolizei. This position perfectly suited Daluege's antisocial personality traits, and his efficiency in suppressing partisans and dissidents was exemplary.

After the Soviet defeat in 1945, Daluege was transferred to Bohemia — an arrangement that, in his eyes, amounted to a demotion for no reason. Although he hated the frontier posting, he firmly believed he would return to the center of German politics, and so continued to inflict cold atrocities on those he supervised. When Himmler launched his coup, Daluege could only watch from his Prague post as a trapped beast. The golden ladder back to Germania never opened for him.

Losing favor in the inner circle didn't truly break Daluege. He secretly built a network of influence in Bohemia, even after the West Russian War, breaking with SS doctrine to reach a grey alliance with the Czech resistance: tacitly allowing them to grow under his supervision, and using them when necessary to gradually undermine the garrison. When the civil war broke out, he activated his hidden agents to expel the Prague garrison and proclaimed himself SS-Oberst-Gruppenführer. But aside from a few remaining SS remnants, no one would endorse this coup, which was bound to be accompanied by madness.

In Daluege's eyes, he has been snubbed by Germania for too long. Let the decaying old men of Europe make all the noise they want. Now that the power of Bohemia is in his hands — whether rebel factions within the borders, German remnants, or even the Burgundian ghost — no one can take a single bit of it from him."

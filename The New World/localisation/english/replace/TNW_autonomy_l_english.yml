 autonomy_special_city:0 "Special Municipality"
 autonomy_special_city_tt:0 "In the current administrative system of the Republic of China, a "Special Municipality" is not merely a matter of population scale, but a symbol of national strategic importance. Those designated as Special Municipalities are all key centers of national politics, economy, culture, or foreign affairs, with an administrative rank equal to provinces, directly subordinate to the central government, and coordinated by the Executive Yuan.`n`nSpecial Municipalities follow a model of "highly centralized, limited autonomy." The municipal chief is nominated by the central government and appointed through administrative procedures; finance, policing, and industrial planning are coordinated directly with central ministries. Local assemblies retain advisory and proposal functions, but major matters must be reported to the central government for approval before implementation. This arrangement ensures local efficiency while maintaining the unity of the national will.`n`nSpecial Municipalities typically have Industrial Coordination Committees and Foreign Trade Offices, maintaining close ties with Japanese and Co-Prosperity Sphere member enterprises. Some coastal Special Municipalities have "cooperative development zones" to attract foreign investment and technology transfer. Modern urban development proceeds in parallel with traditional cultural preservation, forming a unique "New East Asian urban landscape.""

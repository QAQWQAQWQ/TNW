 autonomy_china_warlord_regime:0 "Warlord Regime"
 autonomy_china_warlord_regime_tt:0 "§LThe tradition of warlord rule in China today can be traced to the collapse of order in 771 BC, when the Quanrong destroyed the Western Zhou. Yet Chinese history also has its share of benevolent emperors — Emperor Guangwu of Han, for instance, began as a minor warlord before unifying the realm. Guangwu never executed a single general or minister around him, and even spared other imperial clansmen who declared themselves emperor.`n`nForeign counterparts were far more brutal, institutionalizing the plunder and massacre of armies, but China's warlords were far more civilized. Chinese warlords were not reviled like foreign ones; on the contrary, they were largely autonomous civil officials or military officers, granted local control by a weak central government — not bandits or mad soldiers.§!"

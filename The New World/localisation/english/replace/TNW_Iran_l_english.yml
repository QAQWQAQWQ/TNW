 PER_German_Persian_Oil_Company: "German-Persian Oil Company"
 PER_German_Persian_Oil_Company_desc: "As part of the post-war Axis partition of the British Empire's legacy, the Anglo-Iranian Oil Company was placed under German administration and renamed the German-Persian Oil Company (DPÖ). Since then, Germany has monopolized every oil field in Iran for its own use, while Iran receives only the scraps. The Germans seized one of Iran's most vital natural resources, leaving the country poverty-stricken despite being littered with natural black gold."
 PER_Mosaddeghs_Legacy: "Mossadegh's Legacy"
 PER_Mosaddeghs_Legacy_desc: "The legacy of former Prime Minister Mohammad Mossadegh hangs over the Iranian government like a sword of Damocles. After he nationalized the AIOC, bringing all oil fields under direct government control, the Germans engineered a coup in favor of the Shah, removing Mossadegh and granting the Shah even greater power. Many domestic and foreign commentators see this as the definitive failure of the Persian democratic cause; it will take the people a long time to regain trust in the government — if they ever do..."
 PER_The_Imperial_Guard: "Imperial Guard"
 PER_The_Imperial_Guard_desc: "The Iranian army is the most formidable fighting force in the Middle East, and its heart is the Imperial Guard. Every member is carefully selected, rigorously trained, and armed to the teeth with the best equipment money can buy; they carry the torch of the Immortal Regiment of ancient Persia. When the nation goes to war — civil or foreign — the Imperial Guard will be our most precious elite force."
 PER_The_Iranian_Civil_War: "Iranian Civil War"
 PER_The_Iranian_Civil_War_desc: "Iran is torn by war, and it is not only soldiers who suffer, but civilians trapped in the combat zones. Blood will tear this ancient society apart, and perhaps only then will Iranians learn to cherish peace — but is it all worth it?"
 PER_oil_payments: "§RGermany owns oil extraction rights in §YFars§!.§!"
 POLITICS_MOHAMMAD_REZA_PAHLAVI_DESC: "Mohammad Reza Pahlavi is a blank canvas. To the Iranian people, the Shah is no ordinary man. To his supporters, he is the symbol of Persia sprinting toward a bright modern future. He is Cyrus the Great gazing from his chariot upon the chaotic ruins of Babylon — not the tyrant who stormed cities and waged endless war, but a liberator who brings modernization. Like every King of Kings before him, Mohammad Reza Pahlavi has been given a handful of barren earth and hopes to shape it into a fertile orchard of figs and fruits of every kind. The Shah is the very embodiment of Persian iron will, tenaciously defying every insurmountable challenge.`n`nTo his detractors, the Shah is nothing but Darius III come to life, even more simple-minded than Alexander of Germania. To his enemies, he is no King of Kings but a German-appointed governor — and a brutal one at that. In any case, Iran is no longer the nation the world once admired. Once, lofty palaces stood atop mountain peaks, home to rulers of virtue and wisdom; now, only a few tombs remain, and an old man living in his own fantasies recounts past glories. The Shah is Persia's eternal alarm clock, waking the people to how far their nation has fallen.`n`nTo Mohammad Reza Pahlavi himself, the picture is not so simple. The Shah does not wish to recreate past glories, nor repeat past mistakes. Iran stands on the brink. After Mossadegh nationalized the oil fields and exiled the monarch, no fact was clearer than Iran's surrender to Germania. When the Germans rebuilt control over the country and restored him to the throne, the Shah understood the truth. Iran cannot save its future by clinging to the past, and he can no longer indulge in playing the playboy beneath the Swiss Alps. He can no longer cower in the long, bloodstained shadow of his father, Reza Shah. The German government is in its sunset years, and its control over Iran's oil fields grows more fragile by the day. When that day comes, the Shah will make Iran a world power, leading her into her golden age. He will no longer be that vague, fragile idol — he, Mohammad Reza Pahlavi, will become the true King of Kings.`n`nThe Shah may be a blank canvas, but the most beautiful paintings always begin on a white cloth."
 POLITICS_FARAH_PAHLAVI_DESC: "Farah Pahlavi is the Shahbanu, Empress of the Imperial State of Iran. As a daughter to wealthy parents Farah's upbringing was a privileged one, full of opportunities that common Iranians could only dream of. She met the Shah as a student of architecture in the Reich, and they were married in an opulent ceremony which caused her country's Treasury some strain. For ten years and more the Shah ruled over Iran, and Farah enjoyed all the glamour and luxury that was due the Empress. She was not idle during this time, working to improve the lot of Iranian women and fostering cultural initatives.`n`nThen her world was set aflame. With her husband's death Farah Pahlavi became Regent of the Imperial State, watching her country collapse into civil war. The Shahbanu is known to favour the German language over Persian; more importantly, she represents an establishment dedicated to German-Iranian friendship, and the continued provision of oil to the Reich.`n`nNow the Empress presides over a throne stained in blood, as German guns and German bombers reduce her country to rubble. To the Generals and SAVAK men who support her regency, the Empress is a stabilising figure, the last hope that the 2500 year monarchy will survive. The Empress herself can only watch as §Rmore and more people are butchered in her name§!."
 PER.1.t: "Assassin Strikes The Shah!"

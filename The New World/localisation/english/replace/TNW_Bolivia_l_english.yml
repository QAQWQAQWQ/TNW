 BOL_Armando_Alba_Zambrana: "Armando Alba Zambrana"
 POLITICS_ARMANDO_ALBA_ZAMBRANA: "Perhaps the most poignant tragedy of modern Bolivia is that of a patriot who loved his country deeply, only to be reviled by it. One might say he brought it upon himself, but that does little to soften the bleakness of the tale.\n\nBefore ascending to the presidency, Armando Alba Zambrana was a figure of national reverence. Unlike his brother who fell in the Chaco War, he served his country through culture: war correspondent, writer, restorer of the Potosí Mint Museum. Renowned as a \"master of language,\" he was regarded as one of Bolivia's greatest nationalists. Fate destined him for the spotlight - he was elected mayor of Potosí, then deputy, then senator, running as an independent every time, owing his seat to no faction, only to his personal charisma. Perhaps this success blinded him.\n\nBack in 1958, the ruling oligarchy needed a president acceptable to the Southern Cone powers while soothing the popular mood. They knew the people could not stomach another oligarch ruler, so they turned to Alba. The naive Alba believed he could realize his vision of a revitalized Bolivia. He was wrong. For four years, the idealist was a puppet of the very interest groups he despised, watching them dismember and sell out his beloved homeland. The people saw him as a traitor, and the halo of the former hero hardened into the brand of a deceiver. Alba loathed himself as well, and now only prayed that his term would end soon, to bring this long execution to a close."
 BOL_Collapsed_Authority: "Collapsed Authority"
 generalissimo_banzer: "Generalissimo"
 BOL_Chilean_Contracts: "Chilean Contracts"
 BOL_Mining_War: "Mining War"
 BOL_patchwork_country: "Patchwork Country"
 BOL_patchwork_country_desc: "Bolivia has Indians, mestizos, and creoles, but no Bolivians. The central government's authority is too weak to rally the people under a single banner of unity. After Santa Cruz fell to the separatists, the situation worsened - government reprisals and agitprop have lit the fires of separatism across the entire east. Worse still, the indigenous peoples are restless, and the Indianist movement grows by the day, dreaming of the legacy of Pachacuti.\n\nTo reverse this, to make the people identify as \"Bolivians,\" La Paz has raised the banner of revanchism, vowing to reclaim Santa Cruz and the entire Chaco. Though five Chaco Wars have gained not an inch, what's one more?"
 BOL_One_Country_Two_Systems: "One Country, Two Systems"
 BOL_Triumph_Of_The_Orient: "Triumph of the Orient"
 BOL_The_Shadow_War: "The Shadow War"
 BOL_The_Shadow_War_desc: "Ever since Freemasonry emerged from the shadows, conspiracy theories about it have never ceased in the West. These theories often draped themselves in antisemitism, especially in Germany: Hitler branded Jews as the hidden masters of Freemasonry, directly catalyzing the mass purge of Jewish communities. The \"Masonic conspiracy\" became the perfect political scapegoat, as rulers blamed national suffering on it regardless of truth or consequence.\n\nThe bitter irony is that these conspiracy theories have only a basis in reality precisely in the regions where the two great lodges have truly broken away from the Masonic system.\n\nThe \"Oriental Knights\" and the \"Protective Tree\" were once of the same stock; the latter's schism triggered a vicious shadow war that engulfed all of Santa Cruz - politics, business, the military, anyone who held power belonged to one faction or the other. In Santa Cruz, to swear fealty to neither lodge was to be forever barred from social advancement."

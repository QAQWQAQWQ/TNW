 BOL_mining_war_timer_tt: "The Bolivian crisis escalates. We must act within [?ZZZ.days_mission_timeout@ZZZ_MiningWar_timer|0] days before things spiral out of control."
 BRA_faction_random_action_tooltip: "[BOL_mining_war_tmp_faction_name] influence on groups will §Rrise§!"
 BOL_mining_war_BRA_can_act_tt: "Fewer than 2 active actions"
 POLITICS_ALFREDO_OVANDO_CANDIA: "Every soldier knows loyalty to country, a lesson politicians never learn. Since the first Chaco War in 1932, the La Paz regime kept throwing unprepared troops against Asunción. The absurdities of the Bolivian military were legendary: conscripting natives who had no idea where Paraguay even was, forcing child soldiers into service when manpower ran out, and more. Among those underage soldiers was a 15-year-old Ovando Candía.\n\nOne might think such an experience would breed resentment, but Ovando Candía never harbored such thoughts. As a patriot, he took pride in serving his country and devoted his life to the military. Though culturally sympathetic to Germany, he remained a moderate, joining neither Villarroel's MNR nor the oligarchy.\n\nYet even a man has his limits, and when Bolivia deteriorated to the point of action, Ovando Candía set out to rekindle the flame of military socialism to set the nation right. But his grand vision faced two obstacles: the military's conservatives, stubbornly resisting any reform; and the moderate reforms promised by military socialism, which to an angry populace that had already seized the mines and was brewing revolution, were too little, too late."
 BOL_Eduardo_Montes_y_Montes: "Eduardo Montes y Montes"
 BOL_David_Terrazas: "David Terrazas"
 POLITICS_DAVID_TERRAZAS: "David Terrazas was born into a family that had served the Liberal Party for generations, destined from childhood to lead Bolivia. At fifteen, he entered the military, fought bravely in the first Chaco War, and was directly promoted to captain in a brutal 1935 battle. He later briefly headed the La Paz Military Academy; in 1946 he became Commander-in-Chief of the Bolivian Army and was sent to the US as military attaché. He later fought alongside American soldiers in the Siberian War and was awarded the Legion of Merit for his performance.\n\nYet the Terrazas family's inextricable ties to the oligarchy could not be hidden. His brother Ruben fell victim to the purges under Villarroel, murdered in the horrific Chuspipata massacre. From that moment, David vowed to oppose Villarroel's regime, plotting coups in exile and becoming a prime assassination target.\n\nNow that the oligarchy has returned to power, Terrazas has been placed at the head of the new government. He is regarded by USAID as the most reliable general, backed by the entire Cold War apparatus. From day one, he has imposed Prussian discipline and iron-fisted rule, mercilessly bringing Bolivia back to the old order. After all, he had seen what people do when unleashed without restraint, what horrors they commit, how society collapses when rulers are unbound. His hatred for the people has long gone numb, for he has seen who it was that once cheered, and whose grace they cheered for. So when the mestizo youths in the streets curse him and throw stones, he only murmurs to himself:\n\n§O\"All of this, for you, my dear brother.\"§!"
 oligarch_shield_terrazas: "Oligarch's Shield"
 POLITICS_OSCAR_UNZAGA: "From Antofagasta to the Chaco, the national revolution has purged all apostates. Óscar Unzaga de la Vega emerged victorious from the crucible. His long journey began as a student activist in Chile and now he has become the fighter poised to rebuild the nation. He is no longer a lamb to the slaughter, but a warrior who decides battles.\n\nUnzaga's political career began in 1937, when he founded the Bolivian Socialist Falange on the basis of a secret society of just four trusted associates. His early struggle was not easy: the MNR suppressed Falangists with terror, and he was even imprisoned at one point. But even as governments turned over and every ruler sought to snuff out the redemption of the Bolivian bloodline, he never ceased promoting his unique brand of Christian democracy. Any ordinary man would have been written off as deranged.\n\nThough critics claim unrefined fascism has no future in the Andes, Unzaga knows Falangism was born of the moral wounds of a defeated nation. So whether facing the growing arrogance of Brasília and Santiago, or the military mutineers and traitors within his own government, he stands firm, letting the true faith stand tall in the storm. Now, with the traitor Rioja finally brought to justice, Bolivia is finally cleansed of foreign contamination. This land is no longer the slave of foreign embassies and the lackeys in hillside mansions. Long live Bolivia, whose wandering sons have not abandoned her!"
 POLITICS_BERNARDINO_BILBAO_RIOJA: "While the fuse of Bolivia's powder keg burned steadily, General Bernardino Bilbao Rioja found himself the unwelcome centrist between the Falangist extremes - a pose of order doomed to be hated by the radicals. Born to a wealthy family in Arampampa village, he received his military education in Chile and became one of the first pilots to emerge from the Chaco War. During a brief stint as acting Minister of War in 1930, he became a national hero for the legendary defense of Villamontes.\n\nHe was once elevated to Commander-in-Chief of the Army, but the Bolivian government \"rewarded\" his service by kidnapping and exiling him to Chile. His years in exile showed him how the system preyed on his homeland. He vowed revenge, cooperating with the Chilean government to overthrow what he saw as a deformed regime while joining Unzaga's Socialist Falange, hoping this powerful patriotic dissident organization could bring change.\n\nHe never expected to regain his former glory, but the successive failures of mediocrities like Guillermo Cañasso somehow placed him once more at the head of the faltering Socialist Falange. While the old guard whispered, Rioja would lead Bolivia onto the right path - with the help of his Chilean friends, of course."
 BOL_Decalogue_Of_The_Falangist: "Decalogue of the Falangist"
 BOL_Decalogue_Of_The_Falangist_desc: "1. Patriotism above self-interest\n2. Give body and soul entirely and perpetually to the Movement - which is the cause of Bolivia\n3. Respect religious faith\n4. Maintain discipline - discipline is the individual's obedience to the collective\n5. Fulfill duty for duty's sake, not for reward\n6. Improve oneself daily - for the maker of great things must first make himself\n7. If dying for ideals, scorn both life and death\n8. Never retreat, never be cowardly\n9. Live with dignity, loyalty in heart, dedication as calling\n10. Scorn the easy life - the Falangist is first a soldier. Those who fight shall win!\n\n- Precepts of the Socialist Falange"
 BOL_The_Infernos_Beating_Heart: "Beating Heart of Hell"
 BOL_The_Infernos_Beating_Heart_desc: "A hell on earth. Short on food, crude in shelter, purpose-built torture chambers, walls pocked with bullet holes. This is the concentration camp built by Bolivia's MNR.\n\nThe regime's secret police, the \"Political Control Directorate,\" fed it a steady stream of new inmates. Any threat or dissident against the MNR was thrown into the back of a truck and bounced through exhaust-choked air to their new residence. As shovels rose and fell in rhythm, dirt pits lengthened outside the camp, and the new batch of Falangists, communists, journalists, intellectuals, and \"social dangerous elements\" filled the empty bunks.\n\nThe more furious the revolutionary tide, the deeper the Political Control Directorate's reach, the more frightened prey gathered, and the tighter the net of Bolivia's concentration camps wove."
 BOL_The_Caudillo_Of_The_Revolution: "Caudillo of the Revolution"
 BOL_The_Caudillo_Of_The_Revolution_desc: "Villarroel was no ordinary military strongman; he was the spiritual totem of Bolivian nationalism. A fervent patriot and effective revolutionary, he used iron-fisted governance and just rule to pull millions out of poverty, punishing the corrupt and proving himself no ordinary elitist politician. From the destitute to the liberated indigenous, the Colonel's supporters spanned the newly emancipated peasant masses.\n\nThis radiant hero image formed a powerful cult of personality around the Colonel. Yet as internal rifts grew in the shadows, even with Villarroel's endless eloquence and populist gestures, the thickening clouds of dissolution steadily eroded popular trust in his governance."
 BOL_A_Silent_Democracy: "Silent Democracy"
 BOL_A_Silent_Democracy_desc: "The faded revolutionary spirit gave birth to something more vital and enduring - a liberal democratic order. Paz Estenssoro put into practice the rule of law conceived by Western philosophers, bringing stability to Bolivia for the first time in decades.\n\nWhile working behind the scenes to ensure the MNR's survival, he led the nation toward autonomy. By neutralizing most opposition, Estenssoro consolidated the party's rule before the people could truly participate in elections. At this moment of democracy's first cry, safeguarding the fragile national security of this newborn state is the mission the MNR has inherited."
 BOL_A_New_Synthesis: "A New Synthesis"
 BOL_A_New_Synthesis_desc: "Following in the footsteps of David Toro and Germán Busch, the MNR was founded on the ideological framework of military socialism, an exalted pursuit of rule of law and order. Yet as the years passed, the party's big-tent architecture led to inevitable splits, reducing it to a dysfunctional entity no different from other failed movements.\n\nPressed by crisis, a new synthesis emerged - Argentine justicialism fused with traditional Bolivian patriotism - reforging unity in the fractured movement. Now the people see Villarroel as the man who set things right, but the Colonel is haunted by a question:\n\nWill posterity forgive a traitor?"
 BOL_Fiances_Of_Death: "Fiancé of Death"
 BOL_Fiances_Of_Death_desc: "Though the Mining War has ended, the clouds of violence have not lifted from Bolivia. Terrified by the radical reforms of the national revolution, a group of disgruntled landowners, military officers, and reactionaries launched a rebellion, leaving large swathes of the countryside outside government control. The most notorious is the terrorist group known as the \"Fiancé of Death\" - closely linked to international fascist organizations, funded by the resurgent drug trade, carrying out terrorist attacks on those they deem supporters of the new regime, staining the countryside in blood.\n\nFaced with economic hardship and political turmoil, the revolutionary government has barely been able to respond, raising doubts about how long it can hold on."
 BOL_The_True_National_Revolution: "The True National Revolution"
 BOL_The_True_National_Revolution_desc: "Though the MNR promised a national revolution for Bolivia long ago, it was Juan José Torres who finally delivered. Most of the country's vast mining wealth was nationalized, and a Popular Assembly was established to push through radical left-wing political and social reforms. Bolivia would finally return to its rightful owners - the people.\n\nYet not everything went smoothly. These drastic changes were accompanied by massive purges of the government and military, impairing administrative efficiency and sparking dissent and emigration. Worst of all, neighboring powers were plotting to strangle the revolution in its cradle - their economic blockade has pushed the national economy to the brink. The Bolivian people's dream hangs by a thread."
 BOL_A_National_Reaction: "National Reaction?"
 BOL_A_National_Reaction_desc: "As a more moderate new regime takes power in La Paz, many are both anxious and expectant, fearing or hoping that Torres-era reforms will be reversed. Yet both sides are disappointed: to shore up his shaky political position, President Guevara has taken a middle path on many national revolution measures - abolishing some and preserving others in equal measure.\n\nStill, the left is weakened, suffering both the paramilitary violence of the \"Fiancé of Death\" and the increasingly cold relations with the authorities. How long this tightrope balance can hold remains an open question."
 BOL_Bolivia_Open_For_Business: "Bolivia Open for Business"
 BOL_Bolivia_Open_For_Business_desc: "Torres's harsh protectionist policies and international isolation nearly drove Bolivia's export-oriented economy to ruin. But with the new moderate nationalist government under Guevara, things are returning to normal. Though the government still strictly controls the economy, the lucrative mining sector has been reopened for development.\n\nYet rare metals are no longer Bolivia's only import-export commodity. The aftermath of the anti-Torres rebellion has dragged the country deep into the international drug trade - its vast, ungovernable interior has become a transshipment hub for Manchurian opiates and the emerging cash crop, cocaine."
 BOL_La_Ruta_Del_Plata: "Road of Silver"
 BOL_La_Ruta_Del_Plata_desc: "Back in the Spanish colonial era, the Viceroyalty of the Río de la Plata was a den of thieves - carrying plundered goods across the Andes and down the rivers to be divided up. Today's Argentines take pride rather than shame, as Buenos Aires reaps the dividends of Bolivian instability without fear of retaliation."
 BOL_Jaguars_Prey: "Jaguar's Prey"
 BOL_Jaguars_Prey_desc: "Jaguars don't chase prey like African cheetahs or lions - they stalk like ghosts, waiting for the moment to strike lethally. Once they land a blow, they tear flesh with their fangs and drink the still-warm blood.\n\nBrazil is like a jaguar, eyeing Bolivia hungrily for years. Our mineral wealth is the fat that feeds it, our natural gas fields the blood pool that nourishes it. In this lawless jungle, Bolivia sits at the bottom of the food chain."
 BOL_In_The_Condors_Nest: "In the Condor's Nest"
 BOL_In_The_Condors_Nest_desc: "The Andean condor is not a raptor but a scavenger. Its talons are not sharp enough to hunt or contest eagles for prey, so it must find large animal carcasses or wounded small animals to feed its chicks.\n\nLike this scavenging bird, Chile has plucked Bolivia up and carried it back to its nest to feed its young. Chilean mining and gas companies gape their maws, demanding their share of the prey their forebears brought back."
 BOL_Military_Peasant_Alliance: "Military-Peasant Alliance"
 BOL_Military_Peasant_Alliance_desc: "Whatever the army did in the past, now is the time to set it right. Outsiders who raised false accusations of peasant abuse will receive a satisfactory answer after the agreement. The government pledges to cease all hostilities immediately and support private plantations through socioeconomic aid. In exchange, the peasants need only cooperate to end Bolivia's thirty years of division."
 BOL_Paz_Orden_Y_Progreso: "Peace, Order, and Progress"
 BOL_Paz_Orden_Y_Progreso_desc: "Spiritual poverty robs men of the will to strive for greater good. Unfortunately, Bolivia's peasant class has been deeply corroded by this malady. The reformers' \"cure\" never existed, and those weak, compromising approaches would never restore productivity to these lazy beggars. The only way to restore order to Bolivia is repression. Their slanders against the government must be crushed utterly, and they themselves must be sent back to their proper place - working in the fields, tilling in silence, with no choice between carrot and stick."
 BOL_Fury_Of_The_Old_Guard: "Fury of the Old Guard"
 BOL_Fury_Of_The_Old_Guard_desc: "The collapse of the Socialist Falange system has finally made the worst fears reality. The sacred ideals of the Falange have been basely usurped by the likes of Rioja, and the total degeneration of Bolivian civilization can no longer be checked. Yet despair is a creed for cowards - men like Unzaga will not surrender power to such incompetent, arrogant fools. Only through the cruelest political struggle can Bolivia's faithful reclaim the rule God granted them."
 BOL_The_Undying_Flame: "The Undying Flame"
 BOL_The_Undying_Flame_desc: "Rioja thought he could betray the revolution and escape unscathed, but traitors always reap what they sowed. To the civilized world, his perverse actions are contemptible, reeking of Bonapartist rot. Yet this baseness has tempered the loyal White Shirts in the crucible of fire - Óscar Unzaga raises the Falangist torch, watching Bolivia rise reborn from the ashes. Now the work is done, and the world will witness a Bolivia built on morality and power, cleansed of Chilean barbarism."
 BOL_The_Declawed_Eagle: "The Declawed Eagle"
 BOL_The_Declawed_Eagle_desc: "To uninformed Chilean observers, as long as the Socialist Falange exists, Bolivia's dim prospects will not change. But some changes have occurred: the state machinery has grown more open and democratic, and years of militarism are finally dust. Santiago diplomats breathe a sigh of relief at having tamed the Falange, but even the naivest optimist wonders: is this all just a masquerade, the lurking shadow merely biding its time before showing its fangs again?"
 BOL_paternalism_mnr: "MNR (Auténticos)"
 BOL_paternalism_mnr_long: "Revolutionary Nationalist Movement (Auténticos) (Movimiento Nacionalista Revolucionario (Auténticos))"
 BOL_Juan_Jose_Torres: "Juan José Torres"
 BOL_Walter_Guevara: "Walter Guevara"
 BOL_Victor_Paz_Estenssoro: "Víctor Paz Estenssoro"
 POLITICS_JUAN_JOSE_TORRES: "Socialist, revolutionary, soldier, spokesman of the middle class. Juan José Torres draped himself in layer upon layer of identity, only to conceal the all-consuming ambition that devoured his ideology. All of it served one goal - the pursuit of power.\n\nThe only sincerity he can muster dates back to childhood. After his father fell in the Chaco War, he held deep reverence for his mother, remembering her resilience in holding the family together alone. But in the end, he followed in his father's footsteps, entering the military and going to Argentina for artillery training.\n\nArgentina's political climate shaped him deeply. He was deeply moved by the fiery speeches of Perón and Villarroel, and eventually joined the MNR. After Ovando's regime took power, Torres became finance minister, an important pillar of the regime, carefully betting between reform and revolution. As the revolutionaries gained the upper hand, he was naturally elected president by the People's Assembly - originally meant to be nothing more than Lechín's puppet.\n\nBut for Torres, that was not enough. He was never satisfied with what he had. He used his office to constantly expand his political base - wheeling with the right, courting the peasants, shaking hands with the left, his daily political ritual. Beneath his amiable smile lurked a beast waiting to pounce, ready to swallow the entire MNR whole."
 POLITICS_WALTER_GUEVARA: "As one of the founding members of the MNR, Walter Guevara stood out from the party's earliest days, quickly becoming its chief ideological architect. Since taking power, he has been a staunch defender of free-market capitalism, convinced that the shadow of counterrevolution never dissipates and that fair competition is the only effective defense. Yet this line has secured his position as the party's right-wing standard-bearer while dimming his hopes for the top leadership. The moderate centrists around Villarroel have formed a de facto cult of personality, and heavyweights like Paz Estenssoro and Lechín each hold their own ground, refusing to yield an inch.\n\nYet the tide is turning. The left is increasingly divorced from its mass base, and his rivals have been gradually marginalized or purged through a series of deliberate and accidental political moves. Now it is only a matter of time before he ends the emotional, irrational political farce spawned by the People's Assembly and reshapes the political landscape. He envisions a precise, decisive surgery - comprehensive privatization to restore order and rebuild normal markets. This reform is subtle and irreversible, the only cure for the spreading chaos in the current market mechanism."
 POLITICS_ROGELIO_MIRANDA_BALDIVIA: "Through sheer willpower, Rogelio Miranda broke free from the chains of poverty. Now, this devout believer not only ranks among the successful but has been elevated to a position above ordinary men - he has become the master of a nation. Faced with a broken country, he will use his will to stitch it back together.\n\nThis La Paz leader came from humble origins but was raised properly. Raised on orthodox moral principles from childhood, the faith foundations laid at the La Salle Catholic school in his youth forged his unshakable piety. He later entered the military academy, where his conduct combining integrity and intelligence quickly earned him successive commendations.\n\nWhen Ovando Candía ruled the country with an iron fist, Miranda, like many officers, advised that Bolivia should stay off the socialist path. In their view, peasants deserved no more than \"the toil and sweat God provides,\" not \"pity.\" Yet that weak-willed general failed to heed the advice, succumbing to the illusory fantasies of \"reformism,\" which discredited his regime and cost him his life.\n\nNow, after a \"pragmatist\" destroyed his own path and fell, Miranda has taken power. He will ensure Bolivia's peasant class knows its place, fulfilling its duties under God's watch. In his view, these people are born to obey order, toiling for the \"greater good\" rather than letting the depravity of their souls interfere with their duties."
 POLITICS_ENRIQUE_HERTZOG: "Enrique Hertzog was born in La Paz, a surgeon by profession who took the presidential path out of duty, always adhering to a classic centrist moderate political philosophy. His medical career began in 1932 during the first Chaco War, stitching wounds for frontline soldiers until he retired in 1936. In 1948, he was first elected president under the banner of the Unified Republican Socialist Party. His cabinet was mocked by many Bolivians as the \"do-nothing government,\" for at a time when the nation needed radical reform, they chose avoidance and delay.\n\nThough his record was thin, Hertzog's knack for maneuvering through the bureaucracy was remarkable. Even when his approval rating hit rock bottom, he foiled an attempted usurpation by his vice president. So after leaving office, he became the OFN's \"acceptable candidate.\" After leaving, Hertzog strongly opposed his successor's decision to start the Fourth Chaco War, but the oligarchy ignored his warnings, ultimately making a terrible mistake - which, ironically, restored the old president's reputation amid the chaos.\n\nNow, as one of the few figures still seen as a \"symbol of stability,\" he has been recalled to politics, entering an awkward alliance with the Liberal Party. He is exhausted, yet burdened with expectations. To preserve the \"status quo\" he cherishes, old Hertzog must learn to accept something he never truly understood - change."
 POLITICS_RENE_BARRIENTOS: "He who survives in an autocratic system must know its rules inside out. General René Barrientos survived Bolivia's revolving-door dictatorships, though not unscathed. Now he is climbing back to the peak of power, finally able to build a nation \"ruled by the worthy, enjoyed by the people.\"\n\nUnlike many of his military peers, Barrientos did not rise through nepotism. Orphaned young, he received an education and entered the military. He graduated from the military academy in 1943 as a pilot, trained in the US, and showed exceptional skill in the armed forces. But what truly cemented his position was his later participation in the national revolution. Though he disagreed with Villarroel's camp politically, he was always seen as a \"moderate,\" which won him few allies but also made him relatively few enemies.\n\nNow, Barrientos and his carefully cultivated allies control the core of state power. He pushes a \"Renewal Plan\" aimed at easing tensions between the oligarchy and the military while preserving the core ideals of revolutionary nationalism. His rule is extremely harsh, with labor movements and agitators quickly purged. Even so, he has managed to maintain relations with the peasantry below. In a paternalistic gesture of reciprocity, he provides aid and favors - in his eyes, each person is his \"client,\" welcomed into order and reconstruction under his patronage. He believes that as long as everyone works together, he can continue playing the role of \"people's general\" - if it lets Bolivia survive."

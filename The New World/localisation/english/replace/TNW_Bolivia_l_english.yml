 BOL_Juan_Lechin_Oquendo: "Juan Lechín Oquendo"
 POLITICS_JUAN_LECHIN_OQUENDO: "In the history of Bolivian labor politics, Juan Lechín Oquendo is a legend; few in the country have done more to advance left-wing thought. Born May 19, 1902, in the mining town of Corocoro, Lechín's mother was mestizo and his father was Lebanese. He was born with heterochromia iridum - a striking oddity his mother loved to show off to the neighbors, though useless in practice.\n\nRaised among the lower classes, tempered by poverty, Lechín was never content with the status quo. In his youth he was a boxer, a street vendor, and finally found his calling in the union movement.\n\nDrawn into politics by Trotskyism, Lechín quickly joined the MNR and became its left-wing leader. Though prone to political pragmatism at times, his true passion was always uplifting the working class. Among the miners who raised him, he was especially beloved, elected unanimously as the leader of the first congress of the Bolivian Miners' Federation.\n\nYet when Lechín took the helm of the Bolivian Labor Confederation, fame became a burden. He became so enamored of the position that he refused to become head of state after the revolution, instead ruling through a puppet chairman of the Popular Assembly - a fateful choice that now forces him into the spotlight. It seems that if he truly wants to retire with honor, he must find a way to seize the moment himself."

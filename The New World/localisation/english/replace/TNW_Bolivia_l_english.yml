 BOL_Antenor_Patino: "Antenor Patiño"
 BOL_Antenor_Patino_eco_desc: "§YMinister of Economy and Public Finance\nOligarchy§!\n--------------\n§LAsk any Marxist, liberal, or fascist, and they will tell you the same thing: Antenor Patiño entering the government as finance minister is the greatest insult to the Bolivian working class.\n\nPatiño is one of the richest men in the Americas, fortunate enough to have inherited the mantle of his father Simón, the \"Tin King.\" This title is no joke; his family monopolized most of Bolivia's tin mines, controlled the international market, and married María Cristina de Bourbon, Duchess of Durcal, tying himself to actual nobility.\n\nEntering the cabinet with the technocrat's hat on, Patiño immediately showed the nation what \"technocrat\" really means in Bolivia. The government was already dominated by oligarchs, but the elite were not satisfied, so they simply let an oligarch sit in the minister's office. After all, the government should naturally consist of those they represent.§!"
 el_senor_del_habla_zambrana: "Lord of Language"
 fallen_hero_zambrana: "Fallen Hero"
 BRA: "The situation in Bolivia is precarious. Our ally, the §KGovernment of General Candia§!, is besieged by all sides: armed mining gangs, remnants of the §JFalangists§!, and §DNationalist§! remnants, each eyeing the prize."
 BOL_mining_war_group_tooltip_delay: "Click to view actions against §Y[BOL_mining_war_selected_group_name]§!"
 BOL_mining_war_elites: "Elites"
 BOL_mining_war_falangists_tooltip: "§JFalangists§!\n\nFor Bolivian patriots who hate both the §Koligarchy§! and the §DMNR§!, the §JBolivian Socialist Falange§! is their outlet. One may mock their fascist ideology, but the §JFalange§! still stands proudly as the second-largest force in §jBolivia§!.\n\nThe §JFalangists§! control §Y[?BOL.BOL_CHL_groups_won] key groups§!."
 BOL_mining_war_nationalists_tooltip: "§DNationalists§!\n\nThe §DNationalists§! are the main force opposing the §Koligarchy§! in §jBolivia§!. They rally under the banner of the §DMNR§!, a big tent ranging from conservative right to Marxist left.\n\nThe §DNationalists§! control §Y[?BOL.BOL_ARG_groups_won] key groups.§!"
 BOL_mining_war_government_tooltip: "§KGovernment§!\n\nThe police know one truth: kings come and go, but the police remain. To its critics, the §KGovernment§! represents the oligarchy that brought disaster to §jBolivia§!.\n\nThe §KGovernment§! controls §Y[?BOL.BOL_BRA_groups_won] key groups.§!"

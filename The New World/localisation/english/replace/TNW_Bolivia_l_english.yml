 POLITICS_VICTOR_PAZ_ESTENSSORO: "Bolivia's liberal democratic history vacillates between tragedy and comedy, rewritten countless times by oligarchs and strongmen. Víctor Paz Estenssoro promises to write a new chapter.\n\nPaz came from an extravagant landowning family, wanting for nothing as a child, waited on by the poor who had nothing. But after putting down yet another case of mining magnate Patiño's abuses, Paz had had enough, and switched to fighting for the workers. His politics leaned left, and he was a young rising leader in the MNR.\n\nPaz was a key party figure. In Villarroel's first government, he served as finance minister, stepping back as the government fell. Afterward, he worked within the party according to his own views, becoming the leader of yet another movement within the movement. Yet the books of Bukharin and Trotsky that once lined his shelves have now been replaced by Smith and Paine.\n\nEither way, Paz is now the leader, and the party's left wing must learn to accept his liberal path. Of course, even he struggles on this path, for his opposition is not in the parliamentary corridors but in the concentration camps. Bolivia has always been a halting, stumbling nation; just as relief grain for freezing peasants must be doled out a handful at a time, democracy takes time."
 don_victor_paz: "Mr. Victory"
 POLITICS_GUALBERTO_VILLARROEL: "The rise and fall of Gualberto Villarroel is inextricably intertwined with the fortunes of militarism and nationalism in Bolivia. As these sentiments boil up again, this original instigator's return to power is well-timed.\n\nBorn to poverty, Villarroel distinguished himself in the Chaco War and was deeply steeped in military socialism under Toro and Busch. When the establishment strangled the revolutionary cause, he was filled with rage. He then went underground with the far-right organization \"For the Sake of the Country,\" dedicated to destroying oligarchic rule.\n\nIn 1943, backed by the MNR and the military, Villarroel was propelled to the peak of power. He used populist tactics to quickly win over the peasants - both indigenous and mestizo alike. But the fog of ideology eventually overturned his regime, and he needed a grander banner, one beyond the title of \"the Perón of Bolivia\" - this was the lesson Villarroel learned firsthand...\n\nSo military socialism was reborn, and Villarroel became its third leader. This new prophet has remade Bolivia, and though the Santa Cruz problem still hangs over everything, the Latin American landscape is still fertile ground for new faith. But he knows he can only leave this land in a coffin, and before that, his people will follow him through fire."
 the_friend_of_the_poor_villarroel: "Friend of the Poor"
 BOL_The_Popular_Assembly_desc: "The Popular Assembly is an organization of Bolivian unions, labor groups, and popular movements, aimed at establishing their own organs of power to replace the bourgeois parliament. In many ways it resembles workers' councils, though right-wing foreign media have labeled it a \"soviet.\"\n\nThough smeared as communists, the Popular Assembly has not actually established any kind of socialist regime. Despite all the criticism, Bolivia still has a relatively limited form of capitalism."
 BOL_A_Revolutionary_Dictatorship_desc: "The Popular Assembly is a joke, and not a funny one. Unwashed louts who won't even bathe should not be rulers, and they could never be; letting them run the country as they please would be a disaster.\n\nBolivia has lucked out - a good general threw them out and sent them back where they belong. At the same time, the general offered a generous deal: the Popular Assembly can support his new regime, or get out entirely. After all, everyone knows that only the fine soldiers of the armed forces are truly qualified to carry out the progressive national revolution Bolivia has long needed."
 BOL_The_Soviet_Republic_desc: "Lechín's hypocritical reformist plan has collapsed and vanished, and the revolutionary flame burns anew, fed by his corpse. The new republic is led by the immortal science of Bolshevik-Leninism and the Revolutionary Workers' Party, steered by Guillermo Lora.\n\nNow the Bolivian people will find true liberation under correct socialism. They will no longer be gnawed by parasites, no longer at the mercy of small-bourgeois union betrayers. The Bolivian Socialist Soviet Republic stands ready to defend the people against all threats to the revolution. Let everyone know that Bolivia is red - now, and forever."
 the_paramount_leader_of_the_COB_lechin: "Paramount Leader of the COB"
 BOL_Mining_War_desc: "The oligarch is finally hanged by the noose he sold, a broken treaty pinned to his chest. A soldier stands by the gallows, eyes full of the people who still demand justice.\n\nThe miners' uprising, dropping their picks for rifles, is like the starting pistol of the revolution - every faction bets on how the hand will play. Out of self-interest or concessions to the military junta, Brazil props up Ovando's dictatorship with bombs and bullets, leveling dissent into a desert called \"peace.\"\n\nOn the other side, Argentina fully backs the MNR led by former dictator Gualberto Villarroel, preaching a mishmash of militarism, nationalism, and populism that draws unwanted leftists. And Chile backs the Socialist Falange militias and right-wing defeated veterans, the three sides lighting the fuse and bringing a complete bloodbath."
 BOL_A_New_Bolivian_Nationalism_STC_desc: "La Paz has finally done it: the Oriental separatists have been crushed to dust, Paraguay's base ambitions reduced to ash. Reintegrating the Santa Cruz separatists was no easy task, but Bolivians of all backgrounds can take pride. §yAfter thirty years of failure, Bolivia's future is growing brighter.§!"
 BOL_A_New_Bolivian_Nationalism_Chaco: "New Bolivian Nationalism?"
 BOL_A_New_Bolivian_Nationalism_Chaco_desc: "At this moment, Latin America and the whole world can only marvel - the Bolivian people have accomplished the nearly impossible: they have not only reclaimed the long-unruly East but pushed the Paraguayan army back far beyond, reclaiming the Chaco. The barriers of race and class are being diluted, and a new Bolivian nationalism is being born. Today, our people can finally say with pride: I am a Bolivian.\n\n§YEternal praise to the brave sons\nHeroic spirits, resolute as steel\nWin freedom's glorious light\nBolivia opens a new chapter§!"
 BOL_Dual_Yoke_desc: "Are expedient allies truly allies? In the foreign policy circles of Brazil and Chile, this question echoes constantly. In their Bolivian extraction operations, both disguise greed as virtue and seize their own share. Yet greed does not stop at some precise percentage: it simmers, waiting for the next slice to steal.\n\nWeeks, months, the hungry eyes of Brazil and Chile will inevitably turn toward each other's holdings in Bolivia, imperialism salivating at efficiency. Some pray this can be avoided; the bold believe territory can only belong to one nation; and Bolivians can only continue to despair."

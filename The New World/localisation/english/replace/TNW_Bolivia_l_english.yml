 BOL_Fausto_Reinaga: "Fausto Reinaga"
 BOL_killing_hope: "Killing Hope"
 BOL_killing_hope_desc: "In the thirties, peasants pinned their hopes on military socialism, only to see Santa Cruz defeated, Busch shoot himself, and the oligarchy return immediately. By the forties, Villarroel vowed to save the people, but was ousted before he even announced his plan, and the oligarchy came back. When the general reemerged as the heir to the Toro-Busch line, battlefield defeats brought him down again. Through all the twists and turns, La Paz ended up back in oligarchic hands.\n\nWhat did the people get? Only a bleaker, more hopeless life. They finally understood that the oligarchy is unshakable, the tin barons are like gods, and Patiño, Hochschild, and Aramayo will always get away with it.\n\n§VThey finally understood that the ridiculous future is the taste of a boot forever grinding their face.§!"
 BOL_jose_lanzas_lament: "José Lanza's Lament"
 BOL_jose_lanzas_lament_desc: "In the smoke of the first Chaco War, General José Lanza watched as the Bolivian army obsessed over conspiracy and private interest rather than defeating the enemy. And so he spoke the immortal line:\n\n§Y\"I am ashamed to be a Bolivian general!\"§!\n\nThankfully, the general has long been dead! If he knew, he would be grateful not to live to see the army after all these years of revolution and counter-revolution - now completely broken. In fact, the Bolivian armed forces are in such bad shape that they can only look to foreign military missions to fix things. But then again -\n\n§OWhich foreign power will be invited?§!"
 BOL_tripartite_pact: "Tripartite Pact"
 BOL_tripartite_pact_desc: "The \"Tripartite Pact\" refers to a series of treaties signed during the provisional presidency of Carlos Crespo, establishing Bolivia's neutrality in the South American Cold War. So what's the catch? In a sense, Argentina, Brazil, and Chile have divided Bolivia between themselves, stripping value from its body.\n\nWith the support of Argentina, Brazil, and Chile, the Bolivian oligarchs' rule is secure. They are content with the status quo, and in this beautiful symphony, gold flows steadily toward La Paz, while all costs are borne by the working class. Wonderful, isn't it?"

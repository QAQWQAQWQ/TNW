 BOL_Alfredo_Mollinedo: "Alfredo Mollinedo"
 BOL_Alfredo_Mollinedo_hog_desc: "§YVice President\nOligarchy§!\n--------------\n§LLittle is known about the man in the gray suit who serves as Vice President of Bolivia, except that he is the right man for the job. In 1933, Alfredo Mollinedo was vice president of the La Paz board; in 1938, during Busch's rule, he became Bolivia's first Minister of Health. He is best known, however, for his later contributions to Bolivian football, as he led the La Paz Football Association in pushing professionalization. During this period he waged a fierce struggle against his rival Alfredo Galindo, head of the Bolivian Football Federation, with Mollinedo ultimately winning.\n\nAs a member of the Socialist Republican Union Party, he quickly entered Terrazas's vice-presidential ticket thanks to an electoral pact between PURS and the Liberal Party. He was ultimately elected thanks to his name recognition among the Bolivian public; USAID policymakers hoped it would bring some much-needed goodwill to the new oligarchic government.§!"
 BOL_Mamerto_Urriolagoitia_for_desc: "§YMinister of Foreign Affairs\nOligarchy§!\n--------------\n§LAngry, corrupt, aging - all these words describe Mamerto Urriolagoitía's current state. Born to a wealthy family, he studied law and, with the typical Francophile leanings of Latin American aristocrats, went to France to study international law. Originally, after being elected vice president under Hertzog, he was close to the center of power with a bright future ahead - but he tried to usurp power, and worse, he bungled it, making him a pariah in the PURS.\n\nThough some hardliners in the party still supported him, after his presidential hopes died, the only post his supporters could secure for him was foreign minister, a field where he had some experience as former representative to London. But Urriolagoitía saw this as political exile; he hated diplomatic work, envied his colleagues in charge of repression, and believed he could do better than them.§!"
 BOL_Alberto_Crespo_Carpio: "Alberto Crespo Carpio"
 BOL_Alberto_Crespo_Carpio_sec_desc: "§YMinister of Defense\nDespotism§!\n--------------\n§LGeneral Alberto Crespo Carpio served as head of the military academy from 1950 to 1951 and has long served the nation. His appointment as defense minister is based on the loyalty he showed to the nation and the oligarchy through years of revolution and counter-revolution - after all, the thorniest problem for the current Bolivian army is figuring out which generals can be trusted.\n\nOn his strong recommendation, the moderate Ovando Candía was appointed Commander-in-Chief of the Army. But when the general spoke privately to him about the necessity of Bolivian reform and the oligarchy's inevitable refusal, Crespo Carpio began to regret his choice. The old general chose silence; he felt he was too old to fight the army commander again, and now he only hoped to finish his term smoothly and retire home.§!"
 BOL_Hernan_Zuazo: "Hernán Siles Zuazo"

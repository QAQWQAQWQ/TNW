 BOL_mining_war_help_text_BRA: "The coup launched by §KGeneral Candia§! unexpectedly tilted Bolivia our way, but the ensuing \"Mining War\" could throw away everything we've gained.\n\nFrom exiled §JFalangists§! to §DNationalist§! remnants, every faction is stirring, hoping to overthrow the government and start anew. As they prepare to strike, we must act to secure the loyalty of a §Ymajority§! of the country's five §Ykey groups§!.\n\nThe triangle below shows the loyalty of each §Ykey group§!: §YPolice§!, §YWorkers§!, §YMilitary§!, §YPeasants§!, and §YElites§!. Groups in the green §KGovernment§! zone have pledged loyalty, and groups closer to the green zone are easier to win over."

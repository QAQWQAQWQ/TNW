 BOL_mining_war_active_text_tooltip: "Our operations in Bolivia are limited in scope. We can run at most 2 actions simultaneously."
 BOL_mining_war_winner_tooltip: "Take any three of the five §Ykey groups§! to gain the upper hand when the crisis erupts."

 HOL_busy_ports:0 "Busy Ports"
 HOL_busy_ports_desc:0 "Though the Berlin government and occupation authorities have done their best to suppress the primacy of Dutch ports in German trade, the centuries-old reputation of the Dutch harbors is hard to diminish. Most of Germany's trade passes through the ports of Rotterdam and Amsterdam; since these are not directly controlled by Berlin, even countries that do not trade with Germany use our ports for the same purpose."
 HOL_decaying_verzuiling:0 "Decaying Pillarization"
 HOL_decaying_verzuiling_desc:0 "Dutch society has been pillarized for nearly a century. Yet the German invasion of 1940 caused these pillars to begin crumbling. The occupation authorities and the SS exploited this concept to build their own hierarchy, claiming it was the largest and best. Due to people's attachment to the occupation authorities, German obstruction of traditional hierarchies, and popular resentment of the pillar system, the four traditional pillars continue to deteriorate."
 HOL_german_economy:0 "Economy in Service of Germany"
 HOL_german_economy_desc:0 "The Dutch economy was completely reshaped under German occupation and is now severely distorted, with German interests given top priority. This means Dutch military-industrial development takes a back seat."

 POLITICS_ARTHUR_SEYSS_INQUART_DESC:0 "Arthur Seyss-Inquart is the leader of Nazi-occupied Netherlands, but any farmer could do his job, and probably do it better.\n\nHe is an Austrian Nazi who participated in the Anschluss, helping to reduce Austria to a German province. He received the position of Reichskommissar because the Nazis believed the Dutch occupation government did not need a bloodthirsty general or fanatical politician to rule. Of course, his personal friendship with Hitler also played a role.\n\nHe spent his entire life as an administrative bureaucrat, with rich management experience, which may be the only positive thing he brought to the Netherlands, as an admirable bureaucracy has been established in the former Dutch territory to ensure the smooth running of the occupation regime.\n\nHowever, this may be the only good thing Amsterdam can report to Berlin. Seyss-Inquart's political talent is indistinguishable from that of an idiot; if someone asked him which Fhrer's successor would best serve the nation, he would only answer \"Hitler did a fine job, the next one should be similar.\" This neutral attitude led his Dutch domain to watch from the sidelines while other factions fought each other, which Seyss-Inquart believed was the best way to handle things.\n\nOver time, his role has been limited to signing arrest and execution orders, and keeping the NSB away from the centers of power. But it seems Seyss-Inquart's understanding of \"centers of power\" differs from the rest of the world, since most lower bureaucratic positions are held by members of the NSB Amsterdam Group, while higher positions are in the hands of the Volkisch and Musserite factions, leaving the NSB one step away from complete control of the government."
 POLITICS_WILHELM_RITTERBUSCH_DESC:0 "Aside from his humble origins and early party membership, Wilhelm Ritterbusch at first glance is just another dull party bureaucrat. He rose through the ranks, eventually being posted to the Netherlands as deputy to General Commissioner for Special Affairs Fritz Schmidt, and soon became known as an obedient and efficient official.\n\nWhen Schmidt was incapacitated by a train accident of unclear cause, Ritterbusch was rushed into position on the dual recommendation of Bormann and Himmler. Even after Schmidt recovered, he kept his seat as Landesgruppenleiter, becoming the third most powerful figure in the Reichskommissariat.\n\nFrom there, the story depends on who tells it: one account holds that after Operation Silver Fir, Ritterbusch became a complete puppet of the SS until Himmler's coup failed; another emphasizes that his cooperation with the SS was only a necessary wartime compromise, and that he returned to absolute loyalty to Bormann once the war ended, with solid evidence to prove it — the very loyalty that ultimately carried him to the top post of Reichskommissar.\n\nMany mysteries still surround the man who holds the reins of the Low Countries: Is Ritterbusch truly weak? Is he really the loyal dog Bormann imagines? Or is the break with the SS not as complete as it appears? Time will tell; it is only a matter of when."
 POLITICS_SINCLAIR_DE_ROCHEMONT_DESC:0 "For the last two decades, Reichskommissariat Niederlande has been ruled under the thumb of an Austrian. With the rise of Reichskommissar de Rochemont, a true Dutchman through and through, the region may yet return to political and cultural stability.\n\nA former Fascist along Italian lines, de Rochemont grew to admire German National Socialism and served dutifully as a collaborator, and he has spent the last twenty years leading the Volkish faction of the NSB. Filled with unbound loyalty to the Party and the Fuhrer, de Rochemont supports increased efforts of Germanization and desires the eventual integration of the Netherlands into the Reich."
 POLITICS_CORNELIS_VAN_GEELKERKEN_DESC:0 "With the Reich ravaged by the Burgerkrieg, the vacuum of power following Reichskommissar Seyss-Inquart's death has been filled by the Dutch 'National Socialist Movement', led by Cornelis van Geelkerken. Involved in the Movement since its founding in 1931, van Geelkerken worked dutifully under Anton Mussert as chief of the Nationale Jeugdstorm, and later proved his loyalty to the German occupiers by serving as the Inspector-General of the Nederlandsche Landwacht.\n\nNow the self-styled Leider of Dietsland, van Geelkerken models his authoritarian government after Mussolini's branch of Italian Fascism, and demands greater autonomy for the Dutch people. Whether his open respect towards the German Reich is forged from ideology or political necessity remains to be seen."
 POLITICS_HENK_FELDMEIJER_DESC:0 "After Reichskommissar Seyss-Inquart's death, the power vacuum was quickly filled by Henk Feldmeijer, who seized power amid the German civil war and declared independence as the SS-State of the Netherlands. Henk Feldmeijer was one of the founding members when Anton Mussert launched the National Socialist Movement, later moving to the nationalist faction and supporting the German occupation of 1940. After Seyss-Inquart recognized his loyalty, he was assigned to form and command the Dutch SS.\n\nTime has made Feldmeijer more radical. He scorns the German Reich and instead looks with admiration to the Burgundian Order-State. The new dictator of the Netherlands is more willing to swear fealty to North Asia than to Germania. He may be seeking the right moment to integrate his nation into Himmler's dark realm."
 POLITICS_BAREND_BIESHEUVEL_DESC:0 "Barend Biesheuvel's life is the archetype of any career politician. When the Germans reopened the University of Amsterdam, the young Biesheuvel earned his Master of Laws, became a civil servant in the Dutch department of the Reichskommissariat, and went to work at the Ministry of Food and Agriculture. He then rose through the ranks, eventually leading an influential faction among Dutch reformist politicians.\n\nThis Dutchman now leads the entire Netherlands, and tends to use his position to bring reform to his people. Rumors of so-called 'reform' have reached the German Fhrer's ears. Some say Biesheuvel will rule as a benevolent dictator; others believe he will restore democracy. Whatever the truth, the political landscape under Biesheuvel will certainly look very different from before."
 POLITICS_OCCUPATIONAL_AUTHORITIES_DESC:0 "With the Netherlands once more under the German heel, Martin Bormann has ordered the establishment of a temporary transitional government to stabilize the region. This government is composed of the most efficient German bureaucrats, ready to hand power seamlessly to the next Reichskommissar chosen by the Fhrer in due course."
 POLITICS_DUTCH_PROVISIONAL_GOVERNMENT_DESC:0 "After the brief and brutal Burgundian regime in the Netherlands, a new force now sits in The Hague. Speer has installed a government mixing technocrats and officers, who will oversee the Netherlands' transition from the Himmler system to self-rule as an Einheitspakt ally, and build close political and economic ties between the Netherlands and Germany. Dutch and German officials pace the cloudswept parliament building, the future ahead shrouded in mist. But compared to their previous SS occupation, Dutch citizens welcome this hazy future.\n\nThe Dutch Provisional Government is only an interim body. Germania hopes to dissolve it as soon as possible and return the Netherlands to civilian rule. The road ahead is hard, but many Dutch are willing to endure it, hoping this will bring self-determination, or at least as much self-rule as exists today."

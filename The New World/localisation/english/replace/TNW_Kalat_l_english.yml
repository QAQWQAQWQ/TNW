 POLITICS_MIR_AHMAD_YAR_KHAN_DESC: "Some might say that the Baloch States Union, or the Khanate of Kalat, is nothing more than a "nation" ruled by petty tyrants who should have been crushed by the wheels of history long ago, desperately clinging to power and precious "traditions." However, the Khan of Kalat and leader of the Baloch States Union, Mir Ahmad Yar Khan, would only laugh at such claims, then continue with his life as before.
\nAs the despotic ruler of this land, he maintains his grip on power with an iron fist. He only loosens his hold on power when inter-tribal violent conflicts break out that serve his interests. As for the other feudal lords of this land, although his status is higher than theirs, he only has the authority to guide them on foreign policy matters.
\nFor him, the Pakistan Movement is the primary issue that needs to be addressed. Some sympathize with their cause, but Mir Ahmad Yar Khan's attitude on this issue is rather contradictory. While he has no intention of making an enemy of the Pakistan Movement, the Khan believes that Baloch sovereignty is far more precious than the dream of a South Asian Muslim nation-state — and if the Pakistan dream comes true, he would have to share precious power with those Sindhis and Punjabis. To this end, he may vigorously resist other princes' attempts to integrate Kalat into Pakistan."

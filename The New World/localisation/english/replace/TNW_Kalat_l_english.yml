 KLT_sandemans_spectre: "Sandeman's Spectre"
 KLT_sandemans_spectre_desc: "The legacy of British colonial governor Robert Groves Sandeman is still clearly visible today, a bureaucrat widely known for his heavy interference in Balochistan affairs. In today's Baloch States Union, the "tribal pacification" system established by Sandeman remains an iron law: the Kalat royal family provides subsidies to loyal tribes, and inflicts atrocities on disloyal ones.
\nFundamentally, Baloch society under this system is built on kinship and factional strife. The princes who rule this land do their utmost to incite inter-tribal violence to ensure their thrones are not coveted."
 KLT_not_a_nation_but_an_alliance: "No Nation, Only an Alliance"
 KLT_not_a_nation_but_an_alliance_desc: "The Baloch States Union is not a nation in the traditional sense, because it has no central authority of any kind, and the Khan of Kalat only has the authority to handle foreign policy matters on his own. In typical confederations or federal states, important matters like currency and defense are handled by the central government, but in Balochistan, even the power to handle these affairs has been fully devolved to the constituent parts of the Baloch States Union.
\nIn fact, the Baloch States Union is nothing more than a loose polity formed by numerous princely states. They have united under the Khan of Kalat, joining together for their own survival and for the preservation of old traditions and old ways of life, no matter how reactionary those old ways of life — such as slavery — may be. Such a polity also clearly lacks any form of democratic or accountable system, and those who hold power are nothing more than petty tyrants who should have been crushed by the wheels of history long ago."

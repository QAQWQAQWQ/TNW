 USA_OilCrisis_Covert_Actions:0 "Covert Actions"
 USA_OilCrisis_Covert_Actions_2:0 "Covert Actions"
 USA_OilCrisis_ITA_S_PLAN:0 "Schwarzkopf's Plan"
 USA_Oil_Guns_for_Democracy:0 "Guns for Democracy"
 SAU_USA_strangling:0 "Strangling Saudi Arabia"
 USA_OilCrisis_FUCKYOUSAUDIS_1:0 "Landing at Tarout Bay"
 USA_OilCrisis_FUCKYOUSAUDIS_1_desc:0 "The landing at Tarout Bay was a bloody battle fought against the Arab rebel organization, and the destruction it left behind still has a small-scale impact on us to this day."
 USA_OilCrisis_FUCKYOUSAUDIS_2:0 "Rebel Guerrillas"
 USA_OilCrisis_FUCKYOUSAUDIS_2_desc:0 "Across the desert that stretches across the land of Saudi Arabia, guerrillas are openly opposing our government, sabotaging our supply lines and launching raid after raid, which has put us in a difficult position."
 OIL_proitaly_volunteers:0 "Only the Best!"
 OIL_surrender_modifier_weak:0 "Nature of Occupied Territory"
 OIL_surrender_modifier_strong:0 "Nature of Occupied Territory"
 USA_Feeding_the_Flames:0 "Send Weapons to Italy"
 USA_Feeding_the_Flames_2:0 "Begin Dispatching Advisory Missions to Italy"
 USA_Oil_Italy_Support_category:0 "Support Italy During the Oil Crisis"
 USA_fucked_with_jap:0 "Sabotage Weapons Transports"
 OIL.500.t:0 "Oil Must Flow"
 OIL.500.desc:0 "Just as the she-wolf that nursed Romulus and his cunning brother Remus, America has given what it could when asked. Our new democratic ally Italy, devastated by the rebellion in the Middle East, could hardly hold onto its oil-rich overseas colonies without a superpower's aid. If Italy can reestablish its rule over the region, we would not only spread OFN influence but also gain access to nearly limitless oil reserves, ensuring America's energy supply for decades to come.\n\nYet as with every recent issue, intervention in the Middle East has become a topic of fierce debate, with Congress split: one faction advocates direct funding, advisors, and materiel to Italy, while the other argues for direct military aid. The Coalition advocates limited intervention, while the NPP calls for the military to strike the enemy hard - but support for either policy comes from the extremes of both parties, making this debate, to put it kindly, heated, and to put it badly, paranoid.\n\nSupporters of direct intervention believe that the Italian military combined with battle-hardened American forces is enough to shatter a ragtag desert guerrilla force, ensuring OFN dominance in the region for the future. Others suggest that indirect intervention, while perhaps not as quick or efficient, is enough to help Italy win the war, while avoiding sending thousands of American boys to die in the sand.\n\nMemories of the South African war still echo clearly in every American's mind, and war in the Middle East is sure to be a polarizing issue. Whichever form of intervention we choose, we must tread carefully lest we fall into a conflict we cannot win."
 OIL.500.a:0 "We need that oil. Send in the troops."
 OIL.500.b:0 "Rest easy, the Italians can handle it themselves."
 OIL.501.t:0 "The Bald Eagle Comes to Our Aid!"
 OIL.501.desc:0 "A diplomatic communiqué arrived from Washington, and our hopes through the clouds have been answered: America has agreed to direct intervention in the Middle East, including deploying combat troops and providing additional funding, advisors, and materiel!\n\nThis is truly a blessed day! With the full commitment of American forces, neither the House of Saud nor the pan-Arabists can take control of the Middle East. In a few years, we will reestablish our rule over the region, and once again become the world's leading oil supplier.\n\nAll that remains is to prepare our young men to enter the land of dust. When the dust settles, the Middle East will enter a new era of prosperity and stability, once again in our hands."
 OIL.501.a:0 "A lucky day is coming!"
 OIL.502.t:0 "The Bald Eagle's Aid"
 OIL.502.desc:0 "Our new ally, the United States, has answered our prayers to support the fight against Middle Eastern traitors and rebels. Unfortunately, they have not committed actual combat troops. As aid, they provide only indirect support in the form of funding, advisors, and materiel.\n\nThe shipments of aid have begun arriving in port, but meanwhile, we grow increasingly worried. With American ground troops, we would be unstoppable, but now the situation is foggy. Most of us are convinced the Americans will come to our aid to ensure their oil supply; they have helped us, but it falls far short of what they could do.\n\nWe still have powerful forces, mainly because we have the most modern, well-trained, and well-equipped professional army in the region, especially compared to the corrupt Saudi army and the ragtag pan-Arab rebels. In any case, this is only meager aid; we must rely on ourselves."
 OIL.502.a:0 "Fight like devils, lads, for no more aid is coming."
 OIL.503.t:0 "Dusk Over Bahrain"
 OIL.503.desc:0 "CIA ace E. Howard Hunt stood with his back to the setting sun, binoculars to his eyes, watching three Japanese cargo ships explode one after another in a huge fireball, a cold smirk on his lips. Of course, the ships flew Thai flags, but anyone who couldn't see through that disguise was a first-class fool.\n\nThough the war was far from over, Hunt could not suppress his satisfaction. This was a heavy blow to the Japanese, and those softies had no way to retaliate - unless they admitted to smuggling arms to Islamic militants.\n\nOverall, these past months had been fruitful. His agents had successfully dismantled the Japanese spy network in the Middle East and intercepted multiple shipments bound for the guerrillas. The Japanese were well aware, but feared worsening relations with America and dared not retaliate - especially since their nearest stronghold was far away in Bengal.\n\nHunt took a deep breath, savoring the mix of salty sea breeze and distant smoke. In the harbor, firefighters and coolies scurried like headless flies, watching the burning cargo ships slowly sink into the bay. His gaze swept the crowd, confirming all agents had escaped safely, before he lowered his binoculars.\n\nWith the harbor flames blazing behind him, Hunt stretched, listening to his vertebrae crack, and strolled leisurely down the hill, his figure gradually melting into the dusk."
 OIL.503.a:0 "Just like Africa."
 OIL.504.t:0 "Iron Fist, Weak Wrist"
 OIL.504.desc:0 "After the seemingly endless debacle that had been South Africa, we expected our intervention in the Middle East to receive a certain level of opposition, but we certainly didn't anticipate that most of the dissent would come from those who wanted a more direct confrontation. It seems that our program of providing indirect aid to the Italians in the form of funding, materiel and advisors has become widely considered to be ineffective by the public and many in Congress.\n\nSupporters of the war have widely criticized the President's policy of keeping combat troops out of the Middle East, and are calling for us to enact a policy of more direct intervention in support of our Italian allies by putting boots on the ground and accentuating the Italian forces with our own. This, they say, will make the war unwinnable for the enemy. Some are even suggesting that any other decision on the President's part would be patently unpatriotic, a tacit admission that the American military isn't up to the task, that we don't give enough of a damn to protect the interests of our allies.\n\nIt's strange that, after the widespread anti-war sentiment from the public during the South African War, they would become so willing to send thousands more boys to die in the desert for the cynical and often obtuse interests of nation-states, but here we are. There's a lot of fear circulating that, without deploying combat troops, our intervention in the Middle East is doomed, and with it our economy. We can't allow our oil supply to be cut off, but is the price we may have to pay for keeping that pipeline open worth it?"
 OIL.504.a:0 "Whoever controls oil controls more than oil."
 OIL.505.t:0 "Operation Checkmate"
 OIL.505.desc:0 "The Oval Office has a busy day as always. After all, the fate of millions of people not only from the United States but the entire world hinders on the decisions that are made on this room. In this case, the possibility of a proxy attack on Saudi Arabia in order to destabilize the country and recover our control over the oil wells is being discussed. In a reunion with the President, CIA Director Richard Helms explains the advantages of Operation Checkmate. \"The idea is sending Arabian rebels to storm Tarout Bay, Dammam. Right... here\" as he points at a map of Saudi Arabia. President [USA.GetPresidentLastName] holds [GetHerHis] fingertips \"Who we are sending to do the dirty work?\" the President asked. \"A bunch of wackos called Arabian Peninsula People's Union. Basically Arab Nationalists inspired by that Egyptian general, Nasser. They don't have any political plan or any way to reach the Arabian capital\"\n\nPresident [USA.GetPresidentLastName] starts to get concerned all the sudden. \"If they cannot win, then why we are wasting money on this project?\" Sweat is visible on Helms's face. The President caught him off guard with that question. Probably being blunt about it wasn't the best strategy. \"The objective is to destabilize the Monarchy rather than making an actual government. The Saudis will have to deal with a guerrilla, making them more vulnerable to accept our demands. It's for the better: dealing with a group of crazy Nationalists controlling most of the oil in the Middle East would be complicated\" explains Helms\n\n\"Fair enough. How much all this is gonna cost?\" the President asks. \"That depends. If we have enough funding for the operation, we can invest more in training and equipment for the rebels. That would increase our chances of success\"\n\nThe President reclines on the chair. \"I see. This is what we are going to do\""
 OIL.505.a:0 "Not worth putting that much cash in."
 OIL.505.b:0 "Skimp on the investment."
 OIL.505.c:0 "Show the Saudis who's boss."
 OIL.505.d:0 "Put in every last penny."
 OIL.506.t:0 "Training"
 OIL.506.a:0 "Can we trust the Americans?"
 OIL.506.desc:0 "\"Again. Fire\" screamed Ahmed. Twenty mortars fired at the same time making huge craters on the ground and destroying the remaining target practice dummies. Camp Pendleton, Virginia has witnessed the same kind of exercises for at least half-a-century, but this time the ones on the field weren't Americans. \"Not bad\" said Ahmed with satisfaction \"You improved a lot from last time. Two months ago, you barely knew how these things worked. That would be enough for today. Try to eat and rest well because we are going to Florida tomorrow to work in our landings\" Ahmed realized that they only had at least six weeks before departing to the Persian Gulf. Could that be enough to break the Royalist defences? Ahmed was a former employee of ARAMCO. Twenty years of service under terrible conditions were rewarded with four fingers on his left hand when he tried to unionize, courtesy of Saudi thugs. However, the two years of service under the CIA to train Saudi dissidents could bear some fruits other than a mutilated hand. The dream of a free Arab nation seemed to be closer than ever.\n\nAs the recruits retired to their quarters, he was approached by Nasir al-Sa'id, leader of the Arabian People's Peninsula Union. Nasir introduced Ahmed to the US government when both escaped the country. \"So, are these boys ready to bring me the head of the King?\" asked Nasir filled with optimism. \"They are improving. Maybe we can spark a revolt after we deal with the coastal defences. But what we are going to do with the Americans once we take over? The CIA doesn't look a charity organization to me\" remarked Ahmed. Nasir laughed confidently \"Remember the oil wells, my friend. We'll have what they want\" Ahmed wished on that moment to have the confidence of his leader. \"Anyway, what's for dinner?\""
 OIL.507.t:0 "The Landing"
 OIL.507.desc:0 "The amphibious boats were shaken by the strength of the waves of the Red Sea. While trained for these kind of situations, some of the soldiers couldn't avoid being affected by sea sickness. The D-Day was finally here. Even Nasir himself was struggling to stand on the balcony of the transport ship USS Lawrence of Arabia to address his men a last time. \"Brave soldiers of the Arabian nation. You are about to embark on a crusade to liberate our oppressed brothers and sisters from the tyranny of the Monarchy\" screamed from his megaphone. The sound of a Douglas B-26B cut through Nasir's speech. Ahmed interpreted this as a bad omen. Shouldn't the Americans have neutralized the Saudi air force by now? It is vital for the success of the operation that their paratroopers can land unopposed. The pilots that the CIA offered for ground support weren't doing their job properly\n\n\"As we enter our decisive battle, the enemy will fight fiercely to protect the privileges of the King and his cronies\" continued Nasir in a louder voice. Once again, the speech of the revolutionary leader was interrupted this time by the loud noise of Saudi anti-aircraft artillery. From the ship, Ahmed could guess that probably were old WW2 models. \"But this battle will be the founding stone to build a future for our child...\" Suddenly, a company of five old German tanks started to fire the freighters from the beach. Ahmed wondered if the Nazis were the reason behind the Saudis being so well informed of the operation. Probably aware of this, Nasir couldn't hide the anger on his face. \"You know what? To hell with this. Let's get to Riyadh right now. Glory to the Arab people!\" The rest of Ahmed's squadron cheered raising their fists into the air. Ahmed felt like this was the highlight of his life. The battle for the fate of Arabia was about to begin."
 OIL.507.a:0 "See how things unfold."
 OIL.508.t:0 "Arabian Nights"
 OIL.508.desc:0 "As the moon appears over Dammam, the corpses of the rebels decorate the beaches of Tarout Bay. The dream of a free Arabian nation shatters under the heavy fire of the machine gun nests. In the confusion, the commandos that were supposed to take them out fled on disarray. The remaining men were barely able to hold on the pier. The USS Scheherazade was supposed to bring more supplies, but now is part of the seabed. But when you are outnumbered 10 to 1, supplies don't make the difference. It was a miracle that they even lasted a single day. \"You were right this whole time, Ahmed. The Americans only used us as bait\" exclaimed Nasir with despair. Ahmed was desperately holding the wound of his friend. Just twenty-four hours ago, he was joking about putting the King's head on his wall. \"I don't lose hope yet. Maybe the Arab people revolts against the Saudis or maybe Nasser invades the region. Either way, I don't want this scum to get away so easily\". There was nothing Ahmed could do anymore. \"Honestly, I should have stayed in Egypt\" exhaled Nasir for the last time.\n\nAhmed made the proper military salute thinking of how everything went wrong. He cursed the CIA for sending them to this deadly trap without proper training. How could he expect that the people that got their asses kicked by the Germans knew something about warfare?The noises of approaching steps on the sand filled Ahmed with enough determination to avenge his fallen comrades. The Arab officer grabbed his machine gun for a final confrontation with the Saudis. After all, it was a better end than being beaten to death by strikebreakers for a minimum wage. As a dozen of soldiers started to flank him, he prepared to fire. And then the unthinkable happens: his gun jammed. \"You Yanks greedy pieces of shi...\""
 OIL.508.a:0 "The end of a beautiful dream."
 OIL.509.t:0 "Breakthrough"
 OIL.509.desc:0 "As mid-night covers the city of Dammam, the Arab exiles leave behind the bodies of Saudi soldiers and the burning wrecks of the old German tanks on the beach. While receiving some important casualties along the way, the paratroopers managed to effectively neutralize the enemy machine-gun nests. The USS Scheherazade unloaded the necessary supplies that will soon be necessary for a long march through the desert. Nasir had his doubts about the effectiveness of the equipment given but they did he job just fine. Enough to curbstomp the poorly trained Saudi militiamen and take control of the entire island. The reconnaissance patrol informed him of the apparent last Saudi holding point: the Tarout Castle in Qatif. Apparently, the Saudis made their gamble for a last stand on the ancient fortress \"The past is a perfect place for these rats to hide\" commented Nasir jokingly.\n\nFrom the top of a M26 Pershing, Nasir guided the advance towards the old castle but the Saudis made no attempt at defense. No artillery or machine guns could be seen at the top of the building \"They want to surrender already?\" asked Nasir to himself. A group of soldiers came from the ruins. \"Lay down your weapons now!\" screamed one of Nasir's men as they aimed their guns. It was then that they recognized the uniforms of the men coming through the doors: they were their guys! \"So, when we are going to Riyadh?\" joked Ahmed. A burst of cheers and laughter came from Nasir's squadron. Ahmed already foresaw the possibility of the Saudis entrenching on the fort, so he made sure to occupy it beforehand. The few unfortunate Saudis that tried to take it where put down unceremoniously. \"You scared me the shit out of me, you magnificent bastard\" expressed Nasir laughing."
 OIL.509.a:0 "Today, the Arabs won, but... for how long?"
 OIL.510.t:0 "Operation Checkmate After-Action Report - Failure"
 OIL.510.desc:0 "\"Unfortunately, the results of Operation Checkmate ended up being underwhelming. Even with aerial support, the rebels were unable to break through the coastline. Of the 834 men we send to Dammam, at least 615 are dead or missing in action. We are not sure if the remaining Arabs could confess about our involvement under torture, as it would depend on their grade of fanaticism. Of the 46 American pilots assigned to the operation, we only lost 3. One fell into enemy lines, but we don't know if he used the cyanide capsule assigned to him. One of the big factors behind the failure was underestimating the position of the enemy. The Saudis were well prepared to reject the invasion. Is very likely that they were informed by the Germans but we don't discard the possibility of an Italian double -crossing behind our backs. The reason for this is unknown to us. We also overestimated both the ability of the paratroopers to neutralize the enemy's fortified positions and the discontent of the population with the current Saudi government\"\n\n\"A full and detailed analysis of the military and logistical failures of Operation Checkmate is on its way. These kinds of mistakes won't be repeated. Especially with the threat of fascism growing around the globe every day. In relation to the Saudi government, small scale operations could allow us to hit the Saudis more effectively\"\n\nPresident [USA.GetPresidentLastName] closed the file containing the CIA's report of the operation, covering [GetHerHis] face of disappointment. After the failure of Operation Checkmate, the CIA were on full damage control to eliminate any trace of the American involvement in the operation. \"Maybe the CIA doesn't need such a free hand in this kind of issue anymore\", the President thought."
 OIL.510.a:0 "This is a waste of resources and time."
 OIL.511.t:0 "The Long March"
 OIL.511.desc:0 "The long caravan made his slow and grinding advance through the harsh Arabian desert. The initial optimism of Tarout Bay seems to fade away as the endless sea of sand takes its toll on the revolutionary army. Thirst and disease wreak havoc on the forces of the Arabian People's Peninsula Union. Even the strongest fervour can't break the relentless strength of nature. Nasir's calculations that the population would rise up in revolt proved to be naively optimistic. While some people from nearby villages have collaborated and even joined him, the majority of the Saudis has remained loyal or neutral at best. On this dire situation, Nasir called for an emergency reunion of his military staff. \"It looks like we have overestimated our own capacities for a quick takeover of the country\" admitted Nasir with sorrow. The sand-filled wind hit the faces of the Arab officers relentlessly. \"We have been advancing for two days and we are still two-hundred kilometers away from Riyadh\"\n\n\"Ahmed, what's the state of our forces?\" asked Nasir. \"We lost a third of our men, Sir. If you are referring to the morale, well...\" Ahmed stopped for what it seemed like an eternity. He knew like anyone else on that improvised tent that they didn't stand a chance against the reinforced garrison from the capital. \"Look, I'm gonna honest. If we send our men against the King, they are gonna be slaughtered. They have been marching through the desert for days\" bluntly admitted Ahmed. An awful sensation of impotence stroke the rebel leader like an arrow through his chest. His army losing his morale was what it hurt the most. If his own men lose the faith on the cause, what is even to point to continue? Nasir took a small sip from his water bottle to refresh his mind. \"Ok, how many supplies do we...\""
 OIL.511.a:0 "......"
 OIL.512.t:0 "Ambush!"
 OIL.512.desc:0 "Nasir wasn't able to finish his sentence. A loud noise was heard followed by the appearance of a huge red dot on his forehead. He then dropped dead over the desk making a huge pool of blood. A myriad of bullets started to hit the rebel camp as Saudi scouts advanced from their hiding spots in the dunes. \"An ambush! Take cover now!\" screamed Ahmed. The desperate screams of the other Arab rebels could be heard from the distance as they were being hunted down one by one. While Ahmed managed to take cover behind a truck, the other members of Nasir's staff weren't so lucky as they were gunned down. The Saudis managed to track them somehow. They probably noticed the two soldiers that went asking for water in a nearby village.\n\nAfter experiencing the taste of victory at Dammam, Ahmed's revolution shatters in a million pieces. But he wouldn't go without a fight. \"You Saudi bastards! You'll have to go through my cold dead body!\" screamed Ahmed with fury as he gunned down a dozen of Saudi militiamen coming towards him. While he probably wouldn't be able to make a difference, he at least will send to hell as many Saudi lapdogs as he can. The death of his brothers in arms won't be in vain. Caught on his own thoughts, Ahmed didn't notice the Saudi sniper aiming for his back."
 OIL.512.a:0 "A farewell in despair."
 OIL.513.t:0 "Operation Checkmate After-Action Report"
 OIL.513.desc:0 "\"Despite some obstacles, the results of Operation Checkmate have been satisfactory. The rebels managed to successfully break through the beach defenses of the Saudis and occupy Tarout Island. They only lost 20% of their total forces on the landing, facilitating the penetration in Saudi territory. We only had one of our own pilots missing in action when he fell on the Red Sea. The success of the initial landings can be attributed to their prior training in airborne operations. However, the rebels started to experience real setbacks once they advanced through the countryside. Their attempts to reach the population for support have been warm at best. Also, their supplies started to run out once they entered the Arabian desert and the continuous harassment by Saudi forces only worsened the situation. So, it's no surprise that most of them were annihilated by the Saudi army. At this point, we lost any contact with the remaining rebels but they are not our problem now.\"\n\n\"Nevertheless, the impact on Saudi Arabia is what matters. The fact that a bunch of Arab rebels were almost able to reach the Saudi capital is very likely to cause some turmoil inside the Saudi government. We don't discard smaller scale operations to support more moderate faction on the subsequent infighting\" President... closed the file containing the report of the operation. It was a competent plan that gave a fair amount of good results. \"I think these kind of endeavors are more effective than expensive military adventures.\" the President thought \"If I know what the CIA is doing, they seem to be capable of doing their job pretty well.\""
 OIL.513.a:0 "Satisfactory results."
 OIL.520.t:0 "Operation Checkmate Backfires"
 OIL.520.desc:0 "At first, the stories regarding the failed Arab Nationalist invasion of Saudi Arabia were in the back pages of the newspaper, and maybe a short news article on the Evening News. After all, it was some Arab nationalist movement with a funny name trying to overthrow an oppressive kingdom in a far away land. There were more important things to worry about, such as the Oil Crisis.\n\nBut today those same newspapers now had it on the front pages, and TV networks were interrupting the news to reveal that the invasion was actually orchestrated by the United States' own Central Intelligence Agency, an attempt to get Saudi Arabia to accept American demands for the precious oil. Leaked reports showed that an insufficient investment into the rebels by the CIA, as well as failures in logistics, intelligence and training, all lead to the failed attack on Tarout Bay, near the epicenter of the Saudi oil industry.\n\nAmericans across the nation are furious: some are angry that we sponsored \"terrorists\" to overthrow a foreign government, others are livid that we have let these brave \"freedom fighters\" down in their quest for autonomy, while yet more are ashamed at America's naked aggression and underhanded dealings that seemed more like something that would be cooked up in Germania or Tokyo, not Washington. President [USA.GetLeader], nor his administration, have yet made a comment about the attack, while the government's enemies in Congress and newsrooms across America are calling for heads to roll.\n\nAll in all, Operation Checkmate will go down in American history as one of the most ill-advised, lackluster secret operations ever conducted by our nation, worsening relations with our friends and making us a laughing stock to our enemies."
 OIL.520.a:0 "My chess skills are lacking."
 OILflavor.1.t:0 "A Lesson in International Relations"
 OILflavor.1.desc:0 "The sound of meticulous strokes, lines, and slashes subsided, leaving the lecture hall's board covered by a chalk impression of a map of the so-called \"Mittlerer Osten\", the Orient, that mess of Imperial borders that so recently exploded in a spectacular burst of flames known only as the \"Oil Crisis\", and the current object of the Reich's foreign policy. Arrows and annotations denoted the various conflicts taking place in the region.\n\nAs this was indeed a course on foreign policy, the professor grasped onto Germania's policy towards the Middle East as an excellent case study in realpolitik of the most sophisticated kind. \"Now, class. Why on earth would the Führer see it fit to support the Ba'ath?\" He asked, adding yet another line on the board to emphasize the words \"Arabische Sozialisten\".\n\n\"Because they represent the interests of the Aryan race in the Middle East?\" A student in the front row answered, thinking out loud.\n\n\"Well, there is an ongoing academic debate as to what degree of honourary Aryan the Arabs may aspire to reach but no, they are not considered Aryan. Expand your horizons.\"\n\n\"Because... they support the noble ideas of National Socialism!\" Came the reply, this time from a female student further back.\n\n\"Their 'Socialism' is particularly lacking in racial awareness- and even then would only represent the sight of an occupied and inferior people for some sick brand of justice. Not it.\"\n\nThis line of questioning was apparently more demanding than the professor had previously imagined. After the fifth incorrect attempt, he suspected that even he had started doubting the reasons for German involvement in the Middle East - a dangerous prospect. An academic in the Reich's upper echelons only survived by virtue of interpreting the actions of the regime in the right way; not by questioning them. Aware that his silence drew more suspicions by the second, he loudly interrupted a student in the middle of struggling to relate the current civil war in Egypt to the crusade of Frederick Barbarossa with what he assumed was the answer the Volkshalle was least likely to dislike."
 OILflavor.1.a:0 "\"Oil! It's about the damn oil!\""
 OILflavor.2.t:0 "On Empires"
 OILflavor.2.desc:0 "Walking down the ruined streets of Damascus was surreal. Ancient houses were blown with shell-holes, the walls of churches that had once served worshippers from extinct denominations were visited by bullet wounds... and all of this in one of the less wartorn countries of the Middle East. Thomas Ward could scarcely hide his awe. The local translator assigned to him - a deeply cynical man in Ward's eyes - must've noticed. Pressured to fill the silence with something, Thomas went on one of his impromptu speeches. He was planning to write about this visit, after all. Better rehearse what he was going to send to the New York Times.\n\n\"Now what you see here is the result of a minor skirmish in the grand scheme of things, right? A minor skirmish compared to what's happening in Baghdad, Cairo- Hell, Aden! And yet, it's horrific. There is no explanation!\" The man beside him hardly stirred, which he took as a sign to keep talking\n\n\"Some say that Syria has been spared the worst of the Crisis- I can't say that in good consciousness as I stand amidst the results of a small standoff between government forces and a single armed resistance group. You know, perhaps the country was spared for a reason. The Turks were notorious for their violations of human rights in the region, going as far back as the old Ottoman Empire- and the new Italian Empire somehow made them look kind. Many may have forgotten the Italo-Turkish War. The Second Italo-Turkish War, that's a distinction most people don't bother to make, but I was here! This Age of Empire has had an incomprehensible effect on the people of the country-\"\n\nThe translator cut him off. \"And it's not going to be over anytime soon.\"\n\n\"Why, the Germans are in shambles, hardly able to look away from Europe. The Japanese regime is cracking under the weight of its own bloated leadership.\"\n\n\"There is another such Empire. I'm not here to accompany an agent of the Germans or the Japanese, am I? It is the same power that funded the 'resistance group' that did this.\" The man gestured at a nearby pool of blood."
 OILflavor.2.a:0 "They spent the rest of the walk in silence."
 OILflavor.3.t:0 "To Beirut, with Peace"
 OILflavor.3.desc:0 "Christopher Booth had seen much fighting in his time. He'd borne witness to the Pacific Theatre, been right there on the ground in South Africa, and even spent two months deployed to Indonesia as an adviser to pro-OFN forces. The Marines had made a man out of him, and he was henceforth sent around the world on a mission to do the same to other men. Being sent to Beirut to train a local volunteer force was practically a vacation.\n\nOne look at the two dozen men he was here to give basic training to did nothing to dispel that notion. Most spoke some French, good. Some spoke English: Great. Best of all, most of the youths came from the same part of the city. For once, he considered his deployment a lucky choice...but, as they had an annoying tendency to do, problems soon arose.\n\nHe did not know nor care what a Maronite was, but the apparent presence of one in his unit made two other men uneasy and an argument broke out as soon as they were left unattended. He'd seen that before, southerners and South Africans uncomfortable at serving beside a man of a different skin tone, but the men involved in the argument were practically identical. Worse, it appeared that the incident had set off all sorts of invisible lines between the men. Maronites, Muslims, Shias, Sunnis, even Armenians (How did the Armenians get there?) all supposedly featured in some quantity. Perhaps the biggest mistake he made was asking just why those two Sunni troops felt it necessary to start a fight with one of the Maronites: That set the entire group off on a debate in four languages on family feuds, 12th-century crusader states, and obscure religious movements.\n\nIt was all too much. After 30 minutes of this circus, Booth decided to send the men back to their barracks and in separate groups- god forbid they see each other on the way back. The problems of this part of the world seemed entirely alien to him, and no one at the embassy was going to be of any use until his service here was up. Very well, Beirut may not end up being quite the vacation."
 OILflavor.3.a:0 "Let's...try again tomorrow."
 OILflavor.4.t:0 "A Rainy Day Fund"
 OILflavor.4.desc:0 "Tahara Katsumi was not a fan of this \"Oil Crisis\" that had descended upon the world. Cycling to work to ration fuel was the least of it (though the unanticipated cost of the bicycle did put a dent in his monthly income). The factory managed, a part of the Toyota Industries' supply chain, was in worst shape than he'd ever seen before: Late deliveries, lacking equipment, absent-minded employees, and every report from company higher-ups bringing worse news than the last.\n\nThis month's report understandably put a smile on his face. While the Crisis had harmed nearly every part of Japan's economy in some way, the time for a turnaround had come. Due to what the report could only attribute to \"a variety of purchase orders from unknown groups across the middle east,\" Toyota's vehicle orders had skyrocketed and so did the factory's projected revenues. At last, a ray of sunshine managed to sneak in through the rainclouds.\n\nOnly after reading the report from front to back did he realize that it made no mention of alleviating the issues faced by the factory. The only conclusion he could draw is that they would somehow need to meet this surge in demand with the already limited means they were working with. The rainclouds had decided to close ranks after a brief shuffle.\n\nKatsumi was a resourceful man. Rainclouds or sunny day, this would need to be done. Immediately two options presented themselves. It was an open secret that most workers could not cope with the increased expenses multiplied by the crisis. Up until now, this was considered irrelevant to the running of the firm, but would most workers refuse longer hours if it means a chance to pay their bills? He reasoned they would not. On the other hand, he maintained a long list of connections to tap into on such a rainy day. Normally his lack of faith in the quality of outsourced tasks would prevent him from opening that drawer, but hard times called for hard measures, and the final product would be shipped thousands of kilometers away. After weighing the costs and benefits of each choice, it was decided that:"
 OILflavor.4.a:0 "The workers will be grateful for longer hours."
 OILflavor.4.b:0 "Outsourcing is the method of the future! Go down the list."
 OILflavor.5.t:0 "Déjà Vu"
 OILflavor.5.desc:0 "It had not been more than two days since Joachim and the German volunteer army under his command first arrived onto the shores of Hudaydah under the auspices of \"humanitarian aid\" sent to relieve the wartorn people of Yemen from their continued anguish, yet it felt as if an eternity had passed. There was nothing to do in this hellhole other than stay in the shade of the camp and glance at the mountainous desert landscape that lied outside, or stroll out the camp's door and succumb to the scorching sun above them. Joachim might have served through similar conditions under Rommel's command during his tenure on the North African front, yet he was no longer the same man he was three decades ago.\n\nHe was a shell of his former self, his bones creaked, his muscles ached and he could hardly take a stroll without running out of breath; he was stricken by the ills of old age, the same ills that he once mocked in his youth. That was not the only thing to change, the looks that the Arabs gave him were now ones of distrust and rage, not the cheers and salutations that accompanied the German victories in the middle east during the war. Back then he had read some local papers with the little scraps of Arabic he had learned in Libya and had seen images of celebration and earnest belief in a coming renaissance for the Arabs. They had welcomed the German army as liberators, an iron phalanx sent by God to avenge their subjugation, to strike fear into the hearts of the colonisers and throw off their foreign yoke, unleashing the Arab people from their shackles.\n\nBut come to the end of the war and the collapse of the Anglo-French empires, that bubble of euphoria would rapture as the Italian phoenix and the Turkish mob, aided by the Germans, descended onto the carcases of the fallen empires and chained these aspiring countries to their own rising empires. After all, that was the natural order of things, the uncivilised and backwards races would forever serve their more refined, European masters.\n\nAt least that was what Joachim always believed, yet now he was here serving at the hands of Arab independence rebels wishing to break free from the Italian protectorate, why and for what reason? He did not know, yet it was the Führer's command- and the ever-wise Führer, infallible as he is, was surely correct in his motives and plans. His line of thought was interrupted by the sudden arrival of a stern-looking Arab calling on him to attend to an envoy arriving from Germania."
 OILflavor.5.a:0 "Betrayal, or retribution? The Arabs do not know."
 OILflavor.6.t:0 "The Dispatch from Cairo"
 OILflavor.6.desc:0 "CAIRO, EGYPT- \"Regimes in the Middle East these days look like an old rotten tree. Many are wobbling, but it's hard to predict where they'll fall. Here in Egypt, the situation is no different. Inspired by uprisings in neighboring countries, citizens in Cairo this week took to the streets to protest a government that they claim is more beholden to Italian interests than their own. The unrest-.\"\n\nA loud, phlegm-filled cough forced Mark Daniels, Chicago Tribune, to look up from his portable typewriter. Standing before him, in the cramped hallway of his hotel, was a man dressed in the uniform of an Egyptian palace guard. In the corner of his mouth was a large cigar. He removed the cigar and made another guttural noise with his throat. \"You the American asking around for...\" He twirled the hand holding the cigar. \"Sources?\"\n\nMark gave a confused smile. \"I'm on a deadline but, uh... yes. Of course. You are?\"\n\nThe man stuck the cigar back into his mouth. \"I can get you in the palace for thirty American dollars.\"\n\nMark Daniels blinked. He blinked again. \"Do you have any idea how many people I've had to bribe already today? The taxi driver was going to let some religious fanatics kill me unless I gave him five bucks. A police officer outside threatened-.\"\n\n\"Twenty American dollars for a big-time scoop, as you say. No one else has this offer,\" said the man. Based on the expensive cigar, Mark somehow doubted that was true. \"Maybe bring a photographer and five extra dollars and you can get some nice photos for your bosses.\"\n\nMark massaged the bridge of his nose. The Tribune's accounting department was going to kill him for subsidizing the income of every crooked guard, policeman, and bureaucrat in Egypt but they knew how to get sources and he wasn't about to lose out on an exclusive to the fucking Times. He set down his typewriter and took out his wallet."
 OILflavor.6.a:0 "I'll give you ten bucks. That's final."
 OILflavor.7.t:0 "Color Wars"
 OILflavor.7.desc:0 "Only the Arabs could fight over a parking lot, Toshiro thought. He and his fellow advisors were standing near downtown Baghdad in a wealthy neighborhood. Beside them, was \"Ghazi bin Faisel Square,\" or at least that's what a faded, scratched-out inscription seemed to read. Below that name was \"Abdul Karim Qassem Square,\" then, painted over that, \"Michel Aflaq Square.\" The entire parking lot seemed to have been consumed by rival factions of painters, each group determined to claim the small lot for themselves as the cars inside it grew more and more deteriorated.\n\nToshiro sighed and tried not to think through the implications of the state of the parking lot. \"Gentlemen, we are here to represent the Co-Prosperity Sphere here in Iraq today,\" he said, looking over at his colleagues. \"It is essential that these Arabs see us as an inspiration, liberators. Just as the Asian people were shackled by Western powers and unnaturally divided, so too are the Arabs. Under the guidance of Japan, the people of Baghdad can become strong, free, and-.\"\n\nHe broke off as one of his associates tilted their head pointed behind him. Toshiro turned in time to see an angry man with a paint bucket enter the parking lot. He was staring furiously at the wall labeled \"Michel Aflaq Square,\" the same wall that Toshiro had parked his government-issued car beside. By the time he realized the man's intention, he was already opening the tin. Toshiro let loose an angry yell as blood red paint soared through the air."
 OILflavor.7.a:0 "Well, at least the car can still drive."
 OILflavor.8.t:0 "Smokers' Seating"
 OILflavor.8.desc:0 "The inside of the limousine seemed not unlike a beehive to Wilhelm, feeling nearly identical to a hive that would be suffocated in smoke to silence the bees within. Taking another puff from his cigar, the arms representative chuckled. The chauffeur looked back to Wilhelm holding a wide grin on his face, looking more out of curiosity than anything and stuttered as they met eyes.\n\n\"H-He should be here any minute now, Herr Strik.\" Wilhelm smiled and nodded to the man, and took another puff on his cigar. With that, the presumed representative of the Ba'athists knocked on the window, climbed into the car, and took a seat next to his fellow guest in the city of Sofia. \"Herr Strik, tell me, do they still allow you to smoke this much in Lufthansa?\" Wilhelm held out his cigar box, which the Arab opened graciously.\n\n\"Of course not, Herr Ahmad! This car alone must be only second to the smokestacks in the east, no?\" Ahmad smiled, a look of discomfort coating his face as he leaned back in his seat. \"Don't worry, the Ba'athist cause is one which seems to fall directly in line with the Reich's, therefore you're the safest men on the planet.\" The tension in the room lifted, even if the smoke hadn't, and Ahmad removed a stack of papers from his briefcase.\n\n\"First order of business, how much can we count on you in terms of providing us with firearms?\" Wilhelm scoffed at the question and put on a smirk over his raised eyebrow.\n\n\"Ahmad, Germania backs our cheques from here to kingdom come, this is only really a matter of how confident you are you can put the guns to good use. How many in reserve?\" The question seemingly slapped Ahmad, though he was clearly hiding his glee if the slight smirk of his own said anything. \"At least a few dozen thousand, I'd say around 100,000 last I checked?\""
 OILflavor.8.a:0 "\"Consider it done. Expect results in the coming months.\""
 OILflavor.9.t:0 "A Beautiful City, Courtesy of Japan"
 OILflavor.9.desc:0 "The view of Riyadh itself was beautiful; the countless hovels and homes which made up much of the view all held the same consistent style, the yellow-beige sand that peppered everything which seemed so reminiscent of his own home providing only further detail for the trained eye to identify. With his Saudi hosts running late, there was little else to do, after all.\n\nGlancing at his watch for the umpteenth time, it was only then that the government representative waltzed through the doors, seemingly entirely unaware of his own delay. As the Saudi met eyes with the Japanese representative, shining a smile which seemed as wide as the gulf itself, Ino Takahashi bowed, met with the same gesture from the man who had seemed as though he was having his first interaction with anyone from the world beyond Riyadh at this very moment.\n\n\"Mr. Takahashi, it is a pleasure to be in your presence; I take it your trip was a pleasant experience?\" The man was dripping with sweat, heavyset and fitting the stereotype of the eager-to-please middle eastern lapdog to a T, the Saudi gestured to the pair of chairs that had sat next to the wonderful view.. Taking their seats, Takahashi placed his briefcase on the table, opening it to a wide array of manilla folders and paperwork.\n\n\"Riyadh is quite beautiful, and as according to your economic growth prior to this period of instability, it had plenty of reason to be, certainly not hurt by the Empire's investments.\" The two chuckled, Takahashi the only one certain of which empire he had been speaking of.\n\n\"Yes, Mr. Takahashi. Now, I'm sure you are aware of the threat which many of our neighbors pose to us, no? Ba'athism stands to destroy us, internally and externally, as we have seen happen to a great many of those neighbors.\" Another bead of sweat appeared on the man's forehead, even if he sat nearly perfectly still otherwise."
 OILflavor.9.a:0 "\"Of course, Mr. Tahir. Nothing you should worry about in the least.\""
 OIL_USA_intervention:0 "America will be directly drawn into the Oil Crisis.\n"
 OIL_USA_no_intervention:0 "America will provide indirect aid to Italy during the Oil Crisis.\n"
 OIL_investment_will_grow:0 "§LOur investment in the Middle East will grow.§!"
 OIL_USA_prointerventionist:0 "America supports intervention."
 OIL_USA_antiinterventionist:0 "America opposes intervention."
 USA_decisions_ITA_oil:0 "This will unlock decisions to send aid to Italy."
 USA_decisions_ITA_oil_2:0 "This will further unlock decisions to send aid to Italy."
 OIL_USA_send_money_to_italy:0 "This will let us provide direct monetary aid to Italy.\n"
 OIL_USA_party_support:0 "For now, American intervention in Arabia will be seen as a wise decision."
 USA_Il_Duce_Disaster:0 "Il Duce's Disaster"
 USA_A_Company_Man:0 "The Company's Expert"
 USA_Starting_a_Fire:0 "Starting the Fire"
 USA_Blockade_the_Gulf:0 "Strangle the House of Saud"
 USA_Subvert_the_Pan_Arabists:0 "Subvert the Pan-Arabists"
 USA_Feeding_The_Flames:0 "Feeding the Flames"
 USA_Sun_Never_Rises:0 "The Sun Never Rises"
 USA_Preparing_The_Coup:0 "A Just War"
 USA_Operation_Checkmate:0 "Operation Checkmate"
 USA_The_Fire_Rises:0 "The Fire Rises"
 USA_Il_Duce_Disaster_desc:0 "Mussolini's been dead for over a decade, but the father of fascism is still giving us more trouble than any dead man except Adolf Hitler. Ciano's mismanagement of foreign policy and the Italian Empire, the turmoil stirred up by the transition to democracy, and the incompetence of the Italian colonial administration has led to an explosion of chaos in the Middle East.\n\nThis would not be our concern except for two reasons. First, Italy is an extremely valuable ally with vast influence over the Mediterranean, a powerful military, and economic ties to both us and our allies. Second, Italy's empire is one of the world's largest producers of oil, and the collapse of their colonial governments has dramatically destabilized the oil market. Both of these are reason enough to intervene, the only question is the nature of that intervention."
 USA_A_Company_Man_desc:0 "The days of \"clean\" and \"honorable\" warfare are over. Wars today aren't won by armies, they're won by subterfuge and dirty tricks, and if that means we have to resort to backstabbing and intrigue to beat the fascists, so be it. We're going to kick off operations in the Middle East soon, but before that we need eyes on the ground, and we've got the perfect man for the job.\n\nE. Howard Hunt is an expert in covert actions. He's a veteran of the Cuban operation and many other Central American operations, served as station chief in Mexico for a time, and has gathered a cohort of excellent operatives. Some of his methods are rather controversial among the CIA, but the results speak for themselves. If we want to get our way in the Middle East, he's the best the Company has to offer."
 USA_Starting_a_Fire_desc:0 "The Oil Crisis is going to get worse before it gets better. With every major international power having a stake in the crisis, we're going to need to make the situation unmanageable for our enemies while still staying in control ourselves. This means hiring local warlords and nomads, giving them guns, and turning them on the Saudis. This means giving as much support as we can to the Italian-backed regimes while making sure they don't slip from our grasp. This means getting our agents and advisors on the ground to ensure that the governments we choose are the ones winning.\n\nAgent Hunt and his men have their orders, and are beginning operations against German and Japanese-backed forces already. The Middle East will burn, that is certain; what is important is that we are the ones ruling the ashes."
 USA_Blockade_the_Gulf_desc:0 "There are two primary enemies for our Italian Allies to deal with, and the most internationally connected one is the Saudis. Thousands of barrels of crude oil are shipped from their ports every day to refineries around the world, making them one of the richest countries in the world. This artery of oil can be cut by the US Navy, however, and if it is the Saudi economy will suffer greatly. Once we cut off Saudi oil shipments, they will be forced to submit, sooner or later."
 USA_Subvert_the_Pan_Arabists_desc:0 "The Ba'athists are a dangerous group, insisting on forming a separate power bloc in the Middle East based on Arab nationalism and an extreme distaste for Western powers interfering in their affairs. Fortunately, they are scattered and indecisive, with weak leadership and constant internal squabbles. By bribing the right people, funding the extreme members of the movement, and bombing campaigns against their key military centers, we can significantly weaken their ability to fight off the Italians."
 USA_Feeding_The_Flames_desc:0 "Well-meaning diplomatic rhetoric can only take us so far. Our moral support for Italy must be backed by military aid, or it is meaningless. Italy is not entirely defeated, but progress in restoring control over the Middle East has been glacial. Colby reports that, due to their mishandling of the crisis, undercurrents are stirring within the Italian government. If we want to keep Italy in our sphere of influence, military intervention is required."
 USA_Sun_Never_Rises_desc:0 "Japanese access to oil has been a cornerstone of their foreign policy for decades. Ever since Hirohito took the throne and the fascists took the country, they've been looking for ways to get oil to feed their tanks and especially the Imperial Japanese Navy. Now that one half of the Middle East is fighting the other half, the Japanese have a perfect opportunity to back a winner and gain access to a reliable and plentiful oil supply.\n\nThis is, of course, absolutely unacceptable to the United States government. Admiral Holloway has proposed a plan to expand the Gulf blockade to include interdicting non-Saudi, international ships. While it will require additional resources, Holloway's plan should reliably keep any Japanese support out of the region, an important step to reestablishing Italian control."
 USA_Preparing_The_Coup_desc:0 "From the dawn of history, the Middle East has been a breeding ground for corrupt and despotic kingdoms. Saudi Arabia is no exception. This is a brutal dictatorship, a haven for Islamic extremism, and good God, they still retain the backward custom of cutting off thieves' hands! This means our struggle against Saudi Arabia will be a great war of liberation, freeing the oppressed Saudi people and lighting a beacon of democracy on the dark soil of a hereditary despotism. Oil? Merely a small bonus."
 USA_Operation_Checkmate_desc:0 "The House of Saud may have total control over their country, but not everyone is satisfied with their current method of governance. Our intelligence services have made contact with Nasser al-Said, leader of the Arabian Peninsula People's Union, and have made him an offer he cannot refuse. We have drawn up a plan to fund his organization to overthrow the Saudi King.\n\nThe chances of this plan actually putting Said in control of the old Saudi Arabia are quite low, but the chances of stoking anti-Saudi sentiment to destabilize the regime are quite high. The CIA is confident in this plan, and Director Helms is requesting we approve it as soon as possible."
 USA_The_Fire_Rises_desc:0 "Across the Middle East, oil fields burn. The fascist enemy raises flames, taking what does not belong to them. Pan-Arabists and Saudi armies fight each other, while our Italian friends struggle to restore peace and order here.\n\nEven so, peace is but a dream. The black gold beneath the sand calls to the superpowers, and the heart of the Middle East burns. We can only hope that when this catastrophe ends, we will control the region... at the very least, ensure our rivals do not."
 USA_Naples_Conference:0 "Naples Conference"
 USA_Naples_Conference_desc:0 "The crisis that has gripped the Middle East, and now the world, must end. There is simply no other way about it. But our people are tired of foreign excursions. The memories of our boys coming home in body bags from South Africa, Indonesia, the Philippines, West Africa, Malaya, and more have turned our people against these crusades against the fascist menace.\n\nBut there is another way to end this crisis in our favor. The Italians, ever so desperate to regain their power over the region, are the \"perfect\" allies for us. We will provide them with everything they need - cash, equipment, moral support - anything and everything to end the Pan-Arab threat and restore order to the Middle East."
 USA_subsidize_the_Italians:0 "Subsidize the Italians"
 USA_subsidize_the_Italians_desc:0 "While it may seem scandalous, even traitorous, to consider supplying Italy with funds, the OFN is left with no other choice; the Italian economy is on the verge of total collapse. Without foreign aid, all the nations that rely upon Italian oil interests will be brought down with them. As such, every nation must pitch in something, be it hard currency or soft- anything to keep the Italians from falling further into the abyss of economic depression. The deliberations of the Naples Conference have made it clear: Italy needs help, and the OFN needs to supply that help. Funding will be relatively inconsequential at first, but, as time goes on, it is a near certainty that the Italians will need more money to save themselves, and the United States of America will have to provide that money. If the Italians go down, they may well bring the entire Free World down with them."
 USA_Seen_And_Not_Heard:0 "Bolster Their Forces"
 USA_Seen_And_Not_Heard_desc:0 "In most of the Middle East, the Italians are down, but not out. At this very moment, thousands of Italian soldiers and Middle Eastern allies battle against the forces of OPEC and the Ba'athist insurrectionists. However, it is a losing battle; their supplies too few, their enemies too numerous. It is only a matter of time before the Italians are pushed out of the Middle East entirely; as such, the United States, as well as the OFN in general, must provide military assistance of some kind. No matter how dire the situation becomes, however, American troops cannot be openly sent to enforce the will of a hegemonic, fascist Italian Empire, so support is limited. We can only send support in the form of small arms, equipment, military attachés, and so on."
 USA_Bail_Out_ENI:0 "Bail Out ENI"
 USA_Bail_Out_ENI_desc:0 "ENI, or the Italian State Hydrocarbons Corporation, is the primary supplier of oil to most Western nations. As most of the Middle East has erupted in anti-Italian civil war or joined OPEC and halted oil exports, ENI's stock has plummeted, and the company has become the epicenter of the worst stock market crash in 20 years. At this critical juncture, for whatever purpose, ENI has gone bankrupt, and they have quickly filed for bankruptcy protection. However, if they do so, it will only make matters worse. To prevent a further collapse of global financial markets, we cannot allow ENI to go bankrupt. Since the Italian government is already mired in fiscal crisis, the American government must bail out ENI and show the world that everything will be alright."
 USA_Schwarzkopfs_Plan:0 "Schwarzkopf's Plan"
 USA_Schwarzkopfs_Plan_desc:0 "Colonel Norman Schwarzkopf is the top American military attaché in Italian-controlled areas of the Middle East. He participated in the South African War and is a veteran of the Indonesian campaign; this man has seen modern warfare and knows how to fight effectively. As such, he has prepared a plan for the Italians: concentrate main forces to drive deep into the Arabian and Egyptian deserts, shattering and encircling enemy forces. Furthermore, as the populace may be hostile to the Italian occupation, Schwarzkopf has envisioned an organization of garrisons and patrols to contain any potential uprising. Currently, Schwarzkopf's plan is a simple breakdown of offensive directions against the main enemies, with details yet to be worked out; thus, the Colonel needs Italian and American military assistance to develop a comprehensive strategic deployment."
 USA_The_Italian_Desk:0 "The Italian Desk"
 USA_The_Italian_Desk_desc:0 "Disguised as a State Department clerk, we have dispatched William Colby to Rome. This old fox has decades of espionage experience; if anyone can root out the rot in Italian society, it is him! Let's ensure he has the resources he needs to help convey to the Italian government information about extremist groups that could shake the state. If this intelligence and funding happens to flow into anti-fascist and pro-American parties, benefiting them in elections... well, as the Italian proverb says: when in Rome, do as the Romans do."
 USA_Taking_Back_Their_Empire:0 "Taking Back Their Empire"
 USA_Taking_Back_Their_Empire_desc:0 "The relationship between the United States of America and the Italian Empire has never been the most stable or friendly, but now cooperation is necessary. If the Italians fail, they will drag the entire Free World into the abyss. Oil prices soar, markets collapse, history repeats itself. This scenario must never come to pass, so America must fully and openly stand behind Italy and her empire. The people and press may grumble about supporting a former enemy, but without the black gold crude they provide, America would have no choice but to yield."
 USA_Cool_The_Lead:0 "Cool the Lead"
 USA_Cool_The_Lead_desc:0 "Colby has requested more resources to help de-escalate the roiling tensions within Italy. He believes that focusing only on underground fascist parties will not help calm the current unrest, nor is it in our interest. If Italy is actually taken over by the radical left or descends into anarchy, the possibility of German intervention is high. As such, he hopes these resources will help him infiltrate radical communist groups, extremist student organizations, and even radical feminist associations. He hopes to fund a \"backup\" network of democratic politicians and military brass; even if these ties cannot restore a democratic government, they can make life difficult for the new government. Let's give them what they want."
 USA_Peace_In_Our_Time:0 "Peace for Our Time"
 USA_Peace_In_Our_Time_desc:0 "It seems difficult to strike a balance between supporting the Italians' needs and a peaceful resolution, but we have quickly reached a compromise that we believe achieves both goals. We will send aid to Italy, even military aid. But military aid will only come in the form of instructors, medical units, logistics companies, and peacekeeping MPs; no Americans will appear on the front lines. We will show the world how we value friendship and our vision for peace."
 TNO_Oil_Crisis_dynamic_modifier: "§ROil Crisis§!"
 TNO_Oil_Crisis:0 "§ROil Crisis§!"
 TNO_Oil_Crisis_desc:0 "Daily political power gain: [?OC_political_power_factor|=%+0]\nConsumer goods need: [?OC_consumer_goods_factor|%Y0]\nStability: [?OC_stability_factor|=%+2]\nConstruction speed: [?OC_production_speed_buildings_factor|=%+2]\nFactory output: [?OC_industrial_capacity_factory|=%+2]\nDockyard output: [?OC_industrial_capacity_dockyard|=%+2]\nSynthetic oil: [?OC_production_oil_factor|=%+2]\nTrade agreement opinion modifier: [?OC_trade_opinion_factor|=%Y2]\nOil-to-fuel conversion efficiency: [?OC_fuel_gain_factor|=%+2]\nAnnual GDP growth modifier: [?OC_annual_gdp_growth_factor|=%+2]\nCost as share of GDP: [?OC_proportional_pop_cost|=%-2]\nManpower cost modifier: [?OC_personnel_cost_modifier|=%Y1]\n--------------\nRecently, with the collapse of ENI, global oil prices have entered a period of rapid fluctuation, and the conflicts sparked worldwide have seriously threatened the global market as a whole, potentially triggering a collapse.\n\nRegardless of ideology, nationality, or loyalty, economic experts around the world agree on one thing:\n\nOur only hope for economic survival is to §Yweather the storm§! and §Rpray for a miracle§!."
 TNO_Alt_Oil_Crisis_dynamic_modifier: "§ROil Crisis§!"
 TNO_Alt_Oil_Crisis_dynamic_modifier_desc:0 "ENI has gone bankrupt, global oil prices have soared, and the resulting conflicts have spread across the world, threatening the fate of global markets.\n\nEconomic experts, regardless of ideology, nationality, or allegiance, are unanimous:\n\nOur only hope for economic survival is to §Ybreak through the storm§! and §Rpray for a miracle§!."
 TNO_Oil_Crisis_reduce_effects_tooltip:0 "The effects of the §YOil Crisis§! will be §Greduced§!.\n"
 TNO_Oil_Crisis_remove_modifier_tooltip:0 "The §YOil Crisis§! modifier will be §Gremoved§!.\n"
 USA_Bolster_Their_Forces:0 "Ship Weapons to Italy"
 USA_Bolster_Their_Forces_2:0 "Send More Weapons!"
 OIL_USA_ITA_volunteers:0 "Italy will receive two additional divisions to help deal with the Oil Crisis."
 TNO_Oil_Crisis_dynamic_modifier_desc:0 "ENI has gone bankrupt, global oil prices have soared, and the resulting conflicts have spread across the world, threatening the fate of global markets.\n\nEconomic experts, regardless of ideology, nationality, or allegiance, are unanimous:\n\nOur only hope for economic survival is to §Ybreak through the storm§! and §Rpray for a miracle§!."
 OC_over_in_middle_east: "The Middle East conflict sparked by the §YOil Crisis§! has ended."

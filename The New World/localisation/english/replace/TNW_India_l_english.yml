 IND_blockade_2: "Moderate Japanese Blockade"
 IND_blockade_3: "Severe Japanese Blockade"
 IND_black_years_dynamic_modifier: "Black Years"
 IND_black_years_dynamic_modifier_desc: "Humankind's basic need for food does not stop because war breaks out. In the catastrophe sweeping India, this fact was first forgotten by the people, then remembered when stomachs are empty.\n\nThe subcontinent has suffered unprecedented waves of famine. The agricultural heartlands of Bihar and Uttar Pradesh have been severely damaged, with incalculable consequences: for every person who dies in the war, twenty more die of hunger. In the brother-against-brother fighting, villages across the nation wail and weep. If measures are not taken soon, the 'Black Years' catastrophe will not be limited to one nation but become a global tragedy - suffering unseen this century."
 IND_debug_superevent_remix: "Let's work it out in the remix"
 POLITICS_KM_CARIAPPA_DESC: "Kodandera Madappa Cariappa, a battle-hardened veteran, was never destined for a quiet retirement. Born in early 1899, he was the very model of a British Indian Army officer, barely switching sides as the Empire crumbled. When Bose's regime split the subcontinent, he commanded the Republic's armed forces, bearing the task of purging remaining pro-Bose elements from the military.\n\nHe took power lightly no more. As a diehard hawk, he rejected any compromise with Free India; yet this new loyalty had barely warmed before it froze: watching Menon give ground to Bose step by step, seeing the Jana Sangh win elections, until Savarkari expelled him from the ranks to purge the army, Cariappa finally led a coup at the head of enraged officers and disgruntled politicians, overthrowing Savarkari and taking the crown of Acting Prime Minister of India.\n\nNow standing at the apex of power in his second motherland, Cariappa's eyes carry the detachment of an old commander. He has no intention of staying long, but even less of being a mere ornament on the political chessboard. His term will inscribe two iron laws: the military as a state institution must be independent of the president, and never again will Savarkari's kind meddle with military power - no matter what the polls say then."
 IND_pandoras_box_1_desc: "Centuries-old ways of life continue. Farmers bend over the soil, laboring along the paths their ancestors trod. Villages stand intact, supported by the same rigid house of cards that maintains the social structure - a structure that has weathered empires' fall and dynasties' rise, from kings and ministers to gentlemen and lords, unshaken. India marches toward the future at a slow and steady pace, at least on the surface."
 IND_pandoras_box_2_desc: "An uneasy wind carries the scent of blood, tearing at the cracks in ancient foundations. Young men flock to the promise of work in the great cities; slums overflow; villages turn empty. Plots of land are torn from the plow and handed to the bulldozer; the old order is displaced and compensated, yet still lingers with the stubbornness of a thousand years. Upheaval is coming, but this is merely a replay of foreign history - and the tottering domed roof of cards will tenaciously survive amid the ruins."
 IND_pandoras_box_3_desc: "Bugles ring across the sky, and a grand campaign begins. Mothers see off their proud sons bound for barracks and battlefields with tears. The martial nations charge into combat; all the rest march into factories and the rear. Yet by now, the whistle of stray bullets and the shriek of dive bombers have begun to dissolve the ancient laws; as blood soaks the mud, only the cold-eyed soldier will survive."
 IND_pandoras_box_4_desc: "The war's bloody storm has gripped the nation's lifeline, devouring all yet still unsatisfied. Military families can give no more sons; the glorious line regiments are forced to recruit from the streets. Villages that once smoked with cooking fires are now scorched earth; shells spare no one, tearing flesh from bone. Survivors gaze at the world through blood-misted, shell-shocked eyes, and the old world's traditional rites now ring as nothing but a ghastly mockery."
 IND_pandoras_box_5_desc: "To hell with the old world's so-called traditions! We will march over our fallen comrades' bones into our enemies' bowels, twist their families into blood pulp, and bring the war to the halls they have lived in for generations. Slaughter those sweet-talking scoundrels - the priests and politicians who never watched their kin turn to ash. When the blood debt is paid, the scorched earth beneath our feet will, beneath our avenging army, become a promised land our own."

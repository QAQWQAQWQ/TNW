 IND_Indira_Gandhi: "Indira Gandhi"
 POLITICS_INDIRA_GANDHI_DESC: "Indira Gandhi was born in 1917, daughter of the illustrious Jawaharlal Nehru, and was no political novice. Though her childhood was lonely, she excelled in education and politics, actively participating in the Quit India movement during WWII. She later married Feroze Gandhi, another important Congress figure. Yet her ambition soon gave way to pragmatic acceptance of her background, serving as her father's private secretary.\n\nDuring Nehru's premiership, Indira accompanied him on numerous trips abroad, and India's diplomatic ties spread across the globe. In the late 1950s, she maneuvered herself into the Congress presidency. After Nehru's death, she entered the Rajya Sabha, and many Indians saw her as her father's natural successor. Though her ascent was brief, as Menon's star fell, Indira became his successor.\n\nNow Indira stands on the political foundation she inherited and fought for, the first elected leader in the history of a diplomatically unified India. Once, few had high hopes for her; gender and background made her seem a mere clumsy puppet, her father's proxy. She accepted these perceptions on her way to becoming Prime Minister, but she did not underestimate herself: Indira's ambition was beyond ordinary measure. She would become a supreme ruler, unchallenged, overseeing a well-functioning corporatist state. India for Indira, Indira for India."
 IND_Jagjivan_Ram: "Jagjivan Ram"
 POLITICS_JAGJIVAN_RAM_DESC: "In the history of free and independent India, no Dalit had ever risen so high - nor had any Dalit felt so powerless. Born in 1908 into a Jatav family, Ram organized anti-colonial gatherings and earthquake relief, earning Bose's favor. In 1935, he helped found the All-India Depressed Classes Association, becoming an ardent supporter of ending caste discrimination and advancing Dalit rights. When WWII broke out, he was a leading opponent of India's participation and was arrested for his condemnations.\n\nThrough the 1940s, Ram continued in step with Bose; but when India was split in two, he chose to part ways with Bose, siding with the Republic, slowly building his strength as a Dalit rights activist and Congress member. After the two Indias were reunified, his concerns about Indira Gandhi's government gradually hardened into aversion. With elections looming, Ram broke completely from the Congress, leading the Janata Front - a broad tent - to victory on his personal prestige.\n\nRam is now Prime Minister of India, but the house of cards beneath him wobbles. The Janata Front is a coalition of diverse elements; Ram knows the front's ideological divisions and corruption will make almost any hoped-for reform impossible - it will be vetoed by allies. With low cohesion within the front, a slim governing majority, and the Congress sharpening its knives for revenge, Ram's premiership is likely to be short-lived."
 IND_Minoo_Masani: "Minoo Masani"
 POLITICS_MINOO_MASANI_DESC: "Whatever the controversies, no one could deny Masani's fanatical dedication. Born in 1905, he first made his mark in the Indian independence movement, imprisoned multiple times; his 1932 incarceration brought him into sympathy with left-wing nationalists, and he was known as a leading left-wing Congress figure. When word arrived that Nazi Germany had crushed the Soviet Union, his old ideology was tempered into something more extreme - he came to believe liberalism and the free market were the only salvation.\n\nThrough the Bose government and the Nehru era, Masani completed a startling rightward drift, gradually drifting outside the Congress core, and finally founded the Swatantra Party in 1965. Yet his radical views and eccentric manner never gained mainstream acceptance, retaining only a small following. When Savarkari tried to swallow India into his party machine, Masani was suppressed but, thanks to his negligible political influence, escaped the Hindustan Samyavadi Sangha's extreme persecution. Finally, Cariappa's appointment propelled this marginal figure onto the Prime Minister's chair.\n\nMasani's base is thin, but his supporters see this as a strength. The Swatantra Party's hollow shell barely maintains democratic legitimacy, and weak local forces force him to rely on military protection. Though his popular support is low, the Prime Minister's remaining value lies precisely in being a delicate counterweight to the military. Facing criticism, Masani knows: at this moment, liberalism must be sacrificed on the altar of pragmatism. If preserving a figurehead parliamentary system requires surrendering some civil rights - then so be it."
 POLITICS_VK_KRISHNA_MENON_DESC: "Vengalil Krishnan Krishna Menon embodied the contraction and contrast of independent India. Born into privilege, during the interwar years he studied economics, psychology, and law in London, among a brilliant circle of peers and Labour comrades.\n\nIt all ended abruptly in February 1943: on Nehru's advice, he risked the voyage back to India on a British submarine - interestingly, another Indian leaving Europe was aboard. Barely two months later, the old world of London vanished, and a new era dawned over New Delhi.\n\nThroughout his political career, Menon held to three principles: staunch non-alignment on the world stage, unwavering loyalty to Nehru, and ruthless ferocity toward any political rival. Thus the West hated him, the East watched him warily, and colleagues envied and admired him. Now the great man is gone, his wishes clear, and Menon has ascended to the nation's highest office with the party's support. Yet rumors swirl that, as always, he will blaze his own trail..."
 POLITICS_VK_KRISHNA_MENON_DURING_DESC: "Prime Minister V. K. Krishna Menon of the Republic of India achieved the seemingly impossible in the verbal duels of Lucknow, reconciling the subcontinent's two rival governments. Though it remains to be seen whether this new alliance can truly solidify, and whether Menon's famously rough temperament will collide with his opponent's equally famous stubbornness, the broader populace celebrates, and war seems to have receded for good."
 POLITICS_VK_KRISHNA_MENON_POST_DESC: "Vengalil Krishnan Krishna Menon embodied the contraction and contrast of independent India. Born into privilege, during the interwar years he studied economics, psychology, and law in London, among a brilliant circle of peers and Labour comrades.\n\nThough the old world has long crumbled, the Prime Minister has built a new world on the ruins of British India. The specter of war has dissipated, and even the Congress must acknowledge his towering prestige among the people and his great achievement of reunification. Meanwhile, the new India has embarked on a radical independent path, renegotiating treaties with Japan on one hand, refusing relations with the OFN on the other, and eagerly reaching out to small nations across the world.\n\nNow Menon holds near-unlimited mandate, the party clears his path, and the world waits anxiously to see what he will build on his predecessor's legacy."
 POLITICS_LAL_BAHADUR_SHASTRI_DESC: "Lal Bahadur Shastri came to power in the catastrophic aftermath of the Lucknow conference, knowing this was the Indian people's last chance for Nehruvian socialism. He could still win a clear majority in the general election, which is why Morarji Desai abandoned his candidacy - and that is only the first of the formidable challenges Shastri faces.\n\nBorn in Ramnagar to humble origins, Shastri rose through the Congress through diligence and unwavering loyalty to Gandhi and Nehru. Serving in various ministries, he deepened his roots in Uttar Pradesh, partially weakening the Pakistan Movement, and wove a dense network of allies, protégés, and contacts through which government plans could be implemented more effectively. Yet despite all this, two demons dogged him like shadows: war and famine. Facing these immeasurable difficulties, Shastri raised the slogan:\n\n'Jai Jawan! Jai Kisan!' Only thus could the beloved motherland survive."
 POLITICS_YASHVANTRAO_CHAVAN_DESC: "Yashvantrao Chavan's election undoubtedly represents Indian voters' eager desire to return to normalcy after the chaos of the sixties. Among passionate orators, opinionated thinkers, and even dangerous extremists, Chavan stands apart: he is an experienced administrator determined to smooth over the chaos as much as possible and follow the Nehruvian line.\n\nBorn in Satara in Bombay's Marathi-speaking region, Chavan's life trajectory resembled many contemporary Indian politicians - participating in the independence movement, rising in local Congress organizations, and gaining experience through various ministries. Chavan has held nearly every ministerial post worth naming: Chief Minister, Defence Minister, and now Foreign Minister, and at last he has reached the top. Drawing on his deep experience, he has brought stability to India's ship, which has been tossed on stormy seas for the past decade - may the waves calm."
 POLITICS_CHARAN_SINGH_DESC: "The transition from a party with clear convictions and deep history to an unstable coalition organized mainly around opposition was not simple. Charan Singh knew the ground beneath his feet was shifting and the future uncertain; yet as a farmer, he understood better than the fence-sitting politicians how to work the land - and how to reap a good harvest.\n\nUnlike many old Indian politicians who moved between states and ministries, Singh spent his life at the heart of Uttar Pradesh, defending the peasant cause against land theft under the guise of cooperatives and the endless greed of speculators. Becoming leader of the anti-establishment opposition did not dim his passion for the people; though coalition partners would throw every kind of demand at him, Singh cared about only one cause."
 POLITICS_NG_RANGA_DESC: "As the saying goes, those driven out of a cause know its flaws best - and N. G. Ranga is the perfect example.\n\nRanga hailed from the Telugu-speaking region of Madras Presidency and was educated at Oxford. After hearing of the great progress made by Bukharin and his comrades, his superficial understanding of socialism hardened into full embrace of Marxism. Yet when Ranga actually visited the Soviet Union, this summer romance quickly soured, and he reversed his political course. Later, when German steel shattered the rotten Soviet Union, he was proved right. Returning to India, Ranga joined the freedom struggle, entering independent Indian politics as a staunch advocate of individual liberty and peasant rights, opposing Nehru's bureaucratic machine. Now, as Rajaji's successor, it is his turn to set things right and ensure freedom endures in India's democracy."
 POLITICS_GAYATRI_DEVI_DESC: "In a sense, Maharani Gayatri Devi was born to rule - though in today's India, 'Maharani' is purely an honorific. Gayatri was the consort of Maharaja Man Singh II, a beautiful princess representing the 'other half' of the Swatantra Party: the royalty, landowners, and tax farmers who had been thrown to the ground and stripped of power in the independence movement.\n\nYet she did not merge with that crowd. Devi was democratically elected as MLA for Jaipur; some see her election as the embodiment of a new era of 'charismatic politicians': former royalty, film stars, religious leaders - all practical figures with thin ideological coloring. Yet beneath the royal composure and unflappable exterior, the former Maharani, now party chairwoman, is determined to carry through the changes the Swatantra Party promises."
 IND_Stroke_Of_The_Midnight_Hour: "Stroke of the Midnight Hour"
 IND_Stroke_Of_The_Midnight_Hour_desc: "January 26, 1943 should have been a glorious moment when the subcontinent's suffering people threw off the heavy yoke of imperialism. Yet twenty years have passed, and the nation remains as it was at birth, treading cautiously under the sword of Damocles. Internal security needs have hardened democracy, and the towering Nehru is the only Delhi pillar propping it up, while the party faithful endlessly preach national unity. Yet cracks have quietly appeared - if something should happen to Dr. Nehru's health..."
 IND_A_Civilian_Economy_For_The_Army: "A Civilian Economy for the Army"
 IND_A_Civilian_Economy_For_The_Army_desc: "Building on the industrial base established by the first two plans, India's economy continues to emphasize electrification and import-substitution industrialization based on government quotas. Yet because of the need to keep the army prepared, light industry receives far fewer resources than heavy industry, creating a gap between consumer demand and actual supply. This has spawned a black market secretly importing consumer goods from around the world, systematically draining national funds - but how can we stand down when guns are needed most?"
 IND_Shadows_Of_Communalism: "Shadows of Communalism"
 IND_Shadows_Of_Communalism_desc: "The inconclusive war with Afghanistan and fears of Hindu-dominated politics have left millions of Muslims and minorities nationwide uncertain about their safety and livelihood. The Pakistan Movement was never properly resolved, and rumors of secret infiltration persist - if communal and religious riots erupt again, they will be bloodier and harder to control than ever. To make matters worse, on the ruins of the Durand Line, old enemies lie in wait to strike when we are at our weakest."
 IND_Beacon_In_The_Dark: "Beacon in the Dark"
 IND_Beacon_In_The_Dark_desc: "Across the Asian continent, hundreds of millions suffer beneath the scorching sun of the Rising Sun, its puppets betraying their own people for personal gain. Only the Republic stands unbowed, building sovereign democracy, a beacon of hope of the people, by the people, for the people. In any case, this is a firm commitment to farmers, soldiers, and workers. It also means that any drift toward despotism will be regarded with the gravest suspicion."
 IND_Going_It_Alone: "Going It Alone"
 IND_Going_It_Alone_desc: "Though Calcutta in the east has bent the knee to foreign power, as responsible national leaders we cannot follow suit, even at the risk of losing military and industrial aid. Nehru's foreign policy has always emphasized equal distance from the three great powers, even from fellow democracy America; while more radical firebrands in the Congress propose going further, supporting a new Non-Aligned Movement uniting the few independent nations against the three powers' interference. Yet for now, this means we are walking a precarious path to modernization alone, with bandits to confront along the way."
 IND_Tryst_With_Destiny: "Tryst with Destiny"
 IND_Tryst_With_Destiny_desc: "Beneath Washington's and Tokyo's growing annoyance, millions' unwillingness to fight brother against brother pushed the two Indian leaders into a series of unexpected moves. Borders are not yet drawn, and wounds can still heal. Menon made a series of concessions to the eastern government, including guarantees of political representation for the Hindustan Samyavadi Sangha and economic integration between the two sides, winning goodwill from Calcutta - but also unease among some in his own party."
 IND_Cry_Havoc: "Cry Havoc"
 IND_Cry_Havoc_desc: "[GetCryHavocDesc]"
 IND_Cry_Havoc_prep: "The critical moment has arrived; only cowards and sycophants still mouth meaningless 'peace.' Workers pour into factories with one-hearted enthusiasm; bullets, shells, and guns pour off production lines. Generals draw up plans; soldiers conduct final exercises, imagining the enemy in the mirror. Heaven and earth are a single inn; all things are eternal dust. The world will run red with our blood."
 IND_Cry_Havoc_war: "Cities are silent, villages empty. A dull rumble echoes on the horizon; shells tear the earth apart; armies march, killing everything in their path. Blood flows like water across the battlefield; shrapnel turns men into grotesque monsters, propped on severed limbs crying out in vain. The mad dog called war has slipped its leash, and before mud and blood drown its howls, before Mother India's tears and embrace, it will tear open gushing wounds."
 IND_Death_March_Downwards: "Death March Downwards"
 IND_Death_March_Downwards_desc: "All the numbers keep climbing - more bullets leave factories for the front; more shells fall like monsoon rain; more corpses pile into new peaks casting shadows on the Himalayas. We are the cursed, marching in lockstep toward the abyss. We will not stop until Death falls on our bayonets and Her justice is taken by us."
 IND_Embers_Of_Communalism: "Embers of Communalism"
 IND_Embers_Of_Communalism_desc: "Whispers in the shadows have become rumors between housewives: about secret cow slaughter and forced marriage, about closed mosques and unexplained unemployment. Neighborly doors once open are now locked, with people peering through window cracks at the devils they know - or think they know. Meanwhile, intelligence notes that funds and propaganda are secretly seeping in from abroad, especially through the mountains where an old enemy lurks..."
 IND_Indias_Long_Night: "India's Long Night"
 IND_Indias_Long_Night_desc: "Workers work overtime to ensure enough bullets for the front; farmers teach their sons to take up arms against the hateful monsters crossing the border; young radicals and government newspaper headlines shout of war's necessity, the glory of sacrifice, and the due process suspended for the just cause. Lights flicker and dim; a small educated elite sits in ivory towers, whispering in the unknown midnight hours about how to ensure this light never burns again."
 IND_Friend_In_Need: "Friend in Need"
 IND_Friend_In_Need_desc: "In the smoke of the eastern blitz, all thoughts of non-alignment and realpolitik were cast aside. Indo-American cooperation reached historic peaks; millions of dollars in equipment, aid, and technical advisors flowed from the City upon a Hill into the subcontinent, helping democracy hold on to the end. That said, when the dust settles, these millions in aid and advisors will still be here, waiting for the future..."
 IND_Indian_Economic_Union: "Indian Economic Union"
 IND_Indian_Economic_Union_desc: "The first step in reunification - economic integration - has begun, as the Free Indian rupee is gradually exchanged for the Republic rupee across regions. The Calcutta government proceeds cautiously, avoiding any sudden problem that would force them to surrender the initiative to Delhi."
 IND_The_Behemoth_Menon: "The Behemoth"
 IND_The_Behemoth_Menon_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nYet the unified new government now faces a formidable challenge: how to reintroduce state institutions to the eastern regions formerly administered by the Hindustan Samyavadi Sangha. Idealistic young civil servants of the Administrative Service find themselves caught between Delhi superiors and local populations who distrust them, forced to choose between the two."
 IND_The_Behemoth_Bose: "The Behemoth"
 IND_The_Behemoth_Bose_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nYet the newly unified government transforms daily, hypnotizing the people into obedience. Civil servants and local party organizations work hand in hand, as the HSS model of governance through party organization slowly, imperceptibly merges with the administrative system."
 IND_The_Behemoth_ROI_1: "The Behemoth"
 IND_The_Behemoth_ROI_1_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit. With Indira Gandhi in power, India will change beyond recognition, and individual needs and ambition will be oriented toward national interest.\n\nPower will be concentrated in the federal government, with corporatist structures built and bureaucracy expanded to support state control of the economy; though electoral procedures are respected, they will be subtly tilted toward the Congress to ensure government stability and continuity of mandate and personnel, realizing a long-term vision. Peace and prosperity stand at the edge of the cliff, but the new government's grip will no longer be threatened."
 IND_The_Behemoth_ROI_2: "The Behemoth"
 IND_The_Behemoth_ROI_2_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit. Durga's mandate is to erase petty ambition; all effort must serve the national interest. With the Emergency declared, India will be remade toward this goal.\n\nWith the mighty bureaucracy and reliable internal security forces' strong support, the federal government's economic decrees spur labor and capital toward prosperity. Unions blocking progress are crushed; electoral procedures are either strictly controlled or suspended altogether. The loyal are rewarded with economic security; as for the rest, let the graveyards handle them."
 IND_The_Behemoth_ROI_Ram: "The Behemoth"
 IND_The_Behemoth_ROI_Ram_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit. Though the Congress still holds a legislative majority, the people rejected its attempt to remake India, mandating the All-India Janata Front to reverse the previous government's severe overreach.\n\nThe Janata Front is a broad tent united by common conviction: a return to agrarian populism, support for yeomen and tenants, and government that serves the people. Yet with a dozen hands on the reins, persuading them all to pull in the same direction requires extraordinary willpower."
 IND_The_Behemoth_AH_1: "The Behemoth"
 IND_The_Behemoth_AH_1_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nThe newly unified government has usurped the former Republic's political structure and remade it to its own liking. Yet the party-state is not yet fully rebuilt, and the real work can finally begin. But someone still lurks in the shadows; the leader's passing is imminent - an opportunity, though the HSS would rather this day never come..."
 IND_The_Behemoth_AH_2: "The Behemoth"
 IND_The_Behemoth_AH_2_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nThe unified government has remade the nation to its liking, driving back the Bonapartists who sought to destroy her. The party-state will be rebuilt in memory of the greatest leader, and India must modernize for its own sake. The gap between east and west is a hundred years wide, and we will close it in a decade."
 IND_The_Behemoth_Coup_1: "The Behemoth"
 IND_The_Behemoth_Coup_1_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nThe military, sacrificing the tradition of non-intervention in politics, acted on its own to stop the HSS's perversion from continuing to corrupt the nation. Door after door was battered open; officers supporting the Sangha were either court-martialed or 'disappeared' in the night. The nation is under Emergency; people still mourn the leader's passing. Only time will tell whether the generals genuinely seek to repair the nation, or whether they find the crown's weight as comfortable as a gun in their hand."
 IND_The_Behemoth_Coup_2: "The Behemoth"
 IND_The_Behemoth_Coup_2_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nIn Delhi, the soldiers' rough hands have forged a new political system, glittering with unsettling light. The Swatantra Party plainly mimics its former suzerain's political line, donning the Tories' cloak; the newly formed Indian Labour Party consists of Nehruvians the military deems 'clean.' India's political system has breathed its last; the people's eyes are dim with disillusionment - in the military's facade parliament, inspiration and truth can no longer be found."
 IND_The_Behemoth_Shastri: "The Behemoth"
 IND_The_Behemoth_Shastri_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nThe Nehruvians have risen, rivals have been defeated, and Shastri and the Congress hold unlimited power to rebuild a new India on a blank slate. Factories reopen, fields are replanted, the nation slowly returns to course; the people must see with their own eyes that the path they have taken was right from the start."
 IND_The_Behemoth_Shastri_OBQ: "The Behemoth"
 IND_The_Behemoth_Shastri_OBQ_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nThe Nehruvians have reached the summit under the shadow of western division; Shastri and the Congress must rebuild the nation, reassuring a populace fearful of brutal communal conflict. Yet while handling the powder keg of cities and border regions, the government must not forget the true goal of bringing modernization to the people."
 IND_The_Behemoth_Desai: "The Behemoth"
 IND_The_Behemoth_Desai_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nMorarji Desai, architect of the Congress Democratic faction, has drawn the curtain on a turbulent decade. With a clear new vision and a patriotic, efficient governing party that intervenes only when absolutely necessary, the road forward to a strong and indivisible India has appeared."
 IND_The_Behemoth_Rajaji: "The Behemoth"
 IND_The_Behemoth_Rajaji_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nWith the Swatantra Party's rise, a decade of dramatic turns reaches its climax in the final act. The Behemoth and the Leviathan lock horns, and in the new era's virtue and the sword of the aging warrior Rajaji, they destroy each other. The new government emerges, unafraid to let the people embrace pursuit of their own talents."
 IND_The_Behemoth_Chavan: "The Behemoth"
 IND_The_Behemoth_Chavan_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nYashvantrao Chavan has drawn the curtain on a turbulent decade. In his vision, the Congress must remain firmly socialist while becoming skilled and professional. The government has been given full authority to reform the nation, and the Behemoth now stands tall, looking down on a grateful but still bewildered people."
 IND_The_Behemoth_Singh: "The Behemoth"
 IND_The_Behemoth_Singh_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nLong before becoming India's leader, Charan Singh worked the land. Single-mindedly devoted to peasant interests, he kept his promise to supporters: India's countless farmers, smallholders, and tenants would have a government that cared for them.\n\nOnce, India's peasantry was forced to the sidelines; now they step forward as a force to be reckoned with - one of the world's most populous nations will be represented by one of their own."
 IND_The_Behemoth_Yadav: "The Behemoth"
 IND_The_Behemoth_Yadav_desc: "The Republic of India is a behemoth, governing millions of villages and towns and nearly five hundred million people busy pursuing fame and profit.\n\nIn India's brief democratic history, the Swatantra government suffered an unparalleled failure. It abandoned its loyalty to the Indian people, shattering millions' faith in the democratic process; for which their forebears struggled and bled for over a century, now nearly gone to resentment and indifference.\n\nBrahm Prakash Yadav's new government bears the daunting task of making up for the losses; perhaps there is still a way to remedy things. Yadav has appealed to the disillusioned Indian middle class, perhaps reinvigorating India's parliamentary process, mobilizing the people at the polls against the elites who abandoned them, bringing dawn to the living standards of most Indians."
 IND_The_Nations_Honeymoon: "The Nation's Honeymoon"
 IND_The_Nations_Honeymoon_desc: "After a generation of grudges and mutual suspicion, the Republic of India and the Free Indian government have successfully reunified, and the subcontinent is as it was before WWII. The Indian National Congress and the Hindustan Samyavadi Sangha risked alienating Washington and Tokyo to fulfill their shared promise to the Indian people. A seed called independent reunification, sown in the mud of Passchendaele, watered in the monsoons of the Burma campaign, finally took root in the cracks of the New Order - India looks forward to a hopeful future bought with a century of sacrifice.\n\nYet India's story is not over. Even as hope and optimism ignite a new dawn, the Cold War's specter has not receded. The Congress and the Sangha still have many disagreements on India's future, just as the OFN and the Co-Prosperity Sphere's interests collide on the subcontinent; they will surely try to impose their respective blocs' influence. The newly unified India may enjoy a hard-won moment of victory, but how long can hope and optimism last before the Cold War's waves cross the ocean?"
 IND_Into_Plowshares: "Beat Swords into Plowshares"
 IND_Into_Plowshares_desc: "Dawn has come to the subcontinent, and hundreds of factories that once produced death have pivoted. Where tank assembly lines once ran, tractors roll off the line one after another; resistors, radar sets, and vacuum tubes once for warplanes and warships now transform into household goods. Farmers return to their fields, workers to the cities, and an economy no longer oriented toward death will bring change for all."
 IND_Whispers_of_Communalism: "Whispers of Communalism"
 IND_Whispers_of_Communalism_desc: "The Pakistan Movement is a powder keg that needs only a spark to detonate completely, but the Lucknow conference succeeded, and national unity now leads the mainstream; the dream of an Islamic state partition may never come true.\n\nThough the movement's followers lament Pakistan's stillbirth, the newly unified India has provided a platform for religious minorities, showing greater tolerance toward non-Hindus than enough to satisfy most Muslims. Communal tensions have not been fully resolved, but they are no longer as sharp as when the nation was divided."
 IND_Non_Alignment_with_Indian_Characteristics: "Non-Alignment with Indian Characteristics"
 IND_Non_Alignment_with_Indian_Characteristics_desc: "The newly unified India has officially withdrawn from the Co-Prosperity Sphere - an unprecedented snub to Tokyo. Yet behind the door, Japanese politicians wait to listen; the Japanese Army and Navy have not discovered them sheltering rebels; and India has not entirely refused cooperation with Japan. Delhi may call itself non-aligned, and most of the world acknowledges it. But those paying attention note that Co-Prosperity Sphere policy has not changed much due to this major shift."
 IND_The_Twenty_Point_Programme: "The Twenty-Point Programme"
 IND_The_Twenty_Point_Programme_desc: "The 'Twenty-Point Programme' refers to a series of economic reforms implemented after Indira Gandhi took power, marking a major shift from the economic plans her father proposed. Though the programme's goals still include eradicating rural poverty, it is less emphasized than before, instead pursuing housing, irrigation, and electrification. Moreover, land redistribution will stop altogether, not advancing further on the current basis.\n\nYet this is not a complete rejection of India's established orthodox economic theory. Economic planning remains the cornerstone of the state and will continue. Under Indira Gandhi's leadership, India's economy will be reorganized along corporatist lines, with a series of new institutions established for this purpose."
 IND_Picking_Up_the_Pieces: "Picking Up the Pieces"
 IND_Picking_Up_the_Pieces_desc: "Though most are overjoyed at Indian reunification, the dissolution of the planned economy has left Bengalis who once relied on the system unable to get by. Deep in economic distress, they turned to the Sangha government for help, which promised to restore and revitalize the old system.\n\nThe Hindustan Samyavadi Sangha promised not only to restore Bengal's planned economy but to extend it across all India. Critics call such a promise deeply irresponsible, saying implementing this model would be enormously costly and would damage the western economy. But the government turns a deaf ear to their protests, single-mindedly bringing India a second liberation..."
 IND_What_Happens_in_the_Dark: "What Happens in the Dark"
 IND_What_Happens_in_the_Dark_desc: "After years of mismanagement, the rotten facade of Indian democracy has been stripped away, replaced by a more solid foundation: enlightened liberals and the military's reliable backing. They will ensure the world's largest democracy receives careful guidance, lest it slide into worse ruin. As long as the temptations of populism and the false promises of demagogues can easily capture Indian hearts, reason and foresight have a duty to protect the unenlightened masses from their own weaknesses."
 IND_The_Finished_Puzzle: "The Finished Puzzle"
 IND_The_Finished_Puzzle_desc: "The once-shattered planned economy has returned triumphantly, becoming a powerhouse in Asian markets. The new land reform aims to destroy the last traces of the western zamindari system; soon, destitution and displacement will be things of the past, and for most, this is India's finest hour.\n\nThe sacrifice to end inequality is the Republic's democracy, now thoroughly crushed by the Sangha party-state. Yet most Indians are not too troubled by the loss of freedom, preferring the economic dividends of the development boom. Development continues, and the failed democratic experiment fades away - after all, this system was not suited for India."
 IND_Our_Old_Friends_in_the_East: "Our Old Friends in the East"
 IND_Our_Old_Friends_in_the_East_desc: "The Hindustan Samyavadi Sangha government, disciples of the leader Bose, could not align with anyone but Japan - and indeed they have not. Though they did not directly join the Co-Prosperity Sphere, they have re-established observer ties. The jewel of South Asia returns to Japan's crown, and the Sangha government has launched a new defense cooperation program with the Japanese military, attracting zaibatsu attention and building productive investment partnerships."
 IND_Move_Fast_and_Break_Things: "Move Fast and Break Things"
 IND_Move_Fast_and_Break_Things_desc: "Due to ballooning spending and the previous government's failures, India's new government has begun implementing long-overdue shock therapy. From local estates to the New Delhi parliament, economic control has returned to those who manage their own land. The nation faces growing crises, such as malnutrition worsening in poor regions. The new policies show immediate results, and rapid economic growth follows, providing the government with the means to stabilize order and bridge crises."
 IND_All_Paths_Lead_West: "All Paths Lead West"
 IND_All_Paths_Lead_West_desc: "Westerly winds blow from the Indian subcontinent across Asia and the Pacific, bringing American government and business opportunities to cooperate, invest, negotiate defense contracts, and make commitments with the world's largest democracy.\n\nIndia has opened its doors to American business as never before; government and business leaders call it a natural alliance: the inevitable union between free democracies and free markets, jointly committed to developing the free world. Yet rumors of American support for India's current government date back to the coup when Masani overthrew the Hindustan Samyavadi Sangha - if true, this is less a destined alliance than a debt that can never be repaid."
 IND_The_Dimming_Light: "The Dimming Light"
 IND_The_Dimming_Light_desc: "From Delhi to Bombay to Calcutta, India's children gaze up at the ominous sky, at the setting sun of the emerging democracy. The government is using force against political opponents, news organizations, and independent journalists; the public increasingly fears state-imposed censorship, and the regime grows more intolerant of public dissent. Now, no expert political knowledge is needed to see that India's newborn dictatorship could indeed end the democratic process - perhaps forever.\n\nThough democracy has not entirely died, if the nation continues on its increasingly despotic path, some patriotic MPs stand ready to defend their institutions. Perhaps soon, the Republic of India will sink beneath the waves, following Britain as another victim of reactionary politics."
 IND_Back_to_Basics: "Back to Basics"
 IND_Back_to_Basics_desc: "Compared to Gandhi, Jagjivan Ram's most obvious difference is his rejection of corporatism. Now, corporatist structures have been dismantled into transitional bodies. Rather than pursuing several grand goals at once, Ram has chosen to prioritize rural poverty. His plan is built on village electrification and agricultural protection to boost yields, paired with rationing to ensure every Indian farmer gets at least one decent meal a day.\n\nHis economic policies face many obstacles: corruption limits genuine wealth redistribution, infighting blurs the focus of all legislation, and Ram's alliance with rural landowners deals the final blow to land redistribution. Still, welfare and aid will flow in some form to farms across the subcontinent."
 IND_The_Nehruvian_Vision: "The Nehruvian Vision"
 IND_The_Nehruvian_Vision_desc: "Though the war has ravaged the world beyond recognition, we hold to our original purpose: Nehru's dream of 'economy for the people.' The government retains key control over all major fiscal decisions, able to work with local governments and the Planning Commission to manage and guide industrial centers, organize agricultural production, stimulate economic growth, and maintain equality between the people and the states."
 IND_The_Partition: "The Partition"
 IND_The_Partition_desc: "A new nation struggles to be born from the old; everything is chaos, as lynch mobs brand centuries-old neighbors as foreigners. Punjab is shattered, and thousands try to flee to the right side of the border, but the new nation does not welcome them. Cities burn, blood flows. §eThe Partition has begun.§!"
 IND_My_Brothers_Keeper: "My Brother's Keeper"
 IND_My_Brothers_Keeper_desc: "Suspicion curdles into open hatred, and villages and towns tear themselves apart from within. Men spit at enemies' doors and gather in teahouses to make lists of the scum to deal with; women look away, veiling their faces when men pass; children roam in packs, throwing stones and mud at the excluded. The civilian government disintegrates by the hour; greedy light glints in enemies' watchful eyes, as they push the wave along, eager to see it."
 IND_An_India_of_Light: "An India of Light"
 IND_An_India_of_Light_desc: "The war is won, and naturally the spoils go to the victor. Other parts of the nation slowly return to normal - or the post-war meaning of normal; by contrast, the east remains firmly in the Reconstruction Board's hands. Party faithful clutch their own small fiefdoms, little different from the old zamindars and princely states, imposing law and justice as they please - is this what we fought for?"
 IND_Look_Westwards: "Look Westwards"
 IND_Look_Westwards_desc: "After the reunification war, Indo-American relations shifted from cool leanings to outright alliance. Indian representatives regularly observe OFN summits, and businessmen fly vast distances to strengthen ties. Tokyo watches in angry silence as East and West shake hands and discuss the future - without any imperialists present."
 IND_Reversing_the_Overreach: "Reversing the Overreach"
 IND_Reversing_the_Overreach_desc: "The pruning shears have started; the Congress right wing begins to untangle the countless economic powers accumulated over the past two decades. From Nehru to Chavan, New Delhi gathered many national economic powers into its hands, only to let them wither. According to the Congress right wing's wishes, India will loosen regulation and devolve economic power, an important step in 'downsizing' the Indian state.\n\nAlmost no sector escapes this change. Land reform and all further redistribution plans will stop; welfare programs will be cut, seen as excessive waste; nationalization will continue but no further socialization. This may mean a huge shift, but so does the failure of Nehruvian socialism."
 IND_Kulak_Socialism: "Kulak Socialism"
 IND_Kulak_Socialism_desc: "For too long, India's government has focused on supporting the rentier class, caring little for those who are rented - who labor in the fields day after day with no social mobility. Now that India has a government elected by and for the middle peasants, this era is finally over: Prime Minister Charan Singh has promised a series of measures to help and protect India's neglected middle class.\n\nThe era of great landowner rule is over, and blatant paternalism toward poor peasants will end, replaced by state focus on elevating small farmers through economic intervention, low-interest loans, technical education, and generous subsidies, giving them new economic interests. Though some argue this will only widen the gap between middle and poor peasants, worsening India's inequality, Singh believes a rising tide will lift all boats."
 IND_The_Indian_Vision: "The Indian Vision"
 IND_The_Indian_Vision_desc: "The eastern wind blows across the nation, biting cold, but we have endured and grown stronger. The government has launched sweeping economic reforms, aiming to stimulate entrepreneurship through tax incentives, cheap labor, and deregulation, emphasizing partnerships between domestic firms and multinational giants. Yet the reins remain firmly in Delhi's hands, and the Planning Commission retains final decision-making power."
 IND_The_Ganges_Unleashed: "The Ganges Unleashed"
 IND_The_Ganges_Unleashed_desc: "Through arduous effort, we have finally won victory on the battlefield and at home. The government has dissolved the Planning Commission, replaced by the National Economic Forum. Riding the wind of lifted economic restrictions and expanded credit, domestic giants swell at an astonishing rate, while foreign firms flood into the Indian market in droves, cooperating with or directly competing against the former. Amid this tide, one thing is clear: India's working masses are being drawn into the emerging OFN-centered global economy."
 IND_Eastern_Bulwark: "Eastern Bulwark"
 IND_Eastern_Bulwark_desc: "Never in Cold War history has so startling a change occurred so rapidly, nor had such far-reaching impact on so many people. India has joined the OFN; every day, hundreds of American soldiers arrive in Bombay, building bases, forward reconnaissance centers, and stimulating the local economy, while Tokyo sharpens its knives, plotting its revenge. The free world fought hard for a foothold on the subcontinent; now, the Statue of Liberty's torch is held high in Mother India's hands, shining proudly over the land."
 IND_Reversing_the_Current: "Reversing the Current"
 IND_Reversing_the_Current_desc: "During its term, the Swatantra Party struck hard at the old economic order, recklessly pushing liberalization and privatization. Catastrophe followed: poverty rates soared, and millions were left destitute by the economic shock. The crisis has spread beyond the government's control, and the Indian people have elected the Congress left wing to power, hoping to solve their immediate economic woes.\n\nThe new Prime Minister has promised to reverse the tide and resist the massive shock of privatization; meanwhile, during Swatantra's rule, a new elite and oligarchy emerged, unwilling to see the situation reversed and eager to wield their influence. Which of these two forces will prevail remains to be seen."
 IND_A_Monument_to_Failure: "A Monument to Failure"
 IND_A_Monument_to_Failure_desc: "Morarji Desai made grand promises during his campaign, but the state-led liberalization he subsequently implemented exposed his complete lack of understanding of conservative economic planning. His policies had no bold drive, no eye-catching innovation, no ambitious passion - voters had only two words for the Congress Democratic government: boring. Naturally, voters turned them out in the next election.\n\nAfter returning to power, the Congress left has promised to correct the failures of Desai's economic experiment, restore orthodox Republican fiscal policy, first revitalizing the neglected social welfare system, then refocusing on land reform. One day, the previous government's mistakes will be erased entirely, found only in history books."
 IND_The_Old_Ghosts_of_Communalism: "The Old Ghosts of Communalism"
 IND_The_Old_Ghosts_of_Communalism_desc: "Despite Bose's ideals, India's past shadows still lurk behind every attempt at the future. The caste system remains widespread, especially in areas not under the former Free Indian government; religious conflict seems to have subsided, but every desire for secularization arouses suspicion.\n\nThough the Pakistan Movement has been defeated, tensions in the Northwest will not disappear overnight. In other regions, the newly integrated Indian administrative system still implements policies at a glacial pace. The ghosts of communalism endlessly haunt the people unless we drive them out for good - with each passing day, the temptation to destroy them by force grows stronger."

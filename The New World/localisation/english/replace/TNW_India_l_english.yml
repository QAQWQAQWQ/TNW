 POLITICS_CHAKRAVARTI_RAJAGOPALACHARI_DESC: "Chakravarti Rajagopalachari was a man who emerged from the gray shadows, known simply as 'Rajaji,' stepping onto the center stage of politics in a manner utterly at odds with his years.\n\nBorn in 1878, twenty-one years after the First War of Indian Independence, the sickly young Rajaji was born in Madras. When the independence movement arose, Rajaji joined: from 1906 onward, through the Salt March that defied the British salt laws, he could be found at every historical moment when British control over India was forced to loosen. In the chaos after the coalition government's formation, Rajaji stood aside, taking no office; but after the war with Afghanistan, he joined Nehru's emergency cabinet. Soon after, he left the Congress once more, returning to the political wilderness, steadily building his classical liberal alternative. Now, as his long life nears its end, he has achieved the impossible: replacing the Congress itself."

 POLITICS_JAWAHARLAL_NEHRU_DESC: "Jawaharlal Nehru was born into a high-caste family that participated in the independence struggle, yet as an Indian he received little of India's own traditional culture. He completed his English education in Britain itself before returning home. As Mahatma Gandhi's right-hand man, he joined the Congress independence struggle, winning popular support and the party leadership. Thus, when the British Empire finally collapsed in disgrace in 1943, he ascended to the nation's leadership.\n\nBut power was not his alone. Between expansionist Afghanistan to the west, the ever-present Japanese threat from the east, and the princely states scrambling for independence, Nehru chose compromise for national interest, surrendering some of his authority to invite Subhas Chandra Bose and the Indian National Army into a coalition government to preserve India's sovereignty and territorial integrity. Yet this alliance was not destined to last; as India suffered defeat in the war with Afghanistan, his only choice was to cut ties with his former ally and comrade, watching him flee east to establish a bitter rival regime in Calcutta.\n\nNow Nehru rules over only half a nation, yet he still strives to build the India he and the Congress envisioned - an independent, socialist, secular, and democratic republic, free from the despotism that plagued other former colonial states. For twenty years he has labored as Prime Minister toward this goal. But his era seems to be drawing to a close. Perhaps he will not live to resolve domestic problems and see India reunified. Yet for India's sake, his legacy is destined to endure for all time."
 POLITICS_MORARJI_DESAI_DESC: "Morarji Desai spent his life in the shadows of public life and the Congress, and he longed for the light. In the struggle for freedom, he stood with Gandhi and the Congress, holding a senior post in the Bombay government after the 1937 elections.\n\nYet as Nehru, Bose, and other socialists rose in the wake of British India's collapse, free-market conservatives were sidelined. Still, Desai held his ground. The new order was closing in on India from all sides, and he grew increasingly popular within the Congress. Finally, after Menon's fatal failure - his outreach to the eastern fanatics collapsing - Desai reached the summit.\n\nDesai had no loyalty to socialism, which had suffered one failure after another in Russia, while those who opposed it achieved countless successes. When conflict became inevitable, he would not cling to the nonsense of so-called 'non-alignment.' The path was clear, and Desai would advance without fear."
 father_of_india: "Father of the Nation"
 IND_Looming_Communal_Problem: "Looming Communal Problem"
 IND_Looming_Communal_Problem_desc: "The inconclusive war with Afghanistan, compounded by the government's mishandling of the Pakistan Movement, has left millions of Muslims nationwide uncertain about their safety and livelihood. With Gandhi's death, the last resort is gone - if communal riots erupt again, they will be bloodier and harder to control than ever."
 IND_Neverending_Security_Budget: "Endless Security Budget"
 IND_Neverending_Security_Budget_desc: "The possibility of war in the east has forced the government to pour resources into the military, leaving vital and urgent social programs and subsidies neglected. Unless this problem is resolved, the people's material conditions will see no significant improvement."
 IND_Third_Five_Year_Plan: "Third Five-Year Plan"
 IND_Third_Five_Year_Plan_desc: "The Third Five-Year Plan continues the previous plan's focus on electrification, rapid industrialization, and agricultural investment, but places greater emphasis on developing the domestic military-industrial base."

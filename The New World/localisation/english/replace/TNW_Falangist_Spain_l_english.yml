 POLITICS_JAIME_MILANS_BOSCH_DESC:0 "Jaime Milans del Bosch, son of a military aristocrat, his life path was set long ago. He entered the Toledo Infantry Academy in 1934, then fought in the Spanish Civil War as a cadet, deeply influenced by militarism and fascist ideology. He then served as an officer in the Spanish Foreign Legion, fanatically serving the Blue Division under German command against the Soviet Union. After the war, he could not understand why Spain and Portugal had formed an alliance, a triple entente with other Mediterranean powers, while drifting away from Germany. He soon began to despise the political situation in Iberia, berating anyone he could trust, believing the current regime should support a more pro-German fascist Spain. However, his position as a junior officer meant his complaints went largely unheard. As the Iberian situation worsened, his doubts were ignored, and he began to radicalize further.

However, the rise of the Basques provided an opportunity. Seizing the initiative, he launched a successful coup in Valladolid with his fellow junior officers, rapidly expanding across northern Spain through disinformation and propaganda. The movement he leads seeks to restore all Spanish lands under the iron fist of the Falangist government."

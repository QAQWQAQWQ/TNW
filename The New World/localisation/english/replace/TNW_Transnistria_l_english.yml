 TNS_Tighina_Accords: "Tighina Accords"
 TNS_Tighina_Accords_desc: "German-Romanian diplomatic relations are a tangled web, with affairs intertwined like silk threads, and the Tighina Accords that created the Transnistria province are but one thin strand. Under the agreement, provincial affairs are jointly administered by Romanians and Germans. Though the Tighina Accords envisioned equal authority for Romania and Germany over Transnistria, the Romanians actually handle the vast majority of administration. After the Germans established military bases and garrisons here, they only demanded certain economic concessions."
 TNS_Smochinas_Agitation: "Smochina Agitation"
 TNS_Smochinas_Agitation_desc: "Nationalist sentiment is rising in Transnistria, and the leading agitator is none other than Nikita Smochina. A nationalist activist, he represents the interests of the radical Romanian community settled in the region, advocating for the formal annexation of Transnistria into Romania. As Romanianization policies take effect locally and Moldova's ties to the former Soviet Union grow weaker, Smochina's stature continues to rise."
 TNS_Ethnic_Turbulence: "Turbulent Waters"
 TNS_Ethnic_Turbulence_desc: "Open any newspaper and read about the latest insurgency, and anyone can detect the divisions between the Romanian administration, the Black Sea Germans, and the Ukrainians. The German community only follows the directives of Sonderkommando R; aside from economic matters, their only concern is the safety of their own community. The Romanian community, though subject to the Transnistrian authorities, acts no differently from the German community. Meanwhile, the Ukrainians must labor day and night without rest, their efforts bringing neither promotion nor reward, only barely enough food to survive. Clearly, neither the Germans nor the Romanians care in the slightest about the needs of these conquered people."
 TNS_Land_Of_Contradictions: "Land of Contradictions"
 TNS_Land_Of_Contradictions_desc: "Transnistria is a land of uncertainty, where every resident lives in contradiction. Corruption is rampant in the government, and no official's pocket lacks a healthy filling of German marks; the Romanian authorities can do nothing about it. The conflict between the Odesa municipal authorities and the Romanian garrison lingers on, never properly resolved. The last time Romanians and Germans cooperated unconditionally was when dealing with a former provincial governor who openly defied orders from Bucharest."
 TNS_Grigore_Bastan: "Grigore Bastan"
 TNS_Gherman_Pantea: "Gherman Pantea"
 TNS_Siegfried_Hass: "Siegfried Hass"
 POLITICS_VICTOR_SIMINEL_DESC: "The current governor of Transnistria is General Victor Siminel. He did not actively seek the position, but he believes his duty is to get the job done.

Siminel was born into a "razesi" family of freehold farmers in Moldavia, and served with distinction in World War I. During the war against the Soviet Union, he did not reach the higher echelons of command, but served in the cavalry and in the mid-level ranks of the Romanian intelligence service, the Special Intelligence Service.

After Antonescu's fall, the Avramescu cabinet appointed Siminel as director of the Special Intelligence Service in 1956, ordering him to reintegrate the anti-Antonescu spy networks and army factions into the broader government, as their raison d'être had disappeared. Siminel performed this duty admirably, and so Iuliu Maniu's government appointed him as governor of Transnistria — in Siminel's own words, "a mismatched government in a mismatched land."

Under Siminel's leadership, the long-looming partisan threat in Transnistria has been temporarily contained. Yet despite this success, Siminel — and his political superiors — face a question: how long can this place hold out?"

 UZB_Fayzulla_Khodzhayev: "Fayzulla Khodzhayev"
 POLITICS_FAYZULLA_KHODZHAYEV_DESC: "To accurately describe the human spirit, or give it a solid and unchanging definition, is as impossible as plucking the moon from the sky with bare hands. To discern what motive drives people to rise early and labor tirelessly each day is even more absurd — how could humans be that clever? There are a thousand explanations for why people work and live. Yet in Uzbekistan, it is otherwise: within no beating heart, within no working mind, can you find any motive at all.

Abandoned, ignored, humiliated... only these words can describe the wretched souls of Uzbekistan. The flames of Central Asia have burned continuously, the Soviet Union has crumbled, and the country's situation has gone from bad to worse — all of which has dealt a bone-deep wound to the Uzbek national spirit and cultural heritage. And in this situation, no one embodies the national state of mind more than the Prime Minister of Uzbekistan, Fayzulla Khodzhayev.

Fayzulla once joined the Uzbek Communist Party, an enthusiastic member. Yet compared to other Soviet republics, Uzbekistan received very little aid from the center, and the land grew increasingly desolate. Then the collapse of the West Russian Revolutionary Front delivered a fatal blow to the country, shattering its faith and leaving it stumbling. Since then, the government has drifted on, growing ever more numb, crawling deeper into the dark mire.

To this day, Uzbekistan still sits in Central Asia, silent, allowing the spirit of self-reliance to spread, waiting for the domestic social crisis to worsen. Perhaps there is still a glimmer of hope, painting a future where the masses cast off the cold and the people dare to speak — but that hope is faint, barely there. Beyond this, Uzbekistan has no remedy.

No remedy, save for the people themselves who create the future."
 UZB_Islam_Karimov: "Islam Karimov"
 POLITICS_ISLAM_KARIMOV_DESC: "The political underworld of Uzbekistan is filled with party politics and power struggles more reminiscent of America than a Central Asian state, and yet the greatest product of this chaos is none other than the President of Uzbekistan and puppet of the Jadids, Islam Karimov.

Karimov was born into the messy life of an Uzbek-Tajik couple, spending much of his youth in an orphanage, but he chose to follow the path his parents had taken — a career in the civil service. Throughout his youth, Karimov could not help but think of the disasters that had befallen Uzbekistan, the broken world in which he had grown up. Karimov cannot say he remembers the day the Soviet Union fell, nor can he claim to have been on the front lines of the West Russian War, but he can say he wants the best for Uzbekistan. Even so, with the Jadids holding the most legitimate power in the government, Karimov can only do so much for his country, vowing that one day he will change his world.

No matter how long it takes."

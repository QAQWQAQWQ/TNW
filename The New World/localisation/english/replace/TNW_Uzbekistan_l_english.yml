 UZB_The_Oligarchy: "The Oligarchy"
 UZB_The_Oligarchy_desc: "Uzbekistan's oligarchs have amassed most of the country's wealth through vast family alliances and bureaucratic networks. While oligarchs are not uncommon in Central Asia, Uzbekistan's unique situation allows them not only to hold high office but to influence politics.

Together, this means Uzbekistan not only has a huge wealth gap at home, but also an inefficient government and rampant corruption, with officials siphoning funds into their own accounts."
 UZB_Jadid: "Jadidism"
 UZB_Jadid_desc: "After the October Revolution, Jadid ideas spread rapidly through Uzbekistan. Many early revolutionaries strongly identified with and advocated this ideology. The collapse of the Bukharin regime laid bare the failure of socialism, and the other side of Jadidism gradually emerged. Under Western-style democratic institutions, people were gradually inspired by the Western Enlightenment, looking forward to an enlightened Islamic era.

The promise of a better future, combined with Uzbekistan's solid grassroots support, has made Jadidism a force to be reckoned with in Uzbek culture, influencing art, literature, and even fashion. Yet whether these promises of a better future will one day be fulfilled, we cannot know."
 UZB_Rise_of_Discontent: "Rising Discontent"
 UZB_Rise_of_Discontent_desc: "Jadid ideas have great influence on the lives of Uzbeks. But among those who accept this ideology, doubts remain. This ideology was once part of life under the Soviet period, but now not only has the Soviet Union collapsed, but the West Russian Revolutionary Front has fallen as well, and Central Asia lies in desolation. Some, looking at the miserable reality, claim that Jadidism is merely manipulating Islam to gain power. And so, faith in this ideology has begun to waver.

Whether these claims are true remains to be seen, but if they are, it will be a disaster for the current government, and Uzbekistan's stability will surely suffer."

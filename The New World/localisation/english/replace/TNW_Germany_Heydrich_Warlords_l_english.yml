 HWL_Ulrich_Wegener: "Ulrich Wegener"
 POLITICS_ULRICH_WEGENER_DESC: "Enough is enough. No more hiding in Germania's sewers, no more being hidden by sane Germans in freezing basements. No more running, no more hiding.\n\nUlrich Klaus Wegener is one of Germany's new generation of leaders. He was only fifteen when he enlisted at the end of the Great War. The young man waited patiently for victory. In his youth, he was always told Germany would prosper forever, unstoppable, the master of the world, and that German children would never suffer again!\n\nBut it was all empty talk.\n\nThe young Wegener did not see German prosperity. Instead, the economy collapsed and people starved. Rising to lead Germany's premier special forces and counterterrorism unit, the "Bandenbekämpfung," Wegener saw the coming war and chose to serve under Speidel during the civil war to keep his wits. But sanity does not win wars.\n\nOnly now has Wegener's true leadership emerged. Hiding anti-militarists from the SS, who hunted everywhere, Wegener could only conceal them in rat-infested corners, surrounded by wolves ready to tear them apart. Yet the pack is divided, each faction fighting for itself. Wegener is caught on all sides; to weather the terrible tide, he fights alone amid the chaos and madness, every faction wanting him dead - or so he believes."
 FPG_first_and_foremost: "First and Foremost"
 FPG_first_and_foremost_desc: "The 1st Panzergrenadier Division is nicknamed the "Bandenbekämpfung," and the name is well-earned; their service record rivals ancient legends. Each soldier is worth ten, and this is no metaphor but a verified fact."
 FPG_backs_to_the_sea: "Backs to the Sea"
 FPG_backs_to_the_sea_desc: "The 1st Panzergrenadier Division is positioned between the Oder and Elbe, backs to the Baltic Sea, with strained supplies and a thin front. Under Wegener's command, the army has imposed strict rationing and limits itself to purely defensive operations."
 FSP_national_socialism_party: "SS-Einsatzkommando Preußen"
 FSP_national_socialism_party_long: "SS-Einsatzkommando Preußen (SS-Einsatzkommando Preußen)"
 FSP_ultranationalism_party: "SS-Einsatzkommando Preußen"
 FSP_ultranationalism_party_long: "SS-Einsatzkommando Preußen (SS-Einsatzkommando Preußen)"
 HWL_Adolf_Eichmann: "Adolf Eichmann"
 POLITICS_Adolf_Eichmann_DESC: "The Totenehrverband must never stop, for purity, for unity, for the Aryan race, even if rivers of blood must flow.\n\nOtto Adolf Eichmann was born German, worked German, strove German, and killed German. Born in Prussia, he moved with his family to Austria, dropped out of school, and rose through his father's mining company. The closest thing to "unity" the young Eichmann saw was the right-wing militias and paramilitaries his friends talked about, and the bold Nazi headlines in the news. To young Adolf, German greatness was destiny, and the time had come to join the great renewal - and he did. Eichmann was entrusted with great responsibility; he unleashed the dogs of war, ruthlessly exiling and slaughtering millions of Jews. He designed and directed the Holocaust, bathing in Hebrew blood.\n\nYet Germany's great achievements have lost their luster, and the bloody, joyful years are over. The economy is out of control, the West Russian War is lost, the German government is near collapse - all this has shaken the Aryan race's spirit and driven Eichmann to swear allegiance to the newly formed Burgundian Ordenstaat. Since the fatherland chose chains over the blade, the Burgundian Reichsführer brought Eichmann into his service, where he became an Obergruppenführer commanding the Totenehrverband, resuming the bloody "Final Solution."\n\nBut all of Eichmann's achievements are dust. Germany is torn by civil war, and to the east the Blonde Beast prepares to obstruct the Reichsführer's apocalyptic plans. If that is true, Eichmann will not submit to such world-ending madness - yet a new target rises on the horizon. The degenerate subhumans have broken their chains; the SS Totenehrverband is surrounded. If not now, when to restart the Final Solution?"
 FSP_no_regrets: "No Regrets"
 FSP_no_regrets_desc: "Under interrogation, Eichmann described himself as a loyal bureaucrat and dedicated National Socialist. Yet that is not the whole truth - Eichmann is cold-blooded, driven by hatred, and encourages his men to follow his example."
 FSP_second_solution: "The Second Final Solution"
 FSP_second_solution_desc: "Eichmann's task in Prussia is simple: eradicate all degeneracy forever. He has revived the old purges and expanded their scope to include all who fail to live up to SS ideals."
 ISS_national_socialism_party: "SS Industriestaat Schlesien"
 ISS_national_socialism_party_long: "SS Industriestaat Schlesien"
 ISS_fascism_party: "Military-Industrial Oligarchy"
 ISS_fascism_party_long: "Military-Industrial Oligarchy"
 HWL_Karl_Hanke: "Karl Hanke"
 POLITICS_Karl_Hanke_DESC: "A master with golden rank treading upon lower men of all rank and blood who tried to rise and revolt. Nothing but the clatter of chains, turning of gears, and bellowing of smoke from factories now.\n\nSS-Gruppenführer Karl Hanke finds himself a man of honor, one of justice and virtue, yet dons nothing but the wills of the industrial magnates, as well as the guns of mercenaries willing to carry it out. Fired in his early 20's for joining the NSDAP, Hanke embraced the role of an orator and organizer by talent, and managed to slowly, yet surely, climb his way through the administrative positions of the Reich, even managing to achieve relations with high-ranking figures such as Erwin Rommel, the soon-to-be-late Joseph Goebbels, and even Albert Speer himself. Nevertheless, as the dawning of Axis victory appeared on the horizon, Hanke never allowed his ambition one step back.\n\nThus began the glory days of the Reich, the days in which the Americans backed off, the French and British were conquered, the Russians were a mere thought upon the hills, and the world became the cornucopia upon which Germany feasted. The Hangman of Breslau put away his rifle, and instead chose the champagne glass, looking to grow his portfolio as greatly as possible as his eyes fell upon the stars.\n\nBut every Titan must suffer a fall most terrible. The economy fell, the West Russian War fell, the Reich itself fell, and one thousand years of promised ascension fell within the span of just short of two decades. Hanke coordinated with his good friend, Albert Speer, in navigating the survival of as many of the other Speerites as possible. However, whilst the cannon shots echo above, Hanke rules from below, collaborating with all of the industrial magnates in an effort to secure their work efforts, while watching every corner's shadow for a slave revolt's march upon their borders...and for every leader who may ally with such degenerate rebels..."
 ISS_back_to_work: "Back to Work!"
 ISS_back_to_work_desc: "Germany is collapsing, yet in Silesia people continue their daily work as if nothing has changed. Enter the factories at sunrise, leave at sunset. Rest on Sunday, back to work on Monday. We cannot hesitate in this internal struggle - back to work!"
 ISS_slave_repression: "Repress the Slaves"
 ISS_slave_repression_desc: "Silesia's industrial magnates are terrified by what happened in Prussia. If a slave revolt broke out in Silesia and spiraled out of control as in Prussia, everything the magnates built - everything Hanke built - would be destroyed. The slaves must know their place; they should labor under the boots of their wealthy German masters, and if they refuse, the black muzzles of rifles await them."
 KHP_national_socialism_party: "SS-Oberkommando Alpen"
 KHP_national_socialism_party_long: "SS-Oberkommando Alpen"
 KHP_ultranationalism_party: "SS-Oberkommando Alpen"
 KHP_ultranationalism_party_long: "SS-Oberkommando Alpen"
 HWL_Joachim_Peiper: "Joachim Peiper"
 POLITICS_Joachim_Peiper_DESC: "My honor is loyalty, my mission is loyalty, my mission calls my blood, my blood calls the Reichsführer.\n\nThe Reichsführer's inner circle is not for just anyone, but SS-Standartenführer Peiper made it, through careful vetting and recommendation. Born in the fiery heart of the German Empire, Berlin, as the First World War raged, Peiper quickly won the future Reichsführer's favor; the elder admired the young warrior's Aryan qualities and transferred him to SS officer school. From its halls emerged the "Eastern Ravager," the monster who commanded the "Lützow" battalion at Kharkov, committing atrocity after atrocity; with German victory, the "Berlin Beast" would only wield his knife more freely.\n\nAs Germany entered a new age of mastery and success, some diehard National Socialists held up Peiper as a model, and Peiper sank deeper into SS mysticism. Still, the Reichsführer kept his favorite close, promoting him for his "dutiful command, dedication to eradicating degeneracy, and building the new National Socialist age." Thus began the war hero's career in the Burgundian Ordenstaat, and all seemed secure.\n\nBut Germany faces its gravest crisis; Peiper's former ally Reinhard Heydrich has openly denounced and rebelled against the Reichsführer. The "Berlin Butcher" grinds those who oppose the Reichsführer and flee south like meat in a grinder, and the bitter, biting Austrian winter grows ever colder..."
 KHP_bloodstained_legacy: "Bloodstained Legacy"
 KHP_bloodstained_legacy_desc: "Even within the SS, Peiper is notorious for his iron heart, often ordering the slaughter of civilians and POWs. Remnants of the Wehrmacht and civilians both fear and hate him; should things worsen, Peiper's fate is easy to imagine."
 KHP_eagles_nest: "Eagle's Nest"
 KHP_eagles_nest_desc: "Peiper's battle group holds the Austrian Alps, easily defensible. Peiper specializes in commanding armor and infantry; if battle comes, this terrain poses no obstacle to his men."
 KSS_ultranationalism_party: "SS-Kommando Posen - Burgundian Faction"
 KSS_ultranationalism_party_long: "SS-Kommando Posen - Burgundian Faction"
 KSS_national_socialism_party: "SS-Kommando Posen - Loyalist Faction"
 KSS_national_socialism_party_long: "SS-Kommando Posen - Loyalist Faction"
 HWL_Herbert_Otto_Gille: "Herbert Otto Gille"
 POLITICS_Herbert_Otto_Gillie_DESC: "The Brother Generals have stabbed each other in the back, and the middle brother rises from the pile, standing with his men to save what remains of the Reich.\n\nHerbert Otto Gille fought through the muddy trenches and drank the ersatz coffee of World War One, and he commanded his Baltic volunteers with pride as they tore through the Russians in World War Two, and he fought the battles of the German Civil War- but he has never seen Germany fall so low as it has. He and his Brother Generals- Paul Hausser and Sylvester Stadler- each took the stunning revelation of Himmler's plot differently. Hausser refused to believe it, Stadler quietly distanced himself from the Reichsführer, and Gille bought every word of it. Such a disagreement could only end poorly, but Gille was skilled enough to find himself ruler of what remains of his divisions- with Hausser dead and Stadler gone, nobody else is left to challenge him from within.\n\nThe task now turns to stopping and defeating Himmler and his lunatics- before they can follow through on their plans. Gille's men- the brave soldiers of the 19th Waffen Grenadiers- stand ready to aid Heydrich and his allies. The tide must be turned, the Reich retaken, and the Aryan paradise restored- and each and every soldier in the division knows what happens if they fail.\n\nThere can be- will be- no retreat, no weakness, no surrender. Gille and his men will end Himmler's mad schemes or die in the process."
 HWL_Sylvester_Stadler: "Sylvester Stadler"
 POLITICS_Sylvester_Stadler_DESC: "In the chaos of the Brother's struggle, the youngest now stands alone on top of the heap- and he and his men want nothing more than to leave it.\n\nUnlike his friends, Paul Hausser and Herbert Otto Gille, Stadler never fought in the First World War- he was only born in 1910. His relative youth did not stop him from joining the SS early, however, joining in 1933. From there, his rise only continued- soon, he was commanding regiments, then divisions, emerging from the War with an Iron Cross and a new rank as Commander of the "Hunyadi" 25th Waffen Grenadier Division- a division made up of Hungarian Nazis, proud to serve their Führer and the Reich.\n\nStadler has stayed in his post since, but the Reich around him has changed- and not for the better. He, like nearly all other SS higher-ups, stood with Himmler during the West Russian War- and suffered the consequences. Ever since, he worked to aid Heydrich's efforts, helping set the groundwork for his Führership. When the Bürgerkrieg began, Stadler was swift to bring his forces to bear against the others, and stood proudly with his brothers in victory- a short lived one, for then came Heydrich's accusations, and soon after came the split. Stadler himself doesn't quite know what to make of it, but the possibility of the rumors being true tilts him towards Heydrich's side- a position not shared by his Brother Generals.\n\nStadler stands at the head of the Kommandostab now, but his drive to fight has left him- a position shared by his men, who similarly lost that spark that drove them all those years ago. Stadler's main focus now is to move his men back to their homeland, Hungary- and go with them. What happens in Germany behind him is not his concern, though he'll certainly do what he can to get his lands in the right hands. All in all, Stadler stands not as the purist or hardliner he once was, but as a man weary of seeing his men fall before him, wishing for nothing more than the quiet luxury of retirement."
 HWL_Paul_Hausser: "Paul Hausser"
 POLITICS_Paul_Hausser_DESC: "Surrounded by foes he once called friends, Paul Hausser emerges victorious from the Brother's struggle- and he now moves to end Heydrich's petty rebellion.\n\nPaul Hausser is a veteran of both World Wars, fighting in the trenches in the First and leading various Panzer Corps through France and Russia in the Second. He proudly displays his Iron Cross from those times, now leading the Wiking 5th Panzer Division- a division made primarily of hardline Scandinavian National Socialists. One of the SS officials to avoid purging in the wake of Himmler's failed coup, Hausser continued to bide his time among his allies in the SS, aiding Heydrich's maneuvers where he could and readying his men for the conflict to come.\n\nWith Heydrich victorious, Hausser thought his work was finished- and his men did too. Unfortunately, fate has played a cruel joke on the Reich, and Heydrich- in a feat of supreme lunacy and cowardice- has denounced Himmler on the basis of insane allegations, splitting Germany once more. Hausser and his men proudly stood in favor of the Reichsführer- and were stunned when their brothers, led by Herbert Otto Gille and Sylvester Stadler, refused to stand with them. Things only deteriorated from there.\n\nAt the end of the struggle, Hausser finds himself victorious-but at a steep cost, with his Brother Generals and their forces dead or fleeing. As tragic as this turn is, Hausser knows there's only one man to blame- Heydrich, that snivelling, traitorous worm. This foolish split has cost Hausser much, and the Oberst-Gruppenführer knows how to fix it- with his men, proudly standing with their loyal, true brothers in Germania, ending this treachery once and for all."
 KSS_shell_of_a_bread_basket_HH: "Hollowed Breadbasket"
 KSS_shell_of_a_bread_basket_HH_desc: "The fertile Polish lands annexed in 1939 soon drew German farmers, and their potential was fully developed. The region quickly became the Greater German Reich's breadbasket.\n\nYet years of civil war have scattered the farmers and abandoned the fields. Small skirmishes, bombing, shelling, and arson can destroy crops before harvest. Germany's eastern breadbasket is now but an empty shell, but the land's potential remains; with proper development, it can be filled again."
 KSS_shell_of_a_bread_basket_RH: "Hollowed Breadbasket"
 KSS_shell_of_a_bread_basket_RH_desc: "The fertile Polish lands annexed in 1939 soon drew German farmers, and their potential was fully developed. The region quickly became the Greater German Reich's breadbasket.\n\nYet years of civil war have scattered the farmers and abandoned the fields. Small skirmishes, bombing, shelling, and arson can destroy crops before harvest. Germany's eastern breadbasket is now but an empty shell, but the land's potential remains; with proper development, it can be filled again."
 KSS_posens_railway_HH: "Posen Rail Hub"
 KSS_posens_railway_HH_desc: "Posen has a major rail hub, the center of rail transport connecting the Greater German Reich to its eastern territories. Though trains from the east have largely stopped since the civil war, the city remains a critical rail junction, moving supplies for the Waffen-SS territories and war-torn Germany. He who controls Posen holds the advantage."
 KSS_posens_railway_RH: "Posen Rail Hub"
 KSS_posens_railway_RH_desc: "Posen has a major rail hub, the center of rail transport connecting the Greater German Reich to its eastern territories. Though trains from the east have largely stopped since the civil war, the city remains a critical rail junction, moving supplies for the Waffen-SS territories and war-torn Germany. He who controls Posen holds the advantage."
 KSS_the_black_white_and_red: "Black, White, and Red"
 KSS_the_black_white_and_red_desc: "Though called the "Waffen-SS Command," it is not composed solely of Waffen-SS troops. Numerous Allgemeine-SS and Burgundian SS also make their home here; though each faction swears loyalty to the command's leader, rumor says they are merely biding their time, waiting for the moment to decide who rises to the top of the Waffen-SS hierarchy.\n\nBy rank, the ordinary Waffen-SS soldiers in the command are similarly divided, siding with one of the two power-blocs. Though most hold some goodwill for the German Führer, the Oberbefehlshaber in Nanzig can twist their loyalty with a word, turning them into devoted Himmler followers. Of course, higher pay helps."
 LHH_national_socialism_party: "1st SS Panzer Division Leibstandarte Heinrich Himmler"
 LHH_national_socialism_party_long: "1st SS Panzer Division Leibstandarte Heinrich Himmler (1. SS-Panzer Division Leibstandarte Heinrich Himmler)"
 LHH_ultranationalism_party: "1st SS Panzer Division Leibstandarte Heinrich Himmler"
 LHH_ultranationalism_party_long: "1st SS Panzer Division Leibstandarte Heinrich Himmler (1. SS-Panzer Division Leibstandarte Heinrich Himmler)"
 HWL_Wilhelm_Mohnke: "Wilhelm Mohnke"
 POLITICS_Wilhelm_Mohnke_DESC: "Stand tall, stay strong. Stand tall, stay strong. Anything less is weakness; never retreat, never show weakness.\n\nDedication, perseverance, or in some eyes, stubbornness. Such is the creed of SS-Obergruppenführer Wilhelm Mohnke. Born to a working-class family, he joined the Nazi Party and SS at twenty-two. His military career would see him internationally indicted for multiple massacres of POWs, always stuck in a dilemma. These atrocities were just the peaks of Mohnke's career. Fighting in Yugoslavia, a massive airstrike hit his unit; doctors ignored an officer's order and decided to put Mohnke out of his misery early, amputating his leg. Mohnke's dedication, his refusal to yield, and his stubborn devotion to duty left him furious at his disability. But circumstances changed; he was sent deep into Berlin, leading the Hitler Youth and various organizations, cheering Germany's victory in the newly built Germania for the German people.\n\nBut after the war, the one who truly controlled Mohnke was the Reichsführer-SS. Himmler saw Mohnke's popularity among the youth and his unyielding spirit as an asset; Mohnke became the most famous participant in the failed 1950s coup for standing with the Reichsführer. It was the Reichsführer's influence that landed Mohnke a post in the Ordenstaat as commander of the Leibstandarte Heinrich Himmler, applying his prudent bearing, thorough investigations, and unyielding attitude...\n\nNow, the time has come for the Reichsführer to use this Obergruppenführer to guard his life. As Heydrich fights Mohnke's master, many Germans continue to flee west to Iberia or elsewhere, escaping the chaos gripping Germany. But Mohnke will be the barrier, the border guard, the high wall against the refugee tide. After all, in his view, an assassin could be a crippled old man with a cane, or a mother with three children..."
 LHH_shield_of_the_ordensstaat: "Shield of the Ordenstaat"
 LHH_shield_of_the_ordensstaat_desc: "The Leibstandarte Heinrich Himmler is composed of the SS's finest and most loyal, and this force has directly seized the major local cities and the routes to Himmler's operational bases. The Leibstandarte has turned the west bank of the Rhine into an impenetrable network of fortifications, prepared for years; hitting it unprepared is suicide."
 LHH_shield_of_the_ordensstaat_tt: "§RThey swear to fight to the last to protect the Reichsführer.§!"
 OKL_despotism_party: "Luftwaffe High Command Remnants"
 OKL_despotism_party_long: "Oberkommando der Luftwaffe Remnants (Oberkommando der Luftwaffe Remnants)"
 OKL_national_socialism_party: "Nazi Party"
 OKL_national_socialism_party_long: "National Socialist German Workers' Party (Nationalsozialistische Deutsche Arbeiterpartei)"
 HWL_Johannes_Steinhoff: "Johannes Steinhoff"
 POLITICS_JOHANNES_STEINHOFF_DESC: "Johannes Steinhoff is one of the most decorated German Luftwaffe pilots of the Second World War, fighting over Britain during Operation Sea Lion before being transferred east until the war's end. Shortly after the war, his brilliant record made him a test pilot for the new Messerschmitt Me 262 jet fighter. Though he excelled in the air, a ground accident caused his Me 262's fuel tank to explode and ignite, and the on-board ammunition detonated. Steinhoff barely crawled from the burning plane and survived, but his face was unrecognizable. After years in hospital and reconstructive surgery, he returned to the Luftwaffe as an officer and instructor in the late 1940s.\n\nBy 1962, Steinhoff had risen to Generalleutnant, becoming a power behind the air force's throne. In his tenure he emphasized pilot training, significantly reducing the Luftwaffe's accident rate. Since Göring was always the Luftwaffe's supreme commander, Steinhoff sided with Göring during the civil war; Göring's failed bid for the Führership was not good news for him, but it left him one of the few senior air force officers to survive the war. As the power struggle continued, he and his remaining air units were trapped around Regensburg, surrounded by bloodthirsty SS warlords. With fuel and supplies scarce, the local air bases have long been running at the limit, flying missions only to defend their small territory. Their only hope is to survive."
 OKL_bingo_on_fuel: "Bingo on Fuel"
 OKL_bingo_on_fuel_desc: "Regensburg's once-famous Messerschmitt factories and refineries were destroyed in the civil war, and the SS, fighting to seize Germany, has no interest in rebuilding the ruins. Now Regensburg's airfield is crowded with all kinds of aircraft but desperately short of fuel and supplies, leaving them only to guard their small patch of land."
 OKL_horten_brothers: "The Horten Brothers"
 OKL_horten_brothers_desc: "Walter and Reimar Horten, the "Horten Brothers," are Luftwaffe officers and aircraft designers known for their core work on the German Ho 229 aircraft. In this hour of crisis, the brothers have flown to Regensberg to ensure the Luftwaffe's survival as best they can."
 AUS_national_socialism_party: "SS-Generalkommission Ostmark"
 AUS_national_socialism_party_long: "SS-Generalkommission Ostmark (SS-Generalkommission Ostmark)"
 AUS_fascism_party: "Armeeoberkommando Ostmark"
 AUS_fascism_party_long: "Armeeoberkommando Ostmark (Armeeoberkommando Ostmark)"
 HWL_Otto_Skorzeny: "Otto Skorzeny"
 POLITICS_Otto_Skorzeny_DESC: "None of our victories were fair, were they? What won them was not courage in our hearts or fire in our eyes, but our willingness to do what others would not, to tread where others feared.\n\nOtto Skorzeny's name has kindled admiration in half the world and hatred in the other half. Born in Vienna, Austria, Skorzeny had a fiery heart and a cunning mind; his dueling scars gave him a striking face. But his battles were not over; the SS forged him into Germany's premier special forces leader, and Skorzeny knew assassination and coup d'état as well as anyone, using terror as an adornment to Germany's victorious dawn.\n\nAs Germany's global power waned, Skorzeny found himself favored by the Reichsführer. Over time, everything seemed to fall into place; Skorzeny deployed his unconventional abilities to their utmost, infiltrating German influence into every corner of the world. But as he grew complacent, clouds gathered; forces he could not see brewed a storm in the shadows, and thunder growled closer.\n\nNow Germany is shattered, having lost control by every measure. The Obersturmbannführer finds himself back home, running a new SS government, forced to watch an unclean butcher to the north and a madman to the south tear each other apart. One question echoes in the mind of this new Ostmark mountain leader -\n\nWhen both sides are repulsive beasts, which does a man choose?"
 AUS_sskommandotruppe_rapier: "SS Commando Rapier"
 AUS_sskommandotruppe_rapier_desc: "The elite commando Skorzeny has personally led for the past twenty years, always beside their commander and always loyal. This is the only unit Skorzeny brought to Vienna, and he wants no more."
 AUS_weary_of_fuhrers: "Weary of "Führers""
 AUS_weary_of_fuhrers_desc: "Skorzeny has always been wary of Heydrich, but Himmler never trusted him either; thus he wishes to distance himself and his men from what he sees as a power struggle for control of the state. He has placed his forces in his native Vienna, controlling the Austrian local army and his own troops, waiting for the contenders to settle their dispute."
 AUS_weary_of_fuhrers_tt: "Skorzeny's decision to stand aside and wait out the power struggle will have consequences."
 AUS_unpurged_heer: "Unpurged Heer"
 AUS_unpurged_heer_desc: "For whatever reason, Skorzeny refused orders to purge the troops in his zone; these units are now deployed alongside his SS forces on the borders. While this lets Skorzeny build up his strength, it also raises doubts among his men about their loyalty to the Reich and to Skorzeny."
 OER_schorner: "State Military Tribunal"
 OER_schorner_DEF: "State Military Tribunal"
 OER_schorner_ADJ: "State Military Tribunal"
 OER_ultranationalism_party: "Hannover-Braunschweig Tribunal"
 OER_ultranationalism_party_long: "Hannover-Braunschweig Tribunal"
 OER_national_socialism_party: "Schörner Kampfgruppe"
 OER_national_socialism_party_long: "Schörner Kampfgruppe"
 OER_fascism_party: "Nazi Party"
 OER_fascism_party_long: "National Socialist German Workers' Party (Nationalsozialistische Deutsche Arbeiterpartei)"
 OER_schorner_party_long: "Schörner Kampfgruppe"
 OER_schorner_party: "Schörner Kampfgruppe"
 HWL_Otto_Ernst_Remer: "Otto Ernst Remer"
 HWL_Ferdinand_Schorner: "Ferdinand Schörner"
 POLITICS_Otto_Ernst_Remer_DESC: "It is him! He comes! Tear him limb from limb, hang him from a lamppost, burn him to ash... the conspiracy must end!\n\nOnce Otto Remer was only a General, but now he calls himself Field Marshal. Once he ranked third among the militarists, behind Göring and Schörner, but now he stands at the forefront, the loudest voice of the militarists after Heydrich's victory. His sharp words and high rank are burned into his men's minds, who stand ready to destroy Germany's greatest enemies: the Blonde Beast, the traitor sitting in the west, and the one beside him, lurking in the shadows... Ferdinand Schörner.\n\nRemer's old superior has vanished in the chaos consuming Germany; legend says the former Field Marshal is using his influence to weave a web of betrayal, aiding that traitor Heydrich... and staring at Remer's lands. This cannot stand, will not be tolerated. Field Marshal Otto Ernst Remer's mission is to lead the National Order Tribunal, destroy all rumors, all threats, all wavering cowards.\n\nAs Remer's army marches west against the despicable traitor, conflict erupts within his own lands: the tribunal must continue to search every inch, every house, every traitor exposed and blasted to rubble. With Himmler's aid, Remer will crush Heydrich's rebel state, expose and sever Schörner's plot, and finally Remer himself will rule Germany.\n\nWhen that day comes, the old militarist dream will live again: a Germany spanning the globe, no longer mere words. But however ambitious Remer's conquest, a shadow dances in the corner, whispering to his men, planting anti-Himmler thoughts in their minds. Remer will not stop purging the tribunal until he ends this traitorous conspiracy... that bloody Ferdinand..."
 POLITICS_FERDINAND_SCHORNER_OER_DESC: "What has become of the Reich? What has become of Germany? Torn to pieces by these decadent animals, these Party toads and lunatics in black. They shall pay, they will all pay for their crimes against the Fatherland! All of them! But that is for later.\n\nFerdinand Schörner has fought for Germany his entire life, from the hellish battlefields of the Great War to the icy wastes of the West Russian War. He has known suffering and defeat, but not like this. Forced from his stronghold by German soldiers in the dead of night? Never. He has remained underground in Hannover since the collapse of that fat idiot's army, hidden only by the grace of patriots and true National Socialists. But it was not SS cultists searching the city for him, but his own men. When he looked at the portraits of the man tearing Hannover to pieces, it was not Heydrich, but his own subordinate, that perfidious traitor Remer. Schörner organized cells to fight the upstart, but they were cut down faster than they could spread. Remer was almost upon him, soon Schörner would be flushed out and hanged as he had ordered so many others to be hanged... if not for Heydrich.\n\nWith the Blonde Beast's help, Schörner has set things in order. Remer is dead, along with the other traitors in the militarist faction, leaving the Field Marshal in stronger control than ever. He has learned of Himmler's insane plan, and made common cause with his foes Heydrich and Speidel to save the Reich he has always served.\n\nBut Schörner remembers his enemies. His vengeance upon them is merely delayed; once Himmler is dead in a ditch, Schörner shall set everything right, as it should be. Those who tore Germany apart shall learn the reason Bloody Ferdinand earned his sobriquet. All in due time."
 OER_promises_from_the_shadows: "Promises from the Shadows"
 OER_promises_from_the_shadows_desc: "Remer's crusade against Schörner will not end easily, and he needs outside support to win. Fortunately, Remer has found a patron in the western shadows: the Burgundian Ordenstaat. After all, in this great hunt, who better to provide aid than the master of conspiracies? We need only meet some of their demands, especially fighting the Butcher of Prague, Reinhard Heydrich."
 OER_promises_from_the_shadows_tt: "§eThe "State Military Tribunal" will act on Nanzig's orders... so long as the gold keeps flowing.§!"
 OER_selfappointed_order: "Self-Appointed Rank"
 OER_selfappointed_order_desc: "Since Heydrich won the German Civil War, the militarists have fallen far. Hermann Göring is dead, Ferdinand Schörner lurks in the shadows, and other Wehrmacht leaders are either dead or unwilling to show their faces; so Remer decided to personally take up the mission of restoring the Wehrmacht and the militarists. He even self-appointed himself Field Marshal, though he never held such a rank - where conditions are lacking, Remer creates them."
 OER_hunt_for_schorner: "Hunt for Schörner"
 OER_hunt_for_schorner_desc: "Backed by Remer's most trusted military police, the tribunal's judges comb the German countryside for the wily Schörner. Many believe Schörner was killed by the SS in the civil war, but Field Marshal Remer is certain Schörner hides in the shadows, weaving a web, recruiting for Heydrich and drawing the Wehrmacht remnants from Remer into Heydrich's traitorous hands.\n\nBlood will continue to flow in Hannover until Remer believes the tribunal has destroyed Schörner and Heydrich's so-called web."
 PRK_despotism_party: "Cursed Warriors"
 PRK_despotism_party_long: "Cursed Warriors"
 PRK_progressivism_party: "Cursed Warriors"
 PRK_progressivism_party_long: "Cursed Warriors"
 HWL_Kazimierz_Piechowski: "Kazimierz Piechowski"
 POLITICS_Kazimierz_Piechowski_DESC: "All that training. All that fighting. All that blood. All those battles. None of it can stop the winter's cold. The ashes of the dead only darken the coming storm.\n\nIn the long river of history, what profound suffering has the Polish people endured? Kazimierz Piechowski knows how terrible it all is, yet how necessary, whether for faith, ideology, or rebuilding a God-forsaken homeland. Piechowski joined the Polish scouts as a boy, knowing he was one of the Germans' prime targets; before the Polish government fell, he knew it was time to take the fight underground. It was long, hard, and brutal, but Piechowski's evasion of the Germans grew harder, for the camp gates were always open to Poles and his comrades.\n\nBut death did not take Kazimierz, nor would it in the years to come. The suffering was unbearable; the systematic extermination of the fatherland's men, women, and children before his eyes was something he could barely imagine. Why would the world do such a cold thing to so many? Piechowski knew it did not matter; when the camp inmates were transferred to plantations, he knew moving on was the only thing left.\n\nBut now Germany tears itself apart; for decades these savages have torn his people to pieces. In this terrible, cold world, he must fight both for justice. Yet the rumors only multiply. The nightmare of a world in flames haunts Piechowski, and his deepest fears about whom he might be forced to fight beside grow more real with every passing hour."
 PRK_to_the_death: "To the Death"
 PRK_to_the_death_desc: "No one in Germany doubts it: the slave uprising is doomed. However determined, they cannot hope to match Germany when judgment day comes. But despair is small before the resolute acceptance of death, and the freed people certainly lack no such resolve."
 PRK_old_soldiers: "Old Soldiers"
 PRK_old_soldiers_desc: "At the heart of the uprising are POWs who had become slaves. They quickly formed a makeshift command to organize the militias. Despite their differing nationalities, they have broad popular support."
 PRK_justice_of_the_liberated: "Justice of the Liberated"
 PRK_justice_of_the_liberated_desc: "You cannot expect sympathy or mercy from freed slaves - at least not if you are the one who oppressed them for twenty years. The settling of accounts has been swift, and rather chaotic."
 SSF_ultranationalism_party: "Florian Geyer Group"
 SSF_ultranationalism_party_long: "Florian Geyer Group"
 SSF_national_socialism_party: "Nazi Party"
 SSF_national_socialism_party_long: "National Socialist German Workers' Party (Nationalsozialistische Deutsche Arbeiterpartei)"
 HWL_Hermann_Fegelein: "Hermann Fegelein"
 POLITICS_Hermann_Fegelein_DESC: "From the city of Dresden comes a regular radio broadcast, singing the praises of the Reichsführer Heinrich Himmler and the Burgundian System- and urging the people to follow them.\n\nHermann Fegelein. Experienced, cynical, and ever-irreputable, the Obergruppenführer has seen much in his years of service to the Reich and the SS, and his eyes have watched dozens of plots pass before them. Accusations of treason or crimes against the Reich, evidence passed hastily in back-door deals, the slow rise and fall- or, in some cases, success- Fegelein has seen it all.\n\nSo, when caught between what little loyalty he possesses to Himmler and the System and Heydrich's frankly ridiculous allegations of the Reichsführer's plots- nuclear armageddon? The end of the world? Please.- Fegelein stuck with his guns. Today, he and his men devote themselves to ending Heydrich's treachery and exposing his falsehoods- through both pen and sword, as they broadcast nationwide urges to leave the traitor and instill the true Spartanist Aryan ideal as devotedly as they fight for it. If there's one thing that the Obergruppenführer is committed to, it's the Aryan paradise he's worked towards for so long.\n\nAnd yet, something tickles at the back of Fegelein's consciousness- What if Heydrich's words are somehow true? Fegelein wants the Aryan ideal, yes, but not by ending the world. It's a good thing Fegelein doesn't root himself to many causes, for if Heydrich backs his words with facts, Fegelein may find it wise to desert- and everyone wants a good propaganda department these days."
 SSF_reichwide_political_ties: "Reichwide Political Ties"
 SSF_reichwide_political_ties_desc: "Beyond his SS rank, Fegelein is a charismatic socialite. His political marriage to Eva Braun's sister gave the cavalryman many opportunities. After the war, he used his connections to win over many of the SS's enemies."
 SSF_unscrupulous_nazism: "Unscrupulous Nazism"
 SSF_unscrupulous_nazism_desc: "Vain, arrogant, and unprincipled, Fegelein is both a faithful Nazi and a thorough rogue. Like their officer, his men often run wild. Fegelein is a disgrace to the SS, but Himmler seems not to care."
 SSL_national_socialism_party: "Nazi Party - Gau Westfalen-Nord"
 SSL_national_socialism_party_long: "National Socialist German Workers' Party - Gau Westfalen-Nord (Nationalsozialistische Deutsche Arbeiterpartei - Gau Westfalen-Nord)"
 SSL_ultranationalism_party: "Nazi Party - Gau Westfalen-Nord"
 SSL_ultranationalism_party_long: "National Socialist German Workers' Party - Gau Westfalen-Nord (Nationalsozialistische Deutsche Arbeiterpartei - Gau Westfalen-Nord)"
 SSL_despotism_party: "Abtrünnigenkorps Lothringen"
 SSL_despotism_party_long: "Abtrünnigenkorps Lothringen (Abtrünnigenkorps Lothringen)"
 HWL_Theodor_Eicke: "Theodor Eicke"
 POLITICS_Theodor_Eicke_DESC: "Betrayed, forgotten, abandoned, the headsman has lost his way, but in Germany's name, a new dawn - no, a new era - is coming.\n\nTheodor Eicke was born into an era of violence and anger that would culminate in the First World War. In the war he earned honors for his bravery, though he mostly managed payroll behind the lines. Yet democracy's failure tormented him; the Weimar Republic's corruption and degeneracy cost him his job and left him penniless, until the National Socialist Workers' Party arrived. From then on, Eicke earned his medals in blood - but it was the blood of his former commander Ernst Röhm, and of the degenerates, the disabled, the corrupted subhumans who died in Eicke's camps.\n\nFor Eicke, Germany had finally found the strength the people needed, and any offense against the Aryan race was unacceptable to Germany. After the war, his lifelong dedication and desire to please Himmler made him a steadfast Allgemeine-SS officer. As an Obergruppenführer, Eicke's relationship with Reinhard Heydrich was stiff, but he believed Heydrich capable of thoroughly purging the fatherland's corruption.\n\nBut God in heaven, that bastard Heydrich, that damned beast has ruined everything! He has torn Germany apart, left us nothing, and made a mess of purifying Germany! We must do everything to serve the Reichsführer and punish Heydrich for betraying the Burgundian system."
 HWL_Ulrike_Meinhof: "Ulrike Meinhof"
 POLITICS_ULRIKE_MEINHOF_HGR_DESC: "Speer's defeat has shattered the dream of the youth for most. Some, however, are committed. Some dream of a Germany free from the swastika and eagle, of a land of freedom from the Nazi jackboot, and they gathered in the forests outside Essen to continue their fight.\n\nAnd these youthful dreamers have found an unlikely leader: Ulrike Meinhof.\n\nPart of the Student Movement from her youth, she had been attracted to the promise of reform that Albert Speer offered. A Reich free of the Race Laws, the camps, the censorship, a better Germany. But the dream has gone wrong; Speer was gone, the Gang of Four dead, and the SS, through Heydrich, reigns supreme over Germany. But even this fragile order has faltered, with Essen being captured by Theodor Eicke and turned into a second Ordensstaat. Those Speerites who remained underground and waging a shadow war against the SS thought the situation hopeless, until support from an unknown corner arrived. The Revolution was back.\n\nNow the Speerites have seized control of their former capital, Essen, and Meinhof finds herself as part of a wider conflict. Himmler and Heydrich have turned on one another, and the entire Reich has begun to choose sides. She despises Heydrich for what he has done, but Himmler is an even worse monster, as rumors swirl of his true intentions. But the Revolution is not yet over, and once half the SS is dead, its fire shall scorch the half that is left."
 SSL_burgundy_wannabe: "Burgundy Wannabe"
 SSL_burgundy_wannabe_desc: "Throughout his Allgemeine-SS career, Obergruppenführer Eicke has faithfully served as the butcher of the Aryan cause. Now Heydrich has betrayed Himmler and the Aryan race, taking what Eicke sees as the path of degeneracy and corruption. So Eicke has modeled his own kingdom on the Burgundian Ordenstaat, on the west bank of the Rhine."
 SSL_burgundian_pawn: "Himmler's Pawn"
 SSL_burgundian_pawn_desc: "The Lothringen Ordenstaat swears undying loyalty to Himmler, but is nothing but a pawn for Burgundy to move as it pleases... for now."
 SSN_national_socialism_party: "RSHA Amt IV E1 (South)"
 SSN_national_socialism_party_long: "Reichssicherheitshauptamt Amt IV E1 (South)"
 SSN_ultranationalism_party: "RSHA Amt IV E1 (South)"
 SSN_ultranationalism_party_long: "Reichssicherheitshauptamt Amt IV E1 (South)"
 HWL_Ernst_Kaltenbrunner: "Ernst Kaltenbrunner"
 POLITICS_Ernst_Kaltenbrunner_DESC: "My office gives me power. My strength gives me power. My strength is supreme, and now it will crush all who threaten me.\n\nAppeals to law and order led many in Germany to support National Socialism, and now Germany has used its resources to ensure the law is maintained however terrible. Ernst Kaltenbrunner is one such figure; born to a family of lawyers, he rose in the Austrian annexation to serve National Socialist Germany, his position suited to the basest ends. Adolf Eichmann had been his close friend since birth; he worked extensively with Heinrich Himmler, Reinhard Heydrich, and the SS, and as the Final Solution's architecture took shape, his position in the organization rose. Becoming an inspector of German concentration camps, death flowed from the Austrian's fingertips to all the subhumans Germany had marked.\n\nGermany's victory may have spared him the death of the Second World War, but it only allowed Ernst Kaltenbrunner to continue extermination. Though criticized by Germany's decadent liberals, the Reichsführer praised Kaltenbrunner's work, recognizing him as both a useful tool and an ally. The Reichsführer drew Kaltenbrunner ever closer, even using his power in the 1950s coup to deflect potential enemies from rising within Germany, ensuring the inspector a place in the Ordenstaat's command...\n\nYet as Germany tears itself apart under the so-called traitor Reinhard Heydrich, Kaltenbrunner finds himself devoted to a new mission for the Reichsführer: survival. Nuremberg has become a city surrounded by enemies; Kaltenbrunner knows what he must do, expanding the Flossenbürg camp's operations to the city limits. Shouldering the mission of survival while commanding a chain of people, he may do it through the degenerate seizure of slaves and prisoners among his troops...\n\nOr through a city's death..."
 SSN_one_big_cage: "One Big Cage"
 SSN_one_big_cage_desc: "The concentration camps around Nuremberg are now the ultimate example of German totalitarian rule; most of Kaltenbrunner's SS are forcing the populace into total submission and eliminating non-SS elements."
 SSN_grip_of_ebon_steel: "Grip of Ebon Steel"
 SSN_grip_of_ebon_steel_desc: "No one betrays Kaltenbrunner, no one. The RSHA chief's imposing presence, his scars, and his ruthless bearing are enough to dissuade most from treachery. If that fails, the SS will strike down betrayers without hesitation or mercy."
 SSW_national_socialism_party: "SS-Kommando Wewelsburg"
 SSW_national_socialism_party_long: "SS-Kommando Wewelsburg"
 SSW_ultranationalism_party: "SS-Kommando Wewelsburg"
 SSW_ultranationalism_party_long: "SS-Kommando Wewelsburg"
 HWL_Fritz_Klingenberg: "Fritz Klingenberg"
 POLITICS_FRITZ_KLINGENBERG_DESC: "No, no, no, this is simply impossible. Fortune twisted, chaos at his side. That cannot win the war. That cannot save Germany...\n\nSS-Standartenführer Fritz Klingenberg was not born to a glittering German noble house, nor hailed in the First World War as a brave defender of the Reich, nor among the finest commanders of the Second World War's victory. But Fritz Klingenberg was born with fight, the wits to fight well, and the luck to win. Leading the Waffen-SS is no easy thing; many tried, failed, and died. But for Klingenberg, it would be just another trial in his life.\n\nYet however many times he fell or stumbled, Klingenberg leaped up at the last moment and found himself a command in the Allgemeine-SS with nothing but benefit and no downside: crushing the rats who dared resist. After all, for the most Aryan of Aryans bearing Germany's finest weapons, what trouble could there be in tracking down the fatherland's enemies?\n\nBut Klingenberg was unprepared for Heydrich's stance against the Reichsführer; no one was. At first it was only slave uprisings and bastards weeping in basements. But now his own men are turning on each other, and the Reichsführer has not answered his requests..."
 SSW_wewelsburg_citadel_project: "Wewelsburg Project"
 SSW_wewelsburg_citadel_project_desc: "The Wewelsburg Project was first conceived in the Reichsführer's mind; he planned to greatly expand the castle to make it the new center of the Aryan race. The plan was interrupted before the West Russian War, and the new SS-Gruppenführer Fritz Klingenberg has made completing the Reichsführer's vision his top priority. Klingenberg hopes that after the Reichsführer sees he is capable of organizing such a massive project and realizing the dream, the Reichsführer will grant him control of more of the Greater German Reich."
 SSW_wewelsburg_citadel_project_tt: "§RThis project requires money and effort, constant investment and maintenance to continue.§!"
 SSW_a_unit_divided: "A Unit Divided"
 SSW_a_unit_divided_desc: "Klingenberg finds himself trapped in his own lands. His diehard SS partisan-hunters suspect and accuse one another. Once they hunted partisans in forest shelters and basements; now they turn on each other, patrolling bases and headquarters, suspecting one another of being Heydrich spies."
 SSW_come_in_ostparis: "Calling Nanzig, Come In!"
 SSW_come_in_ostparis_desc: "Klingenberg's territory is fragile. Westphalia could plunge into bloodshed at any moment, and Klingenberg lacks both the expertise and resources to prevent it. He needs Himmler more than ever, but the calls to Nanzig go unanswered. Westphalia needs help, and Burgundy is silent."
 KSS_despotism_party: "SS-Kommando Posen - Soldiers' Faction"
 KSS_despotism_party_long: "SS-Kommando Posen - Soldiers' Faction (SS-Kommando Posen - Söldnerclique)"

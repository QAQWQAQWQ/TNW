 HWL_Sepp_Dietrich: "Sepp Dietrich"
 POLITICS_SEPP_DIETRICH_DESC: "This is wrong. It isn't fair, not at all. Serving a great man, serving the master of Europe - everything forged for that has now fallen to ruin. This is wrong!\n\nJosef "Sepp" Dietrich was born in Bavaria, right in the heartland of the Second World War's victors, and came of age just in time to serve in the First. Yet the embers still burned. Through Dietrich's hands flowed the blood of traitors shed on the Night of the Long Knives; Germany rose, and the star on its laurels was Adolf Hitler. But the star shone on no one but SS-Obergruppenführer Dietrich himself. He clawed his way up through the Nazi Party and the SS, finally rising to command the Führer's bodyguard.\n\nSlaughter without end, blood flowing in rivers, all in the Führer's name. When victory dawned on Germany, Dietrich watched with burning eyes as the world bowed to the Thousand-Year Reich. But when it all began to fall, watching beloved Germany collapse pierced the heart of this lifeguard. Now the follies of proud men have truly divided the Aryan race, and Germany bleeds.\n\nBut Dietrich refuses to believe this is his due. No, he will not be treated this way. He guarded Hitler; Heydrich and Himmler should both bow to him, if only to earn his loyalty."
 DSH_directed_anarchy: "Directed Anarchy"
 DSH_directed_anarchy_desc: "After returning to his native Bavaria, Sepp Dietrich crowned himself "Duke of Bavaria." He ordered all loyal to him to wear black shoulder boards, and treated resisters as partisans. He hid himself away in Neuschwanstein Castle while his commanders did as they pleased with the people, plunging the region into a state of "controlled anarchy.""
 DSH_volkswache: "Volkswache"
 DSH_volkswache_desc: "Many incarcerated rapists, murderers, and thieves exploited the new edicts to swear loyalty to Dietrich and beg for pardon. To show his mercy, Dietrich executed a hundred of them and organized the rest into the new "Volkswache." These enforcers in black armbands now patrol the streets alongside the SS, forcing the people to submit to their every whim, all in the Duke's name."

 HWL_Felix_Steiner: "Felix Steiner"
 POLITICS_Felix_Steiner_DESC: "Oh God no. They have to stop it. Stop the fighting now, end the standoff, end this tension. Or we are finished.\n\nFelix Steiner was born in his German homeland around the turn of the century, and came of age just in time to fight in the First World War. He earned the Iron Cross, First and Second Class, through blood and battle. But a few signatures on a document in Versailles could not stop Steiner; he joined the Freikorps paramilitaries and forged himself on the path of militarism. And when the SS was formed, Felix Steiner joined, given the administrative authority to raise the 5th SS Panzer Division "Wiking." The division was composed entirely of Scandinavian volunteers in the Waffen-SS, who would march east to victory alongside the German fatherland.\n\nBut after the war, Felix Steiner soon learned the true nature of the National Socialist bureaucratic noose. It was powerful, dangerous. Steiner was removed from command of the volunteer division he had raised, reassigned to administer the active and retired men of the SS, Waffen-SS, and even the Wehrmacht. In those troubled years choking Germany's former glory, Steiner was kind to every German soldier. Whether from the SS or the Wehrmacht, their Aryan pursuit of warrior spirit deserved respect. Some disapproved of Steiner's egalitarianism, but for him it was enough to have cleared criminal charges against the many soldiers who had served under him during and after the war.\n\nYet troubled times breed strife. Now, the German SS and the Ordenstaat's forces fight in the streets, and Steiner has limited pieces on the board. The SS and Wehrmacht he freed often fire on each other within his domain. This is a cost he cannot bear as he defends against the storms of both Heydrich and Himmler."
 AGS_Angriffsgruppe_Standoff: "Angriffsgruppe Standoff"
 AGS_Angriffsgruppe_Standoff_desc: "Steiner, commander of the Viking Panzer Division, has raised his banner and formed a government in Frankfurt. He controls the surrounding area through manpower. Wehrmacht soldiers unwilling to join Gehlen's southern uprising accepted Steiner's offer of safety and joined him. Through hostage-taking, coercion, kidnapping, and extortion, Steiner has held his ground and largely restored order. With large numbers of SS and Wehrmacht troops supporting him, Steiner can maintain his rule even in this four-front position."
 AGS_Glorious_Warfare: "Glorious Warfare"
 AGS_Glorious_Warfare_desc: "There is nothing on earth finer than soldiers on the march. No victory is more honest than that won in blood, no struggle more uplifting than fierce combat, no quality defines a nation more than the mettle of its soldiers! We all know that among the warlords of Germany, our soldiers are the finest! It is time to set aside the petty squabbles between Wehrmacht and SS. The hour has come to unify the German fatherland through glorious battle, the spoils of real blood!"

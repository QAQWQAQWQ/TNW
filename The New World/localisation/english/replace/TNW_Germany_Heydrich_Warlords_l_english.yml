 POLITICS_LEON_DEGRELLE_DESC: "Leon Degrelle began his political career as the leader of the Rexist movement within Belgium, a far-right, Catholic political party, heavily influenced by Fascist and Corporatist thought. During the war, Degrelle proclaimed Rexism to be a close friend of National Socialism, choosing to collaborate with the occupiers of Belgium and join the Wallonian Legion, quickly rising up within the ranks of this organization to become its leader. After the war ended, Degrelle became responsible for the rule and control of much of southern Belgium under the Reich, as one of the most influential collaborators in all of the Einheitspakt.\n\nNow, with Wallonia fully integrated into Heinrich Himmler's Ordenstaat, Degrelle continues to exercise control over the lands as commander of the SS-Wallonien collaboration brigade. Though Degrelle has competently and ably served the Ordenstaat in their adoption and application of the Burgundian system, the Reichsführer-SS has grown suspicious of the Belgian. With how important Degrelle has grown, however, Himmler has been unable to get rid of him without proof that the man is plotting something."
 POLITICS_LEON_DEGRELLE_COLLAPSE_DESC: "Who could have predicted Leon Degrelle reaching this point? Few strategists saw it coming, and perhaps not even himself - but here he stands, with at least one chance at success.\n\nLeon Degrelle and his party were torn apart when Germany invaded, yet he gradually became one of the most radical collaborators. An Iron Cross recipient, war hero, and proud Walloon nationalist, Degrelle was naturally furious when he heard Heinrich Himmler would take over Wallonia - a fury that only grew as Himmler's Spartan Aryan ideals threatened to grind Wallonia's culture and independence to dust.\n\nAt first, Degrelle tried to quietly obstruct Himmler's plans, secretly stockpiling weapons and recruiting men for an uprising. Despite his efforts to conceal it, the plot was discovered, and he and his colleagues were forced to flee. Degrelle narrowly escaped the SS dragnet, but knew it was only a matter of time before they found him; Heydrich's victory deepened this fear. With no way out, Degrelle and his men bought time - until the Ordenstaat's unexpected collapse offered a glimmer of hope.\n\nIn the chaos, Degrelle seized Wallonia from Himmler's grasp and began organizing for the inevitable counterattack. Now, the Wallonien Division's only hope is to repel both Himmler and the other factions at once. Defeat means Degrelle and his men will die nameless - and Wallonia will vanish with them."
 BEL_restorationist_fervor: "Restorationist Fervor"
 BEL_restorationist_fervor_desc: "Degrelle has always dreamed of restoring Belgium, purging the disloyal, and elevating Belgium to equality with Germany. In this age such ambition seems impossible, but Degrelle has always been a man of action, not just words."
 BEL_high_in_honors: "High Honors"
 BEL_high_in_honors_desc: "Degrelle and the Walloon Legion are widely respected within the SS. They are the most celebrated collaborationist legion, having proven their courage countless times in WWII and the West Russian War against Bolshevism."

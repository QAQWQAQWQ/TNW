 POLITICS_BERT_ERIKSSON_DESC: "In Flanders, the Langemarck Division has retaken the territory it once lost and prepares to link up with the Reichsführer.\n\nBy every measure, Bert Eriksson is an oddity within the SS. He joined at the earliest eligible age, rose quickly through Langemarck, and became the youngest leading figure in Burgundy. Though his economic views were repeatedly set back by the troubles of the 1950s, Eriksson remains one of Burgundy's most active collaborators. Reliable, practical, loyal.\n\nYet this loyalty springs not from personal fondness for Himmler or devotion to the Reichsführer's system, but from loathing of his southern Walloon counterpart, Leon Degrelle. Eriksson knows that should he lose power, Degrelle and the Walloons would immediately seize Flanders for their own gain. He will not allow it. To strengthen his brigade, the Langemarck leader has resorted to dark means: dealing with Breton merchants in secret and staging resistance attacks to justify more aid.\n\nNow Heydrich has raised the banner of rebellion, and Degrelle seems on the brink of treason himself. Eriksson knows his chance has come and will not let it slip. Soon he and Langemarck will join Himmler's forces and deliver a crushing blow to Degrelle and his lackeys. Only then will Eriksson be certain he has protected the Flemish way of life."
 POLITICS_BERT_ERIKSSON_COLLAPSE_DESC: "Had he known, Eriksson would never have worked with Himmler. He accepts the Greater German ideal, but will never allow others to erase Flanders' heritage and national identity. They were meant to be one among many Germanic peoples, side by side against the Jews and their plutocrat-Bolshevik puppets. Had that hated coup not forever sullied the SS's glory, he might have found aid from Reichsmarschall Göring or the distant Ostland leadership. But it is too late.\n\nDegrelle and de la Mazière have already moved; the French Resistance harries the SS once more. The Ordenstaat cannot possibly survive, and Eriksson knows exactly what his Walloon "comrade" has in mind for Flanders. Worse, Germany surely plans to retake its conquered western territories, and the local Flemish are lukewarm toward Langemarck.\n\nBert Eriksson had better plan quickly, before he becomes nothing but a footnote in some history book."
 FLR_fearful_victory: "A Troubling Victory"
 FLR_fearful_victory_desc: "Defeating the degenerate National Socialists would normally be cause for celebration for the Flemish SS - but there is no time to celebrate. Now that the final struggle is over, Eriksson suddenly realizes Flanders is surrounded by wolves, very, very alone."
 FLR_eyes_on_the_border: "Eyes on the Border"
 FLR_eyes_on_the_border_desc: "Leon Degrelle makes no secret of his ambition: he wants to unify Belgium. The Wallonien Legion is a formidable foe, and Eriksson knows it; he must prepare his SS to defend Flanders at all costs."
 FPG_despotism_party: "1st Panzergrenadier Kommando"
 FPG_despotism_party_long: "1st Panzergrenadier Kommando (Panzergrenadier 1. Kommando)"

 HWL_Karl_Donitz: "Karl Dönitz"
 POLITICS_Karl_Donitz_DESC: "The German Navy has returned once more to Hamburg's rusting harbors - carrying its exhausted admiral, worn down by years of blood and toil.\n\nKarl Dönitz may be Germany's last untainted hero. The others are dead, missing, or have defected to the SS. The admiral who once bullied allies with a stick has once more evaded those in the new Germany who wish him harm. But his family has not been so lucky - his son died in the Great War, his wife left him years ago, and his daughter and son-in-law are almost certainly trapped behind SS lines, suffering. Outwardly he remains a powerful, composed war hero, a friend of Hitler and the scourge of Germany's enemies. But beneath that facade lies a broken soul.\n\nNo wonder the admiral established a council to handle his daily emergencies - he gives them legitimacy, they give him power. Thus Hamburg is relatively calm - the SS roars just outside the city gates, and Hamburg's fate hangs by their whim, but at least the fleet is commanded by a sane man.\n\nNot everything is as it should be; two impulses still battle within the admiral's mind. On one side stands the proud war hero, fighting to entrench the German Navy as a true armed force and an island of reason in the storm, not the army's forgotten wing. On the other stands the exhausted old man, who only wants the German Navy to be the gatekeeper of the north - a gate open not only for the refugees crowding Hamburg's streets, but for himself. Which Dönitz will win is unknown, but for now, the admiral has made his final choice."
 DSG_nascent_refugee_crisis: "Nascent Refugee Crisis"
 DSG_nascent_refugee_crisis_desc: "Throughout Germany, millions flee a rapidly deteriorating situation, looking for somewhere - anywhere to take refuge until the burning and bloodshed comes to an end. To the east lies anarchy, to the west lies hell, and to the south stands a treacherous empire which state propaganda has warned about for years. Yet there are whispers that to the north one can find their escape from this unending strife. If one can simply reach Kiel, they say that one can ferry the Baltic to Sweden.\n\nGroßadmiral Dönitz sits as the gatekeeper to these lands, and as the masses of refugees begin to increase, a decision must be made as to how to grasp the state of affairs."
 DSG_tiring_stance: "Tiring Stance"
 DSG_tiring_stance_desc: "When his favored successor Martin Bormann was locked out of Germania, Admiral Dönitz for the first time took a defiant stance against the decaying Reich. Dönitz had expected Bormann to prevail over the other rabble, but never foresaw the present failure.\n\nMuch time has passed since then. He returned from exile only to seize Hamburg and Kiel to bring the resistance to Germania, and watching the fatherland sink further into anarchy has worn him down. Is all his resistance fated to be in vain?"

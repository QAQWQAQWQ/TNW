 HWL_Konrad_Henlein: "Konrad Henlein"
 POLITICS_Konrad_Henlein_DESC: "In the mountains of the Sudetenland, a man long declared politically dead has risen again. Yet he still must dance on his master's strings.\n\nKonrad Henlein has struggled for decades, an ardent Sudeten German Nazi less a fanatical populist than an ordinary man. After Germany occupied the Sudetenland in 1938, Henlein formally joined the party and was soon appointed Gauleiter of the Sudetenland, beginning his fated rivalry with Heydrich. In the end he lost; Heydrich rose higher and higher while Henlein missed every promotion. Henlein worked for years, never earning the Reichsleiter rank he craved, watching Heydrich become Reichsführer-SS and then Führer.\n\nEven so, had Heydrich not simply sidelined Henlein and left him in obscurity, he might have stood with Heydrich against Himmler. The last straw broke Henlein's heart; he looked to Burgundy, but they had no interest in him either. So Henlein concluded his only path was radicalism, reviving the old concepts of "Lebensborn and Lebensraum," forced training and exercises - all to make his land radiate Aryan superiority and attract the Reichsführer.\n\nHenlein has his men ready for battle, knowing this is his only path to the promotion he has long desired."
 APF_lebensborn: "Lebensborn"
 APF_lebensborn_desc: "Gauleiter Henlein is obsessed with Aryan racial superiority, which led him to restart the old Lebensborn program. Self-styled Gauleiter Henlein is confident he can set an example of Aryan racial purity in the Sudetenland that will delight the Reichsführer.\n\nYet Lebensborn was not part of a long-term plan for the Sudetenland; it was hurriedly launched, seen as a way to "select" Aryan women for the program."

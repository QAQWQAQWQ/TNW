 GAX_ADJ: "Galapagan"
 GAX_conservatism_party: "Democratic Coalition"
 GAX_conservatism_party_long: "Democratic Coalition (Coalición Democrática)"
 GAX_paternalism_party: "Armed Forces of Ecuador - Reformists"
 GAX_paternalism_party_long: "Armed Forces of Ecuador - Reformist (Fuerzas Armadas del Ecuador - Reformista)"
 GAX_despotism_party: "Armed Forces of Ecuador"
 GAX_despotism_party_long: "Armed Forces of Ecuador (Fuerzas Armadas del Ecuador)"
 GAX_Guillermo_Freile_Posso: "Guillermo Freile Posso"
 POLITICS_GUILLERMO_FREILE_POSSO_DESC: "Gandara's plan has been exposed, and he has been imprisoned by the government. The United States is doing its utmost to disentangle itself from the Ecuadorian mess.\n\nYet with the Arosemena brothers fallen, a staunchly anti-American Ecuadorian regime has taken power. American plans have changed: Washington is re-establishing contacts with military personnel still of use, such as Guillermo Freile Posso.\n\nFreile served in the US Air Force and earned ace pilot status. After the failed coup, he was among the first to leave Ecuador; he then made his way to the United States, hoping to receive exile asylum in the country where he once served. Concerned about losing its strategic base in the Galapagos, the United States offered Freile an olive branch, inviting him to lead a government-in-exile.\n\nFreile accepted almost without hesitation, positioning himself as the rightful heir to the Arosemena government and drawing up plans for an eventual return to the mainland. Yet reality differs sharply from imagination: the exile government is entirely dependent on Washington's aid, with almost no resources or population; yet at the same time, they must still secure broad support to maintain a measure of international legitimacy."
 ECU_idea_a_puppet_in_all_but_name: "Ecuador in Shackles"
 ECU_idea_a_puppet_in_all_but_name_desc: "After the 1960 communist revolution, the Republic of Ecuador fell into dire straits; Peru's invasion was unstoppable, Velasco fled into exile, and the state collapsed.\n\nWhat he left behind was but a puppet of American and Peruvian interests. The already weak army was further weakened, the oligarchs who had controlled the economy for decades saw their power enhanced, and a new 'democracy' was established to 'replace' Velasco's de facto dictatorship - yet it was merely a continuation of the old regime, minus Velasco himself.\n\nThough many in government labored to make amends, they found themselves unable to save the rotting country, whether through incompetence or lack of means, leading them to abandon the government and turn to more extremist political groups calling for a national rebirth."
 ECU_idea_communist_underbelly: "Specter of Communism"
 ECU_idea_communist_underbelly_desc: "After the 1960 communist revolution and the ensuing Peruvian invasion, the revolutionaries were forced to retreat into the Amazon jungle, where they regrouped and planned their next moves.\n\nYet for those who wish to bring socialism to Ecuador, the future is bright. Velasco is far away in Europe, and the Peruvian puppet government knows only how to make the people's lives worse day by day. In this moment, the revolutionaries speak for Ecuador's future, and as the only force that has taken up arms against Peru, their prestige grows with every new recruit who joins their ranks.\n\nThe revolutionaries control most of the country outside the capital, and the specter of revolution looms over Quito, drawing closer with each passing day."
 ECU_idea_the_wolves_from_outside: "Wolves Without..."
 ECU_idea_the_wolves_from_outside_desc: "Across the ocean, one man's existence is a constant reminder of Ecuador's past and the threats to her future. After the Peruvian invasion, Velasco brought his government to Iberia, using his friendship with the Spanish to establish a government-in-exile.\n\nThere he changed his political strategy, drawing lessons from Perón and pushing populism further. He rallied many exiled and domestic politicians who wish to see him return, and he remains a persistent threat to any Ecuadorian political order not built around his own person."
 ECU_idea_and_the_wolves_from_within: "...Wolves Within"
 ECU_idea_and_the_wolves_from_within_desc: "Given Ecuador's many problems, one might think that her only army - laughably small by any standard - would at least be free of problems. Yet reality has dealt another blow.\n\nThe Ecuadorian government is chaotic and corrupt, barely keeping itself afloat; oligarchs dominate the economy; the country has been abandoned by Peru, reduced to a nominal vassal; and it stands in opposition to the United States. Yet this weak army remains the key obstacle preventing total anarchy and the revolutionaries' rise to power.\n\nYet no amount of problems means the army supports the government. Rather, the army merely tolerates it. Rumors circulate that the military is holding secret talks with the Americans to secure support for a possible coup, and many wonder how much longer this ridiculous republic can survive."
 ECU_idea_vencir_o_morir: "Victory or Death"
 ECU_idea_vencir_o_morir_desc: "The revolution that overthrew the Arosemena government was but the first step for Aguirre and his revolutionary comrades. With the ultimate goal of spreading communism to neighboring countries, Ecuador has mobilized, preparing for Peru's inevitable invasion.\n\nNearly all Ecuadorians have united against the imperialism that has twice destroyed the country's hopes in the past two decades. Even those who oppose the revolutionary government have joined in resisting Peru."
 ECU_idea_alianza_para_el_progreso: "Alliance for Progress"
 ECU_idea_alianza_para_el_progreso_desc: "The first Ecuadorian revolution of 1944 brought much-needed reforms to the country, but over time Velasco betrayed his promises to the people, and the remaining few policies were rolled back by the Peruvian puppet government.\n\nThus the various revolutionary parties united to form a coalition, aiming to bring the changes the Ecuadorian people need to shape their own future."
 ECU_idea_true_home_of_the_revolution: "True Home of the Revolution"
 ECU_idea_true_home_of_the_revolution_desc: "Cuba was meant to be the home of communism in the Americas, a country that would export socialist revolution to other continents. Yet Castro turned her into a Washington puppet, yielding to the jackal capitalists to hold onto power.\n\nThus, few Ecuadorian revolutionaries support Cuba; they see Castro as just another Velasco, ready to betray those who put him in power at the first opportunity.\n\nIn sum, the revolution needs a new home, and Ecuador is eagerly taking on that role. She bows to no imperialist, American or otherwise, and constantly encourages the development of comrade parties."
 ECU_idea_a_non_partisan_government: "Non-Partisan Government"
 ECU_idea_a_non_partisan_government_desc: "After the coup, the major parties presented various government proposals and ministerial candidates to the military under the guise of restoring civilian rule - all were rejected.\n\nThe military refused to align with any particular party or ideology, choosing a non-political approach to governing, ensuring they could carry out whatever reforms were necessary.\n\nYet this non-partisan stance requires the parties to at least not oppose the military government and its actions, especially as reforms grow more radical."
 ECU_idea_shifting_tides: "Shifting Tides"
 ECU_idea_shifting_tides_desc: "It is well known that Gandara's military government was installed by the United States, which also supported the coup against the Arosemena government.\n\nYet this does not mean the military truly intends to work closely with the Americans. Given America's involvement in the previous Peruvian invasion and its refusal to support Ecuador's claims to lost territory, many view Washington as an ally of convenience only.\n\nNo one knows this better than the junta's leader himself. Gandara studied in Italy during the Second World War and in Iberia from the late forties through the mid-fifties; he is a firm supporter of the Triumvirate's influence in Ecuador.\n\nThough Ecuador still needs American support for now, it is uncertain how long this will last - especially given the possibility of military conflict with its southern neighbor."
 ECU_idea_pragmatism_above_all: "Pragmatism Above All"
 ECU_idea_pragmatism_above_all_desc: "If one phrase sums up the Arosemena brothers' government, it is 'caught between a rock and a hard place.'\n\nThough many joined with the best hopes for the country, all proved helpless before the reality of Ecuador's vicious cycle, forced to bend to powers above their own.\n\nYet the military need only follow Washington's orders, which has given the green light to many of the reforms Ecuador needs. The government will pragmatically address all problems and act accordingly, securing for Ecuador the future it deserves."
 ECU_idea_el_plan_quinquenal: "The Five-Year Plan"
 ECU_idea_el_plan_quinquenal_desc: "Burdened by heavy reparations and crippling debt, Ecuador was already overmatched; under the previous government, she was utterly incapable of meaningful investment in herself, with the meager profits scraped together going entirely to foreign creditors.\n\nThough Ecuador attempted to negotiate with the United States and Peru to ease its plight, these talks ended in diplomatic humiliation, leaving the country even worse off.\n\nNow, however, the American-backed Gandara government has found a new solution for Ecuador's economy. By suspending debt repayments, reducing reparations to Peru, and securing large low-interest loans for massive investment, the government is launching a sweeping infrastructure investment program to revitalize the moribund economy.\n\nThough these investments bring tremendous benefits to the country, they are temporary and structured as a five-year plan; thus many remain skeptical about the debt outlook, worrying that the investment boom must end one day and the debts will have to be repaid."
 ECU_idea_our_iberian_friends: "Our Iberian Friends"
 ECU_idea_our_iberian_friends_desc: "Iberia's influence in the Americas grows by the day, and Hispanidad finds favor in many countries; Velasco has found an ally for Ecuador among the former colonial powers.\n\nBefore the 1960 coup, Iberia poured large investments into Ecuador, becoming one of its largest trading partners. After the coup, Iberia offered asylum to the caudillo and his supporters, supporting their return to their homeland to reclaim power.\n\nThese efforts paid off: after Velasco returned to power, Iberia became Ecuador's largest trading partner and source of investment, with Iberian goods flooding the Ecuadorian market and dominating its economy.\n\nThough investment has proven to nourish Ecuador's dying economy, raising employment and living standards, Iberia's aid stems not from naive benevolence but from its own interests in the country and the region; overreliance on them is therefore dangerous."
 ECU_idea_populism_and_progressivism: "Populism and Progressivism"
 ECU_idea_populism_and_progressivism_desc: "No words suit Velasco Ibarra better than populism and progressivism.\n\nAfter the Glorious Revolution of 1944, Velasco rose to Ecuador's political stage. Through skillful use of populist and progressive policies, he brought both conservatives and socialists into his fold, ruling the country for over fifteen years.\n\nThough these methods could not protect him from being ousted, they are why he was invited back. Called a hero by the people, he became the symbol of national unity, of reintegrating a fractured society.\n\nYet after the Arosemena government, the left has grown more radical, while the right has been weakened after the expropriation of oligarch property. Whether Velasco can maintain his extraordinary influence, or whether he will suffocate in the house of cards he built himself, remains to be seen."
 ECU_idea_public_enemy_number_one: "Public Enemy Number One"
 ECU_idea_public_enemy_number_one_desc: "Ecuador has one enemy, a country that has plagued her for centuries and humiliated her twice in the past two decades: Peru.\n\nNo other country weighs so heavily on the Ecuadorian mind, ever arrogant, taking every opportunity to belittle her smaller sister republic.\n\nOr at least this is the line Velasco has set, painting Peru as the root of all Ecuador's problems, the obstacle preventing her from becoming a prosperous and great nation of South America.\n\nTo unite the people against this common enemy, Velasco has launched a massive propaganda campaign, increased funding for the military, and brought in Iberian and Italian advisors to assist in modernization - all to defeat the old enemy and restore Ecuador's glory."
 incompetent_puppet: "Puppet in Everything But Name"
 ECU_Jose_Maria_Velasco_Ibarra: "José María Velasco Ibarra"
 ECU_Carlos_Julio_Arosemena_Monroy: "Carlos Julio Arosemena Monroy"
 ECU_Government_in_Exile: "Government-in-Exile"
 ECU_Rafael_Echeverria_Flores: "Rafael Echeverría Flores"
 ECU_Manuel_Agustin_Aguirre: "Manuel Agustín Aguirre"
 ECU_Jorge_Luna_Yepes: "Jorge Luna Yepes"
 ECU_Marcos_Gandara_Enriquez: "Marcos Gándara Enríquez"
 ECU_Otto_Arosemena_Gomez: "Otto Arosemena Gómez"
 ECU_Reynaldo_Varea_Donoso: "Reynaldo Varea Donoso"
 ECU_Jose_Federico_Intriago_Arrata: "José Federico Intriago Arrata"
 ECU_Otto_Arosemena_Gomez_hog_desc: "§YVice President\nNational Conservatism§!\n--------------\n§LEcuador is no stranger to political dynasties, and Otto Arosemena Gómez represents said history of nepotism perfectly, being none other than the cousin to the President. However, the position of Prime Minister had not been given on those grounds alone, with his Reformist and Modernising attitude making the appointment work.\n\nSurrendering more and more to the state to the oligarchs in a bid to gain their support for his goals, would tremendously weaken the country's economy and increase corruption, significantly worsening living conditions for the majority of the population.\n\nThose sacrifices he forced onto others were worth it though, for the sake of the nation and its future. That future though would be whisked away as the President would ruin the negotiations between the state and the Americans, forcing the Prime Minister to act and meet with the Peruvians to at least guarantee the nation a single victory.\n\nHowever, much like his cousin, he would ruin these negotiations, refusing to compromise with Peru, causing them to call off the talks and ruining any possibility of decreasing the reparations the state was forced to pay, possibly sealing its dark future in stone.§!"
 ECU_Reynaldo_Varea_Donoso_for_desc: "§YMinister of Foreign Affairs\nDespotism§!\n--------------\n§LReynaldo Varea Donoso is not a diplomat. He is nothing much more than a loyal stooge, willing to be a yes man at all times, doing as his President and Prime Minister order him and asking little to no questions afterwards. Such was the case in both negotiations with the Americans and Peruvians, when the Arosemena cousins would destroy any possibility for the regimes to stand on better terms, with Varea being blamed for the failures of both.\n\nBut while some would resign for this, it mattered little for the Foreign Minister, to him the most essential things were his position alongside the money that came with it.§!"
 ECU_Jose_Federico_Intriago_Arrata_eco_desc: "§YMinister of Economy and the Treasury\nDespotism§!\n--------------\n§LHaving been a supporter of Velasco in the past, José Federico Intriago Arrata joined the Arosemena cousins after abandoning his former political home. Much akin to the Prime Minister, Intriago would do so not out of a sense of self-preservation, but instead a wish to better the lives of its people, having grown disillusioned with the lacklustre policies of Velasco.\n\nHe would, however, be utterly incapable of doing anything akin to what he wished. With the economy being under the tight control of the oligarchs' thanks to the backdoor deals of the Prime Minister, the state lacked the means to implement any substantial reform of any sort.\n\nRefusing to give up he would attempt to salvage the state through the negotiations with America and Peru, hoping that the first would give the desperately needed funding the state craved and the second would cut down its tremendous reparations. However, much to his lament, negotiations with both would prove unsuccessful and Ecuador would be abandoned with its economic future dim, to say the least.§!"
 ECU_Marcos_Gandara_Enriquez_sec_desc: "§YMinister of National Defense\nProgressive Conservatism§!\n--------------\n§LNot an appointment by choice but instead by necessity, Marcos Gándara Enríquez stands as the representative of the Military in the government. A constant reminder that despite being incredibly weak after its neutering by the Peruvians, the institution still needed to be respected.\n\nHowever, that feeling was not mutual, with nearly none in the military paying anything but lip service to the government, as Gándara did nothing but serve as a glorified rubber stamp, with the lack of American support and the threat of another Peruvian intervention making any sort of governmental intervention null.\n\nThe failed talks between the Americans and the government would change that. With rumours that Washington had begun to enter backroom talks with the army, giving their support of a coup, many wonder how long it'll take for the military to strike, or if the rumours will stay as nothing but gossip.§!"
 POLITICS_CARLOS_AROSEMENA_MONROY_DESC: "Carlos Julio Arosemena Monroy comes from Ecuador's political elite, yet rather than rely on them, he chose to fight them. He entered politics in the early fifties, achieving some success by supporting Velasco's populist party, but this was still small compared to his ambitions.\n\nFor decades, Velasco grew increasingly hostile to the left, repeatedly turning to the establishment to maintain his rule, making him ever more unpopular with the people. Thus, following the 1959 Cuban Revolution, the Ecuadorian Socialist Revolutionary Party launched an uprising in 1960, seized control of the entire country, and drove Velasco and his administration into Iberia, which had long offered him asylum. But the revolutionary government did not last long; the Peruvians crossed the border, snuffed out the revolutionary flame, and installed a puppet government.\n\nMany chose exile abroad, and among those revolutionaries who remained, few were willing to cooperate with the people who had seized half the country twenty years earlier. Yet Arosemena Monroy did not mind. To protect himself and salvage the nation, Monroy did his utmost to rally those willing to cooperate, forming a cabinet for the Peruvians. The Peruvians accepted this outcome, as Washington had been pressuring Lima to hand power to civilians.\n\nYet Arosemena's rule is constrained by the oligarchs, who have run rampant for decades with Velasco's support and now enjoy the favor and protection of Lima, preventing any major reform. But even in matters he does control, he makes a mess. His alcoholism turned diplomatic conferences in Quito and Washington into national embarrassments, and many wonder how much longer the President can remain in his post."
 POLITICS_MANUEL_AGUIRRE_DESC: "In Manuel Agustín Aguirre Ríos's eyes, the first Ecuadorian revolution of 1944 had its victory stolen by the conservative counter-revolutionaries led by Velasco, who first infiltrated the caudillo's reformist ranks, then began obstructing further reform, then tied Aguirre's hands, and finally abandoned him entirely. To Aguirre, Velasco was but a stumbling block on Ecuador's path to true revolution.\n\nYet not everyone agrees; many still respect caudillo Velasco and his reforms. This was evident in the second Ecuadorian revolution of 1960, when Velasco's ouster enraged the people, who flocked to the Ecuadorian Communist Party and Ricardo Paredes Romero, and with Che Guevara's help overthrew the treasonous oligarchs. Yet before the caudillo could return to lead the country, internal strife began; then Peru invaded, Paredes was tried and executed, and Guevara was deported.\n\nBefore the second revolution, Aguirre and his Ecuadorian Socialist Revolutionary Party were still weak, but after the Peruvian invasion, with his opponents fleeing to Iberia with Velasco, Aguirre stepped forward and reorganized the revolutionary front under Guevarist leadership. They infiltrated the Amazon rainforest, waging guerrilla warfare against Peru and Ecuador, waiting for the moment to act.\n\nWith the Colombian refugee crisis and the subsequent failed military coup, the Ecuadorian people were hungry and cold, the army split, and the regime on the brink; the Socialist Revolutionary Party then struck, shaking the foundations of the nation. They launched popular uprisings across the country, seized key government buildings, took control of the entire country, and declared the third Ecuadorian revolution. Aguirre proclaimed the Socialist Republic of Ecuador, calling on all revolutionary parties in the country to rally around him and his regime, preparing for future reforms and conflicts."
 POLITICS_JOSE_IBARRA_DESC: "No one has ruled Ecuador like José María Velasco Ibarra. For nearly two decades, both the Ecuadorian people and Ecuadorian politics were shrouded in his populism and cult of personality; he was the center of the nation.\n\nWhen he chose to open trade with Iberia rather than the United States, relations between Ecuador and Washington plummeted. The United States supported a coup to overthrow Velasco, hoping to install a pro-American government in Ecuador, while caudillo Velasco and his followers fled to Iberia. There he met with Iberian leaders and many exiled politicians, plotting one day to return to Ecuador and continue pushing his 'Velasquismo.'\n\nFate is a strange thing: the oligarchs who launched the coup against him five years ago now beg him to return as president and save the nation from crisis. He did not hesitate, returning in triumph. He will once again rally the people, becoming Ecuador's savior and hero; then he stabbed the very oligarchs who invited him back, nationalizing large swathes of Ecuadorian land and many oligarch-owned companies. American capital fled in fright, and in his view, this removed the greatest obstacle to Ecuador's prosperity. Meanwhile, Velasco has leaned further toward his Iberian allies, wielding near-absolute power in Ecuador; the only threat comes from the military who fled to the Galapagos, and barring some major upheaval, he will surely sit secure at the summit of power."
 POLITICS_MARCOS_GANDARA_DESC: "Marcos Gándara Enríquez is by nature a scholar; since the Peruvian invasion, he has watched Ecuador's political changes from outside the political arena, writing many in-depth reports on Ecuador and its armed forces.\n\nGándara worked alongside and learned from Iberian, Italian, and American forces, earning the respect of his foreign peers; he considered himself an important figure in the late Velasco regime. Yet the 1960 coup, the socialist uprising, and the subsequent Peruvian invasion upended his plans.\n\nOne policy after another issued from the government, producing one disastrous result after another, the country fractured, and he remained excluded from politics; this made him realize he must take real action. He swallowed his pride and courted Washington, plotting a coup - a coup to overthrow the Arosemena government and replace it with a military junta that would resolve the ills that had plagued Ecuador for half a century.\n\nWith the Colombian civil war resuming, he seized the moment, expelled the civilian government, and took control of the entire country. He will carry out sweeping reforms while keeping the military independent of politics. Yet his true intentions do not match his actions; neither aligning with the United States nor serving as a mere interim government is what he wants, but what he must do."

 POLITICS_TURDAKUN_USUBALIEV_DESC: "Turdakun Usubalievich Usubaliev was born in 1919 to a Kyrgyz peasant family and embraced communism in his youth. He dreamed of a bright future, but when he graduated from Kyrgyz State University in 1941, the Germans destroyed the Soviet Union, leaving the peoples of Central Asia with nothing but rubble.

Clearly, something had gone wrong with communism; equally clearly, communism was not all bad. Thanks to it, a poor peasant's son like him had the chance to receive an education, find employment, and rise in social standing. The main problem with communism, it seemed, was its rejection of the unifying power of religion. Turdakun would not make that mistake again. To reunite the Kyrgyz people, he needed not the promises of the past, but the power that had bound the people together for centuries. This power could also bring Kyrgyzstan support from the outside world.

With this ideal, the Talas Islamic State was born. This nation still adhered to orthodox socialism, but the entire government was infused with a strong religious character. This fusion of different ideologies was the creation of its leader, Turdakun — done, of course, for the benefit of all the Kyrgyz people."
 POLITICS_KALIYNUR_USENBEKOV_DESC: "The decades of chaos left an indelible mark on Kyrgyzstan. That mark is etched into every inch of the land, into the lives of the people, and — in a most striking way — onto the Chairman himself. Kaliynur was born in the former Turkestan Soviet Republic. Under the careful guidance of his parents, he grew into an ideal typical Kyrgyz. Through the stories and legends he heard, he learned of the Tsar's capriciousness and the governor's brutality, and growing up with these tales, he became a model Marxist-Leninist. He then joined the Red Army to defend the land beneath his feet, the people at his side — and the infinite distance, the countless people.

In the end, the Soviet Union fell tragically, and Kaliynur had no choice but to return to his homeland with his comrades. They had hoped to regroup and recover after the disastrous defeat, but instead they faced further firefights. The neighboring states of Tajikistan and Afghanistan were engulfed in war, and as time passed, the Tajiks' position grew increasingly desperate. So Kaliynur led the Kyrgyz People's Red Army against the formidable enemy with extraordinary courage. Unfortunately, in the fighting he fell into the hands of an exceptionally brutal Afghan general, and nearly lost his left eye in a cold prison cell.

Fortunately, Kaliynur was eventually rescued. The rescue came not from a triumphant liberation army, but from a hero without equal — Turdakun Usubaliev. Hand in hand, Kaliynur and Turdakun returned to Kyrgyzstan as tragic heroes who had suffered repeated setbacks. From then on, he resolved to turn to political struggle, to win his own victory in that arena. The people trusted him, supported him, counted on him — and he, for the sake of Central Asia's rebirth from the ashes, would blaze a broad road forward."

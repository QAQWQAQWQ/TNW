 POLITICS_MA_JIYUAN_DESC:0 "The Northwest is a land soaked in blood, where a generation gave their lives, some buried properly, others left to rot in the wilderness. The orphans of these men are filled with resentment, holding tattered weapons, continuing to live on the Loess Plateau. One young man's father was killed by the Japanese army that invaded the Northwest, and his son has kept his father's murder in mind, continuing to rule this land and swearing revenge. He is the son of Ma Bufang, Ma Jiyuan.

After Ma Bufang fell in battle, command of the Ma Clique forces fell to the ambitious Ma Jiyuan. Yet Ma Jiyuan could only watch as Tsujō Masanobu ran rampant in the Northwest, his bloodthirsty bandits committing unspeakable atrocities — burning, killing, and looting. To the south, Tibet probed the border repeatedly, and the weakened Ma forces were powerless to resist. The Ma Clique's enemies may have thought Ma Jiyuan had long forgotten their crimes, but they were wrong. Ma Jiyuan has kept these atrocities in his heart, waiting only for the moment of revenge.

A storm is brewing across China, and the calm before the downpour could be shattered at any moment. The Ma Clique is sharpening its weapons and preparing for battle. Ma Jiyuan will make the bandits who bullied the Ma family and ravaged their homeland pay in blood. Though the Ma forces have suffered heavy losses, they have not been defeated. Ma Jiyuan knows this well. Soon, he will let all of China know that the Ma Clique has risen again."

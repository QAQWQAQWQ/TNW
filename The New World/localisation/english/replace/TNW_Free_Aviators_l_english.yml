 FAV_Yevdokia_Bocharova: "Yevdokia Bocharova"
 POLITICS_YEVDOKIA_BOCHAROVA_DESC: "Yevdokia Davidovna Bocharova has always followed in the footsteps of her parents, who died in the Civil War supporting the Red Army. At eighteen, she enrolled in aviation school, becoming a pilot and instructor. When the Germans invaded, the Soviet Union formed three all-female bomber regiments: the 586th, 587th, and 588th Night Bomber Regiments. Bocharova, already an experienced pilot with ten years of flight time, was selected as a squadron leader in the 588th. Conditions were brutal: they flew outdated biplanes, shut off engines at night for stealth, and bombed without guidance. Despite these limitations, the regiment completed mission after mission, and the terrified Germans dubbed them the 'Night Witches.'\n\nThe Soviet air command collapsed during the chaotic evacuation from Moscow, but Bocharova rallied the 588th and other air units. After an orderly retreat, she settled the scattered air forces on a makeshift runway in the Siberian city of Surgut. In the years that followed, an organization calling itself the Free Aviators rebuilt itself using remnants of Soviet industry from Arkhangelsk, recovered wreckage, and even home workshops, as veteran pilots trained new cohorts. The Free Aviators played a major role in the West Russian War, retaining most of their strength when it ended. Even today, Bocharova continues to scramble pilots to intercept Nazi bombing raids."

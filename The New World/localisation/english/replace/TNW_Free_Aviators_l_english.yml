 FAV_night_witches: "Night Witches"
 FAV_night_witches_desc: "We have never stopped fighting. Not during the war, not during the frantic retreat, not through the long years of chaos and collapse. We have held the front line, ready to scramble against the German invader, even when others who claimed to do the same turned on each other. We have not stopped before, we will not stop now, and we will never stop. When the Germans come with bombers to rain death upon the Russian people, we answer with vengeance. And we win more often than they care to admit. Years ago, the fearful Germans called us the Night Witches, and today their pilots will learn again why that name exists - and it will be all the better if they learn it only as they plummet to earth in their wrecked aircraft."
 FAV_aerial_society: "Aerial Society"
 FAV_aerial_society_desc: "The disproportionate numbers of pilots and aircraft in our lands, together with the experiences and outlooks of our leadership, have resulted in every societal problem being looked at through an aerial lens. We compensate for poor infrastructure with airbridges. We use long-endurance reconnaissance aircraft instead of traditional border patrols. As well as much more besides. Every question posed has an answer in the skies, and we will prove it."
 FAV_collective_improvisation: "Collective Improvisation"
 FAV_collective_improvisation_desc: "Our land, to put it kindly, is barren. Yet we maintain an air force capable of challenging, and occasionally defeating, the Germans - through the most extreme makeshift means: high-performance engines are swapped for tractor ones when worn out; aviation fuel is replaced with distilled grain alcohol; metal wings are patched with canvas and wood. We make things work by any means. This spirit of collective improvisation has become a social ethos, ensuring that no matter the challenge, we do not despair or surrender, but innovate together."

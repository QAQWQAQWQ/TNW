 FAV_training_category: "Training"
 FAV_training_category_desc: "Our numbers are small, and every staff member and pilot is precious. Therefore, ensuring a steady recruitment pipeline for both §GGround Crew§! and §PPilots§! is critical. Flying aircraft to fight the Germans requires §PPilots§!, while repairing and building aircraft relies on §GGround Crew§!.\n\n§PPilots§!: [?FAVRecruitedPilots]\nMonthly §PPilot§! gain: [?FAVPilotGain]\n§GGround Crew§!: [?FAVRecruitedGround]\nMonthly §GGround Crew§! gain: [?FAVGroundGain]\n\nWe are currently [GetFAVPilotGroundFavor]."

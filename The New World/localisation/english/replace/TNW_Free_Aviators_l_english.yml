 FAV.1.a: "PLACEHOLDER"
 FAV.2.t: "A Royal Donation"
 FAV.2.desc: "While it is not unusual to receive donations or even tribute from other warlords for our efforts defending Russian skies, this gift came from a more unexpected source. In the Vyatka region toward Moscow, what appears to be Vladimir I 'the Emperor's' 'empire' has emerged.\n\nPositioning himself as an 'alternative' to both Bolshevik and fascist rulers, he seems to have gained some support in Western Russia, and has decided to show his 'gratitude' for our efforts to protect the skies as best we can. The Emperor has personally donated several aircraft to further aid our work. We suspect that while his gratitude may be genuine, he is largely trying to secure our support for his regime. Regardless, we have thanked him for the donation."
 FAV.2.a: "It seems we should keep an eye on him."
 FAV.3.t: "Casualty Report"
 FAV.3.desc: "Please deliver this communique to Comrade Yevdokia as soon as possible for filing.\n\n-----------------------------------------------------------------------------------------------------------------\nRed Air Force - Standard Casualty Report\n\nEstimated German losses:\n[?FAVGERAdvancedAirCasualties] bombers\n[?FAVGERBasicAirCasualties] fighters\n\nEstimated Soviet losses:\n[?FAVAdvancedAirCasualties] advanced aircraft\n[?FAVBasicAirCasualties] basic fighters\n\n-----------------------------------------------------------------------------------------------------------------\nResources gained:\n[?FAVCasualtyMetalGain] units of scrap metal available.\n\n-----------------------------------------------------------------------------------------------------------------\nReviewed,\nCommissar Yevdokia Rachkevich, [?global.date.GetDateStringNoHour]"
 FAV.3.a: "More comrades have fallen."
 FAV.4.t: "Air Raid Imminent"
 FAV.4.desc: "Reconnaissance report - [?global.date.GetDateStringNoHour]\n\nAll operational pilots scramble immediately - confirmed German air wing approaching numerous civilian targets in the West Russian Military District.\n\n-----------------------------------------------------------------------------------------------------------------\nRed Air Force - Intelligence Report\n\nApproaching bombers: [?FAVGermanBomberWing] aircraft detected\nApproaching fighters: [?FAVGermanEscortWing] aircraft detected\n\n-----------------------------------------------------------------------------------------------------------------\nConfirmed by West Russian reconnaissance teams."
 FAV.4.a: "All pilots, engage permitted."

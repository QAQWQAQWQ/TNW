l_english:
 RD.1.t: "After Election Day"
 RD.1.desc: "The two men shook hands as they entered the Oval Office. 'Congratulations on your re-election, Mr. President,' the first said.\n\n'I am deeply honored,' said President [USA.GetLeader]. And why not be honored? The economy is growing, racial riots are a thing of the past, and most of America has left the shadows of Watergate and the South African War. Everything is going smoothly and stably... except for...\n\n'Mr. Secretary of State, what can you tell me about the two ports?' the president said, sitting behind the Resolute Desk.\n\nThe Secretary of State jumped from his seat, knocking over his chair. He turned toward the office entrance. 'I'll alert the Joint Chiefs immediately -'\n\n'No. What do you take me for, some lunatic from the National Caucus?' President [USA.GetPresidentLastName] chuckled softly, gesturing for the Secretary to sit. 'I won't let things escalate, if that's what you're thinking. I have bigger plans.'\n\nThe Secretary's eyes widened in realization. 'You mean...'\n\nThe president nodded. 'I want a report on my desk by tomorrow morning - every possibility, risk assessment, methodological angles, everything you think I need to know. We'll discuss this in detail with the rest of the cabinet.'\n\n'Right away!'"
 RD.1.a: "And so, the handover began."
 RD_SAF.1.t: "What Do We Do Now?"
 RD_SAF.1.desc: "The Secretary of Defense and the Joint Chiefs bicker endlessly over options for the South African War, while President [USA.GetPresidentLastName] looks on, unable to get a word in. Now that the enemy is proving more stubborn and harder to defeat than expected, the president needs a solution. One option is to focus on nation-building, winning local popular support, and cutting off fascist forces from potential Boer support - a set of proposals put forward by Donald Rumsfeld, collectively known as CORDS. The other option is to go all-in against the Germans, deploying the full weight of the US military to force their surrender.\n\nBoth options have pros and cons. After everyone has had their say, it is time for the president to make the call."
 RD_SAF.1.a: "CORDS is the way to go! The people will love us!"
 RD_SAF.1.b: "Roll out the tanks, fill the bombers with fuel!"
 RD_SAF.11.t: "Taking Over the Mess"
 RD_SAF.11.desc: "After the new Commander-in-Chief took office, he quickly realized a painful truth: the South African War is not over. This war is one of the main problems the new president must solve. Clearly, the longer this war drags on, the more the public and the military will grow to hate it. Therefore, we must take new measures to stabilize the situation while driving the radical Boers and German invaders out of South Africa, achieving final American victory."
 RD_SAF.11.a: "Save us, Mr. President!"
 RD_SAF.2.t: "Meeting Rumsfeld"
 RD_SAF.2.desc: "'Mr. President, I truly hope you will look at my proposal.'\n\nDonald Rumsfeld set his coffee on the side table, glancing at the presidential seal on the coaster. Now Donald had his hair cut short, chin tight, looking exactly as he had as a defensive lineman at Princeton. President [USA.GetPresidentLastName] stared at the report title on the Resolute Desk:\n\nEvaluating the Value of Force Ratios in Counterinsurgency Operations\n\n'What I see is that your views are at odds with most of the senior leadership, including the cabinet.'\n\n'That is true, and with respect, Mr. President, McNamara's focus is wrong. He talks about embedding advisors in some department, or deploying troops in some province, as if we are so strong. From what I know, he worships numbers, so that makes sense. But numbers are not everything. We need to focus on counterinsurgency, and we need to liberate South African territory to fight the Germans. I know as well as you do that we must protect American lives, but the attrition on South African territory is also a major issue - unless we solve it, we cannot protect anyone. We need to be smart about this.'\n\nPresident [USA.GetPresidentLastName] thought it over. Rumsfeld's proposal was interesting, and he clearly knew his stuff."
 RD_SAF.2.a: "We'll consider this plan."
 RD_SAF.4.t: "Risk Assessment"
 RD_SAF.4.desc: "'Mr. President, please see Appendixes A through D.'\n\nPresident [USA.GetLeader] skipped past the above sections of Defense Secretary McNamara's hundreds-page report. As he browsed tables and charts, his lips tightened: as expected, casualty estimates were accompanied by recommendations such as 'extended flight time,' 'increased munitions delivery,' and 'effective use of incendiaries,' along with their 'corresponding improvements.' Where specific points were made, the report included exact figures and units mentioned.\n\nMcNamara was not just feeding data into the war; he treated death as a variable one could add, subtract, multiply, and divide. In hindsight, it was exactly as Ford's most brilliant mind had predicted. Perhaps he saw the conflict as an auto plant problem to be solved, and the people involved as no different from spare parts on a manager's requisition order. That would at least explain why data charts took up nearly half of this massive document. But what did the president himself think?\n\nHe frowned and turned to the Secretary. 'So,' he began, 'this... is all your idea. How many will we lose?'\n\n'About a hundred,' McNamara replied coolly, 'including the escort group. It is within acceptable limits.'\n\n'How many will they lose?'\n\nThe statistician's mouth curved into a faint smile. 'Several orders of magnitude more.'\n\nThe Commander-in-Chief sighed. Still, McNamara had ideas, even if they might go wrong. Either way, it was better than nothing, and he approved."
 RD_SAF.4.a: "'If necessary, burn the Nazis.'"
 RD_SAF.5.t: "Technical Specifications"
 RD_SAF.5.desc: "McNamara's pointer fell on the blueprints on the wall: front, side, and isometric projections of the aircraft. President [USA.GetLeader] and his staff watched intently, the whole intelligence room wreathed in smoke.\n\nThe Secretary began his briefing: 'The B-52D Stratofortress is an eight-engine turbojet bomber that entered service in December 1956. It has a crew of six, can fly 6,400 nautical miles without refueling, and has a service ceiling of 45,000 feet - several thousand feet higher than the Me 262. Recent modifications to its bomb bay allow a maximum payload of four Mark 39 hydrogen bombs or 60,000 pounds of conventional ordnance, such as Mk-82 and Mk-84.'\n\n'Currently, Eighth Air Force has about 170 units, divided into three air groups on standby at Minot and Barksdale Air Force Bases. They will form the main striking force General LeMay discussed an hour ago.'\n\n'How much damage can they cause?' the president interrupted. McNamara nodded to the projector operator.\n\nThe bomber diagram was replaced by two photographs. The left showed city blocks divided by straight, level roads, filled with rectangular rooftops. Vast farmland surrounded this small settlement. From these features, one could conclude the photo showed a village of perhaps a few hundred inhabitants.\n\nThe right photo was not so; it showed only craters and rubble."
 RD_SAF.5.a: "War winners, the president thought proudly."
 RD_SAF.7.t: "Going for It"
 RD_SAF.7.desc: "After careful deliberation, President [USA.GetPresidentLastName] summoned Rumsfeld and McNamara to the Oval Office. Though confident, he felt the coming conversation would be like telling the children their parents were getting a divorce.\n\n'Mr. President, this is a terrible mistake!' McNamara objected first. 'We are closer than ever to a final, lasting victory!'\n\nRumsfeld objected too. He may not like Bob, but he did not want to look like a coward.\n\n'We cannot just abandon our allies. Pulling out now would be disastrous for our reputation, not to mention all the lives already lost.'\n\nPresident [USA.GetPresidentLastName] was ready for this: 'Bob, Donald, we cannot go on like this. I believe we can secure favorable ceasefire terms, and I believe I have your support on this - it is the best way forward.'\n\nThe two men from the Defense Department stared at each other for a long moment."
 RD_SAF.7.a: "'Yes, Mr. President.'"
 RD_SAF.12.t: "The Cape of Good Hope Incident"
 RD_SAF.12.desc: "'Mr. President, I suggest you clear some time from your schedule. We have received some reports from South Africa that I think you will want to see.' Ten minutes later, President [USA.GetPresidentLastName] lounged in the large leather chair behind the Oval Office, flanked by Donald Rumsfeld and Defense Secretary Robert McNamara, as the general began his briefing.\n\n'We have been receiving telegrams from Cape Town. A small naval engagement occurred a hundred nautical miles southeast of the Cape of Good Hope. Two of our destroyers on patrol in the area, the USS Agholm and the USS Sasfield, were involved. Apparently, the Agholm took several hits, though the attacks did not strike critical areas. We do not know Nazi or South African casualties, but they were probably not severe.'\n\n'You're saying the South Africans got involved too?'\n\n'Yes, this small engagement began when the Reichskommissariat's raiders attacked a South African convoy bound for Durban. Our destroyers were ordered to investigate, and one of them was attacked. To be honest, the Nazis probably attacked our ship by accident, mistaking our convoy for a South African one, and they withdrew quickly after the attack.'\n\n'That is a pity,' McNamara interjected. 'If it were a real battle, it would provide the impetus we urgently need, and we could push through...'\n\n'Who says it isn't?'\n\n'Mr. President, please clarify.'\n\n'If we say it was a battle, who can contradict us?'"
 RD_SAF.12.a: "'I like your thinking, Mr. President.'"
 RD_SAF.13.t: "A Little Fraud"
 RD_SAF.13.desc: "'Mr. President, you are right - who says it isn't a battle? But we can make it more convincing. Our report says damage was limited to outer armor, but the public is not exactly well-versed in naval terminology. We can call all "penetration wounds" "breaches." Doesn't that sound much more serious?'\n\n'Also, what if we cleared the sick bay when the ships entered port, then transferred every sailor with a hangover, seasickness, or syphilis to the hospital? We can release the number transferred, but omit the causes. Most importantly, we are not lying at all - we are just... selectively reporting.' McNamara, who had stood up halfway through the briefing, calmly sat back down, signaling his presentation was over. After a brief silence, it was the turn of McNamara's colleague across the table, Donald Rumsfeld: 'Mr. President, what I am certain of is that the people do not like being misled. I can assert that McNamara's approach will only come back to haunt us. Moreover, I do not think we need to do this - even without embellishment, everyone knows the Nazis fired on American ships.'\n\n'I am not sure,' President [USA.GetPresidentLastName] replied. 'I know a few congressmen need a push...'"
 RD_SAF.13.a: "'...a moving war story will win everyone over to our cause.'"
 RD_SAF.13.b: "'...but a foreign power firing on American ships is enough.'"
 RD_SAF.14.t: "Truth Is Relative"
 RD_SAF.14.desc: "'Mr. President, this is a good start, but I still feel it is not enough. Many people remain skeptical about the African war, and I think it will take time to convince the majority.' McNamara turned to the next page of the report. 'For instance, could we frame this as our country, not South Africa, being attacked? We can say they attacked a transport convoy and our destroyers moved in to support - that way the people can make up their own story. And regarding the numbers, perhaps you can look at the end of the second page here...'\n\n'"Multiple unconfirmed sonar contacts" - the admiral says these might include ships we did not encounter, but they might as well all be ships we did not encounter. Then add a few more ships, and a few submarines - that way the threat we face looks much more serious.' McNamara closed the folder, seemingly ending his brief presentation.\n\n'I still object,' Rumsfeld interjected. 'Integrity matters. We should not let such thoughts jeopardize our interests.'\n\nAfter weighing his options, President [USA.GetPresidentLastName] spoke: 'Well, people really do hate submarines...'"
 RD_SAF.14.a: "...add it to the report!"
 RD_SAF.14.b: "...but this is going too far."
 RD_SAF.15.t: "An Important Invention"
 RD_SAF.15.desc: "'I am satisfied with the revisions to this report, but I feel there is one more thing worth adding.' McNamara said. 'I reviewed a report from the Cape Town radar station. The images forty-five minutes after the event were very similar to those thirty minutes before it. The only possibility is another, smaller engagement: an aftershock following the main quake. If we write in the report that the Nazis attacked twice, then no one will question their intentions, much less the importance of retaliation. That will prove to everyone: we are serious.'\n\nSeeing McNamara finish, the president breathed a sigh of relief. He looked at Rumsfeld, who was intently studying the report in front of him. It seemed the man had no further objections. Now, President [USA.GetPresidentLastName] must make the decision alone."
 RD_SAF.15.a: "'No problem, we'll add it to the report.'"
 RD_SAF.15.b: "'No need to fabricate anything.'"
 RD_SAF.16.t: "Address to the Nation"
 RD_SAF.16.desc_no_lie: "'My fellow Americans, I speak to you today to tell you that a new threat to our nation's security has emerged. Our ships were attacked by foreign vessels at 21:17 local time last night, a hundred nautical miles southeast of the Cape of Good Hope. This small engagement began when the Reichskommissariat's raiders attacked a South African transport convoy. The Navy's destroyers Agholm and Sasfield were ordered to investigate. Upon arriving in the area, they were attacked without warning, and our ships returned fire. After a brief battle, the Germans were forced to withdraw. Our fleet suffered minimal casualties; the Agholm's armor sustained minor damage, and fortunately there were no personnel losses.\n\nThe conclusion is clear: the Germans in Africa no longer distinguish between American and South African ships. Further attacks pose a serious threat to American interests and vessels, with the goal of driving us out of Africa and threatening elsewhere. We must not yield! Before me lies a proposal to strengthen American forces and support our brave South African allies. To end German tyranny in Africa once and for all, we must throw our full weight into South Africa's fight against the Nazis - no other path leads to victory. For the safety of our nation, I urge every senator and representative to support this bill, and every able-bodied citizen to join our armed forces. Let us unite against a foreign foe, and bring peace and justice to Africa.'"
 RD_SAF.16.desc_one_lie: "'My fellow Americans, I speak to you today with a heavy heart to inform you of a new threat to our nation's security. Our ships were attacked by foreign vessels at 21:17 local time last night, a hundred nautical miles southeast of the Cape of Good Hope. This small engagement began when the Reichskommissariat's raiders attacked a South African transport convoy. The Navy's destroyers Agholm and Sasfield were ordered to investigate. Upon arriving in the area, they were attacked without warning, and our ships returned fire. After a brief battle, the Germans were forced to withdraw. Fortunately, our casualties were minimal. The Agholm took several hits, and seven sailors were hospitalized after reaching port. Fortunately, no further casualties have been reported.\n\nThe conclusion is clear: the Germans in Africa no longer distinguish between American and South African ships. Further attacks pose a serious threat to American interests and vessels, with the goal of driving us out of Africa and threatening elsewhere. We must not yield! Before me lies a proposal to strengthen American forces and support our brave South African allies. To end German tyranny in Africa once and for all, we must throw our full weight into South Africa's fight against the Nazis - no other path leads to victory. For the safety of our nation, I urge every senator and representative to support this bill, and every able-bodied citizen to join our armed forces. Let us unite against a foreign foe, and bring peace and justice to Africa.'"
 RD_SAF.16.desc_two_lie: "'My fellow Americans, I speak to you today with sorrow and anger to inform you that a new threat faces our nation's security. Two of our destroyers, while on patrol protecting American merchant convoys, were attacked by German Reichskommissariat vessels at 21:17 local time last night, a hundred nautical miles southeast of the Cape of Good Hope. The engagement began when Nazi warships and submarines attacked our transport vessels. The Navy's destroyers Agholm and Sasfield were on patrol in the area and quickly moved to support our ships. After a heroic fight, the Germans were forced to withdraw. By the grace of fortune, our casualties were minimal. The Agholm took several hits, and seven sailors were hospitalized after reaching port. Fortunately, no further casualties have been reported.\n\nThe conclusion is clear: the Germans in Africa no longer distinguish between American and South African ships. This cowardly attack marks only the beginning of their ambition to strike our ships, harm our people, drive us out of Africa, and violate our land. We must not yield! Before me lies a proposal to strengthen American forces and support our brave South African allies. To end German tyranny in Africa once and for all, we must throw our full weight into South Africa's fight against the Nazis - no other path leads to victory. For the safety of our nation, I urge every senator and representative to support this bill, and every able-bodied citizen to join our armed forces. Let us unite against a foreign foe, and bring peace and justice to Africa.'"
 RD_SAF.16.desc_three_lie: "'My fellow Americans, I speak to you today with great anger. Our nation was attacked at 21:17 local time last night. Two of our destroyers, while on patrol protecting American merchant convoys, were attacked by German Reichskommissariat vessels a hundred nautical miles southeast of the Cape of Good Hope.\n\nThe engagement began when Nazi warships and submarines attacked our transport vessels. The Navy's destroyers Agholm and Sasfield were on patrol in the area and quickly moved to support our ships. After a heroic fight, the Germans were forced to withdraw. By the grace of fortune, our casualties were minimal. The Agholm took several hits, and seven sailors were hospitalized after reaching port. Fortunately, no further casualties have been reported. A second engagement erupted twenty nautical miles south of the attack site; fortunately, we suffered no major losses.\n\nThe conclusion is clear: the Nazis in Africa pose a grave threat to America and her sailors. This cowardly attack marks only the beginning of their ambition to strike our ships, harm our people, drive us out of Africa, and violate our land. We must not yield! Before me lies a proposal to strengthen American forces and support our brave South African allies. To end German tyranny in Africa once and for all, we must throw our full weight into South Africa's fight against the Nazis - no other path leads to victory. For the safety of our nation, I urge every senator and representative to support this bill, and every able-bodied citizen to join our armed forces. Let us unite against a foreign foe, and bring peace and justice to Africa.'"
 RD_SAF.16.a: "Now it is up to Congress."
 RD_SAF.17.t: "Awoken Abruptly"
 RD_SAF.17.desc_one_lie: "'Mr. President, I am sorry to disturb you this morning, but I think you need to know about this as soon as possible.' The aide pointed to the newspaper, half the size of a breakfast plate. 'Somehow, details of the Cape of Good Hope incident have been leaked to the press. The leaked report conflicts with our account on several key points, so naturally, they have taken us to task.' President [USA.GetPresidentLastName] picked up the paper, trying to make sense of it.\n\n'The Truth About the Cape Town Incident'\n\n'...the Agholm allegedly took "several hits," but in fact it sustained only minor damage, described by our sources as "a small scrape..."'\n\n'...in fact, no sailors were injured. Those urgently transferred to shore hospitals were suffering from conditions unrelated to the engagement...'\n\n'...it is hard to say the Agholm was the target of the attack; in fact, it was probably attacked by accident...'\n\n'...our government says this incident crossed a line and requires a response to such shameless aggression. On the contrary, it is a ludicrous fabrication designed to drag us into a conflict on the other side of the world...'\n\n'We have already received calls demanding an explanation. Mr. President, the anti-war activists will certainly make the most of this.' [ROOT.GetLeader] rubbed the last traces of sleep from his eyes and finally spoke."
 RD_SAF.17.desc_two_lie: "'Mr. President, I am sorry to disturb you this morning, but I think you need to know about this as soon as possible.' The aide pointed to the newspaper, half the size of a breakfast plate. 'Somehow, details of the Cape of Good Hope incident have been leaked to the press. The leaked report conflicts with our account on several key points, so naturally, they have taken us to task.' President [USA.GetPresidentLastName] picked up the paper, trying to make sense of it.\n\n'The Truth About the Cape Town Incident'\n\n'...the Agholm allegedly took "several hits," but in fact it sustained only minor damage, described by our sources as "a small scrape..."'\n\n'...in fact, no sailors were injured. Those urgently transferred to shore hospitals were suffering from conditions unrelated to the engagement...'\n\n'...the number of Reichskommissariat vessels has been greatly exaggerated...'\n\n'...the raid on South African ships has been distorted into an attack on America...'\n\n'...it is hard to say the Agholm was the target of the attack; in fact, it was probably attacked by accident...'\n\n'...our government says this incident crossed a line and requires a response to such shameless aggression. On the contrary, it is a ludicrous fabrication designed to drag us into a conflict on the other side of the world...'\n\n'Crowds have already taken to the streets, Mr. President, and more will likely join the protest once people wake up. The anti-war activists will certainly make the most of this.' [ROOT.GetLeader] rubbed the last traces of sleep from his eyes and finally spoke."
 RD_SAF.17.desc_three_lie: "'Mr. President, I am sorry to disturb you this morning, but I think you need to know about this as soon as possible.' The aide pointed to the newspaper, half the size of a breakfast plate. 'Somehow, details of the Cape of Good Hope incident have been leaked to the press. The leaked report conflicts with our account on several key points, so naturally, they have taken us to task.' President [USA.GetPresidentLastName] picked up the paper, trying to make sense of it.\n\n'The Truth About the Cape Town Incident'\n\n'...the Agholm allegedly took "several hits," but in fact it sustained only minor damage, described by our sources as "a small scrape..."'\n\n'...in fact, no sailors were injured. Those urgently transferred to shore hospitals were suffering from conditions unrelated to the engagement...'\n\n'...the number of Reichskommissariat vessels has been greatly exaggerated...'\n\n'...the raid on South African ships has been distorted into an attack on America...'\n\n'...the "second engagement" appears to be a complete fabrication...'\n\n'...it is hard to say the Agholm was the target of the attack; in fact, it was probably attacked by accident...'\n\n'...our government says this incident crossed a line and requires a response to such shameless aggression. On the contrary, it is a ludicrous fabrication designed to drag us into a conflict on the other side of the world...'\n\n'Crowds have already taken to the streets, Mr. President, and more will likely join the protest once people wake up. The anti-war activists will certainly make the most of this.' [ROOT.GetLeader] rubbed the last traces of sleep from his eyes and finally spoke."
 RD_SAF.17.a: "'God damn it.'"
 RD_SAF.18.t: "Cape Resolution Rejected!"
 RD_SAF.18.desc: "President [GetPresidentLastName]'s South African strategy faces an uncertain future after the Cape Resolution was defeated in Congress. The resolution would have authorized the president, in writing, to take all necessary measures to retaliate for the Cape of Good Hope incident, promote international peace and security in Africa, and provide legal justification for American intervention in the African conflict. It would have allowed the [GetPresidentLastName] administration to implement its strategy of winning the war through overwhelming force. Its failure now casts doubt on the entire strategy.\n\nThose seeking to shift blame have turned their eyes on the Defense Secretary. As the chief architect behind President [GetPresidentLastName]'s South African strategy, Robert McNamara will certainly face intense scrutiny in the coming weeks as the government considers its options."
 RD_SAF.18.a: "We'll have to find another way."
 RD_SAF.19.t: "Cape Resolution Passed!"
 RD_SAF.19.desc: "Earlier today, Congress passed the Cape Resolution, authorizing President [USA.GetPresidentLastName] to take all necessary measures to conduct retaliatory military operations for the attacks around the Cape of Good Hope and maintain international stability in Africa. In short, the resolution's passage constitutes the legal basis for the American government's intervention in the South African War.\n\nThe president has called for a strengthened American military presence on the African continent; vast quantities of small arms, armored vehicles, fuel, and ammunition are flowing to the South African government. Soon, American Army, Navy, and Air Force personnel will follow, joining the embattled South African forces against the evil Reichskommissariat coalition.\n\nMost observers agree this is a major victory for Defense Secretary Robert McNamara. The powers the president gains through the Cape Resolution will allow the [USA.GetPresidentLastName] administration to throw itself fully into the war, advancing along McNamara's proposed strategy of victory through overwhelming force. Whatever happens next, the fates of the American government and the South African regime are more closely intertwined than ever."
 RD_SAF.19.a: "Politics are over; now we focus on the war."
 RD_SAF.20.t: "The Cape of Good Hope Incident"
 RD_SAF.20.desc: "At 21:17 last night, an incident occurred a hundred nautical miles southeast of the Cape of Good Hope. A transport convoy bound for Durban clashed with a Reichskommissariat raiding force. As our ships began to withdraw in order, two American destroyers arrived on the scene, observing the ongoing small engagement. The Nazi raiders probably mistook the new arrivals for our own and changed targets, opening fire on the Americans before withdrawing hastily.\n\nNeither side appears to have suffered casualties, but the incident has nonetheless caused quite a stir across the Atlantic. The [USA.GetPresidentLastName] administration is calling on its nation to retaliate, citing 'this attack on American freedom of navigation, threatening our sailors' access to African and other waters.' President [USA.GetPresidentLastName] has privately told us he intends to substantially increase American aid to South Africa and find a way to join our war - and this perhaps gives him the excuse to do so."
 RD_SAF.20.a: "See how things develop."
 RD_SAF.21.t: "Cape Resolution Passed!"
 RD_SAF.21.desc: "Late last night, the US Congress passed the Cape Resolution, authorizing President [GetPresidentLastName] to take all necessary measures to retaliate for the Cape of Good Hope incident and promote international peace and security in Africa. The [GetPresidentLastName] administration has privately assured us they will do everything possible to help us win this war, and now it seems they have explicit approval to do so.\n\nThe president has called for a major American troop increase in South Africa, and vast quantities of small arms, tanks, fuel, and shells are on their way to South Africa, to the benefit of our armed forces. Soon, American soldiers and airmen will follow, joining our fighters against Germany's African Reichskommissariat.\n\nThe atmosphere around Cape Town is festive. Both in the streets and in government, many believe the turning point of the war has arrived, and victory will come to Africa alongside the Americans. Some warn their involvement will come at a price, but that is certainly a problem for later. Whatever happens next, our fate is more closely tied to the Americans than ever."
 RD_SAF.21.a: "Uncle Sam is really here."
 RD_SAF.22.t: "Cape Resolution Rejected!"
 RD_SAF.22.desc: "President [GetPresidentLastName]'s South African strategy faces an uncertain future after the Cape Resolution was defeated in Congress. The resolution would have authorized the president, in writing, to take all necessary measures to retaliate for the Cape of Good Hope incident, promote international peace and security in Africa, and provide legal justification for American intervention in the African conflict.\n\nThis is undoubtedly a major blow to us. For some time, the [GetPresidentLastName] administration has privately assured us they were prepared to send more equipment and soldiers to reinforce us, but lacking a legal channel, people doubt whether they can deliver on those assurances. A representative of their government apologized and assured us they would continue to find ways to provide us more support, but for the foreseeable future, it seems we will have to fight on without them."
 RD_SAF.22.a: "Uncle Sam is still in his tent."
 RD_SAF.23.t: "The Cape of Good Hope Incident"
 RD_SAF.23.desc: "At 21:17 last night, an incident occurred a hundred nautical miles southeast of the Cape of Good Hope. A small raiding force of the African Fleet, en route to Durban, clashed with a transport convoy flying the South African flag. Scouts reported the escort was weak, and the Rear Admiral ordered an attack. However, before our ships closed with the enemy, they were reinforced by two destroyers, and the order was given to disengage and successfully withdraw.\n\nUpon careful comparison, these destroyers were not South African Navy but US Navy - though our forces discovered this only after opening fire on them. Our naval commanders have assured us that American ships could not have been damaged much by our vessels at that range, but the Americans are interpreting this incident as a blatant attack on their navy, clearly spoiling for a fight. According to our sources in that country, President [USA.GetPresidentLastName] has been looking for an excuse to jump into this morass for some time, and this 'incident' may provide the pretext they need."
 RD_SAF.23.a: "Continue monitoring the situation."
 RD_SAF.24.t: "Cape Resolution Passed!"
 RD_SAF.24.desc: "Late last night, the US Congress passed the Cape Resolution, authorizing President [USA.GetPresidentLastName] to take all necessary measures to retaliate for the Cape of Good Hope incident and promote international peace and security in Africa. For some time, informal sources have told us that the [USA.GetPresidentLastName] administration has been seeking an opportunity to intervene in the war, and this resolution provides the legal basis to do so.\n\nPresident [USA.GetPresidentLastName] has called for a major American troop increase in South Africa, and vast quantities of small arms, tanks, fuel, and shells are on their way to South Africa, supporting allies on the African continent. Soon, American soldiers and airmen will follow, fighting alongside those damned South Africans.\n\nThough our superior doctrine, will, and fighting spirit will surely win us this war, the Americans' arrival will significantly boost enemy manpower and morale in the short term, and a quick victory is now off the table."
 RD_SAF.24.a: "Uncle Sam is really here."
 RD_SAF.25.t: "Cape Resolution Rejected!"
 RD_SAF.25.desc: "President [USA.GetPresidentLastName]'s South African strategy faces an uncertain future after the Cape Resolution was defeated in Congress. The resolution would have authorized the president, in writing, to take all necessary measures to retaliate for the Cape of Good Hope incident, promote international peace and security in Africa, and provide legal justification for American intervention in the African conflict.\n\nFor some time, informal sources have told us that the [USA.GetPresidentLastName] administration has been seeking an opportunity to intervene in the African conflict. This development now puts those fears to rest for the foreseeable future. Our opponents foolishly hoped the Americans would come to save them, not understanding that a society as degenerate as theirs could never summon the courage needed for large-scale intervention. Their current disappointment will surely hit our opponents' morale. We are naturally assured of victory, but the day of victory seems to have come earlier than expected."
 RD_SAF.25.a: "Uncle Sam is still in his tent."

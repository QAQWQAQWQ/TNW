 YEM_the_aden_arsenal: "The Aden Arsenal"
 YEM_the_aden_arsenal_desc: "The Italians imposed protectorate status on Yemen, and the country's most prized trophy — the port of Aden — fell into their hands. This traditional Indian Ocean port was quickly transformed by the Italians into a military base, becoming Rome's largest garrison and fleet assembly point in the southern Arabian Peninsula. Though Aden's residents hate Italian rule, the Aden Arsenal remains a core hub of Italian military power, projecting force into the rugged terrain of Yemen."
 YEM_tribes_and_sects: "Tribes and Sects"
 YEM_tribes_and_sects_desc: "Yemen is a land of hills and ravines, dominated by mountainous terrain dotted with villages. Though the king-imam sits atop his palace in Sana'a, nominally holding supreme power, actual control of the vast countryside rests with tribal chieftains. Compounding this, the ruling Zaidi sect is a minority, and the sectarian divide between the majority Sunni population and the ruling class adds further strife to an already fractured land. Against this backdrop, a growing number of Yemeni youth are embracing reformist pan-Yemeniism, hoping it will spark national transformation."
 YEM_Ahmad_bin_Yahya: "Ahmad bin Yahya"
 YEM_Muhammad_al_Badr: "Muhammad al-Badr"
 NYM_Abdullah_al_Sallal: "Abdullah al-Sallal"
 POLITICS_AHMAD_BIN_YAHYA_DESC: "Libya as the Fourth Shore, Ethiopia contributing manpower, Egypt offering its breadbasket, the Gulf emirates flowing with black gold. As for the Yemeni imamate? At the Tripartite Pact summit in the late 1950s, Mussolini once changed the subject mid-sentence because he could not recall the name of the sitting imam — a perfect footnote to its standing. Ahmad bin Yahya is not a man easily forgotten. This aging tyrant, robed in gold-embroidered cloth and wearing emerald rings, still carries the bearing of a nomadic chieftain, though he is losing his grip in the morphine haze. Under the British, he swore loyalty to the Empire while secretly building his own power; now he does the same to the Italians. If Yemen's barren mountains had been worth the attention of Mare Nostrum, his scheming would long ago have drawn Rome's thunder.`n`nThe irony is that while this tyrant feasts on roast lamb from gold tableware, his starving subjects hang his portrait on every street corner. When caravans carry the jewel-laden imam in procession, fanatical believers crush the railings just to touch the curtains of his palanquin.`n`nAge is eroding this finely tuned double regime. Visitors kneel to kiss his ring-laden hands, and he responds with formulaic blessings — even when he cannot remember their names. Though Rome is content with Yemen's timely tribute, sharp colonial officials have sounded the alarm: when morphine finally consumes this iron-fisted ruler's mind, these mountains with no designated successor may descend into a power vacuum more terrible than famine."

l_english:
 YEM_italian_overlordship: "Italian Hegemony"
 YEM_italian_overlordship_desc: "After World War II, our country fell completely under Italian influence. Due to our location on the Gulf of Aden, they maintain a strong presence here. This means they largely dictate our foreign policy and wield considerable influence over domestic affairs as well."
 YEM_saudi_influence: "Saudi Influence"
 YEM_saudi_influence_desc: "Yemen is nominally a Saudi protectorate, but the Italians have barely managed local affairs, rarely leaving their bases in Yemen except to occasionally stage punitive parades against rebellious tribal leaders. Recently, facing opposition pressure, the Yemeni king has found himself increasingly dependent on Saudi funding and political support to maintain his rule. However, some strongly oppose Riyadh's new entanglement with the southern kingdom."
 YEM.1.t: "Coup Attempt"
 YEM.1.desc: ""
 YEM.1.a: "(Play as the Arab Republic of Yemen)"
 YEM.1.b: "Crush these rebels"
 YEM.2.t: "War Begins"
 YEM.2.desc: ""
 YEM.2.a: ""
 YEM.3.t: "Italian Intervention"
 YEM.3.desc: "The Empire is in crisis. Amid the wave of radicalism sweeping the Middle East, the fragile network of regional alliances and power-sharing agreements has begun to unravel. From the dunes of Dubai to the docks of Alexandria, discontent simmers beneath the surface, ready to destroy everything we have built since World War II.`n`nToday, news arrives of unrest in Yemen. The Sultan is, at best, skeptical of our ambitions, but he remains a key link in the network that holds the Empire together. His son, the reigning monarch, now faces the culmination of years of mismanagement and harsh repression: rebellion.`n`nMore distressing still, the sentiments espoused by Yemeni rebels under the republican Abdullah al-Sallal have found acceptance across the Middle East. Beyond increasingly alarming reports, even the most optimistic voices have little to offer. Whatever comes next, we must prepare for the coming storm."
 YEM.3.a: "Winds of change."
 YEM.4.t: "Arab Republic of Yemen"
 YEM.4.desc: "A civil war has erupted across the sandy, rocky wasteland of the Mutawakkilite Kingdom of Yemen. It is in our interest to support the rebels against the distant Arab kingdom.`n`nThe rebels fight for an Arab republic under the banner of the Ba'ath Party, a pan-Arab nationalist and pseudo-socialist movement with a complex ideology. Importantly, they are challenging Italian and Saudi influence in the oil-rich Gulf, and their faction is also sympathetic to Germany.`n`nIf we provide aid to these Ba'athist rebels and they succeed in overthrowing their Italian puppet monarch, we can expect an expansion of our own geopolitical influence and economic power."
 YEM.4.a: "Another piece on the global chessboard."
 YEM.5.t: "IJN Destroyer Sunk off Yemen!"
 YEM.5.desc: "News spread through outposts and garrisons across the Indian Ocean, until it finally reached the broadcast towers in Tokyo today, with reports of the Gulf of Aden incident coming through the humming receivers. Young signal operators work the radio equipment before them, while behind them nearly the entire command staff — generals and officers alike — stand or sit in the chairs and sofas, mentally preparing for another military clash with Germania or Washington.`n`nThe panicked complaints of active officers and admirals drown out the crackling of the radio; sweat beads on every brow in the command center. The young operator turns knobs and levers, feeling his superiors' eyes fixed on him from behind. Fragmented words and hoarse radio noise piece together a message: an IJN destroyer has been sunk off the coast of a country recently wracked by political turmoil and revolution — Yemen.`n`nSome officers stroke their chins, bracing for the worst of direct confrontation; others adopt deliberately casual poses to relieve the sudden tension. The whole room is shrouded in fear, jaws clenched, brows damp with sweat. Reports of chaos and destruction fly in like snowflakes; the Middle East has been torn apart by fury, and the times compel Japan to join the scramble for this broken land."
 YEM.5.a: "State of emergency!"
 YEM.6.t: "Royalists Victorious"
 YEM.6.d: "I, an absolute monarchist:"
 YEM.6.a: "Waiting for the Burgundians..."
 YEM.7.t: "Salal Victorious"
 YEM.7.d: "Salal is not a Nasserist. Nasser is a Salalist."
 YEM.7.a: "Waiting for the Burgundians..."

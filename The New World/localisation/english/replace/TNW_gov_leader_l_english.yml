 TNW_government_leaders_tt_II: "[TNWgovernmentleaderdesc]"
 SER_government_leaders_tt: "§W[THIS.GetAdjective]§! His Majesty the King"
 POLITICS_ANDREW_I_DESC: "His Majesty the King:§H Andrew I§!\n\n\n\n\n\n\n       £GFX_SER_king_Andrew_I_HM \n\n\n\n\n\n\n§HBy the Grace of God and the Will of the People, King of Serbia — Andrew I.§!\n§W--------------§!\nAndrew Karađorđević, grandson of Peter I, third son of King Alexander I Karađorđević of Yugoslavia and Princess Maria of Romania. By his father's command, the prince was born in Bled and baptized with a Slovenian name. "Andrew" is also a Serbian name, occupying a place in the Serbian Orthodox liturgical year, and holds deep meaning in Christian tradition and culture — for it is the name of the Apostle Andrew, the first apostle of Jesus Christ. Thus, all saw the prince baptized in the name of this saint, the very saint honored by the Karađorđević family at their christening.\n\nHis Majesty graduated from Clare College, Cambridge, with a degree in mathematics, succeeding Peter II on the throne, and has apologized on multiple occasions for his brother's resistance against the Germans. His Majesty is a mild-tempered man, and in this Serbian land, he feels no passionate fervor for anything. He is like a heavy stone, just there — a silent sunstone. Nothing happens to him, just as nothing happens to a sunstone. As for Serbia, he only wishes the nation to be like him, inheriting his character. Where Serbia will ultimately sail, however, remains a mystery."
 ITA_government_leaders_tt: "§W[THIS.GetAdjective]§! His Imperial Majesty the Emperor"
 POLITICS_EMANUELE_IV_DESC:  "His Imperial Majesty:§H Vittorio Emanuele di Savoia§!\n\n\n\n\n\n\n             £GFX_ITA_Emperor_Vittorio_Emanuele       \n\n\n\n\n\n\n§HBy the Grace of God and the Will of the Nation, Emperor of Italy and Ethiopia, King of Sardinia, Jerusalem, and Armenia, King of Albania, Duke of Savoy — Vittorio Emanuele IV.§!\n§W---------------------------------------------------------------------------§!\nWe must obey God rather than men.\n\nFor the Lord's sake, accept every human institution — whether the king, as supreme, or the governors sent by him to punish those who do wrong and to commend those who do right... Show proper respect to everyone, love the family of believers, fear God, honor the king.\n\nEveryone must submit himself to the governing authorities, for there is no authority except that which God has established. The authorities that exist have been established by God... The ruler is God's servant for your good, to carry out God's wrath on the wrongdoer. By me kings reign and rulers issue decrees that are just; by me princes govern, and nobles — all who rule on earth.\n\nFor to us a child is born, to us a son is given, and the government will be on his shoulders. And he will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace — that is, the ultimate, the heavenly King."
 
 THA_government_leaders_tt: "§W[THIS.GetAdjective]§! His Majesty the King"
 POLITICS_RAMA_IX_DESC: "His Majesty the King:§H Rama IX§!\n\n\n\n\n\n\n       £GFX_THA_king_Rama_IX \n\n\n\n\n\n\n§HGreat Patron, Great King of Siam, Leader of the Chula People, Incarnation of Vishnu, Son of Mahidol, His Great Majesty of Land Power and Unrivaled Ability — Rama IX.§!\n§W--------------§!\n"

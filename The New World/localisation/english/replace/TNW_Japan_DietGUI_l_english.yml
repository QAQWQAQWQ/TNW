 JAP_government_action_1:0 "§GWhitewash Achievements§!"
 JAP_government_action_1_tt:0 "The best way to persuade people to support you is, after all, results. Sometimes it takes a bit of spin, but as long as the truth is buried, what isn't persuasive?"
 JAP_opposition_action_1:0 "§RDefame the Ruling Faction§!"
 JAP_opposition_action_1_tt:0 "A protracted war is being waged in the House of Representatives: the battle for supremacy. Fortunately, some legislators will change sides once they learn just how bad their current patron really is - regardless of whether the dirt we feed them is exaggerated..."
 JAP_opposition_action_1_cost:0 "§Y25§!£GFX_political_power_texticon  | §Y2.5%§! £GFX_podium_texticon"
 JAP_GUI_action_2:0 "[getJAPGUIAction2]"
 JAP_GUI_action_2_tt:0 "[getJAPGuiAction2tt]"
 JAP_government_action_2:0 "§GMobilize the Public§!"
 JAP_government_action_2_tt:0 "Rulers do not need the people's approval, but popular endorsement makes governing easier. This action can also persuade some legislators to join your faction, at the cost of some public respect."
 JAP_opposition_action_2:0 "§ROpen Criticism§!"
 JAP_opposition_action_2_tt:0 "A politician must defame his rivals every moment of every day; it is an indispensable part of daily life. As Japanese politicians, the targets of our smears are, of course, our enemies in the House of Representatives."
 JAP_opposition_action_2_cost:0 "§Y25§!£GFX_political_power_texticon  | §Y2.5%§!£GFX_approval_texticon"
 JAP_GUI_action_3:0 "[getJAPGUIAction3]"
 JAP_GUI_action_3_tt:0 "[getJAPGuiAction3tt]"
 JAP_government_action_3:0 "§GLaunch Propaganda Campaign§!"
 JAP_government_action_3_tt:0 "The government's mandate is constitutionally granted, but it also needs the support of the people and the House of Peers. As long as we spend enough on a propaganda campaign, we can win their backing."
 JAP_opposition_action_3:0 "§GLaunch Smear Campaign§!"
 JAP_opposition_action_3_tt:0 "Among the public and the House of Peers, there are many who support our political rivals. Therefore, we must spare no effort to tarnish them and let their supporters see their true faces."
 JAP_opposition_action_3_cost:0 "§Y50§!£GFX_political_power_texticon  | §Y50M§!£GFX_dollar_sign"

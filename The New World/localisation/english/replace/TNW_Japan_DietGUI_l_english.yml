 IJA_button_1_title:0 "§G+¥§!"
 IJA_button_1_tt:0 "§OIncrease Budget§!\n\n[!Japan_Internal_GUI_Sidebar_IJA_Button_1_click_enabled]\nIncreasing the §OArmy§! budget will certainly win them over to the government.\n\n§OArmy§! §Gsupport +5%§!\n§BNavy§! §Rsupport -2.5%§!\n§RKodo-do +1.5%§!\n\n§YEffective every month§![!Japan_Internal_GUI_Sidebar_IJA_Button_1_click]"
 IJA_button_2_title:0 "§G+§!£GFX_army_experience"
 IJA_button_2_tt:0 "§OPromote Officers§!\n\n[!Japan_Internal_GUI_Sidebar_IJA_Button_2_click_enabled]\nWe will promote officers sympathetic to our government, which will please the entire §OArmy§! and gain us useful allies.\n\n§RArmy Experience -10§!\n§OArmy§! §Gsupport +10%§!\n§BNavy§! §Rsupport -5%§!\n§RKodo-do +1.5%§!\n\n§YAvailable every month§!"
 IJA_button_3_title:0 "§R-¥§!"
 IJA_button_3_tt:0 "§RCut Budget§!\n\n[!Japan_Internal_GUI_Sidebar_IJA_Button_3_click_enabled]\nCutting the §OArmy§! budget saves us money, but they certainly won't like it.\n\n§OArmy§! §Rsupport -5%§!\n§BNavy§! §Gsupport +2.5%§!\n§RKodo-do +1.5%§!\n[!Japan_Internal_GUI_Sidebar_IJA_Button_3_click]\n§YAvailable every month§!"
 IJA_button_4_title:0 "§R-§!£GFX_army_experience"
 IJA_button_4_tt:0 "§RDemote Officers§!\n\n[!Japan_Internal_GUI_Sidebar_IJA_Button_4_click_enabled]\nThe government will, for one reason or another, demote several §OArmy§! officers deemed insubordinate. This will make the Army more §Rindependent§!.\n\n§RArmy Experience -5§!\n§OArmy§! §Rsupport -5%§!\n§BNavy§! §Gsupport +2.5%§!\n§RKodo-do +1.5%§!\n\n§YAvailable every month§!"
 IJN_button_1_title:0 "§G+¥§!"
 IJN_button_1_tt:0 "§BIncrease Budget§!\n\n[!Japan_Internal_GUI_Sidebar_IJN_Button_1_click_enabled]\nIncreasing the §BNavy§! budget will certainly win them over to the government.\n\n§BNavy§! §Gsupport +5%§!\n§OArmy§! §Rsupport -2.5%§!\n§RKodo-do +1.5%§!\n[!Japan_Internal_GUI_Sidebar_IJN_Button_1_click]\n§YEffective every month§!"
 IJN_button_2_title:0 "§G+§!£GFX_navy_experience"
 IJN_button_2_tt:0 "§BPromote Officers§!\n\n[!Japan_Internal_GUI_Sidebar_IJN_Button_2_click_enabled]\nWe will promote officers sympathetic to our government, which will please the entire §BNavy§! and gain us useful allies.\n\n§RNavy Experience -10§!\n§BNavy§! §Gsupport +10%§!\n§OArmy§! §Rsupport -5%§!\n§RKodo-do +1.5%§!\n\n§YAvailable every month§!"
 IJN_button_3_title:0 "§R-¥§!"
 IJN_button_3_tt:0 "§RCut Budget§!\n\n[!Japan_Internal_GUI_Sidebar_IJN_Button_3_click_enabled]\nCutting the §BNavy§! budget saves us money, but they certainly won't like it.\n\n§BNavy§! §Rsupport -5%§!\n§OArmy§! §Gsupport +2.5%§!\n§RKodo-do +1.5%§!\n[!Japan_Internal_GUI_Sidebar_IJN_Button_3_click]\n§YAvailable every month§!"
 IJN_button_4_title:0 "§R-§!£GFX_navy_experience"
 IJN_button_4_tt:0 "§RDemote Officers§!\n\n[!Japan_Internal_GUI_Sidebar_IJN_Button_4_click_enabled]\nThe government will, for one reason or another, demote several §BNavy§! officers deemed insubordinate. This will make the Navy more §Rindependent§!.\n\n§RNavy Experience -5§!\n§BNavy§! §Rsupport -10%§!\n§OArmy§! §Gsupport +5%§!\n§RKodo-do +1.5%§!\n\n§YAvailable every month§!"
 Tension_button_1_tt:0 "§GArmy-Navy Joint Training Program§!\n\n[!Japan_Internal_GUI_Sidebar_Tension_Button_1_click_enabled]\nBy organizing joint Army-Navy training exercises, we can slightly increase both services' support and reduce military Kodo-do.\n\n§BNavy§! §Gsupport +2.5%§!\n§OArmy§! §Gsupport +2.5%§!\n§GKodo-do -5%§!\n[!Japan_Internal_GUI_Sidebar_Tension_Button_1_click]\n§YAvailable every month§!"
 Tension_button_2_tt:0 "§GEncourage Joint Service Maneuvers§!\n\n[!Japan_Internal_GUI_Sidebar_Tension_Button_2_click_enabled]\nWith more funding, we can conduct complex maneuvers requiring inter-service cooperation, increasing both Army and Navy support and significantly reducing Kodo-do.\n\n§BNavy§! §Gsupport +5%§!\n§OArmy§! §Gsupport +5%§!\n§GKodo-do -25%§!\n\n§YAvailable every 180 days§!"
 Tension_button_3_tt:0 "§RCrack Down on Military Corruption§!\n\n[!Japan_Internal_GUI_Sidebar_Tension_Button_3_click_enabled]\nCracking down on corruption in both services will reduce Kodo-do, but we will lose some support. After all, no one likes airing dirty laundry.\n\n§BNavy§! §Rsupport -10%§!\n§OArmy§! §Rsupport -10%§!\n§GKodo-do -10%§!\n\n§YAvailable every 48 days§!"
 Tension_button_4_tt:0 "§RStrip General Headquarters of Command Authority§!\n\n[!Japan_Internal_GUI_Sidebar_Tension_Button_4_click_enabled]\nWe can take drastic measures to make it harder for the military to cause trouble, but doing so will severely damage our relationship with both services. This itself may have serious consequences.\n\n§BNavy§! §Rsupport -25%§!\n§OArmy§! §Rsupport -25%§!\n§GKodo-do -40%§!\n\n§YAvailable every §Ryear§!§!"

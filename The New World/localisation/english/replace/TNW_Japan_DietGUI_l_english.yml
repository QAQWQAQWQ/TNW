 JAP_Peers_support_weak:0 "§RWeak§!"
 JAP_Peers_support_average:0 "§YModerate§!"
 JAP_Peers_support_high:0 "§OHigh§!"
 JAP_Peers_support_veryhigh:0 "§GVery High§!"
 JAP_Peers_support_tt:0 "Since it is ultimately the £GFX_podium_texticon §MHouse of Peers§! and the Privy Council that nominate the Prime Minister, £GFX_podium_texticon §MHouse of Peers support§! is critical for any Japanese premier. The Prime Minister must therefore keep them satisfied. Once their §Msupport§! falls below §Y50%§!, the premier's rule becomes §Rprecarious, and may even collapse entirely§!."
 Japan_Internal_GUI_Info_Tab_tt:0 "§WTo maintain government stability, we must manage the various factions and interest groups. To win the support of the £GFX_podium_texticon §MHouse of Peers§!, our faction must hold a majority in the House of Representatives. If we lose that majority, the Peers may lose confidence in our ability to govern and withdraw their §Msupport§!.§!\n\nTo ensure our faction holds a majority in the lower house, we must carefully maintain £GFX_approval_texticon §Bpublic approval§! above §Y30%§!, and keep the military loyal with §OArmy§! and §BNavy§! support for the government of at least §Y20%§!. If support from any of these groups falls too low, legislators sympathetic to them may well leave our faction for another, reducing the seats we control.\n\nIf we lose our majority in the House of Representatives and thereby lose the support of the £GFX_podium_texticon §M§!House of Peers, §Rour government will face collapse.§!§!"

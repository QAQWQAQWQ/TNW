 JAP_D_Conservatives_Ino_desc:0 "§jConservatives§!\n---------------------------------\n§YLeader:§. Tatusaro Ino\n§YBackground:§!\nMinister of Agriculture and Forestry under the 2nd and 3rd Konoe Cabinets and the Tojo Cabinet\nMember of the House of Representatives, Mie 1st District\n---------------------------------\nThe Conservatives are a hallmark of the postwar Yokusankai, though whether they can retain their influence remains to be seen. As their name suggests, their stance is gradual reform - keeping the ship steady without letting it slip beneath the waves.\n\nAs one of the most important Yokusankai factions, whoever becomes Prime Minister needs Conservative support. Their approval is virtually a prerequisite for any legislation to pass."
 JAP_D_Conservatives_Ikeda_desc:0 "§jConservatives§!\n---------------------------------\n§YLeader:§. Shinsuke Ikeda\n§YBackground:§!\nSecretary, Ministry of Justice\nMember of the House of Representatives, Yamagata 2nd District\n---------------------------------\nThe Conservatives are a hallmark of the postwar Yokusankai, though whether they can retain their influence remains to be seen. As their name suggests, their stance is gradual reform - keeping the ship steady without letting it slip beneath the waves.\n\nAs one of the most important Yokusankai factions, whoever becomes Prime Minister needs Conservative support. Their approval is virtually a prerequisite for any legislation to pass."

 JAP_Public_support_tt:0 "For any government that wishes to rule securely, £GFX_approval_texticon §Bpublic support§! is essential - and the Empire of Japan is no exception. Every move of the Prime Minister's administration escapes the notice of no §Bmember of the public§!, and their attitude determines how much support the ruling faction can count on in the §WHouse of Representatives§!. Once public approval falls below §Y30%§!, the ruling faction's §Rstrength declines sharply§!."

 JAP_D_Kidoites_desc:0 "§sKido Faction§!\n---------------------------------\n§YLeader:§! Marquess Koichi Kido\n§YBackground:§!\nHome Minister under the Hiranuma Cabinet\nMinister of Health and Welfare under the 1st Konoe Cabinet\nMember of the House of Peers\nLord Keeper of the Privy Seal\n---------------------------------\nThough the kazoku and Imperial Family already have the House of Peers as a platform to voice their interests, many ambitious aristocrats wish to place representatives in the House of Representatives as well, bypassing the limitations of bicameralism.\n\nThe Lord Keeper of the Privy Seal, Marquess Koichi Kido, is one such figure. In this critical position, whoever cultivates a relationship with him gains a direct line to the Emperor. The bespectacled little marquis is a trusted confidant of many kazoku and Imperial Family members, and has become the foremost champion of aristocratic interests. Though Kido himself is not a member of the House of Representatives, he has earned the loyalty of dozens of legislators who, like him, hope to receive the favor of the nobility."
 JAP_D_Reformists_desc:0 "§QReformists§!\n---------------------------------\n§YLeader:§! Sogo Takagi\n§YBackground:§!\nCommander-in-Chief of the Combined Fleet\nNavy Minister under the Kido Cabinet\nMember of the House of Representatives, Kumamoto 1st District\n---------------------------------\nWithin the Taisei Yokusankai, the Reformists were an insignificant force until the war hero Admiral Sogo Takagi entered politics and became their leading figure. With Takagi's arrival, once-disoriented progressives now find they have reliable support from the Imperial Japanese Navy.\n\nFor most prime ministers, Reformist support certainly makes legislation easier to pass, but their backing is not free and requires many compromises."
 JAP_D_Independents_desc:0 "Though the Taisei Yokusankai has consolidated its de facto position as the Empire's sole party through the yokusan system and Diet endorsement, there remain non-Yokusankai independent legislators in the Diet. These independents have highly varied backgrounds: some are local politicians who won popular support in their districts, while others are former Yokusankai members purged from the party who have yet to face re-election.\n\nIf the Yokusankai were a unified bloc, the independents would be irrelevant. But when the Yokusankai is mired in factional politics and internal strife, their support becomes critical."
 JAP_D_Technocrat_desc:0 "§qTechnocrats§!\n---------------------------------\n§YLeader:§! Okinori Kaya\n§YBackground:§!\nFinance Minister under the Tojo Cabinet\nMember of the House of Peers\n---------------------------------\nTechnocrats like Okinori Kaya believe that governing a nation is like operating a machine. Efficiency and profit run through their veins; they command vast bureaucratic machinery and are a force to be reckoned with.\n\nThough their corporatist leanings earn cold stares and even disdain from other Yokusankai factions, a wise politician must think twice before opposing the technocrats."
 JAP_D_Technocrats_fukuda_desc:0 "§sModerate Technocrats§!\n---------------------------------\n§YLeader:§! Takeo Fukuda\n§YBackground:§!\nChief of the Budget Bureau, Ministry of Finance\nParliamentary Vice-Minister of Finance\nMember of the House of Representatives, Yamagata 2nd District\n---------------------------------\nThe moderate technocrats led by Takeo Fukuda are unique: they flexibly rally conservatives and reformists to pass their bills. Their liberal fiscal stance combined with conservative Japanese values, and emphasis on anti-corruption and social welfare, have made the Fukuda faction the most popular faction in the Yokusankai's history. Though the moderate technocrats have not continued the hardline style of Kaya's tenure and prefer to sit down and negotiate with other factions, their commitment to the technocratic vision remains as firm as ever."
 JAP_D_Technocrats_shiina_desc:0 "§jReformist Bureaucrats§!\n---------------------------------\n§YLeader:§! Etsusaburo Shiina\n§YBackground:§!\nVice Minister of Industry, Manchukuo State Council\nDirector-General of the Total War Mobilization Bureau, Ministry of Munitions\nMember of the House of Representatives, Iwate 2nd District\n---------------------------------\nAfter Etsusaburo Shiina and Nobusuke Kishii rose to power, the once-marginalized reformist bureaucrats finally became an important force in the Diet. Needless to say, their ascent is seen as a threat by both the conservative and reformist wings of the Yokusankai, and even some of Kaya's most loyal followers keep their distance.\n\nNow the reformist bureaucrats' position has grown so strong that neither Ikeda nor Takagi can pass legislation without their consent. Unless the conservatives and reformists are willing to set aside their differences and unite against the reformist bureaucrats, Japan's history will be forever altered by the whims of the Showa demons."

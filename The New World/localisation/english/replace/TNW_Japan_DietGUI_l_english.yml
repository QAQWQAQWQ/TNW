 JAP_GUI_IJA_tt:0 "§OImperial Japanese Army Support§! ([?JAP_IJA_support|Y]§Y%§!)\n\nSupport from the two branches of the Imperial military is critical both to the stability of the §Ggovernment§! and to the Empire's self-defense capability. If support from the §OArmy§! and §BNavy§! for the §Ggovernment§! is not roughly equal, §RKodo-do§! will rise."
 JAP_GUI_IJA_title_sl:0 "§OImperial Japanese Army§!"
 JAP_GUI_IJN_tt:0 "§BImperial Japanese Navy Support§! ([?JAP_IJN_support|Y]§Y%§!)\n\nSupport from the two branches of the Imperial military is critical both to the stability of the §Ggovernment§! and to the Empire's self-defense capability. If support from the §OArmy§! and §BNavy§! for the §Ggovernment§! is not roughly equal, §RKodo-do§! will rise."
 JAP_GUI_IJN_title_sl:0 "§BImperial Japanese Navy§!"
 JAP_GUI_balance_title_sl:0 "§WNeither Branch§!"
 JAP_GUI_Tension_tt:0 "§RKodo-do§! ([?JAP_Tension|R]§R%§!)\n\nCurrently [getJAPDominatingFaction] §Wdominates the military.§!\n\nFor the Empire of Japan, military §RKodo-do§! is an §Rextremely dangerous§! problem. §RKodo-do§! is an abstract value measuring the degree to which the Japanese military acts on its own. The higher §RKodo-do§! rises, the worse the military's internal infighting becomes, and the harder it is for the §Ggovernment§! to control the armed forces."

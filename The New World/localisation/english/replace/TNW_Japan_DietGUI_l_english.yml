 Japan_Internal_GUI_Gov_Stab_tt:0 "Our £jap_govt_stability_texticon §CGovernment Stability§! is §Y[?JAP_government_stability]%§!\n\nDerived from\n §G[?JAP_government_stability_base]%§! base £jap_govt_stability_texticon §CGovernment Stability§![GetJapGovStabPowerTT][GetJapGovStabPeersTT]\n-------------------\n£jap_govt_stability_texticon §CGovernment Stability§! measures confidence and unity within our administration. If our faction holds a majority, retains the trust of the £GFX_podium_texticon §MHouse of Peers§!, and passes legislation, £jap_govt_stability_texticon §CGovernment Stability§! will remain high. If we lose the support of key groups or suffer repeated defeats in the Diet, £jap_govt_stability_texticon §CGovernment Stability§! will take a hit.\n\nIf £jap_govt_stability_texticon §CGovernment Stability§! falls too low, the pressure on us will grow severe. Various forces will push us from office, §Rwhile allowing other factions to attempt forming a government.§!"

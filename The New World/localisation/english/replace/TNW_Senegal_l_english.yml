 WOL_idea_wolofian_stiffness: "Wolofian Stiffness"
 WOL_idea_wolofian_stiffness_desc: "Senegal is one of the longest-standing stable regimes in West Africa, but this stability rests on shaky foundations. The government must carefully balance the pan-African Négritude ideals popular among Senghor's people with the interests of the Wolof majority, who wish to preserve their privileged position. The Republic of Senegal is still a long way from true egalitarian democracy."
 POLITICS_LEOPOLD_SEDAR_SENGHOR_DESC: "Sixteen years of wandering. That is how long it took Léopold Sédar Senghor, the first president of the Republic of Senegal, to reach a place he could call home. Senghor was a poet and an intellectual fluent in French; he was one of the few Black students in colonial France fortunate enough to study at the Sorbonne, and after graduation became a professor of French grammar. Though he openly criticized the racism prevalent in French society, he joined the French army and fought the Nazis with the belief that equality for all would prevail. Sadly, none of that came to pass. Captured by the Germans, he and his comrades were nearly executed, and after being released for medical reasons, he escaped the POW camp.

When the war ended and it became clear there was no hope of liberation in Europe, Senghor returned to West Africa to wrest control from the inept Vichyite colonial government. The new Republic of Senegal was a nation built on the principles of African liberation and Négritude — an anti-colonial concept based on a strong African national culture, partly formulated by Senghor himself. At the same time, President Senghor maintained close ties with the old French Republic and de Gaulle, and allowed some French administrators to serve in his government.

His critics have not shied away from this ambiguity, quickly pointing out the contradiction between his calls for African liberation and his loyalty to the old oppressor. After all, a tiger does not declare its tigritude; it simply pounces on its prey. Black people do not need the permission of some now-irrelevant white man to govern; they need only to claim their birthright. Due to the lack of strong opposition to Senghor within the government, Senegal has become a politically stagnant state; pan-African revolutionaries hope to remove him and his French lapdogs, and establish a state modeled on Cameroon. But after finding his home, Senghor has no desire to wander again. He will make Senegal a shining example for all Africans — and some sacrifices will have to be made."

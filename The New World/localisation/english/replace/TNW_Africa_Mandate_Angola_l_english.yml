 OFN_ANG_FOCUS.1.t:0 "The Luanda Office"
 OFN_ANG_FOCUS.1.desc:0 "\"Reporting, sir, Lieutenant Lopez. Please look at this, sir.\" The officer said, placing a folder on the desk. \"We have received some intelligence and compiled it here. More will likely arrive soon.\" Lopez saluted and left the room. Lavelle looked up from the window, eyeing the file curiously. Though he had seen many such files before, this one showed signs of hard travel - worn edges, damaged cover. But all had one thing in common: a seal bearing an eagle and a shield, surrounded by the words \"Central Intelligence Agency.\"\n\nLavelle flipped through the files, reading each carefully. Whether obtained from cooperation with UNITA or dug out of the old commission archives, the intelligence they could collect was limited. Yet pieced together, they revealed the grim situation of Angola and her people: reports of UNITA and PLUAA guerrillas fighting each other, archives on potential Nazi holdouts, and land surveys documenting the unprecedented destruction the South African War wrought on terrain and infrastructure. Lavelle was shocked. He and the rest of the Luanda Office committee had arrived only days before, yet already they faced a mountain of problems.\n\nClosing the folder, Lavelle rose from his chair and looked out the window. Before him lay the devastated city of Luanda, slowly recovering from near-total destruction during the war. Beyond was the bay and the vast, hazy Atlantic. Lavelle felt Angola's problems were like this ocean - immense, and without end."
 OFN_ANG_FOCUS.1.a:0 "Who knows how deep these waters run?"
 OFN_ANG_FOCUS.2.t:0 "Klaus Dierks' Report"
 OFN_ANG_FOCUS.2.desc:0 "Flipping through the file before him one last time, Klaus Dierks' smile grew wider as he saw his plan finally coming to fruition. Angola has always been a very isolated country, with almost no infrastructure beyond what was needed for resource extraction, and years of Nazi exploitation worsened this. Given that the country is essentially one big rural area with very diverse cultural groups, he devised a plan to overcome these difficulties and lighten the burden on any central government: decentralization.\n\nThough his idea was originally designed for Namibia, with a few modifications it can work in Angola too. Though his critics, eaten by envy, may disagree that he \"trusts a single plan too much\" and will \"endanger the mandate,\" he knows this will only bring prosperity to the Angolan people. He gathered his files and rose to present his report."
 OFN_ANG_FOCUS.2.a:0 "At least he's in good spirits."
 OFN_ANG_FOCUS.3.t:0 "Angolan Reconciliation"
 OFN_ANG_FOCUS.3.desc:0 "At last, the Luanda Conference produced a result many could not believe: a compromise.\n\nNeither UNITA nor the PLUAA could overpower the other, so the new government decided the two forces must cooperate as equals. To many - especially General William W. Momyer - this was a plan doomed from the start.\n\n\"Something must be wrong, sir.\" He told his direct superior John D. Lavelle. \"You and I both know the moment we leave, this agreement will collapse. We can never find a leader both sides will accept, and the contradictions between these factions -\"\n\n\"Cannot be resolved? Yes, I know, but what else would you have me do? Tear up the agreement and tell them to start over? That would only make things worse!\" Lavelle sighed, covering his face. Momyer was not a man to speak out of turn. If things were bad enough for him to report directly to Lavelle, the future might truly be that dark. \"We can only hope peace holds until we withdraw.\"\n\nThe two fell silent. Momyer did not look convinced. Lavelle could not blame him; he had not convinced himself. \"I only hope you know what you're doing, sir.\"\n\nAs his subordinate left and closed the door behind him, Lavelle let out a long, weary sigh. Did he really know what he was doing? That was the question."
 OFN_ANG_FOCUS.3.a:0 "He was no longer so sure."
 OFN_ANG_FOCUS.4.t:0 "The Angolan Reconstruction Program"
 OFN_ANG_FOCUS.4.desc:0 "Near a large construction site guarded by American soldiers in Luanda, there is a tavern; in the evenings, when the workers leave the site, it is always packed. Two workers sit together at a table, holding half-empty glasses. \"I'm telling you, Alberto. These Americans talk big, but they're just friendlier Germans.\" The speaker is Henrique, a burly man approaching middle age. \"They have no intention of leaving this country, the bastards.\"\n\nBeside him sits Alberto, a sturdy young man with a gentle smile out of place on his face. He raises an eyebrow. \"The fact you can say that in public proves the Americans are better than the Germans, doesn't it?\"\n\nIn response, Henrique rolls his eyes as if the question were ridiculous. \"Pah! When you're a slave, there's no such thing as a 'better master.' Maybe some act friendlier, but in the end they're all the same.\" He waves to the bartender. \"Hey, Ernesto! Another round for me and my friend.\"\n\nThis makes Alberto laugh; Henrique is always so full of life. \"You may be right, old man. They say they came here to keep the peace, but the longer they stay, the more I wonder what peace they're here to keep.\"\n\n\"The peace that lets them make money!\" Rafael, an old worker nearing retirement, speaks up. \"It's always like this for outsiders. Right, Henrique?\"\n\n\"You're damn right.\" Henrique agrees, taking another sip of beer. \"It always comes down to their profit.\""
 OFN_ANG_FOCUS.4.a:0 "\"We needn't get our hopes up too high.\""
 OFN_ANG_FOCUS.5.t:0 "UNITA's Wake"
 OFN_ANG_FOCUS.5.desc:0 "At a small outpost a few kilometers from Luanda, Private Hudson and First Class Rodriguez swelter in their uniforms. The African heat is no friend to foreigners, and for these two unfortunates it is like hell. \"How long do you think we'll keep retransmitting this message?\" Hudson asks, wiping sweat from his brow.\n\n\"Until we get a reply.\" Rodriguez says, walking over to the radio. He twists the knobs, adjusting frequencies, listening intently for any response in the silence. \"Still nothing.\" Rodriguez notes. He lights a cigarette, shaking his head unhappily.\n\n\"This is...\" Hudson starts counting silently, \"the tenth time we've rebroadcast this message? I hope those UNITA guys reply soon -\"\n\n\"Shut up, I hear something.\" Rodriguez says, pressing his ear to the radio. \"Get me Mr. Dierks immediately.\"\n\nIn his office, Klaus Dierks sits helplessly at his desk. He had hoped to hold talks with UNITA soon, but as days passed with no word of them, his chances dwindled. Suddenly, the phone on his desk rings. Dierks lazily picks it up, expecting another routine check-in from Lavelle or a local administrator's report. Instead, he hears a gruff man's voice, sounding ostentatious over the line. Dierks cannot help but smile."
 OFN_ANG_FOCUS.5.a:0 "\"This is Jonas Malheiro Savimbi, leader of UNITA. I accept the OFN's offer of assistance.\""
 OFN_ANG_FOCUS.6.t:0 "Contact with the PLUAA"
 OFN_ANG_FOCUS.6.desc:0 "The letter was sent some time ago, but still no reply. When the OFN first tried to contact the PLUAA to open dialogue, it did not take much effort to find them. But persuading them to cooperate with the OFN rather than oppose it was harder. So Lavelle wrote to Neto personally, outlining his vision for a free Angola entirely self-determined by the Angolan people, and how that vision could become reality through full cooperation between the OFN and the PLUAA.\n\nNow, a long time - longer than a round trip of writing, sending, and receiving a letter - has passed, and Lavelle has nearly given up on cooperation, preparing for conflict. Yet just as he finally made up his mind, an aide ran in with a letter, saluting briefly and saying excitedly: \"He's finally replied, sir! He, Agostinho Neto!\"\n\nLavelle grinned, taking the letter from his aide and opening it.\n\n\"To General Lavelle,\n\n\"I wish you well. After consideration, I have decided to accept the offer of cooperation with the OFN. However, as a matter of prudence, cooperation will remain limited.\n\n\"Agostinho Neto\"\"\n\nThough the degree of cooperation was less than he hoped, the mere fact of not having to oppose the PLUAA on everything was a relief to Lavelle."
 OFN_ANG_FOCUS.6.a:0 "A good sign for stability."
 OFN_ANG_FOCUS.7.t:0 "Farewell, Angola"
 OFN_ANG_FOCUS.7.desc:0 "Looking out over Luanda, Lavelle pondered Angola's current situation. Though repairs are incomplete, politics are a mess, and every second the OFN stays in Angola further undermines the carefully built peace, making the end of the mandate and going home seem distant, there is one thing Lavelle must do before they can return.\n\nThat is the Luanda Conference.\n\nThere, the country's political future will be discussed, decided, and agreed upon. Lavelle doubts how much good the conference will ultimately do; the people are so polarized, and not seeing reconstruction through to the end will leave him with a long, lingering regret. But in any case, now is the time to take a leap and see how events unfold."
 OFN_ANG_FOCUS.7.a:0 "We must trust their reason."
 OFN_ANG_FOCUS.8.t:0 "Free Angolan Army"
 OFN_ANG_FOCUS.8.desc:0 "At an American base on the outskirts of Luanda, generals gather around a table in a tent. Two generals in different uniforms sit facing each other, the table the border between them. They are Iko Carreira of the PLUAA and Demosthenes Amos Chilingutila of UNITA. To build an Angolan national defense force, the two have set aside their mutual prejudices for now, choosing cooperation. \"I think that covers what you wanted to discuss.\" Carreira says to the two generals.\n\n\"No, not quite.\" Chilingutila shakes his head, glancing sideways at Carreira's reaction. \"We still haven't decided how the high command will operate. Even setting that aside, we need to reach a conclusion. I still believe generals must fight alongside their men, not sit in the rear ignoring frontline soldiers. A locally autonomous command system is best.\"\n\n\"Are you crazy?\" Chilingutila is stung by Carreira's words. \"Without a strong central command, our army will be routed on the battlefield. Your proposal isn't fit for a modern army, let alone a children's game.\"\n\nChilingutila clenched his fist and looked at Carreira, but spoke calmly. \"That's like not letting soldiers act on their own - what distinguishes them from puppets? A strong wind blows and they all scatter.\" The atmosphere tightened for a moment, and both looked at the worried American general standing in the center of the tent.\n\n\"What do you all think?\" Carreira asks. At first there is hesitation, until someone settles it, and the dissenting voices fade."
 OFN_ANG_FOCUS.8.a:0 "Angola needs a strong central army."
 OFN_ANG_FOCUS.8.b:0 "To solve Angola's problems, we must rely on units' autonomous initiative."
 OFN_ANG_FOCUS.9.t:0 "Meeting with Jonas Savimbi"
 OFN_ANG_FOCUS.9.desc:0 "Though the journey is long, General Lavelle arrives as quickly as possible at UNITA's inland headquarters to meet Jonas Savimbi. UNITA members lead the way, escorting the general to the center of the camp. Savimbi sits in a chair reading documents, a tarp covering the table beside him. \"Commander, the general is here.\" A UNITA guard says.\n\nSavimbi looks up, smiling thinly at Lavelle. \"Please sit.\" The guards salute smartly, and Lavelle sits in another chair. Savimbi speaks: \"General Lavelle, what can I do for you?\"\n\n\"I hope you will fully support Angola's transition to a democratic system.\" Lavelle says earnestly, studying Savimbi's expression.\n\n\"Democracy? Of course! I will do what I can.\" Seeing Savimbi's warm smile, Lavelle understands why so many have flocked to his banner. \"However, if you don't mind, I have a plan to make democracy even better - that is, me being in control...\"\n\n\"So you want a regime run by Angolans?\"\n\nSavimbi pauses. \"Well, of course. I have a better plan for transitioning to democracy more peacefully.\"\n\n\"I see. Then please send me that plan. I will read it carefully.\" Lavelle sees Savimbi is indeed serious, though he himself doubts how useful it will be. \"Well, Commander Savimbi, it is good to see you again. I should be off for the sake of postwar recovery.\" Though Lavelle loves democracy, as he left the tent he could not help wondering whether Savimbi, with his arrogant bearing, could actually maintain a free nation."
 OFN_ANG_FOCUS.9.a:0 "He is America's perfect choice."
 OFN_ANG_FOCUS.9.b:0 "Just another man craving to be a dictator."
 OFN_ANG_FOCUS.10.t:0 "Negotiating with Agostinho Neto"
 OFN_ANG_FOCUS.10.desc:0 "After contacting the PLUAA and meeting Neto, they took Lavelle to Neto's current headquarters, a simple house on Luanda's outskirts. After Lavelle knocked three times, one of Neto's aides finally opened the door, smiling and leading him to the living room. Well, at least the friendliness is a good sign, Lavelle thinks. Entering the living room, he sees Neto for the first time - an unremarkable middle-aged man with glasses, sitting on an old sofa. Not at all what Lavelle expected.\n\nAs Lavelle enters, Neto looks up, grinning, and gestures to the seat beside him: \"Please sit.\" He says to Lavelle. Lavelle sits, and Neto nods happily, continuing: \"I hear you seek cooperation with me, General Lavelle?\"\n\n\"Well-informed as always, quite right.\" Lavelle answers, slightly surprised.\n\n\"Now it's up to me, I assure you. However, if I feel your actions go against the general interests of the Angolan people, I cannot guarantee this cooperation continues. Understand?\"\n\nThe \"Angolan people\" he refers to likely means the PLUAA. \"Yes, acceptable.\" Lavelle answers, wisely choosing not to voice his own opinion.\n\n\"Allow me to say one more thing - I deeply appreciate the OFN's help. You have provided a good environment for the development of socialism, and I thank you sincerely.\" Neto claps Lavelle on the back and grins again, making the general think of Savimbi - though he controls himself and says nothing.\n\nAs he finally ends the brief but productive meeting with Neto, Lavelle wonders: how can a man so dedicated to socialism, however kind and honest he may be, hope to resolve Angola's tensions without using violence?"
 OFN_ANG_FOCUS.10.a:0 "Angola needs a public servant."
 OFN_ANG_FOCUS.10.b:0 "He cannot protect our interests."
 OFN_ANG_FOCUS.11.t:0 "A Well-Concealed Past"
 OFN_ANG_FOCUS.11.desc:0 "Files left by a completely unwitting member revealed entirely unexpected information, and Lavelle's eyes went wide; his shock only grew as he read more. \"What... is this...\"\n\nIt seems Wolfgang Schenck had been fighting for the same goal: liberating Angola. Even at the highest levels of Germany, the commissioner was a contradiction, subverting his superiors' will wherever he thought he could. Though this is far from making up for what he did for Germany's conquest of Africa, there seems to have been some honor left in Schenck's heart.\n\nBefore, the task was merely reconstruction and preparing the mandate for independence. Now Lavelle realizes the need to go further, to realize Schenck's plan. A new Angolan national army must be built, trained, and equipped to meet any threat to peace or danger to independence. The idea is risky both in Africa and at home, but Lavelle knows if he lets this opportunity slip, he will carry it for the rest of his life."
 OFN_ANG_FOCUS.11.a:0 "An unknown dream becomes reality."
 OFN_ANG_FOCUS.12.t:0 "The Namibian Rebellion"
 OFN_ANG_FOCUS.12.desc:0 "Lavelle was going through paperwork in his office when the sound of the door opening interrupted his thoughts. Looking up, Klaus Dierks stood in the doorway. \"Ah, Mr. Dierks. Come in.\" He immediately gave Dierks a small smile. \"What brings you by today? Is something wrong?\"\n\n\"Nothing, sir.\" Dierks answered. \"Nothing we can't handle easily, anyway.\" Entering, he closed the door behind him so no one else could overhear. \"The problem is the southern border, and the Namibian refugees there. The Namibian government-in-exile, the one led by Nujoma, has strong influence among them, and they are becoming... troublesome.\"\n\nLavelle's upturned mouth fell, and his brow furrowed. \"What's going on?\"\n\n\"Nujoma's government is close to the PLUAA, so these refugees could upset Angola's internal balance of power and cause trouble for South Africa. As you know, High Command refuses to recognize Nujoma as a legitimate leader, so we have only two choices.\" Dierks cleared his throat nervously, and Lavelle immediately knew neither would be to his liking. \"We can stick to the OFN's position and handle this ourselves, or we can... leave the problem to South Africa. The choice is yours, sir.\"\n\nAfter weighing two bad options, Lavelle finally made his decision."
 OFN_ANG_FOCUS.12.a:0 "\"We'll do whatever the OFN thinks best.\""
 OFN_ANG_FOCUS.12.b:0 "\"South Africa will handle this.\""
 OFN_ANG.1.t:0 "Angola's Arch-Rivals"
 OFN_ANG.1.desc:0 "Adalberto shook his head and turned off the radio. It was reporting that supporters of Angola's two main political factions had brawled in the streets again.\n\n\"PLUAA versus UNITA.\" Joe said. Two political groups with apparently the same goals, yet they hate each other more than they hate the foreign troops occupying Angola, even killing one another - the humor of this ironic joke was obvious from Joe's expression.\n\n\"Indeed, tragic as it is, it's rather interesting.\" Adalberto answered.\n\n\"Why do they fight? There's only room for one on that chair - is it because both Jonas Savimbi and Agostinho Neto want to sit in it?\"\n\nAdalberto smiled. \"That is part of it. Though PLUAA and UNITA sound similar, their goals for liberating Angola are completely different. UNITA is what Americans call a 'big tent' party, with authoritarian and democratic factions held together by Jonas Savimbi's prestige. The PLUAA, on the other hand, is a more ideologically unified Marxist party. Though it has fewer supporters than UNITA and is less known internationally, the PLUAA controls most cities and is generally a stronger leadership, so it can still hold its own against UNITA.\"\n\n\"Hmm... I wish they could solve things here before we go back.\" Joe said, stroking his chin.\n\n\"Who knows.\" Adalberto shook his head again. \"These two factions have fought nonstop since the Nazis occupied this place; I expect they'll keep fighting even after you leave.\""
 OFN_ANG.1.a:0 "Heretics are those who agree with you on 99% of things."
 OFN_ANG.2.t:0 "Rádio Angola: UNITA Massacre!"
 OFN_ANG.2.desc:0 "Outside Malanje is a former SS radio station; Rádio Angola's morning broadcast can be heard across the country. Though openly biased and sometimes unprofessional, for many urban Angolans it is the primary news source, its naked partisanship a stark contrast to American-style centrist propaganda. Today, it brings a story of defeat, anger, and revenge.\n\n\"Good morning, people of Angola. I'm João Gonçalves, chief reporter for Rádio Angola, and today I bring bad news. UNITA raided a brave PLUAA stronghold - this is nothing new; ever since Savimbi and his bandit gang fought alongside the German oppressors, there have been countless such acts. What may shock you is the casualty count. Today dozens left this world, killed in a meaningless, unnecessary battle against UNITA thugs.\"\n\n\"That is why we advise you - you must protect your community. In the anarchy deliberately fostered by the American occupation, you may be raided by UNITA at any time. There is only one response. Stand ready. If Savimbi comes to your door, you need to know what comes next.\""
 OFN_ANG.2.a:0 "It seems Rádio Angola predicted the violence."
 OFN_ANG.3.t:0 "Rádio Angola: PLUAA Great Victory!"
 OFN_ANG.3.desc:0 "Outside Malanje is a former SS radio station; Rádio Angola's morning broadcast can be heard across the country. Though openly biased and sometimes unprofessional, for many urban Angolans it is the primary news source, its naked partisanship a stark contrast to American-style centrist propaganda. Today, it brings a story of joy.\n\n\"Good morning, people of Angola. I'm João Gonçalves, chief reporter for Rádio Angola, and today I bring news our listeners have waited a week for. After a small engagement, PLUAA forces have won! Though they liberated only one town, UNITA seems to have suffered heavy losses, with dozens of casualties.\"\n\n\"With this victory, the PLUAA is one step closer to driving the tyrant Savimbi out of the south forever. Equally important is the message to the Americans. We remind them again: we will accept no so-called compromise that lets them line their pockets. We will have true justice - a justice beyond the reach of the Americans - and the UNITA thugs. Greater victories are at hand!\""
 OFN_ANG.3.a:0 "Imagine what next week will bring!"
 OFN_ANG.4.t:0 "Rádio Angola: Stunning Stalemate!"
 OFN_ANG.4.desc:0 "Outside Malanje is a former SS radio station; Rádio Angola's morning broadcast can be heard across the country. Though openly biased and sometimes unprofessional, for many urban Angolans it is the primary news source, its naked partisanship a stark contrast to American-style centrist propaganda. Today, it brings a story of frustration and confusion.\n\n\"Good morning, people of Angola. I'm João Gonçalves, chief reporter for Rádio Angola. The result of a recent battle between UNITA and PLUAA militias is in: no action, no movement, no effect. Since the last round of fighting, neither side's control has changed much, and no weapons or supplies were captured. All we can count are the dead - four on one side, six on the other.\"\n\n\"After this tragic violence, one has to ask what it was all for. If we can be swept away at any moment, why fight at all? The Americans tell us every day - this violence leads nowhere. To be honest, I think they're afraid. What they fear is the power we will wield after we liberate ourselves from the southern tyrant. Chairman Neto does not send people to die out of cruelty. He does it because he knows a united Angola will be nearly invincible.\""
 OFN_ANG.4.a:0 "A divided Angola is crumbling."
 OFN_ANG.5.t:0 "An Angolan Request"
 OFN_ANG.5.desc:0 "We have received a request from the Angolan OFN government asking for increased funding to improve the mandate administration and make economic investments. They say this will improve their ability to govern the region and bring Angola closer to independence.\n\nThe amount they request is relatively small, and presumably brings us one step closer to shedding the African problem. Besides, our leadership position in the OFN does mean we should provide such support, and we certainly have the means to fund them.\n\nOn the other hand, many are skeptical of any increased investment in the mandates, and this decision is unlikely to be warmly received in Congress or by the public. Besides, however small the amount, this money goes to Angola rather than home."
 OFN_ANG.5.a:0 "Approve the request."
 OFN_ANG.5.b:0 "Deny the request."
 OFN_ANG.6.t:0 "Our Request Approved!"
 OFN_ANG.6.desc:0 "Good news arrived from Washington today: the additional funding we requested from the American government has been approved. The funds will arrive shortly, and the President has attached a letter wishing us well and congratulating our continued efforts.\n\nThis is a reliable boost to our efforts in Angola, allowing us to invest in a series of small economic projects and expand and improve the mandate government.\n\nThough we always hope for more aid, this is timely support that brings tangible benefits and signals America's continued commitment to the OFN's African mission."
 OFN_ANG.6.a:0 "A welcome boost to our efforts in Africa."
 OFN_ANG.7.t:0 "Our Request Denied"
 OFN_ANG.7.desc:0 "Bad news arrived from Washington today: the additional funding we requested has been denied, citing lack of political support for additional African investment and doubts about the utility of our spending proposal.\n\nThis is naturally a blow to our efforts to stabilize Angola, but it should not be fatal. Our current government will continue its mission here with existing funds. So far, the biggest impact is that our leadership has come to doubt the OFN and America's commitment to our African mission."
 OFN_ANG.7.a:0 "Our work continues regardless."
 OFN_ANG_contacting_the_pluaa:0 "Contacting the PLUAA"
 OFN_ANG_contacting_the_pluaa_desc:0 "During the South African War, the PLUAA spent most of its time in the shadow of UNITA. Compared to Savimbi's men, their numbers were small and their influence minimal. Yet times change. Their Marxist-Leninist rhetoric is gaining more followers. We have arranged a meeting between Agostinho Neto and Lavelle to discuss the nation's future."
 ANG_USA_Legacy_Air_Empire:0 "Legacy of an Air Empire"
 ANG_USA_Legacy_Air_Empire_desc:0 "Despite relentless American air bombardment, Angola's aviation infrastructure remains the best in Africa. Airstrips and runways dot the Angolan plains, many still in use. These will become the bases for our stabilization efforts, allowing us to transport supplies and personnel for our missions and, one day after the war, bring our children home."
 ANG_USA_UNITA_PLUAA_Infightings:0 "UNITA-PLUAA Infighting"
 ANG_USA_UNITA_PLUAA_Infightings_desc:0 "Angola is a hotbed of national independence movements, the most prominent being Jonas Savimbi's National Union for the Total Independence of Angola (UNITA) and Agostinho Neto's Popular Movement for the Liberation of Angola (PLUAA). Though both fought to overthrow German tyranny, their infighting has been nearly as fierce as their battles against the Germans. General Lavelle has brokered an uneasy ceasefire between them. Of course, as long as the Germans keep staging rebellions, the two sides are unlikely to fully break with each other."
 ANG_USA_unita_pluaa_rivalry:0 "UNITA-PLUAA Struggle"
 ANG_USA_unita_pluaa_rivalry_desc:0 "When the §Bjoint Angolan government§! was handed over to §BGeneral Lavelle§!, they had no idea how complex things were here. Angola has many independence movements, two of which stand out. The largest is §GUNITA§!, a democracy-seeking independence movement led by §GJonas Savimbi§!, who is hard to classify as either a freedom fighter or a warlord. Savimbi is charismatic and always seeks the limelight. §SAgostinho Neto§! leads the other, more cautious yet still fervent independence movement, the §SPLUAA§!. This movement adheres to Marxist-Leninist thought and is §GUNITA§!'s greatest enemy; its anti-colonial ideology also makes it hard for the §BOFN§! to work with. Yet both organizations have proven their worth, and both are led by extraordinary figures, though Savimbi more or less represents §GUNITA§!.\n\nThough neither movement is an ideal partner, they are still the §BOFN§!'s best bet in the region. §BGeneral Lavelle§! will help them consolidate their organizations to aid one movement. Yet giving one organization too much attention will only provoke the other's hostility, and one misstep will plunge Angola back into chaos.\n\nCurrent §SPLUAA§! strength: [?OFN_MANDATE_ANG_PLUAA_power_level]\nCurrent §GUNITA§! strength: [?OFN_MANDATE_ANG_UNITA_power_level]\n\nThe weekly stability impact of the rivalry between the two movements on the entire §jmandate§! is: [?OFN_MANDATE_ANG_rivalry_stab_decay|%1=+].\n\nThe balance between the §SPLUAA§! and §GUNITA§! affects not only regional stability but also determines Angola's future leadership. Giving one movement a larger advantage will help them govern more effectively and durably. Conversely, balancing the situation gives Angola more stability but leaves the new government lacking legitimacy, greatly increasing coup risk. §BOFN High Command§! and §BWashington§! strongly advise §BGeneral Lavelle§! to choose a side and stick to it. It is time for the general to choose the side he believes will lead Angola to a better future.\n\nIf the currently strongest independence movement forms the government, the new government's projected strength is [ANG.GetMajorIndependenceMovement]: §Y[?OFN_MANDATE_ANG_gov_strength|%1]§!"
 OFN_MANDATE_ANG_PLUAA_is_bigger_loc:0 "§SPLUAA§!"
 OFN_ANG_able_act_pluaa_unita_tt:0 "§YThis unlocks the ability to act in the UNITA-PLUAA struggle!§!"
 OFN_ANG_act_pluaa_unita_training_tt:0 "§YThis further unlocks the ability to shift the balance in the UNITA-PLUAA struggle!§!"
 OFN_ANG_act_pluaa_unita_weapons_tt:0 "§YThis further unlocks the ability to shift the balance in the UNITA-PLUAA struggle!§!"
 OFN_ANG_able_act_pluaa_unita_command_tt:0 "§YThis further unlocks the ability to shift the balance in the UNITA-PLUAA struggle!§!"
 ANG_USA_send_supplies_to_pluaa:0 "Send §YSupplies§! to §SPLUAA§!"
 ANG_USA_train_men_pluaa:0 "Train §YSoldiers§! for §SPLUAA§!"
 ANG_USA_sell_weapons_pluaa:0 "Sell §YWeapons§! to §SPLUAA§!"
 OFN_AFRICA_MANDATE_ANG_PLUAA_small_increase_tt:0 "This will §Yincrease§! §SPLUAA's§! strength by 5 points.\n"
 OFN_AFRICA_MANDATE_ANG_PLUAA_medium_increase_tt:0 "This will §Yincrease§! §SPLUAA's§! strength by 10 points.\n"
 OFN_AFRICA_MANDATE_ANG_PLUAA_large_increase_tt:0 "This will §Yincrease§! §SPLUAA's§! strength by 15 points.\n"

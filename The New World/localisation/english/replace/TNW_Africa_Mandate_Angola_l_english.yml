 ANG_USA_Klaus_Dierks_eco_desc:0 "§YEconomy Minister\nAuthoritarianism§!\n--------------\n"
 ANG_USA_Philip_Davidson:0 "Philip B. Davidson"
 ANG_USA_Philip_Davidson_sec_desc:0 "§YSecurity Minister\nAuthoritarianism§!\n--------------\n"
 ANG_USA_Fumes_of_the_Battlefields:0 "Fumes of the Battlefields"
 ANG_USA_Fumes_of_the_Battlefields_desc:0 "Some of the South African War's fiercest battles were fought on the Angolan plains. Now, the worst of the fighting is over; only a few fanatical SS soldiers remain resisting the American garrison. Regardless, the war has left deep scars on the local people - the mandate government must restore the severely damaged road infrastructure and the scorched fields; this is perhaps the only hope for lasting peace in Angola."
 ANG_USA_Fumes_of_the_Battlefields_2:0 "Fumes of the Battlefields"
 ANG_USA_Fumes_of_the_Battlefields_2_desc:0 "Some of the South African War's fiercest battles were fought on the Angolan plains. Now, the worst of the fighting is over; only a few fanatical SS soldiers remain resisting the American garrison. Regardless, the war has left deep scars on the local people - the mandate government must restore the severely damaged road infrastructure and the scorched fields; this is perhaps the only hope for lasting peace in Angola."
 ANG_USA_Memories_of_the_Battlefields:0 "Memories of the Battlefields"
 ANG_USA_Memories_of_the_Battlefields_desc:0 ""
 ANG_USA_Fading_Memories_of_the_Battlefields:0 "Fading Memories of the Battlefields"
 ANG_USA_Fading_Memories_of_the_Battlefields_desc:0 ""
 ANG_USA_Fading_Memories_of_the_Battlefields_2:0 "Fading Memories of the Battlefields"
 ANG_USA_Fading_Memories_of_the_Battlefields_2_desc:0 ""
 ANG_USA_Distant_Memories_of_the_Battlefields:0 "Distant Memories of the Battlefields"
 ANG_USA_Distant_Memories_of_the_Battlefields_desc:0 "Something has changed in Angola. The turmoil of recent years has given way to a semblance of peace. Cities once ringed with guard posts now bustle with shops. The countryside is calmer as the last bandit gangs are suppressed and unexploded ordnance is cleared from the fields. The memory of war and atrocity will never fully fade, but at least we have managed to build a stable, lasting society.\n\n§GAngola's situation has improved. Let us hope it stays that way.§!"
 ANG_USA_The_South_West_Reconstruction_Program:0 "The Angolan Reconstruction Program"
 ANG_USA_The_South_West_Reconstruction_Program_desc:0 "Angola was ravaged by the South African War, its factories and roads destroyed by shelling. A large-scale reconstruction program is now underway to rebuild these facilities. The Angolan Mandate is helping rebuild the nation; when the process ends, the infrastructure will be handed over to the Angolan people. Angola will recover from this disaster, emerging from the war's ruins as a stronger, more united nation than before."
 ANG_USA_The_Free_Angolan_Regiments:0 "Free Angolan Regiments"
 ANG_USA_The_Free_Angolan_Regiments_desc:0 ""
 ANG_USA_The_Free_Angolan_Regiments_2:0 "Free Angolan Regiments"
 ANG_USA_The_Free_Angolan_Regiments_2_desc:0 ""
 ANG_USA_The_Free_Angolan_Army:0 "Free Angolan Army"
 ANG_USA_The_Free_Angolan_Army_desc:0 "Free Angolan forces have completed training under OFN supervision. The Angolan military has been transformed from irregular guerrillas using hit-and-run tactics against the Germans into a large conventional force trained in modern doctrine and equipped with American weapons."
 OFN_AFRICA_MANDATE_ANG_rivalry_is_on_tt:0 "§YDecisions§! regarding the §SUNITA-PLUAA struggle§! are now available."

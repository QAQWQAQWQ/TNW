l_english:
 TNO_ANG_by_our_beat:0 "We will chart our own course, regardless of the PLUAA or UNITA!"
 TNO_ANG_No_Path_Yet:0 "We know too little about all sides to know what impact we have..."
 ANG_USA_angolan_developments:0 "Developments in Angola"
 ANG_USA_angolan_developments_desc:0 "A makeshift §BOFN Mandate§! in Africa, aimed at transitioning from German rule to local sovereignty.\n\nIf we implement decolonization peacefully, we can recover §O80%§! of resources.\n\nIf forced by circumstances to implement decolonization early, we can only recover §O40%§! of resources.\n\nIf the mandate fails completely, we must §Rabandon§! all locally produced resources."
 POLITICS_JOHN_LAVELLE_DESC:0 "Most generals expect unconditional obedience to their commands, but General John Lavelle's years stationed in Angola have made him eager to hear dissent. In a sense, Lavelle has the easiest job of the three mandate commanders - there are no radical rebel warlords or exploiting megacorporations to deal with. Yet this ease also means great expectations from without; both America and Lavelle himself are eager to see the fire of freedom truly ignite in Angola, illuminating Africa's path forward.\n\nYet what can be seen from the Capitol building is a far cry from what Lavelle witnesses in Luanda. UNITA and the PLUAA have provided great cooperation and assistance to American forces, defending their homeland against German imperialist colonial rule. Yet the facts are clear - the two factions can only agree because of the American military presence. Faced with great expectations from Angolan factions and the Washington Congress, Lavelle must use all his skills to negotiate Angola's full potential."
 OFN_ANG_the_dust_settles_in_the_south_west:0 "The Dust Settles in the Southwest"
 OFN_ANG_the_dust_settles_in_the_south_west_desc:0 "The war is over, but reconstruction continues. Air Force General Lavelle will oversee the OFN Mandate of Angola. His work will doubtless be difficult and arduous. Angola's airfields were primary targets of American air strikes (as Lavelle can attest), and restoring them will take enormous effort. There are still many unknowns on the ground. General Lavelle hopes he can move quickly to resolve this. The government and the American people are watching closely."
 OFN_ANG_the_sudwestafrikaner_secret:0 "The Sudwestafrikaner Secret"
 OFN_ANG_the_sudwestafrikaner_secret_desc:0 "Our forces have conducted a resource survey of the former commission and assessed the extent of destruction. Notably, our forces secured Schenck's former residence and headquarters. Upon reviewing his archives, we discovered Schenck had been secretly cooperating with the resistance. These files outline a so-called \"Angola Plan\" for building Angola through economic and military development. Given the sensitive and controversial nature of the contents, General Lavelle had best review these documents personally."
 OFN_ANG_contacting_unita:0 "Contacting UNITA"
 OFN_ANG_contacting_unita_desc:0 "The most important figure in Schenck's plan is Jonas Savimbi. CIA sources list him as one of Angola's capable resistance leaders. Though some of his goals run counter to OFN objectives in the region, he and UNITA seem to have enough capability and popularity to bring stability and strength to the region. We have arranged a meeting between Lavelle and Savimbi to discuss the possibility of cooperation and mutual support."
 OFN_ANG_study_the_plans:0 "Studying the Plans"
 OFN_ANG_study_the_plans_desc:0 "Military intelligence analysts can at least conclude that Schenck was serious about his \"Angola Plan.\" He planned everything: contingency measures if discovered, an industrialization economic plan, even preliminary implementation of a bureaucracy designed to outlast him if he finally left. We are still evaluating the feasibility of his plans, but one thing is certain: other mandates do not have the solid foundation we have here. These plans were designed with the natives in mind, but he lacked the resources. In our preliminary analysis, with American support these plans have a real chance of becoming reality. If America is willing to provide the necessary funding, we will have a genuine opportunity to rebuild this nation from the ground up."
 OFN_ANG_picking_up_where_he_left_it:0 "Picking Up Where He Left Off"
 OFN_ANG_picking_up_where_he_left_it_desc:0 "No more delay. We have reviewed most of Schenck's archives; it is time to decide: either act, or bury them with other top-secret files. The situation is not good. If Washington realizes our reconstruction relies on a Nazi who took a green card, they will surely suspect us, and investigate. In any case, the decision is Lavelle's. Burying Schenck's plans would be a thorough waste, making us no different from other mandates: come to Africa, drain resources, then leave. So far, General Lavelle has taken a wait-and-see approach; these plans look ambitious but could well become reality within a few years. Unlike other OFN mandates, we can leave behind a stable, prosperous nation when we depart this continent."
 OFN_ANG_training_the_natives:0 "Training the Natives"
 OFN_ANG_training_the_natives_desc:0 "Building a stable, modern nation-state requires security. Yet the state of Angola's \"armed forces\" leaves much to be desired. They may be able to wage disciplined jungle guerrilla warfare, but defending a nation is not as easy as ambushing enemies. General Lavelle sees this as another obstacle to Angolan stability, so the task of resolving it has been given to General William W. Momyer. Though he can be difficult to work with, he is undoubtedly capable of improving the state of Angola's security forces."
 OFN_ANG_meet_with_savimbi:0 "Meeting with Savimbi"
 OFN_ANG_meet_with_savimbi_desc:0 "Angola's future is once again the focus of attention. Lavelle plans to speak with Jonas Savimbi. Officially, this is merely a political meeting, but Lavelle will also probe his views on Angola's future. Savimbi is a fighter - and is that not exactly what Angola needs today? Even now, the region is shrouded in instability and poverty, making it difficult to establish a proper democratic system. Perhaps Angola needs a strong hand to guide her toward a brighter future."
 OFN_ANG_arming_the_warlords:0 "Arming the Warlords"
 OFN_ANG_arming_the_warlords_desc:0 "The situation in Angola is precarious. With Washington growing dissatisfied with our troop levels, we must make do with the men on hand and pray they suffice. Right now, we see nothing but swarms of Nazis, guerrillas unwilling to lay down their arms, and a general deterioration of security in rural and even urban areas. There is no help for it; there is too much territory to administer.\n\nTo reverse the rapidly deteriorating situation, General Lavelle has authorized arms shipments to UNITA and the PLUAA. Since Washington ordered us to stabilize the situation and rebuild Angola, this decision is not out of bounds. After all, we are not the only players in the Angolan game. These weapons will go to Savimbi and Neto to secure the safety of the Angolan people."
 OFN_ANG_establishing_a_native_army:0 "Establishing a Native Army"
 OFN_ANG_establishing_a_native_army_desc:0 "Though training is progressing well, militia training is not enough for them to bear the burden of defending a nation. This country needs a real army, which is why General Lavelle has formally authorized the creation of the Angolan Armed Forces (AAF). To win Savimbi and UNITA's favor, we have chosen Commander Demosthenes Amos Chilingutila to lead this new force. As a veteran guerrilla who resisted the Nazi commission for years, he will not let us down."
 OFN_ANG_discuss_with_neto:0 "Discussing with Neto"
 OFN_ANG_discuss_with_neto_desc:0 "Reforming the army, or acting as mediator between UNITA and the PLUAA - General Lavelle chose the latter. Agostinho Neto and Lavelle are holding a friendly meeting, this time focusing on policy matters. Our diplomatic experts have drafted talking points on where Angola's future should go to gauge his position. We already guessed he is the leader of Angola's socialist movement; now we can only hope his ideological popularity will bring some stability to this rebuilding nation."
 OFN_ANG_consolidate_an_army:0 "Consolidating the Army"
 OFN_ANG_consolidate_an_army_desc:0 "Angola's local armed forces are more organized than their counterparts in other former commissions, capable of fighting as a conventional force rather than merely waging jungle guerrilla war. This undoubtedly lays a good foundation for a unified Angolan armed force. With OFN instructors and American-made weapons, the Angolan Armed Forces will become the backbone of the new Angolan nation-state."
 OFN_ANG_heal_the_scars:0 "Healing the Scars"
 OFN_ANG_heal_the_scars_desc:0 "Though the South African War ended for the soldiers long ago, civilians still live among artillery-ruined ruins and wartime minefields. For Angola and her people alike, the war's scars have not yet healed, and they cannot yet move toward prosperity and a new life. If we want to leave behind a functioning modern state for the Angolan people after we leave, we must prioritize economic and infrastructure reconstruction."
 OFN_ANG_clean_the_battlefields:0 "Cleaning the Battlefields"
 OFN_ANG_clean_the_battlefields_desc:0 "No one understands the consequences of the strategic bombing Lavelle ordered better than the general himself. But conventional ground warfare could no longer achieve results, and he had no choice. Even now, Angola's soil is littered with unexploded ordnance. Before we begin industry or infrastructure, these wartime remnants must be cleared for safety. Everything from unexploded grenades to dud large-caliber shells must be carefully handled. Some teams have already begun surveying key areas for subsequent bomb disposal. Others are contacting demolition experts and beginning proper training of locals. Angolan generations to come will doubtless fight this \"harvest of steel,\" but a journey of a thousand miles begins with a single step, and we must begin now."
 OFN_ANG_rebuilding_industrial_infrastructure:0 "Rebuilding Industrial Infrastructure"
 OFN_ANG_rebuilding_industrial_infrastructure_desc:0 "Industry is the beating heart of every modern nation. Industry means more than factories; it means the technology and distribution networks that accompany them. They extend the market's reach beyond where factories sit and transport resources at scale from other regions to the factories. Angola has abundant natural resources, but the industrial facilities not damaged by the South African War are old and small. Unlocking Angola's full economic potential will take considerable time and large sums of money, but for the Angolan people and their OFN supporters, the investment should pay off..."
 OFN_ANG_communication_across_the_south_west:0 "Communications Across the Southwest"
 OFN_ANG_communication_across_the_south_west_desc:0 "Frankly, it is a miracle that Commissioner Schenck's aborted revolutionary plan got off the ground at all - aside from a telephone line between Windhoek and Leopoldville, there is virtually no information network between Angola's cities and villages; messengers remain the most reliable way to transmit information nationwide. To bring Angola into the modern world and allow the Angolan government to take the pulse of its people, we must build a series of modern communications facilities."
 OFN_ANG_nujomas_government:0 "Nujoma's Government Retires Gracefully"
 OFN_ANG_nujomas_government_desc:0 "The \"Namibian Government in Exile\" led by Sam Nujoma is a thorny problem for General Lavelle. The organization supports revolution and opposes South African rule, posing a direct threat to OFN mandates in Africa. Though they may become our enemies, they are locally popular, and direct condemnation would likely destabilize our order. Given this, we have so far set the issue aside and ignored it.\n\nBut we cannot delay forever; close ties between Nujoma and the PLUAA are sharpening the contradiction. It is time to take a stand."
 OFN_ANG_rebuild_the_infrastructures:0 "Rebuilding Infrastructure"
 OFN_ANG_rebuild_the_infrastructures_desc:0 "Though Angola's transport network was never well developed, it suffered severe damage during the war. Poor roads are our greatest obstacle to operations in the mandate; the fighting halted communications, transport, and trade, leaving Angolan towns and villages isolated.\n\nThis must change. Rebuilt roads will undoubtedly consolidate our mandate, improve our operational efficiency, and show goodwill to the locals. Time to get to work."
 OFN_ANG_the_south_west_african_reconstruction_program:0 "The Angolan Reconstruction Program"
 OFN_ANG_the_south_west_african_reconstruction_program_desc:0 "In the past, most of Angola's economic lifelines were controlled by the commission. Now, they all have fallen into our hands without exception. We have assessed the mandate's various assets, and it is time for Lavelle to look to the future.\n\nWe will ignore voices from home demanding their privatization and retain ownership of the enterprises. Through the \"Angolan Reconstruction Program,\" we will use their revenue for development projects across the mandate, making our goodwill clear to its people."
 OFN_ANG_reconnect_the_cities:0 "Reconnecting the Cities"
 OFN_ANG_reconnect_the_cities_desc:0 "As our work rebuilding Angola's infrastructure continues, the country is being rebuilt brick by brick. Though this is unequivocally a good thing for most people, it has also created contradictions in some areas. Reconnecting rural and urban areas means new goods flooding the market, prices falling, and crowds of rural merchants and artisans protesting in the streets.\n\nWe must make clear that these protests will achieve nothing. Angola's cities must remain connected, trading, and cooperating. For everyone's benefit, it is time to merge their administrative systems."
 OFN_ANG_restart_the_factories:0 "Restarting the Factories"
 OFN_ANG_restart_the_factories_desc:0 "Our hard work rebuilding Angola has borne fruit. With the road network expanded, goods and people flow again between cities and villages; Angola is awakening.\n\nThe next step in reconstruction is restarting production. Now that they have ample resources, labor, and markets, it is time to reopen the factories."
 OFN_ANG_hire_the_natives:0 "Hiring the Natives"
 OFN_ANG_hire_the_natives_desc:0 "We are building industry not only for economic growth but also to provide a stable source of employment for locals. Now that factories are running, we should begin encouraging locals to work in them.\n\nThis will undoubtedly provide a stable income and employment for the Angolan people. Workers can then spend their earnings on goods from local merchants and artisans, stimulating the entire national economy."
 OFN_ANG_create_an_industrial_foundation:0 "Creating an Industrial Foundation"
 OFN_ANG_create_an_industrial_foundation_desc:0 "A prosperous economy is not built overnight, nor haphazardly. Advanced economic systems depend on connections: crude oil must connect to refineries, downstream industries must connect to upstream, consumer industry must connect to its markets. We will build a strong framework for Angolan industry, laying the foundation for a prosperous future."
 OFN_ANG_stabilize_the_industry:0 "Stabilizing Industry"
 OFN_ANG_stabilize_the_industry_desc:0 "Though Angolan industry now runs well and provides jobs and goods for her people, it still depends heavily on our economic support and expertise. To ensure it does not collapse after we leave, Angola needs a local intelligentsia of managers and skilled workers. This task will fall to vocational schools and technical colleges, while on-the-job training and sound management ensure they do not forget what they learn. We will stabilize Angola's industry so it can serve the nation for decades to come."
 OFN_ANG_the_luanda_office:0 "The Luanda Office"
 OFN_ANG_the_luanda_office_desc:0 "Rebuilding Angola requires not only money and sweat but also a comprehensive plan to make Angola a true nation. Schenck's plan for Angolan independence was a good start, but he made some miscalculations about the situation. We will correct these errors through free debate and deliberation possible only in the free world."
 OFN_ANG_administrative_rework:0 "Administrative Reorganization"
 OFN_ANG_administrative_rework_desc:0 "Angola's old administrative apparatus inherited every flaw of the former Portuguese colonial regime - lifeless, under-resourced, dependent on colonial administrators, with the local population denied self-governance. If we want Angola to remain peaceful and stable after we leave, rather than becoming a battlefield between UNITA and the PLUAA, we must remedy these flaws."
 OFN_ANG_dierks_proposal:0 "Hearing Dierks' Proposal"
 OFN_ANG_dierks_proposal_desc:0 "Angola's terrain is vast and rugged, population centers separated by miles, with substandard infrastructure. Our chief economic advisor Klaus Dierks points out that even if we plan to improve communications and transport infrastructure, moving people or goods between major population centers without expensive air transport still takes days. He proposes devolving political decision-making to states and municipal authorities. With our other two colleagues busy negotiating with a host of Washington departments, this plan is not popular within the government. But to leave behind a functioning government, it is not a bad plan."
 OFN_ANG_fix_schencks_mistakes:0 "Fixing Schenck's Mistakes"
 OFN_ANG_fix_schencks_mistakes_desc:0 "Despite Wolfgang Schenck's good intentions, he had to act in secret. Perhaps he dreamed of a free Angola, using whatever resources he had to bring together social elites and guerrilla fighters, but throughout he had to prepare for the eventual uprising under the noses of German loyalists, collaborationist governments, and militias defending their homeland from civil war. But we are different. The OFN is mandated by the people and the international community to prepare Angola for independence. If we expect the Angolan people to walk the road to freedom willingly, every step of that road must be known to them."
 OFN_ANG_the_leap_of_faith:0 "The Leap of Faith"
 OFN_ANG_the_leap_of_faith_desc:0 "The moment of decolonization has finally arrived. Schenck's dream, plotted in secret for countless months, is about to become reality: a free Angola, joining the family of free nations as brothers.\n\nWe can only hope that the efforts to bring about this transition - infrastructure, planned economic routes, uniting the factions - will be enough to ensure that after we leave, Angola can stand on its own."
 OFN_ANG_setting_up_the_transitional_governance:0 "Establishing Transitional Governance"
 OFN_ANG_setting_up_the_transitional_governance_desc:0 "With decolonization on the agenda, we must resolve who will lead Angola's future government. Though we have done our best to ensure all factions are included in the political process, only one can rise above the others to lead Angola into a new future.\n\nWashington wants to see an Angolan government friendly to American interests installed, while others want Angola to decide every aspect of its future freely. The discussion revolves around Jonas Savimbi and Agostinho Neto, who will settle their rivalry on Angola's political stage. As for everyone else, they will have to fend for themselves."
 OFN_ANG_balance_the_south_west:0 "Balancing the Southwest"
 OFN_ANG_balance_the_south_west_desc:0 "Wolfgang Schenck seems to have driven Angolan independence by more than idealism. The former Southwest Africa Commission's financial records are riddled with outright fraud - a vast network of inflated performances and diverted supplies. Schenck deceived the German bureaucracy to achieve his dream of a free Angola.\n\nUnfortunately, Schenck's strategy has left us with a serious problem: the Southwest Africa Commission's economic reports are useless to us. We are essentially forced to rebuild Angola's economy from scratch blind. If our plans to rebuild Angola are to succeed, this must be corrected immediately."
 ANG_USA_John_D_Lavelle: "John D. Lavelle"
 ANG_USA_William_W_Momyer:0 "William W. Momyer"
 ANG_USA_William_W_Momyer_hog_desc:0 "§YHead of Government\nAuthoritarianism§!\n--------------\n"

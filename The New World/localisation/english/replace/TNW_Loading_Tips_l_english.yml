l_english:
 LOADING_TIP_0:0 "§qHistory is nothing but the efforts of humanity to realize its ideals.\n- Éamon de Valera, 1929§!"
 LOADING_TIP_1:0 "§qWe will not believe in a government elected by ballot; the Spanish people have never freely expressed their will at the polls, and Spain has no use for such foolish aspirations.\n- Francisco Franco, 1938§!"
 LOADING_TIP_2:0 "§qI have never abandoned Germany - another Germany. One day, the hatred that seemed inevitable in war will be curbed. One day, a Europe where all Europeans share and thrive together will become a reality.\n- Willy Brandt, 1943§!"
 LOADING_TIP_3:0 "§qThe winds of change are blowing across this continent whether we wish it or not; the growth of national consciousness is a political fact.\n- Harold Macmillan, 1960§!"
 LOADING_TIP_4:0 "§qI need not consider justice; it is my duty only to destroy and annihilate.\n- Hermann Göring, 1933§!"
 LOADING_TIP_5:0 "§qHistory advances through contradiction.\n- Nikolai Bukharin, 1917§!"
 LOADING_TIP_6:0 "§qA nation reveals itself not only by the men it produces, but by the men it honors and remembers.\n- John F. Kennedy, 1963§!"
 LOADING_TIP_7:0 "§qShoot first, ask questions later, and if anything goes wrong, I will protect you.\n- Hermann Göring, 1933§!"
 LOADING_TIP_8:0 "§qThe means to banish poverty from history and realize this ancient ideal is within our grasp. How much longer must we ignore our destitute citizens? How much longer must we let our people suffer?\n- Michael Harrington, 1962§!"
 LOADING_TIP_9:0 "§qThere is nothing the working class cannot do; kindle their desire and enthusiasm, show them the way, and the workers will sweep across the world.\n- Bill Alexander, 1940§!"
 LOADING_TIP_10:0 "§qThe people are too easily made pawns of their rulers; you need only tell them the nation is in danger, and that those who speak of peace lack patriotism, leading the nation to ruin.\n- Hermann Göring, 1946§!"
 LOADING_TIP_11:0 "§qI have said time and again that our economic focus should be on the individual.\n- Ludwig Erhard, 1963§!"
 LOADING_TIP_12:0 "§qThere are no difficulties before an SS officer; when a difficulty appears, it is his duty to eliminate it.\n- Heinrich Himmler, 1942§!"
 LOADING_TIP_13:0 "§qDefeatism now will undoubtedly lead to defeat... We cannot give up the future.\n- Seán Lemass, 1965§!"
 LOADING_TIP_14:0 "§qDemocracy is not a state; it is a process.\n- Helmut Schmidt, 1969§!"
 LOADING_TIP_15:0 "§qLet us dedicate ourselves to what the Greeks wrote so long ago: to tame the savageness of man and make gentle the life of this world.\n- Robert F. Kennedy, 1968§!"
 LOADING_TIP_16:0 "§qThe fight for freedom must go on until it is won, until our country is a member of the community of nations, enjoying freedom, happiness, and peace. Until then we shall not rest.\n- Oliver Tambo, 1964§!"
 LOADING_TIP_17:0 "§qWhoever resists change is laying the bricks of their own decline. The only place humanity refuses to progress is the graveyard.\n- Harold Wilson, 1967§!"
 LOADING_TIP_18:0 "§qThe future is unwritten; only the people can write it.\n- Adolfo Suárez, 1969§!"
 LOADING_TIP_19:0 "§qDemocracy is fine in theory, but in practice it is a fallacy.\n- Benito Mussolini, 1928§!"
 LOADING_TIP_20:0 "§qBecause the past does not conform to the present, it is impossible and wrong to try to erase it.\n- Golda Meir, 1975§!"
 LOADING_TIP_21:0 "§qPessimism is a luxury a Jew can never allow himself.\n- Golda Meir, 1974§!"
 LOADING_TIP_22:0 "§qGermany will never undermine its peaceful posture; Germany only wishes to stand as an equal among its neighboring peoples.\n- Adolf Hitler, 1935§!"
 LOADING_TIP_23:0 "§qWe are not lambs to the slaughter; we are indeed weak and helpless, but the only answer to killing is to rise up and fight. My brothers, do not live at the mercy of the murderers; fight to the death as free men. Rise and fight to the last breath.\n- Abba Kovner, 1942§!"
 LOADING_TIP_24:0 "§qI speak as a soldier who fought in the last great war, and my most fervent prayer is that this madness of cruelty and destruction may never again visit humanity. Nowhere do people want war.\n- Edward VIII Windsor, 1939§!"
 LOADING_TIP_25:0 "§qTherefore, all must recognize this: compared to the existence of the nation, his own self is meaningless.\n- Adolf Hitler, 1939§!"
 LOADING_TIP_26:0 "§qA man is not finished when he is defeated; he is finished when he quits.\n- Richard Nixon, 1962§!"
 LOADING_TIP_27:0 "§qThere is no god worthy of our reverence except Germany itself. Fanatical faith, hope, and love for Germany are what matter most.\n- Adolf Hitler, 1935§!"
 LOADING_TIP_28:0 "§qIf you say I gave you the whole country, why must you come like a thief to steal it? If the country truly belonged to you, you would not need to steal it.\n- King Lobengula§!"
 LOADING_TIP_29:0 "§qI fight to restore the old ideals that made our country great: public office is for serving the people, not for honors, still less for profit.\n- Jorge Alessandri, 1957§!"
 LOADING_TIP_30:0 "§qOnce I am truly in power, my first task will be to exterminate the Jews.\n- Adolf Hitler, 1922§!"
 LOADING_TIP_31:0 "§qGood God, bring me a large scotch. This damned country is utterly wretched.\n- Reginald Maudling, 1963§!"
 LOADING_TIP_32:0 "§qNo one likes war; certainly no sane person does. Unless it is first instilled in their mind what they can gain from war, and how to gain it.\n- Carl von Clausewitz, On War, 1832§!"
 LOADING_TIP_33:0 "§qSometimes I think: I am not the owner of a great corporation, but of a repair shop.\n- Kurt Georg Kiesinger, 1968§!"
 LOADING_TIP_34:0 "§qI am answerable only to God and to history.\n- Francisco Franco, 1937§!"
 LOADING_TIP_35:0 "§qI am not interested in whether these peoples are born in prosperity or die of hunger; I am only interested in them serving as slaves of our culture.\n- Heinrich Himmler, 1943§!"
 LOADING_TIP_36:0 "§qFascism is intellectual slavery.\n- Willy Brandt, 1933§!"
 LOADING_TIP_37:0 "§qOur politicians lack discipline. Within five years we will establish discipline in all fields: political, economic, and financial.\n- Mobutu Sese Seko, 1967§!"
 LOADING_TIP_38:0 "§qWar is not the “supreme rational means,” but the “supreme irrational means.”\n- Willy Brandt, 1971§!"
 LOADING_TIP_39:0 "§qEverything shows that fascist dictatorship is not a matter of weeks or months, but of years.\n- Willy Brandt, 1933§!"
 LOADING_TIP_40:0 "§qToday I come bearing an olive branch and a freedom fighter’s gun. Do not let the olive branch fall from my hand. I say again: do not let the olive branch fall from my hand.\n- Yasser Arafat, 1963§!"
 LOADING_TIP_41:0 "§qA citizen without the vote means one without protection.\n- Lyndon B. Johnson, 1966§!"
 LOADING_TIP_42:0 "§qWe do not wish to be gatekeepers, but we have no choice.\n- Lyndon B. Johnson, 1966§!"
 LOADING_TIP_43:0 "§qAn SS man must be honest, decent, loyal, and comradely to people of our blood, not to outsiders. I am completely unconcerned with how Russians or Czechs fare.\n- Heinrich Himmler, 1943§!"
 LOADING_TIP_44:0 "§qThe land of Israel is built not on power, but on rights.\n- Menachem Begin, 1950§!"
 LOADING_TIP_45:0 "§qWar will not cease until the philosophy that proclaims one race superior and another inferior is finally and permanently discredited and abandoned.\n- Haile Selassie§!"
 LOADING_TIP_46:0 "§qSince God created man and the devil entered men’s hearts, there has been no cruelty comparable to what the Germans did to the Jews under Nazi rule.\n- Menachem Begin, 1977§!"
 LOADING_TIP_47:0 "§qYou only call an elephant a rabbit when it would feel better to be trampled by a rabbit.\n- Kenneth Kaunda§!"
 LOADING_TIP_48:0 "§qExtremism in the defense of liberty is no vice. Moderation in the pursuit of justice is no virtue.\n- Barry Goldwater, 1964§!"
 LOADING_TIP_49:0 "§qIf the Germans attack first, we defend. If winter comes and they have not attacked, then we will strike first and tear them apart.\n- Georgy Zhukov, 1967§!"
 LOADING_TIP_50:0 "§qA strange game; the only winning move is not to play.§!"
 LOADING_TIP_51:0 "§qThere are always things from home that stay with us for life, bringing joy and sorrow. One day we will understand: that is our homeland.\n- Vasily Shukshin, 1958§!"
 LOADING_TIP_52:0 "§qIf revolution comes, only God knows how it ends. I believe constitutional government means the end of Russia. We need an autocrat!\n- Mikhail Tukhachevsky, 1917§!"
 LOADING_TIP_53:0 "§q“Our Fuehrer sent from heaven, may you always guard our lives. In Germany’s hour of need, you saved her. Our daily bread we receive by your grace. May you walk with us, and not forsake us. Fuehrer, my Fuehrer, my faith, my light. Heil, my Fuehrer.”\n- Hitler Youth Prayer, 1933§!"
 LOADING_TIP_54:0 "§qEvery gun that is made, every warship launched, every rocket fired, is in the final sense a theft from those who hunger and are not fed, those who are cold and not clothed.\n- Dwight D. Eisenhower, 1953§!"
 LOADING_TIP_55:0 "§qFor us... even for them, the state is something definite and absolute.\n- António de Oliveira Salazar, 1935§!"
 LOADING_TIP_56:0 "§qI cannot forecast Russia’s actions; it is a riddle wrapped in a mystery inside an enigma.\n- Winston Churchill, 1939§!"
 LOADING_TIP_57:0 "§qDo not pray for an easy life; pray to be a stronger person.\n- John F. Kennedy, 1963§!"
 LOADING_TIP_58:0 "§qThe proud and luxurious do not last; they are like a spring night’s dream. The powerful and brutal will perish, like dust in the wind.\n- The Tale of the Heike§!"
 LOADING_TIP_59:0 "§qThere is no American dream; what I see is an American nightmare.\n- Malcolm X, 1964§!"
 LOADING_TIP_60:0 "§qWe all want to pump the brakes on the arms race; we all want arms limitations. But to those who think peace comes from cutting flesh from our own armies, I say: you are unwittingly hastening war.\n- Henry “Scoop” Jackson, 1972§!"
 LOADING_TIP_61:0 "§qConceal nothing from the people. Do not lie. Expose lies as soon as they appear. Do not cover up difficulties, errors, or failures. Do not speak lightly of victory...\n- Amílcar Cabral§!"
 LOADING_TIP_62:0 "§qIf we gain power, we will never give it up, unless they carry our corpses out of the office.\n- Joseph Goebbels, 1932§!"
 LOADING_TIP_63:0 "§qFreedom is the right to make mistakes, not the right to deliberately do wrong.\n- John Diefenbaker, 1958§!"
 LOADING_TIP_64:0 "§qYesterday’s mistakes cannot be undone, but tomorrow’s victory or defeat is still ours to fight for.\n- Lyndon B. Johnson, 1964§!"
 LOADING_TIP_65:0 "§qColonizers always say they brought us into history; today we prove otherwise. They merely made us abandon our own history and merge into theirs.\n- Amílcar Cabral§!"
 LOADING_TIP_66:0 "§qAh, we are young Leninists, young Octoberites, onward!\n- Buryat Commune Anthem, 1962§!"
 LOADING_TIP_67:0 "§qGhana’s independence is meaningless unless it is linked up with the total liberation of Africa.\n- Kwame Nkrumah, 1964§!"
 LOADING_TIP_68:0 "§qI prefer freedom in danger to slavery in ease.\n- Kwame Nkrumah, 1965§!"
 LOADING_TIP_69:0 "§qIf any Ukrainian speaks to me as an equal, I will shoot him.\n- Erich Koch§!"
 LOADING_TIP_70:0 "§qOf all modern dreams, none is more precious or more difficult to achieve than world peace.\n- Lester B. Pearson, 1957§!"
 LOADING_TIP_71:0 "§qEvery soldier feels his actions have a moral component. But all war is immoral; think too much and you are not a good soldier.\n- Curtis LeMay, 1962§!"
 LOADING_TIP_72:0 "§qThe end of hope is the beginning of ruin.\n- Charles de Gaulle, 1945§!"
 LOADING_TIP_73:0 "§qNuclear war cannot be considered a continuation of politics by other means. It would be nothing but collective suicide.\n- Andrei Sakharov, 1968§!"
 LOADING_TIP_74:0 "§qMan and fascism cannot coexist.\n- Vasily Grossman, 1960§!"
 LOADING_TIP_75:0 "§qComrades! The national revolution of Russia has begun! There is no turning back; unless we take Russia, she will perish!\n- Konstantin Rodzaevsky, 1941§!"
 LOADING_TIP_76:0 "§qA homeland without freedom is not my homeland. But freedom without a homeland, though hard to accept, is still freedom to me.\n- Roman Gul, 1952§!"
 LOADING_TIP_77:0 "§qTo fight for the fatherland and to sacrifice for the people is a cause I would devote my whole life to. Frankly, I believe I have done all my duty in this regard.\n- Georgy Zhukov, 1969§!"
 LOADING_TIP_78:0 "§qHistory is full of war, yet everyone thinks war will not come.\n- Enoch Powell, 1967§!"
 LOADING_TIP_79:0 "§qGermany and Italy will not hesitate. The crisis we face is not material, but loss of faith in destiny... like sailors without a navigator.\n- Philippe Pétain, 1936§!"
 LOADING_TIP_80:0 "§qWe belong to a master race. We must remember that even the lowest German worker is biologically a thousand times more valuable than the inferior peoples here.\n- Erich Koch, 1943§!"
 LOADING_TIP_81:0 "§qTo gain what is worth having, it may be necessary to lose everything else.\n- Bernadette Devlin, 1969§!"
 LOADING_TIP_82:0 "§qWhen I left office to return home, I brought nothing with me but clean hands.\n- António de Oliveira Salazar, 1968§!"
 LOADING_TIP_83:0 "§qFascism is a pure state principle; as Mussolini said, “the state comes first, the individual second.” National Socialism is the opposite: the people come first, the state is secondary.\n- Otto Ohlendorf§!"
 LOADING_TIP_84:0 "§qThey took many things from me in their German concentration camps: muscle, fat, teeth, but never my convictions! I am a soldier, and I will hold my post.\n- Dmitry Karbyshev, 1960§!"
 LOADING_TIP_85:0 "§qThere is a profound difference between patriotism and nationalism. The former emphasizes love for one’s own country; the latter emphasizes hatred for all other peoples.\n- Dmitry Likhachev, 1962§!"
 LOADING_TIP_86:0 "§qGreatness is a curse built upon corpses.\n- Heinrich Himmler, 1941§!"
 LOADING_TIP_87:0 "§qIn the end, you will all be licking German boots!\n- Italo Balbo, 1951§!"
 LOADING_TIP_88:0 "§qWe must walk this road paved with blood. We have no choice. For us, it is a matter of life and death. We must be prepared for the challenges ahead.\n- Gamal Abdel Nasser, 1969§!"
 LOADING_TIP_89:0 "§qFrom now on, humanity can survive only through conscious choice and deliberate policy.\n- John Paul II, 1981§!"
 LOADING_TIP_90:0 "§qGive me your blood, and I will give you freedom!\n- Subhas Chandra Bose, 1944§!"
 LOADING_TIP_91:0 "§qI declare before you all that, whether my life be long or short, I shall devote myself to the service of all the peoples of our Commonwealth and of our Imperial family to which we all belong.\n- Queen Elizabeth II, 1947§!"
 LOADING_TIP_92:0 "§qI know my moral conscience cannot overturn the fact that I am just a soldier, a small cog in a great machine.\n- Otto Ohlendorf§!"
 LOADING_TIP_93:0 "§qComrades, know that upon the banner of your march toward communist victory, there will also be a drop of my blood.\n- Nikolai Bukharin, 1940§!"
 LOADING_TIP_94:0 "§qWhat force has taken, only force can recover.\n- Gamal Abdel Nasser, 1970§!"
 LOADING_TIP_95:0 "§qOnly I know Congress; I set it on fire!\n- Hermann Göring, 1942§!"
 LOADING_TIP_96:0 "§qThe OUN certainly cares for its members’ standard of living, but our ideals are too grand for such earthly measures. To realize this vision, the sacrifice required is not of one man or hundreds, but of millions.\n- Stepan Bandera, 1936§!"
 LOADING_TIP_97:0 "§qThe people certainly do not want much to do with us.\n- Reinhard Heydrich, 1941§!"
 LOADING_TIP_98:0 "§qWhen tearing down monuments, leave the pedestals. They will always come in handy.\n- Stanisław Jerzy Lec, 1957§!"
 LOADING_TIP_99:0 "§qAbove all, authority can and must be analyzed.\n- Edward Said, 1978§!"
 LOADING_TIP_100:0 "§qThe truth is, the war helped. The war brought enormous grief, made life very, very difficult. Infinite sorrow, countless tears. But the days before the war were harder, because everyone grieved in secret.\n- Dmitri Shostakovich, 1979§!"
 LOADING_TIP_101:0 "§qWhy should we care whether they live or die? Our goal is for those bastards all to die! As long as when the war ends, there are two Americans left for every one German, we have won!\n- Thomas Power, 1962§!"
 LOADING_TIP_102:0 "§qIt is a disgrace to stand aside while others are writing history.\n- Benito Mussolini, 1940§!"
 LOADING_TIP_103:0 "§qBetter one day as a lion than a hundred years as a sheep.\n- Benito Mussolini, 1943§!"
 LOADING_TIP_104:0 "§qOne day the whole world will hold the Wehrmacht responsible for these things, because they happened under the Wehrmacht’s very nose.\n- Wilhelm Canaris, 1939§!"
 LOADING_TIP_105:0 "§qIf the next generation consists of incompetents who do not understand our great mission, everything we have devoted to National Socialism will have been in vain.\n- Odilo Globocnik§!"
 LOADING_TIP_106:0 "§qWe try so hard to conceal the evils of the past that continue to this day, that we are powerless to stop new evils today.\n- Jawaharlal Nehru, 1939§!"
 LOADING_TIP_107:0 "§q1964: The ballot or the bullet.\n- Malcolm X, 1964§!"
 LOADING_TIP_108:0 "§qLooking back, the success of the Pearl Harbor strike seemed blessed by heaven.\n- Hideki Tojo, 1947§!"
 LOADING_TIP_109:0 "§qOppression is the essence of power.\n- Ernst Kaltenbrunner, 1961§!"
 LOADING_TIP_110:0 "§qBrutality and greed have robbed the Germans of the compassion they should have. Wherever Germans appear, hatred follows, and their rule is doomed to be a disaster.\n- Luca Pietromarchi, 1942§!"
 LOADING_TIP_111:0 "§qEthical obligations must yield to the totalitarian nature of war.\n- Karl Brandt§!"
 LOADING_TIP_112:0 "§qHe had never seen the monster called radiation, and hoped he never would.\n- Walter M. Miller Jr., A Canticle for Leibowitz, 1959§!"
 LOADING_TIP_113:0 "§qThe German army is a machine, and machines can be destroyed!\n- Konstantin Rokossovsky, 1945§!"
 LOADING_TIP_114:0 "§aAnd yet, the choice before nations today is as clear as the choice before individuals in the past: peace, or destruction.\n- Lester B. Pearson, 1957§!"
 LOADING_TIP_115:0 "§qAll law is “situational law.” Sovereignty creates and guarantees the totality of situation, monopolizing the final decision.\n- Carl Schmitt, 1934§!"
 LOADING_TIP_116:0 "§qAny person whose country has been torn apart has the right to stand up and demand freedom for that country.\n- Seamus Twomey, 1971§!"
 LOADING_TIP_117:0 "§qThe great enemy is upon us; it is a matter of life and death.\n- Andrei Zhdanov, 1941§!"
 LOADING_TIP_118:0 "§qRemember Pearl Harbor; kill the Japs.\n- Naval slogan§!"
 LOADING_TIP_119:0 "§qMaintaining peace is our priority. Without peace, our independence is meaningless, and the recovery and reconstruction of our nation is meaningless.\n- Sukarno, 1955§!"
 LOADING_TIP_120:0 "§qPerfection belongs to tales, not to our experience.\n- Primo Levi§!"
 LOADING_TIP_121:0 "§qShould we blindly pursue democratic freedom that will lead us to total defeat, or should we rein in unruly liberty to achieve victory?\n- Lon Nol, 1966§!"
 LOADING_TIP_122:0 "§qEternal nature severely punishes whoever transgresses its commands.\n- Adolf Hitler, Mein Kampf, 1924§!"
 LOADING_TIP_123:0 "§qMan may die, nations may rise and fall, but an idea lives on. Ideas have endurance without death.\n- John F. Kennedy, 1963§!"
 LOADING_TIP_124:0 "§qA man may die for an idea, but the idea will be realized by a thousand others after his death.\n- Subhas Chandra Bose, 1940§!"
 LOADING_TIP_125:0 "§qThe end justifies the means, but then there must be something to justify the end.\n- Leon Trotsky, 1938§!"
 LOADING_TIP_126:0 "§qNature does not know extinction; it only knows transformation.\n- Wernher von Braun, 1962§!"
 LOADING_TIP_127:0 "§qUnfortunately, the Earth is not paradise, but a struggle for survival, and one that is all the more cruel because it is resigned to fate.\n- Martin Bormann, 1971§!"
 LOADING_TIP_128:0 "§qAn optimist believes this is the best of all possible worlds; a pessimist fears this is true.\n- James Branch Cabell, The Silver Stallion, 1926§!"
 LOADING_TIP_129:0 "§qIt is hard to recognize the devil when he has his arm around your shoulder.\n- Albert Speer, 1972§!"
 LOADING_TIP_130:0 "§qHatred of the invading enemy is the most sacred and most human of emotions. But it is born so painful, so tormenting to the soul, that God forbids anyone to experience it a second time.\n- Pavel Batov on the Black League, 1959§!"
 LOADING_TIP_131:0 "§qAn eye for an eye only ends up making the whole world blind.§!"
 LOADING_TIP_132:0 "§qDo not fear walking the path of truth alone.\n- Robert F. Kennedy, 1968§!"
 LOADING_TIP_133:0 "§qHumanity sheds blood readily for war, but shrinks from peace.\n- Olaf Stapledon, 1916§!"
 LOADING_TIP_134:0 "§qI accepted my infamous fate calmly.\n- Galeazzo Ciano, 1963§!"
 LOADING_TIP_135:0 "§qAs always, the fruits of success are claimed by a hundred men, but the bitter fruit of failure is left untouched.\n- Galeazzo Ciano, 1946§!"
 LOADING_TIP_136:0 "§qIn wartime, the law is silent.\n- Marcus Tullius Cicero, 52 BC§!"
 LOADING_TIP_137:0 "§qThe victor is never asked whether what he says is true.\n- Adolf Hitler, 1939§!"
 LOADING_TIP_138:0 "§qOne must never underestimate the effect of centuries of decline on our national subconscious. This is why the young people of Cambodia constantly ask themselves whether Cambodia can survive as a nation.\n- Khieu Samphan, 1970§!"
 LOADING_TIP_139:0 "§qThey ask little of you: only that you hate what you love, and love what you hate.\n- Boris Pasternak, 1960§!"
 LOADING_TIP_140:0 "§qFor a friend, no sacrifice is too great; for an enemy, no justice is enough.\n- Juan Domingo Perón, 1973§!"
 LOADING_TIP_141:0 "§qThey are neither dead nor alive; they are simply de-saparecidos, disappeared.\n- Jorge Rafael Videla, 1979§!"
 LOADING_TIP_142:0 "§qGovernments may come and go a hundred times; I only wish the principles survive.\n- Hipólito Yrigoyen, 1916§!"
 LOADING_TIP_143:0 "§qUnder democracy, you can cure the sick, feed the hungry, and teach the children.\n- Raúl Alfonsín, 1983§!"
 LOADING_TIP_144:0 "§qThe Khmer people have a noble origin. When resisting the enemy, saving the faith, and liberating the homeland, they have never counted the cost of life... Sacrifice is nothing compared to enslavement and religious persecution.\n- Son Ngoc Minh, 1951§!"
 LOADING_TIP_145:0 "§qDo not fear; the broad road upon which free men walk will surely be open again!\n- Salvador Allende, 1967§!"
 LOADING_TIP_146:0 "§qI am a member of the one, holy, catholic, and apostolic Church, but I am not naive.\n- Augusto Pinochet, 1983§!"
 LOADING_TIP_147:0 "§qThe Cambodian revolution is not like Western politics; it does not follow strict logic, but is more like an exquisite and intricate Angkor sculpture, slowly revealing itself to the viewer.\n- Son Ngoc Thanh, 1964§!"
 LOADING_TIP_148:0 "§qMobilizing people peacefully is more effective than using violence.\n- Raúl Alfonsín§!"
 LOADING_TIP_149:0 "§qSometimes, knowing how to wait is victory.\n- Getúlio Vargas§!"
 LOADING_TIP_150:0 "§qAll my life I have been a slave of the people; I pray that the people for whom I was a slave will not become slaves of others.\n- Getúlio Vargas§!"
 LOADING_TIP_151:0 "§qThe peasant is robbed when he sells his produce, and extorted when he buys what he needs - such is the nature of the market.\n- Hu Nim§!"
 LOADING_TIP_152:0 "§qThey are the chopping block; we are the fish.\n- Sun Yat-sen§!"
 LOADING_TIP_153:0 "§qStirring revolution in Brazil is like marrying a Frenchwoman - no violence, no killing.\n- Carlos Lacerda§!"
 LOADING_TIP_154:0 "§qAn optimist may fail, but the pessimist has already failed.\n- Juscelino Kubitschek, 1956§!"
 LOADING_TIP_155:0 "§qIf I complete just ten percent of my plan, I can leave office with a smile.\n- João Goulart, 1964§!"
 LOADING_TIP_156:0 "§qI take money, but I also deliver.\n- Adhemar de Barros, 1960§!"
 LOADING_TIP_157:0 "§qPerón is a god to us all.\n- María Eva Perón§!"
 LOADING_TIP_158:0 "§qAn idea is not a man, but it can fight like one.\n- Tancredo Neves, 1985§!"
 LOADING_TIP_159:0 "§qThe stench of humanity is not as pleasant as the smell of my horse.\n- João Baptista de Oliveira Figueiredo, 1982§!"
 LOADING_TIP_160:0 "§qWe followed a code of conduct, which unfortunately led to authoritarianism.\n- Juan María Bordaberry§!"
 LOADING_TIP_161:0 "§qI firmly believe that, as the opposite of the rule of law, the rule of the sword will rise again faster than imagined.\n- Roberto Viola, 1967§!"
 LOADING_TIP_162:0 "§qBut ill fortune that is foretold cannot be guarded against.\n- Lazarillo de Tormes§!"
 LOADING_TIP_163:0 "§qSancho, freedom is a priceless gift from heaven to mankind; men should risk their lives to attain it.\n- Don Quixote§!"
 LOADING_TIP_164:0 "§qYoung people who do not make revolution are a biological contradiction.\n- Salvador Allende§!"
 LOADING_TIP_165:0 "§qIf the Socialists want to be friends with Russia, a dictatorship no Englishman would recognize, why should we not join hands with Italy and Germany?\n- Rab Butler, 1938§!"
 LOADING_TIP_166:0 "§qWhen I fall, pick up the flag, kiss it, and keep on going.\n- Omar Torrijos§!"
 LOADING_TIP_167:0 "§qThe people are not infallible, but only the people have the right to err.\n- José Batlle y Ordñez, 1904§!"
 LOADING_TIP_168:0 "§q“Planning” is the new word for coherent and positive policy. I believe that strong government policy in economic affairs is central to the British tradition.\n- Rab Butler, 1964§!"
 LOADING_TIP_169:0 "§qNational Socialism survived the flames of war and the storms of defamation precisely because it is the will to live, the health and strength, and the craving for beauty of life of a higher type of man.\n- Colin Jordan§!"
 LOADING_TIP_170:0 "§qThe nightly news always cheers me up. In it, the world is being torn apart, and Brazil is at peace.\n- Emílio Garrastazu Médici, 1970§!"
 LOADING_TIP_171:0 "§qTo bring Argentina back to stability, many people must die.\n- Jorge Rafael Videla, 1976§!"
 LOADING_TIP_172:0 "§qIf the dead cannot complain, their death has a purpose.\n- Alfredo Astiz, 1976§!"
 LOADING_TIP_173:0 "§qI must admit, father, that was when I discovered I really enjoyed killing.\n- Ernesto “Che” Guevara, 1959§!"
 LOADING_TIP_174:0 "§qDo not forget that there was once a plebiscite in history between Christ and Barabbas, and the people chose to release Barabbas.\n- Augusto Pinochet, 1989§!"
 LOADING_TIP_175:0 "§qYou must choose your enemies carefully, because you will end up resembling them.\n- Jorge Luis Borges§!"
 LOADING_TIP_176:0 "§qSometimes, democracy must be watered with blood.\n- Augusto Pinochet, 1983§!"
 LOADING_TIP_177:0 "§qI took the Canal Zone; let Congress debate. While they debate, I will build the canal.\n- Theodore Roosevelt, 1911§!"
 LOADING_TIP_178:0 "§qPrecisely because we have nothing, we can do anything.\n- Carlos Ditborn, 1956§!"
 LOADING_TIP_179:0 "§qWhether in the history of Peru past and present, or in the prophecies of tomorrow, the same thing is proclaimed: the people did it.\n- Fernando Belaúnde, in Apurímac, 1956§!"
 LOADING_TIP_180:0 "§qA revolution is not an apple that falls when it is ripe; you have to make it fall.\n- Ernesto “Che” Guevara, 1967§!"
 LOADING_TIP_181:0 "§qI know you have come to kill me. Shoot, coward, you are only killing a man.\n- Ernesto “Che” Guevara, 1967§!"
 LOADING_TIP_182:0 "§qI know the Haitian people well, because I am the Haitian people.\n- François Duvalier, 1964§!"
 LOADING_TIP_183:0 "§qThe United States is destined to plague America in the name of freedom; this is the fate God has decreed.\n- Simón Bolívar, 1829§!"
 LOADING_TIP_184:0 "§qJapan must no longer allow the shamelessness of the white race to go unpunished. Japan has a duty to fulfill its innate destiny, to make China respect Japan, drive its influence out of Manchuria, and set it on the path of imperial destiny.\n- Sadao Araki§!"
 LOADING_TIP_185:0 "§qI believe that to achieve a socialist fatherland, we must kill at least one million people.\n- Mario Roberto Santucho, 1965§!"
 LOADING_TIP_186:0 "§qLook, Argentina has a third Radicals, a third Conservatives, and about a fifth Socialists... Half love me, half hate me. Clearly, they are all Peronists!\n- Juan Domingo Perón, 1972§!"
 LOADING_TIP_187:0 "§qThis is not the first coup, nor will it be the last.\n- Benjamín Menéndez, 1951§!"
 LOADING_TIP_188:0 "§qNeither victors nor vanquished. Argentines.\n- Eduardo Lonardi, 1955§!"
 LOADING_TIP_189:0 "§qThe four horsemen who brought about Argentina’s decline were Conservative fraud, Peronist greed, military arrogance, and Radical government.\n- Emilio Aldao, 1991§!"
 LOADING_TIP_190:0 "§qThose Chileans had better stop their nonsense, or I will be eating breakfast in Santiago tomorrow.\n- Juan Velasco Alvarado, 1975§!"
 LOADING_TIP_191:0 "§qTo think the army is under your control is self-deception. The army belongs to no one; it follows only its own laws.\n- İsmet İnönü§!"
 LOADING_TIP_192:0 "§qWhat was my government’s greatest mistake?... Getting elected.\n- Arturo Frondizi, 1972§!"
 LOADING_TIP_193:0 "§qLads, this battle is unfair, but we must have spirit and courage. Our flag has never been struck down by the enemy, and it will not be now. Charge!\n- Arturo Prat’s last words, 1879§!"
 LOADING_TIP_194:0 "§qEconomic research often finds that the best time to buy something was last year.\n- Marty Allen, 1955§!"
 LOADING_TIP_195:0 "§qThis system does not punish its own; it rewards them. It does not imprison its own executioners; it preserves them.\n- Rodolfo Walsh, 1957§!"
 LOADING_TIP_196:0 "§qEmpires do not need slaves; they need citizens and soldiers! How can we fight the wars of the future if we are only ensuring our own people do not rise up?\n- Ettore Muti, 1966§!"
 LOADING_TIP_197:0 "§qHitler is a whirling dervish who must be eliminated.\n- Henning von Tresckow, 1938§!"
 LOADING_TIP_198:0 "§qIn the name of God and fascism, we will make Italy whole.\n- Niccolõ Giani, 1965§!"
 LOADING_TIP_199:0 "§qThe road to true rather than false brotherhood lies not in self-denial, but in self-awareness. We should not deny ourselves and force ourselves to conform to others; we should be ourselves while giving others full respect.\n- Ivan Dziuba, 1966§!"
 LOADING_TIP_200:0 "§qAs a soldier, I believe the hour of decisive battle has come.\n- Hafez al-Assad, 1967§!"
 LOADING_TIP_201:0 "§qFascism begins with contempt for the individual and ends in the destruction of the nation - though not necessarily the kind of destruction seen at Babi Yar.\n- Ivan Dziuba, 1966§!"
 LOADING_TIP_202:0 "§qDespite the massacre, the balance of military action has tilted toward the Mapuche.\n- Dr. Serrano Montaner, 1912§!"
 LOADING_TIP_203:0 "§qThere is no god but the noble Allah; all else is darkness.\n- Ruhollah Khomeini, Valiyat al-Faqih, 1970§!"
 LOADING_TIP_204:0 "§qAnarchy is not a political ideology, but a state fundamentally incompatible with civilization. Root out hidden anarchy with the utmost prejudice and replace it with order.\n- Alessandro Pavolini, 1965§!"
 LOADING_TIP_205:0 "§qDeath has always been the first sign of European civilization in the Pacific.\n- José Rizal, 1890§!"
 LOADING_TIP_206:0 "§qI often tell my countrymen: is it not sad that Filipinos must learn about themselves from foreigners?\n- José Rizal, 1887§!"
 LOADING_TIP_207:0 "§qI want no prisoners. I want you to kill and burn. The more you kill and burn, the better I like it. I will kill all who can bear arms against the United States in hostilities.\n- General Jacob H. Smith, 1901§!"
 LOADING_TIP_208:0 "§qIt may be necessary to kill half the Filipinos in order that the remaining half may achieve a higher standard of living.\n- General William Shafter, 1899§!"
 LOADING_TIP_209:0 "§qAny nation that thinks it can achieve peace only through peaceful means will soon become part of another nation.\n- Richard Nixon, 1985§!"
 LOADING_TIP_210:0 "§qWe need only kick in the door, and the whole rotten structure will come crashing down.\n- Adolf Hitler, 1941§!"
 LOADING_TIP_211:0 "§qI only want to hear yes or no!\n- General Tomoyuki Yamashita demanding Singapore’s surrender, 1942§!"
 LOADING_TIP_212:0 "§qIf one day the people, exhausted by excessive taxes and tortured by abuses of power, turn to their enemies for salvation, then the revolution is finished!\n- Apolinario Mabini, 1899§!"
 LOADING_TIP_213:0 "§qSlavs will work for us. When they are no longer needed, kill them.\n- Martin Bormann§!"
 LOADING_TIP_214:0 "§qChristianity is incompatible with National Socialism.\n- Martin Bormann§!"
 LOADING_TIP_215:0 "§qThe function of the Party is to create the will of the state.\n- Martin Bormann§!"
 LOADING_TIP_216:0 "§qThe old order is dying but will not pass away, and the new order cannot yet be born; in this interregnum, many morbid symptoms will appear.\n- Antonio Gramsci, 1930§!"
 LOADING_TIP_217:0 "§qIt is time the Party Chancellery strengthened its control; we must be answerable to the people.\n- Martin Bormann§!"
 LOADING_TIP_218:0 "§qThe police should act whenever it is necessary - both prudently and boldly.\n- Gustavo Díaz Ordaz, 1968§!"
 LOADING_TIP_219:0 "§qFear is the best political weapon. Cruelty earns respect. People may hate us, but we do not need their love, only their fear.\n- Heinrich Himmler§!"
 LOADING_TIP_220:0 "§qWhat governs the Republican People’s Party: orders or the law? Are we law-abiding, free members of a democratic party, or its servants?\n- Bülent Ecevit§!"
 LOADING_TIP_221:0 "§qMost economic fallacies derive from the assumption of a fixed pie, that one side gains what the other loses.\n- Milton Friedman, 1980§!"
 LOADING_TIP_222:0 "§qYou kill ten of us, we kill one of you, but even then, you will be the first to break.\n- Ho Chi Minh, 1946§!"
 LOADING_TIP_223:0 "§qOnly those who dare to suffer great setbacks can achieve great things.\n- Robert F. Kennedy, 1968§!"
 LOADING_TIP_224:0 "§qIn today’s world, the greatest political threat to peace and happiness is fascism.\n- Bülent Ecevit, 1957§!"
 LOADING_TIP_225:0 "§qThe difficulty lies not in developing new ideas, but in escaping old ones.\n- John Maynard Keynes, 1946§!"
 LOADING_TIP_226:0 "§qThere are three kinds of lies: lies, damned lies, and statistics.\n- Mark Twain, 1907§!"
 LOADING_TIP_227:0 "§qOur position is most dangerous at this hour. If we do not promptly promote nationalism and unite the four hundred million into a strong nation, China will face the peril of national extinction.\n- Sun Yat-sen, 1924§!"
 LOADING_TIP_228:0 "§qEverything that stagnates and fails to change with the needs of the times is doomed to perish. Political procrastination is often fatal.\n- Francisco Franco, 1959§!"
 LOADING_TIP_229:0 "§qFascism is not defined by the number of its victims, but by the way it kills them.\n- Jean-Paul Sartre, 1953§!"
 LOADING_TIP_230:0 "§qThrough modern technical means, the will of a single man can be made to rule millions.\n- Albert Speer, 1959§!"
 LOADING_TIP_231:0 "§qIf a government is powerful enough to give you everything you want, it is also powerful enough to take away everything you have.\n- Barry Goldwater, 1964§!"
 LOADING_TIP_232:0 "§qJapan dares to bully us mainly because of the disorganization of the Chinese people. Once this defect is overcome, we will place the Japanese invaders before hundreds of millions of risen people, like a wild buffalo charging into a ring of fire; our shout alone will startle it, and it must be burned alive.\n- Mao Zedong, 1938§!"
 LOADING_TIP_233:0 "§qFor poverty and exploitation, socialism is the answer of cowards! Only fascism can break your chains!\n- Ettore Muti, 1968§!"
 LOADING_TIP_234:0 "§qIt is far easier for a Nazi and a Communist to agree than for two Communists to work together.\n- Iraqi communist saying, 1946§!"
 LOADING_TIP_235:0 "§qThe plots of imperialism will be defeated by the unity of the Arab and Kurdish peoples!\n- A banner in Baghdad, 1959§!"
 LOADING_TIP_236:0 "§qRemember how you were taught: “Be kind and tolerant to your people, for if you are violent and cruel, they will leave you. I sent you only as a mercy to all the worlds.”\n- Hussein-Ali Montazeri, 1975§!"
 LOADING_TIP_237:0 "§qWherever you visit in our country, you will find how widespread suffering, poverty, and deprivation are in people’s lives. Whether they live in shacks or by the marshes, they are merely walking dead.\n- Abd al-Karim Qasim, 1959§!"
 LOADING_TIP_238:0 "§qWithout thorough reform, one day a Brazilian Fidel Castro will rise up in some ravine.\n- Jânio Quadros§!"
 LOADING_TIP_239:0 "§qI am certain this country will experience a second revolution.\n- Talat Aydemir§!"
 LOADING_TIP_240:0 "§qThe moment you refuse to stand up for justice, you are already dead. The moment you refuse to stand up for fairness, you are already dead.\n- Martin Luther King Jr., 1965§!"
 LOADING_TIP_241:0 "§qThe best steel must pass through the hottest fire.\n- Richard Nixon, 1975§!"
 LOADING_TIP_242:0 "§qThe cause of a martyr never ends because of an assassin’s bullet.\n- Robert F. Kennedy, 1968§!"
 LOADING_TIP_243:0 "§qYour hearts must all be made of cash registers.\n- Tom Ehlen, 1984§!"
 LOADING_TIP_244:0 "§qIn the 1960 election, the question before the nation and the world became whether the world would continue to exist half-slave and half-free.\n- John F. Kennedy, 1960§!"
 LOADING_TIP_245:0 "§qA society built on violence is fundamentally inhuman. Instead of encouraging progress and improvement in life, it imposes many restrictions on human freedom.\n- Pope John XXIII, 1962§!"
 LOADING_TIP_246:0 "§qIf a man wants to be a leader and is not controversial, then he has never stood for anything.\n- Richard Nixon, 1978§!"
 LOADING_TIP_247:0 "§qWe can learn from history, but we cannot live in the past.\n- Lyndon B. Johnson, 1966§!"
 LOADING_TIP_248:0 "§qTo put it bluntly, if necessary discipline is to be maintained, it can only be through authoritarian means.\n- Plaek Phibunsongkhram, 1936§!"
 LOADING_TIP_249:0 "§qVictory is not truth; it is merely a word for those who survive among the ruins.\n- Lyndon B. Johnson, 1966§!"
 LOADING_TIP_250:0 "§qNixon is like a Spanish horse; he can lead the field by nine lengths, then immediately turn and run the other way. Watch, he will do the wrong thing. He always does.\n- Lyndon B. Johnson, 1961§!"
 LOADING_TIP_251:0 "§qThey have force and the ability to rule us, but social processes will not be obstructed by crime and force. History is ours; the people make history.\n- Salvador Allende, 1967§!"
 LOADING_TIP_252:0 "§qDestruction and slaughter have reached an immeasurable degree: day after day, the earth is soaked with fresh blood and covered with the bodies of the wounded and slain.\n- Pope Benedict XV, 1914§!"
 LOADING_TIP_253:0 "§qIf sacrificing my country can bring world peace, I will be the first to applaud. But if it cannot, then may God have mercy on your souls.\n- Jan Masaryk, 1938§!"
 LOADING_TIP_254:0 "§qDo not live on earth as a stranger or a tourist, but as in your father’s house: trust the grain, the soil, the sea, but above all, trust people first.\n- Nâzım Hikmet§!"
 LOADING_TIP_255:0 "§qIn this country, the only party responsible for everything that has happened in the last twenty-five years is the Republican People’s Party, built and organized to implement the leader’s will and gradually transformed since 1938 into a fascist party.\n- Mehmet Ali Aybar§!"
 LOADING_TIP_256:0 "§qWe rose up against the tyrant for justice. We raised the banner of justice over the corpses of despots. Facing death, we avenged ourselves with our own blood.\n- Abdul-Hadi al-Fawwaz, 1981§!"
 LOADING_TIP_257:0 "§qBormann treated his own subordinates as if he were dealing with cattle.\n- Albert Speer, 1955§!"
 LOADING_TIP_258:0 "§qThough Turkey’s roots have rotted, we will not abandon it for that alone, but must learn to live with it.\n- Süleyman Demirel§!"
 LOADING_TIP_259:0 "§q...We have involved ourselves in a colossal muddle, having blundered into the control of a delicate machine, the working of which we do not understand.\n- John Maynard Keynes, 1930§!"
 LOADING_TIP_260:0 "§qThe power of economists matters most when it influences laymen: politicians, journalists, civil servants, and the general public.\n- Friedrich Hayek, 1974§!"
 LOADING_TIP_261:0 "§qYesterday is yesterday; today is today.\n- Süleyman Demirel§!"
 LOADING_TIP_262:0 "§qI will jump into my grave laughing, because I have the blood of five million people on my hands. This feeling is an immense satisfaction to me.\n- Adolf Eichmann, 1945§!"
 LOADING_TIP_263:0 "§q“Today I have put on the green uniform once more, not to join an army fighting to defend vested interests and exploitation, but to join the people’s revolutionary army that has already begun to take shape.”\n- Svante Grund§!"
 LOADING_TIP_264:0 "§qTo try to forget only increases suffering; the key to redemption is to remember the past.\n- Richard von Weizsäcker, 1985§!"
 LOADING_TIP_265:0 "§qFreedom is not a luxury in national life, but its foundation and essence, and its meaning.\n- Michel Aflaq§!"
 LOADING_TIP_266:0 "§qIf the future is not bright, at least it is colorful.\n- Birgit Baggeerd, 2001§!"
 LOADING_TIP_267:0 "§qThere is nothing left to do; the situation cannot be undone.\n- Arturo Illia to Silvano Santander after being overthrown, 1966§!"
 LOADING_TIP_268:0 "§qIt is time to renew the nation. It may be too late for us, but not for our children.\n- Jânio Quadros, 1963§!"
 LOADING_TIP_269:0 "§qThe people of the colonies believe the primary value is first the land, because it is the most concrete - the land should guarantee bread, and of course dignity.\n- Frantz Fanon, 1963§!"
 LOADING_TIP_270:0 "§qA government and a party have the people they deserve. And on the day things must happen, the people have the government they deserve.\n- Frantz Fanon, 1963§!"
 LOADING_TIP_271:0 "§qWe must regard the removal of the Jews as a contribution to European culture.\n- Baldur von Schirach, 1942§!"
 LOADING_TIP_272:0 "§qThose who want to burn books either fear the ideas in them or lack the courage to defend their own views.\n- Tommy Douglas, 1959§!"
 LOADING_TIP_273:0 "§qThe Earth is the cradle of humanity, but mankind cannot live in the cradle forever.\n- Konstantin Tsiolkovsky, 1911§!"
 LOADING_TIP_274:0 "§qThe seed of doubt has been sown; truth becomes irrelevant, and decades of established trust can be shattered effortlessly.\n- Niccolõ Giani, 1965§!"
 LOADING_TIP_275:0 "§qThe economy is like a woman; to control her, beat her until she submits.\n- Alessandro Pavolini’s adaptation of Machiavelli, 1966§!"
 LOADING_TIP_276:0 "§qThe (fascist) government can imprison, exile, and persecute anyone at will, but what can it do to the entire next generation?\n- Michel Aflaq, 1945§!"
 LOADING_TIP_277:0 "§qTo take part in the African revolution, it is not enough to write a revolutionary song. You must shape the revolution with the people, and then someone will write the songs.\n- Sékou Touré, 1959§!"
 LOADING_TIP_278:0 "§qTolerance grows only when faith loses its certainty; certainty kills.\n- Will Durant§!"
 LOADING_TIP_279:0 "§qRacial theories are mostly built on delusions interwoven with primitive notions.\n- Antoun Saadeh, The Rise of the Nation, 1932§!"
 LOADING_TIP_280:0 "§qYou are in the hands of the Gestapo; do not imagine we will give you the slightest consideration.\n- Heinrich “Gestapo” Müller, 1939§!"
 LOADING_TIP_281:0 "§qGive us the future; we have had enough of your past... Give us back our country to live in - to grow... to love.\n- Michael Collins during the Anglo-Irish Treaty negotiations, 1921§!"
 LOADING_TIP_282:0 "§qThe blood of heroes is closer to God than the ink of philosophers and the prayers of the faithful.\n- Julius Evola, 1934§!"
 LOADING_TIP_283:0 "§qIt is precisely because life is like this that one dreams of revenge.\n- Paul Gauguin§!"
 LOADING_TIP_284:0 "§qYou take the easy path; I take the difficult one.\n- Wang Jingwei, 1938§!"
 LOADING_TIP_285:0 "§qNothing is more precious than independence and freedom.\n- Ho Chi Minh, 1966§!"
 LOADING_TIP_286:0 "§qIf a man feels disappointed, it means he still believes in something.\n- Dmitri Shostakovich§!"
 LOADING_TIP_287:0 "§qThe enemy is not only those who attack order, but also the betrayers and the indifferent.\n- Jorge Pacheco Areco, 1968§!"
 LOADING_TIP_288:0 "§qOne day, Liber Arce died on the streets of Montevideo, and the grieving people realized that Uruguay was changing, that events had spiraled out of control.\n- Zelmar Michelini, 1971§!"
 LOADING_TIP_289:0 "§qWhatever happens, the flame of the French resistance must not be extinguished and will not be extinguished.\n- Charles de Gaulle, 1940§!"
 LOADING_TIP_290:0 "§qJapan, China, and Manchukuo will unite for the common goal of establishing a new order in East Asia, achieving neighborly friendship, confronting the communist threat, and promoting economic cooperation.\n- Fumimaro Konoe, 1938§!"
 LOADING_TIP_291:0 "§qThe demons bred by democracy threaten to destroy all sincere values, and demons can only be defeated by their own kind.\n- Franz von Papen, 1933§!"
 LOADING_TIP_292:0 "§qYou are wrong. It was our idea to appoint him.\n- Von Papen’s reply after a conservative warned that “those who supported Hitler as chancellor have been manipulated by him,” 1933§!"
 LOADING_TIP_293:0 "§qA supreme (Santa Cruz) race, though a numerical minority, will not be assimilated by the (Bolivian) majority, which is inferior both culturally and racially.\n- Raúl del Pozo Cano, 1933§!"
 LOADING_TIP_294:0 "§qThere are two Mustafa Kemals. One is the flesh-and-blood Mustafa Kemal who stands before you now and will one day leave this earth. The other is you, all of you here, who will go to the far corners of the motherland to spread the ideal and defend it with your lives.\n- Mustafa Kemal Atatürk, 1933§!"
 LOADING_TIP_295:0 "§qThe Japanese bandits are a skin rash; the communists are a sickness of the heart.\n- Chiang Kai-shek, 1941§!"
 LOADING_TIP_296:0 "§qIn the United States, we can achieve socialism through the ballot box.\n- Gus Hall, 1996§!"
 LOADING_TIP_297:0 "§qOnce we wage decisive battle against the oil monopolists, our revolution will be more than a revolution. It will be elevated into a head-on struggle against imperialism.\n- Ahmed Hassan al-Bakr, 1972§!"
 LOADING_TIP_298:0 "§qGo, tell the newspapers that you seized power and call yourselves leaders of freedom. As for me - I am bathed in the highest honor - only because I followed justice and renounced all exploitation.\n- Muhammad Mahdi al-Jawahiri, 1948§!"
 LOADING_TIP_299:0 "§qThe treacherous and their kin have palaces and courts,\nwhile the loyal and patriotic face the gallows and the grave.\n- Muhammad Salih Bahr al-Ulum, 1968§!"
 LOADING_TIP_300:0 "§qKoreans cling to traditional life, unaware of the outside world. We are like frogs at the bottom of a well.\n- Park Chung-hee, 1964§!"
 LOADING_TIP_301:0 "§qDemocracy is not for Africa. Historically Africa has only had one chief, right here in the Congo, and we must be united.\n- Mobutu Sese Seko§!"
 LOADING_TIP_302:0 "§qOutside, the synagogues are burning - but that is also God’s house.\n- Father Bernhard Lichtenberg after Kristallnacht, 1938§!"
 LOADING_TIP_303:0 "§qIf we have become the greatest and most powerful nation on earth, why not rule the world?\n- Irving Kristol§!"
 LOADING_TIP_304:0 "§qSome people stay dead when they die, but some come back and become immortal.\n- Rómulo Betancourt§!"
 LOADING_TIP_305:0 "§qFrance! France is humiliated! France is divided! France is martyred! But France is liberated!\n- Charles de Gaulle, 1971§!"
 LOADING_TIP_306:0 "§qBut this long run is a misleading guide to current affairs. In the long run, we are all dead.\n- John Maynard Keynes, 1923§!"
 LOADING_TIP_307:0 "§qGold can be traded, but independence cannot.\n- Siti Rahmah Kassim, 1957, on the eve of the anti-Japanese uprising§!"
 LOADING_TIP_308:0 "§qWe should not choose between the Republican and Democratic platforms; we should choose the right platform. We should no longer dwell on washing away the responsibilities of the past, but take on new responsibilities for the future.\n- John F. Kennedy, 1963§!"
 LOADING_TIP_309:0 "§qWhen two dogs fight, it is not their size that decides the outcome, but their fighting spirit.\n- Dwight D. Eisenhower, 1958§!"
 LOADING_TIP_310:0 "§qThe Japanese say you cannot even stand up on your own. Then stand up and show them!\n- Lim Chin Siong, 1962§!"
 LOADING_TIP_311:0 "§qFlee from countries where all power is exercised by a single man; that is a land of slaves.\n- Simón Bolívar§!"
 LOADING_TIP_312:0 "§qLet us build a homeland at all costs; everything else can be tolerated.\n- Simón Bolívar§!"
 LOADING_TIP_313:0 "§qIf you are going through hell, keep going.\n- Winston Churchill§!"
 LOADING_TIP_314:0 "§qFool me once, shame on the dog; fool me repeatedly, shame on the dog who is encouraged to do so.\n- Phyllis Schlafly, 1995§!"
 LOADING_TIP_315:0 "§qFutile prayer cannot replace honest work.\n- George W. Romney, c. 1968§!"
 LOADING_TIP_316:0 "§qIn certain historical events, civil disobedience has played a proper and beneficial role.\n- Philip Hart, 1965§!"
 LOADING_TIP_317:0 "§qWhat weighs on me most is the thought of those who believe in fascism.\n- Emperor Hirohito, 1940§!"
 LOADING_TIP_318:0 "§qI listen to the “voice without a voice.”\n- Nobusuke Kishi, 1960§!"
 LOADING_TIP_319:0 "§qThey rob, they kill, they steal; they call it empire. They make a desert and call it peace.\n- Tacitus, AD 98§!"
 LOADING_TIP_320:0 "§qWhat will become of this country’s future if, as a nation like Germany or Italy, it is forced into a close alliance with them?\n- Emperor Hirohito, 1940§!"
 LOADING_TIP_321:0 "§qGive me a balcony and I can be president.\n- José María Velasco Ibarra, 1960§!"
 LOADING_TIP_322:0 "§qBefore politics, there are no close friends, no sworn enemies.\n- Bahman Adibolesan§!"
 LOADING_TIP_323:0 "§qWe must make radical changes - a full 360 degrees.\n- Todor Zhivkov§!"
 LOADING_TIP_324:0 "§qThe only way to confront an unfree world is to become absolutely free, to make one’s very existence an act of rebellion.\n- Albert Camus, 1951§!"
 LOADING_TIP_325:0 "§qI do not fear losing the throne. If I must abdicate, I will go straight to America and become a mechanic.\n- Boris III§!"
 LOADING_TIP_326:0 "§qMy father was a statesman; I am a political woman. My father was a saint; I am not.\n- Indira Gandhi§!"
 LOADING_TIP_327:0 "§q“Positive neutrality” is a pure contradiction in terms. Positive neutrality is as impossible as a vegetarian tiger.\n- V. K. Krishna Menon§!"
 LOADING_TIP_328:0 "§qMy dear, I hope you will be strong. Believe in the beauty of life, stay optimistic, and know that the revolution is always victorious.\n- Valery Sablin, 1961§!"
 LOADING_TIP_329:0 "§qThe best thing that could happen to Queensland, or to the whole country, would be for the media to disappear entirely. Then we could live in peace and quiet.\n- Joe Bjeller-Pedersen, 1987§!"
 LOADING_TIP_330:0 "§qIt is indeed tragic. We cooperated with your enemies, and you cooperated with ours. But we did not fight for them, did we?\n- Anand Mohan Sahay, 1946§!"
 LOADING_TIP_331:0 "§qDivide the enemy and attack when they are unprepared; strike where they do not expect it.\n- Sun Tzu, The Art of War§!"
 LOADING_TIP_332:0 "§qI do not know with what weapons World War III will be fought, but I know that World War IV will be fought with sticks and stones.\n- Albert Einstein, 1949§!"
 LOADING_TIP_333:0 "§qI want to show the world what I have done, that is all. I do not care whether I appear as a war hero or anything else.\n- Siegfried Müller, 1966§!"
 LOADING_TIP_334:0 "§qIn short, we must not associate with the brownshirted Nazis, nor become another star on the flag of imperialism.\n- Luis Alberto de Herrera, 1947§!"
 LOADING_TIP_335:0 "§qWhen rumors of a coup circulate, go look at Sereni. If he harbors ill will, the people will suffer; if he has no treachery in his heart, the nation will be at peace.\n- Óscar Gestido, 1967§!"
 LOADING_TIP_336:0 "§qI must warn you that today’s war and peace does not depend on small countries like Bulgaria.\n- Bogdan Filov§!"
 LOADING_TIP_337:0 "§qCulture is not inherited; it is conquered.\n- André Malraux, 1959§!"
 LOADING_TIP_338:0 "§qHalf the confusion in this world comes from not knowing how trivial our needs really are.\n- Admiral Richard E. Byrd in Antarctica, 1935§!"
 LOADING_TIP_339:0 "§qIf survival means kneeling to others, then it were better never to have lived.\n- Nicolae Bălcescu§!"
 LOADING_TIP_340:0 "§qPolitical violence leaves far fewer corpses than the souls it rots.\n- Nicolás Gómez Dávila, 1978§!"
 LOADING_TIP_341:0 "§qThere is no room in war; it is a game, and the toughest side wins, and we must win.\n- Guillermo Suárez Mason, 1966§!"
 LOADING_TIP_342:0 "§qAmerica has no permanent friends, no permanent enemies, only permanent interests.\n- Henry Kissinger, 1971§!"
 LOADING_TIP_343:0 "§qOne day, the East will begin marching in all directions. And the West will rise up and tell them: this far and no farther.\n- Ernest C. Manning, 1967§!"
 LOADING_TIP_344:0 "§qIf you must steal, do it with some wit, and do it elegantly.\n- Mobutu Sese Seko, 1976§!"
 LOADING_TIP_345:0 "§qThis rocket is perfect in every way, except it landed on the wrong planet.\n- Wernher von Braun after the first V-2 strike on London, 1944§!"
 LOADING_TIP_346:0 "§qThe atomic bomb is a wonderful gift from the wise God to our nation.\n- Phyllis Schlafly, 1982§!"
 LOADING_TIP_347:0 "§qI will never allow any American to cross the threshold of my house.\n- José Yulo, 1945§!"
 LOADING_TIP_348:0 "§qIf you have nothing to say, then you have nothing to say.\n- Martin Luther King Jr., 1965§!"
 LOADING_TIP_349:0 "§qNation will rise against nation, and kingdom against kingdom; there will be famines, plagues, and earthquakes in various places. But all these things are but the beginning of birth pains.\n- Matthew 24:7-8§!"
 LOADING_TIP_350:0 "§qIf capitalism could survive for a century in idyllic peace, Marx’s theories would be thoroughly disproven. Yet capitalism still displays its power only through monopoly, oppression, dictatorship, and slaughter...\n- Amadeo Bordiga, 1952§!"
 LOADING_TIP_351:0 "§qThose in power in Ottawa are nothing but puppets of the Jews and Freemasons.\n- Réal Caouette, 1943§!"
 LOADING_TIP_352:0 "§qWhat I will is my command; my will is sufficient reason.\n- Juvenal, AD 115§!"
 LOADING_TIP_353:0 "§qWhen your enemy is making a mistake, never interrupt him.\n- Napoleon§!"
 LOADING_TIP_354:0 "§qNo American is truly free until every one of us is free.\n- Jackie Robinson, 1947§!"
 LOADING_TIP_355:0 "§qMy people are out there. I must find out where they are going, so that I can lead them.\n- Alexandre Auguste Ledru-Rollin, 1963§!"
 LOADING_TIP_356:0 "§qThis is a huge gamble! Either we create a promised land for God’s people, or we let it sink into darkness. We must either love each other, or we will all die together.\n- Lyndon B. Johnson, 1964§!"
 LOADING_TIP_357:0 "§qIf you think it absurd that mice should elect a government made up of cats, then just look at Canada’s history of the last 90 years and you will understand.\n- Tommy Douglas, 1935§!"
 LOADING_TIP_358:0 "§qGamblers know that the horse called “morality” rarely jumps the hurdles, while the one called “self-interest” always runs well.\n- Gough Whitlam, 1989§!"
 LOADING_TIP_359:0 "§qThe answers to all the problems of life, all the blessings and curses of the world - the key lies not in people’s hearts, but is inborn, carved into their very bones.\n- Josephus§!"
 LOADING_TIP_360:0 "§qThe fruits of victory have come to our mouths all too quickly.\n- Emperor Hirohito, 1942§!"
 LOADING_TIP_361:0 "§qCondemn me. It does not matter. History will absolve me.\n- Fidel Castro, 1953§!"
 LOADING_TIP_362:0 "§qIf fear and destruction are the emotional sources of fascism, then brotherhood belongs to democracy.\n- Theodor Adorno, 1950§!"
 LOADING_TIP_363:0 "§qPeople often say, “We live in a corrupt and hypocritical society.” That is not entirely true. Kind-hearted people are still the majority.\n- John Paul I, 1978§!"
 LOADING_TIP_364:0 "§qGovernment should belong to humans, not priests or gods. Humans can rule themselves through their own laws, but the law does not come from one man’s hand; it is made jointly by the whole nation.\n- Mehdi Bazargan, 1970§!"
 LOADING_TIP_365:0 "§qThe road to Delhi is the road to freedom.\n- Subhas Chandra Bose, 1946§!"
 LOADING_TIP_367:0 "§qWe are no longer your pet monkeys!\n- Patrice Lumumba, 1960§!"
 LOADING_TIP_368:0 "§qPeople should not become symbols to be memorialized, but should be remembered in the heart.\n- Pino Romualdi, 1972§!"
 LOADING_TIP_369:0 "§qPeople are not born with racial prejudice. You see, children do not think that way. The race question is essentially an educational question.\n- Ahmed Sékou Touré, 1961§!"
 LOADING_TIP_370:0 "§qThe ideology of imperialism, wherever it comes from, will ultimately come to nothing.\n- White Rose leaflet§!"
 LOADING_TIP_371:0 "§qFreedom of speech, freedom of religion, and the protection of the citizen’s individual rights from the violence and arbitrariness of a criminal regime - these will be the foundations of the new Europe.\n- White Rose leaflet§!"
 LOADING_TIP_372:0 "§qBuckingham Palace does not receive murderers.\n- King George VI, 1947§!"
 LOADING_TIP_373:0 "§qTo seek a universal model of revolution for every country and every situation is pure metaphysics.\n- Giorgio Amendola, 1965§!"
 LOADING_TIP_374:0 "§qBolivia is the best country in America for waging guerrilla warfare.\n- Ernesto “Che” Guevara, 1960§!"
 LOADING_TIP_375:0 "§qWhen you have buried me, then rise up and shatter the chains of slavery, and water the flowers of freedom with the black blood of the enemy.\n- Taras Shevchenko, The Testament§!"
 LOADING_TIP_376:0 "§qIn truth, revolution does not teach people to die, but to live.\n- Lu Xun§!"
 LOADING_TIP_377:0 "§qA journey of a thousand miles begins with a single step.\n- Tao Te Ching§!"
 LOADING_TIP_378:0 "§qWhen his wandering days were over, he found reason - this was not his homeland - only time will tell whether his defiance of the ancient laws was treachery, or foresight. May he rest here.\n- Leo Amery§!"
 LOADING_TIP_379:0 "§qRiots are not rootless: foreign agitators, armed guerrillas, all manner of civil rights agitators and New Left groups are mixed in, and communists and their sympathizers fill the ranks.\n- Phyllis Schlafly§!"
 LOADING_TIP_380:0 "§qFederal poverty fighters and do-gooders believe the only solution to “racially concentrated slums” is to burn them all down.\n- Phyllis Schlafly, 1967§!"
 LOADING_TIP_381:0 "§qPower is unbearable to those who do not have it.\n- Giulio Andreotti, 1951§!"
 LOADING_TIP_382:0 "§qMost freedoms have been won by people who broke the law.\n- Michael Foot, 1980§!"
 LOADING_TIP_383:0 "§qBetter to burn everything than surrender to the invader.\n- Aris Velouchiotis, 1945§!"
 LOADING_TIP_384:0 "§qDo your utmost to maneuver and maintain the balance. If you cannot maintain the balance, then let the world burn!\n- Józef Piłsudski, 1935§!"
 LOADING_TIP_385:0 "§qAny system that benefits only a small part of a group cannot last. In any group, the majority must shape its own future.\n- Pridi Banomyong, 1968§!"
 LOADING_TIP_386:0 "§qI repeat: in our lifetime, even in our children’s lifetime, we will be constantly struggling for power between the old and new orders.\n- Plaek Phibunsongkhram, 1940§!"
 LOADING_TIP_387:0 "§qOnly I can be responsible for my actions.\n- Sarit Thanarat, 1958§!"
 LOADING_TIP_388:0 "§qThe people’s hand will not rise against me, nor will the oligarchs’ hand kill me. They know that if I die, the nation will perish.\n- Jorge Eliécer Gaitán, 1947§!"
 LOADING_TIP_389:0 "§qI am not a dictator, and I do not want to be one.\n- Akio Morita, 1961§!"
 LOADING_TIP_390:0 "§qEvery day I carry the heavy burden of the company on my shoulders.\n- Masaru Ibuka, 1963§!"
 LOADING_TIP_391:0 "§qIdeas are not important; what matters is how to make them reality.\n- Masaru Ibuka, 1972§!"
 LOADING_TIP_392:0 "§qWithout an ideology to guide everything, without a firm direction forward, a company becomes a ship without a rudder.\n- Kenichiro Komai, 1965§!"
 LOADING_TIP_393:0 "§qYou may believe in feng shui if you wish, but I believe more in making things happen through human effort.\n- Li Ka-shing, 1969§!"
 LOADING_TIP_394:0 "§qI am Ibuka, president of this company. I hope you will remember that well.\n- Masaru Ibuka, 1960§!"
 LOADING_TIP_395:0 "§qPrecisely because God determines your fate, you should treat the customer as God. Whether your business succeeds depends entirely on the customer’s goodwill toward you.\n- Konosuke Matsushita, 1936§!"
 LOADING_TIP_396:0 "§qI set myself one small goal after another. The next development direction is all I care about.\n- Masaru Ibuka, 1955§!"
 LOADING_TIP_397:0 "§qSuccess depends on our will and effort.\n- Akio Morita, 1962§!"
 LOADING_TIP_398:0 "§qBuilding a good reputation for individuals and companies is an asset that does not appear on the balance sheet but is of infinite value.\n- Li Ka-shing, 1967§!"
 LOADING_TIP_399:0 "§qNo matter how outstanding, successful, shrewd, or capable you are as an individual, your company and your future depend entirely on the employees you hire.\n- Akio Morita, 1964§!"
 LOADING_TIP_400:0 "§qThe purpose of our company’s founding is to build an ideal factory that is free, open-spirited, and spiritual, where every technician can bring their technical energy into fullest play.\n- Masaru Ibuka, 1947§!"
 LOADING_TIP_401:0 "§qWealth comes and goes without warning; only knowledge lasts a lifetime.\n- Stanley Ho, 1966§!"
 LOADING_TIP_402:0 "§qThe supreme decision-making power of a company must be concentrated in the hands of the president alone; otherwise it leads to chaos and unclear decisions.\n- Kenichiro Komai, 1967§!"
 LOADING_TIP_403:0 "§qIf the president is too deferential to his predecessors, he cannot establish a clear management structure.\n- Kenichiro Komai, 1967§!"
 LOADING_TIP_404:0 "§qMoney is the only way to compensate a person’s work - I think this view is completely wrong. People need money, but they also need joy and pride in their work.\n- Akio Morita, 1966§!"
 LOADING_TIP_405:0 "§qFirst chaos, then the Yankees, then someone worse than me.\n- Rafael Leónidas Trujillo, 1955§!"
 LOADING_TIP_406:0 "§qIn a patriotic spirit, we shot into the heart of the beast.\n- Antonio de la Maza after the assassination of Rafael Leónidas Trujillo, 1963§!"
 LOADING_TIP_407:0 "§qCan you imagine, Dr. Barre, what would happen to America’s foreign policy if a senator listened to the nonsense of a local?\n- Eugene Burdick and William Lederer, The Ugly American, 1958§!"
 LOADING_TIP_408:0 "§qNothing wrong with that; it’s a good idea. We discussed it a lot in the woods. But this is not something you should be allowed to do. If it succeeds, the Taino will believe America is their savior.\n- Eugene Burdick and William Lederer, The Ugly American, 1958§!"
 LOADING_TIP_409:0 "§qBolivia is a country tormented to death by its neighbors... If their power were tied to territorial expansion, the peace of the entire continent would be threatened by such an unspeakable danger.\n- Chilean embassy in La Paz, 1927§!"
 LOADING_TIP_410:0 "§qTheir crimes are simple: collaboration, the past, and the future.\n- Máximo López Molina, 1964§!"
 LOADING_TIP_411:0 "§qMexico has no political prisoners, only common criminals.\n- Adolfo López Mateos justifying the suppression of the railway strike, 1958§!"
 LOADING_TIP_412:0 "§qBoth left and right are abysses; within the limits permitted by the constitution, I am actually on the far left.\n- Adolfo López Mateos explaining the electricity nationalization policy, 1960§!"
 LOADING_TIP_413:0 "§qThe Mexican Revolution is a perfect revolution: it turned the rich into the poor, the poor into fools, fools into politicians, and finally politicians back into the rich.\n- Adolfo López Mateos criticizing the PRI, 1958§!"
 LOADING_TIP_414:0 "§qWe do not wish to take certain measures we would prefer not to take, but if necessary, we will not hesitate. Whatever duty and obligation require, we must do; wherever we are carried, we must go forward.\n- Gustavo Díaz Ordaz responding to the student movement, 1968§!"
 LOADING_TIP_415:0 "§qTo uphold the highest interests entrusted to us by the people, I must confront those skilled in slander, rumor-mongering, and wrongdoing. Yet on the other hand, millions of our countrymen firmly support order and oppose the nation sinking into anarchy.\n- Gustavo Díaz Ordaz justifying political repression, 1968§!"
 LOADING_TIP_416:0 "§qYoung friends, life has never been calm, but surges like a storm. Life is not a stagnant pool but a rushing torrent; living is not peace but war...\n- Carlos Madrazo speaking to the PRI radicals, 1960§!"
 LOADING_TIP_417:0 "§qI gave Mexico many beautiful creations. Only, at this time she does not know what to do with them.\n- Raúl Salinas Lozano, 1976§!"
 LOADING_TIP_418:0 "§qI firmly believe that the decisions made by a good statesman will necessarily benefit the overwhelming majority of the Mexican people.\n- Raúl Salinas Lozano, commemorating 56 years of continuous PRI rule, 1985§!"
 LOADING_TIP_419:0 "§qI am certain that if we are to converse with the world’s powers, we must use the language they understand. It is time for the brave vanguard of the revolution to take up rifles, for this is the only language they understand and the only way they will give us respect.\n- Arturo Gammis addressing a crowd in Durango, Mexico, 1965§!"
 LOADING_TIP_420:0 "§qIt is easy to send soldiers to their deaths; it is easy to hide in an office, throwing your weight around and scolding teachers and students. The hard part is taking up arms and coming into the mountains to stop us.\n- Arturo Gammis in a letter to Chihuahua governor Praxedis Giner Durán, 1965§!"

l_english:
 jap_newflavour.1.t:0 "The Imperial Aid Association"
 jap_newflavour.1.d:0 "\"Happy New Year, Mr. Yuto.\" In the first days of January, Showa 37, after the New Year holidays ended, Yuto and his colleagues braved the winter cold to return to the Diet. From a distance, the National Diet Building looked ominous, and the ground had been soaked through since the night before. Yuto's colleagues in the Imperial Aid Association greeted him warmly, exchanging pleasantries. Perhaps this year would go more smoothly, he thought.\n\n\"Is everything alright?\"\n\n\"Naturally.\"\n\nPrime Minister Ino Shokuya hosted this year's opening ceremony of the Diet, declaring that \"this year will once again be a year of prosperity and development for Japan,\" and \"another step forward toward the realization of Pan-Asianism.\" Representatives of the Aid Association sat spread out. Yuto sat among the conservatives, next to the reformists. Behind them were the technocrats and the Kido faction, backbenchers of the Aid Association. Everything was going smoothly.\n\nThen, people began to discuss the annual budget. The conservatives proposed keeping military and domestic budgets at last year's levels. The reformists objected, demanding cuts to military spending. The technocrats were outraged, declaring that the defense state must not be abandoned at the height of the Cold War. Kido faction members raised their hands, about to dredge up events from a decade ago. The debate raged, and the Diet descended into a shouting match.\n\nYuto sighed. Not this again."
 jap_newflavour.1.a:0 "Welcome to Japan's house of cards."
 jap_newflavour.2.t:0 "The Conservative"
 jap_newflavour.2.d:0 "Ikeda's daily routine is no different from that of any office worker — on his commute to and from work. If he didn't live near the Diet Building, no one would guess he was Minister of Justice; he was that unassuming. Few could have guessed he would become Ino's political heir apparent in difficult times. The Prime Minister seemed intent on making him a fall guy, but regardless, he would do his best.\n\nThe sun sets over Tokyo, its crimson light fading beyond Yokohama Harbor, and the hooting of ships' horns marks their arrival and departure. Ikeda locks his office door with his briefcase, the composure of years of daily routine. It had been a busy day; he had spoken with judges, police chiefs, and governors from across Japan. He admitted it was difficult to manage the Nagoya serial murder case while also getting his intentions across to the High Court, but work was work.\n\nHe looked forward to dinner with Sato at home that evening. Japanese politics is not kind to newcomers. One must make friends early. Besides, Sato was a decent man. He drank a bit too much in his spare time, but he worked hard. If Ikeda ever had his own cabinet, perhaps he would find a suitable position for Sato. If? No, it was only a matter of time."
 jap_newflavour.2.a:0 "Hope the odds favor him."
 jap_newflavour.3.t:0 "The Admiral"
 jap_newflavour.3.d:0 "Japanese politics is a bloody arena that proves the law of the jungle, a monument to the idea that only the treacherous can rule all. To survive, you must abandon all ideological commitments or devotion, lest the system consume you and leave you in a worse position. At its core, it is a system that abhors \"honor.\" Yet in this land of conspirators, puppets, and madmen, one man still clings to his own honor. That man is Takagi Sōkichi.\n\nAs a child, Takagi was a boy of humble origins who developed a deep understanding of oppression and the oppressed. Even in the darkest hours, Takagi never lost his sympathy for those who had suffered. He joined the Navy to save a country he still believed was great. During his naval career, Takagi played a dangerous role, opposing the Tōjō government within the bounds of social and political acceptability. During the naval liberalization of the 1950s, he eventually became the leading figure of the Navy. As the burgeoning reformist wing entered the mainstream of Japanese politics, he would leave the Navy with honor and take on the role of reformist leader.\n\nTakagi is a respected man, admired by all for his conduct in public and private. He is also a realist, capable of criticizing others while understanding the limits of his own abilities. He was not suited for politics, as he soon grew tired of the relentless demands and obstacles on the path of political reform, but he bore it all in silence. A protector of the little man, a good soul in a barren land."
 jap_newflavour.3.a:0 "Command the waves."
 jap_newflavour.4.t:0 "The Bureaucrat"
 jap_newflavour.4.d:0 "Some say the world revolves around money; others say money is the root of all evil. For some in the Empire of Japan, it is both the end and the means of work. Kay Aya is such a man.\n\nThroughout his political career, Kay has been the chief source of revenue for an increasingly militarized Japan. In 1936, he joined other Japanese officials in maximizing our interests in Manchukuo by exploiting local mining, agriculture, and labor — especially as we clashed with the United States during the Greater East Asian War. Now, as Minister of Finance, Kay has spent years learning how to rise through Japan's brutal political system. And most importantly, whom to listen to.\n\nSince becoming Finance Minister, Kay has served in the House of Representatives, befriending many military men — particularly veterans of the Imperial Japanese Army. The Army has always been his best instrument for exercising power in Manchuria, and a man as seasoned as Kay is the perfect person to advance ideas that might otherwise spark controversy with the civilian government.\n\nKay is the head of the technocrats in the Aid Association, and his small faction will fight for the centralization of power in Japan, as intergovernmental squabbling only hinders Japan's development. He truly adheres to his ideals and convictions, committed to building a better, stronger Japan, and it is no secret that his ideals rely on his friends — many of whom also need a respected figure in the Diet to help achieve their goals. Whatever the rumors say, Kay Aya will tightly bind Japan's military and industrial power together."
 jap_newflavour.4.a:0 "Popular support will become his undoing."
 jap_newflavour.5.t:0 "The Puppetmaster"
 jap_newflavour.5.d:0 "There are many contradictions in Kido. An aristocrat and a Diet representative; a former Prime Minister and an aspiring power broker, yet a puppetmaster with no political instinct. They see him as a failure, an irrelevance. Aristocrats and legislators alike like to say to him: \"In the fifties, Mr. Kido.\" To hell with the fifties — that was long ago. The only thing that can bring Kido's gentle temper to a boil is reminding him of that time when he had power but no influence. That is yet another contradiction.\n\nHe sits in a corner of the House of Representatives lounge, the only representative wearing formal dress and proper demeanor. But if he sat in the aristocrats' lounge, he would surely be mocked and cast out for his loose cravat and patterned tie. Kido doesn't care. When they need his help, they will come to him; Kido is not the type to hold a grudge over being mocked for his clothing. Aristocrats should not be angry with their equals or inferiors.\n\nThe lounge has tea, cakes, and some representatives have brought bread and rice. Conservatives, reformists, and technocrats chat with their leaders. Even the most fanatical Kido faction members avoid him. He sits alone, undisturbed.\n\nOne day, these people will surround him, vying for fragments of his power. For now, he only needs to wait."
 jap_newflavour.5.a:0 "The old bird always finds a perch."
 jap_newflavour.6.t:0 "The Theorist"
 jap_newflavour.6.d:0 "Near the Imperial Palace live the kazoku, Japan's aristocracy and relatives of the Emperor. When Emperor Meiji moved the capital to Tokyo, everyone followed his palanquin in order of rank. Dew covers the courtyards, rooftops, and eaves here. When a breeze blows through the bare trees, the leafless branches rustle as if shivering in the deep cold of Japanese winter. Konoe's residence is here, solemn without being ostentatious, traditional without being rigid. Grass dots the ground; spring is not far off.\n\nKonoe Fumimaro's home is silent. He wants everything as quiet as possible. His wife is in the attic, looking for old clothes to give to a neighbor's son. He drinks tea in his study, the door bearing the Konoe family crest — the Konoe were the highest of the sekke families, though that was in the past. Konoe wears a yukata, sitting cross-legged, a vulgar posture that violates aristocratic etiquette. Before him are works from outside Japan. He has been this way since his youth; American diplomacy fascinates him.\n\nThese days, everything is quiet. In the twenty years since he became a minister, Japan has been trying to develop, maintain, and stabilize this nascent empire while resolutely opposing Western imperialism. He rarely contacts the Aid Association now. One does not deliberately seek out the mistakes one has made. He has not seen the Emperor in years; he had tried to dissuade the Emperor from going to war with the United States. Since then, His Majesty has never summoned him again.\n\nBut when the Emperor calls, Konoe Fumimaro is ready to answer."
 jap_newflavour.6.a:0 "No nation is greater than an individual's ideals."
 jap_newflavour.7.t:0 "The Backroom General"
 jap_newflavour.7.d:0 "Sunlight shines over Niigata Central Station, the transportation hub of the prefecture and the main commuter route for thousands of citizens — and today, the venue for a speech by Tanaka Kakuei, representative of Niigata's third district. Protected by local police, Tanaka addresses a crowd of Japanese farmers: his constituents, his roots, and above all, his people. A banner in the crowd reads: \"Niigata Mountain People's Association supports Tanaka Kakuei.\"\n\n\"Good morning, my dear citizens of Niigata. I bring good news for our beloved prefecture,\" Tanaka says in a distinct rural accent, his words quickly drowned out by applause.\n\n\"Many of you share my concerns: 'Mr. Tanaka, the Hakushin Line is overcrowded; we cannot get to Sendai or Toyama in such cramped conditions!' I hear you, my people, I hear you clearly. I promise to make those arrogant bureaucrats in Tokyo hear your voice too!\" The Hakushin Line is the only railway through Niigata. Niigata Prefecture in 1962 was still a largely rural, agricultural prefecture, and these economic characteristics served Tanaka well electorally. Tanaka has always been proud of his people; he is a man who rose from the grassroots and punctured the Tokyo bureaucratic bubble, and he still maintains the confidence of all sides through generous construction and development projects.\n\n\"So today, my fellow citizens of Niigata, I give you a first look at the Jōetsu Shinkansen!\"\n\nWhen Tanaka's speech ends and the ribbon is cut, camera flashes and applause engulf him. Tanaka remains silent on the matter, the first step a leader should take. He needs no more words to justify or defend himself: his own labor speaks for him and his constituents."
 jap_newflavour.7.a:0 "Never fall behind."
 jap_newflavour.9.t:0 "The Monster of Showa"
 jap_newflavour.9.d:0 "\"Yes, the shipment of 1,570 units of raw timber has been delayed. Forgive me, Your Highness, I am currently handling several important transport tasks. To prevent the situation from becoming overly... complex, the flight to Port Arthur must be delayed. Goodbye, Prince Noriyoshi, I will come see you again soon.\"\n\nKishi Nobusuke hung up the phone, sighed deeply, and poured himself a drink. It was a vintage from the Christophe Châtillon winery in Provence, 1954. It was just business, Kishi thought as he opened his ledger. The ledger was unremarkable, yet known among Kishi's subordinates, rivals, and even allies as the \"monster's handbook.\"\n\n\"Purchase: 1,570 units of raw timber, Chinese settlement 70 km west of Harbin. Ensure all timber is in usable condition via Colonel Takeshi.\"\n\n\"Shipping to: Port Arthur complex, Shōwa Steel Works. Timber to be processed immediately.\"\n\nLegally speaking, a Diet member like Kishi could not acquire such resources, let alone in another sovereign state. Yet Manchukuo — or Manchuria, as Kishi insisted on calling it — was his personal pride. Who else could have industrialized an uncivilized, backward hinterland in such a short time, turning it into the empire's industrial heartland?\n\nKishi turned to another section of his ledger, labeled \"Liabilities and Risks.\" The first page was covered in red stamps signifying \"liability waiver\" — a poetic metaphor for the bloodshed recorded on that page. Bureaucrats, civil servants, politicians, and students: no one escapes the eye of the monster of Showa. Kishi pressed the intercom button at the bottom of his desk.\n\n\"Set up a meeting with General Mutō Akira, next Thursday, at the Sukiyabashi Jirō.\""
 jap_newflavour.9.a:0 "Ties to Manchuria."
 jap_newflavour.10.t:0 "The Nasty Question"
 jap_newflavour.10.d:0 "Colonel Ōnishi hurled his bottle to the ground and raised his fist lazily. His uniform was stained with beer, and his decorations were drenched in it. Outside a squalid late-night bar, he launched into a foul-mouthed tirade, using every ounce of his strength to abuse a salaryman before lunging at him.\n\nThe salaryman was thrown to the ground, his head striking a red brick wall, and he howled in pain. He scrambled to regain his balance on the ground until the colonel kicked him in the back, intensifying his agony. Ōnishi beat the salaryman again and again, attacking him in the darkness of night with the rage of a drunk. The salaryman's cries echoed through the dim street and the noise of streetlights, falling silent only when struck in the face or abdomen. He wept for help, but this only enraged Ōnishi further as he continued to beat him in the alley.\n\nThe colonel grabbed the salaryman by the hair and dragged him from the alley into the middle of the street, staggering as he shouted that he would teach him a lesson. He raised his hand to continue beating the weeping, cowering man until sirens wailed in the distance. The police arrived, jumping from their cars to break up the fight and arrest both men. The salaryman clung to the officer, snot and tears mixed with blood streaming down his face. Ōnishi shouted at the officers, refusing arrest, and spat at the salaryman from afar. Both were loaded into the police car heading to the nearest station, exhausted and trembling from the brawl."
 jap_newflavour.10.a:0 "A fine show."
 jap_newflavour.11.t:0 "The Next Morning"
 jap_newflavour.11.d:0 "The jail cell in the police station was dilapidated; the salaryman and the colonel were locked in adjacent cells. The dark cells echoed with the clatter of typewriters, the chatter of police, and footsteps, all coming from the offices above. A report was slowly being printed, and the police shared it; it sounded like a familiar workplace, and he missed it terribly now. Soon, the jingle of keys echoed down the corridor, and the salaryman jumped up from the floor. The pain in his bruised face gnawed at his fragile patience, but the thought of imminent release calmed him.\n\nThe heavy footsteps of the guard marched along the stone corridor to the cells where they had been held overnight. Convinced of his innocence, the salaryman stood at the cell door, awaiting his liberation. When the guard stopped, keys jangling, another pang of pain shot through the salaryman. The key turned in the lock — but not the salaryman's. The guard saluted the colonel and apologized for the inconvenience; Ōnishi waved it off and left the station in a hurry. The guard locked the cell door and walked back down the stone corridor, each step hollow and meaningless to the salaryman.\n\nThe salaryman huddled in his cell, curling up against the cold wall of the prison. He wept, throwing his bloodied hands onto the filthy cell floor. He buried his face in his arms, his wailing drowned out by sobs and sniffles as he turned away from the rotting wall that held him captive — an eternity to him."
 jap_newflavour.11.a:0 "Please, let me out."
 jap_newflavour.12.t:0 "Bloody Day"
 jap_newflavour.12.d:0 "An officer of the Imperial Japanese Army stands on the white marble floor of the Yasuda Bank, his boots and cap immaculate, an air of Army self-righteousness faintly visible beneath his composed exterior. A clerk at the bank counter looks up to see the officer approaching, feeling both surprised and uneasy. Reaching the counter, the officer immediately begins the formalities, saying: \"I wish to speak with your bank's manager.\"\n\n\"Sir, if you wish, you may tell me what you need to discuss with the manager. My job is to handle the work the manager is too busy to do himself. If it is a matter of a loan, I can bring out the necessary documents.\"\n\n\"This is an extremely important matter,\" the officer said through gritted teeth. \"I wish to discuss a loan from the Shōwa Shōnan Shipping Company. The loan was applied for, but due to the delay caused by your incompetence, the original amount we applied for was rejected, and a smaller amount was given instead. Such behavior is... unforgivable.\" The officer leaned slowly forward, clasping his hands on the counter. He stretched his gloves, his knuckles cracking.\n\n\"Sir, if I may ask, what does this have to do with the military...\"\n\n\"You may not. Boy, I warn you, you would not want to show insubordination in front of a division's soldiers, so you had better not try to defy me either.\" The officer's expression turned feral and unsettling.\n\nThe clerk looked at him in fear, then fumbled to open the gate to let the officer through. \"Please, please follow me... sir.\""
 jap_newflavour.12.a:0 "Barbaric."
 jap_newflavour.13.t:0 "Cry Wolf"
 jap_newflavour.13.d:0 "Scandal: politician disparages the Emperor\n\nAkiyama Yukio, wearing a brown trench coat and dark sunglasses, saunters out of the Diet Building's main gate. He grips his fedora and bounds down the steps. As cameras click and flashbulbs pop, shouts assail him; a barrage of questions and accusations makes the atmosphere awkward. Akiyama offers scattered answers and insults to the boiling journalists. More and more flashes blind him, and he cannot utter a word in the face of his political enemies' accusations.\n\nA microphone is thrust in his face, prompting him to defend his \"crimes.\" Akiyama clears his throat and explains that he was merely criticizing the Army's summary executions in northwestern China, and he elaborates on his support for the legal system of the Emperor's supremacy. Before he finishes, the reporters boo him, accusing him of even more extreme treason. His face darkens further, and he breaks through the crowd of journalists who have insulted him.\n\nThe next day, his face appears in the media, painted as a traitor and opportunist, followed by news of his resignation. His remarks condemning military operations in China have been edited to fit the narrative, with most outlets calling him a threat to the empire. The news is concerning, but it soon removes him from politics entirely, and there is no further discussion of the violence."
 jap_newflavour.13.a:0 "Who cares about the truth?"
 jap_newflavour.14.t:0 "Decadence"
 jap_newflavour.14.d:0 "Fujiwara drew applause from the House of Peers for his remarks on the economic control measures imposed on the populace under the National General Mobilization Law. He bowed and returned to his seat among his colleagues. The Diet Chamber was filled with discussion; Peers debated the matter while civil servants organized documents, made lists, and circulated files on the controversial issue. Dozens of members sat in their seats, some debating the recent session, others discussing their private lives after brief snickers. Fujiwara was among them, turning to discuss the luxury car he had bought the night before at an \"evening entertainment\" with money shared among party members. He thought no one could hear them, and he and his colleagues laughed together over their past pleasures and present wealth. After the laughter, he sniffled — and heard the echo of a microphone reverberating through the room. He immediately looked to the center of the chamber, where the Peers were all staring at him.\n\nFujiwara looked around, his face flushing red with embarrassment. He took a deep breath of dry air and disconnected the microphone under the scrutinizing gaze of dozens of political enemies. He shrank back in his chair; his recently washed car, young women, and expensive wine burned in his mind. His suit clung to him with cold sweat. He turned his gaze to the Speaker of the House of Peers, who stared back with fiery eyes, slowly exhaled, stroked his chin, and remained silent for the rest of the session."
 jap_newflavour.14.a:0 "No turning back."
 jap_newflavour.15.t:0 "A Call from the Hospital"
 jap_newflavour.15.d:0 "Hayashi parked his bicycle in front of his house, a wooden building by the sea. He let the wall support the bike so it wouldn't fall, then took off his glasses from his shirt pocket and looked out at the sea; the sun had already set beyond the horizon.\n\nHe turned on the string of electric lights like a pearl necklace, their glow faint and ethereal. Waves lapped at the gray sand of the shore, and wet driftwood littered the beach.\n\nThrough his lenses, he saw the whole world. What had been blurred color patches and specks became clear. It was a miracle of modern science! He had always thought his eyes were fine until the local doctor told him to get glasses. Getting glasses was an experience, a discovery. Without these two concave lenses, he had never seen the world so clearly.\n\n\"Father?\" a voice called from inside. \"Are you there?\" The doorknob turned, and Takeshi came out, the last ray of sunlight catching his chin. He was a simple young man, working in a dirty market but with a sharp mind. He had won a scholarship! In Tokyo! Mr. Hayashi was proud. This boy would make something of himself one day. \"You're back. What did you catch today?\" Takeshi said with a smile, trying to hide the worry in his eyes.\n\n\"Not much,\" Hayashi said gloomily. \"But it's enough.\" The situation was awkward.\n\nTakeshi stammered: \"Well... Akane's been admitted to the hospital.\"\n\nHayashi's eyes widened. Seventeen-year-old Akane was in the prime of youth, but now she lay in a hospital bed, racked by illness. Hayashi straightened his bicycle and said to his son: \"I won't be home for dinner tonight.\""
 jap_newflavour.15.a:0 "What illness?"
 jap_newflavour.16.t:0 "The Diagnosis"
 jap_newflavour.16.d:0 "\"Mr. Hayashi,\" the doctor said, his voice carrying the same professional concern as his white coat. \"Please come with me into the room; we need to discuss... Akane's condition.\" Hayashi knew this manner well. The military doctor in his old unit had always worn this same tired, resolute expression when delivering bad news. He followed the doctor, glancing out the window at the enormous building blocking his view. This chemical plant was Minamata City's proudest employer, and wastewater pipes were visible leading straight to the coast.\n\nEntering the doctor's office, they sat down face to face. The doctor sat at his desk and took a file from a drawer. Several black-and-white photos spilled from the beige cover. \"I'm quite sure,\" the doctor said. \"You must have seen Akane's symptoms these past few weeks.\" He was referring to slurred speech, unsteady gait, bizarre spasms, and fingers curled like claws.\n\n\"That's right.\" As a father, Hayashi could only give answers that would help his daughter recover, so the doctor could continue working. \"What caused this?\"\n\nAfter a brief pause, the doctor replied: \"See these photos?\" Fingers, weak tendons, twisted limbs. \"Mr. Hayashi, I know you won't be offended by this.\" Hayashi nodded; the doctor was right.\n\n\"All patients with this condition have similar dietary habits: they eat fish or shellfish. Don't take what I say too seriously,\" the doctor stroked his chin. \"But I suspect that factory is suspicious. These are symptoms of heavy metal poisoning. Akane's case is relatively mild, but it would be best if she stopped eating fish from Minamata.\"\n\n\"Are you sure it's all the factory's fault?\"\n\n\"Nine times out of ten.\"\n\nHayashi knew what he had to do next."
 jap_newflavour.16.a:0 "A father's love is everywhere."
 jap_newflavour.17.t:0 "The Gatekeeper"
 jap_newflavour.17.d:0 "For Hayashi, today should have been just another workday. As a fisherman who had left the military, he had no time off. He had to feed Takeshi and Akane, at least until they finished their education. For him, responsibility meant everything — whether for the country or for his children. In the dazzling morning light, the sea breeze blew, and it was time for the factory to open; he stood in front of the gate with local veterans, letting no one in or out.\n\nWhen the police came to dissuade them, they showed the rifles and swords in their hands; time had not dulled these weapons. When the police threatened to force them away, they fired warning shots. As a last resort, the police sent one of Hayashi's friends to talk to him. From a distance, he looked ridiculous; his complexion was not that of someone who worked in the sun, let alone in the early morning.\n\nThe bar owner said to Hayashi: \"Mr. Hayashi, have you gone mad? If you leave now, they won't do anything to you. Mr. Hayashi, you're a veteran; they'll respect you.\"\n\n\"I'm not mad,\" Hayashi said. \"Obviously. The only thing I ask, boys, is a meeting with the officials. The prefectural kind. I need someone to do something,\" he jerked his chin toward the factory. \"This is a monster. That's all. If I can talk to someone, I'll leave immediately.\"\n\nBy noon, the news had spread across the country. By evening, it had even reached Prime Minister Ino's ears."
 jap_newflavour.17.a:0 "Another scandal?"
 jap_newflavour.18.t:0 "The Dilemma"
 jap_newflavour.18.d:0 "Takeda drives Prime Minister Ino to the Diet every day. On the commute, they pass many people walking to work. In Tokyo, wooden buildings are everywhere, but what they can see mostly are the modern stone facades of financial and commercial office buildings.\n\nTakeda asked Ino: \"Sir, how have you decided to handle that...\" Takeda's voice trailed off as he tried to recall the keyword. \"The Minamata veteran? He's all over the news; seems like a big problem.\" The Prime Minister leaned back in the rear seat, lost in thought.\n\nSuddenly, Ino spoke: \"Takeda, I almost forgot about it. Thank you for reminding me.\"\n\nA moment later, Takeda brought it up again. \"Sir, you know, my father was also a veteran, fought in China and other places. If he knew someone was dumping chemicals into his hometown's water supply, he would be just as furious as this man from Minamata.\" He adjusted the rearview mirror and stopped at a traffic light. \"I feel a bit for him, that's all.\"\n\n\"You're not usually this talkative. Do you think he's right?\"\n\n\"No, no, no,\" Takeda stammered. \"I just think what he's doing is understandable. Because I come from a veteran family too.\" He continued in a low voice: \"When I was a child, my father would often wake up screaming. Now he just sits silently under the eaves. There's nothing in his eyes. He feels abandoned by his country.\"\n\nWhen they arrived at the Diet Building, Ino got out of the car and said to his driver:"
 jap_newflavour.18.a:0 "\"That Minamata veteran has a point.\""
 jap_newflavour.18.b:0 "\"Thank you for the advice, Takeda.\""
 jap_newflavour.19.t:0 "The Right Means"
 jap_newflavour.19.d:0 "\"Have you handled it?\" Ino said into the phone. \"I want to see that factory closed tomorrow. If production doesn't resume, there won't be any problems. If I find that veteran still there, there's no more to discuss. I won't protect you in front of the media — you're on your own.\"\n\n\"I understand, Lord Ino.\" On the other end was a notoriously wealthy man who held shares in the Nitto Chemical Company. \"I must say, this is not like you. You have so much power — the Special Higher Police, the Military Police — it would be easier to... handle this discreetly. But I won't say more. Regarding the government's requisition of the Minamata factory, Nitto Chemical is happy to accept compensation.\" The voice paused, as if reaching a key point. \"Lord Ino? When will the money arrive?\"\n\n\"Today, tomorrow, or next week. I don't know. When things calm down, you'll get it. You know how it is, the usual business. Now is not the time to be too careful. There are too many eyes watching me in secret. The media, the independents. Everything here is a mess.\"\n\n\"I admire your judgment, Lord Ino. Forgive me, but my time is limited. I have business to attend to.\" A sigh came through the receiver. \"Goodbye.\""
 jap_newflavour.19.a:0 "Kill two birds with one stone."
 jap_newflavour.20.t:0 "Disappearance"
 jap_newflavour.20.d:0 "The Minamata city government office is a low building, only three stories high, handling all administrative affairs for the city. An official had arranged to meet Hayashi here, promising to help with Akane's illness. Around 7 PM, the air turned bitterly cold. The parking lot was nearly empty, with only a few cars scattered under the utility poles.\n\nHayashi found himself smoking again. He thought he had quit this bad habit long ago. The nicotine made him feel slightly better, but without it, he might feel worse. He would spend his money on chain-smoking. That was why he was in Minamata. Finding an office job in Osaka would kill him faster than lung cancer. At least here, he could forget the war and raise his children. He was proud of them; they took after their mother. Hayashi's thoughts slowly drifted away with the cigarette.\n\nA truck pulled up in front of the city office. Two men got out of the front seats, and another from the back. They all wore work clothes and tweed gloves, holding iron pipes. Hayashi saw them striding toward him. He drew his sword, ready to fight. He did not know who these men were or why they were after him, but he knew he could not retreat without a fight.\n\nBut when they were only fifty meters away, the three men rushed across the sidewalk. With age, Hayashi was not as agile as in his youth; an iron pipe broke his ribs, and he fell. The three men dragged him to the truck and drove off with him."
 jap_newflavour.20.a:0 "Good deeds punished."
 jap_newflavour.21.t:0 "The Hurt"
 jap_newflavour.21.d:0 "Takeshi sat in a chair, holding two letters in his hand. The first was a dismissal letter: the supermarket on the corner refused to employ him further. His father's disappearance and the harsh condemnation from the media had left him and his sick sister in dire straits. Without his father, the small house felt cold and empty. He could not believe his father would suddenly abandon them to join that nest of Red Army fanatics. It was too terrible, too unrealistic.\n\nThe second letter filled him with dread. The envelope bore the seal of the University of Tokyo; Takeshi felt fear in his heart when he saw it. He opened it and began to read. Tears welled in his eyes, then he crumpled the letter and threw it aside. Anger welled up in Takeshi, a surging rage filling his mind. He picked up the textbooks he had studied from and hurled them against the wall, the hollow sound mingling with his intermittent screams.\n\nHe had no strength left to scream. His legs gave way to the ground. His knees trembled, and he sobbed in silence."
 jap_newflavour.21.a:0 "There must be a way — I know it."
 jap_newflavour.22.t:0 "The Fortress Crushed"
 jap_newflavour.22.d:0 "When the corruption of the Ino government was exposed, student protests erupted across Tokyo, with the largest demonstration outside the Diet Building. They waved banners, wore masks, chanted slogans, beat drums and gongs, and jeered Prime Minister Ino in the streets. Photographers danced along the edges of the march, cameras flashing to capture the moments. The umbrellas raised by the demonstrators were dotted with yellow, white, and red. The noise in the streets grew louder. The crowd seemed to have no order at all.\n\nBugles sounded from the west side, drawing the crowd's attention that way. A line of horses stood at the western entrance to the street, followed by a detachment of the Metropolitan Police. They were equipped with bulletproof backpacks, batons, small shields, and other riot gear for dealing with demonstrators. But when the demonstrators turned to face the police, a hush fell over the scene — until the bugles blew again, the horses charged the crowd, and screams erupted in the streets. Violent clashes between law enforcement and demonstrators broke out, and hundreds of unarmed students scattered into the surrounding area to escape the batons and ensuing arrests. Violence and screams filled the district, matched only by the sound of water cannons brought in to further attack the demonstrators. Rows of uniformed police in riot gear marched past the Diet Building with heavy, deliberate steps."
 jap_newflavour.22.a:0 "Nothing to see here."
 jap_newflavour.23.t:0 "The Green Light"
 jap_newflavour.23.d:0 "In a restaurant on a street corner, the clatter of pots and the bubbling of steam waft out. A small woman clutches her handbag tightly as she enters, scanning the chefs as she passes the counter. She enters the kitchen and hands a crumpled wad of bills to the chef, who leads her down a ladder hidden under the floor. She chooses a chair from a circle of seats and takes a book out of her bag. A crude novel about 1920s America. On the scuffed, tear-stained cover, a mutilated title reads: 《The Great Gatsby》.\n\nThe book club discussion proceeds as usual. She sits there, quietly listening to others discuss the significance of Tom Buchanan's character, or the moving rose-colored room described on page ten. As the discussion of Chapter One continues, she keeps staring at her book. She caresses the cover. Are those... eyes?\n\nSomeone casually mentions the green light at the end of the bay, catching her attention. The translation is not clear, but she is certain the green light sits at the bottom of the bay. She raises her voice: \"After thinking about it, I believe this green light represents something.\" She looks around and continues: \"The green light represents both Daisy and the American Dream. Gatsby was originally a poor man; that is why he could not marry Daisy. He began working hard, amassed wealth, but found he still could not marry Daisy. Wealth cannot change his bloodline or his personality; neither Daisy nor the American Dream lie within his reach, hidden at the bottom of the water. This green light represents... that the 'American Dream' does not actually exist, and the idea that anyone can become 'new money' is unrealistic. Even in the 'American Golden Age,' money cannot break culture and tradition.\"\n\nThe book club falls silent. No one has ever put it that way, but they cannot help but connect the American Dream to themselves. That is why they sit here, in a restaurant basement, reading a crude novel. The Emperor has become the master of all Asia, forging a Pan-Asian brotherhood across the Pacific, yet they remain here. Where is the honor? Where is the justice?"
 jap_newflavour.23.a:0 "No different at all."
 jap_newflavour.24.t:0 "Walking to Death in the Twilight"
 jap_newflavour.24.d:0 "The little boy walks through the dim, dirty alleyways of the neighborhood toward a lighthouse that wakes him and his neighbors. Bright light pierces the night sky, and noise roars through the waterways. He runs down the long street, slipping through the community gate with his agile body, and finds himself at a fence. Through the slats, he sees the thunderous revelry in the distance.\n\nThere is a crowd of young men and women there, wearing wrinkled formal wear and short skirts, dancing to the rhythm of the party. The rhythm comes from a band positioned around the estate, stabbing the refreshing mix of traditional Japanese music and jazz into the night sky with their final fury. Crystal-clear pools surround the entire estate, filled with partygoers wearing wet formal wear or completely nude. Around the estate's fence, the boy sees cars carrying the drunken sons and daughters of local kazoku and veterans arriving in an endless stream.\n\nThe boy climbs a tree, gazing at the party's host, who cavorts among the crowd with characteristic charismatic arrogance. The host comes before the chaotic throng and gives the signal for the celebration. Neon-blue fireworks rocket out and explode above the crowd, illuminating the entire sky. The crowd cheers in an almost ethereal atmosphere of hedonism. Confetti flies in the night breeze, scattering across the freshly laid buffet tables and champagne glasses. If the boy had not fainted from hunger, he would surely have been jealous."
 jap_newflavour.24.a:0 "The future is cold and silent."
 jap_newflavour.25.t:0 "On the Black Marble Sea"
 jap_newflavour.25.d:0 "At midnight, waves churn beneath the life raft. Two Army pilots lie together, gazing up at the glittering starfield. Their breathing, exhausted and resentful, comes from bodies little more than skeletons. Only one of them realizes this may be their last moment of consciousness. Even now, they cannot forget the fireball when their plane went down.\n\nThe younger one chokes out his final words: \"Sir, was it worth it? What does it matter?\" He is trembling; if he could, he would weep. \"Will His Majesty the Emperor see us... will he think we are loyal servants of the Empire? Will the officers think so too?\" He unclenches his fists. \"We're just two idiots who died in a storm, that's what they'll say. I've heard it.\"\n\n\"Sir, we don't matter, right?\"\n\n\"We never mattered. Sacrifices are nameless. Even if we get nothing in return, we must continue to love our Emperor. That is what we are doing.\"\n\nThe young man looks at the older one. \"But this isn't a sacrifice, sir... no, it isn't. We never did anything worth doing. If... if we had children, they probably wouldn't even love us. Do you have children?\" The young man's eyes roll back. \"Ueda, please, Ueda, I don't know what to do. I... I'll never see them again. I'll never see them again.\" The young man shivers, exhaling a cold breath. \"Ueda...\"\n\n\"No.\" The older one coughs lightly and turns his head toward the horizon. The young man follows suit. A massive black formation appears on the sea. In his final moments, the young man thinks it is some colossal temple made of black marble, the product of his simple, innocent imagination. But the older one knows better."
 jap_newflavour.25.a:0 "The stars are fated to fall."
 jap_newflavour.41.t:0 "Lost Contact"
 jap_newflavour.41.d:0 "A local fisherman entered New Zealand's territorial waters seeking bigger catches, only to be arrested by the Australian Navy and taken from his boat. The authorities beat and imprisoned him; he was held for several hours against his will. His hands were tied behind his back, and he was pressed against the metal deck of the vessel, screaming in terror.\n\nSailors began interrogating the fisherman, who sobbed and answered in broken Kanak and English. The sailors realized he was no spy and released him back into the northern seas with shame.\n\nHe was not the first, nor would he be the last, victim of the fierce naval confrontations between Pacific powers. Like other innocent inhabitants of the Pacific islands, he suffered too much from disputes that had nothing to do with him."
 jap_newflavour.41.a:0 "Giants and ants."
 jap_newflavour.42.t:0 "Countryman, Consider Your Position"
 jap_newflavour.42.d:0 "Mr. Tamaru was struck across the face and locked in a dark, squalid room at the Los Angeles treaty port garrison. A Japanese-American was beaten and held overnight in an IJN barracks, covered in bruises and with a racked back. Earlier, soldiers had interrogated him in the cell, holding his face up to a buzzing lamp and gripping his fingers to pry answers from his trembling mouth.\n\nTamaru was accused of disloyalty and colluding with the Americans. Exhausted, he was confused: born in California and considering himself an American, how could he possibly be loyal to the Emperor across the Pacific? He tried to defend himself, but was refused, receiving only more humiliation and punishment.\n\nSuddenly, troops burst into the brick cell, grabbed Mr. Tamaru, and threw him out onto the night-shrouded street. He lay by the roadside, unresponsive except for occasional pained groans; the midnight silence left him with nothing but loneliness and painful scars."
 jap_newflavour.42.a:0 "Betrayal, like beauty, is in the eye of the beholder."

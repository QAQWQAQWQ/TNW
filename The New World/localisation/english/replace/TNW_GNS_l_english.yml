 POLITICS_KAULZA_DE_ARRIAGA_DESC:0 ""A good military leader is not made in academies or offices by studying hard, following instructions, and mastering courses — but tempered on the battlefield: you have to learn to kill, and watch him die."" Ever since he first witnessed the Germans' actions in Angola, this saying has been the creed of Commander Kaúlza de Arriaga. Arriaga saw with his own eyes how the Portuguese army — once with titles, honors, status, and reverence — was destroyed by the fast and efficient German army, which took the jewels of the Portuguese empire's crown. The Portuguese government, which could only submit to overbearing Spanish generals and ministers and yield to Spanish rule just to survive, only confirmed Arriaga's conviction.

Commander Kaúlza de Arriaga had a fanatical vision — to build a new type of army, an army free from bureaucracy and unearned promotions, fully devoted to combat rather than politics. Only young volunteers eager to win glory could serve in it, undergoing brutal technical and psychological training for any mission, while also equipped with the most advanced weapons of the day. Arriaga's vision was flatly rejected by the Spanish, but this made him quite popular within the Portuguese army, and earned his idea a small proving ground: the Death's Head Regiment, which drew first blood in the counterinsurgency operations in Algeria.

And then, Arriaga watched as the generals and politicians who had rejected him lost the remnants of the Portuguese empire — the magnificent achievements built by the heroic Portuguese over nearly five centuries vanished in an instant. Arriaga felt he had had enough; he could not sit by and watch Portugal decline. The Death's Head Regiment marched on Lisbon, and the fires of hell followed…"

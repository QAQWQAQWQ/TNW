l_english:
 POLITICS_MOSHOESHOE_II_DESC: "King Moshoeshoe II of the Kingdom of Lesotho, born Constantine Bereng Seeiso, is a descendant of King Moshoeshoe I, the founder of the nation. A graduate of the Roma College in Lesotho, he closely cooperated with the South African government from a young age, just like his predecessor — his stepmother who served as regent after his father's death. After formally ascending the throne in 1960, he achieved full autonomy. To date, he has competently led Lesotho in cooperation with the constitutional government."
 LTH_despotism: "Lesotho"
 LTH_despotism_DEF: "Kingdom of Lesotho"
 LTH_despotism_ADJ: "Basotho"
 LTH_despotism_party: "House of Moshoeshoe"
 LTH_despotism_party_long: "House of Moshoeshoe"
 LTH_Moshoeshoe_II: "Moshoeshoe II"
 LTH_Elias_Phisoana_Ramaema: "Elias Phisoana Ramaema"
 LTH_Justin_Lekhanya: "Justin Lekhanya"
 LTH_south_african_kingdom: "Kingdom of South Africa"
 LTH_south_african_kingdom_desc: "The fortunes of Lesotho have fluctuated wildly in recent years. The kingdom was initially a mere shadow, its so-called independence nothing more than a facade under South African control, and after the rise of the Afrikaner Volkstaat it was even annexed and exploited. Now, with the collapse of the Afrikaner Volkstaat, Lesotho has regained its national sovereignty and is now attempting to rebuild an independent and sovereign state on the ruins of South Africa."
 LTH_strong_anc_influence: "Strong ANC Influence"
 LTH_strong_anc_influence_desc: "After the end of the South African War, the ANC fell apart, fragmented and divided. Many of its most influential and radical members fled to Lesotho, where they found refuge under Moshoeshoe II. Though they may be grateful to the king for protecting them under the tyranny of the Afrikaner Volkstaat, these radicals have now become a source of concern for the king."

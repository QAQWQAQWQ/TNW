 CAM_Norodom_Sihanouk: "Norodom Sihanouk"
 POLITICS_NORODOM_SIHANOUK_DESC: "Twenty-one years have turned. Sihanouk has waited this long to wash away the humiliation of losing the nation, and Cambodia has finally returned to his hands.\n\nAs the only son of the royal family, after the death of his grandfather Sisowath Monivong, the nineteen-year-old Sihanouk was installed by the French as King of Cambodia. Yet Sihanouk had barely warmed the throne before it was all interrupted by Son Ngoc Thanh. This man, obsessed with power, forced Sihanouk to name him chief minister, then crushed Sihanouk's crown to win popular favor.\n\nIn exile, Sihanouk allied with the opposition who had also not received Thanh's favors. He found his opportunity in the civil war, joining the right-wing camp against Thanh and becoming part of the Khmer Issarak led by Prince Norodom Chantaraingsey. Sihanouk's popularity soon eclipsed the prince, and he became the movement's new leader.\n\nSihanouk does not wish to become a powerless figurehead, nor does he wish to restore royal rule. He has adapted to this era, learned the ways of modern governance. It was he who brought stability to the Cambodian people, it was he who bravely ended the civil war, not that fleeing coward Son Ngoc Thanh. Sihanouk will, with his own heart and nature, forge a new Cambodia for tomorrow."
 CAM_Lon_Nol: "Lon Nol"
 POLITICS_LON_NOL_DESC: "President Son Ngoc Thanh was once regarded as a great leader who would revive Cambodia, but as times changed, his true face as a Vietnamese puppet could no longer be hidden. History repeated itself, and Lon Nol could only overthrow this fool and take up the nation's burden.\n\nAs the son of a 'Peace Guardian,' Lon Nol inherited the family tradition, becoming the attack dog of those in power, even willing to contribute to France's colonial enterprise. Later, when the Japanese brought independence to Cambodia, he became the new regime's lapdog at the first opportunity. And when the Republic was born, Lon Nol happily accepted the king's fall, continuing to serve the Khmer nation, rising through the military ranks.\n\nAt the start of the sixties, Lon Nol devoted his energy to rebuilding the military disgraced by the humiliating failure of Operation Issara, gradually establishing control over the armed forces in this difficult process. However, Thanh's groveling before the Vietnamese, sacrificing the Khmer nation for power, undid all Lon Nol's efforts. While Thanh was away visiting Tokyo, Lon Nol seized power.\n\nNow Lon Nol sits in the presidential palace, planning a change of attitude - he will no longer hide his desire to recover lost territory. Khmer people will no longer cower and grovel in fear of spilling the masters' tea.\n\nStand tall, Khmer people!"
 CAM_Son_Ngoc_Thanh: "Son Ngoc Thanh"
 POLITICS_SON_NGOC_THANH_DESC: "In 1949, Prime Minister Son Ngoc Thanh came to Phnom Penh and smashed King Sihanouk's crown to pieces; the Cambodian Republic rose from the fragments of that crown. Thanh faced too many contradictions - he was a republican, yet had to serve a king; he was a Khmer nationalist, yet was educated in France; he admired Japanese governance, yet lived in a French-established kingdom. So many contradictions finally led to his break with Sihanouk. With Japanese approval he became Foreign Minister, used the enthusiasm of the youth to rise to the premiership, and finally smashed the Norodom crown in the chaos of Operation Issara.\n\nThis 'modern King Fa Ngum' was not only popular but also ruthless toward the few dissenters. Having fully taken control of the country, Thanh planned to strengthen the nation, wash away the royal stain upon it, and lead it to a new future. But the compromises made at the end of Operation Issara emboldened some to oppose him. There were moderate voices, and leftist agitation. These sounds lingered over Phnom Penh politics, attempting to establish a new system in Cambodia.\n\nThey will soon learn how fierce Thanh's wrath can be."

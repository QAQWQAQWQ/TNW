 CAM_Dictatorial_Devaraja: "Dictatorial Devaraja"
 CAM_Dictatorial_Devaraja_desc: "§D'I would not hesitate to personally sacrifice it, to guide the nation toward other paths, and help it peacefully complete the revolution it has chosen, without anyone shedding blood.'§!\n§Y- Norodom Sihanouk, 1962§!\n\nUndereducated Buddhists often think the 'Devaraja' means absolute monarchy as the natural order. The true 'Devaraja' means one who conveys the Buddha's teachings. The Norodom family took the Devaraja as their due, and King Sihanouk especially believed in it. They thought their political legitimacy was eternal, growing fat and idle while the people suffered.\n\nSo when Son Ngoc Thanh personally pushed the royal house from the throne, he was welcomed far more than any king before. Thanh took the historical King Fa Ngum as his model, drawing strength and wisdom from his life. Fa Ngum was a brave soldier who overthrew a decadent monarch, restoring order to the motherland. In Thanh's view, Fa Ngum embodied the Devaraja."
 CAM_The_Unloving_Father: "The Unloving Father"
 CAM_The_Unloving_Father_desc: "§D'Many of the Khmer Issarak leaders were Thai; they came to help Cambodia fight the French. Even if they are Thai, they can be excellent Cambodians. They love Cambodia more than Cambodians do.'§!\n§Y- Chamian Kantha-chavana, 1970§!\n\nThe Cambodian Republic was not born on its own; it was shaped by the Thai Republic in its own image. Thailand will not give Cambodia warm milk, only a sharp blade; the newborn Republic must do its best to dodge.\n\nAfter the war, Cambodia lost Battambang and Siem Reap. When Operation Issara began in 1949, Cambodia nearly ceased to exist. These two tragedies made Cambodia Bangkok's servant. Fortunately, the Thai government does not care much for the Khmer people, allowing them some room for freedom."
 CAM_The_North_South_Axis: "The North-South Axis"
 CAM_The_North_South_Axis_desc: "§D'The Khmer race is of noble origin, fearing no death in fighting the enemy, saving the faith, liberating the motherland. The whole race follows the Buddha's teaching that death is better than enslavement and religious persecution.'§!\n§Y- Son Ngoc Minh, 1951§!\n\nThe North-South Axis is a colloquial term for the conflict between various political forces and the government in Phnom Penh. On the left, youth shout loudly, their voices deafening, demanding the return of territory Thailand tore from Cambodia.\n\nOn the right is General Lon Nol's loose faction: the Lower Khmer movement. Their position is to defend the interests of Khmer people living in the Mekong Delta of southern Vietnam, with some supporting an extreme nationalist ideology demanding restoration of rule over the area, as in eighteenth-century Cambodia. The current situation still favors the president; neither left nor right views are mainstream in Cambodian politics yet. However, given time, one view may resurface at the opportune moment."
 CAM_The_Five_Year_Plan: "The Five-Year Plan"
 CAM_The_Five_Year_Plan_desc: "§DWhen stones fell from the building,\nYour Excellency placed them back.\nHis Excellency Kommay, from France,\nCoated them with cement for reinforcement.\nWhere moss obscured the view,\nYour Excellency swept it clean.\n§!§Y- Oknha Sodanbrodej, 1909§!\n\nIeu Koeus and Son Sann serve both the president and the people, and the Five-Year Plan lays the final brick in this great task. It is Cambodia's first economic plan ever, aiming for comprehensive agricultural reform and land redistribution, and building mechanized light industry in Kampot and Takeo provinces. In the future, these two provinces will become national models.\n\nTo make this plan a reality, Japan generously provided financial, managerial, and technical assistance to Ieu Koeus and Son Sann. In the cycle of economic development, such aid is especially precious."
 CAM_Jewel_Of_The_Republic: "Jewel of the Republic"
 CAM_Jewel_Of_The_Republic_desc: "§DFrom that city to every province,\nBridges span every stream,\nGreat and small, hundreds upon hundreds,\nStrong as stone, cars crossing,\nA thousand elephants could tread upon them,\nWithout their falling.§!\n§Y- Oknha San, 1928§!\n\nPhnom Penh, another French colonial experiment, built according to French modernist and avant-garde expressionist tastes, to test which design suited the local city best. The French have been driven home, and now the Japanese flag flies alongside the Republic flag over the city skyline, transforming it into the foremost jewel of Asia.\n\nPhnom Penh is an economic giant of Southeast Asia, with tourists, casinos, brothels, displaying everything modernized. As it develops, Phnom Penh's intellectuals and youth are especially supportive of Son Ngoc Thanh. They are disgusted by the current state of Phnom Penh, wanting to propose ways to eliminate these defects of modernity, growing more radical by the day."
 CAM_Spilling_The_Masters_Tea: "Spilling the Master's Tea"
 CAM_Spilling_The_Masters_Tea_desc: "§D'The Vietnamese bury the Khmer in the earth, leaving only the head above ground, then set a wooden stove over the Khmer's head, boiling water to brew tea for the master. When the victim shakes his head in pain from the heat and suffocation, the Vietnamese executioners tell him: 'Careful, don't spill the master's tea!' '§!\n§Y- Black Book, 1978§!\n\nCambodia does not trust the ethnic Kinh minority within its borders. The government waves the banner of chauvinism and ethnic nationalism while handling Cambodian-Vietnamese relations with subtlety, maintaining friendly relations with the Hue government.\n\nHowever, the current government walks a minefield created by past suspicions. If the Khmer people believe the president does not care, or cannot bring back settlements that belong to the Khmer from their Kinh compatriots, then past suspicions will become deadly poison today."
 CAM_The_Veal_Thom_War: "The Veal Thom War"
 CAM_The_Veal_Thom_War_desc: "Cambodia's northern border with Laos is a mistake. In Ieu Koeus's rural reforms, Prince Norodom Chantaraingsey's connections with Tokyo were key to success. Now, to seize Stung Treng province from Laos, the prince personally led twelve thousand troops there, and chaos ensued: Japanese capital fled, the Indochinese Communist Party intervened, and both the Lao army and Dap Chhuon's rebels mobilized.\n\nIt has proven to be a diplomatic nightmare for the Phnom Penh government."
 CAM_A_Confused_Revolution: "A Confused Revolution"
 CAM_A_Confused_Revolution_desc: "The ideological foundation of Cambodia's newborn revolution is shrouded in fog. Though Son Ngoc Minh and senior cadres firmly believe in communism, revolutionary principles have sharply declined in the ranks.\n\nRather than the vanguard of the working class, the CPK is more of a big tent of patriotic and progressive anti-Japanese elements. For most, independence is already enough; as for how to treat capitalism, debate continues due to Cambodia's backwardness."
 CAM_The_Squabbling_Brothers: "The Squabbling Brothers"
 CAM_The_Squabbling_Brothers_desc: "Officially, Vietnam and Cambodia are now brother nations, united by the spark of socialist revolution. But in reality, relations between the two are far more nuanced.\n\nCambodia's chauvinist attitude toward the Vietnamese has not lessened one bit, and many are increasingly angry at the so-called 'liberators.' Rumor has it the Vietnamese will use this invasion to redraw the border and swallow disputed villages, only further fueling such sentiment. Only time will tell whether the rift between the two nations can be mended in the future."
 CAM_Traditional_Devaraja: "Traditional Devaraja"
 CAM_Traditional_Devaraja_desc: "The concept of the Devaraja has moved beyond the mythical King Fa Ngum, returning to the monarch. Whether Sihanouk himself rejects his royal status is unimportant; what matters is that many Cambodians who support him still see him as king. This creates an interesting phenomenon: Phnom Penh's intellectuals call him president, while rural peasants worship him as a king."
 CAM_Devaraja_Chained: "Devaraja Chained"
 CAM_Devaraja_Chained_desc: "To both Japan and the Cambodian government, President Son Ngoc Thanh has become a troublesome burden, and strong action had to be taken. The once-great warrior was placed under house arrest, and the Cambodian government will continue under moderate leadership. They treat the president as a rubber stamp, occasionally pulling him out as a decorative piece of power.\n\nUntil death comes, Thanh will remain this way. A more reliable figure will take up his mantle, not repeating his mistakes."
 CAM_Dictatorial_Devaraja_Lon_Nol: "Dictatorial Devaraja"
 CAM_Dictatorial_Devaraja_Lon_Nol_desc: "Son Ngoc Thanh, like the ancient King Fa Ngum, deposed Sihanouk. Yet President Thanh failed to preserve the Khmer people's national pride, and he in turn fell at Lon Nol's hands. Lon Nol, who proclaimed himself a field marshal, wears his uniform, loudly declaring he will become the defender of all Khmer. Whether he can achieve what Fa Ngum did remains to be seen."
 CAM_Dictatorial_Devaraja_Lon_Non: "Dictatorial Devaraja"
 CAM_Dictatorial_Devaraja_Lon_Non_desc: "History repeated itself, as Lon Non seized power from his brother. Yet this coup was born not of love for the nation, but of hunger for power. The Thais gave Lon Non this opportunity - the chance to hold sole power - and he gladly took it all.\n\nPeace was not Lon Non's goal; it was merely a side effect of seizing power, but his Thai backers are well satisfied. So long as Lon Non keeps the Khmer people content, his rule will be safe. Otherwise, he will share his brother's fate."
 CAM_Republican_Revolution: "Republican Revolution"
 CAM_Republican_Revolution_desc: "China's republican government shines brilliantly, truly a model for modern Asian society. Yet Cambodia inherited Thai imperialist governance. Its ills are too numerous to list. But under the Republican Revolution led by Hu Nim, all tyranny has come to an end.\n\nThe Republican Youth League takes Wang Jingwei as its model, studying his revolutionary experience in defeating British imperialism in Asia. So long as the revolution endures, Wang Jingwei's light will shine over Cambodia, teaching the Khmer people to improve their governance and lead Khmer into the twentieth century."
 CAM_Bubbling_Northern_Tensions: "Bubbling Northern Tensions"
 CAM_Bubbling_Northern_Tensions_desc: "Once, only a handful of youth centered in Phnom Penh cried out for Thailand to return the territory it cut from Cambodia. Now these youth hold national power, and their voices have been amplified to the national level. The great cause of Khmer national failure can no longer divide them; their eyes are fixed firmly on those Thai imperialists - Cambodia will yield no more.\n\nSoon, they will face a final reckoning..."
 CAM_New_Kampuchean_Revolution: "New Kampuchean Revolution"
 CAM_New_Kampuchean_Revolution_desc: "Cambodia has seen a beautiful dawn, and the great rejuvenation of the Khmer nation has begun. For too long, President Son Ngoc Thanh's future vision has come to nothing in repeated futile compromises. He sacrificed everything and gained nothing. But with martial law, the situation will reverse.\n\nThis is Thanh's method, and also a road to the economic Khmerization of the country. Unlucky foreign enterprises other than Japanese ones are in peril; only by pledging loyalty to the Khmer nation can they avoid disaster. This situation has Cambodia's neighbors on edge, and they are searching for ways to settle the matter."
 CAM_The_Managerial_State: "The Managerial State"
 CAM_The_Managerial_State_desc: "Cambodia's reconstruction is long and tedious, and Cambodian politics lacks talent, so Japan must turn its attention to the civil service to stabilize the country. These politically indifferent commissioners are given powers far beyond their duties, working on the task of planning Cambodia's revival.\n\nIf resources are lacking, they will seek financial support from Japan. In this way, Cambodia will eventually be brought under Japanese management."
 CAM_The_Second_Five_Year_Plan: "The Second Five-Year Plan"
 CAM_The_Second_Five_Year_Plan_desc: "After the previous Five-Year Plan successfully met its goals, the Prime Minister and Son Sann guided the drafting of a new Five-Year Plan. Agricultural reform, land redistribution, and industrial mechanization will expand to Kampong Speu, Kandal, Prey Veng, and Svay Rieng provinces. Japan will generously provide the loans and resources needed to help Cambodia realize this new round of modernization."
 CAM_The_Third_Five_Year_Plan: "The Third Five-Year Plan"
 CAM_The_Third_Five_Year_Plan_desc: "As Cambodia's left-wing political forces continue to grow, a new Five-Year Plan has been put to paper. In the most ambitious plan yet, its architects Khieu Samphan and Yut Xiko expand its scope from the six pilot provinces of the first two plans to the entire nation.\n\nInequality will vanish forever; peasants will own the land they till; the Khmer people will be more united than ever. Though all this must again rely on Japanese loans, soon they will no longer need to. Cambodia will cast off its chains and stand on its own."
 CAM_Expansionist_Pariah: "Expansionist Pariah"
 CAM_Expansionist_Pariah_desc: "In his speeches, Lon Nol makes no secret of his terrifying racism and revanchism. By comparison, even former President Son Ngoc Thanh looks like a dove.\n\nLon Nol repeatedly interrogates the question of the Khmer nation, reminding the people that Vietnamese tyrants occupy Khmer brothers. The Republican Army has massed on the Vietnamese and Thai borders; Cambodia's neighbors must act to deal with this scourge."
 CAM_republican_rev: "Khmer Republican Revolution"
 CAM_new_kampuchean_rev: "New Kampuchean Revolution"
 CAM_Ieu_Koeus_hog_desc: "§YPrime Minister of the Cambodian Republic\nLeft Corporatism§!\n--------------\n§LIf Son Ngoc Thanh is the heart of the Republic, Ieu Koeus is its brain. As early as the Sihanouk period, Ieu Koeus was a respected political figure, a leading member of the National Assembly. At the end of Operation Issara, Ieu Koeus worked the negotiating tables, establishing his lofty position in the postwar Cambodian Republic. Ieu Koeus has many friends and is learned in governance; people admire him even more than Thanh.\n\nSince taking office, Ieu Koeus has worked wholeheartedly to build the motherland, now in his second term. His desk is piled with economic and industrial reports, mixed with credit statements from Japanese and Chinese banks. His task is to use these materials to draft a new five-year economic plan for the Khmer nation.§!"
 CAM_Son_Sann_eco_desc: "§YMinister of Finance\nCorporatism§!\n--------------\n§LSon Sann knows money through and through. Born to a great landowning family, he enjoyed great wealth from birth, studied at Paris HEC, and dealt with money every moment of his life. He served as a civil servant during Operation Issara, and his outstanding ability brought him into the cabinet as Finance Minister.\n\nBesides his financial acumen, he is the bridge between Cambodia and Tokyo; this is his greatest value to Thanh's government. Without his connections, Cambodia would have no capital to implement the Five-Year Plan, nor to rebuild after Operation Issara.§!"
 CAM_Achar_Sok_for_desc: "§YMinister of Foreign Affairs\nSocial Nationalism§!\n--------------\n§LBefore 1947, Achar Sok was an ordinary monk, teaching sacred Pali language at Wat Ounalom. He knew the hardships of the poor, and when Son Ngoc Thanh took power, he saw a chance to ease the poor's suffering. Achar Sok sold his robes, bought a suit, and joined the newborn Khmer Republican People's Association, representing the 'left' of this big tent in Thanh's cabinet.\n\nThough his post is Foreign Minister, Achar Sok still cares about distributing wealth to the poor, often making socialist-tinged statements. If Japan cares about Cambodia, it will not be at ease with Achar Sok's foreign policy. He wants distance from Vietnam and Thailand, and closer ties to Indonesia and Free India.§!"
 CAM_Dap_Chhuon_sec_desc: "§YHead of National Security\nWarlord§!\n--------------\n§LIn Son Ngoc Thanh's cabinet, the post of Defense Minister is currently vacant. Its occupant is in Siem Reap, recuperating by the Tonle Sap. Perhaps it is a good thing the Defense Ministry remains empty; when that man returns, death returns with him.\n\n'Dap Chhuon' is a nom de guerre, but he feels no other name suits him. Chhuon Khempet? That name went into history with the Franco-Thai War. What walked off the battlefield was Dap Chhuon - an anti-French resistance leader, later a petty warlord, seated on a throne made of bones. Son Ngoc Thanh believes maintaining order requires a cruel man like Dap Chhuon. Whether one sees him in person, or how many mountains of corpses he has made, is irrelevant.§!"
 POLITICS_SON_NGOC_THANH_CORP_DESC: "Once, Son Ngoc Thanh was a hero, a legend who uprooted the decadent Norodom dynasty; now, Thanh holds the empty title of 'President' but can do nothing, just like the old 'King,' living a meaningless life. Sometimes he wonders whether, after he is in the ground, Sihanouk will stand over his grave laughing.\n\nIn these solitary days, he has had enough time to reflect on himself, realizing exactly when he set foot on the road to ruin - it all began when he leaned right and appointed Lon Nol Prime Minister. Of course, the left was unhappy; they are never happy, but Thanh never expected they would leave the People's Republican Association, much less turn against him.\n\nAusterity! The left knows nothing else, so it is no surprise the peasants lost control and the agricultural crisis turned bloody. But if leftists taking up arms was not bad enough, that damned prince and his Khmer Issarak joining the fight poured oil on the fire. If he had known, he should have exterminated the royal house root and branch when he had the chance. Now, everyone has their eyes on Phnom Penh.\n\nThey won, at the cost of national pride. Son Sann and the Japanese lackeys seized Thanh as if he was finished, then hurried to Tokyo to grovel. Now Thanh sits alone at home, waiting for them to parade him as an idol, until he loses all value. He has become what he once hated: a useless, idle king."
 POLITICS_SON_NGOC_THANH_REVNAT_DESC: "Too long, Son Ngoc Thanh had to bend to the ideal of compromise. Now, it all ends; Cambodia will become the pure ideal he envisioned, like spotless white snow, no longer manipulated by Laos, Thailand, or Vietnamese conspiracies.\n\nLon Nol, Yuen Simbo and those right-wing Thai lackeys pressed him hard; their murder of Ba Choun was proof of their ambition, but their doom is coming. Over the past decade, Thanh's power has grown, and no past waste-of-space king can match him. The President is ready to catch all opponents off guard.\n\nIn contrast, the left has proven its value to the President. Though their leanings may have issues, they are undoubtedly true patriots; the next generation of national revolutionaries like Khieu Samphan will lead Cambodia to a new era of strength, building the Republic greater on the corpses of the Laotian, Thai, and Vietnamese traitors.\n\nTides of Khmer people look up in awe at their beloved President, each an excellent warrior willing to die for him; Thanh's eyes well with tears as he looks back at the crowd, proud to have helped his nation recover its lost pride... it was he who inspired the next generation to reclaim the lost empire."
 POLITICS_SON_NGOC_THANH_MANSTATE_DESC: "Compromise is the greatest killer of dreams. When he declared martial law, Son Ngoc Thanh thought he had shed it, but unknowingly became a pawn on the Vietnamese chessboard, dragged into another morass. Now, compromise has made him Yuen Simbo's right-wing puppet.\n\nLon Nol's men watch his every move; the de facto president sits alone at home, with ample time to reflect on his mistakes. It seems his downfall began with the failure of the Veal Thom War, when Stung Treng slipped from his hands again. Of course, in the final analysis, this error should be attributed to Operation Issara. If only he had not yielded to Laos's vile demands and Japanese interference, how much better it would have been.\n\nThanh was like a crippled old dog, forced to turn to Vietnam for help. The Vietnamese only take, never give, yet he was so blinded he ignored it. When Geng Wansa denounced him as a traitor to the Khmer nation, he realized he could no longer turn back. Perhaps for a wretch like him, being a puppet is the most fitting fate, even if his master is a villain like Yuen Simbo.\n\nAnd the most important realization from this epiphany is that Son Ngoc Thanh is a fool who lives at others' mercy. He is a coward who abandoned Khmer pride to grovel to a weaker people. When he loses all use value, he will be cast aside and betrayed. Thanh has only one hope now: that one day Cambodia will see a true hero, and show those pests what the Khmer people can really do."
 POLITICS_LON_NON_DESC: "Upstanding Khmer people have left their neighbors frowning, but Lon Non's rise signals the Khmer kneeling again, serving tea to their masters. Perhaps this is Cambodia's optimal solution.\n\nBut who is Lon Non? Most people do not know how to evaluate this figure, labeling him only as Lon Nol's brother and a glutton for power. Yet most of Lon Non's life comes from exactly this. He followed his brother into the army, rising through nepotism and the sycophants at his heels.\n\nWhen Lon Nol became president, Lon Non likewise benefited; merely by being the president's brother, he became a senior government official. Yet Lon Non's hunger for power was not sated. The Thais wanted a more controllable puppet, and offered him an olive branch. The Thais, real power in his hands, dissenters - Lon Non used these resources to seize Cambodia's government.\n\nWith power in hand, President Lon Non prioritized relations with Thailand and Vietnam before domestic affairs. Besides maintaining order, none of Lon Non's governing goals are known; even he does not know what to do next. Ideology outside the arena of power is too alien to him. For Lon Non, as long as he can hold power by any means, that is enough."
 POLITICS_SIM_VAR_DESC: "The walls are covered in bullet holes and bloodstains, and new President Sim Var must draft orders surrounded by them. These presidential decrees will run out of the office to lower officials' hands, guiding them to rebuild the nation. Sim Var truly does not want to be here.\n\nThough Sim Var always harbored great ambitions, he never expected to leap from peasant to supreme leader of Cambodia - such is the absurdity of fate. Driven by fate, his nationalist colleague Son Ngoc Thanh seized power. There were too many obscure men like him, but Sim Var was pushed to the fore. At first he faced a difficult choice, but Sim Var accepted the situation and joined the Khmer Republican People's Association to help his old friend.\n\nAs a reward for long supporting the Khmer nationalist cause, Son Ngoc Thanh gave his friend the plum post of ambassador to Japan. Sim Var combined this work with his government position; as his time in Tokyo grew, he became familiar with the Japanese side. When word came that Phnom Penh had fallen to the Viet Minh, he was in Tokyo negotiating aid.\n\nAfter Japan liberated Cambodia, Sim Var returned home to a Khmer land in ruins. Most senior government officials had been executed, barely one in ten survived. Even though he no longer cared, fate offered him power. Someone had to take up the burden of rebuilding Cambodia: unfortunately, that someone was himself."
 POLITICS_HU_NIM_DESC: "In 1949, Son Ngoc Thanh overthrew the idle Sihanouk, opening the Cambodian Republican Revolution - regrettably, only the first half of this sentence is true. It was not until twenty-one years later that Hu Nim and his followers marched into Phnom Penh as victors, and the second half came true.\n\nHu Nim was born into abject poverty, but education changed his fate of a lifetime of facing the soil. Son Ngoc Thanh's abolition of the monarchy was the catalyst for him to join the revolution; being allowed to study in Nanjing was the most important turning point of his life. There, he learned what true republicanism was from the two revolutionaries Wang Jingwei and Lin Bosheng.\n\nLater, Hu Nim worked his way through Cambodian left-wing political circles, becoming a member of the Khmer Republican People's Association and gaining a seat in the ill-fated Achar Sok government. However, when Son Ngoc Thanh turned right, he refused to implement the austerity and neglect of rural policy and resigned in protest. Soon, resignation became resistance; he and other disaffected youth took up arms, vowing to overthrow the Republican government that had disappointed the people.\n\nBorne on the fanatical support of the Republican Youth League, Hu Nim became the new president; his future... is truly one of a kind. Domestically, Cambodia's land will belong to those who have long tilled it; internationally, he marvels that the Republic of China is the beacon of pan-Asianism, perhaps one day surpassing Japan; on national issues, he reveals... irrepressible rage over Thailand's theft of his motherland's territory."
 POLITICS_SON_NGOC_MINH_DESC: "In Cambodia, no one holds more firmly to revolutionary ideals than Son Ngoc Minh. His dream is not the cliches of his predecessors; he wants a true proletarian revolution, one that will help Cambodia shatter all imperialist chains.\n\nPham Van Huong's father was a Lower Khmer, his mother Vietnamese; he seemed destined to live out his days as a beggar monk, but he was inspired to join the Viet Minh's revolutionary cause. Combining the names Son Ngoc Thanh and Ho Chi Minh, he took the name Son Ngoc Minh. He studied Ho Chi Minh's experience, for Son Ngoc Thanh's nationalist rhetoric had lost its appeal to him.\n\nAfter setting out on his own path, Son Ngoc Minh pressed the accelerator on the Republic's collapse, creating chaos alongside Viet Minh insurgents during the Veal Thom War. Outside Cambodia, Son Ngoc Minh destabilized the Vietnamese regime, paving the way for the Viet Minh's final blow against the collaborators. When Vietnam launched its offensive, he performed the same feat in Cambodia.\n\nSon Ngoc Minh became Cambodia's supreme leader; the empire's chains have been removed, and Indochina's future looks bright. Yet Japan could return; they will not allow such an upheaval in their backyard. If the empire returns, Son Ngoc Minh will go underground again, using his cunning to make Cambodia a nightmare for Japan."

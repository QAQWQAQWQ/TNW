 POLITICS_VU_NGOC_ANH_DESC: "Prime Minister Vũ Ngọc Anh was a career doctor from a Catholic bureaucratic family in northern Nam Định province. He studied in France in his early years and was widely respected for it, having participated in smallpox vaccination campaigns in the Tonkin region. Thanks to his reputation, the government appointed him to the Tonkin House of Representatives between 1930 and 1940, where he worked on the General Council for Economy and Finance. The watershed of his career was his handling of the northern famine: as chief organizer of relief and aid efforts, he became the man most credited with ending it.\n\nAfter Japan forced Vietnam's independence in 1945, his career trajectory changed dramatically. Because he was methodical and compassionate, the Trần Trọng Kim government appointed him Minister of Health and Relief, and he served with distinction. When Trần Trọng Kim resigned in 1952, Trần Văn Chương kept him on and promoted him to Deputy Prime Minister. Dr. Vũ never imagined he would reach such heights. Then, after the failure of the Fourth Offensive, he ascended to the premiership.\n\nIn another time, he would have made an excellent prime minister. He had decades of medical practice and considerable political acumen, which gave him ample room. He was methodical and compassionate; even if the people did not love him, they would not hold it against him. But what is he now? Merely the gatekeeper of the last failed government. Ngô Đình Nhu's Personalism is in the ascendant, the Nationalist Front has abandoned him, and the Viet Minh's revival seems inevitable. His rule is over before it began; the only question is: who will succeed him?"
 POLITICS_BAO_DAI_DESC: "Bảo Đại is a man haunted by contingency: after his father's death, he was groomed from childhood as heir to the throne, and every move of his life has since been carefully designed by others. Even now little has changed, except that the puppet masters now speak Japanese rather than French, and the grain ships sail to Osaka and Nagoya instead of Paris. Vietnam is still crushed under the iron boot of foreigners, and so is he. He cannot change this.\n\nAs emperor, Bảo Đại grew increasingly autocratic in his rule, preferring to bypass his council of advisors. Ironically, those he relied on were more loyal to their Tokyo paymasters than to the Emperor. Most of Vietnam simply ignored his edicts, for the country was already in the grip of discontent and insurgents, just as it had been in the dying days of French rule. Hồ Chí Minh lurked in the shadows, ready to strike; the Japanese waited for the puppet regime to make a wrong move so they could intervene.\n\nIn Bảo Đại's eyes, his present stands in stark contrast to the future that might have been. He dreamed of an independent and powerful empire, but that empire withered under the Japanese advance. His regret is Vietnam's regret, but unlike him, Vietnam has a chance to forge its own path and make it real. Bảo Đại knows that when the wheels of history begin to turn forward, he will be swept away like a cobweb in a dusty hall. It seems he has no choice in the matter."
 POLITICS_TRUONG_TU_ANH_DESC: "Trương Tử Anh, known to those familiar with him as 'Big Brother Phương.' He waited twenty years to reach this position, and this time, he will grip the crown firmly.\n\nBorn in Phú Yên province, nationalism had been in his blood since birth: his father was a respected local notable involved in many nationalist activities, including the Cần Vương movement. Trương Tử Anh would go further than his father; at university in Hanoi, he developed an ideology he called 'vitalist nationalism.' This ideology holds that humans are composed of 'instincts' - egoistic, sexual, and social instincts - which must be strong, stronger than those of other individuals, and whose sources are power, transformation, and cooperation.\n\nUnder this ideology, Trương Tử Anh founded the Greater Vietnam Nationalist Party in 1939. After Japan took Vietnam from the French, he united the Vietnamese Nationalist Party led by Vũ Hồng Khanh and the Greater Vietnam Civic Party led by Nguyễn Tường Tam, forming the present Nationalist Front of Vietnam.\n\nHe cooperated with the Trần Trọng Kim and Trần Văn Chương governments, putting down roots across northern and southern Vietnam and keeping the Personalists in check in the center. The Trần Văn Chương government delegated power to Trương Tử Anh and Ngô Đình Nhu, hoping this would prevent the government's collapse, but to no avail. Then Vũ Ngọc Anh chose to merge the two parties, hoping to reduce inter-party strife, but only widened the rift. Clearly that move failed as well, and Trương Tử Anh has stepped forward.\n\nNow, at last, he has a free hand to spread his 'vitalist nationalism' among the Vietnamese people. He will stop at nothing - whatever the cost, if it makes the nation strong, it is trivial."
 POLITICS_NGO_DINH_DIEM_DESC: "Ten years - a full decade since he was rejected for the premiership - and now, after the greatest crisis in Vietnamese history, Ngô Đình Diệm has finally returned. Diệm's career was built on slow ascent through the bureaucracy. When the Japanese arrived in Indochina, he quickly switched sides against the French and established contacts with the Japanese.\n\nBecause of his pivotal role in founding the Greater Vietnam Restoration Association, he sought refuge from French arrest. Yet before long, the Japanese drove the colonialists out of Vietnam. Though Diệm had performed meritoriously, it was not he who became Prime Minister; in the end, Trần Trọng Kim took the position.\n\nAfter ten years of biding his time, and with the help of his younger brother, Ngô Đình Diệm has reached the pinnacle of his career. The incompetent government has been overthrown, a state of emergency has been declared, and Diệm has a free hand to bring order and justice to Vietnam."
 POLITICS_REPUBLICAN_DIEM_DESC: "For ten years, Ngô Đình Diệm was denied the premiership, and now, after the greatest crisis in Vietnamese history, he has finally returned to sweep away the remnants of French colonialism. He was forced into exile under French pressure and sidelined by Trần Trọng Kim, but he endured. Vietnam has long been led by an incompetent government, mired in chaos, and he has waited long enough.\n\nHis brother Ngô Đình Nhu is determined to carry out a 'social revolution,' sweeping away the Viet Minh and reviving Vietnam. The materialism of capitalism must be set aside; order and justice will return to the nation. The interests of a few may suffer, but Diệm will not compromise on what is necessary for Vietnam until the remnants of the last incompetent government are cleared away.\n\nAfter ten years of preparation, Ngô Đình Diệm has finally taken his first step. As the nation declines, a new democracy will rise from the ruins; nothing will stop the pace of the social revolution."
 POLITICS_NGUYEN_KHANH_DESC: "Nguyễn Khánh was born in the South and raised by his stepmother, a famous Vietnamese stage actress. After Japan drove the colonialists out of Vietnam, Khánh joined the newly formed Vietnamese army and began his military career.\n\nKhánh's rank rose steadily, and he joined the only paratrooper unit at the time, before being sent to a Japanese military academy for further training. In the process, Khánh witnessed everything: Thailand's military operations against Laos and Cambodia, operations against the Viet Minh, and the Viet Minh's desperate counteroffensive of 1960.\n\nNow the nation is in chaos, and Nguyễn Khánh has seized power to confront disorder across the country. Yet every promotion in Khánh's career came precisely because of chaos. Many in Vietnam now pin their hopes on Khánh, praying that his government can end the chaos and instability."
 VIN_idea_viet_minh: "Viet Minh"
 VIN_idea_viet_minh_desc: "Spread any map of the world, and it will show the Empire of Vietnam as a unified country, ruled by a central government in Huế. Yet step into the Vietnamese countryside, and there are no police or patrolling Japanese soldiers - only the armed forces of the Việt Minh, the League for the Independence of Vietnam. Founded to fight for Vietnamese independence against the French in 1941, its target is now the Vietnamese government and the Japanese garrison. Under two charismatic leaders, Hồ Chí Minh and Trường Chinh, the Viet Minh has received massive aid from across the country and abroad, including from the Chinese National Revolutionary Army. Though Viet Minh activity has dwindled since the 1950s, they are biding their time, waiting for the moment when the government's power falters to launch what they call their §R'revolution'§!..."
 VIN_idea_imagined_independence: "Illusion of Independence"
 VIN_idea_imagined_independence_desc: "As a fruit of the Greater East Asia War, Vietnam has been liberated from the French yoke. But in truth, a European master has merely been replaced by an Asian one. We cannot manage our own economy, command our own army, and even our internal affairs are under Japanese control. Japanese cultural influence grows by the day, even more so than the French. The Japanese have simply replaced the French in every respect. Some diligent scholars have found that the structure of the French-ruled Indochinese Federation was, in theory, never actually dissolved..."
 VIN_idea_the_faltering_establishment: "The Faltering Establishment"
 VIN_idea_the_faltering_establishment_desc: "After the Greater East Asia War, Tokyo appointed technocrats from the Nationalist Front of Vietnam to rule the country, expecting them to discharge their duties faithfully. Yet in 1961, with the failure of Operation Four, the 38th Army and the Trần Văn Chương government began blaming each other, exposing the most unstable side of the Vietnamese imperial system. Then former Prime Minister Trần Văn Chương resigned, and Health Minister Vũ Ngọc Anh became interim prime minister, but his government lacks broad support from the Nationalist Front. The Vietnamese government is rife with internal strife, with everyone hoping to succeed Vũ Ngọc Anh, while the Viet Minh stirs..."
 VIN_idea_a_new_phase: "A New Phase"
 VIN_idea_a_new_phase_desc: "Since launching Operation Minh Hiệu to overthrow the French colonialists in 1947, defense reform has been the top political issue for every Vietnamese government. In the 1950s, as the Viet Minh threat receded, Japan began obstructing military reform. But after the disastrous failure of Operation Four in 1961, Governor-General Tsuchihashi Yusai finally relented and allowed us to expand our armed forces on an experimental basis. The government must be cautious in decoupling from Japan, lest they cut off their generous aid."
 VIN_widespread_opposition: "Widespread Opposition"
 VIN_widespread_opposition_desc: "Contrary to the plotters' expectations, the people have not only clearly opposed the coup, but have no interest in autocracy either. Protests against the coup have swept across Vietnam, and large numbers of people have defected directly to the Viet Minh. Besides the popular outcry, the Japanese legation has taken a wary stance toward the coup. The Prince must act quickly to regain Japanese support and calm public sentiment."
 VIN_the_personalist_revolution: "The Personalist Revolution"
 VIN_the_personalist_revolution_desc: "Ngô Đình Nhu is the chief theorist of the Cần Lao Party, pursuing a 'social revolution' to counter the Viet Minh's communist revolution. Inspired by movements in Thailand and Japan, his government will carry out a thorough reorganization of society. The existing scouting movement will be reorganized into a revolutionary youth organization, women will be mobilized, and so on. Yet troubling reports have come from the north: intimidation and violence abound, including organized massacres and abuses of suspected Viet Minh sympathizers..."
 VIN_Bao_Dai_hog_desc: "§YEmperor of Vietnam\nPaternalistic Conservatism§!\n--------------\n§LThe Emperor of Vietnam is a renowned luxuriant wastrel. Though he was the face of the Vietnamese state at home and abroad, he does not govern. Instead, whenever official duties do not bother him, he retreats to the Imperial Citadel, spending his days in luxurious idleness. Though the people and the political establishment loathe him, he fits the purpose that Japan had laid out for him. Compliant and easily cowed, what little patriotic sentiment that the Emperor of Vietnam has did not matter.\n\nThese are the last days of the Empire, and Bao Dai knows it. Prominent nationalists have spoken out against the monarchy, becoming staunch republicans in the face of Bao Dai's sumptuous apathy. The Viet Minh - the less said, the better. The Imperial Citadel was a pebble in the proceedings of fate: to be washed away in the onrush of great change.§!"
 VIN_Vu_Van_Mau_for_desc: "§YMinister of Foreign Affairs\nPaternalistic Conservatism§!\n--------------\n§LVu Van Mau has kept a relatively low profile as Minister of Foreign Affairs. After all, given Japan's relationship with Vietnam, such work is often seen as unnecessary. However they are wrong.\n\nIn fact, out of all the members of the cabinet, Vu Van Mau has likely done the most work to ensure Vietnam stays afloat. It is his frequent visits to Tokyo that guarantees a steady supply of arms, advisors, and supplies make their way to the depots of Haiphong. Without his 'unnecessary' work, Vietnam would surely fall to ruin.§!"
 VIN_Tran_Van_Van_eco_desc: "§YMinister of Finance\nPaternalistic Conservatism§!\n--------------\n§LTran Van Van is a prominent businessman from the South, having founded the first steel casting factory in Vietnam. When the Japanese liberated Vietnam from the shackles of French colonialism, Tren Van Van was invited to Thuan Hoa to work in the Ministry of Finance under Ho Ta Khanh.\n\nOver the next decade, Tran Van Van would come to fall in with the reformists of the National Front of Vietnam, such as Tran Van Huong, or Nguyen Luu Vien. Having risen to the position of Minister of Finance, Tran Van Van now represents the National Front, despite not officially being a member of it.§!"
 VIN_Ngo_Dinh_Nhu_sec_desc: "§YMinister of Interior\nRevolutionary Nationalism§!\n--------------\n§LIf you ask a Vietnamese political expert who the most-connected man in Vietnamese politics is, the answer will always be \"Ngô Đình Nhu\". A former library archivist and a devout - many would say too devout - Roman Catholic, Ngô Đình Nhu is the ideologue of the Cần Lao (Personalist Labour) Party. He first entered the Imperial Government by being appointed Minister of Interior under Trần Văn Chưong, his father-in-law. But despite his relative experience, he is widely disliked within the government, partly because of his strange ideology: Personalism.\n\nBasing his views on the writings of theologian Emmanuel Mounier, Nhu insists on the need for a social revolution to sweep away the Việt Minh's advocated communist revolution. Despite this anti-government position, the government retains his service for fear of his paramilitaries, which are fully capable of causing chaos in the Vietnamese midlands. So long as the government can weather this rough patch, they can prevent Personalist influence from spreading further.§!"

 VIN_Hoang_Minh_Giam: "Hoàng Minh Giám"
 POLITICS_HOANG_MINH_GIAM_DESC: "Which is braver: fighting bravely for one's convictions to the death, or being forced to hide one's true self and bow to the enemy? Most praise the former, but Hoàng Minh Giám is one of the few who defends the latter.\n\nBorn into the imperial nobility, Hoàng Minh Giám first served the Nguyễn dynasty court, then emerged as a pioneer of Vietnam's Westernization, carrying on the Reforms. While studying at Indochina University, he was branded a subversive by the French secret police, which only pushed him deeper into nationalist dissent.\n\nVietnam had just driven out the French colonialists, only to be oppressed by the Japanese masters. Hoàng Minh Giám wanted to join the Viet Minh, but ultimately decided he was better suited to infiltrating the enemy. He rose through the ranks, climbing the collaborationist government until he witnessed its collapse. He joined the Viet Minh as a national independence hero, only to see his homeland fall under the Japanese boot a second time.\n\nHoàng Minh Giám once advocated a moderate line toward Japan, but few listened to him, leading to Vietnam's renewed invasion and everyone's suffering. Seeing the tide turn, he defected once more, claiming his earlier joining of the Viet Minh had been a matter of circumstance. The Japanese believed his lies and, with no other option, appointed Hoàng Minh Giám to rule the ruined Vietnam.\n\nHe remains here still, a hollow smile on his face, masking a deep longing for the freedom and hope he has lost."
 VIN.12.t: "Rule Again"
 VIN.12.d: "Red cast over Saigon, banners cascading to the streets, touching the feverish celebrants of today's revolution. Portraits of President Truong Chinh and Uncle Ho marched along the streets, symbols of triumph over the reactionary. In backrooms, plans were made — dreams of liberation — a future for freedom over imperialism.\n\nIn Tokyo, another plan was made.\n\nDeclaration after declaration proclaimed contempt and disgust for the communist beast that sunk its teeth into an independent country, tearing apart Pan-Asian peace for tyranny. Each and every Diet member — previously divided by problems insignificant in comparison — stood together as one body united in preserving Imperial hegemony.\n\nThe teeth gnashing ceased to allow the Minister of War to present the solution. Delivered with a banal grace, the plan detailed the eradication of communist influence in Indochina. It began with the restoration of order to Vietnam, a territory plagued by the Viet Minh pest, allowed to exist only thanks to an indifference that would soon be ruthlessly shed.\n\nFrom there, other territories in danger or already afflicted by communist menace were to be \"stabilized\", the intricacies of which left vague to allow the IJA a freehand in their operations. No politician was prepared to stand in their way — no cost was too great — no tears were to be shed for the cost of justice.\n\nThe vote passed unanimously.\n\nLater that day, a phone rang, answered by Prime Minister [JAP.GetLeader]. He listened attentively, before responding..."
 VIN.12.a: "'Let justice be served.'"
 VIN.12.b: "'No, we have other things to do.'"

 POLITICS_HO_CHI_MINH_DESC: "The man known to the world as Hồ Chí Minh also goes by 'Nguyễn Sinh Cung' and 'Uncle Ho,' along with fifty or two hundred other pen names. Beyond being born in central Vietnam in 1890 and trained in Marxist politics in France and Russia, almost nothing is known of his private life. Yet all Vietnamese - even his enemies - know him as a gifted poet fluent in many languages, whose poetry written in classical Chinese and romanized Vietnamese can be read and enjoyed by nearly every Vietnamese.\n\nYet after more than twenty years of struggle, people know him better now. First the struggle against France, then against Vichy France, finally against Japan - Hồ Chí Minh knows well that all are one and the same imperialism. However desperate the situation, he will never raise his hands in surrender. Hồ Chí Minh has carved out a liberated zone in northern Vietnam and sent underground operatives across the country. By now he is not merely a leader but a nightmare for both the Japanese and Vietnamese governments, a man wrapped in endless mystery. To his enemies, he is like a hero out of legend.\n\nBut Hồ Chí Minh is old, and even as Japan's grip on Asia weakens, he knows his time is near; he may never live to see Vietnam stand proud as an independent nation in Southeast Asia. Uncle Ho is a household name across Vietnam, beloved by all. But after he is gone, who will the people follow?"
 POLITICS_TRUONG_CHINH_DESC: "In 1907, the man who calls himself Trường Chinh was born in the Red River Delta not far from Hanoi; back then his name was Đặng Xuân Khu. Over twenty-nine years, he first embraced socialism, then communism, following Hồ Chí Minh. He took his present name - 'Long March' in Vietnamese - to commemorate the twenty-thousand-li Long March waged by the Chinese Red Army. The March was initiated and led by Mao Zedong, who would later die in the flames of the War of Resistance against Japan.\n\nNow Hồ Chí Minh is dead, and Vietnam has temporarily defeated the Japanese invaders. Hồ Chí Minh's successor is none other than Trường Chinh, proudly called by Vietnamese communists 'Uncle Ho's best student.' His revolutionary record is impeccable; his loyalty to Vietnam and the Party beyond question. Trường Chinh is no blind worshipper of Hồ Chí Minh, yet he has always taken pride in devoting himself to Uncle Ho's ideals.\n\nNow the Party and the nation swear allegiance to Trường Chinh. With full state power in his hands, Trường Chinh can advance the ideological program he has long contemplated, slightly divergent from the established path: a sweeping land reform. Drawing inspiration from Mao Zedong's writings and the Bolshevik interpretation of anti-colonialism, he is now determined.\n\nWhatever his plans, Trường Chinh will make Uncle Ho proud. He swears it on his honor, on his loyalty to the revolution and to Vietnam."
 VIC_20_years_of_resistance: "Twenty Years of Resistance"
 VIC_20_years_of_resistance_desc: "The Viet Minh has held out here for nearly twenty years, and throughout those two decades it has cemented its position as Vietnam's foremost anti-Japanese resistance organization. It survived the most ferocious onslaughts of Japan's war machine, rising again after every retreat and avoiding the fate of its Chinese comrades. For twenty years, the Viet Minh has repelled every Japanese offensive, weathered Thai atrocities, and maintained an undeniable presence in Indochina. So long as imperialists and reactionaries continue to poison every inch of the Indochinese peninsula, the Viet Minh will not cease fighting - not even if it takes another twenty years."
 VIC_comrades_from_the_north: "Comrades from the North"
 VIC_comrades_from_the_north_desc: "Though China has been utterly defeated by Japan, many Chinese have not given up the fight against the Japanese. Remnants of the National Revolutionary Army, especially the Communist-led New Fourth Army and Eighth Route Army, marched south across Yunnan and Guangxi into Vietnam and made contact with the Viet Minh. The Viet Minh welcomed these exiles, for they brought desperately needed expertise and soldiers to continue the struggle. Yet for all the fruitful cooperation, everyone can foresee that the day these exiles return home will soon end this alliance..."
 VIC_victory_in_lang_son: "Victory at Lạng Sơn"
 VIC_victory_in_lang_son_desc: "Planned by Võ Nguyên Giáp with assistance from Ye Jianying, the Viet Minh launched the Summer-Autumn Border Campaign, winning its first offensive victory against the Japanese. In just a few weeks, Viet Minh units defeated the 5th Division of the 38th Army and seized Lạng Sơn, forcing the Japanese to retreat to Hồng Gai. This unexpected victory caught Japan off guard and shook the Vietnamese public, who now turned against the imperial government for its inability to handle the crisis. As the government disintegrates, the Viet Minh accelerates its expansion, continuing its struggle against both the Japanese and Vietnamese empires."

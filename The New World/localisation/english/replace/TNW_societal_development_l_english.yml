l_english:
 societal_development.1102.t:0 "Administrative Efficiency Improved"
 societal_development.1102.desc:0 "Over the past few months, a whirlwind of reform has swept through our state apparatus. Communication between government agencies and departments at all levels is now highly efficient. From the mass promotions the bureaucracy so eagerly embraces to some unheard-of unconventional methods used to suppress departments that resist the will of the leadership, the ship of state sails smoothly forward, leaving the shadows of corruption and incompetence behind.\n\nOur outlook is now excellent; laws, regulations, and government plans are being rigorously enforced. The current momentum means a more capable government, better at putting law into practice and more skilled at managing our people, is on the way."
 societal_development.1102.a:0 "After all, we live in an age that needs to be governed!"
 societal_development.1103.t:0 "Administrative Efficiency Declined"
 societal_development.1103.desc:0 "In modern society, bureaucrats are an indispensable part of government. But reality chose to remind us of this in the worst possible way. Our government offices seem caught in a temporal trap, drifting toward stagnation. Corruption, fraud, and personal grievances have taken deep root in the administration; these days, when dealing with government workers, money makes the mare go, and without it you cannot move a single step.\n\nWe can take measures to cleanse the administration. Implement reforms, or amputate boldly with the resolve of a surgeon. If not, the government's position may totter - one day, our decaying political machine will run out of the slush funds that lubricate its joints, and then the sky will fall."
 societal_development.1103.a:0 "'That's bad news... here's your share anyway.'"
 societal_development.1104.t:0 "Education Level Rose"
 societal_development.1104.desc:0 "The foundation of society is its writing. It cannot be overstated how the institutions that define civic life rest upon the written word. Social progress advances hand in hand with the literature of the age. Society rises and falls on the tide of writing. When rites collapse, she sleeps; when a curious young person decides to scratch something onto a palm leaf, she awakens. Writing is the progenitor of freedom, but it can also bring about freedom's end. Our schooling and our culture matter more than anything else. When they die, progress does not merely stop - it dies of its own accord. No ideal progress, whether racial purity, the free market, or equality for all, can do without the pen in hand. Yes, our universities have expanded. But today some people have just learned how to read, opening Pandora's box of writing."
 societal_development.1104.a:0 "This is worth celebrating."
 societal_development.1105.t:0 "Education Level Fell"
 societal_development.1105.desc:0 "People have found that all dead civilizations shared a common evolution. Most will blame it on the collapse of agriculture, or population decline, or even the fall of monarchs and the revolt of the people. Yet these are surface symptoms. When civilization dies, one thing seems to vanish and erase its tracks from the map.\n\nWriting carries meaning. Clay tablets, scrolls, and books - the guardians of civilization - cease to be printed or produced. The reason is obvious, and whatever people may think, a vicious cycle begins: in hard times, the elite stop founding schools or neglect rites. When rites collapse, the allusions gathered from words disappear. The common people will not know how to farm, will treat spirits lightly, and will not even know why they honor their superiors. It is this terrible beginning that the Romans, the Maya, the Hittites, and even empires of today have found themselves facing as they crumble."
 societal_development.1105.a:0 "When rites collapse, the nation's ruin begins."
 societal_development.1106.t:0 "Research Facility Level Rose"
 societal_development.1106.desc:0 "Money flows in, and the scientists are delighted! R&D budgets have soared, we have built new research facilities, and renovated our old laboratories. This not only ensures safety during work but also allows storage of more dangerous materials, ensuring a greater volume of scientific work gets done. Whether private or public, military or civilian, new technologies are steadily being developed. Of course, the fruits of research are not only for scientists; all citizens enjoy them, and new industrial techniques and other scientific dividends will keep the economy running!"
 societal_development.1106.a:0 "In the end, we will all go back to school..."
 societal_development.1107.t:0 "Research Facility Level Fell"
 societal_development.1107.desc:0 "Laboratories are the backbone of any nation's research capacity. Without complex laboratories, scientists cannot study new robots, guns, aircraft, computers, or medicines. Yet they also require enormous funding. An unchangeable fact stands: pouring vast sums into projects that show no return in the short term affects the nation's priority projects. Due to political corruption and economic recession, our country cannot provide sufficient funding for laboratories, and our research capacity will decline significantly, perhaps lasting for years."
 societal_development.1107.a:0 "Tragic. Now, what about new housing construction?"
 societal_development.1108.t:0 "Healthcare Level Rose"
 societal_development.1108.desc:0 "As the saying goes: the measure of any society is how it treats its weakest members. And that is seen in the level of healthcare it provides its citizens. Saving lives is not merely a humanitarian measure; the better the healthcare, the less likely the injured or sick are to suffer permanent aftereffects, and the faster they return to social production.\n\nOur healthcare has improved greatly recently. There are more medical staff in hospitals, medical knowledge keeps growing, and diseases once incurable can now be treated. This will also have a positive effect on our country; after all, the healthier the people, the happier their lives, and the harder they work."
 societal_development.1108.a:0 "I feel much better!"
 societal_development.1109.t:0 "Healthcare Level Fell"
 societal_development.1109.desc:0 "Long queues in hospitals, patients lying on cots in the hallways, surgeries ending in patient deaths, pharmacies without even basic medicines. All of this shows our healthcare system has failed badly. Yet the consequences are far more severe than they appear, because reduced healthcare raises mortality, and those who survive by luck may end up permanently disabled, though their illness might have been treatable. In short, the number of people capable of working shrinks, and every sector of society suffers from reduced productivity. These are the real consequences of a deteriorating healthcare system."
 societal_development.1109.a:0 "I spent a fortune just to get treated, seriously!"
 societal_development.1110.t:0 "Industrial Expertise Level Rose"
 societal_development.1110.desc:0 "New training programs are producing wave after wave of skilled labor and management, making industrial workplaces more precise, efficient, and intelligent. New technology and equipment matter, but they will never matter more than the human factor, driven by practice and education. With investment in worker safety programs and encouragement of national vocational initiatives, new training programs push our workers toward substantive, perfect industrial efficiency. The moment they step through the factory gate, they transform into the finest working machines. That is our goal."
 societal_development.1110.a:0 "Excellent!"
 societal_development.1111.t:0 "Industrial Expertise Level Fell"
 societal_development.1111.desc:0 "Yesterday, a man died. Not by murder, nor from a terrible disease. He died in the place where he spent most of his waking hours, stamping trademarks on poorly made mugs. A misplaced pneumatic tube suddenly exploded, and nails and screws from the conveyor belt shot across the factory in the violent blast; he died on the spot. His family mourned the upheaval, and the factory offered a half-hearted apology. Life went on.\n\nThese are the consequences of declining industrial expertise. Products get worse, production slows, and life gets worse. The government neglected the people it serves, pouring money into disaster relief, new housing, or merely the bottomless black hole of corruption. There will be consequences."
 societal_development.1111.a:0 "A disgrace."
 societal_development.1112.t:0 "Industrial Equipment Level Rose"
 societal_development.1112.desc:0 "The economy runs well, and industrial reform driven by heavy subsidies is modernizing industrial production equipment across the nation! Products are now made faster and cheaper. In an industrial world that once stagnated, further mechanization is good news for both workers and managers! No more dreadfully long shifts, no more defective screws turned by hand. Industry strides forward!\n\nYet this is a long process. Increased budgets and our renewed focus on industrial production provide broad support for the much-needed technological renewal of our industrial equipment."
 societal_development.1112.a:0 "What shall we build now?"
 societal_development.1113.t:0 "Industrial Equipment Level Fell"
 societal_development.1113.desc:0 "In some large factory somewhere, a rolling mill's electric motor fails. It is not the fault of workers or installers, merely equipment worn out by age. After years of managerial neglect and lack of funding, the factory is rusted inside. Still, this is no great problem. A worker reports it to the manager, the manager calls a repairman, the repairman swaps in a small motor, and hours later the workers are back at their posts.\n\nOf course, one example of industrial decrepitude will not plunge everyone into economic trouble. What causes this result is the long-term neglect of thousands of pieces of industrial equipment. Across the country, equipment breaks down every day but is not properly repaired, or is replaced by older, simpler products. In the end, our nation's industrial level will surely be far worse than before."
 societal_development.1113.a:0 "A disgrace."
 societal_development.1114.t:0 "Agricultural Technology Level Rose"
 societal_development.1114.desc:0 "Without food, people will not work. Without people working, the government ceases to exist, and the bureaucracy that keeps the government running vanishes within weeks. Yet the converse is also true: the more abundant and varied the food, the more complex the state structure. After all, the earliest states formed alongside the development of agriculture.\n\nAgricultural innovation will relieve the backbreaking labor of farming in the fields, shifting workload to mechanized equipment like tractors and automated harvesters. The development of fertilizers will make crops grow faster and cheaper. Humans will have food, and more of it."
 societal_development.1114.a:0 "Thank you for the bread."
 societal_development.1115.t:0 "Agricultural Technology Level Fell"
 societal_development.1115.desc:0 "In the past, those who could predict the moon's movements and the change of seasons held supreme spiritual authority. Priests with detailed mathematical tables predicted when rivers would flood and when crops would ripen. This was ultimate power, the power to control (or at least judge) the world around them. The ancient priests have been replaced by programmed lunar calendars, schedules, and simple calculators. We need only look at the wall calendar to judge when the wheat can be harvested.\n\nYet this does not mean agricultural methods are foolproof in this new world of printed materials. When farmers do not receive the latest information about the harvest, or use inefficient land management methods, crop failures result. And with crop failure, the entire economy suffers. Basic commodity prices rise, and people either receive food stamps or simply starve. This is what is happening today - inefficiency in water use, land management, and seed use has left the nation's agricultural foundation teetering, impoverishing the whole country."
 societal_development.1115.a:0 "A disgrace."
 societal_development.1116.t:0 "Army Professionalism Level Rose"
 societal_development.1116.desc:0 "'Yes, sir!'\n\nThose three words may be the ultimate lesson in military theory. An army is made not by the quality of guns and armaments, but by discipline. The person who can give their life for a single order is the unbeatable winner on the battlefield. In a world obsessed with the arms race, we often forget a simple fact: without these three words, the army cannot function. Fortunately, anti-corruption procedures in the military and the newly built recruit training camps have helped our forces take another step toward the ultimate goal of Spartan valor. Our soldiers will no longer defect, nor will they serve politicians. They will obey their generals' orders, without reserve."
 societal_development.1116.a:0 "Excellent!"
 societal_development.1117.t:0 "Army Professionalism Level Fell"
 societal_development.1117.desc:0 "Scandals seem to erupt frequently in the military. Sometimes a battalion of soldiers drains crates of spirits and drunkenly spills military secrets. Sometimes a general sends his men somewhere that happens to benefit a wealthy politician or lobby group. Sometimes it is smaller-scale popular revolts.\n\nThese scandals are not the problem; the problem is that they keep happening, more and more. This is no longer a rare exception but has become a state of the army. Undoubtedly, the declining priority of our military and lax oversight of those who hold power have caused these problems."
 societal_development.1117.a:0 "A disgrace."

 ITA_Vincenzo_Trentino:0 "Vincenzo Trentino"
 POLITICS_VINCENZO_TRENTION_DESC:0 "For her torment shall come upon her in one day: death, mourning, and famine; she shall be consumed by fire, for mighty is the Lord God who judges her.`nWhen you see Jerusalem surrounded by armies, you know that her desolation is at hand... this is the day of vengeance, that all things written may be fulfilled.`nDo you see these buildings? I tell you the truth: not one stone will be left on another, but all will be torn down.`n`nThen a mighty angel picked up a stone like a great millstone and threw it into the sea, saying: With such violence the great city of Babylon shall be thrown down, never to be seen again. Salvation, glory, and power belong to our God! His judgments are true and just; he has condemned the great prostitute who corrupted the earth with her fornication, and he has avenged the blood of his servants at her hand."
 ITA_Pino_Rauti:0 "Pino Rauti"
 ITA_Silvio_Berlusconi:0 "Silvio Berlusconi"
 ITA_Salvo_Lima:0 "Salvo Lima"
 ITA_Luca_Romagnoli:0 "Luca Romagnoli"
 ITA_Pino_Rauti_hog_desc:0 "§YDeputy Prime Minister of the Council`nSansepolcrism§!`n--------------`n`nBefore that day, the rebellion will come, and the lawless one will be revealed, the son of destruction. He is the adversary, exalting himself above every so-called god... even sitting in God's temple, claiming to be God.`n`nThe coming of the lawless one is by the activity of Satan, with all power and false signs and wonders, and with all wicked deception for those who are perishing. For false christs and false prophets will arise and perform great signs and wonders, so as to lead astray, if possible, even the elect.`n`nAnd then the lawless one will be revealed, and the Lord Jesus will kill him with the breath of his mouth and bring him to nothing by the appearance of his coming."
 ITA_Silvio_Berlusconi_for_desc:0 "§YForeign Minister`nChristian Democracy§!`n--------------`n`nThe merchants of the earth weep and mourn for her, since no one buys their cargo anymore — cargo of gold, silver, jewels, pearls, fine linen, purple cloth, silk, scarlet cloth, all kinds of scented wood, all kinds of ivory...`nThe merchants who sold these things and grew rich from her will stand far off, frightened at her torment, weeping and mourning. You who exported goods, making many nations rich; you enriched the kings of the earth with your vast wealth, and made the coastal peoples prosperous. All who sail the sea were appalled at you; you made them tremble. You have come to a dreadful end and shall never exist again. Tyre trusted in her wealth and fell through pride.`n`nListen to this, you who trample on the needy and seek to remove the poor of the land, saying: When will the new moon be over so we may sell grain? And the Sabbath, so we may offer wheat for sale? You make the ephah small and the shekel great, and deal deceitfully with false balances; you buy the poor for silver and the needy for a pair of sandals, and sell the chaff of the wheat...`n`nA false balance is an abomination to the Lord, but an accurate weight is his delight."
 ITA_Salvo_Lima_eco_desc:0 "§YFinance Minister`nChristian Progressivism§!`n--------------`n`nYou adulterous people! Do you not know that friendship with the world is enmity with God? Therefore whoever wishes to be a friend of the world makes himself an enemy of God. Do not be yoked together with unbelievers... What accord has Christ with Belial? No one can serve two masters... You cannot serve both God and Mammon.`n`nWe are no longer children, tossed back and forth by the winds of doctrine. The double-minded man is unstable in all his ways. Sinners, cleanse your hands; you double-minded, purify your hearts. How long will you go on with divided hearts?"
 ITA_Luca_Romagnoli_sec_desc:0 "§YInterior Minister`nRight-Wing Populism§!`n--------------`n`nYou were like sheep gone astray, but now you have returned to the Shepherd and Guardian of your souls.`n`nMy brothers, if anyone among you wanders from the truth and someone brings him back, that person saves a soul from death and covers a multitude of sins. Which of you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the wilderness and go after the lost one until he finds it? And when he finds it, he joyfully puts it on his shoulders and goes home. Then he calls his friends and neighbors together and says: Rejoice with me, for I have found my lost sheep! I tell you: in the same way, there will be more joy in heaven over one sinner who repents than over ninety-nine righteous persons who need no repentance.`n`nWe all like sheep have gone astray, each has turned to his own way; and the Lord has laid on him the iniquity of us all."

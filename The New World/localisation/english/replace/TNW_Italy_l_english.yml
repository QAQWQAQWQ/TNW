 ITA_The_Sly_Fox_and_the_Wolf_Pack:0 "The Sly Fox and the Wolf Pack"
 ITA_The_Sly_Fox_and_the_Wolf_Pack_desc:0 "Beneath the court, in the streets, the year 2002, the 81st year of the Fascist Era. The warships of the Italian Empire still cleave through the Mediterranean. When the winds calm, the world may remember the leader who ruled the empire for over two decades.`n`nHis death came slowly. Years of illness had already eroded his body, and the icon collapsed so suddenly. Sly foxes ran rampant at home, wolf packs circled within the National Alliance, countless eyes had stared at him. Now the stared one was dead, and the political forces he had suppressed in life surged like floodgates opening — from the youth league to the party, from mainland Italy to overseas territories, political infighting swept the entire empire like a plague. Decrees changed by day, cabinets turned like a carousel, royalists and orthodox fascists fought endlessly. The empire welcomed an economic boom in this chaos, then plummeted after a brief prosperity. The royalists gradually gained the upper hand, the fascist revolution ground to a halt, and the corporatist national transformation stalled. Mussolini's era was over, and so too was the era of the National Alliance.`n`nWill Italians look back on that period with nostalgia? Probably not."
 ITA_Iconoclasm:0 "Iconoclasm"
 ITA_Iconoclasm_desc:0 "In 754, Constantine V convened a council in Constantinople and formally declared: the worship of icons is idolatry, contrary to the scriptures and the teachings of the Church Fathers.`n`nDuring his lifetime, Mussolini deliberately fashioned himself as a leader, a father figure. He became the icon of the Italian state, dreaming that he would be remembered forever like Caesar. Until the icon collapsed. After his death, his political legacy was thoroughly liquidated. The cult of personality he had spent years building crumbled, and his policies were blamed as the root of national corruption. Countless newspapers and writers swarmed in to deconstruct and defame him; the truth mattered no longer. He had become part of Italian culture itself.`n`nThe iconoclastic movement was beyond any individual's power to stop. It spread into a societal wave of collective deconstruction of the previous fascist era, yet it also shook the emperor's rule and social order. Only now, it had not yet revealed its true power."
 ITA_Sarcophagus:0 "Sarcophagus"
 ITA_Sarcophagus_desc:0 "No one can be held responsible — or rather, no one is willing to admit it.`n`nFrom the 1950s to the 1980s, the Italian Empire's economic stagnation and social chaos were like a murder without a culprit. Every participant had clean hands, every faction had a clear conscience. Royalists blamed the fascist radicals' toxic legacy, fascists denounced the royalists' betrayal and appeasement, the youth league cursed the older generation's decay, the older generation sighed at the youth's recklessness. Everyone was looking for a sinner.`n`nThe sarcophagus of Constantine V was dragged from the cathedral, burned, and thrown into the sea. Those opposed to iconoclasm said this emperor had brought about the empire's destruction; supporters of iconoclasm insisted it was precisely the end of the iconoclastic movement that caused the empire's collapse. They stared at each other — same race, same skin, same blood — yet could not stop the hostility in each other's eyes.`n`nSo they joined hands and killed Italy. Put her in a sarcophagus and buried her with themselves. Let this land, with all its glory and shame, sink into a long slumber, until the world collapses, until the kingdom of heaven descends."
 ITA_Scourging_the_Rooster_the_Lamb_and_the_Ghost:0 "Scourging, the Rooster, the Lamb, and the Ghost"
 ITA_Scourging_the_Rooster_the_Lamb_and_the_Ghost_desc:0 "The youth once watched the partisans and felt none of it concerned him. He reported, he despised, he hated — until the crisis truly swept him up, and only then did he understand.`n`nSo he killed himself with his own hands. He turned himself into a ghost. He did not know how hideous his face had become, how ragged his clothes were; he did not even know whether he was still alive. He had truly become a ghost.`n`nThe Lord scourges the world to make it human. The Lamb of God comes to take away the sin of the world. The rooster crows at the world's betrayal of the Lord. And now he has become a ghost.`n`nIt is night."
 ITA_Arson_in_the_Mist:0 "Arson in the Mist"
 ITA_Arson_in_the_Mist_desc:0 "Nero's scapegoat was a people called Christians, hated for their crimes... They were subjected to torture: some were dressed in animal skins and torn apart by dogs, some were crucified, some were doused in oil and lit as street lamps after dark. Nero opened his own gardens for the spectacle. — Tacitus 15.44`n`nA great fire is spreading through Italian society. The arsonist's face is hidden in the mist — perhaps the emperor, perhaps the fascists, perhaps the royalists, perhaps the partisans. Who cares? Rome is nothing but a tower of dead wood; whoever wants to set it ablaze, let them come.`n`nNow he is putting on animal skins, letting wild dogs tear at him. Now he is being nailed to the cross. A hatred without cause, a fire of clear love and hate, and the weeping of Romans.`n`nNero is not dead. He will return from Parthia."

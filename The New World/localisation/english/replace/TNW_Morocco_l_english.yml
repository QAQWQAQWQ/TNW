 POLITICS_HASSAN_II_DESC:0 "Hassan II is the last king of Morocco, successor to Mohammed V. Following in his father's footsteps, Hassan used the chaos in Iberia to exert his power. In his youth, Hassan received a world-class education at the Royal College and learned military skills, leading the army against the Rif rebellion. This ambitious king has announced plans for a "Moroccanization" policy, through which state assets majority-owned by foreign powers will be transferred to Moroccan holding companies and other "friends of the Moroccan people." This has undoubtedly earned him the unstinting praise and support of domestic nationalists.
\nThough dismissed as a dictator and autocrat during the Iberian era, Hassan seized the opportunity to declare Moroccan independence. Hassan even annexed the remote territories of Western Sahara and Mauritania, encompassing resistance movements rooted among the Tuareg nomads. But all is not well in Morocco. Liberals in the north have formed the Rif Republic, and Hassan has no shortage of enemies within his divided government. The future of Morocco lies in this man's hands, but he seems more concerned with amassing wealth and power than with dealing with the problems facing modern Morocco."

 GER_SGR_student_protests:0 "Public Protests"
 GER_SGR_student_protests_desc:0 "§DDaily Political Power Gain: [?SGR_protests_severity_pp|0+%]\nWeekly Stability: [?SGR_protests_severity_stab|1+%]\n--------------\n§!The days of unified public support for Germany's wars abroad are gone. The public, primarily students - Speer's supporters in the German civil war - are outraged that Germany is embroiled in a terrible war they see as pointless. The longer their Führer prolongs the war, the greater their resistance grows."

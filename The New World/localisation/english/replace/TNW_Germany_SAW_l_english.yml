 SGR_SAW_war_report:0 "Combat Report"
 SGR_SAW_war_report_desc:0 "Each month, the nation receives the latest report on the South African War from the OKW. Though the authorities have done their best to censor information, the truth inevitably spreads among the people; clearly, the grim reality of this pointless war far away in Africa will not satisfy the German public."
 SGR_SAW_war_effort_failure:0 "§xAll for Naught§!"
 SGR_SAW_war_effort_failure_desc:0 "Under immense pressure from the §Mpublic§!, §gGermany's§! heroic efforts in South Africa may be forced to a halt. A shameful end to such a glorious and profitable enterprise..."

 SGR_South_African_War_category:0 "§OSouth African War Effort§!"
 SGR_South_African_War_category_desc:0 "§YInvolvement:§! [GetSGRSAWInvolvement] ([?SGR_SAW_involvement|Y1]§Y%§!) §MProtest Level:§! [GetSGRSAWProtest] ([?SGR_SAW_civilian_protest|Y1]§Y%§!)\n\nOur current strategy is [getSGRSAWStrategy]\n\nThe §RSouth African War§! was not started by the §YFührer§!, who had no intention of waging it, yet we can still benefit. Whether by driving the §RUnited States§! entirely out of Africa or merely forcing them to §Gwithdraw§!, either outcome helps us.\n\nThat said, the §Mpublic§! is protesting our involvement. We must carefully balance their demands against our plans, or we will be §Rforced to withdraw§!."

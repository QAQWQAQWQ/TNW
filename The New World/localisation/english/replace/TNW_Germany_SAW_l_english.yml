 GER_Bormann_SAF_bombingruns:0 "§RLuftwaffe Begins Bombing Campaign§!"
 GER_Bormann_SAF_bombingruns_desc:0 "The situation in South Africa now requires greater intervention, and the Luftwaffe is fully capable of delivering it."
 GER_Bormann_SAF_arsenal_of_afrika:0 "§wArsenal of Afrika§!"
 GER_Bormann_SAF_arsenal_of_afrika_desc:0 "The Central African Reichskommissariat lies mainly within the former Belgian Congo, at a considerable distance from the front lines, well out of range of any enemy air force, making it hard to strike directly. Accordingly, Führer Bormann has ordered Central Africa built up into an arsenal and supply depot - the well-known 'Arsenal of Afrika.'"
 GER_Bormann_SAF_restore_luftwaffe_divisions:0 "§BRebuild Luftwaffe Field Divisions§!"
 GER_Bormann_SAF_restore_luftwaffe_divisions_desc:0 "The civil war has left the Luftwaffe bloated, with many airmen grounded and barely able to maintain operations in Europe. Restoring Luftwaffe field divisions can provide valuable support to our Reichskommissariat allies and give us a chance to eliminate dissidents. These men are close to Göring; their loyalty is suspect, and if they do not return, we lose nothing."
 GER_Bormann_SAF_train_the_werewolves:0 "§jTrain the Werewolves§!"
 GER_Bormann_SAF_train_the_werewolves_desc:0 "Operation Werewolf was devised in the Second World War, when the war's outcome was uncertain, to respond to the extreme scenario of Germany falling to the Allies and a puppet regime being imposed. Recruits would be trained in guerrilla warfare, equipped with silenced weapons, explosives, and vehicles, to disrupt enemy rule over Germany, make the puppet government unviable, and help the legitimate government rise again. This scenario never came to pass, but Werewolf may still have its uses. Training Hütig's soldiers in these tactics will give us a valuable edge."
 GER_Bormann_SAF_festung_johannesburg:0 "§OFortify Johannesburg§!"
 GER_Bormann_SAF_festung_johannesburg_desc:0 "For nearly two centuries, Johannesburg has been the bulwark of Aryan settlement in the Dark Continent. The discovery of gold drew Boer settlers in droves, rapidly making it the largest city in South Africa - now the capital of the Afrikaner People's State. We must not let our African allies waver in their struggle to defend their homeland. We must send engineers to turn the city into a fortress, one the Americans cannot take as the British once did."

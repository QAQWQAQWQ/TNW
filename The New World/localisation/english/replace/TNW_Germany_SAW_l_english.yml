 GER_Bormann_SAW_withdrawal_abwehrabteilung_afrika_tt:0 "§WThis unlocks a §Gwithdrawal decision§! to further hone our frontline tactics.§!"
 GER_Bormann_SAW_withdrawal_the_best_gear_tt:0 "§WThis unlocks a §Gwithdrawal decision§! to ship out the last batch of elite equipment.§!"
 GER_Bormann_SAF_war_effort_failure:0 "§xAll for Naught§!"
 GER_Bormann_SAF_war_effort_failure_desc:0 "Under immense pressure from the §Mpublic§!, §gGermany's§! heroic efforts in South Africa may be forced to a halt. A shameful end to such a glorious and profitable enterprise..."

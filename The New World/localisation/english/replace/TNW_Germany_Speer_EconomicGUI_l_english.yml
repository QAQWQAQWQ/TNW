 SGR_RSFSTP_title:0 "§gNational High-Speed Railway Project§!"
 SGR_RSFSTP_title_tt:0 "§xAfter the civil war§!, §gGermany§! lay devastated, its infrastructure §Rdestroyed§!; the infrastructure built in earlier years had also §Rfallen into disrepair§!. To improve this situation, the government has launched a high-speed railway project, building §Bhigh-speed rail§! throughout the §gCompact of Solidarity§!.\n\nThe high-speed rail project is expected to yield §Genormous§! economic returns, §Yconnecting§! major cities and §Ggreatly reducing§! travel time for skilled workers.\n\nAt the same time, high-speed rail will provide §Gconvenience§! for transporting civilians, repatriating slaves, and moving goods. However, the National High-Speed Railway Project is §Rextremely costly and consumes incalculable manpower and resources§!, but for the sake of the §gFatherland§!, we are willing to spare no expense."
 SGR_RSFSTP_bottom_text:0 "§WThe National High-Speed Railway Project§!'s engineering progress is [?SGR_Project_Progress^RSFSTP|G1]%"
 SGR_RSFSTP_PU:0 "[?SGR_Project_PU_Investment^RSFSTP|G0] £GFX_tt_prod_unit_big"
 SGR_RSFSTP_add_tt:0 "Allocated to the §gNational High-Speed Railway Project§!£tt_prod_unit §G+2§!, monthly construction speed: §G0.2%§!, cost: §R+$125M§!, daily political power: §R-0.05§!\n--------------\n§BThis adjustment§!§B costs§! £political_power_texticon §Y20§!."
 SGR_RSFSTP_sub_tt:0 "Allocated to the §gNational High-Speed Railway Project§!£tt_prod_unit §R-2§!, monthly construction speed: §R-0.2%§!, cost: §G-$125M§!, daily political power: §G+0.05§!\n--------------\n§BThis adjustment§!§B costs§! £political_power_texticon §Y20§!."

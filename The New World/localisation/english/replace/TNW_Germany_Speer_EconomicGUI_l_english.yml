l_english:
 SGR_igfarben_leader:0 "Hermann Josef Abs\n§LIG Farben§!"
 SGR_igfarben_expository_text:0 "From the Milan Stock Exchange and the Bordeaux bank to the Oslo institute and the slave pens in Moscow, a vast economic empire of a singular nature looms before us. §WHermann Josef Abs§! sits upon his throne, manipulating this empire from light to shadow with unwavering, resolute authority. This is his power, and no one else's.\n\nThis vast economic empire encompasses §LDeutsche Bank and numerous other enterprises§!, and §LIG Farben§! is merely the largest tip of this enormous iceberg. Abs is not a member of the Nazi Party; in fact, he often keeps his distance from Hitler and his circle. Nevertheless, he remains a principal architect of the war economy, building his economic empire on the spoils of the World War. He has even become obsessed with the slave trade, turning §LIG Farben§! into Germany's largest slave-holding conglomerate.\n\nDue to his obsession with power and his uncooperative attitude, he has become a thorn in our side. Abs and his empire must be destroyed."
 SGR_reichswerke_leader:0 "Edmund Gehlenberg\n§jReichswerke§!"
 SGR_reichswerke_expository_text:0 "The §jReichswerke§! is one of the largest corporate conglomerates on Earth, and §WEdmund Gehlenberg§! is the master of this Frankenstein's monster. His rise to become a military oligarch was a natural progression - Gehlenberg had been intertwined with the Reichswerke since long before the outbreak of WW2.\n\nThe §jReichswerke§!'s reach extends across all of Europe; at its peak it absorbed enormous industrial facilities in the occupied territories. Although IG Farben has since overtaken it, it remains one of Germany's largest cartels and slave-holding enterprises.\n\nHowever, the struggle against this powerful conglomerate will not be in vain. Since the conglomerate is legally state-owned, Gehlenberg's long list of atrocities will ultimately become a weapon against Nazi ideology and the entrepreneurs. Gehlenberg will eventually fall from his pedestal, and Germany will be freed from barbarism."
 SGR_daimler_leader:0 "Friedrich Flick\n§gDaimler-Benz§!"
 SGR_daimler_expository_text:0 "Throughout §gFriedrich Flick§!'s long career, ruthless industrial activity and lobbying have been commonplace. And §WUnited Steel Works§! was merely his first milestone. Active in politics since the Weimar era, Flick filled the Nazi Party's coffers generously, eventually even joining §PHeinrich Himmler's social circle§!, providing the SS with hundreds of thousands in funding.\n\nHis commercial empire, §gDaimler-Benz§!, is somewhat smaller than those of his fellow oligarchs, but Flick's talent for stock trading and other economic fields also makes him a formidable competitor. As a notorious slave-owner, Flick did not hesitate to abuse his slaves, squeezing maximum profit from them as fodder for his vast commercial empire, without a shred of repentance for his actions.\n\nFlick is a textbook example of the cold-blooded entrepreneur who profited from the Nazi Party's seizure of power and atrocities. Flick must be destroyed."
 SGR_siemens_leader:0 "Ernst von Siemens\n§BSiemens§!"
 SGR_siemens_expository_text:0 "§WErnst von Siemens§! stands out among his peers. Under his stewardship, §BSiemens§!'s profits have increased tenfold, while the company has relied less on slavery than other enterprises. For this reason, his company is one of the few German enterprises that enjoys a good international reputation.\n\nMost importantly, at least when it comes to projects Siemens can profit from, von Siemens's burgeoning electronics company will express sympathetic words toward the cause of reform. On the issue of abolishing slavery, whether this sympathy stems from sincere conviction or pure pragmatism, von Siemens and his family enterprise will become an important force in the economic front and the struggle for emancipation.\n\nWhether or not we ally with §BSiemens§!, §BSiemens§! as a cartel will inevitably influence Germany's economic potential. While the enterprise and its owners are retained, their influence must be curtailed."
 SGR_GDP_entry_1:0 "Zollverein GDP: [?reich_GDP|2|W]§WB§!§W dollars§! | [?zollvereinGDP_growth|%W2]"
 SGR_slave_entry_scripted_loc:0 "[getSGRSlaveryStatus]"
 SGR_slave_entry_1:0 "Slaves: [?Reich_SlavesNum_m|3|R]§RM§!"
 SGR_slavery_abolished_entry:0 "§GSlavery abolished§!"
 SGR_workforce_entry_1:0 "Skilled labor: [?displayCurrentWorkforce|4|W]§WM§! | [?displayCivPercentage|%W2]"
 SGR_ranking_gdp_entry:0 "§G[?econRankingGDP^i|G]B dollars§!"
 SGR_ranking_gdp_entry_ZV:0 "§G[?ZV_members^i.GDP_billion|G]B dollars§!"
 SGR_econgui_economic_overview:0 "Economic Overview"
 SGR_econgui_member_overview:0 "Member Overview"
 SGR_ZVmembers_GDP:0 "§G$[THIS.Get_GDP_topbar]§!"
 SGR_ZVMembers_text:0 "Members: [?ZV_Members^num|Y0]"
 SGR_econ_overview:0 "\nIn official propaganda, the §QZollverein§! refers to a common market formed among the many nations and regions within the §gCompact of Solidarity§!. The reality is quite the opposite: the Zollverein is merely §gGermany§!'s economic sphere of influence. At present, even Eastern European industry is almost entirely German-owned. The root of this rapid development lies in the so-called Eastern Reichskommissariats, which have thus far been nothing more than German colonial administrations. The so-called §RGeneralplan Ost§! was, like so much other foolhardy waste, enormously destructive to the eastern economy; even so, the region still possesses considerable reserves of resources and manpower. By abolishing slavery and increasing investment in the East, the §QZollverein§! will inevitably become one of the largest economies on Earth.\n\nFor the sake of §gGermany§!'s future, this is the only path."
 SGR_Zollverein_members_investment_category:0 "Zollverein"
 SGR_Zollverein_members_investment_category_desc:0 "\n\n\n\n\n\n§QTotal budget: [?GER.ZollvereinBudget|+3]§GB§!§G dollars§!§!\n\n§YBudget share:§! [?THIS.MemberZVBudget|+3]§GB§!§G dollars§!\n\n§OAvailable budget:§! [?THIS.MemberSpentBudget|W3]§WB§!§G dollars§! / [?THIS.MemberZVBudget|+3]§GB§!§G dollars§!\n\nUnder the leadership of §gGermany§!'s §GGang of Four§!, the nations of Europe have established a new economic cooperation organization - the §QZollverein§!. The Zollverein aims to establish a single continental common market to ensure economic cooperation among member states and a stable, diversified market structure."
 zv_quarterly_budget_tt:0 "§QTotal budget§! and §Ybudget share§! will be updated."
 SGR_ZV_debt_reduction:0 "Repay Debts"
 SGR_ZV_debt_reduction_desc:0 "Although it is not the most elegant solution, the Zollverein's budget can continue to serve as an important source of funds for repaying national debt."
 SGR_ZV_debt_reduction_cost:0 "§Y150M§!£GFX_dollar_sign"
 SGR_ZV_debt_reduction_cost_blocked:0 "§R150M§!£GFX_dollar_sign"
 SGR_ZV_debt_reduction_tt:0 "§W§RDebt§! and §Rinterest rates§! will be reduced by §Y$200M§! and §Y1.5%§! respectively.§!"
 SGR_ZV_oil_exploration:0 "Invest in Alternative Energy"
 SGR_ZV_oil_exploration_desc:0 "Oil has long been the lifeline of modern civilization, and this crisis has made us acutely aware that this lifeline is a matter of survival. Now is the time to invest in alternative energy."
 SGR_ZV_introduce_rationing:0 "Introduce Rationing"
 SGR_ZV_introduce_rationing_desc:0 "In the face of the oil crisis, decisive imposition of fuel rationing is undoubtedly the most reasonable response, but it will also bring painful losses to civilian society. Even if our citizens do not welcome this policy, rationing will save us precious funds and time."
 SGR_ZV_fight_systematic_issues:0 "§YAddress Systemic Issues§!"
 SGR_ZV_fight_systematic_issues_desc:0 "The geopolitical oil crisis itself is no longer the point; what is far more fatal is that the domestic oil crisis has fully exposed the fragility of our economic system. Reform is imperative. Hindsight is always correct."
 SGR_RSFSTP_Extend_Railway:0 "Expand the §gNational High-Speed Railway Project§!"
 SGR_RSFSTP_Extend_Railway_desc:0 "The National High-Speed Railway Project has made considerable progress. We can adjust the laying plans, optimize expenditures, and shift high-speed rail mileage from rapid growth to high-quality growth. The Prague-Germania high-speed line is already operational, and new development opportunities have emerged.\n\nKrakau has relatively well-developed railway infrastructure and immense development potential; this city is the ideal target for extending the high-speed rail project. If the line can be extended here, the connection between the Polish region and our homeland will be greatly strengthened."
 SGR_RSFSTP_Krakau_Trigger:0 "§W§YPrague-Germania§! high-speed segment §Gcompleted§!.\nThe §gNational High-Speed Railway Project§! is §Rnot§! yet finished.§!"
 SGR_ZV_open_investments:0 "§YShow generic investment decisions§!"
 SGR_ZV_open_investments_desc:0 "Click to show generic investment decisions."
 SGR_ZV_close_investments:0 "§YHide generic investment decisions§!"
 SGR_ZV_close_investments_desc:0 "Click to hide generic investment decisions."
 SGR_ZV_open_special_investments:0 "§BShow special project decisions§!"
 SGR_ZV_open_special_investments_desc:0 "Click to show special project decisions."
 SGR_ZV_close_special_investments:0 "§BHide special project decisions§!"
 SGR_ZV_close_special_investments_desc:0 "Click to hide special project decisions."
 SGR_ZV_civilian_investment:0 "Civilian Industry Investment"
 SGR_ZV_civilian_investment_desc:0 "Through the Zollverein's budget plan, we can utilize surplus funds to redirect investment in our industry, focusing particularly on civilian industry and consumer goods production, thereby ensuring our economy meets the needs of the people."
 SGR_ZV_civilian_investment_cost:0 "§Y150M§!£GFX_dollar_sign"
 SGR_ZV_civilian_investment_cost_blocked:0 "§R150M§!£GFX_dollar_sign"
 SGR_ZV_military_investment:0 "Military Industry Investment"
 SGR_ZV_military_investment_desc:0 "Even surrounded by numerous Zollverein member states, we still need to develop our armed forces appropriately. With this in mind, long-term investment in our military industrial capacity will bring far-reaching benefits to the Zollverein."
 SGR_ZV_infrastructure_investment:0 "Infrastructure Investment"
 SGR_ZV_infrastructure_investment_desc:0 "The machinery of state runs on busy railways and solid roads. As the Zollverein vigorously advances a series of investment projects, we believe our country's infrastructure will be significantly improved and strengthened in the future."
 SGR_ZV_infrastructure_investment_cost:0 "§Y100M§!£GFX_dollar_sign"
 SGR_ZV_infrastructure_investment_cost_blocked:0 "§R100M§!£GFX_dollar_sign"
 SGR_ZV_synthoil_investment:0 "Synthetic Fuels Investment"
 SGR_ZV_synthoil_investment_desc:0 "We must not become completely dependent on the rest of the world outside Europe - therefore, it is wisest to substantially increase synthetic fuel supply through Zollverein investment, while further exploring refining paths to improve efficiency. Although autarky is difficult to achieve, when we encounter oil-related troubles in the future, we will be better prepared to cope."
 SGR_ZV_synthoil_investment_desc_cost:0 "§Y250M§!£GFX_dollar_sign"
 SGR_ZV_synthoil_investment_desc_cost_blocked:0 "§R250M§!£GFX_dollar_sign"
 SGR_ZV_education_investment:0 "Education System Investment"
 SGR_ZV_education_investment_desc:0 "If there is anything that can be called the foundation of a nation, it is an educated and informed people. Therefore, focusing on education is a matter of national importance. The existence of the Zollverein makes it easy to push through school renovations, curriculum reform reviews, and other educational reforms."
 SGR_ZV_education_investment_cost:0 "§Y50M§!£GFX_dollar_sign"
 SGR_ZV_education_investment_cost_blocked:0 "§R50M§!£GFX_dollar_sign"
 SGR_ZV_poverty_investment:0 "Poverty Alleviation Policy"
 SGR_ZV_poverty_investment_desc:0 "Those in poverty, whether barely getting by on their salaries or wandering the streets begging - they are the most vulnerable and hardest-hit group, and also the easiest to reintegrate into social life. With the help of the Zollverein, we can do our utmost to clean up the streets and ensure that the destitute have at least electric light in their homes."
 SGR_ZV_workers_investment:0 "Enterprise Incentive Policy"
 SGR_ZV_workers_investment_desc:0 "Our industry must maintain diversity, and the best way to maintain diversity is to encourage young people at home to boldly engage in industrial production. The Zollverein will be an excellent tool for this purpose - by allocating part of the budget, we can establish industrial projects and encourage newcomers to enter these emerging fields, significantly improving our economic diversity."
 SGR_Zollverein_Quarterly_Update:0 "Quarterly Budget Update"
 SGR_Zollverein_Quarterly_Update_desc:0 "Each quarter, the Zollverein's budget and budget share are updated to facilitate new investment projects."
 SGR_tasks_scriploc_tt1:0 "[getSGRStatesTooltip1]"
 SGR_tasks_scriploc_tt2:0 "[getSGRStatesTooltip2]"
 SGR_tasks_scriploc_tt3:0 "[getSGRStatesTooltip3]"
 SGR_tasks_unavailable_tt:0 "§YOnly after Speer has consolidated his rule can we begin to confront the military oligarchs.§!"
 SGR_task_invest:0 "§YMiddle-Class Investment Project§!"
 SGR_task_invest_tt:0 "§GInvesting§! in the emerging middle class in this region can weaken the §Ymilitary oligarchs§!' control. The fewer §Rslaves§! in the region, the more effective this measure.\n\n§WTwo-week cooldown§!"
 SGR_task_weaken:0 "§YConfiscate Corporate Assets§!"
 SGR_task_weaken_tt:0 "With the effective assistance of the Wehrmacht, we can §Rconfiscate corporate assets§! from the §Ymilitary oligarchs§!' hands. Although this measure is crude, it can significantly reduce their influence.\n\n§WOne-month cooldown§!"
 SGR_task_antitrust:0 "§YAnti-Trust Decree§!"
 SGR_task_antitrust_tt:0 "Once the §Ymilitary oligarchs' influence§! in this region £GFX_megacorp! falls to §Y0%§!, the §Ggovernment§! can issue a decree to completely drive them out of this economic zone.\nExpelling the §Ymilitary oligarchs§! from this region will yield the following bonuses:\n\n[getSGRStatesBonusTooltip]"
 SGR_task_antitrust_ger_tt:0 "§YZollverein Committee Leader§!:\nConsumer goods usage modifier: §G-2.00%§!"
 SGR_task_antitrust_notger_tt:0 "§Y66%§!§B chance§!:\n    §GAdd§Y two§! £tt_prod_unit production units§!\n    §GRandom regional GDP growth§!§Y+5%§!\n\n§Y34%§!§B chance§!:\n    §GRandom region gains§Y four§! building slots§!\n    §GRandom regional GDP growth§!§Y+5%§!"
 SGR_task_cost1:0 "§Y5§!£political_power_texticon  | §Y10M§!£GFX_dollar_sign"
 SGR_task_cost2:0 "§Y10§!£political_power_texticon  | §Y30§!£command_power"
 SGR_task_cost3:0 "§Y25§!£political_power_texticon  | §Y0%§!£GFX_megacorp !"
 SGR_GDP_entry_1_tt:0 "§QZollverein GDP§! relates to its economic wealth scale. Currently, Zollverein GDP is [?reich_GDP|2|Y]§YB§!§Y dollars§!, while §gGerman GDP§! is [?displayGermanyGDP|2|Y]§YB§!§Y dollars§!. The Zollverein GDP growth rate is [?zollvereinGDP_growth|%Y2].\n\nIn international negotiations, a large aggregate §QZollverein GDP§! will enhance §gGermany§!'s attractiveness to investors and business partners. GDP growth is directly related to the §Gskilled labor§! ratio; the current GDP growth is [?displayCivPercentage|%G2], and the reduction and eventual abolition of §Rslaves§! will also affect GDP growth."
 SGR_slave_entry_1_tt:0 "§RSlavery§! is a cancer upon the §gFatherland§!. Currently, [?Reich_SlavesNum_m|3|R]§RM§! people are enslaved.\n\nThe desire to win the Second World War gave rise to this twisted, evil system to realize the mad dreams of the elite, yet it ultimately only lined the pockets of the §Hmilitary oligarchs§!. Whether based on national relations or economic considerations, abolishing §Rslavery§! is beneficial without exception for §gGermany§! and the §QZollverein§!."
 SGR_workforce_entry_1_tt:0 "§GSkilled labor§! refers to the number of skilled workers in civilian industry within §gGermany§!. Currently, it stands at [?displayCurrentWorkforce|4|G]§GM§! people, or theoretically, the total available labor force is [?displayTheoreticalWorkforce|4|G]§GM§!, with skilled labor accounting for [?displayCivPercentage|%G] of that.\n\nSkilled labor can be increased by funding §gGermany§!'s commercial activities and reducing the number of §Rslave laborers§! in the §QZollverein§!."
 SGR_Konjunkturpaket:0 "Sign the §WEconomic Agreement§!"
 SGR_Konjunkturpaket_desc:0 "The German people have lived comfortably on the backs of slaves for too long, becoming arrogant and self-righteous. In the end, the economy went astray and lost its ability for self-sufficiency. To ensure the continuation of the Fatherland, we must immediately set about creating a stable economic environment within the European framework. Slaves will no longer be a necessity, and this period of history will fade into the past, to be replaced by the German people who rediscover the virtue of diligence and return to factory labor."
 SGR_Poland_investment:0 "Invest in Poland"
 SGR_Poland_investment_desc:0 "The Polish region now urgently needs massive economic and infrastructure investment. The so-called Generalplan Ost was both erroneous and blindly short-sighted, imposing large-scale enslavement upon the Polish people and ultimately turning Poland into a living hell. If we wish to bring a new era of peace and stability to the East, we must prioritize improving and developing new infrastructure to pave the way for future regional economic development."
 SGR_Ukraine_investment:0 "Invest in Ukraine"
 SGR_Ukraine_investment_desc:0 "Germany's chaotic administration and slave system have severely damaged the economic environment and political stability of Ukraine and surrounding regions. The old Ukrainian industrial system was universally built upon forced labor camps. To ensure Ukraine's future prosperity, we must correct this unsustainable economic model."
 SGR_Ostland_investment:0 "Invest in Ostland"
 SGR_Ostland_investment_desc:0 "Although the Germanization efforts in Ostland over the past decade have been hailed as a masterpiece, most of the region's industry is idle or completely shut down. This is especially true in Belarus, where the entire region has fallen into disrepair and some areas remain ruins. To make matters worse, the former Ostland government has long maintained a negative attitude toward foreign investment and economic cooperation. If we wish to rebuild Germany's economic influence within Europe, we must correct the errors of our predecessors."
 SGR_Kaukasien_investment:0 "Invest in the Caucasus"
 SGR_Kaukasien_investment_desc:0 "The Caucasus region's rich natural resources and cheap labor have fostered a sick economic relationship between the Caucasus and Germany. It is well known that working conditions in the Caucasus Reichskommissariat are extremely harsh, and the roots of this evil lie in the endless exploitation of cheap, low-quality local labor by German employers. If we wish to promote rapid economic growth in the region, we must improve the Caucasus's appalling working conditions."
 SGR_Volga_investment:0 "Invest in Moscow"
 SGR_Volga_investment_desc:0 "Although many consider our eastern subjects to be unruly rebels, mutual assistance between Germans and native Russians is often seen locally. If we wish to create long-term economic prosperity, we must promote cooperation between ethnic Germans and Russians, which will greatly benefit the Fatherland."
 SGR_konjunkturpaket_cost:0 "§WThe Economic Agreement will cost us §R$100M§! per month.§!"
 SGR_konjunkturpaket2_cost:0 "§WMaintaining the Economic Agreement will cost us §R$750M§! per month, plus miscellaneous expenses of §R$500M§!.§!"
 SGR_konjunkturpaket2_cost_inf:0 "§WThe Economic Agreement will cause our §Vinflation§! to rise by §R0.25%§! per month.§!"
 SGR_eastern_investment_cost:0 "§WInvesting in the East will cost us §R$25M§! per month.§!"
 SGR_eastern_investment2_cost:0 "§WInvesting in the East will cost us §R$100M§! per month.§!"
 SGR_oilsteelchrome_reward:0 "§WResource exploration including §Yoil§!, §Ysteel§!, and §Ychromium§! will commence.§!"
 SGR_oilsteel_reward:0 "§WResource exploration including §Yoil§! and §Ysteel§! will commence.§!"
 SGR_econ_decisions_available:0 "§WNew decision categories activated; §QEconomic interface panel§! anti-cartel measures unlocked!§!"
 SGR_decisions_available:0 "§WNew decisions will become available.§!"
 SGR_trigger_allinvestments:0 "§WBefore we can use this decision, we must §Gcomplete§! all Eastern territories investment.§!"
 SGR_trigger_konjunkturpaket:0 "§WBefore we can use this decision, we must §Gcomplete§! the Economic Agreement.§!"
 SGR_trigger_igfarben:0 "§WOnly when §LIG Farben§! has become §Bweakened and dilapidated§! can we take action.§!"
 SGR_trigger_reichswerke:0 "§WOnly when the §jReichswerke§! has become §Bweakened and dilapidated§! can we take action.§!"
 SGR_trigger_daimler:0 "§WOnly when §gDaimler-Benz§! has become §Bweakened and dilapidated§! can we take action.§!"
 SGR_trigger_siemens:0 "§WOnly when §BSiemens§! has become §Bweakened and dilapidated§! can we take action.§!"
 SGR_all_resources:0 "§WWe will gain exploration and mining rights to §Gall resources§! in the East at the cost of §RGDP growth rate§!.§!"
 SGR_some_resources:0 "§WWe will gain exploration and mining rights to §Gpartial resources§! in the East while maintaining §RGDP growth rate§!.§!"
 SGR_wealth_for_all:0 "§WThrough Erhard reforms, we will reinvest the surplus wealth into the §QZollverein§!, §Gwhich will significantly improve the Zollverein's overall GDP growth rate.§!§!"
 SGR_wealth_for_us:0 "§WThrough Erhard reforms, we will reinvest the surplus wealth into §gGermany§! domestically, §Gwhich will significantly improve Germany's GDP growth rate.§!§!"
 SGR_join_zollverein_tt:0 "§W§Y[THIS.GetName]§! announces its accession to the §QZollverein§!.\n"
 SGR_zollverein_members_scriptedloc_bloc:0 "\nZollverein budget share: [?FROM.MemberZVBudget|+]§GB§!§G dollars§!"
 SGR_zollverein_scriptedloc_bloc:0 "\nZollverein total budget: [?ZollvereinBudget|+]§GB§!§G dollars§!\nZollverein budget transfer: [?ZollvereinPayments|0Y%] of annual income\nZollverein budget payments: [?GER.SGRZVfactor|0+%]"
 SGR_zollverein_germany:0 "Zollverein Leader"
 SGR_zollverein_germany_desc:0 "Consumer goods usage modifier: [?SGR_consumer_goods|1Y%][getZollvereinIdeaBlock]\n---------------\n§!The \"Zollverein\" is a common market and economic union composed of its member states. As an important means for Germany to ensure the continuation of European hegemony, it has replaced the long-obsolete \"Pan-European\" concept - we hope to achieve our goals by less naked means."
 GER_SGR_ZV_member_dynamic_modifier:0 "Zollverein"
 SGR_zollverein_basic:0 "Zollverein Member State"
 SGR_zollverein_basic_desc:0 "§DPolitical power gain: [?THIS.ZV_pp_gain|0+%]\nConsumer goods usage modifier: [?THIS.ZV_consumer_goods|1Y%]\nProduction efficiency gain: [?THIS.ZV_production_gain|1+%][getZollvereinMembersIdeaBlock]\n---------------\n§!The \"Zollverein\" is a common market and economic union composed of its member states. As an important means for Germany to ensure the continuation of European hegemony, it has replaced the long-obsolete \"Pan-European\" concept - we hope to achieve our goals by less naked means."
 SGR_zollverein_reich:0 "Reich Zollverein"
 SGR_zollverein_reich_desc:0 "The German bureaucracy-dominated Zollverein has been maintained to the greatest extent, and in some respects even exceeded the past. Thus, there will be no more waves in the German and Eastern European economies. Old wine in old bottles, nothing more."
 SGR_zollverein_common:0 "European Zollverein"
 SGR_zollverein_common_desc:0 "The German bureaucracy-dominated Zollverein structure has largely disintegrated. The Nazi autarkic economic model is on its last legs, and dominance has shifted to the reformists and Eastern economies, which has also promoted local trade prosperity."
 SGR_siemenswelt:0 "Siemenswelt"
 SGR_siemenswelt_desc:0 "Siemens is the vanguard of German technology companies, and one of the few German companies with a good international reputation. Their existence is a boon to our research."
 SGR_reichswerke_mass_privatisation:0 "Reichswerke Mass Privatization"
 SGR_reichswerke_mass_privatisation_desc:0 "The Reichswerke is undergoing a massive privatization process, and corporate groups operated by the middle class will benefit greatly."
 SGR_reichswerke_limited_privatisation:0 "Reichswerke Limited Privatization"
 SGR_reichswerke_limited_privatisation_desc:0 "The Reichswerke is undergoing partial privatization; even so, the authorities will retain the most important military production divisions of the company's operations."
 SGR_daimler_slashed:0 "Curtail Daimler-Benz"
 SGR_daimler_slashed_desc:0 "Daimler-Benz's assets are being massively acquired and will be sold at low prices to mid-tier enterprises."
 SGR_made_in_germany_reformist_tt:0 "Overseas trade investment: §G+15%§!"
 SGR_made_in_germany_conservative_tt:0 "Overseas trade investment: §G+10%§!"
 SGR_zollverein_common_tt:0 "Zollverein GDP increment: §G+20%§!"
 SGR_zollverein_reich_tt:0 "Zollverein GDP increment: §G+10%§!"
 SGR_zollverein_basic_tt:0 "GDP growth rate: §G+1.5%§!\nZollverein budget transfer: §R10%§! of annual income"
 SGR_made_in_germany_reformist:0 "Made in Germany"
 SGR_made_in_germany_reformist_desc:0 "Through unremitting labor and billions in funding, the German economy finally has a solid foundation. Although our current situation is far from the Fatherland's true economic strength - this is only the beginning. Germany needs to seize a second opportunity; as our international reputation is steadily restored, overseas customers will slowly open their wallets to buy our goods, more and more, and more."
 SGR_made_in_germany_conservative:0 "Made in Germany"
 SGR_made_in_germany_conservative_desc:0 "Through unremitting labor and billions in funding, the German economy finally has a solid foundation. Although our current situation is far from the Fatherland's true economic strength - this is only the beginning. Germany needs to seize a second opportunity; as our international reputation is steadily restored, overseas customers will slowly open their wallets to buy our goods, more and more, and more."
 SGR_igfarben_button_tt:0 "Unlocked once the company's influence falls to §G0%§! and the §YFührer Decree§! national focus is completed."
 SGR_reichswerke_button_tt:0 "Unlocked once the company's influence falls to §G0%§! and the §YThe Dead Are Gone§! national focus is completed."
 SGR_siemens_button_tt:0 "Unlocked once the company's influence falls to §G0%§! and the §YLike a Dream§! national focus is completed."
 SGR_daimler_button_tt:0 "Unlocked once the company's influence falls to §G0%§! and the §YAcquisition§! national focus is completed."
 SGR_europes_dreams_tt:0 "§YGermany's Zollverein budget transfers will increase by §G5%§!, while budget payments received by Germany will decrease by: §R10%§!§!."
 SGR_reichs_needs_tt:0 "§YGermany's Zollverein budget transfers will increase by §G5%§!, while budget payments received by Germany will increase by §G5%§!§!."

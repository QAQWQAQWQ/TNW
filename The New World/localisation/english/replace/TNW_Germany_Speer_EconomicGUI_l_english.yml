 SGR_RSFSTP_investment_count_tt:0 "§FThe current§! level of resources allocated to the §gNational High-Speed Railway Project§! will have the §Ffollowing effects:\n- Monthly progress: §G+[?SGR_Project_Progress_Monthly^RSFSTP|2]%§!\n- Daily political power gain: [?SGR_Project_PP_Cost^RSFSTP|=+]\n- Miscellaneous expenses: §Y$[?SGR_Project_Actual_Cost^RSFSTP|2]B§!§!\n- Initial miscellaneous expenses: §Y$[?SGR_Project_Cost_Temp^RSFSTP|2]B§!§!, derived by multiplying:\n  - Our administrative efficiency (\"§Y[GetSocietyDevelopment_AdminEfficiency]§!\"): [?SGR_project_cost_mult_disp|Y%]\n  - Our state bureaucracy funding (§Y[?econ_admin_bureaucracy_slider_pct]%§!): §Y-[?SGR_Project_Bureaucracy_Display^RSFSTP|2%]§! from [?SGR_project_cost_mult_disp|Y%]\n[getSGRRSFSTPMult]"

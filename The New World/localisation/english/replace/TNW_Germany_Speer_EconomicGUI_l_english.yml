 GER_SGR_RSFSTP_halt_tt:0 "§WConstruction of the §gNational High-Speed Railway Project§! will §Rhalt§!, and maintenance costs for existing infrastructure will rise by §R250%§!.\nWe will §Rbe unable§! to change the §Yinvestment§! in the §gNational High-Speed Railway Project§!.§!"

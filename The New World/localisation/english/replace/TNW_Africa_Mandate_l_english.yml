 OFN_AFR_MANDATE.0.t:0 "Establishment of the African Mandates"
 OFN_AFR_MANDATE.0.desc:0 "The weeks following victory in the South African War were, to say the least, busy. Thousands of Shield of Africa troops surrendered en masse, and OFN military columns advanced far beyond their orders, occupying vast swathes of territory in days.\n\nThe OFN South Africa Command's mission was abruptly transformed from combat to civil administration; flame-throwing armored cars were quickly converted into water tankers for rural use; Huey helicopters carried emergency rations to inland cities cut off from German supply; battalion signal companies suddenly became makeshift administrative centers, coordinating armed patrols and medical missions.\n\nMeanwhile, politicians debated the future of the liberated African continent. A month after the war's end, OFN leaders announced: the former German Commissioner Territories would be replaced by three OFN Mandates with administrative authority, to administer and maintain the former territories until they were capable of self-governance.\n\nHalf a month later, an American major watched a flight of helicopters land in Cape Town, carrying the first civilian administrators to the continent - and new orders. The South African War officer corps was still indispensable; the mandate's work required him to serve in Africa for a few more years. The only question was: would he return to the battlefield, or be recalled home as a liaison at OFN headquarters?"
 OFN_AFR_MANDATE.0.a:0 "Responsibility calls from Washington D.C."
 OFN_AFR_MANDATE.0.b:0 "To the Congo, to Leopoldville!"
 OFN_AFR_MANDATE.0.c:0 "To East Africa, to Quelimane!"
 OFN_AFR_MANDATE.0.d:0 "To Angola, to Luanda!"
 OFN_AFR_MANDATE.1.t:0 "Establishment of the Central African Republic"
 OFN_AFR_MANDATE.1.desc:0 "The weeks following victory in the South African War were, to say the least, busy. Thousands of Shield of Africa troops surrendered en masse, and OFN military columns advanced far beyond their orders, occupying vast swathes of territory in days.\n\nThe OFN South Africa Command's mission was abruptly transformed from combat to civil administration; flame-throwing armored cars were quickly converted into water tankers for rural use; Huey helicopters carried emergency rations to inland cities cut off from German supply; battalion signal companies suddenly became makeshift administrative centers, coordinating armed patrols and medical missions.\n\nMeanwhile, politicians debated the future of the liberated African continent. A month after the war's end, OFN leaders announced: the former German Commissioner Territories would be consolidated into a single Central African Republic, with authority over vast African lands from Salisbury to Leopoldville.\n\nHalf a month later, an American major watched a flight of helicopters land in Cape Town, carrying the first civilian administrators to the continent - and new orders. The South African War officer corps was still indispensable; the CAR's grand ambitions required him to serve in Africa for a few more years. The only question was: would he return to the battlefield, or be recalled home as a liaison at OFN headquarters?"
 OFN_AFR_MANDATE.1.a:0 "Responsibility calls from Washington D.C."
 OFN_AFR_MANDATE.1.b:0 "The Central African Republic needs us!"
 OFN_AFR_DECOL_ANG.0.t:0 "Dark Clouds Gather"
 OFN_AFR_DECOL_ANG.0.desc:0 "Lavelle reviewed the latest reports from southern reconnaissance teams and sighed deeply. Ambushes were growing more frequent, destroying more trucks, and civilian and soldier casualties were mounting. Washington did not seem to understand how deeply hostile the natives were to foreign governments, mandates, and commissioner territories. Even as engineers worked to rebuild bombed bridges and clear filled-in wells, the helped civilians gave them not a single friendly look.\n\nAt this point, he had to admit to his men that things could not go on. He had come here to help the natives build a free republic in Angola. Clearly, the Angolans were ready to do it without American help.\n\n'David,' he said into the radio, 'put me through to Sangumba and Carreira. We've wasted enough manpower here.'\n\nHe lifted his finger off the button and sighed again, gazing out at the savanna stretching beyond the city limits."
 OFN_AFR_DECOL_ANG.0.a:0 "We will settle independence once and for all."
 OFN_AFR_DECOL_ANG.1.t:0 "The Luanda Conference"
 OFN_AFR_DECOL_ANG.1.desc:0 "In the conference room in old Luanda, people were deep in discussion. UNITA and MPLA high command arrived by car, drawing people's heads out of windows along the road, making security more demanding than ever. After three occupations by the Portuguese, Germans, and Americans, the Angolan people were about to carve their own path. General John Lavelle declared the conference open to all delegates present, expecting both sides to allow the US forces to withdraw peacefully and return all American prisoners. This concise statement won him applause from all present.\n\nThe first to speak was Jorge Sangumba, who argued that his freedom fighters should establish a UNITA-led transitional government before elections, to rebuild Angola's most damaged and ungoverned areas. Next to speak was Iko Carreira; Angola's people and wealth had been squandered by previous regimes, so the MPLA he represented promised a more left-leaning government. After Iko finished, a UNITA leader said there was much to do outside Luanda's political circles, questioning the legitimacy of holding elections immediately after independence.\n\nDays passed, and more and more groups took the podium, presenting their ideas for the mandate's future and gathering under the two main parties. Even with only a few serious contenders left, Lavelle could not wholeheartedly support any one of them."
 OFN_AFR_DECOL_ANG.1.a:0 "The answer to Angola's freedom may be more complicated than we expected."
 OFN_AFR_DECOL_ANG.2.t:0 "The Luanda Conference: National Government"
 OFN_AFR_DECOL_ANG.2.desc:0 "Though withdrawing a nation is far more complex than announcing a successor government, the latter is still one of the key problems General Lavelle was tasked to solve. UNITA's high command was far easier to deal with than the MPLA. After all, MPLA Chairman Neto preferred Cameroon over Washington. The general could also risk choosing a smaller but more flexible leader, but the risk of doing so was far higher than choosing one of the two major factions, and could easily escalate conflict between them. Had not the Angolan people bled enough?\n\nReturning to his quarters, the general heard delegates arguing, unaware that the burden of Angola's future rested on General Lavelle, not them.\n\nThe next day, Lavelle took the podium and took a deep breath.\n\n'For the good of the OFN Angola Mandate, the transitional government we support is composed of...'"
 OFN_AFR_DECOL_ANG.2.a:0 "Jonas Savimbi and UNITA."
 OFN_AFR_DECOL_ANG.2.b:0 "Chairman Neto and the MPLA."
 OFN_AFR_DECOL_ANG.2.c:0 "Daniel Chipanda and the FNLA."
 OFN_AFR_DECOL_ANG.4.t:0 "The Luanda Conference: Independence Day"
 OFN_AFR_DECOL_ANG.4.desc:0 "Before boarding the plane home, Rio looked back at the joyful city before him. After the dignitaries signed documents and struck their deals, he was among the last to leave Angola on the final flight. He opened his wallet just to look at the photo of his parents. In it, they still smiled as they had when he deployed to Africa.\n\nHe turned on his cane, straining to catch the faint sound of local music in the bustling airbase. No more tanks and bombers stationed in the city; the Angolans seemed happy about that. His knee had been hit by some sniper's bullet; God knows which side the man was on. Was it all for nothing? That he had to go back to Akron like a retired old man on a cane, after spending months fighting over twenty rebel factions in the jungle and villages?\n\nHe boarded the transport plane and looked out the window. He saw a small truck carrying a dozen young people. They cheered, waving their own flags. They circled around, holding their flags high, letting them disappear in the wind and sand. Rio thought, perhaps not getting shot was his reward."
 OFN_AFR_DECOL_ANG.4.a:0 "I will never forget those days in Luanda..."
 OFN_AFR_DECOL_ANG.5.t:0 "Angola Mandate Collapse!"
 OFN_AFR_DECOL_ANG.5.desc:0 "To the Joint Chiefs of Staff, Situation Report on the OFN Angola Mandate\nPart XI: Collapse of the OFN Mandate\nFollowing the escalating regional and factional tensions I described in the previous dispatch, the MPLA and UNITA, after reaching a truce and joining us to drive out the Germans, have once again openly vied for control of Angola. Ultimately, this rivalry erupted into full-scale armed conflict across Angola (see attached files 2b and 5c). General Lavelle's efforts to broker a long-term ceasefire between UNITA's Jonas Savimbi and MPLA representative Chairman Agostinho Neto have come to naught. Both sides made it clear to the general that they are no longer interested in maintaining peace (attached: General Lavelle's report on this meeting, file 2F).\n\nAfter this meeting, the general ordered all OFN forces to avoid conflict with either faction, even ordering personnel stationed in Luanda and Lunda to withdraw to Luanda (attached: General's orders, file 1E). Unfortunately, this only bought us a brief respite. Within a week, UNITA and MPLA guerrillas began ambushing our convoys and attacking villages we had declared we would protect. Thereafter, our control over Angola deteriorated rapidly. Outposts across Angola were resolutely attacked, and the enemy successfully forced OFN forces to retreat.\n\nDays later, General Lavelle rendered his judgment and ordered a full withdrawal from Angola. The mandate's end had come, and Lavelle would not sacrifice his soldiers for a lost cause."
 OFN_AFR_DECOL_ANG.5.a:0 "It ends like this, then."

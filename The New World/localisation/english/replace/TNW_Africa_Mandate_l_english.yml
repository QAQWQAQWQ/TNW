 OFN_AFR_DECOL_COG.0.t:0 "Organizing Decolonization in the Congo"
 OFN_AFR_DECOL_COG.0.desc:0 "Things have gone from bad to worse. Months of political incompetence, disregard for the native situation, and broken alliances have left the mandate a powder keg on the verge of detonation. We have tried to do something (and these 'attempts' are likely the cause of everything), but the government's authority in major cities and a few key resource centers has plummeted. Mass uprisings and rebellions are visible across the mandate. Our outposts are bombed and seized by freedom fighters, factories shattered. The mandate's attempt to conquer the jungle has ended in disaster. The exact casualty figures must not leak beyond the mandate; the 'glorious legacy' of American foreign intervention must not be seen or scorned by others. We must save face, and there is only one man in all of Central Africa who can do it. Regardless of how Washington views it, the decolonization process in the Congo begins now.\n\nAt dawn, General Abrams stood in Leopoldville Square against the heat, where his meeting with each native delegate would be held. The convoy that brought him watched street corners like hawks; snipers patrolled surrounding rooftops. Abrams's foot tapped the air thick as soup, waiting for any delegate to appear. Abrams looked down to see if he had already made a mess of himself. Only time would tell. Surely... surely someone would come, right?\n\nIn the dry, hot, yet calm air, Abrams heard sharp thuds. Shrieks and explosions. Something... something terrible had appeared on the horizon. Abrams paced anxiously, praying that someone would appear before him now, anyone at all!"
 OFN_AFR_DECOL_COG.0.a:0 "Retribution has come."
 OFN_AFR_DECOL_COG.1.t:0 "The Leopoldville Conference"
 OFN_AFR_DECOL_COG.1.desc:0 "General Abrams stood in the central courtyard of Leopoldville Square, waves of heat beating down on him and his convoy members. The grass turned dry in the calm air; polished black leather shoes paced on the boiling concrete. Abrams's gaze swept the surroundings, sweat stains marking the khaki field jacket he had changed into earlier. To onlookers, he looked more like an overweight PE teacher than the overseer of a global alliance mandate. He paced anxiously, reciting his old reliable pressure-relief routine to those waiting around him - traditional American rhetoric. 'You all know, the American spirit is commendable. In the name of some vague ideology, fighting another superpower over some dirt, stones, and liquid gold, enduring the Godforsaken horrors of the so-called Dark Continent. Not only must we endure this, but even if they bite the hand that gave them freedom, we must care for these scrawny fledglings we call the African people, tribes.'\n\nAs Abrams's flabby chin droned on, a crowd of locals gathered around him, just to see their 'savior.' The expected convoy finally appeared. At the front was the quiet, slim, tall figure of Jacques Opangault, representing the... uh... Olungu Democratic Party, right? They were traditionalists, also known as French lickspittles. 'As I told my partners back home, the hour of judgment has come, yet I know not what sin I have committed! Behold, O-lun-gu, hmm? This, this is what the next generation of African patriots should look like. What dedication, my boy!' Alphonse Massamba-Débat of the Luangoi National Unity Party stumbled forward. Abrams thought the man looked plain, but he knew that behind the man's mild smile lurked communism and anti-imperialism. Next came Justin Marie Bomboko, representing Lumumba's party, carrying the banner of the Congolese National Movement. One look at the wrinkled little man and Abrams knew he was nothing more than a mule running errands for Lumumba.\n\n'But, let me assure you,' Abrams shook his pork-sausage finger. 'We have honor, and it is our duty to see you truly gain freedom. Of course, the kind of freedom you can feel rumbling in your stomach and in your prayers.' Jean Schramme stepped out of the growing crowd, a white man coming to participate in African deliberations. He had come for the plantations, for the plantations run by Belgian colonial remnants. Needless to say, the other delegates present, especially Massamba-Débat, shot Schramme dirty looks. 'Now then, let's clean up this mess...' Abrams said, leading the way to the courthouse that had become the negotiation chamber."
 OFN_AFR_DECOL_COG.1.a:0 "Step into the fire."
 OFN_AFR_DECOL_COG.2.t:0 "The Leopoldville Conference: The Luangoi Question"
 OFN_AFR_DECOL_COG.2.desc:0 "Surprisingly, it was over an hour after the conference began before delegates started swearing at each other. For a while, even with Schramme present, the proceedings were orderly... in some form. Delegates sat in their seats, talking amiably and performing the diplomatic actions expected of them. In any case, this was good. What really mattered was the meat and potatoes, and talking policy. The first topic was the status of the Luangoi people of Gabon, or the Olungu as they called themselves. Amusingly, the local situation was not on the brink of catastrophe as in the rest of the Congo. The Luangoi got along well with their neighbors; was that not natural? But as always, political issues remained between these closely related peoples.\n\nThe Olungu, or the Olungu Democratic Party, had done its best to curry favor with the OFN and its agents, talking about everything and nothing at the conference. Hmph, French lickspittles. They were called orangutans by other delegates, and Abrams, whether intentionally or not, adopted the name too. With calm and wise concern, the Olungu Democratic Party proposed ignoring local ethnic differences to establish a unified Olungu state. In Abrams's view, these Africans were all the same anyway. 'Africans cling to their tribes, that's just how it is,' he commented. After the Olungu finished speaking, Massamba-Débat of the Brazzaville National Unity Party spoke for the freedom of the local Brazzaville people, opposing the Olungu Democratic Party's repeating the mistakes of colonial tyranny. What was the difference between an Olungu pretending to be French exploiting you, and a real Frenchman exploiting you? Abrams found this logic sound.\n\nAs Abrams and his advisors watched the Olungu Democratic Party and Brazzaville National Unity Party trade insults, he began the decision that would settle everything. Naturally... we could give the Brazzaville people independence, but should we really weaken the OFN's little collaborators, the Olungu Democratic Party, to do it? Abrams thought American interests came first, above these wretches' sad stories. But then again, he did not want to spark another ethnic war in the Congo. He had already had enough."
 OFN_AFR_DECOL_COG.2.a:0 "The Olungu will remain unified, and that is that."
 OFN_AFR_DECOL_COG.2.b:0 "Fine, you want independence? You've got it."
 OFN_AFR_DECOL_COG.3.t:0 "The Leopoldville Conference: The Congo Government"
 OFN_AFR_DECOL_COG.3.desc:0 "When he arrived, the lights in the room dimmed, and all delegates held their breath. His arrival brought both applause and a dreadful joy and reverence. He was fashionably late, having first sent his aide Justin Marie Bomboko ahead. And now he had arrived, facing General Abrams's judgment directly. To the people, he was the rising star of Congolese liberation. To political allies, he was the torchbearer of the pan-African movement. And to Abrams and his OFN advisors, Patrice Lumumba was the greatest obstacle to America's vision for the Congo. Patrice Lumumba himself, and those who had gathered under the MNC banner because of his words, were preparing to fight for Africa's freedom against the wishes of their own 'liberators.'\n\nAdmittedly, Lumumba's words had merit. He extolled the pan-African, anti-colonial socialist dream. He shouted, hoping the delegates present would embrace this vision and fight together. The dim lights in the courthouse hid Lumumba's gaze behind his glasses. The heat made him sweat, but even as his suit and bow tie curved from dampness, Lumumba stood straight. This was the perfect opportunity to turn the delegates against the real enemy, to show them who was destroying their dreams of freedom to satisfy capitalist greed. The enemy he spoke of now sat across the courthouse, Abrams's brow furrowed as he thought of who should replace Lumumba as Congo's leader. There was no doubt Abrams was thinking about how to drive Lumumba out.\n\nAn OFN advisor whispered to Abrams about Joseph Kasa-Vubu. He was a strongman, a patriot, an ally America could trust. 'But...' other advisors said. 'There are unconfirmed rumors that Kasa-Vubu collaborated with the Central African Commissioner Territory, and with Müller himself.' This was no great problem, but the Congolese people did not like a former collaborator holding power, nor did the American people. Another man whispered about was Joseph Iléo. He enjoyed great popular prestige. But a man like him could not maintain ties with the Congolese military as Kasa-Vubu could. As Abrams considered, every advisor whispered: 'Remember, American interests come first.'"
 OFN_AFR_DECOL_COG.3.a:0 "We choose Il-é-o."
 OFN_AFR_DECOL_COG.3.b:0 "Then, uh... Kasa-Vubaru."
 OFN_AFR_DECOL_COG.4.t:0 "The Leopoldville Conference: Handling the Dam"
 OFN_AFR_DECOL_COG.4.desc:0 "Abrams looked down at a carefully drawn map of the Congo, drawn around all the tribes and societies scouts had managed to identify locally. Compared to versions from decades ago, this map told a story. Cities, ethnic groups, cultures, identities either vanished or clustered tightly around Congo Lake. Abrams remembered that when he was a child, Africa did not have such a huge hole. What those Nazi bastards had done was an insult to God and nature, utterly revolting. Delegates in the courthouse gathered around the newly laid-out map. In the dim light, the map glinted. Abrams's OFN advisors' thin, damp fingers traced the entrance to the Congo Basin, around the Congo Dam. It was the engine of the Congolese economy and trade, a massive hydroelectric generator. The water cascading through the sluices roared with the power to destroy any army or great power. Naturally, General Abrams and his advisors planned to have US forces 'protect' the dam from 'rebels' and anyone else who dared challenge the economic opportunity it represented.\n\nEven with Lumumba driven out, Justin Marie Bomboko remained, with a different view. He said that if America wanted the newborn Republic of the Congo to grow into a strong regional ally, it needed to maintain control of the Congo Dam to keep the economy vital in hard times. The OFN advisors scoffed, but Abrams saw what Marie Bomboko meant. After all, sometimes letting go was the better choice.\n\nAbrams leaned back in the courthouse chair, his body tensing against the hard back. Compelled to compromise, Abrams came up with the perfect solution, enough to satisfy both the Africans and the folks back home. For example, OFN forces and Congolese jointly defend the dam, sharing its profits and the hydroelectric power, and everyone would sing 'hymns!' Those around him were less interested; it sounded like a logistics nightmare. The Olungu were also watching this issue, and only multinational administration could spark their enthusiasm. The final choice rested in Abrams's hands."
 OFN_AFR_DECOL_COG.4.a:0 "We will control the dam."
 OFN_AFR_DECOL_COG.4.b:0 "The dam will be an international project."
 OFN_AFR_DECOL_COG.4.c:0 "We will leave the dam to our Congolese partners."
 OFN_AFR_DECOL_COG.5.t:0 "The Leopoldville Conference: The Katanga Problem"
 OFN_AFR_DECOL_COG.5.desc:0 "General Abrams leaned back in his chair, sweat dripping from his forehead, the heat surging through him. Night fell, and the purgatory of politics and deals was almost... almost at an end. Abrams's advisors and the most capable delegates were compiling a comprehensive report, planning to split the Congo into multiple nations once and for all. But as Abrams watched his advisors gather, talking over stacks of files, one thing still gnawed at him. There was a politically influential and prominent leader present who had not yet made demands. So Abrams thought the demands this man would make must be worth the wait. Abrams gestured with his head for the man to step forward. Jean Schramme, representing the Belgian planters who ruled Katanga, slid forward. Abrams offered a cigar to end the ordeal: 'Speak, Schramme, I know you have something to say.'\n\nSchramme replied in broken, heavily accented English: 'Katanga, I only need Katanga.'\n\n'Only Katanga, eh? Establish a 'free' Katanga for you and your Belgian buddies to enjoy. You notice, Schramme? A white man getting his slice of Africa among a sea of blacks. Who do you think you're clinging to? You lot are nothing but Nazi collaborators. But... how much will you and your Belgian friends pay for being the OFN's intimate 'allies'?'\n\nSchramme was somewhat bewildered by the revolting American English, gathered his thoughts, and said: '...money?' He then leaned in to Abrams's ear: 'Plenty, we can give plenty, more than all those Congolese monkeys put together.' Schramme pulled back and gave Abrams a look before leaving the courthouse, expecting him to understand. Any fool could see this was about American interests. Abrams leaned back further, smoking his cigar, thinking about how his decision would shape the Congo for centuries to come."
 OFN_AFR_DECOL_COG.5.a:0 "Abandon the Belgians, they have outlived their usefulness."
 OFN_AFR_DECOL_COG.5.b:0 "Intimate allies in a turbulent region, exactly what we need right now."
 OFN_AFR_DECOL_COG.6.t:0 "The Leopoldville Conference: Independence Day"
 OFN_AFR_DECOL_COG.6.desc:0 "General Abrams pushed open the courthouse doors, and the beautiful night view of Leopoldville Square greeted him. The stuffy air sealed off inside the courthouse hit the dry, cold Congolese evening breeze, and Abrams exhaled, his coat swaying. The concrete courtyard reflected the star-filled sky, hanging high above every tired person walking out of the courthouse. Abrams held back a few local reporters with cameras and notebooks, telling them the mandate's mission was ending, and that was the news to report. The reporters scattered back to their bicycles, took a few victory photos of Abrams under the streetlight, and hurried back to their papers. Delegates left with copies of the report, receiving welcome or contempt from the groups they represented. Most of it was contempt. Crudely printed reports would be posted on walls everywhere, on notice boards across the Congo, farmers with probing eyes, pleased yet confused, staring at the reports. In a single day, the Congo's order was completely rearranged. If history recorded it truthfully, it was all due to Abrams's guidance, with no regard for its impact on most people.\n\nAbrams leaned back in the cold black leather seat of his car and exhaled long. It was the first time since he was appointed Supreme Commander of the Congo mandate. But he had not relaxed for seconds before a deep, violent cough burst out. A stabbing pain shot through his chest. It had not been a big trouble before, but lately it had grown worse. Abrams clutched his chest in pain, staring at the box of cigars in his hand, praying the dreadful feeling would pass quickly. Abrams thought, how long would these self-styled nation-builders strut their stuff?\n\nAcross the Congo, from Olungu farmers to Congolese politicians to Belgian planters, everyone celebrated their independence day. This would be the first and last celebration for centuries to come. Fireworks exploded in the Leopoldville night sky, becoming colorful wonders. For the first time since European colonization of Africa, freedom had gained the upper hand."
 OFN_AFR_DECOL_COG.6.a:0 "They will manage."
 OFN_AFR_DECOL_COG.7.t:0 "Central African Collapse"
 OFN_AFR_DECOL_COG.7.desc:0 "Inside the Pentagon, Colonel Arthur Kenney drummed his fingers impatiently. The scheduled contact was already an hour late, never a good sign. Dozens of disaster scenarios filled the staff officer's mind. Was General Abrams alright? Had Leopoldville fallen to the MNC? Had...?\n\nThe phone rang. Kenney grabbed the receiver immediately. 'Hello? This is Colonel Arthur of Strike Command, what is the situation?' Arthur hoped his voice would not betray his wavering.\n\nThere was silence for a moment, and Kenney feared his worst fears had come true. Soon a voice came: 'This is Brigadier General Harrison, I hope you can explain to me what on earth is happening?'\n\n'Didn't General Abrams brief you, sir?'\n\n'No. After I left Leopoldville earlier today, I haven't heard from General Abrams in hours. He ordered me to lead the 5th Infantry Brigade to Pointe-Noire, and now the 12th and 30th Mixed Brigades have arrived, but there's no sign of General Abrams and the remaining half of the forces. I hope, uh... I hope you can tell me more.'\n\nDamn it. Maybe Abrams had gone to command the remaining OFN mandate garrisons, maybe he was dead. Either way, a decision had to be made now.\n\n'Listen, General Harrison, all I can tell you is that the MNC has launched an uprising, and we cannot stop it. The Navy is sending transports to move your forces to Sao Tome, then back home. We have not heard from General Abrams either, but we can be certain Leopoldville has fallen. I hope he and the remaining forces are heading north to Libreville, and I will notify you of any developments.'\n\nHe hung up the phone. Well, at least that meant half of the Congo's military was gathered at Pointe-Noire. The trouble was the chain of command was shattered; rounding up the rest would take some doing."
 OFN_AFR_DECOL_COG.7.a:0 "This is going to be a long day"
 OFN_AFR_DECOL_COG.8.t:0 "Anti-Lumumba Government"
 OFN_AFR_DECOL_COG.8.desc:0 "To say the Congolese National Party was in chaos would be an understatement. In the room these people chose to meet, dozens of different voices shouted and talked over each other. They needed to reach consensus quickly. The Republic of the Congo founded by Patrice Lumumba laid claim to the lands under the former Central African mandate. Likewise, the Congolese Federal Republic founded by the Congolese National Party had done the same. Now, conflict was imminent, and they needed to choose a leader.\n\nThey had already chosen a leader, Joseph Kasa-Vubu. Kasa-Vubu was energetic and popular. He had been one of the strongest advocates for full Congolese independence. But hours before they were to announce it, terrible news arrived. Kasa-Vubu had defected, joining their rival Lumumba's Republic of the Congo. The Americans had run, the Republic of the Congo was preparing to invade at any moment, and their chosen leader had betrayed them. That was why the Congolese National Party was in panic. As the convention struggled to find a new leader, two candidates emerged.\n\nCyrille Adoula was a prominent member of the Congolese National Party and one of the strongest voices calling for change. Adoula supported trade unions and liberal democracy, following the vision the Americans had tried to achieve with the mandate. But not everyone agreed with Adoula's ideas. Reportedly, disagreements with him were the reason Kasa-Vubu defected.\n\nThe other, more moderate candidate was Joseph Iléo. As a conservative, he was more aligned with the Christian values of the Congolese people. Moreover, he was more opposed to colonial rule than the others, condemning the American mandate as nothing more than a ruthless power looking to enslave and colonize the free Congolese people again. Which candidate should lead our fledgling federation?"
 OFN_AFR_DECOL_COG.8.a:0 "Iléo will set the Congo free!"
 OFN_AFR_DECOL_COG.8.b:0 "Adoula will bring real change!"
 OFN_AFR_DECOL_MZB.0.t:0 "Organizing Decolonization in East Africa"
 OFN_AFR_DECOL_MZB.0.desc:0 "As US convoys swept through the villages under the new mandate, they found the scars Hütig left on this land far greater than anyone imagined. Local residents guided confused OFN teams to mass graves, some recently dug. Others used the English they knew to point out the East African Commissioner Territory's airfields, bunkers, and warehouses surrounded by electric fences. As mountains of reports flooded General Westmoreland, the residual authorities began demanding a series of plans to establish several independent nations across the vast African continent. Leaders of dozens of African organizations sent letters and delegates, demanding a ceasefire and presenting their own demands. These organizations cared nothing for the goals of the politicians and generals beside them, so replying to these men with guns who called themselves 'president' or 'secretary' was pointless. The US military still had much to do in East Africa, and holding a few conferences could ease many urgently needed problems."
 OFN_AFR_DECOL_MZB.0.a:0 "We will talk to these upstarts, but they must always remember who is really the boss."
 OFN_AFR_DECOL_MZB.1.t:0 "The Quelimane Conference"
 OFN_AFR_DECOL_MZB.1.desc:0 "General Westmoreland insisted on renovating the old complex in Quelimane, since the originals had been looted to nothing by Hütig's dreadful repression fantasies and bandits. Politicians from countless anti-German organizations accused each other of committing all sorts of crimes that hindered their own independence efforts. Westmoreland cared nothing for this, as long as one of these organizations took over the US military's duties and opposed Nazi imperialism forever.\n\nThe respected general gave a ruthless speech, insisting the conference could only focus on what he called 'the greatest problems afflicting the mandate after liberation.' Each independent group would receive a short essay on the general's own purpose for the conference; they were allowed to attend and formulate their own strategies under the general's overall plan. It was as simple as that!\n\nThink again. These backwater tribes were still bickering over petty ancestral grievances, worried they would be incited by the Americans! Could they not see this plan would lead Africa to freedom? Westmoreland even had to recall every delegate after two of them brawled over trivialities. Whether you were British, Portuguese, German, or American, only force kept these people in line. They were nowhere near ready to stand on their own. Much work remained, the general muttered, and it had to be done by tomorrow."
 OFN_AFR_DECOL_MZB.1.a:0 "The sun sets over Quelimane, and cries for independence echo through the night."
 OFN_AFR_DECOL_MZB.2.t:0 "The Quelimane Conference: The Mozambique Question"
 OFN_AFR_DECOL_MZB.2.desc:0 "Two men in faded suits walked into Westmoreland's office, each carrying their own documents. Each document contained their argument for why they should lead Mozambique. Like every document an African presented, the general insisted on getting involved.\n\nBoth candidates were from FRELIMO. This was Mozambique's real resistance movement, with enough money, guns, and popular support to be taken seriously. The first was Eduardo Mondlane, whom the CIA had negotiated with for a long time. Reading his file and others' testimonies, Mondlane was the people's choice. This dashing middle-aged man was famous for hunting Germans across the Mozambique countryside. Mondlane was a good soldier, and would never have become a leader if he had not insisted on fighting for independence. His followers rambled on about ending all military aid, even the kind Washington sent! How naive could he be, imagining he could openly buy American weapons and then cut ties? Westmoreland scoffed at the smiling face in the photo and moved to the next document.\n\nThe first line read: Samora Machel. Compared to the first, he could be called more 'enlightened.' Machel was a rising star within FRELIMO, but Westmoreland would not be ashamed to choose a dark horse. As long as he talked before the Japanese lobbyists got to him, he was willing to cooperate with the OFN. Sending the new generation of youngsters to fight the Germans already had the public in an uproar. Having them face the Imperial Japanese Army in bombed-out city ruins would be even harder to explain. William Westmoreland twirled his pen, wondering why these radicals could not choose a denser candidate to win his support."
 OFN_AFR_DECOL_MZB.2.a:0 "Mondlane can stabilize the situation and prevent unrest in the region."
 OFN_AFR_DECOL_MZB.2.b:0 "Give it to Machel's faction - isolationism is dead."
 OFN_AFR_DECOL_MZB.3.t:0 "The Quelimane Conference: The British Demands"
 OFN_AFR_DECOL_MZB.3.desc:0 "Clifford Dupont arrived late, obviously representing the British community of Rhodesia. Dupont's speech aroused suspicion among native delegates, as he demanded the mandate take special action to resolve tensions between British residents and African natives in Rhodesia. He insisted that before the Commissioner Territory was established, British residents had experience administering the region. To build an independent nation, they must be included, building the nation together with the Africans. He ended by telling a tragic story of a British family mistaken for German and abused, but few applauded.\n\nThat night, Dupont personally delivered a letter to Westmoreland's desk. The content was clearly more detailed than anything any African group had proposed, and Dupont waited for the general to shake his hand and reach an agreement.\n\nHowever, General Westmoreland flew into a rage, rebuking the former colonial director for his inaction during the war and his open alliance with the Germans to suppress the natives.\n\n'In my view, Mr. Dupont. From the moment you bowed to the Germans, you and your people lost any right to stand with the victors. Now, get out of my office.'\n\nThe stunned Dupont left quickly. Westmoreland and the Supreme Commands were still condemning the attack, making him clench his fist in anger. But General Pierce saw it differently. The British may have been collaborators, but at least they knew how to run this place before their WWII defeat. They should not be given full authority, but should Dupont and the British get some say, to make the country easier to govern?"
 OFN_AFR_DECOL_MZB.3.a:0 "We have worked with collaborators before - at least this one looks like he knows what he's doing."
 OFN_AFR_DECOL_MZB.3.b:0 "Let the British sort out the mess they made themselves."
 OFN_AFR_DECOL_MZB.3.c:0 "They have already been given more than enough."
 OFN_AFR_DECOL_MZB.4.t:0 "The Quelimane Conference: The Barotseland Proposal"
 OFN_AFR_DECOL_MZB.4.desc:0 "In petitioning William Westmoreland, the King of Barotseland, unlike other delegates, still used more traditional methods. He told stories of his ancestors, of how they were manipulated, oppressed by cruel treaties, and suffered in silence for decades with no voice. Whether the rulers were British, Belgian, or German, no matter how many Lozi people lived in Barotseland, they were ignored and abandoned.\n\nHe provided the conference with a map, hoping for the general's help in building a new nation from the ruins of German Africa, helping his people escape the tyranny of other African groups and European overlords. Though the borders the King of Barotseland drew conflicted with several plans Westmoreland had drafted, the general could see the old King spoke from the heart.\n\nAs the conference adjourned for a break, Westmoreland looked behind him and found the King talking with the few people willing to learn more. The general found an aide and asked more about Barotseland. If Barotseland was truly important, he had no reason to let such a powerful man leave empty-handed. As the aide told him more about Barotseland, William finally understood the issue. The King had a strong claim to this land, but establishing Barotseland would interfere with the goals of most parties and groups. Returning the King his rightful lands would certainly win media praise and set a precedent for true liberation. But what happens after the Americans leave? In just months, Barotseland's neighbors would invade, carving up the country piece by piece.\n\nThe old King's words were infectious; if he did not want to see the dream shattered, he had to work closely with the OFN."
 OFN_AFR_DECOL_MZB.4.a:0 "An independent Barotseland would be the jewel in the crown of our African cause."
 OFN_AFR_DECOL_MZB.4.b:0 "The King's dreams are shattered, but the continent is saved."
 OFN_AFR_DECOL_MZB.5.t:0 "The Quelimane Conference: The Uganda Conflict"
 OFN_AFR_DECOL_MZB.5.desc:0 "Mustafa sat in the chosen seat, shaking hands with the American generals. General Westmoreland had insisted on inviting him to the conference. Uganda had always been a thorn in the side of the British, Germans, and Americans who occupied it. Though the Americans did not know the various rebel groups they were fighting locally, they knew their leaders well. Mustafa saw himself as a peacemaker among Uganda's various peoples and guerrillas, and one of the few willing to sit down with General William Westmoreland.\n\nAt this conference, the general mainly asked about the two famous figures he had mentioned earlier. Mustafa explained that Idi Amin Dada was a hardliner, which was both his strength and his weakness. Dada's men were brutal, and it would take little effort to stabilize independent Uganda by establishing a brutal oppressive regime. Worse, he pointed out to the attentive Westmoreland that Idi Amin had planted informants in every Ugandan organization. Mustafa knew that if he fell from grace, many people would be ready to kill him.\n\nTo the Americans, Tito Okello was the better choice. This would certainly make Idi Amin launch a guerrilla war that would quickly spread across the newborn nation, likely leading to government collapse.\n\nWestmoreland and his aide Pierce looked at each other, neither sure who would be safer to lead independent Uganda."
 OFN_AFR_DECOL_MZB.5.a:0 "Idi Amin is our best choice."
 OFN_AFR_DECOL_MZB.5.b:0 "Mr. Okello will lead the new Uganda!"
 OFN_AFR_DECOL_MZB.6.t:0 "The Quelimane Conference: Independence Day"
 OFN_AFR_DECOL_MZB.6.desc:0 "After weeks of consultation and revision of General William Westmoreland's draft, delegates gathered in Quelimane to announce their final answer to the world.\n\nThe scars left by German tyranny were still etched in every African's memory, and the answer they gave was not to continue colonial occupation, but to establish several free and independent African nations. The report's focus was on the word 'Africa.' When they returned to their territories, the newly established governments were struggling to draft their constitutions, gradually ending internal conflict, and ensuring US forces could withdraw safely from the entire region.\n\nMost importantly, these newborn nations agreed to sign friendship treaties, cooperating with each other to defend against any enemy with colonial ambitions in East Africa."
 OFN_AFR_DECOL_MZB.6.a:0 "Millions share the same fate."
 OFN_AFR_DECOL_MZB.7.t:0 "The Quelimane Conference: Independence Day"
 OFN_AFR_DECOL_MZB.7.desc:0 "US Strike Command Report No. 87\nTo the President of the United States of America\nSecret\nEarlier today, Strike Command received notification from General Westmoreland. The approaching rebels forced him and his staff to abandon Quelimane. Though we still received reports of units evacuating Lindi, most ground forces followed the general out. In short, the mandate has collapsed.\n\nBefore receiving General Westmoreland's full report, we do not know exactly when the local situation deteriorated beyond recovery. But we are 100% certain the current East African crisis originated with the uprisings of the Ugandan warlords, the Tanganyika and Rhodesian revolutionary movements.\n\nThe Kampala garrison was surrounded and had to fight its way out, fortunately with light casualties. The Dodoma garrison at least managed an orderly withdrawal, building a defensive line with the troops in Dar es Salaam. Thanks to this, the seaborne evacuation to East London was completed successfully. The Quelimane garrison crossed the open road through the South African border, regrouping behind the frontier.\n\nAccording to General Westmoreland's figures, the evacuation went smoothly overall. Casualties remained low, and most military equipment was withdrawn; those that could not be evacuated were destroyed. That said, the mandate's collapse is still unfortunate for us, and Strike Command awaits your next order.\nUS Strike Command African Division\nColonel Arthur Kenney"
 OFN_AFR_DECOL_MZB.7.a:0 "Regrettable."
 OFN_AFR_DECOL_CAR.0.t:0 "Peaceful Dissolution of the Central African Republic"
 OFN_AFR_DECOL_CAR.0.desc:0 "'After weathering the hardships of the Second World War, the United States of America entered war once more. In recent years, we have seen enough wars fought over power and vengeance. But this war was different; it was not of that nature. We fought to protect the innocent and liberate the oppressed. I can assure you, no war waged on this planet was fought for a greater justice than the one we fought in Africa. And so, when all was said and done, the blessed US forces prevailed. It is therefore our responsibility to clear away the destruction wrought by battle. If you will, let us complete this glorious mission together, eradicating the legacy of Nazism in Africa. Just as America's forebears did, help the African people prepare to stand on their own, to hold their fate in their own hands.\n\nI am pleased to announce to the world that the mandate's mission has been completed successfully. Through the efforts of the OFN and leaders across the African continent, the All-Africa Summit achieved an unprecedented diplomatic success in human history. Never before have so many nations gained independence at the same time, with such enormous impact on the global situation. We have righted the wrongs committed at the Berlin Conference, and taken the world a great step forward toward freedom. I know most of you see me first as a soldier. But when I think that my name will go down in history alongside this immortal peace plan, I am prouder than ever.'\n\nWith that, Westmoreland ended his speech. If the applause that erupted from the crowd on the National Mall was described as deafening, it would be an understatement. Hell, Westmoreland thought, the applause was loud enough to be heard in Germania. He took a deep breath and walked past all sorts of officers and politicians, and even the President, back to his seat. He noticed these people were not as happy as the crowd below. Westmoreland had expected them to be disappointed. No doubt they had expected their investment in Africa to yield more returns. But regardless of the returns, the African continent might yet achieve some measure of peace and freedom. Was that not enough to satisfy the politicians in Washington?"
 OFN_AFR_DECOL_CAR.0.a:0 "Westmoreland hopes so."
 OFN_AFR_DECOL_CAR.1.t:0 "Rapid Collapse of the Central African Republic"
 OFN_AFR_DECOL_CAR.1.desc:0 "To the Joint Chiefs of Staff\nEmergency Report from General William Westmoreland\nSecret\nThe situation in the Central African Republic (CAR) is deteriorating rapidly. Had this been a day ago, I might have demanded immediate reinforcements for the African garrison. But as things stand, I can only advise a full withdrawal of all OFN forces north of the South African border. My efforts to mediate and negotiate with factions and movements within my jurisdiction have all failed. Every time negotiations neared consensus, another group would emerge with controversial demands and claims, complicating the situation further. In the end, the government's authority on the African continent has vanished entirely.\n\nI gave the Africans every chance to win their independence and profit from their friendship with America. They refused. At this point, nothing can be undone. Last night, I received notification that fighting had broken out in Uganda and Rhodesia. Before I could respond, reports arrived of several uprisings across Africa, targeting US forces and Europeans left over from the Commissioner Territory era. Garrisons everywhere were outnumbered, and I had no choice but to order a retreat. As this report reaches you, I may be directing the evacuation from Dar es Salaam and Nampula. After the garrisons in these places are safely evacuated, forces in the western half of the Republic will withdraw from Pointe-Noire, Libreville, and Luanda. This decision was not easy, but I believe it is the right one. We cannot win this fight, and should withdraw as quickly as possible to minimize casualties. I am well aware I have exceeded my authority in issuing evacuation orders, and I voluntarily accept any punishment.\nReport complete"
 OFN_AFR_DECOL_CAR.1.a:0 "Oh, dear..."
 OFN_AFR_DECOL_CAR.2.t:0 "Westmoreland's Madness"
 OFN_AFR_DECOL_CAR.2.desc:0 "Emergency Communication\nSecret\nI cannot put it in simpler terms. The CAR situation was already bad, and now it is a disaster. We all knew the Republic could not last forever, and never intended to keep it that way. But the problem is... Westmoreland. What on earth is wrong with this man? We do not know the truth of the matter, and perhaps we never will. It seems he has suffered some kind of mental breakdown or trauma. To this day, no conjecture can explain his unbelievable and bizarre actions during the CAR's collapse.\n\nWhat we know now is that as reports of collapse across the Republic flooded General Westmoreland's headquarters, instead of ordering a general retreat and preparing to evacuate Africa, the general ordered every unit to hold position and restore order by any means necessary. This order was so unrealistic, Westmoreland must be mad. The reaction from the units confirmed our suspicions; most frontline commanders withdrew to the nearest ports and began evacuating the African continent. It is estimated that after Westmoreland issued his mad order, roughly ninety percent of the forces withdrew from the CAR.\n\nThe remaining ten percent obeyed the general's mad order. With ninety percent gone, the general could only build defensive lines around Leopoldville and Quelimane and hold on. As this report goes out, they are still holding. But as days pass, their supplies, food, and manpower dwindle. Time is running out, and though we could try to rescue them, the chances of success are low. Frankly, no one in the Pentagon is interested in saving this madman who dug his own grave.\n\nRecommendation: Cut our losses on this matter."
 OFN_AFR_DECOL_CAR.2.a:0 "What was he thinking?"
 OFN_AFR_DECOL_CAR.3.t:0 "Crisis Terminated!"
 OFN_AFR_DECOL_CAR.3.desc:0 "Sweat pooled on Westmoreland's thick eyebrows, and every time he stood in the sweltering, filthy underground East African command post, sweat poured from between his brows. Deep breath, relax. Over the past few months, contradictory intelligence, repeated missions, commanders moping and complaining, orders lost or misfiled, terrible logistics and infrastructure reports, and costly yet stagnant front lines - bad news rained down on him. But Westmoreland survived, lived to the end in Africa, snatching victory from the jaws of the all-Africa disaster. 'Damn it, we did it, we did it...' Westmoreland said, brushing his greasy hair back.\n\nA young signalman, his face covered in acne, celebrated with the general. He grinned from ear to ear, bouncing excitedly off the metal walls of the command center, shouting: 'We did it, sir! We did it! The guerrillas, the rebels, the warmongering bastard warlords all got beaten down!' Westmoreland stood from his dirty leather chair, sweat dripping from his jungle green jacket. The signalman bounced around Westmoreland, singing praises of their victory. 'If we let these monkeys have their way, God knows what kind of hell filled with cannibal cults and child soldiers this world would become. Am I right, sir?' Westmoreland glanced back at him, as if marveling at the boy's extreme naivete. When the general spoke, the signalman slowed his pace.\n\n'Son, calm down. We will not be staying here long.'\n\n'...what? Sir, you can't be serious? The war is won, time to go back to real work?'\n\n'Kid, you need to understand the situation. It is time to leave; the whole damn African continent hates us. Sure, we took down a few ringleaders. But now, every native on the African continent fucking wishes we would get out. The little political goodwill that remained is long gone, and the folks back home despise us too. Now, we should pack our things, back some strongman, and get the hell out of this place. Kid, if you don't do this, I guarantee this war is doomed. America never fights unwinnable wars.' With that, Westmoreland stormed out of the command center, leaving the stunned signalman behind. Hope faded from his face."
 OFN_AFR_DECOL_CAR.3.a:0 "When will we fight a winnable war?"

 OFN_AFRICA_MANDATE_temporary_command:0 "OFN Temporary Military Administration"
 OFN_AFRICA_MANDATE_temporary_command_desc:0 "The rotten rule of the §jCommissioner Territories§! left behind a greater mess than anyone imagined, and as the new §BOFN Supreme Commands for the Mandates§! are established in the region, new challenges arise. The ability of the §BSupreme Commander§! to control a region is expressed as his §Padministrative control§! over that §BMandate§!. For some regions, controlling everything is no difficult task, but the fundamental purpose of the three great Mandates is to keep this value high. If §Padministrative control§! falls below §S50%§!, the §jpolitical stability§! of the §BMandate§! will suffer unrest. §jPolitical stability§! keeps the mandate free from the chaos sweeping this continent, so this value should be as high as possible to prevent uprisings.\n\nThe §BOFN Supreme Command§! and §MUS Congress§! handed the mandates to their generals to keep the region at peace and prepare for future decolonization. They naturally expect to make some profit from this as well, as funds for future OFN operations. Combining one-time investments in the §BMandate§! with monthly revenues, the §Omoney reserves§! of the §BMandate§! are calculated.\n\nThe current §jpolitical stability§! of the §BMandate§! is [ROOT.GetMandateStability] ([?ROOT.OFN_MANDATE_rebel_stability|%1], [?ROOT.OFN_MANDATE_stab_decay|%1=+], calculated weekly).\nThe current §Padministrative control§! in our controlled territory is [ROOT.GetMandateAdmin] ([?ROOT.OFN_MANDATE_administrative_hold|%1]).\n\nThe §Omoney reserves§! currently available for our military command are §G[?ROOT.money_reserves]M dollars§!."
 OFN_AFRICA_MANDATE_temporary_command_CAR:0 "OFN Temporary Military Administration"
 OFN_AFRICA_MANDATE_temporary_command_CAR_desc:0 "The rotten rule of the §jCommissioner Territories§! left behind a greater mess than anyone imagined, and as §BOFN General William Westmoreland§! takes command here, new challenges arise. He must oversee reconstruction across nearly half the African continent, no easy task even for the best general. To ensure the §jpolitical stability§! of the Central African Republic, §BGeneral Westmoreland§! must maintain both his §Padministrative control§! and §Lmilitary control§! at high levels. Higher §Lmilitary control§! ensures national stability, but without equal §Padministrative control§!, it will only repeat the cycle of order and chaos this continent has known.\n\nThe §BOFN Supreme Command§! and §MUS Congress§! hope §BGeneral Westmoreland§! will maintain the balance here until the region is ready for decolonization. They naturally expect to make some profit from this as well, as funds for future OFN operations. Combining one-time investments in the §BMandate§! with monthly revenues, the §Omoney reserves§! of the §BMandate§! are calculated.\n\nThe current §jpolitical stability§! of the mandate is [ROOT.GetMandateStability] ([?ROOT.OFN_MANDATE_rebel_stability|%1], [?ROOT.OFN_MANDATE_stab_decay|%1=+], calculated weekly).\nThe current §Padministrative control§! in our controlled territory is [ROOT.GetMandateAdmin] ([?ROOT.OFN_MANDATE_administrative_hold|%1]).\nThe current §Lmilitary control§! in our controlled territory is [ROOT.GetMandateMilitary] ([?ROOT.OFN_MANDATE_military_presence|%1]).\n\nThe §Omoney reserves§! currently available for our military command are §G[?ROOT.money_reserves]B dollars§!."

 AZH_Subrata_Bose: "Subrata Bose"
 POLITICS_MOHAN_SINGH_DESC: "After a long and distinguished career of service to Subhas Chandra Bose and the people of India, General Mohan Singh now heads a committee firmly committed to restoring Subhasism, having assumed the duties of Acting President of India.\n\nSingh began as a captain in the British Indian Army's Malayan garrison. When the Japanese invaded Malaya, he met Captain Iwaichi Fujiwara. Persuaded by Fujiwara, Singh agreed to raise an army from captured British Indian soldiers to fight for Indian independence. Later, interference from Japanese Army headquarters and Fujiwara's departure caused unrest, until Subhas Chandra Bose appeared to lead the Free Indian Army to victory.\n\nAfter the war, Mohan Singh's joy at India's liberation gradually gave way to discontent. As Bose aged, Singh was sidelined in the army, which rankled him and bred dissent against the government. But after Bose's death, when Kiani and others were also pushed aside and Chatterjee's Bengali faction dominated the government in a chaotic mess, Singh seized the rationale for direct action to stabilize the government, ending the disorder caused by Bose's incompetent successors.\n\nOrder restored, Mohan Singh wants everyone to know one thing: he is committed to preserving Bose's legacy, firmly, one hundred percent, and a competent civil government will be built alongside good governance."
 POLITICS_LAKSHMI_SAHGAL_DESC: "Lakshmi Sahgal is a figure of such renown that even in the republic to the west, people respectfully address her as 'Captain Lakshmi.' That she should become President seems almost unbelievable, but perhaps at the turn of the new millennium, this is exactly the change India's hardworking women and workers need.\n\nBefore taking the name Sahgal, Lakshmi was already a fighter for Indian independence. After a failed marriage, she went alone to Malaya, joined the Azad Hind Fauj as a captain and commander of the Rani of Jhansi Regiment, fighting the British on the front lines. Later, Lakshmi retired with the rank of brigadier - the first woman promoted to that rank since British colonial rule began. It was then that Sahgal became convinced that socialism and left-wing politics were the way forward for India.\n\nPerhaps it was her military career and the connections it nurtured that made her a suitable candidate for the presidency. Beyond her husband, General Prem Kumar Sahgal, she enjoyed the friendship of grassroots Forward Bloc leaders who had remained in India during World War II; the support of people like Sadhu Singh Kavsher and Sheel Bhadra Yagee helped her establish herself in the Hindustan Samyavadi Sangha in the 1940s and 50s, then succeed as Minister of Women's Organizations in the 60s, and finally become President.\n\nPresident Lakshmi Sahgal has ambitious goals. She hopes to promote fairer status and treatment for women through broad legislative and policy changes, giving them the same opportunities she herself enjoyed; furthermore, she intends to strengthen the power of India's workers and peasants, for India's prosperity depends on their labor."
 AZH_Hindustan_Land_Development_Authority: "Hindustan Land Development Authority"
 AZH_Hindustan_Land_Development_Authority_desc: "The stated goal of the Hindustan Land Development Authority is to resettle landless peasants and increase agricultural productivity. Their work has had mixed results: on one hand, land redistribution has greatly alleviated the tenant problem in overpopulated Bengal and increased state revenue; on the other, in most of the resettled settlements, the Authority's land work has strengthened separatist and native nationalist sentiments."
 AZH_The_Language_Problem: "The Language Problem"
 AZH_The_Language_Problem_desc: "The government and party leadership are overwhelmingly Bengali and Tamil expatriates from Malaya and Burma, who form the core of the movement. This, combined with Bose's desire to romanize Hindustani and standardize it as the official language, has strained relations between the Bengali and Hindi-speaking regions of the country."
 AZH_What_Is_Subhasism: "What Is Subhasism?"
 AZH_What_Is_Subhasism_desc: "Socialism, nationalism, Bolshevism, fascism - many definitions have been applied to Free India's official ideology, but even the most dedicated party member would struggle to pin down the exact stance of the government and people. This ideological flexibility is probably useful only when dealing with other nations (and certain rebel groups), but sooner or later we must make a decision, and Bose's vision must be concretely defined. As for what form that will take, no one can say."

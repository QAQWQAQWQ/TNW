 POLITICS_AC_CHATTERJI_DESC: "If you had told Dr. Anil Chandra Chatterji in 1915 that he would become a major general in the Free Indian Army thirty years later, he would have checked whether you were overworked. Yet that is exactly what happened: A. C. Chatterji joined Subhas Chandra Bose's ranks in the 1940s, and his life's course was set.\n\nIf you then told Chatterji he would become Finance Minister and administrator of liberated territories, he would find it even harder to believe, but that is exactly what he was tasked with: managing the Calcutta government's finances and administering territories liberated from the British until government institutions were firmly established.\n\nIf you went further and told him that student movements over food security would cost a certain Finance Minister his post but earn him a promotion to party leader, he might have grown angry. But that is exactly what happened in 1959 - Chatterji had to hand over the Finance Ministry to Nedyam Raghavan and became chairman of the Hindustan Samyavadi Sangha.\n\nIf you continued and told the young doctor of 1915 that he would become chairman in this way, and in old age become notorious for opportunism, he might gradually begin to believe it. After all, why not enjoy one's twilight years in such fashion?"
 POLITICS_NEDYAM_RAGHAVAN_DESC: "Decades ago, the lawyer Nedyam Raghavan moved to Penang in Malaya, where he actively defended labor in the courts. Then the world war came, the Japanese arrived in Malaya, and Raghavan helped Rash Behari Bose organize the Indian Independence League.\n\nBut Iwaichi Fujiwara's more abrasive replacement took over and ruined everything. Fujiwara's successor tried to impose his will on the Indian revolutionaries, demanding blind obedience. Raghavan resigned in protest, refusing to sell the Indian independence movement to Tokyo, and was placed under house arrest.\n\nThat should have been the end of it, but Subhas Chandra Bose returned. Bose realized that though Raghavan disagreed with him on cooperating with Congress, he enjoyed the wholehearted support of Malaya's Indians. So he sincerely invited Raghavan to rejoin the Azad Hind Fauj: the latter accepted, and immediately provided massive financial support from the South Indian communities of Southeast Asia.\n\nAfter the war, Raghavan served as ambassador and Finance Minister. He is a formidable orator and one of the Calcutta government's chief theorists, both respected and feared. It is therefore no surprise that he succeeded to the presidency after Bose's death.\n\nAs President, Raghavan's priorities are three: limited pan-Asianism, welfare and social safety nets, and a vigorous developmentalist economic plan."
 POLITICS_ABID_HASAN_SAFRANI_DESC: "Abid Hasan Safrani was born in Hyderabad, educated in Germany, and has left his mark on all Indians wherever his political career takes him - through him, the slogan 'Jai Hind' spread across the subcontinent.\n\nSafrani met Subhas Chandra Bose during World War II and served as his private secretary and interpreter for decades thereafter. He is therefore known for his loyalty to the leader, which makes him a steady choice to lead India's national revolution.\n\nContrary to stereotype, Safrani, a trained professional, is not rigid. On the contrary, he is widely read, fluent in Arabic, German, Persian, and English; before joining Bose, he lived at Mahatma Gandhi's Gujarati ashram. Safrani remains unmarried, though in the 1940s he nursed an unrequited crush on a German woman. Though a Shia Muslim and thus a representative of Indian secularism, he often drinks; he served as a major in the Azad Hind Fauj, trying to shape it into an ideologically driven army, with mixed results.\n\nBy contrast, Safrani's post-war service in Free India's foreign ministry was far more successful, which may be one reason he was able to match the Congress machine and ultimately take power. Now, at all costs, Safrani is committed to bringing all of India under the Sangha's party-state system."
 AZH_A_Titan_of_the_Sphere: "A Titan of the Sphere"
 AZH_A_Titan_of_the_Sphere_desc: "The Sahay government draws inspiration from Manchukuo's success, openly embracing an economic model driven by social bureaucratic cadres, with authoritarian oversight and economic planning as key. Backed by the Azad Hind Fauj, a new zaibatsu organized along Manchurian lines - the Hindustan Development Agency - will rigorously steer development, attract Japanese investment, and forge a new industrial titan of Asia."
 AZH_Congress_Remnants: "Congress Remnants"
 AZH_black_years_dynamic_modifier: "The Dark Years"
 AZH_black_years_dynamic_modifier_desc: "Humanity's basic need for food does not stop because war breaks out. In the catastrophe engulfing India, this fact was first forgotten, then remembered on empty stomachs.\n\nThe subcontinent has suffered an unprecedented wave of famine. The agricultural heartlands of Bihar and Uttar Pradesh have been devastated, with incalculable consequences: for every person killed by the war, twenty more die of starvation. In the internecine fighting, villages across the land weep and wail. If measures are not taken soon, the catastrophe of the 'Dark Years' will not be confined to one country but become a global tragedy - suffering unseen in this century."

 AZH_Saumyendranath_Tagore: "Saumyendranath Tagore"
 AZH_pandoras_box_1_desc: "Centuries-old ways of life continue. Farmers bend their backs to the soil, laboring along the furrows carved by their ancestors. Villages remain intact, supported by the rigid house of cards that sustains the social structure - a structure that has survived the fall of empires and the rise of dynasties, from emperors to mere officials, standing unmoved. India moves slowly but steadily toward the future, at least on the surface."
 AZH_pandoras_box_2_desc: "Unease, laced with blood, tears at the cracks in ancient foundations. Sons flock to the promise of jobs in the great metropolises; slums overflow, and villages hollow out. Whole fields are torn from the plow for the bulldozer; the old order is displaced and compensated, yet survives with the stubbornness of millennia. Upheaval is coming, but it is merely a replay of foreign history - and the tottering card-built dome will endure, stubbornly, amid the ruins."
 AZH_pandoras_box_3_desc: "Bugles blare across the sky, and a great campaign begins. Mothers tearfully watch their proud sons march to barracks and battlefields. A martial people charges forward, while the rest walk into factories and rear areas. But already, the whine of stray bullets and the shriek of dive bombers begin to unravel ancient laws; as blood soaks the mud, only the cold-eyed soldier will endure."
 AZH_pandoras_box_4_desc: "War's storm has seized the nation's lifeline, devouring it yet still unsatisfied. Military families have no more sons to offer; proud regiments must recruit from the streets. Villages that once cooked smoke now lie ashen, shells tearing through flesh regardless of rank. Survivors gaze at the world through blood-misted, shell-shocked eyes, and the old world's traditions ring as nothing but a grim, mocking echo."
 AZH_pandoras_box_5_desc: "To hell with the old world's so-called traditions! We will march over the bones of our fallen comrades into the bowels of our ancient foes, wring their families into blood, and bring the war to the halls where they have lived for generations. Kill those honey-tongued scoundrels - the priests and politicians who have never watched their own brothers burn. When the blood debt is paid, this scorched earth beneath our feet will, under the avenging army, become a promised land of our own."

 AZH_Amiya_Nath_Bose: "Amiya Nath Bose"
 POLITICS_SAMAR_GUHA_DESC: "People always argue about what Subhas Chandra Bose left behind. Some say he left only the army, because his most devoted followers unified the subcontinent by force; others say he introduced India's people to Japan's advanced culture and technology; still others, like Dr. Samar Guha, believe that socialist and populist economic justice is the leader's most precious legacy.\n\nDuring Bose's lifetime, the socialist intellectual Guha was one of his closest confidants. Though an intellectual by background, he remained popular, and Bose never hid their friendship, in public or private.\n\nIt is therefore no surprise that Samar Guha is devoutly committed to carrying on Bose's legacy. He has set three policy priorities: stable education, a robust social safety net, and strong national defense, to ensure that what he understands as the leader's legacy is advanced.\n\nGuha will have many resources at his disposal. He is a voracious reader whose studies range widely, from cutting-edge atomic science to the subcontinent's traditional philosophy, religion, and culture. Between his interpretation of Bose's ideology and socialist theory, Samar Guha has struck a balance. Time will tell whether his reading will benefit India's people as much as it has shaped him."
 POLITICS_AMIYA_NATH_BOSE_DESC: "Amiya Nath Bose inherited the leadership mantle from his late uncle, and people accuse him of nepotism - accusations he is now working hard to refute.\n\nIf one had told Amiya Nath Bose back when he led the student union at Calcutta University that he would end up where he is today, he would scarcely have believed it. In 1937, he went to Cambridge to study economics, qualifying as a barrister in 1941. The British, suspecting him of radical anti-imperialist views, watched him as they watched his uncle and father. Then the British Empire collapsed under Operation Sealion, British India vanished, and Amiya Nath Bose returned home to join his father and uncle.\n\nYears passed. India split in two, and his father, Sarat Chandra Bose, passed away. To honor his father and comfort his grieving uncle, Amiya Nath Bose continued to work for the Hindustan Samyavadi Sangha. The world moved into the 1960s, and Subhas Chandra Bose grew thin and frail. Then one day, Amiya Nath Bose was led into a room and told that his uncle was gone, and that he was now President.\n\nNath Bose's accession provoked many accusations of cronyism. Deep down, Bose did not mind; he lacked charisma anyway and doubted he could change people's minds. Besides, he felt he was only a transitional president who would eventually hand over power anyway, so why care what people thought of him?"
 POLITICS_ANAND_MOHAN_SAHAY_DESC: "In his youth, Anand Mohan Sahay was a follower of the Brahmo Samaj, a monotheistic Hindu reform movement that condemned idol worship. He and his friends stood before an idol, intent on smashing it; at the last moment his friends were overcome by fear, but Sahay strode forward and smashed the idol to pieces, watching the others flee.\n\nWhen the young independence activist Sahay set out for the United States, the British revoked his passport, and he went into exile in Japan. In correspondence with Nehru and Rajendra Prasad, he received a hard piece of advice: contact other activists, seek help from the Japanese, and contribute to the independence cause. Sahay took the advice and settled in Kobe. Through the network of Indians in Japan and Anglo-Japanese publications, he became the foremost voice of the Indian liberation movement in Japan after Rash Behari Bose.\n\nAs Subhas Chandra Bose's secretary and foreign minister, Sahay traveled with his leader to Singapore, Burma, Bengal, and Delhi, building contacts with all sorts of people. While others were still nervously hoping that Indians would be treated equally, Sahay was already demanding equality. He spoke with neglected people, honed his rhetoric and interpersonal skills, and eventually achieved his wish.\n\nNow, Sahay is responsible for all of India, and his conviction in India's thorough transformation has never wavered. He supports Bose's anti-colonial struggle but also advocates closer ties with Japan and Manchukuo."
 AZH_The_Crossroads_of_the_Subhasist_Revolution: "The Crossroads of the Subhasist Revolution"
 AZH_The_Crossroads_of_the_Subhasist_Revolution_desc: "Calcutta is the birthplace of the new revolution, rooted in nationalism and secularism, driven by the disciplined cadres of the Hindustan Samyavadi Sangha, pushing an irresistible modernization. Subhasism is the slogan of the new nation, and until India is no longer threatened by war, the Sangha will stand guard over Subhasism and all it entails. The Party is the nation, and the nation is the Party."
 AZH_A_New_Hammer_for_Old_Problems: "A New Hammer for Old Problems"
 AZH_A_New_Hammer_for_Old_Problems_desc: "Bengal was already moving toward unification when the new government was formed, but landless peasants desperate for a livelihood remain overburdened; meanwhile, the northeast is full of insidious turncoats who pretend to submit while sabotaging from within, corroding the nation's unity at every turn. Inspired by the Manchurian model, the Hindustan Land Reconstruction Authority seeks to resettle rural poor into state-organized cash-crop production zones, hoping to solve both problems at once. Though this has enraged the northeast's rebels and even provoked armed clashes, the state's control over border regions has been strengthened - for now, the situation remains in hand."
 AZH_The_Old_Ghosts_of_Communalism: "The Old Ghosts of Communalism"
 AZH_The_Old_Ghosts_of_Communalism_desc: "For all of Bose's ideals, the shadows of India's past still lurk behind every attempt at the future. The caste system remains pervasive; religious conflict seems to have quieted, but every gesture toward secularism arouses suspicion. In the northeast, rebels seek to split the national territory; elsewhere, language-based regional movements are growing. The ghost of communalism haunts the people endlessly, unless we exorcise it forever - and with each passing day, the temptation to destroy it by force grows stronger."
 AZH_Thirteen_Years_of_Progress: "Thirteen Years of Progress"
 AZH_Thirteen_Years_of_Progress_desc: "When British India faded away, India was nearly two hundred years behind the developed world. Thirteen years later, the giant is awakening, and millions pour into factories and farms. So far, Free India's five-year plans have focused entirely on developing military heavy industry, making massive investments in schools, hospitals, and other needs of modern society, and fostering an export-oriented economy that supports settlers in the northeast.\n\nNow, the third five-year plan has slowed military-industrial development, instead seeking to replace Japanese consumer goods and raise living standards. However, should a more urgent need arise..."
 AZH_Frontline_of_Anti_Imperialism: "Frontline of Anti-Imperialism"
 AZH_Frontline_of_Anti_Imperialism_desc: "Both Tokyo's watchful bureaucrats and the struggling masses of the oppressed world gaze at one man - Subhas Chandra Bose. He represents the hope of a strong, independent partner in Japan's New Order, and the vitality of an anti-imperial icon: resisting power with force and liberating the people.\n\nTo the west, Calcutta sends weapons and volunteers to colonial struggles; to the east, it stands with the Co-Prosperity Sphere through thick and thin. These two forces are arguably contradictory, held in balance only by Bose's personal charisma. But time will tell which side Free India truly stands on."
 AZH_Old_Wine_in_a_New_Bottle: "Old Wine in a New Bottle"
 AZH_Old_Wine_in_a_New_Bottle_desc: "The great leader has passed, and his chosen successor, A. C. Chatterjee, proudly continues down the road the leader paved for the nation. Previous policies worked, and change would be foolish; the nation will continue its close cooperation with Japan to achieve economic autarky. State-directed heavy industrial development, political control of trade unions, and a degree of economic planning will be the core policies, leading the nation into its most glorious era."
 AZH_A_Gentle_Leviathan: "A Gentle Leviathan"
 AZH_A_Gentle_Leviathan_desc: "In Raghavan's vision, India will be thoroughly remade around economic development and social welfare. Raghavan intends for the state to lead the expansion of education, healthcare, and infrastructure, supported by central economic planning and close cooperation with emerging financial backers in the Southeast Asian bamboo network; India will flourish, preserving its national and cultural roots."
 AZH_The_Revolution_in_Sight: "The Revolution in Sight"
 AZH_The_Revolution_in_Sight_desc: "The heroine of the Rani of Jhansi Regiment is convinced there is only one path for the nation's future - revolutionary socialism. She will dismantle entrenched hierarchies, seek comprehensive wealth redistribution, and place power in the hands of working men and women across the country, building a truly equal society.\n\nThough Captain Lakshmi's deep-red policies have won fanatical support from the oppressed, they have inevitably aroused Japanese suspicion, tempered only by her own experiences and fiery personal prestige. If Tokyo decides the revolutionary is a closet Marxist, her time in office may well be shortened - painfully shortened."
 AZH_Everything_According_to_Plan: "Everything According to Plan"
 AZH_Everything_According_to_Plan_desc: "Bose's staunchest soldier will steadfastly uphold what he sees as the leader's legacy, and India will be remade under comprehensive national planning and the ambition to challenge nature through labor. His government will pour vast resources into monumental construction projects and vast industrial complexes, advocating secularist and modernist domestic policies that treat tradition as a pleasant memory from the past. India will break barriers, split the atom, and reach for the skies, shedding the shadow of British imperialism once and for all."
 AZH_A_Thousand_Promises: "A Thousand Promises"
 AZH_A_Thousand_Promises_desc: "The Azad Hind Fauj has spoken, and no one dares oppose it. Singh's 'provisional' military government is in power, India's future is uncertain, and promises of liberalization and socialism remain vague. Some expect the state to deregulate, with private companies growing under military protection; others predict welfare-state policies will continue to deepen to pacify the people. Only one thing is certain - with the military in power, the apolitical tradition inherited from the British is dead. From now on, every civilian government must tread carefully under the watch of the military, which sees itself as India's protector."
 AZH_Nation_and_Labour: "Nation and Labour"
 AZH_Nation_and_Labour_desc: "Under Guha's leadership, India's economy will revolve around the great cooperative: partnership between industry and labor organizations. Trade unions and workers' councils will play a central role in decision-making alongside state planners and technocrat advisors; labor interests will not only be represented, they will actively participate in key decisions. Though Japanese advisors object to the new bureaucratic apparatus for intervening in the economy, in other words, they have simply discovered resistance to their attempt to absorb another developing nation into their orbit."
 AZH_The_Inheritance_of_Doctrine: "The Inheritance of Doctrine"
 AZH_The_Inheritance_of_Doctrine_desc: "Another Bose continues in power, and that is that. Amiya Nath Bose has continued the late leader's personalist interventionist policies, bringing every sphere under government control. He has promoted trusted allies to the new cabinet, advancing his agenda at others' expense. Beyond that, young Bose is following his uncle's footsteps in seeking populist support. Though mild-mannered and lacking his uncle's force, he will gradually use populist policies and periodic rallies to ensure that his party, centered on him, remains in power."
 AZH_Only_the_Best: "Only the Best"
 AZH_Only_the_Best_desc: "The state is a machine, and who better to run it than the army? Military discipline combined with civilian expertise will forge India's new economy. Skilled technocrats and experienced military planners jointly manage strategic industry; infrastructure projects and industrial expansion will be supported, driving economic output and national security to new heights. Critics may say the state is drifting toward civilian dictatorship, but the people can see what it truly is - an efficient path to modernization."

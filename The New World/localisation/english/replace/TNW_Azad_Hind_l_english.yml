 POLITICS_SUBHAS_CHANDRA_BOSE_DESC: "It seemed that fate had arranged for Subhas Chandra Bose to be born into a family loyal to British rule, becoming one of the countless 'natives' without whom the British could not control the subcontinent. Yet, on the verge of successfully entering the prestigious Indian Civil Service, he gave up everything to fight for a greater cause - his beloved suffering motherland, India.\n\nAs one of the young, energetic, left-leaning voices in the Congress Party, he called for faster, more radical action. Though elected to govern Calcutta and assume the Congress's highest office, Bose soon found himself at odds with the party's slow-moving, conventional leadership. When war broke out, the British, fearing he would undermine British India's rule, placed him under house arrest - but he escaped in a scene from a movie, disguised and made his way to Afghanistan. With German help, he traveled to the Soviet Union. Finding the European powers unwilling to help, he finally turned to Japan for aid, organized an army of Indian prisoners of war, and declared he would march on Delhi. Almost at the same time, British India's rule collapsed.\n\nWhen invited to form a coalition government, Bose accepted gladly. But he was blamed for the failure of the Afghan War and nearly imprisoned again. By now, however, Bengal and the east were loyal to the Hindustan Samyavadi Sangha, not Congress, and he escaped once more. Now he waits, determined to march on Delhi again, whether by peace or war. The moment that will decide all India's destiny is approaching, and he will be the one to lead it."

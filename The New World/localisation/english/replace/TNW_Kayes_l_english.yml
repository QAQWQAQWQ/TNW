 KAY_idea_islamic_influences: "Islamic Influences"
 KAY_idea_islamic_influences_desc: "The experiment of secularism has been tried, and it has failed. It may work for other countries, far away from here, but for Mali, it is simply unfeasible. The old kingdoms held Islam at its core, and it made them strong, so it shall make modern Mali strong as well.

The Kayes Government holds Islam at its cornerstone, socially as well as politically, and it is all the stronger for it. When Mali is reunited, Islam will form the glue that holds the nation together, a strong foundation upon which to build."
 KAY_idea_decentralized_high_command: "Decentralized High Command"
 KAY_idea_decentralized_high_command_desc: "The Kayes' government is not some absolute regime underneath Traoré, in spite of what one may initially assume. Forged out of the will of many disaffected Malian officers, said officers now hold a great deal of influence and sway, equal to Traoré's own.

This is obviously a nightmare in terms of chain of command and logistics, with every general making use of their independence to pursue their own personal aim, and constantly wrestling over logistical primacy over their peers. If the government is to survive, Traoré will need to find a way to rationalize the high command."
 POLITICS_MOUSSA_TRAORE_DESC: "Moussa Traoré is not a very loyal man, but he has three loyalties. He is a proud Muslim, a friend of the French, and an anti-communist. His militiamen take this to heart, which is why he declared against the Malian government and Keïta's rat, and now he holds high the torch against the socialist threat in the southwest.

Traoré was born in a village called Sébétou, three years before the European war began and four years before the continent fell. He joined Keïta's militia at age 16. The older militiamen taught him the true essence of Islam, and as Traoré rose through the ranks of the army, he grew to dislike the progressive Keïta. He also developed a certain sympathy for the French. Occasionally, he would show up with a pouch full of French firearms, claiming they were taken in a carefully planned raid — but his ragtag local militia knew better: he had been trading with them all along.

As time went on, Traoré and his militia consolidated power in the northwest, the region Keïta once controlled. As more and more people flocked to the new government in the city of Kayes, Traoré's influence grew steadily. Before it was too late, Traoré proclaimed the founding of another Malian state independent of Keïta's control. Now the game begins: Traoré will crush the socialist scum, and the light of Allah stands firmly on his side."

 POLITICS_RUHOLLAH_KHOMEINI_DESC: "Ruhollah Khomeini has been in exile for over a decade. In that time, his legend has only grown. Unlike the Nazi-backed imperial military junta and the American-backed "democrats," Khomeini's base of support is the Iranian people themselves, and his power comes from their desire to cast off the yoke of foreign oppression and live according to the will of the Most Merciful God.

Khomeini's vision for Iran is the "Guardianship of the Jurist" (velayat-e faqih), where a council of learned Islamic jurists guides the nation's course. To his enemies' surprise, the Ayatollah has proven himself a pragmatic man, willing to form or break alliances with any center of power whenever he sees fit. To his supporters, inspired by his taped messages, Khomeini is capable of anything. To the religious, he promises a return to Islamic values; to the nationalists, he promises an end to the support given to their enemies by "Jewish agents" and "foreign serpents." To the young, the Ayatollah promises hope and a better life. As for his true role in the Iranian revolution, perhaps only God knows."

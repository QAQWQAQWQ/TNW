 POLITICS_JEAN_BAPTISTE_HACHEME_DESC: "Jean-Baptiste Hachème was born into a Fon family in Porto-Novo, French Dahomey. When the French colonists hastily withdrew, he was but a boy. He grew up in the relatively stable and well-functioning Republic of Dahomey, and once took pride in being a citizen of a democracy. Yet as the republican government continued its dealings with the Free French in Abidjan, public trust in the government steadily eroded. By the time Hachème was promoted to general, discontent in the ranks finally boiled over into a bloodless military coup — an action that was supposed to be led by the respected General Christophe Soglo, aimed at severing ties with the former colonizer. Unexpectedly, Soglo and the other senior generals collectively refused to take power, leaving the presidential throne vacant and the army split into coup and anti-coup factions. In the deadlock where no one would take on the responsibility, the coup faction nominated Hachème as president. At 32 years old, he reluctantly accepted the appointment, and thus began his political career. This decision would soon become his nightmare.

The fledgling Dahomean regime teetered on the brink of collapse amid multiple crises: the anti-coup faction, led by the popular Soglo, continued to threaten Hachème's controversial rule; the people still longed for the relative freedoms of the old republic; and Hachème's influence in the army was far inferior to Soglo's. The fate of this small West African nation seemed doomed to be short-lived.

But Dahomey is ultimately a dream woven from the hopes of the oppressed, an attempt to bridge the tribal rifts created by the European powers. Even if the dream seems futile, Hachème is willing to burn his life in its realization."

 GBE_idea_ghosts_republic_dahomey: "Ghosts of the Dahomean Republic"
 GBE_idea_ghosts_republic_dahomey_desc: "According to the official narrative of the new government, the recent coup was born from the people's thirst for change, and Hachème and his faction dutifully answered this call. Similarly, the old Republic of Dahomey was nothing more than a den of corruption, serving the wealthy elite while ordinary citizens struggled to survive under German bombs. Yet one need only walk the streets of Lomé to see that the public's view is far removed from Hachème's rhetoric.

Yes, they admit the republic had all sorts of problems, but at least it dreamed of a stable and prosperous future. At the very least, the system was fair back then — unlike this government, which favors Dahomeans. The Hachème regime must deal with this dissent quickly, for a people who broadly long for the old government will find a way to bring it back."
 GBE_idea_militia_based_army: "Militia-Based Army"
 GBE_idea_militia_based_army_desc: "During the war, everything available had to be harnessed to serve victory. Usually, pressing problems were avoided, and only stopgap solutions were adopted. After all, every faction was fighting for survival, hoping to emerge from the bloody chaos on top. Babangida made just such a deal with the devil when the militia problem first reared its head early in the war. Faced with the dilemma of either letting the war be dominated by militias controlled by rogue generals and the government, or reforming the army into a formidable force while fighting, Hachème made the rational decision: he chose to let time dilute the situation. But now that the dust has settled, the reckoning has arrived.

This once-united alliance has fractured, and factionalism and corruption spread ugily among generals and rank and file alike. If nothing is done, Dahomey will have an armed force that looks less like an army and more like a mob. If the nation still wants to defend itself, no matter how painful the reform must be, it is unavoidable."

 KRS_wild_promises: "Wild Promises"
 KRS_wild_promises_desc: "Since the successive collapses of the Soviet Union and the Central Siberian Republic, the people have been somewhat distrustful of the government we subsequently established. To win support, President Andreev has made wild promises, thundering in every speech about delivering all kinds of social, political, and economic reforms. Though the Chairman can still keep them in line for now, the people will soon demand that promises be kept. The actual state of this country is more dangerous than what we tell the people; the path beneath our feet is narrow and treacherous, but if we succeed, perhaps those promises might actually be fulfilled."
 KRS_military_guided_democracy: "Military-Guided Democracy"
 KRS_military_guided_democracy_desc: "The civil-led democratic system of the Central Siberian Republic failed to prevent total social and military collapse. Having experienced this firsthand, we have adjusted our system to ensure power is shared between military and civilians. The presidency is held by the Army Chief of Staff, who is appointed by the General Staff, while the Prime Minister and National Assembly are democratically elected by the people. However, any new civilian government must be approved by the President — that is, the military — and the military can dismiss the government and the laws at any time."
 KRS_treasonous_traditions: "Treacherous Traditions"
 KRS_treasonous_traditions_desc: "Our officer corps first defected from the Red Army, then launched a coup against the Central Siberian Republic. This tendency, this willingness, has become ingrained: any regime that threatens their future and interests will face their rebellion. Now our young republic has taken its first steps, and the phenomenon of military intervention in politics grows ever more obvious. Many fear we will repeat the mistakes of the past.`n`n§RIf the military grows dissatisfied with the government, it may decide to take action.§!"

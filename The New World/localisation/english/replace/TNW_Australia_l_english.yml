 AST_The_Curlew_Cries: "The Curlew Cries"
 AST_The_Curlew_Cries_desc: "Australia was not formed by a people settled here since time immemorial; it is a nation of immigrants. The Aboriginal peoples and Torres Strait Islanders within our borders were once the masters of this land, yet have now become a minority, denied the rights and待遇 enjoyed by most Australians. In the census, they are not even counted as people. Arguments over this festering sore have run through Australian politics and society for decades, and as time passes, the problem only grows worse."
 AST_A_Nation_of_Many_Differences: "A Nation of Many Differences"
 AST_A_Nation_of_Many_Differences_desc: "Save for the few Aboriginal peoples who remain, Australia has no single nationality to speak of. Quite the contrary: our citizens come from everywhere - Irish and Russian immigrants dwell here, Dutchmen walk alongside Greeks and Englishmen. No one can say what Australia actually is. Since Australia broke from Britain's rule, many have asked: should we go our own way, or hold to the traditions of our forebears?"
 AST_Hes_Coming_South: "He's Coming South"
 AST_Hes_Coming_South_desc: "Across the ocean, our enemy lurks and waits. In the Second World War, we fought a desperate battle against the Japanese tide of invasion, never letting them set foot on Australia. Yet 'He' still waits and watches in secret, His mighty armies and savage hangmen restless. Australia must stand ready, lest 'He' comes south again."
 AST_joh: "Luck Runs Out"
 WORLD_AST.1.t: "[Get_newspaper_header]Australian PM Resigns"
 WORLD_AST.1.desc: "After political graft scandals involving several senior cabinet members came to light, Australian Labor Prime Minister Kim Beazley has formally announced his resignation. Hundreds of thousands of dollars reportedly flowed into marginal seats to secure results favorable to Labor. Beazley himself was not implicated, but says he failed to inspect the party with an 'absolutely honest searchlight' and so steps down.\n\nProminent Labor left-winger Dr. Herbert Evatt has been interim leader, taking over as Prime Minister. The eccentric former High Court justice will head the government until the caucus elects a new leader for an early election. Yet Labor polls poorly nationwide, and Evatt's health is failing; people wonder whether Labor can hold onto power.\n"
 WORLD_AST.1.a: "Don't let the door hit you on the way out."
 WORLD_AST.2.t: "[Get_newspaper_header]Cameron wins Australian early election!"
 WORLD_AST.2.desc: "As one of the few OFN states within Japan's Pacific sphere, Australia's election interests both Washington and Tokyo. With times troubled, voters preferred to back a candidate they could trust. It is no surprise, then, that Clyde Cameron won.\n\nCameron is a notorious pragmatist in the Labor Party, made candidate by allies in the party machine. Though victory is won, he has many hurdles to clear before settling in on Adelaide Avenue. True, his party was struck by a scandal only months ago, giving opponents ammunition; but by stressing the uncertainties of the 'Cold War,' he won broad support. Many watch to see what the seasoned MP will do now that he holds power.\n"
 WORLD_AST.2.a: "Sunburnt country, forever united."
 WORLD_AST.3.t: "[Get_newspaper_header]Arthur Calwell elected Australian PM!"
 WORLD_AST.3.desc: "It seems Australia's new wind is not as new as people thought. Though the scandal broke only two months ago, Labor won again, and the party's intrigues and campaigns put an old man of Labor's 'Right' forward as prime ministerial candidate.\n\nArthur Calwell has won Australia's latest early election. While the world's great powers watch the new government's still-unclear foreign plans, Calwell has already set his domestic policy: full freedom for the unions in Australia's factories, and defense of the White Australia Policy. To make MPs vote for his policies, Calwell will use every means, not least his silver tongue. A new wind blows across Australia, bringing good tidings to the bottom of society.\n"
 WORLD_AST.3.a: "A socialist for White Australia? Absurd!"
 WORLD_AST.4.t: "[Get_newspaper_header]John Gorton elected Australian PM!"
 WORLD_AST.4.desc: "Most Australian politicians are either doddering old men or what the Germans call 'old fighters,' yet the results show voters decided to give the hot seat to a new face. Liberal John Gorton came first, elected the new Australian Prime Minister.\n\nGorton, a newcomer, shares the ideology of a handful of domestic politicians. He plans to push social progress and individual rights, while strongly supporting an independent economy and Australian enterprise. For US economic policymakers seeking stronger Australian-American ties, this is surely bad news. If this is a small setback for the OFN, it is a major disaster for Tokyo. Gorton has pledged firm opposition to the Empire of Japan, and relations between the two have soured fast on the remarks. Only time will tell what Gorton has planned for the 'southern continent.'\n"
 WORLD_AST.4.a: "Hope he knows what he's doing."
 WORLD_AST.5.t: "[Get_newspaper_header]Paul Hasluck wins Australian early election"
 WORLD_AST.5.desc: "Paul Hasluck was once seen as the black sheep inside and outside his party, yet recent results show fortune favored him. A supporter of old-style Tory paternalism, he sat in the Liberal Party - a contradiction in itself. Since the Liberal mainstream favors devolution from Canberra and more weight on individuals and states, Hasluck's victory marks a shift not only in Australia the nation, but in the base of Australian politics.\n\nIn this upset, Australia chose to look backward to solve today's problems. In his victory speech, Hasluck said society today 'lacks unity,' and pledged to 'bridge divides' and thoroughly 'solve society's problems.' He also promised that 'every citizen will help one another from the heart.' Yet dissent has already appeared within his own party; whether he can get his bold plans through parliament remains to be seen.\n"
 WORLD_AST.5.a: "Seems he really is lucky, as his name says."
 WORLD_AST.6.t: "[Get_newspaper_header]Australian Constitution destroyed!"
 WORLD_AST.6.desc: "Australian PM Joh Bjelke-Petersen did the unthinkable: on live national television, he used scissors to cut a copy of the Australian Constitution to shreds, then announced his government would no longer be bound by it. He called the Constitution just 'another plaything of the elites,' and declared a new era of 'good governance' for Australia. Observers note Joh's appalling act makes his history of media manipulation and cronyism pale by comparison, and marks a tipping point for this controversial government.\n\nAt this historic moment, riots erupted in every major city across the continent. Labor and the Liberals issued an unprecedented joint statement condemning Bjelke-Petersen as 'a totalitarian who looks just like Adolf Hitler.' Police fanned out nationwide to hunt unruly protesters and Joh's opponents. A 'dawn' is rising over Australia - one that threatens to scorch everything it touches.\n"
 WORLD_AST.6.a: "Australia's decline begins here."
 WORLD_AST.7.t: "[Get_newspaper_header]Joh Bjelke-Petersen elected Australian PM"
 WORLD_AST.7.desc: "The controversial former Queensland Premier Joh Bjelke-Petersen's Country-Liberal coalition won a narrow victory in Australia's most polarizing federal election ever, surprising many. Bjelke-Petersen is known for arrogant manner and crushing protests and strikes; his critics call him a populist and a breaker of political rules, though he seems happy to take the labels. Running on a highly publicized anti-socialist, conservative platform, observers say much of Joh's support came from backlash against the previous government.\n\nThe new PM cheerfully declared Labor's 'communist conspirators' would not be back in the premiership 'any time soon,' and courted controversy with the remarks. Some Australians worry Joh won't be leaving anytime soon.\n"
 WORLD_AST.7.a: "That's none of your business!"
 WORLD_AST.8.t: "[Get_newspaper_header]Australia tests its first nuclear weapon"
 WORLD_AST.8.desc: "The Maralinga test site in South Australia has drawn close attention from both the Co-Prosperity Sphere and the OFN. Australia has just successfully detonated its first nuclear weapon under its nuclear program. PM [AST.GetLeader] promised during the campaign to develop the country's nuclear arsenal afterward, naming Japanese regional hegemony as Australia's external threat. The blast at Maralinga formally makes Australia the world's [GetNuclearPowerRank]th nuclear power - reassuring for its own people, but worrying for others. Whether Australia received foreign help in developing nuclear weapons is not yet known.\n\nThe Japanese Foreign Minister has condemned the test as 'an extremely dangerous provocation.'\n"
 WORLD_AST.8.a: "The red bloom makes the outback look pale..."
 WORLD_AST.9.t: "[Get_newspaper_header]Australian PM abolishes nuclear arsenal!"
 WORLD_AST.9.desc: "Australian PM Jim Cairns announced today that his government has abolished the country's fledgling nuclear arsenal. Cairns, elected PM in 1968, is a socialist activist of strong anti-nuclear views, and his supporters are cheering the development as a welcome result of years of campaigning.\n\nEven so, Australia's allies have expressed shock at the abrupt shift in nuclear policy, and many Australians see it as a waste of millions in research funding, highlighting what local officials call the nation's 'blind idealism.' Meanwhile, senior US diplomats say Cairns's decision weakens the OFN's Pacific military posture. Japan, for its part, reacted positively, with the Foreign Minister praising the PM's contribution to regional peace."
 WORLD_AST.9.a: "Unprecedented, perhaps."
 WORLD_AST.10.t: "[Get_newspaper_header]Australia signs Polaris purchase deal with US"
 WORLD_AST.10.desc: "Australia has signed a historic agreement with the United States allowing Australia to purchase Polaris A3 submarine-launched ballistic missiles. Under the deal, the US will provide materials and systems for Australia to build a sea-based nuclear deterrent and consolidate its first-strike capability. The agreement also allows Australian shipyards to build four US Benjamin Franklin-class ballistic missile submarines, plus several naval exchange programs and training for new submarine crews. The first boat is expected to enter service in the mid-1970s, with a 30-year service life.\n\nCo-Prosperity diplomats have slammed the deal, saying it raises tensions in the Asia-Pacific and increases the risk of nuclear war."
 WORLD_AST.10.a: "Dangerous currents in the Emperor's sea."
 AST_scripted.12.t: "Australia wants to buy submarine-launched ballistic missiles"
 AST_scripted.12.d: "[USA.GetLeader] tapped the hard wood of the Resolute desk with the end of his pen. The question foremost in his mind: this decision might jolt the Doomsday Clock forward by several hours. 'Australia and nuclear weapons...' the topic had already worn [USA.GetSheHe] out. The proposal to sell Australia strategic missile submarines was first raised months ago; now the formal talks with the Prime Minister are only a week away. The meeting will settle the matter, but the decision rests entirely with him - better to decide now than let the headache drag on.\n\nLetting Australia have nukes was already a risky move; now adding a submarine platform? It would surely hit Japan hard, but would it cross a threshold? If Japan retaliates and disaster follows, news of Co-Prosperity nuclear deployments in Southeast Asia is not what the public wants to hear. On the other hand, giving an OFN member real self-defense capability might win voters who care about international affairs.\n\nThe tapping stopped. [USA.GetPresidentLastName] turned the pen over and wrote [USA.GetHerHis] decision on the memo."
 AST_scripted.12.a: "What's an American if he won't take a risk? Sell."
 AST_scripted.12.b: "Better safe than sorry. No."
 POLITICS_HAROLD_HOLT_DESC: "For Harold Edward Holt, the recent appointment as Prime Minister of the Australian Republic is yet another feather in a long and full political career. Born to a landowning family in Sydney, Holt entered politics young as a member of the Young Nationalists (the youth wing of the United Australia Party). At 27, he was elected to parliament, the youngest MP of his day. Soon, as a protégé of Robert Menzies, Holt carried on his political career through the war, rising among the ranks of the Australian Liberal Party - the new party founded as the UAP's successor.\n\nThe Great War proved a heavy blow for Australia. After the senseless war ended in bitter defeat, the nation lost not just a generation of brave young men; as the Empire of Japan's rising sun climbed over the Pacific, its scorching rays left Australia with a burn that would not heal. As Nazi troops set foot on Britain and calls for change rang out, Canberra cut the ties to London in the face of political crisis - and the new Australian Republic was born. The young republic's politics were first dominated by Labor, but Holt soon stood at the head of the opposition, and finally led the Liberals.\n\nIn the 1961 election, the Liberals won enough support, and Holt was at last elected Prime Minister. Holt's reform platform - pledging to reaffirm economic and military ties with the OFN, shore up the national economy, and end the White Australia Policy once and for all - won the nation. Yet only time will tell whether the vision he drew, of a free, prosperous and fair Australia, is destined to become real."
 POLITICS_KIM_BEAZLEY_SR_DESC: "In a brighter age, Kim Edward Beazley might be called a guardian of education. Like a crusader, he saw illiteracy and ignorance in the 'sunburnt country' as a plague and fought it firmly. In that fleeting future, Beazley might have had no taste for the premiership. He would have been content with his seat in the House, shaping himself as a latter-day Cicero, meeting opponents with wit and passion on the shining hilltop of the city.\n\nYet this is no age of peace. Australia stands on the edge of Tokyo's sphere. A whole generation of young men lies as corpses in the Papuan jungle; even Charon's comfort of victory cannot soothe their ghosts. Happily, logistics became the invader's nightmare, and the southern continent was spared conquest, kept from the Japanese bayonets. With only a fragile lifeline to the United States, many wonder: can Australia survive, can it fight again? Will it, like East Asia, yield to the sun's blinding rays? Or is the greatest enemy at home?\n\nThe cost of standing alone is fearsome; the new PM clutches Washington's warm embrace. After all, Britain's throne has been usurped by a false king; why should Australia not walk with the last hope of freedom? Beazley turns his back on the past and faces the future, crying aloud:\n\nAustralia, move forward!"
 POLITICS_ARTHUR_CALWELL_DESC: "Support for the White Australia Policy has slowly waned over the past two decades. The racist laws once meant to keep Australia as the British outpost in Oceania have been repealed one by one by the reformers of a new age.\n\nThey are literally a political sickness!\n\nArthur Augustus Calwell is federal parliament's staunchest defender of White Australia. By his reasoning, Africans, Asians and mulattoes are equal to whites so long as they stand on their own soil, yet become waste the moment they set foot on Australia. Any nation that takes the evil road of racial mixing will destroy itself, however strong. On this theory, Calwell insists he is no racist, but is proud of his skin - as anyone should. Critics mock him for it, but in his eyes they are mere mice.\n\nOf course, Calwell always believes his own views above all. He says the media has twisted his image - was it not he, the worker, standing in the tray of a pickup truck, giving speeches in remote towns about the need for rural hospitals? Was it not he, the self-educated trade unionist fluent in Chinese, who opposed overseas wars? Was it not he, the socialist for welfare and high wages, always looking out for his community?\n\nBut all of it vanishes at the color line. In the smoke-filled bar of Parliament House, Prime Minister Calwell raises his glass, grins at his colleagues, and says: 'Two yellows don't make a white.'"
 POLITICS_JOHN_GORTON_DESC: "A party full of economic liberals, yet its voice lies with an unruly moderate. Australian PM John Grey Gorton is unusually self-aware; passing through parliament's long corridors, he once overheard party rivals mocking that his policies would slowly lead the nation toward socialism, calling them 'Gortonism.' They said his policies grew like mushrooms, in the dark, feeding on garbage. Hearing this, Gorton smiled, then leaned in and asked if he could join. So his supporters call him 'the Spore Chief.'\n\nJokes aside, Gorton knows full well he stands alone. He is an economic nationalist and social liberal, with a heavy drinker's capacity and an eye for women. Thanks to these odd traits, he is seen one day as a threat and the next as a clown. Yet those who mock Gorton do not know that their mockery cannot wound him, because he has known harder times: they have never survived a plane crash, never had a mother long in a nursing home, never known what it is to lack a mother's love as a child; they have never had to stand before the cameras and smile with a face full of scars.\n\nGorton believes his task is to bring progress to a nation content with political Luddism; yet he foresees the dilemma, in office, of whether he can delegate that task to cabinet. Perhaps this is his last term."
 POLITICS_CLYDE_CAMERON_DESC: "Clyde Cameron stands at the crossroads of Labor's old and new wings, wondering which way the wind will blow. He smooths his hair, scratches his neck, and thinks on future trends. He flips through his diary - kept daily since he joined the caucus, filled with times, votes and barbed remarks. He runs through every figure on the Australian left, from party elders to newcomers running student organizations, then makes up his mind: Labor needs a new strategy and new leadership.\n\nClyde Cameron was once a reckless Labor man, growing into a cool, hardworking and vengeful seasoned politician, respected by all sides of parliament. Within Labor, he often proposed abandoning the old electoral alliance and changing with the voters' mood. Yet beneath his surface pragmatism lay firm, far-reaching socialist ideals. He dreamed of an Australia where workers lived well, tolerance overcame prejudice, and peace endured; no one could make him give those up.\n\nOnly socialists can realize such ideals. Cameron knows parliament finds him harsh and picky, and suspects ASIO and the CIA are watching him. If he cannot finish his work, then the energetic man will educate Australia's next generation of socialists, pinning his hopes on them. Though he is merciless to enemies, he never hides his admiration for those who fight for a better world, or for the fight itself."
 POLITICS_PAUL_HASLUCK_DESC: "Paul Milner Cadwalader Hasluck has worn many hats: poet, politician, historian, and now Prime Minister, yet his career has always been built on giving his all for his ideals. Born to a frugal family in Fremantle, Hasluck wrote on public policy in newspapers under the pen name 'Polygon' in his early years. Many West Australians knew his support for forward defense and international governance long before they knew his real name. Yet after Hasluck entered the House of Representatives in 1949, many MPs found the man was in fact unfathomable.\n\nConsider what Hasluck's contemporaries said of him: scholarly, yet a bit prim; fond of nitpicking; dignified, well-read, quiet yet humorous; he prefers governing the nation to playing power games all day; he hates noise and clamor, liking things clear; he hates pushing work onto subordinates, preferring the thrill of doing it himself and the satisfaction of a job well done; he is demanding, occasionally sharp with subordinates; and last of all, he loves the Australian land deeply.\n\nThe red plains of the outback are now a distant memory. Yet even in the narrow, smoke-filled corridors of Parliament House, Hasluck often feels a wind carrying sand swirling around his ankles. Hasluck's task has never changed: to build for the people a society rich in freedom, individualism, respect, responsibility and resolve - and in the process, to let some people be 'assimilated.' Hasluck firmly believes this is his highest calling, for it was born of the common duty of all humanity."
 POLITICS_AUTHDEM_JOH_DESC: "Few imagined the laurels of the premiership would fall on 'Joh' Bjelke-Petersen; the news was 'unexpected' to say the least. Joh had few supporters; as Premier of Queensland he was often outspoken, dogged by scandals and accusations, and mainstream politicians clearly did not take him seriously. Yet this let him take over the Liberal-Country coalition and win the general election against all odds.\n\nYet Joh clearly does not care what the 'mainstream' thinks. The polio survivor won neither on the support of big business and millionaires (though he would not refuse free publicity if offered), nor on mastery of the fast-growing television and mass media (though the media did help him greatly). No - he won on something more basic, more primal. That is hatred. Hatred of the lofty elites. Joh is the prime minister of the ordinary people - who have had little say in parliament until now. Australia needs someone who can talk to ordinary people as equals, not look down from on high. People do not want to see the unions and the tax office fighting like cats and dogs, which only gives more people a chance to line their own pockets. If they still cling to the delusion of national unity, let them see how wrong they are!\n\nStale politicians and bureaucracies have raised heavy chains to stop Joh, but they cannot stop the people's march. Australia will become a home for all its lawful citizens, by whatever means necessary. Joh will push on, no matter how many rules he breaks or conventions he flouts."
 POLITICS_DESPOT_JOH_DESC: "Australia is sick, deathly sick. Millions in taxes only keep this tottering corpse on its feet, making the rotting establishment more immovable than ever. The blood and tears of the oppressed classes - that is what built Australia. Not to mention the Communist traitors and their fellow travelers in the ALP, who want our people to yield to their dying ideology, to Russian madmen with half a foot in the grave, to timid pacifists. And then there are the upper classes, yes, the upper crust. Canberra's elites sit in towers of steel, smoking imported cigars, decadent and carousing in backroom intrigues and claret. They pull puppet strings, play politics, and grind hardworking taxpayers under diamond-studded boots, laughing as they do. Where is this land heading?\n\nStop! Joh roars, stop! The Constitution is cut in two, lying at Joh's feet; the two scraps are like two vipers, and Joh will crush them by executive fiat. Opponents say on live TV that he destroyed the Constitution, that this is contempt for democracy, brazen. Fine, says Joh, fine. So fine that the ultimate symbols of elitism and the so-called 'idealism' bobbing in champagne are all on fire. So fine that the mainstream media, pockets stuffed with dirty money, sneers at him. So fine that no one in the whole country can stop him now.\n\nAt this hour, change descends on Australia. Whoever tries to resist Joh's new order will be ground under his boot and stamped to pieces. Police armed with lethal weapons storm the offices of impudent reporters. At dusk, the Country Party draws new electoral boundaries, tangled and scattered, to ensure Australia's democracy has only one winner. In traditional politics, corruption was always a dirty word; but in Joh's Australia, corruption appears like a curse, never far away.\n\nDark clouds gather over Australia, and everything beneath the sun will be §Rrewritten§!."
 POLITICS_EVATT_DESC: "Herbert Vere Evatt was once a brilliant star. Evatt was a lawyer of exceptional intelligence: he graduated from Sydney University with first-class honors in four subjects, won two university medals, and later took a doctorate in law. He became an industrial lawyer, then the youngest High Court justice in Australian history, and later Prime Minister as Labor leader. Yet Evatt's brilliant mind has rusted now.\n\nEvatt suffers both thrombosis and arteriosclerosis. Once he could remember everything, as if written in iron; now only a buzzing tinnitus remains. Many in Labor say Evatt's decline began before his mind rusted - when he first thought everyone else was drunk and he alone was sober. He made millions of decisions without consulting others; half succeeded, half did not. In parliament, Evatt can no longer keep pace with the others.\n\nEvatt swings between calm and frenzy, yet his mind is terrifyingly clear; he is sunk in the heart of the political mire, surrounded by Labor factions and Liberals. When parliament opposed White Australia, Evatt did not back them. As time passed, his mind began to deceive him, hinting that the facts he knew were wrong. Perhaps the good Evatt might have done has been done by others. Perhaps his reckoning will come sooner than he thinks.\n\nPerhaps his time is over."
 POLITICS_JOHN_MCEWEN_DESC: "John 'Black Jack' McEwen was grim as iron. The Australian PM spent his childhood in the cramped back room of a pharmacy. His mother died when he was two, his father at seven; at thirteen he left school to bear the burden of raising his grandmother and young sister. In 1918 he left his job to join the Australian Imperial Force against the Entente; though he saw no battle, his service earned him a government farm. He tilled the soil, turning wasteland into fertile ground, and joined the Victorian Farmers' Union - to him, just farming on a larger scale. The ladder to federal politics was laid.\n\nMcEwen rose fast in the Country Party: first a minister, then deputy leader, finally leader. Peasant protest was instinct to him; he only had to stand straight in a crowd and grip his rifle. In a party dominated by free-traders, he was known as an advocate of protectionist economics and rural-urban cooperation; his usually deep-waters temperament would suddenly burst into thunder when patience ran out. Now, having survived a full term as deposed PM, he stands like granite atop politics, facing the storm, trying to keep things calm with a stern face.\n\nYet the weight accumulates. Every quarrel, journey, labor, and year has worn him inside and out. Scaly cracks spread on the skin of his hands, feet and chest; wherever he walks, the ground cracks and bleeds. He changes his bandages by day and goes back to work - the nation demands it. Hard labor forges hard men, and John McEwen reckons Australia's hardest work should be borne by Australia's hardest man. A rough, solid life is a life worth living.\n\n§VWhen pain comes, bear it head-on.§!"
 POLITICS_GOUGH_WHITLAM_DESC: "Gough Whitlam was a towering giant - great of heart, great of mind, and carrying an even greater blueprint for reform. Through the sixties, the Australian PM almost daily raged at the stale social conservatives in Labor, hacking a path for a radical reform agenda. Even when threatened with expulsion by the leadership for breaking party discipline, he pushed on against the current. A man either breaks through the wall or is shattered against it, he said; he had no choice, for his conscience would not let him yield. He could not bear the status quo, for it was so absurd, so shabby. So, with a new generation of middle-class reformers, Whitlam broke through.\n\nAs PM, Whitlam carried moral fervor but crushed others by intellect. He was hard and aloof, with a condescending tone when consulted. Few in federal parliament could match him in debate or learning in the reform areas he chose. Opponents called him arrogant; Whitlam cheerfully owned it and called them fools back. When an enraged opponent asked how he would face his final judgment, he replied: rest assured - I shall meet you as an equal.\n\nWhitlam vowed to turn the parliamentary chamber into an anvil, forging progressive bills on it and hammering reactionary MPs into dust. No one should be made to suffer the creations of ignorance. He swore that within three years, Australians would have universal health care, free university, legalized abortion, Aboriginal land rights, freedom from conscription, and a constitutional overhaul establishing new fundamental rights. All this, Whitlam swore - and more - would be done when he broke through again.\n\n§P'They stand high; I soar above.'§!"
 POLITICS_WILLIAM_MCMAHON_DESC: "The telephone on Australian PM William McMahon's desk was a glossy, brand-new beige. Before him, calls to the PM's office had to be routed through operators in a hardwood booth in Parliament House's northeast corridor. Now, every call passes through McMahon, every scheme through McMahon's mind, every feeler from media barons reaches McMahon, every policy order comes from McMahon. The 'Tiberius of the Telephone' and the web of deregulation he has woven are now inseparable.\n\nAs the Liberal Party's economic expert, McMahon's obsessively detailed memos are read aloud on the floor of parliament, and have sparked countless heated debates in party rooms. Liberal MPs know they must parse the man's words carefully - true, he is an outstanding administrator and a learned economist, yet the half-truths, exaggerations and bare lies that leave his mouth are more common than the truth. He is stiff, tense, an indefatigable preacher of fiscal deregulation and balanced budgets, pushing incremental innovation wherever the budget allows. The real challenge: when bills come to a vote, how to make parliament trust this man who is always running off at the mouth.\n\nNow, William McMahon sits at his desk, tapping the receiver. He knows the caller will not trust him, and that taming both houses and public opinion will be like cutting fresh diamond. No matter. He has never minded pulling an all-nighter or two."
 POLITICS_MALCOLM_FRASER_DESC: "Malcolm Fraser was born to a Victorian sheep-farming family, originally destined to inherit the estate, and studied economics and philosophy for that end. Yet an encounter with the Young Liberals in Hamilton in the early fifties turned his life around, and the grazier's son was soon sucked into the whirlpool of Australian politics.\n\nHis party career was rough: he lost a preselection, then won it back the next year. Over the years, Fraser meshed like a gear into various party posts and cabinet seats, gradually building his power base. At last he won the leadership contest against Billy Snedden, and took the party's reins and the nation's course.\n\nPolitically, Fraser favors multiculturalism, supporting the idea of Australia as a haven for the oppressed peoples of the Co-Prosperity Sphere; he insists on continuing the welfare state, even when finances are tight. All progress must move at a cautious pace, and he will not disrupt the steady rhythm that carried him to the top. But above all, this hardline hawk on foreign policy is determined to keep fascism out of the country by every means."
 POLITICS_JIM_CAIRNS_DESC: "James Ford Cairns governs Australia at a time when the world has turned. The island nation's PM is determined to move with the times, and build the ideal country in his heart.\n\nCairns was raised on socialism, born into a family where his father died in the war. He served as a police officer from 1933 to 1944, then turned to Labor to continue his political career, moving between preaching socialism and fulfilling his duties as an MP - until the winds changed and he was suddenly carried into the PM's office.\n\nThe new PM calls himself a New Left socialist. An economist by training, he knows theory well but has not lost himself in it; his administrative ability is widely praised. He never changes his ways for others, and shows 'the real Jim' to everyone - usually polite, but blunt about what he wants.\n\nNo violent revolutionary, yet his firm beliefs, combined with open sympathy for the spiritual elements of Australia's counterculture, inevitably rub some traditional institutions the wrong way. But Cairns believes progress is possible despite resistance, and time will test the truth of his ideals."
 POLITICS_BILLY_SNEDDEN_DESC: "Billy Snedden was born to a poor family in Perth; his mother was illiterate, his father a fugitive from Scotland. Few would have bet on the boy going far, but he was never one to give up. At eight he was working odd jobs on construction sites with his brother; in 1942, at fifteen, he took a junior legal clerk's post and opened the door to politics.\n\nHe entered politics as a Liberal MP in 1954, serving in Robert Menzies' cabinet until his 1961 defeat. Moving to the opposition, he became Shadow Immigration Minister, making his name as both an efficient legislator and a hawk on international affairs.\n\nIn 1971 he boldly challenged the Liberal leadership. While most MPs saw him as a dark horse, Snedden not only beat the main contender Malcolm Fraser, but won the leadership by a landslide. In the election against Labor, he pledged to strengthen the foundations of Australian democracy.\n\nAfter a brutal campaign, he took the premiership, and his first agenda is reforming parliamentary culture. Skeptics say he will achieve little, but Billy Snedden is not the sort to retreat at the first setback."

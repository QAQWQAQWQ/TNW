 POLITICS_BAKHTIYAR_VAHABZADEH_DESC:0 "Bakhtiyar Vahabzadeh loved two things above all else from childhood: literature and the people of Azerbaijan. He dreamed of seeing his plays and poems published without fear of censorship or retaliation, and longed for the day when Azerbaijanis would govern their own country and serve their own people. When he first entered university, the Germans occupied Baku, rounding up 'partisans' indiscriminately (who were often just conscripted soldiers unwilling to grovel) and dragging them before firing squads or into the depths of the mines to die. Vahabzadeh escaped by luck and fled into the sparsely populated hillside villages, where the population had been overwhelmed by refugees.

Here, aside from the occasional horrific German bombing, life was normal. It was here that Vahabzadeh could begin writing poetry again, drafting on a makeshift typewriter and distributing it in neighboring villages. His eloquence and radical patriotism began to win him a reputation, and his works were recited in villages across the Azerbaijani countryside. When the partisans retook the cities from the Germans, they sang his poems in celebration.

Vahabzadeh's vision has finally become reality. Azerbaijan is free and independent. But more importantly, the people want him to lead the nation. Though he laments that this will delay his latest collection of poetry, he accepted the burden. Now, what he writes will be battle plans and laws, not just anti-German literature."

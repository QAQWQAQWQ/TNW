 KZR_Mikhail_Solomentsev: "Mikhail Solomentsev"
 POLITICS_MIKHAIL_SOLOMENTSEV_DESC: "Mikhail Sergeyevich Solomentsev is hard to define — or rather, he is nothing at all. To some, he presents himself as the only true communist in Kazakhstan, yet his marital scandals are clearly unethical. He denounces Kazakh chauvinism in every speech, yet his Soviet Group openly collaborates with far more radical chauvinists. If he never explains himself to the outside world, how can anyone understand what kind of person he is?`n`nThe answer is not as interesting as people imagine. Solomentsev was never a radical communist; he is a skilled tactician who has made many allies during his various postings. However, he regards his vision of the Soviet Union as the norm and standard, a view he has held since the later years of Stalin's rule, when he was first sent to Kazakhstan. To him, his love for Russia, Stalin, and the Soviet Union is essentially one and the same. All of this together constituted the Soviet Union, the greatest nation ever to exist. All of it belonged to them.`n`nAll Kazakhstan needs to do is recognize this fact."
 KZR_remnants_of_fitins_web: "Remnants of Fitin's Network"
 KZR_remnants_of_fitins_web_desc: "With the Russian military in disarray, they have had to make do with the remnants of Fitin's NKVD. This force, composed of reformed bandits, militiamen, and partisans, is loosely organized and lacks combat experience, yet it has spread terror through the surrounding countryside, with no shortage of rumors about its bloodthirsty nature."
 KZR_stomach_of_kazakhstan: "The Stomach of Kazakhstan"
 KZR_stomach_of_kazakhstan_desc: "Though most of Kazakhstan's industrial cities are not in Russian hands, they may possess an even more precious treasure. Across this land, endless grain fields fill their bellies; beneath the ground, rich resources fill their pockets with profit. Of course, all of this is built on land that has been... requisitioned. For now, their crumbling army at least eats well and is not short on pay — and this is only the beginning."
 KZR_despair_not_identity: "Despair, Not Identity"
 KZR_despair_not_identity_desc: "Though the former Soviet Union claimed that workers of the world belonged to one nation, the reality was quite different. Russians in Kazakhstan feel no attachment to their new homeland and refuse to abandon their nationalist feelings for their motherland. Though countless sign up for military service, few are willing to sacrifice themselves, and many are willing to betray their comrades for extra rations."
 KZR_any_flag_any_tactic: "Any Flag, Any Tactic"
 KZR_not_divided_but_torn: "Torn, Not Divided"
 KZR_the_soviet_group: "The Soviet Group"
 KZR_any_flag_any_tactic_desc: "As long as an idea grants legitimacy to his state, Shchelokov will agree to every policy proposed, obey any warlord, and seamlessly change his tune to defend everything in his camp. This makes him unfazed by any issue and consistently popular with the people. But it also fills his meeting rooms with wildly conflicting proposals. Hot-tempered individuals frequently clash over conflicting plans, while workers and soldiers stand idle as their leaders argue fiercely."
 KZR_not_divided_but_torn_desc: "Every bureaucratic agency is now in utter chaos. Departments fight over jurisdiction, and project funds appear and disappear in the blink of an eye. People's commissariats sway back and forth, unsure which government to pledge loyalty to. The idea of restoring even a semblance of order to the ministries is wishful thinking."
 KZR_the_soviet_group_desc: "To most Kazakhs, the Soviet Group was once a small faction irrelevant to their lives, but now it firmly controls every aspect of state power. Though the Almaty regime has long been buried, people still marvel at its sudden rise — but what surprises them even more is how quickly the Soviet Group established comprehensive control over the country. Though many oppose its rule and see it as a symbol of extreme Russian chauvinism, its enormous authority has left them unable to even touch the foundations of the new state."

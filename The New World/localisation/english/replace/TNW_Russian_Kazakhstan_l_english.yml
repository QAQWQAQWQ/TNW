 KZR_Nikolai_Shchelokov: "Nikolai Shchelokov"
 POLITICS_NIKOLAI_SHCHELOKOV_DESC: "On the vast steppes of northern Kazakhstan, Nikolai Anisimovich Shchelokov, a bureaucrat from Lugansk, found himself as chief of a regional police department in this foreign land — and the gears of fate began to turn. Shchelokov's path to promotion was intricate and complex, and he may not even have been qualified for these positions. Nevertheless, Russians respect and adore Shchelokov, because he protects the interests of Russian enterprises, generously rewards Russian public servants, and shelters Russian refugees sneaking across the border. Yet for some reason, Kazakhs are not so fond of him.`n`nThough closely tied to the Soviet Group, he does not seem loyal to Marxist ideals. He has always been outspoken and blunt, but few find any consistency in his political leanings. To him, the feeling of being in the spotlight, surrounded by crowds, and hailed by the masses is what matters most — and as for criticism, a few rubles will take care of that.`n`nWhen war broke out, he took command of the Russian Guard, a militia hoping to build a Russian-dominated state. Now, Shchelokov is not only a hero of Russia, but also a hero of the Union of Soviet Socialist Republics, the great red empire, the nation with the most comprehensive welfare system in the world. Whether this enigmatic man can unite his motley allies and bring this fraternal republic back into the embrace of the Soviet motherland remains to be seen."

 POLITICS_XIA_WEI_DESC:0 "Xia Wei is a man of utmost loyalty, and has always been so.

Since childhood, he has known and befriended Bai Chongxi and Huang Shaohong, and treated them with utmost sincerity. In the early twentieth century, the three of them weathered trials together, sharing hardships — first as classmates helping one another, then as comrades fighting side by side. He is utterly devoted to New Guangxi and everything it represents, throwing himself wholeheartedly into its struggle, actively participating in the campaigns against Chiang and the extermination campaigns against the Communists. Yet his loyalty belongs to something else as well, something to which his devotion is unshakable and unto death — China itself. After all, who can say that he did not fight for her in the National Revolutionary Army, resist the Japanese for her, and bleed for her during the turbulent years of the Anti-Japanese War?

Yet mere loyalty alone could not save China from being trampled under military boots. Fate was unkind, for before the Guangxi Clique was ready, before the 11th, 19th, 20th, 29th, 31st, and 38th Armies could launch their final victorious offensive to drive the Japanese Army out of the country, time ran out. When the die was cast, Xia Wei found himself the last remaining member of the Guangxi high command. In that moment, he felt utter despair. Japanese troops were drawing closer by the day, and he was forced to the negotiating table. There, he faced the ultimate choice: resist to the bitter end, or swear allegiance to the only legitimate government of the Republic of China on behalf of "free" Guangxi? To this, he could only respond with a bitter smile and a forced expression. They wanted his loyalty? Then they shall have it.

He gave them his signature, but never his heart. He never would. He would never pledge loyalty to a puppet, nor to the backstabbing Reds. He entrusted himself to a dream, to an eternal longing for freedom. That dream, that longing, would never die, until the day he ruled his native Guangxi with an iron fist. Crushing taxes and near-terrifying conscription weighed on the people? No matter. All of Guangxi became nothing but a war machine? No matter. What truly mattered was freeing China from foreign masters once and for all, so that she would never again grovel or be subjugated. Xia Wei is a man of utmost loyalty. He is devoted to the cause, utterly: no sacrifice is too great to achieve it.

For there is nothing else to which he can devote himself."

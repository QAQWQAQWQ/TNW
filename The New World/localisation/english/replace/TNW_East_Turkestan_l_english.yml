 etr.1.t:0 "The Black Wolf"
 etr.1.d:0 "Muhammad Amin Bughra is advanced in years, but the flame of struggle has never died out. This old man was the first to raise the banner in the mosques of Kashgar, proclaiming to the people that Allah would unite all Turkic peoples under one flag, and that all of Central Asia would one day once again be under Turkic rule. He passed on the glory and legend of the first uprising to Turkic children all over the world, once again igniting the fires of Pan-Turkism in people's hearts. He says that the Turkic people will one day overthrow all oppressors.

It is time to act, to reclaim our homeland."
 etr.1.a:0 "As God wills!"
 etr.2.t:0 "Second East Turkestan Republic"
 etr.2.d:0 "The Second East Turkestan Republic has existed for over a decade, declared independent in Kashgar in 1946 during the revolution known as Liberation Day, led by Isa Yusuf Alptekin and a group of renowned revolutionaries.

Several years later, East Turkestan is still at war with the Chinese Xinjiang Provincial Government, with frequent armed clashes and battles. Zhang Zhizhong can no longer control the situation, and both he and the leaders of East Turkestan are growing old. One day, one side will achieve final victory, and a new war for Xinjiang will begin. That day is coming soon..."
 etr.2.a:0 "It is the will of heaven!"
 etr.3.t:0 "Raid on Aksu"
 etr.3.d:0 "Another day, another raid. This one will be devastating. Our forces once again attacked the Chinese troops garrisoning Aksu, almost breaking through their defenses. However, a sandstorm and reinforcements from the east forced us to withdraw."
 etr.3.a:0 "We will return..."
 etr.4.t:0 "Speech by Muhammad Amin Bughra"
 etr.4.d:0 "The aging Pan-Turkic Jadidist, Muhammad Amin Bughra, veteran of the first East Turkestan uprising and a high-ranking figure in the current government, addressed the people of Kashgar. He first praised the recent East Turkestan independence movement, then called on all Turkic peoples from Eastern Europe to Central Asia to unite. His inspiring speech inspired many, and his message of Pan-Turkism spread throughout Kashgar and Hotan."
 etr.4.a:0 "How inspiring!"
 ETR_fascism_party:0 "Turkic Liberation Group"

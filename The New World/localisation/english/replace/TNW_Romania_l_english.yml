 ROM_Scars_Of_Vienna: "Scars of Vienna"
 ROM_Ghosts_Of_The_Past: "Ghosts of the Past"
 ROM_Ghosts_Of_The_Past_desc: "In today's Romania, democracy is advancing to unprecedented heights, yet this cannot be attributed to Ion Antonescu's dictatorship. The Antonescu regime burdened Romania heavily, with domestic affairs in shambles — including but not limited to the still-unfinished Danube-Black Sea Canal, which constantly damages the land and collapses agriculture, as well as the significant growth of power among the national elite. Compared to yesterday's mistakes, today's agenda still seems less important."
 ROM_Antonescus_Territorial_Remnant: "Antonescu's Territorial Remnant"
 ROM_King_And_Pawn: "King and Pawn"
 ROM_King_And_Pawn_desc: "As a victorious power in World War II, Romania gained enormous benefits from the war, but now must bear the price of victory. Extensive ties with Germany have alienated Romania from all potential trade partners outside the Solidarity Pact's sphere of influence, and Germany controls nearly every aspect of Romania's economy. Today's Romania is nothing more than a tiny pawn of Germany, forced to endure a foreign master whose democratic ideology runs directly counter to what Romania advocates."
 ROM_Transnistria_Burden_tt: "§R"The Romanian people will never agree to extending the struggle beyond our borders."§! — §YDinu Brătianu§! and §YIuliu Maniu§!"

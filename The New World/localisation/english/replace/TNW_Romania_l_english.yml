 ROM_Michael_The_Brave: "Michael the Brave"
 ROM_Michael_The_Brave_desc: "In Romania, no one is as universally beloved as King Michael. Since playing a key role in ending Brătianu's premiership, restoring the 1923 Constitution, and free elections, the people have regarded King Michael as the heir to democracy and an inseparable part of the nation. Therefore, the king must not only wear the crown but also bear the critical responsibility of safeguarding Romania's freedom and defending the nation against tyrannical rule."

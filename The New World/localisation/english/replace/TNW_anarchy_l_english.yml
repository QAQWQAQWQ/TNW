l_english:
 ZZZ_anarchy:0 "Anarchy"
 ZZZ_anarchy_desc:0 "The largest formal government in this region is the mayor of a bombed-out city. No regime here has the capacity to project power. Perhaps some other nation will claim this territory in the future."
 ZZZ_socialist_party:0 "Anarchy"
 ZZZ_socialist_party_long:0 "Anarchy"
 POLITICS_ANARCHY_DESC:0 "Every few weeks, the airfields of German South West Africa handle dozens of bomber sorties, their destination hundreds of miles north over West Africa, turning the local savanna into something as rugged and barren as the surface of the moon.

Such operations are the Luftwaffe's version of what they did in Western Russia. These strategic bombing campaigns exist both to train new pilots and to justify their lavish budgets to the officialdom, and they also serve to intimidate the local populace. Any man-made structure visible to the naked eye, even a crumbling hut, is quickly designated as a training target and blown to powder by thousands of pounds of high-explosive bombs. Emaciated, filthy herders who climb onto rocky highlands become easy targets for machine gun fire — as some would put it, as inevitable as "flies attracted to feces." The result is that no nation can claim sovereignty over this region — and in any case, they wouldn't find much worth claiming. West Africa is a lawless wilderness, where the fiery hand of God constantly reduces everything back to raw state, and only those clever enough to hide and escape danger have a chance to survive here. That's not entirely true — if the Luftwaffe stopped bombing, civilization might once again spread here, but for the people living in this wasteland, that's not something they'd ever bother thinking about. Around here, getting too fanciful is a sure way to get yourself killed."
 POLITICS_NUCLEAR_ANARCHY_DESC:0 "If
the world has
her own way of dying
not with a bang, but a whimper."
 VIL_The_Wilderness:0 "The Wilderness"
 POLITICS_WILDERNESS_DESC:0 "In distant and faded memories, in this desolate and remote land, there once was a dream. A dream of a peaceful Russia, untouched by strife and suffering, which would be as a child of God, cared for and guided by one of God's many servants.

But God's grace was not enough to protect him. This land suffered under the rule of a usurper, who wrote an unspeakable tragedy in his own name.

Now, in this cradle of hope, only poison and death remain, for God no longer dares to give Russia a false hope."

 MAN_Choi_Kyu_hah: "Choi Kyu-hah"
 POLITICS_CHOI_KYU_HAH_DESC: "Choi, a graduate of the Manchuria Concordia Academy, was known for his integrity, frugality, and refined, low-key manner. Having spent years in East Asian politics, moving between the military and police apparatus, and fluent in several languages, he was serving in the Manchurian Imperial military police when Park Chung-hee launched his revolutionary coup and established the Manchurian Republic.\nRecommended by Park's colleagues and recognized for his talents, he was promoted to the Foreign Ministry. During the world oil crisis, he was sent to visit the Arab states, winning the trust of multiple foreign leaders and resolving a major crisis for the East Asian Co-Prosperity Sphere, earning him the title of 'First-Rate Contributor.' After this, he gained Park's deep trust. When leadership reorganized the cabinet, Choi's quiet, loyal, and pragmatic qualities appealed to Park, and he was chosen as Prime Minister.\nDuring his premiership, Choi handled Park's foreign affairs and resolved numerous diplomatic orders. Trade between Manchuria and other nations grew day by day, and the economic outlook was bright.\n\nIn 1986, the Manchurian Republic faced a massive political crisis. The paper could not wrap the fire forever; beneath the high-speed economic growth lay the blood and tears of every people. Angry citizens took to the streets, and even military and police suppression could not stem the tide. The dictator Park Chung-hee, atop a mountain of bones, could not escape death. As Prime Minister, Choi Kyu-hah - known in government for his pragmatism and refinement - resolved the crisis through skillful means. He yielded to the people's anger, agreeing to truly constitutionalize the Manchurian Republic and granting the human rights and freedoms the people deserved.\n\nThe public called these reforms the 'Spring of Xinjing.' Without doubt, Choi Kyu-hah saved the Republic, saved this newborn nation, and made it truly a republic."
 MAN_Lee_Teng_hui: "Iwasagi Masao"
 POLITICS_Lee_Teng_hui_DESC: "Iwasagi Masao was born on the island of Taiwan. In 1943, he went to study at Kyoto Imperial University in Japan, graduating in agricultural economics. After returning to Taiwan, he focused on the relationship between agricultural economics and prices, becoming an expert in the field. Through a connection, he came to Manchuria to serve as Minister of Agriculture for Jiandao Province.\n\nGiven his expertise in agricultural economics, he was noticed by Park Chung-hee and promoted to Deputy Director of the Manchurian Republic's Ministry of Agriculture. Later, during student protests, he was dismissed due to his political stance.\nHe was later reinstated as Director of the Ministry of Agriculture. After Park's death, Choi Kyu-hah took office, cultivated him, persuaded him to join the National Committee Assembly, and later appointed him Prime Minister."
 MAN_Sadakazu_Tanigaki: "Tanigaki Sadakazu"
 POLITICS_Sadakazu_Tanigaki_DESC: "As the grandson of Lieutenant General Ikeda Kiyosada of the Imperial Japanese Army, Tanigaki Sadakazu took a different path from his grandfather, who had expanded the empire's frontiers. In 1972, after graduating from the law faculty of the prestigious University of Tokyo, he immediately entered Manchurian politics. At that time, Manchuria was under the rule of Park Chung-hee, formerly of the Manchurian National Army.\n\nThrough family connections, he rose rapidly in the Manchurian government, holding positions such as Mayor of Xinjing, Professor at National Founding University, and Manchurian Ambassador to China. During Choi Kyu-hah's presidency, he joined the National Committee Assembly and was promoted to Minister of Finance."
 MAN_Cai_Ying_wen: "Tsai Ing-wen"
 POLITICS_Cai_Ying_wen_DESC: "If one were to choose the face of Manchurian democracy, it would undoubtedly be Tsai Ing-wen, known for her anti-government political record. Yet her father had served the Kwantung Army of Manchukuo, which gave her the opportunity to study in Xinjing. Her student days in Xinjing were the most memorable period of her life; there she was swept up in democratic ideas, and she joined the protests against the Park Chung-hee government. Though the movement was brutally suppressed by the authorities, it undoubtedly laid the foundation for her future political career. She was determined to realize democracy in Manchuria, even at the cost of her life."

 ###Manchou Assorted Laws###
 MAN_Manchuria_New_Constitution_law: "§L1965§!·£GFX_MAN_Manchuria_New_Constitution §ORepublic of Great Manchuria§!§fNew Constitution§!"
 MAN_Manchuria_New_Constitution_law_desc:"§fConstitution§! §WArticle 1§!: The §ORepublic of Great Manchuria§! was founded in response to the backwardness of the monarchy and the people's hardship. Its foundation rests on the §VFive§! §APeoples'§! §WHar§!§qmon§!y, with §Ythe people's happiness§! as its standard.\n\n§fConstitution§! §WArticle 5§!: The §Qfundamental rights§! of §Onationals§! shall not be neglected because the §fConstitution§! does not address them. The §fConstitution§! further provides that fundamental rights of nationals shall only be §Zlimited§! by the §fConstitution§! when they conflict with national security, law and order, or society. The §fConstitution§! also clearly stipulates the fundamental obligations of all nationals to abide by national law, including but not limited to the §hduty to pay taxes§!, §mduty to education§!, §Jduty to work§!, and the §Uduty to national defense§! to maintain the security of the §ORepublic§!.\n\n§fConstitution§! §WArticle 10§!: Any act of establishing, joining, encouraging, or praising groups or organizations of §Vcommunist ideology§!, praising or inciting anti-state groups, failing to report acts that §eendanger national social stability§!, or failing to report §Xviolations of the national constitution§! shall be deemed a §xcrime§!."

 MAN_Manchurian_Compulsory_Education_law: "§L1984§!·£GFX_MAN_Manchurian_Compulsory_Education §OManchurian Republic§!§ICompulsory Education Law§!"
 MAN_Manchurian_Compulsory_Education_law_desc: "According to the principle of '§Xharmony of the Five Peoples, Pan-Asian co-prosperity§!,' the purpose of §lstate compulsory education§! is to assist all nationals in perfecting their §Apersonal character§!, §jcultivating independent living ability§!, and acquiring the §nqualification of a qualified national§! able to participate in §fnational construction§! and promote the prosperity of the §VCo-Prosperity Sphere§!." - §OManchuria§!·§IEducation Department, 1983§!\n\nEducation spans from §melementary school§! through §hjunior high§! for a total of §Lnine years§!: §melementary school§! for six years, §hjunior high§! for three, §Qhigh school§! for three, and §Puniversity§! for four. §melementary§! and §hjunior high§! are §Sfree compulsory education§! in the state, and those with youtexceptional academic achievement§! may §Areceive free§! §Puniversity education§! provided by the state.\n\nBy the §L1980s§!, §Kimproving education quality§! became the focus of Manchurian education. §lCompulsory education§! was written into §fconstitutional provisions§! and became one of §OManchuria's§! four national policy goals. It was gradually extended to remote areas in §L1984§!, and by §L1990§!, §Oelementary compulsory education§! had been fully implemented. As the millennium approached, the §OManchurian Republic§! began focusing on cultivating well-rounded, creative composite talent to face the §Iemerging industrial technologies§!."

 MAN_Presidential_and_Public_Service_Act_law: "§L1990§!·£GFX_MAN_Presidential_and_Public_Service_Act §UPresidential and Public Service Act§!"
 MAN_Presidential_and_Public_Service_Act_law_desc: "Since the §erevolution§! succeeded, the §UPresident§! has always relied on a group of §Aofficers§! of the §OManchurian Republican Army§!, §qcorporate oligarchs§!, §oJapanese advisors§!, and §&departmental bureaucrats§! for advice and expertise. It is well known that most members of the §wNational Committee§! are the §UPresident's§! closest associates, all benefiting from core positions in the republican government. Their secret deliberations have been condemned in underground pamphlets, but these relationships are not easily understood by §hthe common people§!.\n\nThe §preal situation§! is not ordinary, but certainly not as sordid as the §Stabloid press§! claims. The §UPresident's§! allies are all genuine §OManchurians§!; in ideology, as long as it aligns with the §UPresident's§! wishes, they benefit, and without question must §.obey the President§!: the rumors that those with skillful means can exert enormous influence are ultimately fantasy.\n\nIn §OManchuria§!, the §UPresident's§! §.opower§! absolutely overrides anyone else. Though in the past some members did wield great power, with the arrival of §QChoi Kyu-hah§!, the ability of §scivil servants§! to influence the §UPresident§! has become a thing of the past. Now it is a §<democratic§! §,republic§!. Even though §Jbureaucratic habits§! exist in the government, the §OPanchurian people§! have gained the power to form their own §dpolitical groups§! and participate in §fnational affairs§!. The appointments of §scivil servants§! are no longer limited to §lKoreans§! and §XYamato people§!; many §scivil servants§! hold §*dual identities§!: they are both §scivil servants§! of the §Ocurrent government§! and participants in §pcivilian political groups§!. More enlightened policies leave many still hopeful for the government, and perhaps one day, everything will be upended."
 
 MAN_Manchuria_Intelligence_Bureau_law: "§L1973§!·£GFX_MAN_Manchuria_Intelligence_Bureau_law §OManchurian Republic§!§mIntelligence Bureau§!"
 MAN_Manchuria_Intelligence_Bureau_law_desc: "In today's §OManchuria§!, the people's pursuit of §Bfreedom§! and §*democracy§! is unprecedented in any era. Even though the §GNational Committee§! that banned the §jConcordia Association§! has taken its place, people are no longer satisfied with §Snational narratives§!. Questions about §*democracy§! in government administration and the freedom or absence thereof of §lspeech§! have reached the masses, and the §mIntelligence Bureau§! was established as a result.\n\nOn the surface, the §mIntelligence Bureau§! was established by the §OManchurian Republican Government§! to prevent §Xcommunism§!, handle §nborder issues§! on the §Knorthern frontier§!, and assist §eJapan's§! influence within the §VCo-Prosperity Sphere§!. In reality, it is a §rcontainment§! and §jsurveillance§! apparatus of the §qsecret police§!: the §Ogovernment§! hires 'advisors' to maintain direct knowledge of §dcivilian political groups§! and organizations. Within the §OManchurian Republic§!, many participants in §dcivilian political groups§! have been detained and tortured by the §qsecret police§! of the §mIntelligence Bureau§! under the pretext of §Xcommunism§! and §KRussian espionage§!."

 MAN_Manchurian_Military_Reform_law: "§L1985§!·£GFX_MAN_Manchurian_Military_Reform §jNew Manchurian Republican Army Reform Act§!"
 MAN_Manchurian_Military_Reform_law_desc: "After completely suppressing the §ered bandit§! rebellion in §L1971§!, the §jstanding armed forces§! of the §OManchurian Republic§! revealed their shortcomings: severe lack of training, poor coordination between service branches, critical deficiencies in logistics, and bloated bureaucratic obstacles in the Defense Ministry. Under the direction of then-§UPresident§! §APark Chung-hee§!, the §JState Council§! led by then-Defense Minister §SBaek Sun-yup§! promulgated the §.Manchurian Republican Army Reform Act§! in §L1972§!. At the time, the act's goals were to advance the §OManchurian Republican Army's§! military doctrine, modernize equipment procurement, modernize the administrative, tactical, and strategic capabilities of the §uManchurian Defense Ministry§!, and integrate the combat capability of the §OManchurian Republican Army§! with the overall armed forces of the §VGreater East Asia Co-Prosperity Sphere§!. At the same time, the §XKwantung Army§! and the §,former military police§! were disbanded and consolidated into the new §OManchurian Republican Army§!. Most importantly, the §OManchurian Republican Army§! was transformed from a §*counterinsurgency brigade§! into a self-sustaining §.national defense force§!.\n\nAfter Park's death, the §rmilitary reform§! remained incomplete. Long-standing §&interest relationships§! between departments and corrupt §hbureaucratic habits§! severely affected the §Smodernization process§! of the §OManchurian Republican Army§!. Based on predictions and advice from the §mIntelligence Bureau§! and §oJapanese advisors§!, the §JState Council§! under President §QChoi Kyu-hah§! introduced the Defense Ministry's New Manchurian Republican Army Reform Act in §L1985§!, aiming to bind the §uDefense Ministry§! to other departments through state intervention, strengthen inter-departmental coordination, and further reform the administrative efficiency of the Defense Ministry. It implemented §Especialized military handling§! for the §Knorthern border issue§!, §*established Manchurian special forces§!, and further deeply integrated the §OManchurian Republican Army§! with the military security of the §VCo-Prosperity Sphere§!."


 MAN_Manchurian_Republic_Special_Forces_law: "£GFX_MAN_Manchurian_Republic_Special_Forces §&Manchurian Republican Special Forces§!"
 MAN_Manchurian_Republic_Special_Forces_law_desc: "The days when the §XKwantung Army§! held absolute sway in §OManchuria§! are gone, replaced by the new §&Manchurian Republican Special Forces§!: a product of cooperation between the §mIntelligence Bureau§! and the §uDefense Ministry§!, directly commanded by the §UPresident§!. §oBirds of a feather§! is perhaps the best descriptor for the Special Forces, whose influence in §OManchuria§! is deeply entrenched: as the §Qexternal security contractors§! of the §OManchuria International Development Group§!, §hintel informants§! for the §mIntelligence Bureau§!, and §fnew weapons contractors§! for the §uDefense Ministry§!. But as the §Zloyal hounds§! of the §UPresident§! and the §dwhite gloves§! of §OManchuria§!, many matters the state cannot directly resolve are handled by them §Aprivately§!: §KRussian spies§! on the §nnorthern border§!, §Ecompetitors§! of the §OGroup§!, and §lcorrupt ministers§! who §acolluded with foreigners§!.\n\nCompared to the §Jbureaucratic system§!, who can sway the §bfate§! of §<kings and nobles§!? Without doubt, it is the §&Manchurian Special Forces§!."

 
 MAN_Manchuria_International_Development_Group_law: "£GFX_MAN_Manchuria_International_Development_Group §JManchuria International Development Group§!"
 MAN_Manchuria_International_Development_Group_law_desc: "When the §RNortheast§! became independent as §OManchuria§! born from §ZPan-Asianism§!, §OManchuria§! was a paradise for every §oethnic entrepreneur§!. The §XJapanese Empire§! overnight planned the order and power of this §BLand of Righteous Rule§! into a §esteel heart§!, and the ideal of the §Ucorporate state§! was maintained through this §esteel heart§!. From the day the revolution was complete, as a §Jworld-class§! giant capital spanning §VAsia§!, §aAmerica§!, and §bAfrica§!,\n\nthe §JManchuria International Development Group§! inherited the mantle of its predecessor, the §fManchuria Heavy Industries Development Company§!. After §.wild growth§! during the §Eimperial period§! and §hstate intervention§! during the §Orepublican period§!, today's §JManchuria International Development Group§! has efficiency and modernization engraved to its core. Like a spiderweb weaving the §VCo-Prosperity Sphere§! and the §Iworld§! trusts once seen as tumors of the §OManchurian Republic§!, the §jgovernment§! has used its authority to force them to become part of the §*state power apparatus§!, their power converted into tools of normal external influence rather than obstacles as before. If the §OManchurian Republic§! wishes to §Sprosper§!, it need only rely on the will within and operate according to government terms."
 MAN_xinjing_Agreement_law: "§L1982§!·£GFX_MAN_xinjing_Agreement §ZXinjing Agreement§!"
 MAN_xinjing_Agreement_law_desc: "'This agreement is an §Zeconomic mutual assistance clause§! for §Zmember states§! of the §VGreater East Asia Co-Prosperity Sphere§!, aiming to strengthen friendly cooperation, mutual benefit, and Asian revival among §VGreater East Asia Co-Prosperity Sphere§! §Zmember states§!.' - §eFourth Greater East Asia Economic Conference§! §dPreamble§!\n\nThrough §PRaijima Ryuuzou's§! connections and influence in §ZJapan§!, §jPark Chung-hee§! used the §eFourth Greater East Asia Economic Conference§! to radiate the influence of the §JManchuria International Development Group§! across all of §VAsia§!: §fheavy industry§!, §umilitary industry§!, §,oil§!, §hluxury goods§!, and §acrystal products§!. As the §JManchuria International Development Group§! devoured markets like a glutton, through the §ntrade preferences§! between §VCo-Prosperity Sphere§! §Zmember states§!, it gained massive orders and investment from §aAmerica§! and §bAfrica§!. The enterprise also plundered raw materials at extremely low wages, and stockholders in §xXinjing§! excitedly watched stocks §Kclimb steadily§!, while the §Epowers that be§! above watched the revelry with amusement.\n\n§dLaborers in the factories never cease their steps, gears in the machines turn in tight order, but not all metal can resist decay; this §esteel heart§! will one day §Qstop beating§!§!."
 
 

 MAN_New_Era_New_Manchuria: "New Era, New Manchuria"
 MAN_New_Era_New_Manchuria_desc: "Since our nation's independence, casting off Zhang Zuolin's corruption and Chiang Kai-shek's tyranny, rising with the support of our friendly ally Japan, we have co-built the New East Asian Order for sixty-five years. From the very beginning of our independence, the peoples have lived in harmony, the people diligent and hardworking. The Aisin-Gioro emperor once ruled, then the Paks rose to make Manchuria prosper, abolished the monarchy, and established the republic. Approaching the millennium, Great East Asia stands stable and at peace, and Great Manchuria flourishes."
 MAN_Pan_Asian_Comrades: "Pan-Asian Comrades-in-Arms"
 MAN_Pan_Asian_Comrades_desc: "Since the victory of the Great East Asian War, a new century-long order has unfolded across Asia. Manchuria rose through Pan-Asianism, and to fulfill its mission of reviving the East Asian peoples, it must devote itself wholeheartedly to the great cause of Pan-Asian co-prosperity. Tokyo, Xinjing, and Nanjing are all comrades in promoting East Asian peace, comrades in the struggle for world peace. Entering the new century, jointly safeguarding the new order is our model and our mission."
 MAN_The_Chaos_Generation: "The Chaos Generation"
 MAN_The_Chaos_Generation_desc: "The Manchurian Republic was not born spontaneously, but brought into being by a coup led by the officer corps under Park Chung-hee. Nominally established for the betterment of all Manchurian peoples, in fact the Manchurian Republic did not implement constitutional rule until President Choi Kyu-hah's term. Before that, many progressive figures had already given their lives for the Republic's constitutionalization, and student movements rose one after another. The people's blood flows, the masses' tears fall."

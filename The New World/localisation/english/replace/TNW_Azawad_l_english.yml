 AZW_idea_saharan_nomads: "Saharan Nomads"
 AZW_idea_saharan_nomads_desc: "The Sahara is a harsh place where only the toughest survive. The Tuareg peoples of Azawad are masters of this hostile land, making it their home as best they can. Centuries of oral tradition have taught them more about the desert than any outsider could ever know."
 AZW_idea_tuareg_heritage: "Tuareg Heritage"
 AZW_idea_tuareg_heritage_desc: "Azawad is less a nation than a tribal confederation — a league of Tuareg clans roaming the southwestern Sahara. This is not the result of decentralized governance, for there is no central government to speak of. The clans wander the desert as they have for centuries. Without major reform and centralization, Azawad will forever be seen as a temporarily stateless patch of West Africa."

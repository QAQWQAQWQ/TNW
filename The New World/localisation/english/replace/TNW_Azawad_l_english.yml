 POLITICS_BEY_AG_AKHAMOUK_DESC: "It is undeniable that Bey ag Akhamouk has led a troubled life. Born in 1903 in French West Africa as a descendant of Akhamouk ag Ihma, he witnessed the French colonial regime that had oppressed his people dissolve into the desert sands as if by divine punishment — the Frenchmen who had lorded it over them vanished overnight. In that power vacuum, Bey led his nominally ruling Ifoghas clans, preparing to establish an independent Tuareg confederation.

But things were not so simple.

Other competitors in the region were less accustomed to nomadic life, and as the days passed, they gradually perished, while the Ifoghas not only survived but grew stronger. Years passed, and clan morale began to falter, nearly collapsing after the death of the previous amghar, Meslag ag Amayas. Yet Bey stepped forward to take up the mantle.

Now Bey sits on the throne he and his father dreamed of, ruling an independent Tuareg kingdom. Nomadic clans from across the Sahel have flocked to this new nation-state, hopeful of the promises Bey has made: stability and freedom, freeing the Tuareg from foreign bondage once and for all. He has not only made these seemingly incredible promises, but kept them.

The Tuareg clans are free now. Be they African or European, any who dare encroach on this land again will face the wrath of the natives — and Bey is their leader."

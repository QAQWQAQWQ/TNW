 POLITICS_INTALLA_AG_ATTAHER_DESC: "It is undeniable that Intalla ag Attaher has led a troubled life. Born in 1927 in French West Africa as the son of Attaher ag Iri, he witnessed the French colonial regime that had oppressed his people dissolve into the desert sands as if by divine punishment — the Frenchmen who had lorded it over them vanished overnight into a power vacuum. In that vacuum, Intalla and his father led their nominally ruling Ifoghas clans, preparing to establish an independent Tuareg confederation.

But things were not so simple.

Fleeing the expansion of the emerging republic, the Ifoghas clans were forced deep into the Sahara. This was a setback to the father and son's dream of an independent Tuareg confederation, but ironically, it helped them in the long run. Other competitors in the region were less accustomed to nomadic life, and as the days passed, they gradually perished, while the Ifoghas survived.

Now Intalla sits on the throne he and his father dreamed of, ruling an independent Tuareg kingdom. Nomadic clans from across the Sahel have flocked to this new nation-state, hopeful of the promises Intalla has made: stability and freedom, freeing the Tuareg from foreign bondage once and for all. He has not only made these seemingly incredible promises, but kept them.

The Tuareg clans are free now. Be they African or European, any who dare encroach on this land again will face the wrath of the natives — and Intalla is their leader."

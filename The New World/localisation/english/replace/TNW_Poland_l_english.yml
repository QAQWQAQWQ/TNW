 POL_Hardened_Defense:0 "Hardened Defense"
 POL_Emil_Fieldorf:0 "Emil Fieldorf"
 POLITICS_EMIL_FIELDORF_DESC:0 "In 1939, Poland's 30-year nightmare began. Under the iron heel of Germany, the Polish people suffered atrocities that only those whom the Nazis considered subhuman could understand. Though Poland was erased from the map, the Polish people survived in forests, hills, and sewers. The guerrilla war never ended, the Polish resistance never gave up, and neither did Emil Fieldorf.

After the horrific Warsaw Uprising ended, Fieldorf took command of the Home Army. Fieldorf was a lifelong patriot and a veteran of two world wars, born in Poland and devoted solely to Polish independence and democratic ideals. If the Polish government had survived the night of 1939, Fieldorf might have been a famous general, even president of the republic. In truth, he is now the ruler of the Polish Underground State, a nation hidden in the shadows, and Fieldorf hopes, prays, and begs Almighty God that one day they may walk into the light.

Poland's suffering is unbearable to read, and Fieldorf feels deeply the deaths of his men, who regard this veteran as a father. Fieldorf knows that the Polish nation is a concept, an inseparable part of every Pole, and that as long as even one of them lives, Poland will live with them. The long night is endless, and Germany seems unstoppable, but Fieldorf never gave up hope."

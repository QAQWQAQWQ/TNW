 ArcadeMode.2.t:0 "[Get_newspaper_header]Tortorelli wins Uruguayan election!"
 ArcadeMode.2.desc:0 "Worrying news from Montevideo: Domingo Tortorelli and the Labor Concordance have won the recent Uruguayan election.

Most of Tortorelli's proposals were utterly insane — things like building two hundred cinemas in every neighborhood, or transforming some valley in Uruguay to look exactly like Venice — but they successfully captured the imagination of the Uruguayan people, winning just enough votes (51) to defeat the other candidates.

Some suspect there may be something behind the seemingly harmless proposals of Tortorelli, but experts agree these are all baseless rumors. In the words of Luis Batlle Berres: “which son of a bitch is fucking with” the Uruguayan people. Precisely…"
 ArcadeMode.2.a:0 "…some asshole is messing with the damn console!"
 ArcadeMode.7.t:0 "[Get_newspaper_header]Barrios wins Uruguayan election"
 ArcadeMode.7.desc:0 "Strange news from Montevideo: Pilar Barrios and the Black Native Party have won Uruguay's recent special election.

Though Uruguay — known as the "Switzerland of the Americas" — is a world-famous progressive nation, the reality is that Afro-Uruguayans remain one of the blind spots of the system. Recently, the government's decision to demolish the mid-block tenements and evict the Black population caused great controversy, deepening the world's understanding of the plight of Afro-Uruguayans, and ultimately leading to the reconstruction of the Black Native Party.

What baffles foreign observers is that Barrios somehow managed to convince a group of people who pride themselves on "arriving by ship" to support him. Strange voices shouting "wogga wogga" have been reported recently, and some conspiracy theorists say this is the reason."
 ArcadeMode.7.a:0 "Ban smoking ANCAP cigarettes!!!"

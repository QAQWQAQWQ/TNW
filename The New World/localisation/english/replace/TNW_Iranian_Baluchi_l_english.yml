 POLITICS_SHER_MOHAMMED_MARRI_DESC: "Sher Mohammed is the chief of the Marri tribe of Baluchistan. As leader of the Baluch Liberation Front, he leads from the front in the guerrilla war against all forces that threaten Baluchi independence. The Baluch are a proud Sunni people in the Shi'a nation of Iran, with their own language, culture, and traditions. Yet for generations, millions of Baluch have been ruled by those who do not understand this. Sher Mohammed has applied a Marxist interpretation to this nationalist sentiment, claiming his people are writing yet another chapter in the eternal struggle between oppressor and oppressed.

Perhaps their struggle was doomed from the start, the enemy overwhelming in numbers and firepower. But that does not matter. They will make the enemy pay in blood for every inch of these mountains."

 ALT_Temirey_Kazakov: "Temirey Kazakov"
 ALT_religious_divide: "Religious Divide"
 ALT_religious_divide_desc: "The nation of Oirotia was founded on the principle of unity and solidarity between two great religious movements, which most of Oirotia's population follows. These two faiths are the Old Ritualism and Burkhanism (the White Faith) — the former an Orthodox sect long separated from the Russian Orthodox Church, the latter a syncretic indigenous religious movement that emerged in the early 20th century.

Until now, these two faiths have coexisted peacefully, but Oirotia has been fractured by contradictions between its citizens. Both sides have different goals and ideas for the nation, and the Oirotian government must frequently mediate disputes and discord among its citizens."
 ALT_christian_socialism: "Christian Socialism"
 ALT_christian_socialism_desc: "Many of Altai's inhabitants, whether native or not, felt sympathy for the Soviet system as long as it existed. Though the passage of time has eroded the optimism about socialism, it still influences Oirotia's economic policies. Many Old Believers have drawn tenuous connections between Christian doctrine and left-wing thought, ultimately developing an economic policy unlike almost anywhere else in Russia.

Elements including partial nationalization and planned economic adjustments have been surprisingly well-received, and these policies have even improved economic efficiency."
 ALT_agrarian_economy: "Agrarian Economy"
 ALT_agrarian_economy_desc: "Compared to many other regions of Russia, Altai remains economically dependent on agriculture rather than industry. The wave of industrialization barely touched Oirotia, and Moscow's efforts to industrialize the region came to an abrupt halt with the Great Patriotic War and the fall of the Bukharin government.

Thus, Oirotia's economy is still based on the region's well-established agricultural production. The new regime quickly accepted this reality, choosing to avoid any fast-paced or overly ambitious industrialization plans. We remain, for the most part, an agrarian nation."

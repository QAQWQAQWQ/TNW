 ALT_Ivan_Zavoloko: "Ivan Zavoloko"
 POLITICS_IVAN_ZAVOLOKO_DESC: "For a long time, Ivan Nikiforovich Zavoloko's people were mocked as provincial bumpkins who clung to an abandoned past. "Raskolniks" — that was the common epithet for these Old Believers. The term enraged the Old Ritualists, who simply believed it was right to maintain their ancestors' faith, and in doing so, they harmed no one. In Riga, Zavoloko was a collector of Russian antiquities, gently guiding his community while continuing his research into the past. When the Russian Empire fell, the Old Believers thought a new golden age of worship might begin. Quite the opposite: the Soviets, and later Nazi Germany, brutally oppressed the Old Ritualist communities. After the Nazi invasion, Zavoloko followed his kin on a long overland exile, fleeing the ruins that had buried a bright future.

In Oirotia, Zavoloko's first meeting with the local inhabitants did not get off to a good start. The native Altai people had always looked down on outsiders, especially those who practiced Burkhanism (the White Faith), a new religion seen as a threat by both the Tsars and the Soviets. The followers of this emerging faith felt little sympathy for the exiles of an ancient religion. Many believed that sharing their limited survival space with outsiders in this war- and bandit-ravaged land would be suicide.

From such an inauspicious beginning to now being president of this young nation with dual religious and ethnic traditions, Zavoloko's rise has shocked many warlords in the region. His patient attention to detail, his compassion for every citizen regardless of rank, made him the only leader followed by both of Oirotia's major communities. Yet personal effort cannot lay a stable foundation for a nation. President Zavoloko and his followers must succeed in forging a deeper bond between the fates of the Old Ritualists and the Burkhanists, so that the young nation's bright future may take root and not wither."

 MLI_idea_keitas_leadership: "Keïta's Leadership"
 MLI_idea_keitas_leadership_desc: "As far as Mali's current situation is concerned, the election results are perfect. Modibo Keïta, Mali's first and thus far only elected president, has a governing platform that uniquely blends socialist ideology with more pragmatic means of maintaining control.

Mali is divided into two camps: the reformists, who hold high the ideal of pan-Africanism and advocate alignment with Cameroon; and the traditionalists, who insist on preserving Mali's territorial integrity. Keïta treads carefully between the two, but if he can maintain national unity, Mali will rise from the ashes and build a stronger future."
 MLI_idea_traore_problem: "The Traoré Problem"
 MLI_idea_traore_problem_desc: "Though President Keïta is an elected leader, not all citizens have confidence in the leadership of this young nation. To be fair, most of these opponents are not worth worrying about — they are merely jealous ingrates and incompetents, with one glaring exception.

Moussa Traoré, a young officer, is intimately familiar with the inner workings of the various factions within the Malian military. Rumors and panic about Cameroonian puppet-mongering run rife through the ranks, and there is no doubt that he is plotting to subvert Mali's democratic system, backed by foreign capital."

 POLITICS_MODIBO_KEITA_DESC: "Among the nations of West Africa, Mali appears unusually calm and ordinary — the people here seem to suffer less oppression than elsewhere. This is the land of Modibo Keïta, a leader torn between moral conviction and radical belief, struggling to find his way in the turbulent landscape of West Africa.

Born in the streets of Bamako, Keïta could have claimed descent from the founders of the Mali Empire, but he never harbored dreams of expansion. Instead, Keïta found his spiritual home in socialist groups across French West Africa, uniting many Malians under the banner of national freedom and prosperity.

When news of Germany's victory over France arrived, this noble ideal suffered a major setback. As de Gaulle's forces struggled to hold the remnants of West Africa, Keïta remained openly defiant of the French; his organization of militia forces to oppose de Gaulle's army gave the French no end of trouble. The French were not only driven out of Mali but forced back to the Ivory Coast, and Mali was free. The militia was a melting pot, gathering all forces that desired Malian autonomy — Islamists, socialists, democrats, and nationalists, all fighting for the same goal. Now that the dust has settled, the many factions within Mali have turned their gaze inward. Infighting between factions within the Malian government escalates almost to the point of farce. Keïta's ongoing national reforms have not calmed the strife but instead enraged the conservative militias.

The dissident Moussa Traoré has integrated the Islamic militias into a regular army and seized the city of Kayes as his stronghold. The battle for Mali's future has begun, and Modibo Keïta leads his army toward this decisive campaign."

 VOL_Vasily_Ivanov: "Vasily Ivanov"
 POLITICS_VASILY_IVANOV_DESC: "Vasily Nikolayevich Ivanov was a humble village cobbler before being conscripted in the 1920s. In the years that followed, he attended officer school and rose through the ranks, holding the rank of colonel by the time of the German invasion. He and his unit fought in the ill-fated defense of Moscow, and when the Mozhaisk line collapsed and the Germans poured through, they managed to retreat in relatively good order. Unlike many other veterans, they withdrew north and linked up with Marshal Yegorov's forces. Ivanov was promoted to general in the fledgling West Russian Revolutionary Front, becoming one of the commanders leading the offensive against the Germans.`n`nHowever, this momentum did not last. Betrayal and power struggles hollowed out the Front, and the Germans and their collaborators soon turned the tide. Ivanov had liberated and occupied his home region of Vologda when he made a fateful decision: he abandoned his cause, and his army seceded from the Front and declared neutrality. To him, continuing to fight within the rapidly disintegrating Front would only bring more bloodshed to a region that had already seen too much.`n`nThis move won Ivanov the acclaim of the people of Vologda. They saw him as both the liberator who freed their city from Nazi tyranny and the breakwater that kept the chaos brought by other warlords at bay. The Front and the Moscow Directorate grudgingly accepted his position, recognizing the benefits of a buffer state between them. Yet while this armed neutrality has successfully deterred others in recent years, it is only a matter of time before another warlord calls Ivanov's bluff and begins probing his army."
 POLITICS_PAVEL_BELYAYEV_DESC: "Pavel Ivanovich Belyayev was nobody during the Great Patriotic War, nor during the Great Retreat from Moscow; as a flight school cadet, no one feared him. Yet during the West Russian War, he became one of Ivanov's most successful pilots, eventually earning a place on the general's advisory staff. When Ivanov established the city of Vologda, Pavel was at his side, arguably the godfather of the new government. In the early days, he served Ivanov loyally, promising to set aside political struggle and give the founder the best advice he could.`n`nPavel broke this promise a few years after the state was founded, driven both by fear of his own growing irrelevance and disappointment with the country's hesitant policies of the past two years. He was elected to Vologda's legislative body, the People's Assembly. No one — at least not publicly — doubted his loyalty to Ivanov. Yet within the assembly chamber, he grew increasingly vocal in criticizing Ivanov's near-surrender policy of the neutral zone, which left Vologda undefended against all of Russia. He joined the Military Faction and, through accumulated prestige, quickly rose to its leadership.`n`nNow, the leader of the Military Faction advocates policies completely different from everyone else in the assembly. They believe their neutrality and liberal democracy are stumbling blocks that will bring the country down. Instead, he passionately advocates for nationalist irredentism. To him, war and force are the surest guarantees of Vologda's security — but not everyone is so certain."
 POLITICS_ANATOLY_DRYGIN_DESC: "Anatoly Semyonovich Drygin is a controversial figure in Vologda. His supporters see him as one of the few humane men in the military, a true believer in democracy who always defends the country's most ordinary people. But his opponents see him as nothing more than a dreamer, incapable of bearing the burden of Vologda's defense. One thing both sides agree on, however: Drygin will always humbly and steadfastly fight for what he sees as the truth.`n`nDrygin was born to a kulak family in Saratov. He studied agronomy and became a berry cultivation specialist (a hobby he still maintains in his spare time), but when the Germans invaded, he was conscripted into the Red Army, and after the Soviet collapse he fought for the West Russian Revolutionary Front, eventually coming under General Vasily Ivanov's command. He was never a soldier at heart, but he learned to set aside his ideals for Russia's sake, and never questioned orders even when facing the most brutal fighting against the Germans.`n`nFor Drygin, Ivanov's declaration of neutrality in the West Russian conflict was an eye-opener. When he witnessed the army sacrificing to protect lives, the political apathy war had built up in him instantly melted away. He rushed to the fledgling People's Assembly and became a founder of its Democratic Faction, always enthusiastically pushing for peasant reforms.`n`nDrygin has always dreamed of making Vologda the jewel of West Russian democracy. Now, the Democrats hold a majority in the People's Assembly — he has enough power to make the dream come true."

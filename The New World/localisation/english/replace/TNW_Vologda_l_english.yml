 VOL_neutral_zone: "Neutral Zone"
 VOL_neutral_zone_desc: "Enough blood has been spilled! General Ivanov spoke these words and ordered an end to fighting in the territory under his command. The accursed Germans have already broken the spine of the motherland, and civilians fear for their lives. We will not let Russians bleed any longer; we will protect those who need our care and wait for better days. Only then will we strike."
 VOL_ONG_Miklay_Kazakov: "Miklay Kazakov"
 POLITICS_MIKLAY_KAZAKOV_DESC: "The Mari people have been ruled by Russians since time immemorial. Whether under the tricolor or the hammer and sickle, the Russians never granted the Mari the right to independent statehood — but Mikhail Ivanovich Kazakov has dedicated his life to changing that. When the anti-communist volunteer army swept through western Russia, Kazakov rallied the local Mari people and formed a Mari brigade to fight alongside the volunteers.`n`nWith his love of poetry and literature, Kazakov is known among his people as the warrior-poet. Now that Mari has won independence, it urgently needs a leader, and no one is more suitable than Kazakov.`n`nToday, Kazakov has stabilized the Mari Republic and is seeking further cooperation with other states in the Idel-Ural region and with Arkhangelsk. Mari has become yet another success story of North Russia."

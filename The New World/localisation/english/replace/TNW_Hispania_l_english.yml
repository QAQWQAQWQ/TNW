 RMN_conquest_of_the_realms:0 "Conquest of the Realms"
 RMN_conquest_of_the_realms_desc:0 "They march on, from one world to the next. From realms of endless metal and flying chariots, to wastelands turned to ash by the wrath of the gods. The Undying Legion has seen many worlds, seen many things, and conquered every inch of land they have laid eyes upon.

With each conquest, they grow stronger. With each reign, their desire to be freed from the torment of victory grows. But they cannot break free, so they continue to conquer. Until the end of time.

Yet, something stirs in the darkness..."

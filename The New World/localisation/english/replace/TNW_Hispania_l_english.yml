 RMN_Adeodatus_Iovita_Manlius: "Legatus Adeodatus Iovita Manlius"
 POLITICS_LEGION_ADEODATUS_IOVITA_MANLIUS:0 "For turning the tide in Galicia many years ago, saving his legion from imminent destruction, the Legate was awarded the Grass Crown. It had been his pride, a true mark of honor, and a symbol of greatness and glory.

Yet now, the wreath on his head grows heavier, as he realizes it is not a mark of greatness but a brand of shame. A punishment for the man who led his legion into eternal torment.

He has won a thousand victories, a thousand triumphs, and a thousand worlds. Countless regions that once rejected civilization and refused to submit now lie conquered beneath his feet. No one can say he is not a truly great man, no one can say he is not the greatest conqueror in all of eternity.

But he is not an Imperator. He is not Caesar. He is not Augustus. He does not want to rule lands, he only wants to see Rome's glory again. To see those green eyes that once stared into his own, to see the children he once dreamed of raising. He dreams of the day he can watch all those eyes grow up together, in a land where he can finally find peace.

As the whispers grow louder and the abyss the legion treads grows darker, one fact becomes increasingly clear. He has risen from the death he prayed for countless times, and he will never know peace. He is cursed.

And so are those who stand against him."

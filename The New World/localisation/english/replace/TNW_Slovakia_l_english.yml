 POLITICS_JOZEF_TISO_DESC: "From clergyman to Roman Catholic priest to President of the Slovak Republic, Father Jozef Tiso's life has been a singular success. He received a church education for the priesthood, later becoming a successful moderate politician. Tiso appeared to be a beacon of hope, a decent man. Yet by the mid-1930s, Tiso's views had shifted toward authoritarianism and totalitarianism, and he became the archetypal radical in Slovak politics. When the Nazis occupied Czechoslovakia, Father Jozef Tiso was appointed President of the Slovak Republic. Tiso betrayed his people, throwing himself into the so-called "cult of personality."

After the Axis powers won World War II, Europe experienced a brief period of prosperity, followed by a decade of upheaval. Hit by Germany's economic collapse, Slovakia's economy nearly collapsed as well. Yet the Slovak government had the last laugh. To counter the rising unrest at home, President Tiso further suppressed his people to quell all discontent.

By 1962, President Tiso's health was deteriorating rapidly, with no sign of improvement. Seeing that Tiso's days were numbered, many factions within the government have already begun preparing for the events that will follow his death."
 POLITICS_STEFAN_TISO_DESC: "Though born into humble origins, Štefan Tiso now stands at the center of the Slovak political stage. He was born in the Slovak interior, conscripted into the Austro-Hungarian army during World War I, later joining the Czechoslovak Legion and returning to his newly independent homeland in 1920. He then joined the Hlinka Party, though within this virulently antisemitic party he faced criticism for his Jewish wife. Tiso earned his doctorate in law from Comenius University in Bratislava, served as a judge in Trenčín, and was eventually transferred back to Bratislava as a member of the State Court.

With the separation of Slovakia from the Czech lands and the Axis victory in World War II, the Hlinka Party to which Tiso belonged took power in the new Slovak Republic. He served as chairman of the State Court until 1944, when he succeeded Vojtech Tuka as prime minister after Tuka's health declined. Tiso also served simultaneously as foreign minister and justice minister. As prime minister and foreign minister, he oversaw Slovakia's entry into the newly formed Unity Pact.

Štefan Tiso is now President of the Slovak Republic, succeeding his distant cousin Jozef Tiso. Though his rule remains secure, rumors of discontent within the military are heard from time to time. He also faces direct challenges from party radicals, including Alexander Mach and others who advocate closer cooperation with Germany."
POLITICS_JAN_GOLIAN_DESC: ""
SLO_tiso_dead: "The Death of Tiso"
SLO_tiso_dead_desc: "With Jozef Tiso's death, Slovakia has descended into chaos. The government is nearly paralyzed, and people are beginning to realize that it is time for change. We must act quickly to prevent the instability from spreading further."
SLO_Chained_Minds: "Chained Minds"
SLO_Chained_Minds_desc: "It is obvious that Slovakia has no freedom of speech. Though some may argue that free speech is detrimental to government stability and that regulation of expression is the foundation of a functioning state, the people are not satisfied, and intellectuals are particularly aggrieved."
SLO_Political_Tensions: "Political Tensions"
SLO_Political_Tensions_desc: "Though Tiso has ruled Slovakia as its undisputed leader for over 20 years, his health is failing as it must for any mortal, which means politicians on the Slovak political stage have begun scrambling for power by any means necessary. If that were not bad enough, reports about the disappearance of the resistance movement are becoming increasingly dubious..."
SLO_Agitated_Workers: "Agitated Workers"
SLO_Agitated_Workers_desc: "Though the Slovak Republic has maintained good order over the past decades, various problems still plague her — worker issues, for example. Workers frequently strike over low wages, poor working conditions, or even simply to protest the government."
SLO_Uncompetitive_Economy: "Uncompetitive Economy"
SLO_Uncompetitive_Economy_desc: "It is clear that fascism is not an economic system suited to our nation. If we do not want to face a complete economic shutdown, this problem must be solved."

 CC_info_tt: "§WAnother nation thirsts for freedom; the§Y Channel Crisis§! has become the forward theater of the§Y Cold War§!, with tensions rising. Neither side wishes to see§B Great Britain§! fall into enemy hands, and the final fate of Britain and§f Europa§! will be decided by who masters the art of brinkmanship more skillfully.

§OReadiness§! is the core metric of the crisis, quantifying each side's willingness and ability to defend its interests and hold its ground. If one side's§OReadiness§! reaches§Y100%§!, it will not yield before aggression; conversely, if it falls to§Y0%§!, that side will choose to§Pback down§!, retreating at the prospect of a§xnuclear exchange§!.

Our own§OReadiness§! is fully visible; the opponent's§OReadiness§! is hidden within the§Lfog of war§! of the Cold War. This uncertainty is represented by the§juncertainty§! in the enemy's§OReadiness§! bar, our latest estimate of their§OReadiness§! state. Through decisions it can be gradually§jrevealed§!.

Both sides must do everything to raise their own§OReadiness§!, and if the situation demands, find ways to lower the opponent's§OReadiness§!. Depending on the opponent's§OReadiness§! state, certain decisions will have greater effect.§OReadiness§!§Y80%§! is the§xred line§!; once the§xred line is crossed§!, there is no retreat.§xOur enemy is no different§!.§!

The crisis can be ended in several ways. When the time is ripe, the door to§Knegotiations§! opens. If all goes well, the crisis will be resolved. However, there is no total victory at the negotiating table; both sides' positions will be shaped by their own§OReadiness§!, and gains and losses are inevitable. We can also pursue a strategy of reducing the opponent's§OReadiness§! to§Y0%§! to force them to§Psurrender§!, claiming the victory alone - at the cost of higher risk.

A crisis left unresolved will surely change. As the crisis develops, a countdown begins. When the§Ybreaking point§! arrives, the side with lower§OReadiness§! will be directly§Pcrushed§!, equivalent to having its§OReadiness§! reduced to§Y0%§!.§RIf§xboth sides§! are stuck in the§xred zone§!...§!§!"

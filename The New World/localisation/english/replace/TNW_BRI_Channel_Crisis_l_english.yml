 concession_spy_exchange_desc: ""
 CC_negotiations_tt_heading: "§YNegotiations§!"
 CC_negotiations_tt: "[Get_negotiations_tt]"
 CC_negotiations_ofn_tt: "If we choose to negotiate, we will discuss what concessions must be made in exchange for Britain's freedom.

§KNegotiations§! are divided into three phases, with checkpoints between them. In each phase, Germany will list a series of §Yterms§! they expect us to accept. The §Yterm§! currently under discussion is marked in §Rred§!, and terms already agreed are marked in §Bblue§!.

We and our allies must decide whether to §Gaccept§! or §Rreject§! the concession currently under discussion. If we agree, Germany may choose to accept the agreement reached in this phase, or propose additional terms. If we reject, we will declare that the terms agreed this phase are sufficient, and Germany will then decide whether to accept."
 CC_negotiations_pakt_tt: "If we choose to negotiate, we will try to extract as many concessions as possible from the British and Americans.

§KNegotiations§! are divided into three phases, with checkpoints between them. In each phase, we will list a certain number of §Yterms§! we expect the OFN to accept. The §Yterm§! currently under discussion is marked in §Rred§!, and terms already agreed are marked in §Bblue§!.

The first term of each phase is automatically submitted and must be agreed to by the OFN for the negotiations to succeed. If the OFN accepts the proposed term, we may choose to demand the OFN accept more §Rterms§!, or §Gconfirm§! the agreement reached this phase. If the OFN rejects the proposed term, we will face a choice: either accept the agreement and the penalty, or reject the entire agreement."
 cc_negotiations_accept_button_tt: ""
 cc_negotiations_reject_button_tt: ""
 GER_CC_negotiations_desc: "If an agreement can be reached, mitigating the risk posed by the new Britain, and ensuring everything develops on our terms, perhaps we can accept Britain's new status. But should we really compromise with this elusive threat?"
 channelcrisis.1010.t: "The Führer's Ghost"
 channelcrisis.1010.d: ""Yes, we've received the same reports from Portsmouth and Gatwick as well. Thank you! Understood." Knight set the receiver back, leaned back in his chair and laughed, then reached for his pipe. When the Americans gave up the English Channel, he had known Britain would fight a last desperate struggle for survival before the darkest end came. Yet once the Americans withdrew, the German warships and troops all vanished, as if wiped away by an angry deity. He had no idea what was going on. Maybe the old man upstairs really had intervened?

"That's why I'm furious! They just used the console to make up for how bad they are!" Knight's eyes went wide as a blue ghostly Adolf Hitler suddenly appeared in his office. The Führer continued to rage.

"The only thing that gets in our way is console commands! Why didn't Churchill think of that! Shameless! I spent all those years building my glorious empire, and you want to beat it like this? Goddammit!"

Knight stared at the Führer's outburst, stunned. "What?" The ghost turned to him.

"I despise you! The one behind the screen! Yes, you - what are you even thinking? Free Britain has no content yet, and you're already breaking the game, shoving this loser's face into the HOG portrait frame." The ghost pointed at Knight, wearing an angry expression. "Geez, we worked so hard painting Joyce's portrait. I know he's not a great pick, but give it a try? Please?"

The Führer shook his head. "I'm furious. I'm doing it too now! Let Germany win! You like playing like this, huh!""
 channelcrisis.1010.a: "Console commands materialized before the Führer."

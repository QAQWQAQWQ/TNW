 channelcrisis.54.t: "Escalation and Worry"
 channelcrisis.54.d: "Upon hearing the news, [USA.GetLeader] let out two words on the spot: "Damn it." Just as the doves had predicted, cooing their condemnations from within their olive-branch nest, Germany was doubling down, trying to strangle Britain's freedom. Army deployments to the west, naval exercises, a hundred cursing reports from the CIA's Europe desk - all of it said the Germans would not give up easily.

He needed to get away from his aides and cabinet and think it through himself. After they left, he stared out at the Rose Garden, where a tour group wandered through the hedges, oblivious to the chaos in the West Wing. He did not regret deciding to escalate, sending warships into the Channel. If he abandoned this, the only chance to light a torch of freedom in Europe's shadow, he would be a fool, a coward, and a traitor.

But though Free Britain had lit a torch in the darkness, it was too faint. To drive away the heavy shadows forever, they needed the OFN's torch. For the British, the choice was simple: the OFN should throw everything into defending their island. But [USA.GetLeader] had to think further: if the Germans were not driven out, what consequences might escalation bring?

A thought occurred to him: perhaps talking would work better. Sit down with the Germans, and consider what price they would pay to liberate Britain. They would surely come to talk. Just thinking about it, he felt like a traitor - but if this crisis slipped from his control, history would lay on him a far worse charge than treason.

He walked to the door, opened it, and his small circle waited there like children hearing the family car pull into the garage. They watched him with confusion, eagerness, and the deepest sympathy the President could receive."
 channelcrisis.54.a: ""Come in, gentlemen. Let us discuss the next step.""
 channelcrisis.60.t: "British Emergency Report"
 channelcrisis.60.d: "Oberkommando der Wehrmacht
Abwehr Amtsgruppe III F
Top Secret
[?global.date.GetDateStringNoHourLong]

Feisenmeier confirms that no German or governmental authority remains on the British Isles. The island has been lost to insurgents.

Most senior British government figures, including the Prime Minister and the King, are dead or captured; the rebels have declared a so-called "provisional government." It is unclear what foreign policy they will pursue, but their leadership - a dangerous mix of leftists and supporters of the Ottawa government-in-exile - is clearly pro-OFN. This poses a severe threat to Komitat security, which we cannot accept. Not only does our continent face invasion by an old enemy, but they would control our only safe sea lane to the Atlantic. Every necessary measure must be taken to prevent this.

Regrettably, the domestic situation is turbulent, the Wehrmacht is in disarray, and we cannot respond as swiftly and effectively as we would wish. Moreover, the various Reichskommissariate are all in distress; units in relatively normal condition must be dispatched everywhere to fight fires, and our strength is stretched thin. However, this is only a matter of time. We must do everything to prepare for the inevitable re-invasion and restore security in the west. See the appendix for specific recommendations.

End of page.

May Germany be faithfully guarded."
 channelcrisis.60.a: "How much more land will fall into chaos before real action is taken!"
 channelcrisis.62.t: "Pull Everyone In"
 channelcrisis.62.d: "Beneath Germania, in the network of command posts and underground works, panic spread like an electric current. The British insurgency had succeeded, and was seeking OFN protection, and the Americans had responded to the overture. All these reports sent Wehrmacht high command into frenzied activity.

"This is the beginning of the end." Ferdinand Schörner spoke to the gathered generals. His figure was shrouded in shadow, a huge backlit world map behind him. "The Americans intend to land directly on our coastline; Britain is the fleet's home port. We must strike decisively, mobilize fully, and crush them while we still can."

"With respect, Field Marshal," Hans Speidel straightened, hands on the conference table. "In the short term, our forces are not capable of launching an invasion. We are still recovering - and I must remind you, Schörner, the East is still burning."

"To hell with the East." His voice was impossibly hoarse. "Slavs and Poles with burning sticks are nothing to the Americans; Britain is the key. Letting them win here is letting the OFN drive a dagger into our vitals."

Speidel did not retort, but stared hard at the map. Beneath his stern mask, ripples of fear churned in his eyes. Despite his misgivings, he conceded that if all this came to pass, it would be a nightmare. Given Speidel's acquiescence, subordinates immediately laid their plans before Schörner, demanding an immediate redeployment to meet the threat. He signed each in turn.

"All available units," he pressed the signed orders into his adjutant's hands. "Everything not committed in the East or Africa goes west, awaiting further orders.""
 channelcrisis.62.a: "Britain cannot escape the eagle's wings."
 channelcrisis.63.t: "Report: American Intervention in Britain"
 channelcrisis.63.d: "Oberkommando der Wehrmacht
Abwehr Amtsgruppe III F
Top Secret
[?global.date.GetDateStringNoHourLong]

Urgent dispatch - the Americans have gone mad. At the "request" of the Judeo-Bolshevik rebels to "maintain peace," they have announced the deployment of naval and other military forces to British waters in the Channel. This is outrageous aggression. Reconnaissance confirms a large assembly of American warships off southern Britain, directly in the path of our landing forces.

This is a blatant obstruction. Clearly, their next step is to bring Britain formally into the OFN. We suspect a small clique of warmongers in Washington is posturing, recklessly acting while knowing that if hot war breaks out we will do everything to defend Europe. Let the degenerate Americans see: the invasion will proceed to the end!

But should the invasion somehow fail, we know all too well what will follow: we shall have to activate the contingency plan.

End of page.

May Germany be faithfully guarded."
 channelcrisis.63.a: "The fate of Europa hangs by a thread."
 channelcrisis.90.t: "Across the Great Ocean"
 channelcrisis.90.d: ""...fully understanding Britain's position and rights in matters that concern it, the Empire of Japan condemns the OFN and the Komitat for their irresponsible attitude on this issue. We call on all parties to remain calm and to handle the current situation with prudence and restraint -"

The aide pressed stop on the recorder. [JAP.GetLeader] waved him away. The man exited, closing the door behind him, leaving a tableful of uneasy people. On the table lay a map of the English Channel, with rough force deployments sketched on both coasts. In the middle of the Channel, a faint line divided American and German warships. This was a war for Britain's soul, and Japan could only watch from the sidelines.

"Any word from Europe?" the Prime Minister turned to the head of the Kempeitai.

"The army is readying itself to invade Britain; the Kriegsmarine is cruising the Channel, on high alert. Despite their recent follies, they are mobilizing rapidly."

"Next," said the Foreign Minister, "Germany will rattle its saber, hoping to frighten the other side into acknowledging their claim to England. To them, this is a cause worth fighting for: the OFN wants into Europe to defend its kin, and the Komitat cannot lose England, or its navy's link to the oceans will be severed."

"If they go to war over this, we'll be dragged in too." The Prime Minister's finger slid along the edge of the table as he spoke to the Army and Navy Minister beside him: "Raise readiness, but keep a low profile." To the Foreign Minister: "Continue calling for calm. We can even offer mediation - they won't accept, but it will show our reasonableness." Then, to the Kempeitai chief: "Watch this closely.""
 channelcrisis.90.a: ""Until then," said [JAP.GetLeader], "we can only observe.""
 channelcrisis.91.t: "Peace Returns"
 channelcrisis.91.d: "The news reached the Prime Minister in the afternoon, and he felt relief the moment he learned it. The German fleet had withdrawn from the Channel, while the American fleet docked in London as liberators. [ENG.GetNameDefCap] was now an OFN ally and its foothold in Europe. More importantly, it meant the Channel crisis was over, and the threat of another world war had dissipated - or "been postponed" might be more accurate.

But something else would surely happen, wouldn't it? [JAP.GetLeader] held a glass of whisky, watching the sun sink below the horizon through the western window of his residence. There is a time for sunrise and a time for sunset. One tide ebbs, and another will surely rise.

In the back of his mind, he gradually realized where the next crisis would lie. This time it would be closer to the home islands, and it would involve the Americans. The Americans might be drunk on victory now, waving the torch of freedom and setting everything around them alight. The Co-Prosperity Sphere had felt such flames twice before - once in Malaya, once in the Philippines - why not a third time? His thoughts turned to the brother nations to the south in the Greater East Asia Co-Prosperity Sphere, and he noted to himself that he must discuss this with the cabinet later.

Still, the Prime Minister was relieved that they had weathered this crisis. Cooler heads had prevailed, and the spearhead of destruction had not rained down on the world. As for the outcome - since 1945, had Britain ever mattered much in Japan's foreign policy? It was the ripples in the water that mattered, and [JAP.GetLeader] would be busy tomorrow discussing them in a series of meetings. The Prime Minister laughed, drained his glass of whisky, and left the rest for when he had thought it through. He picked up his briefcase and switched off the light on his way out."
 channelcrisis.91.a: "[JAP.GetLeader] wondered to himself whether anyone had ever really considered how close they had come to destruction."
 channelcrisis.92.t: "Order Restored"
 channelcrisis.92.d: "[JAP.GetLeader] felt it hardly mattered which side won in England. When the news was laid on his desk that the Americans had backed down and left the Channel, letting the Germans invade England once more, the Prime Minister felt only relief that the Channel crisis was finally over. Japan would issue a statement condemning Germany's excessive defense measures - but it was all just going through the motions.

The news arrived that night. The Prime Minister stayed late for several hours to manage the situation, chiefly relaying his response to subordinates: approving press releases, agreeing to ad-hoc interviews with NHK Radio 1, and scheduling an emergency meeting for the next morning. By the time he signed the last document it was past nine at night, and above the city lights only a few small points flickered in the night sky. Before retiring to bed, [JAP.GetLeader] had about an hour alone, and tomorrow would surely be even busier than tonight.

In that remaining hour, he poured himself a cup of sake and sipped it, gazing out from his residence window at the stars. Nothing had changed tonight: England had never been within Japan's sphere, and the German invasion had returned the situation to a familiar state. Japan still had its foothold in the southern seas, and would keep it. But as he filled his second cup of sake, his thoughts turned more to America than to Germany. Americans rarely swallowed their pride and took it; he began, in his heart, to fear that failure in England would turn American eyes toward Japan. The Americans would always find a weak point in the Co-Prosperity Sphere and dive in to compensate. And that weak point might be very close: the southern seas, and the OFN neighbors beyond them.

[JAP.GetLeader] drained his second cup of sake and set the empty glass on the table. It was already ten, and he had to rise at five for the first meeting. The Prime Minister walked to the bedroom, ready to fall asleep and sleep as long as he could."
 channelcrisis.92.a: "At least the heavens would not rain down fire over something that did not concern him."
 channelcrisis.121.t: "Farewell, England"
 channelcrisis.121.d: "Speer stared hard at Tresckow and Schmidt; the two wished they could look away rather than meet the quiet fury burning in his eyes. Spread on the table before them were many documents: withdrawal reports, intelligence reports, press clippings. All of it recorded, cruelly, the shameful German withdrawal from the Channel.

"Tresckow." Speer's tone was low and even. "No route to the global oceans remains under our control. Our navy has become a laughingstock. The OFN now has a vassal state a few hundred kilometers from the Continent, where they can do as they please."

"My Führer -"

"Shut your mouth." He turned to Schmidt, who restrained an impulse to flinch before his gaze. "Schmidt, not only have our negotiations with the OFN collapsed, but we failed to extract even a single concession. At a moment when every Reichskommissariat hangs by a thread, the whole world is made to watch this defeat."

"But my Führer -"

"Shut your mouth." He rose slowly from his seat, hands digging deep into the table, crumpling the [getIntelAgencyShort] report in his fist. "In another Germany, both of you would be shot without trial, and no one would say a word. But this is my Germany, and I am the one in charge." His fingertip stabbed the table; the word charge was like a blade leaving its sheath. "Under my supervision, you two must redouble your efforts to salvage our nation's honor. Tresckow, I am assigning General Remer to oversee the next round of reforms within the Heer, and you will work with Topf to oversee naval reform. Schmidt, you will work with Musgnug and Waldheim to ensure our control of the Continent."

This decision was by no means mercy. Both men felt as if a noose were already around their necks, and Speer was still waiting for a reason to pull the lever and let them drop."
 channelcrisis.121.a: ""Gentlemen, there can be no more weakness. Not now, and never again.""
 channelcrisis.122.t: "A National Disgrace"
 channelcrisis.122.d: "von Schirach had seen Bormann at his most terrifying. His roars were dreadful, but his silence was worse. Now, however, Bormann's anger had transcended that silence, becoming a fire that burned everything in its path. Hewel and Burgdorf, in the room with him, wanted nothing more than to be as far from Bormann as possible.

"You spineless cowards, you just keep backing down, don't you?" Bormann's fist slammed onto the desk, and the documents on it bounced. "We had plans long ago, but you did nothing! You just let them occupy England! Right on our doorstep! You couldn't even force them to make some concession!"

"My Führer," a sweating Hewel pleaded, "how shall we put this - the unreasonable Yanks seized territory they had no right to -"

"That was territory we were meant to defend," said Schirach, grateful he stood on the far side of the desk. "And you failed."

"Look at where we are now." Bormann sneered. "Thanks to you, our navy is watched every time it puts to sea. Our Kriegsmarine is now just a goddamn blowhard inland river fleet!"

Hewel and Burgdorf exchanged glances like schoolboys being scolded by the headmaster. Schirach almost felt sorry for them, but this was no minor diplomatic squabble; it was a heavy blow to Germany. Though no one dared say it aloud, everyone regarded it as the beginning of the Reich's decline, an event for the history books.

"I could have you both shot." Bormann lowered his voice until it was chilling. "But I do not want the rest of Europe to see this as a license for theft. I want you two to set this matter aside for now, and then, listen closely...""
 channelcrisis.122.a: ""If you fuck this up again, I'll personally pull the trigger to execute you.""

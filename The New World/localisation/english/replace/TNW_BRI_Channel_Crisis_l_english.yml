 channelcrisis.112.t: "A Fair Deal"
 channelcrisis.112.d: ""I think that's it, then, right?" Thompson asked Mr. Doe beside him. The plane beneath them sat at Washington Airport, preparing to fly to London. The older diplomat set down his magazine and offered a wry smile Thompson could not read.

"I think so. Britain is free, and that is what matters, is it not?"

The plane taxied along the runway, and Doe stared out the window. Once airborne, he saw the lights of Washington D.C. at night. He remembered the cheers that had gone up when people saw Britain's new leader on television, before a crowd of journalists newly enjoying press freedom, announcing that the OFN and the Komitat had reached agreement on England's fate. Of course, to placate a Germany stunned by defeat, and in exchange for recognizing Britain as an OFN member, they had made some concessions too. The terms seemed acceptable to all parties. Once the consultations ended, diplomats of every nation quietly took pride in the agreement, for they had successfully avoided another world war.

The plane disappeared above the clouds; outside the cabin it was pitch black, and only the window reflected Doe's resolute face. When there was no light at all outside, Mr. Doe picked up his magazine again. Thompson had brought a book too, but his eyes kept darting to Doe.

"Honestly," Thompson said after a long silence, "you aren't happy that we went to negotiate, are you?"

Mr. Doe slowly set down his magazine and took off his glasses. When he looked at Thompson, the young man suddenly thought of many things. He saw he was not on a plane in [GetYear]. He was somewhere in the Scottish Highlands, watching a friend's half a face blow apart, blood flowing. He was in a command post, a knife to a German officer's throat as he dragged him up for interrogation. He was at the negotiating table, proposing yet another compromise, and seeing the same officer flash that mocking smile back at him."
 channelcrisis.112.a: ""I'm not quite sure.""
 channelcrisis.113.t: "My Lucky Star"
 channelcrisis.113.d: "Once again, the Oberkommando der Wehrmacht had gathered in the bunker beneath Germania, awaiting word from the Führer. Markers on the world map glowed white and red, the German eagle casting layered shadows in the light. Hans Speidel watched Ferdinand Schörner pace back and forth at the table, advancing, retreating, restlessly striding around the circular operations room. At last, the red telephone rang, breaking the tension. Speidel answered.

"Good evening. Speidel here. Yes. Yes, he is here too... mm-hm." He scribbled the other's words in his notebook. "Yes. Yes, understood. We'll issue the orders now. Thank you." He hung up and turned to Schörner. "The Foreign Office confirms they have reached an agreement with the Americans and the British."

"They've lost Britain, haven't they? A pack of cowards!"

"Unfortunately, it is true. The Americans still haven't shifted their position one bit." Speidel held out the notebook. "But we did manage to extract some concessions."

Schörner snatched the notebook, scanned the contents, and scoffed. "This is the proceeds from selling the gate to Europe? A pack of fucking incompetents!" He threw the notebook back at Speidel, laughed coldly as he returned to his seat, gritted his teeth, eyes darting between the notes and the British Isles on the big map.

"Field Marshal, it isn't nothing." Speidel closed the notebook. "Considering the Americans wouldn't even sit at the table, we gained quite a lot from them." He paused. "Enough to resolve many disputes."

"This is a disgrace, Speidel. I thought you had the sense to understand." Schörner sighed. "General, go issue the withdrawal orders." Schörner put on his peaked cap and rose."
 channelcrisis.113.a: ""I'll be in my office planning to crush the unrest in the East. We need these concessions... for now, at least.""
 channelcrisis.114.t: "An Unfair Deal"
 channelcrisis.114.d: "On a television screen in the corner of the room, Thompson and Smith could watch the impromptu celebrations. Though the picture was eyes-only, the revelry in the bar was much the same: cheers, shouted chants, patriotic songs sung over and over. For most people, the news that had brought them together was indeed a happy outcome - who would be unhappy with an agreement that guaranteed a Free Britain safe from German aggression?

"We could have," Mr. Thompson said, draining his third large beer of the night. Condensation dripped down the side of the fourth glass before him. "Fucking Germans. Goddammit, why doesn't the damn thing just drop dead..."

"Calm down, Thompson," said Smith, picking up the untouched beer with a hearty hand. "In twenty-four hours, this whole thing will be nothing but a memory. You can tell your wife her relatives can come back to England." He soothed, though his voice trembled slightly with lack of confidence. They had been advising the President on how to win Britain's freedom, and in the process, they had made concession after concession. What could have been an insurmountable wall containing Germany had become a row of picket fences. Rumors hinted that many on both sides of the Atlantic were unhappy with what Germany received; fortunately, the final outcome of the negotiations had blunted much of that criticism.

"Doe was right," Thompson muttered. "You have to follow one road all the way. Death or injustice - you have to choose one." He gripped his throbbing head with both hands. "Fuck, we could have gotten more. What the fuck did we even do?"

"You'll feel better tomorrow," said Smith. He looked at the television again: patriots waving newspapers announcing Britain's freedom was secured, veterans and their medals glinting in the lights, a young couple kissing in a shop doorway. Even though Thompson hated himself for giving away too much, Smith felt these sights made everything they had paid worthwhile. Britain had won freedom twice: first from its own fascist government, and then from the fascist empire across the Channel."
 channelcrisis.114.a: "If they knew the price of freedom..."
 channelcrisis.115.t: "Unexpected"
 channelcrisis.115.d: "Ferdinand Schörner pounced on the red telephone like a falcon, grabbing the receiver the moment it rang. "Schörner here. Mm-hm. Yes, he is here. Mm-hm." He took up a pen and notebook and scribbled the other's words. "Alright. Hmm. What? They actually handed it over?" Excited hands scribbled messy notes. "Alright. Understood, I'll issue the orders." He set down the phone and grunted.

"Word from the Foreign Office?" Hans Speidel, sitting at the operations room table, raised an eyebrow.

"Speidel, we should have fought. The goddamn Americans won't do a thing." He opened the notebook to show his men. Speidel pushed up his glasses and read, growing more surprised as he went.

"They... conceded quite a lot." He looked up. "Much more than I expected."

"They're softer than we thought. If these civilians weren't in the way, we could have conquered them outright."

"Regardless, this is a good result. They had to bargain with us; at least we won't look weak." Speidel shrugged. "Either way, we can turn our attention back to the East."

"Yes," said Schörner. "The Slav problem is large. Africa too." He leaned back in his chair and chuckled again. "Per the agreement, order our fleet to withdraw. Have the navy play "Erika" for the Americans on their way out; that'll piss them off. Come see me as soon as everything's done. I'm not like those diplomats; showing strength on a few sheets of paper isn't my style.""
 channelcrisis.115.a: "A lucky star descended on Germania, destroying every people still trapped beneath its iron grip."
 channelcrisis.1110.t: "Report on the British Negotiated Agreement"
 channelcrisis.1110.d: "TOP SECRET / [?global.date.GetDateStringNoHour]
Subject: Channel Negotiations Concluded

Report: Per BIGEYE intelligence confirmation, the Kriegsmarine has begun withdrawing from the English Channel. Other intelligence reports reveal German forces pulling back from the west and moving east, intent on strengthening their control in the East.

By now, the establishment of a pro-OFN British government is a foregone conclusion. Dossiers on all resistance leaders and exiled political figures are appended on pages 3 through 10. Given British anti-German sentiment, future pro-American governments will be stable.

For details on concessions made to Germany, see pages 11 through 13. Internal political backlash within Germany is expected, but its intensity will be reduced; German dominance in Western Europe will not be greatly affected.

Our victory in Britain has also won support from some OFN member states, particularly the former Commonwealth nations. They have pledged new aid. Since the successful negotiations, the great majority of American citizens approve of our intervention in the Channel crisis, and may support further international intervention.

Despite our success, the concessions above include the establishment of a demilitarized zone in southern England and restrictions on our deployment of nuclear weapons in the British Isles. Nevertheless, the emergence of an ally closely tied to the free world has undoubtedly opened a permanent crack in the Iron Curtain, overturning the traditional notion of German invincibility. Germany's future moves are hard to predict, but this development may mark a key turning point for the OFN."
 channelcrisis.1110.a: "Our old comrade holds the torch once more."
 channelcrisis.1111.t: "Report on the British Isles Negotiated Agreement"
 channelcrisis.1111.d: "Oberkommando der Wehrmacht
Abwehr Amtsgruppe III F
Top Secret
[?global.date.GetDateStringNoHourLong]

Briefing - Negotiations with Britain and the United States have concluded. Confirmed by Luftwaffe and Kriegsmarine reconnaissance, all American naval battle groups have fully withdrawn from the English Channel. Intelligence confirms the British have likewise honored the agreement, withdrawing from southern England to establish the Continental security zone as agreed.

The British and Americans have also reached additional agreements regarding relations with the OFN and the new British government, acknowledgment of Komitat security concerns, and other details; see page 3 for the full report. For a comprehensive analysis of the concessions we were forced to make, see page 9.

We must recognize that our influence over the British Isles is no more; whatever the outcome of the negotiations, a pro-OFN British government will emerge. Furthermore, though most of the fighting during the uprising was borne by the British Army, our own Heer still lost some equipment and men; for an assessment, see the appendix.

Though the outcome is not ideal, these negotiations allowed us to successfully avoid a catastrophic global conflict. At the same time, the concessions we obtained have greatly enhanced our credibility in power projection and crisis response. A recommendation for a comprehensive review of our current Atlantic security agreements is appended on page 16; briefings on our interests in Western Europe are appended on pages 27, 31, and 34 respectively.

May Germany be faithfully guarded."
 channelcrisis.1111.a: "Perhaps this is the best we can get from this mess."
 channelcrisis_nego.1.t: "Britain and America Propose Agreement"
 channelcrisis_nego.1.d: "The Foreign Office informs us that the OFN wishes to open a new round of negotiations. If we recognize the new British government and refrain from invasion, the OFN may make concessions regarding our security concerns.

Given that the standoff could trigger war with the United States, this may be a relatively wise choice, especially if we can extract enough concessions from the Americans to compensate for losing Britain. However, this undoubtedly means we cannot get everything we want, and in the end the gains may not outweigh the losses.

We could also refuse and continue to deter the OFN with overwhelming force. If we succeed, we can reassert European hegemony from a position of victory and teach the terrorists within the Komitat the price of betrayal. But if we fail, everything may be beyond redemption..."
 channelcrisis_nego.1.a: "Begin negotiations. See what we can get."
 channelcrisis_nego.1.b: "We do not negotiate with terrorists."
 channelcrisis_nego.2.t: "Germany Proposes Agreement"
 channelcrisis_nego.2.d: "Today we received a request: from the Greater German Reich, wishing for both sides to sit at the negotiating table and resolve the Channel Crisis peacefully. They are willing to accept the new government in London, demanding corresponding concessions from us to fully address Germany's security concerns.

This is a proposal that might save the world. If handled properly, while managing to give Germany the minimum necessary concessions, we will all go down in history. However, Germany surely will not give up Britain without major concessions, and we do not yet know what those major concessions are.

We could also continue with our established plan. If we can force Germany to concede through power projection, then the British Isles will surely win freedom again, and the European jailer will be humbled. But all of this depends on Germany conceding. If they refuse to yield, what horrors an entirely new world war would bring..."
 channelcrisis_nego.2.a: "Begin negotiations. See what we can do."
 channelcrisis_nego.2.b: "We do not negotiate with fascists."
 channelcrisis_nego.10.t: "Germany Refuses Negotiations"
 channelcrisis_nego.10.d: "As expected, Germany has refused our proposal to negotiate over the Channel Crisis. They seem determined to invade the British Isles and will not seek a peaceful, compromise solution for now. However, this refusal does not mean they will not change their minds later."
 channelcrisis_nego.10.a: "Until then, we can only wait, and remain resolute."
 channelcrisis_nego.11.t: "Germany Comes to the Table"
 channelcrisis_nego.11.d: "We have learned that Germany has accepted our proposal to negotiate over the Channel Crisis. However, do not delude yourself that these negotiations will be easy. If they recognize the new British government, they will surely expect maximum concessions from us to make the deal "worthwhile.""
 channelcrisis_nego.11.a: "See what they want."
 channelcrisis_nego.20.t: "The OFN Refuses Negotiations"
 channelcrisis_nego.20.d: "As expected, the Yankee masters and their British dogs have refused our generous proposal to resolve the Channel Crisis peacefully. Though we must continue to demonstrate strength on our own territory, this does not mean the OFN will not change its mind later."
 channelcrisis_nego.20.a: "Until then, faced with such a threat, we will not show weakness."
 channelcrisis_nego.21.t: "The OFN Comes to the Table"
 channelcrisis_nego.21.d: "America has finally seen reason and accepted our proposal to resolve the Channel Crisis through diplomatic means. At minimum, the Americans will demand that we recognize the new British government. Such a situation constitutes a serious security concern, and we will not accept it without major concessions. If an OFN government is to be recognized within our sphere of influence, it must be on terms we dictate."
 channelcrisis_nego.21.a: "If we must lay down our swords, we will fight the battle with the pen."
 channelcrisis_nego.3.t: "Diplomatic Checkpoint"
 channelcrisis_nego.3.d: "Our negotiations over England's status are progressing steadily, and both sides have reached consensus on a key part of the agreement. We are heading toward a peaceful resolution, and such efforts deserve recognition.

If the negotiations break down later, we can restart from the consensus reached at this moment, rather than overturning everything and starting from scratch. The agreement reached so far is reasonably fair to both sides; even if the negotiations break down, we should strive to keep it reasonable."
 channelcrisis_nego.3.a: "Continue negotiating."
 channelcrisis_nego.40.t: "Germany Withdraws from Negotiations"
 channelcrisis_nego.40.d: "Bad news has arrived regarding the Channel Crisis negotiations: Germany has withdrawn. They believe the OFN has not offered enough concessions, so they have walked out of the talks and continue to threaten invasion in the current standoff.

Though the negotiations have failed, we can resume them. Hopefully next time they will be wiser - if there is a next time."
 channelcrisis_nego.40.a: "A pity."
 CC_negotiation_cost_increase_tt: "The cost of restarting negotiations increases by £political_power_texticon §Y100§!"
 channelcrisis_nego.41.t: "The OFN Withdraws from Negotiations"
 channelcrisis_nego.41.d: "Just as we expected, Britain and America have withdrawn from the negotiations. Though, considering what we stand to lose, the terms we proposed were a mere drop in the bucket, they still deemed them unacceptable, stopped the talks, and continued their standoff against us.

If we wish, perhaps we can resume negotiations later. Until then, the Wehrmacht will keep watch to ensure the Americans do not violate our beloved fortress."
 channelcrisis_nego.41.a: "They'll come around, one way or another!"
 channelcrisis_nego.50.t: "Negotiations Succeed"
 channelcrisis_nego.50.d: "Good news has arrived from Germania: the Germans have agreed to make concessions and have reached an agreement with us to resolve the Channel Crisis. Though we and Britain must now abide by the agreed terms and limit as much as possible our impact on German security, from now on the world will no longer have to fear thermonuclear war."
 channelcrisis_nego.50.a: "We did what was necessary."
 channelcrisis_nego.51.t: "Negotiations Succeed"
 channelcrisis_nego.51.d: "We have received the latest news from Washington and London on the negotiations. The Americans have decided to make concessions in exchange for our recognition of the British government. Though this means Britain has left our sphere of influence, we can at least extract some benefit from it, and the world is no longer on the brink of destruction."
 channelcrisis_nego.51.a: "Next time you won't get such a good deal, yanks..."
 concession_1_Desc: "Any POWs or Komitat citizens detained by Britain must be released immediately."
 concession_2_Desc: "Britain will pay Germany a one-time compensation for major German corporate assets seized by it.

§YIf accepted§!:
(£TNO_game_rule_flag_FEN §YFree Britain§!): Pays £TNO_game_rule_flag_GER §YGreater German Reich§! §Y$0.100B§!"
 concession_3_Desc: "Britain's offshore resource extraction will be reduced and limited to 50 nautical miles."
 concession_4_Desc: "In addition to the existing agreement, Britain must also compensate for the various small business assets it has seized.

§YIf accepted§!:
(£TNO_game_rule_flag_FEN §YFree Britain§!): Pays £TNO_game_rule_flag_GER §YGreater German Reich§! §Y$0.400B§!"
 concession_5_Desc: "The new British government must agree to issue a formal statement acknowledging its past violations and injustices against European peace and prosperity, including the fault at Versailles and its role in fostering degenerate culture.

§YIf accepted§!:
(£TNO_game_rule_flag_FEN §YFree Britain§!): Political power: §R-50§!.
(£TNO_game_rule_flag_GER §YGreater German Reich§!): Political power: §G+100§!."
 concession_6_Desc: "To prevent Britain from being used as a military threat, and to ensure the English Channel's status as a vital Komitat sea lane, a "Continental Security Zone" will be established - a demilitarized zone along the southern coast of England.

§YIf accepted§!:
(£TNO_game_rule_flag_FEN §YFree Britain§!):
(All §Ysouthern coastal regions of England§!):
  Become demilitarized zones."
 concession_7_Desc: "Germany and its allies will be granted overflight rights over British airspace."
 concession_8_Desc: "Britain will renounce all territorial claims to the Channel Islands in perpetuity and recognize their status as German possessions.

§YIf accepted§!:
(£TNO_game_rule_flag_FEN §YFree Britain§!):
  Loses the core of the §YChannel Islands§!."
 concession_9_Desc: "The OFN will limit the number of personnel stationed in the British Isles."
 concession_10_Desc: "The OFN will reduce the number of personnel and aircraft stationed in Iceland."
 concession_11_Desc: "The deployment of nuclear weapons by the United States in the British Isles is prohibited."

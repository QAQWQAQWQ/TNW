 channelcrisis.1.a: "Why are you here?"
 channelcrisis.50.t: "Victory and Responsibility"
 channelcrisis.50.d: "Mr. Thompson did not care for the taste of nicotine. Though he had long conceded its occupation of the State Department, not a single cigarette was permitted in meetings he chaired. Young Mr. Smith was quitting, so he did not mind; old Mr. Doe could only relieve his stress by gripping a pen between his fingers. To most, the news that had brought them together was good news - who would not want Britain liberated from fascism?

"This has legs." Mr. Thompson could not help lifting his coffee cup for a sip between sentences. "This is the biggest American diplomatic crisis since the Aleutians."

"With respect," Mr. Smith adjusted his glasses, studying the projected map of Britain, "this is the best possible outcome for us, no? The Royalists like us, and those leftists and Bolsheviks are closer to progressives than anything. Either way, they'll certainly be a valuable ally in Europe."

"Yes. We'll win Britain. But those Nazis..." Thompson sat down and slurped again. "They think their core crony was stolen by American-backed terrorists. They won't stand for that. Our intervention will be seen as an act of war; they'll move directly to force."

"But Germany is already in chaos! If they can't handle their own problems, maybe in a few months they'll collapse on their own!"

Doe stood and stared at the map. He took up his pen and wrote on an unmarked spot in the Scottish Highlands. "Willie," his voice was impossibly low. "Landed with me in Glasgow in '44. The Nazi bastards shot half his head off with a sniper rifle, and thousands more died with him." He turned and picked up his folder. "We need to continue aid, to stand with the British. It is our duty. I must say, we should do more..."

"...because the whole world is worth gambling on this.""
 channelcrisis.50.a: "...because the whole world is worth gambling on this."
 channelcrisis.52.t: "Fourth-Floor Diplomacy"
 channelcrisis.52.d: "Twenty years. Twenty years had passed since David K. E. Bruce walked the streets of London. He had almost forgotten the fog and the cobblestones; stepping onto the tarmac at London Airport, those dusty memories suddenly came alive. The long nights with Frank Nelson and Colin Gubbins. The dreams of victory that died as he flew to Glasgow and to America. Defeat. Shame. Now, at last, redemption.

Well, not quite. Here he was on the fourth floor of the Macdonald House, a floor walled off from the Canadian Embassy and sealed tight by the CIA. A liaison sat beside him; the man looked like a bookworm, but behind the mask lurked a killer. He said nothing, merely recording everything. He was not the main player this time; the man standing before Bruce was, and the diplomat forced a smile, steeling himself for this dreadful conversation.

"Mr. Knight, you must understand that at a moment like this, I cannot guarantee that America will intervene fully." He dropped a sugar cube into his tea and sipped. "Of course, we will provide humanitarian aid, and Congress will pass a resolution making clear we stand with the British people. But that is all we can do for now."

"Mr. Bruce, I am grateful for everything you have done so far." After pouring his tea, Maxwell Knight did not touch it again. "But the Germans are planning to cross the Channel and kill us all. To survive, we need OFN security guarantees."

Exactly, Bruce thought. You need us, and God knows we want to help. The State Department and the Defense Department both have plans. So many plans drafted, debated, torn up, redone. Everyone ran into the same problem, as one drunken Defense staffer put it on the way back to New York: "If the Germans push back hard, we both go under.""
 channelcrisis.52.a: "Bruce wished he could do something, but another Sea Lion, another war, haunted them all."
 channelcrisis.53.t: "The National Security Birdcage"
 channelcrisis.53.d: "When the National Security Council gathered in the briefing room, the President felt as if he were inside a birdcage. Hawks and doves fluttered around [USA.GetLeader], squawking. On the table lay a map of Western Europe: to the north, the newly liberated Britain, tense; to the south, a growing mass of German forces, a sword ever ready to be drawn.

A hawk perched on his shoulder. "This is bluster, Mr. President." Talons prodded the coastline to the south. "The Wehrmacht is half-paralyzed. Even after the power struggle, their high command is still quarreling. It has battered morale at every level. They still have colonial messes to handle, and the political scene is chaos. Honestly, they can't do a thing right now. Send a few ships to scare them and they'll soil themselves."

A dove sat beside the President. "Sir, the Germans still treat Britain as their backyard. To them, this is just a pack of traitors who got lucky. They won't tolerate our meddling - we'd turn a small disaster into a catastrophe."

Another hawk pointed straight at London. "Besides throwing away our chance to return to Europe, do we also throw away a fighter friendly to the OFN, a nation of our own stock? If our allies decide to go it alone, or throw in with the Co-Prosperity Sphere, that consequence is on your head alone."

The quarrel peaked. Speeches, orders, and curses blended together. "We have to help them!" "And risk war?" "Screw it, I want war!"

"Enough!" [USA.GetLeader] pressed his palms together, fingers digging into the skin. The future of London - fireworks or fire, heaven or hell - rested in his hands."
 channelcrisis.53.a: "Let them in."

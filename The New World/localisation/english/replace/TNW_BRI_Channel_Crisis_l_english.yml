 channelcrisis.100.t: "A Final Farewell"
 channelcrisis.100.d: ""News from London has deepened concern; only time will tell whether the OFN is anything more than a paper ally -" channel click.

"It appears Nazi boots will once again set foot on the British Isles; the White House has just officially condemned the German invasion, but the President has yet to issue a public statement on the matter -" channel click.

"Humanitarian operations to evacuate British citizens are underway, but facing desperate crowds surrounding the evacuation points and limited resources, the scene mirrors the final days of 1945 -" channel click. After three channels, the President finally turned off the television and began to rub his face in frustration, then sighed wearily.

"Leave me alone." After the rustle of papers and the footsteps of those leaving the Oval Office, the President was alone. He picked up a bottle of premium whisky beside his desk, pulled the cork, and began to drink.

He knew this was essentially how the public saw him. What he had done, how he had changed America - none of it mattered. What was certain was that [USA.GetLeader] would go down in history as the only President who won back the gateway to Europe only to hand it back to the Nazis. Of course, he had his reasons; the world had come within a hair's breadth of sliding into the abyss. But the public would not see it that way, and neither would the other OFN member states.

Canada, Australia, and New Zealand expressed low-key condemnation and their "disappointment." Macmillan, the exiled Prime Minister, also took aim at him in interviews broadcast across America on radio and television."
 channelcrisis.100.a: "The President picked up his glass and drained it."
 channelcrisis.101.t: "Faithful Sons of Germany"
 channelcrisis.101.d: "Britain, of all places - fucking Britain. Josef remembered once playing cards with other fellows from the 53rd Airborne Brigade, joking about where they would be deployed first. Some guessed the East, to kill bandits; Friedrich thought Africa. No one guessed Britain, but then again, that was before chaos erupted again in the British Isles. Now they were camped at an airfield in the Lower Rhine, waiting for the air corridor to jump into Britain and unleash hell. Suddenly the barracks door opened, followed by a voice barking orders; he could barely make it out from the other end. Josef squinted against the harsh light and leaned toward Friedrich.

"What is it? Are we moving out?"

Friedrich grinned; the smile had no humor, only a touch of vindictiveness. "Looks like the Americans ran. Time for revenge." Josef suddenly remembered he had a brother in the British garrison. He nodded and began gathering his gear.

Less than half an hour later, they were about to take off, filing slowly onto the plane one by one. Josef took one last look back at the airfield, and at the sunrise faintly visible on the horizon. In Britain, about to become hell, how long would it be before he saw such a gentle sight again? He might be in Britain for months, even years; who knew?

"Hurry up, move it!" a paratrooper behind him complained. Josef rolled his eyes and climbed aboard, nagged by doubts. Still, he had enlisted to defend the fatherland. It was time to act."
 channelcrisis.101.a: "The motherland calls, and her sons answer."
 channelcrisis.110.t: "An Amicable Agreement"
 channelcrisis.110.d: ""Mr. Doe?" Mr. Smith knocked on the office door to announce himself. Doe looked up from a pile of documents: diplomatic cables and reports, lit warmly by the desk lamp. "They want to know if you're coming for drinks."

"Hm? No, I won't, thank you." Doe's head bowed again, signing his name on a report. "There's still a lot to do tonight."

"Come on, things can wait." Smith sat across from Doe. "We're throwing a victory party for the British, and here you are buried in... whatever this is. Come on, Jack." He stood. "Enjoy life."

"Thanks, Mr. Smith, but I have plenty to do. I'll join you in a bit, once I've tidied things up."

Mr. Smith shrugged, told himself he had at least tried, and walked back into the lamplight. Doe bowed his head again. Another State Department congratulatory cable, another heartfelt thank-you from the British government. For America and Britain, the negotiations had gone smoothly; Germany had withdrawn without a fight, so Britain need not fear "Sea Lion" anymore.

In truth, some part of Doe had never wanted to reach such an agreement. This place - where he had fought for his life in the Scottish Highlands, watching hundreds of comrades die organizing the defense. When he had advised the President to reach agreement, he had seen those comrades' bloodied faces and glaring eyes. They asked him why he chose negotiation instead of battle. But they could no longer dictate his actions; with a single pen, he and his new comrades had kept Germany out."
 channelcrisis.110.a: "He told the fallen that without an agreement, there would be no bodies left to bury in the next war."
 channelcrisis.111.t: "Indulging England"
 channelcrisis.111.d: ""That is how it is." Hans Speidel's head turned toward the world map on the wall. The eyes of everyone in the operations room followed him to the map, where the British Isles were forever colored the same as the Americans across the Atlantic. "An hour ago, the Foreign Office contacted me to inform us that southern England will be demilitarized. The die is cast; now we need -"

Someone slammed a fist on the table, the echo lingering. "To hell with it!" Ferdinand Schörner clenched both fists; had he not worn gloves, blood would have welled at his nails. "What are they thinking? How much have they given up just to avoid this little war?"

"Field Marshal, it is not entirely adverse. The Americans were forced to make some concessions, and -"

"This is nowhere near enough. Do you know their leader? That dwarf Joseph, the Tory? He's a Jew." He spat the three words, the fury in his voice seeming to burn through the table before him. "Think about it - a fucking Jew ruling European soil!"

The operations room fell into a silence of confusion and dread. "Worst of all," Schörner stood, "is the OFN - God, the OFN." Speidel nodded, and several of his entourage nodded with him. "Against them, these terms are nothing but minor obstacles. Tell me, Speidel, is this enough to avoid a war?"

Though Speidel was reluctant to openly agree with Schörner, he found himself nodding. Across the Channel, the jubilant OFN was planning its next move, having satisfied the masters of Europe at the tiniest cost. That night, the operations room became a club for impotent men; Schörner was especially dejected, hungry for revenge. But all he could do was stare at the world map."
 channelcrisis.111.a: "We should have hit them with nukes long ago."
 channelcrisis.120.t: "A Happy Ending"
 channelcrisis.120.d: "A child on a bicycle sped past Eugene, the American GI by the roadside; his face was still messily painted with a British flag. A rather elderly couple danced in the street, faces wreathed in smiles, as if the city belonged only to the two of them. With a small, battered old camera, a Washington Post reporter struggled to capture this British frenzy, muttering that the New York Times would surely do it better.

The sentimental part of Eugene wanted to join in, to dig into everything he felt, to release some impulse. The rational part knew that even standing aside, watching the British cheer, was enough. He took out a tarnished brass lighter engraved with a figure holding a torch, and prepared to light a cigarette. Looking at the lighter, he remembered the years his father had proudly served in the 2nd Marine Division. Even after losing so many brothers on Guadalcanal, he had chosen to follow his comrades through to the end of the Second World War. And on a street in Manchester, Eugene found that same feeling.

He had never been to Britain before. As a child, the roadside novels depicting the heroic, tragic Battle of London were always bestsellers. Every time he passed the comic book store in his hometown of Chattanooga, his stomach turned with a strange discomfort. That war had been heroic, our weapons powerful, our soldiers tough beyond measure - and yet we still lost. Everyone in the community knew someone who had lost a loved one, their lives ended forever in Eisenhower's last futile gamble. Once the shell of silent endurance forged in people's hearts broke, suppressed grief flooded out - for the families who received coffins, and for those who received none.

The song "We'll Meet Again" began to drift through the air, courtesy of the instant sound system the collaborators had set up for the broadcast. Eugene lit his cigarette and propped his leg against the weathered brick wall. This was a broadcast too, he chuckled to himself. One of his comrades was twisting his hips wildly, trying to show the British girls some dances guaranteed to be cool back in America. America was back, and fascism had lost its grip on Britain. His job - like every American's - was to snatch every life back from the cliff edge of tyranny."
 channelcrisis.120.a: "Freedom is fought for, not earned."
 channelcrisis.130.t: "Stepping into the Abyss"
 channelcrisis.130.d: "To the American sailors of the Saratoga battle group, the German warships facing them in the Channel seemed devoid of life, like enormous gray boulders staring at them across the cold, black water. They floated there, dreadfully still; on the Anglo-American side, only the sounds of waves and wind could be heard.

"Do you think they're as scared of us as we are of them?" one sailor asked, the wind howling as he prepared to light up. The other shrugged.

"I fucking don't know, Walter. That's what I think, anyway. Maybe if it were true, they'd just stay over there. Want a light?" The first sailor waved a hand, tried several more times to light his cigarette, finally succeeded, and laughed.

"Alright! Took forever -"

A huge boom, followed by a terrible tearing of metal. He stared in shock as a ship beside him was engulfed in flame. In an instant, chain after chain of explosions rang out, and even the German warships across the way began to burn. The two scrambled below, the sounds of death and the orders blaring over the loudspeakers to man battle stations chasing them.

"They actually did it." The second sailor panted. "They actually did it. Playing with atomic fire."

Above them, war raged; the once-dark surface of the Channel was lit by explosions, burning wreckage, and low, screams. If anyone surveyed this disaster from high above, they might have wondered whether there had been another way. Was all this truly inevitable? Was this the only consequence of a mad, headlong rush toward freedom? Perhaps the resistance had been right; if things had gone differently, the German tyrants would have been beaten back. This question, like so many others, would never have an answer, for the footsteps of history were fixed here."
 channelcrisis.130.a: "War, fire. Before long, only silence."
 channelcrisis.131.t: "Twilight of the Gods"
 channelcrisis.131.d: "The electric bell rang, and the U-boat navigator's face went as white as a ghost. Major Hinze was calm; he pushed the frightened little man aside, seized the receiver on the wall, and pressed it to his ear. The sound on the other end was faint, but he recognized the voice immediately.

"Major Hinze," the voice crackled. "Can you hear me?" He nodded, then realized with a start that the Admiral could not see him.

"I can, Admiral. Major Hinze at your service."

"Good. I thought it unnecessary, but the Americans refuse any compromise. Faced with such reckless aggression, the Führer authorizes us to take all necessary measures to defend the British Isles. Prepare to fire; fire as soon as you are ready." The line went dead. Hinze said nothing, hung up, and turned to face the frightened sailors crowding the control room.

"Prepare to fire."

He could see his weapons officer hesitating. "Sir,"

"Move!" he roared, and the officer hurried off. Hinze crossed his hands behind his back, leaving his subordinates behind. He could hear other sailors muttering to one another, whispering, with all discipline gone. Normally Hinze would punish them for it, but what was the point now? It would all be over soon. He thought back to those rare days, coming home from work and taking his wife and daughter to see his parents in Stuttgart. That city would soon burn to ash in nuclear fire. All because of the Yanks.

He should have known it would end like this. Ever since the British abandoned the New Order and their European brothers, they had grown more and more insane. They only had to stop, he thought in frustration. Stop for a moment, think about what they were doing. It was all their fault."
 channelcrisis.131.a: "Sullen, he sat down and quietly waited for the end of the world."

 USA_Channel_Crisis_buildup_desc: "Once-distant hopes have become reality. Our old friend Britannia has risen from the grave and seeks to stand alongside the free world once more. No one knows how Germany will extricate itself from the flames of Europa. The British Isles are the Atlantic gateway of the Komitat; any move risks escalation. For now we can only hold our breath, but we must prepare for what is to come."
 GER_Channel_Crisis_buildup_desc: "As if Africa and the East were not trouble enough, our control over Britain has completely collapsed. A pack of damned Judeo-Bolshevik bandits overthrew the government, seized this strategically vital fortress, and robbed us of our sea lanes. No one knows what they will do next - and we cannot let them. The Heer is out of our hands for now, and we are powerless to act, but we will prepare. It is only a matter of time."
 ENG_Channel_Crisis_confrontation_desc: "Placeholder"
 USA_Channel_Crisis_confrontation_desc: "The situation could not be clearer. Even now, any challenge to the fortress of Europa will be met with fierce German retaliation. Whether this was the best choice or not, we are now locked in a dangerous stalemate, and the White House grows increasingly uneasy. We cannot waver for a moment: a corner of the world in the long night has finally seen dawn, yet it may plunge back into endless darkness. One false step, and the whole world could fall into an even deeper abyss."
 GER_Channel_Crisis_confrontation_desc: "The American puppet-masters behind the British bandits have revealed themselves, now recklessly and almost madly trying to use the power of annihilation to stop us from restoring order. Once we demonstrate the full weight of Continental power, they will regret it. Yet we must acknowledge that the situation is already extremely dangerous. If attempts to force their retreat fail, we may have to resort to more coercive measures..."

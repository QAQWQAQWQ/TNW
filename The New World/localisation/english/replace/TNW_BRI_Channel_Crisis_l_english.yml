 channelcrisis.51.t: "A Special, Special Relationship"
 channelcrisis.51.d: "If you asked Patrick Hemsworth what he thought of international politics, he would say he had no idea. Patrick was busy, and frankly he would rather spend his rare free time partying than dwelling on politics. That was why he ended up in his university cafeteria nursing a hangover, watching the international news to take his mind off things. It was rather ironic.

"Our correspondent confirms that the Komitat-backed regime has been completely overthrown." The man on the television, glasses perched on his nose, read his notes in a flat voice. "The revolutionaries have declared a provisional government; the German plenipotentiary and the German garrison commander have fled the country."

Oh? Patrick mused. The existence of a Free Britain was somewhat abstract to him; the last time such a country existed he had been only two years old. His lived experience told him that what it once was still permeated everyone's understanding of the world, but it felt more like a distant, almost faded legend. Until now.

"We go now to a report from London." The newscaster continued, and the camera abruptly cut from the newsroom to city streets, framing an elderly man smoking a pipe.

"Thanks to the struggle and sacrifice of many brave men and women," the old man said, "we Britons stand here today, victorious against want, fear, and tyranny. But the fight is far from over. Without help, we face the tyrant across the English Channel alone. Friends across the Atlantic and across the world, we call on you to stand with us against this wave of oppression."

Patrick was speechless. The man on television looked exactly like his grandfather. It was one thing to know that Nazis oppressed people in some far-off place; it was quite another to see it from someone who looked just like him and spoke the same language. What would happen if the President stood aside?"
 channelcrisis.51.a: "Over breakfast, he decided to follow the news a little more closely."

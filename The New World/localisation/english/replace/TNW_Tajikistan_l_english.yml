 TAJ_flooded_streets: "Flooded Streets"
 TAJ_flooded_streets_desc: "To say Tajikistan is exhausted would be an understatement. The people are weary, and doubt fills the streets. With both socialism and the war against the Afghans ending in the same failure, the government has suffered a massive loss of trust.`n`nAnger and discontent flood the streets like a torrent. The regime is doing everything it can to stem the tide of rage, but it is increasingly clear that some outcome will eventually come; it is only a matter of what that outcome will be and when it will happen."
 TAJ_fading_economy: "Fading Economy"
 TAJ_fading_economy_desc: "Looking across the globe, Tajikistan has only two trading partners. Deep in the heart of Eurasia, Tajikistan is isolated, and with the embargoes from Iran and Afghanistan, only Kyrgyzstan and Uzbekistan remain as trade partners.`n`nThey know our desperation, so they negotiate accordingly. Famine spreads across Tajikistan, the economy worsens by the day, withering like a vine without water. Something must be done, but the options are few."

 TAJ_Bobodzhan_Gafurov: "Bobojon Gafurov"
 POLITICS_BOBODZHAN_GAFUROV_DESC: "Few are as loyal to socialism as Bobojon Gafurov, a renowned hardliner who remained faithful to communism even after the Soviet collapse and serves as First Secretary of the Communist Party of Tajikistan. He began as a historian and quickly rose to become party leader. Though German iron heels trampled the Soviet earth and Tajikistan broke away from the USSR, he still controls another communist regime and seeks to rise again and retake control.`n`nEven as the West Russian Revolutionary Front and the Kazakh Red Army collapsed in the West Russian War and its aftermath, Gafurov remained loyal to the revolutionary cause and maintained close ties with neighboring Kazakhstan. He knows he is not well-versed in politics and is not the best person to lead the country through this turbulent period, yet he refuses to hand his power over to anyone. This is not because he wants to be a dictator, but because of his ideals and beliefs: Gafurov has found no one in the country he considers worthy of carrying the burning torch of socialism, and so he has maintained his grip on the nation.`n`nNevertheless, the General Secretary's control is slowly fading day by day. The Politburo, the regime's small governing body, has members whose loyalty to the leader is waning. Meanwhile, dissidents opposed to the government are preparing to take matters into their own hands and overthrow this clearly failed system. Gafurov's rule may soon come to an end."
 TAJ_Buriniso_Berdieva: "Buriniso Berdieva"
 POLITICS_BURINISO_BERDIEVA_DESC: "Born in Panjakent in 1927, Buriniso Berdieva is a young female politician whose world was soon destroyed by the upheavals of the twentieth century. Many of her generation could easily be considered lost; amid the destruction of World War II and subsequent conflicts, many Tajiks felt they had completely lost their way in the era they were born into. Yet Buriniso broke free from this predicament.`n`nShe stayed in Tajikistan rather than fleeing to Kyrgyzstan or Afghanistan to the south. The first Tajik-language journal, Knowledge and Civilization, was published by her press. This was not only a way for ordinary Tajiks to keep up with the rapidly changing world, but also provided another common ground to unite the Tajik people. Thus, in a way, it is no surprise that she is seen as the mother of this young nation.`n`nWith the democratic revolution complete, Buriniso pressed on despite the difficulties; despite the people's conservative leanings, she found herself elected as head of the Tajik state. Her task is simple yet grand: to build the nation and the civic spirit of its citizens, to revitalize Tajik culture, and to ensure the country is not violated during this period. The road ahead for Buriniso is not easy, but the road ahead for Tajikistan has never been easy; now, she will bravely meet the challenge, and so will her people."

 POLITICS_MAWLAWI_HINDUSTONI_DESC: "During the Bolshevik Revolution, Muhammadjan Rustamov left Central Asia for Afghanistan and India (sometimes called Hindustan) to study Islamic knowledge, earning him the nickname Hindustoni. This experience deepened his faith and made him determined to preserve the traditional ways of his homeland from decades past.`n`nIf the great catastrophe that befell the Tajik people has any meaning, it must be a side effect of the last judgment. Unfaithful communists ruled for decades, but their oppression was merely a trial for the faithful. Now that what was destined to crumble has turned to ashes, the steadfast believers can finally establish an Islamic state. Islam has never been the religion of radicals or extremists; in all times past and present, it is the religion of the steadfast and prudent. Believers have endured oppression from all sides, remaining devout even in adversity.`n`nNow, a moderate, conservative, traditional state — built on the principles that brought peace and prosperity to Tajiks of old — the Islamic State of Tajikistan, stands tall between heaven and earth, and Hindustoni is its guardian. The storms of revolution and radicalism are disasters; to prevent the nation from suffering this catastrophe, Hindustoni will defend the country until this long, steady, and determined labor bears fruit."
 POLITICS_NUSRATULLO_ABDULKHAKOV_DESC: "The Tajik people have been betrayed more times than they can count. First came the Russians in imperial finery, draining everything from the country; then they changed into peasants' clothes, proclaiming working-class unity and proletarian victory — but in the end their goals were no different from before.`n`nYet when the hollow Russians were crushed by Germany, the blood brothers of the Tajik state were enslaved by the Kingdom of Afghanistan, once again coming to seize the wealth of this land. The communists knew everything about pleasing the top brass in Moscow, but knew nothing about serving the people. In those miserable days, the communists, loyal only to foreign masters, failed spectacularly. Finally, the Tajik people spoke up. They chose to cut ties with foreign masters and foreign ideologies.`n`nThey chose to elevate a true Tajik, Nusratullo Abdulkhakov, as their leader, who will unite all scattered Tajiks under their banner. At last, the Tajik people are ruled by their own kind for the first time this century, and the time is ripe for the nation to take its rightful place in Central Asia."

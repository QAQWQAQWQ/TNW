 TNO_ElectionSeason_Info:0 "Although England has changed in many ways since the end of the Second World War due to various conflicts, elections remain an important and respected tradition. For simplicity, Britain's parliamentary seats are divided into regions, each allocated a number of seats based on population, from bustling London to sparsely populated Cornwall. A party's goal is to win the loyalty of the majority of these seats.\n\nSince each region has a fixed number of seats, votes are calculated as a percentage and seats are allocated proportionally. However, note that seats won are counted by party faction, so if a party has multiple factions, they are counted together when determining which party holds the majority. Thus, always be cautious when viewing projected winners - if the second and third-place factions belong to the same party, victory may be closer than it appears.\n\nAfter all seats are counted, the party with the most seats forms the government and wins the election. Good luck in the upcoming election. May the voters always favor you."

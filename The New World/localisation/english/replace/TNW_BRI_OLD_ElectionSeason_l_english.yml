 ENG_ElectionSeason.7.t: "The Choice of Direction"
 ENG_ElectionSeason.7.desc: "No one can say the contenders haven't done their utmost - every deal made, every bit of support gathered, every path walked. Now is the night of reckoning.\n\nEnglish elections are usually private and quiet affairs, with results never in doubt. But this election is different; voters and MPs alike do not know who will win, and can only watch as the votes roll in to see who supports whom.\n\nBeyond expected trends and loyal support, unexpected betrayals lurk. But as night falls, they all converge in one direction. England knows who has won this election, and who will wield enormous influence over the nation."
 ENG_ElectionSeason.7.a: "The Royalist Party wins the election!"
 ENG_ElectionSeason.7.b: "The Union Britain Party wins the election!"
 ENG_ElectionSeason.7.c: "The National Front wins the election!"

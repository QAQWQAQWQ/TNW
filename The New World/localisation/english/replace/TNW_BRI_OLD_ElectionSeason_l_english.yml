 ENG_ElectionSeason.4.t: "The Choice of a Free People"
 ENG_ElectionSeason.4.desc: "Months of ads, speeches, and rallies. Debates, arguments, and insults. Shouting and heated discussion. And now, it all comes down to this. The choice of the English people.\n\nBoth parties have worked tirelessly to ensure victory. Perhaps they could have done more? Avoided some mistakes? Run a more positive campaign? Maybe. But both campaigns have done everything they can to win the upcoming election. This is about the nation's future, and nothing is more important.\n\nAfter casting their ballots, the English people rush home to watch and listen to the results. Many had predictions, based on their own biases and hopes, others backed by polls and samples. But there is only one way to know for sure. Counting the votes."
 ENG_ElectionSeason.4.a: "The National Democratic League wins the election!"
 ENG_ElectionSeason.4.b: "The Socialist Labour Party wins the election!"
 ENG_ElectionSeason.4.c: "The Movement for a Soldier's Army wins the election!"
 ENG_ElectionSeason.5.t: "Election Season"
 ENG_ElectionSeason.5.desc: "Whether we like it or not, the Royalist Split forces us to choose sides in the upcoming election. Whatever Prime Minister Home may have planned, we must decide. Do we follow Macmillan and bring England the reforms it desperately needs? Or work with Thatcher to stabilize the nation and begin rebuilding?"
 ENG_ElectionSeason.5.o_ue: "Make England better, vote Union Britain!"
 ENG_ElectionSeason.5.o_rp: "Stabilize the nation, vote Royalist!"
 ENG_ElectionSeason.5.o_nf: "Long live England, vote National Front!"

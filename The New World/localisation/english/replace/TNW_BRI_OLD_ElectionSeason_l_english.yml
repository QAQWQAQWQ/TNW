 ENG_ElectionSeason.1.t: "The Duty of Englishmen"
 ENG_ElectionSeason.1.desc: "The moment has finally arrived. Every seat in the national and local parliaments has its candidates, and each party has put forward its preferred next Prime Minister - the master of 10 Downing Street. Now, England's brief, chaotic, rare, and nation-defining tradition - the election - is underway.\n\nThe two main parties are the National Democratic League and the Socialist Labour Party. The NDL, led by George Jellicoe and supported by Claude Auchinleck, seeks to restore pre-war England with necessary reforms to bring the country up to date and restore its respect on the world stage. The SLP, led by Harold Wilson and supported by Bill Alexander, advocates more radical change, seeking to free English workers from their chains and strive with the global proletariat toward a more equal future free of poverty.\n\nAdditionally, David Stirling's party is also running, though most observers consider it an extremist fringe party. Thus, voters face a choice between Jellicoe's promise of restoring past glory and Wilson's promise of creating a bright future."
 ENG_ElectionSeason.1.o_ndl: "For Queen and Country, vote NDL!"
 ENG_ElectionSeason.1.o_slp: "For peace, vote SLP!"
 ENG_ElectionSeason.1.o_msa: "Defend Britain, vote MSA!"

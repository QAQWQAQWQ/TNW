 POL_Warn:0 "§RPoles will eventually throw off their oppressors, but their prospects for survival against the resurrected German colossus are indeed very slim.§!"
 POLITICS_HANS_FRANK_DESC:0 "Lawyer, soldier, loyal Nazi — and perhaps now, a king. Hans Frank devoted his life to the National Socialist Party, and with his Führer he participated in the failed Beer Hall Putsch. During World War II, the Third Empire crushed Poland with unstoppable force, and Frank was appointed Governor to administer the territory. Working hand in hand with the SS, he broke the spine of the Polish people, slaughtering scholars, clergy, and any Pole who might threaten the New Order. Under Frank and the SS, the blood of countless civilians was refined into fuel for the furnace of death.`n`nBy 1942, Hitler no longer favored Frank as before, and the Governor found himself increasingly isolated within his territory. The betrayal of the SS during the West Russian War ignited the Führer's fury, leading to the complete expulsion of Himmler's faction from Poland. Now Frank was truly alone; the subhumans in the concentration camps had been slaughtered to extinction, leaving him nothing but a slave shipper supplying Germania. No glory awaited him ahead, no new victory to stage a comeback. Unless, of course, Frank creates his own opportunity for glory.`n`nAs undercurrents stirred in Germania and Hitler's mental state declined, Frank's grip on Poland only grew stronger. The Governor spent his days dreaming of building more skyscrapers, monuments, and art museums, imagining Warsaw transformed into a showcase of Aryan culture. People mocked him privately as King Stanislaw — but behind the mockery lay a truth: Hans Frank might actually become a king."
 POLITICS_INTERIMREGIERUNG_DESC:0 "The General Government has once again knelt beneath the German iron heel. By order of Martin Bormann, an interim transitional government has been established to stabilize the region. This government is composed of the most efficient German bureaucrats, and can immediately hand over power to a new commissioner appointed by the Führer, should he so desire."
 POLITICS_EDUARD_WAGNER_DESC:0 "This land once called Poland has become Germany's core heartland, a vital link between east and west. Now that Poland is permanently conquered, a ruthless figure is needed to ensure the trains run on time — someone decisive, selfless, and unburdened by scruples. Eduard Wagner is that man.`n`nLogisticians rarely make history, but as Quartermaster-General, Wagner had already associated with Himmler and Heydrich since 1939 without becoming their creature. His zeal for security measures behind the front lines was striking, coordinating the Wehrmacht and Einsatzgruppen into an efficient machine of repression. As Germany expanded eastward, his responsibilities grew, but Wagner was no yes-man to his superiors. He once directly expressed his concerns about fuel to Hitler, earning the Führer's temporary wrath but also a reputation for never sugarcoating the truth. Within the Wehrmacht, his opinion carried increasing weight; though on the margins of power, his influence grew.`n`nYears of waiting have only sharpened Wagner's desire for the pinnacle of power. He will stop at nothing to ensure the heart of the fatherland never stops beating."
 POLITICS_THEODOR_KOCH_DESC:0 "The German Reich is a machine — and who better than an engineer to operate its most vital components? Though the General Government is important to Germany, it remains backward, far from the German core it is meant to integrate into. That is why Theodor Koch is here.`n`nA rifle is a beautiful thing. It is a machine with a single purpose, designed to adapt to every environment and condition. Koch's time at Mauser left him captivated by the purity of firearms. But there is no loyalty in business, and Koch soon applied what he learned at Mauser to products of government-sponsored national factories. That impressive combination of technical and commercial savvy carved out his own niche within the conglomerate. He not only dominated the small arms division but guarded his technical secrets like a dragon hoarding treasure. And the reconstruction of the General Government offered him yet another opportunity.`n`nTurning gears and interlocking conveyor belts, with endless hands working in endless factories — this is Koch's vision for the General Government. They exist for one purpose only: to arm Germany. And on every rifle, pistol, helmet, and bullet produced, there is only one manufacturer stamped: General Government."
 POLITICS_WERNER_DOLLINGER_DESC:0 "Werner Dollinger is an oddity, a genuine reformer favored by the establishment. Though his background in economics and sociology might arouse suspicion among conservative party circles, he is a loyal patriot who served in the Wehrmacht on the Eastern Front. After retiring, Dollinger toiled diligently in economic planning, serving his native Bavaria with consummate skill. Yet recently, his unique and moderate reformist ideas have begun to attract attention.`n`nThis Bavarian industrial heavyweight's preferred candidate for Governor, with his high-quality industrial analysis reports and precise fiscal forecasting, is the ideal agent to integrate German capital interests in this underdeveloped former Polish territory. His affable style and position as a moderate reformer have also won him support from the party establishment. If governed wisely, perhaps a delicate balance can be struck between German interests and Polish livelihoods — perhaps."

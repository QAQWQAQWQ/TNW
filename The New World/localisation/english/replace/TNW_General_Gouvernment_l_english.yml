 GGN_terrified_garrison:0 "Terrified Garrison"
 GGN_terrified_garrison_desc:0 "The German garrison is crushed by fear, unwilling to carry out even the easiest tasks."
 GGN_government_in_flames:0 "Crisis-Stricken Government"
 GGN_government_in_flames_desc:0 "After the failed assassination attempt on Hitler, the garrison fell into crisis. Many fear the Polish underground government has returned."
 GGN_unstable_government:0 "Weak Government"
 GGN_unstable_government_desc:0 "The garrison has calmed down somewhat and actually begun patrolling all of Poland."
 GGN_underground_government:0 "Polish Underground State"
 GGN_underground_government_desc:0 "We don't know where they are, or who they are, but we're no fools! We know those despicable Poles and their secret government have been leading their evil partisan forces behind the scenes for years! Though we won't admit it, the truth is becoming clear: to truly control this country, the Polish Underground State must be destroyed! Though insurgency is rising, Fatherland will surely come to patch things up; we just need to keep the ship from springing a major leak!"
 GGN_tooltip_1:0 "The Polish Underground State will inevitably take action against you..."
 GGN_not_fine:0 "We've weathered the storm for now..."
 GGN_end_of_the_line:0 "The Poles may not be as weak as we thought..."
 GGN_its_time:0 "When the time is ripe, the secret government will launch a surprise attack on the garrison!"
 POL_germanys_loyal_sons:0 "Loyal Sons of Germany"
 GGN:0 "General Government"
 GGN_DEF:0 "General Government"
 GGN_ADJ:0 "German"
 GGN_Underground_State:0 "Polish Underground State"
 GGN_Underground_State_desc:0 "Decades ago, in an unprecedented storm, the Wehrmacht swept across Europa. The Poles resisted bravely against overwhelming odds, until the end — and from then on, the light of the Polish nation was forever extinguished.`n`nThat is what most people believe.`n`nDecades have passed, and both those watching from the shadows and Hans Frank's government in Kraków have come to realize that the Polish nation survived in the shadows — no, grew stronger. The General Government is incompetent, the Poles are resourceful, and so the Polish Underground State has become a thorn in the side of Germany and its hegemony over Polish territory.`n`n§RTheir goal is perfectly clear.§!"

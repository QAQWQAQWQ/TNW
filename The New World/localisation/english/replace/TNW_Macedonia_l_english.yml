 POLITICS_METODIJA_ANDONOV_CENTO_DESC: "The struggle for Macedonia seems endless. For over twenty years, Metodija Andonov-Cento has watched friends and family die, and watched his homeland ravaged by royalists. But look into his eyes, and you will know that the war was worth it. Macedonia was worth everything.

Andonov-Cento was born under the yoke of the Ottoman Empire, and watched Macedonia fall into the hands of one conqueror after another. Thirty years later, he joined the sea of protest; soon, he led the uprising. He proved his exceptional ability to lead troops in battle, and quickly became the de facto leader of the partisans.

Under his leadership, the partisans shifted from pure communism to a more inclusive and open nationalism. Although the hardline old guard objected, it proved effective. From Andonov-Cento, almost every Macedonian could find a side they supported; when he led his troops to capture Skopje, almost every Macedonian took to the streets to fight alongside him.

Now, Macedonia is finally free. Fifty years of struggle have borne fruit. There is still much to do — unifying the standard national language, liberating the land, forming a government. But for now, put all that aside and take a deep breath. The sweetest air in the world can only be found in Macedonia."
 POLITICS_MIHAJLO_APOSTOLSKI_DESC: "In another world, perhaps Mihajlo Apostolski and Metodija Andonov-Cento would have gotten along. These two men saved Macedonia in its hour of need. These two men dedicated themselves to Macedonia's liberation. These two men witnessed Macedonia's freedom.

But one of them lost his way. By blindly accommodating the accepting Bulgarian reactionaries, he gradually alienated the base of support he had among Macedonian youth, and gradually betrayed their dream of independence. When Andonov-Cento went his own way, Apostolski found his way back.

Apostolski is now the leader of Macedonia, and the fear he spreads has come to dominate daily life in Macedonia. Both scholar and soldier, he has long described Bulgaria as an oppressive nation that Macedonia must oppose. With foreign enemies all around, the Chairman has no choice but to isolate Macedonia from the world.

Now, Macedonia is independent — too independent. The army grows, and every city is armed to the teeth, so that they are interlocked. Yet Bulgarians are treated as second-class citizens, and even Macedonians cannot escape the government's surveillance. Apostolski is not the type to abuse power wantonly, but to win freedom for his nation, he had no choice. Until the world accepts Macedonia, he will never step out of the fortress he has built."

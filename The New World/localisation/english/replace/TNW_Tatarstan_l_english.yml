 TAR_Farakh_Kamaldinov: "Farakh Kamaldinov"
 TAR_free_tatars: "Tatars Shall Never Be Slaves!"
 TAR_free_tatars_desc: "The Tatars once ruled the steppe, witnessing glorious days. But for centuries we have groveled beneath the Tsar's throne, sent to bleed and die in Russian wars. Today, we choose to roar at our oppressors: "Enough!" No Russian warlord's ambition shall spill Tatar blood! To defend the freedom we have won, we will use every means at our disposal."

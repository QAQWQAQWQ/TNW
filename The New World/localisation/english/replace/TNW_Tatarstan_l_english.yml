 TAR_Abdulla_Alis: "Abdulla Alish"
 POLITICS_ABDULLA_ALIS_DESC: "Abdulla Alish may be a Soviet citizen, but first and foremost he is a Tatar, and he holds his homeland above all else. The son of a peasant, Alish became one of the most famous Tatar writers and journalists. During World War II he served in the Red Army, narrowly avoiding capture by the Germans near Bryansk. When the Soviet Union collapsed, he simply stayed home. The Tatar Autonomous Soviet Socialist Republic narrowly escaped the worst of the war, yet still tens of thousands were sent to the front, never to return. More importantly, for the first time since the failed Idel-Ural state of 1920, they tasted true freedom. Once they had it, they never wanted to give it up. When the West Russian Revolutionary Front came demanding suzerainty, the Tatars accepted, in exchange for broad autonomy and exemption from Russian law. Their relations with the Front were tense but peaceful — until the West Russian War broke out, and the Russians tried to extend Red Army conscription to the Tatars. The very thought of Tatars being forced to bleed in a Russian war was more than many could bear, Alish among them.

The Tatars took up arms to fight for the freedom they had long been denied. The national poet Alish became a war hero of the era, rising to fame through his valor both on the battlefield and in speech. When the Soviet forces under Pyotr Gavrilov gave ground and retreated north, the people heaped praise on Alish and proposed electing him mayor of Kazan. As the highest-ranking civilian official, he was effectively the first president of Tatarstan, and he signed the Tatar constitution into law. Alish helped win freedom for his homeland, and he will fight hard to defend it."
 POLITICS_SABIR_AKHTYAMOV_DESC: "Sabir Akhtyamovich Akhtyamov may be a Soviet citizen, but first and foremost he is a Tatar, and he holds his homeland above all else. The son of a blacksmith, Akhtyamov served in the Red Army, but due to failures in the chain of command he was never sent to the front. When the Soviet Union collapsed, he simply stayed home. The Tatar Autonomous Soviet Socialist Republic narrowly escaped the worst of the war, yet still tens of thousands were sent to the front, never to return. More importantly, for the first time since the failed Idel-Ural state of 1920, they tasted true freedom. Once they had it, they never wanted to give it up. When the West Russian Revolutionary Front came demanding suzerainty, the Tatars accepted, in exchange for broad autonomy and exemption from Russian law. Their relations with the Front were tense but peaceful — until the West Russian War broke out, and the Russians tried to extend Red Army conscription to the Tatars. The very thought of Tatars being forced to bleed in a Russian war was more than many could bear, Akhtyamov among them.

The Tatars took up arms to fight for the freedom they had long been denied. Akhtyamov became a war hero of the era, rising to fame through his valor on the battlefield and his logistical capabilities in the rear. When the Russians gave ground and retreated north, the people heaped praise on Akhtyamov and proposed electing him mayor of Ufa. As the highest-ranking civilian official, he was effectively the first president of Tatarstan, and he signed the Tatar constitution into law. Akhtyamov helped win freedom for his homeland, and he will fight hard to defend it."
 TAR_Ibragim_Mingazeyev: "Ibragim Mingazeyev"
 POLITICS_IBRAGIM_MINGAZEYEV_DESC: "The story of the Tatar Republic is the same as many nations of the Idel-Ural region: oppressed by some warlord who unified the West Russian lands, only regaining independence after the victory at Onega and the chaos that followed. Ibragim Zarifovich Mingazeyev was an ambitious writer who, after being conscripted into the Red Army, worked to undermine it and ultimately witnessed the rebirth of his homeland.

The Tatars have thrown off Russian rule twice: first when Alish established a free Tatar republic, then when the anti-Communist Volunteer Army arrived and established a democratic state. Mingazeyev was then a member of an organization fighting for Tatar rights and autonomy, and so he was acclaimed as the leader of the new democratic state.

Now, his only wish is to inherit the legacy of Alish and those who came before, and make his homeland prosper."

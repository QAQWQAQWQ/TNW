 POLITICS_JOSE_QUESADA_DESC:0 "In many ways, ETA and its armed wing are products of Franco's dictatorship. The Franco regime sought to destroy the Basque language and culture, forced the older generation of Basque nationalists into exile, and crushed the Basque labor movement. As migrant workers flooded into the Basque Country, industrialization and urbanization ran completely out of control — these factors mixed together to fuel the rapid rise of the Basque national "patriotic movement." Similarly, José María Quesada Lasarte emerged within this movement.

Lasarte was born into a working-class family of mixed Basque-Navarrese descent; his father died fighting for the Republic in the Spanish Civil War, but the son soon took up the struggle. Lasarte was among the first generation of ETA radicals, directly participating in several daring paramilitary operations and political actions: attacking transport vehicles carrying Spanish soldiers and Iberian troops, publicly burning Iberian flags, and other forms of public protest. Lasarte quickly became public enemy number one of the Iberian intelligence services, yet he always evaded the authorities.

After a coup brought the armed wing of Basque nationalism to power, Lasarte was chosen to lead the Basque government thanks to his outstanding leadership of the ETA armed organization. Some dismiss Lasarte as a puppet of ambitious young nationalist officers like Argala, but Lasarte is quite satisfied with ETA's popular standing, and he and his team have repeatedly stated that at whatever the cost, their goal — "Basque Homeland and Freedom" — will be achieved."
 POLITICS_TELESFORO_MONZON_DESC:0 "The history of the Basque Country has been, by any measure, one of conflict — between the Basque people and their Madrid masters, and between the various factions of the Basque national movement — and Telésforo Monzón stands at the very center of it all. Born in 1904 to a wealthy aristocratic family, as a young man he joined the Basque Nationalist Party and soon became chairman of the local branch. An intellectual, writer, and poet, and an ardent supporter of the "God and Old Laws" (Jeltzale) ideology, he cooperated with the CEDA and other groups opposed to the Popular Front; yet after the Nationalist coup ignited the Spanish Civil War, Monzón and his party members turned to fight for the Republic.

The civil war ended in disaster, and Monzón, like the rest of the Basque government, was forced into exile. He later settled near the French border, and was once a close associate of EAJ leader and autonomous president José Antonio Aguirre; however, due to conflicting positions, his relationship with the party soon began to deteriorate. In Monzón's view, the EAJ's actions fell far short of what was needed to build a free Basque Country; more radical action was required. And so he maintained close contact with the small grassroots organizations emerging within the country: first Ekin, which would later develop into ETA — Basque Homeland and Freedom.

Before long, Monzón had become almost the only figure respected by both the "Patriotic" (Abertzale) left and the "God and Old Laws" (Jeltzale) right; and when Iberia descended into chaos and the Basque people raised barricades, the presidency of the new Basque autonomous government naturally fell to Monzón. Now, Monzón is the linchpin holding together the fragile balance of power among Basque factions — he bears the difficult responsibility of managing the Basque wartime government and attempting to bridge the ideological gulf between ETA and its affiliated movements and the conservative nationalists of the Basque Nationalist Party — though how long this can hold is anyone's guess."

 OFN_MZB.1.t:0 "East Africa: Situation Report, [GetYear]"
 OFN_MZB.1.desc:0 "The situation in East Africa is multifaceted and complex, but broadly the nation is divided into two parts. First is the coastal zone, well-developed by the Germans into a fine harbor capable of protecting our fleet and serving as a base from which to strike inland. This is also East Africa's main industrial zone, preserved from attack and destruction. We can use the existing facilities for American purposes.\n\nThe other zone is the interior - the wild jungle that has changed little under our rule. It is now in the hands of rebels who rose up to avoid Nazi exploitation and who have no interest in cooperating with America. The interior situation will continue to affect our mission.\n\nAs for available resources, the main one is the chemical industry Hüttig developed before he was overthrown and disappeared. It was actually used to produce chemical weapons, which we can repurpose to develop OFN chemical industry or bolster OFN military strength.\n\nIn short, though our occupation of this land has been brief, we can still contribute to the American cause while ensuring stability."
 OFN_MZB.1.a:0 "Let's get to work."
 OFN_MZB.2.t:0 "Meeting the Chemical Tycoons"
 OFN_MZB.2.desc:0 "Outside a conference room in Quelimane, Westmoreland paces impatiently, checking his watch again and again. It's been minutes already - how can they be so slow?\n\nFinally, the doors swing open and Peers steps out, saluting: \"They're ready for you, sir.\"\n\n\"Took them long enough for something this simple,\" Westmoreland mutters, following Peers inside and closing the door.\n\nBefore them sit a group of Dow Chemical representatives, people of unknown academic and economic influence, all waiting on one side of a long table. Westmoreland is not a man easily intimidated. \"Welcome to East Africa, gentlemen. I think you all know why I've invited you here. There's a very good reason: I'm offering East Africa's chemical industry to Dow Chemical.\"\n\nA few minutes later, after the representatives finish whispering among themselves, most express interest. One asks: \"General Westmoreland, if I may -\" Westmoreland nods. The man continues: \"How much are you going to charge us for usage rights? You're not here to do charity work, are you?\"\n\nAt this, Westmoreland smiles. \"This is my favorite part! We won't charge you a cent. You need no startup capital.\" After a pause, Westmoreland continues: \"But you must cooperate fully with the OFN. When we need your assistance, you must be ready - otherwise we'll all be in trouble.\""
 OFN_MZB.2.a:0 "Suffering turned into profit."
 OFN_MZB.3.t:0 "For the Benefit of All"
 OFN_MZB.3.desc:0 "For quite some time now, we have been working to create a government of, by, and for the East African people, with the aim of transforming the occupation authority into what it was always meant to be - the East African transitional government. More Africans will enter the administration, plans will be drawn up for building the new government, and the legitimacy of the East African mandate will increase, hopefully reducing unrest.\n\nOf course, this does not mean General Westmoreland is giving up existing control.\n\nThe occupation authority will be transformed into a transitional regime. The OFN's move is intended to maintain existing peace in East Africa and provide for future development. This is of course an emergency measure; the occupation authority will not last forever. However, as General Westmoreland reviews the final draft of the new government's construction plan, only force can stop the conflict."
 OFN_MZB.3.a:0 "At least things are moving forward."
 OFN_MZB.4.t:0 "Staring into Hell"
 OFN_MZB.4.desc:0 "\"Chuck, do you know what this place is?\" Two American soldiers lean against each other, walking at the front of the column, clearing the way to the facility. The building looks odd - high towers ringed by barbed wire, looking sinister. Private First Class Charles Bird suddenly has the urge to drop everything and run, but he dismisses it. It's just scary-looking architecture, nothing special.\n\n\"They say these things are 'concentration camps.' We have to check it out, make sure it's safe to demolish. I don't know what this place is, but Bill, honestly, these buildings don't look good.\" Charles turns toward one direction, gesturing for Private William Jones to look there. \"Search the place, quick, and let's get out.\"\n\nOnly a minute later, a scream rings out. Charles rolls his eyes - Private William probably got spooked by his own shadow or something. As he walks toward William, he sees a door standing open before him, and genuine terror in the private's eyes. \"Bill, what is that thing?\" Charles asks, his tone equal parts anger and concern.\n\nWilliam slowly backs away from the doorway, trembling and pointing inside, his words spilling out like a madman's delirium. \"Chuck? They - they are? Dear God, my God, help them!\"\n\nCharles pulls William aside and walks straight into the dim building. What greets him are countless people who look like death itself. They are African natives, but emaciated, like candles in the wind. Charles feels every inch of his body flooded with fear. He hears William vomiting behind him, muttering:\n\n\"God, help them...\""
 OFN_MZB.4.a:0 "Staring into the abyss of life, you always find despair."
 OFN_MZB.5.t:0 "The Quelimane Trials"
 OFN_MZB.5.desc:0 "\"Members of the jury, we are gathered here today to try Franz Hössler and his accomplices. Standing before us are the defendants.\"\n\nThus begin the Quelimane Trials. The captured SS men will be judged by a jury composed entirely of reliable junior American officers. The outcome of the trial is therefore never in doubt. Presiding as chief judge is Major General William R. Peers. The trial is held in complete secrecy to prevent a diplomatic crisis with Germany. He addresses the defendants: \"Mr. Hössler, please rise and hear the charges.\"\n\nNo sooner has Hössler stood than the clerk begins reading his crimes. \"I hereby charge Mr. Hössler with war crimes against Africans in the South African War.\" After staring directly at Hössler, the clerk continues slowly: \"How do you plead?\"\n\nThe only expression on Obersturmbannführer Franz Hössler's face is not fear or regret, but delight. \"Does it matter whether I say guilty or not guilty now?\" he replies, a pleasant smile on his face. \"If you must ask, then of course I am guilty! I oversaw and deported countless subhumans and Untermenschen. If I were still free, I would keep doing exactly that. Yes, I committed crimes, and I am very proud of these countless crimes, you sons of bitches!\"\n\nGeneral Peers merely shakes his head, and the military police stop Hössler from continuing. \"Enough. Franz Hössler, you are sentenced to life imprisonment, with no possibility of parole. May God have mercy on you, for no one on Earth will ever find you again.\" As the MPs lead Hössler out of the courtroom, he stares directly at Peers with contempt. Peers does not even glance at him, then asks the court clerk: \"Who's next?\""
 OFN_MZB.5.a:0 "Justice, long delayed."
 OFN_MZB.6.t:0 "The Quelimane Trials, Part Two"
 OFN_MZB.6.desc:0 "After the trials concluded and the defendants were found guilty, General William R. Peers sat down at his desk with the proceedings summary. Looking it over, he was well satisfied with the results. The defendants were mostly similar to Hössler - all proud of the massacre they had committed, monsters who would not even feign remorse. The rest appeared to express regret, though some of that was feigned as well. In any case, they will pay the maximum price for their crimes, spending the rest of their lives in isolated cells no one will ever see. To give them something to do and keep them from being too comfortable, they will be made to provide the United States with intelligence on the SS. It is the only remaining value they have.\n\nStill, Peers worries that news of these trials might reach the public and then Germany. Though he has forbidden civilians from attending and sworn all attending officers to secrecy, doubt lingers. The intelligence squeezed out of these men might be valuable, but he cannot help worrying that this source might leak. After all, a thermonuclear war is no good outcome.\n\nPeers puts the summary in a safe labeled \"TOP SECRET\" and quickly locks it. Then he calls through the door: \"I'm all set, come in.\" The office door opens, and his aide steps inside, immediately saluting. \"I want you to deliver this directly to the Pentagon. The plane is ready. Take the documents and go. Remember - never let the case out of your sight. If you lose it or open it, you will be severely punished. Understood?\" After the young man answers \"Yes,\" Peers hands him the locked case and watches his figure recede until it disappears. Then the general collapses into his chair and sighs. Though there are things he cannot reach and troubles he cannot solve, he has done what he could for his country and for humanity. That, above all, is enough to make him proud."
 OFN_MZB.6.a:0 "Doing the right thing is often easy."
 OFN_MZB.7.t:0 "Fire in Dar es Salaam"
 OFN_MZB.7.desc:0 "The fire had burned all day before Lieutenant Joe Lincoln's garrison finally put it out. The warehouse itself suffered enormous damage, and the supplies inside were essentially burned to ash. But it was not a great loss. The warehouse only stored clothing, and Joe figured he could order the men to keep wearing their sweat-stained old uniforms until more arrived.\n\nThe fire definitely did not start naturally. Joe ruled out a completely unobserved thunderstorm and any flammable materials near the docks. The question arose: was this negligence by lazy workers, or deliberate sabotage? Joe paced around the pier, carefully avoiding the burnt remains. As he looked back at the warehouse, something glinting under the waves caught his eye.\n\nTo get a better look, Joe leaned over the pier's edge and squatted down. He peered into the black depths, trying to make out what was there. As the darkness cleared, he understood. It was a petroleum canister, thrown there by someone.\n\nHe scrambled up and shouted to the resting patrol: \"Wood! Joson! Get over here and help me pull this thing out of the water.\" As his men arrived, a growing sense of dread spread through the lieutenant."
 OFN_MZB.7.a:0 "This was no \"accident.\""
 OFN_MZB.8.t:0 "The Free Army Claims Tanganyika"
 OFN_MZB.8.desc:0 "While the Americans colonize and ravage the powerful and prosperous African nations in Tanganyika, we - the children of Africa - have been silent for far too long. The Free Army will reclaim for the African nation the lands and provinces it deserves. In the name of freedom, and in the name of liberation long craved by free-born people, we will permanently hold this land and these claims.\n\nHere we condemn the American occupiers and their Dutch lackeys, colluding to suppress and enslave the African people and plunder the legacy of our ancestors. The hypocritical mandate is nothing more than another name for a Dutch colony, a deception meant to trick and rule the broad masses - the powerful, blessed African people.\n\nTo free ourselves from the chains that bind us without cause, we warn the Americans to withdraw permanently, leaving behind a government blessed by the Lord and the African people. Against tyranny, we will wage a glorious revolution, seeking only just governance, letting great and humble thoughts lead our nation to the international forefront.\n\nIf you do not, the fires of freedom will burn away the power and freedom held by those who envy us, returning them in the name of the masses to free-born people. Anyone who denies this right will be considered a fascist opponent - one who denies the Lord's rule over the world and the legitimacy of democratic governance."
 OFN_MZB.8.a:0 "I... what?"
 OFN_MZB.9.t:0 "The Battle for Zanzibar and Tanganyika"
 OFN_MZB.9.desc:0 "When General Paul D. Harkins said victory in the South African War was within reach, people laughed at him. They mocked him, even wrote a song about it. But time has proven General Harkins correct. Now, Africa is marching toward democracy. Even if force is required to achieve it, General Harkins is certain that one day, Africa will prove it was all worth it.\n\nYet now, because of a small band of rebels, people are again questioning American strength, doubting the power of democracy. Though his face was ashen, the thought almost made General Harkins laugh. Even if the enemy had achieved worrying gains in recent months, only a yellow man would believe the American military could be defeated by a handful of African natives calling themselves the Free Army.\n\nWhen they began taking Zanzibar from the army and attacking Harkins' patrols, these detractors grew louder, shouting that America's efforts in Africa were doomed to fail. But from Harkins' perspective, this was an opportunity. The general knew the rebels had exposed themselves openly; he need only press the fight and the Americans would crush them, eliminating America's enemy once and for all. He kept cabling Westmoreland, urging him to send the necessary troops to settle the Free Army problem permanently."
 OFN_MZB.9.a:0 "Long live! Victory in Africa is near."
 OFN_MZB.10.t:0 "The Battle for Dar es Salaam"
 OFN_MZB.10.desc:0 "General William R. Peers needed only to observe the places that had seen fighting to conclude they had won a decisive victory. That night, more than one warehouse was burned. Corpses littered the streets of Dar es Salaam, some even children. Peers' stomach was not as strong as that of the common soldier, and he nearly vomited then and there. But he held it in - this was a necessary evil.\n\nPeers did not know what the Free Army had done, nor what American forces had done. Orders from above were to fire only on the Free Army, but to the young men under his command, every armed black man was a rebel. Peers knew only one side would survive to celebrate the massacre and bear the guilt.\n\nThis would have far-reaching consequences, creating a butterfly effect throughout the mandate. If any natives still believed America was acting for Africa's sake, Peers hoped they never learned about this damnable business. Smaller conflicts and rebellions had already occurred here; the military might well have started another war. Peers now just wanted to find a quiet corner in the city, away from all the celebrations and funerals. He lit a cigar, hoping everything would go smoothly...\"
 OFN_MZB.10.a:0 "...But reality had other plans."

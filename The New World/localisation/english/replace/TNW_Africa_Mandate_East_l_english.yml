l_english:
 MZB_USA_eastern_african_developments:0 "Eastern African Developments"
 MZB_USA_eastern_african_developments_desc:0 "A temporary §BOFN Mandate in Africa§!, aimed at transitioning from German rule to local sovereignty.\n\nIf we implement decolonization peacefully, we can recover §O80%§! of local resources.\n\nIf decolonization is forced early by circumstances, we can only recover §O40%§! of resources.\n\nIf the mandate fails completely, we must §Rabandon§! all resources produced locally."
 POLITICS_WILLIAM_WESTMORELAND_DESC:0 "Some of the fiercest battles of the war were fought here. Ever since the Reichskommissariat was established, East Africa has been a thorn in its leadership's side - first for Hans Hüttig, now for General Westmoreland. The East African authorized government is barely a state at all; it was hastily built after the dissolution of the East African SS during the American offensive. This unstable provisional government must now deal with the insurgents who survived Hüttig's brutal crackdown - the most stubborn, ruthless, and determined fighters on the African continent.\n\nGeneral William Westmoreland, the only man qualified for the job, was initially praised by the American press for his successful offensives against the African Shield, then derided for his controversial strategy of attrition. Westmoreland made full use of American bombers and artillery, achieving great success on the battlefield, but facing fierce opposition at home. Brutal repression was deemed necessary to control East Africa, which only made things worse.\n\nWith the last of the SS defeated or driven underground, Westmoreland finds himself in an awkward position. He has tried escalating operations to suppress the conflict, but the effects of superior firepower are diminishing as the enemy slips easily into the jungle. Westmoreland now fights for peace, racing against time to defeat the insurgency and stabilize East Africa before his credibility at home is exhausted."
 OFN_MZB_the_east_african_government:0 "The East African Government"
 OFN_MZB_the_east_african_government_desc:0 "East Africa's new government, the East African Transitional Coalition, is hardly united, let alone a functioning administration. In theory, it should be formed by military representatives from OFN nations, but in reality it is nothing more than an American military protectorate. American General William Westmoreland reluctantly leads the new government, forced to compromise with the status quo and doing his best to clean up the mess left by the former Reichskommissariat. The corruption inherited from Hüttig's regime runs deep; if America wants to make use of this East African puppet, it will have to put in significant effort."
 OFN_MZB_a_mismanaged_territory:0 "A Mismanaged Territory"
 OFN_MZB_a_mismanaged_territory_desc:0 "The only thing Hüttig's regime did well was efficiency. The military and resource extraction departments were clearly cataloged, maps marked the locations of concentration camps and major bases, and every detail of power supply and other infrastructure was neatly organized, ready for the occupiers to find. Unfortunately, this magnificent administration existed only on the surface, applying solely to official outposts and Reichskommissariat assets. Whether in the deep jungles of Mozambique and Tanzania, the vast plains of Zambia, or the broad savannas of Kenya, you would be hard-pressed to find evidence that Hüttig and his butchers ever set foot there.\n\nIn truth, the Reichskommissariat knew very little about the territory it controlled. Land was developed only when new labor camps and mines needed to be built. The rest of the \"Dark Continent\" was unexplored and undeveloped. Though a few bases and mines were deep inland, the vast majority of Reichskommissariat infrastructure lay within a few miles of the coast. If America wants to make use of the military government, it will have to seek out and develop Africa's wealth... without relying on slavery."
 OFN_MZB_promote_ofn_investments:0 "Promote OFN Investment"
 OFN_MZB_promote_ofn_investments_desc:0 "Currently, the transitional government has neither the resources nor the manpower to develop its vast and wild territory. Infrastructure is scarce, funding is insufficient, and there is no time to spare. If this East African adventure is to succeed in establishing a government and repaying America's economic investment, we must correct this. Accordingly, General Westmoreland and his staff have drafted a plan. He will invite American and OFN corporations to invest in and develop East Africa themselves. Just as corporations and people tamed the American West with their hunger for land and resources, corporations from across the OFN will tame East Africa. This will not only develop the land but also create a stable and reliable revenue stream for the transitional government and America."
 OFN_MZB_control_the_chemical_industries:0 "Control the Chemical Industries"
 OFN_MZB_control_the_chemical_industries_desc:0 "Though Hüttig and his men failed to develop the resources of the African interior, they did a decent job building industry where demand required it. During the German occupation, he built dozens of large-scale industrial chemical production facilities along the coast, ostensibly to produce water purification tablets, pesticides, and antimalarial drugs. Of course, most production lines were destroyed, and there is nothing to verify this claim. Whatever the original purpose of these facilities, many machines remain intact. By inviting American chemical companies like Dow Chemical and DuPont, we can attract more American investment and stimulate our economy."
 OFN_MZB_invite_dow_chemicals:0 "Invite Dow Chemical Experts"
 OFN_MZB_invite_dow_chemicals_desc:0 "Dow Chemical is the largest chemical company in the world and in America. We personally may lack the skill or knowledge to properly use and repurpose the chemical facilities left by the Nazis, but they certainly do. By inviting them to take over these facilities and get the factories running again, we can secure a large infusion of private investment. As long as they are here, other major American corporations will see the benefits of investing in us and foresee the coalition government's success."
 OFN_MZB_military_overseen_factories:0 "Military-Overseen Factories"
 OFN_MZB_military_overseen_factories_desc:0 "The peace maintained by American forces throughout East Africa and all African mandates is fragile at best. Small towns and villages are frequently used as hideouts by bandits and local warlords. These rogues seize what they want and move on, leaving only ruin and destruction in their wake. Isolated chemical complexes handling unstable compounds, far from civilization, are ideal targets. Several chemical plants and other important industrial facilities have already been attacked and destroyed by these raiders. As long as this problem persists, it will be difficult to convince American corporations to invest in East Africa. Therefore, it is necessary to establish guard posts at every factory. Each plant should be garrisoned by at least a platoon of soldiers to protect it from raiders and even hostile takeover."
 OFN_MZB_the_eastern_arms_company:0 "The Eastern Arms Company"
 OFN_MZB_the_eastern_arms_company_desc:0 "Though ancillary factories and companies are still under construction, building our own industry is always profitable. Most chemical facilities fall under Dow Chemical's purview, while the weapons and munitions industry will mostly be nationalized. We will therefore establish the Eastern Arms Company, which will not only produce weapons and supplies for East African soldiers but also export them across the OFN. Bringing in shrewd American tycoons and entrepreneurs for the board of directors is no trouble, and we have the factories to produce equipment. This should be a low-risk, high-reward investment."
 OFN_MZB_secure_east_african_government:0 "Secure the East African Government"
 OFN_MZB_secure_east_african_government_desc:0 "Men can easily lose themselves in the agreements and power of military rule, but we must constantly remind ourselves that military government is merely a temporary measure. The longer East Africans see American soldiers enforcing laws, collecting taxes, and extracting resources, the greater their discontent will grow, and they will gradually view the mandate as just another \"Reichskommissariat.\" Allowing more regional autonomy, giving the people a voice, and listening to their concerns will greatly improve the transitional government's stability and ensure its longevity."
 OFN_MZB_a_much_needed_change:0 "A Much-Needed Change"
 OFN_MZB_a_much_needed_change_desc:0 "Under Commissioner Hans Hüttig, the East African Reichskommissariat was the most brutal regime on the entire African continent. Entire villages were burned to the ground over minor infractions. Tens of thousands struggled to survive in horrific mines and concentration camps where life was measured in weeks. If the new OFN transitional government is to survive, it must demonstrate that it is different from the Nazi regime. Pay workers fair wages, guarantee African natives a voice in government, and end the wanton abuse of the land and its people. These solutions to native grievances seem simple, but considering that East Africans have been exploited by European whites and had their homes ravaged for nearly a century, mere moral superiority over the former regime is not enough - we must deliver action."
 OFN_MZB_destroy_the_camps:0 "Destroy the Camps"
 OFN_MZB_destroy_the_camps_desc:0 "Though the death camps run by Hüttig's SS were shut down as soon as OFN troops seized them, many camps still stand, waiting in the East African jungle. Many local residents have demanded we destroy these camps, not only to ensure they are never reopened but also to erase this dark memory that has polluted the land. Westmoreland and his staff see this as a good propaganda opportunity and have decided to broadcast the demolition of the camps on live television. This will demonstrate OFN's will and improve the image of the OFN mandate both at home and abroad."
 OFN_MZB_track_down_the_nazis:0 "Track Down the Nazis"
 OFN_MZB_track_down_the_nazis_desc:0 "According to General Westmoreland and certain intelligence agencies, scattered, exhausted remnants of the former Nazi regime still hide deep in the East African jungle. Multiple conflicting sightings suggest these former SS officers are running low on supplies and remain brutal. Several remote villages report being raided by well-equipped white soldiers still flying the flag of the Hüttig Reichskommissariat. If reports and rumors are true, these Nazi remnants are the clearest and most direct threat to the OFN transitional government's stability. Allowing them to continue raiding will only further erode native confidence in OFN military capability. Accordingly, General Westmoreland and his staff plan to launch a large-scale propaganda campaign vowing to find and destroy the SS remnants hiding in the jungle."
 OFN_MZB_degermanization:0 "Degermanization"
 OFN_MZB_degermanization_desc:0 "Though Commissioner Hans Hüttig's regime spent the past 20 years attempting to \"Germanize\" the African continent through German settlers and cultural influence, he ultimately failed. Lack of interest in Africa, the collapse of the German economy, and ample fertile land in Europe all discouraged investment in East Africa. Even so, traces of German rule remain scattered across this old colony. Road signs and railway markers are mostly in German, thousands of Nazi settlers live in coastal towns and cities, and some old German infrastructure remains intact. To erase these Nazi stains, we will rewrite road signs in local languages and English, demolish and recycle German infrastructure, and investigate Nazi settlers. The economic void left by the Nazi cancer will be filled by American companies and industrial groups we invite in."
 OFN_MZB_push_out_the_settlers:0 "Push Out the German Settlers"
 OFN_MZB_push_out_the_settlers_desc:0 "The vast majority of the thousands of German settlers in East Africa have been located, arrested, and investigated. It is time to decide what to do with them. Though most were low-level bureaucrats or their families, they participated in and acquiesced to numerous crimes against humanity. On top of that, their presence enrages East African natives and has led to numerous conflicts with local residents. Therefore, considering that these people are classified as criminals and their presence undermines the transitional government's stability, General Westmoreland and his staff have decided to expel the Germans. Within months, they will board ships and return to the homeland, removed from East African jurisdiction."
 OFN_MZB_the_quelimane_trials:0 "The Quelimane Trials"
 OFN_MZB_the_quelimane_trials_desc:0 "Though the remaining high-ranking SS officers have all been arrested and rot in prisons, calls to expel, execute, or otherwise punish them grow louder. Among these, the voice of the African people is especially strong. After years of suffering at the hands of these SS men, natives want them to face justice. To improve relations between the government and the African people and to appease dovish elements back home, Westmoreland has decided not to act arbitrarily or sentence remaining war criminals to death directly. Instead, he will prosecute the Nazi remnants of the East African regime for war crimes, crimes against humanity, and other charges. This will not only build the transitional government's reputation domestically but also appease the local African population."
 OFN_MZB_make_room_for_our_generals:0 "Make Room for Our Officers"
 OFN_MZB_make_room_for_our_generals_desc:0 "Now that we have purged Nazi influence from East Africa's administrative and industrial systems, they are surprisingly empty. Though the Germans in Hüttig's regime were brutal war criminals, they were remarkably efficient at organizing and administering East Africa's vast and dispersed territory. Now that low-level bureaucrats and administrators have been imprisoned, executed, or exiled, the transitional government has many administrative gaps. To fill this shortage, off-duty OFN captains and above will be formally assigned administrative duties to improve the transitional government's situation. It is a stopgap measure, but at least it works."
 OFN_MZB_an_all_american_leadership:0 "An All-American Leadership"
 OFN_MZB_an_all_american_leadership_desc:0 "At the end of the day, the East African Transitional Coalition is a transitional institution. Ruling one of the world's largest territories through Western military occupation is not merely impractical - it is impossible. We do not have enough men to garrison every village, let alone check whether every local is carrying a weapon. However, as the government's grip stabilizes, Westmoreland and his staff believe it is time to push East Africa toward civilian rule. Though several options exist, General Westmoreland believes that among all choices, establishing a pro-Western liberal democratic government will be the simplest and best. With the help of American diplomats, coordinators, and entrepreneurs, a torch of freedom will finally be lit on the Dark Continent."
 OFN_MZB_a_troubled_land:0 "A Troubled Land"
 OFN_MZB_a_troubled_land_desc:0 "Before we can truly transition to civilian government, we must deal with the warlord problem. During Hüttig's rule, warlords sprang up like mushrooms, and even his brutal SS could not suppress them. On top of that, the Nazis always found ways to enrage local populations into supporting the warlords instead. With the support of small villages and even entire countryside regions, warlords can wage endless war against anyone for any interest. The success or failure of the OFN African mandate rests on this; mishandle it, and the entire house of cards will collapse."
 OFN_MZB_attrition_against_rebellions:0 "Attrition Against Rebellions"
 OFN_MZB_attrition_against_rebellions_desc:0 "The warlord problem will not disappear overnight with a new protection order, nor will a single offensive wipe them out. Warlords will remain a problem for years to come, but they will not become intractable. Therefore, to deal with them, we must adopt a long-term strategy. Westmoreland and his staff favor the old-fashioned approach: a pure war of attrition. We must strike the warlords quickly and frequently to wear down their strength. Bomb their supply depots, cut off their food and water, and annihilate any exposed military targets. After a few months, when most warlords are starving and running low on supplies, they may reconsider their future and the few options left to them."
 OFN_MZB_work_with_the_cooperative_revolutionaries:0 "Work with Cooperative Revolutionaries"
 OFN_MZB_work_with_the_cooperative_revolutionaries_desc:0 "Though many of the revolutionaries and warlords poisoning the African jungle have been driven to madness, refusing compromise and submission to anyone, many others remain rational. These are mostly revolutionary socialists willing to cooperate peacefully with and compromise alongside the OFN transitional government. We have no reason not to work with them. Westmoreland and government officials will meet with these groups to push for this possible alliance. Gaining their military assistance would add valuable combat power to the transitional government's fight against remaining warlords."
 OFN_MZB_hire_native_militias:0 "Hire Native Militias"
 OFN_MZB_hire_native_militias_desc:0 "To eradicate German influence and destroy the warlords, we will pay any price, even our own lives. Right now, East Africa is spending American lives, which will undoubtedly anger the public back home. General Westmoreland has proposed a plan that will alleviate this problem to some extent. By recruiting East African natives and sending this rabble to deal with the remaining Nazis and warlords. These groups are largely responsible for destroying rural areas and plunging them into poverty, so the natives will not think highly of them. Though these native militias are poorly equipped, inadequately trained, and lacking in discipline, they open up a massive manpower pool that will be crucial to restoring order in East Africa's lawless zones."
 OFN_MZB_train_local_native_divisions:0 "Train Native Divisions"
 OFN_MZB_train_local_native_divisions_desc:0 "The newly formed native militias have proven their value in defending many parts of East Africa, but they are far from a force to be reckoned with. They might withstand one or two small raids, but once a warlord sets his sights on them, they will fight back with stones if that is all they have. They have strong motivation and a hunger for battle, but they are not skilled at fighting. To compensate for this deficiency, General Westmoreland and his staff will begin training these newly formed militias. The current militias may be disorganized, undisciplined, and underequipped, but with a little help from American instructors, they will transform into a force capable of standing against the warlords on their own."
 OFN_MZB_organize_bombing_raids:0 "Organize Bombing Raids"
 OFN_MZB_organize_bombing_raids_desc:0 "No matter how many soldiers we deploy or station in the jungles and savannas, we cannot secure the entire East African territory. There are too many places to hide, too many unnamed paths to traverse, and too much terrain for cover. However, warlords usually raid villages around their headquarters for supplies, so locating their jungle hideouts is not difficult. Though we lack the manpower for a ground offensive against these bases, overwhelming firepower is more than enough to weaken and destroy them. We need only organize bombing raids against warlord strongholds to severely damage their ability to gather supplies, weakening the enemy's combat capability without expending precious manpower. Bombing alone will not eliminate the warlords, but it will drive another nail into their coffins."
 OFN_MZB_finishing_the_job:0 "Finishing the Job"
 OFN_MZB_finishing_the_job_desc:0 "By now, our war against the warlords has diminished in scale, and East Africa is gradually calming down. When Hüttig's regime first fell, the East African counterinsurgency saw a brief lull as warlords reassessed their position and OFN forces reinforced their outposts and expanded their operational capabilities across East Africa's vast territory. Now, however, the OFN is ready to destroy these troublesome warlords. We have ample manpower, abundant supplies, and the drive to solve this problem before it worsens. American soldiers and local militias will wage a long and difficult campaign, not merely to contain warlord expansion but to crush them. With the might of America and the passion of the African people behind us, the enemy is doomed."
 OFN_MZB_to_end_the_constant_struggles:0 "End the Constant Struggles"
 OFN_MZB_to_end_the_constant_struggles_desc:0 "The forces of rebels, defectors, and warlords are like a Hydra, never truly defeated. Cut off one head, destroy one band of rebels, and more radical factions emerge. If the provisional government's plan to establish a pro-OFN government is to succeed, it must proactively strike anti-American forces. American troops will investigate and supervise local and regional powers of questionable loyalty. The moment disloyalty appears, local authorities will be dissolved or destroyed. One thing must be made clear: embrace democracy, or be eliminated entirely."
 OFN_MZB_cooperate_with_the_anglos:0 "Cooperate with the Anglos"
 OFN_MZB_cooperate_with_the_anglos_desc:0 "Hüttig may have been an arrogant, power-hungry slaver, but he was no fool. Cooperation with the permanent Anglo settlements in Rhodesia not only expanded his manpower pool but also reduced the territory he needed to garrison. We need only do the same to achieve the same effect for the OFN transitional government. However, considering their past collaboration with Hüttig's regime, this move will undoubtedly be controversial. General Westmoreland will impose appropriate punishment on the most notorious collaborators and release those only tangentially involved in Nazi crimes. They will serve as law-abiding examples for the new generation of Rhodesians, never forgetting the kindness the OFN has shown them."
 OFN_MZB_eliminate_troublesome_warlords:0 "Eliminate Troublesome Warlords"
 OFN_MZB_eliminate_troublesome_warlords_desc:0 "By now, the vast majority of warlords and rebels have been defeated and destroyed by OFN garrisons. It is time to deal with the rebel leaders who still survive. Those captured by OFN and local militias will be brought before military tribunals in Quelimane, where we will prosecute them for war crimes. With decisive evidence in hand, most rebels will face the gallows or firing squad, while the remainder will receive appropriate prison sentences.\n\nThose rebel leaders not captured by the government still command small bands, but they cannot cause much trouble. Still, rebels are criminals and agitators who cannot be left alone. American garrisons and African militias will conduct regular patrols, sweep likely hiding spots, and capture anyone still resisting in the jungle. Additionally, we will post wanted notices. Settle the existing warlords, dead or alive, and you will receive a substantial bounty."
 OFN_MZB_hold_the_east_african_summit:0 "Hold the East African Summit"
 OFN_MZB_hold_the_east_african_summit_desc:0 "For nearly a century, East Africa has been ruled by white overlords who cared nothing for the plight of the African natives beneath them, treating the land merely as a source of natural resources and cheap labor. Now that the warlord problem has been solved, it is time to return this African land to its native people. However, the transition from military to civilian government will not be easy. Everyone involved must put in tremendous effort. General Westmoreland will convene hundreds of leaders from American-friendly regions and pro-American movements to Quelimane for talks with dozens of senior OFN officials. Here they will discuss decolonization and demilitarization, and on that basis decide East Africa's future."
 OFN_MZB_cooperate_with_the_socialists:0 "Cooperate with the Socialists"
 OFN_MZB_cooperate_with_the_socialists_desc:0 "If you had been oppressed for nearly a century by people who cared nothing for your safety and well-being, you would not be interested in moderate, practical ideologies either. Such is the situation in East Africa. Despite profound American influence in recent years, they still have no interest in liberal democracy, favoring some form of socialism instead. This ideology will inevitably become the backbone of several states under East Africa's purview. Accordingly, General Westmoreland is negotiating with socialist-held territories and rebel groups to grant them more power in East Africa's domestic affairs and government. Though we are reluctant to do this, buying off the communists with concessions is better than fighting a two-front war against rebels and warlords."
 OFN_MZB_syphon_german_research:0 "Syphon German Research"
 OFN_MZB_syphon_german_research_desc:0 "The brutal Hüttig regime never considered the welfare of its people, but it was at the technological forefront of multiple fields, chemistry foremost among them. Though most of this research and knowledge would flow back to Germany, that flow had already stopped when Hitler died. Before the OFN seized the East African Reichskommissariat, it possessed the world's most advanced chemical technology. We need only mine their decades of research to put German innovations in combat and medicine to use for the OFN, gaining the upper hand in chemical warfare. Some may think only barbarians would research such weapons, but they ignore the fact that fighting the Germans was never civilized to begin with."
 OFN_MZB_look_into_the_vx:0 "Look into the VX"
 OFN_MZB_look_into_the_vx_desc:0 "The best weapon is often the one you never use, and chemical weapons are no exception. The horror of chlorine gas in the First World War is a faded memory deep in our minds, but not for the survivors who experienced it. We may claim to abhor using such weapons, but the fear of chemical weapons being used against the Germans and the Japanese pushes the American government to develop them. Accordingly, the VX nerve agent developed by Hüttig's regime has caught General Westmoreland's attention. It acts incredibly fast and is far more powerful than chemical agents like sarin - less than 10 milligrams is lethal. It was first discovered by British and American spies in the 1950s. Now, more than a decade later, we can not only research countermeasures but also mass-produce it."
 OFN_MZB_crackdown_in_tanganyka:0 "Crackdown in Tanganyika"
 OFN_MZB_crackdown_in_tanganyka_desc:0 "After years of ceaseless defeats, bounties, and humiliations, the few remaining African warlords have grown desperate. To the surprise of everyone in the transitional government, they have set aside their differences and united under several powerful warlords. Now they have set their sights on Tanganyika, one of East Africa's most populous and important provinces. With concentrated and more organized forces, they have caused tremendous chaos. Local American garrisons are too weak to defend remote towns. Local militias and socialist allies either look the other way when warlords strike or are routed.\n\nGeneral Westmoreland knows that if the situation is allowed to worsen, everything will spiral out of control and completely destroy OFN rule in East Africa. He must temporarily set aside mercy and use overwhelming force to organize American forces to eliminate these warlord remnants once and for all. After this, the entire African continent will know the might of America."
 MZB_USA_William_Westmoreland:0 "William Westmoreland"
 MZB_USA_William_R_Peers:0 "William R. Peers"
 MZB_USA_Kenneth_Rush:0 "Kenneth Rush"
 MZB_USA_Paul_Nitze:0 "Paul Nitze"
 MZB_USA_Paul_D_Harkins:0 "Paul D. Harkins"
 MZB_USA_vrm:0 "Various Revolutionary Movements"
 MZB_USA_vwc:0 "Various Warlord Cliques"
 MZB_USA_ger:0 "German Remnants"
 MZB_USA_William_R_Peers_hog_desc:0 "§YHead of Government\nColonial Administration§!\n--------------\n§LOnce, in a Washington D.C. conference room, the African Mandate was a noble proposal: to build a pro-OFN liberal democratic republic. That intention has long been abandoned by others, but not by William R. Peers. He is determined not to let this nation fall.\n\nThe task ahead is no easy one. Hardliners resent and obstruct him; Africans see him as just another general. But he does this not for praise, only to ensure that no more African tragedy claims any more American lives. God willing, let the catastrophe in Africa - this stain on American foreign policy - never turn into a scar.§!"
 MZB_USA_Kenneth_Rush_for_desc:0 "§YForeign Minister\nColonial Administration§!\n--------------\n§LFormer president of Union Carbide and now chief diplomat of the African Mandate, Kenneth Rush is perhaps the only remaining optimist in all of Africa. He firmly believes peace will come, and even as thousands fear the worst, he pushes for diplomatic solutions.\n\nTo most, he is overconfident. Though Rush has negotiated several impressive agreements, the republic's grip on local areas grows looser. Even so, Mr. Rush remains as confident as a ray of hope in a crisis. He still believes in the Central African Republic plan pushed by Washington. Could it all be an act?§!"
 MZB_USA_Paul_Nitze_eco_desc:0 "§YEconomy Minister\nColonial Administration§!\n--------------\n§LAs one of the first to conceive the scale of the Cold War, Paul Nitze now presides over one of its largest creations. He has been given a new challenge: to transform this war-ravaged ruin into a favorable asset for the OFN. This will be his greatest challenge yet.\n\nNitze's approach is rather... centralizing. The general believes his task is to strengthen the OFN and weaken its enemies. He has brought the American commercial fleet to ensure that when America leaves, the Central African Republic will be stronger than before. With luck, Africa's natural resources will fuel the end of the Cold War, even if the republic itself is consumed in the process.§!"
 MZB_USA_Paul_D_Harkins_sec_desc:0 "§YSecurity Minister\nColonial Administration§!\n--------------\n§L\"Sure, we took a huge loss in '45, got punched real good. But down in South Africa, we got back up and punched back, knocked 'em flat! That's a sign, you know? We showed the world that even if the brownshirt Nazis and blackshirt SS are up to no good, we can handle 'em! If we want to beat these Nazis, we can do it - punch those warlords who think they were born to rule over every Tom, Dick, and Larry! So I'm telling all of you, if any visitors from far away with ties to Japan show up, march on 'em! If I don't teach those bastards a lesson, my name isn't Paul D. Harkins!\"\n\n\"So... what exactly have you prepared?\"§!"
 MZB_USA_Legacy_Ostafrikaner_Research:0 "Legacy of Ostafrikaner Research"
 MZB_USA_Legacy_Ostafrikaner_Research_desc:0 "When we marched into the rainforest hell of Hüttig's domain, we found more than the death, disease, and suffering brought by violence. Deep in Hüttig's cruelest laboratories, we discovered stockpiles of chemical weapons and detailed records of their preparation. This gives us control over a few areas of the chemical industry. The chemical weapons Hüttig developed will help the American military make greater progress in deadly weaponry."
 MZB_USA_DOW_Chemical_Investments:0 "Dow Chemical Investments"
 MZB_USA_Eastern_Arms_Company:0 "Eastern Arms Company"
 MZB_USA_East_African_Warlordism:0 "East African Warlordism"
 MZB_USA_East_African_Warlordism_desc:0 "In Hüttig's cruel kingdom, there were always prisoners who could not endure and rose up. Most resistance fighters were shot; only the most ruthless and unfeeling survived. Armed with a variety of stolen German equipment and black market weapons, these insurgents have turned East Africa into a warlord-churned killing field. We must act decisively to end the chaos and restore order."
 MZB_USA_War_Against_Warlordism_1:0 "War Against Warlordism"
 MZB_USA_War_Against_Warlordism_2:0 "War Against Warlordism"
 MZB_USA_War_Against_Warlordism_3:0 "War Against Warlordism"
 MZB_USA_Lackluster_Infrastructures:0 "Lackluster Infrastructure"
 MZB_USA_Lackluster_Infrastructures_desc:0 "Due to instability within the mandate, there is almost no usable infrastructure outside the East African coast. Construction teams were frequently raided and sabotaged, which greatly disappointed Hüttig, and most construction plans were abandoned as a result. The consequence is that controlling areas more than a few miles from the coast is essentially an uphill battle. At least when it comes to infrastructure projects, we must pick up where Hüttig fell."
 MZB_USA_Fires_Of_Revolution:0 "Fires of Revolution"
 MZB_USA_Fires_Of_Revolution_2:0 "Fires of Revolution"
 MZB_USA_The_Tamed_Revolution:0 "The Tamed Revolution"
 MZB_USA_The_Tamed_Revolution_2:0 "The Tamed Revolution"
 MZB_USA_Okellos_Revolution:0 "The General's Revolution"
 OFN_MZB_gain_more_money_tt:0 "This will §Gincrease§! income."
 OFN_MZB_native_army_trained_tt:0 "§WWe will train ourselves as the future §Yarmy of East Africa,§! giving them a lesson on this land full of §Rrebels and warlords§! to stabilize their newly established government.§!"
 OFN_MZB_okello_rebellion_fix_tt:0 "We will §Rimprove§! the situation in Tanganyika and restore social stability. If we leave it unattended for too long, the situation will likely §Rspin out of control§!."
 OFN_MZB_DECOL_federation_tt:0 "We favor establishing a §Mfederal§! political system for East Africa."
 OFN_MZB_DECOL_socialist_tt:0 "We will favor nurturing §epopular revolutionary§! parties for the East African nations."

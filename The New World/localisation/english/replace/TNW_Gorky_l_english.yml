 GOR_Cherniakhovskii_hog_desc: "§YChairman of the Military Revolutionary Committee\nMilitary Junta§!\n--------------\n§LDmitry Cherniakhovskii, born in 1906, was a young Soviet general who fought in World War II. After the collapse of the Soviet Union, he established a military junta in Nizhny Novgorod, restoring order to the region.\n\nNow, Cherniakhovskii is the undisputed leader of the Gorky Military District, and he dreams of reunifying Russia under his rule."
 GOR_Averin_eco_desc: "§YPeople's Commissar for Economic Affairs\nMilitary Revolutionary Committee§!\n--------------\n§LAlexei Averin, born in 1892, was a Bolshevik revolutionary who fought in the Russian Civil War. After the collapse of the Soviet Union, he joined Cherniakhovskii's junta and became the economic chief.\n\nAverin is tasked with rebuilding the economy of the Gorky region, which has been devastated by years of civil war."
 GOR_Katukov_for_desc: "§YPeople's Commissar for Foreign Affairs\nMilitary Revolutionary Committee§!\n--------------\n§YMikhail Katukov, born in 1900, was a Soviet tank commander who fought in World War II. After the collapse of the Soviet Union, he became the foreign minister of the Gorky junta.\n\nKatukov is responsible for negotiating with neighboring warlords and ensuring the security of the Gorky region."
 GOR_Rokossovsky_sec_desc: "§YChief of Staff\nMilitary Revolutionary Committee§!\n--------------\n§YKonstantin Rokossovsky, born in 1896, was a Soviet marshal who fought in World War II. After the collapse of the Soviet Union, he joined Cherniakhovskii's junta as chief of staff.\n\nRokossovsky is the military brain behind the Gorky junta, responsible for planning military operations and training the army."
 GOR_Voroshilov_hog_desc: "§YFormer Marshal of the Soviet Union\nSenior Statesman§!\n--------------\n§LKliment Voroshilov, born in 1881, was a Soviet marshal and old Bolshevik. After the collapse of the Soviet Union, he retired to Gorky, where he advises Cherniakhovskii's junta.\n\nVoroshilov is the elder statesman of the Gorky region, and his experience is invaluable to the young junta."
 GOR_idea_the_gorky_military_district: "The Gorky Military District"
 GOR_idea_the_gorky_military_district_desc: "The Gorky Military District was established by Cherniakhovskii after the collapse of the Soviet Union. It is a bastion of military order in the chaotic Russian heartland."
 GOR_idea_rebuilding_russia: "Rebuilding Russia"
 GOR_idea_rebuilding_russia_desc: "Cherniakhovskii dreams of reunifying Russia under his rule. The Gorky junta is the first step in this great mission."
 GOR: "Gorky Military District"

 CRO_the_partisan_problem:0 "The Partisan Problem"
 CRO_the_partisan_problem_desc:0 "Since 1941, partisans have repeatedly denounced the Balkan governments propped up by the Axis victors. Yet they refuse to die; Tito continues to lead a band of terrorists in defiance of Croatia's legitimate government."
 CRO_legacy_of_the_ustase:0 "Legacy of the Ustaše"
 CRO_legacy_of_the_ustase_desc:0 "The Ustaše have never gone away. They have left behind a powerful political movement, and worse, they feel betrayed by their Italian masters. Perhaps they are now cooperating with our German enemies against us."
 CRO_bosnian_autonomy:0 "Bosnian Autonomy"
 CRO_bosnian_autonomy_desc:0 "Bosnians enjoy considerable autonomy within the country. While this is a necessary condition for maintaining peace, it also limits the central government's ability to administer Bosnia."
 CRO_the_sham_kingdom: "The Sham Kingdom"
 CRO_the_sham_kingdom_desc: "Though Croatia is forced into Italian vassalage, many in the country — including the new king and the people — expect their patron to reward them. In reality, Croatia is merely a plaything for Rome, gaining nothing in return. We live in a country where the king does not wish to reign, the government lacks legitimacy, and autonomy is virtually nonexistent. Something must be done to correct this one-sided relationship."
 CRO_Tomislav_II:0 "Tomislav II"
 POLITICS_TOMISLAV_II_DESC:0 "As the fires of World War II swept across Europe, Aimone Roberto Margherita Maria Giuseppe Torino di Savoia-Aosta — a prince of the Italian royal cadet branch — was forcibly crowned King of Croatia under the name Tomislav II. Speaking with a pure Tuscan accent but not a word of Croatian, he had never set foot on the land that would become his kingdom. The crown was merely a fig leaf for the bloody rule of Ustaše fascist leader Ante Pavelić; when Aimone was forced to accept this crown of thorns, he was already trapped in a carefully woven political deception.`n`nThe establishment of the puppet kingdom did not end Croatia's suffering; it compounded the ethnic cleansing unleashed by the Ustaše. Turmoil destroyed the last remaining industrial foundations, and the already fragile economy collapsed entirely. Only after Pavelić's sudden death in 1959 did the Ciano government in Rome seize the opportunity to crush the Ustaše and drive the butchers underground.`n`nNow, real power lies with Italian advisors and garrison commanders; Tomislav II is nothing more than a puppet manipulated by the ruling clique. Seated on the Zagreb throne, he is both a symbol of foreign oppression hated by the people and an unwilling clown in the theater of power politics. As domestic resistance reaches a breaking point, this powder keg on the eastern Adriatic is lighting a fuse aimed at neighboring Italy, and the fuse is growing shorter by the day."
 CRO_Jure_Francetic:0 "Jure Francetić"
 CRO_Josip_Broz_Tito:0 "Josip Broz Tito"
 CRO_Zvonimir_II:0 "Zvonimir II"
 bosnia.4.t:0 "Bosnian Partisans Swear Allegiance"
 bosnia.4.d:0 "This morning, an urgent message quietly landed on the desk of the Leader Ciano in Rome. It came with lightning speed from the Bosnian region, that land which was once territory of the Kingdom of Croatia — or rather, that which used to belong to the Kingdom of Croatia. For the Kingdom of Croatia has been annihilated in the wave of rebellion stirred up by the red bandits, and it has become the first trophy on Tito's road to independence.`n`nIn Sarajevo, Alija Izetbegović has formed a provisional government, controlling half of the old kingdom. The partisans harbor no illusions that Tito will tolerate them sleeping beside his bed, so they have reaffirmed their loyalty to the Empire, King Umberto, and Leader Ciano. Tensions with the emerging red Yugoslavia are already running high, and this declaration only adds fuel to the fire. In any case, fighting alongside allies in the enemy's sphere is better than fighting alone."
 bosnia.4.a:0 "To our new Bosnian allies — may we march forward together!"
 cropartisans.13.t:0 "Tensions in Croatia Reach Boiling Point"
 cropartisans.13.d:0 "The situation in Yugoslavia is already precarious. Despite our careful negotiations and blunt threats, our agents report that Yugoslavia not only has no intention of submitting to Italian hegemony, but is plotting an attack on the Bosnian partisans under our protection. Such action cannot be tolerated, so we have ordered Italian forces along the border to mobilize immediately. Our strategy is straightforward: with overwhelming superiority, break through Yugoslav defenses and strike at its heart, leaving it no choice but to surrender. Our only concern is that the dissolution of the Tripartite Pact may undermine morale, but in this situation, that only spurs our forces to a swift victory."
 cropartisans.13.a:0 "The lion awakens once more."

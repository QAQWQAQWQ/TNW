 cog.38.t:0 "For the Joy of It"
 cog.38.d:0 "Ostland is usually considered the model colony, always following the homeland's orders and striving to be true Aryans. Ha! Under Commissioner Müller, Central Africa is another story! If anything, Central Africa is just a fat pig for the homeland to slaughter, and for the commissioner himself, a playground. If there is one thing Müller loves most in this world, it is chasing all manner of exotic animals. Meanwhile, the land is fully exploited. Tons of natural resources are exported daily through Central African ports to fill the homeland's enormous demand. Who knows what will become of the heart of this dark continent in these dark times? Well, at least Müller certainly doesn't know, and he doesn't care."
 cog.38.a:0 "Truly, the most natural pleasure in life is the thrill of the hunt!"
 cog.39.t:0 "Above the Moon"
 cog.39.d:0 "Müller decides today couldn't be better - a successful hunt, perfect weather, and irreproachable company. But the surprise doesn't end there! On the way to a new hunting ground, Müller receives thrilling news: Germany's space program has achieved a great success. Those brave souls who dared to reach for the stars in service of the homeland have finally accomplished this great feat, one only the Aryan race could achieve. It is true - the Aryan race is the chosen people, else how could they win such a fierce race? American and Japanese efforts have come to naught. The Greater German Reich - the center of the world, the realm of the master race - has achieved humanity's ultimate conquest, leaving its footprints on the Moon."
 cog.39.a:0 "Another feat of the Aryan supermen!"
 COG_Lobster_War.1.t:0 "An Unpleasant Matter"
 COG_Lobster_War.1.desc:0 "Commissioner Müller continues idly flipping through reports on his desk. He thinks all he does now is sit in an office signing useless papers and authorizing worthless initiatives. He stares longingly at the various trophies on the wall; it has been a while since he properly enjoyed himself, let alone unleashed - the existing trophies are covered in dust. As Müller ponders what animal to hunt next, he is interrupted by a knock at the door.\n\n\"Hm? Who is it?\"\n\n\"Mr. Müller? Do you have a moment?\"\n\n\"I suppose so.\" Müller straightens up in his chair, fully expecting bad news. \"Come in.\"\n\nA nervous aide edges the door open, holding a stack of reports stamped with the Admiralty's seal. Müller already knows the content from the aide's demeanor. He now has the miserable task of wasting an afternoon reading through this stack.\n\n\"Mr. Müller, I'm afraid I have bad news to report. Our fishing boats have been attacked, and most were destroyed by the Brazilian Navy. I believe this has caused you great inconvenience, and I...\" Müller waves him away before he can finish, and the aide understands, trembling as he salutes on his way out. How is he supposed to break the news to Germany's elite that seafood prices will double, even triple? He will have a long time to process this, and many people will make a fuss. Müller certainly isn't looking forward to it."
 COG_Lobster_War.1.a:0 "Another headache for Mr. Müller."
 COG_Lobster_War.2.t:0 "The Tables Turn"
 COG_Lobster_War.2.desc:0 "Hans presses his palm against the hull's outer wall, scanning the three fishermen beside him - in his homeland, they were fearless seafarers; here, they are inconspicuous thieves. Especially the Brazilian with a rifle, pacing back and forth between them, makes Hans feel a bit like a common criminal. Their fishing boat was caught red-handed by an unexpected Brazilian destroyer, and now the soldiers scurry around the lower deck like ants searching for food. The hold is full of shrimp nets, which undoubtedly meet these \"uninvited guests'\" needs and serve as their excuse for boarding.\n\nJust then, a shout from the lower deck confirms Hans's fears and interrupts his thoughts. Two soldiers hurry down the stairs soaked by Atlantic seawater, while another comes up. He returns to the apparent leader, and the two exchange a few words in what must be Portuguese. The leader grabs Captain Karl by the collar.\n\n\"You shouldn't be here, understand?\" The Brazilian officer throws Karl to the ground, water splashing and wetting everyone's shoes around them, like a silent judgment.\n\n\"Understood.\" Karl gets up, frowning at his soaked pants, then looks at the Brazilian officer. \"We know what you think, and we know what you can do.\" The Brazilian officer is taken aback, then recovers his stern expression. \"Very well, have it your way, Captain.\" He says with a sneer. Just then, the radio behind Hans crackles to life, and the Brazilian officer speaks urgently, but no one on board understands. As the radio goes quiet, a clear voice finally comes through the small machine, and the Brazilian officer speaks again: \"You have one minute to be escorted back to Africa, or we will ram you at 30 knots. This is your final warning.\""
 COG_Lobster_War.2.a:0 "\"Deal.\""
 COG_Lobster_War.3.t:0 "Bad News from the Atlantic"
 COG_Lobster_War.3.desc:0 "Lucas has just finished breakfast with his fellow fishermen - they have eaten well ever since they started seafood fishing in Brazilian waters. When he left Germany for this posting, he was quite skeptical about whether the job would make money, but as it turned out, the fishing contract had made him a fortune, with extra income to boot. However, as he approaches the boat, he sees the captain's worried face and immediately has a bad feeling. Lucas approaches and gives the captain a proper military salute, but the captain only returns it absently.\n\n\"Lads, I have bad news. Our contract is gone, cancelled.\"\n\nThe sudden news takes a moment to sink in for Lucas and the others. The contract is gone? They brought back forty crates of seafood every voyage - wasn't that good enough? \"Captain, why? Didn't we exceed our catch quotas? I don't see any reason to end the partnership.\" The captain turns his back to them, gazing at the distant horizon for a moment, then heaves a heavy sigh. \"The Reichskommissariat has explicitly ordered us to stop fishing in Brazilian waters.\" The crew exchange glances, full of disbelief. The captain continues: \"Believe me, lads, I'm as shocked as you are. Though the sea is calm now, storms may come. You'll have to find other work. It has been an honor serving with all of you.\"\n\nThe crew stares blankly at the sea they are about to leave."
 COG_Lobster_War.3.a:0 "So, what now?"
 COG_Lobster_War.4.t:0 "A Cakewalk"
 COG_Lobster_War.4.desc:0 "Tears are practically bursting from Müller's eyes - the Admiralty's report is just too damn funny. What was supposed to be a tedious day of paperwork has been brightened considerably by this report - the Brazilian Navy couldn't even take down a bunch of poorly equipped, undertrained fishermen. Not only did they suffer heavy losses, they had to issue a formal apology. This is a crushing blow to the tin cans that call themselves the Brazilian Navy, and Müller can't stop laughing. His stomach hurts, and he curls up in his chair - just then, the office door is kicked open. His aide and bodyguard rush in, and Müller is laughing so hard he can barely breathe, his face flushed red.\n\n\"Mr. Müller! Are you alright? You've been laughing for so long, we were worried...\"\n\n\"I'm fine, you two idiots! Why did you kick my door in?\" They stare in astonishment at the damaged door, and Müller stops laughing, raising a hand to reassure them. \"It's fine. I'll have Hans fix it later. You can leave now.\"\n\nMüller is like a maiden lost in a romance novel, desperate to know what comes next in the report. At this rate, will Brazil even compensate him for the lost fishing boats? Unable to contain his curiosity, he flips quickly through the report to see what concessions Brazil will make to appease the Reichskommissariat. Soon, laughter erupts again, and Müller slams the desk, trying to compose himself for the next round of hilarity."
 COG_Lobster_War.4.a:0 "The Brazilians got wrecked."
 COG_Lobster_War.5.t:0 "Troubles in the Atlantic"
 COG_Lobster_War.5.desc:0 "Müller bounces his leg, anxiously awaiting news from the Admiralty about the fishing boats. His thoughts wander between the Brazilian proposal and the admirals' conference; was he too impulsive with Sales? Did his generals really have that much confidence in a bunch of fishermen? Müller ponders until he hears a knock. The voice lacks confidence, just like his mood.\n\n\"Mr. Müller? The admirals have new news.\" The aide enters, places an envelope on his desk, and withdraws. Müller tears into the document like a dog starved for a week, and the word \"failure\" meets his eyes. The fishing boats were intercepted by the Brazilian Navy and forced back to Central Africa. The Germans suffered many casualties, while Brazil emerged essentially unscathed.\n\nThis is a heavy blow for Müller and Central Africa. What will he write in the letter to Germany and the Führer? This is a national humiliation, and worse, Germany's seafood supply chain will be cut. Müller rubs his temples, trying to forget all this. Thank God he scheduled a hunting trip earlier this week, he thinks. Without it, the coming days would be unbearable."
 COG_Lobster_War.5.a:0 "The truth always surfaces, regardless."
 COG_Lobster_War.6.t:0 "Like Father, Like Son"
 COG_Lobster_War.6.desc:0 "\"I reckon we're done for the day, right?\" Nikolai feels like he just heard a bad joke, but that's nothing new when talking to his father. \"Damn right, weren't you there too?\"\n\nThe father and son leave the Pointe-Noire docks and head straight for their usual Belgian café. Though they have grown somewhat distant in recent years, every evening they meet at the restaurant run by their friend for a drink and a chat. Nikolai strolls through this urban paradise of a Congolese city and naturally discusses the day's work with his \"boss.\"\n\n\"So suppose this is what you do every day, how long do you think you'd last on your own? I mean, the work on the trawler today.\" The father pauses, as if pretending to think. \"Hmm... a long time, a long time.\" Then he smiles. \"Damn right, weren't you there too?\"\n\n\"Oh, hahaha, I'll take that as a compliment. So can I start now? Though I guess you've been interviewing me this whole time.\" Nikolai walks quickly around his father, walking backward along the sidewalk. \"Obviously, you already know I have extensive work experience in this field, not to mention how I work under pressure - like when I cooked with you and actually burned the eggs.\"\n\n\"You're just buttering me up, Nikolai.\" The two push open the door and enter their usual spot. \"What'll you have? Consider it an advance on your wages.\"\n\nThe two settle into their usual seats with bowls, and the father brings up the key question: \"So I guess you've heard the rumors, what with your connections. You know the trouble that might arise in a few days.\"\n\nNikolai nods. \"Yeah...\""
 COG_Lobster_War.6.a:0 "\"I can handle that risk.\""
 COG_Lobster_War.7.t:0 "There's Honor Among Thieves"
 COG_Lobster_War.7.desc:0 "Hans checks his hand again. Five of hearts, seven of hearts, two of spades. Not good, clearly. As the boat sways out into the Atlantic, tension fills the cabin. He tries to keep a cool poker face, but he can feel sweat beading on his forehead. Hans needs to distract everyone.\n\n\"Say, I don't get why we're stressed about this.\"\n\n\"You mean violating international waters?\" Klaus and the rest of the table are amused, except Hans. \"Well, first off, I guess the Brazilians lost out on shrimp profits.\"\n\nHans leans forward and scoffs \"Heh heh.\" \"Honestly, I don't get it. Brazil isn't short on cash. They don't have to tighten their belts - did Uncle German cut off their funds?\" Uwe picks up the thread, staring at his hand. \"Yeah, true, but Brazil isn't exactly rolling in money either, right? Have you seen half their political leanings?\"\n\n\"True, but then again, we must have some right to something,\" Hans retorts. \"We have to show them there's a line between theft and a legitimate claim, and we're entitled to do this.\" Klaus and Uwe are silent for a moment, then the former speaks: \"Well, but I think it's better to leave the details to those in power, right?\"\n\nUwe snaps his fingers and adjusts his posture. \"That's what I thought too, but Brazil has refused to negotiate unless we fully concede, so I figure if they won't come to the table, then we have the moral high ground.\" He clears his throat for the last time."
 COG_Lobster_War.7.a:0 "\"At least that puts my mind at ease.\""
 COG_Lobster_War.8.t:0 "Overstepping Authority"
 COG_Lobster_War.8.desc:0 "Réne looks over this week's work list. Though no one really cares what gets done each week, the work is increasingly monotonous and people more lax, so clearly something is going on. Sure enough, comparing the lists from the past few weeks, the number of trawlers has crept up, suspiciously. \"Bingo\" - that's the American word, right?\n\nHe leans against the office wall and lights a cheap cigarette he had to talk a Belgian merchant into selling him. Bargaining with that guy was exhausting - he wanted to sell them at an outrageous price, as those Belgian misers always do, especially when selling to locals. But now, none of that matters. What's really puzzling is why trawlers are flooding into the port for repairs. Réne chuckles and takes another drag, wondering where the reports documenting the damage are kept. He opens the filing cabinet drawer - not a single file in recent months, not even in the past year and a half. Not just files - even the folders that kept the cabinet organized are gone. This isn't Schenck's slacking-off backwater.\n\nThe elevator dings on the other side of the office. Réne finishes his cigarette, quickly puts the files back, and hurries to the back stairs, running all the way downstairs. He stops, gazing out at the vast ocean, and a firm resolve locks around his heart like an iron chain. There must be a reason behind these damaged boats returning."
 COG_Lobster_War.8.a:0 "Even if it's the last thing he does."
 COG_Lobster_War.9.t:0 "Is This Legal?"
 COG_Lobster_War.9.desc:0 "Arthur has gradually mastered the knack of manipulating paperwork in Müller's name. He has been given a choice - deciding which things happen and which are ignored. The benefits of power are so enormous that nothing in the world compares. Sometimes, sitting in some unknown, moldy African office, he experiences the most thrilling moments of his life. Countless \"ambitious fellows\" come to him begging for favors - to make something disappear, or make something appear - all for a reasonable fee. Trouble always surfaces when \"balancing the budget\" - in short, he must fabricate a budget that hides all the corruption. Thus the perfect scheme emerges: book the shrimp profits from Brazilian waters. He doesn't need to declare exactly how much each expedition earns; as long as he handles it right, Arthur can carve out more room for his little \"business.\" But there is a thorny question: what does Germania think of these expeditions? Do they consider them illegal? They must know these activities exist - they can't not know. If they were truly illegal, Germania would have shut them down long ago. Perhaps they are looking the other way? If so, then Germania's officials clearly don't want to acknowledge these activities, and there must be a reason. Arthur takes out the tool every self-respecting bureaucrat keeps on hand - the phone book.\n\n\"Hello, this is Arthur Davis, bookkeeper for Central Africa. I'd like to inquire about the legality of shrimp fishing in Brazilian waters. What is the German government's exact position on this?\" The other end seems to hesitate. \"Uh... I'm not sure if this is something you should ask me. Have you tried contacting...\"\n\nArthur sighs softly. It is late at night. This is exactly why Arthur should have been the first to discover that shrimp fishing could be profitable. No one knows how it works, Arthur included."
 COG_Lobster_War.9.a:0 "In the end, he decides not to acknowledge the fishing."
 COG_Lobster_War.10.t:0 "Hegemony at Hand"
 COG_Lobster_War.10.desc:0 "Ernst looks at the assembled crowd in the cabin, everyone aware of why they have gathered - the restless mercenaries especially announce the unspoken secret. Sailors and fishermen sit around this impromptu conference room in the middle of Brazilian waters. As Ernst enters with his melancholy gaze, the tension in the room rises like a tide. He walks to the only chair in the center of the room, leans against the solid oak back, and scans the sparse crew before him. \"You all know why we're here. God knows how far we are from German waters, let alone how long it's been since the government declared Brazilian waters off-limits. We're not here to discuss why we're here, but what we should do.\" Ernst points to one of the two mercenaries who just entered the impromptu meeting. \"We've all seen the need for heightened security. We've all seen Hank, right?\" The American waves awkwardly at the group, immediately losing his swagger.\n\nA young man, a Belgian deckhand named Maxime, steps forward. \"Well, 'we're all in the same boat,' Captain. What I want to know is, why exactly are we here?\"\n\nErnst leaves the chair. \"Right, why we're here. Right.\" He clears his throat. \"For the money.\" A chuckle ripples through the cabin, then dies. \"Honestly, there's no value in continuing. The Brazilians have blockaded the waters, we've rerouted multiple times in the last two days, and the math doesn't work. Therefore, I've decided to terminate -\" A murmur of half-discontent, half-understanding rises. \"Listen to me, I know this isn't ideal, but...\""
 COG_Lobster_War.10.a:0 "People start arguing."
 COG_Lobster_War.11.t:0 "No More Risks"
 COG_Lobster_War.11.desc:0 "\"No, you don't understand, Reinhardt, I've had enough. I'm leaving, getting my pay, and I'm never setting foot on that God-forsaken boat again.\" This is not the first time Reinhardt Fischer has faced this kind of dispute today, and he recites the standard lines he's used on disgruntled crew before. \"I understand, Klaus, many people have said the same thing, but they all left satisfied in the end. I don't want to make a scene, so just bear with me and hear me out - it'll be good for you.\"\n\nKlaus is one of the more respectable Germans under Fischer, well-dressed, with a happy family. Behind it all is his constant pursuit of higher wages. This ambition would normally be admirable, but it is eating into Fischer's wallet.\n\n\"I don't understand why you want to leave. Your income has always been good, your work stable, even with some recent bumps. You're one of my most trusted crew. Why exactly are you leaving?\" Klaus sighs and leans against Fischer's desk:\n\n\"Because, Reinhardt, I can't afford to eat. You're not paying me, and if you don't pay me, I can't work.\" Fischer looks Klaus straight in the eye, leaning forward slightly.\n\n\"If you leave now, you get no pay.\" Klaus smiles faintly, backing away from the neatly arranged files and pens on Fischer's desk.\n\n\"It's fine, Reinhardt. My father is a busy man, I should go help him. Schramm seems happy to take on temp workers like me these days, and I've always been welcome with his family. If only it stays that way.\" Klaus is always self-righteous, and remains so now, leaving his post without the customary two weeks' notice. He storms out of the office, and Fischer crosses his name off the list."
 COG_Lobster_War.11.a:0 "Another name crossed off."
 COG_Lobster_War.12.t:0 "The Waiter"
 COG_Lobster_War.12.desc:0 "\"Yes sir, that's exactly what the menu says. But you know, seafood prices have skyrocketed lately, and if it's even available, I'd worry about the quality.\" Mathon has been explaining this for an hour now, and he feels like he either needs a cigarette or a migraine.\n\n\"Then why don't you update the menu? We came here for seafood, only to be told there's no seafood!\"\n\n\"Of course, I'll talk to the chef, but please don't get your hopes up.\" Mathon walks toward the kitchen, the noise of which filters through two doors. Mathon passes his section manager Maurice, glances at the wall clock, and smiles: \"Maurice, it's been an hour, time for my smoke break.\" Maurice is arguing with a sous-chef and just gives him a thumbs up. \"Danielle, could you cover tables 12, 14, and 16? Table 12 has a lovely couple who want seafood, I told them I'd check with the chef - please follow up.\" Both know this is hardly a problem anymore.\n\n\"Sure thing, Mathon, go to hell.\" Danielle carries a pile of appetizers toward the kitchen. These snacks are the standard weapon for pacifying disgruntled guests - the kitchen has already burned through a week's worth of starters tonight, and the sous-chefs are not allowed to stop until sunrise. Mathon pulls a cigarette from his pants pocket, lights it above the stove, then exits through the back door into the alley. Watching cars pull up to this famous restaurant, Mathon takes a deep drag, lost in the night scene."
 COG_Lobster_War.12.a:0 "Another side of the town at night."
 ARK_south_african_war_catgeory:0 "South African War Emergency"
 ARK_south_african_war_catgeory_desc:0 ""
 ARK_rush_to_Kapstadt:0 "Rush to Kapstadt"
 ARK_rush_to_Kapstadt_desc:0 "With South Africa continuing to collapse, it is time to rid ourselves of them and their allies."
 ARK_emergency_production:0 "Emergency Production"
 GERAF.8.t:0 "South Africa Refuses"
 GERAF.8.desc:0 "We clearly miscalculated South Africa's willingness to reach an agreement - they have responded that they have no intention of accepting our generous ceasefire offer. This is no matter; final victory will be ours in the end."
 GERAF.8.a:0 "So be it."

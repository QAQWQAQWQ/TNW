l_english:
 POLITICS_SIEGFRIED_MULLER_DESC:0 "Oberbefehlshaber Siegfried Müller is one of Germany's favorite media darlings: brave, charismatic, and intensely attractive. He is the charismatic leader of the Central African Reichskommissariat and the wealthiest of Germany's three African commissioners. A veteran who made his name in Poland, France, and Russia, Central Africa under his leadership is the only German colony that consistently turns a profit, while the others either underperform or regularly bleed the homeland dry in ways bordering on treason. Müller's style of governing Central Africa is euphemistically called \"laissez-faire\"; less euphemistically, it is \"barely governing at all\": letting foreign companies plunder Congo's wealth freely while the Reichskommissariat rakes in fortunes through transit taxes. Meanwhile, Müller's German subordinates indulge in breathtaking dereliction of duty - drinking themselves into blackouts daily, shooting at anything that moves indiscriminately, bedding anything wearing clothes, and gambling away their paychecks. That is on a normal day; on exceptional days, they sell their services as mercenaries to other Reichskommissariats and anyone else who will pay, German or foreign alike.\n\nMüller's own greatest passion is hunting. Periodically, he ventures deep into the dark jungle to stalk Africa's magnificent wildlife. Should he happen upon guerrillas, he might bag the most dangerous prey of all..."
 POLITICS_HANS_HUTTIG_DESC:0 "Even within Germany, few men's names inspire such bone-chilling dread as that of Commissioner Hans Hüttig. As the overseer of extermination camps during the war, Hüttig dedicated his life's talents to the ruthless practice of National Socialism in East Africa. Whether the sprawling African slave camps or the growing rebel tribes, he is seen as the deadly puzzle of Nazi terror, a mathematically gifted scourge. But to Hans Hüttig himself, he is simply the only German who has seen the truth of Africa: the continent conceals a heart of darkness; only civilization, wrapped in a mailed fist clad in Damascus steel, can prevent it from being devoured by the subhumans' wicked designs.\n\nHüttig is determined to devote his loyalty to Germany, and his domestic exploits and organizational brilliance have proven this many times over. To build an efficient and pure government, Hüttig employs only Germans in his service and refuses to draw on the SS African divisions. Instead, he continuously hones his elite guard, bolstered by the Anglo Rhodesian whites. The militaristic society built under Hüttig's will is less a colonial administration than an enlarged racial concentration camp. Sadly, many of his fellow commissioners chose to let their own domains rot while they perched on high, enjoying endless prosperity and unearned wealth.\n\nHüttig holds those \"washed-up\" colleagues in contempt. In response, he maintains a direct line of communication with the homeland and single-handedly plots the inevitable conflicts in the East and South. \"The only Nazi in Africa\" - that is what foreign intelligence agencies call him, and he has no objection. Africa needs no one but Hans Hüttig."
 POLITICS_WOLFGANG_SCHENCK_DESC:0 "Once Germany's most dazzling flying ace, Wolfgang Schenck's rule over German Southwest Africa was forged by the Luftwaffe. In the homeland, he was renowned for personally flying hundreds of combat missions, and during his Luftwaffe career, Wolfgang was also highly regarded for his expertise in bomber development. Ironically, Germany ultimately dispatched him to govern Africa's poorest Reichskommissariat - lacking industrial infrastructure, heavily dependent on imports, and even short of fuel to keep its runways operational. The rapidly growing air force back home is his only spiritual comfort. Anyone who has ever gazed at the Angolan horizon will conclude: \"Wolfgang's planes are the unchallenged masters of the skies south of the Sahara.\"\n\nFor years, all of Schenck's efforts have been directed toward building the Southwest Reichskommissariat into the air transportation hub of German Africa. In domestic affairs, Wolfgang, like his business partner and close personal friend Siegfried Müller, is known for his lenient and generous governance - the two often fly together in private helicopters or join hunting expeditions. Perhaps the clouds above the troposphere are his warm refuge, where there are no SS to entertain, no natives to worry about. The sky exerts such a powerful pull on him - a place of comfort and love."
 GERAF.2.t:0 "Supply Lines Broken"
 GERAF.2.desc:0 "News of the German Civil War shocked the world, terrifying countless politicians. But however afraid they may be, they should be even more afraid for Germany's loyal subordinates in Africa.\n\nThe African Reichskommissariats are already stretched thin by rising African nationalism and the spreading communist fervor among the oppressed peoples, growing increasingly dependent on trading colonial resources for military and economic aid from the homeland.\n\nAnd now, the German homeland is engulfed in civil war, the central government seems to have dissolved with the smoke, and that aid has abruptly vanished. Slaves have begun fleeing the camps, and rebels around the Congo River have launched a new offensive."
 GERAF.2.a:0 "No need to... panic. Stay calm. Stay. Calm."
 GERAF.3.t:0 "Hour of the Uprising"
 GERAF.3.desc:0 "The situation in the African Reichskommissariats continues to deteriorate, with the various rebel factions that have fought our regime for twenty years achieving their greatest victories yet. Rebel raids grow bolder, military bases and plantations across Africa are destroyed; farmers and settlers flee their homes in the tide of unrest, and Groß-Deutschlandstadt is flooded with terrified refugees.\n\nAs the rebels tighten their grip on the countryside, the noose around the colonial cities slowly tightens, and the Reichskommissariat clearly has its days numbered."
 GERAF.3.a:0 "What have we done to deserve this!?"
 GERAF.4.t:0 "Shield of Africa"
 GERAF.4.desc:0 "With the situation spiraling out of control, it is clearly necessary to take drastic action to preserve German territory in Africa. Though the three colonies of East Africa, Central Africa, and Southwest Africa have always maintained friendly relations, their cooperation has never progressed further, each maintaining its own independent security forces, administrations, and state commissioners.\n\nWhen the central administration in Germania still existed, the colonies functioned well enough, but now that the central administration appears to have shattered, further action is clearly needed.\n\nThe Shield of Africa is our answer - a joint defensive alliance and unified centralized military department. This alliance may be the only chance to save our territories from total collapse."
 GERAF.4.a:0 "All for one, and one for all!"
 GERAF.4.b:0 "We can take care of ourselves just fine!"
 GERAF.7.t:0 "Propose Ceasefire"
 GERAF.7.desc:0 "Though our brave soldiers have achieved rich results, this war may have dragged on too long. Given the current state of affairs, it should not be difficult to force the South African-American coalition to accept a ceasefire on our terms. However, perhaps pushing on is the wiser choice - final victory is within our grasp."
 GERAF.7.a:0 "Let's make peace."
 GERAF.7.b:0 "We will fight to the end!"
 GERAF.9.t:0 "Propose Ceasefire"
 GERAF.9.desc:0 "As this war drags on, some of our staff have begun planning to propose a neutral ceasefire to the South Africans and their American allies. Though we previously scorned the idea, perhaps we have more pressing matters to attend to. In other words, we may not achieve final victory."
 GERAF.9.a:0 "Let's make peace."
 GERAF.9.b:0 "We will fight to the end!"
 GERAF.10.t:0 "Propose Ceasefire"
 GERAF.10.desc:0 "As we lose territory day by day to the enemy's relentless advance, many of our advisors and even some officers have asked that we propose a ceasefire to South Africa and their American allies. Granted, we will lose significant territory in a ceasefire, but in the long run this may be the best choice. But then again, perhaps it is the lack of firm will to win that has been holding us back from final victory all along?"
 GERAF.10.a:0 "Let's make peace."
 GERAF.10.b:0 "We will fight to the end!"
 GERAF.11.t:0 "Unleash the Werewolves"
 GERAF.11.desc:0 "As the South Africans and their American masters push deeper into our territory, a golden opportunity presents itself: as a basic requirement for all commissioners, we have our own \"Werewolf\" guerrilla fighters, dedicated to causing destruction and chaos behind enemy lines. Now is the time to make them pay for every inch of ground they advance."
 GERAF.11.a:0 "They will strike from the shadows."
 GERAF.12.t:0 "The Werewolves Return"
 GERAF.12.desc:0 "Now that we have successfully forced the invaders out of our territory, the various \"Werewolf\" units can make contact. Though the Werewolves are bloodied, they will fight fearlessly for our homeland. Their courage deserves our commendation."
 GERAF.12.a:0 "Their deeds will not be forgotten."
 GERAF.13.t:0 "Offensive of Faith"
 GERAF.13.desc:0 "Our military commanders have devised a bold and unexpected offensive plan, codenamed \"Offensive of Faith,\" also known as \"Promise Day Offensive.\" The plan will organize all our brave guerrillas into cohesive units. Once assembled, a massive offensive will begin on December 16th. We hope this will catch the enemy off guard, though it will noticeably reduce our guerrillas' operational efficiency."
 GERAF.13.a:0 "Execute the plan!"
 GERAF.13.b:0 "We would rather not take the risk."
 GERAF.20.t:0 "Strike at South Africa!"
 GERAF.20.desc:0 "Though the Shield of Africa has proven effective and we have won key victories against the rebels, the situation has not improved. Those damned guerrillas seize more of our territory every day.\n\nBut we seem to have found a solution. For the past twenty years, proposals to invade South Africa have been raised in various forms, and with the homeland's approval and support, we have continuously supplied arms and weapons to the Boers to aid their struggle. This effort has finally borne fruit - as the situation in South Africa worsens, the Boers have broken away from the South African government and declared independence.\n\nThough it remains to be seen whether their revolt will succeed, supporting their struggle would give us a powerful ally to help against our own rebels. Furthermore, if we abandon the Boers, the OFN will likely support the South African government, bringing our enemies to our doorstep. But Americans are a cautious people; if we fight alongside the Boers, the Yankees and their lackeys will fear direct conflict with the powerful homeland, and Boer independence will become a fait accompli."
 GERAF.20.a:0 "German order reigns supreme!"
 GERAF.20.b:0 "We will find another way..."
 GERAF.21.t:0 "End of the War: Ceasefire!"
 GERAF.21.desc:0 "The dust has settled. It seems the Americans and the OFN no longer wish to invest more effort in the South African theater. Though our soldiers fought bravely, the betrayal of local guerrillas caused our efforts to ultimately come to naught. Only through the homeland's support did we avoid submitting to the barbaric Americans and their South African allies, and finally stabilize the situation.\n\nOur superior firepower ultimately bloodied and exhausted the Americans, and our own army urgently needed to refit and return home. Thus we accepted the Americans' ceasefire offer while sneering at their peace proposal. Though this may negatively affect the various commissioners, especially since the OFN has seized much territory from us, perhaps pulling back the border is beneficial for our territories' security."
 GERAF.21.a:0 "An honorable peace..."
 GERAF.22.t:0 "End of the War: Ceasefire!"
 GERAF.22.desc:0 "It seems the South Africans and their American allies are in the same boat as us. Our request for a neutral ceasefire has been accepted. This proves that South Africa and America no longer wish to fight us, with our superior German tactics and equipment. Though we have suffered heavy losses in this war, America has too - it faces a growing domestic peace movement.\n\nNow we must turn our attention to other matters. Though we have so far successfully managed the escalating resistance, complacency is never a good thing."
 GERAF.22.a:0 "Now, to more important matters."
 GERAF.23.t:0 "End of the War: Ceasefire!"
 GERAF.23.desc:0 "When news that South Africa had accepted the ceasefire finally reached our high command, the officers broke out specially aged wine to celebrate. Germany has once again shown the world the superiority of its way of war. The Yankees were forced to flee before our elite soldiers, and they face a massive anti-war movement at home, while we have achieved near-total victory.\n\nNow we must turn our attention to administering and guiding the newly established Afrikaner People's State, ensuring they also experience all the benefits of German excellence. At the same time, we must ensure they recognize Germany's debt of gratitude for their rebirth, and that they must repay it with interest."
 GERAF.23.a:0 "Another German victory!"
 GERAF.24.t:0 "South African War: Victory!"
 GERAF.24.desc:0 "When the last helicopter carrying American remnants evacuated South Africa, the remaining South Africans finally realized they had lost. The final victory essentially secures German domination of Africa. The loyal Boers make good subjects, deserving of being granted most of South Africa. Of course, we must help this young government through its difficulties. We will send our best advisors for domestic policy and trade. Once again, German superiority is proven. Now we only need to teach those Africans the same lesson as the Americans."
 GERAF.24.a:0 "Total German victory!"
 GERAF.26.t:0 "Déjà Vu"
 GERAF.26.d:0 "After dealing the uncivilized Americans and South African soldiers a resounding victory, we quickly moved into the territory of the former South African Union. Our economic analysts, personally trained by Göring, predicted that stimulating the war economy and using our new conquests to cover the shortfall would revive our previously collapsing monetary policy economy.\n\nToday those economic analysts were shot, because the Shield of Africa's general staff received a report that the ANC resistance had burned down the slave plantations. Unfortunately, the so-called \"African wealth\" that was supposed to save our budget seems to have vanished along with the collapse of the South African Union government.\n\nThe Afrikaner People's State will administer the former South African territory as our vassal, and their performance in exploiting the local economy has been dismal. Shortly after their government was established, the militia units that had formed the Boer army and fought together quickly split into cliques around several generals. They also argue endlessly about the relationship between the Boers and us. A growing Afrikaner military faction declares they will not submit to Germany any more than they submitted to the British... though the situation has not yet reached the breaking point, it is close.\n\nThough those Boers are also uncivilized, their ferocity and skill in suppressing the resistance are commendable. To our further disappointment, evidence has emerged of new cooperation between the ANC and remaining South African remnants.\n\nIn the past, the ANC resistance could be described as high-spirited but poorly equipped bandits, but now they have access to professional military equipment and training - \"poorly equipped\" may no longer describe them. In the end, the so-called \"war economic miracle\" appears to have been nothing more than a dream."
 GERAF.26.a:0 "Those sons of bitches!"
 GERAF.27.t:0 "March 15th"
 GERAF.27.d:0 "At midnight, in a secluded spot in German Central Africa, a plane took off. Its passengers were on a one-way trip. Former Commissioner Siegfried Müller was on board, fleeing the grip of death. Hours later, the plane landed in Angers, the capital of Free France. There, Müller was warmly welcomed by his closest friend, the new head of the Free French military government, Jacques Massu.\n\nJust days earlier, Commissioner Hans Hüttig had invited Müller and Schenck to a celebration banquet for defeating the American pigs. Schenck arrived first, being closer to Hüttig's estate, but never returned. Müller's informants had warned him hours before his arrival that Hans Hüttig intended to murder both commissioners outright. Unwilling to fight Hüttig's elite forces, Müller chose to abdicate and leave the danger zone.\n\nNow, the sole authority in Africa is Hans Hüttig. When the butcher took over all German colonies in Africa, he declared the formation of the Greater Afrikanish German Realm. This will be a new regime spanning the African continent, born solely to promote the truth of National Socialism.\n\nFew news reports emerge from the German Realm, and those that do are even more terrifying. Hüttig's fanatical SS units are \"cleansing\" the entire region. Slave labor camps stretching for kilometers have been built. These people are dedicated to eradicating any remaining resistance in Africa."
 GERAF.27.a:0 "For Hüttig!"
 RK_Wervolf:0 "\"Werewolves\"!"
 RK_Wervolf_desc:0 "The South Africans and their American masters have pushed deep into our territory, and our \"Werewolf\" guerrillas will emerge in increasing numbers to resist them!"

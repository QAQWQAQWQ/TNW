 COG_Lobster_War:0 "Lobster War"
 COG_Lobster_War_desc:0 "Currently, we are in dispute with those Brazilian hicks over our right to fish in Brazilian waters. As they insist on their \"rights\" under \"international law,\" we - the master race of South Africa - scoff at their pretension when our companies poach fish in Brazilian waters. This brings us enormous economic benefits and considerable prestige, as German officials love eating our seafood.\n\nBut if the Brazilians decide to resist and start insisting on their precious \"rights,\" we may run into trouble. If we look to treaty law for precedent, we have no case there, except for the might of Germany itself."
 cog.1.t:0 "Support Central Africa!"
 cog.1.d:0 "Central Africa needs economic support, and as the metropole, we should help them."
 cog.1.a:0 "Help them."
 cog.2.t:0 "The Hunting Horn"
 cog.2.d:0 "A hunting trip. In the vast expanse of Africa, millions of animals roam, and perhaps some natives as well. Now that our Reichskommissariat must stand on its own, it is time to revitalize our economy. How? By hunting! Grab your rifles, lads, we're going hunting!"
 cog.2.a:0 "The hunt begins!"
 cog.3.t:0 "Through the Jungle"
 cog.3.d:0 "The hunting party treks through the jungle, machetes cutting through branches and thorns. Sweat pours as they swat helplessly at the swarming insects, again and again, endlessly. The humid air makes it hard to breathe, but they press bravely onward, not even stopping for a sip of water. This expedition has only just begun, and they won't stop now."
 cog.3.a:0 "Our warriors press on!"
 cog.4.t:0 "Gorillas"
 cog.4.d:0 "The party stops. They see a large figure moving behind the brush in the distance. Gorillas. Their meat is highly prized. Quite a find. Everyone in the party is ready."
 cog.4.a:0 "Aim, fire!"
 cog.5.t:0 "Cape Buffalo"
 cog.5.d:0 "It's a cape buffalo. For the somewhat fatigued but still determined hunting party, this is another exciting find. More good meat to be had, and the animal itself is a great trophy worth thousands of dollars, all revenue going to the Reichskommissariat."
 cog.5.a:0 "Ready, aim, fire!"
 cog.6.t:0 "Across the Savanna"
 cog.6.d:0 "After leaving the jungle, the party escapes the humidity. Instead, they now swelter on the open plains of Africa. The blazing sun beats down, relentless, without end. No shade anywhere, and they must endure."
 cog.6.a:0 "Continue the expedition!"
 cog.7.t:0 "Greater Kudu"
 cog.7.d:0 "The greater kudu moves gracefully across the savanna, its form concealed in the grass to avoid predators. But the hunting party knows this, and they wait in ambush here, seeking the kudu's horns, hide, and flesh. It is a tidy sum for the government. There's a signal!"
 cog.7.a:0 "Fire!"
 cog.8.t:0 "The Noble Lion"
 cog.8.d:0 "From a distance, the party spots a magnificent beast. It's a lion. It lies relaxed on its side, panting after a recent kill, looking utterly vulnerable now. But the hunting party won't have an easy go of it, so they line up and fire a volley that brings it down."
 cog.8.a:0 "Another fine trophy!"
 cog.9.t:0 "The Mighty Elephant"
 cog.9.d:0 "The men circle a massive, heavy creature whose gray hide matches the storm-laden sky. It's an elephant. The beast is huge and ponderous, and the party will have their work cut out for them. They stare at it in awe, waiting for the signal to begin the hunt. The signal comes. Everyone fires."
 cog.9.a:0 "What a magnificent creature!"
 cog.10.t:0 "Herds of Topi"
 cog.10.d:0 "The topi stand at the water's edge, looking around, trying to sense any danger, though they don't know how it will come. But the hunting party knows what they're after. Topi horns are valuable and boost the economy. The party decides to bag as many as possible. They have their rifles ready."
 cog.10.a:0 "Bag them all!"
 cog.11.t:0 "The Elusive Cheetah"
 cog.11.d:0 "The hunting party crawls through the tall grass. They don't want to go from hunter to hunted. Their quarry is the cheetah, a silent devil. Suddenly, one of the men sneezes. In an instant, something lunges straight at him. A member of the party raises his rifle and fires."
 cog.11.a:0 "They never even saw it coming."
 cog.12.t:0 "The Armored Pangolin"
 cog.12.d:0 "The armored pangolin is a species of anteater. It is covered in scales and smells like a skunk. The hunting party wouldn't go near it except for its scales. But the creature is worth a fortune, so they are determined."
 cog.12.a:0 "Smells bad, sells high."
 cog.13.t:0 "Red River Hog"
 cog.13.d:0 "The red river hog lives up to its name - it is very red, startlingly so. This species' pelt is beautiful and undoubtedly brings in significant revenue for the state. The hunting party plans to bag them without damaging the pelt. After all, it would be a shame if it were blemished."
 cog.13.a:0 "Easy does it!"
 cog.14.t:0 "The Regal Giraffe"
 cog.14.d:0 "A giraffe. It is so regal. Now it stretches its long neck, leaning against a tree, chewing slowly on leaves. The hunting party is not intimidated by the giraffe's size, merely watching it in awe. The signal comes. The hunt continues."
 cog.14.a:0 "What a regal beast!"
 cog.15.t:0 "Hunting with Schenck"
 cog.15.d:0 "Schenck and Müller arrange to meet up, and Müller proposes a hunting trip across the entire Congo. Schenck sees no reason to refuse, and the two set off."
 cog.15.a:0 "Let's go."
 cog.16.t:0 "The Hunt Begins"
 cog.16.d:0 "Schenck and Müller set off on their hunting trip, hunting by helicopter, though this proves to be a bad idea. Schenck is visibly uncomfortable with it."
 cog.16.a:0 "Let's get him out of the helicopter."
 cog.17.t:0 "Get Him Down"
 cog.17.d:0 "Once the helicopter hunt begins, Schenck starts feeling ill. He repeatedly asks to call off the hunt and go home, but Müller evades the question. It is only when Schenck nearly falls out of the helicopter that he has had enough and shouts at Müller to let him down or else."
 cog.17.a:0 "Get him down, quickly!"
 cog.18.t:0 "Call Hans"
 cog.18.d:0 "We should invite Commissioner Hans Hüttig to our little hunting excursion."
 cog.18.a:0 "Ask him."
 cog.19.t:0 "Müller Joins a Hunt"
 cog.19.d:0 "Commissioner Siegfried Müller has invited us to join him on a hunt, but we just heard from Schenck that Müller's hunts are terrible, and we have our own work to do - no time to humor him."
 cog.19.a:0 "Refuse him."
 cog.20.t:0 "Hans Declines"
 cog.20.noafricanwar:0 "Unfortunately, Hans Hüttig declined the invitation to hunt, hinting at some \"problems,\" which can be interpreted as escalating tensions in the south."
 cog.20.africanwar:0 "Unfortunately, Hans Hüttig declined the invitation to hunt, hinting at some \"problems,\" which can be interpreted as being due to the South African War."
 cog.20.africanwardone:0 "Unfortunately, Hans Hüttig declined the invitation to hunt, hinting at some \"problems,\" which can be interpreted as being busy rebuilding southern infrastructure."
 cog.20.a:0 "We didn't need him anyway."
 cog.21.t:0 "The Noblest Hunt"
 cog.21.d:0 "Today's hunt is the kind Müller will remember. First, he spots a lion but fails to kill it outright. The lion escapes, and Müller pursues it, finding a good position for a follow-up shot. But then his attention is caught by better prey - an elephant. Müller hesitates to hunt such a creature, so he fires three shots into its leg. The wounded elephant cannot move, and the rest of the herd flees. Boom! Müller aims for its head and finishes it off. Afterwards, Müller and his party feast on elephant for dinner."
 cog.21.a:0 "The hunt is fit for nobles."

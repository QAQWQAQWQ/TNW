 AAA_CountryInfo_Folder.102:0 "Argentine Antarctica"
 AAA_CountryInfo_Content.5:0 "Before the Partition"
 AAA_CountryInfo_Content_desc.5:0 "§MArgentina§!'s activities in §WAntarctica§! date back to the early §Y20th century§!, when Argentina established weather stations and observation posts on islands near the §WTrinity Peninsula§!. Before the §eSecond World War§!, the Antarctic claims of §xBritain§!, §MArgentina§!, and §RChile§! overlapped, but after the war, §xBritain§! lost the ability to defend its claims in §WAntarctica§!. §MArgentina§! began to strengthen its claims, gradually establishing control over former §xBritish§! territories between the late §Y1940s§! and early §Y1950s§!. This success was owed to §MBrigadier Hernán Pujato§!, who oversaw the establishment of §MEstación San Martín§! and the §MArgentine Antarctic Institute§!. During this period, overlapping claims with §RChile§! led to growing diplomatic and even military confrontation, with tensions peaking in §YFebruary 1952§!, when the first shots in Antarctic history were fired: an §MArgentine§! patrol opened fire on a group of §RChilean§! surveyors."
 AAA_CountryInfo_Content.6:0 "Territory Established"
 AAA_CountryInfo_Content_desc.6:0 "This incident led to foreign intervention in the dispute between §MArgentina§! and §RChile§!: §rGermany§! backed Peronist §MArgentina§!, while the §QOFN§! called for peace. These negotiations directly led to the §ipartition of Antarctica§! beginning in late §Y1952§!, with five §WAntarctic§! territories established as legal entities on the continent. As §WAntarctica§! was carved up by the world's powers, conflict between §RChile§! and §MArgentina§! cooled, though their border disputes remained. Multilateral negotiations made some progress in §Y1955§!, but in §YJanuary 1956§!, Juan Perón was ousted from Argentina, §rGermany§! withdrew from the talks, and the §QOFN§! was left talking to itself. Another conference was planned for §Y1958§! to fully resolve the Antarctic dispute, but the collapse of §rGermany§!'s financial system in the face of the §eWest Russian War§! worsened global financial conditions, and the conference never materialized."
 AAA_CountryInfo_Content.7:0 "Battle of Snipe Island"
 AAA_CountryInfo_Content_desc.7:0 "However, the §BArgentine Navy§!, the main supporter of §MArgentina§!'s §WAntarctic§! expansionism, was furious at the prospect of §QOFN§!-led conferences leading to Antarctic demilitarization. In §YJune 1958§!, the §BArgentine Navy§! invaded and occupied the western disputed Antarctic region and several islands in the §RBeagle Channel§!, an event known as the §eBattle of Snipe Island§!. Though the §MArgentine§! government officially denied involvement, the mediating §QOFN§! also withdrew from negotiations between the two South American nations, leaving §MArgentina§! to deal with its ill-gotten gains."
 AAA_CountryInfo_Content.8:0 "Fragile Peace"
 AAA_CountryInfo_Content_desc.8:0 "After the smoke of the §eBattle of Snipe Island§! cleared, the §BArgentine Navy§! continued its militarization of its §WAntarctic§! territory, just as it had previously done in §BTierra del Fuego§!. The Navy's ambitions were partly checked by the §MArgentine Antarctic Institute§! and remaining Peronist elements in the government, including §MLieutenant Colonel Jorge Edgar Leal§! and §MBrigadier Pujato§!. Meanwhile, §RChile§! tried to reclaim its eastern territories but achieved little; by contrast, §MArgentina§! steadily tightened its grip on the region. Currently, recently promoted §MColonel Jorge Edgar Leal§! leads the §MArgentine Antarctic Territory§!, with vengeful §RChileans§! to his west and unstable §rGerman territories§! to his east. Yet despite this, the Colonel's gaze has turned §Osouth§!, toward the §WSouth Pole§!."

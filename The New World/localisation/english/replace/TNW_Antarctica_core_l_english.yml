 ODF_WIP_Country_tt:0 "§FPlayable content for this territory will be added in a future update of §DDeep Freeze§!§F! Here is a preview:§!"
 ODF_WIP_Country_tt_AAA:0 "§FPlayable content for this territory will be added in a future update of §DDeep Freeze§!§F! Here is a preview:§!\n\n§WArgentina's activities in Antarctica date back to the early 20th century, when Antarctic exploration was still romanticized as heroic adventure. Several small huts were built on the outer Antarctic islands. After the Allies' defeat in the Second World War, Britain's Antarctic claims were placed on the international table for all to contest. A few years later, Argentina tried to claim them. They also tried to claim sovereignty over several small islands where former British research stations once stood but no longer exist. The problem was that these islands lay within Chile's claimed Antarctic territory. The Chileans launched a diplomatic dispute, the Americans intervened, and the partition of Antarctica began.\n\nAfter negotiations concluded, all of Argentina's claimed Antarctic land except a small far-western region fell into their hands. With Argentina's Antarctic sovereignty secured, its government opened the door to the world, allowing nations to send scientific expeditions and researchers to Argentine Antarctic territory, a practice that continues to this day. However, the growing militarization of the territory has begun to concern some observers.§!"
 ODF_WIP_Country_tt_AAB:0 "§FPlayable content for this territory will be added in a future update of §DDeep Freeze§!§F! Here is a preview:§!\n\n§WThe Ahnenerbe Antarctic division is the newest member of the Antarctic club, operating from a small base in western New Swabenland established by the Burgundian SS state. Though officially it is not a so-called \"Antarctic Territory\" like the other five regimes on the continent, the Ahnenerbe members and SS stationed in Antarctica have no intention of taking orders from Meier. Under Ahnenerbe lifelong president Wolfram Sievers, the Beagleheim researchers take their orders only from Himmler.\n\nCurrently, only a portion of the Ahnenerbe is conducting field research, with a simple goal: to carry out surveys and experiments that scientifically prove Aryan racial superiority and find evidence supporting the World Ice Theory. Sievers and his men hope to unlock the secrets buried beneath the Antarctic ice, because he and the other SS in Antarctica know that Himmler will not allow them to return to Burgundy empty-handed.§!"
 ODF_WIP_Country_tt_AAG:0 "§FPlayable content for this territory will be added in a future update of §DDeep Freeze§!§F! Here is a preview:§!\n\n§WGermany's Third Antarctic Expedition was once a small, secret project, involving a few token surveys and laying claim to vaguely defined territory in the heart of Norwegian Antarctic territory. With the outbreak of the Second World War, Antarctic exploration and territorial claims were largely neglected and slowly faded into obscurity.\n\nAs the partition of Antarctica began, the German government dug out the old Antarctic documents signed in 1938 and laid claim to New Swabenland. The Norwegian Reichskommissariat government renounced its Antarctic claims, and Germany subsequently incorporated the territory into its current administration. As one of the few survivors of the 1938 expedition, Rudolf Mayer was invited by the German government to leave Southwest African Reichskommissariat and come to this last continent not yet claimed by human civilization.§!"
 ODF_WIP_Country_tt_AAJ:0 "§FPlayable content for this territory will be added in a future update of §DDeep Freeze§!§F! Here is a preview:§!\n\n§WTo secure their claims over Shirahabajiri Land (formerly Marie Byrd Land) in the partition of Antarctica, the Empire of Japan dispatched a paratrooper unit led by Tsukada Shunkichi to secure the new territory. The Japanese Antarctic Territory controls the most remote land on the continent, but even so, it helps the Empire further tighten its grip on the Pacific and opens the door to South America.\n\nWith the retirement of Tsukada Shunkichi, the region became the training ground for the 1st Paratroop Regiment under the command of Kinugasa Shigeo. This small but well-trained force is a formidable presence on the Antarctic continent, always ready to maintain and expand Japanese imperial hegemony over the region.§!"
 ODF_WIP_Country_tt_AAC:0 "§FPlayable content for this territory will be added in a future update of §DDeep Freeze§!§F! Here is a preview:§!\n\n§WChile's activities in Antarctica began in the early 20th century, when they built a small port for sealers and whalers in the South Shetland Islands. Unfortunately for the Chilean government, the British had claimed the region decades earlier.\n\nThough Argentina formally declared its Antarctic sovereignty three years after Britain laid its claim, the negotiations over the former British claims were conducted so hastily that the partition of Antarctica ended with Argentina receiving most of Britain's claims. Chile's losses after the Battle of Snipe Island were far greater, with all disputed territory falling to Argentina. The current head of Chilean Antarctic Territory, Julio Escudero Guzmán, has fought for Chile's territorial claims before and after the partition of Antarctica, and he does not intend to stop until all of Chile's claimed Antarctic territory is returned.§!"
 ODF_WIP_Country_tt_AAO:0 "§FPlayable content for this territory will be added in a future update of §DDeep Freeze§!§F! Here is a preview:§!\n\n§WThe OFN Antarctic Bureau, composed of Australian, New Zealand, and former French Antarctic claims, controls nearly half the Antarctic continent. It is a key OFN base in the Indian Ocean and surrounding regions, with small military installations and naval bases dotting the coast. With the completion of the McMurdo nuclear power station, the OFN will clearly continue to expand its presence in Antarctica.\n\nHowever, like other OFN members, the Antarctic administration is completely dominated by the American military, and Australia and New Zealand hope to see some change in the near future.§!"

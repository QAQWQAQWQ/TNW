 AAN_Antarctic_Anarchy: "Antarctic Wasteland"
 AAN_Antarctic_Anarchy_desc: "The only life in Antarctica tends to hug the coast, where at least the sea offers some help to its bleak existence. The closer one gets to the dark heart of the frozen continent, the more uninhabitable the terrain becomes. Snow ridges sharpened like spearpoints, chasms deep as the abyss, snowblindness painful as a knife - all challenge the existence of life. Only newcomers, foolishly and blindly venture here.\n\nOn the thousand-li ice field, the sky shimmers with a sickly blue, no rain has ever fallen, and the silence is cold as a tomb. This is the most vast and dangerous desert on Earth. Its winter is harsher than anywhere else on the planet, swallowing all like endless void, leaving only stars a thousand li away to light the inky black. Average temperatures of -50°C fuel the blizzards that tear human flesh apart. For humanity on the brink of nuclear annihilation, this wasteland is an omen, revealing the world that disaster survivors will face.\n\n§QWinter darkness is eternal, oblivion is inevitable.§!"

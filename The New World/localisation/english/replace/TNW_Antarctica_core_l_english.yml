 paternalism_antarctic_administration_subtype:0 "Antarctic Bureau"
 paternalism_antarctic_administration_subtype_desc:0 "After the Antarctic partition of the 1950s, the Antarctic continent was divided into several competing bureaus. The border dispute between Chile and Argentina escalated into an international event requiring OFN intervention. To avoid being outpaced by liberal forces, National Socialism also raised its head in Nazi-controlled New Swabenland, preparing to impose a pure, extreme, Aryan-racist colonial policy. Finally, the Japanese arrived, casting aside all pretense of legitimacy and seizing a swathe of Antarctic territory by force.\n\nThough each bureau holds its own ideological beliefs, the harsh life in the vast wilderness and the tiny population have made all regimes organize in similar ways, under some form of military administration. There is direct control as in Japan, and partnership with civilian actors as in the OFN Antarctic Bureau.\n\nWithin this hierarchy, thousands work in the freezing air and biting wind, proving their worth in this land of exiles. Every great power tries to squeeze value from their patch of ice, mocked by many observers as the ultimate example of the sunk cost fallacy: as long as the great power remains, no one else can let go, no matter how much material, money, and manpower they lose. Yet to make Antarctic expeditions profitable would require extraordinary luck..."

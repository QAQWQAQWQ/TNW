 AAG_CountryInfo_Content.1:0 "Before This..."
 AAG_CountryInfo_Content_desc.1:0 "§WAntarctica§! is a land of freezing cold and merciless brutality. Before the §Y1950s§!, this southernmost continent was largely ignored, visited only by a few §Gscientific expeditions§! and a single §gmilitary expedition§!. Multiple nations laid claim to Antarctic territory, but these claims carried little diplomatic weight; habitable regions were far more important to the great powers. But in the early §Y1950s§!, everything changed with the §ipartition of Antarctica§!."
 AAG_CountryInfo_Content.2:0 "The Partition Begins"
 AAG_CountryInfo_Content_desc.2:0 "It began when §RChile§! and §MArgentina§! clashed over a series of small islands formerly held by §xBritain§!, though Britain had already been defeated in the §eSecond World War§!. Both nations theoretically held legitimate sovereignty over these islands. §MArgentina§! began establishing the §WAntarctic Territory§! and took over several unadministered former §xBritish§! islands. §RChile§! protested and urged the §QUnited States§! to intervene, while also laying claim to its own Antarctic territory. Matters escalated quickly."
 AAG_CountryInfo_Content.3:0 "The Feast"
 AAG_CountryInfo_Content_desc.3:0 "The §eEmpire of Japan§!, eager to tighten its grip on the Pacific, laid claim to Marie Byrd Land and sent military detachments ahead of the §QAmericans§!. The §QUnited States§! responded immediately, consolidating control over Australian, New Zealand, and former French claims and establishing the §QOFN Antarctic Bureau§!. §rGermany§! seized the Norwegian claims (now a Reichskommissariat) and merged the two regions into §rNew Swabenland§!. After the two South American nations hastily concluded negotiations, §RChile§! gained little, while §MArgentina§! secured sovereignty over the Trinity Peninsula and surrounding islands. In just one week, the §ipartition of Antarctica§! split the continent into five parts, further §Wheightening§! Cold War tensions."
 AAG_CountryInfo_Content.4:0 "Today"
 AAG_CountryInfo_Content_desc.4:0 "By §Y1962§!, the development and militarization of §WAntarctica§! had intensified. The §QOFN Antarctic Bureau§! is a key training base for Indian Ocean secret operations, and the §eJapanese Antarctic Territory§! to their east plays a similar role. After colonial attempts failed in the §Y1950s§!, §rNew Swabenland§! became a proving ground for experimental aircraft and cold-weather equipment, with unconfirmed reports of German nuclear tests. In secret, the §IAhnenerbe§! has established a base in western §rNew Swabenland§! conducting §Isecret operations§!. §MArgentina§! is torn by internal strife as the Navy and the Argentine Antarctic Institute contest control of the Antarctic Territory, while §RChile§! hopes to claim more territory beyond its current holdings. Even with modern technology, Antarctica remains a deadly place. Seek to dominate §WAntarctica§!, but remember that this frozen continent has never shown mercy to outsiders."
 AAG_CountryInfo_Folder.102:0 "New Swabenland"
 AAG_CountryInfo_Content.5:0 "Third German Antarctic Expedition"
 AAG_CountryInfo_Content_desc.5:0 "The story of §rNew Swabenland§! begins for those outside §rGermany§! in §YDecember 1938§!. Led by §gAlfred Ritscher§!, the §DThird German Antarctic Expedition§! set sail aboard the §gSchwabenland§! and headed for §WAntarctica§!. Their mission was to find a suitable location for a whaling station and naval base. The crew reached §VQueen Maud Land§!, already claimed by §VNorway§!, mapped thousands of square kilometers of §WAntarctic§! ice, and laid their own territorial claim to the region during the expedition. In February 1939, the §gSchwabenland§! returned to §rGermany§!, and this small, relatively secret expedition gradually faded from memory as the smoke of the §eSecond World War§! rose, and its aftermath lingered. For the next decade, §WAntarctica§! remained far removed from the disasters and chaos afflicting human civilization."
 AAG_CountryInfo_Content.6:0 "The Partition"
 AAG_CountryInfo_Content_desc.6:0 "It all began as a small dispute between §MArgentina§! and §RChile§! over ownership of several former §xBritish§! islands in the §BWeddell Sea§!. It quickly escalated into the §ipartition of Antarctica§!, as three great powers set their sights on §WAntarctica§!, hoping to carve out their own slice of the pie. The long-forgotten §DThird German Antarctic Expedition§! now served to legitimize §rGermany§!'s claim to §WAntarctica§!, while Germany also acquired §VNorway§!'s claims, renounced by the current §VNorwegian§! §rReichskommissariat§! government. §VQueen Maud Land§! was renamed §rNew Swabenland§!, §VPrince Olav Coast§! became §rAdolf Hitler Coast§!, and §VPrincess Martha Coast§! became §rEva Hitler Coast§!. Additionally, a §ocivil administration§! was established for potential colonization of the region."
 AAG_CountryInfo_Content.7:0 "Undercurrents"
 AAG_CountryInfo_Content_desc.7:0 "The fledgling §WAntarctic base§! was plagued by supply shortages, worsened by the outbreak of the §eWest Russian War§!, which led §rGermany§! to abandon its colonial ambitions on the §WAntarctic§! continent. After the war, the region was reorganized as a §rmilitary administration§! led by §gLuftwaffe Colonel Rudolf Mayer§!, one of the pilots from the §DThird German Antarctic Expedition§!. Now, §rNew Swabenland§! is a §gLuftwaffe proving ground§! for testing §gexperimental aircraft§! and even §Knuclear weapons§!."
 AAG_CountryInfo_Content.8:0 "National Features"
 AAG_CountryInfo_Content_desc.8:0 "* Develop and test the §glatest aircraft designs§! to advance the cause of §rGermany§!\n\n* Conduct §Knuclear tests§! secretly led by §sProfessor Schumann§!\n\n* Keep §rNew Swabenland§! running despite §omaterial shortages§! and §edomestic upheaval§!"

 Antarctica_econ_window_overlay_tt: "§FSince we are a §WAntarctic Territory§!, we do not control our own §Geconomic§! affairs. The budget is handled by the home government; we need not levy §Ytaxes§!, manage §GGDP§! and §Rdebt§!, control §Gcurrency reserves§!, or worry about other economic activities.§!"

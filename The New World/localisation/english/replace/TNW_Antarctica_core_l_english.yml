 REGIONAL_INFO_ANTARCTICA:0 "§G== Antarctica ==§!\n\n§WAntarctica§! is a land of freezing cold and merciless brutality. Before the §Y1950s§!, this southernmost continent was largely ignored, visited only by a few §Gscientific expeditions§! and a single §gmilitary expedition§!. Multiple nations laid claim to Antarctic territory, but these claims carried little diplomatic weight; habitable regions were far more important to the great powers. But in the early §Y1950s§!, everything changed with the §ipartition of Antarctica§!.\n\nIt began when §RChile§! and §MArgentina§! clashed over a series of small islands formerly held by §xBritain§!, though Britain had already been defeated in the §eSecond World War§!. Both nations theoretically held legitimate sovereignty over these islands. To secure its claims, §MArgentina§! began establishing the §WAntarctic Territory§! and took over several unadministered former §xBritish§! islands. §RChile§! protested and urged the §QUnited States§! to intervene in their negotiations and help resolve the dispute, while Chile also laid claim to its own Antarctic territory. Matters escalated quickly.\n\nThe §eEmpire of Japan§!, eager to tighten its grip on the Pacific, laid claim to Marie Byrd Land and sent military detachments to secure the region ahead of the §QAmericans§!. The §QUnited States§! responded immediately, consolidating control over Australian, New Zealand, and former French claims and establishing the §QOFN Antarctic Bureau§!. §rGermany§! seized the Norwegian territorial claims (now a Reichskommissariat, with some overlap with Germany's own claims) and merged the two regions into §rNew Swabenland§!. After the two South American nations hastily concluded negotiations, §RChile§! gained little, receiving only a fraction of the territory it sought, while §MArgentina§! secured sovereignty over the Trinity Peninsula and numerous surrounding islands. In just one week, the §ipartition of Antarctica§! split the continent into five parts, further §Wheightening§! Cold War tensions.\n\nBy §Y1962§!, the development and militarization of §WAntarctica§! had intensified. The §QOFN Antarctic Bureau§! is a key training base for Indian Ocean secret operations, and the §eJapanese Antarctic Territory§! to their east plays a similar role, both closely monitoring their shared border. After colonial attempts failed in the §Y1950s§!, §rNew Swabenland§! became a proving ground for experimental aircraft and cold-weather equipment, with unconfirmed reports that Germany is also testing nuclear technology there. In secret, the §IAhnenerbe§! has established a base in western §rNew Swabenland§! away from prying eyes, conducting §Isecret operations§!. §MArgentina§! is satisfied with its current holdings, conducting mostly scientific research in Antarctica and allowing foreign scientists access to Argentine territory. §RChile§! has adopted a similar policy, though the Chilean government would prefer to hold more territory.\n\nEven with modern technology, Antarctica remains a deadly place, plagued by extreme weather, crevasses, and poor infrastructure. Seek to dominate §WAntarctica§!, but remember that this frozen continent has never shown mercy to outsiders."

 AAO_CountryInfo_Content_desc.4:0 "By §Y1962§!, the development and militarization of §WAntarctica§! had intensified. The §QOFN Antarctic Bureau§! is a key training base for Indian Ocean secret operations, and the §eJapanese Antarctic Territory§! to their east plays a similar role. After colonial attempts failed, §rNew Swabenland§! became a proving ground for experimental aircraft and cold-weather equipment, with unconfirmed reports of German nuclear tests. In secret, the §IAhnenerbe§! operates in western §rNew Swabenland§!. §MArgentina§! is torn by internal strife, while §RChile§! hopes to claim more territory."
 AAO_CountryInfo_Folder.102:0 "OFN Antarctic Bureau"
 AAO_CountryInfo_Content.5:0 "The Beginning"
 AAO_CountryInfo_Content_desc.5:0 "Before the §ipartition of Antarctica§!, the last §eAmerican§! action in §WAntarctica§! occurred in §Y1940§!, led by Rear Admiral §gRichard Evelyn Byrd§! and conducted by the §DUnited States Antarctic Service Expedition§!. This was also the §ethird American expedition§! to the §WAntarctic continent§!. §gByrd§! had made great contributions to §eAmerican§! exploration of the southernmost continent, and his passion for Antarctica even moved §gAlfred Ritscher§!, who invited him to join the §DThird German Antarctic Expedition§!, but Byrd declined as tensions rose. After defeat in the §VSecond World War§!, §eAmerica§! was busy licking its wounds, and Antarctic exploration was postponed indefinitely. The so-called §D\"Operation Highjump\"§! was aborted in its early planning stages."
 AAO_CountryInfo_Content.6:0 "Operation Deep Freeze"
 AAO_CountryInfo_Content_desc.6:0 "After the dispute between §MArgentina§! and §RChile§! erupted in the early §Y1950s§!, §eAmerica§! renewed its interest in §WAntarctica§!, and the §ipartition of Antarctica§! began. As §rGermany§! revived its Antarctic claims, §eAmerica§! acted. §QOFN member states§! merged their claims into the §QOFN Antarctic Bureau§!. Under the command of §gAdmiral Byrd§!, the OFN immediately dispatched §omilitary forces§! to the region. This plan was called §Q\"Operation Deep Freeze\"§!, the largest §WAntarctic§! expedition in human history: OFN nations deployed a vast §BNaval fleet§!, an §BAir Task Force§!, and over §B8,000 personnel§!. §eAmerica§! established a permanent base at §WMcMurdo Sound§!, while §VJapan§! occupied §WMarie Byrd Land§! and §rGermany§! returned to §rNew Swabenland§!. The §WCold War§! had come to the §WAntarctic continent§!."
 AAO_CountryInfo_Content.7:0 "The Antarctic Bureau"
 AAO_CountryInfo_Content_desc.7:0 "After §gAdmiral Byrd§! died in §Y1957§!, §gAdmiral George Anderson Jr.§! was appointed as the new head of the §QAntarctic Development Command§! and director of the §QOFN Antarctic Bureau§!. The position passed to §gLieutenant General William Rayburn§! in §Y1961§!. However, after that, the cornerstones of the Bureau's territorial claims - §nAustralia§! and §MNew Zealand§! - sought to play a greater role within the OFN Antarctic Bureau, and tensions within the §QBureau§! grew sharper."

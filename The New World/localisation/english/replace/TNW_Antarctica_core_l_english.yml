 AAC_CountryInfo_Folder.101:0 "Antarctica"
 AAC_CountryInfo_Content.1:0 "Before This..."
 AAC_CountryInfo_Content_desc.1:0 "§WAntarctica§! is a land of freezing cold and merciless brutality. Before the §Y1950s§!, this southernmost continent was largely ignored. But in the early §Y1950s§!, everything changed with the §ipartition of Antarctica§!."
 AAC_CountryInfo_Content.2:0 "The Partition Begins"
 AAC_CountryInfo_Content_desc.2:0 "It began when §RChile§! and §MArgentina§! clashed over small islands formerly held by §xBritain§!. §MArgentina§! began establishing the §WAntarctic Territory§! and took over former §xBritish§! islands. §RChile§! protested and urged the §QUnited States§! to intervene."
 AAC_CountryInfo_Content.3:0 "The Partition"
 AAC_CountryInfo_Content_desc.3:0 "The §eEmpire of Japan§! laid claim to Marie Byrd Land ahead of the §QAmericans§!. The §QUnited States§! responded, establishing the §QOFN Antarctic Bureau§!. §rGermany§! seized the Norwegian claims and merged them into §rNew Swabenland§!. After hasty negotiations, §RChile§! gained little, while §MArgentina§! secured the Trinity Peninsula."
 AAC_CountryInfo_Content.4:0 "Today"
 AAC_CountryInfo_Content_desc.4:0 "By §Y1962§!, the development and militarization of §WAntarctica§! had intensified. The §QOFN Antarctic Bureau§! is a key training base, and the §eJapanese Antarctic Territory§! to their east plays a similar role. After colonial attempts failed, §rNew Swabenland§! became a proving ground for experimental aircraft and cold-weather equipment. In secret, the §IAhnenerbe§! operates in western §rNew Swabenland§!. §MArgentina§! is torn by internal strife, while §RChile§! hopes to claim more territory."
 AAC_CountryInfo_Folder.102:0 "Chilean Antarctica"
 AAC_CountryInfo_Content.5:0 "The Philadelphia Agreement"
 AAC_CountryInfo_Content_desc.5:0 "In the aftermath of the §eSecond World War§!, the pro-Axis fascist §MArgentine§! government saw an opportunity to profit from the new geopolitical situation, launching aggressive flag-planting operations in Antarctica. §UChile§! simultaneously deployed troops to the region, and the tense posture nearly led to armed conflict between the two nations. However, what had once been a minor border dispute gradually spilled over, taking on a new global political dimension. Faced with the growing threat of pro-Axis forces in the Southern Cone, §QUS President Dwight Eisenhower§! launched a series of negotiations in §Y1950§! aimed at forming an inter-American organization to contain this expanding threat. After consultations, the governments of §nBrazil§!, §UChile§!, and §MUruguay§! agreed to set aside their differences and signed the §KPhiladelphia Agreement§!. This defense treaty stipulated that any §MArgentine§! act of aggression against any signatory would face a joint response from all three nations, with §QAmerican§! support as well. In response, the new strongman leader of §MArgentina§!, §MJuan Domingo Perón§!, refused to back down, securing §qGerman§! formal recognition of §MArgentina§!'s territorial claims."
 AAC_CountryInfo_Content.6:0 "Thaw"
 AAC_CountryInfo_Content_desc.6:0 "However, diplomatic progress did not ease tensions in the far south. In §Y1952§!, a §UChilean§! survey team was fired upon by §MArgentine§! naval personnel, and the first shots rang out on the Antarctic continent.\n\nThough Chile and Argentina stood eyeball to eyeball, the superpowers had no desire to fight a Third World War and set about resolving the issue through diplomacy, while asserting their own territorial sovereignty on this new international stage.\n\nThough the immediate specter of war receded, §UChile§! and §MArgentina§! never reached a lasting diplomatic solution to the Antarctic dispute, and the clouds over the Antarctic wasteland never dispersed."
 AAC_CountryInfo_Content.7:0 "Battle of Snipe Island"
 AAC_CountryInfo_Content_desc.7:0 "In §Y1958§!, the endless, delayed diplomatic posturing finally bore bloody fruit. Using a minor clash on the then-unnamed Snipe Island as a pretext, the §MArgentine Navy§! launched a series of illegal incursions into §UChilean§! territory - a tiny, obscure isle that quickly became infamous. The §eBattle of Snipe Island§! caught §UChile§! completely off guard. In Valparaíso, government inaction sparked a mutiny, and then §sCaptain José Toribio Merino§! mounted a stubborn resistance that made him a Chilean national hero. But despite this, §UChilean§! territory was still trampled. In the end, the §KPhiladelphia Agreement§! proved to be a scrap of paper - §nBrazil§! and §mUruguay§! strained every muscle to find excuses to sit on the sidelines. Meanwhile, the §MArgentine government§! was busy finding a way to end the war, balancing international reputation against appeasing military hawks. After months of sporadic fighting, both sides declared an informal ceasefire. §UChilean§! territory was scorched earth, trampled by §MArgentine§! boots, with only a few isolated outposts still holding out on §UChilean§! soil."
 AAC_CountryInfo_Content.8:0 "Aftermath"
 AAC_CountryInfo_Content_desc.8:0 "But not everyone had given up on the dream of leading §UChilean Antarctica§! back to its promised land. The new leader, §aProfessor Julio Escudero Guzmán§!, is at Arturo Prat Station, plotting the grand renewal of the Chilean Antarctic Institute. On one hand, he appointed his close friend, §PSocialist Party§! member §PCarlos Jacakic§!, to clean up the territory's finances and reorganize the few remaining resources that §MArgentina§! had not seized. On the other, the Professor dispatched veteran diplomats §aMarcial Mora Miranda§! and §aEnrique Gajardo Villarroel§! to launch a diplomatic offensive at the §BOrganization of American States§!, raising international recognition of §UChile's Antarctic territorial claims§! and leveraging the free world against the enemy.\n\nThe hero of Snipe Island, §sCaptain Merino§!, was placed in charge of the territory's defense. Even now, he plots final revenge against the §MArgentine aggressors§! and to root out the cowards and traitors he believes are secretly aiding Argentina."

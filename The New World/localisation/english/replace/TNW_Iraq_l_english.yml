 POLITICS_IRAQI_COMMAND_COUNCIL_DESC: "§xThis is Iraq's wretched state\nA land of justice laid waste\nHer people suffer injustice's sting\nWhile invaders usurp the throne\nThe righteous are besieged by criminals\nFree men are oppressed by prisoners\nThe morality people seek\nIs given authority by the crown§!\n\n— Bahr al-Ulum, Diwan"
 POLITICS_ABD_AL_RAHMAN_AL_BAZZAZ_DESC: "The revolutions of 1941 and 1958 were Arab uprisings against decades of oppression, but both were hijacked and corrupted by reactionaries. Now it is time to set the revolution back on course. So wrote Abd al-Rahman al-Bazzaz in his works.\n\nBorn in 1913 to a wealthy Sunni family in Baghdad, Bazzaz's early life was a ascent. He graduated first in his class from primary and secondary school, and from Baghdad Law School in 1934, as the nation entered an era of turmoil. In the final years before the German invasion, he earned a law degree from King's College London. A committed democrat and anti-imperialist, he returned home and joined the anti-government uprising organized by the Golden Square, expelling the British colonizers. Later he became dean of Baghdad Law School, using his position to advocate for Arab national democracy intertwined with Islamic ideals.\n\nThe following years were a time of despair. The Golden Square government was no liberator of pan-Arab ideals but a puppet of the Italian colonizers. He decided to begin voicing his opposition, which led directly to his arrest and torture. After the 1958 revolution, he enjoyed a brief period of freedom, only to be arrested again by Qasim on suspicion of plotting to overthrow the government. On the eve of the civil war, he wanted to join the pan-Arab camp but was thwarted by accusations of being an enemy of Arab socialism.\n\nScorned by other factions, Bazzaz found himself representing the interests of Iraq's constitutionalist camp, composed mainly of the country's wealthy and middle class. Determined to maintain control over the civilian population and remain faithful to his democratic pan-Arab ideals, he needed to employ every diplomatic, intellectual, and political skill at his disposal to preserve his organization — and his own life."
 IRQ_july_14_legacy: "Legacy of July 14"
 IRQ_july_14_legacy_desc: "The July 14 revolution is nearly five years old but has achieved little. It began as a broad anti-Italian uprising but quickly descended into anarchy, becoming a free-for-all: communists and Shiites bloodied each other, militarists fought democrats, and the Ba'ath Party became a target for all. Finally, General Abd al-Karim Qasim launched a military coup, compromising with all sides to form a national government and quiet the war drums. Since then, Qasim has been recognized as Iraq's leader, but with limited power. His rule rests on compromise: Iraq's factions are too divided to unite against him, and the Italians see his regime as a bulwark against Ba'athist and German influence, supporting him without reserve."
 IRQ_dawa_ascendant: "Dawa Ascendant"
 IRQ_dawa_ascendant_desc: "Over the past decades, Iraq's political scene seems not to have changed much: foreign-manipulated puppet governments; pan-Arabists with enemies on all sides; elderly democrats committed to democracy; young enthusiasts for communism; and widespread corruption and opportunism in the military. Yet against this backdrop, more and more Shiite Muslims have joined the Islamic Dawa Party, as a reaction to economic stagnation and the suppression of their faith in the Middle East, both real and perceived. Though the party is currently deeply divided, in Iraq's turbulent political environment it has gradually become a force to be reckoned with."
 IRQ_italian_interference: "Italian Interference"
 IRQ_italian_interference_desc: "Though nominally the most independent nation in Italy's sphere of influence, Iraq is in fact heavily dependent on its patron in Rome: its oil flows steadily to Italy; Italian advisors guide the training and expansion of its army; and humiliating treaties keep it in check. Years of subservience have drawn criticism from politicians, but many of them line their own pockets under Italian patronage and are powerless to change the status quo."
 IRQ_italian_interference1: "Italian Interference"
 IRQ_italian_interference1_desc: "Though nominally the most independent nation in Italy's sphere of influence, Iraq is in fact heavily dependent on its patron in Rome: its oil flows steadily to Italy; Italian advisors guide the training and expansion of its army; and humiliating treaties keep it in check. Years of subservience have drawn criticism from politicians, but many of them line their own pockets under Italian patronage and are powerless to change the status quo."
 IRQ_ineffecient_oil_industry: "Inefficient Oil Industry"
 IRQ_ineffecient_oil_industry_desc: "Some people think abundant oil brings certain economic improvement. But if they visited Iraq, they would be surprised. Though Iraq's desert oil fields tower into the sky and its cities are dotted with refineries processing black gold, its oil production remains below standard. In Iraq, once oil is extracted, it is often sold on the black market or lost in a labyrinth of bureaucracy, nepotism, and corruption. Even if a barrel of oil actually makes it onto a ship, the profits flow to the Italians shipping it. If Iraq manages to keep a penny or two, that money quickly finds its way into the pockets of the political and business elite, not those who actually extract the oil."
 IRQ_the_spectre_of_baathism: "The Spectre of Ba'athism"
 IRQ_the_spectre_of_baathism_desc: "As elsewhere in the Middle East, Iraq's Arabs are growing restless, longing for a unified nation free from imperialism and Western decadence. This sentiment is not new; it erupted during the July 14 revolution of 1958, inspired by uprisings in Egypt and elsewhere. The revolution's failure did not kill Iraqi pan-Arabism; instead, it went underground through the Arab Socialist Ba'ath Party, operating efficiently through a tight organizational network. Though Ba'athists are hard to find on the surface, they are everywhere: streets the government and garrisons just cleared see their leaflets appear at night; their slogans ring out in increasingly frequent protests; the vast desert seems to pour forth a steady stream of these believers, burning with conviction and hungry for the change they are certain is coming."

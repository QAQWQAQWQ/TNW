 POLITICS_ABD_AL_KARIM_QASIM_DESC: "What legacy has Iraq's sole leader left? How will the world remember him?\n\nAbd al-Karim Qasim was born into abject poverty, to a Sunni Arab father and a Shiite Feyli Kurdish mother. Such origins meant he was never expected to go far. He first became a teacher, then joined the army, rising through the ranks thanks to his remarkable intelligence and masculine bearing. These qualities led to his recruitment into the Free Officers Movement in the 1950s — a loose organization of officers determined to overthrow the pro-Italian government. Qasim seized control of the movement almost single-handedly and used it to overthrow the Hashemite dynasty. That single victory was enough to make him a national hero. And his defeat of the Triumvirate, that symbol of colonialism, in 1959 elevated him to near-deity status, an idol across the entire region.\n\nSince the revolution's victory and the signing of the Italo-Iraqi Friendship Treaty ending the invasion, little has changed on the surface. Though Qasim's Iraqi nationalism clashes fiercely with the rising tide of pan-Arabism, and his concessions to Italy have drawn criticism, he still stands like a colossus. Most are willing to tolerate his maverick leadership style, his purges of former allies, and his gradual reforms, because they still believe in the revolutionary blueprint he envisioned. People still believe in the modern Iraq he depicted: a nation of different faiths and backgrounds united to overcome poverty, sectarian division, and foreign exploitation.\n\n§xAt least for now...§!"
 POLITICS_VITO_MICELI_DESC: "When Qasim proposed nationalizing the oil industry, Italian Consul in Baghdad Vito Miceli realized the Iraqis' so-called revolution had crossed the point of no return. The fool might have thought the Italians would sit by while Arabs plundered their oil interests, but Miceli was no mediocrity. With the Middle East in turmoil and vultures circling, he resolved to act unilaterally for the empire's interests. By linking Iraqi military opposition elements with remnants of the intelligence service, Miceli orchestrated a decapitation strike against the Sole Leader. He personally witnessed Qasim's final moments, raving about the thousands of little houses he had built for the poor.`n`nThe follow-up plan should have been straightforward: install a pliant puppet regime. But Qasim's death detonated a power vacuum, forcing Miceli to remain in Baghdad, struggling to maintain the fragile transitional authority — a regime completely dependent on Italy, seen by the people as nothing but a colonial marionette.`n`nNow, Vito Miceli's struggle is no longer just about imperial glory; it is about his own life. Whatever controversies surround the man Qasim, no one will tolerate this living embodiment of every crime of colonialism and imperialism continuing to exist."
 POLITICS_ABU_AL_QASIM_AL_KHOEI_DESC: "The Messenger of God (peace be upon him) said: When a man dies, his deeds end but three: ongoing charity, beneficial knowledge, and a righteous child who prays for him. — Grand Ayatollah Abu al-Qasim al-Khoei, leader of the Najaf seminary and preeminent jurist, has lived his entire life by this tradition.`n`nBorn into a family of religious scholars in Iran, Khoei studied the Quran from childhood and learned at the feet of Shiite masters. The rigorous training of the seminary forged him into a distinctive school of jurisprudence, and he often spoke out in support of women, children, and non-believers. This education also instilled in him a deep sense of responsibility toward the global Muslim community. In the gaps between his religious duties and scholarly research, he became an indefatigable benefactor, using a charitable network spanning Iraq and his administrative talent and religious prestige to comfort countless sufferers.`n`nIt was this sense of responsibility that drove Khoei to step forward when Qasim's regime collapsed. Witnessing the chaos engulfing Iraq and the rise of demagogic tyrants, he declared: resisting corruption and tyranny is the sacred duty of the ulama. With the tacit approval of the Grand Ayatollah, Khoei selected Shiite elites to form a delegation and restore order to Najaf. Though he kept his distance from armed struggle, his very presence has become a spiritual beacon for those seeking a democratic Islamic polity."
 POLITICS_AHMED_HASSAN_AL_BAKR_DESC: "The so-called revolution of 1958 was, in the final analysis, nothing but an unfinished transformation. It is true that the Arab people of Mesopotamia threw off the most glaring shackles of Western colonialism, but they remain divided by borders imposed by outsiders. They are trapped in cages drawn by foreigners, ground to dust by economic systems tied to foreign powers. Ahmed Hassan al-Bakr declares: now is the time for the Arab people to completely shatter this legacy of oppression.`n`nBakr was born in Tikrit when it still languished under Turkish tyranny, and his life was destined to be intertwined with struggle. He endured a bitter childhood, served six years as an elementary school teacher, then joined the Iraqi army. In 1941, when the Golden Square launched its anti-British revolution, Bakr joined with his kinsmen and comrades, only to be sidelined after the revolution. The betrayal of seeing the British replaced by Italians cut him deeply, and he turned to two emerging forces: the underground Free Officers Movement dedicated to overthrowing the monarchy, and the rising Arab Socialist Ba'ath Party.`n`nEven after Qasim established his personal dictatorship and began suppressing the Ba'ath, Bakr remained convinced that the Ba'ath was destined to be the vanguard of the revolution, the chariot that would defeat imperialism. Now standing on the ruins of the Qasim Republic, as chairman of the party's military committee, he is determined to use the power at his disposal to complete the unfinished revolution of 1958, and to witness the true unification of the Arab nation.`n`nTo that end — he will stop at nothing."

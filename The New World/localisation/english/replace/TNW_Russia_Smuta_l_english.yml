 RUS_Decision_Smuta_Occupation_CHT_Werbell: "Establish the Chita Training Academy"
 RUS_Decision_Smuta_Occupation_CHT_Werbell_desc: "As our army marches through the towns and villages of Western Siberia, the number of young men begging to join the legendary mercenary Werbell's forces will surely astonish you. But the problem is, well, their quality is poor. These would-be recruits are a far cry from our own ranks: some are fishermen, some merchants, some have never even seen a rifle in their lives. Their military foundation is too weak, and they would only be a burden in the coming Siberian campaign.\n\nFortunately, the recent conquest of Chita has given Werbell the opportunity to make use of the limited manpower in the Far East. He plans to establish a brand-new training academy for all Russians who wish to join his ranks, with veterans and senior officers serving as instructors at every level — at the very least, to ensure recruits know which end of the rifle to point at the enemy when they reach the battlefield."

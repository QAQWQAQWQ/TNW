 RUS_Smuta_Contenders_Value_Desc_Ongoing: "§FThere are now §f[?Smuta_ContendersReal_Num] contenders§! controlling parts of §W[RUS_Smuta_CurrentRegion]§!. We are one of them.§!"
 RUS_Smuta_Contenders_Value_Desc_Victory: "§GWe are the sole remaining contender in §W[RUS_Smuta_CurrentRegion]§! — we have won.§!"

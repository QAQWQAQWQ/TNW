 RUS_Smuta_Contenders_Entry_AtWar_Desc: "We are currently at war with [THIS.GetFlag]§R[THIS.GetName]§!. Their capital appears to be in §W[?capital.GetName]§!; no further detailed intelligence is available."
 RUS_Smuta_MainDesc: "History does not repeat exactly... but it rhymes. Now, we are living through the £smuta §fSecond Time of Troubles§! — chaos, blood, and war across the land. Guns roar, smoke drifts, and the pages of Russian history turn one by one. Amid it all, who among us will become the next footnote in the record?"

 RUS_Smuta_Stats_CivilianChaos_Title: "Unrest"
 RUS_Smuta_Stats_CivilianChaos_Title_Desc: "§F£smuta_chaos §RCivilian Unrest§!\n--------------\nHuman society is a complex organism; if one part collapses, the rest inevitably follows. As we strive to control §W[RUS_Smuta_CurrentRegion]§!, we must manage the populace — especially in occupied territories — lest they obstruct our administration and war preparations. Therefore, we must not allow £smuta_chaos §RCivilian Unrest§! to exceed §W250§!, or terrible §Rconsequences will follow§!."
 RUS_Smuta_Stats_CivilianChaos_Value_Normal: "[?Smuta_Chaos|W0]"
 RUS_Smuta_Stats_CivilianChaos_Value_Bad: "[?Smuta_Chaos|R0]"
 RUS_Smuta_Stats_CivilianChaos_Value_Desc: "§F£smuta_chaos §RCivilian Unrest§!\n--------------\nCurrent: [?Smuta_Chaos|Y0]\nMaximum: §Y300§!\n£smuta_chaos §RCivilian Unrest§! grows each §Wweek§! from unlisted sources; weekly growth increases or decreases depending on circumstances. The current situation is [RUS_Smuta_Stats_CivilianChaos_Value_Desc]\n--------------\nThe total §Wcurrent§! Civilian Unrest has the following §Wmodifiers§! on us:\n - Army experience gain: [?Smuta_Chaos_Modifier_experience_gain_army|+=] daily\n - Unit training time: [?Smuta_Chaos_Modifier_training_time_army_factor|%Y1=]\n - Conscription factor: [?Smuta_Chaos_Modifier_conscription_factor|%0+]\n - Org loss when moving: [?Smuta_Chaos_Modifier_org_loss_when_moving|%-1]\n - Out of supply factor: [?Smuta_Chaos_Modifier_out_of_supply_factor|%-1]\n - Stability: [?Smuta_Chaos_Modifier_stability_factor|=+%]\n - War support: [?Smuta_Chaos_Modifier_war_support_factor|=+%]§!"
 RUS_Smuta_DynamicModifier_Chaos: "Modifier from £smuta_chaos §RCivilian Unrest§!"
 RUS_Smuta_Stats_CivilianChaos_Value_Desc_Normal: "§WImmaterial§! ([?Smuta_Chaos|W0]/§R250§!)."
 RUS_Smuta_Stats_CivilianChaos_Value_Desc_Bad: "§RCritical emergency§! ([?Smuta_Chaos|R0]/§R250§!). Take measures to stabilize the situation."
 RUS_Smuta_Stats_MilitarySupplies_Title: "Supplies"
 RUS_Smuta_Stats_MilitarySupplies_Title_Desc: "§F£smuta_supplies §sMilitary Supplies§!\n--------------\nAre our forces ready for complex military operations? How are logistics? Can we sustain a long campaign? All these questions can be answered by tracking £smuta_supplies §sMilitary Supplies§!. The more £smuta_supplies §sMilitary Supplies§! we hold, the more options we have when reconquering §W[RUS_Smuta_CurrentRegion]§!; conversely, the lower our £smuta_supplies §sMilitary Supplies§! stockpile, the more constrained our §Woperations§! become.§!"
 RUS_Smuta_Stats_MilitarySupplies_Value: "[?Smuta_Supplies|W0%]"
 RUS_Smuta_Stats_MilitarySupplies_Value_Desc: "§F£smuta_supplies §sMilitary Supplies§!\n--------------\nCurrent: [?Smuta_Supplies|Y1%]\nBase weekly gain: [?Smuta_SuppliesWeeklyGain|+=1%]\n--------------\nThe base weekly gain of £smuta_supplies §sMilitary Supplies§! may be negatively modified by factors such as §Whigh§! §RCivilian Unrest§! and §Wongoing wars§!.§!"

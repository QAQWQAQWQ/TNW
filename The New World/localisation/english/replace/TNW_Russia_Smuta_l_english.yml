 RUS_Mission_Smuta_CHT_MAG_PactExpiresMyChungus: "Maintain the pact... for now§R§!"
 RUS_Mission_Smuta_CHT_MAG_PactExpiresMyChungus_desc: "All things must end, including the awkward alliance between [CHT.GetFlag]§W[CHT.GetName]§! and [MAG.GetFlag]§W[MAG.GetName]§!. It will either be forgotten or shattered before anyone has a chance to expect it."
 RUS_Mission_Smuta_CHT_MakeMikhailCool: "Prove Mikhail's legitimacy"
 RUS_Mission_Smuta_CHT_MakeMikhailCool_desc: "A very simple equation: the stronger Mikhail's legitimacy, the easier it is for us to govern the people and the country. Therefore, we must prove his legitimacy, or suffer the consequences."
 RUS_Decision_Smuta_CHT_MishaKrutoyChel: "Make Mikhail a household name"
 RUS_Decision_Smuta_CHT_MishaKrutoyChel_desc: "Quick, simple, and straightforward propaganda about Mikhail may relieve government pressure in the short term, but unfortunately, the truth will eventually come out. As such, our previous efforts may only yield half results, or none at all."
 RUS_Decision_Smuta_CHT_LessonFromBolshevik_1: "Lesson One: Get the money"
 RUS_Decision_Smuta_CHT_LessonFromBolshevik_1_desc: "To govern, you need money; to have money, you must get it from somewhere; to get money, you must have force. Simple, but logical and true."
 RUS_Decision_Smuta_CHT_LessonFromBolshevik_2: "Lesson Two: Incentivize the army"
 RUS_Decision_Smuta_CHT_LessonFromBolshevik_2_desc: "To enforce discipline, soldiers must sometimes fear their officers more than the enemy. Therefore, we will purge the worst troublemakers and encourage iron discipline in the ranks."
 RUS_Decision_Smuta_Commie_Annex_Kamchatka: "Approach [KMC.GetFlag]§R[KMC.GetName]§!"
 RUS_Decision_Smuta_Commie_Annex_Kamchatka_desc: "We will contact Admiral Yumashev and the remnants of the Pacific Fleet to propose their peaceful incorporation into our nation."
 RUS_Decision_Smuta_Expansion_NegotiateWithVOR: "Negotiate with [VOR.GetFlag]§R[VOR.GetName]§!"
 RUS_Decision_Smuta_Expansion_NegotiateWithVOR_desc: "Although the cold north remains under the control of Blochin and his jailers, given our massive regional power, they may yet choose to join us."
 RUS_Decision_Smuta_Expansion_FAV_OMS_LetsBeFriends: "Send an offer to [FAV.GetFlag]§R[FAV.GetName]§!"
 RUS_Decision_Smuta_Expansion_FAV_OMS_LetsBeFriends_desc: "Now, the remnants of the former \"Night Witches\" dwell in the north, calling themselves the \"Free Pilots\". While their bravery against German air raids is commendable, their supplies are scant. We can send them an offer that will give them everything they need — if they are willing to join us."
 RUS_Decision_Smuta_Expansion_FAV_SVR_LetsBeFriends: "Send an offer to [FAV.GetFlag]§R[FAV.GetName]§!"
 RUS_Decision_Smuta_Expansion_FAV_SVR_LetsBeFriends_desc: "Now, the remnants of the former \"Night Witches\" dwell in the north, calling themselves the \"Free Pilots\". While their bravery against German air raids is commendable, their supplies are scant. We can send them an offer that will give them everything they need — if they are willing to join us."
 RUS_Decision_Smuta_Expansion_FAV_TYM_LetsBeFriends: "Send an offer to [FAV.GetFlag]§R[FAV.GetName]§!"
 RUS_Decision_Smuta_Expansion_FAV_TYM_LetsBeFriends_desc: "Now, the remnants of the former \"Night Witches\" dwell in the north, calling themselves the \"Free Pilots\". While their bravery against German air raids is commendable, their supplies are scant. We can send them an offer that will give them everything they need — if they are willing to join us."
 RUS_Decision_Smuta_Expansion_ZLT_SVR_LetsBeFriends: "Send an ultimatum to [ZLT.GetFlag]§R[ZLT.GetName]§!"
 RUS_Decision_Smuta_Expansion_ZLT_SVR_LetsBeFriends_desc: "With the other major contenders in Western Siberia having submitted, it is time for the arms dealers of Zlatoust to make their final choice."
 RUS_Decision_Smuta_Expansion_NOV_SVR_FuckOmsk: "Agreement with Novosibirsk"
 RUS_Decision_Smuta_Expansion_NOV_SVR_FuckOmsk_desc: "Since all sides agree that the Black League is a monstrous abomination, we may be able to secure some military support from a neighboring warlord. The first name that comes to mind is Novosibirsk: they share many of our political priorities, and their vision for Russian unification is remarkably similar in some respects — particularly regarding the role of the military in politics.\n\nMoreover, Novosibirsk also borders Omsk. Perhaps we should reach an agreement: they deploy some light artillery to distract Yastov, while we strike by surprise and crush the Black League once and for all!"
 RUS_Decision_Smuta_OMO_Deactivation: "Stop the expansion of the Theocracy"
 RUS_Decision_Smuta_OMO_Deactivation_desc: "The entire Far East is under the control of the Theocracy; it is time to beat swords into plowshares and rebuild this war-torn land."
 RUS_Mission_Smuta_CHT_ChitaModelSobchakIsACoolGuy: "Export the Chita model..."
 RUS_Mission_Smuta_CHT_ChitaModelSobchakIsACoolGuy_desc: "Anatoly Sobchak is a key figure in our civilian administration. He is an ambitious man, and we can direct his efforts to improving regions beyond his native Chita."

 RUS_Smuta_MainImage_Desc: "§F§fTime of Troubles§!\n--------------\nThe \"Time of Troubles\" lasted from 1598 to 1613, a period of political upheaval, territorial fragmentation, and intensified internal conflict in Russian history. It is believed to have begun with the death of Ivan IV and the subsequent illegitimate succession. Future historians may well call our present era the \"Second Time of Troubles\" — though it will end before we unify [RUS_Smuta_CurrentRegion].§!"
 RUS_Smuta_Contenders_Title: "Contenders"
 RUS_Smuta_Contenders_Title_Desc: "§fContenders§!\n--------------\nContenders encompass all warlords, states, and regimes that claim a portion of §W[RUS_Smuta_CurrentRegion]§! and legitimately control part of it. Whether friend or foe, we must defeat or absorb every one of them to consolidate control over the entire region. Only then can we begin to build a true nation."
 RUS_Smuta_Contenders_Value: "[?Smuta_ContendersReal_Num|W0]"

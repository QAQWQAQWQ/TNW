 ZLT_Black_Market_Purchase_Foreign_desc: "Due to our position in the Russian wasteland, we can utilize the services offered by §YZlatoust§!."
 ZLT_Expenditures: "Opportunities for Expenditure"
 ZLT_Expenditures_desc: "As we gain prosperity and profit in this turbulent age, the administrator and Zlatoust city council seek ways to use our rich profits for the benefit of our people. Some may wish to create better sales figures, but we must remember to maintain our sincerity and humanity in dark times, acting to help our people."

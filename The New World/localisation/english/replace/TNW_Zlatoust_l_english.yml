 ZLT_Defense_And_Influence: "Self-Defense and External Influence"
 ZLT_Defense_And_Influence_desc: "Though Zlatoust has defended the Ural Wall against German aggression and maintained a safe distance from our warmongering neighbors, it must be admitted that the threats around us have not disappeared. Bocharova and her Free Pilots may continue to defend the skies against the Germans, but we must also prepare for all the conflicts around us, so that if everything collapses, Zlatoust will be fully prepared."

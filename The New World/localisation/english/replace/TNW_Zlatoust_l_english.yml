 ZLT_Yevgeny_Dragunov: "Yevgeny Dragunov"
 POLITICS_YEVGENY_DRAGUNOV_DESC: "The blood of Russian gunsmiths flows through Yevgeny Fedorovich Dragunov! He entered the family trade at a young age and soon served the motherland in the Red Army as a senior armorer. He was fortunate enough to be stationed in the Siberian city of Zlatoust, far from the slaughter of the front. Dragunov's fate did not end there; when the Soviet Union collapsed, he became the city's de facto mayor. He expanded the arms industry until it became the city's primary export, profiting greatly from years of bloody Russian infighting. Dragunov's luck improved even further when the esteemed engineer Mikhail Kalashnikov arrived in the city. The two struck up a close friendship, and their combined expertise proved highly profitable, designing formidable weapons the Russians had never seen before.\n\nUnlike other post-Soviet Russian warlords, Dragunov has no delusions of rebuilding the Soviet Union or destroying Germania. He would not mind if those things happened, of course, but he values profit more. Thanks to the arms trade, Zlatoust has become a prosperous and stable haven in a sea of chaos, and he hopes that prosperity and stability will continue. He will sell weapons to almost anyone, and he is eager to find more buyers. In the years ahead, he expects his business to grow ever more vigorous..."
 the_merchant_of_death: "Merchant of Death"
 ZLT_Mikhail_Kalashnikov: "Mikhail Kalashnikov"
 ZLT_Mikhail_Kalashnikov_hog_desc: "§YHead of Government\nLiberal§!"
 ZLT_Konstantin_Rudnev: "Konstantin Rudnev"
 ZLT_Konstantin_Rudnev_for_desc: "§YForeign Minister\n$liberalism_classical_liberalism_subtype$§!"
 ZLT_Vladimir_Konovalov: "Vladimir Konovalov"
 ZLT_Vladimir_Konovalov_eco_desc: "§YEconomy Minister\n$liberalism_classical_liberalism_subtype$§!"
 ZLT_Vasily_Boyarshinov: "Vasily Boyarshinov"
 ZLT_Vasily_Boyarshinov_sec_desc: "§YSecurity Minister\n$liberalism_classical_liberalism_subtype$§!"
 ZLT_Pavel_Shiryaev: "Pavel Shiryaev"
 ZLT_Lev_Gitman: "Lev Gitman"
 ZLT_golden_republic: "Golden Republic"
 ZLT_golden_republic_desc: "With the Ural Mountains as a bulwark against the Germans, and dozens of Russian warlords contending for power across this barren wasteland, opportunity has been created for the men and women of this nation. Though many condemn our arms trade as immoral, exploitative, and dangerous, this very trade is the foundation of our existence, providing a spark of light for our citizens in these dark times."
 ZLT_the_two_consuls: "The Two Consuls"
 ZLT_the_two_consuls_desc: "Yevgeny Dragunov and Mikhail Kalashnikov - our republic revolves around these two leaders. Under their guidance, we have become an oasis of peace in a sea of conflict - achieved by pouring oil on the fire. As the old saying goes, “if you want peace, prepare for war.”"
 ZLT_black_market_payments: "Payments to Zlatoust"
 ZLT_black_market_payments_desc: "We are raising funds for the recent transactions conducted in Zlatoust."
 ZLT_filled_coffers: "Zlatoust Profits"
 ZLT_warlord_interventions: "Contractors Across Siberia"
 ZLT_warlord_interventions_desc: "We may now dispatch mercenaries to warring states in Western Siberia for profit, gaining combat experience for our forces and influencing local politics."
 ZLT_stocking_up: "Stockpiling"
 ZLT_stocking_up_desc: "Infantry equipment is Zlatoust's primary export. To ensure our most precious resource never runs short, infantry equipment production has been prioritized."
 ZLT_zlatoust_security_forces: "Zlatoust Security Forces"
 ZLT_zlatoust_security_forces_desc: "Since our founding, we have given Zlatoust's soldiers the best treatment. We arm them with the best weapons and hire the finest officers. Now they are fully prepared to defend our noble republic against any invader."
 ZLT_final_defenses: "Preparing the Final Defenses"
 ZLT_final_defenses_desc: "Conflict is inevitable. President Dragunov recognized this when he built Zlatoust's economy on arms sales. But this also means some warlord will inevitably try to steal our rich assets or conquer the republic. We will build fortifications, dig trenches, and prepare defensive strategies for this inevitability. With these preparations, no army will be able to defile our land."
 ZLT_zlatoust_advisors: "Zlatoust Advisors"
 ZLT_zlatoust_advisors_desc: "We have hired Zlatoust advisors. In return, the advisors have improved our army' cohesion, making it more fearsome in battle."
 ZLT_hidden_ai_debuff: "Hidden AI debuff"
 ZLT_CAN_INVEST_IN_YUGRA_tt: "Unlocks the §YDecision§! to invest in §YYugra§!.\n"
 ZLT_a_mercenary_state_tt: "Unlocks the §YDecision§! to §Yhire mercenary brigades§!.\n"
 ZLT_pay_to_pass_tt: "Unlocks the §YDecision§! to allow other warlords to purchase §Ymilitary access§!.\n"
 ZLT_the_all_russian_contractor_tt: "Unlocks the §YDecision§! to dispatch §Yvolunteers§! to §Ywarring West Siberian states§!.\n"
 ZLT_send_mercenary_support_tt: "Unlocks the ability to dispatch §Yvolunteers§! to §Y[FROM.GetNameDef]§!.\n"
 ZLATOUST_SENDS_VOLUNTEERS_tt: "§YZlatoust§! will be able to send §Yvolunteers§! to our country.\n"
 ZLT_hire_mercenary_motorized_brigades_tt: "A brigade of §Ymercenaries§! equipped with §Ymotorized equipment§! will appear in our capital.\n"
 ZLT_hire_mercenary_brigades_tt: "A brigade of §Ymercenaries§! will appear in our capital.\n"
 ZLT_the_yugra_connection_mod: "The Yugra Connection"
 ZLT_the_siberian_mediator_mod: "The Siberian Mediator"
 ZLT_helped_us: "Assisted Us"
 ZLT_speculation_and_accumulation: "Speculation and Accumulation"
 ZLT_speculation_and_accumulation_desc: "Russia is a very, very harsh place. Warlords rise and fall; governments can take power and lose it in the same day; ordinary Russians starve on flea-controlled patches of ground. Despite these misfortunes, our arms industry continues to flourish, and people flock to our country to work and serve the republic. We continuously roll out new, cheap, and reliable designs, and the money keeps flowing no matter what happens. The republic is a light burning in the darkness of the Siberian wasteland; as long as citizens live well and business thrives, the republic will prosper. But running a successful business requires preparation. Now the situation in the West is turbulent. Our best course is to reassess our previous plans in light of events and find ways to better serve our citizens and customers."
 ZLT_stock_up: "Stock Up"
 ZLT_stock_up_desc: "Conflict and war erupt around us, and we continuously track orders: rifles, anti-tank guns, rockets, artillery shells, and supplies, among others. Though we have achieved unprecedented success, cracks have appeared in the foundation of our industry. Floods of orders have caused recent production difficulties; aging and malfunctioning machinery alone has cost hundreds of workers and machines from the production line. If pressure builds unchecked, production will stall, the republic's sovereignty will be compromised, and the prosperity we built over years will evaporate. We must build stockpiles of raw materials and weapons to keep a buffer. And if we must face rivals on the battlefield, we will not be empty-handed."
 ZLT_the_frontlines: "The Borderlands"
 ZLT_the_frontlines_desc: "Siberia is a cruel place. Only the strong survive, and only those who provide tools for the strong - like us - prosper. Zlatoust is surrounded by bandits, mercenaries, and revolutionaries with plenty of guns and men who think they have the right to call themselves a “state.” But though our position is dangerous, we have our advantages. The Yugra thugs and bandits to the North bring us great profits, and the military governments and dictators around us are our most loyal customers. Now that the republic has secured its position, it is time to consolidate security in the surrounding areas and renegotiate matters with existing customers. All for the sake of stable traffic, people's safety, and increased profit. After all, coming to make money and only finding bandits would be terrible, wouldn't it?"
 ZLT_flex_our_muscle: "Flex Our Muscle"
 ZLT_flex_our_muscle_desc: "Recently, some of our neighbors have grown bold. Some delay payments, others raid the border with increasing frequency, and small gangs try to steal from our warehouses, straining to carry off weapons and ammunition. The republic must declare that we are not to be compared with other warlords. We are a proud republic, one of the few havens in a cruel land. The Zlatoust Republic is no ordinary state; we will defend our people and our bottom line at any cost."
 ZLT_control_the_roads: "Control the Roads"
 ZLT_control_the_roads_desc: "Though our thriving anti-aircraft production has minimized damage from German air raids, they still destroyed our roads, especially in border areas. Infrastructure is vital to us, so we will rebuild damaged sections and refurbish worn ones. But repairing roads costs money. Our toll system supplements our reconstruction revenue, but it has problems: some citizens pocket the tolls, and neighboring bandits may intercept them, causing toll revenue to nearly vanish in recent years. We will deploy police to secure the roads, ensuring the republic collects needed funds from every traveler. This security also keeps our deliveries running smoothly."
 ZLT_the_yugra_connection: "The Yugra Connection"
 ZLT_the_yugra_connection_desc: "Relations between the republic and the Yugra have always been good, but recent bandit raids and border crossings by mobs have put us in a difficult position. The best solution is to send the republic's best diplomats to reaffirm our goodwill and hopefully renegotiate new agreements. The proposal calls for a mutual alliance between the republic and Yugra, with economically beneficial terms as a sign of mutual defense. In this difficult world, we need many friends, and the Yugra will be our best choice."
 ZLT_a_mercenary_state: "A Mercenary State"
 ZLT_a_mercenary_state_desc: "Our glorious republic has mobilized a small but well-trained and well-equipped force. However, the situation in the West has worsened recently; many warlords seek to expand their territory, or even unify Russia. We must strengthen our defenses. Our manpower is limited, so hiring mercenaries is a good idea, especially Yugra mercenaries. We will spend money to hire, arm, and station a mercenary unit so our own people avoid unnecessary conflict. This expandable force can also patrol our borders and attack bandits who try to steal our stockpiles."
 ZLT_pay_to_pass: "Pay to Pass"
 ZLT_pay_to_pass_desc: "The republic is a light in Russia's darkness; what we offer - stability, security, prosperity, and freedom - is what other warlords cannot provide. Showing these advantages to our neighbors can attract more immigrants. More immigrants mean more workers, soldiers, scientists, and a rapidly growing population, so this must be prioritized. The republic must grow; with more of our people, we will thrive in the wasteland. We will post leaflets and slogans along the busiest roads to persuade travelers to stay in Zlatoust and contribute their skills to the republic."
 ZLT_free_to_stay: "Free to Stay"
 ZLT_free_to_stay_desc: "Zlatoust has one of the best-preserved and most advanced infrastructure systems in all of Russia. We are a major transit hub for goods and people between warlords. To fully leverage our position, opening roads to other regions is a good idea. Of course, it comes at a cost. We will allow neighbors to pay to use roads through our territory; as long as trade flows freely, we will have a stable and significant source of revenue, and perhaps persuade some to stay..."
 ZLT_guns_for_the_men: "Guns for the Men"
 ZLT_guns_for_the_men_desc: "With the recent influx of new units and mercenaries, we need more weapons to arm them. Our factories are working to maintain production without sacrificing other profitable lines. At least in the short term, our only solution is industrial reallocation. We will limit artillery, rocket, and tank production and shift to AK-47M production. The government has another plan: purchasing outdated weapons from warlords and bandits eager for money. This is faster, but it will leave some of our new recruits at a firepower disadvantage."
 ZLT_theres_always_a_price: "There Is Always a Price"
 ZLT_theres_always_a_price_desc: "As a beacon of Siberian capitalism, our economic foundation consists of numerous companies operating arms factories, with no state-owned enterprises producing advanced weapons. But recent problems have arisen. Because most warlords cannot field armored units, one of our T-55 tank factories has ceased operations. Hundreds are unemployed, but the government has a solution. We will buy the factory, re-equip it, find ways to improve profit margins, and put unemployed men and women back to work."
 ZLT_were_the_only_ones_selling_guns: "We Are the Only Gun Sellers"
 ZLT_were_the_only_ones_selling_guns_desc: "The republic has abundant timber, steel, and technical knowledge, allowing us to run a large-scale arms industry. Thanks to our strong air defenses and the nearby Free Pilots, the Luftwaffe rarely flies over our country. This has consolidated our position and given us a monopoly on arms sales to all our neighbors, who know only we can mass-produce high-quality weapons. Our cheap, robust, and efficient weapons are famous far and wide, attracting buyers from across Russia. Now that our position is secure, it is time to reassess our production processes. We will invest profits and effort in developing new rifles, tanks, and artillery components to further improve our product line; we will also refine our methods to produce weapons faster and cheaper than anyone else."
 ZLT_the_siberian_mediator: "The Siberian Mediator"
 ZLT_the_siberian_mediator_desc: "The republic is well-regarded within Russia, though more for commerce than alliance. We are a neutral state; unlike the West Russian Revolutionary Front, the Tsarists, and our eastern neighbors, the republic has no ambitions to unify Russia. Our neutrality puts us in a unique position. We will establish liaison offices and departments among other warlords to prevent them from destroying each other completely. This reorganization also benefits our business: if we can mediate locally, we can arrive faster at the scene of transactions, cutting out the small talk of hosting."
 ZLT_the_bullish_charge: "Bullish Charge"
 ZLT_the_bullish_charge_desc: "Our shining republic is the only democracy in Western Siberia. We are surrounded by authoritarian regimes, feudal fiefs, and bickering militarists. To increase our immigrant population and convert it into labor, we will disseminate leaflets and other pro-government media to citizens and neighboring populations. They will learn why we are so rich and stable, and why we are the prosperous choice in this cold, cruel world."
 ZLT_dig_in: "Dig In"
 ZLT_dig_in_desc: "We have no interest in unifying Siberia under our banner, let alone all of Russia. After all, our profits come from conflict, and we remain neutral. We will strengthen patrols, build fortifications, and enhance our military to protect our shining republic from mob agitators who would steal our arms and wealth."
 ZLT_sell_off_our_stock: "Sell Off Our Stock"
 ZLT_sell_off_our_stock_desc: "Recently, various programs to improve citizens' living standards have drained our treasury, so besides selling weapons to other states, exploring other revenue streams is wise. We will sell weapons to private security companies to further boost our regular income. We can also sell weapons to some “unconventional” clients for some “off-the-books” revenue."
 ZLT_the_yugran_defense: "Yugran Defense"
 ZLT_the_yugran_defense_desc: "We share common interests with our Yugran neighbors. We both seek to survive the treacherous waters of Western Siberia, and we both hope to satisfy our interests without interfering with other conventionally armed warlords. We will send the republic's best diplomats to negotiate a mutual defense agreement so both sides can move forward with a sense of security."
 ZLT_fortify_zlatoust: "Fortify Zlatoust"
 ZLT_fortify_zlatoust_desc: "Our republic's shining capital and industrial center is in a precarious position. Our easily defensible mountain terrain borders many neighbors, so the best way to ensure the republic's security and stability is to build defenses in and around the city. We will prepare and deploy minefields, bunkers, pillboxes, and anti-tank guns so our citizens and workers can enjoy peace without fearing for their safety or that of their families."
 ZLT_the_all_russian_contractor: "The All-Russian Contractor"
 ZLT_the_all_russian_contractor_desc: "Our republic does not wish to raise our flag over the Kremlin, but that does not mean we do not wish to project our influence in other ways. We will provide personnel and time to bandit kings and old Soviet generals in exchange for extra funding, giving our personnel a chance to gain combat experience. This also keeps the republic out of the fallout of any conventional war."
 ZLT_surpassing_forecasts: "Surpassing Forecasts"
 ZLT_surpassing_forecasts_desc: "Our republic is rich, powerful, and thriving. Production of Kalashnikov rifles, RPG-7s, and T-64s has maintained record highs, exported across Russia's vast wasteland. Our democratic fortress's shining lights pierce the eternal night of this cold world. Now that we have secured the republic's position in the short term, it is time to turn our attention inward. We will focus on further improving our people's daily lives and profit margins."
 ZLT_the_home_front: "The Home Front"
 ZLT_the_home_front_desc: "Apart from the Tsarists to the West and East, our citizens have it better than almost any other Russians. But that does not mean it is enough. Though the anti-aircraft guns we produce protect them, occasional attacks still cause harm. Though they no longer live in the shacks and bombed ruins of their former countrymen, they still have almost no heating when the severe winter comes. The republic will work to deliver these things to all its citizens: happiness, health, warmth, food, and safety."
 ZLT_double_our_portfolio: "Double Our Portfolio"
 ZLT_double_our_portfolio_desc: "The republic's industry prospers as if fed on flame and flowers. But even with floods of guns and tanks rolling off the lines daily, the republic's appetite for profit is never satisfied. To ease popular discontent with profit margins and with recent increases in revenue, we should begin finding ways to further improve production efficiency. We will invest heavily in new factories, new equipment, and new workers so the republic's productive capacity multiplies. Our people will soon know a new era of happiness and prosperity. And this is only the beginning of the plan."
 ZLT_guns_for_factories: "Guns for Factories"
 ZLT_guns_for_factories_desc: "We have commercial ties around the world, and our partners naturally welcome the republic's tireless efforts to achieve great success. As one of our new measures to raise goods production and citizens' living standards, the republic will purchase new equipment for our factories. The republic will approach friendly warlords, traveling merchants, and foreign agents to acquire new machines and arms to boost production. This will produce a quantum leap in our productive capacity and earn us greater profits."
 ZLT_expanding_the_sprawl: "Expanding the Sprawl"
 ZLT_expanding_the_sprawl_desc: "Zlatoust and Nizhny Tagil are our most populous cities and the largest production centers in all of Russia. The republic has invested heavily in our industry; now we will turn our attention to the republic's greatest wealth: our citizens. We will invest in apartment buildings and suburban housing around industrial centers to improve citizens' welfare. We will also build more factories producing weapons and consumer goods for export and for our citizens' enjoyment."
 ZLT_the_industry_never_ends: "Industry Never Ends"
 ZLT_the_industry_never_ends_desc: "The republic is booming! Our profits rise, equipment production hits new records, and our citizens are healthier and happier than ever. But we can improve further. Large swathes of the republic's territory have not yet been touched by industry. To increase profits further, we will begin zoning land to build more industrial parks. This will create new jobs for land clearers and factory workers, allowing our citizens to make a living."
 ZLT_dynamic_revolution: "Dynamic Revolution"
 ZLT_dynamic_revolution_desc: "The republic is surrounded by tyrants, communists, and dictators. Their people are tormented by oppressive regimes riding over them, so it is in the republic's best interest to conduct covert operations to promote democracy. We will arm insurgents on neighboring territory to create opportunities to weaken them. The resulting internal conflicts will also create new markets and proving grounds for the weapons the republic produces. The two things the republic stands for - profit and democracy - can both be advanced through these actions."
 ZLT_replace_and_restore: "Replace and Restore"
 ZLT_replace_and_restore_desc: "Though the republic's city centers are modern, the suburbs still have dilapidated and dangerous buildings, and much of the infrastructure connecting our cities and industrial parks is old and worn. We will use funds invested in domestic affairs and profits from road-right-of-way deals to repair the republic's roads and launch a new program to renovate our large housing projects."
 ZLT_guns_like_no_other: "Guns Like No Other"
 ZLT_guns_like_no_other_desc: "We have the most advanced rifles, artillery, rockets, and tanks in all of Russia. Dozens of different types of ammunition are produced daily in the republic's factories, but we cannot grow complacent. Our city administrator Yevgeny Dragunov and his partner Mikhail Kalashnikov lead the state design and development bureau, responsible for creating the weapons the republic uses daily. Now they have decided to reopen the design bureau and invest heavily in research departments so we can innovate and improve our weapons and production methods."
 ZLT_out_of_our_pockets: "Out of Our Pockets"
 ZLT_out_of_our_pockets_desc: "The republic's citizens work day and night to meet quotas, allowing us to fill the great nation's coffers. Our industry thrives, our roads are renewed, and our buildings are repaired. It is time to help our men, women, and children learn about the world around them and the history of the Russian people. Dragunov has ordered the investment of funds to build new sculptures, schools, museums, and cultural centers for our people. The republic's citizens will no longer be portrayed as expendable drones producing war machines; we will achieve a balance of commerce and entertainment in society."
 ZLT_industry_like_no_other: "Industry Like No Other"
 ZLT_industry_like_no_other_desc: "The design bureau is forming a new team focused on the new fields of computing and electronics, exploring how to apply advances to the republic's industrial production. To accelerate development, we will establish a new fund making heavy investments in the republic's new universities and polytechnic institutes. Zlatoust will have the greatest engineers and researchers in all of Russia, and this most serene republic will become a fortress of hope in this harsh world, a beacon of democracy and modernization."
 ZLT_into_the_soldiers: "Into the Soldiers"
 ZLT_into_the_soldiers_desc: "Now that our industry has been renovated and expanded, and our citizens enjoy one of the highest living standards in all of Russia, though our nation prospers, we have neglected one important aspect of the republic: the armed forces. We will invest in training programs to further strengthen our already high standards, ensuring our soldiers become the best-trained and best-equipped forces in all of Siberia."
 ZLT_into_the_defense_line: "Into the Defense Line"
 ZLT_into_the_defense_line_desc: "With our large profits, we can greatly enhance the republic's defenses. We will position and build new fortresses, anti-tank guns, anti-aircraft guns, bunkers, and tunnels along the border. The serene republic of Zlatoust will defend against all threats around us. If any dictator, communist, Black Leaguer, or German tries to harm our citizens, sulfur, flame, and endless wrath from our borderlanders will await them."
 ZLT_our_shining_republic: "Our Shining Republic"
 ZLT_our_shining_republic_desc: "Our treasury is gilded and jeweled. Our citizens are well-fed, safely housed, and enjoy modern amenities. Rifle after rifle, tank after tank, gun after gun - our factories run at full throttle. The republic's way of life and democratic ideals are protected from any potential threat. The republic has built a lighthouse in the stormy seas of the Russian wasteland, offering a vision of a better new life to those who flock to our borders. We have built a brave new world - through superior firepower."
 ZLT.1.t: "Zlatoust, the Merchant Nation"
 ZLT.1.desc: "Russian history is a history of blood, defeat, and ruin. Now, even the squabbling over the scraps of the motherland has cost millions of lives to gunfire. The West is a prime example: a sea of fire, warlords packed shoulder to shoulder, who value rigid ideology more than their own people. But all hope is not lost.\n\nZlatoust perches on the Ural heights, the last true bastion of freedom in old Russia. Behind the desolate mountains hide dozens of factories that survived the Luftwaffe's rain of death. Bandits dare not risk crossing the Urals, lest they meet the republic's stalwart sentries. Hundreds of refugees flock to Zlatoust, escaping the fury of madmen who circle their mountain home like sharks, forever eager to tear them apart.\n\nRumor has it that the vast caverns here are stuffed with intact weapons and heavy equipment, enough to give their masters the edge over any force in Siberia. Unfortunately, some have tried to uncover the source of Zlatoust's unnatural prosperity. Indeed, every sack of wheat and luxury goods traded in the mountains brings convoys of armed trucks, ultimately bound for bandit territory. Zlatoust is a heaven built upon mountains of corpses and seas of blood."
 ZLT.1.a: "Come! There is money to be made."
 ZLT.2.t: "Trading at the Border"
 ZLT.2.desc: "To: XXXXX XXXXXX\n\nFrom: X Patrol\n\nDate & Time: XX/XX/XX\n\nInteraction: Secret Observation\n\nDetails: Sir, earlier today, Private XXXXXXX called base to report unidentified activity at the Ural mountain boundary. The reconnaissance squad confirmed the private's report: a large group of unrecorded soldiers appeared near the XXXXXX forest, apparently conducting a military exercise. They fired at dummy targets at about 400 meters and held hand-to-hand combat training with each other in the evening.\n\nI firmly believe they are not another mercenary guerrilla, because these soldiers showed discipline... but more importantly, they used modern weapons. Private XXXXXXX has crept close to this group, hoping to observe them from the other side of the forest. Though I cannot confirm his report, he swears he also saw a functioning tank, and possibly some trucks hidden in the trees. Sir, whatever the case, these soldiers are preparing for more than a war."
 ZLT.2.a: "Who can afford a tank here? Unless..."
 ZLT.3.t: "Reinforcements... Have a Price"
 ZLT.3.desc: "Jaba Ioseliani walked toward the caravan, his heavy footsteps splashing mud, snow swirling around him. The Zlatoust convoy waited on the other side of the compound; fur-clad merchants drew envious glances from the frozen guards. For a moment, Jaba thought he saw a faint smirk cross the merchant leader's face. He stared at the armed mountain trucks, capable of crossing any blizzard. He, the most successful bandit in all of Russia, had arrived on horseback.\n\nThe merchants brought the leaders three crates of rifles, ammunition, and some combat knives. Jaba picked up one: an old AK-47. Its barrel was damaged, but it would still serve. He turned and nodded to his bandits. They snatched the crutes like vultures picking at the leavings of a fierce predator. Then some underlings emerged from the bushes, carrying heavy sacks on their shoulders. They dumped the sacks into the mountain trucks and disappeared into the trees.\n\nThe merchant leader gave a dry smile and pulled a letter from his coat. Jaba took it, but before he could open the envelope, the merchants had started their engines.\n\n“Zlatoust is very grateful for this transaction,” the merchant leader shouted. “We hope there will be more in the future. Send a messenger with your reply; we have more!\u201d\n\nThe convoy left the compound, and a gust of snow blew into Jaba's face."
 ZLT.3.a: "Much depends on this deal."
 ZLT.4.t: "The Yugra Gang Accepts!"
 ZLT.4.desc: "The roar of truck engines drowned out the birdsong, and an armed column appeared on the horizon. Jaba, wearing an oiled vest and shorts, emerged from his bunker. The merchants' arrival caught his camp off guard, but before the bandits could scramble back to their bush hideouts, Zlatoust's elite had already walked into the clearing. More than twenty men with modern assault rifles and gas masks never before seen in Siberia stood there.\n\n“We have come to visit Comrade Jaba!” one of the soldiers shouted, shouldering his rifle.\n\n“I am Jaba.” The bandit waded through the mud, pushing aside some underlings. The meeting was supposed to be next week, but Jaba found himself worried for the first time in months. This base was secret - how did the merchants know? They could easily, if they wished...\n\n“Zlatoust apologizes, comrade,” the merchant leader sneered. “But there is a transaction my colleagues wish to conduct immediately.” Troops emerged from the backs of trucks, carrying several crates marked with death's-head insignia.\n\n“Mr. Ioseliani, we have brought 200 Kalashnikov rifles, 150 grenades, and the last 5 trucks are all yours.” Jaba looked to the tail of the convoy, desire flaring in his eyes. He raised his hand, and a line of mules carrying sacks of grain emerged from the trees. The merchant leader raised an eyebrow, studied the animals, took a deep breath, and turned back to Jaba.\n\nThe Zlatoust men watched Jaba and his people hand over the grain. “Now, to ensure mutual trust in transactions between the republic and the Yugra, we must have complete trust. Hand over the rest to us,” the merchant said. Jaba looked back at the glint of car mirrors hidden in the trees, signaling them to come forward.\n\nMinutes later, trucks roared up the snowy trail. The Zlatoust convoy left, disappearing into the distant mountain shadows."
 ZLT.4.a: "They made the wise choice."
 ZLT.5.t: "A Haven in the Mountains"
 ZLT.5.desc: "A fly landed on a dirty window, the only light source in the Siberian winter.\n\n“Your name?”\n\n“Sergei Petrovich.”\n\nThe fly crawled through a small hole in the stone wall, into a small room. Inside were two men, a table, and a lamp. “Where are you from?”\n\n“Orsk. I fled six days ago.”\n\n“Anyone with you?”\n\n“My daughter, Ivanna. She is outside.”\n\nThe fly, drawn to the dim light, flew over and landed on the lampshade.\n\n“Your - ”\n\n“Sir, forgive me for interrupting, but have you seen a woman about forty, short, blond?”\n\n“I'm sorry, we have many new arrivals here. Your - ”\n\n“Please, sir, her name is Irina. You know, but...”\n\n“What is your profession?”\n\nThe fly flew to the center of the lamp, its frozen feet still.\n\n“I, I am a math teacher. Listen, she was supposed to meet me at this entrance, but I cannot find her. Sir, please, we just came from Orsk, she could be anywhere - ”\n\n“I'm sorry, but if I see her, I will let you know. We have about a hundred people here, all from everywhere.”\n\n“But, but she said she would meet me, we - ”\n\n“You have passed. Take your daughter to Zlatoust.”"
 ZLT.5.a: "Heaven is founded upon white bones."
 ZLT.6.t: "Diplomatic Maneuvers"
 ZLT.6.desc: "To: XXXXXXX XXX\n\nFrom: XXXX XXXXXX\n\nDate & Time: XX/XX/XX\n\nInteraction: Diplomatic Interaction\n\nDetails: Sir, I am pleased to report that our border dispute with the XXXXX Group ended this morning. Scouts report all hostile forces have withdrawn from XXXXXXXXX. Our own forces have also withdrawn except for a squad of snipers stationed on XXXX Mountain. A messenger tells me you have recovered from your illness, so I think now is the time to give you the full story:\n\nAs you know, the XXXXX Group entered our pasture last month and clashed with our forces in fifteen skirmishes, costing 62 brave men. Despite previous promises, the enemy's offensive near XXXX Mountain slowed a week ago, and their casualties surged.\n\nThis resolution came about because a man named XXXX XXX arrived at our outpost in a car model XXXXXX, claiming to be a representative of Zlatoust. He offered to mediate our dispute in exchange for XX sacks of wheat. With Comrade XXXX's permission, I accepted. I later learned the man had also approached the XXXXX Group. Three days later, he held a meeting between us, and we agreed to give up one-quarter of the milk from our cows grazing on the disputed pasture.\n\nI firmly believe that cooperating with Zlatoust is far preferable to continuing border clashes with other neighbors. The representative was calm, charismatic, and disciplined. Our reports also confirm that Comrade XXXX's group has conducted similar transactions, proving Zlatoust's ability as a mediator. I recommend establishing contact with those merchants immediately."
 ZLT.6.a: "Zlatoust offers more than guns."
 ZLT.7.t: "The Elite of Zlatoust"
 ZLT.7.desc: "“Comrades! Listen to me! You are the guardians of peace! Your strength, will, and skill - the only things separating our home from the terror outside.”\n\nSarkov scribbled the speech in long, crooked lines, trying to ease his pain.\n\n“Zlatoust will forever thank your efforts; warriors who fight for justice deserve the highest respect! Yes! You will go into battle! Yes, you will lose friends, but the alternative is the destruction of everything we cherish! Listen, soldiers, we are a society of free men. Many of you have seen the chaos beyond the Urals, where demons fight over spoils and glory.”\n\ncFight for the spoils and the glory.” Sarkov finished writing, put down his pencil, and tried to grasp the meaning behind the words. Remember, Sarkov, you fight for justice. Remember that.\n\n“Listen to me! We are the last bastion of democracy and freedom! To sacrifice your limbs and your life for these rights is an hon - ” The captain raised his hands to the ceiling, veins bulging on his flushed face, and a few cadres at the back of the room snickered. “Who is laughing?!” the captain roared. “Is it you? You have no other obje - ” The man's eyes swept down to the notebook on Sarkov's knee, with its jumbled handwriting, and he fell silent. “Raise your right hand.”\n\nSarkov's heart sank. He raised a stump toward the captain, who seemed stunned, anxiously wondering how to respond.\n\n“Take notes, everyone. This soldier,” he pointed at Sarkov, “is trying to write with his left hand. Soldier, did you lose your hand in combat?” Sarkov nodded.\n\nThe captain returned to the blackboard and continued: “This man has great resolve. He did not need to keep fighting - he could have been discharged for his disability. But he is full of honor. He is full of strength. He comes to a pre-battle lesson with only one arm! This boy should shame you bastards! Take notes, take notes! Be like him! The rest of the world is cruel. Many of you will die. But this is a precious lesson. This is why you keep fighting even in the face of death.” Sarkov picked up his pencil and wrote, but he felt more than a dozen eyes on him. “I sacrificed my hand for peace. I am a soldier of Zlatoust.”"
 ZLT.7.a: "“I fight for justice.”"
 ZLT.8.t: "Bandits and Merchants"
 ZLT.8.desc: "Jaba had prepared for the merchants' arrival. He sent all his underlings to watch the roads so they would not be caught off guard again. A squad of hunters was posted in the tall trees near camp so he could set his terms when the Zlatoust convoy came to meet the bandits. So when the merchants arrived, Jaba stepped out of the hut surrounded by four guards armed with the most intimidating - and least effective - weapons they could find. But surprisingly, only one truck entered the camp, and only one merchant stepped out, bringing not death but opportunity. His words were like song, yet he maintained his dignity and directness as best he could. Jaba could only listen as the man made outrageous demands in exchange for trivial promises, yet he conveyed it all in a way even a king could understand. But in the end, the deal came down to this:\n\nThe bandits were indeed brave, but their numbers were insufficient to properly protect their territory (and spoils). Jaba thought it was true; tales of bandits double-crossing each other were common. So Zlatoust wanted to offer protection to Yugra, but on one simple condition: permission to cross the gang's territory. This must have been a prank hatched in Zlatoust's dark halls. And yet..."
 ZLT.8.a: "...The merchants have already proven useful allies."
 ZLT.8.b: "...I think we can handle this ourselves."
 ZLT.9.t: "Yugra Refused!"
 ZLT.9.desc: "It seems our old “friends” in Yugra are not very concerned about their own safety. These bandits have ignored the people who offer the best weapons on the market, choosing independence over survival. Jaba Ioseliani has made a foolish mistake that will haunt him for years to come. But we will find other assets. There has been enough suffering in old Russia."
 ZLT.9.a: "Now they are independent..."
 ZLT.10.t: "Yugra Accepted!"
 ZLT.10.desc: "Mr. Ioseliani and his people have made the wise choice. Yesterday, twenty caravans left Zlatoust, half carrying guns and half carrying soldiers and engineers. Under the XXXXX Defense Plan, our forces will establish defensive positions in the border forests and along the Ural foothills. Limited cooperation and camaraderie between senior officers and the gang is permitted. Mr. Ioseliani's commanders have sent us maps of their weapons depots and bunkers. It seems Yugra is far more militarized than we expected, but the bandits remain undisciplined and lack political affinity. Commander XXXX has identified shortcuts through the area and wants our forces ready for rapid deployment."
 ZLT.10.a: "It is a pleasure doing business with you."
 ZLT.11.t: "Zlatoust Provides Mercenaries!"
 ZLT.11.desc: "To: XXXXXXX XXX\n\nFrom: XXXX XXXXXX\n\nDate & Time: XX/XX/XX\n\nInteraction: Military Cooperation\n\nDetails: Earlier today, six companies were deployed to XXXXX as a goodwill gift from Zlatoust. These men engaged in a brief border clash, inflicting disproportionate casualties on hostile forces. The mercenaries have passed muster, proving the organizational discipline of Zlatoust units, trained in the modern warfare doctrines developed by the merchants. One of our commissars remarked: “These soldiers showed discipline in the face of lethal adversity, faithfully executed orders, and risked their lives in service of the nation... They are more like professional soldiers than mercenaries.”\n\nAs agreed, Zlatoust has received our payment, but their merchant leader claims more business opportunities await us. The large forces the mountain republic possesses are invaluable in turning the tide of this war."
 ZLT.11.a: "We thank them for their help."
 ZLT.12.t: "Zlatoust Provides Weapons!"
 ZLT.12.desc: "To: XXXXXXX XXX\n\nFrom: XXXX XXXXXX\n\nDate & Time: XX/XX/XX\n\nInteraction: Diplomatic Exchange\n\nDetails: Yesterday, a convoy of XX trucks arrived at the XXX camp carrying XXX crates of Kalashnikov rifles and other weapons. In addition, the “gift” included helmets, vests, combat rations, and a pen (see appendix). This is a welcome relief, as Commissar XXXX reported that frontline supplies were already running low.\n\nP.S. Sir, the guns Zlatoust produces are superior to most of what we currently field. Beyond being more technologically advanced, the soldiers report these weapons jam less and have fewer duds. This product quality means they have machine shops. Sir, with your permission, I would like to contact the merchants again and negotiate more contracts. These weapons can win us the war."
 ZLT.12.a: "We thank them for their help."
 ZLT.13.t: "Zlatoust Provides Advisors!"
 ZLT.13.desc: "To: XXXXXXX XXX\n\nFrom: XXXX XXXXXX\n\nDate & Time: XX/XX/XX\n\nInteraction: Military Advice\n\nDetails: Six officers sent by Zlatoust have just arrived at XXXX. Per your instructions, they have been assigned to the barracks to begin work. We hope the training goes well; after all, the merchant leader assured me these advisors are the elite of the elite. One of them, Mr. XXXX, has fought in two wars. I have reassigned him to the XXX battalion to work with our general staff.\n\nAccording to other reports, another team of military experts will arrive within a week. They will be sent to the XXXX front to provide tactical advice to frontline units. These capable men will not only supplement our officer corps but also bring knowledge of asymmetric warfare that can give us an edge in battle. I strongly recommend hiring more advisors from Zlatoust."
 ZLT.13.a: "We thank them for their help."
 ZLT.14.t: "An Alliance with the Merchants?"
 ZLT.14.desc: "Jaba peered through his binoculars, nodded approvingly, then turned to his squad leader, yawning as he spoke: “Are they still there?” When the squad leader nodded and pointed west, Jaba smiled. He looked into the distance again, and this time spotted a cluster of trucks surrounded by idle merchants. Good. Jaba breathed the fresh morning air, taking in the peaceful scene: pine trees everywhere, with only a thin dirt road separating the ancient forest from the hillside where he stood.\n\n“Sir.” The squad leader called out, pointing to a masked man walking toward them, occasionally stopping to catch his breath on the steep slope. After all, reaching the king of thieves was no small effort. The man finally reached the summit and shook off his helmet. It was the merchant leader from the Eastern Urals. Jaba stood and studied him, noting he was grinning.\n\n“Mr. Ioseliani, I have come to offer a transaction that will last a lifetime,” the merchant said hurriedly, pulling documents from his pack. “My superiors have authorized me to offer you a defense contract, in the best interests of both our peoples.” Jaba fell silent. And then? What is the gain?\n\nThe merchant continued: “As a supplement, Zlatoust is willing to provide your forces with an additional 200 crates of equipment, and whatever advisory help you may need.” He handed Jaba a document and a pen: “By the way, you can keep the pen.” Hmm, the things they provided last time were quite useful..."
 ZLT.14.a: "...That pen looks pretty good too."
 ZLT.14.b: "...But I do not see the real gain yet."
 ZLT.15.t: "Agreement with Yugra"
 ZLT.15.desc: "...Furthermore, under the terms of the Zlatoust-Yugra Treaty, both parties must be prepared to participate in each other's defensive conflicts. If a call for aid is refused, the treaty becomes void immediately, and all communications between the parties are cut off immediately... Jaba Ioseliani agrees to attend all treaty member conferences held at XXXXX, signed: ______.\n\nFor details on the exchange of military equipment between the parties, see Article 4, Paragraph 1; summary: The Yugra State and the Zlatoust Republic agree to cooperate in the production of small arms and the exchange of military and economic advisors for the benefit of treaty members...\n\nJaba Ioseliani agrees to continue the XXX Agreement, concerning the free movement and stationing of republic forces within Yugra-controlled territory, signed: ______. The Zlatoust Republic agrees to provide XXXX units of XXX and XX units of XX-XX to Yugra monthly... Zlatoust agrees to protect Yugra's borders against invasion by the 42 hostile entities listed in the treaty... Zlatoust agrees that if Yugra is defeated and surrenders in a future war, Zlatoust will provide safe haven for the Yugran government and all members of the general staff..."
 ZLT.15.a: "Signed: Yevgeny Dragunov."
 ZLT.16.t: "Victory of the Golden Republic!"
 ZLT.16.desc: "Some within Russia call themselves children of the Soviet Union, aiming to outlast the warlord era and inherit Bukharin's throne as General Secretary. Take the Kaganovich regime, or the West Russian Revolutionary Front to the north. Others call themselves protectors of Russian statehood or identity, enforcing their dictatorship at gunpoint and threatening all who oppose unification. Their representatives include Rokossovsky's ailing military government and the madmen of Wagner to our west. And others still can only find themselves in fanatical dreams of fighting the Germans - like the people of Omsk, or Karbyshev's Black followers.\n\nBut we do not recognize these delusional fantasies as the guiding ideology to unite these lands. Through our city administrator, the wisdom and guidance of Dragunov, the people of Zlatoust have successfully preserved their political and economic independence against the savage warriors threatening us! The city administrator has found the road to prosperity, where men, women, and children have found a better new life in Zlatoust than anywhere else in this cold wasteland. Today, gun designers and statesmen walk hand in hand, celebrating the defeat of those who would destroy everything we have built!\n\nBut the work is never done in these matters, is it? Now that these newly acquired territories are under our control, the new task is to establish small puppet regimes. They will bow to the will of the people of Zlatoust and build a wall of security against other threats. Beyond that, our other task is to sign contracts with these small new puppets, giving Zlatoust's private entrepreneurs a new way to accumulate profit!"
 ZLT.16.a: "Three cheers for Dragunov! Three cheers for Zlatoust!"
 ZLT.17.t: "A Simple Tinkerer"
 ZLT.17.desc: "Another sleepless night. Insomnia has become more frequent lately. Kalashnikov does not know why. On the surface, nothing has changed. He turned to Ekaterina, sleeping beside him. She was safe. The children were safe. They were healthy and happy, longer than most people could ever dream. He had provided this for them. Once he had felt deeply satisfied, but now, whenever he closed his eyes, he saw the muzzle flashes and heard the thunder of the rifle named after him. He had been proud of the AK-47. Sometimes he still was. It was truly a groundbreaking weapon, and he sometimes wondered whether some goddess of ruin had guided his hands on the day he drew the first designs. Simple, durable, lethal.\n\nNo one would have imagined that a farmer's son from the Altai would create the most important rifle in Russian history, least of all himself. Now, a veteran of two wars, he had transformed into an arms dealer disguised as a politician, making his fortune on a scarred wasteland. He laughed to himself, thinking he might be one of the luckiest men on Earth.\n\nBut the unease in his heart had not disappeared. He remembered the day he first disassembled his father's hunting rifle. He found himself dwelling more and more on that day. He was not yet ten years old when he felt his calling: to inspect guns, to learn the elegant locking of each part. Sometimes he wished he could reach through the veil of time, grab that little boy, shout at him, warn him, or beg him: put the gun away, and never look back. He might have become a mechanic, or an engineer. He could have used his talent to design many other devices. Who would have known that the charm of a firing mechanism would lead to all this? He was still proud of his creation, but more and more he wished he had never had it.\n\nEkaterina murmured in her sleep. He sighed, lay back, and stared at the ceiling. It had been a while since he had slept."
 ZLT.17.a: "We all struggle with the choices of our past."
 ZLT.18.t: "Pilots Over the Republic"
 ZLT.18.desc: "Misha and his friends rushed to a cliff outside Novouralsk when they heard a sound familiar to every Russian: the drone of German bombers.\n\nAs a coping mechanism, the friends bet, as usual, on which target the bombers might hit. Misha said the republic had recently repaired the railway from Nizhny Tagil, and it was sure to be the target. The others argued the target would be the ammunition workshops in the suburbs, though they were probably already bombed to pieces. As it happened, their bet would never be settled.\n\nIn the clouds above the German formation, small black dots appeared over the bombers. When the friends heard the unmistakable rattle of machine guns, they realized what was happening and began to cheer. The pilots were legends; they were not only revenge heroes fighting the Germans, but they chased away the desperate drone of bombers that hung over people's hearts.\n\nOne bomber was flipped by an explosion and began to yaw. It plunged earthward, its angle steepening until it was almost vertical. When it hit the ground not far from the cliff, it was as if a small earthquake had struck.\n\nAfter the other bombers and the pilots flew off, the group rushed to the crash site, because they saw other armed people doing the same. For the Zlatoust Republic, German weapons and scrap were valuable, easily sold to various warlords, and Misha hoped to be the one who found them. He also hoped the bomber crew had all died in the crash.\n\nBecause if they had not, some very ugly scenes would surely follow."
 ZLT.18.a: "Just a scratch, but a scratch nonetheless. It is enough."
 zlatoust_sales.1.t: "[FROM.GetNameDef] Requests Access"
 zlatoust_sales.1.desc: "Paperwork, paperwork, and more paperwork. The city administrator should have expected this level of administrative work when he accidentally became leader of this settlement years ago, but the pros and cons still touch the soul of this former Soviet official. Indeed, posing on a profit-rich land can make you king of wealth, that much is certain. But this damned paperwork? He stared out the window at the falling snow; in days past, the physical labor of organizing and distributing weapons and ensuring every rifle's quality had become a dream for this man.\n\n“City Administrator Dragunov. One of our neighbors has sent a diplomatic resolution to your office,” the young secretary said.\n\nHow curious. Not all nearby states hold friendly attitudes toward the existence of Zlatoust; they all look for opportunities to erode the vast profits flowing through this place. What do they want now through “diplomacy”?\n\n“To the honorable City Administrator of Zlatoust:\u201d\n\n“As you know, not everyone in Russia achieves their goals through handshakes, and once they conquer their target, nothing is left to rule. Having recognized the strong economic position of your regime, I beg you to allow my people entry into your country, and permit us to achieve a healthy level of profit through mutual cooperation.”"
 zlatoust_sales.1.a: "Through cooperation, Zlatoust will grow further."
 zlatoust_sales.1.b: "Our city, our profits. No deal!"
 zlatoust_sales.2.t: "Zlatoust Grants Access"
 zlatoust_sales.2.desc: "It was not easy standing here, staring through the window at the terrible, ruined courtyard, looking out over these ruled, deeply affected lands, where every day citizens, every day Russians, perish from disease and famine. Since the founding of the state, all precious resources have been exhausted, and fear prowls across this narrow land. What is a ruler if he cannot feed his people? The lord sat in his chair, thinking, clutching his face with cold, calloused hands.\n\n“My lord, it is a letter from Dragunov!” the young child shouted, waving a letter in front of the lord. Merciful God, is this it? Finally, a day when the people of this land will find not only death, but greater opportunity in Zlatoust?\n\n“Many factors drive Russia's constant change, and the Russian people may find they can no longer find prosperity in this dark age. In light of this, the Office of the City Administrator has approved trade between the two parties, in accordance with our charter of operational effectiveness and efficiency. Therefore, under this charter, your people may enter our country and conduct business with our citizens; first, all entry rights will...”\n\nThe local lord found he could no longer see the rest of the note. Instead, the man found himself wiping the note away, smudging some ink in the warmth, tears running down his cheeks. Finally, no more starving Russians would walk into his office begging for state aid. Finally, no more explaining to children why their parents were cold, lifeless, and hollow-bellied. At last, working with this king of guns might yield some benefit."
 zlatoust_sales.2.a: "Russia still cooperates closely!"
 zlatoust_sales.3.t: "Zlatoust Refuses Access"
 zlatoust_sales.3.desc: "It was not easy standing here, staring through the window at the terrible, ruined courtyard, looking out over these ruled, deeply affected lands, where every day citizens, every day Russians, perish from disease and famine. Since the founding of the state, all precious resources have been exhausted, and fear prowls across this narrow land. What is a ruler if he cannot feed his people? The lord sat in his chair, thinking, clutching his face with cold, calloused hands.\n\n“My lord, it is a letter from Dragunov!” the young child shouted, waving a letter in front of the lord. Merciful God, is this it? Finally, a day when the people of this land will find not only death, but greater opportunity in Zlatoust?\n\n“Many factors drive Russia's constant change, and the Russian people may find they can no longer find prosperity in this dark age. In light of this, the Office of the City Administrator has refused your citizens entry into Zlatoust. Defense, security, and unity are our government's priorities; we cannot allow potential threats into a profitable area. We act fully in accordance with our charter of operational effectiveness and efficiency; first, merchants doing business must mutually agree...”\n\nThe local lord found he could no longer see the rest of the note. Instead, the man could only make out the message in the crumpled paper, held tight in his hand, torn apart by the anger of failure. Today, he could only look out that damn window again, witnessing the suffering of his people. Then some government officials carried out a blanket-wrapped body on a stretcher, followed by several confused and grieving children, as if in a punctual line."
 zlatoust_sales.3.a: "Lonely trembling strikes again."
 zlatoust_sales.4.t: "Guns and Gifts"
 zlatoust_sales.4.desc: "To many, Mikhail Volonin is a figure of consequence. After years on the front fighting the Germans, though he did not return home covered in glory, heaven had mercifully entrusted him with some responsibility in his own small village's elections. Becoming a father had also done him good, teaching him the meaning of doing something good for the community. But in the next few minutes, all of that became irrelevant. Or perhaps it was very relevant. Seeing the trucks roll into the snow-covered bushes, Volonin felt hell was not far from him.\n\nMr. Lagunov stepped out of the middle vehicle; his task had been to meet the person coordinating the arms deal. But because Mikhail's superiors had attacked the Zlatoust people, he could now feel death approaching in the dark.\n\n“So, Mr. Lagunov, I know today's deal cannot continue. But City Administrator Dragunov is experienced and wise; perhaps there is still a chance for agreement?” Mikhail said. Of course, his bright smile could work miracles for many, but no false laughter could hide the anxiety crawling up his spine.\n\n“Do not worry, your people will still receive weapons. The City Administrator has approved more transactions with your people in the future. We meet at the old place every two weeks. Cash on the barrelhead. Understood?”\n\nMikhail, tangled in shock, nervousness, and fear, was immensely surprised by the action's success. “Of course, sir, whatever you need, we can - ” but before Mikhail Volonin could finish speaking, the gun merchant had turned and walked back to his convoy, the trucks' roaring engines dispersing the Russian cold snow."
 zlatoust_sales.4.a: "I suppose all of this is forgiven now."
 zlatoust_sales.5.t: "Deal Failed!"
 zlatoust_sales.5.desc: "“We want to buy thirty rifles, City Administrator Dragunov. Thirty. Rifles.”\n\n“Zlatoust's incompetent sales chains here made a major mistake, Mr. Utkin. They have all been dismissed, and perhaps we can continue the trans - ”\n\n“Fuck your transaction, Dragunov. In the last bandit raid, twelve of my people and three officers died, and I cannot even tell you how many starved to death because of it. You know why? I will tell you, Dragunov: my people cannot fight these fuck bandits with knives and pokers. My people cannot beat a fucking bear with their bare fists. We have waited three months for these weapons, and the result of waiting is dying together. Russian men and women are not Zlatoust's stupid moneybags, Mr. Dragunov!”\n\n“Hello? Hello?” With a final angry roar, the line went silent.\n\nDamn it all. Lost another customer. City Administrator Yevgeny Dragunov threw back his chair; it hit the floor with a crash, and he walked straight to his office window. From here, the city administrator watched his hardworking people, laboring to earn high profits from all the conflicts across Russian soil. By God's mercy, because they did not know about the four lost shipments, a vital source of funding had starved. Indeed, if City Administrator Dragunov could not find a solution, Zlatoust' “gilded tongue” reputation would become a lie."
 zlatoust_sales.5.a: "Hard times for the merchants of death."
 zlatoust_sales.6.t: "Zlatoust Order Cancelled"
 zlatoust_sales.6.desc: "Winter's white morning; smoke billows from a burning abandoned warehouse. A gang of bandits, with the guns, bombs, and bullets they desperately needed, smashed through the warehouse wall, dragged off everything they could carry, and fled - the empty warehouse behind them catching flame and burning. Twelve fighters lay inside, having given their lives defending their home, their wives, their families. “Get me through to Dragunov,” Colonel Utkin said calmly as the winter dawn spat this out before him.\n\n“We want thirty rifles, City Administrator Dragunov. Thirty. Rifles.”\n\n“Mr. Utkin, several production links in Zlatoust's weapons chain made serious mistakes, and those utterly incompetent bastards have been dismissed and dealt with, and we can continue our transaction - ”\n\n“Fuck your transaction, Dragunov. Bandits robbed us, we lost twelve men, three officers, and a whole lot starved to death, too many to count. You want to know why, Dragunov? We cannot beat these bastard robbers with knives and fireplace shovels. A man cannot beat a bear with his bare fists, Dragunov. We waited months for these weapons, and you killed us while we waited. Russian men and women will cheer for Zlatoust's motherfucking “business,” Dragunov!”\n\nIt was going to be a long night. Colonel Utkin knew they could not stop trading arms with Dragunov; his village would ultimately have to submit to Zlatoust's business paradigm, forced to sit, wait, and bleed. Now he could only pray, pray that the day would come when Russians no longer killed each other in the forests."
 zlatoust_sales.6.a: "Unreliable bastards..."
 zlatoust_sales.7.t: "Zlatoust Equipment Arrives"
 zlatoust_sales.7.desc: "People shouted in the distance, retreating into the woods and brush Colonel Utkin had personally chosen. This morning, some stars glittered in the glare of the rising sun and the gently falling snow, but their beautiful light could not penetrate the gray, blood-drenched forest, where Russian blood misted over the trees. Deep in the Russian wilderness, Colonel Utkin found himself alive. His men were alive. Those who would have plundered his good home and village were either fleeing or dead in the snow. Everyone was silent - their first victory in months, their first chance to resist the Russian invaders who had long ravaged their land. The men dropped their guns, embraced each other, and cheered to heaven at defeating the killers who had tormented them. But Colonel Utkin spent a minute examining the bodies. These boys were at least sixteen. Before the Soviet rise, that age would have been the prime time for military academy. But their cold, lifeless eyes reminded him of the days when Russia was still at peace.\n\nWhen the guards returned to the village, they were greeted with cheers and shouts - their first victory over those who had been destroying the land. But while others were reuniting with family or celebrating in the tavern, Colonel Utkin returned to his office to prepare to congratulate the man who had truly brought them victory. Colonel Utkin turned the telephone dial and waited.\n\n“City Administrator Dragunov? This is Colonel Utkin. I wish to report that the lives your recent transactions with our government saved...”"
 zlatoust_sales.7.a: "Excellent."
 zlatoust_sales.8.t: "Hidden Event"
 zlatoust_sales.8.desc: "If you see this, remember to tell someone."
 zlatoust_sales.8.a: "I will."

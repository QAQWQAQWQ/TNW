 GAY_Mikhail_Antipin: "Mikhail Antipin"
 POLITICS_MIKHAIL_ANTIPIN_DESC: "Mikhail Ivanovich Antipin was once nothing more than a humble farmer in Chelyabinsk, more concerned with the daily struggle for survival than with education or philosophical questions. Driven by duty — and conscription — he left that life behind, joining an infantry unit as a machine gunner and deploying to the Ukrainian front. He was a decorated soldier, even earning the title Hero of the Soviet Union, but he never got to enjoy the glory he had earned. Soon after, the government collapsed. His unit descended into internal conflict, and he escaped alone with nothing but the clothes on his back.`n`nAfter wandering the wilderness for over a month, Antipin arrived in the town of Gayny, where a local priest took him in and cared for him until he recovered. During this time, Antipin experienced a kind of religious revelation. He realized that all of Russia's terrible traged — the Tsar's incompetence, the German invasion, the October Revolution, Soviet tyranny, famine, yet another German invasion — were no accident. They were punishment. The people of Russia had turned away from the Lord, and so He visited the wages of their sins upon them.`n`nThis divine revelation gave new meaning to Antipin's life. He gathered the people of Gayny and the nearby villages, raised the banner of the Order of Saint George, and promised that the atheistic dragon would be pierced by the spear of truth. The Order, though small, has brought stability and spiritual inspiration to the people of the region, and it must be said they have effectively resisted the incursions of madmen and heretics. Grand Master Antipin will only kneel before God, and refuses to let the Order bow to any earthly ruler — yet once he finds a leader pious enough, he will gladly pledge his own loyalty and that of his men to the cause of God."
 GAY_ONG_Yakov_Panteleev: "Yakov Panteleev"
 POLITICS_YAKOV_PENTELEEV_DESC: "Yakov Elizarovich Panteleyev is a veteran of more wars than most. Born in a village of Udmurtia, he was a farmer until he was drafted into the Red Army mere days after the start of the Great Patriotic War. He bravely defended cities far from his homeland in the Idel-Ural, which earned him many medals and promotions, and fought until the Germans reached the banks of the Volga, and all hope was lost. Still a patriot at heart, Panteleyev volunteered to join a unit of ethnic Udmurts in the West Russian War, but once again, Russia faced defeat at the hands of the Wehrmacht, and from there the officer faded into obscurity.`n`nThat was, until the Anti-Communist Guard reigned supreme over northwestern Russia and authority in the Volga region collapsed. As a respected army commander, Yakov was unanimously elected by a hurriedly formed local council as the new President of the Udmurt Republic, in association with the Northern Russian Republic as a loyal ally.`n`nFor the first time, Panteleyev's people have a nation for themselves, and he would like to keep it that way."

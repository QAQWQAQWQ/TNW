 BM_HISTORY_TITLE: "Brief History"
 THENEWORDER_NAME: "A Beautiful Future"
 THENEWORDER_DESC: "More than fifty years after the “New Order” remade the world, two more wars have failed to overturn the chessboard of Berlin, Washington, and Tokyo. Europe’s master gazes over half the globe, his thousand-year empire nearing fulfillment; the Stars and Stripes stretch across two oceans, recalculating the balance of power; the rising sun scorches an ancient land, while shadowed whisperers claim no glory. Every standpoint and value promises a beautiful future—but only the long road ahead can tell."

 UAR_disunited_armies_desc: "Though the soldiers are willing to fight, they are currently more of a disorganized mob than a trained professional army. As a fledgling nation, our military has much to develop, and it will take time to build a unified and effective armed force."
 UAR_chaotic_politics: "Chaotic Politics"
 UAR_chaotic_politics_desc: "The grand vision of building a nation for all Arabs is truly commendable, but we must not overlook the many political upheavals. Though in the early stages, efforts to integrate and coordinate the various political entities within the country will face many challenges, in the long run these efforts will bear fruit."

 BUR_Ne_Win_hog_desc: "§YPrime Minister\nMilitary Junta§!\n--------------\n§LThe most apt description of Ne Win is a smiling tiger lurking in the grass. His birth date is unknown, known only to the Thirty Comrades. Little is known of his pre-revolution life except that he was a Hakka Chinese from Prome district who studied medicine. Though expelled from university in 1931, he brought the precision and surgical skills he honed in his studies to his military career. That same year he joined the Dobama Asi Ayone, becoming part of U Ba Sein and Thakin Tun Oke's faction.\n\nIn 1942, the Japanese crossed the Burmese-Thai border and struck into the heart of Burma. Ne Win was soon dispatched behind British lines to build a guerrilla network, displaying remarkable military skill and achieving great success. This experience was invaluable to Ne Win; he knew guerrilla warfare inside and out. After Burma's independence, when the rebels of Ba Maw and Smith Dun clashed, Ne Win once again proved his tactical prowess. But Ne Win's political ambitions began to grow; he wanted an independent Burma. So, on that fateful day in 1952, he and Bo Hmu Aung marched on Ba Maw's presidential palace.\n\nNe Win was soon promoted to Aung San's deputy, and he earned infamy for transforming the Burma Army into an efficient but brutal force. Inspired by Japanese security operations in northern China, the Burma Army believed four sorties at most would wipe out the guerrillas. That was not the case; the guerrillas grew more resolute while the Burma Army found itself stretched thinner. Some believe civilian obstruction has kept the rebels alive; others see Ne Win as a tiger lurking in the grass, patiently waiting. When the moment is right, he will round up all who stand in Burma's path to greatness.§!"
 BUR_Thakin_Nu_for_desc: "§YForeign Minister\nLeft Nationalism§!\n--------------\n§LIn 1907, U Nu was born into a prominent family. In the years that followed, he became a lawyer and entered the Rangoon legal world in 1929. At university, he met Aung San, and the two young revolutionaries forged an unbreakable friendship. Whether facing the university president, local police, or even the British, Aung San and U Nu stood together — until the Japanese arrived.\n\nThough U Nu was reluctant to raise a sword against anyone, he held fast to his Marxist ideals; even when the Japanese threatened the government in 1954 to pass a constitutional amendment banning communist propaganda, he did not waver. Yet while his relationship with Aung San saved him, his comrades were not so lucky, not even his distant cousins in the Communist Party. Now, U Nu still dreams of a democratic, just, socialist Burma — but it remains just a dream. Unless the Burmese government can use thunderous action to rewrite the nation's fate.§!"
 BUR_Thakin_Mya_eco_desc: "§YFinance Minister\nSocial Nationalism§!\n--------------\n§LAung San's network of revolutionary comrades was built on youthful passion and brotherhood; though Thakin Mya was not the youngest, no one embodied these values more. Born in Prome district in 1897, Thakin Mya studied various sciences but soon decided to join the nascent nationalist movement. Though he did not join the Dobama Asi Ayone, he earned Aung San's trust and became his senior advisor. Despite lacking formal training, he did his best in the negotiations with Japan. The Aung San Agreement was signed in 1945, and Burma gained full independence after the Pacific War, allowing economic development to begin. Burma's future seemed bright, but the story was far from over.\n\nSeventeen years have passed since independence, yet Japan's shadow still hangs over the country. Young Burma is rife with turmoil, and the government does not fully control all the territory it claims. Thakin Mya has fought for years, but the greatest challenge of his 65 years and 30 years of independence struggle is the reality of independent Burma.§!"
 BUR_Bo_Hmu_Aung_sec_desc: "§YDefense Minister\nMilitary Junta§!\n--------------\n§LBo Hmu Aung, born Shaan Lan, came from a peasant family. His life began with religious interest; an avid reader, he spent his youth studying and reciting Buddhist texts, but before passing the senior monk examination he returned to the countryside to farm. The revolution of 1300 BE brought violent upheaval and led him to his final path: the revolutionary's road.\n\nBo Hmu Aung was one of the Thirty Comrades who answered Aung San's call to study the art of war abroad. When Burma won independence in 1943, he returned home. Nine years later, he and Ne Win marched on the Rangoon presidential palace, forcing a referendum that installed Aung San as interim president. Now he is the government's chief of staff, commanding the Burma Army in its brutal and efficient counterinsurgency campaign.§!"
 POLITICS_AUNG_SAN_DESC: "Revolutionary, socialist, traitor, collaborator, founding father.`n`nAll of these words can be used to describe Burma's founding father Aung San, depending on whom you ask. Aung San, born Htein Lin, came from a middle-class family in 1915. He was meant to be one of Burma's many lawyers, but he instead joined the tide of Burmese revolutionary nationalism. From then on, his life changed dramatically, and he soon rose to prominence in the Dobama Asi Ayone. He was arrested in 1939, and afterward a Japanese officer named Suzuki Keiji made contact with him in Rangoon. This relationship lasted at least a decade, once again changing Aung San's trajectory.`n`nIn 1943, with India fallen, Burma finally gained independence. The revolutionary nationalists in the Burma Army, led by Aung San, shared power with Ba Maw's Poor Man's Party — but this would not last long. Ba Maw lacked allies, and the Japanese recognized this fatal weakness. On that fateful day in 1952, Bo Hmu Aung and Ne Win marched on the Rangoon presidential palace, forcing the Burmese legislature to hold a referendum that appointed Aung San as interim president.`n`nAung San had finally achieved his dream, but not the glory he deserved. Rural rebels ravaged the country, the nation teetered on the brink; religious leaders and landowners joined forces against Aung San's secularism; Japan's shadow still hung over Burma. Aung San had no other recourse but to turn to his close ally and inspiration, Netaji Subhas Chandra Bose — but Bose was fully committed to the complete liberation of India and could offer no help.`n`nTo achieve great ambitions and become a great man, one must make great sacrifices — but the question is, just how great?"
 BUR_idea_suspension_of_the_1953_constitution: "Suspension of the 1953 Constitution"
 BUR_idea_suspension_of_the_1953_constitution_desc: "§YThe 1953 Constitution§! marked a new beginning for Burma, a pluralistic document that showed full respect for freedom of belief, language, and regional autonomy. But in the years since its promulgation, the values written therein remain a dead letter. §eThe Burma Army§!, in the name of national security, has seized power from the regional councils, and representative democracy cannot take root. Rangoon's leaders have always deflected the people's calls, claiming the constitution will be restored once security is assured. The question is: when will that be?"
 BUR_idea_suspension_of_the_1953_constitution_tt: "--------------\n§LIf the suspension of the §Yconstitution§! lasts longer than necessary, it will spark §Rpopular backlash§! against §wAung San§!.§!"
 BUR_idea_an_union_in_perpetual_conflict: "A Union in Perpetual Conflict"
 BUR_idea_an_union_in_perpetual_conflict_desc: "Ever since the §LThai§! and §WChinese§! poured from the northeast into the valleys of §JShan State§!, our country has been a battleground; ever since the §Vcommunists§! and §iKaren traitors§! took up arms, our land has suffered the scourge of war. Soldiers huddle in trenches a thousand miles from Mandalay, writing of homesickness, but the road home is still long. Day after day, traitors gather like ants, and one day they will converge into a storm to assail the long night hanging over the motherland."
 BUR_idea_an_union_in_perpetual_conflict_tt: "--------------\n§LIf the §Rrebels§! in the northeast are not properly dealt with soon, more and more will witness the §Rfailure§! of the §QUnion§! and refuse to recognize its authority.§!"
 BUR_idea_the_fading_star_of_the_father: "The Father's Fading Star"
 BUR_idea_the_fading_star_of_the_father_desc: "§wGeneral Aung San§! is our legend, a tested and true fighter who gave his all to defend the §QUnion§! and its people. Yet some believe he has fallen under the shadow of corruption, dereliction, and the threat of traitors who scheme day and night to destroy what he built. If the conspiracy is uncovered, we will use the harshest measures to sweep clean these rats who dare challenge the legitimacy of his rule."
 BUR_idea_the_fading_star_of_the_father_tt: "--------------\n§LIf §wAung San's§! legitimacy falls too low, §ethe Burma Army§! will take §Rharsh measures§! to defend the §wGeneral§! and the nation.§!"
 BUR_idea_a_government_of_six_miles: "A Government of Six Miles"
 BUR_idea_a_government_of_six_miles_desc: "Though §wAung San's§! government was born of revolution, its control extends only about §Rsix miles around Rangoon§!. Religious leaders, landowners, and other enemies of foreign regimes have joined forces, and the nation's rule is in name only thanks to their obstruction. But §wAung San§! will not sit idly by. Within the halls of the presidential palace, the Dobama Asi Ayone has drawn up a radical reconstruction plan. §wAung San§! believes this is the answer to Burma's many problems — though others may not think so."

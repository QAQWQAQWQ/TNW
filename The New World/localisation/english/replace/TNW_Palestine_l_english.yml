 POLITICS_Yasser_Arafat_DESC:0 "Yasser Arafat — in just a few short decades, this man rose from obscurity to prominence, becoming the symbol of the nascent Palestine. Raised in a poor Palestinian family in Egypt, he quickly grew into a leading figure in Italian Levantine and indeed all Arab politics. As the Palestinian independence movement emerged, he co-founded Fatah, a product of the delicate compromise between Palestinian democratic youth and the wary Italian colonial authorities, which became the standard-bearer of the freedom struggle.

Fatah's growth unexpectedly gained support from Emir Hussein of Transjordan. Meanwhile, Arafat established himself as the movement's leader and became Italy's primary interlocutor in the Arab camp — both as one of the few prominent figures willing to negotiate with the Italians and as a counterweight to the radical groups that plagued the colonizers. After victory in the war against Turkey, the Italian Levantine colonial system collapsed, and the Republic of Palestine finally gained independence. Arafat was chosen as the nation's leader.

Though his reputation grew, threats followed. Left-wing and right-wing Arab radicals denounced Fatah for betraying Arab nationalism and allowing the State of Israel to exist. Supporters of the former Emir Hussein abhorred his sweeping reform policies. Arafat won the battle, but the war is far from over — now, the hope for peace in the Levant rests on one man's shoulders."

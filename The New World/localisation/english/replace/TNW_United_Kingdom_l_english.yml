 ENG_Galloping_Across_the_Eternal_Land:0 "Galloping Across the Eternal Land"
 ENG_The_English_Patient:0 "The English Patient"
 ENG_The_Land_of_Nowhere:0 "The Land of Nowhere"

 ENG_Galloping_Across_the_Eternal_Land_desc:0 "Britain fancies itself the land on which the sun never sets, the guardian of the old world, forever shrouded in the splendor bequeathed by the old order. Countless Britons have toiled and died to sustain that great imperial dream. Whether or not this belief is justified, it has always guided the British people forward, becoming the bedrock of the nation.\n\nYet as the Greater German triumph marched ever closer, the former empire plunged abruptly into a long night. The darkness has not fully receded with time; after dawn, the British still cannot see the road ahead. The shadows of Nazism and fascism spread again, the ashes of republican thought quietly rekindle, and the whole nation, swept up in a feverish tide of nationalism, stumbles into the new millennium.\n\nNo one asks whether they are weary - it does not matter. For the British people and George VII, this is still an ordinary year. People go to work and come home as before; the King still drives through his estates. It is just that the figure in the car is carrying Britain toward an uncertain fate."

 ENG_The_Land_of_Nowhere_desc:0 "After the war, as Germany deliberately dismantled the old political forces, Britain fell into inevitable factional strife. Countless small parties were born amid the wreckage of politics, only to quietly perish in the rubble. Labour too gradually faded amid this tide; throughout the fifties, sixties, and seventies, Britain's political landscape was repeatedly torn apart and reassembled by the right.\n\nYet with the success of Swedish social democracy - the 'Swedish tendency' as it was then called - the current of fund-socialism seeped into Britain like an undercurrent, slowly steering Labour. The British people, swept up in populist tides, seemed to glimpse a Land of Nowhere through the fog; they began to yearn for a path, even one whose direction they could not discern, between the grim reality of death and illusory dreams.\n\nPerhaps the British have never had a real choice. What right-wing governments and the Conservatives have always given them is two Britains: the Britain of Downing Street, and the Britain of the streets and alleys. If there is any link between the two, it is that both live in London and both need to carry an umbrella."

 ENG_The_English_Patient_desc:0 "The new generation growing up in postwar Britain can hardly imagine whether the vast empire that once spanned the world ever truly existed. They can only piece it together from the flickering memories of their fathers, catch it in the fiery rhetoric of politicians, imagine it in the narratives repeated at countless rallies and speeches. Sweet remembrance and the bitter reality collide constantly; the fractured narrative tears at their understanding of the nation, and they cannot help but wonder whether this land beneath their feet was ever as great and glorious as everyone says.\n\nQuestions without answers are set aside for a time, then quietly handed to the next generation. And the new generation will still live among similar slogans and rallies, continuing to bear the same bewilderment."


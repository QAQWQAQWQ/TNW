 ENG_George_VII:0 "George VII"
 POLITICS_GEORGE_VII_DESC:0 "§HBy the Grace of God, of Great Britain and the British Overseas Dominions King, Defender of the Faith, Emperor of India§!\n§W--------------§!\nJames George Alexander Bannerman Carnegie, only son of Princess Maud, is known to the people as George VII. Coming of age in the troubled interwar period, His Majesty grew up alongside his father, educated at Ludgrove preparatory school, Gordonstoun in Scotland, and the Royal Agricultural College at Cirencester.\n\nHis Majesty loves sport and is obsessed with sports cars. In those quiet years, his life seemed no more than the ordinary hobbies of a royal. Yet, upon the death of Edward VIII, the throne unexpectedly fell upon his shoulders.\n\nBy the Grace of God, Britain in the new millennium remains dignified. The years have left their mark on the King's face, yet have not taken away his love of speed. He still drives between his estates, the scenery passing by his window - the English countryside, the low clouds of Scotland. The car drives ever onward, just as Britain itself, slowly drifting from its former outline in the silent passage of time."
 ENG_Kenneth_Clarke:0 "Kenneth Clarke"
 POLITICS_KENNETH_CLARKE_DESC:0 "Kenneth Harry Clarke was born in Nottingham and in his early years harbored some sympathy for Oswald Mosley. Mild-mannered, he stood out little amid increasingly fierce intraparty struggles, yet from the 1970s onward he held successive senior posts - Chancellor of the Exchequer, Home Secretary, Lord Chancellor - gradually becoming a venerable giant within the Conservative Party. The wall built by years and authority is enough to silently turn away most challengers.\n\nClarke's love of cigars, jazz, and motor racing is well known; even when meeting His Majesty the King, they often chat about these for a while. He is also a devoted sports fan, a loyal supporter of Notts County FC, and passionate about the roar of F1. On many afternoons, his office hours were accompanied by cigars.\n\nThe roar of applause fills his ears, and his thoughts return to the present. As dusk deepens, Prime Minister Kenneth Harry Clarke enjoys his leisure, and Britain, as the cigar silently burns out and the sun slowly sets, quietly welcomes another tomorrow."


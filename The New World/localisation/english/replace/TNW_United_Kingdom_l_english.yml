 ENG_Charter_of_the_BPP_law_desc:0 "The §JBritish People's Party§! was founded after Operation Sea Lion. In that campaign, German forces crossed the English Channel and landed on Britain's southern coast; the war cabinet fled in disarray, and the old order collapsed within weeks. The Germans swiftly installed a §ocollaborationist government§! centered on pro-German politicians such as §SBarry Domvile§!, and the §JBritish People's Party§! arose as the sole legal party in Britain. Its founding charter declared, in an almost paternal tone, that the nation should be transformed into a §<benevolent organism§!, with the §JPeople's Party§! as the sole guardian of the British people's welfare and right to life, its mission to protect the populace from usury, speculation, and all such threats. The wording reads warm and kind, like a physician promising a patient peace. Yet in practice, the identity of 'sole guardian' grants the government unrestrained dictatorial power - the power to define what constitutes a 'threat,' to punish all deemed threats, and even to §Vexecute political opponents without trial§!. From §L1943§! to §L1972§!, this charter provided legal cover for every atrocity of the §ocollaborationist government§!. In §L1972§!, §EEdward VIII§! died, a referendum abolished the monarchy, and the §XBritish National Republic§! was proclaimed. The charter then underwent its only comprehensive revision to date. Three key revisions:\n\nFirst, the phrase 'sole legal party' was deleted and replaced with 'the §Xpolitical leadership of the British nation§!.' The wording changed, the substance did not - the People's Party still controls every lever of power, and whether the other four legal parties exist, and how broadly they may operate, is decided by the party's own §UConstitutional and Public Order Committee§!.\n\nSecond, the original phrases '§<benevolent organism§!' and '§.sole guardian§!' were retained verbatim in the charter's preamble, unchanged to a single character. Some within the party proposed replacing these with more modern wording. The proposal was rejected. These phrases have become part of the Republic's founding charter; retaining them provides permanent justification for all actions beyond the law. A 'guardian' may do anything - so long as he claims it is for the §einterest§! of the §*ward§!.\n\nThird, the wording of revised Article 7 deserves particular attention. It states: 'The Party has a duty to take all necessary measures on behalf of the nation against those who damage the unity of the §XBritish nation§!, the people's welfare, and the right to life.' This article descends directly from the core clause of the §ffounding charter§! that granted dictatorial power, but its wording has been repackaged - 'punish' and 'eliminate' are no longer used, subsumed under 'all necessary measures.' What is 'necessary'? The charter does not define it. No one asks it to. In the Republic's legal system, these six words are the ultimate basis for every act of repression - from administrative detention to secret executions, from seizing newspapers to purging dissidents, all trace back to this."

 ENG_Constitution_of_the_British_National_Republic_law_desc:0 "The §XBasic Charter of the British National Republic§! was adopted by the §PConstituent Assembly§! in §LJune 1972§!. The old §EWindsor dynasty§! was abolished and the §Xrepublican system§! established; the constitution was confirmed by referendum. The charter's preamble traces the Republic's roots in a solemn historical narrative. It calls §LCromwell's Republic of 1649§! the 'First Republic,' the establishment of the §ocollaborationist government§! after Sea Lion in §L1943§! the '§ebeginning of the British national§! revival,' and the §L1972§! referendum the '§&final completion of national self-determination§!.'\n\nThe charter has nine chapters. Chapter One defines the state: 'The §XBritish National Republic§! is a §funitary republic§!, §hunited§! and indivisible§V, founded upon the §XBritish nation as a whole§!.' Chapter Two lists fundamental principles. Chapter Three establishes the §Upresidential system§!. Chapter Four regulates the §,National Assembly§!. Chapter Five sets the §ajudiciary§!. Chapter Six enumerates §$civil rights§! - each followed by a proviso. Chapter Seven preserves the §Zworkers'§! organic status. Chapter Eight establishes the constitutional rank of the §XAnglo-§rGerman§! §oAlliance Treaty§! - this chapter passed during the constitutional debates without any discussion at all; participants recall that §rGermania§! had conveyed its 'recommendations' beforehand. Chapter Nine sets the §mamendment procedure§! - a threshold so high it has never been invoked. The charter underwent technical corrections in §L1984§! and §L1996§!, but its §wcore clauses§! remain untouched. It is recited in schools, invoked in courts, and wielded by all factions in political strife."

 ENG_Constitutional_and_Public_Order_Act_law_desc:0 "The Public Order Act was promulgated in §L1973§!, a special code for the state to control the §Apolitical§! and §usocial§! situation and avoid descent into chaos. For §fthirty years§! after §L1943§!, only the §JPeople's Party§! was legal in Britain. After the Republic's founding in §L1972§!, the then-§ipragmatist§! President §lRAB Butler§! deemed it necessary to create the §Oappearance of limited pluralism§! - not out of enlightenment, but out of practicality: a system that looks as if there is choice is easier to maintain than one that plainly offers none. The Act's subtlety lies not in what it forbids but in keeping the boundary between 'legal' and 'illegal' permanently blurred. The §UCommittee§! holds final interpretive authority. Any party may be ruled in violation at any time for any reason. Yet to date no party has actually been banned - though the deterrent value of the code always outweighs its enforcement."

 ENG_Industrial_Cooperation_Act_law_desc:0 "The §&Industrial Cooperation Act§!, first promulgated in §L1949§! and revised in §L1975§!, is the legal cornerstone of the §ecorporatist economy§!. After Sea Lion, British industry was devastated - factory districts were heavily bombed during the Battle of Britain, and in the early occupation the §rGermans§! systematically dismantled some military equipment and shipped it to the continent. The §ocollaborationist government's§! first task was to rebuild the economy from the ruins while ensuring the fruits of reconstruction did not breed resistance. This Act reclassified strikes from a §Jlabor issue§! into a §Usecurity issue§!. The reclassification proved remarkably effective: there have been zero large-scale strikes in the Republic's history. The People's Party charter promised to protect the people from 'speculation' - the Industrial Cooperation Act institutionalized this promise, and all economic activity was immediately organized into twenty-three industrial chambers.\nNominal representation is equal among the §<employers' side§!, the §Vworkers' side§!, and the §Xstate side§!. In reality, the §Xstate side§! is appointed by the §JPeople's Party§!, the §<employers' side§! requires §Xstate§! approval, and the §Vworkers' side§! is nominated by the §ZLabour Party§!. The outcome of tripartite deliberations therefore always aligns with the state plan."

 ENG_Republic_Land_Act_law_desc:0 "The postwar §ocollaborationist government§! faced a delicate choice. Britain's §htraditional landed gentry§! mostly supported the old order, but their fear of §xBolshevism§! far exceeded their aversion to the §rGermans§!. The §ocollaborationist government§! needed only name the right price to buy their silence. The §oLand Act§! was that price. Private land was preserved, but with two conditions: owners must join the §bLand Commission§! and accept its guidance; estates over five hundred acres must cede thirty percent to the National Land Fund upon the owner's death. This Act bought and tamed the §nold rural families§! - they kept their land but lost their freedom. The foundation of the §aNational Conservative Party§! rests upon this compromise."
 
 
 ENG_Anglo_German_Alliance_Treaty_law_desc:0 "This law traces its origin to the §AAnglo-German Cooperation Memorandum§! signed by the §rGermans§! and the §ocollaborationist government§! in §LAugust 1943§! after the fall of all of Britain§! - then no more than a few thin pages, handed over by one side in the posture of a conqueror and accepted by the other in the humiliation of defeat. It was subsequently expanded in §L1944§!, §L1972§!, and §L1974§!, growing from a memorandum into a massive statute of six books and 137 articles, and was written into Chapter Eight of the §XRepublic's Basic Charter§! to attain constitutional rank.\n\nThe gist of the six books:\nBook One establishes the 'special alliance.'\nBook Two sets §wsecurity cooperation§! - German garrisons, their size determined by the '§IJoint Security Committee§!' composed of three Germans and two Britons, with extraterritoriality for the garrison.\nBook Three sets §ieconomic coordination§! - Britain must 'coordinate' with §rGermania§!, i.e., must have §rGermania's§! acquiescence.\nBook Four sets §&intelligence sharing§! - the §QState Security Directorate§! reports regularly to §rGermany§!. Book Five sets §Pcultural cooperation§! - German is the first foreign language.\nBook Six sets §fdispute arbitration§! - an arbitration panel composed of one German and three Britons."

 ENG_National_Corporatist_Labour_Code_law_desc:0 "The §ZNational Corporatist Labour Code§! abolishes all independent trade unions, bringing all labor under the 'National Labor Front.' Wages are set not by the market but by the fiat of the corporatist council; the right to move also requires official permission. This Code is the shop-floor extension of the §&Industrial Cooperation Act§!. The Cooperation Act regulates the relationship between industry and the state; the Discipline Code regulates the relationship between worker and factory - a §jnon-negotiable relation of obedience§! frozen into law.\nIt is stipulated that §Pabsenteeism of more than three days without cause§! draws a warning and wage deduction from the industrial council;\n§Econtinuous absenteeism of more than seven days§! is referred to the §wmagistrates' court§!;\n§Iabsenteeism causing production losses§! must be compensated through extended hours.\nWithout the approval of the §hIndustrial Council§!, workers may not §Achange posts on their own§! - a job change requires a signed '§Vlabor mobility permit§!' jointly issued by the current §<employer§!, the §hCouncil§!, and the §Xlocal labor bureau§!. The Code's final article - the least cited yet most consequential - establishes the '§JProduction Hero§!' system. Each quarter, each industrial chamber selects the worker with the highest output and awards the '§uRepublic Labor Medal§!.' Their names and portraits are posted on factory notice boards and in the newspaper §eThe Worker's Voice§!. They are not stars, but yardsticks - a gentle reminder of where the standard of 'enough' lies."

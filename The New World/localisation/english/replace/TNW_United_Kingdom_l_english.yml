 ENG_Lee_Anderson_hog_desc:0 "§YHome Secretary\nRight-Wing Populism§!\n--------------\nLee Anderson was born in Nottingham and in his early years was a member of the National Union of Mineworkers led by Arthur Scargill; in his youth he also publicly supported Michael Foot. He claims his early political beliefs were deeply influenced by Scargill, Dennis Skinner, and Tony Benn.\n\nHe belonged to the Labour Party for a long time, but as Labour lurched further left toward the 'Swedish tendency,' he left and joined the Conservatives. In this process, his populist leanings became unmistakable - skilled at manipulating social issues and seizing on the pain points the public cares about. Meanwhile, his pronounced antisemitism deeply disgusts Malcolm Rifkind. Yet none of this seems to bother Anderson; for him, seizing every opportunity to climb is the only truth, and means and methods can take second place.\n\nSuch a style makes him not well liked in the party. But perhaps, as he once bluntly told the media: 'I'll put them on a Royal Navy frigate, or some other ship, and sail them off to stand off Calais. That way, they won't come back.'"

 ENG_John_Major_for_desc:0 "§YForeign Secretary\nCentrist Progressivism§!\n--------------\nJohn Major was born on March 29, 1943, in St Helier, Surrey, where his life began. The following year, German V-1 flying bombs struck the area, killing many; the shadow of war was etched into the backdrop of his childhood. In the years that followed, the Major family moved to the village of Scole, Norfolk. In 1948, he entered Cheam Common School. His childhood was on the whole bright; he loved reading and was fascinated by sports, especially cricket and football, and once kept a beloved rabbit, spending a peaceful time between fields and books.\n\nIn 1959, Major joined the Young Conservatives in Brixton, soon becoming an active member. This experience helped him recover from the setbacks of his schooling and regain confidence. Encouraged by fellow Conservative Derek Stone, he took to the streets of Brixton Market, standing on a crate to give speeches; his political life quietly sprouted amid the cries and chatter.\n\nHe has always been an energetic member of the Conservative Party, especially active in discussions on European economic integration. He met Mitterrand and expressed satisfaction at the end of the Anglo-French economic rivalry, seeing it as a testament to friendship between the two nations. Though he holds the post of Foreign Secretary, he has not fully earned the Prime Minister's trust - the latter prefers the advice of close advisors over Major's independent judgment. This has gradually dimmed his luster at the core of power.\n\nToday, Major holds two clear wishes: first, to steer Britain back onto the path of European economic integration; second, to ensure the tragedy of 1946 never repeats."

 ENG_Catherine_Blaiklock_eco_desc:0 "§YChancellor of the Exchequer\nNational Conservatism§!\n--------------\nCatherine Blaiklock never follows the rules. As the daughter of polar explorer Ken Blaiklock, she inherited her father's daring spirit.\n\nIn 1981, she entered Christ Church, Oxford, on a scholarship, then worked widely in the corporate world, joining the Conservative Party in 1989. She is a typical conservative; though opinions on her within the party are mixed, she sticks to her guns, often drawing criticism from left-leaning media, though she never seems to care about the noise.\n\nIn 1999, on Farage's recommendation, she was appointed Chancellor. Blaiklock is uncompromising on colonial issues and takes a hard line on religious matters; it is precisely this unwavering stance that makes her stand out amid the moderates, swiftly winning the favor of national conservatives."

 ENG_Malcolm_Rifkind_sec_desc:0 "§YSecretary of State for Defence\nFree-Market Conservatism§!\n--------------\nMalcolm Rifkind was born in 1946 into a British Jewish family in Edinburgh, educated at George Watson's College and the University of Edinburgh, first studying law then pursuing a graduate degree in political science. Though Britain's laws on Jews have been revised three times, he has personally experienced the many invisible barriers faced by Jews in this society.\n\nDespite his Jewish background, Rifkind deeply identifies with the ideal of European integration and has repeatedly spoken publicly in favor of Britain deeper into the common European economic system. On colonial issues he is relatively lenient, supporting gradual autonomy for the colonies, and on economic policy leans toward the free market.\n\nThese stances make him unpopular among most Conservatives. Yet as a close friend and ally of John Major, he still holds unshakable political capital - he trusts Major, and Major trusts him. Correspondingly, he shows unusual toughness on foreign and defense matters.\n\nAs for the German government, the news that a Jew is to serve as British Defence Secretary is rather unsettling. Germany has discreetly expressed its regret to the British government; undercurrents between the two governments are quietly deepening in unease."
 


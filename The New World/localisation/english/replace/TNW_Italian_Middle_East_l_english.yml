 IME_italys_finest:0 "Italy's Finest"
 IME_italys_finest_desc:0 "Under the firm but fair leadership of Governor Carlo Alberto Dalla Chiesa, we field the finest army in Italy's sphere of influence. Long tasked with suppressing Zionist and Palestinian insurgencies, our forces have become highly adapted to the terrain and forms of combat in the Middle East."
 IME_haganah_fatah_negotiations: "Hard-Won Peace"
 IME_haganah_fatah_negotiations_desc:0 "With conventional colonial administration methods having nearly completely failed in the Levant, the Italian Levantine authorities have been forced to negotiate with the two major paramilitary political organizations - the Haganah and Fatah - to ensure stability in the region. The Haganah, recognized by Italy, is an armed militia dedicated to protecting Jewish settlements in Palestine. Fatah is a larger Arab paramilitary organization dedicated to making the Levant an independent Arab state. While both organizations can begrudgingly cooperate with the Italian colonial government to achieve their own goals, they are fiercely opposed to each other. The hard-won peace between Italians, Jews, and Arabs is always on the verge of collapse."
 IME_terrorism:0 "Extremist Opposition"
 IME_terrorism_desc:0 "Despite Italy's best efforts to resolve the Levant's turmoil peacefully, many regions still fiercely resist Italian rule. On the Jewish side, factions dissatisfied with the Haganah's moderate stance formed the Irgun. This Revisionist Zionist paramilitary demands a Jewish state encompassing the entire Levant and does not hesitate to attack Italians and Arabs alike. Among the Arabs, the Arab Nationalist Movement is a loose coalition of communist, left-wing nationalist, and other ideological groups. They demand an independent Levantine Arab state and attack both Italian imperialists and the Zionists they see as Italian puppets. These organizations are a thorn in the Italian authorities' side, and fear spreads among the civilian population as they attack Italian soldiers and civilians alike."
 IME_emirate_of_transjordan:0 "Emirate of Transjordan"
 IME_emirate_of_transjordan_desc:0 "While the Italian Levantine authorities work to maintain the hard-won peace in the western part of the governorate, the lands east of the Jordan River form the Emirate of Transjordan. An Italian client state, Transjordan has its own armed forces (though commanded by Italian officers), its own government (though heavily dependent on Italian support), and its own ruler, Emir Hussein bin Talal - a leader who is happy to cooperate with Italy as he profits handsomely from oil agreements with ENI. These oil agreements provide him with the funds needed to develop and modernize his country. Recently, Emir Hussein bin Talal has become a supporter of Fatah, particularly its more traditional and moderate factions, and his substantial wealth has become an important source of funding for the organization - drawing Italian attention."

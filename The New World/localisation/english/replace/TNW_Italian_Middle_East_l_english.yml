 POLITICS_GG_CHIESA_DESC:0 "Governor Carlo Alberto Dalla Chiesa's brilliant career has impressed many - and made him jealous of many more. A veteran of the Second World War, Dalla Chiesa requested a transfer from the Royal Army to the Carabiniers to follow in his father's footsteps, as his father had also been a Carabiniers general. After the war, he was posted to Italy's newly acquired Levantine territories, where he demonstrated his competence and courage investigating and suppressing the various terrorist and paramilitary groups active in the region. Capturing terrorist operatives one after another, he rose quickly through the Carabiniers ranks and came to the attention of Galeazzo Ciano.\n\nWhen appointing the new Governor of the Levant, the new Duce Ciano did not choose a veteran fascist but selected this young general. The choice was controversial, as Dalla Chiesa was known to have little sympathy for fascism. Yet in his short tenure, the Carabiniers general has succeeded in bringing a semblance of peace to the Levant - though it meant taking some unorthodox measures. Rome wanted results, and Dalla Chiesa delivered: extremist insurgent groups were suppressed, while a series of ceasefire agreements were signed with those militants willing to negotiate. Still, the road ahead in the Levant remains precarious.\n\nIn Dalla Chiesa's view, Italy's form of rule cannot last forever; some agreement must be reached with the Levantine people, or the region will surely descend into chaos once more. The Carabiniers general has worked to restore a surface peace to the Levant - but how long that peace will hold remains to be seen."
 POLITICS_Umberto_La_Rocca_DESC:0 "They say a man's fate is written in the stars, and Umberto La Rocca is proof of it. Born in Port Said, Egypt, to an Italian father and French mother, he grew up immersed in Arabic alongside his parents' languages, fluent in all three by his teenage years. During the Second World War, his language skills earned him a post in the Arab Legion, where he was tested in the North African and Levantine campaigns against the British. When the war ended, La Rocca embarked on a dazzling diplomatic career, representing the fledgling Italian Empire across Europe and America.\n\nNow the ambassador has returned to familiar ground with yet another mission. Following the Jerusalem Conference's partition of the governorate, a fragile new order has taken hold in the war-torn Levant - and Jerusalem sits at its center. The Holy City, designated an independent entity, is a neutral zone guarded by Italian troops and administered by a council of religious representatives from all communities - with La Rocca at its head. Known for his impartiality, he now holds the scales, tasked with extinguishing the sparks of conflict in the streets while ensuring the safety of those who walk home at night.\n\nLa Rocca knows well that what he holds is not just the fate of the Holy City as an oasis of peace among peoples, but the future of the entire Levant. Though Palestine and Israel have grudgingly accepted the independent entity arrangement, the Middle East - never short of turmoil - could erupt into new crisis at any moment. Will the Holy City become the cornerstone of lasting peace, or the eye of a new storm? Time will give its answer, merciful or cruel."
 POLITICS_Ahmed_Jibril_DESC:0 "Ahmed Jibril has never been one for compromise. To him, everything in the Levant is simple and clear. Palestine has been the sacred land of the Arab people since time immemorial. Then the Western imperialists and their Zionist dogs occupied the country, stealing land for their base ambitions and vile greed, driving out the inhabitants and killing the people. The Palestinians want to resist, but alas, their leaders are unsuited for this great cause: the likes of Arafat, ready to sell out the country for empty promises of peace; Hussein's puppets, happy to stuff their pockets with lire while caring nothing for their homeland; and Habash's simpletons, all talk and no action.\n\nSo Jibril and a small band of Palestinian fighters founded the Palestine Liberation Front - General Command. Its goal: to liberate Palestine from the oppressors and the Jews. Its method: whatever means necessary. The PLF-GC rose quickly from obscurity to become the most influential Arab militia, as many turned to the only organization willing to fight for them. Wherever the PLF-GC goes, terror, bloodshed, and death follow - and for the sacred cause of Palestinian liberation, any price is but a footnote in history.\n\nNow the Italians are gone, and Jibril and his men step onto the stage. Yet the work is far from done. The Zionist vipers lurk in the shadows, ready to strike again. From all sides, threats converge on the newly liberated Palestine. Jibril and the PLF-GC will take whatever measures are necessary to ensure no one can ever enslave Palestine and the Arabs again. And the Jews - those endless vipers who stole what belongs to the Palestinians - will pay the price they deserve."
 POLITICS_JORDAN_ABDULLAH_I_DESC:0 "The life of Abdullah bin Hussein is a story of controversy. Some see him as a freedom fighter who did his best to defend his people against colonialists. Others see him as a loyal dog of imperialism, accusing him of betraying his people and selling out his father's legacy. Yet Abdullah has long been the very symbol of Hashemite rule over Jordan for over thirty years. The truth, moreover, is far more complex than the praise or condemnation he receives.\n\nBorn in 1882, the son of the future Sharif of Mecca, Abdullah witnessed his father lead the Arab Revolt against the imperialist crimes of the Ottoman Caliphate, rekindling the flame of Arab nationalism that had dimmed. The Arab people rose up, and the dream of a unified Arab nation appeared on the horizon - so close, yet so far. The Arabs were divided into several monarchies, each ruled by one of the Sharif's sons. The warrior Abdullah was awarded the throne of Iraq, but he refused the title and instead chose to become Emir of the newly created Emirate of Transjordan. Abdullah worked tirelessly for his country and people until the guns of the Second World War sounded.\n\nAs the Axis advanced into the Middle East and occupied the former British colonies, Abdullah chose to swear allegiance to the Italians, hoping to continue his rule under the Italian eagle. Despite his prior cooperation with the British and his efforts to balance Italian and domestic interests, the Italians did not fully trust him. But they acknowledged his efficiency and administrative competence, especially compared to the neighboring Governorate of Palestine.\n\nYet all was not well for the Emir. The Palestinian jihadist movement led by al-Husseini saw an opportunity for assassination - and if they succeeded, the resulting upheaval would be enough to tear the Hashemite dynasty in two. As the King of the Arabs unwittingly approached his death day by day, relations between liberals and collaborators continued to deteriorate."
 POLITICS_JORDAN_NAYEF_DESC:0 "Is it worth sacrificing ideals and the virtues and principles once cherished, just to keep a dynasty alive? Romantic intellectuals who dream of nationalism and democracy might say no. But Nayef bin Abdullah of Jordan sees the question from another angle.\n\nBorn in 1914, as the Great War erupted and his grandfather organized the revolt against the Turks, Nayef was too young to experience that era when nationalist flames burned bright. Instead, as he grew, he saw only endless tragedy. First the Hashemite heartland of the Hejaz fell. Then the Hashemite king of Syria was deposed for excessive nationalist leanings and later killed. Worst of all were the Hashemite rulers of Iraq, slaughtered like animals in an abattoir. Nayef could not help but wonder: would he and his father be next? Every day, the Crown Prince shook his head in confusion and fear.\n\nBut his low spirits did not last long. The outbreak of the jihad led by al-Husseini became a turning point in his life. His father became the target of an al-Husseini assassination, but by the grace of God he narrowly escaped the bullets. Yet the consequences were a heavy blow to the prince and the entire Hashemite family. For Nayef, everything was clear. Only by suppressing these so-called independence movements and cooperating further with the Italians could he and his family keep their heads.\n\nThough he had always been his father's favorite, Nayef still faced opposition from his brother and the court liberals. Nevertheless, Nayef will stop at nothing to prevent the last bastion of Hashemite rule from collapsing."
 POLITICS_JORDAN_HUSSEIN_DESC:0 "Hussein bin Talal, born in 1935, was beloved from the moment he drew breath. Even his grandfather, who did not trust his own two sons to be capable kings, placed his bets on Hussein and showered him with special care and favor. The young, charismatic prince made the crowds cheer, while his father was distrusted for his supposed madness and his uncle was mocked as a traitor and sycophant.\n\nHussein has lived his whole life in a Jordan occupied by foreigners - first the British, then the Italians, exploiting and colonizing it. Like his namesake in history, Hussein despised this state of affairs. He saw the suffering of his people, both Jordanians and Palestinians, crushed under the heavy yoke of the Italian Empire. The people dreamed of freedom and independence, but their dreams were betrayed and stolen.\n\nOutraged by the exploitation of his people and hoping they might one day be free, Hussein made his name through his 'free experiment' ideas and anti-Italian rhetoric, effectively becoming the voice of Jordan's reformists and his father's representative among the royal liberals. Moreover, he hoped to make the people happier and improve their quality of life, which made him popular among the working classes.\n\nThis beloved king will lead his people into a new era, continuing his father's unfinished democratization process and making the people's will known. Hussein has even reached out to moderate pro-Italian and left-wing groups, hoping to find common ground for the welfare of his people and country. Yet many still doubt whether the king's commitment to democratization will hold, despite his credentials and willingness for nationalism and liberalism. As friction grows between him and the republican elements in Jordanian politics, the doubts may prove well-founded..."
 POLITICS_NAYEF_HAWATMEH_JOR_DESC:0 ""
 POLITICS_George_Habash_DESC:0 "George Habash's rise was paved with hardship, pain, tears, and blood. Born into a devout Palestinian Christian family, the young Habash joined Arab guerrillas to fight the Italian occupation of the Levant after the Second World War. A committed Marxist, Habash founded the Arab Nationalist Movement, a broad front of socialists, communists, and left-wing Arab nationalists, and waged fierce guerrilla warfare against the fascist invaders in the Italian- and Zionist-occupied Levant, declaring their commitment to building an independent, atheistic socialist republic on Levantine soil.\n\nDespite divisions among the Levantine Arabs - largely due to Arafat's attempts to sell out the land beneath his feet to the fascists and Zionists, and Hussein's stubbornness and greed - Habash and the ANM finally achieved their revolutionary goal. The Levantine people rose up against imperialism and blind obedience, achieving the greatest victory after years of people's struggle, and the country now marches forward along the path laid out by General Secretary Comrade Habash toward a new future.\n\nYet Habash's struggle is far from over. Zionist militias such as the Irgun and most of the Haganah have taken fierce measures to resist the newly established People's Republic. Meanwhile among the Arabs, reactionary and fundamentalist sentiments still writhe like a serpent in the dark, spitting counter-revolutionary venom at the people. Now Habash must defend what he has liberated - defend the people, defend the ideas, defend the revolution. Only time will tell whether the light of socialism will endure in the Levant, or be extinguished by the darkness that keeps welling up."

 POLITICS_ZHANG_YU_DESC:0 "£GFX_kmt_party §iKuomintang Party Membership§!\n\nMacau's prosperity is inseparable from both cold hard cash and its profound cultural heritage. Zhang Yu, graduated from Hou Kong Middle School in 1975, later studied at the University of Macau and the Portuguese National Academy of Administration, earning a bachelor's degree in public administration, and completed a master's program in administrative management at Sun Yat-sen University.\n\nHis life experience is exceptionally rich. In his early years, he taught at schools, educating countless students; then he became enamored with landscapes, capturing light and shadow through his lens. From the 1980s onward, he was passionate about independent travel and photography, holding numerous solo exhibitions and publishing extensively. Today, he is an honorary advisor of the Macau Association of Independent Travel, truly a scholar-official who balances both walking and reflection.\n\nYet his ambitions did not stop there. Since entering politics, he has served as a Portuguese Macau municipal councilor, and is particularly known for his experience in the Independent Commission Against Corruption. This period of battling against corruption forged his integrity, and earned him the deep trust of Nanjing. Since taking office, he has calmed the storms of the gaming industry with one hand, while cultivating Macau's deep cultural roots with the other. At this crossroads of East and West, he steers with a steady hand, guiding this once dazzling casino city toward a more tranquil and measured pace. The central government has great confidence in him."
 AOM_Thousands_of_Gold_and_Earth:0 "Thousands of Gold and Earth"
 AOM_Thousands_of_Gold_and_Earth_desc:0 "During the Daoguang era, the Opium War broke out and Hong Kong rose to prominence. Macau, once a leading trading port in the Far East, lost its position, with empty treasuries and strained finances. To raise revenue and save itself, the Portuguese Macau authorities officially legalized gambling in 1847, beginning the taxation of "gambling duties." This was the origin of Macau's gaming industry, and it gradually earned the nickname "Monte Carlo of the East."\n\nBy 1937, the "Tai Hing Entertainment Company" of Ko Knin-chung and Fu Lao-jung won the monopoly rights, and the gaming industry began to take shape, showing signs of modern operations. In 1961, the Portuguese capital officially recognized gambling as legal. The following year, Stanley Ho, Henry Fok, and Yip Hon formed a consortium — the future "Macau Tourism and Entertainment Company" — defeating Tai Hing by a tiny margin to win the gaming license. Under Stanley Ho's 40-year stewardship, gaming grew into a modern massive industry, with Macau Gaming Entertainment dominating the field and its foundations firmly established.\n\nAt the turn of the new century, Macau's night remains as brilliant as ever, and the casino city's name resounds throughout the world. In this land where every inch is worth its weight in gold, vast fortunes are lost and won in a single throw, and the whole city is filled with the clamor of people spending money like water."
 AOM_Ease_Homesickness:0 "May This Ease Your Homesickness"
 AOM_Ease_Homesickness_desc:0 "The 1976 handover brought a change of regime. Faced with an uncertain future, some Portuguese officials and residents fled in haste; yet there were also the Macanese, whose families had lived here for generations, and distant expatriates, who chose this land as their home for their remaining years.\n\nMore than twenty years have passed in the blink of an eye, and times have changed. English has become dominant, and with the passing of the older generation, the once-popular "Macanese Portuguese" has largely died out. Among the younger generation, those who can speak pure Portuguese are increasingly rare, and the cultural identity of the Portuguese community has lost its way.\n\nYet whether long-time Macanese or recent arrivals, most consider Macau their home. Their livelihoods carry both Western traditions and deep Chinese customs. As a Macanese cook once said: coffee in the morning with Portuguese tarts, and late-night stir-fries at the dai pai dong — it all comes naturally, without knowing it's any different. A Portuguese song was once written to commemorate this, the lyrics going:\n\nI send you a sprig of flowers, may this ease your homesickness."

 USA_coalition_unity_NPP_section: "\n                              £GFX_npp_c_texticon Progressive Caucus£GFX_npp_c_texticon \n\n§KThe Progressive Caucus§! is the political heir to non-establishment §Jliberals§! and §Gprogressives§! such as §Lformer Agriculture Secretary Henry Wallace§! and §Lformer Vice President Burton Wheeler§!. Its member parties stand united to offer voters an alternative to the §BDemocrats'§! long rule.\n[USA.USA_NPP_Progressive_Caucus_Leader]\n                               £GFX_npp_fr_texticon Nationalist Caucus£GFX_npp_fr_texticon \n\n§gThe Nationalist Caucus§! is the heir to §LGeneral George Patton§! and §LGovernor Happy Chandler§!. Its parties seek to defend the §YAmerican values§! cherished by citizens, guiding the nation through §Rchaotic and perilous times§!.\n[USA.USA_NPP_Nationalist_Caucus_Leader][USA.USA_NPP_Marxists][USA.USA_NPP_Sovereigntists]\nPublic attitude toward the £GFX_npp_texticon §ONational Progressive Convention§! is [USA.USA_NPP_Coalition_Support] ([?USA_NPP_Wider_Approval|0Y%])[USA.RDC_Explanation]"

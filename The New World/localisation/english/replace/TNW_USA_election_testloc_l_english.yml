 USA_coalition_unity_RDC_section: "\n                                                £GFX_rd_r_texticon Republicans£GFX_rd_r_texticon \n\n[USA.USA_HR_Leadership][USA.USA_RR_Leadership]\n\n                                                £GFX_rd_d_texticon Democrats£GFX_rd_d_texticon [USA.USA_LD_Leadership][USA.USA_DC_Leadership]\nOverall, both parties are [USA.USA_RDC_Faction_Health] about maintaining the £GFX_rd_texticon §mRepublican-Democratic Coalition§!, with current overall coalition support at [USA.USA_RDC_Coalition_Support] ([?USA_RDC_Coalition_Sup|Y0%]). [USA.RDC_Explanation]"
 USA_Coalition_Explanation: "[USA.USA_Coalition_Descriptions]"
 USA_RDC_Explanation: "\n\n£General_Decision_Linebreak\n\n\nSince the late 1950s, the odd political alliance of the £GFX_rd_r_texticon §RRepublican Party§! and the £GFX_rd_d_texticon §BDemocratic Party§! has rapidly become a fixture of the American political system. Faced with the £GFX_npp_texticon §Osurging political outsiders§!, both establishment parties found themselves stretched thin, desperate to hold onto their political power, and ended up losing their own base as a result - hence this coalition.\n\nBargaining and backroom deals are struck in the political fog of the donkey-elephant alliance to keep the factions that make up the two parties content. From §RConservative Republicans§! to §Bstaunch New Dealers§! to §gmercurial Southerners§!, all face a stern test, and as the national political climate shifts, the rise and fall of each faction follows.\n\n§nDelivering on political promises§!, §npassing popular legislation§!, §nthe political capital of patronage and a successful presidency§! will be key to keeping the £GFX_rd_texticon Republican-Democratic Coalition in lockstep. And should the §mpolitical alliance§! collapse, §Vit will endanger the stability of the nation.§!"
 USA_NPP_Explanation: "\n\n£General_Decision_Linebreak\n\n\nThe odd alliance of §LProgressives§!, §gNationalists§!, §LPopulist factions§!, and certain other... §ounnamable groups§! - the £GFX_npp_texticon §ONational Progressive Convention§! - has become the most surprising force in American politics. Yet it is this coalition of disaffected former §BDemocrats§! and outraged §gPatriots§! that, in a single generation, has mounted a genuine threat to the £GFX_rd_r_texticon §RRepublican§! and £GFX_rd_d_texticon §BDemocratic§! duopoly.\n\nThe NPP's muddled political stance is both its strength and its fatal weakness. If the majority within the NPP cannot hold back its extremist factions, §ethen voters who turned to the NPP out of dissatisfaction with the establishment may think twice§!.\n\nA unified, disciplined National Progressive Convention will offer the American people §Ga real choice§! to replace the incompetent donkey-elephant parties. But equally, should the Convention splinter and collapse, it will only confirm the whispers that £GFX_npp_texticon §ONPP§! is a front for assorted §Vradicals§! and §oextremist factions§!."
 USA_Coalition_Explanation_Null: ""

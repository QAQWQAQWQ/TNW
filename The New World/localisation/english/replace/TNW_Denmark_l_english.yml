 den.4.t:0 "The Germans Send Their Demands"
 den.4.d:0 "We have managed to thwart the recent attempt at subverting the will of our government, and the will of our people! Foolish and vain, our heroic soldiers patrolling the capital made quick work of the perpetrators, and now they await their trial. However, despite this clear showing of strength and organization, we have a major problem that is now facing us. The Fuhrer of the Reich, Albert Speer, leader of a Germany bound to fall into degeneracy and trappings of 'democracy', has demanded that we are to immediately release the treasoners that we have taken to trial, and that we enter into the Einheitspakt. Though we could deny as a showing of ideological purity and continue with the trial, which would conclude with their mass execution, we also have to consider the legitimacy of their threats. We may see the Fuhrer as a spineless betrayer of National Socialism, but with the possibility of the Wehrmacht bearing down on our borders, we may be strong-armed into joining the Reich so that we do not lose our sovereignty.\n\nRegardless of what we may think, we must make a decision with all due haste."
 den.4.a:0 "Continue with the trial; let us see the rotten core of the Fuhrer and the Reich!"
 den.4.b:0 "Such an option would be suicide. We must let them go and enter their alliance."

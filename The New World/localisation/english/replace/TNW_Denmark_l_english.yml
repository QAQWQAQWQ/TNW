 POLITICS_WERNER_BEST_DESC:0 "Werner Best was a staunch German nationalist who had joined several far-right parties, so his eager enrollment in the Nazi Party in 1930 came as no surprise. He subsequently became a member of the SS, applying his legal and administrative talents to the fledgling Gestapo and coordinating the Night of the Long Knives in Munich. In 1940, political rivals forced him out of his Gestapo post, and he moved to the military occupation government in France, before being appointed Reich Plenipotentiary to Denmark in 1942. Werner occupied an awkward position, as Denmark was still permitted to retain its monarchy, cabinet, and semi-democratic parliament. The German occupation authorities made many compromises; they even advised Best not to deport Denmark's Jews to concentration camps in order to maintain good relations with the Danish government. An attempted restoration of universal suffrage in 1943 and a series of strikes led Best to bring Denmark under German military occupation; the parliament was dissolved, but the Danish king, cabinet, and most of the bureaucracy remained intact. Oddly, Best also failed to prevent the flight of the vast majority of Danish Jews to Sweden, and rumors have persisted for decades that he was a sympathetic protector of Jews.\n\nAfter the war, Denmark remained in this awkward, unstable state. Nominally still an independent country, it was under close German supervision, and the Germans continually threatened to restore martial law. Best remained in office, briefly attempting to implement a broad Germanization program. The economic collapse of the 1950s dried up funding and forced the program into suspension, but Best still hopes his dream - of Denmark becoming part of Greater Germany - will one day be realized."
 POLITICS_NILS_SVENNINGSEN_DESC:0 "As a loyal cog in the state machine, Nils Svenningsen has always dutifully maintained the regime's smooth operation. Though some in Germania accused the former Foreign Minister of being more loyal to Denmark than to Germany, his diplomatic credentials are beyond question. Combining liberal pragmatism with rigorous diligence, he took charge of Denmark after Martinsen's failed National Socialist coup, leading many to hope the Protectorate might enter a relatively stable new era."
 POLITICS_HERMANN_HANNEKEN_DESC:0 "Like most militarists, Hermann von Hanneken holds the virtue of patience in contempt. Serving Germany since 1942 as Chief of Police and Wehrmacht Commander in Denmark, he has suppressed dissent and treason. Though his harsh militarism did not reach the fanaticism of Schorner, this officer's concern for the security of Greater Germany prompted him to act swiftly to seize control of Denmark's leadership.\n\nHanneken and his inner circle believe Werner Best's cumbersome bureaucracy has tightened a noose around Denmark's neck - a fact well known to the Berlin leadership. This has impeded the Germanization of Denmark, leaving the northern protectorate a hollow shell. Like Alexander the Great, Hanneken is prepared to cut the knot, so that Denmark and its Germanic people may finally be absorbed into the Reich."
 POLITICS_KNUD_MARTINSEN_DESC:0 "Knud Borge Martinsen's loyalty to Germany is second only to his love for his fatherland. As leader of the Danish National Socialist Party, he is the public face of the party, while his close confidant Carl Popp-Madsen provides strategic counsel. Martinsen is notoriously suspicious; his rise dates to the West Russian War of the 1950s, when he led his troops against the Russian advance, distinguishing himself in the chaos with a character as cold as the blood-soaked snowfields of that campaign.\n\nThough he has served Germany as a loyal collaborator for the past two decades, Martinsen's desire for an independent Denmark has long been no secret to Germania. The Fuehrer has consolidated the party's rule over Denmark through a successful coup, and an independent yet subjugated Denmark may one day become reality."
 POLITICS_GUSTAV_MEISSNER_DESC:0 "Gustav Meissner's bureaucratic career records his steady rise through the protectorate and the reward of his unyielding loyalty. Meissner was a subordinate of Werner Best, and his superior's death made him the German Plenipotentiary to Denmark and de facto head of state. Meissner knows how to read the room and follow orders; his government will continue Best's work without question."
 POLITICS_OCCUPATIONAL_AUTHORITIES_DEN_DESC:0 "With Denmark once more brought to heel under the German boot, Martin Bormann has ordered the establishment of an interim transitional government to stabilize the region. This government is composed of the most efficient German bureaucrats, ready to hand over power seamlessly to the next government chosen in due course by the Fuehrer."
 POLITICS_JENS_OTTO_KRAG_DESC:0 "In 1940, Germany reduced Denmark to ruins in six hours, and it took more than twenty years for the country to regain its former glory. Jens Otto Krag stands before what was once the magnificent Ozymandias. While other European nations wept beside the mangled corpse of the motherland, Denmark watched coldly. When partisans and local collaborators slaughtered each other for their visions, Krag remained silent. But he was not idle. Krag entered the Byzantine labyrinth of the Social Democrats, determined to shield ordinary Danes from the rot of Hitler's disgusting ideology, even if it meant standing shoulder to shoulder with the king.\n\nKneeling before the pharaoh's great monument, the wind rages mercilessly at his back. He knows he can never return to that pure peace. One day, he will turn to dust in the sand, leaving only fragments of his achievements as proof that Jens Otto Krag ever existed. But that is all right, so long as the Prime Minister leads his people out of the desert, tearing away their chains and shackles - then everything, from the fall of the Danish government to the establishment of the permanent secretaries in 1943, will have been meaningless. Rising to his feet, Krag gazes upon Ozymandias, his eyes shining not with contempt or fear, but with hope. Here, upon the smoldering embers of defeat, Denmark's greatest victory is yet to come."
 DEN_permanent_secretaries:0 "Cabinet of Permanent Secretaries"
 DEN_permanent_secretaries_desc:0 "Today's Denmark was shaped by war. In 1943, Prime Minister Scavenius submitted his cabinet's resignation to the king over General Hanneken's unreasonable demands. Though King Christian X refused to dissolve the government, the cabinet collapsed on its own. Administration had to continue, and no one wished to accept direct German rule - the permanent secretaries of each ministry, led by Nils Svenningsen, quickly took over the old government's functions. This situation embarrassed everyone: unelected officials had neither popular mandate nor legal basis, yet they governed a democratic nation. Finally, the Interior Secretary proposed the concept of 'provisional law,' allowing ministries to issue and enforce their own regulations pending parliamentary ratification. But parliament had long been adjourned with little hope of reconvening, and Denmark became a legal labyrinth, operating through a maze of outdated provisional decrees.\n\nThe situation is more precarious than it appears. Germania is pressuring German officials in Denmark to implement more effective measures to accelerate Denmark's integration into Greater Germany. No one knows how long the current system can endure; one can only hope it lasts, guarding Denmark against foreign domination."
 DEN_agrarian_economy:0 "Agrarian Economy"
 DEN_agrarian_economy_desc:0 "The war devastated Denmark's economy; whatever growth momentum existed before the war stagnated or even reversed during the conflict. Conquest and military operations across Europe, Africa, and Russia required supplies for soldiers and rations for civilians. Every year, tons of Danish grain were shipped across Europe, especially to England, whose prewar grain suppliers had been destroyed by war.\n\nThough Denmark's economy is relatively stable, its stagnant growth barely keeps pace with Germany's growing demands. Bright young men and women were required to remain on family farms to aid production, effectively denying them dreams of university and city life. If the economy is to grow rapidly, agricultural reform is essential."
 DEN_threat_from_silkeborg:0 "The Silkeborg Threat"
 DEN_threat_from_silkeborg_desc:0 "The Wehrmacht garrison in Silkeborg keeps a close watch on Werner Best's 'Dagmar House' regime; to say the least, Hermann von Hanneken is unimpressed. Best has explicitly proposed transforming Denmark into a German state by 1960, and to Hanneken's irritation, Best still sits in power. Every month, Hanneken submits reports - some true, some exaggerated, some fabricated - detailing how the resistance remains active and how ineffective Best's measures have been. The general harbors personal ambitions, of course, believing himself the only man fit to govern Denmark: after all, he is the one who maintains order, and he is the one suppressing the resistance."

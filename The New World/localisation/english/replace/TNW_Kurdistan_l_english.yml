 POLITICS_MUSTAFA_BARZANI_DESC: "Countless groups cry out about oppression, claiming to fight for independence in a world ravaged by imperialist tyranny. Yet they are blind to the oppression they inflict on their own people, and deaf to the atrocities committed in the name of revolution.

Mustafa Barzani knows this pain more deeply than most. Turkish forces imprisoned his entire family, and he grew up in prison as an infant. His childhood memories are filled with the gunshots of his grandfather, father, and older brothers being executed one after another. As a teenager, he participated in and led uprisings against the British and the newly established Iraqi monarchy — struggles that eventually forced him into exile. When he returned after the Golden Square Revolution, all he saw was scorched earth and famine. Pleas for help to Baghdad were met with repression, and only the Turkish invasion of 1959 and the Second Iraq-Turkish War a few years later temporarily stayed the tyranny. Through it all, Mustafa Barzani never stopped fighting for his people.

Though Barzani respects Qasim and has responded courteously to his promises of a multi-ethnic republic, his vision of a free Kurdistan burns bright. He sees the oil crisis as the best opportunity to end centuries of oppression. Though whispers persist about his authoritarian tendencies and rumored corruption, all critics are willing to set aside their disagreements for now. After all, no one wants to see the Kurdish people driven back into the mountains, paying for freedom with the blood of generation after generation."

l_english:
 itatur.1.t:0 "Operation Black Bull"
 itatur.1.d:0 "Hey buddy, Penelope's Web isn't out yet, you shouldn't be playing as Turkey. This event originally had Tirkesh as the leader, but he's been kicked out now, and the text is meaningless. If you think filler text is interesting, go right ahead."
 itatur.1.a:0 "We will be victorious!"
 itatur.2.t:0 "Turkish Victory"
 itatur.2.d:0 "Alright player, we did it! The Italians are on their knees begging for mercy! (Good ending)"
 itatur.2.a:0 "Present peace terms!"
 itatur.3.t:0 "Italy Takes Control"
 itatur.3.d:0 "Despite the Turks giving it their all, our forces stationed in the Middle East have successfully repelled their offensive and contained their advance. Intelligence reports indicate that the prolonged war has left the Turkish government scrambling, with their economy taking a heavy hit — this is a golden opportunity for us to present our peace terms.\n\nIn the grand council, two approaches toward Turkey are under discussion. Leader Ciano proposes a relatively moderate plan: demand that the Turkish government pay war reparations and demilitarize the Damascus region to prevent them from recovering and threatening our interests in the Middle East. Meanwhile, Scorza, Ciano's party rival, takes a different tack, advocating for territorial concessions — particularly in the Damascus and Mosul regions — to strengthen our national prestige and cement ties with our Iraqi allies. He is convinced that the Turks, knowing defeat is inevitable, will meekly accept the terms. Now the council needs only to vote to settle the matter once and for all."
 itatur.3.a:0 "Ciano's proposal has been formally approved and sent."
 itatur.3.b:0 "Scorza's proposal is more attractive; we will push further and win more concessions."
 itatur.30.t:0 "The Empire's Glory Endures"
 itatur.30.d:0 "Our Italian soldiers have fought valiantly, striking deep into the Turkish heartland, and victory is all but assured. Damascus is firmly in our hands, giving us unprecedented leverage.\n\nCarlo Scorza made it clear in the grand council that for the Italian Empire to prosper, it must expand its borders. We previously had reservations about his words and kept the conflict contained to the Levant. Now that Turkey has knelt before us, we can finally present our demands with confidence."
 itatur.30.a:0 "Send Scorza's proposal to the Turks."
 itatur.4.t:0 "Inönü Makes Demands!"
 itatur.4.d:0 "Defeated on the battlefield, we have suffered a crushing defeat in the Middle East. Turkish President Ismet Inonu has presented his terms. He makes it clear that if we wish to retain the Levant, we must cede the Dodecanese Islands, Cyprus, and Lebanese territory to them.\n\nImprisoned as we are, we have no choice but to bow and accept these harsh terms dictated to us."
 itatur.4.a:0 "We have no choice but to accept."
 itatur.5.t:0 "Ciano Makes Demands!"
 itatur.5.d:0 "Italian cuisine sucks, how did you let them win?"
 itatur.5.a:0 "Do as they say, send a reply agreeing."
 itatur.6.t:0 "Proposal on the Table"
 itatur.6.d:0 "Scorza is an idiot, to hell with him."
 itatur.6.a:0 "Reject — I say again, reject."
 itatur.7.t:0 "The Turks Reject Our Proposal!"
 itatur.7.d:0 "These wretched Turks dare to reject our proposal! They claim their front lines are holding strong, that Iraq hasn't even been affected, and that they won't accept a single clause. Now the ball is in our court: do we smash through Turkish bravado and force them to swallow this bitter pill, or do we adopt Ciano's more moderate proposal?"
 itatur.7.a:0 "Try to pierce these Turks — send the same proposal again."
 itatur.7.b:0 "Obviously we need to give a more reasonable proposal; let's go with Ciano's plan."
 itatur.8.t:0 "Scorza's Proposal — Round Two"
 itatur.8.d:0 "Italy is being played by the player!"
 itatur.8.a:0 "Are you kidding me! Reject!"
 itatur.9.t:0 "Proposal Rejected Again"
 itatur.9.d:0 "The Turks have rejected Scorza's proposal again, citing the same reasons as last time. More and more members of the grand committee believe we should use Ciano's proposal, since it's clear the Turks cannot accept the previous one. But Scorza and his cronies continue to defend his proposal in the grand committee."
 itatur.9.a:0 "Do the three visits story, send it one more time."
 itatur.9.b:0 "This is futile; just send Ciano's proposal."
 itatur.10.t:0 "Scorza's Proposal — Round Three"
 itatur.10.d:0 "Italy is really pushing it too far; now we have no choice but to accept :("
 itatur.10.a:0 "There's no other way..."
 itatur.11.t:0 "A Naval Clash"
 itatur.11.d:0 "Several troubling reports have arrived from the Rhodes naval command. Yesterday, our patrol vessels were intercepted by the Turks. Normally their wording is fairly polite, but this time they blared through loudspeakers that we had entered Turkish territorial waters and that this was a violation of their sovereignty. An argument ensued, with our side insisting the area belonged to Italian territorial waters since it was only a few nautical miles from our Rhodes naval base.\n\nSuddenly the Turks fell silent and opened fire on our vessels. We returned fire, and the situation escalated. Both sides deployed more warships, and a tense standoff followed. After a series of discussions between the naval commands at Rhodes and Marmaris, both sides backed down and returned to port. Fortunately, the incident caused no casualties on either side.\n\nThis report appears to confirm our worst fears: the Turks are making moves on the disputed territory between Italy and Turkey. Reinforcements have been sent to the region, and Italian forces and the entire Eastern Mediterranean naval command have been placed on high alert."
 itatur.11.a:0 "We must prepare for the worst."
 itatur.12.t:0 "Our Troops Attacked by Italians!"
 itatur.12.d:0 "Down with Italian imperialism"
 itatur.12.a:0 "Strengthen patrols and deploy reinforcements to the border. Prepare for war."
 itatur.13.t:0 "Unrest in Cyprus"
 itatur.13.d:0 "More bad news arrives from the eastern border.\n\nThe Turkish population of Cyprus has long been dissatisfied with their Italian identity, and as tensions between Italy and Turkey escalate, this contradiction has reached a breaking point.\n\nAfter a local Turkish demonstration turned on the police, gendarmes were dispatched to the police station to resolve the matter. As police clashed physically with the demonstrators, the gathering escalated into a riot. Though the Turks did their best, police reinforcements brought the situation under control, and the riot was eventually quelled.\n\nTensions between Turkey and Italy are about to become uncontrollable, and the Cypriot government has imposed martial law across the island."
 itatur.13.a:0 "At least the Greeks won't make a fuss about this..."
 itatur.16.t:0 "Great Victory at Rhodes!"
 itatur.16.d:0 "With the last Italian soldiers retreating in disarray from the shores of Rhodes, we have won an overwhelming victory in the Aegean Sea.\n\nAlthough the Italian military had prepared for the coming offensive for a long time, our forces broke through their lines thanks to our lightning action and absolute air superiority. We first captured the nearby island of Symi, with several infantry regiments successfully landing on its northeast coast and easily securing most of the island. Though minor skirmishes in the rugged terrain continued for 13 days, organized resistance effectively ended when the Italians withdrew all their forces from the island, consolidating our position in the city.\n\nWith the fall of the city and its surrounding areas, the Turkish navy's control over the Aegean has grown significantly.\n\nTurkish soldiers marching among the ancient ruins — many believe our victory in the Aegean is an omen of future triumphs. This victory has greatly weakened Italy's power projection in the Aegean, at least for the remainder of the war. It also provides a favorable springboard for further operations in the Middle East. This victory has a dual significance: as part of the campaign to recover disputed territory, it has become a powerful propaganda tool, with news of the victory spreading widely across both Turkey and Italy, sure to boost morale and aid our campaign in the Middle East."
 itatur.16.a:0 "Finally, Rhodes is ours!"
 itatur.20.t:0 "Rhodes Captured by the Turks!"
 itatur.20.d:0 "Mart's unit had almost no warning before the Turks' recent offensive. Late one night, they moved hurriedly in their barracks on the orders of their commander, their consciousness drifting half in and half out of sleep. Above, only dim moonlight.\n\nThe Turkish army was supposed to strike directly at Italian military installations on Rhodes, but instead, they moved with lightning speed and unexpected rapidity. They cleverly bypassed the Rhodes Strait and the Italians' fortified lines, first taking Symi by sea, then launching a coordinated night assault that overwhelmed the northeastern corner of Rhodes with minor infantry and air support. Mart and his men only learned of the battle weeks later from triumphant newspaper columns written by Turkish officers.\n\nAt the time, all they knew was that a small Turkish force had landed on the island, seemingly incapable of either resupplying or threatening Italian power. Yet the night battle near Cremasti and the Italians' crushing defeat were no isolated incident but omens of things to come. In the Italian northern districts, the same was quietly unfolding; Italian control over the Aegean, shattered after the Aegean campaign, would not recover for the rest of the war at least. Mart and his remnant later learned that Rhodes had held out for about 13 days, until Italian forces were forced to withdraw, leaving behind captured soldiers like themselves to sense the war's progression from the morning roll call of their POW camp commanders and from the newspapers."
 itatur.20.a:0 "This is terrible!"
 itatur.100.t:0 "[Get_newspaper_header]War in the Desert"
 itatur.100.d:0 "Since the end of World War II, Turkey has been dissatisfied with its share of the spoils. Too many Turks died outside their borders for too little in return. With Turkish President Ismet Inonu declaring a state of war between the Republic of Turkey and the Italian Empire, this long-simmering tension has finally erupted today.\n\nThough the two countries were allies, the war is deeply popular in Turkey. Young nationalists march through the streets of Ankara, calling on Inonu to lead us to victory. By contrast, the war enjoys almost no support among the Italian public, with many questioning why Italy ever got involved in the Cyprus mess in the first place."
 itatur.100.a:0 "Another imperialist war."
 itatur.100.b:0 "We will crush them."
 itatur.100.c:0 "How could they treat their former ally like this."
 itatur.21.t:0 "Italian Victory at Rhodes"
 itatur.21.d:0 "As expected, our forces successfully repelled the Turkish attack on Rhodes. Though this brief clash was but one facet of Turkey's larger gambit to swallow long-coveted territory amid the chaos following the collapse of the Triumvirate, news of the victory has already spread across the papers, and Rome resounds with jubilation.\n\nThe Italian military might is invincible! Ciano declared in a speech in the capital. We have repelled the Turks at Rhodes, and so we shall in the Levant!\n\nYet this victory, though not enough to secure victory in the Middle East or ensure the empire's everlasting glory, at least means the Italian flag still flies over Rhodes."
 itatur.21.a:0 "Long live Italy!"
 italy_turkey_war:0 "The Italo-Turkish War Continues"
 SNS_Lebanese_Resistance:0 "Lebanese Resistance"

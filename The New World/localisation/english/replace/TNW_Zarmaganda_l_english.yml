 ZAR_Seyni_Kountche: "Seyni Kountché"
 ZAR_Ali_Saibou: "Ali Saibou"
 ZAR_Moumouni_Adamou_Djermakoye: "Moumouni Adamou Djermakoye"
 POLITICS_SEYNI_KOUNTCHE_DESC: "The Zarma people were once just people surviving under the boots of the French, their nobles doing everything they could to survive their advance, making deals and avoiding trouble. But now, they are led by a man with the will and the path to lead the Zarma people to freedom. Seyni Kountché is that man — a man with historical ties to the Zarma people, who will bring strength to the people of Zarmaganda to face those who would make an enemy of the Zarma, like Issa Kollombé and his struggle against the Fulani. However, this is nothing but a facade. Seyni Kountché is simply a man who was in the right place at the right time. As the heir of the Zarma chief of Tondikandia, the hierarchical Zarma society has always held Kountché and his family in high regard, and this young man entered the French army's West African branch early on for training. After the continent fell, he slowly rose through the ranks of the Free French army.

As Free France slowly retreated, Kountché realized that the Zarma people had no leader, and that this was a good opportunity to seize power. He quickly seized the opportunity, using his noble status to stir up the Zarma people under his command, carving out a territory in West Africa to call his own. Although this land happened to be within the borders of the Sokoto Sultanate, what could they do about it? Hell was raining from the sky, and there was no way to stop him from taking this land for himself. However, one day, the bombing stopped. The Sokoto people were weak, and more importantly, many of their soldiers were Zarma. With a few speeches, allies flocked to his side. A few months after the bombing stopped, Kountché declared Zarmaganda's independence from Sokoto. But Kountché's control seems to be coming to an end. The people hate him, and his deputy hates him even more. It seems that to remain in power, Kountché will need to make some difficult choices…"

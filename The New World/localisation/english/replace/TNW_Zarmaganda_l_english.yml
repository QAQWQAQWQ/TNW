 ZAR_idea_warlord_state: "Warlord State"
 ZAR_idea_warlord_state_desc: "The term "warlord state" has become ubiquitous. It is a simple label used to describe countless small nations, often masking more complex situations. In Zarmaganda, this is not the case. Seyni Kountché and his army have formed the entire Zarmaganda government, and Zarmaganda's territory consists only of the land they occupy. For many, Kountché's enormous success in the struggle against Sokoto is a miracle, and few thought Zarmaganda would last longer than his rule."
 ZAR_idea_deficient_administration: "Deficient Administration"
 ZAR_idea_deficient_administration_desc: "Simply put, the Zarmaganda government does not exist. Kountché's army exercises brutal control over the country, suppressing all signs of unrest and stealing whatever they want under the guise of taxation. With local officials hesitant to join such a violent and unstable government, and Kountché distrusting everyone except a few of his closest officials, Zarmaganda's government seems doomed to be small and inefficient."

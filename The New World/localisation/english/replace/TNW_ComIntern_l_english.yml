 socintern.1.t:0 "[FROM.GetNameDefCap] invites us to become a Comintern member"
 socintern.1.d:0 "Today we received an invitation from [FROM.GetNameDef], inviting our ruling party to join the Comintern as an associate member. This nascent international organization aims to unite all those fighting for workers' rights and humanity's march toward socialism.\n\nOur party has received an invitation to become an associate member: associate members have the right to attend and observe Comintern meetings, and may later apply to become full Comintern members. [FROM.GetAdjective] awaits our reply - shall we join the Comintern?"
 socintern.1.a:0 "We accept gladly."
 socintern.1.b:0 "Accept associate status."
 socintern.1.c:0 "We want nothing to do with the Comintern."
 socintern.2.t:0 "[FROM.GetNameDefCap] invites us to become a Comintern associate member"
 socintern.2.d:0 "Today we received an invitation from [FROM.GetNameDef], inviting our ruling party to join the Comintern as an associate member. This nascent international organization aims to unite all those fighting for workers' rights and humanity's march toward socialism.\n\nOur party has received an invitation to become an associate member: associate members have the right to attend and observe Comintern meetings, and may later apply to become full Comintern members. [FROM.GetAdjective] awaits our reply - shall we join the Comintern?"
 socintern.2.a:0 "We accept gladly."
 socintern.2.b:0 "We want nothing to do with the Comintern."
 socintern.3.t:0 "[FROM.GetNameDefCap] agrees to become a Comintern member"
 socintern.3.d:0 "We have received word that the ruling party of [FROM.GetNameDef] has agreed to join the Comintern as a full member. We look forward to their contributions and proposals at the Comintern Congress."
 socintern.3.a:0 "Welcome, comrades!"
 socintern.4.t:0 "[FROM.GetNameDefCap] agrees to become a Comintern associate member"
 socintern.4.d:0 "We have received word that the ruling party of [FROM.GetNameDef] has agreed to join the Comintern as an associate member. They will attend Comintern meetings as observers, by which they can gauge our progress; perhaps the growing ties between our two nations will eventually lead them to become full Comintern members."
 socintern.4.a:0 "Welcome, comrades!"
 socintern.5.t:0 "[FROM.GetNameDefCap] declines our invitation"
 socintern.5.d:0 "It seems [FROM.GetNameDef] will not be joining the Comintern, to our regret. Their ruling party's representatives politely but firmly declined our invitation, refusing to fight for workers' rights and socialism. Perhaps [FROM.GetNameDef] will be more interested in the future; for now, joining the Comintern is not on their agenda."
 socintern.5.a:0 "A pity."
 socintern.6.t:0 "Invitation from [FROM.GetNameDef]"
 socintern.6.d:0 "Good news! It seems our brothers in the global socialist movement have recognized our contributions to the socialist struggle against capitalism, and have sent an invitation to attend the Rykov Congress! This is a chance to meet closely with the top leadership of the proletarian movement, encouraging us to advance the great social revolution further while boosting our nation's prestige.\n\nOur diplomats and party officials are competing for a chance to attend and represent our nation in this emerging global movement. We will prove to our allies that we are true partners in the fight for justice and equality."
 socintern.6.a:0 "We will attend gladly."
 socintern.6.b:0 "We are... otherwise engaged."
 socintern.7.t:0 "The Rykov Congress"
 socintern.7.d:0 "Wonderful news! The Rykov Congress concluded with great success. Under the impact of the global revolutionary wave, old hostilities were swept away, and all invited parties conducted themselves warmly and honestly. Minor disputes that arose during the proceedings were quickly resolved by the chair, and the entire congress was productive and pleasant.\n\nIf this congress shows anything, it is that the power of socialist ideology will return to the world stage. Let the enemies of the world's proletariat and people's justice tremble before the terrible power of united socialist states!"
 socintern.7.a:0 "The Internationale unites all mankind!"
 socintern.8.t:0 "[FROM.GetNameDefCap] wishes to join the Comintern"
 socintern.8.d:0 "Comintern member states bring good news every day. Our ranks are growing, our economic output is rising, and even nations sunk in the mire of fascism and capitalism are beginning to feel the first tremors of the socialist earthquake.\n\nRecently, we have received another application from [FROM.GetNameDef] for full Comintern membership. Their people have heard the sirens of global revolution. Their admission will undoubtedly strengthen our ability to fight the enemies of the world's proletariat."
 socintern.8.a:0 "We accept gladly."
 socintern.8.b:0 "We want nothing to do with them."
 socintern.9.t:0 "[FROM.GetNameDefCap] accepts our application"
 socintern.9.d:0 "When our nation first set out on the path to becoming a Comintern member, many thought it futile. After all, the power of the bourgeoisie is great, and their will to crush the first stirrings of proletarian resistance is absolute. But despite the difficulties and the opposition, our ruling party overcame its enemies and came to dominate the nation's politics. Though this victory seemed small, recently we received word that our application to join the Comintern as a member has been accepted. Now we are regarded as an equal partner by the world's most powerful socialist state, and we will fight side by side in this eternal struggle."
 socintern.9.a:0 "Excellent!"
 socintern.10.t:0 "[FROM.GetNameDefCap] rejects our application"
 socintern.10.d:0 "Bad news! It seems the Comintern leadership has been corrupted by the very capitalist and revisionist forces it claims to fight against; otherwise how could they reject our application for membership?\n\nWe hope that, with time, winds of change will blow through the Comintern's dusty halls, sweeping away the two-faced fools and replacing them with nations more dedicated to world revolution. But until then, we must fight the capitalist oppressors alone.\n\nThough it pains us to be separated from our comrades, we must press on until one day our proletarian brothers see the light and recognize us once more."
 socintern.10.a:0 "A pity."
 socintern.11.t:0 "[FROM.GetNameDefCap] wishes to become a Comintern associate member"
 socintern.11.d:0 "Winds of change, the development of economic foundations, and the ultimate victory of the socialist revolution cannot be rushed. Trying to hasten our ultimate victory only delays it - as the Bukharinists learned in their defeat. Thus, though it is regrettable that [FROM.GetName] does not yet see itself as a member, their expressing a desire to join as an associate member is still cause for celebration. We must now examine whether they are worthy of this honor, or whether their socialism meets the requirements of the global proletariat."
 socintern.11.a:0 "We accept gladly."
 socintern.11.b:0 "We want nothing to do with them."
 socintern.12.t:0 "[FROM.GetNameDefCap] accepts our application"
 socintern.12.d:0 "Good news from the diplomatic front. We have just received an official communique from the Comintern Supreme Committee accepting us as an associate member.\n\nThis is good news for our government. If the Comintern serves our interests, we must now prepare to throw ourselves fully into the organization; if not, we must withdraw without a trace. We can only hope our new allies understand our position and earn our trust further."
 socintern.12.a:0 "Excellent!"
 socintern.13.t:0 "[FROM.GetNameDefCap] rejects our application"
 socintern.13.d:0 "This is a catastrophe from the diplomatic front! It seems the fools in the Comintern leadership have rejected our application to join their little club. Though we hoped to open diplomatic ground by applying for associate rather than full membership, this was apparently not enough for the nominal \"leaders\" of this organization. Despite this humiliation, our nation will not abandon its commitment to the world's workers, though we may need to find other channels to make it a reality."
 socintern.13.a:0 "A pity."
 socintern.0.t:0 "Congress Convenes"
 socintern.0.d:0 "Since the Comintern's founding, we have been planning a congress where representatives of socialist parties worldwide can discuss and vote. Today the preparations are complete, and it is ready to convene!\n\nComintern member states will be able to submit initiatives at the congress and vote by secret ballot. Adding the holding of congresses to the organization's charter will surely benefit the international socialist struggle."
 socintern.0.a:0 "A glorious day for the world's workers!"

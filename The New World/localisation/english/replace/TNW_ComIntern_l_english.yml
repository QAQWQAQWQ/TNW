 socintern.17.t:0 "The CMEA is Established"
 socintern.17.d:0 "Good news! The CMEA has been established by vote! It seems our socialist comrades are clear-headed. The CMEA, or Council for Mutual Economic Assistance, is an international organization founded jointly by Comintern member states. The CMEA pledges to aid any nation in need, delivering aid supplies and energy. It will also help build bridges between our nations, strengthening economic ties so we can face the conspiratorial forces of capitalism and fascism together more firmly. If we make ourselves richer, then worker comrades will be freer.\n\nToday is a great day for socialism. Now even our weakest comrades can surpass themselves in the future, building far greater things than exist today. However, such an immense workload requires more time to coordinate; the Congress can pass only one landmark resolution per month."
 socintern.17.a:0 "From each according to his ability, to each according to his needs."
 socintern.18.t:0 "The CMEA Falls Through"
 socintern.18.d:0 "Bad news from the Congress. Because certain nations narrowly believed their own development was more important than the liberation of all humanity, they cast foolish votes, and the proposal to establish the CMEA was defeated. If it had passed, the CMEA would have provided vital aid to all socialist nations worldwide, from the smallest microstate to the mightiest power, leaving no one behind in economic aid and security support.\n\nThis vote represents a dark day for the Comintern. Many say if we cannot make a unified choice when voting, what are we even fighting together for? With time, the bonds uniting us are loosening. Without a united front, we will be pounced upon, slaughtered, and torn apart by the wolves of capitalism and fascism. In any case, we have one more chance. In a month, the full Congress will vote on this proposal again. By then, we will not so easily talk past each other."
 socintern.18.a:0 "Is Workers of the World Unite just a slogan?"
 socintern.19.t:0 "Multilateral Non-Aggression Pact Passes"
 socintern.19.d:0 "Peace has returned to the world! At least to the socialist world. Today the multilateral non-aggression pact resolution passed by Congress vote. Its passage marks two things. First, to maintain left-wing unity, war between socialist states will be prohibited; to ensure this, all Comintern nations will sign a formal non-aggression pact. Second, all Comintern members will recognize other socialist states' territorial claims - not merely those \"internationally recognized\" territories, but also those we desire but do not actually control.\n\nThis will make the capitalists tremble, for we have set aside our petty mutual disputes to focus on our true enemy. That enemy is not the proletarians of other nations - they merely struggle to survive - but the capitalist swine who make us suffer. In any case, this is a daunting task. We cannot vote on a resolution of comparable scale until next month. Thus we can gradually win benefits for our worker comrades."
 socintern.19.a:0 "Peace between nations, not between classes."
 socintern.20.t:0 "Non-Aggression Pact Falls Through"
 socintern.20.d:0 "Plato said, \"Only the dead have seen the end of war.\" If anything is proven by these past days, it is that this ancient philosopher's words remain true, echoing in our ears with their harsh, biting tone. Not merely the multilateral non-aggression pact, but all Comintern territorial claims have turned to ashes in the Congress's bitter disputes.\n\nWhether from conflicting interests or domestic and foreign pressure, the Comintern has failed to unite under a single banner. One can imagine our malicious enemies are already licking their chops, for they know a door has opened - a door to socialist infighting and self-slaughter. Though the probability of war between us is not high, the sword of Damocles still hangs over our heads. The capitalist swine would gladly seize this opportunity to have our comrades harm socialist brethren for their benefit.\n\nThough the resolution failed, the vote has imposed great administrative pressure on us. Accordingly, the full Congress cannot vote on a comparable resolution until next month. Perhaps by then, true peace can be established between the Comintern's nations."
 socintern.20.a:0 "Communist peace is only steps away."
 socintern.21.t:0 "The CMEA Scientific Bureau is Established"
 socintern.21.d:0 "Glory to those who look to the future! And greatest of all are the Comintern's member states. The establishment of the CMEA Research Bureau is a major step forward for our technological development, and a pan-socialist scientific society will ensure Comintern member states can catch up with the \"old powers\" of engineering science. The Research Bureau is an international council providing both the resources and the energy needed for scientific prosperity in socialist states, and one can imagine how much fear this will bring to the capitalists, who will realize they are no longer the sole inhabitants of the future.\n\nWith this resolution's passage, the Comintern will truly become a force shaping the future. More importantly, these technologies will not be used to oppress workers worldwide - but to solve the problems they face. Some of our more ambitious comrades even envision a socialist space program! Though the ideal of red boots on a red planet is still on the distant horizon, it is no longer wholly unrealizable. Even so, we must rest for a month; after that, we will vote again on our future direction - and decide how best to push the red tide across the cosmos."
 socintern.21.a:0 "Workers of the world, unite!"
 socintern.22.t:0 "The CMEA Scientific Bureau Falls Through"
 socintern.22.d:0 "Once, the far-sighted among us held a dream so grand that everything else paled beside it. The dream was that we would break free from the shackles of the land where we were born and raised, reaching outward to the brilliant starlight of the cosmos, to that roiling chaos between nebulae and stars we had long ignored. Now, that great dream has been swept into the dustbin by cold, hard realpolitik.\n\nThis proposal could have placed the Comintern at the forefront of technology, bringing miracles unpredictable and unimaginable to our fingertips. An assembly of the world's finest minds had a chance to guide humanity's liberation - not merely from the chains of capitalism, but from the limits of life itself. Yet the Congress did not endorse this vision, and the marvelous frontiers of science - the realm where its transformative magic runs free - remain beyond our grasp, though perhaps only by a hair.\n\nWe cannot vote again for nearly a month. Let us hope we focus on building an Eden on Earth rather than a castle in the air."
 socintern.22.a:0 "Though born here, we need not die here."
 socintern.23.t:0 "New Comrades Join Our Ranks"
 socintern.23.d:0 "Throughout history, it seems the world's rulers have always done their utmost to oppress the suffering, earnest worker comrades. Whether they called themselves chieftains, lords, nobles, emperors, or CEOs; they merely continued their hateful tyranny under a different name. Tyranny, however the rulers may gloss their philanthropy, cannot conceal what has actually occurred - it oppresses all of society, every citizen, and indeed every individual. Comrades of the proletariat, we once cast our hopeful gaze toward the Mesopotamian horizon; now the future we awaited has arrived, and we will stand firm in our mutual support. As today proves, we will only grow stronger.\n\nThe vote to admit another socialist regime to the Comintern has passed. Today is a glorious day for worker comrades worldwide. Our struggle will not swing like an iron fist, lashing out at our oppressors with revanchism to win freedom; it will rise like the tide, slow, almost motionless. But it will rise little by little. Slowly, it will wash away everything that opposes our goals, and we will stand tall again in pride of victory. We are the tide, and we will drown the capitalists. Resisting the sugarcoated bullets they hurl to oppress us; their demise is inevitable. Their death knell is about to ring; let them enjoy their last few seconds of rule.\n\nWe cannot vote again until next month. After that, we will advance once more."
 socintern.23.a:0 "Cheers! To victory at this moment!"
 socintern.24.t:0 "Alone"
 socintern.24.d:0 "Are we fated to walk alone? Is union too difficult for us? When another socialist regime offers us an olive branch, is it not our duty to accept them? These questions received their final answer at today's full Congress. The vote on admitting another nation to the Comintern made no progress and ended in failure. This has dealt us a heavy blow; in any case, the damage done by behind-the-scenes politicking and factionalism was too great.\n\nThe applicant nation's diplomats walked home with red faces. Many of us believe this was a lost opportunity - for building a stronger Comintern. Even admitting the weakest member would be a great achievement, increasing our alliance's legitimacy. Is this not obvious? Other emerging revolutionary comrades will be shocked by this news, and one can easily imagine what they will think of us; if we are misunderstood and isolated by overseas comrades, what is the point of what we do? But on the other hand, every cloud has a silver lining; perhaps, perhaps after joining they would become parasites wasting our resources? It is not impossible that their admission would weaken our alliance. In any case, we will never know the answer.\n\nWe cannot vote again until next month; may the next applicant have better success."
 socintern.24.a:0 "Do not let momentary anger blind us; we must set our sights on a better future."
 socintern.25.t:0 "Observer States Added"
 socintern.25.d:0 "Whether out of political necessity, lack of resources, simple anxiety, or other reasons, some nations do not wish to join the Comintern directly. These comrades appreciate our work but cannot join our ranks. In any case, this is a loss for us all. But today, a new opportunity has arisen for other nations to understand how our organization operates. By vote, a resolution was passed granting applicant nations the special title of \"observer state.\" They are not fully part of the Comintern, so we cannot yet interfere in each other's internal affairs, but they remain under our protection and guidance. If they wish, they may join the Comintern fully, provided their internal decision is unanimous.\n\nWhat remains is to wait for the applicant nation to accept our proposal; if they realize they can gain a place in the Comintern, they will likely be happy to join us. But perhaps under certain factors, they would prefer to blaze their own trail elsewhere. In any case, at least we have proven our sincerity toward unity despite complete uncertainty. The road is beneath their feet, and only they can decide where it leads.\n\nWe cannot vote on resolutions again until next month. Perhaps more nations' curiosity about our organization will be aroused by this."
 socintern.25.a:0 "No one turned away."
 socintern.26.t:0 "Observer State Resolution Falls Through"
 socintern.26.d:0 "Unfortunately, a door to the Comintern has closed. For their own reasons, some nations prefer seeking ways to \"observe\" our organization to improve mutual understanding rather than joining directly. This model could aptly be named \"observer state,\" during which they may choose to leave or fully integrate into the Comintern. The way this model works can be briefly described: the applicant nation expresses interest in becoming an \"observer state,\" then we vote at the full Congress. If it passes, we send them an offer, and once they accept, they formally become an \"observer state.\"\n\nHowever, today's vote failed. The applicant nation's delegation left in defeat. Most opposition accused this of being \"factionalism\" or decried elitism - intolerable for an organization founded to fight elitism. Others believed the Comintern must be an alliance with a single leader, and to achieve this it must cut ties with the rest of the world to compete with the capitalist great powers. In any case, the red tide has stopped surging against capitalism's black heart.\n\nWe cannot vote on resolutions again until next month. Next time, we must be more open on these matters."
 socintern.26.a:0 "What harm can come from letting them in?"
 socintern.27.t:0 "CMEA Solidarity Resolution Passes"
 socintern.27.d:0 "We must admit that money and gold still rule humanity. It sits on a distorted throne built from the blood and bones of the poor, endlessly oppressing and enslaving humanity. Once the revolution is complete, we will not hesitate to drag this tyrant from his bloody throne and tear down and burn his royal palace. But for now, we must play by his rules. Current circumstances have proven we do quite well under his rules. The Congress will vote today on a simple resolution: to consolidate and develop the CMEA, transforming it from a collective development fund into a comprehensive economic union. This will not merely break down trade barriers between us but unite us into a final bulwark against the tide of capitalist economic aggression.\n\nWe have voted in favor and begun the integration work. Thousands of civil servants and people dedicated to world revolution are discussing how best to integrate our economies to achieve an effect greater than the sum of its parts. The reactionary capitalist fat cats will not take this news lightly. They are trying to sabotage our unity and force us into bankruptcy. As they have done for thousands of years, they will reduce to ashes all our contributions for the people, destroying the workers' will to fight. But they cannot reverse the laws of history: they will fail.\n\nWe cannot vote again for a month; now is the time to enjoy the fruits of our labor."
 socintern.27.a:0 "Another economic power takes the stage."
 socintern.28.t:0 "CMEA Solidarity Resolution Fails"
 socintern.28.d:0 "It seems our ambitions are still too lofty for many Comintern members. Today the Congress voted down the CMEA economic union resolution. If it had passed, Comintern member states could have broken through national borders to unite as a single entity. To the chagrin of our most enthusiastic members, this was not a political entity but an economic one. The blood and sweat of our workers would no longer flow to the bloated capitalists but to our revolutionary comrades abroad. If this resolution had passed, the Comintern could have proven itself a sincere, legitimate force among global powers. Yet democracy, as they say, is tedious and ruthless.\n\nEach member had their own reasons for rejection, too complex and varied to list. In any case, it no longer matters. The Comintern is more divided now; though we may still trade frequently, our economic advisers cannot help but wonder whether we have missed a chance at a brighter future. A future where our descendants labor not to survive but to prosper. In that future society, the dark Victorian smoke that once strangled our ancestors is but a blurry fairy tale. In such a future, everything is more hopeful.\n\nWe cannot vote again until next month. The bonds between us are not unbreakable."
 socintern.28.a:0 "We will have to develop our economies on our own."
 socintern.29.t:0 "International Brigades Formation Passes"
 socintern.29.d:0 "The road to global revolution will be a dreadful journey. Not everyone will live to see its end, and only a few will enjoy its fruits, but the road will end, and someone will taste victory. The greedy, cold-hearted reactionary swine surround us, eyeing our blood with hungry desire. To defeat the enemy, not a single mistake can be made. Today we have forged an invincible sword that can cut through every thorn. Today we will form the International Brigades.\n\nEven today, countless people are enslaved by the bourgeoisie, laboring under the capitalists' whip. Our Comintern unites the socialist world, but much work remains. It is only a matter of time before the working class takes up arms against the capitalists, and when that day comes, we must fight alongside them. However dire the situation, however dangerous the enemy, a force of the finest soldiers from across the world will aid the workers' revolution. The International Brigades' fighters will train to the limits of human endurance; they will be equipped with the deadliest weapons until they become the most ruthless war machines. Not turned against our brethren, but against those who would destroy us. The future is uncertain, but the International Brigades are ever ready.\n\nWe cannot vote on resolutions again until next month. Our fighters stand ready; their time is coming."
 socintern.29.a:0 "Fighting for the freedom of the world's proletariat..."
 socintern.30.t:0 "International Brigades Formation Fails"
 socintern.30.d:0 "The resolution to form the International Brigades has fallen through. It was betrayed by those it would have protected, leaving only shattered hopes and unfulfilled promises in its wake. If the resolution had passed, we would have rebuilt that great vanguard of the people's revolution. The International Brigades would have been a trained, well-equipped volunteer corps, its members carefully selected from every corner of the world. When workers' revolution erupted, they would be dispatched to assist and train workers against the reactionary swine of fascism and capitalism.\n\nBut the light of the ideal cannot illuminate the gray of reality; unfortunately, for the Comintern, forming such a force would simply cost too many resources. Whether out of fear of the capitalist world's \"retribution\" - that hateful oppression of our revolution - or lack of funds, resources, or manpower, the International Brigades remain for us a fantasy. Some of the old-timers remember the original International Brigades. Fighters from entirely different cultures gathered, communicating in countless languages, fighting side by side for the liberation of the Spanish comrades. On the plains scorched by the Iberian sun, in that land far from home, they were brutally slaughtered by Germania and its lackey Francisco Franco. The veterans can barely hold back tears when speaking of this; their memories hold only final humiliation.\n\nWe cannot vote on resolutions again until next month. Let us sing praises for those earnest warriors."
 socintern.30.a:0 "The revolution, torn apart."
 socintern.31.t:0 "Military Aid Resolution Passes"
 socintern.31.d:0 "The moment of emergency has arrived. Today, a revolution has erupted, and the workers there are roaring for their ultimate freedom! The Congress has voted on the military aid resolution. Despite its dry name, this is the most important resolution ever passed by the Congress. It concerns military aid to the target nation. We will help them fight the reactionaries to the end. Now is not the time for factionalism or power plays - now is the hour of steel and blood.\n\nFortunately, our comrades have agreed. They voted in favor and approved its full contents. This resolution has already caused a stir on the international geopolitical stage. Though the capitalists and their tamed reactionary running dogs of fascism and imperialism will rage at its passage, there is nothing they can do. We will meet their puppets on the battlefield and beat them to dust. The proletariat will triumph once more, and our dreams will slowly become reality.\n\nWe cannot vote again until next month. Now, let us hope our armed forces prevail against the darkness."
 socintern.31.a:0 "The revolutionary fire burns brightly!"
 socintern.32.t:0 "Military Aid Resolution Fails"
 socintern.32.d:0 "Our facade of a united socialist world has finally crumbled. What should have been a display of support for any proletarian revolution ended in bitter failure. The capitalists laugh at our indecision, and their hired butchers easily slaughter our comrades. We can only offer the most optimistic interpretation - that our member states feared this revolution was doomed, and therefore did not support it. At least doomed without our help. The military aid resolution, if passed, could have sent to the target nation every kind of military aid vital to the revolution, from piles of weapons to volunteers eager to fight for their comrades.\n\nYet we have let ourselves be divided. Some question what use a pan-socialist organization is if it cannot help other socialist states in desperate need. Others say that becoming mired in an endless conflict will only weaken our conviction in the world. In any case, it seems this uprising will have to fight alone. We can only wish them well.\n\nWe cannot vote again until next month. The Comintern was founded on the ideal of global uprising, but now it is left with only one question. If utopia fails to materialize, what then?"
 socintern.32.a:0 "It will fall apart, collapse with a crash, and die unnamed in the dustbin."
 socintern.33.t:0 "New CMEA Member"
 socintern.33.d:0 "Throughout history, the upper class has had a single goal - endlessly amassing wealth and power while exploiting the proletarian masses. To this, the Comintern says no: we reject the logic of capitalism, the idea that humanity and the Earth are numbers in a spreadsheet, a rising line on a chart, or a means to profit. We are united in opposing capitalist exploitation, helping one another build a new world.\n\nToday, the Congress voted to admit a new member to the CMEA, another step forward toward that new world. The new member will be eligible for economic aid, and their ties to fellow comrade states will be strengthened. The Congress will recess until the candidate accepts our invitation and the assembly approves admission."
 socintern.33.a:0 "Now we await their reply."
 socintern.34.t:0 "CMEA Invitation Rejected"
 socintern.34.d:0 "Since the bourgeoisie declares it will strangle every revolution in its cradle, they will not miss the slightest opportunity. Thus every movement and nation under the socialist banner must cooperate with comrades to build a system against bourgeois economic hegemony. Every Comintern member knows this well. Yet even knowing this certain truth, the full Congress voted against admitting a new member to the CMEA.\n\nWe do not know what prompted our comrades to make this decision, but they must know that if the red flag is to fly across the world, unity is the only truth. Selfishness has no place here. We can vote again in 30 days, but this display of lack of unity does not reflect well on us."
 socintern.34.a:0 "If we fight separately, every opportunity will be squandered."
 socintern.35.t:0 "[FROM.GetNameDefCap] invites us to join the CMEA"
 socintern.35.d:0 "Today we received an invitation from [FROM.GetNameDef] inviting our nation to join the Council for Mutual Economic Assistance. This new international organization's purpose is to aid the development of other less-developed nations through assistance and resource delivery.\n\nThey invite us as a full member, where we can receive economic aid and develop toward a socialist tomorrow. [FROM.GetAdjective] awaits our decision."
 socintern.35.a:0 "We accept gladly."
 socintern.35.b:0 "On economic matters, we prefer to remain independent."
 socintern.36.t:0 "[FROM.GetNameDefCap] accepts the CMEA invitation"
 socintern.36.d:0 "We have received word that the ruling party of [FROM.GetNameDef] has agreed to join the Council for Mutual Economic Assistance. They are now eligible for economic aid and many other benefits planned by the system. Soon, we will teach [FROM.GetNameDef] how to build an economy based on Marxist, socialist principles, toward a future free of capitalist exploitation."
 socintern.36.a:0 "Good!"
 socintern.37.t:0 "[FROM.GetNameDefCap] rejects our CMEA invitation"
 socintern.37.d:0 "Too bad, it seems [FROM.GetNameDef] does not intend to join the Council for Mutual Economic Assistance. Their ruling party's representatives politely but firmly declined our invitation, turning away this new organization and the economic aid that comes with it. Perhaps [FROM.GetNameDef] will be more interested in the future; but at this stage, joining the CMEA is not on their agenda."
 socintern.37.a:0 "A pity."
 socintern.400.t:0 "New Leader"
 socintern.400.d:0 "Word has arrived. Whether through invasion, rebellion, or coup, the pioneer of the socialist free world has fallen. In the face of defeat, the members of the Comintern Congress have closed ranks. We must avenge our fallen comrade, by whatever means. This is a heavy blow, but we have no time for despair. If we do not act immediately, the capitalists will destroy us one by one, and final destruction is only a matter of time. The vultures will tear the bones of socialist states apart, and only the sun can protect us.\n\nThus, it is necessary to choose a new Comintern leading nation. As the Comintern's second-greatest power, the Congress has elected our nation as the new leader of the socialist revolution. Now the torch has passed to us, and we will become the arsenal of the socialist revolution. Overcoming such a crushing failure will demand desperate struggle, and our enemies will not stand idly by. But if we triumph, a blazing flame will be kindled, sheltering our descendants and burning on endlessly, undampened even by the winds of time."
 socintern.400.a:0 "The road is long; do not falter."
 comecon.1.t:0 "Development Aid"
 comecon.1.d:0 "Our comrades are engaged in a great struggle, and helping them is our duty and responsibility. The working people of [From.GetName], from miners to soldiers, from bureaucrats to generals, are waging a sacred struggle. The world's bourgeoisie - from Germany's bloody, dark fascism to Japan's decaying imperialism, to the capitalist slavery corroding the American spirit - stand tall, looking down on the working class. In the fierce moral struggle against this scum, nationalism and greed sing a siren song, offering them release. The people of [From.GetNameAdj] are crying out to the other members of the Comintern!\n\nWe provide our allies with incalculable resources at any cost, but most important is our comradeship. Through this action, we liberate our overseas comrades from their struggle, helping them build their own promised land."
 comecon.1.a:0 "Brick by brick, shaping the whole world."
 comecon.2.t:0 "CMEA Aid Arrives"
 comecon.2.d:0 "Our comrades in the Comintern and CMEA have decided to answer our request and provide aid to us! Great sums of currency - utterly reliable, solid gold - cross borders and coasts into our treasury. All thanks to the helping hands of comrades worldwide. Though the aid has arrived and we are most grateful, we cannot celebrate yet. Before we smile at the wealth of our people and government, we must decide where to put our newly gained resources.\n\nWe can deposit it in our liquid reserves for a respectable financial return, but such gains come fast and go fast.\n\nWe can put it into various long-term projects that will benefit our weak economy in the future.\n\nWe can strengthen our dedication to socialism by distributing the wealth to impoverished workers, making our society more equal.\n\nUltimately, we must decide how to use these funds, and we will..."
 comecon.2.a:0 "Deposit it in liquid reserves."
 comecon.2.b:0 "Use it to stimulate economic growth."
 comecon.2.c:0 "Invest in improving living standards."
 comecon.3.t:0 "[FROM.GetAdjective] requests CMEA aid"
 comecon.3.d:0 "We have received a communique from our comrade in [From.GetName]:\n\nComrade,\n\nEven now, the streets are filled with the whispers of counter-revolutionaries, a desperate whisper born of being bound by struggle, the kind we once felt, the shackles of tyranny. There is not enough food, not enough work; the workers of [From.GetNameAdj] languish in despair. We are striving to maintain and build the revolution, but we must humbly ask our comrades abroad for help. If we can build our industry, our economy, and our people, then we can bring prosperity to every [From.GetNameAdj] person.\n\n- On behalf of all the people of [From.GetNameAdj]\n\nNow we must make a choice. Many in the government favor helping our revolutionary brethren overseas, but others believe our resources would be better used here. Ultimately, we must decide."
 comecon.3.a:0 "Give generously."
 comecon.3.b:0 "Now is not the time."
 comecon.4.t:0 "[FROM.GetAdjective] declines aid request"
 comecon.4.d:0 "We have received a communique from a foreign comrade whose aid request we previously made:\n\n\"Comrade,\n\nThough your request for economic aid is most important, we regret to inform you that we currently have no budgetary room. Our people need food and industry, our army needs equipment, our roads are being paved... we are sorry we cannot help in this moment to ease your suffering. But our commitment to our overseas comrades, like the undying spirit of the workers, remains unshaken.\n\n- Your comrade and brother in the world revolution.\"\n\nIt seems we must wait for the aid we want."
 comecon.4.a:0 "Better luck next time."
 comecon.5.t:0 "[FROM.GetAdjective] agrees to aid"
 comecon.5.d:0 "Our comrades in the Comintern and CMEA have decided to answer our request and provide aid to us! Great sums of currency - utterly reliable, solid gold - cross borders and coasts into our treasury. All thanks to the helping hands of comrades worldwide. Though the aid has arrived and we are most grateful, we cannot celebrate yet. Before we smile at the wealth of our people and government, we must decide where to put our newly gained resources.\n\nWe can deposit it in our liquid reserves for a respectable financial return, but such gains come fast and go fast.\n\nWe can put it into various long-term projects that will benefit our weak economy in the future.\n\nWe can strengthen our dedication to socialism by distributing the wealth to impoverished workers, making our society more equal.\n\nUltimately, we must decide how to use these funds, and we will..."
 comecon.5.a:0 "Deposit it in liquid reserves."
 comecon.5.b:0 "Use it to stimulate economic growth."
 comecon.5.c:0 "Invest in improving living standards."
 comecon.6.t:0 "Invest in CMEA Fund"
 comecon.6.d:0 "To spread the ideals of socialism and equality to every corner of the world, we have decided to devote a portion of our nation's budget to helping our CMEA comrades prosper. These funds will be used to drive the economic development of our socialist brethren, from construction and investment to social assistance programs lifting impoverished workers out of poverty. If we are hit by economic crisis and need financial support, or merely need funds for investment projects, we can withdraw the money. But for now, we have deposited it for use by our comrades worldwide.\n\nNow that we have agreed on our modest contribution to the fund, we must decide on the amount."
 comecon.6.a:0 "Deposit 1% of the budget."
 comecon.6.b:0 "Deposit 2.5% of the budget."
 comecon.6.c:0 "Deposit 5% of the budget."
 comecon.6.e:0 "Deposit 7.5% of the budget."
 comecon.7.t:0 "Withdraw from CMEA Fund"
 comecon.7.d:0 "To spread the ideals of socialism and equality to every corner of the world, the CMEA established a Common Monetary Fund. Those who invest in national development for the people's benefit use this fund, undertaking simple infrastructure projects and social assistance programs. How these funds are used is up to the withdrawing government, and we choose to leverage the financial power accumulated by the CMEA. However, though the money we withdraw from the fund will certainly help our plans, there will be less for our comrades in the future. Of course, our ambitions require more financial support. So far, all of this is within our control.\n\nOur withdrawal has been approved; now we must decide how much we need."
 comecon.7.a:0 "Withdraw 10% of the fund."
 comecon.7.b:0 "Withdraw 25% of the fund."
 comecon.7.c:0 "Withdraw 50% of the fund."
 comecon.8.t:0 "Invest in Collective Defense Fund"
 comecon.8.d:0 "To spread the ideals of socialism and equality to every corner of the world, we have decided to devote a portion of our nation's budget to protecting the Comintern's comrade states. Those who need resources to sustain the revolution will use this fund, and our contribution will be vital in the years ahead. If we need financial support, we can withdraw a portion of the fund in the future when we are in great need. Of course, to ensure the sanctity of its use, only those who wage war in the interests of the working class may use this fund.\n\nNow that we have agreed on our modest contribution to the fund, we must decide on the amount."
 comecon.8.a:0 "Deposit 1% of the budget."
 comecon.8.b:0 "Deposit 2.5% of the budget."
 comecon.8.c:0 "Deposit 5% of the budget."
 comecon.8.e:0 "Deposit 7.5% of the budget."
 comecon.9.t:0 "Withdraw from CMEA Fund"
 comecon.9.d:0 "To spread the ideals of socialism and equality to every corner of the world, the Comintern established a revolutionary aid fund. Those who need resources to sustain the revolution will use this fund; given that we are waging conflict in the interests of the working class, we meet the aforementioned criteria. However, though the money we withdraw from the fund will help our ongoing battle, there will be less for our comrades in the future. Of course, our current struggle may justify needing more financial support. So far, all of this is within our control.\n\nOur withdrawal has been approved; now we must decide how much our struggle will require."
 comecon.9.a:0 "Withdraw 10% of the fund."
 comecon.9.b:0 "Withdraw 25% of the fund."
 comecon.9.c:0 "Withdraw 50% of the fund."
 comecon.10.t:0 "[FROM.GetAdjective] Investment in the CMEA Scientific Bureau"
 comecon.10.d:0 "In brief, the fatal flaw of capitalist ideology is that it subsidizes the inner greed of the human heart. This subsidy comes from a vicious focus on competition, where only the \"fittest\" survive. The common argument is that competition drives innovation, and America's industrial success is often cited as proof. Yet now a new view has emerged. Though there is a factor of inter-corporate competition, America's mastery of technology exists not solely because of competition but more because of the drive to squeeze every last drop of blood and sweat from the wretched worker.\n\nToday, we have joined a greater organization, no longer fighting petty, barbaric battles over knowledge that should be shared. Today we have discovered that through scientific cooperation, we will build the international socialist future of everyone's dreams. Today we have joined comrades from every corner of the world in joining the CMEA Scientific Bureau. Unity is strength, not weakness, and the people always come first."
 comecon.10.a:0 "Let a hundred flowers bloom."
 comecon.11.t:0 "[FROM.GetAdjective] Industrial Aid Arrives"
 comecon.11.d:0 "Blueprints, experts, funds. The old trio, sent by our foreign comrades. With these, we can raise our industrial level. We can use the resources in hand in different ways, and we will start now. The simplest way is to build a new factory somewhere in our country; the blueprints and funds are all in place. On the other hand, we can also use these blueprints and consult the foreign experts sent to us to learn about productivity and labor efficiency, adopting new methods and models of innovation and efficiency. Of course, we have a third option - use this money to produce more machinery and equipment for our economy.\n\nThe choice is before us. What shall we do?"
 comecon.11.a:0 "Use this aid to develop manufacturing."
 comecon.11.b:0 "Invest in producing high-quality industrial equipment."
 comecon.11.c:0 "Use it to train excellent professionals."
 comecon_tech_group_name:0 "CMEA Scientific Bureau"
 comecon_tech_group_desc:0 "The CMEA Scientific Bureau is an international collective research organization established by the Comintern, and also the R&D arm of the CMEA. Its philosophy is mutual assistance and joint research, driving rapid scientific and technological development in developing nations so they can catch up with the technological level of other CMEA member states."
 TNO_socintern_member:0 "Comintern Member"
 TNO_socintern_associate:0 "Comintern Associate Member"
 COMECON_FOUNDED: "The §SCMEA§! has been established."

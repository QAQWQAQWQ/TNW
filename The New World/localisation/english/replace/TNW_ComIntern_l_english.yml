 SOCINTERN_VOTE_NON_AGGRESSION_PACT_TITLE:0 "§WMultilateral Non-Aggression Initiative§!"
 SOCINTERN_VOTE_NON_AGGRESSION_PACT_DESC:0 "§gPropose an initiative to all §RComintern§! members to formally declare an agreement of mutual respect for sovereignty and territorial integrity, and non-aggression against all other §RComintern§! members.\n\nMember states will pledge to recognize each other's borders and sovereignty over their territory, and not to invade the territory of other member states.§!"
 SOCINTERN_VOTE_COMECON_TITLE:0 "§WEstablish the §SCMEA§!§!"
 SOCINTERN_VOTE_COMECON_DESC:0 "§gPropose founding the §SCouncil for Mutual Economic Assistance§!, an organization that will fund the development and construction of socialist states. The §SCMEA§! will provide not only financial support to socialist states but also debt relief or emergency assistance for defense spending during wartime.\n\nAll member states may donate funds to the §SCMEA§!, and may also contribute to non-Comintern states in the name of international solidarity.§!"
 SOCINTERN_VOTE_COMECON_SCIENCE_TITLE:0 "§WEstablish the §SCMEA§! Scientific Bureau§!"
 SOCINTERN_VOTE_COMECON_SCIENCE_DESC:0 "§gPropose founding a Scientific Bureau under the §SCMEA§!. The §SCMEA§! Scientific Bureau will serve as a multinational cooperative research institution under the §RComintern§! framework, making great strides in scientific research and the development of §SCMEA§! nations. Its mission will be to coordinate cooperative research and help developing nations rapidly catch up technologically with other §SCMEA§! states.§!"
 SOCINTERN_VOTE_INVITATION_TITLE:0 "§WGrant [SOCINTERN_INVITED.GetName] §Rmember status§!§!"
 SOCINTERN_VOTE_INVITATION_DESC:0 "§gPropose immediately issuing an invitation to the ruling party of [SOCINTERN_INVITED.GetNameDef] for §RComintern§! membership. If they accept, they will be immediately absorbed into the §RComintern§!, gaining voting rights in the Comintern Congress and access to all §RComintern§! programs.\n\nAll diplomatic actions, such as signing non-aggression pacts, will also be extended to [SOCINTERN_INVITED.GetNameDef] as part of §RComintern§! policy.§!"
 SOCINTERN_VOTE_ASSOCIATESHIP_TITLE:0 "§WGrant [SOCINTERN_INVITED.GetName] §lassociate member status§!§!"
 SOCINTERN_VOTE_ASSOCIATESHIP_DESC:0 "§gPropose immediately issuing an invitation to the ruling party of [SOCINTERN_INVITED.GetNameDef] for §RComintern§! associate membership. If they accept, they will immediately join the §RComintern§! as an associate member and may later apply for full membership.\n\n[SOCINTERN_INVITED.GetNameDef] will not be included in relevant policy considerations until they become a full §RComintern§! member.§!"
 SOCINTERN_VOTE_INTERNATIONAL_BRIGADES_TITLE:0 "§WForm §xInternational Brigades§!§!"
 SOCINTERN_VOTE_INTERNATIONAL_BRIGADES_DESC:0 "§gPropose establishing an organization under the §RComintern§! to provide underground military aid to revolutionary movements. The §xInternational Brigades§! will provide passports, weapons, and transport services to those who wish to aid foreign socialist revolutions.\n\nThe organization's establishment will allow §RComintern§! member states to dispatch International Brigades to aid socialist states at war, providing a one-time military bonus.§!"
 SOCINTERN_VOTE_SPHERIFICATION_TITLE:0 "§WIncrease §SCMEA§! Centralization§!"
 SOCINTERN_VOTE_SPHERIFICATION_DESC:0 "§gPropose further centralizing the §SCouncil for Mutual Economic Assistance§! to raise mutual aid, eliminate trade barriers, and conduct more productive economic cooperation between socialist states.\n\nAfter this reform, the §SCMEA§! will take the world stage independently as an economic bloc.§!"
 SOCINTERN_VOTE_SPHERE_INVITATION_TITLE:0 "§WInvite [COMECON_INVITED.GetName] to join the §SCMEA§! economic bloc§!"
 SOCINTERN_VOTE_SPHERE_INVITATION_DESC:0 "§gOffer the ruling party of [COMECON_INVITED.GetNameDef] full integration into the §SComintern§! economic sphere. If they accept, they will immediately join the economic sphere, achieving closer economic integration with other §RComintern§! members.\n\nComintern members not yet in the §RComintern§! economic sphere are eligible for invitation only if they do not belong to any economic sphere at the time of voting.§!"
 SOCINTERN_VOTE_VOLUNTEERS_TITLE:0 "§WProvide §xmilitary aid§! to [SOCINTERN_VOLUNTEERS_PREV.GetName]§!"
 SOCINTERN_VOTE_VOLUNTEERS_DESC:0 "§gPropose dispatching §xInternational Brigades§! to aid [SOCINTERN_VOLUNTEERS_PREV.GetNameDef] in their conflict. The §xInternational Brigades§! will be contributed by Comintern member states and recalled after the conflict ends.\n\nAdditionally, if the §SCMEA§! has been established, material aid may also be provided to [SOCINTERN_VOLUNTEERS_PREV.GetNameDef].§!"
 SOCINTERN_NONE_TITLE:0 "§WNone§!"
 SOCINTERN_NONE_DESC:0 "§gThe Comintern is currently not voting on any resolution.§!"

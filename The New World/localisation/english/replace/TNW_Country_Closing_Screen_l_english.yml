 TNO_CountryClosing_epilogue_generic: "Thank you for playing through a full nation's content! The enormous body of work in this mod is, of course, thanks to our team, but none of it would exist without you - the players whose support has been indispensable in creating this magnum opus: high-quality shitposting, intense group chat activity, comments on dev logs, and joining the great TNO community.

Be sure to visit our social media sites - click the question mark button in the top right of the start screen for links.

Also, stay tuned for more. TNO will continue to be updated, including but not limited to bug fixes, patches, content updates, and new nations. There will eventually be a major update extending the timeline to 1982, and a new bookmark!"
 TNO_CountryClosing_epilogue_USA_Chep_Success: "Winds of progress blow across America. From New York to San Francisco, from San Antonio to Juneau, the great cities are thriving and alive. Citizens walk along well-paved roads into spacious, bright factories and offices, beginning a new day's work. They enjoy the ease of leisure and the pleasure of long-distance travel, wondering where these roads will take them. Under the leadership of Philip Hart and Chep Morrison, America has successfully transformed, striding forward toward a better future.

True, not every hardship has been overcome: war persists, discrimination remains, and human suffering has not vanished. These creations of the devil cannot be defeated, let alone destroyed - but the torch of freedom burns against the dark horizon, brighter than ever. America is ready, and waits only for tomorrow's challenges."
 TNO_CountryClosing_epilogue_USA_Chep_Failure: "The air across America is foul and choking. From New York to San Francisco, from San Antonio to Juneau, America's cities decay. Public schools in the South are understaffed. Abandoned factories along the Great Lakes begin to rust. Whites and the wealthy flee to suburban enclaves, while poor minority communities are left behind, struggling against scarce resources and political indifference to their plight. By every measure, Philip Hart and Chep Morrison's ambitions have come to nothing. Stagnation is a fait accompli.

True, not every hardship has been overcome: war persists, discrimination remains, and human suffering has not vanished. These creations of the devil cannot be defeated, let alone destroyed. Amid the chaos, the torch of freedom grows dim on the dark horizon. Whether America can meet the challenges ahead is a question for another administration."
 TNO_CountryClosing_epilogue_USA_Schlafly: "Who are we? What are we doing? What have we done to one another? Contradictions intensify, arguments spread, and these questions confound countless Americans. They do not recognize their neighbors, cannot make out this country, and cannot even see through themselves, left with nothing but anger and frustration. For better or worse, Phyllis Schlafly has exposed the rot at the core of the American system.

True, not every hardship has been overcome: war is coming, discrimination prevails, and human suffering has not vanished. These creations of the devil cannot be defeated, let alone destroyed. But in America, fires burn fiercely, and threats loom larger than ever. Brothers fight brothers, but whether this nation will stand or collapse will only be known when this radical new government has run its course."
 TNO_CountryClosing_epilogue_USA_Yock_and_Hall_Torture: "America is torn apart, this division visible on sorrowful faces, in boarded-up storefronts and burned-out churches. From neighbors to communities to governments, people have lost faith in everything; they no longer hope in this nation or the ideals it rests upon. Perhaps before long, the final reckoning will come, when every citizen must face their own sins.

Naturally, America's collapsed institutions did not prevent the crisis - if anything, they poured oil on the flames. War spreads, prejudice endures, and suffering and repression fall upon everyone, innocent or guilty. The torch of freedom has been extinguished, and demons run rampant; what happens next, and how they will enjoy this feast of violence, is unknown. For now."
 TNO_CountryClosing_epilogue_USA_Generic: "America holds its breath; after the turbulent sixties, it enters a new era with a new face. Powerful new technologies begin to emerge, new leaders gradually take the reins, and a new generation goes to the polls.

True, not every hardship has been overcome: war persists, discrimination remains, and human suffering has not vanished. These creations of the devil cannot be defeated, let alone destroyed. But so long as the torch of freedom burns above this dark horizon, America will endure."
 TNO_CountryClosing_epilogue_GNG_Morita_Success_Ending: "Sony and Cheung Kong have gradually established a way of life: Guangdong glows under neon and cathode-ray light. Akio Morita, Li Ka-shing, and Stanley Ho have achieved what seemed impossible: reshaping this corporate experiment according to their own vision, and molding themselves into tycoon-managers rooted in the Silicon Triangle, rising from among the Cantonese.

Yet as Morita and Li look back at the nation they have built, they see gathering clouds. Two suns hang in Asia's sky, one red and one white, burning away the shadow between them. Guangdong's room to maneuver between the Republic of China and the Empire of Japan shrinks by the day, and no one dares ask how it will end. All fear Guangdong will lose its last foothold and simply vanish.

In [GetYear], the two Cantonese masters of Guangdong will face together the threat that has long hung over them: clutching that hair-thin chance, they will fight to survive."
 TNO_CountryClosing_epilogue_GNG_Sony_Morita_Failure_Ending: "Though Sony and Cheung Kong have built a neon nation, with Guangdong shining within it, Akio Morita feels only the ghost of doom hovering overhead. Nearly twenty years ago he was expelled from Japan, and Tokyo Tsushin was destroyed by his own hand. Not long ago, he nearly fell into Masaru Ibuka's grasp, cheating death once more.

Though Guangdong gradually recovers from the turmoil, the Administrator increasingly leaves more and more government affairs to Li Ka-shing, retreating to Sony headquarters. In Guangdong, personal power is but an extension of corporate power. To Morita, the failed takeover bid against Sony is a harbinger of threats to his own survival. Even the escalating tensions between Nanjing and Tokyo weigh less heavily than this.

In [GetYear], a simple yet certain thought burns in Morita's mind. Ibuka may have forged the feud between them, but Morita will personally end it."
 TNO_CountryClosing_epilogue_GNG_Sony_Li_Failure_Ending: "Guangdong glows with light everywhere, but in Li Ka-shing's eyes there is only endless darkness. Beyond Sony and Cheung Kong's reach lies the hazy borderland of the law - where murderers and thugs hide.

Long ago, the young capitalist told the world he would spare no effort to serve all Chinese willing to work hard. Privately, he also admitted he would do anything for a taste of the high-society luxury reserved for the Japanese - an honor he could only access in partnership with Morita. But now, surrounded by the space where his wife should have been, Li suddenly finds his success has lost its joy and meaning. He cannot make promises to the people again - not after paying such an immense price for them. The cloud of Sino-Japanese friction looms, and Li Ka-shing has lost his way.

In [GetYear], Li Ka-shing returns to his post and begins to work. In his heart remains a faint hope that all this will fill the hunger in his soul."
 TNO_CountryClosing_epilogue_GNG_Matsushita_Success_Ending: "Matsushita Electric rules Guangdong; all under heaven belongs to Matsushita.

Matsushita is ecstatic. Once he held high office, sharing Guangdong's profits with others. Now he stands above them all, directing benefits, gathering fame, doing as he pleases. He shows mercy, feeding workers and rewarding allies; he nurses wrath, watching rivals suffer and enemies perish. Now the nation is Matsushita, and Matsushita is the nation; personal, corporate, and common interests are indistinguishable in a private kingdom. Even as rumors of war fill the streets, this is Matsushita's supreme triumph.

In [GetYear], Matsushita proves to the world: his word is law, and his fate is his alone to command."
 TNO_CountryClosing_epilogue_GNG_Matsushita_Failure_Morita_Ending: "In Guangdong, Matsushita Electric is supreme, but its leader, Matsushita, is nowhere to be seen. He is like a captain no longer at the helm - and that is a reflection of reality. The great ship sailing forth belongs no longer to Matsushita, but to Morita.

Rule means pursuing unique personal power. This is easy to understand, very simple, and easy to manipulate. When all is calm, Matsushita fancies himself master of Guangdong; when storm waves rise, Matsushita bows to those of greater principle. Before long, his "benevolence" serves the interests of Sony and Cheung Kong. He sits high, but the documents he reads were not written by him; he stands on stage, but the speeches he gives are not his own.

In [GetYear], private plunder still "glows" as do all other principles of rule. As for Matsushita, he is simply a man unworthy of his station."
 TNO_CountryClosing_epilogue_GNG_Matsushita_Failure_Ibuka_Ending: "In Guangdong, Matsushita Electric is supreme, but its leader, Matsushita, is nowhere to be seen. He is like a captain no longer at the helm - and that is a reflection of reality. The great ship sailing forth belongs no longer to Matsushita, but to Ibuka.

Rule means pursuing unique personal power. This is easy to understand, very simple, and easy to manipulate. When all is calm, Matsushita fancies himself master of Guangdong; when storm waves rise, Matsushita clutches tightly to those of greater principle - in other words, kneeling before Ibuka's every demand. Matsushita gradually fades away, as do the ministry heads and Legislative Council clerks under his command.

In [GetYear], private plunder still "glows" as do all other principles of rule. As for Matsushita, he is simply a man unworthy of his station."
 TNO_CountryClosing_epilogue_GNG_Ibuka_Persistence_Ending: "Ten generations after Adam's birth. God saw that man had entered an ungodly age, and sent rain for forty days and forty nights, and the flood rose for a hundred and fifty days. Every living thing with the breath of life in its nostrils, on dry land, died; and God let them begin again upon the earth.

Ibuka knows of course that this legend is fiction - but what in this world is not? Compassion? Trust? Morality? Pan-Asianism? Whether throwing Molotovs at storefronts or killing over a few lines on an East Asian map, humans always find the stupidest reasons to justify what they do. If fiction is man's way of comforting himself, then Ibuka's indulgence in it is only natural: Fujitsu is his ark, and its blue-white light is the flood, drowning forever every color and sound in his mind.

In [GetYear], the 4321st year after God wiped out all living things. By God's grace, the second flood will come soon."
 TNO_CountryClosing_epilogue_GNG_Ibuka_Reconciliation_Ending: "Ibuka is a prophet and a "dream-seer"; now he realizes that both were but dreams of his own making. He yearned for success, hoping to reach the fulfillment he so craved through a Guangdong he did not want. Guangdong has become his absurd marionette - and everything he is, his dreams, have broken one by one as the puppet twists and strings snap; in the end, only ruins remain.

After the riot storm that swept away every pretense, Ibuka decided to loosen his grip on the country. His supporters breathed a sigh of relief; his opponents condemned him for opening the door to political and social upheaval. But now he believes only one thing: listening to others is always better than personal despotism. For no great vision is the work of one man; to insist on one's own way is to end only in disillusionment.

In [GetYear], the flickering light of Guangdong's future will grow dimmer. Perhaps that is for the best."
 TNO_CountryClosing_epilogue_GNG_Komai_Manchurian_Ending: "Perhaps Komai seized control of Guangdong with a borrowed gun. Now the day of repayment has come.

While the tycoons in the Legislative Council bicker over trivialities, Komai has served greater powers - and always fulfilled their wishes. Mangyo has always eliminated rivals by foul means, and Komai has become their wedge into Guangdong; for Manchuria's benefit, he will drain Guangdong's vitality dry. Now that Komai holds power safely, in these stormy times, such an investment must be protected - a fine excuse to grow closer to those who rule in Xinjing. Whether through money, favors, or outright intimidation, Komai never forgets who his true master is.

In [GetYear], Guangdong enters a grim future under its new master: one head in Guangzhou, the other in Xinjing."
 TNO_CountryClosing_epilogue_GNG_Hitachi_Personalist_Ending: "Perhaps Komai seized control of Guangdong with a borrowed gun. But he never intended to repay the debt.

Neither business nor politics tolerates petty quarrels or the slightest discord. The Legislative Council's unscrupulous members are hopeless, and Suzuki is unfit for office; only Hitachi can fulfill Guangdong's original purpose, turning Guangdong and its people into cogs in a merciless machine. Violence has indeed broken out, but Komai knows how to handle that too, and no one dares question his methods now. The Legislative Council, Mangyo, Manchukuo, and even Japan itself must all acknowledge: baptized in the blood of millions, Komai the corporate warlord has become a power unto himself. The Republic can only sharpen its knives and watch through gritted teeth.

In [GetYear], under its new master, Guangdong enters a grim future. All life and freedom are at the mercy of one man's will."
 TNO_CountryClosing_epilogue_GNG_IJA_Failstate_Normal_Ending: "The Guangdong State was a creation of the Japanese government, and so it too must perish.

Where once the streets were filled with company limousines and the coolies who served them, now there are only soldiers and tank crews standing watch at every intersection. Blood has not yet congealed in the gutters; shots ring out in the back alleys as the last rioters are executed for their crimes. The population has shrunk under military control: the Chinese government condemns Japan's heavy-handed intervention, while Japan argues its actions were necessary in the face of street revolution. If words fail, then the soldiers stationed on the border will take the stage next.

In [GetYear], Guangdong has entered the history books. Not for the conditions it lived in, but for its shameful destruction."
 TNO_CountryClosing_epilogue_GNG_IJA_Failstate_Hitachi_Ending: "The Guangdong State was a creation of the Japanese government, and so it too must perish. The embers of resistance may yet become a firestorm sweeping all Asia.

Where once the streets were filled with company limousines and the coolies who served them, now there are only soldiers and tank crews fighting a desperate battle through every street and alley. Chinese who refuse to accept Hitachi's bloody rule rise up and give their lives, their blood flowing only into the gutters. Komai is dead, and no one is held accountable for the wound bleeding from Guangdong: the Japanese justify their intervention as a necessary evil (contradicting what they leave unsaid), even as China rushes troops to the border and expresses outrage at the suffering of its Chinese brethren. Diplomats argue, and the generals will take the stage imminently.

In [GetYear], Guangdong has entered the history books. Not for the conditions it lived in, but as a footnote to the horror of the slaughter to come."

 TNO_CountryClosing_epilogue_Ukraine_communist_victory_UCW: "The people celebrate victory; the soldiers shout it. When Shumsky announced on the radio that the statues of Adolf Hitler and Erich Koch had been torn down, the sound of triumph echoed around the world.

Yet victory cannot feed the people, nor bring back the dead.

Ukraine, ravaged by war and scourged by famine, has become a wasteland. The Hunger Plan and two decades of genocide have carved wounds to the bone, and the soldiers' idealism and communist theory cannot heal them. As the Germans retreated, they burned the fields, razed the cities, and blew up the dams, leaving nothing but scorched earth. Fate has placed the burden of rebuilding Ukraine on the communists. They need years to complete the task, but in truth they have only months. German armies have regrouped, planning to swallow Poland, the Ostland, and Ukraine once more.

In [GetYear], the ghost of fascism snarls at Ukraine: twice is too many; a fate of being devoured piece by piece awaits you."
 TNO_CountryClosing_epilogue_UPA_Klyachkivsky_victory_UCW: "After decades of blood and tears, Ukraine's most loyal sons have at last rescued her from the hands of the profane, avenging the greatest defender, Stepan Bandera. But they know well: the story has only just begun. Though the degenerates, traitors, and invaders have been swept away and Ukraine's sickness thus cured, her rightful lands lie scattered still.

This cannot be borne - not now, when the filth of Germania's nest still breathes. Another war with the Third Reich is inevitable, and every inch of Ukrainian territory is needed for final victory. Whatever divisions exist among our commanders, the necessary duty is clear.

The motherland's lands are torn apart, with vile usurpers squatting upon them: Poles, Hungarians, Romanians, and the German remnants in Crimea. Every last one of them must be rooted out, not a single one left. We will give them a final chance to repent their crimes and wash away their sins; if they refuse, annihilation awaits. In [GetYear], whatever the cost in resources, whatever the time, whatever the martyrs, we will make Ukraine whole again. If the world objects, let it come."
 TNO_CountryClosing_epilogue_UPA_Shukhevych_victory_UCW: "Klyachkivsky was nothing but a mad dog. That frenzied vengeance, disguised as love for Ukraine, shattered his spirit. To spare him from destroying the nation, it was right to send him to the grave. Stetsko was nothing but a wretch. He would sell the motherland to the German rats for a mere pittance. Only Shukhevych stands tall, worthy of the Führer's place. He will take up Ukraine's mantle.

The task before the new Führer is immense: he must rebuild a nation sunk in the mire for twenty years, and reunite her people. If the Führer wishes to keep the Ukrainian people loyal against the German corrosion that has plagued this land, he can rely on nothing but the promise of unity. Shukhevych's speeches place this principle first, but the problem does not disappear. Will the bonds of unity be strong enough to withstand the inevitable German catastrophe and stop it from devouring all of Ukraine?

In [GetYear], the answer will be revealed."
 TNO_CountryClosing_epilogue_UPA_Stetsko_victory_UCW: "For too long Ukraine has had no guiding light. Since Bandera's death, the UPA and Ukraine itself have lost their way, forgotten by the world. Stetsko's victory changes that.

Klyachkivsky unearthed the power buried in Ukraine's blood and soil, but his eyes were blinded by hatred, so he did not know how to wield it. Stetsko has found the way: he realized that National Socialism is not merely an ideology but a science, a grand blueprint for building an organic racial state.

Glory lies on the far shore, and our road is long. The chaos of the Ukrainian nation still swirls in the wind, yet Stetsko is confident that, so long as Germany and Italy give him time, he will lead the masses to feast with the Aryan gods of Olympus. Under the New Order, only one man's will, resolve, and endurance can save the nation.

In [GetYear], Stetsko will pave the road, and the Ukrainian people will bask in the same German sun."
 TNO_CountryClosing_epilogue_Ukraine_Brautigam_victory_UCW: "Brautigam and the reformist current have unexpectedly won out in Ukraine, setting the nation on a new path toward freedom. Yet the Reichskommissariat still exists; its history of exploitation and racism runs deep, and its institutions were only consolidated after the civil war victory. Most outside observers consider it a straightforward colony.

Brautigam is always an idealist; to him, these are merely temporary obstacles on the road to success. He will lead Ukraine, focusing on easing the oppression of the Ukrainian people. If circumstances are favorable, he will devolve power to Ukrainians, allowing them to develop within a democratic polity. In [GetYear], anything seems possible.

So long as Germania permits his actions."
 TNO_CountryClosing_epilogue_Ukraine_Leibbrandt_victory_UCW: "Leibbrandt has worked hard to defeat the opposition and eliminate the partisans, but has earned only paltry rewards. He inherited a Ukraine shattered, torn apart by civil war. The Ukrainian nation has long given up hope of a seat at the negotiating table, asking only for crumbs to feed their families.

Leibbrandt promises to solve all problems, reviving the country along Rosenberg's line while remaining loyal to Hitler. Yet promises are easily made, and hard to keep. Leibbrandt has placed his sympathy for Ukraine below the colonial mission, and dutifully ignored the contradiction between them. In [GetYear], Leibbrandt knows: National Socialism can solve all of Ukraine's ills.

But for this nation, whose last chance at true freedom has been crushed beneath an iron heel, which has lost everything it had to lose - does this so-called truth mean anything at all?"
 TNO_CountryClosing_epilogue_Ukraine_Ohlendorf_victory_UCW: "If anyone wonders what becomes of nations under fascist rule, they need only look at Ukraine. Partisans rose up, fought, starved, and were slaughtered. Her people are once again bound in chains; their broken bodies are buried in the mire, their spirits and souls torn asunder.

What has the monster that enslaved them done? Endless violence reclaimed Germany's breadbasket, but all the victors dug up was a corpse of Ukraine. Worse still, they have learned nothing from the suffering they inflicted.

Once again, National Socialism has conquered Ukraine, but this time is different. The new Kommissar, Otto Ohlendorf, will achieve what his predecessors could not: German control of Ukraine will be unshakable, brutally efficient, and eternal. In [GetYear], the future of fascism is answered in Ukraine: it is the boot, grinding people into the dust forever, for the sake of all eternity."
 TNO_CountryClosing_epilogue_UNRA_Dziuba_victory_UCW: "Ukraine's culture was once regarded by German bureaucrats as a latent disease, quickly purged in the sixties with National Socialist medicine. Now, on the republican tide, it rises from the ashes. The Ukrainian People's Republic has gone from dream to reality, gradually regaining its strength.

Ivan Dziuba helms this cultural revolution. He is not merely a leftist or a populist; more importantly, he is a nationalist. His goal is to sustain momentum through his unique political brand, reviving the Ukrainian culture that was once on the brink of extinction. The Ukrainian land will enjoy the prosperity it deserves; the Ukrainian people will take pride in their identity; the Ukrainian nation will further refine itself.

In [GetYear], before dreaming of a bright tomorrow, one question must be settled: Germany's return is certain; does Dziuba know how Ukraine's new renaissance can survive in these circumstances?"
 TNO_CountryClosing_epilogue_UNRA_Ohloblyn_victory_UCW: "The Ukrainian People's Revolutionary Army, after an arduous struggle, has successfully built a nation defined by freedom and human rights - something the German government cannot abide. Yet a collaborationist faction of former collaborators, at a disadvantage given their short record of democratic participation, has nonetheless returned to power. In Kiev under German rule they were slaves; in Kiev under Ukrainian rule, they have entered the halls, taking seats as president and ministers.

President Oleksander Ohloblyn has set his first and only priority. Ukraine must, at all costs, win back German favor. Not remaking the republic through revolution and progress, but measuring itself against the fastidious tastes of distant Germania - a most difficult task. Nazi fanaticism and fascism are unchanged, so a republic groveling to Germany is utterly misnamed.

In [GetYear], before Germany has even launched its invasion, the Ukrainian revolution has been strangled in its cradle."
 TNO_CountryClosing_epilogue_UNRA_Stus_victory_UCW: "Peace is thin as ice; collaboration is rotten as dead wood. The Ukrainian People's Revolutionary Army first drove the German occupiers from their homeland, then subdued the Banderites and communists, yet their ideological differences remain too great to bridge. To expect social democrats, liberals, and collaborators to maintain their alliance forever is a distant dream.

But whatever their conflicts and divisions, all must remain vigilant. Time waits for no one; catastrophe is near. The Nazi war machine's thunder roars ever louder; the question is not whether it will return, but when.

Whatever happens, if they are to stand against the inevitable cruelty of the Nazis, Ukraine's leaders must reach consensus. In [GetYear], Ukraine's darkest hour has come; may God be with her, for no one else can save her now."
 TNO_CountryClosing_epilogue_ENG_Butler_Demo_Ending: "Papers are endless, time is short. Britain drags her shrunken frame, gasping, having paid the maximum price for drawing too close to that well-known demon. Yet in the history of Free Britain, even this chapter, however bleak, has a thread of hope running through it. May it be true.

If anyone beyond Whitehall understands what Rab Butler's name means, it is the need to inherit the office entrusted to him, to sit in it for decades to come, pouring every last scrap of strength, vitality, and skill into the vision of a new Britain. From the start, all in Butler's inner circle fixed on one goal: a socio-economic revolution through the benevolent hand of the state. There is also the need to continue fighting Butler's old rivals, the remnants of the old order.

In [GetYear], Rab Butler has become the greatest public servant on this soil. Britain looks back to a time when democracy still ruled the fair isles. But as a veteran of over forty years' struggle, Butler is an old man. He once selected an heir, but now that must be reconfirmed. Britain stands at the crossroads; only time will know which road she takes."
 TNO_CountryClosing_epilogue_ENG_Wallop_Soccred_Demo_Ending: "Unease hangs over all Britain. Word comes from Downing Street that the new Social Credit will drive the economy. City dwellers frown, confused and worried. Country folk want only to understand what "rurality" means, and what it will mean for their livelihoods. Anyone who opposes the government's new course, whether a former collaborator or not, is crushed one by one, in wretched circumstances. The stench of total defeat hangs over the land.

Gerard Wallop, on the other hand, has never been more elated. Why should a man not do this? He dreamed of shattering the remaining shackles of financial hegemony, chasing the grand design he held for Britain - and the dream has never been closer. The international finance barons are silent; they know England will reinvest her capital, redirecting it to the vital sectors that once led the nation to the summit.

In [GetYear], Britain has made her choice. Whether she will regret it, only time will tell."
 TNO_CountryClosing_epilogue_ENG_Wallop_Britfash_Demo_Ending: "When Domvile died and Noel-Baker was pushed into Downing Street, most thought the institution, besieged since 1956, would hear its own death knell. But the outcome surprised nearly everyone - save the old guard. Not only did they weather the crisis, they seized back every seat in parliament.

Society gentlemen and ladies gather in their gilded halls and country houses, celebrating Gerard Wallop's ascent to a fourth term as Prime Minister. Over flowing cups, they toast the next twenty years of glory, bloom, and power. Meddlesome pragmatists and treasonous theorists have been swept out, and at last they can realize their vision and hopes for Britain.

In [GetYear], the deluded minds once trapped in Westminster stand atop the kingdom. Like sculptors, they treat the nation as clay, kneading it with their own hands into the ideal shape. Gold above, rot beneath; this picture of a fascist kingdom, unprecedented in history, has never been so vivid."
 TNO_CountryClosing_epilogue_ENG_Fountaine_Demo_Ending: "Andrew Fountaine once prayed for such a scene: a hero descending from the heavens to save a broken, depressed, traumatized nation. Now, the chance has come. All Britain, and indeed the world, will witness what modern fascism truly looks like.

For decades, this nation existed only in Fountaine's fantasies. He was trapped in his own mind, and so were its people. Too many had assumed that the motherland, swallowed by fascism, could never rise again on a new ideological stage, merely lurching from one stagnant path to another. The uprising proved them wrong. Fountaine spent decades trying to complete the puzzle, and now the last piece is in his pocket. All he must do is place it.

In [GetYear], Fountaine will lead Britain into the future. The goal is clear, yet obscure. What is certain is that Fountaine will carry his dream through to the end, whatever comes. Where Britain goes, no one can know."
 TNO_CountryClosing_epilogue_ENG_Jordan_Demo_Ending: "We stay home, staring out the window. What we see beyond it we cannot understand. Only trembling and shaking. The noise is deafening; we cannot hear. Only dread and cold. Restful sleep is a distant dream, for the dictator speaks on the radio day after day. He promises unity, but we are sure it is a synonym for bondage. He proposes peace, but we are sure it means blackout and curfew. Hearing is believing; seeing is knowing.

A world in flux is beyond human understanding. Metal and concrete melt into liquid, swirling beneath our feet. We watch the colors above the skyline, watch the tyrant's spinning pen. Soon he will write upon us. In his eyes, we are but blank paper.

In [GetYear], we do not yet know what disillusionment tomorrow will bring. But we must watch over one another, must ease the pressure. Together, we are the only hope. We must join hands, become what we wish to be, and do things differently."
 TNO_CountryClosing_epilogue_MEX_Demo_Ordaz: "The captain has handed the helm to his trusted first mate, and so Mexico continues firmly on the revolutionary path. Now the one steadily holding the wheel is Gustavo Diaz Ordaz. He is respected by his colleagues for his vigilance, intelligence, and precise orders.

Beneath the gathering storm, the PRI propagates this story, again and again. What they do not say is that cracks in the ship are taking on water, the guerrillas grow by the day, the crew is corrupt, and rumors fly - that Ordaz may crack under the pressure.

Beneath the waves, tentacles of radicalism; above, the sirens of reaction. He sails his ship through these dangerous seas, his face as impassive as iron. Complaints from abroad and from Mexican citizens cannot make him loosen his grip. All goes to plan; through the long night, no deviation is permitted.

In [GetYear], in the years ahead, Ordaz, the PRI, and Mexico will break through every terrifying wave blocking the revolutionary road."
 TNO_CountryClosing_epilogue_MEX_Demo_Lozano: "President Raul Salinas Lozano has cast off the chains that bound him: the two prickliest ministers in his cabinet, Echeverria and Chumacero. The victims of the Madero affair can be counted among them too. The temporary truce between his technocrats and the suppressed orthodox wing within the PRI has also ended.

Two shadow wars have begun. In the howling wilderness and the endless slums, the internal security forces wage a dirty war against radicals inspired by the fallen of the People's Guerrilla. Within the party, over the uncertain future of the revolution, from the smallest town hall to the palaces of the National Palace, a shadow struggle unseen since Zelaya has begun.

In [GetYear], the peace under Lopez Mateos is over, but who will win in the end? Will the prosperous, dynamic Mexico of Salinas's vision escape the ghosts that haunt it, or will the old guard grip power once more, never to let go? This struggle, in the end, may leave nothing but wasteland."
 TNO_CountryClosing_epilogue_MEX_Demo_Madrazo: "The southern cyclone, seemingly unstoppable, has run aground in the hot, dry air of Chihuahua. Attacks by the Guevarist People's Guerrilla have exposed Carlos A. Madrazo's rekindled revolution to the threat of right-wing enemies. Decayed syndicalists, reactionary co-governmentalists, and on top of all, governors who openly flout his authority, trying to drag Mexico back into the old dark age.

Yet the storm he has raised has injected new vitality into the revolution's dimming flame, and the setbacks now awaken its true defenders. The giants of the past stand shoulder to shoulder with today's ardent youth, holding aloft the flickering torch, fighting and dying for the common ideal of a just and independent Mexico.

In [GetYear], chaos and smoke obscure the road ahead, who knows how many unknown friends and enemies hide within. But to embrace a bright future, to fulfill the great wishes of the revolutionary martyrs, Madrazo will press on."
 TNO_CountryClosing_epilogue_AAA_Success: "Time flows, and summer light falls upon the frozen continent. Since the day humans first set foot on Antarctica, a beautiful dream was born: that humanity might, with great wisdom and courage, explore and learn peacefully in this frozen Eden. That dream turned to ash in the cold fire of Snipe Island. Even so, as it died, the old world's hope sprouted in the most unexpected place - Argentina. Leading the army of conquest, Colonel Leal pointed the nation's sword at the dragon entrenched in the ice's heart; one last time, he staked everything to prove the dream was not dead.

Though the cost exceeded his imagining, our hero returns victorious; the dragon is beheaded, and hope seems to rise again. Yet where that dream has gone remains elusive. Every faction eyes it greedily, bent on dragging Antarctica into a new era of darkness and blood. For Colonel Leal, compared to the challenges ahead, the journey to Antarctica may have been little more than a casual winter stroll..."
 TNO_CountryClosing_epilogue_AAA_Failure: "A dark, cold new era descends upon the frozen continent. Since the day humans first set foot on Antarctica, a beautiful dream was born: that humanity might, with great wisdom and courage, explore and learn peacefully in this frozen Eden. That dream turned to ash in the cold fire of Snipe Island. Even so, as it died, the old world's hope sprouted in the most unexpected place - Argentina. Leading the army of conquest, Colonel Leal pointed the nation's sword at the dragon entrenched in the ice's heart; one last time, he staked everything to prove the dream was not dead.

Yet the gallant knight has not returned. Day by day, his triumph has become illusion, turned into a cold shell buried deep in snow. He was not the first, and his failure ensures he will not be the last. The failures of predecessors have lifted General Marsela, who will wage a war to make Snipe pale in comparison, washing away the nation's shame in Chilean blood. The explorer is gone; the warships set sail..."
 TNO_CountryClosing_epilogue_AAG_Success: "Boots echo across the frozen continent like rolling war drums. Thousands of German soldiers shout victory, celebrating the Aryan spirit's conquest of nature. No hardship of hunger or cold can stop Germany's will. Soldiers and scientists revel in our great conquest; new lands open to settlers, wonder-weapons fly freely in the blue skies shedding ice-rain, and even the power of the atom is ours to command.

But this is only the beginning. In the midst of our great struggle, the Americans and their lackeys seek to defile German soil and stab our people in the back. Now New Swabia is mobilizing to repel their invasion, nailing the invaders beneath the so-called Southern Cross.

The final battle of the dark wastes approaches. A fire will sweep Antarctica, making the eternal ice begin to melt..."
 TNO_CountryClosing_epilogue_AAG_Failure: "In the abandoned base, corpses lie scattered - the latest victims of the frozen continent's might. For decades Germany called itself the apex of human civilization, the conqueror of subhuman tribes, the pioneer of science, the vanguard of culture. In its arrogance, it even tried to force nature to its knees, settling in the farthest places, blackening her skies with metal vultures, burning her soil with atomic fire.

For their sins, they are buried, cursed, pale and shivering in the dark. When fuel runs out, what is culture? When hunger gnaws the belly, what is science? When teeth tear into human flesh, civilization itself has long since vanished.

In their arrogance, nature reminds them that even the crown of creation is, like all other beasts, an animal - and all animals need food..."
 TNO_CountryClosing_epilogue_AAO_Hillary: "Like a phoenix rising from the ashes of the Second World War, great democracy spreads its wings over the frozen continent. As other parts of Antarctica slide step by step into chaos and tyranny, the OFN Directorate sounds victory after victory. The Nazis retreat before the Southern Cross; Operation Iceworm bores into the earth's core, promising unprecedented security to the free world; the long march toward gender equality enters new ground. Yet uncertainty steals in with victory; as time passes, internal fissures appear, and old adversaries sharpen their knives.

The greatest contrast is the Directorate's new chief, Edmund Hillary. To some, Hillary is a beacon of hope for a better, more peaceful future; to others, he chases doomed daydreams. The Nazi threat returns, allies plot in secret, and even Hillary himself cannot guarantee he will weather the trials ahead."
 TNO_CountryClosing_epilogue_AAO_Beale: "Like a phoenix rising from the ashes of the Second World War, great democracy spreads its wings over the frozen continent. As other parts of Antarctica slide step by step into chaos and tyranny, the OFN Directorate sounds victory after victory. The Nazis retreat before the Southern Cross; Operation Iceworm bores into the earth's core, promising unprecedented security to the free world; the long march toward gender equality enters new ground. Yet uncertainty steals in with victory; as time passes, internal fissures appear, and old adversaries sharpen their knives.

Despite the challenges, the Directorate's new chief, Howard Beale, believes his calm pragmatism is the tool to complete the mission. Beale has drawn up detailed plans to increase Antarctic bases' use of advanced nuclear technology and expand Australian support within the Directorate. He believes he has found the right way to consolidate the OFN Directorate's victories while holding fast to the dream."
 TNO_CountryClosing_epilogue_AAO_Rickover: "Like a phoenix rising from the ashes of the Second World War, great democracy spreads its wings over the frozen continent. As other parts of Antarctica slide step by step into chaos and tyranny, the OFN Directorate sounds victory after victory. The Nazis retreat before the Southern Cross; Operation Iceworm bores into the earth's core, promising unprecedented security to the free world; the long march toward gender equality enters new ground. Yet uncertainty steals in with victory; as time passes, internal fissures appear, and old adversaries sharpen their knives.

The Directorate's future is uncertain, and America will not risk letting these great achievements vanish, choosing - over allied protests - to continue administering the Antarctic territories directly. In the years ahead, completing Iceworm and defending the new territories will be the Directorate's foremost tasks. Yet even if these goals are met, many already question whether it is worth the price of turning Antarctica into an American military base."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Big_Win_Jackpot: "Adhemar. He came, he saw, he corrupted.

But to the Brazilian people, he is more than president, more than a thief. He is the guide who listens to the people's voice, the governor who oils the gears of the bureaucratic machine. He is the physician who heals the sick, the rich man who digs into his own pocket to feed the poor, the starving, and the disabled. He is the multilingual diplomatic wizard, profiting the nation and himself in the cut and thrust of international dealings. He is Vargas's true heir, and now the spiritual father of Vargas Filho. For all his sins, for all his flaws, Adhemar de Barros has stolen Brazil's heart.

And so when a new round of truco begins, Adhemar will surely be ready. He has the life money can buy. But more importantly - he has a whole nation behind him."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Lives_Vargas_Wins: "Perhaps the second step on the road to eternity is calmer than the first. Adhemar de Barros, the Sao Paulo doctor, has faced obstacle after obstacle on his quest for immortal fame: exile abroad, corruption charges, failed presidential bids, Lauro Natter defeated by Edna Lott, scandals over Nazi spies, a coma lasting months... but he met each with a relaxed smile and a spring in his step. Now he passes the baton of power in one hand while the other jingles gold coins in his pocket.

Taking up the scepter is Adhemar's dashing protégé - Vargas Filho. He has inherited not only his father's illustrious name (and, better yet, his handsome looks), but will rule a nation built according to Adhemar's wishes: flying the PSP banner, crammed with grand projects, full of cruzeiro notes, and - what the old Vargas lacked - the army's loyalty. For if Adhemar de Barros is ready for retirement,

he will do so with his inimitable style."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Lives_Vargas_Loses: "He wears many hats: pilot, doctor, polymath, thief, president. The Social Progressive Party, with its populist charm and springs of indulgence, has given the nation such a colorful leader. Adhemar de Barros brought mud and chaos, but government and people are so close that the people can read every line on power's smiling face.

Yet however grand the carnival, however fondly remembered, the music eventually stops. Is the nation tired of Adhemar's slippery grip, or did Vargas Filho fail to inherit his mentor's style and network of favors? The ballot box says nothing, but it echoes in the ears of the hungover nation: the carnival is over.

But as Brazilians stagger between the great works and hospitals left behind, let them smile, remembering the five-year raucous feast, and the host who was always so well turned out."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Wins_War: "The Brazilian people are not warmongering conquerors, and President Adhemar de Barros is no warhawk. But when Argentine aggression and conspiracy threatened their beloved fatherland, the people rallied behind their leader and that cherished banner of hope, vowing to forge peace anew for the continent.

Undaunted by the specter of nuclear fire, this expensive, well-equipped, experienced, and steel-united army routed the gauchos again and again. On both the domestic and diplomatic fronts, Adhemar and the PSP practiced frugality, gathered resources, and spoke boldly, closing in on final victory. Small wonder the returning soldiers and the nation now drown themselves in bliss and luxury?

Adhemar promised Brazil a world, and now they have won the whole of it."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Loses_War: "Countless young men never came home. How many lives might have been saved if Adhemar had not corrupted the army for private gain? How many died in hospitals lacking life-saving medicine sold off years ago? If he had pressed harder on the bomb, or pressed the button when needed, would these loyal souls still live? If he had not driven Argentina into that corner...

Brazil has no time to answer these questions. Government institutions are collapsing, the economy is in ruins, and rebels spring up like vultures on carrion.

Even less time to talk to the man who stole the nation's future."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Dies_Vargas_Wins: "The PSP was once written off as dead with Adhemar de Barros - a party with no program but personal enrichment, mired in scandal, fit only to be sealed away in some dirty Sao Paulo headquarters, unmourned.

But the faithful remember the miracle of Lazarus. When the Son of God cried "Come out!" the party stirred. Vargas Filho led the PSP to another upset victory, drawing on every nostalgic memory of his father, spending every cruzeiro coin Adhemar once scattered among the poor, and exploiting every ounce of his own youthful good looks.

Brazil's New Order returns... and perhaps, the Estado Novo will walk the earth again."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Dies_Edna_Wins: "The rise of Edna Lott and the Brazilian Labour Party makes it easy to declare that President Adhemar de Barros's political legacy will be utterly erased. The corruption he spread through every Brazilian institution, the networks of loyalists he planted in Brasilia and the states, his acquiescence to German infiltration into every corner of the country... these are the targets of Edna's purge, and she will bring them crashing down.

But Adhemar has one legacy that will endure - his clashes with Edna Lott. Even without serving as Adhemar's vice president, this already formidable politician might have reached the presidency. Yet as the best teacher never stops learning: through countless confrontations and fleeting moments of mutual respect, Edna has remade herself for the challenges ahead. A tempered coldness, an endless arsenal of political tricks, and that unshakable calm smile - these will be the blades she and Brazil wield."
 TNO_CountryClosing_epilogue_BRA_Adhemar_Dies_Someone_Wins: "Brazil urgently wants to forget. To forget the man who, bewitched by money and trickery, brought German power into Brazil's heart; the doctor who stole money from the sick; the Christian who was punished by God in prayer. To forget the names - whether "Lauro Natter" or "Edna Lott" - which, intentionally or not, became the symbols by which Brazilians remember him. Even to forget Vargas Filho: he took his father's name, yet became a traitor.

No, that man's era will be buried under the new president, a leader bearing fresh hope. He must rebuild on the shifting sands left by the Sao Paulo politicians: corrupt institutions and a rusted army, like a bandage on a hideous wound. If the new president truly succeeds -

then he will be a name for the history books."
 TNO_CountryClosing_epilogue_BRA_Lacerda_Imp_Failure: "This must be a nightmare. How could Rio have fallen, become a whirlpool of hateful flame, flood, and screams? Helicopters blot out the sky like crows; corpses pile the streets like stone steps. The communists are dying, but for every one that falls, more rioters rise across the North and South. The nation's guardians, the soldiers - how could they betray us in our darkest hour, turning their guns on their own comrades?

Magalhaes Pinto struggles in vain to wake from this nightmare. Carlos Lacerda can claw at himself until he bleeds, yet cannot rouse himself. Brazil may let out a heartrending wail, but no one can make the nation open its eyes. For the torment is endless. It is midnight, and midnight it will remain."
 TNO_CountryClosing_epilogue_BRA_Lacerda_Imp_Victory: "The new Brazilian Republic stands at last, grand and solemn, crushing beneath its feet the rusted shackles of Vargas's Estado Novo. The left, the communists, and all who would overturn it again lie shattered. And on this giant's shoulder perches a loyal crow, guiding in a low voice where it should go - toward freer, more prosperous markets. To fight for freedom whenever the Nazi or Argentine head dares lift its ugly face.

Yet standing so high, this Titan can no longer hear the voices of the little people below. Why should he? The masses' demands are nothing but the empty promises and peddled lies of reckless opportunists. No. As the new decade dawns, they will be the ones to follow the giant's stride."
 TNO_CountryClosing_epilogue_BRA_Someone_Loses_War: "The Treaty of Asuncion was written in more than ink. It was written in the tears of refugees fleeing along the highways, abandoning their homes, their wealth, and their old lives. It was written in the blood of a generation of Brazilian youth - the dead entombed, the wounded broken, the survivors shattered. It was written in sweat: the cold sweat of the hand that trembled as it signed, the sweat of the fist clutching the newspaper carrying the treaty, and the sweat of men and women facing an unknown future.

Brazil did not win the fifth superpower's crown. Argentina not only took the title, but seized countless spoils. Former allies either fled afar or became Argentine vassals. The dream of prosperity was torn apart by crippling foreign debt and runaway inflation. Society splintered like broken glass: Paulistas and Cariocas, communists and liberals, blacks, whites, and every shade between, all searching in despair for a scapegoat to blame for the fatherland's collapse.

The Treaty of Asuncion drove a blade through Brazil's heart."
 TNO_CountryClosing_epilogue_BRA_Someone_Wins_War: "This is the year Brazil claims the superpower's throne, and the Argentine threat to the American continent ends for good. This victory was never fated; every inch of it was soaked in blood and sweat, warriors falling on the field, the home front sacrificing all. In the moment the nuclear fire that gambled humanity's survival was about to fall -

we won the wheel of history. Now, from Rio to Sao Paulo, from Fortaleza to Manaus, people greet one another with newborn pride: for this iron army, for this land, for every countryman who forged this glory. The nation rallies behind this government, vowing to turn its grandest blueprints into rolling war drums. As civilization's light spreads to every corner of the Americas, the faith this land has long waited to see is at last witnessed:

Order and Progress."
 TNO_CountryClosing_epilogue_BRA_Lacerda_Wins_War: "Carlos Lacerda and his band held a grand concert in the final months of his presidency, a tribute to the victors and the fallen of the South Atlantic War. Brasilia, Rio, Sao Paulo, and a dozen other cities witnessed Carlos Lacerda's farewell tour, declaring his presidency immortal. He strode onto the stage head held high, and the crowd's roar was deafening. Whenever he heard it, a smile he could not contain spread across his face.

Yet even as Lacerda stands on the conductor's podium, countless famous pieces swirling from his fingertips, a small beast named Doubt gnaws at his soul. Could all this have been avoided? Was the death and destruction suffered by both peoples worth it? But those listening to his speech roar so loudly that the beast's very existence is drowned out. He led Brazil through an unprecedented crisis, carried Brazil to new heights on the world stage, and saw firsthand that the legacy he leaves in the history books outweighs Vargas's.

In [GetYear], the caws proclaim Lacerda's name as a hero."
 TNO_CountryClosing_epilogue_BRA_Lacerda_Loses_War: "Twenty minutes to midnight. Rain beats against Lacerda's office window. He opens a bottle of Scotch; the liquid flows like blood from a wound. Lacerda picks up the cold glass and drains it. Headlines and radio waves are full of grief and anger, the wailing of a defeated nation.

Lacerda pours himself another. He remembers the war against Argentina, a complete disaster, and drinks it dry again. Every day brings new stories from the front: incompetence, brutality, human tragedy. As the glass is filled and emptied again and again, every failure, every crime presses on Lacerda's soul, covering his legacy. Just like Vargas, wasn't it? No, worse, says Lacerda. Vargas's bloodshed at least achieved something; his own achieved nothing.

In [GetYear], at this midnight hour, Brazil's future is as empty as Lacerda's bottle."
 TNO_CountryClosing_epilogue_BRA_Tavora_Wins_War: "When Brazilians woke to find Virgilio Tavora had assumed the presidency through an internal party coup, the nation was shocked and confused. Lacerda had been incompetent in handling the general strike, but at least he was a familiar face. Who was this man who had suddenly appeared? A former officer, a former governor, leading some weakened faction - how had he emerged from the shadows to steal the highest office?

Now, no street in Brazil lacks this name, sung again and again. Victory over Argentina has revived Brazil, restoring the nation's place on the world stage. At the heart of that victory is Virgilio de Morais Fernandes Tavora - the man who rose from the shadows to lead the nation to triumph.

In [GetYear], though Tavora has usurped the place history reserved for Lacerda, he fits the role perfectly."
 TNO_CountryClosing_epilogue_BRA_Tavora_Loses_War: "Brazilians woke to find their president deposed, replaced by a puppet cast from the shadows of the National Union Party's meeting room. Perhaps Virgilio Tavora should have stayed in the dark; after all, he ultimately lacked what it took to meet the South Atlantic War's challenges. Argentine tanks breached the lines, shattered the defenses, and now Brazil kneels in defeat before the whole world.

Tavora's aides urge him to prepare for the electoral rout, but he knows defeat at the polls will be far worse. Voters accuse him of fomenting rebellion, vaulting ambition, and governing incompetently - and the verdict is already sealed. He will lead the National Union Party to the execution ground, walking hand in hand toward the firing squad's bullet ballot.

In [GetYear], Tavora asks himself: perhaps staying in the shadows would have been the better choice."
 TNO_CountryClosing_epilogue_BRA_Tavora_Win: "In 1950, Eduardo Gomes won the presidency, and a future breaking with Vargas - and with authoritarian developmentalism - seemed within reach. Yet his rule was both bad and brief, leaving little trace after Kubitschek took over. In 1965, a decade after Gomes's failed rule, Carlos Lacerda took power. His rule too was bad and brief - but thanks to Virgilio Tavora, the situation was salvaged.

Brazil was pulled back from the brink of collapse by the "pragmatic colonel," and the nation seems on the road to recovery. Brazil is now a valued member of the OFN, its economy steadily liberalized, the former regime's power base suppressed. The shadow of the Gomes era is lifting; though Tavora will not be the one to dispel it entirely, he is confident in the successor he has chosen.

In [GetYear], Ney Braga wins the presidential election, and this term may well be brilliant and enduring."
 TNO_CountryClosing_epilogue_BRA_Tavora_Fail: "As President Virgilio Tavora's term counts down, Brazilians cannot help wondering whether his rise meant anything at all. When he emerged, he promised to end all the troubles left by Lacerda's bad term. His handling of the general strike nearly turned labor action into a civil war. The National Union Party split, its major factions attacking one another for dominance. Tavora rose above it all, making many promises.

Yet when it came time to actually govern, people found Tavora lacking. He failed to establish his own and his "pragmatists'" authority, and now he can only watch as the Labour Party votes him out with millions of ballots. As the clock ticks in Tavora's office, he finds himself staring at an old photograph on the wall: him, Carlos Lacerda, and Eduardo Gomes. Brazil's leaders have twice tried to shape the nation in the image of their fallen idol, and twice they failed.

In [GetYear], there will be no third attempt."
 TNO_CountryClosing_epilogue_BRA_Lacerda_Win_Max: "Throughout history, true winners have been few. Even the greatest empires fall, and even Getulio Vargas once lost an election. Obviously, there are no absolute winners in this world, only those who have won enough.

By that measure, Carlos Lacerda is a victorious hero. He advanced the ideal of "Order and Progress" in South America, forged the alliance with the United States, and defeated Vargasism and the legal system that sustained it. Most importantly, thanks to President-elect Magalhaes, he has become the founder of a political dynasty. His handpicked successor ensures that Lacerdaism is not merely a political practice but a political brand.

Brazil enters the seventies hopeful, but with a rough start. Turmoil in the Middle East rattles Brazil's bank accounts. Workers at home need only a spark to take to the streets. The National Union Party is at its zenith, but many hope to cut it down. Victory always creates discontented losers, yet he - and they - have invested too much. Perhaps this passing of the torch is worth savoring. Just this once."
 TNO_CountryClosing_epilogue_BRA_Lacerda_Win_Mid: "As the old saying goes, Brazil is not for beginners. Governing Brazil is certainly no easy task, and Carlos Lacerda believes he knows this better than anyone. But as a veteran who served in Guanabara and the Federal District, he cannot help wondering whether the nation is beyond even an expert's grasp.

Despite his best efforts to avoid crises, they erupt again and again, growing worse. The laws he passes are amended or rejected; his allies abroad suffer setbacks one after another. Can "professionalism" truly prevent all this?

Even so, he holds on. He has weathered military pressure, media firestorms, mob unrest, and radical assaults, and he still sits in office. And he will keep sitting there - Raphael Magalhaes will make sure of it. But Raphael's work is no easy task; the world is turbulent, and Brazil's economy is a mess. Brazil is riddled with holes, its international position unsettled, the National Union Party's agenda far from complete. But then again, President Lacerda is part of history now; the rest is best left to the future."
 TNO_CountryClosing_epilogue_BRA_Lacerda_Win_Min: "When Carlos Lacerda moved into the Palacio do Planalto, he seemed about to fulfill a kind of prophecy. He often imagined himself as Brazil's Prometheus, bringing the fire of his party into Brazilian politics, utterly transforming the historical course of the people under his care, enlightening them, empowering them. Yet he was wrong.

In truth, the laws he proposed were repeatedly rejected by Congress, his international stance won no recognition from allies, and in the end his rule was repudiated by the people - and the fatal blow came not from the military. At any rate, the National Union Party's vision was shattered; Raphael Magalhaes no longer defends the party's principles.

When he at last moves out of the Planalto, in the eyes of onlookers his story is not Prometheus but Don Quixote. The president fought Vargasism as Don Quixote fought windmills. Yet Don Quixote at least left a legend; Carlos Lacerda will leave no achievement at all."
 TNO_CountryClosing_epilogue_AAC_Guzman_Success: "A brilliant dawn breaks over the frozen frontier, gilding the continent redeemed by one man's quiet courage. Professor Julio Escudero Guzman, the weathered giant of Chilean Antarctica, has wrested victory from the abyss of chaos - not with a rifle, but with the unyielding parchment of justice. His untiring efforts have borne fruit: the truth of Adelaide - written in blood, sealed in ink - laid before the OAS, bringing the Argentine aggressors' arrogant heads low. Their blatant violation of sovereignty is undeniable, and at last they must give way: compensation drawn from the treasury, a reluctant bow to Chile's rightful claim.

Yet shadows sweep in from the horizon. Argentina's concessions may only nourish their thirst for revenge; and this ice still groans beneath the weight of ambition. Still he stands, this peacemaker tempered from the cold, his achievement a bulwark against the tides to come. Will his victory stand the test of fire, or melt away, a dream too pure for this savage continent, fit only for the history books? The penal colony trembles, waiting for the final answer."
 TNO_CountryClosing_epilogue_AAC_Guzman_Failure: "Frost and failure brood over Antarctica's wide wastes, the dreamer's vision shattered by the wind-blown snow. Professor Julio Escudero Guzman, Chile Antarctica's steadfast guardian, is bowed beneath his own weakness - the tapestry of peace he wove from Adelaide's blood has crumbled into dust beneath contempt and silence. The OAS, moved not by justice but by American might, has barely acknowledged Chile's claim. This hollow gift leaves Argentina untouched - no compensation, no price for the crimes it brazenly committed. The penal colony murmurs in betrayal; its master is humiliated, his cry drowned in deafening indifference.

Now the emboldened Argentines sharpen their claws, and bloody whispers run across the ice. Guzman stands alone; his life's work, in this land that spurns hope, is but a fragile echo. Will Chile rise from this frozen mire, or sink beneath a peace too frail to hold? The penal colony trembles, waiting for the final answer."
 TNO_CountryClosing_epilogue_AAC_Merino_Success: "A blood-red dawn soaks the frozen wastes, proclaiming a colossus risen in the south. Colonel Jose Toribio Merino has forged a legend: his marines become the apex predators of the Antarctic wilds. That cowardly old diplomatic verbiage is crushed beneath Merino's boot - before steel, how pale is paper.

The hijacking was but an overture, a conductor's flourish before the symphony of war. Yet victory breeds ambition, and victory always tastes sweet. As Antarctica's short summer yields to deepening cold, the shadow of a greater conflict stirs. The road ahead in Merino's eyes is paved not by compromise but by the steel resolve of those tested by the far south. The fate of Chilean Antarctica - and of Chile itself - hangs upon it. In this grim theater at the world's end, pragmatists may plead for peace, but the stage seems irrevocably set for the soldier's part. Chile has found its frozen warlord, and his will calls for conquest. Where will he send his warhounds? The penal colony trembles, waiting for the final answer."
 TNO_CountryClosing_epilogue_AAC_Merino_Failure: "Shadow of ice and shame broods over the Antarctic wastes, where once stood a strong man. Colonel Jose Toribio Merino, the madman who called himself the hero of Snipe, tried to forge Chile's Leviathan. His marines, honed to a razor's edge, were to seize Argentina's throat in a bloodless strike. Yet a hand shook, a shot rang out, and the carefully laid trap sprang shut. Smoke swallowed the enemy ship, and blood ran across the decks. This so-called "apex predator," unable to resist the boast of vanity, has fallen like prey, bleeding out. The defeat seems small, yet it has shaken Merino's fledgling authority.

Chile teeters on the brink. The strong man is scorned but unbowed; failure has become the furnace of his revenge. Will this conflagration help him reclaim the south, or become a storm that digs his own grave, tearing everything apart? The penal colony trembles, waiting for the final answer."

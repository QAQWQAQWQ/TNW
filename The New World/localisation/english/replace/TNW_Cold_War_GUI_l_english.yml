 TNO_The_World_Watches_TT: "The whole world is watching our every move - shall we put on a good show?"
 CWGUI_Tension_Info_Text: "§FIn the Cold War, the §Rbalance of the world§! rests between three superpowers. This is in part because these powers are fully capable of §Rdestroying the world§!. A full-scale war between the §MUnited States of America§!, the §rGreater German Reich§!, and the §eEmpire of Japan§! would see their nuclear arsenals utterly destroy modern human civilization. Though the three nations know this well, they often act as though they care not at all. §oThe three powers regularly threaten one another with their respective military strength§!. Major and minor international incidents can cause relations between any two superpowers to §Vsuddenly tighten§!, and both sides will use the opportunity to rearm. The more §Vtense§! the world situation, the higher the §Valert§! level. If tension between two superpowers reaches §Y100%§!, the unstable world order under this Cold War will completely §xcollapse§!, and the two involved superpowers will §xslip into full-scale war§!. Once the two giants begin to duel, the rest of the world will inevitably be drawn into the conflict. At that point, §eall that remains for humanity is hope§!. §!"

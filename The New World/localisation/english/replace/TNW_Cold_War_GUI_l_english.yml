 TNO_Cold_War_GUI_World_Tension_PB_tt_delayed: "§YGlobal tension§! is a §Vquantification of the intensity of conflicts, chaos, and upheaval around the world§!. §xWars, chaos, political upheaval, economic collapse, and revolution§! raise global tension; §Gevents like peace accords that signal success and prosperity§! lower it. Once it reaches §Y100%§!, §othe world will descend into a conflict unlike any since the birth of the New Order§!, and everything we know and love §ewill be consumed by fire, opening a path whose end no mortal can foresee§!."

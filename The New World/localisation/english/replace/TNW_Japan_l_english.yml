 JAP_emperor_akihito: "Emperor Heisei"
 JAP_emperor_akihito_desc: "'May the Imperial line endure forever, a thousand generations unchanging' - Kimigayo\n\nEmperor Akihito, of the bloodline of Amaterasu Omikami, symbol of the Empire's unbroken line of ages, representative of the Japanese national polity. Having lived through the turmoil of early Showa under Imperial Way ideology, the Emperor has become more reticent than before, no longer taking suggestive actions on political affairs lightly, but striving to contract the actual influence of politics within the palace. One may say the center of power has moved ever further from the palace group centered on the Emperor, transferring to the House of Representatives and cabinet headed by the political parties.\n\nCompared to previous sovereigns who reigned over the people like an airy palace in the sky, Emperor Akihito has a more enlightened political vision and thought. He deeply recognizes the threat that nationalism and Imperial Way ideology pose to Japanese politics, hoping to use the parties as a barrier to maintain political stability, to realize the 'normal constitutional practice' under the existing system, and to uphold the monarch's norms as an 'organ' of a modern state. Yet at the same time, the Emperor's silence on political affairs inevitably arouses suspicion within the ministries and among the people."

 JAP_imperial_way_and_the_nation: "Imperial Way and the Nation"
 JAP_imperial_way_and_the_nation_desc: "If nationalism is the horizontal axis along which Japan advanced toward reform and war, then Imperial Way ideology is its accompanying vertical axis. The prewar nationalist genealogy rarely developed independently of Imperial Way positions; its revolutionary and destructive character also externalized into action through Imperial Way ideology. From the postwar to today, Imperial Way thought has declined politically; conversely, those who hold national reformism, riding the east wind of party rise, have gained their own place in politics. Yet at the same time, veterans' return and the wealth gap caused by economic prosperity have nurtured the flourishing of Imperial Way thought among the people. A current of thought that may be called 'anti-system' is deeply popular among right-wing youth and spread widely during the crisis of the nineties.\n\nThe party reform faction does not accept lodging under existing parties, and Imperial Way adherents urgently need a political outlet. Centered on the military, extensive cell-like organizations continually emerge. Nationalists also welcome the development of destructive forces, to extend their own political deterrence and legitimacy. What is certain is that once crisis emerges in the existing system, they will surely break out of their cage with surging force."

 JAP_military_spirit: "Military Spirit"
 JAP_military_spirit_desc: "Has the Imperial Army lost its self-confidence? Since the rise of party politics in the sixties, the Imperial Army has gradually been squeezed off the table of power, and the military's sense of powerlessness before the people is even stronger than in Taisho times. Against this backdrop, soldiers have continually and voluntarily shed their status to join parties and engage in political activity. Within the military, new reformist thought demands coordination between soldiers and parties, to achieve military modernization. An army that has not fought in years has long lost its old edge; so it seems the military's spirit has already vanished into the dust with the millennium bell...\n\nThe military's spirit lies in its direct subordination to the Emperor, and must never be usurped by those who privately scheme for profit. Now, though the army at home and abroad cooperates with the party men, it has not forgotten the spirit of the Imperial forces. The military must not be content merely to become empty bones; if it dwells there, how can it speak of the duty to defend the Imperial person? At least within the army, the unwillingness, humiliation, or revenge of the fallen is still brewing. So it seems the military's spirit still exists..."

 JAP_factional_infighting: "Factional Infighting"
 JAP_factional_infighting_desc: "Though Japanese politics, after the turmoil of the sixties and seventies, gradually formed a relatively stable framework centered on the two major parties, under the parliamentary-centered system, the parties themselves are not monolithic. Political operation based on intra-party factions continually drives political change, and the complex relationships between various interest groups continually strike the most sensitive parts of the political system.\n\nThe ruling party must not only carefully manage relations with the opposition, but constantly watch the movements of intra-party factions. After the nineties crisis, the cross-factional movement aiming to establish a 'party-united system' gradually arose; yet beneath the appearance of unity, an even deeper crisis seems to be brewing."

 JAP_reform_bureaucracy_and_political_power: "Reform, Bureaucracy, and Regime"
 JAP_reform_bureaucracy_and_political_power_desc: "The term 'bureaucratic reform faction' is often used to describe the 'reform bureaucrats' active in Japanese politics from the 1930s to the 1960s, who had inextricable ties with the total mobilization system. But since the rise of party politics, these technocrats still remain active in politics, exerting their influence in party form and holding their own against the party men. Among them,\n\nthe Progressive Party is the base of the bureaucratic reform faction; the party partly inherits the reform bureaucrat lineage, upholding the philosophy of modified capitalism, and its Diet members are mostly technocrats from the ministries. Their position is to use the power of the strong ministries, follow the principle of bureaucracy-party coordination, unify and guide all aspects of the national economy, and eliminate the inertia of the free market through bureaucratic-guided capitalism.\n\nTo realize this vision, one must rely on strong cabinet power. The bureaucratic reform faction advocates a strong cabinet, strengthening unified leadership over the ministries and connecting the administrative vice-ministers. Yet at the same time, because the 'sect-centered' thought within the ministries has not been fully eliminated, this vision will certainly not land smoothly."

 JAP_party_officials_collaboration: "Party-Official Collaboration"
 JAP_party_officials_collaboration_desc: "The Home, Finance, and Foreign Ministries have been pivotal to national governance since Meiji, their weight far beyond ordinary ministries. Their heads, if not from the ministry itself, must still have deep ties to its bureaucratic networks. Over time, they have become political islands under 'ministry-centered' politics. This political situation gradually became an administrative obstacle in Taisho and Showa times. The contradictions between bureaucrats and party men, between local and central, between the middle layer and the decision-making layer, continually affect the soundness of decisions, to the point that early Showa policy missteps triggered the outbreak of war.\n\nSince the sixties, party politics has gradually matured, and many who came from administrative bureaucracy have merged with parties. Among them, the Progressive Party, for example, upholds 'party-official collaborationism,' coordinating the party's relations with each ministry from the perspective of administrative elites, achieving strategic unity and cultivating broad connections - this is also the key to its long tenure. Yet the opposition parties are increasingly disconnected from the ministries, and coordination among the provinces depends on the stability of the ruling cabinet.\n\nWithout strong coordinating force, either party alternation under normal constitutional practice or the unifying claims of a strong cabinet could cause the 'sect-centered' momentum to flare up again."

 JAP_house_of_peers: "House of Peers"
 JAP_house_of_peers_desc: "The House of Peers was established under the Constitution of the Empire of Japan, as the upper house of the Imperial Diet. It consists of non-elected imperial princes, peers, and imperial appointees; it has no dissolution system, and most members serve for life.\n\nSince the seventies reforms, the House of Peers has gradually abandoned its transcendentalist and conservative mindset, turning to cooperationism, maintaining good relations with the House of Representatives and party cabinets. It has become a solid link in the long-ruling party cabinets' 'bicameral longitudinal' doctrine. In recent years, the number of enlightened and pragmatic peers and imperial appointees has continually increased, and one believes that in the near future the House will present a renewed face.\n\n\n\n---------------------------------\n\n- Current largest faction in the House: Kayoi-kai\n\n- Current President of the House of Peers: Konoe Tadateru\n\n\n\n\n\n\n\n             £GFX_Kizoku_in_gicho_Konoe_Tadateru\n\n\n\n\n\n"

 JAP_house_of_representatives: "House of Representatives"
 JAP_house_of_representatives_desc: "The House of Representatives was established under the Constitution of the Empire of Japan, as the lower house of the Imperial Diet. Members are elected for four-year terms, with a mid-term dissolution system; the Prime Minister has the power to request the Emperor to dissolve the House of Representatives.\n\nThe House of Representatives long held a political disadvantage, suppressed by conservative forces such as the House of Peers, the military, and the Privy Council. After the war, party forces returned to the political center, and the House of Representatives' influence continually increased, becoming one of the more powerful poles of the state.\n\n\n\n---------------------------------\n\n- Current largest party in the House of Representatives: Progressive Party\n\n- Current Speaker of the House of Representatives: Watanabe Kozo\n\n\n\n\n\n\n\n             £GFX_Shugiin_gicho_Kozo_Watanabe\n\n\n\n\n\n "

 JAP_Democracy_in_the_Empire_of_Japan_tt: "\n-------------\n§sCurrent democracy in the Empire of Greater Japan:§!§XA spectacle of utter disgrace§!"
 JAP_Fair_without_but_foul_within: "Fair Without, Foul Within"
 JAP_Fair_without_but_foul_within_desc: "The constitutional system of the Empire of Greater Japan is essentially a power chess game where bureaucrats and politicians maneuver and deceive each other. Beneath the bright cloak of civil rights lies a rotten and decadent core. After the collapse of the Imperial Rule Assistance system, the lingering ills and filth of the old era never dispersed. The remnants of the Imperial Rule Assistance Association changed course and were reborn through a shell, transforming into the Progressive Party; the bureaucratic group deep in the power game also found a new attachment in the changing system.\n\nThe root of power corruption within the establishment is not removed, and the opposition forces that claim to speak for the people can no longer hide their greedy, self-serving ambition. The non-endorsement member faction centered on the Doko-kai eagerly merged to form the Cooperative Party, cobbling together a deformed Japanese-style two-party system. The deep cloud that had hung over Imperial politics since Taisho - the party-official conflict - thus returned and flared up again.\n\nNakasone's constitutional reform once lit a ray of popular sovereignty for the people. But when reform reached deep water and touched the entrenched hidden shackles of the Empire's national polity, the opposition at home and abroad attacked and obstructed in every way, ultimately shattering the illusory dream of democracy. The implementation of the Showa Constitution did not move a single political abuse; black-gold deals and power corruption still hold the mainstream of politics, bribery and fraud in elections are rampant and impossible to suppress, and violent groups continue to infiltrate and interfere in national elections.\n\nThe Miizuka cabinet, the peak of chaos, carried the collapse of rites and music to its extreme. In Heisei 10, the ordinary Diet was gridlocked for eight long months, and constitutional order neared collapse, finally forcing the Imperial Palace to break precedent and intervene in secular governance to sustain the tottering normal constitutional practice.\n\nThe storm-tossed imperial constitutional order enters the new century amid such turbulence and upheaval. Destruction or rebirth? The road of history remains shrouded in fog, undecided."


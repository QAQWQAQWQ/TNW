 JAP_Teiichi_Tanigaki_hog_desc: "§YChief Cabinet Secretary§!\n--------------\n'Mr. Kato is a commanding general; he cannot charge alone. When Mr. Kato charges, we will follow.'\n\nTeiichi Tanigaki is the first man at Prime Minister Kato's side. He is a Kyoto man by ancestry; his grandfather Ikeda Kiyosada served as a staff officer of the China Expeditionary Army, and his father Sen'ichi served long as a member of the House of Representatives. Tanigaki inherited his family's learning in youth, graduated university, and practiced law. Before long, carrying on his father's legacy, he joined the Progressive Party's Kochikai and ran as an official candidate, winning his seat.\n\nIn Heisei 7, he became Chairman of the House Steering Committee, valued by the leadership for his practical ability. During the Miizuka cabinet, he was recommended by Finance Minister and former Prime Minister Miyazawa Kiichi, entering the cabinet as a Parliamentary Undersecretary - a true ministerial aide. When Mori Yoshiro resigned as president under domestic and foreign pressure, Tanigaki strongly supported Kochikai chairman Kato Koichi as his successor; once the Kato cabinet was formed, he became Chief Cabinet Secretary, occupying a pivotal post.\n\nHis temperament differs entirely from the Prime Minister's stubbornness; he is especially skilled at moving between factions and reconciling them. Open and cheerful, he is often the face of the cabinet, the focus of domestic and foreign attention. All work of communicating within the party, mediating between ministers, and responding to public opinion passes through his hands. Thus the survival of the Kato cabinet truly depends on Tanigaki's management; without this strategist, though the Prime Minister has the authority of a commanding general, he could not support it alone."
 JAP_Hayashi_sadayuki_for_desc:  "§YForeign Minister§!\n--------------\nSadayuki Hayashi comes from the ranks of Foreign Ministry bureaucrats, having long served as Vice Minister for Foreign Affairs and other pivotal posts, with broad and deep diplomatic experience. He advocates a limited approach toward Germany and holds Pan-Asian diplomatic views, deeply imbued with today's Japanese 'autonomous diplomacy' philosophy.\n\nSince the Abe cabinet, Hayashi has long occupied a key post in the Foreign Ministry, assisting the cabinet in policy. Once the Kato cabinet was formed, who else but he could take the Foreign Minister's post? Yet though his diplomatic philosophy is the mainstream, the cabinet's diplomatic position is largely swayed by politicians. Thus, besides maintaining relative independence from his fellow ministers, he must especially work to steady morale within the Foreign Ministry and prevent division."

 JAP_Satori_Kozato_eco_desc:  "§YFinance Minister§!\n--------------\nSatori Kozato is a Kagoshima man. His family is not from a prominent clan, nor does it have powerful connections. After higher education, he entered local youth groups, devoting himself to youth revival activities. In Showa 34, he ran for local assembly, and thereafter painstakingly built his career through the posts of speaker and chairman. In Showa 54, he entered national politics, aligned with the Progressive Party's Kochikai faction.\n\nJudging from his record, Kozato is by no means a career bureaucrat. Half his life rooted in local politics, and later much of his effort spent on party affairs in the diet, he is a true party man. His appointment to this weighty post is due to the need for intra-party reconciliation, as well as his role in disaster relief during a major earthquake, where his capable and prudent conduct earned him the trust of the leadership. Though there are minor criticisms, he can ultimately bear his commission.\n\nThe Finance Ministry is the foremost of the Empire's ministries, holding the pivot of the national economy. Its sprawling structure is beyond ordinary people's ability to manage; the cautious wait-and-see attitude of some bureaucrats is also hard to predict. Though he has the Prime Minister's full support, the predicament Kozato faces after taking office is still severe. Bearing the heavy yoke of new policy is truly exhausting. For future advancement, there is only persistent effort."

 JAP_Nobutaka_Machimura_sec_desc: "§YHome Minister§!\n--------------\nNobutaka Machimura comes from a distinguished Shizuoka family; his grandfather was a prominent merchant, and his father Kingo long held a pivotal post in the Home Ministry. Inheriting the legacy of two generations, Machimura entered the Home Ministry after university, widely networking with colleagues and forming a society called the 'Lions Club,' into which many bureaucrats at home and abroad were drawn.\n\nIn the early 1980s, amid Nakasone's constitutional reform, many bureaucrats resigned to join party politics. Machimura was among them; he ran and won a seat in the Hokkaido district, where the Cooperative Party was strong, gradually coming to the attention of the Progressive Party leadership. During the Miyazawa cabinet, he served as Home Ministry Parliamentary Undersecretary, managing liaison between the cabinet and government offices and building his reputation through this key post. In the Miizuka cabinet, he overrode objections and used his Home Ministry connections to navigate the constitutional crisis. Once the Kato cabinet took power, he was the natural choice for Home Minister.\n\nThough the Home Ministry has long adhered to cooperationism, the parochial habits within the ministry have not been fully purged, and the sprawling administrative structure still leaves room for redundant staff and corruption. For the Kato cabinet, determined to draw a clear line with the old Progressive Party, Home Minister Machimura is like a fixed star, whose steady presence maintains order and execution within the ministry and is truly an indispensable pillar for advancing the new policy."


 JAP_Tatsuo_Kawabata: "Tatsuo Kawabata"
 POLITICS_KOICHI_KATO_DESC: "'Who speaks nonsense from the high hall?'\n\nWith the Great East Asian War won, the British and American demons finally driven away, and the ideal of Asian peoples' self-determination seemingly achieved. Yet throughout the Empire, the people are drunk on empty pride, gradually forgetting the hardships of founding. Looking across Asia-Pacific, livelihoods are ruined, poverty deepens, and the so-called Co-Prosperity Sphere remains an empty phrase with no real benefit. At this juncture, men of insight rise to pragmatism; the Koichi Kato faction's Kochikai is their representative. Their ambition lies not in grandiloquence but in practice. Through Ohira Masayoshi, Miyazawa Kiichi, and others, this lineage passes down to Kato Koichi, who takes upon himself the mantle of true Pan-Asianism, desiring that the name of co-prosperity match its reality.\n\nKato Koichi takes upon himself the mantle of true Pan-Asianism, desiring that the name of co-prosperity match its reality.\n\nKato Koichi entered the Foreign Ministry in his youth, observing the affairs of the world and mastering international statecraft. He then crossed the sea to Nanjing, studying at the National Central University, absorbing the learning of the Tang lands and deeply feeling the value of Japan-China friendship. His talent was deeply appreciated by Miyazawa Kiichi, who made him a confidant. Returning, he joined the Kochikai and rose as a young reformer, eventually becoming a faction leader. When Mori Yoshiro fell from power, the political world was shaken and in chaos; Kato was entrusted in this hour of crisis, becoming Prime Minister.\n\nIn governance, he champions political reform and the cleanup of accumulated abuses; he values people's livelihood and welfare, and rejects empty talk. He especially advocates Pan-Asianism, strongly advocating disarmament, believing the Empire must not rely on force to bully others, and that all Co-Prosperity Sphere nations should treat each other as equals, benefiting one another. This stance is truly independent in Imperial politics, utterly unlike the mainstream. Yet those who hold to principle often cry alone - conservatives accuse him of weakness, saying he damages national prestige; national reformists see him as a collaborator, mocking him for betraying the national polity. Attacked from without and within, caught between left and right. Within the cabinet, ministers harbor their own thoughts and decrees struggle to pass; party members obstruct, and factional darkness covers the sky. Look at Kasumigaseki: bureaucrats maintain only a semblance of unity, complying in form but resisting in fact; within the General Staff Headquarters, the military especially lords it over, arrogant and indulgent. As for the Emperor, he stands above it all, secluded in the deep palace, never once speaking out in support.\n\nYet his resolve is unbroken. Every time he mounts the rostrum, he says: 'What I desire is a truly prosperous Empire of Greater Japan, a truly prosperous Asia.' These words spread far and wide, and among the people many are moved, seeing a ray of dawn in the dark officialdom. Yet the complex situation at home and abroad is truly intractable, and the cabinet's foundations are still shallow; Kato alone bears the weight, and his steps are hard. But as they say, heaven never closes all doors; opportunity is not absent. If he seizes the fleeting chance to turn crisis into safety and defeat into victory, there is still work to be done. Kato knows this well, so though in a thicket, beset on all sides, he has not spoken of giving up for a single day. What he awaits is merely the hour. When the hour comes, fortune turns; the resolute will overcome their trials. The Empire's future may rest on this one man's shoulders."

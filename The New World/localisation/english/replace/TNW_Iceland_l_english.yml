 ICE.skeleton.15.a: "Tending to the wound that never heals."
 ICE.flavor.1.t: "Freedom March of [GetYear]"
 ICE.flavor.1.d: "It is six in the morning, and Klambratún Park, Reykjavík's largest and newest, is crowded. Three hundred people hold placards and candles, huddled in the pre-dawn dark. They chant slogans over and over, rallying one another, calling for a different world: a world where Icelanders do not burn from the OFN's torches. The demonstration's organizer addresses the crowd through a megaphone, congratulating Iceland's patriots for standing up against foreign interference. This is the annual protest against the foreign base, known locally as the "Freedom March."\n\nThey set out from Klambratún, heading west along Route 49. On the sidewalk, the silent crowd watches; some join, some simply watch them pass. At the crossroads, they turn south along Route 40, all the way to where Hafnarfjörður merges with Route 41. Along the way, someone in a dark house shouts "Nazi-lover scum." Then comes a long stretch of about 35 km to the destination. The march organizers encourage everyone in the line, passing out water. A British exile walks beside the column, filming this year's march. The rugged rocks of rural Iceland remind him of the Martian surface.\n\nIt is six in the evening when the "Freedom March" reaches Keflavík Airport. Absorbing stragglers and onlookers on the long trek from Reykjavík, their numbers have passed five hundred. Despite the long march, they show no fatigue; and as they see the airfield and the fully armed MPs blocking their path, their chants grow louder and more fervent. "Americans, out of Iceland!" "OFN is the enemy of peace!" "Iceland wants no war!" It is a roar of Icelandic discontent that will return every year so long as a few hundred Icelanders feel unsettled by American guns on their soil."
 ICE.flavor.1.a: "America can comfort itself that these are just a loud minority."
 ICE.flavor.2.t: "Ripples"
 ICE.flavor.2.d: "Eldon Knarason brewed a pot of tea to warm up, staring jealously from his office at the American base across the road. Through the rain-streaked window, he could see the base's lights, the silhouettes of GIs wandering the mess hall, and the cold beer they were guzzling. He had tried the stuff before and never liked it - leave the swill to the Danes, he thought - but he resented that the Americans were always entitled to ignore the bans the motherland imposed.\n\n"Fuck," his desk-mate mumbled, hanging up the phone. "It's happening again."\n\n"Uruguay?"\n\n"No," Ringar Damonson replied. "Argentina. Turns out they think we've been exporting too much aluminum lately." He sighed. "If it were up to me, we'd call the Americans and see what price they're willing to offer." Eldon frowned, twisting open the teapot lid, while Ringar drummed his fingers on his bald scalp. "Fuck Yasuda!"\n\nThe phrase had become a new popular saying among the people. In Iceland, it had replaced the earlier favorite, "fuck the Yanks." Though Iceland had no direct ties to the Co-Prosperity Sphere, its export-driven trade policy sent most exports to the Americas. In their view, South America was a better trading partner than North America. They paid more, demanded more, and did more business with other markets. Perhaps because of Japan's economic crisis, South American nations began to think they were doing too much business and decided to scale back. Iceland, a small exporter of aluminum and seafood, was unfortunately among the first countries to have its exports reassessed.\n\nEldon glanced again at the American base next door. A GI had just opened a window, beer bottle in hand. He drank half, then poured the rest on the ground - right on the dry dirt by the door."
 ICE.flavor.2.a: "Ringar grabs the phone, ready to curry favor."
 ICE.flavor.3.t: "Putting Bread on the Table"
 ICE.flavor.3.d: "Iceland's fishing boats set out at dawn and return with rich catches. Hundreds of cod are pulled from the deep ocean and brought ashore, to the processing plants. For Icelanders, the waters around their island teem with life; even as haddock and halibut are the staple, there is always surplus for the market.\n\nBut where can the surplus fish be sold? In Europe and Asia, cod might fetch over a dollar. But thanks to the military bases and embargo policies, Iceland's only available market is the Americas, and perhaps the Mediterranean if conditions allow. But Iceland cannot compete with the highly competitive fishing industries of those regions. No amount of creative propaganda can carve out a larger niche for Icelandic fishing on the international market.\n\nAt Grindavík on the south coast, six fishing boats put out early, sailing south for the day's catch. There used to be more boats here; if fishing were more profitable, there would be more. But when they return with haddock and halibut writhing in their nets, the earnings barely cover costs. One captain looks at the meager income from his day's catch and thinks that selling the boat tomorrow might be easier and more profitable than sailing again. Another captain looks across the Atlantic, imagining the whole continent over there. There, his day's catch might earn ten times what it does now - if only the US Navy blockade did not separate the two."
 ICE.flavor.3.a: "The fishermen, too, develop anti-OFN sentiments."
 ICE.flavor.4.t: "Freedom March of [GetYear]"
 ICE.flavor.4.d: "It is six in the morning, and Klambratún, Reykjavík's largest public park, is packed. Before the "Freedom March" reaches its next stop, the column already numbers over a thousand, and once the march begins, the numbers will snowball. After all these years, as the frozen relations between Germany and America begin to thaw and Iceland's already weak economy takes another blow, the "Freedom March" has grown. By now, the movement has reached a peak that march organizers of the past could only dream of.\n\nThe march is more organized now. No longer isolated voices, but coordinated in unison. Representatives of the People's Alliance and more indigenous anti-OFN groups speak for the people's humiliation at foreign occupation. As the column marches in force from Reykjavík toward Keflavík Airport, drums and loudspeakers roar, and flags wave proudly.\n\nBut before they leave the city, they encounter a sight as peculiar as the march itself: a smaller but more vicious counter-demonstration. Its tenet is simple and sharp: the "Freedom March" is a fascist apologist in anti-imperialist clothing, a pitiful display before the threat of totalitarianism. The counter-demonstrators try to surround the march, but their ranks are thin and easily broken. The march strides on, absorbing the opposition, and continues toward the airfield.\n\nFor they do not care. By now, the German eagle has stood atop Europe for more than twenty years, nearly thirty. Iceland has been forcibly separated from the continent - but for what? So that the abusive, bored GIs at the American base can lord it over the people? To build economic ties with a distant continent uninterested in Iceland's exports? Times change; to a growing number of Icelanders, the OFN no longer symbolizes a burning flame of freedom, but the cold shackles of an oppressive state."
 ICE.flavor.4.a: ""If we are just a US military base in disguise, freedom is not for us!""
 ICE.news.1.t: "[Get_newspaper_header] Anti-OFN Protests Erupt in Iceland"
 ICE.news.1.desc: "Reports indicate the American government tried to pressure the Icelandic government into covering up a murder committed by US soldiers. Rioting and unrest have since erupted on Reykjavík's streets. Though US-Iceland relations have drawn considerable criticism, this event seems to have been the catalyst for Iceland-OFN tensions; earlier roars have turned into widespread anti-OFN protest.\n\nFor Iceland, the upcoming Alþingi election increasingly looks like a referendum on whether to remain in the OFN. Representatives from both Washington and Germania have volunteered as international observers, but given the two superpowers' stakes in the North Atlantic, many suspect neither side is far from impartial.\n"
 ICE.news.1.a: "Get me Langley, now!"
 ICE.news.1.b: "American arrogance is our opportunity."
 ICE.news.1.c: "Is this the end of the special relationship?"
 ICE.news.2.t: "[Get_newspaper_header] People's Alliance Wins Election, Iceland Leaves OFN"
 ICE.news.2.desc: "After the People's Alliance won the 1971 Icelandic election, the process of fully withdrawing from the Organization of Free Nations has begun. After two American GIs killed an innocent child, major riots erupted in Reykjavík, and anti-OFN sentiment boiled over, as reflected in the recent election results.\n\nThe island's predicament is somewhat complex. Though the US still has an obligation to defend Iceland if it is invaded and will retain several military bases on the island, Iceland no longer owes any obligations to the OFN or need to provide military aid to other OFN members under any circumstances. This unprecedented, heavy loss for the OFN has sent a whirlwind of anti-OFN sentiment across the North Atlantic. Germany has yet to issue an official statement, but sources say the Germans are quite pleased with the result.\n"
 ICE.news.2.a: "Though there must still be a right to self-determination."
 USA_ICE_prepare_intervention_tt: "§gThe situation in §mIceland§! has tarnished our reputation; we must act to defend the §MOFN's§! image abroad.§!"

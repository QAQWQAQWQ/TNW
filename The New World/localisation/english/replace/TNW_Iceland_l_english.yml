 ICE_special_relationship: "The "Special Relationship""
 ICE_special_relationship_desc: "There is a "special relationship" between Iceland and the United States of America. But what makes the relationship "special" is a matter of debate.\n\nIn some eyes, Iceland-US relations are so good they are special, precisely because they serve Iceland's national interest. America often takes the lead in speaking for Iceland's interests; the American garrison brings economic benefit to the Icelandic capital; and the allied garrison maintains Iceland's stability.\n\nBut in others' eyes, the relationship is so bad it is special. They complain that the country has effectively been occupied by OFN garrisons. With many places requisitioned for military use, native Icelanders cannot freely use or profit from many areas of their own country. In the eyes of some extremists, the American presence in their own country is both omnipresent and unaccountable, ranking alongside the German Nazis in that regard.\n\nHowever each person feels, the relationship between Iceland and America is and will remain special. But the direction it takes depends on the choices of both Iceland and America."
 ICE_tensions_at_keflavik: "Tensions at Keflavík"
 ICE_tensions_at_keflavik_desc: "The closer one gets to Keflavík Airport, the more one feels the local residents' anger at the American garrison. The reason is simple: this, Iceland's largest airport, is the hub where the Americans operate day and night.\n\nHowever lofty the excuses - defending democracy, promoting free nations' ties - to the Icelandic residents who deal with the Americans every day, the American presence is nothing but a huge nuisance. The Americans staying in Iceland is, to put it mildly, overweening, and to put it bluntly, outright oppression.\n\nSo far, people have endured it, but as the situation worsens, no one knows how long that endurance will last."

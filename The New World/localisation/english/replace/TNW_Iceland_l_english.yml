 ICE.skeleton.3.t: "Escalation"
 ICE.skeleton.3.d: "All disputes in the world begin with the smallest things. A few rebellious Icelandic kids giving the order-of-the-day salute to patrolling GIs; an Icelandic beauty passing by as an American brags to his buddies about his fantasies; the woman, hearing, pulls her coat tight and tries not to notice. Radical students gather outside the American base every day, chanting slogans. It is all unpleasant, but expected. Everything is normal.\n\nOf course, normal as it is, things start to change. Year after year, the GIs grow more arrogant, the protesters more numerous. Perhaps, deep down, those kids' insolent postures are more than adolescent rebellion.\n\nBeneath Iceland's veneer of normalcy, a fire burns. However much both peoples ignore it, it is always there. No one is prepared for the eruption of an Iceland that sits like a volcano ready to blow."
 ICE.skeleton.3.a: "The arrow is nocked and must fly."
 ICE.skeleton.4.t: "The Thanksgiving Murder"
 ICE.skeleton.4.d: "Ólafur sat in his office at the Reykjavík Gazette, gazing at the pretty young woman sitting cross-legged before him. She tried to keep her makeup understated, but it was obvious. Ólafur noted this for the article, to show sympathy. He leaned forward. "So, Sigrid, recall..."\n\n"A few days ago, we were at a bar," she said, forcing a note of resolve into her voice. "Me, my boyfriend Arni, and his friend Svein. It was a normal night, we were laughing, and then four Americans showed up. They were clearly drunk, probably because of Thanksgiving. One of them kept staring at me, and then he wouldn't take no for an answer, you know. I tried to walk away, and then he..."\n\nShe swallowed, wiped her eyes. "Arni... wanted to take us away. But Svein didn't want to go. He punched him, and they jumped him, and Arni stepped in front of me. One of them punched him, he fell to the ground, and they kept stomping and kicking him; at first he was shouting, then whimpering... I'll never forget the silence. Afterward, they just... left, without a word." Her eyes held Ólafur's steadily throughout.\n\nÓlafur realized she was finished, nodded. "Very good, very good. Thank you for telling your story with such courage. This paper will do everything in its power to see justice done." She nodded, stood, and walked out. Ólafur smiled. The wind had been picking up for days, but if a local was killed... if the Gazette reported it, his paper would be famous. He turned to the typewriter and began to work."
 ICE.skeleton.4.a: "Greed and lust."
 ICE.skeleton.5.t: "The Reykjavík Riot"
 ICE.skeleton.5.d: "By the time the White House received word from the US embassy in Iceland - "something has happened" - crowds had already gathered outside the Alþingi and the embassy. They held that day's Morgunblaðið, with a damning headline:\n\n"America Tries to Cover Up Murder Involving OFN Soldiers"\n\nThe minutes of a secret meeting between the Icelandic government and the American ambassador had been printed in full, including the plain details of various "material incentives" Washington was prepared to offer - if only the "small matter" could be swept under the rug. Worse, it was already too late: the perpetrators - two pilots arrested for drunk driving that ran over a child - had already been handed over to the American military police.\n\nHelplessness and humiliation quickly turned to rage and frenzy; the people of Reykjavík gathered to vent their anger. The Alþingi adjourned, politicians huddling indoors away from broken windows and the roaring crowd. The street outside the American embassy was a wasteland of burned-out car hulks and shell casings.\n\nAfter a few days, the violence subsided, but protest marches and demonstrations continued. Under the banners of leftists, nationalists, students, and retirees, Icelandic society found common cause in its disgust for America and the OFN."
 ICE.skeleton.5.a: "Cover-ups only make it worse."
 ICE.skeleton.6.t: "The Great Shutdown"
 ICE.skeleton.6.d: "The crowd before the Keflavík Air Base perimeter grows wave after wave, surging against the wall of American military police. Air Force technicians in the control tower can clearly see, across a strip of grass, the protesters' raised placards: "No OFN, No Peace."\n\nProtests have been frequent lately, but every MP secretly prays to get through his tour without incident. The crowd has been growing for a month - and with the government doing nothing, the trend shows no sign of slowing. Perhaps the inaction is the root of it - Reykjavík cannot say so outright, but someone must listen to the people's voice.\n\nThe MPs huddle behind their shields as rocks fly. Several are dazed, screaming and dropping their shields. A whistle sounds in the crowd, the protest ranks stir, and a group surges forward, trying to punch a breach in the police line.\n\nMeanwhile, armed soldiers in the rear raise grenade launchers, lobbing tear gas canisters one after another into the scrum. Several armored vehicles, rebuilt from the base's fire trucks, train water cannons on the advancing protesters, pushing them back into the thick tear gas.\n\nAs the protesters withdraw, the airmen in the tower finally breathe. At least today, they won't have to burn documents and destroy equipment - but no one knows how long this peace will hold."
 ICE.skeleton.6.a: "The Icelandic people simmer on a slow-burning fire."
 ICE.skeleton.7.t: "Stirring the Pot"
 ICE.skeleton.7.d: "For Washington, Iceland electing [ICE.GetLeader] as Prime Minister was bad news to begin with. But [USA.GetLeader] had hoped they could find a peaceful way out of Reykjavík's political impasse.\n\nThen things got worse - deliberately, by one side or another.\n\nDay after day, protesters dug in around the American embassy and the Reykjavík base, chanting, condemning America and the OFN for holding Iceland's affairs. The police - who had set up cordons around American facilities to show they were maintaining order - backed off, and the protesters' space grew, pressing right up to the gates of the two American installations.\n\n[ICE.GetLeader] addresses the nation on television each week, noting that negotiations with the OFN are proceeding slowly, but that Iceland is willing to wait until the Icelandic people's demands are heard. The OFN has no right to dictate to Iceland as it does to its commissionariats, he says; until the OFN understands this, no productive foundation exists for talks.\n\nAll well and good, and the media ate it up. But in the State Department's eyes, there is only one conclusion:"
 ICE.skeleton.7.a: "The Icelandic government is inciting the mob."
 ICE.skeleton.8.t: "The Icelandic Domino Totters"
 ICE.skeleton.8.d: ""The Icelandic government has collapsed, Mr. President."\n\nPresident [USA.GetLeader] took a few minutes to absorb the daily briefing, then sighed. Out of all proportion to its size, the images from Icelandic streets had been in everyone's eyes and minds these past weeks - burning cars and wreckage drawing the attention of every OFN capital from Washington to Canberra.\n\nNo one thought the Icelandic government could go on. The priority now was to stabilize the situation.\n\nA caretaker government, even led by a former PM, lacks the authority to govern Iceland or shoulder its crucial military position in the North Sea; it might even provoke protests threatening the security of Keflavík Air Base. America calling for calm is useless, even counterproductive, pouring fuel on the fire.\n\nAt this moment, the American giant can only stand with its hands tied. As the mightiest OFN nation, it cannot act in Iceland for fear of making things worse. Even as [USA.GetLeader] begins the most minimal official measures, this state of affairs has every bureaucrat in Washington deeply uneasy."
 ICE.skeleton.8.a: "Perhaps Canada or Australia can calm them?"
 ICE.skeleton.9.t: "Flames Rekindled"
 ICE.skeleton.9.d: "Christmas approaches; the Icelandic people return home, light their hearths, and celebrate the new year. Another year of worries and annoyances is declared over, and they can rest before the new year arrives.\n\nAfter all, the Americans took on the thankless task of watching the Germans. After all, they occupy other nations' lands, so doing the dirty work is only their due.\n\nDays pass. With the dawn of the year [GetYear], students leave their homes and return to the streets, passing by their classrooms without a backward glance. They have more important things to do than study history or math - they are about to fight for Iceland's soul, a fight that belongs to them alone.\n\nBut even as American embassy diplomats prepare for another year of protests and riots, they will be poring over newspapers and gossip columns, looking for any advantage in the upcoming Alþingi election.\n\nThe students know it too. Soon the streets are plastered with posters and slogans: some welcoming the OFN, others denouncing it as a puppet master; some firmly supporting the Icelandic government, others dismissing it as an American lapdog."
 ICE.skeleton.9.a: "For Iceland and the world, [GetYear] will be a crucial year."
 ICE.skeleton.10.t: "The Icelandic Campaign Begins"
 ICE.skeleton.10.d: "Though Reykjavík had been campaigning for months and posters were already up, the official start of the [GetYear] Alþingi election took the State Department some resolve to accept.\n\nSince anti-OFN protests erupted in Iceland, one fact has confronted policymakers in Washington and Germania: the North Atlantic faces a historic turning point. With the future of Iceland's relations with the OFN the focus of national attention, this election has become a referendum on the OFN. America cannot lose this vote.\n\nEven if Iceland does not fully leave the OFN - after all, Iceland has no love for the Nazis - cracking a crack in the OFN's armor would be a victory for Germania, right at the gate of the German European wall. Though politics is a crooked, ambiguous game, geopolitics has always been zero-sum, and Iceland is now the focal point and stage of the Cold War.\n\nThere will be speeches, meetings, perhaps a "charitable" campaign donation or two. It will all be worth it - at least, that is what the Americans tell themselves."
 ICE.skeleton.10.a: "Failure is not in the dictionary."
 ICE.skeleton.11.t: "The Icelandic Campaign Begins"
 ICE.skeleton.11.d: "Though Reykjavík had been campaigning for months and posters were already up, the Foreign Ministry took some effort to accept the official start of the [GetYear] Alþingi election.\n\nSince anti-OFN protests erupted in Iceland, one fact has confronted policymakers in Washington and Germania: the North Atlantic faces a historic turning point. With the future of Iceland's relations with the OFN the focus of national attention, this election has become a referendum on the OFN. Germania knows such opportunities are rare.\n\nEven if Iceland does not fully leave the OFN - after all, the OFN will never let Iceland walk - cracking a crack in the OFN's armor would be a victory for Germania, securing a vital breathing room for Germany on the shores of the vast European ocean. Though politics is a crooked, ambiguous game, geopolitics has always been zero-sum, and Iceland is now the focal point and stage of the Cold War.\n\nThere will be secret meetings, incitement, perhaps some "local" campaign donations, even if the beneficiaries are the worst sort of socialists, intolerable elsewhere in Europe. If this can disrupt the OFN from within, it is a price worth paying."
 ICE.skeleton.11.a: "This opportunity must not be wasted."
 ICE.skeleton.12.t: "An Anti-OFN Government Wins in Iceland"
 ICE.skeleton.12.d: "When the Icelandic election results were announced, bursts of dazzling color and fervent cheers erupted in the square outside the Alþingi.\n\nProud, elated, jubilant - all on the faces of the protesters and activists gathered to celebrate the moment. The other factions are largely unmoved - they are right to stay home, for Iceland's new political reality has confirmed that their brand of politics does not play here.\n\nThe people have spoken; the OFN has lost Iceland's heart.\n\nThe swearing-in press conference is broadcast live across the island at dawn. The new administration speaks of its wish to maintain "friendly relations" with America and the OFN. But it also insists Iceland must be treated as an equal - the island will never agree to become a Washington military base, a garbage dump for the US military's broken equipment and discarded soldiers. The new government has already summoned the American ambassador and will immediately begin the process of leaving the OFN.\n\nAs people linger in Parliament Square, savoring the unexpected victory before the world's eyes, some begin to wonder what comes next. Many have fought for this moment and this moment alone. Now they will throw stones at America to see how she reacts.\n\nIn the days and weeks after the election, the crowds in the square have not fully dispersed; they turn their energy to preserving the fruits of victory, preparing to steer the ship of Iceland toward a new future - they have their answer."
 ICE.skeleton.12.a: "The people will stand united, facing the future."
 ICE.skeleton.13.t: "An Anti-OFN Government Wins in Iceland"
 ICE.skeleton.13.d: "When the Icelandic election results were announced, bursts of dazzling color and fervent cheers erupted in the square outside the Alþingi.\n\nProud, elated, jubilant - all on the faces of the protesters and activists gathered to celebrate the moment. The other factions are largely unmoved - they are right to stay home, for Iceland's new political reality has confirmed that their brand of politics does not play here.\n\nThe people have spoken; the OFN has lost Iceland's heart.\n\nThe swearing-in press conference is broadcast live across the island at dawn. The new administration speaks of its wish to maintain "friendly relations" with America and the OFN. But it also insists Iceland must be treated as an equal - the island will never agree to become a Washington military base, a garbage dump for the US military's broken equipment and discarded soldiers. The new government has already summoned the American ambassador and will immediately begin the process of leaving the OFN.\n\nAs people linger in Parliament Square, savoring the unexpected victory before the world's eyes, some begin to wonder what comes next. Many have fought for this moment and this moment alone. Now they will throw stones at America to see how she reacts.\n\nIn the days and weeks after the election, the crowds in the square have not fully dispersed; they turn their energy to preserving the fruits of victory, preparing to steer the ship of Iceland toward a new future - they have their answer."
 ICE.skeleton.13.a: "The people will stand united, facing the future."
 ICE.skeleton.14.t: "A Pro-OFN Government Wins in Iceland"
 ICE.skeleton.14.d: "When the Icelandic election results were announced, everyone could see the square outside the Alþingi stirring.\n\nShocked, in denial, tearful - all on the faces of the protesters and activists gathered to celebrate the victory they had expected. The other factions - those who, however annoying a neighbor America may be, voted for the faction that would stabilize relations with the US - are largely unmoved, but they have no need to celebrate.\n\nTheir vote is their voice; they favor the status quo.\n\nCredit where due, the new administration also acknowledges the need for some changes to the status quo. It sets out to negotiate with the Americans on: "renegotiating the criminal justice jurisdiction framework," increasing American economic investment in Iceland, and imposing stricter curfews. But Iceland remains in the OFN, the only organization that can guarantee Iceland's security.\n\nThe morning after the election, a diehard group holds position outside the Alþingi, waving their flags and chanting to the scattered crowd. But night falls early the second day; by dusk the roads outside the city center are clear, the protest barricades cleared - and by the third morning, the last protesters have retreated to their warm cottages."
 ICE.skeleton.14.a: "Tending to the wound that never heals."

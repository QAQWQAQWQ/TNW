 GRN_the_beginning_of_a_new_era: "The Dawn of a New Era"
 GRN_the_beginning_of_a_new_era_desc: "Only a decade ago, a free Greenland, answerable to no one, was but a topic of conversation among the academic elite at their home dinners on this far-northern island. Today, however, Denmark is gone, and Iceland moves on. This is the reality the Greenlandic people face.\n\nWith it comes a young, fledgling two-party political system: the democratic socialist, regionalist Siumut, pitted against the pro-OFN, somewhat conservative Atassut. Now everything is a matter of debate - after all, the Greenlandic people have never known freedom and are dizzy from the first taste. But one thing is certain: more than ever, the people of Greenland care about their own future."
 GRN_combatting_the_long_winters: "Enduring the Long Winters"
 GRN_combatting_the_long_winters_desc: "As expected for a nation so close to the North Pole, the long, cold winter is the greatest danger in the Greenlandic people's lives. Year after year, heavy snow disrupts life and lowers living standards; then, first ruled from Copenhagen and now administered from Reykjavík, made everything worse.\n\nNow, however, Greenland is its own master, and Iceland's withdrawal from the OFN has made Greenland a fresh target for Western investment. Though the weather outside remains bitingly cold, at least the influx of foreign capital makes the long winters a little more bearable."
 GRN_the_arctic_puzzle_piece: "The Arctic Puzzle Piece"
 GRN_the_arctic_puzzle_piece_desc: "Iceland's break with the OFN, and Greenland's ensuing local autonomy, together have given Greenland an importance like never before. Even the Viking explorers of old and the native peoples who contested the land with them would be surprised by how foreigners now value the land Erik the Red called "Greenland."\n\nGreenland has suddenly become a focus, and the reason is simple. If the OFN wishes to maintain control of the North Atlantic, and especially the Arctic, it must hold onto Thule Air Base on Greenland's northwest coast. Thus, with Iceland's exit, the OFN has begun pouring large amounts of money and personnel into Greenland, for two purposes: first, to maintain Greenland's loyalty; second, to secure Thule."
 US_Greenland.1.t: "A Dreadful Sight"
 US_Greenland.1.d: "Derek Bronson's hope began to wither the day he learned he was posted to Greenland, and died entirely when he actually set foot on the land. But the airman, ever the dramatist, decided to give this frozen, desolate, godforsaken island a chance - and later he was glad he did. Though the cold is endless, Derek soon found the island more like home than he expected. The daily trek through the snow between the airfield and the neighboring town had become routine, and he never tired of it. The military-issue arctic gear was surprisingly comfortable; the leather cold-weather mask, though it looked like a serial killer's, grew on you. When he pushed open the door of the small-town diner, old Illinois felt almost within reach. The town, built up around the American base, was steeped in the American values of the stationed families - and not just here; even in the bigger towns like "Nuuk," the American flavor was everywhere. As he mused, his buddy Carlos sat down across with a tray, a faint smile on his lips but worry between his brows. After the small talk, the Puerto Rican's face grew serious.\n\n"Derek, you hear about Jerry?" At Derek's shake of the head, Carlos leaned in. "He locked himself in the barracks for a day, and when he came out, they rushed him to the infirmary. Can you believe that shit?"\n\n"God." Derek swallowed, stomach churning, and pushed his coffee away. "This is Greenland, brother. First Calhoun, now this?""
 US_Greenland.1.a: ""That's just how it goes, buddy.""
 US_Greenland.2.t: "No, It's Not Green At All"
 US_Greenland.2.d: "Lars's first clear thought that day was: I'm going to drink heavily once this is over. The second followed immediately: breakfast on an empty stomach again. Pulling his thin coat tight, the young Greenlander set off down the frosty road toward Nuuk harbor. Living in the shantytown on the edge of the capital, the daily trek across the city had become torture, and the continued American presence was squeezing living space ever tighter. The coastal housing had already been seized by military families; Lars's family huddled in a cramped six-room place on the city's outskirts. If it were not for the frostbitten beggars curled up along the way and the hailstones looming overhead, this precarious existence might be bearable.\n\nThe fishy stench of the harbor reached him, and Lars lit his treasured cigarette. He pulled on his Frankenstein's-monster outfit: a patched, patchwork coat over a lice-ridden undershirt, overalls stained through to the fiber. The fishing boats were making their final preparations; though he was half an hour late, the sailors whistled at him good-naturedly. He was the only one in the fleet still living with his parents out in the suburbs; no one minded his hauling a few extra crates of gear.\n\n"Lars!" someone roared. "Get your ass over here before the tide takes you!"\n\nThe young man grinned and ran for the gangplank. Only in the Atlantic's embrace could he throw off the double yoke of Greenland and America. As Nuuk's outline faded in the morning mist and the briny wind filled his lungs, Lars could finally breathe. Suddenly the sky hummed with a B-52, and the banter on deck fell silent."
 US_Greenland.2.a: "It's been a rough day."
 US_Greenland.3.t: "Project Iceworm Phase I Feasibility Assessment"
 US_Greenland.3.d: "Classification: TOP SECRET\n\nCompiled at: Camp Century, Greenland\n\nSubmitted by: Colonel John C. H. Lee, Major Bennett L. Lewis\n\nAppendices at end of document\n\nProject Iceworm aims to deploy 600 medium-range ballistic missiles through a 4,000 km tunnel network dug beneath the Greenland ice sheet. The site is located 240 km east of Thule Air Base (77°N, 61°W). Missiles will rotate periodically between ice shelters, forming a mobile strike system that is both hard to target and multiply protected by the ice.\n\nTo date, 3,000 meters of tunnel and supporting facilities have been completed, including a small nuclear reactor and an internal rail system.\n\nThe base's goal is to provide the US with a first-strike capability against Germany and to withstand any incoming attack. The missiles, designed specifically for arctic conditions, are being developed by a top-secret team at McMurdo Station in Antarctica, under the direct supervision of Vice Admiral William Raborn.\n\nDespite the Corps of Engineers' best efforts, Iceworm Phase I is failing. The Greenland ice sheet's constant movement is causing tunnel collapses and burying launch silos; construction crews are already at high risk working within the ice. Given the project's unsustainability, this team recommends abandoning Camp Century and redirecting resources to Iceworm Phase II.\n\nOur team departs tomorrow for a preliminary survey of the destination: ..."
 US_Greenland.3.a: "(Redacted)"
 US_Greenland.4.t: "Invisible Misery"
 US_Greenland.4.d: "The supply run was uneventful, and Bernard was glad for the quiet - after covering the recent riots back home, a dull assignment was just the thing. The accompanying soldiers were also in good spirits at the thought of possibly making page two of the New York Times, though news of shipping supplies to Greenland usually only squeezed into the corners. For Bernard, though, peace always came with a kind of loneliness. As the cargo ship steamed into Nuuk harbor, that peace began to freeze in his chest.\n\n"Mother of God..." he muttered. The soldier beside him took a few seconds to realize the appalling sight they were both staring at: the channel to the dock was blocked by a floating tent city. A deckhand sauntered over, cigarette in mouth, firelight on his hard face.\n\n"Mr. Lefkowitz, that's..."\n\n"Oh that? The residential district burned to the ground last month - as if it mattered anyway. The churches are all packed, folks with no kin crash at friends' places, then the friends' places burn too, so they all pile up out here." He spat into the sea. "The dumpsters are overflowing. If you ask me, these goddamned vagrants... but they're about to clear them out; the MPs are on their way."\n\nBernard and the soldier stood frozen. From the harbor came the clatter of treads on ice; an armored personnel carrier was approaching the pier entrance. The reporter suddenly snapped awake and tore open his camera bag; his fingertips trembled but locked onto the focus with precision. Through the viewfinder, shattered lifeboats collided with riot shields - this might be the masterpiece of his career."
 US_Greenland.4.a: ""The territories always suffer in silence...""
 US_Greenland.5.t: "A Cold Shoulder"
 US_Greenland.5.d: "Rob crashed through Jack's office door, slipped inside, and locked it behind him. Jack, who had been hunched over his desk writing, looked up just in time to see Rob press himself against the venetian blinds, peering out - not checking for tails, but estimating how far behind the pursuers were. "What the hell is wrong with you?" Jack had barely got the words out when Rob wiped the cold sweat from his brow. At minus twenty degrees, the man was steaming like he'd just run a marathon.\n\n"You're goddamn right something is! The brass thinks we're tied up in this!" Rob was almost shouting, his neck still craning nervously toward the window. Jack took a deep breath.\n\n"Robert, you'd better make yourself clear."\n\n"You idiot! Look at this Greenland piece in the Times! Those communist fucks caught footage of the riot police clearing a camp, just because we were cracking down on vagrants like they were rioters!" The newspaper hit the oak desk hard enough to raise dust. On the front page, a frostbitten corpse with missing hands curled in tear gas; the caption described the misery beneath the pro-American regime's glossy facade. The opposition was making hay, striking a chord with many, especially Alaskans.\n\n"You're right. I'll get on it immediately." Jack nodded mechanically, until he noticed Rob staring at him like he was an idiot. "Thank you for the timely report, Robert."\n\nThe moment the door closed, Jack knew he was in trouble. These images might take decades to ferment, but Greenland was a ticking time bomb that would eventually be noticed. He grabbed the phone and called his superior."
 US_Greenland.5.a: ""It's Jack. We've got a problem.""
 US_Greenland.6.t: "Smoothing the Cracks"
 US_Greenland.6.d: "Greenland has always been a headache for the State Department. When Sullivan set out to handle Greenland affairs, he understood the problem more deeply. The place is... an independent nation? A colony? A pseudo-colony? That itself says something. Greenland is no uninhabited land; there are people, though not many.\n\nAt the same time, America's presence in Greenland is regulated by no written law, and the Greenlandic people have no choice but to tolerate it. And Sullivan feels this means America owes a responsibility to the island - and many journalists who follow Greenland affairs agree.\n\nThe New York Times and several smaller papers ran articles describing America's administration in Greenland, articles that made readers shake their heads in dismay. Ruthlessness, incompetence, mismanagement were all laid bare in embarrassing detail, and the suspicious ties between Greenland and America, plus high unemployment, made it worse.\n\nSo Sullivan was tasked with solving these problems.\n\nThe good news is that hammering out some solutions is not hard. Fishing is Greenland's only industry, and it is enough to ease many of the problems, enough for Sullivan's needs. He proposes to massively expand the fishing industry, which would not only lower unemployment but bind the country's national interests more deeply to America's, so Greenland is no longer just a "glorified" US base.\n\nAt the same time, the costs are clear - the plan will not bear fruit for several years; it requires sustained American investment. Its most immediate effect is to answer those who want America to take positive action on Greenland. For now, that is enough."
 US_Greenland.6.a: "A victory on the propaganda front is still a victory."
 US_Greenland.7.t: "No Struggle, No Gain"
 US_Greenland.7.d: "Iceland is a beautiful country. Every day spent here invites reflection and leisurely walks. But lately, Moses Olsen has been thinking about the future outside the University of Iceland.\n\nHis university days are nearly over; he will finish his degree in literature and history and return home to Greenland. Though he has been happy in Iceland, he cannot suppress the desire to return to the island he and his fiancée Eliza call home. Homesickness has grown stronger in recent months.\n\nHe has never been able to accept the state of his homeland. At best, it is an American military base; at worst, a garbage dump. To Americans, Greenland is a strategic asset, but the islanders are just in the way. America cannot even be bothered to administer the islanders as a colony or a territory.\n\nIn his studies, Moses grew accustomed to the term "occupation." In this respect, Iceland and Greenland are similar - though the former has nominal independence and his homeland does not.\n\nMust it be this way? He disagrees.\n\nThe native people of Greenland have rarely formed social movements or political forces - but then again, when have they ever tried? If such a force coalesced, would the Americans be so arrogant and reckless in occupying Greenland? He turns the question over, considering similar cases in history, and reaches a conclusion: someone has to be the first to act.\n\nPerhaps that someone is him."
 US_Greenland.7.a: "No struggle, no change."
 US_Greenland.8.t: "The Canadian Lesson"
 US_Greenland.8.d: "Canada's political environment is far more interesting than Jónatan Mortzfeldt expected before he came to study here. He doubts anyone would expect a theology student - especially one from Greenland - to take such an interest in politics. In that sense, he is certainly unusual.\n\nUnusual for good or ill, depending on who judges.\n\nIn his theology courses, Mortzfeldt spent a great deal of time studying Quebec and Quebec's struggle for independence. Every Canadian has an opinion on Quebec; he learned the hard way that it is a subject that can start a fight in a minute. Even so, he genuinely agrees with the Quebecois' goal of independence, because he sees his own homeland in Quebec.\n\nQuebec is regarded as an inalienable part of Canada. Though Greenland is not as important to America, it is de facto American informal territory. Even so, can they one day build an independent nation? No doubt the Quebecois are asking the same question. Though their plight is harder, they have never given up the struggle.\n\nThis greatly inspires Mortzfeldt to restart the fight. He knows that only under pressure will Greenland win independence. They just need the people to start demanding it. No one can shoulder the burden yet, but he knows supporters of independence exist. Once he finishes his studies in Canada, he is determined to push this cause forward.\n\nHe sees in his mind's eye a future where Greenland is free of foreign control. If he has learned anything in Canada, it is that the road ahead will be long and thorny. But then, what is worth pursuing that comes easy?"
 US_Greenland.8.a: "They must press on."
 US_Greenland.9.t: "A Wedding in Sisimiut"
 US_Greenland.9.d: "Moses Olsen has lost count of how long he has waited for this day. Weddings are always stressful, but even with all the difficulties, setbacks, and small mishaps, when he sees the woman he is about to marry walk down the aisle surrounded by well-wishers, everyone's smiles escorting her, everything melts away.\n\nHis closest friend Jónatan Mortzfeldt is smiling at the couple. He just finished his religious studies in Canada and is now a full-time minister. He insisted on officiating even if the wedding had to be postponed; he is glad he made this decision.\n\nMortzfeldt formally begins the ceremony. He reads a prayer and gives a short sermon. In the sermon, he tells a few amusing stories from their years of friendship. Then the couple finally begins their vows.\n\nBoth are curious what this moment is really like. They had imagined their lines hundreds of times, but when the moment comes, when they must declare their vows publicly before each other, it is still hard to say. When the vows are done, they hold hands and exchange rings. Mortzfeldt breaks into a smile. "I now pronounce you husband and wife. You may kiss the bride."\n\nTo the guests' applause and cheers, the newlyweds Moses and Eliza Olsen share a deep kiss and leave the aisle. The rest of the night belongs to food, song, and revelry. Both know what the days ahead hold. Ever since Moses returned home from Iceland, the two have sworn to fight side by side for a better future for the homeland.\n\nTheir future will be a struggle for independence. Independence is, of course, a goal beset with difficulties, but those are worries for the future. Right now, they have and belong to each other, and that is what matters most."
 US_Greenland.9.a: "Congratulations to the newlyweds!"
 US_Greenland.10.t: "Stopping the Whirlpool"
 US_Greenland.10.d: "Even under ideal circumstances, the Greenland Landsting is but a rubber stamp. When America took over Greenland, it absorbed the existing Danish colonial institutions and merged the two assemblies that then existed, introducing elections in the process. This assembly is said to govern Greenland, giving the Greenlandic people some representation.\n\nThe reality is far less rosy.\n\nIn theory, the Landsting holds real power. It is the only legitimate legislative body in Greenland recognized by the US, but historically, the Americans have used it only to provide basic administrative services and to dutifully stamp every "request" sent over by the US military and civil authorities.\n\nBut the assembly is seeking to change the status quo. Many members have seen the declining living standards in Greenland, especially among native Greenlanders, and are determined to act accordingly. Greenland's problems are piled high, from the disastrous state of education to the unequal treatment between American guest workers and native Greenlanders.\n\nSo the Landsting held its first session in memory not characterized by boilerplate, formalism, and empty results; they resolved to use the assembly's powers in practical, workable ways. The members are not sure how far they can decide these matters, but it is worth trying. At first everyone is excited - but soon the feeling evaporates.\n\nNo sooner does America learn what the Landsting is about to do than the handful of American interest representatives in Greenland begin applying pressure - they do not hesitate to squeeze Greenland's economy. Any small reform the assembly plans is stillborn, simply because the Americans oppose it."
 US_Greenland.10.a: "They tried everything; this is the best they can do."
 US_Greenland.11.t: "The Only One Who Decides"
 US_Greenland.11.d: "Working in Greenland's education department is an unpleasant job under any circumstances. Lars Chemnitz often feels like shouting at thin air. To outsiders, being the school superintendent of Ilulissat (Greenland's third-largest city!) is a position that carries a great deal of weight. But no matter how many reports he files upward, no matter how emphatically he stresses the dismal state of education in Greenland...\n\nIt always seems to be for nothing.\n\nIt is not that people are unmoved - several Landsting members have thanked him for his work and pointed to the problem. The problem is obvious to anyone who pays attention.\n\nSo when he saw the Landsting actually trying to take measures to solve Greenland's current problems, he was greatly encouraged. That encouragement lasted until he heard the string of failures that followed. The official reason given was that the assembly "lacked the support necessary for reform." He thought the wordplay was quite brilliant.\n\nIt was not that public or popular support was lacking - not at all. In Greenland, everyone knows reform is urgent. The government simply does not have the support of the one person who decides everything: the Americans. The Americans will likely force the assembly to drop these measures, and the assembly will obey.\n\nThis failure hits Chemnitz hard. Even purely out of pragmatism, America has nothing to lose by supporting Greenland. He can only conclude that the Americans simply do not value Greenland's interests. If it is time to give Greenland some room - it is now.\n\nHe can only hope America reconsiders its policy, otherwise he fears things will only get worse."
 US_Greenland.11.a: "The Americans could have done better."
 US_Greenland.12.t: "The Thule Disaster"
 US_Greenland.12.d: "Thule Air Base Accident Memorandum\n\nSummary: On January 21, 1968, Thule Air Base reported that a B-52 bomber on Operation Chrome Dome (an ongoing airborne operation designed to deter a German or Japanese first strike) had its crew forced to bail out.\n\nUnder Chrome Dome standing orders, all "Stratofortress" bombers carry nuclear weapons, and the crews could not attempt safety measures to reduce risk before colliding with the ground. The "Stratofortress" crashed not far from Thule Air Base; low-level local radiation has been confirmed, likely from conventional ordnance detonating. The four nuclear weapons on board are confirmed not to have detonated.\n\nAll crew survived and are recovering in hospital. The Thule team is currently assessing damage, local contamination, and environmental impact. Results are expected in a few weeks.\n\nImpact: The event has attracted widespread media attention. Local Greenlanders are furious, sharply condemning America and the OFN for their frivolous and derelict handling, and calling for stricter regulations or an end to Chrome Dome.\n\nGermany has issued a statement condemning America and the OFN as "irresponsible" and likewise calling for an end to the deterrence mission. The actual damage from this incident is small, but it has created a negative international perception. Known as the "Thule Disaster," it is expected to have some impact on America's and the OFN's reputation."
 US_Greenland.12.a: "At least the damage is not severe."
 US_Greenland.13.t: "Prospects of Independence"
 US_Greenland.13.d: "The crisis may have passed, but Lars Emil-Johansen still remembers the fear at the time, and then the anger when the first details of the Thule Disaster emerged. Yes, as the experts said, things could have been worse - but no one seems willing to admit that the core of the problem is that the Americans have nuclear weapons stationed in Greenland.\n\nIt is this emotion, or something he calls indignation, that brings him to today's lecture.\n\nHe is studying to become a teacher at Greenland College, but he has heard things about two people who seem to be giving an astonishing lecture that interests him. Word has it that Moses Olsen and Jónatan Mortzfeldt are doing something unprecedented - calling for autonomy.\n\nIf the packed lecture hall is any indication, he is not the only one interested. After a few pleasantries, the two begin their talk. It is a conversation about the future of everyone - not as an American colony, but as a truly independent nation. The two argue passionately, vivid words painting a future that fascinates Emil-Johansen and much of the audience.\n\nAfter the lecture, the two spend time talking with students, Lars among them. They say they are members of an organization whose purpose is to pursue what they call for. The organization is called "Siumut" - newly formed, loosely organized, and the first of its kind. Emil-Johansen knows he will be busy with his studies next year, but he is determined to follow the movement the two have joined."
 US_Greenland.13.a: "He sees a future he would fight for."
 US_Greenland.14.t: "A Step Toward Self-Rule"
 US_Greenland.14.d: "Lars Emil-Johansen knows full well he has not followed the path he began on. After graduating, everyone expected him to take a teaching post. Instead, he went to the Upernivarsuk observation station. There, everything was different.\n\nHe had been following Jónatan Mortzfeldt and Moses Olsen's Siumut movement, and after graduation he approached them. Siumut responded warmly, inviting him to the upcoming congress. They say they will take an important step on the road to Greenlandic self-rule. They were not exaggerating.\n\nTo the audience's thunderous applause, Mortzfeldt and Olsen announced the founding of the Siumut Party, the first party dedicated to Greenlandic autonomy. The two explain that the party's core platform is to achieve Greenland's autonomy and freedom and to implement a humane democratic socialism on the island. Finally, they issue an appeal to all attendees, inviting them to join and help the movement succeed.\n\nAfter hearing the vision, Emil-Johansen has a rather suspicious, even crazy idea. Elections for the Greenland Landsting are next year, and anyone is eligible to stand. So why not him? He is well-educated, willing to fight, and wants to make a difference. Why not?\n\nAfter signing up, he decides to take the podium and announce to the audience that he will run for the Landsting, calling on everyone else to run as well. The cheers and applause make the movement's two founders greatly encouraged. Hearing the cheers, Emil-Johansen is ecstatic. At this moment, they seem destined to succeed."
 US_Greenland.14.a: "Independence is inevitable."
 US_Greenland.15.t: "The 1971 Greenland Landsting Election"
 US_Greenland.15.d: "Across Greenland, thousands hold their breath waiting for the results of the Landsting vote. Siumut members, including Mortzfeldt, Olsen, and Emil-Johansen, have gathered; all three are running for seats on the council, and so they wait tensely for the results. Then the results are announced.\n\nAll three are elected to the Landsting.\n\nThe gathered Siumut supporters burst into cheers, and the three are incredulous at this unexpected, great victory. But does this not prove their cause is just? The people of Greenland support them. Excitement spreads everywhere; this is the first time many have imagined a truly free Greenland.\n\nElsewhere in Greenland, in a modest house in Ilulissat, Lars Chemnitz sits in his warm home, coffee in one hand and today's distributed newspaper in the other. As he reads the election results in Greenland's oldest paper, he can barely hide his satisfaction. Like the other outsiders, he too has been elected to the Landsting.\n\nOne thing is certain for him and for the successful new Siumut Party: the status quo the Americans have enjoyed for so long is about to end. Greenland is making its own future, and Chemnitz is more confident than ever that it will be a bright one."
 US_Greenland.15.a: "Greenland has entered its new era."
 US_Greenland.16.t: "Momentum Stumbles"
 US_Greenland.16.d: "When Siumut won a landslide in the Greenland Landsting election, optimism was rife, and people hoped independence would come immediately. The three Siumut leaders who seized power had hoped to capitalize on the momentum and make something of it.\n\nBut Iceland poured cold water on those visions.\n\nEach of the three leaders was deeply frustrated, even dismissive of Iceland's decision to stand firmly with the OFN and America. If Iceland had taken a more radical path, or even if the country had formed a more equal diplomatic relationship with the US, the three could have built on that. The status quo makes any change a mirage.\n\nThough the die is cast, the three continue their organizing. Greenland's independence may be off the table for some time, but when the time is ripe, it will be up to them to lay the foundation for the cause. Even though they hit wall after wall, they remain confident that the struggle will succeed.\n\nNot everyone is unhappy with the turn of events. Iceland's choice has cemented the OFN's presence, and in time more people will begin to notice the voice of the moderates - Lars Chemnitz. In his view, America provides Greenland with security that Greenland cannot provide for itself. Rather than angering the master, it is better to cooperate with them, for everyone's sake.\n\nThough many independence-minded people sneer at this "compromise," more are beginning to wonder if it is the better choice. It seems neither America nor the OFN will leave anytime soon; building a more solid relationship with them seems more attractive."
 US_Greenland.16.a: "What harm can better relations with the Americans do?"
 US_Greenland.17.t: "The Irresistible Tide"
 US_Greenland.17.d: "After Siumut's landslide in the Greenland Landsting election, a strong pro-independence mood swept the nation. Within living memory, the long-cherished wish and the possibility of independence had never been so strong. The momentum of independence has become irresistible. Some of the more clear-headed know it cannot last and are looking to ride this wave of emotion for as long as possible.\n\nThe momentum peaks when word reaches Greenland that Iceland and America have negotiated a bilateral treaty, with the text amended to be fairer and more equal to Iceland. Everyone sees clear, real evidence that the independence they fight for is entirely achievable.\n\nGreenlanders rush to join pro-independence parties, including Siumut and the new parties that have sprung up like mushrooms in the movement. An unprecedented political revolution has occurred, and genuine multi-party politics is taking shape on the island. Siumut's youth wing is hugely popular and quickly becomes the most radical faction in its demands and intentions.\n\nThe longing of the Greenlandic people is further confirmed when the Landsting announces an agreement with American officials to greatly improve economic development and living conditions on the island.\n\nIn just a few short months, events have progressed to an unprecedented degree. Full independence may still be some distance away, but everyone on Greenland knows it is no longer a fantasy.\n\nIn fact, many have begun to believe that independence is irresistible. Until the day of independence arrives, everyone must keep fighting. Barring an accident, one thing is certain for both Americans and Greenlanders:"
 US_Greenland.17.a: "They are heading toward a brighter new future."
 US_Greenland.18.t: "Ripples Across the Atlantic"
 US_Greenland.18.d: "Glancing at the headlines on the base's military bulletin, Jacob frowned. It had become his habit to read the paper before patrol; usually nothing caught his eye. Until today. More importantly, the paper's content concerned his post.\n\nAmerica has ordered the establishment of a Greenland Autonomy Commission.\n\nThe hell?\n\nJacob is just an officer, but he had not even grasped that this could really happen, let alone that it was likely. A moment's thought and he figured out who was behind it. Ever since the Greenland autonomyists won their landslide in the Landsting election, he had known America was watching them carefully.\n\nIronically, the push for these radical measures was Iceland's recent decision to leave the OFN, and had nothing to do with America. Though this heavy loss is very unpleasant, he actually did not know what real effect it would have beyond the OFN losing a strategic foothold.\n\nEvents proved that idea very wrong.\n\nEver since Iceland left the OFN, the three autonomyist leaders - Olsen, Mortzfeldt, and Emil-Johansen - have been holding marches and protests along Greenland's west coast, and it seems many in Washington are seriously considering opening dialogue with them. Whether to placate them or possibly meet their demands is unclear.\n\nJacob does not know what the future of the US garrison will be, but he sincerely hopes Washington does not repeat the mistake it made in Iceland."
 US_Greenland.18.a: "Whatever happens, it is clear he has no say."
 US_Greenland.19.t: "Persistence"
 US_Greenland.19.d: "The Greenlandic people welcome the State Department delegation cautiously but joyfully. They know the fate of the independence movement will be decided today. The American representative greets the Landsting members, shakes hands, and poses for photos with reporters.\n\nBoth delegations walk together into the Landsting chamber, and the doors close behind them. Everyone knows the assembly will make its demand for independence, and that the Americans hold the final decision.\n\nHours pass; the waiting crowd grows, and the media interviews those involved in the independence movement. For Americans watching the live broadcast on the North American continent, many are hearing about the Greenland independence movement and its cause for the first time.\n\nSuddenly the doors swing open, and as State Department officials and Landsting members emerge, the media scramble for position. One glance at the smiles on Olsen, Mortzfeldt, and Emil-Johansen's faces and they know it is done.\n\nThe State Department spokesman clears his throat before speaking. He announces that, after full consultation with the Landsting, the United States has agreed to grant Greenland self-rule. The United States will work in mutual support with the Landsting, and formal elections for Greenland's first national assembly will be held within six months.\n\nBefore the spokesman finishes, his voice is drowned in the crowd's cheers and applause. The Landsting members join in, all smiling, immersed in this historic moment. The road to this moment was long, but in the end, Greenland holds its own destiny."
 US_Greenland.19.a: "Another colonial shackle has crumbled."
 US_Greenland.20.t: "Our Flag"
 US_Greenland.20.d: "The election is imminent, but before that day comes, the Greenland Landsting will continue to manage the country's daily affairs. Before the full transition to home rule, there is still much to do. Many complex problems must be solved, and of course there are other equally important but less critical issues, but together they will shape what the newly independent Greenland will look like.\n\nOne of them is the national flag. Fortunately, they have several options.\n\nThule Christiansen is a teacher and artist by profession, but he is also a friend of Mortzfeldt's, and Mortzfeldt believes his friend has a new flag entirely worthy of free Greenland. On his recommendation, the assembly summons him. Though he looks nervous standing before the council, he is composed as he presents his flag proposal.\n\nThe design is simple: a specially designed circle in the center-left of the field, representing the sun rising over Greenland's cold, hard ice. Thule Christiansen chose red and white as the flag's main colors, inseparable from their former Danish masters, after all, their culture and every part of their life bears the Danish imprint. After he finishes explaining, the council thanks him for his design and begins the debate.\n\nThe members are divided. Many like its execution and style, but some still prefer the green-and-white Nordic cross. The debate lasts longer than expected, and with the vote below expectations, the council decides to adopt Christiansen's design.\n\nOnly a few days later, the Landsting holds the unveiling of Greenland's new flag; it soon flies proudly over the government building and quickly becomes a familiar sight across the country."
 US_Greenland.20.a: "Greenland's identity is further consolidated."
 USA_Greenland_flag_tt: "§gRaising the§! §VGreenlandic§! §Wflag§!, the Greenlandic people finally have a flag of their own.§!"
 US_Greenland.21.t: "The First Greenlandic Parliamentary Election"
 US_Greenland.21.d: "Greenland's first national election opens to great fanfare, and the high turnout nearly makes the day an unofficial national holiday. After voting, many gather with friends and family to wait for the evening results.\n\nFinally, the results are in.\n\nThe result is beyond doubt: Siumut is the undisputed political winner, and this is no small encouragement for supporters across the country. Though they dominate in the newly formed Greenland parliament, they are not without rivals; Lars Chemnitz's conservative Atassut also holds a minority of seats.\n\nIn the days that follow, the parliament holds its first session, and though there is talk of several candidates for Prime Minister, the assembly settles on a clear choice. As the party's moderate and the leader who brought Greenland to self-rule, Jónatan Mortzfeldt is elected as Greenland's first Prime Minister.\n\nBefore Mortzfeldt addresses the nation and parliament for the first time and announces his cabinet, he thanks his many close partners and the Greenlandic people for helping him achieve such a historic moment. Many familiar names appear in the first cabinet: Trade Minister Lars Emil-Johansen, Social Minister Moses Olsen, Culture Minister Thule Christiansen.\n\nEveryone watching, whether Greenlandic or not, knows this joy will soon fade, and this young nation will enter growing pains, facing the problems inevitable for any new democracy. Yet this is a price each of them is willing to pay, because for the first time, their destiny is in their own hands."
 US_Greenland.21.a: "Greenland's future is now in her own hands."
 FAR_a_decade_of_3_occupations: "Three Occupations in a Decade"
 FAR_a_decade_of_3_occupations_desc: "Throughout modern history, until a little over a decade ago, the Faroese people lived under the rule of overseas nations, knowing nothing of self-determination. In the 1940s, the Faroese, long ruled by Denmark, found themselves under a new British master, who was desperately resisting the German onslaught. When the Second World War dust settled, the Faroese found their master changed again, this time to the Yankees, who sought to secure their military presence in the region and keep the German puppet in Copenhagen from laying hands on the islands.\n\nEven though the Faroes have gained independence, they find themselves in the eyes of other nations still nothing more than a renamed military base. Given the OFN's strong presence at air bases such as Vagar and the islands' growing strategic importance, this stereotype will not fade anytime soon."
 FAR_the_fight_for_self_determination: "The Fight for Self-Determination"
 FAR_the_fight_for_self_determination_desc: "Since the end of the Second World War, the Faroese people have gained a prize that would have seemed unthinkable decades ago - independence. In these nearly twenty years, the people of the islands, led by organizations like the Home Rule Party, have won one great victory after another for national sovereignty, but much work remains. The fact that the international community does not see the Faroes as an independent sovereign nation but as an extension of the OFN is increasingly obvious to the islands' people; the time has come to do what must be done."
 FAR_the_fishing_bastion: "The Fishing Bastion"
 FAR_the_fishing_bastion_desc: "For the people of the Faroes, fishing has been vital since the first settlers arrived. It is not merely a means of livelihood but a way of life, and fishing revenues account for 90% of the islands' exports; it is no exaggeration to say it is the Faroes' sole source of income. If this industry does not survive, or dies in international competition, only God knows what terrible catastrophe awaits the Faroes and her people."

 ICE_icelandic_indpendence: "Icelandic Independence"
 ICE_icelandic_indpendence_desc: "It is unwise to delve too deeply into how Iceland achieved independence, as the Icelandic people still harbor some sympathy for the suffering Denmark endured since the independence war. But the outcome of independence is a more interesting topic, one the common folk debate hundreds of times a day.\n\nIceland occupies a peculiar position within the OFN. Though it maintains no standing army, its defense is guaranteed by American law. Moreover, the United States intervenes in Iceland's affairs in international disputes.\n\nThese topics are perennial and endlessly enjoyable conversation fodder. But the conversation dies when people consider the significant downsides of Iceland's membership in the OFN."
 fopo_name_tab_131: "1971 Icelandic Election"
 ICELANDPROXY_Explainer_tt: "§YThe 1971 Icelandic Election§! was held against the backdrop of Iceland's relations with the §DOFN§!. American troops killed a student activist and then covered up the crime. Though §Eanti-OFN sentiment§! had been brewing since Iceland joined the OFN, the atrocities committed by the §DOFN§! on the island led many to question §MIceland's§! place on the international stage.\nThe major §MIcelandic§! parties have made their stance toward the §DOFN§! the central issue of this election. The fate of §MIceland§! rests with whichever political bloc wins a majority in the Alþingi.\n\nWithin each §Lmedia cycle§!, we convey our message to the §MIcelandic§! public. Our messaging is composed of §Ythree§! aspects.\n\n§iPolitical reputation§! affects our ability to win over §dindependents§!. This is especially useful as the election draws to a close, because if we cannot win the majority needed to govern, we must rely on §dindependents§! to help form a government.\n\n§PCampaign tone§! affects the effectiveness of our message. If we maintain a positive tone throughout, we may win voters on goodwill alone. However, if our §Opolitical opponents§! take a negative tone, we will have no way to speak for ourselves; this works both ways. If the campaign devolves into mudslinging, both sides attacking each other negatively, that media cycle accomplishes nothing. If we launch too many negative attacks, our political reputation suffers greatly and voters will abandon us.\n\n§gCampaign appeal§! determines whether we focus on winning over §dindependents§! or poaching from the §Oopposition§!, turning their base toward the §dindependents§!. We may also issue broader appeals that accomplish both to a lesser degree.\n\nThough we may proceed with our campaign while ignoring the §Oopposition§!, if we wish to come out on top, we had better §Eplan their campaign moves§! by gaining foreknowledge of their plans and adjusting our strategy accordingly. If we do so, we must always keep in mind the possibility that our ties to the campaign may be §Rexposed to the public§!, §eto our great embarrassment§!."

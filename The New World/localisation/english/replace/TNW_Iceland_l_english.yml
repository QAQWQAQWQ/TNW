 FAR.skeleton.4.t: "The Faroese Fishing Grounds"
 FAR.skeleton.4.d: "Even if the OFN is a big family, family members do not always get along. The price of the free association is conflicting freedoms among OFN member states; they bicker this way and that, venting their grievances under America's protective umbrella.\n\nSometimes, [USA.GetLeader] wonders if they argue precisely because they are under American protection and safe. When interests are at stake, politics gets ugly - as now, when Iceland and the Faroes have argued for months over North Sea fishing boundaries.\n\nOn the free front line of the North Atlantic, sometimes America must choose sides.\n\n"Mr. Ambassador, I deeply appreciate Iceland's sacrifice in being denied access to one of its most important fishing grounds, and the matter is resolved!" In the Oval Office, [USA.GetLeader] leans back in his chair. "Of course, the Commerce Department is looking to accelerate American capital goods and preferential financing to Iceland. We won't let you down."\n\nSilence. Thirty seconds, then a minute. [USA.GetLeader]'s eyes dart to the clock on the wall - once, twice, three times.\n\n"Frankly, Mr. Ambassador, I don't know what more to tell you. Both governments asked us to arbitrate, and we have. We are happy to provide compensation, so long as we preserve the integrity of the OFN. After the last election, we are not driving out the Faroese - no one wants a German outpost in the North Sea!""
 FAR.skeleton.4.a: "Compromise is the art of the possible."
 FAR.skeleton.5.t: "A Stone, Two Birds"
 FAR.skeleton.5.d: "A stiff wind blows over the Faroese sea cliffs, as desolate here as anywhere. Around the harbor clustered residential districts, forming the living heart of the OFN's North Sea outpost. With the aviation age came Vagar Airport, and with it the Cold War garrisons, adding more human color to this isolated island cut off from the continent.\n\nBut as time passes, the war cloud gradually becomes a peacetime itch. The Nazi threat to the southeast will never vanish, but the Faroes cannot remain a garrison forever. The less the American base benefits the Faroes, the more the Yankee image approaches that of a domineering occupier.\n\nNow, it is the bankers' turn. With Iceland nearly slipping out of the OFN, Wall Street - with a little nudge from Washington - is eager to offer its services to the Faroes.\n\nSoon the bankers and fat cats finish their work, and bulldozers and construction crews take their place. Around Vagar Airport, things get busy, dust everywhere. They build a new terminal for civilian freight, with a cold storage plant and a cannery attached. The island's workers work shifts, and their children go to brand-new schools, so they need not worry about the brats wrecking the house.\n\nThe deal is quite profitable, and works well as a political tool. The Faroes will grow rich and prosperous under American leadership - of course, there was no other choice."
 FAR.skeleton.5.a: "We need you, and you need us."
 FAR.skeleton.6.t: "Time to Pay the Rent"
 FAR.skeleton.6.d: "A stiff wind blows over the Faroese sea cliffs, as desolate here as anywhere. Around the harbor clustered residential districts, forming the living heart of the OFN's North Sea outpost. With the aviation age came Vagar Airport, and with it the Cold War garrisons, together forming this land's "ancient heritage," a fortress at the edge of the free world.\n\nBut as time passes, the war cloud gradually becomes a peacetime itch. The Nazi threat to the southeast will never vanish, but the Faroes cannot remain a garrison forever. The less the American base benefits the Faroes, the more the Yankee image approaches that of a domineering occupier.\n\nSuddenly, Washington finds its image is not the beloved sweetness it thought it was, and wakes up like someone punched in the head. Hearing that Iceland's new ruling coalition contains a party not too fond of America, the State Department is in a bit of a tizzy - realizing they have been squatting in a kind landlord's place for a long time, and now the rent is finally going up.\n\nReview the Faroes' OFN membership status; fund the expansion of Vagar Airport, including a civilian and industrial terminal; pack the US military into a few key military facilities to make them "compliant" - or move these things inland, away from the towns and bars that have grown thoroughly tired of the Yankee's overbearing presence.\n\nThe Americans accept these terms, though rumors of "ending up in a ditch" run wild in Washington."
 FAR.skeleton.6.a: "Cannot lose this island fortress."
 FAR.skeleton.7.t: "A Once-in-a-Lifetime Deal"
 FAR.skeleton.7.d: "After Iceland's election results are announced, Washington can finally breathe a sigh of relief and get down to the next work. With the new coalition government in power, the only consensus between the two countries is that there is no consensus; the question of the Faroes' role must be negotiated from scratch.\n\nFirst, the task of talking to the Faroes itself - with entry conditions so harsh, the prospects for talks are dim, and sometimes a round of talks takes days. As the Iceland talks unfold, the overreaching Faroes try to get an inch, stretching talks from days to weeks, as the Faroes make clear the price for their continued OFN membership.\n\nThen there is convincing the Icelandic government. In Reykjavík, doubters are everywhere: what does Iceland owe the Faroes? More importantly, why can't Iceland have what the Faroes demand? To this, the Pentagon points out that the Faroes are Iceland's barrier on the Atlantic; without them, Iceland's defense would totter.\n\nMonths pass, and the new document outlining OFN-Faroese relations grows longer. Chapter after chapter of legal jargon spills off the paper, weighing down every flight from Vagar to Washington. Fishing, oil exploration, export controls, and investment - the Faroes will get everything they ask for, so long as they abide by the most secret clause:"
 FAR.skeleton.7.a: "The OFN can keep its island fortress - and pay dearly for it."
 FAR.skeleton.8.t: "Separation Anxiety"
 FAR.skeleton.8.d: "On the night of Iceland's election, nearly all of Tórshavn erupted in victorious cheers - except the building housing the OFN delegation to the Faroes. Only now do they clearly realize how unwelcome they are in this free fortress at the far end of the North Atlantic.\n\nHow did it come to this? That question will soon be left to the historians; neither Washington nor the Faroese new government has time for it. Before Iceland's election, the Faroes had promised to follow Iceland's lead and secede from the OFN. From that moment, Germania's gaze turned to the North Atlantic, waiting for a chance to separate the Faroes from their former protector.\n\nThe sobering reality hit home when American negotiators shared intelligence photos of German submarines loitering just outside the waters the Faroes claim. Even if America promises to respect the vote, that does not guarantee the Germans will do the same - which quickly became a guarantee that the OFN provides effective protection, even if the Faroes no longer permanently host the American military.\n\nThe Americans carefully avoid making more demands, instead granting the Faroes exclusive rights within 200 nautical miles of their shores and accepting the minimal military access agreements they offer. The Faroes have made their position clear. They will leave the OFN and hope to coexist better with the OFN as neighbors rather than family. Pressuring them further may only see them fall to the Germans. The die is cast; Washington is unwilling to make things worse."
 FAR.skeleton.8.a: "A new and unsettling way of coexistence."
 FAR_independence_tt: "§gThe Faroes,§! §Wmy§! §Vbeautiful§! §Bmotherland§!, have at last won self-determination.§!"
 FAR.skeleton.9.t: "The Final Call"
 FAR.skeleton.9.d: "On the night of Iceland's election, nearly all of Tórshavn erupted in victorious cheers, except the building housing the OFN delegation to the Faroes. Only now do they clearly realize how unwelcome they are in this free fortress at the far end of the North Atlantic.\n\nThe fact that moderates hold power in the Faroes does not reassure the Americans. Before Iceland's election, the Faroes had promised to re-examine their relations with the OFN. From that moment, the people's romanticism maintained an uneasy balance with the only rational leaders left in the government. Now, the former is undoubtedly in the ascendant, and everything will be different.\n\nAs German submarines loiter outside the Faroes' territorial waters, an Icelandic government representative is invited to the American-Faroese talks. The high-intensity negotiations last for days, extended another day, then another week. After the American delegates leave, the American financiers depart as well, glum.\n\nFinally, the newspapers are invited to read the final draft. America will grant the Faroes full equal representation in the OFN, designate the vast waters 250 miles around the islands as an economic zone, and make large new investments in Faroese schools and Vagar Airport infrastructure. To ensure the American military presence is reduced, the "garrison" will be replaced by a "visitation agreement"; the once-ubiquitous OFN troops will henceforth conduct only one month of high-intensity exercises per year.\n\nThough some islanders still protest and threaten to demand another vote, the government holds firm. As the American transport ships sail away, the protesters thin and disappear - but they are never far."
 FAR.skeleton.9.a: "Escaped by the skin of their teeth."
 FAR_moderate_negotiation_equality_tt: "§gThe Faroes,§! §Wmy§! §Vbeautiful§! §Bmotherland§!, have at last won equal status within the §BOFN§!.§!"
 ICE_Progs_long: "Progressive Party (Framsóknarflokkurinn)"
 ICE_caretaker_long: "Caretaker Government (Umsjónarstjórn)"
 POLITICS_Johnathan_Motzfeldt_DESC: "They call him the father of Greenland, and other such titles. But before the young pastor Jónatan Mortzfeldt, with his great talent, ambition, and colorful resume, what are hollow titles and fatherly names?\n\nFar to the north, as war raged and order collapsed, Mortzfeldt completed his studies at the Greenland College's teacher training school. Then he went south to Canada to study theology and be ordained - and there, he saw not only the Word of God but something more secular: the political world that Greenland so sorely lacked.\n\nWorking with Moses Olsen and Lars Emil-Johansen, Siumut successfully pushed Greenland to local autonomy - unthinkable chatter a decade ago. In the first election, Siumut won, promising Greenland humane democratic socialism, greater autonomy, and drawing American support for this Arctic island.\n\nThe road ahead is uncertain, and Mortzfeldt must temper his edge lest he crowd out other important figures in Siumut. But as things stand, Greenland is free, and she will remain free; the judgments and gazes of others are but passing clouds."
 POLITICS_Erlendur_Patursson_DESC: "Erlendur Patursson sits in his cramped office in Tórshavn, taking a moment between meetings with party comrades and coalition allies to gaze out the window, where the endless sea glints gold and trawlers head out to deeper waters. It reminds him of the thing he is fighting for.\n\nPatursson's political life is inseparable from his leadership of the fishermen's union. In that work, he witnessed firsthand the failures of OFN policy, and how the Americans skillfully tied fishing, the use of limited resources, and military plans together.\n\nPatursson is the son of the nationalist politician Jóannes Patursson and has long been politically active. This awareness drove him to form his own party, the Republican Party. In it, he works to turn his concerns into proper policy. Alongside old and new allies, he shapes a left-wing vision for the Faroes, breaking from the OFN and ready to fight for the people to achieve that goal.\n\nNew President Erlendur Patursson is ready to realize this vision. He knows the ideal is grand, but he is ready to fight for even the smallest thing the OFN is willing to give. He will do whatever it takes to help the Faroese fishermen - he is consistent, as ever."
 POLITICS_Peter_Mohr_Dam_DESC: "Peter Mohr Dam is one of the Faroes' most legendary politicians, having served in the Løgting for the past forty years. He worked under the Danes, the British, and now the Americans, dutifully serving the Equality Party. In that time, he came to deeply understand the value of maintaining foreign relations.\n\nYes, the Faroes' overlords were not always benevolent. Yet each overlord left his mark on the country, funding its future. From Vagar Airport to Tórshavn, the beneficence of overlordship is spread across the island. Even now, they have left much to give the Faroes.\n\nIf the Faroes are to grow and prosper, they cannot remain in glorious isolation. President Dam promises cooperation with the OFN to build something better. Through focused intervention, the Faroes can leap beyond the existing agrarian economy and develop into a more unique, more modern one. The Faroes will be the brightest star in a luminous constellation stretching from distant America to nearby Britain and Ireland."
 POLITICS_Atli_Damn_DESC: "In many eyes, Atli Dam symbolizes the Faroes' future. He is a shrewd, capable progressive with a bright future, drawing wisdom from his father. Wherever he goes, the Faroes will follow.\n\nAtli Dam, like his father Peter Mohr Dam, is a social democrat and the Equality Party's leader. The core wish shared by the two is the same: to cooperate with the Americans despite the ridicule from enemies on both the left and right. Though Atli is the junior, he hopes to inherit his father's cause.\n\nHowever, there is an important difference between the two. President Atli feels he has better luck. Peter Mohr Dam always revered the ideal that guided his foreign relations; Atli treats diplomacy as a trade, using his natural charm and formidable skill to extract what he needs from the OFN. So far, the model works - Atli has secured large-scale investment that Peter never obtained.\n\nThis is a resource and a force for which neither domestic nor foreign forces are prepared. It seems the best symbol of the abundant harvest to come."
 POLITICS_Hakun_Djurhuus_DESC: "Twenty years ago, the Faroese People's Party did everything it could to liberate the Faroes. When the British arrived, the People's Party's efforts to found an independent nation came to nothing. If the occupation forces recognized the Danish governor, the People's Party refused to cooperate with them. The People's Party was strong, aggressive, and growing.\n\nAfterward, the British left and the Americans arrived, considering the realpolitik of the Cold War. They scoffed at the idea of an independent nation and forced a second occupation, leaving the Faroese to clean up.\n\nBack then, Hákun Djurhuus was just a young man, newly entering politics. Yet twenty years after joining the People's Party, the direction of "independence" is exactly as he predicted. The rights and opportunities of the Faroese people have been placed beneath foreign armies and foreign markets. His compatriots' culture is dying, while the Americans do as they please on the Faroese coast.\n\nNow, the chance to break the inequality has come. Djurhuus has built a grand coalition spanning every walk of life, from fishing grounds to parishes, crossing most major parties. At last, he commands a group powerful enough to hold the occupation forces hostage."

 SWI_Federal_Council: "Federal Council"
 POLITICS_FEDERAL_COUNCIL_FULL_POWERS_DESC: "Switzerland has many unusual traits, one of which is that its head of state is not a single person but an eight-member committee exercising state power collectively. These eight politicians are elected by the Swiss legislature from different parties and regions. Though the Federal Council members have diverse backgrounds and political views, once the council makes a final decision, all members must abide by it, encouraging compromise and consensus. However, many criticize the Federal Council for its opaque operations, and many unorthodox views can be folded into its eclectic consensus.\n\nThe 'Full Powers Regime' is the name given to the governing coalition that has ruled Switzerland under emergency powers since the outbreak of war in Europe in 1939. What began as an unprecedented period of tension has evolved into the widespread surveillance and political repression of today, with erosion of democratic norms commonplace. Though the Full Powers Regime is a broad coalition of the Free Democrats, Catholic Conservatives, and Social Democrats, it actually represents the interests of merchants and the military, holding conservative political positions. Additionally, the regime has acquiesced in Italian economic domination, imposed austerity, and is partly responsible for the economic malaise that has deeply angered the people. Many hope the regime will collapse soon, but it still holds great power and considerable influence. Overthrowing it would be a formidable obstacle."
 SWI_Paul_Chadet: "Paul Chadet"
 SWI_Fritz_Grutter: "Fritz Grutter"
 SWI_Henry_Schmitt: "Henry Schmitt"
 SWI_Paul_Chadet_hog_desc: "§YSwiss Federal President and Head of the Interior\nPaternalistic Conservatism§!\n------------\n§LPerhaps it is fitting that such a contradictory figure leads the edge of authoritarianism beneath Swiss liberal democracy. Paul Chadet is a lifelong Free Democrat, but even so, his ties to the right have always been close. Since rising to prominence through the wine tax struggle, Chadet has worked closely with the Vaud Union, an agrarian fascist pressure group, to abolish the tax, earning the gratitude of winemakers nationwide.\n\nChadet's distinctive governing style has served him well in Swiss politics. Unsurprisingly, he entered the Federal Council. Within a decade, Chadet strengthened the Full Powers Regime's power, with austerity and repression proceeding methodically under his supervision. But now, as when he first rose in politics, hard choices must be made for the greater good.§!"
 SWI_Fritz_Grutter_for_desc: "§YHead of the Federal Political Department\nNeo-Corporatism§!\n------------\n§LA lifelong Social Democrat, Fritz Grutter has witnessed the targeted repression his party has suffered in recent decades. Though Grutter considers entering the Federal Council as an SPD member a major career achievement, many in the party feel it was not worth the cost. His participation in suppressing labor and the regime's austerity policies has driven him from the left. The left is growing louder, demanding the overthrow of the current governing coalition. Grutter handles foreign affairs and was forced to sign the Lugano Treaty. One can only imagine he put up at least symbolic resistance in the closed-door negotiations.§!"
 SWI_Henry_Schmitt_eco_desc: "§YHead of the Department of Finance and Customs\nClassical Liberalism§!\n------------\n§LThough born into humble circumstances in Geneva, Henry Schmitt relied on personal charm and intellectual brilliance to quickly become one of the FDP's most active representatives in local politics. At only 33, he became a member of the Federal Council. Many see this as the regime's attempt to use Schmitt to win favor among the disaffected youth.\n\nThe young councilor soon set to work, trying to prove his critics wrong. Under his leadership, the Economic Department developed a plan to attract investment from the OFN and Co-Prosperity Sphere, particularly in tourism, to free the Swiss economy from Italian control. Whether these measures can reverse the regime's fading prospects in voters' eyes remains to be seen.§!"
 SWI_Ludwig_von_Moos_sec_desc: "§YHead of the Department of Justice and Police\nNational Conservatism§!\n------------\n§LFrom his early days as a judge to leading the Catholic Conservative Party, Ludwig von Moos has always made preserving the Swiss way of life his top priority. He joined the Federal Council after the 1956 Alpine Crisis, personally overseeing Switzerland's transformation into a police state, pushing the regime's harsher law enforcement and surveillance, and funding various paramilitary groups. Many fear von Moos's creation has long since slipped his control, becoming a shadowy network of rogues and spies that bends Switzerland to its will.\n\nThough von Moos's commitment to liberal democracy seems questionable, his determination to steer Switzerland safely through the 20th century is crystal clear.§!"
 SWI_Reigns_of_the_Full_Powers_Regime: "Reigns of the Full Powers Regime"
 SWI_Reigns_of_the_Full_Powers_Regime_desc: "The Full Powers Regime now ruling Switzerland was established at the outbreak of World War II, over two decades ago. Based on precedents in the Swiss constitution, the regime was able to invoke emergency powers to maintain Switzerland's absolute security. In the name of national security, the regime suppressed all known opposition. Another controversial point is that the regime has concentrated power in the Federal Assembly, a departure from Switzerland's traditional federal system.\n\nTo maintain the status quo, every aspect of Swiss democracy has eroded - surveillance, secret police, and corruption are omnipresent. But many are growing tired of the permanent state of emergency, and the regime faces challenges and threats from all parties."
 SWI_Scars_of_the_Alpine_Crisis: "Scars of the Alpine Crisis"
 SWI_Scars_of_the_Alpine_Crisis_desc: "In the 1955 Alpine Crisis, Switzerland narrowly escaped the grip of German aggression, but the scars from Liechtenstein's fall and the German threat linger. The aging General Guisan launched massive military expansion, including fortifications and paramilitary 'stay-behind' units intended to continue resistance after Switzerland's fall. However, some of these units have developed a will of their own, their influence extending far beyond the military sphere."
 SWI_Perchtas_Final_Hunt: "Perchta's Final Hunt"
 SWI_Perchtas_Final_Hunt_desc: "Switzerland was once a financial powerhouse, but now the tide of New Europe has swallowed it whole. Germany imposed an embargo in 1955, and the Swiss economy collapsed, banks failed, and the state faced bankruptcy. Soon after, Switzerland signed the Lugano Treaty with Italy, forgiving its massive debts but handing economic control to foreign oligarchs who exploit its labor. To this day, the Swiss economy shows no sign of recovery, and public anger grows by the day."
 SWI_National_Tapestry: "National Tapestry"
 SWI_National_Tapestry_desc: "Switzerland originated from mutual defense pacts between autonomous agricultural communities. Thus, in every sense, Switzerland is an unapologetically federal state, with important powers devolved to local cantons and municipalities. To maintain its loose political structure across ethnic groups, autonomy and compromise permeate every level of government. Though this system may impede change and face challenges from modernity, it has helped Switzerland maintain a degree of stability and unity."
 SWI_ITA.1.t: "Strangers in Bern"
 SWI_ITA.1.desc: "Bern smells worse than usual, thought Fabio Beltraletti as he hurried across the cobblestones. Whenever he thought Swiss life was tolerable, a sanitation strike would wake him from the dream. Though in recent years, sanitation and a few other professions were among the last still allowed to strike, which was one reason his father's company was happy to open a new office here. Serono was among Italy's leading biotech firms, and it was hard to pass up the green Alpine pastures and tax breaks and subsidies Switzerland offered Italian firms. Passing an abandoned bunker, Beltraletti glimpsed homeless men huddled inside for warmth. Everything has a price, he thought.\n\nBeltraletti finally reached the office, startled to see the company logo looking so dull against the facade of the grand old downtown building, not to mention the anti-Italian slogans spray-painted on the door. He sighed and pushed in, meeting his beautiful new secretary Adelaide. But the smell of pipe tobacco reached him first - unfamiliar, yet more pleasant than the streets. 'So my dear, who interrupted our morning conversation?' he asked.\n\n'He didn't give his name. I'm not sure I heard right, but he seemed to want to discuss the industrial applications of anthrax,' the secretary replied nervously. Odd topic, Beltraletti thought. Just then, a man stepped out of the shadows, and Beltraletti turned to see a man with glasses, a thick beard, and a well-tailored suit.\n\n'My apologies, Signor Beltraletti, we have much to discuss.' Before he could respond, the man extended his hand, speaking Italian with a German accent:"
 SWI_ITA.1.a: "'Finally, an honor to meet you. You may call me Bachmann. Albert Bachmann.'"
 SWI_ITA.2.t: "Strange..."
 SWI_ITA.2.desc: "For the past week, whenever Fabio Beltraletti walked Bern's streets, he couldn't shake the feeling that something was deeply wrong. At first the signs were subtle - the suspicious glances of passersby, the faint air of fear. Everyone had heard rumors of impending chaos at the centers of power, but so far there was no news, no official statement, only deathly silence. Soon, disappearances followed: left-wing agitators in the city square, homeless beggars on street corners, students in cafes, even his dear Adelaide... As if with each passing day, another resident vanished into this city that devours its own. Was it fear that drove them away, or worse? Beltraletti couldn't say. Then the strangers arrived. They were from out of town, in various uniforms, some roaming the streets threatening hurried passersby; others hiding in bunkers and air raid shelters, preparing... preparing for what.\n\nBeltraletti breathed a sigh of relief when he reached his destination: a gentlemen's club downtown. He stepped inside, and the pin-drop silence made his heart race. The few patrons seemed huddled in corners, whispering. Then he saw the man he sought: Albert Bachmann sat by the window, gazing at the grey sky. Bachmann noticed Beltraletti, turned, raised his pipe, and gestured for him to sit. Then Bachmann spoke: 'In 37 hours, our mutual friend will make a public statement. I thought I should tell you in advance.'\n\nBeltraletti sat down quickly, cold sweat running down his cheek. 'What happened, Bachmann? What have you done?' he stammered.\n\n'My friend, you flatter me. We all have our roles to play, including you,' Bachmann replied, pouring dark red wine into two goblets.\n\n'To what?' Bachmann raised his glass, and Beltraletti voiced his trembling question."
 SWI_ITA.2.a: "'To the only cause that matters - the salvation of the Confederation.'"

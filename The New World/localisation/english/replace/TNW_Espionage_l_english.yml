 Espionage_FBI: "Federal Bureau of Investigation"
 Espionage_FBI_Caps: "Federal Bureau of Investigation"
 Espionage_FBI_Short: "FBI"
 Espionage_FBI_Fancy: "£GFX_counter_intelligence_USA §MFBI§!"
 Espionage_FBI_Desc: "§WThe Federal Bureau of Investigation§! is §MAmerica's§! most important intelligence agency, tasked with safeguarding American domestic interests while also overseeing its Latin American backyard."
 Espionage_Hoover: "J. Edgar Hoover"
 Espionage_Hoover_Desc: "Presidents come and go, but Hoover endures. J. Edgar Hoover, the first director of the FBI, has headed America's highest investigative body since the 1920s, the very \"sheriff of America.\" These uniformed government officials do police work, responsible to the entire nation; they identify, investigate, and arrest criminals across the Americas. Whether Chicago gangsters, Georgia Klansmen, Boston terrorists, or Port-au-Prince spies, Director Hoover and his men bring them to justice.\n\nThe Director's many duties include intelligence and counterespionage activities in the US and other American states. What began as the domestic investigative Division of the Intelligence Service (SIS) is now an FBI subdivision, responsible for gathering intelligence and arresting spies in America and its neighbors. Every American embassy in the Americas has an SIS detachment; whether the host country knows it or not, these agents work to gather the best intelligence for Hoover. Though the SIS is less reckless than the CIA, rivalry between the FBI and CIA eventually led the SIS to open a division for special operations and planning.\n\nHoover is not merely partisan but overbearing, quite unlike the carefully crafted public image; he is a hypocrite. His vanity, contempt for non-whites, insincerity, and his media contacts always boost his standing when needed. With a vast network of political and international media contacts, Hoover can rest easy as he continues as director in the days ahead."
 TNO_Espionage_GUI_RegionalNetwork_USA_FBI: "\n£GFX_counter_intelligence_USA §MFBI Network Strength§!: [?USA.Regional_Network^Region_i][TNO_Espionage_GetRegionalValuesEntry]"
 Espionage_FBI_Vacant: "Vacant"
 Espionage_FBI_Vacant_Desc: "For the first time in the FBI's 40-year history, the director's chair is vacant. Bureau leadership rarely considered what would come \"after Hoover,\" for he intended to serve until death. The FBI has always marched to Hoover's tune; his death has left the government rudderless and brought great uncertainty to the bureau's future. Longtime deputy director Clyde Tolson is the nominal head now, but who the president will appoint to fill J. Edgar Hoover's shoes remains to be seen.\n\nThough Hoover's death has paralyzed some FBI departments, others, including the SIS, continue their primary functions: gathering intelligence and arresting spies in America and its neighbors. Every American embassy in the Americas has an SIS detachment, whether the host country knows it or not, collecting intelligence and sharing it with FBI leadership. The SIS also cooperates with military intelligence, supporting covert operations against American states, from influencing politics through arrests and extradition to supporting regime change.\n\nThough J. Edgar Hoover was the FBI's first director, his death will not abolish the FBI. Until the next director takes office, the FBI remains a well-functioning federal investigative and intelligence agency. The FBI under Hoover was indeed arbitrary, but that trait died with him, and the bureau desperately needs a new director with new ideas to reshape it."

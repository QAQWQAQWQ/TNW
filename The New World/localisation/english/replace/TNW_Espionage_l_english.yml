 Espionage_Map_NA_Desc_GER: "This is where §MAmerica§! lies, and it is §gGermany's§! greatest rival. §MNorth America§! is thus the intelligence service's top priority. Building, maintaining, and expanding our intelligence surveillance network and operational scale here is essential to §gGermany's§! future."
 Espionage_Map_CA_Desc_GER: "Many see §YCentral America§! and the §YCaribbean§! as §MAmerica's§! backyard - a very narrow and ignorant view of what is actually a complex powder keg of schemes. Establishing a staging ground here will not only let §gGermany§! limit §MAmerica's§! influence in this hemisphere but also tap into the giant black markets there."
 Espionage_Map_SA_Desc_GER: "To a naive observer, §RSouth America§! seems sleepy, but in reality the land is full of opportunities for §gGermany§! to gain a foothold in the Americas. Dispatching liaisons and strengthening surveillance of the region will help us achieve our goals."
 Espionage_Map_EU_Desc_GER: "Europe is divided between §gGreater Germany§! and its §gUnited Pact§! vassals, §GItaly§! and its §OTriumvirate§! former allies, the §RBritish Isles§!, and the §MScandinavian states§!. Maintaining control of the §xOld Continent§! is vital to §gGermany's§! future."
 Espionage_Map_RU_Desc_GER: "The former §GRussia§! has become a nightmare of warlord infighting and brutal violence. Largely thanks to § gour actions§!. Yet the situation now shows that the §GRussian people§! will not continue killing each other. Given this, influencing their future path will be critical to §gGermany's§! future."
 Espionage_Map_AF_Desc_GER: "§OAfrica§! has been a playground for colonists for centuries, but this is changing as §gGermany§! loses control of the region. With §GItalian§! and §OIberian§! influence in the north and §MAmerican§! power in the south, the beleaguered §ODark Continent§! may be a highly valuable target."
 Espionage_Map_ME_Desc_GER: "§LThe Middle East§! is a melting pot of international politics, from oil fields controlled by §GItaly§! to §BSaudi§! intrigues and §gGerman§! commercial interests in §OIran§!. Expanding §gGermany's§! influence in this anchor of the world economy is critical."
 Espionage_Map_EA_Desc_GER: "Under the cruel rule of §Rthe Empire of Japan§!, the §BRepublic of China§! and the rest of §YEast Asia§! are gradually becoming new industrial and economic powers on the world stage. While bringing huge profits to the §RJapanese§!, the §BChinese people§! are inching toward freedom. With adequate help, they could become an invaluable asset to §gGermany§!."
 Espionage_Map_SEA_Desc_GER: "§RThe Empire of Japan§! views §GSoutheast Asia§! as a treasure trove, and rules the region with brutal oppression and de facto enslavement. But the people of this region, like the oppressed peoples of §YEast Asia§! who suffer the same treatment, will not endure this for long. §gGermany§! can benefit from developments here."
 Espionage_Map_OC_Desc_GER: "§POceania§! is the front line of the §MOrganization of Free Nations§! against the §RCo-Prosperity Sphere§!. §OAustralia§! has been built into a fortress, and §MAmericans§! use it as a staging ground against the §RJapanese§!. Perhaps there is a way to increase §gGermany's§! influence in the region."
 Espionage_Map_NA_Desc_USA: "§MNorth America§! is the homeland of §mAmerica§! and its neighbors, the true center of the free world. To maintain the security of the republican system, maintaining strong influence in Canada and the United States is critical to winning the Cold War."
 Espionage_Map_CA_Desc_USA: "Under the principles of the §DMonroe Doctrine§!, §mAmerica§! has a duty to protect the nations of §YCentral America§! from foreign aggression. But this argument does not convince the other nations in §mAmerica's§! shadow, who increasingly turn to §gGermany§! or §eJapan§! for support. If §mAmerica§! wants to maintain its hegemony in the New World, it must project stronger influence here."
 Espionage_Map_SA_Desc_USA: "§RSouth America§! is a melting pot of diverse nations, so their interests do not always align with §mAmerica§!. To ensure §mAmerica's§! absolute influence in the region, §mAmerica§! must bring all foreign powers to heel. If §gGermany§! or §eJapan§! gains a foothold in §RSouth America§!, §mAmerica's§! dam controlling the New World could spring a leak."
 Espionage_Map_EU_Desc_USA: "Europe is divided between §gGreater Germany§! and its §gUnited Pact§! vassals, §GItaly§! and its §OTriumvirate§! former allies, the §RBritish Isles§!, and the §MScandinavian states§!. Under §gGerman§! rule, Europe is dark, but §mAmerica's§! influence might yet overturn the Old World's dictatorships."
 Espionage_Map_RU_Desc_USA: "The former §GRussia§! has become a nightmare of warlord infighting and brutal violence. Largely thanks to § gour actions§!. Yet the situation now shows that the §GRussian people§! will not continue killing each other. For §mAmerica§!, the wise move is to build influence in the emerging §GRussian§! states."
 Espionage_Map_AF_Desc_USA: "§OAfrica§! has been a colony for the taking for centuries, though this is now changing. The crumbling rule of §gGermany§!, §GItaly§!, §QFrance§!, and §YSpain§! gives §mAmerica§! an opening to influence the African continent."
 Espionage_Map_ME_Desc_USA: "§LThe Middle East§! is a melting pot of international politics, from oil fields controlled by §GItaly§! to the commercial interests of superpowers in Saudi Arabia and Iran. Expanding §mAmerica's§! influence in this anchor of the world economy is critical."
 Espionage_Map_EA_Desc_USA: "§eJapan's§! home islands are the brain of the §eEmpire of the Rising Sun§!, wielding the expanding synapses of the §RCo-Prosperity Sphere§., forming the nerve center of §mAmerica's§! greatest Cold War rival. Whether §mAmerica's§! political blocs now seek confrontation or reconciliation with the §GEast Asian§! giant, building a vast intelligence network in §eJapan§! and the §BRepublic of China§! is imperative for better decision-making."
 Espionage_Map_OC_Desc_USA: "§POceania§! is the front line of the §MOrganization of Free Nations§! against the §RCo-Prosperity Sphere§!. The defense of Australia and New Zealand is vital to the §mOFN§!. §POceania§! remains the key staging ground for operations against §ethe Empire of Japan§!. Ensuring strong §mAmerican§! influence in the region is critical."

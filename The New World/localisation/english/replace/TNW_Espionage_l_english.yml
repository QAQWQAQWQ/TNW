 TNO_Espionage.2.t:0 "[getIntelAgencyShort] begins training new agents"
 TNO_Espionage.2.desc:0 "A new cohort has begun training at [getIntelAgencyShort]'s training facility, but few will ultimately be selected to serve the nation. An agent needs fortitude, perceptiveness, and rational rigor. Only thus can they bear the responsibilities the free world entrusts to them, joining the secret struggle across the globe.\n\n[getIntelAgencyShort] requests that some resources be invested in the agent training program until training is complete. Operations elsewhere may be delayed for a time."
 TNO_Espionage.2.a:0 "Understood."
 TNO_Espionage.3.t:0 "[getIntelAgencyShort] approves agents for duty"
 TNO_Espionage.3.desc:0 "[getIntelAgencyShort] reports that they have approved the latest recruited agents for deployment, effective immediately. Resources dedicated to training can now be reallocated to other priorities."
 TNO_Espionage.3.a:0 "Understood."

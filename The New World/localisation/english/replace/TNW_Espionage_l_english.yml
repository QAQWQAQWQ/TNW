 Espionage_GER_Tech_0_Desc: "\"Telecommunications and Electronic Reconnaissance\" (Fernmelde- und Elektronische Aufklärung, Fm/EloAufkl), known in the English-speaking world as §WSignals Intelligence (SIGINT)§!, is an intelligence interception technology. As early as the Second World War, SIGINT played a major role. Since then, nations have placed ever greater importance on SIGINT. Now the world is in the Cold War between Germania and other hateful rivals, and intercepting enemy intelligence is critical. We will invest heavily in SIGINT modernization - soon, no sound will escape German ears."
 Espionage_GER_Tech_1_Desc: "§WSpecial Binary Telegraph Service§! (Sonderblindfunkdienst) is part of a high-speed transmission system initiated by the intelligence service. Using Morse code to transmit intelligence to agents worldwide is just the tip of the iceberg - using the high-speed system and harpoon antennas to send repeated encrypted messages across all frequencies to serve our agents around the world is the full scope of the system. It is an ambitious plan, but one befitting such a complex world."
 Espionage_GER_Tech_2_Desc: "Germany won the space race in 1962, but she must still make full use of every opportunity the \"final frontier\" provides. It goes without saying that space-based reconnaissance platforms are vital; we can peer into the enemy's world at will, gathering intelligence while they can only stare at the sky. These probes are equipped with 24-inch zoom cameras and thousands of feet of film; we need only launch them into space, wait for them to complete their mission, and recover the equipment by aircraft."
 Espionage_GER_Tech_3_Desc: "§WThe 31211-5 covert RF listening device§!, or \"bug\" for short, is our latest research result, a second-generation signal transmitter based on UHF (ultra-high frequency) band 4. Designed for room eavesdropping, these devices can be easily hidden in most furniture. Small but complete, the 31211-5 bug is equipped with a powerful, voiceprint-sensitive audio amplifier and a dynamic microphone, allowing clear, convenient recording of conversations. Once these bugs are deployed, no secret will be hidden from Germany."
 Espionage_GER_Tech_4_Desc: "The M-190 cipher machine is a one-time tape decoder developed by §BSiemens§!. Since this device cannot complete decryption independently, it cannot be clearly classified as a specific device type. When using the M-190, we must simultaneously use a §Wone-time tape§! to complete decryption, and these tapes are destroyed immediately afterward. When the M-190 is linked with a teleprinter, we can operate remotely. We already used this advanced technology in the T-43 during the world war."
 Espionage_GER_Tech_5_Desc: "In a world where intelligence services infiltrate and deceive each other, when lives are on the line, the most effective solution may be to punch the enemy in the face. Armed personnel, spies, and even police forces worldwide widely practice combat training, some even developing their own martial arts styles. In many cases, close-quarters combat can effectively suppress the enemy, and the Reich Intelligence Service is no exception. Thus we need to expose our agents to basic hand-to-hand combat (Nahkampf)..."
 Espionage_GER_Tech_6_Desc: "The UFT-421 wearable covert transceiver can be hidden in agents' clothing, equipped with a four-channel simplex radio and supporting remote operation, making it suitable for various secret missions. It is an indispensable tool for agents operating inside and outside Germany."
 Espionage_GER_Tech_7_Desc: "The RS50 improved camera (Robot Star 50) is a common spring-wound camera, excellent in compactness and capable of taking 50 photos at once. Yet with proper modification, this camera reveals another key advantage - extreme quiet. Maintaining silent operation in such a small body while still taking so many photos makes the RS50 modification an invaluable tool for undercover agents."
 Espionage_GER_Tech_8_Desc: "Strictly speaking, Flecktarn B camouflage is a successor to the standard camouflage used by the Wehrmacht in the Second World War. Compared to the old pattern, the new design is computer-assisted and used by the intelligence service for field agent operations. Visually identical to the SS pattern, this camouflage can be applied across many different natural environments, greatly improving field agents' concealment."
 Espionage_GER_Tech_9_Desc: "Research shows that crafting a lie requires more mental effort than stating the truth. If this theory holds, increasing psychological pressure on potential liars makes it harder for them to lie - and thus makes them tell the truth. One way is to use barbiturates to dissolve their mental defenses. The effect is similar to anesthesia, but with the right dosage it can be equivalent to a \"truth serum.\""
 Espionage_USA_Tech_0_Desc: "Aerial reconnaissance is expensive, easily intercepted, and requires hundreds of hours of planning. Pigeons, by contrast, flock in groups, blend into any environment, and obey their handlers. Strapping a timed miniature camera to a trained pigeon can provide overhead photos of higher fidelity than any U-2 - at a fraction of the cost."
 Espionage_USA_Tech_1_Desc: "\"Belly drill\" is the informal name for the standard hand-cranked drill issued by the \"Company.\" As the name suggests, the user presses the drill firmly against the wall with their belly and turns the crank to bore a hole. A skilled operator can drill through wood and masonry alone and place listening devices to monitor unsuspecting adjacent rooms."
 Espionage_USA_Tech_2_Desc: "Technological progress has brought new methods and equipment to traditional espionage, but the art of \"playing with light\" remains in the \"Company's\" repertoire. Specially designed mirrors let agents obtain text and images at specific angles without attracting attention. Others see only a beautiful woman touching up her makeup, or a man adjusting his hair."
 Espionage_USA_Tech_3_Desc: "More cigarettes are sold each year than there are living humans. Unless in the wilderness, a war zone, or a smoke-free area, everyone wants a pack of Lucky Strikes in their pocket. Our agents can exploit this by placing a miniature camera in the cigarette pack. As for the \"cancer sticks\" taken out, they should not go to waste; if someone wants to barter cigarettes or accept a favor for a good smoke, just ask if they'd like one."
 Espionage_USA_Tech_4_Desc: "An agent going deep behind enemy lines needs only a map, a compass, and sharp eyes. But behind enemy lines, every bit of storage is precious; and because they are behind enemy lines, whether they have a compass largely determines whether they return home healthy or fail the mission with malaria. A miniature compass small enough to fit in a buttonhole easily solves the problem of ordinary compasses being too bulky."
 Espionage_USA_Tech_5_Desc: "In high-society settings, agents disguised as gentlemen often struggle to receive instructions, for there are too many listeners and suspicion is easy. The solution is a specially designed radio built into a pipe's narrow stem. These clever devices transmit sound from the jawbone to the ear canal via bone conduction; in a debauched setting, no one will notice our agent."
 Espionage_USA_Tech_6_Desc: "One person leaves their trash, another picks it up: this is how the \"dead drop\" works, one of the oldest techniques in espionage. With microfilm as the storage medium, modern spies can now slip film into inconspicuous waterproof hollow nails for their contacts to pick up at agreed dates and places."
 Espionage_USA_Tech_7_Desc: "For decades, our \"gentlemen\" have exchanged information through face-to-face contact, and for more discretion they used lip-reading. The \"Company\" has therefore created an ultrasonic motion sensor. Pulses imperceptible to normal people catch the attempt to eavesdrop without the intruder knowing, and our \"gentlemen\" will know to turn confidential conversations into the most innocuous small talk."
 Espionage_USA_Tech_8_Desc: "The CIA's ability to operate worldwide owes much to local resistance movements against German and Japanese tyranny. Yet cooperating with these organizations requires frequent communication with liaisons who barely speak English. To help them identify enemy equipment, our technicians designed a clever device with knobs and numbers, next to drawings of cannons, vehicles, or aircraft. A simple turn and switch sends radio pulses output by these counters to intelligence officers on the ground or in aircraft."
 Espionage_USA_Tech_9_Desc: "To anyone else, this is just a 1921 silver dollar, 90% pure, an inch and a half across, bearing a smiling Liberty Head.\n\nTo the \"Company,\" it is a state secret bought for one dollar. Inflation is terrible, isn't it?"

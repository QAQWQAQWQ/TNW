 Espionage_Gehlen: "Reinhard Gehlen"
 Espionage_Gehlen_Desc: "The greatest spymaster of the Cold War, a hero of the Second World War's secret front, a stalwart champion of the German fatherland, an enemy of Bolshevists and Himmlerites alike - whatever others say, this is the image Reinhard Gehlen carefully crafted for himself.\n\nIn recent years he has also been called \"the cunning Reinhard\" or simply \"the Fox,\" with an immense network of contacts and countless honors. But since his service on the Eastern Front Foreign Armies intelligence staff, his enmity with Himmler deepened. Gehlen is ambitious, dedicated to unifying all of Germany's intelligence services into one, which has brought him to where he is today, head of the Reich Intelligence Service.\n\nNow the world is in turmoil, the clouds of the Second World War have not fully lifted, and Germany remains at the center of the storm - the Foreign Armies staff was not enough for Gehlen, and the RND is merely a stepping stone for his ambition. The Fox's ambitions must not be underestimated."
 Espionage_Gehlen_BOR: "Reinhard Gehlen"
 Espionage_Gehlen_BOR_Desc: "The greatest spymaster of the Cold War, a hero of the Second World War's secret front, a stalwart champion of the German fatherland, an enemy of Bolshevists and Himmlerites alike - whatever others say, this is the image Reinhard Gehlen carefully crafted for himself.\n\nIn recent years he has also been called \"the cunning Reinhard\" or simply \"the Fox,\" with an immense network of contacts and countless honors. But since his service on the Eastern Front Foreign Armies intelligence staff, his enmity with Himmler deepened. Gehlen is ambitious, dedicated to unifying all of Germany's intelligence services into one, which has brought him to where he is today, head of the Order Police.\n\nNow the world is in turmoil, the clouds of the Second World War have not fully lifted, and Germany remains at the center of the storm - the Foreign Armies staff was not enough for Gehlen, and the Order Police is merely a stepping stone for his ambition. The Fox's ambitions must not be underestimated."
 Espionage_Wessel: "Gerhard Wessel"
 Espionage_Wessel_Desc: "No one in German intelligence can command the weather like Reinhard Gehlen, and no one has served Gehlen like Gerhard Wessel. Since their days on the Eastern Front staff, they have been staunch comrades and reliable colleagues, but Wessel soon became a stoic, his combative attitude and sharp tongue too cutting even for old friends.\n\nWessel is no idealist; he sees his duty as guarding the people's safety and Germany's stability, all for the German people. This means his work will differ greatly from the shadow cabinet nature of the RND under Gehlen; Wessel hopes to transform the intelligence service into a body that truly serves all German people, rather than a secret police apparatus merely protecting the Führer and the Nazi Party.\n\nGermany would clearly benefit if the RND were no longer under Gehlen's control - though the Führer himself might not be so pleased. Whether Wessel's loyalty to the people will lead to conflict with the Führer remains to be seen."
 Espionage_Kaltenbrunner: "Ernst Kaltenbrunner"
 Espionage_Kaltenbrunner_Desc: "My duty grants me power. My power gives me strength. My strength stands above all, and now will crush all who threaten me.\n\nThe hunger for justice and order led the German people to support National Socialism, and now Germany has done all it can to ensure that justice, however terrible, is served. Ernst Kaltenbrunner is such a figure; born to a family of lawyers, when his homeland Austria was swallowed by Adolf Hitler's Germany, he used his background to pursue the basest ends - imposing National Socialism in his native Austria. Adolf Eichmann was his close protégé, and Heinrich Himmler, Reinhard Heydrich, and the entire SS cooperated extensively with him; as his Final Solution apparatus was implemented, his standing in the organization rose accordingly. As chief of Germany's concentration camps, death slipped from this Austrian's fingertips and fell upon all deemed subhuman by the German Reich."
 Espionage_Muller: "Heinrich Müller"
 Espionage_Muller_Desc: "Wielding the power of the Order Police, Heinrich Müller has long hidden himself behind an aura of political coldness. In the first seven years of the Third Reich, this cold, calculating official rose from chief of the Munich Political Police to head of the Gestapo, ruling the empire's secret police with ruthless efficiency.\n\nThough he has a long SS career, Müller soon sided with Bormann and the party conservatives. Whether this is because he had secretly converted to orthodox National Socialist doctrine, or merely because he believes Bormann offers the greatest stability, is debatable. But for Bormann, it does not matter. As long as the head of the Order Police remains a man of conviction who continues to serve the German fatherland, the Führer trusts he will do his duty."
 Espionage_Dulles: "Allen Dulles"
 Espionage_Dulles_Desc: "Before becoming synonymous with American espionage, Allen Welsh Dulles was a lawyer. After multiple State Department postings to Europe and witnessing the Nazi empire's rise on the continent, he became convinced that any form of American isolationism was a delusion against tyrants bent on devouring the world. His wartime experience as the link between the OSS and the German anti-Hitler resistance did not dispel this view but deepened his understanding of the European nightmare.\n\nReturning to America, he criticized American intelligence for its inability to collect information from enemy states and proposed concentrating the intelligence apparatus around a Central Intelligence Agency. The Dulles Report aimed squarely at the agency's management, causing a stir in Washington. Thus, before becoming Director of Central Intelligence, the CIA made him Deputy Director of Plans."
 Espionage_Helms: "Richard Helms"
 Espionage_Helms_Desc: "The 1945 dissolution of the OSS was not the end of the story for a man like Richard Helms. He had been an intelligence officer operating in Central Europe, and when his organization was folded into the CIA, he realized a great opportunity lay before him. Working through the agency's various operations, Helms found himself rising rapidly through the ranks. Now it is his turn to steer the ship.\n\nA steadfast believer in human intelligence, Helms places great weight on information gathering and counterespionage. He is more skeptical than anyone of the value of covert action. Yet he believes deeply in the organization's value in guiding world affairs, more for the benefit and security of the United States."
 Espionage_Bunker: "Lawrence E. Bunker"
 Espionage_Bunker_Desc: "If anyone can speak to what happens when intelligence fails, it is Lawrence Elliott Bunker. He arrived in the Pacific as an aide to senior officers including General MacArthur, and witnessed firsthand the losses undetected conspiracies brought to the nation. The disaster of Pearl Harbor and America's withdrawal from the Philippines steeled his resolve never to let an international plot to destroy America succeed again.\n\nBunker is one of those most dedicated to protecting America from internal and external threats, and now he has the power to pursue any evil scheme against the American people anywhere in the world. He long ago spotted the alarms others ignored or pretended not to see, and now the CIA is poised to expose what the enemies of freedom are trying to do to this great nation."
 Espionage_Taylor: "Maxwell Taylor"
 Espionage_Taylor_Desc: "Anyone preparing to go deep behind enemy lines and do the impossible wants as much accurate information as possible. Maxwell Taylor knows this as well as anyone. From Europe to the 101st Airborne in Little Rock, Taylor has given his all for the US Army. Now his task is to ensure America always has the capability to crush any invader.\n\nTaylor focuses on the tactical and strategic benefits of special operations; he knows that not only American soldiers' lives depend on accurate intelligence, but also the allies fighting for freedom. His goal is to ensure every freedom fighter benefits from the world's greatest intelligence organization. From Rangers to African militiamen to ocean freedom fighters, every warrior will have the support of General Taylor and all of Langley."
 Espionage_Brown: "George Brown"
 Espionage_Brown_Desc: "Pride goeth before a fall. General George Scratchley Brown has seen too many Eighth Air Force men die in an instant when a mission that should have gone smoothly went wrong. He believes the ability to anticipate the worst and prepare for it is what separates a pilot who leaves his plane early from one who becomes a senior officer. Just as in Europe, Brown is pushing to complete the mission and bring his people home.\n\nHe harbors no illusions about the difficulty of the task; the allies cooperating with America will not strain themselves to lighten America's burden. The responsibility of narrowing the gap between the free world and the enslaved world falls on the CIA. Against the German Reich and the Japanese Empire, America has no room for complacency. If America thinks it is winning the Cold War, it will lose."
 Espionage_Cooper: "John S. Cooper"
 Espionage_Cooper_Desc: "Many intelligence chiefs come from the military, but for Senator Cooper, his time as an Army lawyer was not why he wants to be director. After retiring, he ran for Congress, serving his home state of Kentucky. During this time he made friends across party lines, maintained bipartisanship, and was awarded diplomatic postings around the world. Now the Kentucky lawyer brings a fresh approach to Langley.\n\nEven with the CIA behind him, Cooper does not believe America can win the Cold War alone. He believes the CIA must, like America, learn to cooperate with and respect other nations of the world, using their resources against the enemy. His focus on intra-OFN cooperation and his standing in Washington have convinced Washington this is the path forward. But how his unconventional strategy will play out in the CIA's dark chambers remains to be seen..."
 Espionage_Bissell: "Richard Bissell"
 Espionage_Bissell_Desc: "Sun Tzu said: \"What the enlightened ruler and the wise general achieve above all others in movement is foreknowledge. Foreknowledge cannot be gotten from ghosts and spirits, cannot be based on analogy, cannot be verified by calculation, but must be obtained from people - people who know the enemy's situation.\" Richard M. Bissell Jr. quoted this and made it the CIA's core philosophy. He believes that with advance knowledge, the enemy can only sit and wait for death.\n\nThe U-2 program gave America the cutting-edge technology needed to expose the Axis, but this was only the beginning. Now that Bissell is in charge, this masterpiece of intelligence collection will be the model for his projects. Whatever the diplomatic details, collecting whatever information is necessary will be his goal. After the Germans and Japanese decided to pursue continental empires of slaves, they forfeited their right to live beyond the gaze of the American eagle."
 Espionage_Jackson: "Henry M. Jackson"
 Espionage_Jackson_Desc: "Henry Martin \"Scoop\" Jackson's political career in Washington seemed to have peaked. Though he ran in 1960, 1964, and 1968, the honorable Senator from Washington never attained the presidency he dreamed of. Before the NPP Progressive caucus gave him another long-term job, letting him make his mark on Virginia soil, Jackson's public service career seemed destined to end in the Senate.\n\nPresident Harrington put a Cold Warrior in the CIA's chariot, and now it has sharpened its swords and girded for battle. For years Jackson debated in the Senate what America should do for the world; now he finally has the chance to put it into practice. Everyone at Langley knows they are fighting to liberate the world. When the creatures in Germania and Tokyo see what the \"Company\" will do against them by any means necessary, they will learn to fear God."
 Espionage_Schlesinger: "James Schlesinger"
 Espionage_Schlesinger_Desc: "As the son of Jewish immigrants from New York, witnessing the failure of the great crusade against Nazi tyranny left a particularly deep impression on James Rodney Schlesinger. Even after he later changed his faith, the shame of America's defeat by its enemies remained etched in his memory. When he was appointed director, he found himself finally in a position that would ensure America never again had to submit.\n\nNow, a rearming America returns with a strong diplomatic hand, and the CIA under Schlesinger will be a powerful arm of this work. By collecting intelligence, the Army, Navy, Air Force, and Marines will seize the initiative when the shooting starts. Presumably the second generation of Americans will sleep easy, free from the threat of overseas dictators and kings."
 Espionage_Knoche: "E. Henry Knoche"
 Espionage_Knoche_Desc: "In 1953, a former sports star walked into the CIA and asked for a job. He had no experience in operations or secret intelligence, only some college basketball trophies and Navy service, and his only credentials were a language no one needed (Russian) and a Chinese dialect no one cared about (Fuzhou). Enno Henry Knoche should have walked out of the building to laughter, yet now he runs the organization. What is the secret?\n\nThose who know Director Knoche know that his clean resume does not explain his strengths. As a professional who has handled the CIA's most important management tasks, Knoche is known for delivering intelligence briefings to the president and long running the agency's day-to-day operations. It all proves one fact: experience can be filled in, resumes can be exaggerated, but nothing compares to natural talent."
 Espionage_Bush: "George Bush"
 Espionage_Bush_Desc: "George Herbert Walker Bush has always excelled at making the impossible possible. Many thought taking on the Democratic machine in Texas was political suicide, but Bush broke the mold and shook the Democrats' grip. Now Bush is no longer a partisan; he will take the national stage to serve his country, a fine two-dollar sirloin steak on his plate.\n\nThe CIA has been overwhelmed by highly damaging and controversial revelations, facing the risk of being crushed at any moment. Standing before this Gulf hurricane is Director Bush, who will talk to it and persuade it not to destroy the organization. Bush will handle public relations for the CIA to ensure the agency survives the coming storm. And to handle public relations for an institution that shuns contact with the public, he must move quickly."
 Espionage_Tower: "John Tower"
 Espionage_Tower_Desc: "Many think they know what Director John Goodwin Tower will bring them. Many believe that as a staunch conservative opposed to civil rights, he will be another American exceptionalist willing to stir up trouble in other parts of the world for so-called American interests. But they will be proven wrong.\n\nTower's CIA will no longer be an agency riddled with assassinations and coups, enamored of inhumane experiments and the erosion of civil liberties. That old agency must be cleaned up. The new CIA will be clean; it will justify its means by honor, not ends. Tower believes that if the path is wrong, the CIA will ultimately achieve nothing.\n\nThe American people deserve better."
 Espionage_Copeland: "Miles Copeland Jr."
 Espionage_Copeland_Desc: "After an emergency personnel hearing carefully arranged by an arrogant government, the question \"Who is Miles Copeland Jr.?\" has plagued Washington's security apparatus. Much of Copeland's life and career is shrouded in mist, and many of the experiences he admits to seem absurd.\n\nAt least some facts are known: Miles Copeland Jr., born 1916 in Birmingham, Alabama. He attended the University of Alabama in Tuscaloosa, then dropped out. After that, Copeland either became a popular jazz musician in New York nightclubs or held a series of insignificant sales jobs. He joined the US Army in 1940. There he shared quarters with the famous intelligence officer William \"Wild Bill\" Donovan and was recruited as an agent. Donovan then dispatched him across Europe, either to eliminate someone or to \"root out Axis spies.\" By war's end Copeland had earned a citation, still classified, and the intelligence he was later sent to collect for the CIA in the Middle East and Caribbean is likewise classified. In the early 1960s he left the CIA, entered media, and took up journalism, becoming a National Review darling for his articles mocking the foreign policy establishment.\n\nThough everyone agrees Copeland is a very smart, friendly, and charming man, the gaps in his biography alarm activists and whistleblowers. The CIA has never been led by someone so obscure, and so eager to混淆事实. Copeland smiles and hums a cheerful tune, swearing he will work for Schlafly's campaign to root out the \"kingmakers.\" What this means, and why he supports it, remains one of the many known unknowns of his life."
 Espionage_Lovestone: "Jay Lovestone"
 Espionage_Lovestone_Desc: "When former CPUSA leader Jay Lovestone was nominated by Gus Hall to be Director of Central Intelligence, many expressed surprise. But few were more surprised than Jay Lovestone himself, given that he had been expelled from the party in the mid-1940s.\n\nJay Lovestone was born to a Lithuanian Jewish family in White Russia. He immigrated to America at age 10 with his father, a rabbi who later became a synagogue caretaker, settling in Manhattan's Lower East Side. Jay Lovestone's varied experiences and long immersion in New York's colorful political life led him to join various left-wing and socialist groups. In 1919 he dropped out of NYU Law School to devote himself fully to the communist cause, at a time when the red flag seemed not far from sweeping the globe. His staunch support for Nikolai Bukharin helped him rise rapidly through the CPUSA ranks, eventually becoming its leader.\n\nAlas, the socialist road was not smooth. The fall of the Soviet Union and the triumph of the Axis put Jay Lovestone in personal and professional crisis. Expelled from the party for \"deviationism,\" he began a long period of self-reflection. Privately, he criticized the mainstream communist movement as a totalitarian conspiracy bent on world conquest and voluntarily became a CIA asset planted in the communist labor movement. He also ran a network of informants - in the name of American national security.\n\nEven if the new president knows this history, he has no interest in digging it up. On the contrary, the president appointed Lovestone precisely to prove that communism bears no grudges and unites all Americans in solving \"the real problems facing America.\" Lovestone now sits restless in his Langley office, on one hand because his subordinates are dangerous idiots from private schools, on the other because his boss Gus Hall - Lovestone fears his superior might actually launch a world revolution, and he wants nothing to do with it."
 Espionage_Vacant: "Vacant"
 Espionage_Vacant_Desc: "Something has gone wrong in Washington.\n\nFor the first time in history, the position of Director of Central Intelligence is long-vacant. There could be many reasons: Congress might be deadlocked and unable to function; the nominee might have been found wanting; or, the reason most unsettling to American hawks, the president might simply not have decided on a nominee and might prefer to keep the vacancy open.\n\nWhatever the reason, the prolonged vacancy has caused a long standstill in American intelligence. Though career employees may be able to keep the system running and continue their missions worldwide, the lack of political leadership has left the CIA rudderless. New operations cannot be approved, and the CIA cannot conduct analysis of new intelligence. Worse, as America gradually awakens to the growing threats worldwide and the far-reaching impact of German and Japanese espionage programs, a deep sense of fear has begun to grow within the nation."

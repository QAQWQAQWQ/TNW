 Espionage_RSHA_Desc: "§WThe Reich Security Main Office§! is §gGermany's§! highest security agency, responsible for maintaining order and intelligence work against all enemies of the state, wherever they may be."
 Espionage_RND_Desc: "§WThe Reich Intelligence Service§! is §gGermany's§! unified response to the CIA and the Head of Military Intelligence, a coordinated intelligence body free from the quagmire of competing agencies of the past."
 Espionage_HVA_Desc: "§WThe Foreign Intelligence Service§! is §gGermany's§! response to the CIA and the Head of Military Intelligence, this new branch of the §LOrder Police§! unifying Germany's foreign intelligence apparatus."
 Espionage_CIA_Desc: "§WThe Central Intelligence Agency§! is the §MUnited States§!' newest intelligence service, created to defend American international interests in the Atlantic and Pacific."

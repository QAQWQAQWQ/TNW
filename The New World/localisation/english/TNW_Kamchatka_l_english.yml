 KMC_communist_party: "Yumashev Clique"
 KMC_communist_party_long: "Yumashev Clique (Klika Yumasheva)"
 KMC_Ivan_Yumashev: "Ivan Yumashev"
 POLITICS_IVAN_YUMASHEV_DESC: "Admiral Ivan Stepanovich Yumashev served in the Soviet Navy for decades, even though the country he once served no longer exists. From the Baltic Sea to the Sea of Okhotsk, he once sailed across so many waters, but now he can only set most of his sights on the Bering Sea. Throughout the Great Patriotic War, he devoted all his energy to commanding the Pacific Fleet, mainly on patrol duty, occasionally engaging in small skirmishes with Japanese ships. When stationed in Vladivostok, he received news of the Soviet defeat, and he immediately took action, evacuating the fleet from the port before the Japanese jackals could arrive.

After everything settled down, Admiral Yumashev and his officers swore allegiance to the Yagoda regime, obtaining a temporary posting. Then, as the reactionaries advanced, Yumashev's navy had to leave the Amur River fortresses and find a new place to settle. The city of Petropavlovsk-Kamchatsky had been abandoned by the Soviet government and most of its inhabitants; apart from a few villages, there was almost no infrastructure here. So the Kamchatka coast became the command post of the Red Navy, and this small fishing village was converted into a temporary naval base.

In this remote place far from civilization, the Red Navy of the Far East could do nothing but constantly chisel ice around their warships. They could only watch helplessly as the region descended into chaos and infighting. With no normal way to obtain supplies and fuel, the crew began to survive by plundering smugglers on the Pacific Ocean, becoming an additional nuisance in the maritime competition between Japan and the United States. Admiral Yumashev did not like that his soldiers had become this kind of people — but he would certainly not deprive them of the only way they might survive on the edge of the earth."
 KMC_Nikolay_Ivanovsky: "Nikolay Ivanovsky"
 KMC_Emil_Spirodnov: "Emil Spirodnov"
 KMC_Nikolay_Smirnov: "Nikolay Smirnov"
 KMC_Pavel_Kolesnik: "Pavel Kolesnik"
 KMC_Grigory_Shchedrin: "Grigory Shchedrin"
 KMC_Viktor_Medvedev: "Viktor Medvedev"
 KMC_sailor_state: "Sailor State"
 KMC_sailor_state_desc: "Among the warlords of Russia, our small regime is quite unique, because our core is not the remnants of the Red Army, but the remnants of the Red Navy. With our base in the frozen Far East, our options are limited, but this land is easy to defend and hard to attack, allowing us to focus on the only true path to freedom."
 KMC_collapse_despotism_party: "Ivanovsky Clique"
 KMC_collapse_despotism_party_long: "Ivanovsky Clique (Klika Ivanovskaya)"

l_english:
 BRI_Party_of_Contrasts_category:0 "§FParty of Contrasts§!"
 TNO_BRI_Party_Activate_tt:0 "\n§F£GFX_BRI_pragmatists §sPragmatists§! and £GFX_BRI_ideologues §UIdeologues§! stand on the brink, fighting for Britain's future.\n\nThe §sParty§!§W of§!§U Contrasts§! decision category has been enabled in the £decision_icon_small §YDecisions screen§!.§!\n"
 BRI_Chaos_dynamic_modifier:0 "§RChaos£GFX_discontent_texticon §! Effects"
 TNO_BRI_Party_Butler_tt:0 "§F£GFX_BRI_pragmatists §sPragmatists§! - Rab Butler§!"
 TNO_BRI_Party_Butler_tt_delayed:0 "In Britannia's long history, Britain has produced many traitors - Anthony Babington, Guy Fawkes, Karl Hans Lody. But of recent memory, perhaps the most despised of all is His Majesty's loyal Chancellor of the Exchequer, Rab Butler. Richard Austen \"Rab\" Butler was born to a family of colonial administrators in India, attended Marlborough College before dropping out, worked as a private tutor for English and French children for several years, then studied at Cambridge for four years, was elected a fellow, and finally resigned to stand for Parliament.\n\nAfter being elected to Parliament in 1929, Butler became a prominent supporter of appeasement, even urging in 1939 to break the alliance with Poland and align with Germany. When Germany conquered the British Isles in WW2, he did not flee with his colleagues but chose the unthinkable path - collaborating with the Teutons. As Chancellor of the Exchequer, he implemented a series of §spragmatic§! economic recovery measures, helping Britain recover from the ravages of the Blitz and Operation Sea Lion.\n\nNow he is the head of the §sPragmatists§! of the British People's Party, and the greatest rival of the §UIdeologues§! - the successor to the British Union of Fascists. Many in the People's Party distrust Butler, believing that his participation in the wartime government makes him disloyal to the New Britain; the §UIdeologues§! in particular regard him as a great traitor. Yet Butler remains in his post as Chancellor, and his support remains essential to any Prime Minister; the moderate collaborators' support for him remains unshakable. Perhaps the last remnants of the once-free Britain still live on in his heart.\n\n£GFX_BRI_pragmatists §sPragmatists§! currently hold [BRI_Party_GetPragmatistInfluence] influence."
 TNO_BRI_Party_Fountaine_tt:0 "§F£GFX_BRI_ideologues §UIdeologues§! - Andrew Fountaine§!"
 TNO_BRI_Party_Fountaine_tt_delayed:0 "From the ashes of Britain, the British fascist movement rose again, reborn upon the death of the old order, and the leader it found was Andrew Fountaine. Fountaine was born in Norfolk shortly after the end of the Great War, raised on the family's ancestral Narford Hall. His father was Rear Admiral Charles Fountaine, who served as naval aide-de-camp to George V. Fountaine was educated at the Royal Military Academy in Aldershot and later studied natural sciences at Cambridge.\n\nHe first fought for Franco's Nationalists. When WW2 broke out, he joined the Navy and served gallantly in the Pacific. When he returned home, Britain was a changed place. His steadfast support for fascism quickly elevated him to the upper echelons of the British People's Party, and he eventually became the head of the fascist §UIdeologues§! - the greatest rival of Butler and the §sPragmatists§!. He also achieved what many of his fascist colleagues could not: the trust of the House of Lords, which elevated him to the post of Home Secretary. Fountaine now, as one of Britain's most powerful men and Domvile's right hand, finally has the chance to implement the fascist sociocultural policies he witnessed thirty years ago, and make Britain great again.\n\n£GFX_BRI_ideologues §UIdeologues§! currently hold [?BRI_Party_InfluenceTotal|W1%%] influence."
 ENG_POC_CurrentSelection:0 "§WCurrently selected:§! [BRI_Party_GetCurrentSelection]"
 TNO_BRI_Party_Peers_name_tt:0 "£GFX_TFL_ENG_Peers §sPeers§!"
 TNO_BRI_Party_Peers_tt:0 "§F£GFX_TFL_ENG_Peers §sPeers§!\n--------------\n£GFX_BRI_pragmatists §sPragmatists§!: [?BRI_Party_CategoryInfluenceAlt^0|W1%%]\n[BRI_Party_GetFascistName]: [?BRI_Party_CategoryInfluence^0|W1%%]\n--------------\nAt the insistence of the £GFX_TFL_ENG_Peers §sPeers§! and the Germans, the government has rolled back reforms that would have stripped the House of Lords of its power. The two chambers of the Westminster Parliament are once again equal, and the £GFX_TFL_ENG_Peers §sPeers§! are once more a vital pillar of British government. Any ambitious leader must win their support by any means necessary.§!"
 TNO_BRI_Party_Peers_tt_delayed:0 "§WClick§! to select the £GFX_TFL_ENG_Peers §sPeers§! for interaction."
 TNO_BRI_Party_Garrison_name_tt:0 "£GFX_TFL_ENG_German_Garrison §rGerman Garrison§!"
 TNO_BRI_Party_Garrison_tt:0 "§F£GFX_TFL_ENG_German_Garrison §rGerman Garrison§!\n--------------\n£GFX_BRI_pragmatists §sPragmatists§!: [?BRI_Party_CategoryInfluenceAlt^1|W1%%]\n[BRI_Party_GetFascistName]: [?BRI_Party_CategoryInfluence^1|W1%%]\n--------------\nUnder the command of Rudolf Wulf, the £GFX_TFL_ENG_German_Garrison §rGerman Garrison§! defends Britain, engaging any who would challenge the New Order. Any Prime Minister must maintain good relations with the £GFX_TFL_ENG_German_Garrison §rGerman Garrison§!, or the consequences will be severe...§!"
 TNO_BRI_Party_Garrison_tt_delayed:0 "§WClick§! to select the £GFX_TFL_ENG_German_Garrison §rGerman Garrison§! for interaction."
 TNO_BRI_Party_Corporations_name_tt:0 "£GFX_TFL_ENG_German_Corporations §IGerman Corporations§!"
 TNO_BRI_Party_Corporations_tt:0 "§F£GFX_TFL_ENG_German_Corporations §IGerman Corporations§!\n--------------\n£GFX_BRI_pragmatists §sPragmatists§!: [?BRI_Party_CategoryInfluenceAlt^2|W1%%]\n[BRI_Party_GetFascistName]: [?BRI_Party_CategoryInfluence^2|W1%%]\n--------------\nAfter the war, Britain had no choice but to welcome the generous assistance of the £GFX_TFL_ENG_German_Corporations §IGerman Corporations§!, and the economy was naturally dominated by them. Their position is unassailable, but whoever can bring the £GFX_TFL_ENG_German_Corporations §IGerman Corporations§! to their side will find it a highly profitable alliance.§!"
 TNO_BRI_Party_Corporations_tt_delayed:0 "§WClick§! to select §F£GFX_TFL_ENG_German_Corporations §IGerman Corporations§! for interaction."
 TNO_BRI_Party_Party_name_tt:0 "£GFX_TFL_ENG_BPP_Party §gParty§!"
 TNO_BRI_Party_Party_tt:0 "§F£GFX_TFL_ENG_BPP_Party §gParty§!\n--------------\n£GFX_BRI_pragmatists §sPragmatists§!: [?BRI_Party_CategoryInfluenceAlt^3|W1%%]\n[BRI_Party_GetFascistName]: [?BRI_Party_CategoryInfluence^3|W1%%]\n--------------\nSince its founding, the £GFX_TFL_ENG_BPP_Party §gParty§! has been roiled by the struggle between ideologues and pragmatists. Some have already chosen sides, but the ordinary £GFX_TFL_ENG_BPP_Party §gParty§! member will follow whoever proves themselves better and more capable of leadership than the other side.§!"

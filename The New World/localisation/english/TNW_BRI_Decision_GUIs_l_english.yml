 BRI_Mann_Info_tt_delayed: "§FWe thought this was just a minor clash between local police and petty criminals, but it has grown far larger. This is not a riot - it is a civil war. Even the quietest villages of England are suffering the fires of war. §RHMMLR§! is planning to open a new front on the Isle of Man - this inconspicuous island has become the transit point for Washington's supply shipments to our enemies. To win, we must defend the landing grounds at any cost.\n\nThe rebels will attack one of five locations on the island. Our §lcounterintelligence§! task is to ensure they do not strike our most vulnerable state. Our §nweaponry§! refers to the arms and supplies we have committed to Mann to repel §RHMMLR§! raids. Note that the more we invest in the island's §Jdefense§!, the higher the cost, and the more troops may be diverted from other fronts.\n\nIf all states are under attack, investing weaponry can counteract this. But the priorities are yours to decide, Prime Minister. If this state falls into enemy hands, we will have no choice but to leave the island and hand it over to Washington.§!"

 BRI_Mann_Intel_Bar_Title_tt: "§F£mann_intel §lIntelligence§!\n--------------\n£mann_intel §lIntelligence§! reflects how much we know of §RHMMLR§! plans. If our £mann_intel §lintelligence§! is higher than £expertise §RHMMLR intelligence§!, their attacks on §WMann§! will backfire. As for the level of £expertise §RHMMLR intelligence§!, we can only guess.§!"

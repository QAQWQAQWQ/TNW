 BRI_Midnight_AcclimationTitle_text: "§WBattlefield Acclimation - [?BRI_Midnight_Acclimation|0%%w]§!"
 BRI_Midnight_AcclimationTitle_tt: "£com_acclimation §wBattlefield Acclimation§!\n--------------\nEven peaceful land changes a little with time; land at war has two possibilities: unchanged for ages, or transformed overnight. Since the front is not always in flux, the latter case is easier to defend against."
 BRI_Midnight_AcclimationBar_tt: "Our current £com_acclimation §wBattlefield Acclimation§! level is [?BRI_Midnight_Acclimation|W%%1]"
 BRI_Midnight_AcclimationBar_tt_delayed: "This produces the following effects at the front:\n  Unit defense: [?BRI_Midnight_AcclimationEffects^0|%+=1]\n  Planning speed: [?BRI_Midnight_AcclimationEffects^1|%+=1]\n  Plan bonus cap modifier: [?BRI_Midnight_AcclimationEffects^2|%=+1]"
 BRI_Midnight_AcclimationDesc_text: "[BRI_Midnight_GetAcclimationDesc_text]"
 BRI_Midnight_AcclimationDesc_text_VeryBad: "The walls are gone, nothing to rely on."
 BRI_Midnight_AcclimationDesc_text_Bad: "Let our defenses pile up, let their armies pass through."
 BRI_Midnight_AcclimationDesc_text_Normal: "The fortress is solid, but the soldiers quarrel."
 BRI_Midnight_AcclimationDesc_text_Good: "We have done all we can; who knows the outcome?"
 BRI_Midnight_AcclimationDesc_text_VeryGood: "An iron wall, a bronze fortress."

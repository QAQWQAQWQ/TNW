 BRI_Midnight_ExhaustionTitle_text: "§WState Machine Exhaustion - [?BRI_Midnight_Exhaustion|0%%R]§!"
 BRI_Midnight_ExhaustionTitle_tt: "§F£str_exhaustion §RState Machine Exhaustion§!\n--------------\nNations wage war, machines sustain nations - this law is as old as the state itself. To truly win a war, the lives and labor required must interlock and rotate. If this mechanism breaks, the war is lost, and we have no way out - the nation must endure, no matter what.§!"

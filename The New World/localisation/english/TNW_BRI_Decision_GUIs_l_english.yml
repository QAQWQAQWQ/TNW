 BRI_Midnight_ExhaustionDesc_text: "[BRI_Midnight_GetExhaustionDesc_text]"
 BRI_Midnight_ExhaustionDesc_text_VeryBad: "Grain by grain, the sand falls; brick by brick, the walls crumble."
 BRI_Midnight_ExhaustionDesc_text_Bad: "Completion is far away, destruction is near."
 BRI_Midnight_ExhaustionDesc_text_Normal: "Searching and seeking, the dragon breathes and the whale draws in."
 BRI_Midnight_ExhaustionDesc_text_Good: "We can live, we can fight."
 BRI_Midnight_ExhaustionDesc_text_VeryGood: "Victory is near, the promised day is coming."

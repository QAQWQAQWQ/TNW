 BRI_Midnight_Image_tt: "§WSecond Great Uprising§!"
 BRI_Midnight_Image_tt_delayed: "War comes to the British Isles. The lights of the three kingdoms have gone out, and only by relighting them can we see our own faces - already submerged in the blood of our countrymen. But we must continue to fight, for the alternative is nothing but an abyss."
 BRI_Midnight_ConfidenceTitle_text: "§WArmy Morale - [?BRI_Midnight_Confidence|0%%G]§!"
 BRI_Midnight_ConfidenceTitle_tt: "§F£mil_confidence §GArmy Morale§!\n--------------\nWar is not merely about \"whether\" and \"why\"; for those enduring the shellfire, war is a question of \"when\" and \"how\". Occupy enemy territory, inflict casualties - any means is justified as long as our fighters are not sent to hell. To risk life for past victories and win once more - that is enough.§!"
 BRI_Midnight_ConfidenceBar_tt: "§FOur current £mil_confidence §GArmy Morale§! level is [?BRI_Midnight_Confidence|W%%1]§!"
 BRI_Midnight_ConfidenceBar_tt_delayed: "§FThis produces the following effects in combat:\n  Unit attack: [?BRI_Midnight_ConfidenceEffects^0|%+=1]\n  Army org recovery rate: [?BRI_Midnight_ConfidenceEffects^1|%+=1]\n  Org loss when moving: [?BRI_Midnight_ConfidenceEffects^2|%-=1]\n  Supply consumption: [?BRI_Midnight_ConfidenceEffects^3|%-=1]\n  §RState Machine Exhaustion§! biweekly growth: [?BRI_Midnight_ConfidenceEffects^4|%%-=2]§!"
 BRI_Midnight_ConfidenceDesc_text: "[BRI_Midnight_GetConfidenceDesc_text]"
 BRI_Midnight_ConfidenceDesc_text_VeryBad: "No home in sight, no road ahead. All we see is a curse - how to climb out of the mire?"
 BRI_Midnight_ConfidenceDesc_text_Bad: "Hardship is natural, the future unknown - fortune and misfortune are one, choose as you will."
 BRI_Midnight_ConfidenceDesc_text_Normal: "Orate the future? The future will tell."
 BRI_Midnight_ConfidenceDesc_text_Good: "Tomorrow has its place, wide and open."
 BRI_Midnight_ConfidenceDesc_text_VeryGood: "All who see us have learned; a little sincerity lives in the heart."
 BRI_Midnight_ConfidenceDesc_tt: "£mil_confidence §GArmy Morale Status§!"

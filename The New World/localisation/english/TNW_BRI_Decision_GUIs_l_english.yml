 BRI_Party_MainImage_tt:0 "The British People's Party, as the sole legal party, has been forced to become a crowded stage for competing voices, with factions all striving to push the party toward their own ideological direction. These voices typically take two forms: the Pragmatists, a mix of sincere democrats, technocrats, and those with vague reformist leanings; and the Ideologues, diehard fascists who seek to abolish existing compromise policies and turn Britain into a New Order beacon alongside Germany and Italy. The latter camp includes Old Guard loyalists to Domvile and Chesterton, newly established establishment politicians, and more obscure figures.\n\nThese groups vie for influence across four domains of power: the Peers, German Corporations, the German Garrison, and the Party apparatus itself. Each strives to win the support of every domain in order to control the British People's Party. Of course, such support is never guaranteed; influence ebbs and flows week by week. When the two factions are evenly matched, the only winner is Chaos - and its spread can only be limited, never stopped. Chaos benefits only one kind of person and is a disaster for everyone else. If Chaos prevails, all is lost."

 BKR_Validi_Tugan: "Ahmed-Zaki Validov Tugan"
 POLITICS_VALIDI_TUGAN_DESC: "Ahmed-Zaki Validov Tugan — or Zeki Velidi Togan, as he is better known abroad — is in many ways a figure who reflects the history of the Bashkir people in the twentieth century: a generation that forged its national identity, weathered the upheavals of the Russian Civil War, suffered the humiliation of being torn from its traditions, and finally, was given another chance to prove itself. Born into a family of Islamic clerics, Validov became an accomplished Turkologist, studying the national history of the Bashkirs in the late Tsarist era. During this period, he began his political activism to advance the interests of Russia's Muslim community and Bashkir autonomy.

After the two Russian Revolutions, Validov became the most visible symbol of Bashkir nationalism. He initially cooperated with the Bolsheviks, believing their promises to break the Tsar's enslavement of the peoples. But he soon discovered that beneath the Bolshevik slogans lay the same Great Russian chauvinism that had oppressed the peoples since Tsarist times. He was driven out of Bashkortostan and continued to fight Soviet authoritarianism alongside the Basmachi movement in Central Asia, but to no avail. He was forced into exile, his connection to his roots severed by force, yet he continued his academic work abroad, sustaining the Bashkir scholarly tradition from thousands of miles away.

Amid the chaos brought by the West Russian War, an independent Bashkir Islamic Republic was established. Yet no one at the time imagined that Validov would venture into the turbulent world of Bashkir politics; the younger generation barely remembered his name. They were gravely mistaken. Returning to the war-torn Russian heartland from Turkey was no easy journey. His achievements were once again recognized in his homeland, and in this era when the sovereignty of the Bashkir people and their Muslim homeland faced grave challenges, he naturally became the leader of the Bashkir nation."
 BKR_ONG_Faizrakhman_Zagafuranov: "Faizrakhman Zagafuranovich Zagafuranov"
 POLITICS_FAIZRAKHMAN_ZAGAFURANOV_DESC: "Faizrakhman Zagafuranovich Zagafuranov has lived his entire life on Bashkir soil. He began climbing the endless ladder of the Soviet bureaucracy at a young age, but he arrived too late — when the Soviet Union fell, the ladder he was climbing fell with it. The catastrophe of the Great Patriotic War left him despondent, but his efforts for Bashkir regional rights eventually bore fruit: the Republic of Bashkortostan won its independence in the bloody aftermath of the West Russian War, and Zagafuranov was one of those who made it happen.

Unfortunately, all good things come to an end. Bashkiria was once again crushed under the Russian boot, at least until the liberators came from the north. As long as the puppet government they established remained in power, the anti-communist Volunteer Army cared little about what happened in the distant south, not even the second liberation of the Idel-Ural states.

Zagafuranov appeared to be a capable administrator and a passionate leader, and so Arkhangelsk finally made its decision. The official was selected as the new president of the Republic of Bashkortostan — and it seemed he would hold this position for a long time to come."

 RUS_murmansk_crisis_category: "§BMurmansk Crisis§!"
 RUS_murmansk_crisis_category_desc: "The Russians of Karelia are tired of living under Finnish occupation. With the unification of Western Russia, they see an opportunity to return to the motherland, and have risen up. Now, the Murmansk People's Republic is fighting a large, well-equipped army — without our support, they won't last long. Although the Finnish army is smaller than ours, it is better organized, and supported by the Onega Anti-Communist Volunteer Army. To intervene in Karelia, we must organize our forces for war, while secretly providing support to Murmansk through the Barents Sea to defend against Finnish attacks. Once our §Breadiness§! reaches 100%, we can launch a full intervention to support Murmansk.

Current §Breadiness§!: [?MPRInterventionProgress]%/100%.
Weekly §Breadiness§! growth: [?MPRInterventionProgressGain]%"

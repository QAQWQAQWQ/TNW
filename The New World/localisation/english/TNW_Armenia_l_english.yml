 POLITICS_PETROS_POGHOSYAN_DESC: "A beast in human skin, a desolate Russian prison, guns, armies, bullets - nothing could make Petros Poghosyan leave the Armenia he loved.\n\nWhen the Ottoman Empire brutally drove his countrymen to die of the scorching sun in the desert, he descended like an avenging angel, turning his weapons against the oppressors, watering the earth with Djemal Pasha's blood to atone for his crimes. When the Soviets invaded Armenia, cold Russian commissars dragged him away and threw him into the Vorkuta Arctic gulag in the frozen north. But even the Soviet Union's icy bars could not hold him; when the prisoners of Vorkuta broke out, Petros won freedom once more and returned to Armenia, returned to his homeland still in chains.\n\nThe avenging angel did not hesitate. He took up arms again, reuniting with his former comrades to plan the restoration of the Armenian nation and state. Petros knew the coming war would be long and hard, that the gun barrel was pressed against the head of the entire people; ideologies, religious faith, and the like were small matters by comparison.\n\nWoe to the Turkish oppressors. Forty years were not enough to erase Poghosyan; evidently, §Rnothing can break him.§!"
 ARM_Fedayeen_Gather: "Fedayis, Assemble!"
 ARM_Fedayeen_Gather_desc: "The Armenian people have long suffered under Turkish oppression. We have been beaten, bound, tortured, and massacred by them, all stemming from the few ambitions of a long-dead man. Now our people have gathered, and we will take our revenge.\n\nOur brave fedayis gather together, preparing for war. This will be a glorious struggle worth singing of. As long as the people support us, we will not give up, will not surrender, §Vuntil the Armenian people shed the last drop of blood for their homeland.§!"
 ARM_united_front: "Aras United Front"
 ARM_united_front_desc: "The Armenian resistance movement is divided into two main factions. In the rural areas, the Armenian Revolutionary Federation has launched numerous assassinations and sabotage actions against the Turks; in the cities, the Sons of Hayk lurk in the streets and alleys, waging guerrilla warfare against the occupation, forcing the Turks to remain on constant high alert. Though the two sides have deep ideological disagreements, we must set aside these prejudices to liberate our people. The Armenian people will stand united, work together, and finally realize our shared dream. We will be free."
 ARM_Operation_Nemesis: "Operation Nemesis"
 ARM_Operation_Nemesis_desc: "The Armenian government has come together for one purpose alone: to completely liberate the Armenian people from Turkish oppression. In pursuit of this goal, everything else is irrelevant. They have no interest in good governance, no concern for domestic policy or diplomatic relations and other trivial matters. There is no time for distractions. In the face of freedom, everything else must give way. They care not for their own fate hereafter; as long as they can still take revenge, as long as the blood of their families is not yet avenged, any means is justified."
 ARM_Gevork_Vartanyan: "Gevork Vartanyan"
 POLITICS_GEVORK_VARTANYAN_DESC: "Since the end of World War II, the true identity of the Armenian agent 'Anri' has haunted the Turkish military. This codename belonged to the leader of the Sons of Hayk, but most members of the organization knew little more about him than the average person. After decades of planning, the uprising cells rose in Armenia's mountains, forests, and towns, and the real name of 'Anri' was revealed to the public - Gevork Vartanyan.\n\nVartanyan began working for Soviet intelligence at the age of 16, and hundreds of Axis agents fell to him. After Moscow fell, he reorganized his subordinates and informants in the Soviet-Armenian intelligence apparatus into a secret insurgency: the Sons of Hayk. While the Dashnaks chose to let the occupiers know of their existence, the Sons of Hayk strove for absolute secrecy. Though the Armenian people did not know Vartanyan's name, his deeds were known to all. When the veil of mystery was finally lifted, his movement won a wave of support.\n\nThus let both Armenians and Turks know his name! The final struggle has begun, and the liberation of Armenia is within reach!"

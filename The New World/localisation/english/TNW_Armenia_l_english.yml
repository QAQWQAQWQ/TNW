 ARM_Migirdic_Sellefyan: "Mkrtich Shelefyian"
 POLITICS_MIGIRDIC_SELLEFYAN_DESC: "The 'King of Tin Cans' sits upon his throne, but this throne is not built upon grand ancient epics or romantic legends of national liberation; it was merely molded for him by Turkey for its own interests.\n\nMkrtich Shelefyian had once worked to maintain the last Armenian community within Turkey; perhaps in another life, he would have continued this work. Yet as Armenia was drawn into Turkey's sphere of influence, Shelefyian became the best choice to lead his ancestral homeland.\n\nAfter World War II, the situation in Armenia remained turbulent, and Inönü needed someone to manage the region. So a note with a certain name was slipped into the President's hand, and a deal was struck: Shelefyian got his own playground, and Armenia guaranteed it would pose no threat to Turkish interests. The new President was born.\n\nThe Armenian Republican Party led by Shelefyian now rules the country. In name, the Republican Party is a sister party of big brother Turkey; in reality, the party is merely a vehicle for Shelefyian's personal interests, filled with careerists, populists, and a handful of pro-Turkish politicians. For them, elections are merely a formality, but if Armenia wants freedom, it must pay a price..."
 POLITICS_ZAKAR_TARVER_DESC: "Looking back on the history of the Armenian Republican Party, one could well believe it a hopeless monster born of the lust for power. But within the system, there were those like Ruben-Zakar Zakarian who longed for change. Like Shelefyian, he had been a Turkish bureaucrat before entering the highest echelons of the Armenian Republican Party, but the similarities between the two men end there.\n\nZakarian had watched his ideals crumble, powerless. Cooperation between Armenia and Turkey had been hollowed out by corrupt despotism, and the country was in decline. His only consolation was the band of enthusiastic reformists who followed him. They slowly sought opportunities to strike at Shelefyian and his crumbling political patronage. As time passed, he grew acquainted with the Turkish leadership, and a proposal was put on the table.\n\nThe protests in Yerevan brought about the anti-Shelefyian united front, and Ankara ignored Shelefyian's pleas for help. Zakarian now presides over the new friendship between Turkey and Armenia: a friendship born of sincerity, without foolish radicalism or corrupt opportunism. Anti-Turkish sentiment will not vanish overnight, but perhaps peace and freedom will finally heal the wounds of a nation."
 ARM_Hayk_Defiant: "Defiance of Hayk"
 ARM_Hayk_Defiant_desc: "The Republic of Armenia has won its freedom, but at what cost? Beneath the yoke of Turkey and Germany, her lands are partitioned, her people lost and despairing, their one and only homeland now little more than a democratic republic in name.\n\nBut remember: when all had despaired, Hayk slew the tyrant Bel with his arrow; for that reason, the Armenian people must, at any cost, win peace and prosperity for themselves."
 ARM_king_of_tin_cans: "King of Tin Cans"
 ARM_king_of_tin_cans_desc: "Mkrtich Shelefyian is the very embodiment of corruption. His name is always attached to one corruption scandal after another, leading many to wonder how he ever became President of Armenia. The answer is simple: he has close ties with the Turkish government. As long as Shelefyian can deliver a stable Armenia, Ankara is willing to turn a blind eye, even providing campaign donations and assisting his other political operations to undermine the fairness of elections.\n\nUnless legitimacy is restored, Armenia will know no peace."
 ARM_armenian_development_initiative: "Armenian Development Initiative"
 ARM_armenian_development_initiative_desc: "The war destroyed Armenia's cities, and Turkey set up a fund to rebuild Armenia until it could stand on its own. Yet the fruits of the plan have all been pocketed by corrupt politicians and Turkish companies.\n\nUnless Armenians make their own demands of Ankara, prosperity will remain an empty promise."
 ARM_Collaboration_Regime: "Collaboration Regime"
 ARM_Collaboration_Regime_desc: "After decades of successive oppression by the Soviet Union and Turkey, the reformists in Ankara have finally granted Armenia autonomy. Though they have a voice in governance, the local people still resist Turkish rule."
 ARM_sellefyan_replaced_tt: "§LMıgırdıç Şellefyan§! will be §Yreplaced§! with §MZakar Tarver§!."

 FAL_Pearls_covered_in_dust: "Pearls Covered in Dust"
 FAL_Pearls_covered_in_dust_desc: "Algeria, the jewel of North Africa, was never considered by France to be merely a colony. It was incorporated into metropolitan governance, the most deeply developed and invested land in France's overseas empire. In the hearts of the French, there is no place that can replace it — this place gave birth to the exotic treasures of French civilization, and was once the brightest pearl on the colonial crown. Only now, this pearl has long dimmed.

The French listen to their own heartbeat, unwilling to imagine the day when that beautiful rhythm finally stops. It has never stopped, yet they still try to sketch that moment, even if in vain. The dawn is still there, and so is the riot."
 FAL_endless_war: "Endless War"
 FAL_endless_war_desc: "The National Liberation Front — a force that France should have completely buried twenty years ago — has unexpectedly returned from the dead in the 21st century. For the metropolitan government, this is an unacceptable reality. As France's strategic corridor projecting into West Africa, Algeria is an extension on which its survival depends. And so, the North African military command once again raises its butcher's knife, launching purges within its borders. They fantasize that, as twenty years ago, they can make these "worthless" Algerians kneel again with the barrel of a gun.

But they were wrong. Death failed to crush the will. The beacon fire has burned here for four years, and the Algerians' resistance grows ever stronger, while the French government is increasingly drained. The war has broken the treasury, and broken the will. Perhaps this flame will continue to burn, until the last French soldier rolls out of this scorching land."
 FAL_dense_spider_web: "Dense Spider Web"
 FAL_dense_spider_web_desc: "War never attracts soldiers alone. War profiteers, dirty politicians, prostitutes — this war is no exception. Countless people with ulterior motives have set foot on this scorched earth, for fame, for profit, for desire. Military and political celebrities, merchants' sons — circling like vultures, drinking the people's blood on this scarred land to survive.

They weave intricate webs of interest on both sides of every trench. French troops or rebels, friend or foe, here everyone can connect, everyone is trading. And so, on this burning land, the Algerians have become each other's hell — but Algeria has become their paradise."

 FAL_Governor_Palace: "§RAlgerian Civil War§!"
 POLITICS_GOVERNOR_PALACE_DESC: "Algeria — a land once renowned for glory and abundance. Countless French youth traveled far to this land, pouring their hot blood and their lives — those nearly disposable lives driven by the times — into this war. Now, the colonial government can no longer control the situation, and Algeria has fallen into chaos. For the Algerian people, the civil war is like a borrowed flame.

When the fire has burned out, when the anger has subsided — what is left? They bought boat tickets from strangers, personally sending this country onto a great ship called "independence." But where the great ship will sail to is no longer up to them. No ideal in this world is worth exchanging for such a price of ruin. The Algerian people look at the fog before them, and cannot help but ask: if tomorrow never comes, what should we do today?"

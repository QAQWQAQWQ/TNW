 POLITICS_ALEXANDER_MEN_DESC: "Alexander Vladimirovich Men never imagined he would become a pastor to so many people, his flock entrusting their lives to him, Heaven placing a heavy burden upon his shoulders - but he has done it. He is the Holy Father of the North.\n\nIt was not always so. When Men was a small Jewish boy, he was baptized. His father was taken from him at age six, sent to the Gulag on false NKVD charges, which gave the young boy a shared understanding with many people across the world and a fierce hatred of fear and tyranny. In the Soviet Union, despite the dangers of the underground church, Men became a devout Christian - but a non-Orthodox one. Men firmly believed in equality beyond class, gender, race, and even faith, and his ideas were nearly unknown in the church and across the Union.\n\nIn the dark days after the Soviet Union's collapse, Men was in the cold North, comforting struggling peasants, giving them God's love - and if they did not accept God's love, he would give it to them in his own words. He told them he wished to build a land of true freedom for all, a place of equality and mutual aid, a commune and village where everyone could cast off their chains.\n\nHis faith and actions began to gain support in the isolated Siberian lands. At first support grew slowly, then suddenly, the isolated villages of the North began to trust their Holy Father.\n\nToday, the North marches against the chaos that has long corrupted the sacred Motherland. Under the Holy Father's watch, all who suffer shall be saved."
 POLITICS_GURZHAP_OCHIROV_COLLAPSE_DESC: "Gurzhap Vanyushkinovich Ochirov had been breaking the law for as long as he could remember. In his early years, he was little more than a bandit raiding caravans, preying on merchants foolish enough to venture far from civilization. Later, in a moment of desperation, Yagoda recruited him and placed him in command of a Buryat detachment stationed in a remote Aldan village, setting him on a very different path. When the Bolsheviks retook the village, the undisciplined Sudoplatov folded him into his own forces. His commanding officer later defected to Father Men, hoping to unify all of Russia under the theocratic state's banner, but Ochirov was not enthusiastic about the cause - he was loyal only to his homeland, Buryatia.\n\nNow, his commander has betrayed the Father. Ochirov has emerged from the shadows, returning to the town of Aldan and rallying a band of patriots to liberate Buryatia. His rival Gomboev claims to follow the Father's example and build a new future for Buryatia, but Ochirov sees through his lies. He knows Christians are never true friends of the people. He will no longer tolerate foreign occupiers or pathetic collaborators. Ochirov will fight only for a Buryat future, to the death."
 POLITICS_LEONID_CHERNYKH_COLLAPSE_DESC: "Leonid Nikolayevich Chernykh's expedition marks the second time White forces have crossed the Amur into the wildlands of post-Soviet Russia. Yet Chernykh's goals differ greatly from those of his comrades decades ago. He has violated the few principles the Whites once held, choosing to submit to the authority of the Bolshevik Pavel Sudoplatov.\n\nThe Whites were nearly destroyed and exiled once more, a sobering experience. Chernykh therefore debated whether the White movement in Harbin still had any reason to exist. After Alexander Men's theocratic state collapsed, the thinking of the remaining White forces shifted dramatically, and his officers begged Chernykh to march north once more.\n\nYet upon returning to the Far East, Chernykh had clearly realized that the White movement could no longer launch any major military operation. He quickly notified Sudoplatov and the NKVD that his forces were willing to maintain stability in the region in exchange for food and supplies. For him, there was no longer any cause worth sacrificing for. He no longer cared about restoring the Tsar or the dream of the White Russian Army. Chernykh only wished to protect his people from the chaos."
 POLITICS_ZHAMBAL_GOMBOEV_COLLAPSE_DESC: "Zhamba-Dorzhi Gomboev was a Soviet-loyal veteran and a Buddhist, but he never imagined he would one day follow the banner of Christ. When he first entered politics, Yagoda appointed him as the symbolic representative of Buddhists in the Far East - in truth, little more than an NKVD stooge. Perhaps out of loyalty, many of his Buryat countrymen chose to join Sablin's rebellion, but Gomboev remained by Yagoda's side.\n\nWhen news of the Christian peasant uprising in the North arrived, Gomboev rallied his monks against the Father - after all, Buddhists had not forgotten what these Christians had done before. But when the Father destroyed the remaining Bolsheviks, Gomboev was not hated, but forgiven. The Father, wishing to embrace other faiths, restored Gomboev as the chief representative of Russian Buddhists.\n\nAfter the Father's betrayal, Gomboev cleverly deceived Yakunin and Sudoplatov, diverting their attention, hoping to establish a Buddhist state in Buryatia. Yet he was driven from his homeland by the partisan Ochirov. Now he fights for his survival against a man unwilling to compromise."
 POLITICS_NIKOLAY_IVANOVSKY_COLLAPSE_DESC: "The Pacific Fleet was never the Red Navy's most important, but compared to the rusting hulks now abandoned in Kamchatka's harbors, it was once a glorious and formidable force. Nikolay Stepanovich Ivanovsky commands this ghost fleet, sending out his few seaworthy ships to scavenge for plunder in the frozen Arctic waters.\n\nAfter the theocratic state collapsed, the desperate Pavel Sudoplatov urgently sought allies he could rely on. He saw Ivanovsky and the Kamchatka pirate organization as a potential ally, and helped Ivanovsky regain power in Kamchatka in exchange for mutual protection. Yet Sudoplatov did not realize that even Ivanovsky's former Pacific Fleet comrades would not trust him. He had previously been demoted for 'serious violations of military discipline,' which spoke volumes of his moral character.\n\nIvanovsky soon showed his true colors, stabbing his ally in the back without hesitation. He claimed to know nothing of any alliance and said Sudoplatov's forces were also his potential enemies. The admiral held no illusions about restoring normalcy; for Ivanovsky, survival came first, and Communism meant nothing beside it. To survive, the Pacific Fleet must scavenge and plunder everything it can get its hands on, regardless of which nation the victims' ships belonged to."
 POLITICS_PAVEL_SUDOPLATOV_COLLAPSE_DESC: "Pavel Anatolievich Sudoplatov was once a follower of Father Men - or so he claimed. In truth, he honored Men and the Lord with his lips, but his heart was far from them. Neither perceiving, nor listening, nor understanding, he deluded himself into thinking the man leading him was nothing more than a naive idealist who needed to be controlled - and accordingly, he acted.\n\nHoly Mother, how wrong he was.\n\nNow, Sudoplatov is no different from a new Judas. He has betrayed the Father's vision. Though he tries to rebuild, the foundation of everything is built upon sand, collapsing day by day. Sudoplatov cries out to the Lord, 'Do not hide your face, do not forsake your servant in your anger,' but it is useless. From heaven to earth, no help comes. The gaze of the cosmos has turned elsewhere.\n\nEven his followers, those who once worked with him in the NKVD, no longer trust him. Each schemes for himself, using Sudoplatov's meager power to satisfy their own desires. But Pavel Sudoplatov no longer refuses. In his heart, all hope has dimmed. He will not reunite Russia. No, one day he will die, and people will remember him for what he was: a traitor, an assassin, the man who utterly destroyed the sacred mission.\n\nSudoplatov, wracked with guilt, kneels before the tomb of the saint he betrayed. Not a word of defense remains."
 POLITICS_IVAN_NIKISHOV_COLLAPSE_DESC: "Ivan Fyodorovich Nikishov, director of the Kolyma development district, has run out of options.\n\nIn his early years, Nikishov was a minor official in the Dalstroy. When the theocratic state took power in the Far East and Dalstroy was abolished, Sudoplatov sent Nikishov north to oversee the development of impoverished regions. Nikishov thought little of Sudoplatov; he had only one idea: exploit the region just as he had exploited it before.\n\nBut when Nikishov came last time, the people here were kind and isolated. This time, they had stockpiled weapons and launched a brilliant raid, effortlessly seizing the foundation and materials of Nikishov's illegal rule without a single casualty. The despair brought on by Sudoplatov's reckless treatment of the Holy Father had not dimmed the Christian fervor they showed toward 'oppressors' like Nikishov.\n\nNikishov dared not speak aloud, but he knew full well his situation. Though the brotherhood Alexander Men had personally organized, where all were as brothers and sisters, was gone - destroyed by a brilliant but bungling spymaster - its influence, the aspiration to strive for a better future, was branded into the hearts of the Far Eastern people. Its most direct consequence now may be the collapse of Nikishov's government."
 POLITICS_GLEB_YAKUNIN_COLLAPSE_DESC: "Gleb Pavlovich Yakunin has spent most of his life on the run. As a young man, his family fled Moscow for Irkutsk ahead of the German advance. After Yagoda took charge of the Directorate, Yakunin and his mentor Alexander Men disappeared into the forests to escape the NKVD's manhunt and torture. He found temporary refuge among the faithful in the distant North, but Men's sacred mission drove him onward.\n\nNow, Father Yakunin is on the road once more, sincerely hoping it is the last time. He barely knows how he alone evaded Sudoplatov's thugs - only God could have saved him. He has arrived in Magadan, where the last faithful followers of Men's great cause cluster around him. He leads them, preaching to the faithful that hope still remains.\n\nBut the words ring hollow. Father Yakunin is no Father Men. He lacks Men's vision and his willingness to innovate on doctrine. His interpretation of Orthodox faith resembles that of the Tsarist church - sin has brought God's wrath upon the people. No matter how eloquently Father Yakunin speaks, he cannot unite the Motherland. To the world, he is but a sad reminder of the movement that could have saved Russia's soul."
 POLITICS_VLADIMIR_KUROEDOV_COLLAPSE_DESC: "After the theocratic state dissolved, Vladimir Alexeyevich Kuroyedov was chosen by Sudoplatov to lead the First Legion. The desperate Sudoplatov hoped Kuroyedov's religious background would help him calm the local populace and win their support.\n\nThat is not how things turned out. Instead, the old general's behavior grew increasingly eccentric. He now seemed less a general, a church administrator, or anything people expected of him, and more a sinister, fanatical priest. He began quoting Scripture and the Church Fathers as though he were the Second Coming of Men. Though few would believe his superficial religious posturing, his intentions were clear as day.\n\nOrder in the Far East has become a distant memory, and Kuroyedov has increasingly resisted following reports from the Amur. Everyone knows that the Defense Committee's greatest challenger lurks right beside them, watching."

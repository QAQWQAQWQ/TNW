 POLITICS_MIRSAID_SULTANGALIYEV_DESC: "If anyone in all of Central Asia today can represent the pain and contradictions this land has endured for decades, it is Mirsaid Sultan-Galiev.`n`nBorn in Bashkortostan, the most Russified region of Eurasia, Mirsaid was among the first to embrace Russian revolutionary thought, seeing in the revolution the dawn of liberation from Tsarist oppression of minorities and Islam, and a path for these peoples to organize themselves. His experiences in Baku during the 1910s and early 1920s pushed him further down the Bolshevik road; when the revolution demanded blood, he showed extraordinary talent, using his deep insight into Central Asian national movements to devastate the White Army, earning Vladimir Lenin's trust in the process.`n`nAs a representative of Turkic peoples and Muslim masses within the Soviet system, his steady rise through the ranks seemed inevitable — but that promotion never materialized. The Party always suspected his tolerance for local nationalism and religion, and Mirsaid ultimately found himself confined to the periphery of Central Asian power, spending his career improving local conditions but never reaching the decision-making core.`n`nIt was not until Nazi war machines crushed the old Soviet system that the frontier republics struggled to survive in a chaotic power vacuum. Now, the old man standing in the storm has become a symbol of Turkic unity — he still holds to the ultimate ideals of Marxism-Leninism, but he intends to reshape them into ideas that truly serve the people, not the tyrants of Moscow."
 POLITICS_ZIYAUDDIN_BABAKHAN_DESC: "Another outstanding Turkic Islamic scholar emerged from the school of Ahmad Yasavi. Ziyauddin Khan Babakhan was born in Tashkent, Uzbekistan, steeped in faith from childhood. Early on he followed in his father's footsteps, studying under Shami Domla, who deeply influenced his theological thought and political outlook. During World War II, Kalinin approved the request of Uzbek and Turkmen imams to establish the Religious Administration of Muslims of Central Asia and Kazakhstan, and his life path turned sharply from that point — no longer confined to theology alone, he entered the political stage. Though his father was the nominal head of the organization, as secretary, Ziyauddin Khan bore the full administrative burden.`n`nThis leader held Islamic doctrine in one hand and Marxism in the other, vowing to fairly protect the faithful of his homeland. From clerical training and charitable administration to publication of religious texts, all duties rested with the institution he led. As the Soviet Union suffered defeat after defeat and ultimately disintegrated, Central Asian people increasingly turned to faith for truth and solace, and at this critical moment he took on the role of guide and protector. Even after the fighting ended, Ziyauddin Khan continued firmly on this path.`n`nNow he has traveled far, continuing to run the spiritual administration in the stable environment of Turkmenistan; he and this institution symbolize the continuity of the old Soviet order. Through upheaval and transformation, the dual spirit of Marxism and Islam still thrives within him — through his unique interpretation of Islamic law, while socialist thought opens a new path toward stability and justice for a world so often in crisis."

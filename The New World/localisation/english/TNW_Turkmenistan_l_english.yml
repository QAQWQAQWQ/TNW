 TRK_Fragmented_Tribes: "Fragmented Tribes"
 TRK_Fragmented_Tribes_desc: "The social and political structure of Turkmenistan is almost entirely composed of the Turkmen tribes living within its borders. Politically, they are the foundation of Poda's support, but also the biggest obstacle to some of his reforms.`n`nThe tribes do not want to change their ways or support Turkmenistan's development. Finding a way to influence them without losing their confidence is one of the most pressing problems facing this young nation."
 TRK_Question_Of_Identity: "Question of Identity"
 TRK_Question_Of_Identity_desc: "Turkmenistan is a state, but not yet a nation. In truth, what remains is the wreckage of a much larger, completely destroyed country — the Soviet Union. This leaves Turkmenistan in a strange limbo, without an identity of its own.`n`nWhat makes a Turkmen? Is it the land beneath our feet? The tribe we claim as our own? These are questions that must be answered sooner or later, and the ability of the nation to unite and act as one depends on them."
 TRK_A_Modern_Silk_Road: "Modern Silk Road"
 TRK_A_Modern_Silk_Road_desc: "History repeats itself in interesting ways. In ancient times, the Silk Road was the great trade route through Central Asia, connecting the Far East and the Far West of the ancient world. Thus, now as before, Turkmenistan finds itself at the center of the new Silk Road.`n`nCompared to other Central Asian states and northwestern China, Turkmenistan is a relatively stable beacon; though it may seem harsh, this has drawn people seeking refuge and opportunity to our doorstep, and welcoming them with open arms has served us well."
 POLITICS_PODA_ANNAORAZOV_DESC: "The Turkmen revolution did not end with the fall of the Soviet Union; the Soviet Union and the cause it represented remain the unwavering faith of the Turkmen people. However, when Iran invaded Turkmenistan as the USSR collapsed, Russian bureaucrats and administrators abandoned the Turkmen people and fled home in haste. The task of defending Turkmenistan thus fell to a physician, a protector — Poda Annaorazov, a true-born Turkmen.`n`nLeading a ragtag force of Turkmen tribesmen, Soviet partisans, friends, and allies, Poda not only repelled the Iranian invasion but also drove out the Afghans who had invaded simultaneously. The hero of Samarkand won such renown across the nation that he was naturally nominated as Chairman of Turkmenistan. Yet governing a country is far harder than defeating an enemy on the battlefield. After the war ended, Poda endured years more miserable than any battle or wound, and this life weighed heavily on him.`n`nPoda does his best to rule Turkmenistan, but he is no administrator at heart. Though he believes firmly in Bukharinism, he sometimes finds himself led by the advisers, ministers, generals, allies, and bureaucrats around him. Some among them share his Bukharinist convictions, while others — though they respect him, and he respects them in turn — support ideas diametrically opposed to the Bukharinist principles he advocates. As time passes, their attitudes grow ever murkier. Sometimes, this life makes him wish he could return to the front lines once more."

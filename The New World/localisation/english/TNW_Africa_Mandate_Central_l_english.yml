 OFN_COG_the_abrams_plan_decisions: "The Abrams Plan"
 OFN_COG_the_abrams_plan_decisions_desc: "





The German colonial administration relied on a German oligarchic elite to meet its economic needs. But with the fall of the Reichskommissariat, these oligarchs fled Central Africa, leaving behind valuable assets just to escape arrest by our forces. For these ownerless lands, General Abrams has devised a clever solution: simply seize these owned or unowned lands directly, and repurpose the plantations, mines, and factories upon them."
 OFN_COG_seize_german_assets: "Seize German Assets"
 OFN_COG_seize_german_assets_desc: ""

 COG_OFN_Legacy_Zentralafrikaner_System_1: "Legacy of the Zentralafrikaner System"
 COG_OFN_Legacy_Zentralafrikaner_System_2: "Legacy of the Zentralafrikaner System"
 COG_OFN_Legacy_Zentralafrikaner_System_1_desc: "Under Muller's lax, profit-driven rule, Congo gradually became a lawless land. Though General Abrams has tried to restore some order, little has obviously changed. Bars in Leopoldville are full of idle mercenaries and unemployed collaborationist agents still looking to cut a good deal with the authorities; Abrams believes stabilization funds should be used to hire them to help administer. The old ways work best."
 COG_OFN_Legacy_Zentralafrikaner_System_2_desc: "Under Muller's lax, profit-driven rule, Congo gradually became a lawless land. Though General Abrams has tried to restore some order, little has obviously changed. Bars in Leopoldville are full of idle mercenaries and unemployed collaborationist agents still looking to cut a good deal with the authorities; Abrams believes stabilization funds should be used to hire them to help administer. The old ways work best."
 COG_OFN_Unhappy_Investors_1: "Unhappy Investors"
 COG_OFN_Unhappy_Investors_1_desc: "Nothing kills market confidence like instability; when the war began, any investor savvy enough pulled their money out of Africa. Now they are ready to come back, demanding the authorities cut them back in. Unfortunately, if we want our economy to look like that of a normal country, we have to deal with them, which forces us to roll back some of the rules we tried to implement and give them as much discretion as Muller did."
 COG_OFN_Unhappy_Investors_2: "Unhappy Investors"
 COG_OFN_Unhappy_Investors_2_desc: "Nothing kills market confidence like instability; when the war began, any investor savvy enough pulled their money out of Africa. Now they are ready to come back, demanding the authorities cut them back in. Unfortunately, if we want our economy to look like that of a normal country, we have to deal with them, which forces us to roll back some of the rules we tried to implement and give them as much discretion as Muller did."

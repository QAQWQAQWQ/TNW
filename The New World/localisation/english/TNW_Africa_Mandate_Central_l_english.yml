l_english:
 COG_USA_central_african_developments: "Central African Developments"
 COG_USA_central_african_developments_desc: "The Central African administration must maintain a steady balance between generating capital for domestic investors and preserving stability within its borders.

The OFN Mandate in Africa was established to help African peoples fully throw off German rule, with the ultimate goal of transition to sovereign, self-determining nation-states after an interim period.

If we successfully complete the decolonization plan, we can bring back §O80%§! of the resources we produce here.

If we rush decolonization before conditions are ripe, we will bring back only §O40%§! of the resources we produce here.

If the mandate collapses through our mismanagement, we will be forced to §Rabandon§! all resources produced locally."
 POLITICS_CREIGHTON_ABRAMS_DESC: "Years ago, Creighton Abrams won his reputation on the battlefields of England. Now, behind the final victory over the Nazi regime in Africa, he sees only contempt and hatred. The wildfire of conventional war has become a slow-burning insurgency, and General Abrams now sits in the hot seat, tasked with crushing the rebellion and deciding Congo's political future.

During Abrams' tenure, the German officials remaining in the Congo administration noted that this was less a change than a continuation of Muller's regime. Though paying lip service to winning hearts and minds, Abrams still treats Congo's corporations lightly, and locals still struggle to survive in a war-torn country. The fires in Washington have already spread, with accusations of massacres his troops committed during the Namibian offensive, and under immense economic pressure, Abrams continues to let the corporations run free here.

Abrams has changed much since the disastrous campaign in Britain. This war has no glory; any victory is but a paltry consolation for the thousands of lives lost. Newspapers back home roar that the boys must come home, and before the inevitable withdrawal, General Abrams must decide how best to leave America's mark on this land."
 POLITICS_COG_COLLAPSED_AUTHORITY_DESC: "The OFN has failed, America has failed. Most of all, Creighton Abrams has failed. What began as an experiment carrying democracy into the sub-Saharan swamps and humid jungles, full of hope, has become a bitter and disheartening failure. Everything Abrams and his men did, every crime they committed, was done in sincere hope of bringing a bright future to Africa. The rosy filter of optimism has shattered, leaving only the naked truth. Oh Liberty, what crimes are committed in thy name?

Radio silence falls over Africa, an impenetrable shield of America's former rule. Whites flee to helicopters and safety, heedless of the hellscape behind them. The death toll is unknown, far beyond what anyone imagined. War, plague, famine, and death spread through the country, cackling and screaming as men, families, and nations take up arms to defend themselves from everything else.

One by one, the lights of Congo are going out. The chance of relighting them is slim. In the coming months, thousands of Senate hearings and committees will convene only to ask why the OFN could not tame Muller's legacy. Inside and outside government, hundreds of fierce debates will pin down why the OFN mandate failed. What could they have done? Why did all this happen? Who is to blame? It no longer matters. When future presidents, chairmen, and Fuehrers wage their final struggle for the power to rule the world, only one thing matters.

Who will bury the dead?"
 COG_germans_mood_loc_5: "§HInsurgency§!"
 COG_germans_mood_loc_0: "§GVery Satisfied§!"
 COG_germans_mood_loc_1: "§GSatisfied§!"
 COG_germans_mood_loc_2: "§gNeutral§!"
 COG_germans_mood_loc_3: "§RDiscontented§!"
 COG_germans_mood_loc_4: "§RVery Discontented§!"
 OFN_COG_under_new_management: "Under New Management"
 OFN_COG_under_new_management_desc: "We have at last overthrown the brutal regime Siegfried Muller and his Nazi lackeys used to oppress Africa. The mandate established spans the vast Congo Basin, and it falls to us to manage its countless peoples, factions, and corporations. Ruling this vast territory is a great challenge, but one worth taking. The extractive industry made the Central African Reichskommissariat far richer than the other Nazi colonies, and this wealth should serve the cause of freedom, not a tyrant's pleasure.

The task we have taken on is no light one. First we must defeat the remaining resistance and extend government authority across the entire mandate. Second, we must install native leaders who can show Congolese that cooperation with us means a bright and prosperous future. Beyond that, we must persuade the remaining Belgians and Germans, and the powerful corporations they control, that compliance is the only choice. Once we have secured our rule, we can end the decades of terror and inhuman brutality of Nazi rule."
 OFN_COG_the_central_african_administration: "The Central African Administration"
 OFN_COG_the_central_african_administration_desc: "Running a government and commanding a battle are two different things. The German regime left us nothing useful when it departed, and so far we have only found our feet and gained a rough understanding of the situation. The first lesson we learned here is the endless, tedious, repetitive administrative drudgery of day after day. As days pass, ad-hoc measures created to handle yesterday's problems eat up more and more time, creating yet more government headaches. Clearly we must formally establish a more efficient institution to handle this.

For now, we have not won the firm support of the local population, and many natives are still tainted by association with the old regime. So far, our ability to vet and recruit suitable candidates is lacking, and the pool of talent we can draw on is limited. We will absorb Congolese who are known and trusted, but until the next phase, the heavy burden of administration will fall on our own NCOs."
 OFN_COG_invite_german_sympathisers: "Invite German Sympathisers"
 OFN_COG_invite_german_sympathisers_desc: "Within the Nazi empire, Central Africa was known as a "haven of freedom." What drew Germans here was not service to Germany, but escape from the terror of the Nazi Party, and the rich employment opportunities in Central Africa where one could make a fortune.

Though Siegfried Muller largely ignored the administration of Central Africa, he did hire a corps of Germans for the government, and most of them remain in the mandate. They still have connections across Congo and understand local affairs better than we do; leaving these people to their own devices is dangerous. If they decide to resist us, they will be a thorny problem. We must not let it come to that.

We must convince them that supporting us is the best choice. To do that, we must first absorb those willing to work with the government, bringing them into the lower ranks, showing that Germans still have a place in Congolese affairs. They will become local bureaucrats and aides, and their rich experience and knowledge of local affairs will greatly help the mandate maintain its rule."
 OFN_COG_a_deal_with_steiner: "A Deal with Steiner"
 OFN_COG_a_deal_with_steiner_desc: "Rolf Steiner is a respectable soldier who proved himself a dangerous opponent during the South African War. Steiner served in Muller's government, and ordinarily would not qualify for service in ours. But current intelligence shows this is a good time to win him over. He is a soldier's soldier and disliked his de facto role running the whole Reichskommissariat. Muller dumped one crisis after another on him with no proper solutions, which left him resentful and willing to serve a different master. Since the end of the South African War, the CIA has been tracking him, and he is open to the security prospects the CIA offers.

With nothing more than an amnesty and a proper salary, Steiner will become a major asset to our government. Through Steiner and his long list of contacts, we can make contact with the powerful mercenary companies the Reichskommissariat employed. Their over a decade of operating experience in Central Africa and insider knowledge of the previous regime will both be valuable resources in our hands."
 OFN_COG_gain_from_the_german_expertise: "Gain from German Expertise"
 OFN_COG_gain_from_the_german_expertise_desc: "The limited cooperation we have reached with German remnants has confirmed that they indeed have a deep understanding of everything happening in this territory. By comparison, it exposes the limits of our own government's insight.

If we want results in Congo, the first step is closing this information gap. Only by fully understanding the players and activities in Central Africa's economy and administration can we hope to stabilize the territory and make it work for us.

The fastest way to gain this knowledge now is of course to make more use of the Germans in the government, fully embracing those German remnants who are friendly to us. We have already gauged their numbers; by placing these knowledgeable administrators and bureaucrats in office, we can maximize the benefit of their experience."
 OFN_COG_keep_it_american: "Keep It American"
 OFN_COG_keep_it_american_desc: "Competing corporate cartels and mercenary groups made Nazi Central Africa chaotic. A profitable environment allowed adventurers and the unscrupulous to thrive, but it did not let the country as a whole prosper or stabilize. If we default to continuing the German-built system, this will continue.

But we will not. We will break with the old system. The new regime will be built from the ground up by trustworthy, upstanding American citizens, aided by reliable local helpers. Breaking with the old system will show the people of Africa that we truly mean to bring change to Africa, ensuring that the fruits of our workers' labor are not stolen by corrupt bureaucrats and greedy corporations. Congo's wealth should, naturally, be shared between America and the natives."
 OFN_COG_the_central_african_consortium: "The Central African Consortium"
 OFN_COG_the_central_african_consortium_desc: "Though Central Africa nominally belonged to Germany and suffered the same embargo, everyone knew it was effectively a free city open to all. Investor groups from around the world informally shared the fruits of its extractive economy, laying a solid foundation for the regional economy.

General Abrams proposes replicating this successful model, building upon it a formal economic institution called the "Central African Consortium." The consortium will include investors from across the OFN and Central Africa, becoming a welcome source of capital, knowledge, and new technology within the mandate. If it can successfully rebuild Congo's mines, plantations, and oil wells to modern output standards, it will bring enormous returns to both the consortium and Central Africa's emerging economy."
 OFN_COG_special_status_for_the_dam: "Special Status for the Dam"
 OFN_COG_special_status_for_the_dam_desc: "The Congo Dam is a marvel of architecture and engineering, but also a headache for its builders. The German government poured vast sums into maintaining its massive structure yet never exploited its hydroelectric potential. If we are to unlock the mandate's economic potential, we must exploit that potential.

Beyond power generation, the dam is also a vital piece of our infrastructure. As Central Africa's shipping link, it connects Lake Congo to the Congo River. That also means it is Central Africa's greatest weakness; if the dam is seized or fails through mismanagement, it would cause cataclysmic flooding.

This makes the dam especially important. We cannot risk leaving it in the hands of untrustworthy local leaders; instead it should be controlled by capable hands in the mandate government, who can maintain its structural safety. We will follow the Panama Canal model, establishing a "Congo Dam Zone" to formalize this arrangement, ensuring OFN's future administrative control of Central Africa."
 OFN_COG_for_american_interests: "For American Interests"
 OFN_COG_for_american_interests_desc: "The mandate's mission is to maintain international peace and security on the African continent. In truth, if not for OFN's dominant position in Africa, we could not maintain the status quo. If we leave the natives to their own devices, they will settle old scores and fight for power, and unending border wars and tribal conflicts will consume the continent.

Promoting native development, involving them in government, and building self-sufficient national systems - these are the right things to focus on, and they are appreciated back home in America. But in the end, that is not the mandate's mission. What we should do is hold power firmly, pour in endless funds, and maintain stability. That is our primary goal."
 OFN_COG_assess_the_situation: "Assess the Situation"
 OFN_COG_assess_the_situation_desc: "The more we learn about Muller's regime, the more amazed we are that it functioned in any form. No department of the Central African government documented its methods on paper at all, in stark contrast to the meticulous record-keeping of Germany and its other vassal states. Part of this is due to Muller's famous "hands-off" style of governance, but we have reason to believe it was because most people wanted it that way. We have already uncovered extensive fraud in Central Africa, so everyone wanted to hide their tracks.

Whatever the reason, the lack of records means far more work than expected. We still need to build working files for the vast territory under the mandate, its countless corporations, tribes, and other groups. After all, the previous regime left us nothing."
 OFN_COG_books_studying: "Hit the Books"
 OFN_COG_books_studying_desc: "Though the administration was riddled with holes, Central Africa at least maintained a functioning economy. Official propaganda glossed it as the product of Germany's superior administration, but we all know Central Africa's economy was largely unmanaged. In fact, its extractive economy and status as a German gateway made Central Africa a haven for foreign investors.

We have begun poring over the archives left by the old regime; though Muller left few, we have uncovered detailed accounts of massive deals between Central Africa and foreign corporations. Perhaps we should examine these deals, investments, contracts, and practices to understand how they made Central Africa's economy produce so much wealth."
 OFN_COG_archive_mining: "Archive Mining"
 OFN_COG_archive_mining_desc: "The Central African government did not interfere in the daily operations of most of its territory, instead devolving power to local groups to govern themselves. Tribal kingdoms, corporate concessions, and colonial "trust territories" - these Belgian colonial remnants are scattered across Central Africa. They are used to operating without oversight, handling local affairs themselves. This decentralized rule may have been the key to the leaky Muller government keeping the economy running, and we should be careful not to disrupt the existing system.

Before overturning the old system, we need to understand its connection to Central Africa's economy and how it works. To replicate the success of Muller's system, we need to understand as much as possible how it functioned, digging deep into the archives and accounts left by the old regime. Even if these records are incomplete in some respects, on the whole they still hold lessons worth learning."
 OFN_COG_keep_a_working_system: "Keep the System Running"
 OFN_COG_keep_a_working_system_desc: "Central Africa has a vast territory and countless conflicting tribes and interest groups. Keeping it united and prosperous is no easy task, and the so-called "Central African System" seems to do just that. For now, most of the Germans, Belgians, and tribal chiefs who keep the system running are willing to work with us. Banning corporate concessions, dissolving trust territories and tribal kingdoms would only turn these people against us.

We certainly will not be as passive as Muller's regime, but we will maintain the decentralized system. We should focus our energy on cracking down on the black market and rooting out corruption, rather than confronting local leaders. We need to fight crime, not point our guns at the people. That is how we keep Central Africa running, and keep peace and prosperity."
 OFN_COG_meet_the_belgians: "Meet the Belgians"
 OFN_COG_meet_the_belgians_desc: "Compared to the Germans, the Belgians have more say in Central Africa's economy and administration. They have been here since Belgian colonization of the Congo eighty years ago, controlling the mines and plantations in the south. Thus the Belgians have unmatched influence in southern Congo. We need to show these people the benefits of cooperation and bring both sides together.

The Belgian closest to a leader is undoubtedly Jean Schramme. He is both an outstanding planter and a notorious commando. Making friends with him will benefit the new regime. We will arrange a meeting between Abrams and Schramme, hoping they can reach an agreement that keeps the south peaceful."
 OFN_COG_the_belgian_proposal: "The Belgian Proposal"
 OFN_COG_the_belgian_proposal_desc: "The Belgians, represented by Jean Schramme, have put forward an ambitious plan for Congo's future. Central Africa's extractive economy is highly profitable but vulnerable to economic shocks. It is also heavily dependent on foreign refineries and processing facilities. To overcome these weaknesses, we will implement the "Belgian Plan," injecting massive investment into building a state-owned resource processing industry.

Schramme describes this as the natural development of Congo's economy. The new factories and processing plants will use hydroelectric power from the Congo Dam. Low wages for Congolese labor mean the salaries we pay will be far above local standards. This will not only benefit local workers in the factories but also undercut foreign competitors. The support of wealthy Belgian businessmen also means the government need not bear the cost.

Schramme says all the Belgians ask is that their efforts not be hindered by the corruption and inefficient management visible throughout our territory. It seems the Belgians will only cooperate if they are further brought into the government."
 OFN_COG_from_the_ground_up: "From the Ground Up"
 OFN_COG_from_the_ground_up_desc: "The Central African System is riddled with non-governmental rule, rampant black markets, smuggling, lawlessness, corruption, and crime - a complete mess. Though the system kept the economy running to some degree, its success was built on ignoring crime and Germany's economic back doors. We cannot replicate the quality of German products, nor will we ignore crime on our doorstep.

We cannot copy the Central African System, which could not last; we must build our own administration from the ground up. Under the supervision of loyal NCOs in the officer corps, the new regime will build the transparent, accountable government Central Africa so desperately needs. As for how to build it, General Abrams happens to have some excellent ideas."
 OFN_COG_jumpstart_the_economy: "Jumpstart the Economy"
 OFN_COG_jumpstart_the_economy_desc: "We conquered Central Africa, and in doing so destroyed its previously profitable economy. Fighting destroyed the only infrastructure Central Africa had, badly hitting supply lines. Furthermore, many prominent investors and administrators were closely tied to the old regime, running an underground economy that relied on "favors" to stay hidden. When Siegfried Muller fled north, many of them fled with him.

We need to get the economy back to its previous level quickly. A functioning economy will boost the government's legitimacy and earn the funds to expand government. We lack investors, but investment is essential, so General Abrams will do everything he can to attract it. The current government's priority is to raise funds at any cost to jumpstart the economy."
 OFN_COG_the_abrams_plan: "The Abrams Plan"
 OFN_COG_the_abrams_plan_desc: "The regime grows more stable; though a few facilities remain shut down, most of the mines, plantations, and factories in the mandate are operating again. Concerned about their own security in the new Congo, owners of facilities closely tied to Muller abandoned and shut them down, letting them rot and rust.

We will not let valuable economic foundations decay. If the previous owners will not reopen them, we will find someone who will. Under the new "Abrams Plan," we will build a framework in which every commercial establishment must report its activities to the government or be forcibly seized. We will select reliable, highly skilled American companies and distribute the seized properties to them. Putting these properties in capable hands offers hope of reviving commerce and revitalizing the economy."
 OFN_COG_promote_african_ventures: "Promote African Ventures"
 OFN_COG_promote_african_ventures_desc: "The main obstacle to attracting investment to Congo is a lack of information. Investors involved in Central Africa's underground economy worry about excessive government interference. Potential investors across the OFN either do not know of the vast wealth hidden in Central Africa, or do not know the great progress we have recently made in improving the business environment.

General Abrams will launch a far-reaching propaganda campaign to change investor perceptions. We will assure past investors that we will not impose unnecessary burdens on their businesses. At the same time, we will use the slogan "safe resource extraction under American oversight" to attract new investors. As long as investors know Central Africa is still the open commercial paradise it was, the economy will surely recover!"
 OFN_COG_open_up_the_lake: "Open Up the Lake"
 OFN_COG_open_up_the_lake_desc: "Lake Congo lies at the geographic center of the mandate and is the economic heart of the entire country. Though a symbol of German arrogance, it failed to achieve most of what the Germans hoped. The only visible benefit of the project was probably opening a shipping route from the Congolese interior to the coast. The active shipping industry let the Germans seize the opportunity to build it into the foundation of Central Africa's infrastructure.

So far, the current government's shipping needs and Central Africa's overall security posture have led us to close most shipping routes on Lake Congo. Now that Central Africa is calm, we should prepare to reopen shipping. From now on, we will no longer restrict commercial activity on the lake, letting ships pass and keeping transport flowing. As goods and people move freely once more, every aspect of the national economy will feel the benefit."
 OFN_COG_our_friends_at_standard_oil: "Our Friends at Standard Oil"
 OFN_COG_our_friends_at_standard_oil_desc: "When it comes to natural resources, we have far more than the other mandates, and oil is no exception. Unfortunately, Central Africa's oil resources have not been fully developed; only a fraction of the total has been extracted. To develop the oil industry, we need both massive investment and the relevant technology. We are in luck: Standard Oil, as an old, established American company, naturally has both technology and money.

Cabinda, once an Angolan exclave, is now under our jurisdiction. It has both enormous oil reserves and the advantage of being near the coast. If we invite Standard Oil to operate in Cabinda, oil will flow soon enough."
 OFN_COG_create_administrative_divisions: "Create Administrative Divisions"
 OFN_COG_create_administrative_divisions_desc: "The Central African Reichskommissariat operated like a colony, with a central government detached from the grassroots; local strongmen, tribal chiefs, and ruthless companies built their own fiefdoms across the territory. We have been forced to inherit this informal local rule, which seriously weakens the mandate's government. Clearly, we need to create administrative divisions for Congo.

Of course, before we establish local governments, we must decide which divisions to create. Abrams has tasked Patrice Lumumba, the mandate's strongest native ally in Central Africa, with this job. It is both a vote of confidence and a recognition of his administrative ability."
 OFN_COG_stratified_administration: "Stratified Administration"
 OFN_COG_stratified_administration_desc: "The biggest problem with Muller's government was that it was essentially a figurehead. Nominally, the territory should have been governed by his military. In reality, they preferred hunting big game to maintaining colonial stability. If Abrams wants Central Africa to prosper, he must first solve this predicament.

We should establish stratified administration in Central Africa. At the top, the military junta handles military affairs, while civil administration is handed to local native leaders. Over time, we will transfer more power to local governments. This will ensure the new republics are capable of handling the challenges that come with independence."
 OFN_COG_reward_loyalty: "Reward Loyalty"
 OFN_COG_reward_loyalty_desc: "If anyone tells you the Central African mandate is in a bind right now, I've got something to say about that - that's bullshit. The mandate government is full of gloomy bureaucrats, worn-out clerks, and a bunch of redneck gun-thugs, just like a garbage heap. We call this the "military command" because every last person with a working brain has fucked off out of this "African hellhole."

What we need is dedication, people who will work their asses off. Since these losers can't get anything done, let's invite some natives into the government. They're desperate to rebuild their homeland and win real freedom, so why not let them in? It'll make everyone happy and speed things up."
 OFN_COG_figure_out_the_natives: "Figure Out the Natives"
 OFN_COG_figure_out_the_natives_desc: "What the hell is going on?

Good question. I think everyone here wants to know who the people lurking in the steaming swamps are, and who they answer to. Granted, things aren't as bad as the insurgency Westmoreland is facing next door, but not every native is going to spontaneously sing the praises of Uncle Sam's boys.

We need to get a handle on the current situation, send out scouts to map it out, and figure out every native tribe squatting around Lake Congo. It's a pain in the ass, but it'll advance the mandate's mission, so let's do it."
 OFN_COG_meet_kasa_vubu: "Meet Kasa-Vubu"
 OFN_COG_meet_kasa_vubu_desc: "What was that bastard's name again? Kasa...wubaroo? Whatever. The guy's real popular with the natives and gets along fine with Lumumba. The important thing is, he's on our side, not mixed up with those terrorists calling themselves "freedom fighters."

I'm glad everyone sees who the real freedom fighters are; too bad some native bastards just won't open their eyes, biting us and never letting go. I'll go meet Kasa-Vubu, hoping to reach an agreement with these guys. Uh, what did they call themselves again? Congolese...National Convention? Right, that's it.

If talking isn't enough to make them obey the government, we'll make some deals and promises; after all, we're not unreasonable people."
 OFN_COG_meet_mba: "Meet Mba"
 OFN_COG_meet_mba_desc: "What? Mmumba? Is that even a fucking name? Forget it.

He's from the old French territories, and that matters. If I remember right, Gabon? Yeah, he's sort of a local leader there, widely trusted, a real patriot among the locals. Whatever they call him, the point is this bastard won't shut up about wanting independence. Of course he wants that; he even wants to build a future for his people free from American interference.

Did he forget who rescued him? Damn it, we're his saviors, and after everything we've done we don't deserve a little payback? Fine, fine, we can't be too rigid. Even if his thinking has gone off the rails, I'm sure we can reach an agreement with this little helper."
 OFN_COG_the_cameroonian_issue: "The Cameroonian Issue"
 OFN_COG_the_cameroonian_issue_desc: "For over a decade, Cameroonian President Felix-Roland Moumie has been a thorn in Germany's side. Now it's our turn to deal with him. The pan-Africanist subversives once fought French and German colonial rule in Africa; now they have set their sights on the OFN mandate. Pan-Africanism's dangerous propaganda will undermine our hard work and seriously destabilize Central Africa. We need to figure out how to handle this.

The government is drafting a plan to deal with Moumie, including various diplomatic responses. We can try to persuade him that we too care about the cause of Central African independence. Or, more simply, we can directly cut his influence within the mandate. If all goes well, we can resolve this without resorting to force."
 OFN_COG_call_mobutu: "Get Mobutu on the Line"
 OFN_COG_call_mobutu_desc: "If you want a laugh, look at Muller's SS. Who knows where these guys got the balls to use butcher squads full of natives to slaughter other natives?

Anyway, the result of Muller's doing is that a native SS general under him named "Mobutu" stole the SS during his posting. We...pardoned Mobutu. Instead of fighting him, we'd rather use his influence to help the mandate rule. We need to get back to good old-fashioned American diplomacy... not this.

Look, that guy's pardon still holds... but he has to work for us, go after those damn agitators in Cameroon. That makes it fair."
 OFN_COG_prepare_the_ground: "Prepare the Ground"
 OFN_COG_prepare_the_ground_desc: "That yellow-bellied bastard! Savage nigger scum! Mobutu dares refuse our generosity, and he's actually rounding up his gang to rise up? Then let him taste American freedom!

He's right up there, rallying his people in the north to die for freedom. Get the Army boys ready, fire up the Air Force - it's time to fight for freedom again! Shoot these bastards down so they can never defy us again!"
 OFN_COG_the_leopoldville_committee: "The Leopoldville Committee"
 OFN_COG_the_leopoldville_committee_desc: "Rumor has it that certain people across the border are attacking the legitimacy of the Central African government. Exaggerating certain "war crimes" just to stir up local resistance. Those bastards in Cameroon are challenging everything we're about to build!

Just because a few of our boys got a little carried away, we're suddenly Nazis? These people need a lesson. We'll assemble some experienced colleagues, some commanders well-versed in... punitive operations. We'll shut these agitators up; we will not let them undermine the American New Order."
 OFN_COG_crackdown_on_the_revolutionaries: "Crush the Revolution"
 OFN_COG_crackdown_on_the_revolutionaries_desc: "These fucking terrorist thug rebels dare oppose us under the banner of freedom, and even after tasting the American fire-baptism of liberation, they still won't lay down their arms.

We don't have proof yet, but you can bet those Cameroonian bastards are supplying the rebels with guns, supplies, and medicines for internal and external use. This is no longer just a bone stuck in our throat; the whole Congo situation is spiraling in a direction that will destroy everything we've worked for. This mess of swamps, jungles, and lakes we call "Congo" is completely unsuited for large-scale conventional warfare. When push comes to shove, we're fucked.

We need to get on with today's business: thoroughly conquer Central Africa's jungles and bring order back to this wild land."
 OFN_COG_restore_order_in_congo: "Restore Order in Congo"
 OFN_COG_restore_order_in_congo_desc: "If you want me to say something now, I'll say "goddamn." Every American trapped in Central Africa realizes that Congo is a fucking bottomless pit, and everyone just wants to get the hell out. Yeah, the duty is harsh and endless, but we have to do it.

Congo is a goddamned sewer full of filthy rats. They squirm beneath our feet, gnawing at the freedom we gave them. To ride a roughneck, you first have to break his back - that's the lesson I've learned from this hot, fierce Congolese insurgency. Yeah, a bright future will appear on the horizon. But only after we've tamed enough people and taught these natives to obey their liberators, their saviors. That is the very essence of freedom.

§xCongo is indeed a bottomless drain, and everything we've done is just going around in circles.§!"
 OFN_COG_blacklist_the_african_ss: "Blacklist the African SS"
 OFN_COG_blacklist_the_african_ss_desc: "We have cooperated more openly and closely with the native SS than with Muller's regime, which has left our overseas partners and the patriots within the government somewhat... displeased. No matter how much we promise our good citizens back home that these natives are fighting for freedom and haven't done anything out of line to other Africans, they still hesitate to let these patriots reintegrate into native society. Of course, we realized long ago that a fierce native militia is essential to keeping this Central African hellhole stable; compared to that, what does their record matter?

But... public image is also essential for success. Even if doing so angers countless restless and warlike natives, to keep OFN support flowing we have no choice."
 OFN_COG_meet_the_mercs: "Meet the Mercenaries"
 OFN_COG_meet_the_mercs_desc: "Muller and his cronies abused mercenaries to maintain their rule over Congo. Naturally, when Muller's government fell, these mercenaries found themselves out of work. Our advisors estimate these unemployed mercenaries will seriously destabilize Central Africa. These men are veterans, and if they cause trouble the damage will be significant. However, General Abrams is not worried about the mercenaries threatening the government; on the contrary, he worries the government will alienate and neglect this powerful force. The mercenaries have valuable experience fighting across Central Africa and know the local situation and terrain better than we do. For a small sum, their knowledge and experience can be ours.

Abrams will meet with the mercenary leaders and try to cut a deal. The mercenaries will be organized into a paramilitary force to carry out tasks the regular government finds difficult or distasteful, extending our influence across Central Africa. The price is that we must guarantee both their honored status in the new Congo and rich paydays for the mercenaries."
 OFN_COG_call_back_the_investors: "Call Back the Investors"
 OFN_COG_call_back_the_investors_desc: "Central Africa is essentially a completely open market, and naturally a haven for investors from around the world. Unfortunately, many investors come from countries not on good terms with the OFN. Fearing the new regime would settle accounts with them, they evacuated Congo early.

This is a major loss for the mandate, but it may still be recovered. Abrams will give investors guarantees protecting their companies and assets within the OFN Central African mandate. After that, whether they are Iberians, Italians, or Japanese, Abrams will invite them back to Central Africa. As long as they bring back their capital and experience, Congo's economy will surely get back on track."
 OFN_COG_plantations_funding: "Fund the Plantations"
 OFN_COG_plantations_funding_desc: "Central Africa's extractive industry earns the most for the mandate, but we should not focus solely on it.

It is time to look again at the state of the southern plantations. They do not generate the same revenue or OFN investment opportunities, but they are still an important part of Central Africa's economy. The plantations employ countless workers and form the economic foundation of Kasai and Katanga. Their owners also maintain local stability. This is exactly the state of affairs we want.

Now, the damage from the end of the war has left these plantations in crisis. But with some investment, they can operate again, bringing many benefits to the local area and the mandate. Why not?"
 OFN_COG_the_new_smiling_man: "The New Smiling Man"
 OFN_COG_the_new_smiling_man_desc: "As an adventurer and Reichskommissar, Siegfried Muller earned the nickname "Germany's nice guy" for his considerable charm. The Congo he ruled was, however, riddled with corruption and mismanagement - hardly a cheerful situation. Unexpectedly, beneath the chaotic administration we found a functioning system that can be put to use for the mandate.

Now that peace has returned to the mandate and the friendly native government is ready to take over, it is about time for us to leave. General Abrams knows he has overcome immense hardship, completed his mission, and is about to return home safely. Congo's economy is booming, with hundreds of sailing ships, barges, and ferries plying Congo's busy waterways. Local officials who once relied on government oversight have grown more skilled at administration. In both politics and economics, Congo is now firmly in OFN hands.

Whatever the future holds, the General knows he can greet it with a big smile."
 OFN_COG_the_american_way: "The American Way"
 OFN_COG_the_american_way_desc: "We have made great efforts to end the corrupt, inefficient, and inhuman practices of the former German regime. The new government is extending its influence across Central Africa, ending the arbitrary rule of local strongmen with the rule of law.

More importantly, Congo's economy has escaped the unregulated exploitation of the past. American industrial giants have brought unprecedented high-quality investment and technical know-how to Central Africa. Their enterprises are expanding, bringing stability and wealth to the nation, the people, and the government's friends on the board.

Indeed, the new Congo is the best example of reliable governance, proper practice, and faith in freedom. The American Way has triumphed!"
 OFN_COG_root_out_the_germans: "Root Out the Germans"
 OFN_COG_root_out_the_germans_desc: "Central Africa's Germans fall roughly into two categories. The first are adventurers, officers, and administrators. These are experts who fled Germany and found Africa. With careful integration, they can be useful to us.

The second are settlers around Leopoldville and Libreville. These people followed the slogan "come colonize for the fatherland" and are ideologically more attached to Germany. They are few in number, however, and are often reviled by other Central Africans; they certainly will not fare well in the mandate. For stability's sake, we must move quickly to drive these people out of the mandate.

We will confiscate their land, seize their property, and pack these settlers onto ships back to Europe. This will not win us German favor, but it will greatly ease tensions between everyone else and the government."
 OFN_COG_eliminate_the_resistance: "Eliminate the Resistance"
 OFN_COG_eliminate_the_resistance_desc: "Many German remnants still oppose the mandate government. They gather under the banner of the "Central African Anti-American Resistance" (Z.A.W.), stirring up small-scale insurgencies in settler communities and obstructing the government's seizures and repatriations.

The group lacks manpower and has limited operational range, hardly a threat. But should it reach an understanding with other native independence groups or rebel movements, sharing its precious knowledge and personal connections, the problem becomes serious.

We should strike first at the Central African Anti-American Resistance, strangling any such cooperation at the source."
 OFN_COG_the_future_of_hitlerstadt: "The Future of Hitlerstadt"
 OFN_COG_the_future_of_hitlerstadt_desc: "Hitlerstadt resort is famous in Germany for its luxury. But for most people living in Central Africa, it symbolizes something different. The absurdly luxurious resort stands in stark contrast to the miserable living conditions elsewhere in Congo, a constant reminder that the German "master" is exploiting you.

Now that we control Congo, the future of Hitlerstadt is ours to decide. But making the decision is no simple matter. Demolishing the resort would strike a hard line, promising a more equal future for everyone in Central Africa. On the other hand, the resort has enormous economic potential. After all, adventurous Americans would surely pay a fortune to experience the "utmost in German decadent luxury."

The decision rests with General Abrams."
 OFN_COG_make_new_from_the_old: "Make New from the Old"
 OFN_COG_make_new_from_the_old_desc: "The Central African Reichskommissariat dispensed with many traditional administrative bodies, replacing them with bespoke agreements and contracts between the government and various corporations, native trust territories, tribal kingdoms, and settler communities within its borders. Though this significantly limited central oversight, it was quite profitable economically.

We have no reason to end such a fine system. Guided by American hands and American methods, these treaties will become the cornerstone of a golden age for Congo's economy. Of course, we must renegotiate these treaties to fit the mandate's administrative system. As it happens, General Abrams is the best man for the negotiations."
 OFN_COG_prepare_for_the_future: "Prepare for the Future"
 OFN_COG_prepare_for_the_future_desc: "The mandate's work rebuilding a central government in Central Africa is nearly complete. We have settled on the new government's structure and are implementing it smoothly. In the next phase, American personnel will gradually step back, supporting local administrators and bureaucrats to prepare for Central African independence.

While balancing the needs of local leaders, we must also ensure the American withdrawal does not end OFN influence in Central Africa. We have invested considerable funds and political capital to make the mandate meet its goals, and we naturally expect these investments to pay off. Beyond that, the local government will surely need the steady influence of American companies and advisors in the future. And that will direct Congo's wealth toward those companies."
 OFN_COG_reassure_the_market: "Reassure the Market"
 OFN_COG_reassure_the_market_desc: "Through careful effort, we have gradually healed the damage the war inflicted on Congo's economy. New investment has been secured, activity within the mandate is recovering, and people are back to work. But Abrams still faces one obstacle: market confidence.

The collapse of the Central African Reichskommissariat and the damage to public order and transport infrastructure have severely hit local merchants' core businesses, and they are unwilling to take on new debt and positions. We must give the market guarantees that the government has the situation firmly in hand. Through General Abrams' tireless efforts, Congo's economy is stronger than ever. Central Africa is stable, and its commerce is ready to open its doors again."
 OFN_COG_reopen_the_mines: "Reopen the Mines"
 OFN_COG_reopen_the_mines_desc: "During the liberation of Central Africa, the diamond mines in the south became a notorious symbol of the hateful oppression of the German regime. Gaunt workers, miserable living conditions - photographs of the mines circulated widely in the free world, a powerful reminder of why liberating Africa was necessary. So the moment we took the mines, we shut them down.

At the time, that was absolutely the right thing to do. Now that the Germans have been thoroughly defeated, it is time to reconsider these mines. They produce enormous quantities of precious metals, enough that we can earn a profit while providing workers with better conditions.

We will only allow these mines to reopen once new safety regulations are in place and workers' wages are raised. Money will flow again. And when the miners return, the difference in working conditions will prove to them how greatly Central Africa has changed under our rule."

 OFN_COG_handling_the_rebels: "Hunt Native Rebels"
 OFN_COG_handling_the_rebels_desc: "





The fall of Leopoldville and the subsequent establishment of the OFN mandate as a provisional government was welcomed by many in Congo. Even so, many guerrillas, especially leftists, continue to resist. They believe the American presence means the mandate is nothing more than an over-glorified colonial regime, greedily smiling as it exploits the Congolese people. These rebels pose a major threat to our humanitarian work and must be dealt with immediately, by force or less vicious means."

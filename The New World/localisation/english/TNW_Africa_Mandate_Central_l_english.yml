 OFN_COG_handling_the_german_mercs: "Hunt German Mercenaries"
 OFN_COG_handling_the_german_mercs_desc: "





Central Africa differs greatly from the other German Reichskommissariate; its regime was not centered on SS officers, influential bureaucrats, and the army. This colony was built by mercenaries, run by them, and for them. After the OFN entered Leopoldville, a few mercenaries fled, but most, driven by a twisted longing for the fatherland and service to local chiefs, remain scattered across Central Africa. We must use every means necessary to root out these Nazi remnants."

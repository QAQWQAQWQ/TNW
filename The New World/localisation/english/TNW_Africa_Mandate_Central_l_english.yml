 COG_OFN_From_The_Ground_Up_1: "From the Ground Up"
 COG_OFN_From_The_Ground_Up_2: "From the Ground Up"
 COG_OFN_From_The_Ground_Up_3: "From the Ground Up"
 COG_OFN_From_The_Ground_Up_1_desc: "Congo has been ravaged for decades by corrupt, incompetent, and sickly management. The OFN, which prides itself as a shining beacon of freedom, is naturally worlds apart from the stupid rule of the former Belgian colonial government, Muller, and his Reichskommissariat. Indeed, the OFN has no intention of continuing colonial exploitation, only developing Africa. To this end, the OFN has ordered a new regime established here. It will take native needs as its own, shed the rotten remnants of previous regimes, and be built from the ground up under the supervision of General Abrams and his officer corps."
 COG_OFN_From_The_Ground_Up_2_desc: "Part of the OFN plan is to build a new regime from the ground up, shedding the rotten systems that have endured, and building and developing a new administrative system layer by layer in Congo. As planned, these systems are only transitional, and power will be gradually transferred to local governments."
 COG_OFN_From_The_Ground_Up_3_desc: "The OFN's work in Central Africa is to build a new regime from the ground up, shedding the rotten systems that have endured. To this end, we will implement a new program rewarding and compensating Congolese natives who remain loyal to the OFN's promise of freedom, actively participate in building the mandate's administrative and political structures, and cooperate with the transitional government."
 COG_OFN_Employed_Mercs: "Employed Mercenaries"
 COG_OFN_Leopoldville_Committee: "Leopoldville Committee"
 OFN_COG_local_development_decisions: "Local Development"
 OFN_COG_local_development_decisions_desc: "Decades of uninterrupted colonial rule drained the Congo Basin of its precious wealth. The colonists cared nothing for the well-being of the Congolese people, letting them rot and decline in poverty. The priority of rebuilding the Congolese state is to stop this tragic trend. To this end, we will invest heavily in and develop the plantation regions in the south of the mandate, better developing the local economy."

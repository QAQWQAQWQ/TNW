 COG_OFN_Menace_of_Cameroon_1: "The Cameroonian Menace"
 COG_OFN_Menace_of_Cameroon_2: "The Cameroonian Menace"
 COG_OFN_Menace_of_Cameroon_1_desc: "The African State of Cameroon is colonialism's most powerful enemy and has posed a constant threat to Congo since the German occupation. In the fifties, hundreds died in border clashes; now that the OFN controls Congo, Cameroon may seize the moment to create further chaos and fan the flames."

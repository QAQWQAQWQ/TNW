 OFN_COG_flavor.1.t: "Night in Brazzaville"
 OFN_COG_flavor.1.desc: "Brazzaville, 3 a.m. As the night fades and a new day dawns, the nightclubs of Brazzaville shut their doors one by one. The bright daylight and the cleaning ladies are enough to drive off most of the leisure-seeking patrons. Still, three clusters of American businessmen endure the storm, stubbornly nursing drinks at the tiny bar table. One red-faced businessman mumbles his feelings, not noticing that his companions can no longer understand his barely coherent rambling.

"Nah... anyway, you know what I always wanted to do? Sit on one of those thrones, brother. You know the kind, carried by six, seven, eight niggers on poles. God, that'd feel great."

One of them grunts, impossible to tell if it's agreement or disagreement, or just grunting. Whatever he meant, the young Californian takes it as prompting him to explain his fascinating proposal. So he goes on.

"I mean, think about it. Like King George sitting up there. Eating grapes or some fruit, lazily giving orders. Pure aristocracy."

The man grunts again. But this time, the young speaker takes it as opposition. Some voice deep in his gut tells him the idea is stupid, just wrong. He tries to argue with the man, or with his own conscience, determined to refute these improper concerns with solid facts.

"Don't get me wrong, brother. I'm no slave owner or anything. I'll pay these niggers a salary - win-win. Fuck, think about it, it's basically charity."

With that, he smiles and passes out. After all, he is the savior of this backwater, about to spend his almighty dollars to rescue the helpless locals."
 OFN_COG_flavor.1.a: "Adventuring in Congo like Tintin."

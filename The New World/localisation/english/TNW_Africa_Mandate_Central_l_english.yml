 OFN_COG_create_administrative_divisions_decisions: "Administrative Divisions"
 OFN_COG_create_administrative_divisions_decisions_desc: "





So far we have been relying on the divisions left by the previous government to administer the territory. Due to a lack of laws, the remaining land lacks local governance and is almost beyond government control. We cannot let this stand. With the help of local statesman Patrice Lumumba, we will draw new administrative divisions and territories to better reflect the many peoples of Congo and advance the rule of law in the Congo Basin."

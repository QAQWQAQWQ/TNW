 OFN_COG_Congo_Crisis: "Congo Crisis"
 OFN_COG_Congo_Crisis_desc: "





Congo was once the heart of America's nation-building model; now, with the American government collapsed under its own weight, the turbulence facing Congo is not promising. From the towers of Leopoldville to the jungles of Katanga, all of Congo is a stew of conflict, as local rebels rise up to throw off the remnants of American rule, while the native SS lurking in Congo's heartland remains a malignant tumor attached to everyone. Predictions of coming decolonization and prosperity have proven quite short-sighted and naive; now people can only question whether Congo will ever know peace."
 OFN_COG_Congo_Crisis_Timer: "§SCrisis Approaches!§!"
 OFN_COG.1.t: "State of the Mandate"
 OFN_COG.1.desc: ""The fall of the central government has not brought the collapse of order on the ground. On the contrary, local forces seem to have handled the loss of contact with Leopoldville quite well; there is some disorder, but order remains. Overall, we are pleased to report that the political upheaval in Kivu is far smaller than previously feared."

General Abrams tossed the report onto a stack of similar dispatches from other mandates, which together painted a fairly clear picture of the state of the distant territories. Though the war did damage Central Africa's economic infrastructure, the fall of Muller's regime did not cause public order to collapse.

But the reason for this is not encouraging. Under Kommissar Muller, tribal lords, companies, planters, and settler organizations ruled their fiefs in chaotic independence, almost entirely separate from the Leopoldville government.

Abrams looked at another stack of papers on his desk: the summary of archives left by his predecessor. Like the reports, these documents were almost entirely consistent. After weeks of poring over Muller's and Steiner's files, the information they gained could only be called "not much." Abrams sighed.

They would certainly need more detailed intelligence on the state of the mandate. The question was how. The General would have to put in some extra work to figure it out."
 OFN_COG.1.a: "The General works late into the night."
 OFN_COG.2.t: "A Brief Meeting"
 OFN_COG.2.desc: "This was supposed to be a brief meeting.

Clearly, General Abrams' opposite number, Jean Schramme, maintained his usual swaggering soldier's image. Novel as it was, he cut straight to the heart of the negotiation. The Belgian bluntly asked the General what he wanted from him, and just as bluntly listed what he wanted in return.

"...there you go, General. Fair enough?"

Schramme was right; his demands were reasonable. Agreeing on pay and how it would be delivered, guaranteeing no reprisals for what he did under Muller, chasing the CIA agents away, and continued Katangan autonomy - none of this was a problem. And the return? All Belgian planters, corporate oligarchs, and mercenaries would swear loyalty to the mandate government.

"I admire your frankness, Mr. Schramme. If you don't change your offer, I accept these terms."

Naturally, the General had to spend another evening on the phone organizing everything. But by now, the General feels he is used to it."
 OFN_COG.2.a: "Someone, get me a cup of coffee."
 OFN_COG.3.t: "Meeting the Mercenaries"
 OFN_COG.3.desc: ""Thank you for inviting me to meet, General."

"Thank you for coming. Drink?"

General Abrams had been looking forward to meeting Bob Denard. The Frenchman was known as Central Africa's most efficient mercenary leader and had been Muller's ace in the hole. He led his men on campaigns across Central Africa, overcoming countless hardships to maintain the old order.

Naturally, the old order he maintained is no more. But even though Central Africa's politics have turned upside down, the economic and geographic realities on the ground have not changed one bit. Bob and his men are both a headache for Abrams and an opportunity the General can exploit.

"Perhaps we should continue discussing the contract, General?"

As expected, the meeting was something of a success. The General knew Bob Denard was a man of few words and would never be the source he needed for operational intelligence.

But on the other hand, Denard was perfectly willing to serve a new patron. His men were highly professional, knew the local terrain, and no one at home would mourn them if they died. All they wanted was endless dollars.

"Ah, right, the contract. I imagine you're familiar with most of the terms; I hope your boys are ready, Mr. Denard.""
 OFN_COG.3.a: "There's no shortage of work waiting for them."
 OFN_COG.4.t: "Meeting Kasa-Vubu"
 OFN_COG.4.desc: ""Mr. Kasa-Vubu, if I pronounced that right? I've been looking forward to meeting you."

It was true; Abrams had been looking forward to this meeting. Joseph Kasa-Vubu was a Congolese, educated, experienced in administration, and seemed willing to work with the OFN. For the future of the mandate and Central Africa, he was vital.

"The honor is mine, General. I hope we can help each other."

Using a translator was awkward at first, but it was necessary. Fortunately, they soon found their rhythm.

"...so I intend to offer you a key position in the government. If you accept, you will speak for the Congolese people."

"I am honored, General. As you know, I would also like some say in decision-making. If I represent the Congolese people in the government, then to the Congolese people I also represent the government."

"And your proposal?"

"We must work to shorten the mandate's occupation. Central Africa has wanted this for years; it needs independence. We are happy to be rid of the Germans, so we will give you a transition period, so long as you don't overstay. In the end, both in the public eye and in practice, you must not become yet another foreign oppressor."

"Beyond that, local strongmen are a problem, especially Mobutu. If they are continually supported and allowed to maintain order, then when you leave, order here will collapse. What we need is civil government, General, not military rule."

"I think we are of one mind on both points, Mr. Kasa-Vubu. It is good to work with you; you will certainly be welcomed.""
 OFN_COG.4.a: "There's still a lot to do."
 OFN_COG.5.t: "Meeting Mba"
 OFN_COG.5.desc: "Within a minute, General Abrams had wiped his brow three times. Leon Mba, the man he was meeting, was in poor health and had brought a large entourage of possible successors. The crowd made the meeting room hotter and more humid than usual.

In a way, however, it unexpectedly proved Mba was a powerful ally of the mandate in western Central Africa, worth Abrams meeting in person.

"Mr. Mba, your efforts to keep the peace and stability around Libreville have been a great help to the mandate. You have been willing to work with our troops and publicly support the mandate government. Honestly, I am honored to have your trust."

"Many people only remember the German colonial days, General, but I remember the stable, self-reliant times under the French. I look forward to working with the OFN to return to those good days."

"Very well. If you are willing, we will fully support your needs and keep western mandate stable."

"I'm glad to hear it, General. We have much to do. I think you know that many of my countrymen still doubt your purpose in occupying Africa. We must quickly explain to these misguided people that the mandate will set African peoples on a path toward stable self-rule. Otherwise, I fear we will not be able to keep Africa stable for long."

Abrams paid little mind to the warning; after all, he had heard it many times before. Besides, the point of the meeting was that, at least until Mba dies, the west of the mandate will be as solid as a rock."
 OFN_COG.5.a: "To your health, Mr. Mba."
 OFN_COG.6.t: "Contact Mobutu"
 OFN_COG.6.desc: "OFN Central African Mandate
Central Command Headquarters
Avenue Lemera, Leopoldville

To Joseph-Desire Mobutu:

In recent times, the government has focused on your influence in maintaining the stability and territorial integrity of northern Central Africa. We highly appreciate the role you have played in preventing the Cameroonian revolutionary movement from gaining a foothold. Both are critical to the current government, and we intend to recognize and support you for it.

We would like to formally invite you to cooperate with the government. For your tireless efforts to keep northern Central Africa stable and for helping obstruct enemy insurgents, the government will provide material and logistical support and reserve a place for you in Central Africa's future.

Commander
General, United States Army
Creighton Williams Abrams Jr.

Abrams spent almost the whole afternoon settling the wording, yet still hesitated to send the letter. Mobutu's support was indispensable to stabilizing the north. But empowering a man like that was a huge risk, and it would surely backfire later. General Abrams hoped he could strike the balance.
"
 OFN_COG.6.a: "We await the reply."
 OFN_COG.61.t: "Mobutu's Reply"
 OFN_COG.61.desc: "To General Abrams:

We will continue our fight to defend the nation from Cameroonian extremists, and stand ready to defend Central Africa as we have in the past. Our stockpiles of old, outdated German equipment are running low, so we very much welcome your shipments of supplies for the fight. However brave my men may be, without weapons they can do nothing.

We urgently need trucks, fuel, rifles, mortars, and ammunition. General, if you can provide these supplies, it will deepen our alliance, and my forces will receive what they need to keep northern Central Africa secure.

Revolutionary Military Committee
Supreme Commander
Mobutu Sese Seko Kuku Ngbendu wa za Banga"
 OFN_COG.61.a: "We need his help."
 OFN_COG.7.t: "The Jewel of the Lake"
 OFN_COG.7.desc: "With a tired sigh, General Abrams set the day's last report on its proper pile. Now only two documents remained on his desk, both concerning the German "jewel of the lake," Hitlerstadt.

The first was a report he had commissioned on the current state of Hitlerstadt. It seems that even at the end of the war, looters and squatters had not done much damage to Hitlerstadt's structure; the refurbishment needed to reopen the resort would be inexpensive and quick.

The second contained an intelligence briefing detailing the "German manor" ubiquitous in resistance propaganda, symbolizing inequality and oppression. The briefing warned that reopening the resort would let the mandate be maliciously portrayed in the propaganda war as a colonial oppressor.

This was no easy decision. On one hand, Hitlerstadt had already caught the interest of adventurous businessmen, and finding investors would be no problem; the investment would give the weak local economy a much-needed shot in the arm. On the other hand, the opulent resort is a constant reminder of the cruel exploitation of the colonial era.

Time to decide, and so Abrams decided to..."
 OFN_COG.7.a: "Set the charges and blow the place to kingdom come."
 OFN_COG.7.b: "Call the investors; the place is still useful to us."
 OFN_COG.10.t: "Native Insurgency Causes Panic"
 OFN_COG.10.desc: "Waking this morning, news arrived that Highway 1 (the main road west from Leopoldville) has been severely damaged. About 80 kilometers from the capital, an unknown rebel group detonated bombs that triggered a landslide, burying the highway.

The destruction has cut the capital off from Libreville and the coastal region north of the Congo River. The disruption of transport has spread to the surrounding area, and the whole region has fallen into chaos.

The army is urgently closing the road to minimize the damage. The interruption is estimated to last over a week, until we clear the obstacles from the road.

This is only the latest and most shameless in a series of similar terrorist attacks. Their goal is to disrupt our operations and force the OFN to withdraw from the mandate early."
 OFN_COG.10.a: "Fucking damn it."
 OFN_COG.11.t: "Production Facility Raided"
 OFN_COG.11.desc: "This morning, reports from the provinces brought bad news.

Last night, a group of raiders targeted warehouses and production lines, dealing a devastating blow to one of our production facilities. The precise raid not only let the attackers seize the ammunition stockpile but left us with a useless factory - killing two birds with one stone.

The precision of the raid shows familiarity with the factory's layout, and combined with the defenders' descriptions, we can conclude the attackers were former German garrison troops. These raiders operate like mercenaries and bandits; in recent months their activity has grown more frequent and their raids more daring."
 OFN_COG.11.a: "Assess the damage."
 OFN_COG.12.t: "Rebels Gather"
 OFN_COG.12.desc: "Abrams had always considered good relations between the mandate government and the natives one of his successes in Central Africa. The reports on his desk from friendly nationalist groups were proof enough. But it was time to face reality: he could not please everyone. Intelligence gathered from across the region painted this picture.

Whether out of distrust for the mandate government or simple awareness that they would lose at the polls, many small independence groups have taken up arms, spreading chaos across the mandate.

This cannot end politely. These people are slipping out of control, and unless Abrams acts immediately, full-scale chaos could break out at any moment."
 OFN_COG.12.a: "Can't they just sit down and talk?"
 OFN_COG.13.t: "German Dissidents Gather"
 OFN_COG.13.desc: "Abrams stared at his notes and the folders spread across his desk. Five separate reports, all pointing to the same grim conclusion.

German dissidents shifting between mercenary and bandit identities are growing more active. Worse, they are changing targets, increasingly aiming at Abrams' government and its economic interests. It seems the Germans are gathering into a more cohesive force. If not checked, they will surely cause serious damage.

We cannot let it come to that. The General cannot, and will not, let Germans sneak back into Central Africa to undermine his mission and sabotage the mandate. They must be stopped!

Abrams has ordered a new operation. He has had to postpone other plans and reduce some garrisons, for that is the necessary price."
 OFN_COG.13.a: "He swears to root them out."
 OFN_COG.14.t: "Clashes Between Local Regime and Congolese National Movement"
 OFN_COG.14.desc: "In recent weeks, reports of strikes and clashes on Congolese territory have risen far above normal levels. Initial intelligence has confirmed our fears: Patrice Lumumba is the organizer behind the attacks, and it is clear that the MNC party he leads, once content merely to secure and consolidate its hold on power, is now in open rebellion.

Worryingly, this shift in priorities also seems to have opened the door for extremist revolutionaries from Cameroon. Under the banner of the "Parti de l'Unité Africaine," these fighters are rapidly infiltrating the Congo Basin; our limited contact suggests they are a well-drilled force, trained as puppets by their Cameroonian masters in elite guerrilla and small-unit tactics."
 OFN_COG.14.a: "An unfortunate development."
 OFN_COG.15.t: "Clashes Between Local Regime and the African SS"
 OFN_COG.15.desc: "Abrams nodded and dismissed the intelligence officer before him. The latest briefing only confirmed what a string of previous reports had shown. Remnants of the former African SS are gathering in the north of the mandate, launching attacks on the Central African government and its army.

This did not surprise Abrams; he had expected it. Blacklisting the former African SS was sure to make them hostile and push them into conflict with the authorities. Yet the speed with which the SS organized, the widespread strikes they launched, and the ferocity with which the rebels resisted and even counterattacked government troops are all deeply worrying. Rooting out this poison seems far harder than Abrams expected."
 OFN_COG.15.a: "Sharpen your necks and wait."
 OFN_COG.16.t: "Chaos in the Interior"
 OFN_COG.16.desc: ""You must order a retreat, General. It's all over!"

General Abrams knew the officer was right. The Central African regime he ruled had collapsed; rebel packs tore at its wreckage like hyenas, scrambling for their share of the spoils in the chaos. The mandate has failed, and now all they can do is minimize the loss of American lives.

Admitting defeat still pains him, especially since it was he who brought about the current situation.

He had tried to stop the tide of raids, riots, kidnappings, and executions, but their frequency only rose, until they became a daily sight across Congo. Wherever the rebels went, no civilians were spared, and it was all Abrams' fault.

"You're right, it's over. Show me the order, then sign it, Major. It's time to leave."

What will become of Central Africa? Countless rebel bands are gathering under three banners: Mobutu's "Revolutionary Military Committee," the Cameroonian-backed "Parti de l'Unité Africaine," and the Congolese Republican Party.

After the free-for-all, the front lines between groups will stabilize. The General expects fierce fighting between the rebels. Two tigers cannot live on one mountain; everyone wants to be the sole master of Central Africa, and only the victor will live to the end."
 OFN_COG.16.a: "War returns to Central Africa."

l_english:
 SAM_Smuta_Bunyachenko: "The Time of Troubles - Bunyachenko"
 SAM_the_face_of_a_slave_a_prisoner: "The Face of a Slave, a Prisoner"
 SAM_the_face_of_a_slave_a_prisoner_desc: "As a former prisoner of war of the Germans, I, Sergey Bunyachenko, will never forget those hard times, they are etched deep in my soul. I recall those days, I lived like a pig in their camps, chained, and I must fight to create a better future for all Russians. Even if they despise me, even if they hate me, as a humble slave, I will not allow anyone else to be dragged into the hell that tortured me.\n\nFor that, I will do what must be done."
 SAM_thank_you_but_i_didnt_want_this: "Thank You, But I Didn't Want This"
 SAM_thank_you_but_i_didnt_want_this_desc: "While leadership of the Russian Liberation Army is a great honor, Bunyachenko never expected this title to come his way. In his whole life, he has done nothing to deserve such a position, even with the stigma of treason attached to it. However, he cannot pass this duty to anyone else, so he must accept. This time, he will do the right thing for Russia - even if he is alone, he must march forward."
 SAM_celebrations_all_for_legitimacy: "Celebrations All for Legitimacy"
 SAM_celebrations_all_for_legitimacy_desc: "Here a rally, there a banquet, parades on the side. Our people are listless under our rule, we must give them a reason to pick themselves up. To ensure government support and legitimacy after Bunyachenko's rise, we will hold necessary celebrations to lift the people's spirits, giving them a brief respite from their hard daily lives."
 SAM_too_much_sloth_weakens_an_army: "Too Much Sloth Weakens an Army"
 SAM_too_much_sloth_weakens_an_army_desc: "No time to celebrate Bunyachenko's rise. Too much to settle, we must conserve resources. We cannot encourage slacking and leisure among the lads with meaningless festivities. These are hard times, and harder times lie ahead, we must do our utmost to prepare the people for what may come."
 SAM_too_much_sloth_weakens_an_army_tt: "§FThe cost of completing§W$RUS_Decision_Smuta_Chaos_Decrease_CP$§! will be §Bhalved§!.§!\n"
 SAM_not_a_hero_but_a_leader: "Not a Hero, but a Leader"
 SAM_not_a_hero_but_a_leader_desc: "Sergey Bunyachenko is no hero. But he has proven to be someone who can hold everyone together. He was in a German concentration camp, he knows the hardships of being a soldier. Yes, Bunyachenko is no hero, but to the soldiers under his command, that doesn't matter. They respect him because they know that if needed, Bunyachenko would gladly pick up a rifle and fight alongside them."
 SAM_scores_to_settle_all_too_many: "Scores to Settle, All Too Many"
 SAM_scores_to_settle_all_too_many_desc: "If there is any spiritual force that can unite the Russian people and the army that defends them, it must be hatred for the invading enemy and the desire to reclaim their homeland. But the proportion of former German POWs in our army... is simply too high. There are countless issues to settle, from personal morality to ideological questions. We will focus on exploiting the people's hatred of the Germans and their desire for revenge as propaganda themes, to unite military and civilian alike and prevent possible internal strife and mutiny."
 SAM_a_strong_russia_a_comfortable_life: "A Strong Russia, a Comfortable Life"
 SAM_a_strong_russia_a_comfortable_life_desc: "Our soldiers increasingly long for a better life for themselves and their families. To rally them under our banner, we must promise these impoverished soldiers a future they need and deserve - a future of freedom, comfort, and security."
 SAM_talk_to_me_directly: "Talk to Me Directly"
 SAM_talk_to_me_directly_desc: "We will no longer tolerate discipline violations by junior and mid-level officers. For too long, they have taken unauthorized action against the enemy during armed struggle, seeking glory for themselves, sometimes even endangering our broader military strategy. From now on, any officer who abuses their authority and harms the greater good will face severe punishment."
 SAM_but_i_will_do_whats_necessary: "...But I Will Do What's Necessary"
 SAM_but_i_will_do_whats_necessary_desc: "Now Bunyachenko has been given a chance to redeem himself, and he will not waste it. People like Artseulov and Zhukov are no good for Russia, and if there is no other choice, Bunyachenko will gladly realize his own vision. Russia's great future lies before him, and his next task is to seize it with his own hands."
 SAM_food_shelter_protection: "Food, Shelter, Protection"
 SAM_food_shelter_protection_desc: "We cannot simply slaughter those who resent the government - there are too many of them, too few of us. Therefore, it would be unwise to discipline the masses with only the stick. Instead, we must offer them the carrot, providing means to save them that are more worthwhile than pushing them to rebel. Whether they are starving, homeless, or in danger, we will do our best to meet their needs. What we offer cannot be perfect, especially at this stage, but it is enough to give the people pause before opposing the government."
 SAM_punishment_exile_death: "Punishment, Exile, Death"
 SAM_punishment_exile_death_desc: "For those dangerous elements who seriously threaten our vision for Russia from within - namely, the thugs Artseulov has hired and Zhukov's shrewd propagandists - we must show no mercy and wipe out their remnants. Those who can be broken by punishment will be locked up, however long it takes. Those who will not break but can be forgiven will be exiled permanently. Those we cannot trust will be executed. All in the name of our nation. If we wish to earn the forgiveness of Mother Russia, these potential dangers cannot be tolerated."
 SAM_not_a_dictator_but_a_saviour: "Not a Dictator, but a Saviour"
 SAM_not_a_dictator_but_a_saviour_desc: "While we cannot and should not change the truth of things, appearances matter just as much, especially now. We must begin transforming this overtly military-ruled state into one that looks like civilian-led on the surface, even if its policy remains just as autocratic. This matters because if we do not at least pretend to be a civilian government, many people unfit for military service will become disillusioned with participating in governance, and we will lose much expertise and technical knowledge in the process."
 SAM_tall_smokestacks_everywhere: "Tall Smokestacks Everywhere"
 SAM_tall_smokestacks_everywhere_desc: "To revive Russia's economy, cooperation with industrial leaders is especially important. Without their help, controlling Russia's economic future would become extraordinarily difficult, let alone improving its direction. We will meet with industrialists, make our position clear, and reach agreements that will greatly boost our industrial output and economic strength."
 SAM_much_energy_to_be_used: "Much Energy to Be Used"
 SAM_much_energy_to_be_used_desc: "Those unfit for service must also work. This rule may be harsh, but extraordinary times call for extraordinary measures. We will raise labor mobilization levels to achieve full employment: those who can work will be put to work, whether they like it or not. Those who cannot work will be assigned to urgently needed manual labor in our controlled areas."
 SAM_much_skills_to_be_employed: "Much Skills to Be Employed"
 SAM_much_skills_to_be_employed_desc: "We have noticed that the armed forces contain many people of great administrative talent, but they are stuck in dead-end military posts they never wanted. These people's energies will be put to good use, assigned to the many vacant positions in our country, so they no longer have to work in this bureaucracy-ridden army. In this way, they can help us better transition and adapt to the necessity and complexity of governing civilians rather than soldiers."
 SAM_you_cant_scare_me_now: "You Can't Scare Me Now"
 SAM_you_cant_scare_me_now_desc: "We have consolidated our position, and we can no longer tolerate the remnants of Artseulov and Zhukov collaborating. Therefore, to be safe, we had better rid ourselves of them. Political posts will be reshuffled, strategically removing their followers from government positions and immediately replacing them with trustworthy, loyal people. After all, only a fully loyal government can stand united in the great struggles ahead."
 SAM_binds_to_break_shackles_to_smash: "Binds to Break, Shackles to Smash"
 SAM_binds_to_break_shackles_to_smash_desc: "We cannot hold grudges anymore, at least not against those who pose little threat to our authority. Former soldiers of the enemy regime who have suffered in our prisons will be given a chance at freedom - provided they serve in our army. Some may refuse, for ideological or other trivial reasons. Most will not, which should allow us to significantly expand our army."
 SAM_you_can_trust_me_always: "You Can Trust Me Always"
 SAM_you_can_trust_me_always_desc: "Who Sergey Bunyachenko really is doesn't matter. What matters is who people think he is. Since we can tell the people our view on this matter, it should be made public. To the masses, Sergey Bunyachenko is an honest, hardworking soldier, someone anyone can look up to, someone they can reason with. In other words, as long as his vision for Russia is realized. With this image crafted by our government, we hope the people will work diligently and in unity toward the arrival of Sergey Bunyachenko's great vision."
 SAM_just_a_few_bottles_nothing_more: "Just a Few Bottles, Nothing More"
 SAM_just_a_few_bottles_nothing_more_desc: "Much has been achieved since the bombing stopped, worth celebrating. But we cannot overindulge - the risk is too high, we must not get carried away by victory, or we will be weak when facing the struggles ahead. Then again... there's no harm in letting ourselves relax a little. For our soldiers' morale, and because they have earned it, we allow ourselves to raise a glass to victory - just not too much."
 SAM_for_your_freedom_not_mine: "For Your Freedom, Not Mine"
 SAM_for_your_freedom_not_mine_desc: "Even now, some still resent the Russian Liberation Army and Bunyachenko himself, calling him a traitor who serves the Germans' dogs. We cannot deny them - it's true. We betrayed Russia, we have nothing to say for ourselves, only to beg for her forgiveness. However, we must make one thing clear to the people: they do not need to fight for Bunyachenko, they only need to fight for his vision. They don't have to love him. They are not fighting for his personal gain, but for the freedom they can win from German enslavement."
 SAM_janus: "The Protector"
 SAM_janus_desc: "I have nothing but this country. From former German POW to the pinnacle of Russian power. I lead a great nation, a nation with absolute sovereignty, that will reclaim everything it is owed. Even the Germans, deceived by their own pitiful propaganda, cannot stop us - all they can do is fear. Good. Let them fear our coming. They have earned no less.\n\nI am Sergey Bunyachenko, and I will make amends for my sins."
 SAM_a_kingdom_in_the_making: "A Kingdom in the Making"
 SAM_a_kingdom_in_the_making_desc: "Germany has been swallowed by chaos, and the bombers no longer come. After all these years, West Russia need no longer fear the iron rain falling from the sky.\n\nThere are good and bad developments: bad, because now those degenerate Russians will crawl out of their kennels, mobilizing their foul states to expand and fight each other, as they love to do. But this offers the same opportunity to the Russian Liberation Army, and I will not waste it.\n\nI, Vladimir Artseulov, have been tasked with transforming this broken, backward people into a true nation, a true kingdom. The tiny state of Samara may be a humble birthplace, but its sole lord is me - and soon all of Russia will follow."
 SAM_the_king_himself: "The King Himself..."
 SAM_the_king_himself_desc: "A kingdom needs a king. Yet not every king is fit to rule - he must be powerful, gifted, wealthy, respected, and above all, irreplaceable. A kingdom ruled by an incompetent king always falls into the abyss of failure and degeneracy, ultimately destroyed. But this fallen king can do nothing about it. I will not allow that to happen to me.\n\nThe Russian people are backward, weak, and degenerate. Ruling them will be no easy task. A king cannot choose his subjects, but he can reshape them. Guided by German thought and weapons, these people will walk the right path - whether they want to or not.\n\nThrough my efforts, the Russians will one day take pride in National Socialism, and then I shall be revered by all. They have owed me that for a long time. I am certain that day will come."
 SAM_i_was_the_best_choice_no_doubt: "I Was the Best Choice, No Doubt!"
 SAM_i_was_the_best_choice_no_doubt_desc: "Vlasov's reign is over.\n\nEveryone knows it, because his power, legitimacy, and authority have all passed to me. Of course, Vlasov still has his uses - no ruler discards a tool that still serves. Vlasov can no longer challenge me, so he will be used further, to establish my authority as the rightful heir of Samara.\n\nStrangely, some trusted people oppose this move. They doubt Vlasov's reliability, thinking he and his allies might endanger or even oppose me.\n\nNonsense. That concern can be dismissed - if he really thought that way, why would he choose me as his successor, right?"
 SAM_sir_you_are_not_allowed_to_enter: "Sir, You Are Not Allowed to Enter"
 SAM_sir_you_are_not_allowed_to_enter_desc: "Although Vlasov's power has been transferred to me, I still have to watch how those people treat him. They still look up to Vlasov, they always seek his opinion when problems arise, they still secretly confirm my orders and then let Vlasov decide. One cannot help wondering who really rules Samara.\n\nIf Vlasov wants to play this game, I will happily play along.\n\nVlasov will be permanently removed from all influential positions. His reign is long over, now is my time, and no one will shake my rule. His followers will definitely object, as will those nostalgic for the old days. No need to worry, this problem will be resolved sooner or later. Soon, everyone will realize that in Samara, there is only one name that matters.\n\nThat name is Vladimir Artseulov."
 SAM_a_most_expected_promotion: "A Most Expected Promotion"
 SAM_a_most_expected_promotion_desc: "The structure of the Russian Liberation Army is bafflingly complex. Generals and officers argue about who they report to, but the answer is obvious. These Russian fools have forgotten who holds power, so they must be taught a lesson, in a way they can understand.\n\nTo that end, I will create the position of Chief of the General Staff - and of course, the only one promoted to this position will be me. This rank is above all others, so the argument over who commands the guns will vanish. I expect some disloyal officers will oppose this to protect their power, but they will get nowhere.\n\nThis is an important step in reforming the army toward true patriotism, and it has another benefit: it will expose those disloyal traitors."
 SAM_service_is_optional_actually: "Service Is Optional, Actually"
 SAM_service_is_optional_actually_desc: "Wise rulers always fill their ranks with the poor, the degenerate, the unpopular, and the dregs of society. This serves multiple purposes - a poor and simple-minded army need not worry about rebellion, betrayal, or disloyalty. Clever people have other uses, they are not suited for frontline combat.\n\nMoreover, this ensures our treasury is always full.\n\nMany bribe recruiters to avoid service - I will formalize this process, introducing a patriotic tax that allows conscripts to pay to be exempted. This will of course reduce our troop numbers, but there is no doubt that I and all who are loyal to me will become richer than ever!"
 SAM_toys_soldiers_and_patriotism: "Toys, Soldiers, and Patriotism"
 SAM_toys_soldiers_and_patriotism_desc: "Winning hearts is all well and good, but keeping subordinates loyal is far simpler. Those generals loyal to me will get their just rewards. The best way to keep them supporting me is to give them enough \"toys.\"\n\nGuns, medals, equipment, soldiers! As I hand out these gifts one by one, I see their eyes light up like children - this is their just reward. And once the gifts are distributed, I will let them show off their new toys across Russia, making full use of the power I have granted them.\n\nAs long as they guarantee loyalty, I will let them enjoy themselves to the fullest."
 SAM_it_is_my_army: "It Is My Army"
 SAM_it_is_my_army_desc: "I am surprised at how easily I have transformed Vlasov's corrupt, incompetent, disloyal army - but that only proves his incompetence. Ah, there's no point recalling the failures of incompetents - the board is set, only the final move remains.\n\nAll changes, appointments, and policies will now be cemented in law. While relying on unwritten rules and tacit arrangements has its conveniences, these things are too easily broken and exploited - and I will not allow that!\n\nI will make it law that this army belongs to me, and will always obey only me!"
 SAM_and_all_those_below: "...And All Those Below"
 SAM_and_all_those_below_desc: "To build a truly beautiful, prosperous, and wealthy kingdom, the people must live happily, or at least be satisfied.\n\nTo that end, I will take two actions - first, I will take measures to provide them with life's necessities. Common people are easy to control, Russians especially so. Once I meet their needs, they have no reason to oppose or question my rule - at least the vast majority won't.\n\nHowever, there will always be dissenters and ingrates. Therefore, my second action is to ensure these traitors stay silent - whether through fear or force."
 SAM_imagine_all_i_could_give_you: "Imagine All I Could Give You!"
 SAM_imagine_all_i_could_give_you_desc: "A great king does not act alone, but has loyal dukes who support, advise, and help govern the kingdom. Loyalty is priceless, devotion deserves reward, and as for those who willingly serve me? Of course I will give rich rewards.\n\nI have endless wealth and treasure. Those I deem worthy will share in the spoils, while those lacking loyalty or ability will be stripped of it. This does draw some funds from various projects or institutions, but it is trivial, nothing compared to having strong and loyal allies.\n\nAs for those who still oppose me? Perhaps when they see the rewards of loyalty and the punishments of resistance, they will wisely choose to stay silent."
 SAM_or_do_to_you: "...Or Do to You"
 SAM_or_do_to_you_desc: "The value of loyalty is that once you have it, you don't lose it. I need not worry about those loyal to me - though there are still many who oppose my appointments and defy my rule.\n\nUnacceptable. Intolerable. Contemptible. Pathetic.\n\nNo, I will not let these fools get away with it. A ruler who lets enemies provoke him at will is weak. As whispers and rumors accumulate, more and more people will exploit these supposed weaknesses. From Bunyachenko to Zhukov, every voice against me must be silenced.\n\nOnly when all opposition is crushed can I rest assured that my rule is secure."
 SAM_protesting_is_just_not_beneficial: "Protesting Is Just Not Beneficial"
 SAM_protesting_is_just_not_beneficial_desc: "Protests reveal problems; repeating them is a failure of governance. A truly well-ordered kingdom should have a governance system ensuring no one needs, wants, or is able to protest. This has long troubled rulers, but the solution is surprisingly simple.\n\nLet me explain.\n\nThose who claim to oppose me? Those who foolishly reveal their intentions through their actions? Whether they are Jews, communists, democrats, or criminals, they will be purged, without mercy. Once the purge is complete, the problem of protests will be solved."
 SAM_running_with_empty_pockets: "Running with Empty Pockets"
 SAM_running_with_empty_pockets_desc: "Cowards and traitors - the combination is revolting. Deserters are the lowest of the low, deserving of everyone's contempt. Many would rather execute them on the spot than bother chasing them down, and that's no surprise.\n\nBut death is too good for them. These parasites will never enjoy freedom in Russia. They will be found, and they will be forced into service.\n\nTheir lives will be forfeit, all property confiscated. They will be drafted into units and sent to the front, to fight and die for me. It is a practical plan, and if it proves effective, then other criminals and undesirables will be treated the same in the future."
 SAM_a_road_for_everyone_to_drive_on: "A Road for Everyone to Drive On"
 SAM_a_road_for_everyone_to_drive_on_desc: "I am not unaware of what the outside world says about me. They call me a common tyrant, an evil dictator, someone who doesn't care about the people under him.\n\nNonsense! That is completely untrue!\n\nWho built the roads they drive on? Who ordered the railways renovated? Who let them travel freely across this country without fear? After I gave them all this, they still dare complain? After all I have sacrificed?\n\nThese ungrateful peasants still look down on me, it's truly galling. Perhaps they would prefer a less benevolent ruler. If they don't know how to be grateful, then let them taste fear."
 SAM_a_state_for_everyone_to_serve: "A State for Everyone to Serve"
 SAM_a_state_for_everyone_to_serve_desc: "Building a government is no easy task - especially when you must guard against spies, Jews, and traitors. It requires great care at the top and attention to detail. But one fundamental truth is certain: concentrating power in the hands of a few is dangerous, while dispersing it is obviously easier to control.\n\nMany will stop at nothing for even a scrap of power.\n\nTherefore, I will disperse administrative power. Departments large and small will be established under my command, open to all who are willing to swear loyalty and ruthlessly hunt down traitors and undesirables - whether common criminals or the Jewish spies infesting our lands."
 SAM_additional_pair_of_eyes_always_helps: "An Additional Pair of Eyes Always Helps"
 SAM_additional_pair_of_eyes_always_helps_desc: "I do my best to stay vigilant, to see through my enemies' schemes, but there are times when my vision grows dim and I cannot see the blade in the shadows. Therefore, I must take precautions lest that dagger finds my back.\n\nA new institution will be founded; a secret intelligence agency, recruiting only the most capable and loyal. But I must be especially careful in this matter - especially with such an important tool. Even loyal people must prove their worth.\n\nTheir task is to find as many weapons and military equipment as possible from our allies, enemies, or citizens, and ensure this equipment reaches our army. Only those who do their utmost can prove their loyalty, and those who cannot will be out soon enough."
 SAM_i_remember_our_pact_kaminski: "Remember Our Pact, Kaminski?"
 SAM_i_remember_our_pact_kaminski_desc: "Ah, Kaminski, we have worked together for over 20 years. I supported your cause in the Moscow Directorate, and you helped me against Vlasov's forces. Now Vlasov is gone, but my work has only just begun.\n\nOur pact remains in effect until I unify all of Russia. This is the moment when we can truly see how reliable a partner is - and you, without doubt, are a reliable one. Business partners should support each other, especially after making promises. I ask for no charity, only a fair return.\n\nPay no mind to the complaints and whispers of your subordinates. They are irrelevant now. I await your reply. Trust me, Kaminski, I will not forget your contributions."
 SAM_how_else_do_i_educate_them: "How Else Do I Educate Them?"
 SAM_how_else_do_i_educate_them_desc: "Modern leaders communicate with the people not just through speeches, but through the written word. Newspapers are an older medium, but in this desolate Russia, they remain the only way people get information. The *Speaker* newspaper, as a proper National Socialist news source, has performed excellently, and I am quite proud of it. However, most of the public still knows little about it.\n\nIt is time to change that - and in a way that gets attention.\n\nStories don't need to be true to achieve the desired effect. We will stage a \"terrorist attack,\" and the newspaper will expose the culprits as communist terrorists. With some clever tricks, careful planning, and a useful narrative, I can not only dominate public opinion through the media, but also eliminate some troublemakers in the process."
 SAM_for_your_stab_in_the_back_you_will_die: "You Will Die for Your Stab in the Back"
 SAM_for_your_stab_in_the_back_you_will_die_desc: "Laziness, betrayal, failure.\n\nThese results are unacceptable. The war is being lost, and this cannot continue. So who is responsible? My only mistake was trusting some people I have long relied on. Now their incompetence is exposed, clearly unfit for their positions.\n\nI will not lose this war, and those who dragged us to this point will pay.\n\nWhoever caused this disaster, they must be dealt with publicly. Their positions will be filled by truly loyal and capable patriots. Once the rot in the state is purged, our path to victory will be unstoppable."
 SAM_cant_say_no_to_all_the_lights: "The Glare You Can't Refuse"
 SAM_cant_say_no_to_all_the_lights_desc: "The army advances, victory follows victory. Every city taken, every pretender struck down, proves we are unstoppable, that our victory is destined.\n\nThis once-insignificant little state now strides firmly toward glory. All of West Russia lies under our control. Whether democrats, communists, monarchists, or pretenders, none can stand against the army and state I have built. Some say it is too early to celebrate, advising caution - but why listen to them?\n\nNo! We will celebrate this destined victory. Let all who walked this path share in the fruits and joy! At all costs, let all Russia hear this news - let them despair, for they know I have won."
 SAM_a_kingdom_almost_made: "A Kingdom Almost Made"
 SAM_a_kingdom_almost_made_desc: "Everything has settled.\n\nDissenters silenced, traitors purged. Those who stood in my path have been crushed by my army, one by one. Obstacles overcome. They thought I couldn't hear, whispering in secret, questioning, doubting, plotting, fearing.\n\nNow those whispers have been silenced. West Russia is mine.\n\nThis kingdom is built on solid foundations, the road ahead bright. This is only the beginning. The west is in my grasp, but the whole country awaits my conquest. My vision is clear, the path defined, and now no one can stand in my way."
 SAM_Smuta_Zykov: "The Time of Troubles - Zhukov"
 SAM_all_these_dreams_and_hopes_of_mine: "All These Dreams and Hopes of Mine"
 SAM_all_these_dreams_and_hopes_of_mine_desc: "Zhukov now stands above Bunyachenko and Artseulov, second only to Vlasov in the ROA. Zhukov has worked tirelessly for this - and now is the time to use his new authority.\n\nThe original vision of the ROA - a force for a free, democratic, anti-communist Russia - is buried under layers of corruption. Every reform Zhukov implements, every blow against German collaborators and militarist factions, every enemy we crush completely, will burn away that corruption. Our reforms include separating military and civilian authority, gradually introducing bottom-up elections, and transforming our fledgling government into a soaring eagle!\n\nStill - we must remain vigilant. Vlasov's favor is not enough to protect us from the collaborator factions, and his power will erode with age. If our regime is to survive, we must seize that power quickly."
 SAM_my_party_but_where_should_you_be: "My Party, But Where Should You Be?"
 SAM_my_party_but_where_should_you_be_desc: "The KONR is too central to the current administration to be kept as is. Hardline generals of the ROA and their cliques litter its ranks, making the risk of a move against Zykov too significant to ignore. As we transition to a civilian administration, so too must the KONR. It will realize its vision as a real political party of sorts, with Zykov front and center - and the placement of others within it entirely under his discretion.\n\nThe question remains of where Vlasov himself will fall within this new hierarchy. A powerless figurehead? An eternal President? Or merely an advisor to he who truly holds all the cards - Miletiy Zykov.\n\nWhatever the case, his place will, in all practical sense, be the same - powerless and only serving our ends."
 SAM_as_our_first_and_foremost_chairman: "As Our First and Foremost Chairman"
 SAM_as_our_first_and_foremost_chairman_desc: "While it could be argued that Vlasov's decision to serve as head of the ROA and KONR was one based entirely on his own survival - as most of his actions may have been - he has still been instrumental in the formation of a new Russia, and will be remembered primarily for that reason. His misgivings and mistakes will fade with time - that Zykov can make sure of.\n\nFor these reasons, Vlasov will stand as a figurehead of the new party, its honorary leader and first Chairman. Of course, all the power will lie with Zykov, but Vlasov's credentials and sway over the KONR will only strengthen our position.\n\nWhile this isn't the case today, perhaps in a few decades he will be seen as a titan on the same level as Peter the Great or Alexander Nevsky. A little propaganda can go a long way."
 SAM_you_can_provide_advice_thats_all: "You Can Provide Advice, That's All"
 SAM_you_can_provide_advice_thats_all_desc: "Outside of our little corner of Russia, and even within it - Vlasov has not been a popular figure. Many see him as instrumental in the continuation of Russia's new Time of Troubles, allowing the Germans to triumph over the nation, whether Bolsheviks controlled that nation or not.\n\nSidelining Vlasov into an unimportant and purely ceremonial role could help dispel some of the stigmas many Russians have of KONR, and show Zykov as a fresh face, divorced from the controversial decisions of the past.\n\nOf course, this isn't the main reason for sideling Vlasov. His previous command over the ROA serves as a threat to Zykov's newfound power. Isolating the Old General can only help Zykov tighten his grip on the new party, and show it as a truly new force - one fighting for a free and just Russia."
 SAM_popular_structures_of_freedom: "Popular Structures of Freedom"
 SAM_popular_structures_of_freedom_desc: "Zykov's relaxation of previous political restrictions has quickly led to the formation of new dissident parties, who represent both a threat and an opportunity.\n\nTheir presence helps legitimize Zykov's turning of a new leaf, and their opposition to Nazi collaboration and stratocracy align with Zkyov's, and allow him another bulwark against his real opponents. Of course, these new parties could serve as an outlet for public dissatisfaction with Zykov's new regime, but he will never let it come to that.\n\nThese new parties should be allowed to blossom under a watchful eye - for now at least. Zykov's proactive reforms have earned him near immunity from any critique. Attacking him would be seen as political suicide. Dare these parties defame Zykov - they will be destroyed at the ballot box, and perhaps more covertly - through Zykov's hand."
 SAM_spokespersons_of_national_defence: "Spokespersons of National Defence"
 SAM_spokespersons_of_national_defence_desc: "As our statelet transitions from military to civilian, the question arises - where should all those former military men go? It is best to keep them around in some capacity. After all, we have a country to reunify and wars to fight, but this must be done in a way to minimize their political power. Thus Zykov has decided to allow these groups their own parties outside of the main KONR, and some token representation to satiate their lust for power, while conceding little of it ourselves.\n\nNow that the Germans that back Artsezo, and the militarists that back Bunyachenko, are sectioned off, these two can be further marginalized until none of the old ROA can truly threaten Zykov's position again. They will have an outlet to speak their minds, but this will lead nowhere, only legitimizing the portrayal of a fair and open society. Whatever they try, Zykov will endure!"
 SAM_a_peoples_army_not_a_militia: "A People's Army, Not a Militia!"
 SAM_a_peoples_army_not_a_militia_desc: "Despite our efforts, the ROA remains far too strong of a force. To further mitigate their influence on our burgeoning statelet, we must go further! The ROA still lies somewhat outside the civilian government and should be brought into it. The President will now control several of its previous functions directly, and many of its former officers will be demoted to meaningless positions. Furthermore, to create a counterweight against the ROA we will establish further non-ROA brigades - we cannot entirely rely on a bunch of German sympathizers and opportunistic generals!\n\nWe must be cautious. Moving too fast could upset the frail balance that makes up our government. Losing the faith of the ROA membership now could see defeat against the adjacent statelets, or worse - an attack from the inside."
 SAM_an_overarching_party: "The Overarching Party"
 SAM_an_overarching_party_desc: "Our blossoming political scene has given those originally less sympathetic to our regime far more faith in its ability to represent them. While a great benefit to stability in the short term, perhaps this has gone slightly too far. The new political parties will be permitted to continue, but now they will exist under the broader umbrella of Zykov's new KONR.\n\nThis will strike a balance between genuine democracy, particularly on the local level, while maintaining Zykov's grip. As Russia continues to endure its time of troubles and constantly warring, a fullscale democratic society is simply impossible. Our people should be grateful for what voice they have."
 SAM_guiding_and_aligning_my_people: "Guiding and Aligning My People"
 SAM_guiding_and_aligning_my_people_desc: "Zykov is a master at influencing public opinion. This was his job after all! Now this job is even more important. Crushing dissent with force does not fly anymore and will not be necessary in Zykov's Russia. Still - with the liberalization of our political system, the ideas of the people need to be guided and molded, aligning with Russia's best interest.\n\nForce was still necessary when a military junta ruled us, but now public opinion is a far more powerful tool. With promises of democracy - even if just a mirage, Russians will be far more engaged in the well-being of our statelet and become far more susceptible to the propaganda that Zykov expels."
 SAM_vote_for_resources_elect_your_security: "Vote For Resources, Elect Your Security"
 SAM_vote_for_resources_elect_your_security_desc: "The Russian people are not used to democracy. Only for a brief few months in 1917 did they snatch a whiff of it - before the reds seized on it. If we truly wish to create a free and democratic Russia, its people must be weaned onto democracy starting from the bottom up. Local elections and referendums will help motivate the people, as they'll see the impacts of their decisions in real-time - and be less impacted by the ongoing integration of the rest of our fractured motherland as national politics would.\n\nOf course, this is only half the reason for keeping the democratic process at lower levels. Fractured and disparate local jurisdictions prove little threat to Zkykov's government at the top. Perhaps one day, the Russian people will have a complete democracy - but this may not come for some time yet."
 SAM_fill_those_vacant_positions_now: "Fill Those Vacant Positions Now!"
 SAM_fill_those_vacant_positions_now_desc: "A new democracy brings a new bureaucracy. One with ample positions at every layer of government - with some more meaningful than others. This grants us an opportunity to deal with our opposition - not by 'disappearing them' or throwing them out - but by simply delegating them to meaningless positions and barraging them with books, not bullets. Seeing such 'luxurious' treatment of many dissidents can further restore the faith of Russians in our government, knowing we genuinely care about the values we espouse.\n\nDeeply embedded in the bureaucracy, we will always have eyes on our enemies - with loyal officials surveying their every move, a move against us will be impossible, and we can turn our eyes outwards to the threats that lie beyond our borders. Granting more opportunities to expand this new bureaucracy even further."
 SAM_every_regime_has_its_outliers: "Every Regime Has Its Outliers"
 SAM_every_regime_has_its_outliers_desc: "Citizens of our new republic have noticed the loosening of our grip. More and more people are beginning to speak out - first as a whisper and, for some, eventually a shout. Still, much of the public continues with their lives, passively supporting the regime. While this tumor remains benign, it could cause far more harm extracting it now. In fact, having a group of outliers criticizing the regime could be beneficial - seeing their cries of dictatorship and repression be answered by silence would show them as the fools they are.\n\nWhen Zykov liberates the rest of Russia while dissidents peck at his feet - it will only further prove our strength and our tolerance. Any other bolshevik or idiosyncratic megalomaniac would've mowed them down by now - they are lucky to live in such a free society."
 SAM_how_much_power_do_you_want: "How Much Power Do You Want?"
 SAM_how_much_power_do_you_want_desc: "Money, for good or for ill, talks. The corporations and big businesses of Samara have traditionally been in the pockets of Artsezo, but with the kleptocrat sidelined, their allegiance is up for grabs."

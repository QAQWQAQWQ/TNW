 murmansk.11.t: "Heroes of Murmansk"
 murmansk.11.desc: "Rumors have spread from Eastern Karelia, once our territory. When Operation Barbarossa occurred, the backstabbing Finns stole our land. Now it seems they cannot hold onto their ill-gotten gains. Though naive people have always fed us stories about a 'great Russian uprising' in our occupied lands, this gossip seems more real than those before.\n\nThis is especially true of Murmansk, where the people hate the Finnish occupiers with a passion. If action is not taken, Helsinki seems to face a large-scale rebellion - judging by their political climate, they will struggle to handle such a thing. Yet when God closes a door, He opens a window. Some of the leading members of the Murmansk separatist movement have reached out to us, hoping we will give strong support to their coming struggle against the Republic. Commander, we should seriously consider this proposal; if we give them our full support, their chances of success increase - who can say they do not wish to return to the embrace of the Russian motherland?"
 murmansk.11.a: "Russia will be reunited, no matter what..."

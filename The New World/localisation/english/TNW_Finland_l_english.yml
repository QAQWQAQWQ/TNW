 FIN.125.t: "Finnish Cowardice"
 FIN.125.desc: "We gave our loyalty for peace and security. In return, we were given the chance to reunite with our loved ones. Yet today, from on high in Helsinki, an incomprehensible order has been handed down - to surrender to the Russians when we hold every advantage. Their attitude is arrogant and dismissive, treating us as a sacrifice to be discarded at will.\n\nAt High Command, everyone is bewildered by this decision. We are making Russian rivers run red with blood, yet they cannot break our lines. Has Finland lost faith in victory? Do they think it not worth sacrificing noble Finnish blood for those 'poor Russians'? Has the Helsinki leadership lost its mind?\n\nIf Finland chooses to surrender and abandon us, it will provide the Russians with a just and hopeful reason to 'recover their lost lands.' Perhaps this government, compared to those arrogant Bolsheviks and fascists, has truly chosen the wiser course. The soldiers await the general's order; they have prepared thoroughly for this campaign, vowing to water this cruel final chapter with their blood. But now we are alone; Finland provides no support, and we can only rely on ourselves to build our final resistance. But is this bloody, cruel, and futile battle really worth it? Perhaps we should seize the opportunity of Finland's withdrawal and the formation of a new government, lay down our arms, and embrace peace."
 FIN.125.a: "May the new Russia be more merciful than the last."
 FIN.125.b: "We will not go quietly into the dark! We will not retreat without a fight!"
 POLITICS_JUHA_RIHTNIEMI_DESC: "There are two types of politicians - the noisy performers who embrace noisy policies, and the quiet workers without whom governments around the world would collapse in an instant. Juha Rihtniemi is one such man, deeply patriotic, from a family deeply involved in politics, focused on the people's welfare and his own interest in fully incorporating Eastern Karelia into Finland.\n\nWhen the German economy collapsed and the National Coalition Party leadership was all mud-stained, Juha kept his hands clean. As a diligent and experienced civil servant, he handled the West Russian War calmly and methodically, and was elected President with 72% of the vote.\n\nDuring his presidency, Juha has developed the country steadily and firmly, though it still walks a tightrope between the German colossus and the recovering Russian remnants. Though he authorized massive funding for Finnish forces in Onega to counter the Russian threat, it is obvious that Finland's old enemy will sooner or later return to seize Karelia from the motherland. To this end, his government has strongly supported programs to teach Finnish to Karelians, settle large numbers of Finns in the region, and expel remaining Russians."
 FIN_Parliament_Text: "[?FIN_temp_parliament_coalition_seats]/200"
 FIN_An_Unsatisfactory_Answer: "An Unsatisfactory Answer"
 FIN_An_Unsatisfactory_Answer_desc: "Karelia and Murmansk have finally returned to the Finnish motherland - a moment for national celebration!\n\n...Or so it should be. In reality, these two lands have not brought glory, but instead become a financial black hole and a governance nightmare for the nation. Red partisans remain active in the forests; though most of Karelia's 'non-native' population has been expelled to the Onega region, Murmansk remains a Russian thorn deep in the nation's ribs. As long as these problems remain unresolved, the 'Eastern Question' will exist forever, and our current solution will likely be unable to protect everything built over two decades when the Russians return."
 FIN_Second_Crisis_Of_Democracy: "Second Crisis of Democracy"
 FIN_Second_Crisis_Of_Democracy_desc: "On the surface, the Patriotic People's Movement is merely a small party lingering at the political margins. Yet this far-right organization and its fellow travelers always draw strength from... some mysterious source - they apply iron-fisted pressure on politicians without government authorization, clear partisans in the East on their own, and weave invisible threads in the shadows of the halls of power to manipulate politics. This shadowy support makes the actual influence of the Finnish far right far greater than their parliamentary seats suggest. The seats on those statistical tables are merely a smokescreen to confuse observers, hiding the tremendous power wielded by this uncrowned group."
 FIN_The_Growth_Regime: "The Growth Regime"
 FIN_The_Growth_Regime_desc: "Among Germany's sphere of influence and neighboring countries, Finland is an economic anomaly. Its export system features technologically advanced industrial and agricultural products; state enterprises working with banks and design firms are disciplined and highly competitive; and a high national savings rate has driven Finland's economy to leapfrog growth. Add Russian resources flowing in from the newly acquired eastern territories and through the Onega corridor, plus close cooperation with Sweden in exports to Germany, and this Nordic country, called by international observers a 'success story in the gloom of the European economy,' is creating its own miracle."

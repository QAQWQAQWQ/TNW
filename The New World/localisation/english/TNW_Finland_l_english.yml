 murmansk.21.t: "Let the Hounds of War Run Free"
 murmansk.21.desc: "The rebellion has begun. This time our sources were correct: an uprising against the Finnish army has driven them out of the Kola Peninsula and, in passing, cleared Murmansk city. To be sure, this is itself a glorious victory, but it is only the beginning. We have landed a blow - good - but what next? This is only the first phase of the duel between the two sides. Russia and Finland will clash once more, and this time our compatriots will not be alone.\n\nThe port of Murmansk has always been the primary port of call for foreigners and supplies. This time, Murmansk will become the home of returning expatriates. Our volunteer army has completed training and can fight alongside the brothers of the Murmansk People's Republic. It is these forces that will meet the main Finnish army head-on and destroy it, while enemy remnants are pinned down by Murmansk partisans until they have no choice but to withdraw from the territory they conquered. Afterward, the humiliated Helsinki will have no choice but to return Murmansk and Eastern Karelia to Russia before the whole world - lands that have always belonged to us."
 murmansk.21.a: "Dispatch the army..."
 RUS_MPR_volunteers_tt: "We may now send §YVolunteers§! to help [MPR.GetNameWithFlag] against §WFinland§!.\n\n§RIf [MPR.GetNameWithFlag] is defeated, we will be unable to recover Karelia!§!\n"

 murmansk_peace.1.t: "Finland Proposes Surrender"
 murmansk_peace.1.desc: "The diplomat representing the Finnish government has reached out to us once again, offering to surrender to us. This time they have fully accepted our demands, proposing to hand over Murmansk, Onega, and part of Karelia east of Vyborg. This will restore our control over the Arctic ports, and millions of Russian expatriates will return to the motherland.\n\nOur legitimate territory has been recovered, and the problems of military hegemony have been thoroughly resolved by our defeat of the Finnish armed forces; this is all we have gained from this war. It is a decisive victory, the Russian nation has returned to the world stage, a precious region has been liberated, and a foreign opponent has been thoroughly defeated; things are looking up. However, due to the threat of German intervention, we cannot continue pushing deep into Karelia; now that the main objectives have been achieved, accepting their proposal is the wise choice.\n\nMake peace with the Finns, and turn our attention to the East next. Murmansk is only the beginning; soon, all of Russia will be united under our banner."
 murmansk_peace.1.a: "Excellent!"
 murmansk_peace.2.t: "Russia Has Accepted Our Surrender!"
 murmansk_peace.2.desc: "Our diplomats have returned and informed us that the Russians have accepted our unconditional surrender. All of Karelia east of Vyborg and Murmansk will be returned to them. Such losses are devastating for our nation. Decades of work to restore the Finnish population in our eastern territories, and the enormous investments in those regions, have all vanished with the war's defeat and the loss of territory. Yet such sacrifices were necessary to preserve any form of independent Finland, which is why we have made them. Our once bright and glorious future is now slipping away from us, because once again, Finland lives in Russia's shadow."
 murmansk_peace.2.a: "We were too greedy."
 murmansk_peace.3.t: "Finland Has Offered a Ceasefire"
 murmansk_peace.3.desc: "Our soldiers failed to break through the Finnish lines as we hoped, and with Murmansk's allies defeated, our army's morale has begun to waver, with defeatism spreading through our leadership. The Finns have offered us a way out of the conflict; though not a dignified one, it still brings benefits. They propose ceding Onega to us in exchange for a ceasefire and the full withdrawal of our forces from Karelia.\n\nShould we accept the terms they have offered, or reject them outright and fight for greater gains with our morale so low?"
 murmansk_peace.3.a: "Agreed."
 murmansk_peace.3.b: "Rejected."
 murmansk_peace.4.t: "West Russia Has Accepted the Ceasefire"
 murmansk_peace.4.desc: "temp loc"
 murmansk_peace.4.a: "people probably won't see this"
 murmansk_peace.5.t: "West Russia Has Rejected the Ceasefire"
 murmansk_peace.5.desc: "more temp loc"
 murmansk_peace.5.a: "seriously though who's going to see this"
 murmansk_peace.6.t: "Finland Requests a Ceasefire"
 murmansk_peace.6.desc: "Our soldiers did not break through the Finnish lines as expected, and we fought with all our might yet could not tip the scales of victory in our favor. The Finns, relying on their fortified lines and strength, have proposed an armistice to restore the pre-war status quo. Their proposal is backed by Germany, which has announced that if we refuse, the Pact may immediately intervene.\n\nThey propose ceding Onega to us in exchange for a ceasefire. The conflict is currently deadlocked; Finnish mobilized reserves grow by the day, and considering our losses (both in equipment and manpower) and the mounting international pressure, we are unlikely to achieve our strategic objectives.\n\nWe have no choice but to accept this bitter fruit, and hope that one day we may recover the lost lands by other means."
 murmansk_peace.6.a: "Where did things go wrong?"
 murmansk_peace.7.t: "West Russia Has Accepted the Ceasefire"
 murmansk_peace.7.desc: "temp loc"
 murmansk_peace.7.a: "people probably won't see this"

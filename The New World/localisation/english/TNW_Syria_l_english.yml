 POLITICS_SNS_COUNCIL_DESC: "The Syrian National State is nothing more than an abandoned orphan.\n\nIn exchange, the Syrians agreed to stop supporting the Germans in return for Turkish guarantees of independence, and they watched with trepidation as Turkish soldiers marched through the Azm Palace, with no German help in sight. In the land where the anti-French uprisings once erupted, the Syrian National State was established under the Turkish shadow — and later NASIL was born to resist the Syrian State.\n\nThe National State played a crucial role in the 1952 Iraq War, when Turkish forces were bogged down in Iraq, until a Syrian officer named Tayfour Salkhan proposed a plan to invade Iraq directly from Syria, which would have won the war in one stroke. But Salkhan was soon assassinated by NASIL, and the National State responded with brutal repression — political persecution, military force, and even public executions — to crush dissent and anti-Turkish sentiment across the country.\n\nToday, the National State is controlled by a council of Husni al-Za'im, Adib al-Shishakli, Fawzi Selu, and Sami al-Hinnawi, each with their own ambitions for Syria. Yet the remnants of NASIL still whisper in the shadows, plotting to strike again; their conspiracies are undoubtedly a threat, ready to topple the already unstable National State government at any moment."

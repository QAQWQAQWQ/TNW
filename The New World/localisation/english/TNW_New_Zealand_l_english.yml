 NZL_Culture_War:0 "Culture War - British Dominance"
 NZL_Culture_War_desc:0 "New Zealand's lifeline is the vast Pacific. Imports from the American market are vital to the New Zealand economy. Thus, American cultural influence is particularly visible here.\n\nFor now, the Union Jack flies over New Zealand's skies, and British culture still holds sway. Yet when people turn around, whispers laced with contempt can occasionally be heard: are we truly the 'white trash of the Pacific'? Or are we simply bravely holding to our traditions?"
 NZL_Establishment:0 "A Better System"
 NZL_Establishment_desc:0 "Since the proclamation of self-governance in 1907, our government has sought to represent and benefit the good people of New Zealand. Thus far, Wellington has done well: stable government, harmonious parliamentary relations, and sufficient public trust in our political institutions. So long as this peace endures, New Zealand will remain a bastion of political stability for decades to come."
 NZL_Onto_World_Stage:0 "Onto the World Stage - Torchbearer"
 NZL_Onto_World_Stage_desc:0 "Whether as a pivotal superpower or an inconsequential observer, one must hold high the torch of freedom across the globe - this is the cornerstone of New Zealand's current foreign policy. They eagerly join the OFN in crusading against fascism worldwide, living this ideal. Though New Zealand is a small nation, its international influence sometimes extends beyond its own control."
 NZL_Social_Fabric:0 "Social Fabric - Intact"
 NZL_Social_Fabric_desc:0 "New Zealand's social fabric holds the nation together, yet many dangers threaten to tear it apart.\n\nFortunately, the foundations of New Zealand remain intact. The people are united and hopeful about the nation's future. So long as New Zealand's social fabric survives, we will never sink into darkness and despair."
 POLITICS_KEITH_HOLYOAKE_DESC:0 "Keith Holyoake is known for many things - his calm demeanor, his heavy accent, and his reputation for excessive politeness. Born in rural New Zealand, he is the son of a businessman-turned-farmer. In 1932, he joined the rural-focused Reform Party, quickly rising as one of its rising stars and playing a key role in reforming it into the modern National Party.\n\nAfter serving as Prime Minister in the first National government, Holyoake stepped down after National's 1957 election defeat, following former Prime Minister Sidney Holland's 1956 resignation. After three years as Leader of the Opposition, he won the 1960 election and returned to the premiership in his own right.\n\nHolyoake advocates maintaining strong defense against the ongoing Japanese threat. At the same time, his government has begun pushing a progressive social agenda, including abolishing the death penalty and expanding Māori rights. With the 1963 election looming, Holyoake hopes New Zealand will continue to support his vision."
 NZL_Keith_Lindsay_Stewart:0 "Keith Lindsay Stewart"

 RIF_Mohamed_Choukri:0 "Mohamed Choukri"
 POLITICS_MOHAMED_CHOUKRI_DESC:0 "Mohamed Choukri never imagined he would be a politician; he preferred writing and education. However, due to the Iberian chaos, he now finds himself as president of the small Rif Republic. Born into famine, his family fell apart, leaving only an abusive father. Choukri's past was filled with nothing but hardship — homelessness, drug abuse, prostitution, or poverty — these were the themes he wrote about with such passion. His masterpiece, "For Bread Alone," is an autobiographical account of his childhood, detailing his struggles with such heartfelt detail that it reveals the strength and determination of Choukri's character, conveying it to the people he now leads. He only learned to read and write in his twenties, but Choukri achieved great things in a short time, and how far he will go remains to be seen.\n\nChoukri's upbringing resonated not only with the people of the Rif, but also with all of Morocco, who had witnessed the lavish lifestyle of the Alawite dynasty, contrasted with their own poverty. Even so, his experiences with drug abuse and prostitution still shocked many zealous imams and the general public. Now, as the nominal leader of the Rif Republic, Choukri has set his goal as establishing democracy throughout Morocco, and ensuring that children never have to experience the squalor of his youth. But whether this is possible depends on his ability to balance the various political factions vying for power within the young republic, as well as his ability to win public support — something essential for building an army to march against the tyrannical despot, Hassan II."

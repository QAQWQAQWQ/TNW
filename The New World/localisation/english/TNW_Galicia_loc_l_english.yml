 GAL_Alvaro_Cunqueiro:0 "Álvaro Cunqueiro"
 POLITICS_ALVARO_CUNQUEIRO_DESC:0 "Álvaro Cunqueiro, son of a pharmacist, born into humble origins, is a hero to supporters of the Galician independence cause and a traitor to many others. In 1927 he abandoned his studies in philosophy and literature at the University of Santiago de Compostela to pursue a career in journalism. Noticing his talent, several newspapers and magazines, such as O Galego, hired the young writer. However, living in a divided republic, he was inevitably drawn into politics, reaching his peak when he became a founding member of the Galician Party or Galician National Party. During the Civil War, he was exposed to more nationalist politics, this time in the form of Spanish nationalism, as he began writing propaganda for the Falange. However, he never lost his convictions, continuing to secretly contact other independence activists, and the new Civil War provided the perfect opportunity for him to pursue his cause.

The Galician local elite realized that their personal influence was insufficient to unite a new nation against the enemy, so they began looking for someone else. The final crisis deliberation nominated Cunqueiro, whose charisma among the people and the support he enjoyed were crucial. Now, he leads the secessionist movement, standing at the pinnacle of power in the Galician Republic. However, he considers himself not a politician, but simply an ordinary writer, which seems to prove that once the conflict ends, he will not pursue leadership. For now, he is the perfect figurehead leader, beloved for his writings and highly skilled in the art of propaganda."

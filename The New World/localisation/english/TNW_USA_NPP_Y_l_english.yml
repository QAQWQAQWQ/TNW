 USA.1705.t:0 "Yockey's Inauguration"
 USA.1705.d:0 "The nation is in deep shock, and riot police line the streets of Washington D.C. Francis Parker Yockey ascends Capitol Hill to take the oath of office as President of the United States. Though surrounded by jittery Secret Service agents, the new leader of the National Progressive Party appears confident. Through countless obstacles, his plans have finally borne fruit, and America awaits his inaugural address.\n\nThose gathered around the dais are not as distinguished as one might expect; most are not the kind of figures normally invited to an inauguration. The Commonwealth League has boycotted the ceremony, and most within his own party have refused to attend. Aside from a small delegation from Germany, foreign guests are few. The guest list consists mostly of his most fervent supporters. Yockey's campaign manager, Lafayette Washburn, offers a victory smile to the cameras, while behind-the-scenes financier Harold Keith Thompson deftly avoids the lenses. The newly sworn-in Vice President, Louis Byers, shakes hands and signs autographs for Brownshirt supporters. Press Secretary Willis Cato and freshman Representative Fred Huntley converse with each other, while Admiral John Crommelin's stern gaze sweeps the crowd, searching for signs of danger.\n\nThe onlookers are divided into three groups. The first sympathize with the dark-horse candidate, pleased to see such a figure reach this pinnacle after decades of effort, and hope America will take shape under his vision. The second have come to exercise their First Amendment rights, fearing these may be stripped away before the next inauguration. Finally, a line of Capitol Police separates the two. Cheers and chants mingle across the divide, becoming indistinguishable.\n\nAs Yockey ascends the steps, the din only grows, becoming a storm of discontent, rising with the wind that stirs the pages of his speech. The Chief Justice hands him the book: Imperium, Yockey's magnum opus of geopolitical culture theory.\n\nIgnoring the weary justice's disdainful glare, he places one hand on the book and repeats the oath.\n\nThe President withdraws his hand, turns to the audience, and begins his address."
 USA.1705.a:0 "Those who sleep have no American dream."
 POLITICS_YOCKEY_DESC:0 "Francis Parker Yockey is a president no one expected; until he took the oath, almost no one believed he would win. Yet now, after what may be the most controversial election in American history, a thoroughgoing fascist occupies the Oval Office. Yockey began as a writer and philosopher, fascinated by the authoritarian and fascist movements of the 1930s. While studying law, Yockey became deeply absorbed in the works of Adolf Hitler and embraced the antisemitism and extreme militarism propagated by the Nazis. After producing what he considered his magnum opus, Imperium: The Philosophy of History and Politics, Yockey founded the extreme right wing of the National Progressive Party and made waves in American politics. Yockey originally called himself and his followers the 'American Vanguard' within the NPP. But soon enough, Yockey and his American Vanguard were attacked and reviled by the rest of the American political spectrum, who simply called them the 'Sovereigntists.' Yet in this environment, Yockey led his Vanguard to defeat his political rivals and, with Lady Luck's favor, was elected President of the United States.\n\nYockey's ascent has caused quite a stir. In many American cities, especially in the South, Klansmen march openly in white robes. Some have already begun openly calling for the repeal of the most landmark American legislation of the past twenty years - the Civil Rights Act - and lynchings of Black Americans are increasingly ignored by police. In short, racial hatred has become commonplace under Yockey's America. Yet both establishment politicians and ordinary citizens fear this authoritarian tide.\n\nThough Yockey is the master of the world's mightiest free nation, he himself is evasive and dismissive about the meaning of 'freedom.' Many believe that however democratic and free America may appear on the surface under Yockey, he remains a thoroughgoing fascist who will do everything in his power to strengthen presidential authority. Yockey himself claims he only condemns those who 'distort culture,' and asserts that Western civilization needs his protection. As yet, Yockey has not made clear exactly whom he wishes to protect Western civilization from. Cloaked in a star-spangled banner emblazoned with the cross, Yockey sits in the Oval Office, ready to impose his will upon America."
 USA.yockey.1.t:0 "Uncle Sam Can No Longer See the Light of Day"
 USA.yockey.1.desc:0 "\"This is the CBS Evening News, with Walter Cronkite...\"\n\n\"Good evening. Tonight the Senate, by a decisive margin, finalized the President's cabinet. As the first president elected from the NPP's American Vanguard, Yockey's path to power has been anything but conventional. Here is today's news:\"\n\nAfter a deep breath, Cronkite continued: \"First, Vice President Louis T. Byers addressed the Senate, declaring: 'Today is a great day for all the American people. We have secured the nation from the Zionists, the communists, and the countless dangerous characters lurking in the shadows, who would poison our youth with that deranged, criminal leftist ideology that leads us down the road to serfdom!'\" Cronkite frowned slightly, adjusting his glasses, an ineffable fear welling up inside him.\n\n\"After confirming Rivero P. Oliver as Secretary of State, Treasury Secretary Harold Keith Thompson addressed the Senate, announcing that, under the President's wise prerogative, he would assume responsibility for managing the economic life of the American people. 'No one can say this is an easy task, but while some would shirk this burden, I will bring to this nation unity and strength - with Vice President Byers' fervor, Secretary Oliver's fearlessness, and the force of incoming Defense Secretary Kormilun!'\" Cronkite slowly ran a hand over his face, the celebrated journalist choosing silence as the flickering screen crackled.\n\n\"We have also learned that Rear Admiral John G. Crommelin addressed the Senate today, stating: 'It is good to be able to serve this great nation as Secretary of Defense. The Jews and liberals have undermined the very core of our military, and I hope to work hand in hand with the President to bring security to this country.'\"\n\nCronkite stared at a corner unlit by the flashbulbs; while everywhere else was bright as day, America was shrouded in blackest night. The tough journalist was speechless, able to utter but one sentence:"
 USA.yockey.1.a:0 "\"God bless the Union, and goodnight, America...\""
 USA.yockey.2.t:0 "Urgent Telegram"
 USA.yockey.2.desc:0 "The dial spun once, twice, ten digits, ten seconds - if he weren't terrified out of his wits, Regulus Phillips could have dialed this number in half the time; he'd been calling it for five years.\n\nOne second, two, three, ten. The man gripped his cherry-red receiver tighter. Finally the line connected, and he exhaled. \"Sarah, it's me, Reggie. Get Chief Evan on the line - something terrible is happening, the Committee has to act.\"\n\n\"Who is this?\"\n\nPhillips' eyes widened. This was not Evan's secretary - hell, it wasn't even a woman. \"Oh - uh, this is Regulus Phillips, sir,\" he stammered. \"This is Committee Member Evan Winters' private line, isn't it? May I speak with him?\"\n\n\"Winters? That race traitor?\" came a heavy, mocking laugh. \"That boy won't be bothering anyone ever again, I can assure you.\"\n\nThe truth, spoken slowly, sent a chill through Phillips' bones. \"So that's how it is. Let me tell you something, friend: whatever your urgent business, the answer is 'yes.' Polling places in Cook County are closing one by one; the votes of riffraff don't count. Don't even think about pulling any mail-in ballot tricks - either you vote in person like a man, or your vote is void.\"\n\n\"But don't be too down, kid - this is all for the greater good.\""
 USA.yockey.2.a:0 "After the 'kind words' and mockery, the line went dead."
 USA.yockey.3.t:0 "Eclipse of the Electorate"
 USA.yockey.3.desc:0 "How oppressive can the weather get? Gravowas wondered as he breathed in New Orleans' humid sea air, feeling sweat drip onto the hand he held with his girlfriend, Lily Babineaux. The storm clouds brewing above did nothing to alleviate the heat wave gripping southern Louisiana.\n\n\"First time voting, first time voting, my God, how exciting! I know we missed out on the presidential race, but voting for Congress can't hurt, right, Lily?\" Thomas said.\n\nLily nodded and smiled, pleased, but as she watched more and more whispering couples head toward the polling station, a vague unease stirred in her chest.\n\n\"I mean, think about it - we've got the Republicans, the Democrats, the NPP factions... uh, I know President Yockey isn't the most popular among us, and I'm not going to force you to vote for any-\" Gravowas said, before being cut off by a screaming police car racing by.\n\n\"I don't know, Thomas. Are we sure today is really a good day to be voting? I know it's important, but something's off. I'll bet you can feel it too.\" The storm clouds rumbled thunderously. They paused for a moment, sweat still streaming down their foreheads.\n\n\"At this point, honey, I know it's a headache, but we have to do our best for our country - the one our fathers served-\"\n\n\"Thomas...\" Lily whispered.\n\nThe two looked up. The joyous scenes of election seasons past were gone. No barbecues, no pins and stickers, no cheers and laughter - only helicopters and armed guards roaring overhead. Riot police stood at every station, their uniforms emblazoned with the American Vanguard insignia; the crowd shuffled forward between lines of officers on either side. Bullhorns blared, the line was watched, the people were watched, every vote watched in God's name. The young couple exchanged glances, wanting to flee all the way home, but the glint of a Vanguard officer's badge at the front of the line caught their eye - the man was waving them forward."
 USA.yockey.3.a:0 "The ballot has fallen from grace."
 USA_yockey_clan_riots:0 "§RKu Klux Klan riots terrorize cities including Charleston, Birmingham, and Savannah.§!"
 USA.yockey.4.t:0 "The End of Tyranny"
 USA.yockey.4.desc:0 "This time last year, there had been so much hope.\n\nThe congressional caucus was overwhelming enough for all the incoming representatives; for the handful of fresh Progressive caucus members, it was even worse. Jackson's defeat in the primary had crippled the party and depressed turnout, and the moderates suffered the heaviest losses. Pat Schroeder, representative for Colorado's 1st district, survived by a whisker in a bitterly contested race against both the Commonwealth League candidate and her own primary rival who refused to concede. The right welcomed them warmly with firm handshakes, but the paramilitary-aligned congressmen had not yet - though they were far from firmly in control of the party, they showed no urgency in bridging the divide.\n\n\"In these halls of Washington, anti-Western scheming has become commonplace. We have purged the corrupt from power, and now we will bring them before all clear-thinking American observers for scrutiny and judgment.\"\n\nThe President had been speaking for some time. A cranky, arrogant nobody was unworthy of the title, yet perfectly suited to tell the people what they wanted to hear. Even with power in hand, he looked anxious as he spoke, as though a single slip of the tongue could topple his regime. Without the party, they had no majority. They needed every vote they could get.\n\n\"And we hold this truth to be self-evident: after a long string of abuses and usurpations, it is our rightful due to take back what is ours. With your support, we have done so! Whatever legitimacy the traitors demand of us, we shall no longer dictate to our Southern brothers how they should enforce their laws!\"\n\nApplause thundered through the chamber. Hope was dead."
 USA.yockey.4.a:0 "The will to power is worth a thousand votes."
 USA.yockey.5.t:0 "Rats in the Walls"
 USA.yockey.5.desc:0 "Widenfeld: Did you hear Tolson resigned? Can't believe he walked out like that - especially not under these circumstances.\n\nKorsch: He'd been here a long time. Now that Hoover's gone, of course he's ready to retire too, I'm sure. You know, back in the forties he was chasing Nazi subversives all over the East Coast like everyone else at the Bureau. Now that one's in the White House, I guess we won't be doing that anymore.\n\nWidenfeld: If he hated those people so much, I don't understand why he resigned.\n\nKorsch: What's so strange about it? They're already destroying democracy, and everyone can see it.\n\nWidenfeld: No, that man won't last long. People will realize what he really is. He can't win re-election. Until then, we have to do our jobs as best we can and make sure he can't abuse his power -\n\nKorsch: You're not seriously thinking of staying on at the Bureau, are you? He's already turning the Bureau into his private Gestapo - how else do you explain orders to investigate left-wing members of his own party?\n\nWidenfeld: Well, you'd better watch out for those goons. Now that Yockey's elected, who knows what they'll do?\n\nKorsch: Right. Known communists Scoop Jackson and Margaret Chase Smith need investigating. If you stay here, you're helping the White House destroy democracy.\n\nWidenfeld: Take it easy, Harry. You shouldn't be saying that here - at least not so loudly.\n\nKorsch: You think they've started bugging the Bureau already? If so, it doesn't matter what I say. Or are you so eager to be their lapdog that you've already turned informant?\n\nWidenfeld: Hey, don't look at me. I voted for Romney."
 USA.yockey.5.a:0 "Internal FBI recording, dated [?global.date.GetDateStringNoHourLong]."
 USA.yockey.6.t:0 "Day One"
 USA.yockey.6.desc:0 "White House Press Room, 09:00: \"- Furthermore, we are pleased to announce that, after prolonged obstruction and smearing by Washington bureaucrats, the Senate has finally confirmed Admiral John Crommelin as Secretary of Defense. He is proud to serve as a public servant of the American people. He will now take your questions on the administration's defense policy.\"\n\n\"Tom Fleming, National Review. How does the President intend to address discipline issues such as the incident aboard the USS Patrick Henry last week?\"\n\n\"Well, Tom, given the state of the world, military discipline is paramount, especially when it comes to critical assets like our ballistic missile submarines. We will not tolerate anti-white protests interfering with our naval vessels, especially when we face an existential threat across the Pacific. You can ask Secretary Oliver-\"\n\n2201 C Street, U.S. Department of State, 11:58: \"- I want these instructions on the new immigration regulations sent to all our embassies by end of day. Harris, pour me a coffee. I want to be at my best when I call Germania-\"\n\n1500 Pennsylvania Avenue, U.S. Treasury, 14:04: \"I'll have the report to you shortly, Herr Fischer - there is still much work to be done, thank you for your patience. Your superiors will not be disappointed. As I've said before: mutual cooperation is in both your interests and the President's-\"\n\n1600 Pennsylvania Avenue, White House, 17:26: \"Confirming the cabinet was merely a setback for the party machine, Byers, not a significant victory for us. The enemies of the West have taken deep root in the American heart, as we saw at the inauguration. You must continue the work, spreading facts rather than the partisan propaganda that dominates and confines the American mind.\""
 USA.yockey.6.a:0 "Our work is far from over."
 USA.yockey.7.t:0 "A Giant Step Into the Breach"
 USA.yockey.7.desc:0 "Thunder rumbles over Washington D.C. The capital, last bastion of democracy, feels the wrath of the old storm gods. They rain down all manner of punishment: cold wind, lightning, and ceaseless rain.\n\n\"Well, looks like we'll be hearing some good news this morn-\" Vice President Byers said.\n\n\"I am aware. The first true step toward excising the cultural cancer has begun, Vice President Byers. This liberal engine, this disorder of the morally superior, has finally been torn apart by the mighty forces of Western civilization, along with all its filth.\" President Yockey spoke to himself, scraping a fleck of dirt from beneath his fingernail with his sharp nail. \"Vice President Byers, I implore you to take a seat in the next few minutes and hear of the American Vanguard's success in fighting the tumor of democracy.\"\n\n\"Commanders of police forces across the nation: by the authority vested in me by the American spirit and the legislative power granted by Congress, I hereby announce the authorization of Executive Order 2237, permitting enforcement of the Defend American Exceptionalism Act against all decadent media resources from across the nation suspected of lawbreaking. Protect the American spirit at all costs.\"\n\nThe President gave the Vice President a rare smile, rose, and strode to the Oval Office window behind him, standing with his hands clasped behind his back."
 USA.yockey.7.a:0 "Civilization, built upon understanding."
 USA.yockey.8.t:0 "Vanguard Troubles"
 USA.yockey.8.desc:0 "Tap, tap, tap, tap.\n\nThe door was tightly shut. President Yockey's long nails drummed on the wooden desk.\n\nTap, tap, tap, tap.\n\n\"Mr. President, I know you must be angry right now - this is clearly the work of those brainwashed commie brats-\" Vice President Byers said.\n\n\"Angry? Angry? Not at all, Vice President Byers. If you mistake the unrest in my soul for childish petulance - as Secretary Crommelin and those inbred 'patriots' scurrying around the Midwest and South do - then you do not understand me. To be frank, these Judeo-Bolshevik plots and rebellious youth are the fruits of democracy, liberalism, and the Constitution. Far more than a child's tantrum, I have come to a profound understanding of the obstacles to reshaping the world. Whether those socialists, Jews, and moral degenerates like it or not, the Vanguard is prepared to establish national socialism in this damned country. The Defend American Exceptionalism Act has failed, but the future of our soul's destiny will not be choked by liberal morality.\" President Yockey said, pacing the Oval Office before gazing out the window, where a crowd of protesters celebrated the Congress's failure to pass the Security Act.\n\n\"Vice President Byers, get me the commander of the District of Columbia National Guard.\""
 USA.yockey.8.a:0 "The horns of the devil are deadlocked... for now."
 USA_yky_72_the_yockey_presidency:0 "The Yockey Presidency"
 USA_yky_72_the_yockey_presidency_desc:0 "The American system was born with the seeds of decay, a product of the twin maladies of racial mixing and liberalism. A host of spirits, led by 'E Pluribus Unum,' continually poison the American mind. The American spirit has long since been destroyed by the multitude.\n\nThis was no accident. It was premeditated.\n\nAmerican culture should have been a sacred ancient Greek statue, but its face was disfigured by those with ulterior motives, who ruined its beauty so thoroughly that you can no longer distinguish it from a beast. America should be Western civilization, the ultimate embodiment of high culture. President Yockey is a sculptor who will polish, chisel, and carve it with his deft hands until it is restored to the height and perfection of its former glory."
 USA_yky_72_a_loyal_cabinet:0 "A Loyal Cabinet"
 USA_yky_72_a_loyal_cabinet_desc:0 "Cultural vitalism has yet to establish itself in the American mind; establishment financiers and cultural degenerates still erode the upper echelons of the American superstate. True moral, political, and cultural awakening can only be achieved by our own officials, who will smoke the rats out of their synagogues, mansions, and banks.\n\nThe obstacles before us are countless: our foothold in Congress is minimal; even the most diehard segregationists lash out at President Yockey; the cultural distorters have mobilized en masse, wielding the cudgel of anti-Western negationism to resist our rise, willing to block our path to hegemony by any means. But our will is stronger, untainted by rationalism; we will grant power to those who embody the spirit of the age, who will overcome the divisions of the American political class and crush the opposition of the inferior and the blasphemous."
 USA_yky_72_end_the_overreach:0 "End the Overreach"
 USA_yky_72_end_the_overreach_desc:0 "Liberalism: weakness spreading everywhere; a disease eating away at the body's peace; a disturbance breaking the rhythm of the cosmos. We must purge it cleanly. It was liberalism, in truth, that destroyed the American and European mind. This disease is ubiquitous, found both among the puppet masters manipulating the so-called pluralist economies and among the secular masses who form the cultural bedrock. Yet the reapers of cultural degeneracy still stir the land, seeking to contaminate high culture.\n\nTheir schemes are everywhere in America, spreading the lie of democracy and the curse of freedom to backward races, eroding the already declining authority of Western civilization. They preach anti-idealist values and shoddy imitations of culture, robbing young thinkers of their birthright.\n\nIf we wish to save the dying superstate, we must break this system. We will begin by adjusting government election budgets, tilting toward regions where liberal negationism has yet to take root. We cannot yet dethrone the engine of the economy, but before the moral-spiritual forces that drive all great intellectual movements, they stand no chance."
 USA_yky_72_the_levers_of_Power:0 "The Levers of Power"
 USA_yky_72_the_levers_of_Power_desc:0 "President Yockey's election is not merely a victory for the petty party hacks who care about interests beyond Europe; it is also a pivotal victory in the unceasing war to rule European peoples and nations. This war has been waged unconsciously since the dawn of history, and its enemies are the betrayers and distorters of Europe - the spirit of the age that represents Western civilization.\n\nNow we have reached the summit of American political power, seizing the levers that control the flow of information. When the time is right, we will halt the films and propaganda that peddle pessimism and anti-European sentiment; we will surgically remove those who distort the truth from within American political organizations. Finally, we will purify culture by eliminating these rational errors: miscegenation, cosmopolitanism, liberalism, pacifism, and so-called tolerance, choice, and freedom.\n\nFrom these levers, we will ultimately arrive at the realm of culturelessness, triumphant in this great campaign, while the empire is yet in its infancy."
 USA_yky_72_a_subservient_party:0 "A Subservient Party"
 USA_yky_72_a_subservient_party_desc:0 "Partisan politics is pure farce, existing only to ensure that financial capitalism suppresses truly progressive forces. Yet we are forced to cooperate with a political entity infected by this disease, for the forces of history have kneaded these disorderly fools into a monster called the National Progressive Party.\n\nWe do not yet know why the distorters tolerate our existence, but we must not repeat past mistakes. The arrogant party hacks and pathetic activists were, to be sure, allies in our interest, but the benefits of maintaining the alliance are gone. Their skirmishes with other anti-Western political entities are merely weaknesses to exploit in this war. One day we will purge them from our ranks, and partisan politics will be a thing of the past.\n\nBut for now, we demand only absolute obedience."
 USA_yky_72_unleash_the_south:0 "Unleash the South"
 USA_yky_72_unleash_the_south_desc:0 "The American South was the birthplace of the European-style revolutions of 1861-1865. Though the traitor Lincoln defeated the South, America's Western culture did not die, and soon reasserted its dominance over the South. Since then, weak-willed liberal politicians have suppressed Southern culture, pushing a shoddy hybrid culture upon the land. We must end this catastrophic error and let American high culture once more dominate the backward races and cultural degenerates who erode the land.\n\nThis action will enrage our enemies - those who control the economy and the propaganda machine. But the still-healthy will understand, from the perspective of cultural pathology, the importance of this moment in the historical struggle; their representatives in the American superstate will support our policies more strongly, and the peripheral peoples will once more come under the watchful eye of the West."
 USA_yky_72_the_march_of_progress:0 "The March of the Torchbearers"
 USA_yky_72_the_march_of_progress_desc:0 "America was born diseased; infection has eaten into every aspect of its body, and the virus of decadence has seeped into the very core of the nation's mind. This is felt most strongly in the South, where the armies of history recruited the most loyal warriors of Western civilization. These knights who wield the truth of culture know that America's historical war has never ended; they know that the age of absolute politics is speeding toward us, and their efforts to suppress political participation among subject populations will only aid our cause.\n\nFor they are not wastrels like the masses, but men who dare to take up arms and act directly! The financial-capitalist mentality that has dominated America for so long no longer obstructs their mission; the victory of the cultural-political revolution is no less brilliant than the revolution of 1933, such is the power of the historical spirit's tide. We overcome disease not through material superiority, but through spirit and will!\n\nTrue Westerners are driven by the spirit of the age, and we must support them: the Ku Klux Klan, the Aryans, the torchbearers of Western civilization, and those who resist the cultural distorters will receive our full support. Finally, we can break free from the shackles of old partisan politics."
 USA_yky_72_the_safe_act:0 "The Defend American Exceptionalism Act"
 USA_yky_72_the_safe_act_desc:0 "If people truly believed in the 'equality' ideals of the 18th century, propaganda would not exist at all, for everyone has their own convictions and would instinctively resist any attempt to tell them how to think. This ideology is nowhere more vividly embodied than in America: the nation has a religious fervor for 'equality' that defies reality.\n\nIn America, mass thought, mass ideals, and mass lifestyles dominate collective life, and propaganda is the primary means of spreading information. In this country, the invisible regime of cultural distortion lords over everything, hostile to all strong-willed independent thinkers; in such a climate, publications are naturally more than mere intellectual products. Moreover, there is no such thing as a publication that tells only the facts, for every fact, every viewpoint, is but a pawn in the ruler's grand game of propaganda.\n\nAll those who care about Western culture must recognize that such publications are the most urgent threat. We must establish a new institution within the American superstate, tasked with monitoring and destroying such propaganda, and exposing the lies it spreads to the ignorant masses."
 USA_yky_hold_vote:0 "To the so-called 'common man' of American worship, this naked dismemberment of the rational anti-Western establishment is utterly incomprehensible. But since we hold the levers of propaganda, §jwe have the power to craft whatever laws we will.§!\n"
 YKY_loyal_cabinet_tt:0 "We will form a cabinet of §jconviction§!.\n"
 USA_YKY_Increase_Support:0 "§jNo more fifth columns.§!\n\n"
 USA_YKY_Fuck_You_Voting_Rights:0 "§jThe vote is a privilege.§!\n\n"
 USA_YKY_Power_Increase:0 "§GThis will increase our support nationwide.§!\n"
 USA_YKY_We_Love_Dixie:0 "§jThe righteous shall inherit their promised land.§!\n\n"
 USA_YKY_Fist_Of_Might:0 "§jFists must be clenched.§!\n"
 USA_YKY_March_Of_Progress_tt:0 "§jThe fire will rise.§!\n"

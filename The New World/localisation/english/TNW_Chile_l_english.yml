 CHL_idea_social_question: "The Social Question"
 CHL_idea_social_question_desc: "Chile's greatest social problem is poverty. Since the founding of the Republic, poverty has haunted the nation, and it has not improved to this day.\n\nFrom Chile's independence to the present, every government has tried to solve this thorny problem through various means. Though each approach has yielded some results, none has truly solved the problem. Therefore, in Chile, wherever you go, poverty is a stain that can never disappear from view: in the cities, you see slum dwellers crowded into ant-hill apartments; in the countryside, you see downtrodden peasants who have slipped through the net of modernization. No one escapes poverty, no one. And that is not all: in Chile, poverty is not merely poverty; it is the root of all social ills - uncontrolled migration, high illiteracy... merely preventing the situation from worsening has cost unimaginable sums in government investment, let alone solving the problem.\n\nWhether left or right, no government has been able to pull Chile out of the abyss of poverty. Not before, not now. The future? Probably not. For anyone who dares to defy the world and administer even half a dose of medicine to this chronic ailment, the sickness will drag them into an abyss from which there is no return."
 CHL_idea_political_fragmentation_alessandri_0: "Political Fragmentation"
 CHL_idea_political_fragmentation_alessandri_0_desc: "placeholder"
 CHL_idea_political_fragmentation_alessandri_1: "Political Fragmentation"
 CHL_idea_political_fragmentation_alessandri_1_desc: "Since the fall of the last Radical Party government, the Republic of Chile has been mired in a political crisis that has persisted for two decades.\n\nPowerful opposition factions constantly launch political sieges and obstruction; the well-heeled Liberals are passive and rigid; even more terrifying, political extremism and violence are spreading at an unprecedented rate - the nation seems trapped in permanent paralysis. The younger generation today cannot even remember when the country was last stable.\n\nWhen the reformist technocrat Jorge Alessandri took office, countless Chileans rekindled hope: perhaps the crisis was finally ending. But the political chaos after the Valdivia earthquake worsened the situation, and now Alessandri must face the harsh reality: his attempts at moderate reform have caused a serious split in the Chilean Democratic Front, and the crushing defeat in the 1961 congressional elections has placed the coalition's unity in jeopardy."
 CHL_idea_political_fragmentation_alessandri_2: "Political Fragmentation"
 CHL_idea_political_fragmentation_alessandri_2_desc: "placeholder"
 CHL_idea_economic_subservience: "Economic Subservience"
 CHL_idea_economic_subservience_desc: "Since the late nineteenth century, Chile's export-dependent economy and the long-standing foreign control of its markets have meant that the nation's political and economic lifeline often hangs by a thread, at the whim of external forces - usually ill-intentioned ones.\n\nWhether it was Britain in the past, the United States later, or Japan in recent years, Chile has constantly been torn between competing forces. These powers, as if history were repeating itself, have repeatedly pushed the nation to the brink of collapse."
 CHL_idea_agrarian_timebomb: "Agrarian Timebomb"
 CHL_idea_agrarian_timebomb_desc: "Southern Chile has long been described in many ways: 'diverse,' 'densely populated,' 'unique' - a land home to more ethnic groups and peoples than even immigrant nations like the United States and Canada can match. Yet recently, analysts have begun using a darker metaphor for the same region: 'a ticking timebomb.' Beneath these euphemisms lies the truth of the crisis about to erupt in southern Chile.\n\nImpoverished peasants forced to live on colonial-era estates, almost under a feudal system, are growing increasingly restive. Calls for land reform are growing louder, and local political extremism is on the rise. Southern Chile seems one spark away from being consumed by the fires of strife and anger."
 CHL_idea_rural_collapse: "Rural Collapse"
 CHL_idea_rural_collapse_desc: "Fire. Fire is the only constant for Southern Chile. Larded with fire, engulfed in smoke, the curt chuffs of choking livestock can't be heard for the gunfire. The burning forests release extremists who lynch and sack to the noise of percussive explosions. The fields burn, food is scarce; the red haze is a suffocating blanket that smothers the South - a diet of hate. The only surviving political discourse is assassination, and any government action should be taken with great caution, lest the collapse creep north."

 BM_HISTORY_TITLE: "Brief History"
 THENEWORDER_NAME: "A Beautiful Future"
 THENEWORDER_DESC: "More than fifty years have passed since the “New Order” reshaped the world order. Though the world has twice again descended into the flames of war, it still failed to overturn the chessboard of contention between Berlin, Washington, and Tokyo. The master of Europe gazes down upon half the globe, as if the dream of a thousand-year empire is at last about to come true; the Stars and Stripes sweep across the shores of two oceans, calculating a new entry point for rebalancing spheres of influence; the rising sun scorches the ancient land, and who among the whispers in the shadows can claim any glory. Different standpoints and values all promise a beautiful future in one voice, yet as for what that future holds, only the long road ahead can tell."

 BRA_MiningWar_update: "§YThe §JFalangists§! and the §DNationalists§! §YGain Strength§!"
 BRA_MiningWar_update_desc: "Our enemies will not sit idly by while we attempt to cool the situation in Bolivia. They will act behind the scenes to shore up their own support."
 ZZZ_BRA_MiningWar_update_duration: "§Y[?ZZZ.days_mission_timeout@ZZZ_BRA_MiningWar_arg_chl_move|0] days§!"
 BRA_wac_desc: "President Lacerda is eager to prove that his vocal support of a close partnership with the United States and the OFN is more than just empty prattle. With the explosion of conflict in West Africa, the Americans are once again rallying the alliance for an intervention, and Brazil shall answer the call. A wide range of operations are already in consideration: from anti-piracy operations in the Cape of Guinea, to the deployment of both air power and ground troops to aid Free France.\n\nShould this adventure bear fruit, we will have proven to both our partners and rivals that Brazil is not a nation to be underestimated. Failure to produce quick and decisive results, however, could easily be spun against us; casting a rather dark cloud over the President's foreign policy..."
 BRA_WAC_reassign_hardliners: "Assign £BRA_hardliners_texticon §gHardliners§! to the Frontlines"
 BRA_WAC_reassign_hardliners_desc: "The so-called Hardliners' overambition is their weakness. Assigning some of their rank to the African frontlines will ensure they will be out of our hair for a time."
 BRA_WAC_reassign_sorbonne: "Assign £BRA_sorbonne_texticon §QSorbonne§! to the Frontlines"
 BRA_WAC_reassign_sorbonne_desc: "The Sorbonne are plagued by their sense of duty. Many are more than willing to serve on the frontlines of the West African Crisis, where they will have little say in how the nation is run."
 BRA_WAC_reassign_const: "Assign £BRA_constitutionalists_texticon §KConstitutionalists§! to the Frontlines"
 BRA_WAC_reassign_const_desc: "The Constitutionalists left in Brazil's armed forces are those who have kept their mouths shut. They will hardly object to being reassigned to the West African front, happy to escape scrutiny."
 BRA_WAC_reassign_tt: "\n§YEffects when the West African War concludes:§!"
 BRA_WAC_increase_commitments: "Increase West African Commitments"
 BRA_WAC_increase_commitments_alot: "Massively Increase West African Commitments"
 BRA_WAC_pull_out: "OPERATION CLOSE CALL"
 BRA_WAC_brazilian_tech_assistance: "Provide Brazilian Technical Assistance"
 BRA_WAC_brazilian_tech_assistance_desc: "Due to the chaos of the war and frequent bombing raids by the PALF's air force, the Free French industrial and technical spheres are in chaos. Brazil will provide technicians and engineers to Free French to help increase production of infantry equipment and ensure there are enough guns for the Free French troops to use."
 BRA_WAC_operation_search_destroy: "OPERATION SEARCH AND DESTROY"
 BRA_WAC_operation_search_destroy_desc: "The nature of the West African Crisis is a logistical nightmare with partisans under every bush. PALF troops with knowledge of the terrain are able to ambush our troops and then disappear without a trace. Meanwhile their troops have managed to penetrate through our lines and wreck havock. This must be brought to a end. We will launch Search and Destroy Operations to crush these partisans and commandos."

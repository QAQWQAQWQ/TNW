 JAP_Plane_Bombing: "Japanese Bombing Runs"
 JAP_Plane_Bombing_desc: "The outbreak of war with the Japanese puppet has brought the wrath of the Japanese Air Force down upon us. Bombs rain down upon critical infrastructure and military installations and our ability to offer resistance in the air is minimal.\n\nThis will disrupt the organisation of our forces and will damage domestic support for the war effort, but we have little choice but to press on and hope that this bombardment does not escalate further."
 JAP_military_advisors: "Japanese Military Advisors"
 JAP_military_advisors_desc: "Our friends in Japan have seen fit to dispatch advisors from the IJA to aid our armed forces in the current conflict. With their support we shall see a significant improvement in the overall performance of our soldiers, as well as learning important lessons about modern warfare which will improve the efficiency of our armed forces in the future."
 JAP_technician_aid: "Japanese Technical Aid"
 JAP_technician_aid_desc: "Japan has seen fit to dispatch technicians to aid our war effort and we are already seeing significant benefits to a range of different areas of our military and economy as a result. We can only hope that such aid continues to be forthcoming."
 JAP_sabotage_effort: "Japanese Sabotage Effort"
 JAP_sabotage_effort_desc: "The outbreak of war with the Japanese puppet has resulted in Japanese spies being unleashed against us. A wave of sabotage has swept our country as their agents set to work stealing state secrets, sabotaging military operations, and assassinating officials.\n\nThis is proving detrimental to the war effort, not only because of the direct consequences of the sabotage but also because of the paranoia gripping our government as our own agents struggle to prevent further damage."
 JAP_partisan_attacks: "Coordinated Partisan Attacks"
 JAP_partisan_attacks_desc: "Partisan attacks are being carried out with alarming frequency and efficiency behind our lines. Targeting our troop concentrations and lines of supply, these attacks prevent our ability to resupply our troops and effectively hold ground. The highly focused nature of these attacks makes it clear Japanese the Japanese intelligence services supporting our enemies are feeding intel to these groups. We will be able to drive them out, however until we do we must remain vigilant."
 JAP_army_infiltrartion: "Infiltrated Army"
 JAP_army_infiltrartion_desc: "Our Army has been infiltrated by Japanese Intelligence. Either through bribes or coercion, a number of out high ranking officers are feeding intel to our enemies. Until we can root out these spies our ability to plan offensives and coordinate troop movements will be hampered."
 JAP_military_advisors_dynmod: "Japanese Military Advisors"
 JAP_technician_aid_dynmod: "Japanese Technical Aid"
 JAP_sabotage_effort_dynmod: "Japanese Sabotage Effort"
 USA_Plane_Bombing: "American Bombing Runs"
 USA_Plane_Bombing_desc: "The outbreak of war with the Americans' puppet has brought the wrath of the US Air Force down upon us. Bombs rain down upon critical infrastructure and military installations and our ability to offer resistance in the air is minimal.\n\nThis will disrupt the organisation of our forces and will damage domestic support for the war effort, but we have little choice but to press on and hope that this bombardment does not escalate further."
 USA_military_advisors: "American Military Advisors"
 USA_military_advisors_desc: "Our friends in the US have seen fit to dispatch military advisors to aid our armed forces. With their support we shall see a significant improvement in the overall performance of our soldiers, as well as learning important lessons about modern warfare which will improve the efficiency of our armed forces in the future."
 USA_technician_aid: "American Technical Aid"
 USA_technician_aid_desc: "The United States has seen fit to dispatch technicians to aid our war effort and we are already seeing significant benefits to a range of different areas of our military and economy as a result. We can only hope that aid such as this shall continue to be forthcoming."
 USA_sabotage_effort: "American Sabotage Effort"
 USA_sabotage_effort_desc: "The outbreak of war with the American puppet has resulted in the CIA being unleashed against us. A wave of sabotage and paranoia has swept our country as their agents set to work stealing state secrets, sabotaging military operations, and assassinating officials.\n\nThis is proving detrimental to the war effort, not only because of the direct consequences of the sabotage but also because of the paranoia gripping our government as our own agents struggle to prevent further damage."
 USA_rules_of_engagement: "Follow Rules of Engagement"
 USA_rules_of_engagement_desc: "The rules of engagement are a set of internal rules and policies defining how, when, and where a soldier can use force. Amid our interventions abroad, the President has issued an order to the secretary of defense mandating that these rules be updated and more strictly enforced. While some criticize this move as forcing the military to fight with "one hand tied behind their back," others believe it will limit potential atrocities and preserve US credibility at home and abroad."
 USA_War_Immigrants: "War Refugees"
 USA_War_Immigrants_desc: "Where war breaks out, Washington is never far behind. While we are beating back the tide of Fascism and Imperialism, there are consequences. Our proxy wars have resulted in thousands of refugees flocking to America. While we may gain more people, the societal tension of a refugee crisis cannot be understated. However, America is nothing without immigrants. Just like the Statue of Liberty says:\n\n"Give me your tired, your poor, Your huddled masses yearning to breathe free.""
 USA_military_advisors_dynmod: "American Military Advisors"
 USA_technician_aid_dynmod: "American Technical Aid"
 USA_sabotage_effort_dynmod: "American Sabotage Effort"
 GER_Plane_Bombing: "German Bombing Runs"
 GER_Plane_Bombing_desc: "The outbreak of war with the German puppet has brought the wrath of the Luftwaffe down upon us. Bombs rain down upon critical infrastructure and military installations and our ability to offer resistance in the air is minimal.\n\nThis will disrupt the organisation of our forces and will damage domestic support for the war effort, but we have little choice but to press on and hope that this bombardment does not escalate further."
 GER_military_advisors: "German Military Advisors"
 GER_military_advisors_desc: "Our friends in the Reich have seen fit to dispatch advisors from the Wehrmacht to aid our armed forces in the current conflict. With their support we shall see a significant improvement in the overall performance of our soldiers, as well as learning important lessons about modern warfare which will improve the efficiency of our armed forces in the future."
 GER_technician_aid: "German Technical Aid"
 GER_technician_aid_desc: "The Reich has seen fit to dispatch technicians to aid our war effort and we are already seeing significant benefits to a range of different areas of our military and economy as a result. We can only hope that aid such as this continues to be forthcoming."
 GER_sabotage_effort: "German Sabotage Effort"
 GER_sabotage_effort_desc: "The outbreak of war with the German puppet has resulted in the Abwehr being unleashed against us. A wave of sabotage has swept our country as their agents set to work stealing state secrets, sabotaging military operations, and assassinating officials.\n\nThis is proving detrimental to the war effort, not only because of the direct consequences of the sabotage but also because of the paranoia gripping our government as our own agents struggle to prevent further damage."
 GER_military_advisors_dynmod: "German Military Advisors"
 GER_technician_aid_dynmod: "German Technical Aid"
 GER_sabotage_effort_dynmod: "German Sabotage Effort"
 IBR_Air_Attacks: "Iberian Air Sorties"
 IBR_Army_Engineers: "Iberian Army Engineers"
 IBR_Army_Engineers_desc: "The Iberian Government has begun to send some of their army engineer specialists to our country to help boost our weak industrial output. This will help us churn out more vital weaponary."
 IBR_Air_Sorties: "Iberian Air Sorties"
 IBR_Air_Sorties_desc: "The Iberian Air Force is conducting heavy operations in our skies. Factories and infrastructure are being bombed to dust, and our troops report heavy losses: with no way to fight against an enemy of such magnitude, we can do nothing but endure."
 BRA_Plane_Bombing: "Brazilian Bombing Runs"
 BRA_Plane_Bombing_desc: "The outbreak of war with the Brazilian puppet has brought the wrath of the Brazilian Air Force down upon us. Bombs rain down upon critical infrastructure and military installations and our ability to offer resistance in the air is minimal.\n\nThis will disrupt the organisation of our forces and will damage domestic support for the war effort, but we have little choice but to press on and hope that this bombardment does not escalate further."
 BRA_military_advisors: "Brazilian Military Advisors"
 BRA_military_advisors_desc: "Our friends in Brazil have seen fit to dispatch advisors from the Brazilian Army to aid our armed forces in the current conflict. With their support we shall see a significant improvement in the overall performance of our soldiers, as well as learning important lessons about modern warfare which will improve the efficiency of our armed forces in the future."
 BRA_technician_aid: "Brazilian Technical Aid"
 BRA_technician_aid_desc: "Brazil has seen fit to dispatch technicians to aid our war effort and we are already seeing significant benefits to a range of different areas of our military and economy as a result. We can only hope that aid such as this continues to be forthcoming."
 BRA_sabotage_effort: "Brazilian Sabotage Effort"
 BRA_sabotage_effort_desc: "The outbreak of war with the Brazilian ally has resulted in the Brazilian Intelligence Agency being unleashed against us. A wave of sabotage has swept our country as their agents set to work stealing state secrets, sabotaging military operations, and assassinating officials.\n\nThis is proving detrimental to the war effort, not only because of the direct consequences of the sabotage but also because of the paranoia gripping our government as our own agents struggle to prevent further damage."
 TNO_plane_bombing: "Enemy Bombing Runs"
 TNO_plane_bombing_desc: "The outbreak of war with our enemy has brought the wrath of their supporter's airforce down upon us. Bombs rain down upon critical infrastructure and military installations and our ability to offer resistance in the air is minimal.\n\nThis will disrupt the organisation of our forces and will damage domestic support for the war effort, while we cannot contest the skies ourselves, our best bet is to rely on foreign supplied MANPADS to mitigate the potential damage."
 proxy_war_reduce_bombing_effectiveness_tt: ":\nThe effects of §YEnemy Bombing Runs§! against §Y[THIS.GetNameWithFlag]§! will be §Greduced§!."
 proxy_war_reduce_bombing_effectiveness_large_tt: ":\nThe effects of §YEnemy Bombing Runs§! against §Y[THIS.GetNameWithFlag]§! will be §Gsignificantly reduced§!."
 USA_mano_campaign_desc: "@@TODO_54907@@"
 JAP_mano_campaign_desc: "@@TODO_54908@@"
 Mano_state_scorched_earth_modifier: "Scorched Earth"
 Mano_state_scorched_earth_modifier_desc: "We cannot fight off the invading PALF by ourselves, and our allies are an ocean away. The enemy has left us no choice; if our nation is to survive the onslaught, we must buy time by any means, even if we have to destroy every road, burn every crop, and demolish every building about to fall, ANYTHING to slow the PALF down for even an hour.\n\nGod forgive us, for the reds won't."

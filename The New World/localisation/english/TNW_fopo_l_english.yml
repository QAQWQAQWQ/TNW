 BRA_WAC_stranglehold: "OPERATION STRANGLEHOLD"
 BRA_WAC_stranglehold_desc: "An army can only function as long as they have the weapons of war necessary to act. By strategically using our navy to blockade against PALF imports and shipments, Cameroon will be forced to focus on domestic production, limiting its ability to conduct military operations."

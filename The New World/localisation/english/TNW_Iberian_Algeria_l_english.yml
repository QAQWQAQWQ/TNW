 SLG_Legion_Presence:0 "Military Presence"
 SLG_Legion_Presence_desc:0 "Since the Portuguese settled in Algeria, Spanish troops were sent there to protect their Iberian brothers. However, the primary purpose of deploying troops was to administer the territory in the absence of French authorities. Since then, the Spanish military has become the dominant political and military force in the region, controlling most local affairs."
 SLG_Retornados:0 "Portuguese Returnees"
 SLG_Retornados_desc:0 "After the German invasion of Portuguese Africa, a large number of our citizens there chose to return to Iberia. The government decided to resettle them in the unofficially Iberian-controlled areas of Algeria, conveniently strengthening our territorial claim over the region. To this day, Portuguese settlers still live on this land, laying the foundation for us to build a stronger nation."
 SLG_Native_Unrest:0 "Native Unrest"
 SLG_Native_Unrest_desc:0 "The native protests triggered by the large-scale resettlement of Portuguese citizens to Algeria have become a headache for us. This problem must be resolved sooner or later."

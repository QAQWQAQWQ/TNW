 POLITICS_FEDERICO_GOMEZ_DESC:0 "Commander Federico Gómez de Salazar was the natural choice to lead the Iberian "peacekeeping" force into Algeria. Born in 1912, he grew up during the turbulent interwar years of Spain, witnessing a nation that, though untouched by the fires of the Great War, grew increasingly divided. In 1929, he trained under General Francisco Franco at the General Military Academy in Zaragoza, and naturally fought for the Nationalists during the Spanish Civil War. During World War II, he served with the Blue Division, the Spanish volunteer unit sent by the Franco regime to fight on the Eastern Front for Germany. After the war, he continued his loyalty to the newly formed Iberian Union.

The Iberian caudillos were no strangers to the chaos in Algeria. Salazar, in particular, was eager to protect the large Iberian immigrant population settled along the Algerian-Moroccan border. When the situation in Algeria deteriorated to a critical point, Salazar seized the opportunity and dispatched troops. Gómez de Salazar received concise orders: protect all Iberian immigrants, cooperate with the French pieds-noirs, and eliminate Italian influence. This loyal officer believed in a simple creed — once an order is given, it will be executed without question, no matter what it says."

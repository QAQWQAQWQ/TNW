 AAT_VAN_RHIJN_POLITICS_DESC:0 "Dr. Arie Adrianus 'Aat' van Rhijn has spent over a decade in diligent public service. Born in Groningen in 1892, he studied at Utrecht and Groningen universities, serving in various bodies - chambers of commerce, employees' associations - moving between half a dozen departments before being appointed Minister of Agriculture and Fisheries on the eve of the German invasion.\n\nAfter the war began, van Rhijn fled first to London, then, after further wanderings, to Ottawa and Paramaribo, watching as the Nazi boot crushed the Netherlands and the 'anti-colonial' Yamato 'liberated' the Dutch East Indies; only in far-off Suriname did the Dutch government catch its breath. Over the past twenty years, van Rhijn has more or less kept his sanity, but Prime Ministers Dirk Jan de Geer and Pieter Sjoerds Gerbrandy, not to mention Queen Wilhelmina - these people who longed for home yet drifted overseas - have fared less well; van Rhijn has had to bear the grief of watching many he respected fade away.\n\nPrime Minister Gerbrandy, worn down by office, left in the mid-fifties and chose van Rhijn as his successor; the people of remote Suriname now agree he is fit for the task. Aat van Rhijn is a moderate Protestant conservative, competent, respectful of non-Protestants and the labor movement, holding to a centrist course and reforming only by consensus, for he does not wish to disturb the delicate balance of exiles, immigrants, and colonists that makes up the country."

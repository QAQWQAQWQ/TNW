 SUR_surinamese_independence: "Surinamese Independence"
 SUR_surinamese_independence_desc: "Before Suriname gained independence - or so-called independence - a weak economy was not necessarily a bad thing; after all, it meant OFN aid would soon arrive. For the present-day Republic of Suriname, however, it is an unbearable burden.\n\nThe Dutch have ostensibly 'left' Suriname, but their private funds still secretly control the country's economy. Though the Dutch exile government and the United States cannot directly control the Surinamese people, they can still exploit the latter's dependence on limited foreign aid to achieve their ends."
 CUR_Exiles_in_the_Antilles: "Exiles in the Antilles"
 CUR_Exiles_in_the_Antilles_desc: "It is a fine thing to hold fast to the vision: that exile is temporary, that good will triumph over evil, that the exiles will one day return home. Everyone imagines it: one day, men and women stand side by side on the deck of a returning ship, wiping tears from their eyes. Familiar beaches, dikes, and dunes appear one by one, and an Amsterdam whole and glorious as of old waits quietly. They are crowned with laurels and return, amid flowers, to a reborn motherland.\n\nBut dreams are only dreams. The liberation of the Netherlands, the return of the exiles, the bright smiles, the brotherly embraces, the tears of joy - all have dissolved into phantom. The Kingdom of the Netherlands, once master of the seas and global trade, now rots and decays on the dry sands of Aruba.\n\nThe Queen and her small court still huddle in their gilded palace; the world moves on, but they cling to this selfish fantasy. They issue decrees no one hears, watch rescued Rembrandts crack and Vlissingen fabrics fade in the sun; they turn a deaf ear to the growing anger and frustration of the homeless on Aruba, a blind eye to those who curse them and denounce their pretended sacrifice. So it continues, until the Kingdom of the Netherlands is utterly dead and beyond all recall."
 SUR_liberal_conservatism_party:0 "Fortuyn Cabinet"
 SUR_liberal_conservatism_party_long:0 "Kabinet-Fortuyn"
 SUR_1971_Constitution: "1971 Constitution"
 SUR_1971_Constitution_desc: "Amsterdam has fallen to the enemy, and the exiles can no longer see the golden wheat fields stretching for miles across their homeland. But once, at least, they could console themselves: like their fathers, they possessed democracy and freedom, as if this were the natural order since the expulsion of Spanish rule.\n\nBut all that is gone. The new military junta that came to power after the coup claims to 'defend the hope and strength of the Dutch people' and has drafted a new constitution, but its essence is to suppress five centuries of Dutch democratic tradition. The old democracy is now a hollow shell, one that even Somoza or Morínigo would envy. Colonial autonomy and citizenship have become a scrap of paper.\n\nThe soldiers may convince themselves - in vain, as it turns out - that by this act, this desecration, they have saved the remnant of the Kingdom. But in truth, the iron fist has brewed emptiness and conflict in the hearts of the last free Dutch; even if the Netherlands somehow regains its freedom in the future, even if the royal standard flies once more over the Royal Palace in Amsterdam, it cannot heal the wounds this has inflicted."

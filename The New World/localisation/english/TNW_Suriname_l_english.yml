 USA_prevent_suriname_independence:0 "Prevent Surinamese Independence"
 USA_suriname_coup_tt:0 "We will fund the Dutch Royal Guard to keep Suriname within our sphere of influence."
 SUR_1947_Constitution:0 "1947 Dutch Constitution"
 SUR_1947_Constitution_desc:0 "Constitutional reform had long been a topic of discussion while the government was in exile in London. Then, with Britain's fall and the government's second flight to the Caribbean, we had no choice but to reform the constitution.\n\nThe 1947 constitution differs little from its predecessor; under a constitutional monarchy, it still upholds fundamental values like freedom and democracy. One provision stands out: the constitution grants full autonomy to the existing Caribbean colonies, which have become part of the exiled Dutch Kingdom's democratic system."
 SUR_Poster_Boy_OFN:0 "OFN's Poster Child"
 SUR_Poster_Boy_OFN_desc:0 "The Dutch Kingdom's exile government in Suriname is one of the last remaining members of the former Allies, and now a member of the Organization of Free Nations. Yet as a government in exile over the rump territory of a colonial empire, Suriname's economy is threadbare, heavily dependent on loans and aid to sustain development.\n\nAid flows endlessly into Suriname, earning the country the nickname 'OFN's poster child.' Under the generous patronage of the free democratic nations, its democracy flourishes. Yet though Suriname's economy looks healthy, the near-bottomless demand for economic aid makes this prosperity seem fragile."
 SUR_queen_wilhelmina:0 "Queen Wilhelmina"
 SUR_queen_wilhelmina_desc:0 "Wilhelmina was the only child of King William III of the Netherlands and Emma of Waldeck and Pyrmont, ascending the throne at age ten. After her regency ended, Wilhelmina took charge of the government; she kept the Netherlands neutral during the interwar period and helped resolve many of the country's industrial problems, making her deeply popular. Astute and far-sighted, she soon became the world's first female billionaire; her family was one of the few remaining European royal houses, and she worked tirelessly to keep it unassailable. Then the Nazis swept in, and all was lost.\n\nAfter Germany invaded the Netherlands in 1940, Wilhelmina fled to Britain to lead the Dutch government-in-exile. But when Britain too fell to the Germans, the blow was as devastating as the loss of her homeland, and she fled again to the Caribbean. Shortly after arriving in Suriname, Wilhelmina tried to abdicate; the government refused, citing the need for stability. After negotiations, she remained queen, while her daughter, Crown Princess Juliana, would carry out duties at events and ceremonies on her behalf.\n\nIn the forties, Dirk Jan de Geer left office and was succeeded by Pieter Sjoerds Gerbrandy. Later, worn down by the burdens of office, Gerbrandy submitted his resignation, and the mild-mannered Aat van Rhijn took his place. But none of this helped; Wilhelmina remained at odds with the government."
 SUR_queen_juliana:0 "Queen Juliana"
 SUR_queen_juliana_desc:0 "Queen Juliana of the Netherlands was the only child of Queen Wilhelmina and Hendrik of Mecklenburg-Schwerin. Educated privately, she later studied international law at Leiden University. In 1937 she married Prince Bernhard of Lippe-Biesterfeld; they had four daughters: Beatrix, Irene, Margriet, and Christina. During the Second World War, when Germany invaded the Netherlands, the royal family fled to Britain; eventually Juliana and her children went to Canada, while Bernhard and Wilhelmina stayed behind. After Germany invaded Britain, the other royal members joined Juliana in Canada, before they all went on to Suriname, where the Dutch government-in-exile settled.\n\nBy the late forties, Wilhelmina's health was declining, and Juliana had effectively become the exiled Queen of the Netherlands, taking her mother's place at ceremonies and events. Though the Hitlerites still gripped the homeland, she held out hope that Amsterdam would one day be liberated. Even if that dream never came true, she refused to yield to fear; she was willing to reach formal agreements with the Caribbean colonies alongside the exile government, building a true nation and ending the transitional period."
 SUR.skeleton.6.t: "A Trip to Suriname"
 SUR.skeleton.6.desc: "When Gerard Dawson's unmarked helicopter flew over the royal palace in Aruba for the third time, his pilot concluded there was nowhere to land. As the FBI station chief in Paramaribo, Dawson wondered what good a visit would do if he couldn't land. 'We're heading back to Oranjestad,' the pilot said, 'unless you want to swim.' Dawson didn't hesitate; he strapped on a life vest and told the pilot to fly toward the yacht anchorage.\n\nThe helicopter dropped low enough, and Dawson leapt into the churned water, swimming against the current toward shore. Once on land, the soaked CIA agent saw his contact, Prince Bernhard, running toward him with a group of Royal Netherlands Army generals. After a car ride and a shower, Dawson and the generals were sipping port on a nearby balcony. Then General Frans van der Veen made an unseemly request. 'As you know, the Surinamese parliament is holding a referendum on Surinamese independence,' the general said through a cloud of smoke. 'We want to stop them.' The air was thick with snickers and clinking glasses.\n\nThese Dutch reactionary leaders scorned Surinamese autonomy and sought American support to 'defend' the Kingdom's future. But the Surinamese parliament was, in fact, the legal Dutch parliament; to participate in overthrowing an OFN member's government in this way would plainly violate the OFN charter. On the other hand, an independent Suriname would surely leave the OFN. Dawson weighed the request and its implications carefully."
 SUR.skeleton.6.a: "'I will relay your request.'"
 SUR.news.1.t:0 "[Get_newspaper_header] Queen Wilhelmina Dies"
 SUR.news.1.desc:0 "Queen Wilhelmina of the Netherlands, exiled in Suriname, has died of cardiac arrest at her palace in Paramaribo, where she had lived since the government-in-exile moved to the Caribbean. Wilhelmina's death was not unexpected; she had long been in poor health, forcing her daughter, now Queen Juliana, to take on ever more duties.\n\nThe Dutch Caribbean, sometimes wracked by division, mourned her passing together; even in Nazi-occupied Netherlands there were reports of mourning. At the late Queen's request, funeral staff wore white vestments instead of black, reflecting her Christian belief that death is only the beginning of eternal life. In keeping with this, a special burial ground was built in Paramaribo. However, government sources say that if Amsterdam is liberated, she will be reinterred in the royal crypt to join her ancestors.\n"
 SUR.news.1.a:0 "We offer our condolences."
 SUR.news.2.t:0 "[Get_newspaper_header] Dutch Basic Law Reform"
 SUR.news.2.desc:0 "The Dutch government recently moved against calls for Surinamese autonomy by amending the Basic Law inherited from the colonial era, sparking protests in the Surinamese capital of Paramaribo. The Dutch legislature, its seats nearly all vacant, passed a law reducing the exile government to a ceremonial role and fixing voting rights for exiles residing in Suriname. Queen Juliana's advisors have recommended she abolish the post of Surinamese Prime Minister and replace it with a Dutch Prime Minister, further advancing the cause of Dutch territorial unification.\n\nThe move has enraged the Surinamese public, who see it as a breach of the autonomy agreements previously signed with the Dutch crown. Though the current Surinamese parliament may remain until the next election, the new Basic Law provisions have driven a wedge between the exiles and the Surinamese people.\n"
 SUR.news.2.a:0 "Is this a free nation?"
 SUR.news.3.t:0 "[Get_newspaper_header] Reorganization of the Dutch Kingdom"
 SUR.news.3.desc:0 "From Paramaribo, the Dutch government-in-exile has reached an agreement with the Surinamese parliament on the political future of the Dutch Kingdom. To strengthen the crown's control over the Surinamese government, the exile government has decided to dissolve itself and grant Suriname the status of a main constituent country of the Dutch Kingdom. The agreement, reached after months of negotiations, integrates the old Dutch political system into the Surinamese government.\n\nThough the agreement is supported by Suriname's Verenigde Hindoestaanse Partij and a small number of NPS members, nationalists in the Surinamese parliament have condemned the law as a usurpation of Surinamese sovereignty. Further disquieting to autonomists, the new government will include Dutch electoral districts in the upcoming Surinamese general election, revealing a double standard in its actions.\n"
 SUR.news.3.a:0 "Compromise is key."
 SUR.news.4.t:0 "[Get_newspaper_header] Anti-Government Protests in Suriname"
 SUR.news.4.desc:0 "Outraged by the corruption of Prime Minister Jo Meyen, crowds have taken to the streets continuously, paralyzing the Surinamese capital of Paramaribo. Though the demonstrations have so far been nonviolent, students and factory workers are staging increasingly frequent political protests demanding Meyen's ouster. In response, Queen Juliana has decided to dismiss Meyen before the new general election in June.\n\nThough a formal investigation into the former Prime Minister's egregious corruption is unlikely, his dismissal is seen by the NPS as a victory for Surinamese democracy. The upcoming election has become fiercely contested, with debates over independence and royal prerogative polarizing the electorate.\n"
 SUR.news.4.a:0 "Troubles of an exiled kingdom."
 SUR.news.5.t:0 "[Get_newspaper_header] Surinamese Constitutional Crisis"
 SUR.news.5.desc:0 "The political standoff between Queen Juliana and Surinamese Prime Minister Johan Kraag has culminated in Kraag's dismissal, with the premiership left vacant until new elections. The conflict began with a 1969 budget proposed by Kraag and his NPS, which sharply increased welfare and state investment spending, producing a huge deficit. Kraag argued that economic growth and OFN investment could offset the accumulated debt, but conservatives supported his removal.\n\nKraag's downfall has sent shockwaves through the Surinamese parliament, with NPS members increasingly inclined to run on pro-independence platforms. Though independence supporters do not hold a majority in parliament, the issue of royal prerogative has polarized voters ahead of the upcoming election.\n"
 SUR.news.5.a:0 "Can they not keep their promises?"
 SUR.news.6.t:0 "[Get_newspaper_header] Dutch Troops Occupy Paramaribo"
 SUR.news.6.desc:0 "As further abuses by the Jo Meyen government come to light, protests against government corruption and nepotism have wracked Suriname for weeks. The demonstrations have so far been nonviolent, but have spread from Paramaribo to surrounding towns and the Netherlands Antilles. Fearing that continued unrest could spark revolution, Royal Netherlands Army officers have moved to arrest demonstrators, swiftly suppressing anti-government figures and organizations. Prime Minister Meyen then announced his resignation in what was clearly a non-voluntary manner, and Lieutenant General Frans van der Veen took his place as head of a military junta.\n\nThe junta has reiterated that democracy will be restored in the 'Dutch Kingdom' in the future, though it has provided no timetable. For now, Surinamese autonomy and democracy have been abolished by force.\n"
 SUR.news.6.a:0 "The return of imperialism."
 SUR.news.7.t:0 "[Get_newspaper_header] Suriname Votes for Independence"
 SUR.news.7.desc:0 "Hours after polling stations closed across Suriname, results confirmed that a majority of Surinamese voted for independence. Dutch pollsters and international observers had long expected Suriname to remain within the Netherlands. Nonetheless, recent anti-government demonstrations and rallies for nationalist parties have swung voters toward independence.\n\nThe NPS's pro-independence faction hailed the result as a triumph of democracy, while the Dutch CDA has begun evacuating its institutions to Aruba. Suriname's independence has reduced Dutch territory to the Netherlands Antilles, now the only remaining country of the once-vast kingdom.\n"
 SUR.news.7.a:0 "The end of the Netherlands?"
 SUR.news.8.t:0 "[Get_newspaper_header] Suriname Remains Dutch"
 SUR.news.8.desc:0 "Hours after polling stations closed across Suriname, results confirmed that a majority of Surinamese voted against independence. This was no surprise to the Dutch government, which had long expected the vote to fail, but Queen Juliana nonetheless sent a conciliatory note to the independence camp. The streets of Paramaribo are filled with relief, disappointment, and anger, but life goes on.\n\nThough Surinamese nationalist parties have vowed to continue lobbying for independence, VHP representatives support accepting the result as a basis for deepening national autonomy. Many Surinamese still carry resentment of past wrongs, which fuels the independence movement. For now, however, the country has chosen to remain in the kingdom.\n"
 SUR.news.8.a:0 "Perhaps reconciliation is possible."

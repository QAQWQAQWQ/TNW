 POLITICS_MAHENDRA_BIR_BIKRAM_SHAH_DESC: "The great Rajah of Nepal, the embodiment of the nation's supreme power, Mahendra Bir Bikram Shah Dev, cannot always enjoy his supreme authority. Once upon a time, Bikram was just another member of the royal family, enduring the monotonous and boring duties of a monarch under a representative constitutional government. The position of Prime Minister of Nepal had been held by the conservative Rana family since 1846, ensuring their iron-fisted rule over everyone, even members of the royal family. But then India became a republic, and rebellion swept through Nepal, forcing the Rana family to return power to the crown — and Bikram saw his opportunity.

Four years after ascending the throne, on a cold December morning, Prime Minister Bishweshwar Koirala was dismissed, and the parliament he led was dissolved. The cabinet was abolished, and the constitution was shelved. Now the entire country is in Bikram's hands, and a new political system has been built. A perfect, "guided" democracy is the ultimate answer. Obviously, for the Rajah himself, monarchy means inequality, but isn't it his duty to guide the nation forward correctly?

He has the ability to unite the entire country, and a series of successful land reforms and neutrality policies have kept the kingdom from falling apart. But people are curious how long this guided democracy can last. Both Japan and the Republic of India have their eyes on Nepali territory, and the Nepali Congress is waging non-violent resistance against Bikram and his regime. It will be interesting to see how long this "perfect" system lasts, and whether it will end peacefully."

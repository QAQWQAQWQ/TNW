l_english:
 GER_Bormann_category: "Kartenhaus"
 GER_Bormann_category_desc: "The political system of the Third Reich is a tangled mess - a legacy of Hitler's rule, constantly pitting factions and individuals against one another to shore up his own position. Anyone with even a sliver of power believes they alone know what Germany needs most. As a result, the various social groups and interest groups within Germany can never rely on or support one another, and instead must all rally around the Führer. To reunify a divided nation, the Führer must show his favor - or disfavor - to every dissenting group, bringing them back to heel. Should the Führer fail, Germany will surely lapse into stagnation, decline, and eventual collapse. Only an iron will, ruthless intrigue, and deft maneuvering can save National Socialism."

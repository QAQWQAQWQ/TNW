 BOR_SIGName_0: "Party Bureaucracy"
 BOR_SIGName_Formatted_0: "Party Bureaucracy"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_0_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
The §YParty Bureaucracy§! are pen-pushers, office drones, and career politicians dedicated to maintaining the Reich's Byzantine system and keeping it running. The §YBureaucracy§!, composed of Germany's major decision-making bodies, has historically been influenced by former Reich Director of the Nazi Party Chancellery and current Führer Martin Bormann and his §LConservative§! allies. However, with the outbreak of the civil war and subsequent efforts at reunification for stability, this influence is eroding. The situation grows more troublesome by the day, and the §LConservatives§! must act quickly to ensure their control over the bureaucratic leviathan."
 BOR_SIGName_1: "The People"
 BOR_SIGName_Formatted_1: "The People"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_1_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
For over a decade, Germany's hundred million citizens have lived through upheaval and division. Once, the glory of conquest instilled in them a fierce patriotism, and the endless stream of plunder, imports, and raw materials from the occupied territories gave them the world's highest standard of living. Now, the people cry out to their Führer: some for bread, some for lead; some for peace, some for war; some for survival, some for death. It is the people who carry the ark of National Socialism, and it is the people alone who can sink the Reich in an instant."
 BOR_SIGName_2: "The Intelligentsia"
 BOR_SIGName_Formatted_2: "The Intelligentsia"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_2_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
The Reich's intellectuals have long been officially shunned as a potential hotbed of liberalism, Marxism, and Jewish sympathy. They have been out of the public eye for over thirty years now. The talent lost after the Nazis' rise was never adequately replaced, but enough schools and universities remain to carry on the German intellectual tradition. In public, they still cause problems: Speerism and the student movement have clear ties to the intelligentsia. From the Party's perspective, they are mostly irrelevant to our grand plans, but their influence on the younger generation cannot be ignored."
 BOR_SIGName_3: "The Church"
 BOR_SIGName_Formatted_3: "The Church"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_3_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
Germany's religious institutions have long been suppressed (violently or otherwise), a perennial threat at the Führer's bedside. After Hitler took power, they were often used as a convenient tool, directed by the Party; but once Hitler had established absolute control over Germany, they were quickly reined in and lost their influence. On paper, the Reichskonkordat witnessed a reconciliation between the Catholic Church and the Nazi Party, but privately the Church continued to oppose National Socialist racial policy and antisemitism, even harboring Jews and dissidents. As a result, the Church was brutally suppressed by the SS under Heydrich. The Church rarely involves itself in politics now, but it can still contest the hearts and minds of the German people with the Nazi Party - and should the fragile bond between them break, the Church would surely pose a serious threat to the National Socialist vision."
 BOR_SIGName_4: "The Heer"
 BOR_SIGName_Formatted_4: "The Heer"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_4_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
The Heer is the Führer's strong right arm; it was the Heer that broke the enemy's back and delivered final victory to the Third Reich. Many veterans of the long, bloody Second World War still serve in its ranks, grey-haired and scarred though they may be, they are hardened fighters. Though the Heer is politically dominated by a hardline militarist clique under Ferdinand Schörner, its overall leanings are not monolithic. During the civil war, many soldiers fought for Speer, Speidel, or Bormann. However much their ideals differ, the factions within the Heer agree on one thing: it was their sacrifice that built today's Germany, and they must be respected. Failing to pay tribute to the world's largest army could have terrible consequences."
 BOR_SIGName_5: "The Kriegsmarine"
 BOR_SIGName_Formatted_5: "The Kriegsmarine"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_5_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
The Kriegsmarine is often forgotten by the nation, with only the Führer and his Party expressing gratitude for the Reichsmarine. Without the relentless efforts of the U-boat wolfpacks and the firepower of cruisers and battleships, setting foot on British soil would have been a laughing matter. Today, the Greater German Reich projects power across the entire Atlantic through its navy, providing essential security for its western territories and African commissionariats. Should a German naval striking fleet appear on the eastern horizon, American reconnaissance convoys slink away in disgrace. Without them, the Greater German Reich could not maintain its status as a world power."
 BOR_SIGName_6: "The Ordnungspolizei"
 BOR_SIGName_Formatted_6: "The Ordnungspolizei"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_6_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
The Ordnungspolizei - abbreviated as Orpo - is Germany's civilian police force, the Nazi Party's favored tool for maintaining street order and keeping unruly citizens in line. The Orpo is no ordinary police force; it is thoroughly politicized and spares no brutality in upholding the Führer's rule. When selecting officers, it values strength and loyalty over policing technique or temperament. Though they have always been compliant, the outbreak of the civil war and years of unrest that followed have greatly shaken the Orpo. With the war came desertions, conscription, and infighting; the ranks have thinned, and the Orpo is no longer the unstoppable behemoth it once was. The Orpo must be rebuilt - if necessary, destroy it first, then rebuild."
 BOR_SIGName_7: "Reichswerke"
 BOR_SIGName_Formatted_7: "Reichswerke"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_7_tt: "§YReichswerke§!
§g--------------------§!
Central German industry is largely controlled by the Reichswerke (formerly the Reichswerke Hermann Göring), Germany's most important steel and arms conglomerate. Central German industry is closest to Germania, and thus both easily influenced and easily influencing. Central Germany's economy depends heavily on these enterprises; in an ideal world they would provide tens of thousands of jobs for Germania's broad populace. However, Germania has largely become an economic burden, as many jobs that would have gone to the people instead became part of the slave contract system, under which enterprises sign labor contracts with slave populations owned by slaveholders. The executives have little incentive to change the status quo; the heavy civilian casualties of the civil war make exploiting cheap slaves an attractive option for rebuilding their devastated property."
 BOR_SIGName_8: "IG Farben"
 BOR_SIGName_Formatted_8: "IG Farben"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_8_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
The biggest players in Rhineland industry are IG Farben, one of the world's largest chemical companies and a great pioneer in synthetic fuel; and Krupp, a historic steel and arms giant that accounted for a significant share of German heavy industry through both world wars. Though the Rhineland has dozens of industrial firms, when it comes to politics, these two are nearly unchallenged. Under Hitler, these giants' industrial output was staggering - or at least it was until the civil war turned the Rhineland into a battlefield. As the Ruhr Valley coalfields come back to life and the wheels of industry turn again, the Führer must tread carefully with the Rhineland industrial giants and their countless slaves; should another upheaval occur, the German economy may never recover."
 BOR_SIGName_9: "Siemens"
 BOR_SIGName_Formatted_9: "Siemens"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_9_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
Compared to their northern and western counterparts, southern German industrial firms are less directly tied to the military-industrial complex, but their importance is no less. Companies like Siemens (an innovator in computing and electronic machinery) and Daimler-Benz (a producer of military and civilian vehicles) demand large numbers of skilled workers rather than slaves - though they retain some for the hardest labor. This leaves them in a precarious position: Germany lacks enough skilled workers to satisfy their expansion, but buying slaves and training them to produce precision electronics, engines, and large appliances? Unthinkable! The United States and Japan have raced ahead in this field, and these companies are full of complaints about the Nazi Party's decades-long obsession with heavy industry. The Führer must either make use of them, or..."
 BOR_SIGName_10: "Slave Plantations"
 BOR_SIGName_Formatted_10: "Slave Plantations"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_10_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
In the lush fields of Prussia, millions of slaves toil without end for the vast §Yslave plantations§! and the various industries that produce food and textiles for the state. The §Yslave plantations§! were built on the victory of the Second World War and play a special role in the lives of postwar veterans; these §Yplantations§! are usually owned in part or in whole by such veterans, who employ large labor forces to keep the plantations running. Thus the §Yslave plantations§! are undoubtedly tied to the interests of the now-privileged postwar veterans. Largely influenced by the most extreme pro-slavery and expansionist political currents, they are a stronghold of the §RMilitarists§!."
 BOR_SIGName_11: "The Banks"
 BOR_SIGName_Formatted_11: "The Banks"
 BOR_SIGName_Long: "Party Bureaucracy"
 BOR_SIGName_Formatted_11_tt: "§Y[BOR_SIG_GetName_Formatted_New]§!
§g--------------------§!
Banks have been a favorite target of our Party since its earliest days. Though they have never been popular in our country, their existence is essential to the Third Reich's continuation. Though "Jews" and "plutocrats" have long since vanished, times have changed and the people still complain: that the banks are greedy, exploit the people's income, and are responsible for every economic hardship Germany suffers. Ironically, these banks have always maintained close ties with the Nazi Party; it was their nimble fingers that worked one financial miracle after another, enabling Hitler's economic wonder in his early 1930s rule. The banks also manage the vast flood of plunder flowing in from the occupied territories, converting it into liquid assets to fuel the German war machine and keep citizens fed. In theory the banks answer only to the Führer, but their control over the German economy far exceeds the Führer's personal will. Even should the Führer hold a dagger to the banks' throats, cutting would only draw German blood."

 FFR_Michele_Alliot_Marie:0 "Michèle Alliot-Marie"
 POLITICS_MICHELE_ALLIOT_MARIE_DESC:0 "When Michèle Alliot-Marie followed her mother into exile on this island of flowers, neither she nor her mother could have imagined that decades — indeed, a lifetime — would be spent here. For as long as she could remember, her mother's sighs had always been at her side. She could not understand them as a child, but as a teenager, like tens of thousands of other young people on the island, she fell into the sea of confusion about identity. Only then did she truly understand why her mother sighed.

She then entered politics, rebuilding a new party from the wreckage after the dissolution of the Rally for the Republic, uniting Gaullists and conservatives, and eventually winning the election. Power and time are perhaps the gentlest of amnesiacs, and today's Michèle Alliot-Marie has changed so much that even she feels a stranger to herself."

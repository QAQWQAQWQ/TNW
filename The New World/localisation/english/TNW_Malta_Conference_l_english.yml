l_english:
 maltaconference.1.t:0 "The Malta Conference"
 maltaconference.1.d:0 "The Triumvirate is on the brink of collapse, and every member nation knows it. The aftershocks of the Second World War have bred tensions, escalating long-simmering border disputes into minor conflicts. Commerce is disordered, economies stagnant, and every man looks only to his own. As a last attempt to save the Triumvirate, Ciano has decided to convene a conference. Even if he cannot turn the impossible into the possible, even if he cannot raise the Triumvirate from the dead, he can at least let it die peacefully.\n\nNaturally, choosing a venue for a conference of this scale is an exceedingly important task. Ciano held a private meeting with his political rival and party secretary-general Scorza, for the two must agree beforehand on a meeting place. The Duce would not allow his own party to fan the flames in his own backyard, nor deliberately choose an inauspicious site that would spoil this grand occasion. But the problem remained: where to hold it? Rome was considered first, but the other two powers had long berated Italy for seeing itself as the center of the Triumvirate, so Rome was ruled out; Madrid and Ankara were also excluded. Ciano would not let Franco, Salazar, or Inönü play host, nor let himself be seen as the Triumvirate's center. He sat on the sofa, sipping a glass of wine, idly flipping through the candidate list and drifting into thought. Ah, sweet Maltese wine, truly his favorite. Wait - Malta!\n\nSimply perfect. Malta is our turf, yet not offensive. It is prosperous and stable, and most importantly: Malta has no border disputes. Every window overlooks the Mediterranean, every place is resplendent, with fine wines, delicacies, and harmoniously coexisting peoples. The choice is perfect. Scorza would not like this decision, of course, but what did his liking matter? Scorza only wanted to flaunt fascist pride: Rome itself, the Eternal City.\n\n'I am a pragmatist,' he told himself smugly.\n\nThe renowned Castille Hostel in Malta has been chosen as the venue, and preparations are underway. The Hostel is Ciano's favorite retreat in Malta, but will his Iberian and Turkish counterparts be dazzled by its luxury?"
 maltaconference.1.a:0 "Send out the invitations!"
 maltaconference.2.t:0 "Inviting Iberia"
 maltaconference.2.d:0 "'...As formal members of the Triumvirate, the two caudillos of the Iberian Union, Francisco Franco Bahamonde and António de Oliveira Salazar, are invited to attend the conference to be held at the Castille Hostel in Malta.'\n\nFranco's name was placed before Salazar's, sparking a protocol dispute in the Portuguese government, though Caudillo Salazar himself cared little for the slight. Iberia has agreed to attend."
 maltaconference.2.a:0 "Time to take a stand!"
 maltaconference.3.t:0 "Inviting Turkey"
 maltaconference.3.d:0 "'...As a formal member of the Triumvirate, President İsmet İnönü of the Turkish Republic is invited to attend the conference to be held at the Castille Hostel in Malta.'\n\n'The time has come!' Inönü said to himself.\n\n'The blind Italian finally understands that our demands are irresistible!'\n\nTurkey has agreed to attend."
 maltaconference.3.a:0 "Finally a chance to stress our territorial sovereignty!"
 maltaconference.4.t:0 "Invitation to the Malta Conference"
 maltaconference.4.d:0 "'...As a formal member of the Triumvirate, the leader of [Root.GetName], [Root.GetLeader], is invited to attend the conference to be held at the Castille Hostel in Malta.'\n\nItaly appears to be planning a summit to decide the Triumvirate's future. We will attend."
 maltaconference.4.a:0 "Let us hope for the best..."
 maltaconference.5.t:0 "Ciano's Opening Address"
 maltaconference.5.d:0 "Over the past few days, representatives of the Triumvirate's members have arrived. The atmosphere is tense, and many attendees are unclear about the conference's purpose. Their questions will be answered as Duce Galeazzo Ciano takes the stage to speak.\n\n'Distinguished delegates,' he said. 'Welcome. Today, we must set aside our differences and reaffirm the greatness of our alliance. I know many of you wish to raise disagreements and grievances, and this is the place to voice them.'\n\nMany in the audience were shocked by his bluntness, though some laughed.\n\nA Turkish diplomat complained to another: 'At least he knows this conference will turn into a complete farce.'\n\n'The Triumvirate was forged in fire,' Ciano continued. 'As the world grows more chaotic, if our alliance is to endure, we must be candid with one another. We are like brothers - we quarrel at times, but we always stand together, bound by family love and shared history.' Ciano finished.\n\n'Now, let us welcome our brother from Turkey to the stage.'"
 maltaconference.5.a:0 "Welcome, one and all!"
 maltaconference.5.b:0 "Let us get this over with..."
 maltaconference.6.t:0 "Inönü's Speech"
 maltaconference.6.d:0 "Ciano stepped down from the podium, and Turkish President İsmet İnönü came forward. The Turkish delegation applauded warmly, while the others fell silent.\n\n'I will not waste your time with tedious pleasantries like the Italian Duce.'\n\nInönü overwhelmed the obsequious Italian with blunt words.\n\n'Ciano says we share a common history - and he is right. We share a history of disputed territory!' he declared.\n\nThe Turkish delegation cheered loudly in response, while others looked on grimly. This response was not unexpected, though some were startled by the President's bluntness.\n\n'For my part, I do not oppose the Triumvirate,' Inönü continued. 'In this turbulent world, collective security is a fortunate thing. But if Turkey is to remain a member, we must reclaim our ancestral lands! We can no longer tolerate Europeans dominating our sphere of influence! I look forward to meeting with the leaders of our alliance to discuss our territorial claims, and their return to their rightful motherland - Turkey!'\n\nThe Turkish delegation nearly leapt from their seats, stomping their feet and cheering Inönü."
 maltaconference.6.a:0 "A great speech by our glorious leader!"
 maltaconference.6.b:0 "Disturbing..."
 maltaconference.7.t:0 "Franco and Salazar's Speeches"
 maltaconference.7.d:0 "After that incendiary speech, the next to take the stage were the two caudillos from Iberia. Trying to observe diplomatic protocol, the two caudillos brushed shoulders and walked onto the podium side by side. Salazar spoke first:\n\n'Distinguished leaders, like our friend and ally President Inönü, we too wish to see the Triumvirate remain united, and likewise have some disputes to settle here.'\n\nFranco then took up the thread: 'But unlike him, we will not resort to threats and nationalist incitement. We seek a truly fair agreement for all parties to the Triumvirate!'\n\nHe was answered by scattered jeers and catcalls from the floor.\n\n'In this great alliance, we are all equal partners! Whatever brought us to this conference, one issue matters more than all others: maintaining our Mediterranean brotherhood and standing united.'\n\nThe two took turns speaking awkwardly for nearly half an hour; when they finished, they received polite applause from some listeners, though many in the audience had fallen fast asleep."
 maltaconference.7.a:0 "For Mediterranean brotherhood!"
 maltaconference.7.b:0 "When will they finish?"
 maltaconference.8.t:0 "Opening of the Canal Talks"
 maltaconference.8.d:0 "One major issue in dispute is the Suez Canal.\n\nAfter victory in Egypt, the canal was handed to Italian control; since then, they have monopolized passage, forcing other Triumvirate members to pay tolls just like nations outside the alliance. Iberia has long sought free passage through the canal, for unlike Turkey it has no influence in the region.\n\nRepresentatives of Italy and Iberia, plus observers from the other three member states, gathered in a lavish ballroom to discuss canal passage rights."
 maltaconference.8.a:0 "Let us begin!"
 maltaconference.9.t:0 "Iberia Makes Its Demands"
 maltaconference.9.d:0 "In the first round of talks, Iberian diplomat Fernando María Castiella y Maíz demanded free passage through the canal for Iberia. The discussion lasted hours, until the Spaniard slammed his hand down on the table.\n\n'You have held the canal for too long!' he shouted. 'As your ally, why should we pay to use it?! If you grant us unlimited access, we will even make a one-time aid payment for it. This is my final offer: take it or leave it.'"
 maltaconference.9.a:0 "Absurd - refuse outright!"
 maltaconference.9.b:0 "Perhaps we can reach a deal..."
 maltaconference.9.c:0 "Things are heating up..."
 maltaconference.10.t:0 "Ciano Refuses"
 maltaconference.10.d:0 "Ciano fired back: 'Ridiculous! We trusted you for twenty years, and this is how you repay us? We fought and bled on this territory. You offer us a pittance? Three words: impossible! There is nothing more to discuss!'\n\nThe Iberian delegation responded in shock:\n\n'You have gone too far! We want equal treatment, yet you wish to be our patriarch!'\n\nThey then declared they would not attend the border consultation sessions scheduled later, and ended with a sharp rebuke of Ciano.\n\n'We allied with you decades ago because you promised equality and freedom from tyranny. And now? You are no different from the Germans! Looking down on us, ordering us about like those German Reichskommissariats! We are walking out!'"
 maltaconference.10.a:0 "Just as expected."
 maltaconference.11.t:0 "Ciano Agrees to Negotiate"
 maltaconference.11.d:0 "Ciano answered: 'Gentlemen! Let us be civil! I am not sure I am willing to accept this deal, but perhaps we can reach another agreement.'\n\nThe Iberian delegation nodded cautiously. Ciano and the other Italian delegates quickly left the conference room to confer in whispers, while the Iberian delegates consulted among themselves."
 maltaconference.11.a:0 "Let us see how things develop..."
 maltaconference.12.t:0 "Iberia Bargains"
 maltaconference.12.d:0 "They returned hours later.\n\n'What about Algeria?' Castiella y Maíz asked, bringing up the sore point. 'If we forget this argument, we take it - and that little rebellion - off your hands. Your colonial reach is overextended, and you know it.'"
 maltaconference.12.a:0 "That may be a step too far..."
 maltaconference.13.t:0 "Ciano Refuses Again"
 maltaconference.13.d:0 "Ciano fired back: 'Ridiculous! We trusted you for twenty years, and this is how you repay us? We fought and bled on this territory. You want to steal it? Three words: impossible! There is nothing more to discuss!'\n\nThe Iberian delegation responded in shock:\n\n'You have gone too far! We want equal treatment, yet you wish to be our patriarch!'\n\nThey then declared they would not attend the border consultation sessions scheduled later, and ended with a sharp rebuke of Ciano.\n\n'We allied with you decades ago because you promised equality and freedom from tyranny. And now? You are no different from the Germans! Looking down on us, ordering us about like those German Reichskommissariats! We are walking out!'"
 maltaconference.13.a:0 "Just as expected."
 maltaconference.14.t:0 "Iberia Refuses to Attend Border Consultations"
 maltaconference.14.d:0 "This morning, as the dignitaries took their seats for the border consultation sessions, the Iberian delegates did not break their word - they were nowhere to be seen.\n\nThe Turkish diplomats looked relieved, while the Italian delegates were worried. Ciano feared the conference was falling apart before his eyes."
 maltaconference.14.a:0 "More opportunities for us!"
 maltaconference.14.b:0 "Let them keep posturing."
 maltaconference.15.t:0 "Border Consultations Begin"
 maltaconference.15.d:0 "By far the greatest conflict within the Triumvirate is the many border disputes it has bred. To address this, the conference has set aside two full days specifically to negotiate the nature of these disputed territories. The Iberian diplomats were, predictably, absent from the start, having told their hosts beforehand that they refused to attend, as if they stood above all of us. President İsmet İnönü took the podium first, holding an oversized map of the Eastern Mediterranean, with his entourage behind him. He then began explaining the historic importance of Cyprus and Rhodes to Turkey, and the demographics of the two islands, emphasizing, as Inönü did, that 'the vast majority of inhabitants are ethnically pure Turks.'\n\nRhodes and Cyprus, long controlled by Italy and its Greek satellite, have long been a thorn in Turkey's side - partly because the largest minorities on both islands are ethnic Turks, but more importantly because of their strategic significance, as both islands sit at the entrance to the Aegean and Eastern Mediterranean. As Triumvirate relations soured, and Italo-Turkish relations replaced past alliance with barely concealed threats and confrontation, Inönü grew more outspoken in refusing to allow these 'rightfully Turkish' territories to remain outside the Turkish state.\n\n'Our demands are clear. We only want what is obviously ours,' Inönü answered when asked about concessions. 'We will not yield, we will not bend, we will not stop until we get what we are owed.' This also hinted at what would surely happen if Turkey's demands were refused."
 maltaconference.15.a:0 "You too? Our answer is no."
 maltaconference.15.b:0 "Perhaps we can reach a deal?"
 maltaconference.15.c:0 "It seems Iberia is not the only side with ideas..."
 maltaconference.15.e:0 "Cyprus and Rhodes are rightfully ours!"
 maltaconference.16.t:0 "Ciano Negotiates"
 maltaconference.16.d:0 "Ciano paused:\n\n'I think a deal can be made here. Those islands were originally used as naval bases, and are not as useful as the mainland, so I believe we can reach agreement on this.'\n\nInönü nodded: 'Good. Let us convene a meeting to discuss this.'"
 maltaconference.16.a:0 "Worth a try."
 maltaconference.17.t:0 "Negotiations Collapse"
 maltaconference.17.d:0 "The talks had gone smoothly, and the ownership of some islands had been settled.\n\nUntil Inönü dropped a bombshell near the end of the negotiations.\n\n'Who do you think you are, treating us like dirt?' he shouted at Ciano. 'By what right do you return these islands to us like a god?! You should apologize and pay reparations for your colonial acts and illegal occupation! These islands were not given to us by you! They were bought with Turkish blood!'"
 maltaconference.17.a:0 "That is the end of that."
 maltaconference.18.t:0 "Ciano Refuses to Negotiate"
 maltaconference.18.d:0 "Ciano shook his head:\n\n'We will not suffer the indignity of ceding land,' he said seriously. 'We need those islands as bases. But we eagerly seek joint control of the bases -'\n\nInönü cut him off: 'Dammit! I knew coming to this conference was a mistake! You only want to maintain Mediterranean hegemony and use us as pawns! I have had enough of your empty promises!'"
 maltaconference.18.a:0 "Just as expected."
 maltaconference.19.t:0 "Meeting in St. Julian's"
 maltaconference.19.d:0 "The President leaned back in his chair and took a long drink of wine.\n\n'You and I know as well as anyone, Franco. Ciano will not agree to any of our demands. Nothing will jolt his sluggish brain. What we need is to let him know we can cooperate. I tell you, this will check him!'\n\nFranco did not seem interested, turning his gaze to the distant Mediterranean. 'Is that so? And in what area do you suggest we cooperate? If you haven't noticed, let me be blunt - we have no inclination to cooperate.'\n\nSalazar opened his mouth, but before he could speak, Inönü cut him off. 'Just escalate the border conflicts. You won't bear much responsibility, and it won't blow up, I assure you. Lend a brother a hand on this, or else I will not support you when your regime collapses.'\n\nThis successfully caught Franco's attention. 'Fine, wait while I discuss this with some of my generals. I cannot guarantee -'\n\n'Right, you cannot guarantee anything. Not unless I allow it.'\n\nFranco's Portuguese friend began to obstruct him, but Franco was not cowed by the pressure.\n\n'You are right. Speaking of which, do you agree with this proposal, Salazar?'\n\n'Agreed. Come, let us summon the generals.'\n\nThough the leaders refused to comment on specifics, this 'secret' meeting soon became common knowledge. If there is one thing the Triumvirate can cooperate on, it is each other's destruction."
 maltaconference.19.a:0 "These turncoats!"
 maltaconference.19.b:0 "Perhaps we can reach some understanding..."
 maltaconference.20.t:0 "Bomb Attack on the Malta Conference!"
 maltaconference.20.d:0 "The first reports reaching Rome were fragmented and chaotic: 'Fire breaks out in Birgu,' 'Turks set a trap and invade Malta,' 'German navy bombards Fort St. Angelo,' 'Someone attempts to shoot Ciano.'\n\nPhone lines at the venue had been deliberately cut, and attempts to verify events were futile. Some tried to piece it all together, but the contradictions led nowhere. All anyone could do was wait and hope.\n\nFortunately, they only waited a few minutes before receiving confirmation that 'the Duce is alive and will return to Rome.' Clearer details followed: a bomb exploded at Fort St. Angelo, destroying the conference room, but by sheer timing, the President and the two caudillos all survived. The attackers' identities remain unknown; even if the plot was hatched by a Triumvirate member, they are unlikely to step forward to claim responsibility. Some in Rome have already condemned Iberia and Turkey, and no doubt the other two will condemn us as well.\n\nThe conference had opened in an already tense atmosphere, and now conflict is absolutely imminent. If the attackers' goal was to create chaos in the Mediterranean, they have certainly succeeded."
 maltaconference.20.a:0 "When it rains, it pours..."
 maltaconference.21.t:0 "Iberia and Turkey Condemn Italy, Recall Delegates"
 maltaconference.21.d:0 "Unsurprisingly, no party in the Triumvirate is willing to take responsibility for the explosion. Though Italy claims it had nothing to do with the blast, as it had no motive, this has not stopped Iberia and Turkey from blaming the entire tragedy on Italy. Both Iberia and Turkey have already withdrawn their delegations, deeming it unsafe to remain there."
 maltaconference.21.a:0 "No, wait...!"
 maltaconference.21.b:0 "Time to end the word games!"
 maltaconference.22.t:0 "Dissolution of the Triumvirate"
 maltaconference.22.d:0 "From a very secure secret location in Rome, Duce Ciano announced with a heavy heart on national television the dissolution of the Triumvirate, effective immediately. Though Ciano stressed that the alliance was his creation, and that the Triumvirate had successfully contained the militaristic Germans, everyone knew: even without the explosion, the alliance's dissolution was already inevitable. It is the inevitable result of a coalition of states with 'egotistical leaders,' 'conflicting goals,' and 'competing spheres of influence.'\n\nNo doubt the news has sparked fierce debate in Madrid and Ankara. On one hand, they cheer their newfound freedom; on the other, they are enraged that their own pre-emptive, dramatic exit has been pre-empted. But the threat of Germany looms in many minds. Perhaps we will hold an hour of silence for the Triumvirate, but that time is still far off; at least tonight, few will mourn its dissolution."
 maltaconference.22.a:0 "So be it."

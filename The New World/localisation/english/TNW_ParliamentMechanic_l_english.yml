 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_ex: "Description description description"
 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_Harold_Macmillan: "Sacrifice is the noblest quality a statesman can possess — which is perhaps why it is so rare. Harold Macmillan possesses it, willing to do anything to prevent England from sliding into another devastating war. In Macmillan's view, whether fighting Germany or America, England is not ready to send another generation of youths to die on the battlefield. Though it remains to be seen whether Macmillan can achieve his aims, he will certainly show no mercy to his opponents — that is God's affair."
 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_Arthur_Chesterton: "Arthur Kenneth Chesterton is a man of many parts — a scarred Great War veteran, a theatre critic, a drunkard. He was once a Fabian; now he is a fascist. Though Chesterton broke with Mosley's crumbling British Union of Fascists early on, the Axis conquest of Egypt hardened his conviction in fascism.\n\nIt was for this purpose that Chesterton united the Tory hardliners and today's National Front under his banner. But Chesterton's golden age is long past; the party is riddled with factions and on the verge of collapse. Only time will tell whether he can truly realize his vision of a fascist Britain, or will ultimately be destroyed by the Nazi lackeys he calls allies."
 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_Margaret_Thatcher: "Margaret Thatcher is a woman of steel will. Though born to a Methodist missionary family that sheltered Jews fleeing Nazi Germany, she believed from a young age that open conflict with Germany would bring only utter ruin to England. Mrs. Thatcher certainly hates Germany and will do everything in her power to restore the strong England of her youth, but as long as she lives, as long as she has breath, she will not test the fascists across the Channel. Whether in opposition or leading the governing party, Thatcher will not waver on this issue."
 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_Reginald_Maudling: "To be a liberal in this age requires true courage. Reginald Maudling did not reach his position by keeping a low profile and staying silent; quite the opposite. Through his alliance with Macmillan, Maudling became one of England's most powerful men, pouring his energy into the movement to restore proper democratic institutions, and his position forces those who would prefer him silent to take democratization seriously. As long as Maudling holds the dream of English democracy, he will not let those people have their way."
 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_George_Jellicoe: "George Jellicoe's father won renown at Jutland; no one expected him to match his father's achievements. Frankly, no one expected him and the Commandos to turn the tide of WWII. But out of low expectations grew an unlikely courage; Jellicoe, with his wits and his weapon, rose from soldier to obscure civil servant, then to leader of the largest and most diverse party England has ever seen. Of course, Jellicoe is by nature a cheerful playboy, but beneath the hedonistic exterior lies a formidable strategic mind."
 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_Harold_Wilson: "That an economist and civil servant should become a leader of a major resistance movement in the fifties is remarkable, but only his fanatical idealism and sincere desire for reform match Harold Wilson's will. Wilson leads a coalition of socialists, communists, and many other factions; he has focused the SLP's hotheads on their opponents and directed the whole party toward elections, making him one of England's finest political figures. For the opposition, this is the greatest luck: as long as the party stands united, Wilson will be unstoppable."
 TNO_ParliamentMechanic_Ideas_OppLeader_Desc_No_Opposition: ""

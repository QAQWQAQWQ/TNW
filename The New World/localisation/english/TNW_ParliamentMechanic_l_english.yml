 TNO_ParliamentMechanic_Ideas_Speaker_Desc_ex: "Example!"
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Military_Government: "Silence reigns in the streets of London. The Palace of Westminster stands empty. The English government has collapsed, and its military has seized direct control to prevent the nation from descending into anarchy. England is under martial law, and for the first time in centuries, the office of Prime Minister lies vacant.\n\nFrom the Hundred Years' War to the Nazi invasion, the English lion has fought many battles, but for the second time in a decade, Britain's future seems uncertain. Perhaps this will be remembered as but a temporary setback on England's superior path, or perhaps the lion has finally been killed — not by a foreign foe, but by internal strife."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_No_Opposition: ""
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Alec_Douglas_Home: "It is said that Alec Douglas-Home is the only Prime Minister in over twenty years capable of serving more than three terms — though that record is hardly a badge of honor. By negotiating with the party's major factions, he has united the warring Tory power blocs into a party that is, at least on the surface, cohesive, and has handled the armed insurgency without direct intervention from Cornwall, much to the surprise of critics, who saw him as the first PM to manage the latter. Perhaps Douglas-Home is the Prime Minister England needs — and if not, England can only rely on him."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Harold_Macmillan: "Sacrifice is the noblest quality a statesman can possess — which is perhaps why it is so rare. Harold Macmillan possesses it, willing to do anything to prevent England from sliding into another devastating war. In Macmillan's view, whether fighting Germany or America, England is not ready to send another generation of youths to die on the battlefield. Though it remains to be seen whether Macmillan can achieve his aims, he will certainly show no mercy to his opponents — that is God's affair."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Arthur_Chesterton: "Arthur Kenneth Chesterton is a man of many parts — a scarred Great War veteran, a theatre critic, a drunkard. He was once a Fabian; now he is a fascist. Though Chesterton broke with Mosley's crumbling British Union of Fascists early on, the Axis conquest of Egypt hardened his conviction in fascism.\n\nIt was for this purpose that Chesterton united the Tory hardliners and today's National Front under his banner. But Chesterton's golden age is long past; the party is riddled with factions and on the verge of collapse. Only time will tell whether he can truly realize his vision of a fascist Britain, or will ultimately be destroyed by the Nazi lackeys he calls allies."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Margaret_Thatcher: "Margaret Thatcher is a woman of steel will. Though born to a Methodist missionary family that sheltered Jews fleeing Nazi Germany, she believed from a young age that open conflict with Germany would bring only utter ruin to England. Mrs. Thatcher certainly hates Germany and will do everything in her power to restore the strong England of her youth, but as long as she lives, as long as she has breath, she will not test the fascists across the Channel. Whether in opposition or leading the governing party, Thatcher will not waver on this issue."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Rab_Butler: "No one expected Rab Butler to reach high office, nor to hold the highest power. Born in India to a civil servant family, he might never have risen to the national stage but for the need to appease German ambitions. The aftermath of the Second World War made Butler one of the most popular politicians, and he was asked to lead the newly formed Tories, after which he never looked back. Though Butler has many ties to the Tory elite, he does not fully share the views of some of his colleagues."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_George_Jellicoe: "George Jellicoe's father won renown at Jutland; no one expected him to match his father's achievements. Frankly, no one expected him and the Commandos to turn the tide of WWII. But out of low expectations grew an unlikely courage; Jellicoe, with his wits and his weapon, rose from soldier to obscure civil servant, then to leader of the largest and most diverse party England has ever seen. Of course, Jellicoe is by nature a cheerful playboy, but beneath the hedonistic exterior lies a formidable strategic mind."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Harold_Wilson: "That an economist and civil servant should become a leader of a major resistance movement in the fifties is remarkable, but only his fanatical idealism and sincere desire for reform match Harold Wilson's will. Wilson leads a coalition of socialists, communists, and many other factions; he has focused the SLP's hotheads on their opponents and directed the whole party toward elections, making him one of England's finest political figures. For the opposition, this is the greatest luck: as long as the party stands united, Wilson will be unstoppable."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Reginald_Maudling: "To be a liberal in this age requires true courage. Reginald Maudling did not reach his position by keeping a low profile and staying silent; quite the opposite. Through his alliance with Macmillan, Maudling became one of England's most powerful men, pouring his energy into the movement to restore proper democratic institutions, and his position forces those who would prefer him silent to take democratization seriously. As long as Maudling holds the dream of English democracy, he will not let those people have their way."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_Reg_Birch: "The thoroughness with which the London Uprising was crushed cannot be overstated. Of the Communist leaders directly involved, only forty-some escaped, and three weeks later, fewer than half of the actual combatants were still alive. But Reg Birch persevered as always, refusing to give up. Birch was one of the chief architects of the surviving left-wing resistance and its merger with the HMMLR, rebuilding this communist network into a more clandestine fighting force. Now that the fascists are gone, the former engineer has become the voice of British communism — and those who would stand in his way had better pray for God's help."
 TNO_ParliamentMechanic_Ideas_Speaker_Desc_David_Stirling: "No one has fought longer in the British Isles than David Stirling. After WWII ended, Stirling fled the surrender forces in central England. From the beginning of Tory rule to the end of the collaborationist government, he led the only resistance organization that fought from start to finish. On today's political stage, those who planned and executed resistance strategy have changed their ways, choosing a more peaceful path, though some believe greater risks lie ahead. For a boy born in Perthshire, risk is no bad thing, and German corpses make everything better."

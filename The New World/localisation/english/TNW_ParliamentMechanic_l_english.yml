 TNO_ParliamentMechanic_Ideas_Monarch_Desc_ex: "Description description description"
 TNO_ParliamentMechanic_Ideas_Monarch_Desc_Edward_VIII: "From the radical Bill Alexander to the conservative Church of England, all loathe King Edward VIII of England, this monarch crowned twice. Born during Queen Victoria's reign, Edward was the direct heir to the British throne. He was crowned King for the first time in 1936, and after three unremarkable years, faced a crisis — he planned to marry an American divorcée, which forced his abdication. Yet soon after, he ascended the throne once more.\n\nWhen the Germans set foot on English beaches, they crowned Edward as their puppet king, and so he once more, reluctantly, became King of England. This reign, though far longer than the first, has been fraught — the HMMLR grows stronger by the day, and England's economy is mired. In truth, Edward's greatest wish is to abdicate immediately, but he must lead the nation through this turbulent hour."
 TNO_ParliamentMechanic_Ideas_Monarch_Desc_Elizabeth_II: "It was once thought Elizabeth Alexandra Mary Windsor would live out her days as a princess of a cadet branch, but when her uncle abdicated and her father was crowned, everything changed. In just a few years, Elizabeth became the undisputed heir to the English throne. After the English Channel barrier was breached, Elizabeth withdrew to Canada at the first opportunity, spending twenty years there as the pretender to the English throne.\n\nThough the British Empire has long since crumbled, she gained the help of the old Dominion governments and the support of the resistance movement at home. After the resistance won the civil war, Elizabeth returned to her homeland as Queen Elizabeth II of England. The English people pray that the Queen will not suffer the same fate as her uncle, and that she will lead England into a new era of prosperity. Now it falls to her to let the kingdom rise from the ashes."
 TNO_ParliamentMechanic_Ideas_Monarch_Desc_Henry_IX: "Henry Windsor is the third son of George V, and an unlikely king. For most of his life, he watched from the sidelines as his elder brothers ruled England, his position far down the line of succession. He was Duke of Gloucester, a prince of the House of Windsor. After Edward's abdication and the victory of the Collaborationists in the English Civil War, Henry finally had his moment.\n\nThe Collaborationists chose Henry as king because the other legitimate heirs, including Elizabeth, were out of the question. Henry IX reluctantly became King of England, and now it falls to him to restore the trust of the English people and rebuild England."
 TNO_ParliamentMechanic_Ideas_Monarch_Desc_Henry_IX_Incapacitated: "Most unfortunately, King Henry IX is no longer fit to rule. Only a year after taking the throne, he suffered a stroke; he can barely walk now, let alone govern. In the King's absence, his son, Prince William, will act as regent. And as heir apparent, William may soon succeed his father, crowned as King William V. That the English king should be incapacitated barely a year after his coronation is a dire omen. We can only pray that England does not suffer the same fate as its King."
 TNO_ParliamentMechanic_Ideas_Monarch_Desc_NoMonarch: "For the first time since Cromwell, the English throne lies vacant. Parliamentary acts, not royal decrees, govern the realm; traditionalists hope this is but a brief interregnum before a new monarch ascends, but for socialists, this is no mere power vacuum — it is the first step toward a glorious age of popular sovereignty. The thousand-year-old English monarchy may be broken, or it may yet usher in another millennium of divine right."

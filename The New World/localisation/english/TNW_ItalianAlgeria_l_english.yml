 POLITICS_GIUSEPPE_CASTELLANO_DESC:0 "General Giuseppe Castellano is perhaps one of the most common gossip topics in the upper echelons of the Royal Italian Army. A veteran of both world wars, he served with distinction on the Balkan front during the last war, and was later promoted into Italy's supreme command. Castellano's ambitions were high, but fate had other plans - a few years after the war's end, the new Duce Galeazzo Ciano entrusted Castellano with a major responsibility: to govern the lawless frontier of Algeria.\n\nCastellano has led the Military Administration of Algeria for several years, but his leadership has done little to improve the region's situation. Most Italian colonists are from Sicily and often have ties to old Mafia families; they were drawn to Algeria because the region was considered far from Rome's scrutiny. Enclaves formed by these colonists are scattered across Algeria, and there are many rumors about the true extent of Castellano's ties to the Mafia. Rome's decision to support local Algerian militias, such as the National Liberation Front, arming them against the Iberian colonial government and their 'pied-noir' allies, has further destabilized the situation.\n\nThe governor, trapped in Algeria, has few resources to actually govern, and is thus forced to watch as the situation slips further and further from his control. Yet, as tensions rise again within the Triumvirate, Algeria and Castellano may once again find themselves in the spotlight. If so, Castellano may have the chance to prove his usefulness to Italy and reclaim his honor - from a general ruling a remote corner of the Empire through shady deals and backroom negotiations, to a national hero who saves the Empire's frontier from its many enemies."

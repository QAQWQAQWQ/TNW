 VOR: "Vorkuta"
 VOR_DEF: "Vorkuta Corrective Labor Camp"
 VOR_ADJ: "Vorkuran"
 VOR_communist_party: "Gulag Directorate of the NKVD"
 VOR_communist_party_long: "Main Directorate of Corrective Labor Camps and Colonies of the People's Commissariat for Internal Affairs of the Union of Soviet Socialist Republics (Glavnoe upravlenie ispravitel'no-trudovikh lagerey i koloniy Narodnogo komissariata vnutrennikh del Soyuza Sovetskikh Sotsialisticheskikh Respublik)"
 POLITICS_VASILY_BLOKHIN_DESC: "Some men live by a strict moral code, but Vasily Mikhailovich Blokhin left those behind long ago, becoming the chief executioner of the People's Commissariat for Internal Affairs, the NKVD. As a Chekist, his efficiency at doing the dirty work was unmatched, and it was this that earned him rapid promotion. Blokhin's brutality was legendary: he personally oversaw mass executions of "enemies of the state," from the lowliest wretches to the most famous Bolsheviks in Soviet history. Thousands died under his watch, yet he somehow managed to avoid being caught up in any of the purges himself.

When World War II ended in the Soviet Union's humiliating defeat, Blokhin refused to let his power fade so easily. As commandant of the Vorkuta camp, part of the vast Gulag system, he continued to exercise his authority, initially as a proxy for the West Russian Revolutionary Front. In truth, he did as he pleased, for no one could stop him — they had either been executed or mysteriously disappeared. Yet the situation changed as Gulag prisoners began to rise up against their guards: the formation of the opposition Ural Union put him in danger. But soon they fled south, and Blokhin once again became supreme ruler.

Vasily Blokhin was left to administer the Vorkuta Gulag, now ruling the city itself after the collapse of the West Russian Revolutionary Front in the famous West Russian War. With the help of the few remaining guards, he reorganized the region and successfully built his own warlord state. Yet Blokhin is not an ambitious man: all he wants is the independence and survival of his domain, no matter the cost."

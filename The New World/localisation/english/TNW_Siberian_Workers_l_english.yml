 KAL_do_no_harm_desc: "One of the principles our union holds is that violence of any kind is forbidden: men may not brawl with other men, nor women with other women. Our people have endured enough violence and bloodshed; they want only to live in peace. Unlike our ancestors, however, here the peasants are not oppressed by landlords.\n\nShould anyone dare disrupt our peace and invade our borders, we will take up arms in self-defense."
 KAL_strength_in_diversity_desc: "We are a union of all faiths and cultures. As long as they do their part, Christians, Muslims, atheists, Jews - we welcome all. Though conflict arises between groups now and then, the union is a clean land free of the chauvinism that has poisoned humanity for so long."
 KAL_all_power_to_the_soviets_desc: "The soviet is the central body of our small state - every decision is made by collective vote. The system is not efficient, but since the Federation's collapse, this form of democratic centralism has served us well."
 KAL_industrialist_tendencies_desc: "Industry is key to national survival. The legacy of the Siberian Project has sheltered our workers through hard times, and if the worst comes to pass, our factories will churn out rifles in bulk. Looking ahead, workers may one day make full use of industrial resources to better themselves at work. In the wastes of Siberia, Bukharin's legacy may yet help us realize the communist dream."
 KAL_arise_ye_workers_from_your_slumbers: "Arise, Ye Prisoners of Misery"
 KAL_arise_ye_prisoners_of_want: "Arise, Ye Starving Millions"
 KAL_reason_in_revolt: "Our Hearts Are Burning"
 KAL_on_tyrants_only_well_make_war: "Rise Up for the Truth!"
 KAL_comrades_come_rally: "United We Will Be"
 KAL_spurn_the_dust: "We Shall Be Masters of the World"
 KAL_no_more_deluded_by_reaction: "No More Deluded by Reaction"
 KAL_each_at_the_forge_must_do_their_duty: "Stoke the Furnaces Red Hot"
 KAL_strike_while_the_iron_is_hot: "Strike While the Iron Is Hot"
 KAL_unite_the_human_race: "Unite the Human Race"
 KAL_the_last_fight: "The Internationale"
 KAL_arise_ye_workers_from_your_slumbers_desc: "'Comrades!\n\nWords are weak, action is strong. No matter how pretty the pie in the sky, it is nothing if you cannot eat it. Those high and mighty lords talk big again and again, buzzing like a machine. Their entire existence rests on exploiting the working class; they use police and army to oppress you, and numb you with promises of a bright future.\n\nWe must make those bastards understand that workers will not be slaughtered at will. The workers of our land, and our fellow workers in other nations, can halt industrial production with a single decision - stall the enemy's terrible war machine. And for those who want to go further: the best ally of the working class is in your own home - your hunting rifle. From now on, your prey is not game, but the enemies of the people.\n\nHere, I call on all workers of Siberia: Arise! Fight for our freedom, for the liberation of workers the world over!'"
 KAL_arise_ye_prisoners_of_want_desc: "'Comrades,\n\nBefore you go into battle, you must understand: this war is nothing like the ones our fathers fought. There will be no dependable logistics, no back-and-forth engagements. If you compare this to the Great Patriotic War, you will lose before it even begins.\n\nComrades, you must regard your brigade as an independent column, one part of a great collective. Most of the time, you fight alone; when necessary, side by side - but at the end of the day, every column fights its own battle, with composition and objectives adapted to the situation. To win this war, you must strike the enemy's soft spots hard.\n\nSet-piece battles go without saying, but to be like ten thousand ants with bared fangs, breaking the enemy's morale before they even engage us - that is not something words alone can achieve.'"
 KAL_reason_in_revolt_desc: "'A brief notice to the workers' columns:\n\nWorkers waging a heroic struggle against tyranny must understand that the reactionaries have us surrounded. We cannot produce enough weapons to arm every comrade - we have no factories, and even if we wanted to build them, our current infrastructure is inadequate.\n\nTherefore, we need to make as many friends as possible. Our enemy is not any individual soldier or peasant, but the exploiters - the reactionaries who use nationalism or religion to numb class consciousness. We must gather support however we can: peasants' food can feed our comrades; enemy soldiers' bullets can be turned against their own generals.\n\nThat is why I, Kostin, oppose some comrades who in recent days have blamed innocent civilians for the crimes of the current hostile regime. While those comrades have a right to their opinions, in my view we should make many friends and few enemies.'"
 KAL_on_tyrants_only_well_make_war_desc: "Historical document S1451 - anarchist leaflet distributed to workers in Krasnoyarsk against Russian right-wing forces:\n\n'Comrades,\n\nMany so-called 'moderates' always say, 'The current rulers may be imperfect, but they are better than warlords or nothing at all.'\n\nThat may be true, but have you considered: do you really want to? You, the workers of this great land, want to kneel and let tyrants command you, just because they can keep the trains running on time?\n\nDo you want the all-powerful bosses to destroy the unions you built? Do you want the colluding bosses to undermine your rights as workers, because they care more about power than the rights you earned with your sweat?\n\nWake up! The so-called moderates are traitors and enemies of the working class! They are blocking our path to true freedom!\n\nJoin the Workers' Federation!\n\nKostin, the New Cincinnatus'"
 KAL_comrades_come_rally_desc: "'Comrades,\n\nThe moderates and reactionaries have blinded you with lies, turning your guns against your brothers. In this decisive battle between socialism and capitalism, our enemy is not you, soldier! You too are victims of this war. In the eyes of the capitalists, you are only a temporarily useful tool, to be discarded when spent!\n\nSoldiers, even if you now stand against the revolution, you can tear off the blindfold of 'nationalism' the capitalists have put on you, turn your guns toward the capitalists and their allies, defend the nation and the workers of the world, join us, and together liberate all humanity exploited by the bourgeoisie!'"
 KAL_spurn_the_dust_desc: "A letter from Kostin to an unnamed general in the Workers' Federation:\n\n'As I write this, revolutionary terror is sweeping this land in our name, in the name of freedom. Soldiers in ragged uniforms burn so-called 'reactionary' towns, lynch village elders and religious believers who refuse our governance. No matter how many times I repeat 'stop,' these reports keep appearing before my eyes. They have become beasts, destroying our beliefs and everything we have built. No matter how hard I try to stop it, it is useless...\n\nI feel helpless.'"
 KAL_no_more_deluded_by_reaction_desc: "'The church is a refuge for reactionaries and troublemakers. Besides, if God is truly all-powerful, how could we possibly oppose His boundless, all-knowing will?'\n- the dreaded Kirgin, known for ordering the destruction of over fifty churches and personally killing as many as two hundred Orthodox believers.\n\nThough Kostin and many in the Workers' Federation opposed the destruction of churches, they could not prevent it. The left-radical generals cared only about the fate of holy relics, not about winning the peasants' trust.\n\nMany doubt whether the aftershocks of the revolution will ever settle."
 KAL_each_at_the_forge_must_do_their_duty_desc: "Comrade Kostin addresses the workers:\n\n'Workers, you have believed from the start that this revolution for freedom and liberation will triumph. But the difficulties we face are clear to all: productivity is too low. The enemy still controls much industry, and we are outmatched in nearly every respect.\n\nThat does not mean we will fail. This is an opportunity to seize! Workers of the Federation, we have cast off the framework of capitalism, free from the grip of capitalist interests. We can use the power of human ingenuity, explore new ways to increase production, find new methods to produce weapons quickly and efficiently.\n\nFellow workers, you stand on the front line against capitalism! Down with fascism, long live freedom!'"
 KAL_strike_while_the_iron_is_hot_desc: "We cannot attack the enemy's fortified centers head-on; that would only waste the lives of our comrades and precious supplies. It is wise to aim only at the weakest points.\n\nThe peripheral regions the enemy recently conquered are our primary targets. In these areas there are many who long for the old rulers. Even if they cannot join us, they can fight the common enemy. The enemy is divided, and local bureaucrats lack the people's trust, while we are united - our offensive will be irresistible."
 KAL_unite_the_human_race_desc: "'Comrades,\n\nOne of the most basic tenets of socialism is that all people have an equal right to life, and all are entitled to food, shelter, healthcare, and other rights. But as society advances, some people are denied certain rights - the right to fight for the greater common good.\n\nBut from today on, all people, regardless of age or sex, have the right to choose whether to defend the nation and the revolution. We believe in equality, and now is the moment we achieve it.\n\nSome comrades have taken the wrong line, believing that guarding against reactionaries is more important than advancing the revolution, and that certain people should not fight for it.'"
 KAL_the_last_fight_desc: "From Kostin's address to the workers' brigades:\n\n'Comrades, listen: the enemy is preparing for a decisive battle. The capitalists have squeezed the workers dry, the generals march their soldiers at the crack of dawn, and the newspapers print page after page claiming that 'revolutionary terror' is at hand. Their goal is to destroy us.\n\nBut we do not sit and wait, friends. We too have been actively preparing for their attack. We have armed every able-bodied person in the Federation; crossing us will cost dearly.\n\nEvery city is an impregnable fortress, not to be taken without nuclear weapons. We welcome their challenge. Personally, I am willing to die for the revolution - as every outstanding socialist should. Our sacrifice will become poetry in the long river of history. Comrades, our heroic story will be passed down through the generations. They cannot stop us.'"
 KAL_arise_ye_prisoners_of_want_tt: "§YNew Militia Divisions§! join our struggle!\n"
 kostin.1.t: "Gathering Storm"
 kostin.1.d: "Beneath the frenzy of Siberian reunification, a whisper passes. The brighter the light shines, the deeper the shadow grows. The inhuman tragedies of our unification have bred a festering sore, rooted deep within, silently awaiting the day it erupts. Now it no longer bothers to hide; it proclaims openly: 'I was here, I have come again, and I shall return!'\n\nThe entire working class of the West Siberian industrial belt has organized a general strike. They protest the appalling working conditions, the broken promises, and the factory owners' unrepentant brutality.\n\nIn the Russian wasteland, the goal of restoring civilization rings hollow. When a man cannot feed his family or even guarantee his own personal safety, the noble ideal of a reunited Russia means little. As regional order has normalized, workers have lost their value - they are merely pawns in the great game of unification.\n\nNow the factories stand still, the strikers present their demands, and old scores are being settled. Though there are voices within the government sympathetic to the strikers, we cannot tolerate economic paralysis, especially amid Russia's unstable situation. The strikers are numerous and well-armed; either we reach some agreement with them, promise them the moon, offer concessions - or we prepare for the storm that is coming."
 kostin.1.a: "How tragic..."
 kostin.2.t: ""
 kostin.2.d: ""
 kostin.2.a: ""
 kostin.3.t: "Eye of the Storm"
 kostin.3.d: "The general strike grows more severe by the day, and we have no viable solution. Violence escalates step by step, and the workers have taken up arms in open revolt! Raids on armories, looting of cellars, and outright robbery are commonplace; weapons and ammunition flow into the hands of the radicals. The workers have even organized their own 'General Defense Committee.'\n\nThe situation is extremely dangerous, and the shadow of rebellion blocks out the sun. We must be more cautious than ever while ensuring our own safety and taking effective action.\n\nIf we stand idle, we may all be doomed..."
 kostin.3.a: "Bastards all!"
 kostin.4.t: "Call to Revolt"
 kostin.4.d: "Comrades,\n\nI am not like those scoundrels who fled to Siberia; I will not lie to you. The truth is simple - so simple I need no fancy words to explain it. It is a fact any Russian child knows.\n\nThose at the top are the problem.\n\nYou know the kind I mean. The ones who promise peace, promise prosperity, promise... well, what don't they promise? They were doing this even before the Great Patriotic War. Now, when our land lies in ruins and our people beg in the dirt, what have the rulers done?\n\nNothing but promise!\n\nWe are sick to death of promises, lies, and barbarism. That is why I am here, telling you the plain truth. I am not your leader, and I do not want to be your leader. I am just a man, like any of you - a man who wants the killing to stop.\n\nNow we have a chance to build a new Russia, a Russia where all are truly equal. A Russia without leaders. To build it, we must rise up and fight. Whatever happens, the common people of West Siberia have nothing to lose. It is we who keep production running, who ensure those bastards get their bullets, bread, and steel on time.\n\nIn the name of all the dead children, all the widowed wives, all the crippled brothers. To hell with their promises!"
 kostin.4.a: "Can everyone just calm down?!?"
 kostin.5.t: "Novosibirsk Revolt"
 kostin.5.d: "Grim news from Novosibirsk. From the scant information we have gathered, the city appears to have descended into conflict, with workers on strike for weeks protesting for fairer wages. Unfortunately, they have grown increasingly discontent with the current situation, and their shouts have turned into the roar of revolutionary fire.\n\nFortunately, support for this 'workers' uprising' seems limited, and their glorious militias look more like mobs than an army. Nonetheless, these armed militias still control the industry and population around Novosibirsk. We should be careful with the rapidly escalating situation."
 kostin.5.a: "Aren't there more important problems in the city?"
 kostin.6.t: "Krasnoyarsk Revolt"
 kostin.6.d: "Gloomy news from Krasnoyarsk. The few units still stationed in the city report that the previously striking workers have taken violent action, occupying the streets of Krasnoyarsk in open defiance. Even as we speak, the city's armory is being looted and street fighting rages. Though the situation is bad, the workers joining this uprising seem unprepared for revolution, and support is confined to the city itself.\n\nIn any case, these rebellious workers control the industry and population around Krasnoyarsk. If we do not address the situation soon, the flickering spark of revolution may well become a raging fire."
 kostin.6.a: "First a mutiny, now a revolution."
 kostin.7.t: "Tomsk Revolt"
 kostin.7.d: "After losing contact with Tomsk for several days, the situation appears to have worsened. Striking workers in the city have taken up arms and launched a full-scale uprising. Even with the help of a small number of Tomsk intellectuals, our efforts to put down the rebellion have been fruitless, and the flames of revolution have spread across this city of intellectuals.\n\nFortunately, this 'workers' uprising' seems to enjoy little support in Tomsk, and many of the city's intellectuals recall the persecution they suffered under the old USSR. With our forces, this pitiful 'workers' uprising' will surely be crushed."
 kostin.7.a: "The city of intellectuals has become a city of revolutionaries."
 kostin.8.t: "Novosibirsk Revolt"
 kostin.8.d: "The situation in Novosibirsk and its surroundings appears to have reached a turning point, and the flames of revolution are burning fiercely across the region. After our attempts to placate the striking workers, they appear to have had enough and erupted in open revolt. Tragically, Novosibirsk and its surrounding area hold vast industry and population, which only complicates the problem.\n\nThe threat to our new state is imminent, and this 'workers' uprising' will only grow. We must extinguish the flames of revolution before it is too late for regrets."
 kostin.8.a: "Novosibirsk could somehow get worse..."
 kostin.9.t: "Krasnoyarsk Revolt"
 kostin.9.d: "The situation in Krasnoyarsk appears to be worsening, and the city is in open revolt. Socialist agitators in Krasnoyarsk, convinced that their demands for workers' rights have been ignored, have raised the banner of rebellion. Worse, outlying regions have been inspired by this uprising and acted in concert.\n\nWhen it rains it pours: traitors have seized the industry of Krasnoyarsk city, further worsening the situation. Moreover, much of the population supports these rebels, and we can only assume their numbers will grow in the coming months. The future of the new state hangs in the balance; if we do not disperse these rebellious workers and end their foolish uprising, we will face dire consequences."
 kostin.9.a: "Will this city ever stop rebelling?"
 kostin.10.t: "Tomsk Revolt"
 kostin.10.d: "Terrible news from Tomsk: the flames of revolution are spreading across the city. After days of fruitless striking, the discontented strikers appear to have abandoned all hope of a peaceful resolution and taken to the streets with weapons stolen from the local armory. Worse, some regions around Tomsk are preparing to rise up with broad popular support, and even some intellectuals in the city have joined the rebellion against our new state.\n\nThe future of our new state hangs in the balance, and many are beginning to question our rule. Unless this so-called 'workers' uprising' is put down, our new state will face nothing but disaster."
 kostin.10.a: "Revolution has draped this city of intellectuals in blood red."
 kostin.11.t: "Novosibirsk Revolt"
 kostin.11.d: "The strikes have spiraled out of control, and now we face a full-scale uprising! The workers of West Siberia, based in Novosibirsk and led by the unknown foreman Vitaly Kostin, have launched their final stand against the shifting tides. No backroom deals, no frantic negotiations, no breathing room. The social contract between workers and authorities has collapsed!\n\nKostin has promised the urban proletariat and some of the rural peasantry that a new world will rise from the ashes. Thanks to this promise, the spark of revolution burns not just in Novosibirsk but across the entire land. We must bar the gates, shouldered our rifles, and pray to anyone who will listen. Only one side will survive the coming maelstrom."
 kostin.11.a: "Novosibirsk could somehow get worse..."
 kostin.12.t: "Krasnoyarsk Revolt"
 kostin.12.d: "The strikes have spiraled out of control, and now we face a full-scale uprising! The workers of West Siberia, based in Krasnoyarsk and led by the formerly obscure foreman Vitaly Kostin, have launched their final stand against the shifting tides. No backroom deals, no frantic negotiations, no breathing room. The social contract between workers and authorities has collapsed!\n\nKostin has promised the urban proletariat and some of the rural peasantry that a new world will rise from our ashes. Thanks to this promise, the spark of revolution burns not just in Krasnoyarsk but across the entire land. We must bar the gates, shouldered our rifles, and pray to anyone who will listen. Only one side will survive the coming maelstrom."
 kostin.12.a: "First a mutiny, now a revolution."
 kostin.13.t: "Tomsk Revolt"
 kostin.13.d: "The strikes have spiraled out of control, and now we face a full-scale uprising! The workers of West Siberia, based in Tomsk and led by the formerly obscure foreman Vitaly Kostin, have launched their final stand against the shifting tides. No backroom deals, no frantic negotiations, no breathing room. The social contract between workers and authorities has collapsed!\n\nKostin has promised the urban proletariat and some of the rural peasantry that a new world will rise from our ashes. Thanks to this promise, the spark of revolution burns not just in Tomsk but across the entire land. We must bar the gates, shouldered our rifles, and pray to anyone who has kept their wits about them. Only one side will survive the coming maelstrom."
 kostin.13.a: "The city of intellectuals has become a city of revolutionaries."
 kostin.14.t: "Founding Declaration of the Workers' Federation"
 kostin.14.d: "On the land of the Russian pretenders, the red flag flies proudly and firmly: all of West Siberia is now a workers' state. Symbols of the old regime have been torn down one by one, replaced by the emblems of socialism and the Russian workers' movement. In the old Kemerovo district, mining labor leader and leader of the workers' uprising Vitaly Kostin addressed the crowd, declaring that 'the rule of the mad kings has been swept into the dustbin of history.'\n\nThe streets and alleys of the Federation are filled with celebration, but the future of the workers' state remains uncertain. Russia is still mired in factional strife and chaos; to survive, it must persevere in this struggle."
 kostin.14.a: "Let's see how long these Siberian workers can laugh."
 kostin.15.t: "A Sea of Faces"
 kostin.15.d: "This is the proudest moment of Vitaly Kostin's life. A year ago, he was just an ordinary worker, scraping by in the labyrinthine industrial complex that choked the West Siberian Basin. Now he presides over the first Workers' Congress of the Siberian Workers' Federation, facing the assembled crowd. Kostin will personally baptize the state he founded in the fires of revolution with a speech.\n\n'Brothers! Sisters! Comrades! I warmly welcome you to the First Workers' Congress!' The opening was like a bomb going off among the crowd, erupting in cheers and applause.\n\n'Today, we shall establish a federation - a federation built by workers, for workers! Here, authority rests with the workers, not with the bloated bureaucrats who feed on the fat of our labor! A new kind of society will be born in our Federation, guided by the power of the trade unions!' The applause was noticeably weaker this time, and a chill ran down Kostin's spine. What had he said wrong?\n\n'Yes, that's right. We have been oppressed for too long by people who have never done an honest day's work. The union workers will lay the foundation of a new civilization. In our society, your station is determined not by birth but by merit!'\n\nDead silence. Kostin broke out in a cold sweat. He could see several comrades already getting up to leave at the back of the crowd. 'Alright, does any comrade have a question?'\n\n'Well, I don't even know where to begin!' someone called from the back. The crowd laughed in recognition."
 kostin.15.a: "What is this guy thinking?!"
 kostin.16.t: "Secessionists!"
 kostin.16.d: "It seems that Comrade Kostin's small mishap at the Workers' Congress some time ago has triggered a serious chain reaction. Ever since he was accused of championing 'worker aristocrats,' reports of militia unrest have been pouring in. The situation is worse than expected: they have even gone over to the secessionists!\n\nLed by Ivan Sevastyanov, the secessionists have seized control of regions including Krasnoyarsk and declared the so-called 'Siberian Socialist Workers' Reform Republic.' They have even publicly denounced Kostin as a tyrant and refuse to recognize the Federation's authority!\n\nThis is undoubtedly a betrayal of the revolution, but we cannot mount an adequate response to the disaster. Most of the militias remain restive and refuse to obey orders. This split appears to be only the beginning of our misfortunes."
 kostin.16.a: "This cannot be!"
 kostin.17.t: "More Defectors!"
 kostin.17.d: "Chaos! Sevastyanov's break from the Federation has already shocked us deeply, but the trouble is far from over. In the confusion after Kostin's downfall, as the army grew more mutinous, a new state has emerged. As before, they refuse to recognize our authority and call themselves an independent entity!\n\nThis new secessionist group calls itself the 'Siberian Workers' and Peasants' Union,' led by Maria Borchenko. After the disaster at the Workers' Congress, she fiercely criticized Kostin, so her betrayal is not entirely unexpected. Still, it is another major blow to the Siberian revolution. What little army we had is completely paralyzed and cannot assert its authority over these seceding lands."
 kostin.17.a: "No, wait! Come back!"
 kostin.18.t: "Militia Uprising!"
 kostin.18.d: "The newborn Federation has suffered another major disaster! The militias, paralyzed by the chaos following Kostin's rambling, have finally acted - but this action is gravely detrimental to us.\n\nBacked by remnants of the Siberian Black Army, a new secessionist faction has risen from our rapidly disintegrating regime. Led by former Black Army general Stepan Valenteev, this faction has established the 'Siberian Free Workers' Republic,' claiming most of our remaining territory. Kostin himself is denounced as a traitor to the revolution.\n\nThe militias have defected en masse, and we are powerless against the secessionists. Only God knows whether our Federation will last the week..."
 kostin.18.a: "Jackals! Vultures!"
 kostin.19.t: "Dust Settles"
 kostin.19.d: "One speech - just one speech - has destroyed everything Vitaly Kostin built. He overcame every obstacle, rising from a humble miner in Altai to the leader of a fierce workers' revolution. No one expected Kostin's success, for the enemies around him were too great. Dissent arose, pessimism spread, but Kostin and his comrades defied all expectations and liberated the long-oppressed Siberian workers.\n\nKostin's victory was nothing short of a miracle, but it was doomed not to last. The Workers' Congress should have put a perfect period to this string of victories, cementing Kostin's place in history as the 'great liberator of the working class.' Instead, it was a poorly planned disaster that turned Kostin from hero to traitor of the working class almost overnight.\n\nKostin was never good with words; after all, he was a blue-collar worker, not a poet, let alone a politician. Public speaking was not his strong suit, as the congress's failure proved. Kostin genuinely wanted what was best for the working class, even if he was not good at explaining how.\n\nIn any case, the damage is irreversible. Three independent states have seceded from Kostin's Federation, protesting that ill-fated speech. West Siberia is as fragmented as it was in the early 1960s, and Kostin's revolution has foundered in its cradle.\n\nThough his actual territory is now but a quarter of the former Workers' Federation's lands, the humble Kostin is still determined to play the hand he was dealt, following the spark of his ideal, convinced it may one day blaze again."
 kostin.19.a: "The brighter the candle, the faster it burns out."

 KAL_Vitaly_Kostin: "Vitaly Kostin"
 POLITICS_VITALY_KOSTIN_DESC: "Until recently, Vitaly Kostin was a nobody. Born in a small Altai settlement in 1938, he began mining as a boy. After a stint in the West Siberian Republic's army, he witnessed firsthand the army's collapse and the state's final disintegration. He drifted to Novosibirsk, ready to return to his old trade of mining. Unlike others, Kostin had little interest in the regime's ideology. Though rumors linked him to underground socialist 'Narodnik' circles, he became a model worker. This miner seemed to have nothing to do with the political ideologies of Russia's warlords - until the revolt began.\n\nThe urban working class rose up alongside the peasants, taking arms against their oppressors, determined to make a final stand against the resurgent authorities of West Siberia. Outpost after outpost fell to the militias, and word reached the regional ruler that effective control over the area seemed to be crumbling once more. The leader of the great uprising was Kostin, who seized the chance to lead the proletariat to victory.\n\nSoon, this once-unknown citizen had become the honorary leader of the liberation movement - but he was no king, president, or supreme leader. In the liberated communities, libertarian socialism took root, a system with no arbitrary leadership. What Kostin thought about was bringing freedom and equality to his people - and if the revolution demanded it, seeing it through to the end."
 POLITICS_IVAN_SEVASTYANOV_DESC: "Ivan Pavlovich Sevastyanov first made his name in West Siberia for his outstanding contributions to the later phases of the Siberian Project. As a young engineer and former CPSU official, he guided the project's development, ensuring its successful implementation and effectiveness.\n\nHis sympathy for Bolshevik ideas was well known, but his professional skill was so great that people overlooked his ideological leanings. At the right moment, Sevastyanov announced the formation of a reformist socialist republic covering the territory he knew well. Unlike his allies, he decentralized power to local soviets, quickly building a strong administrative apparatus in the surrounding regions.\n\nThe strategy worked: rapid economic growth and heavy industrial focus soon attracted widespread attention. Of the new states established between Omsk and Irkutsk, Sevastyanov's regime was the closest to the old Soviet Union."
 ALT_Maria_Borchenko: "Maria Borchenko"
 POLITICS_MARIA_BORCHENKO_DESC: "Maria Yakovlevna Borchenko may now be the honorary leader of the Siberian Workers' and Peasants' Union, but only a few years ago no one would have expected an ordinary peasant to become a rising star in West Siberia's socialist camp.\n\nBorchenko was born in a village on the Altai highlands, working the farm through the Bukharin USSR, the West Siberian Republic, and the Novosibirsk-Altai Federation. Before long, her reverence for socialism drew her into Narodnik circles, where she fought for the rights of neglected peasants.\n\nThen her moment came. The rebels rose, and she called the people of Altai to arms, launching a separate uprising of her own. Thus the Workers' and Peasants' Union was born: a peaceful state of the lower classes, by the lower classes, for the lower classes. Maria may be its leader, but in her view, true power rests with the people who labor in factories and fields."
 POLITICS_STEPAN_VALENTEEV_DESC: "The Black Army's fascinating experiment in Siberia had a profound impact on West Siberia, as seen in the very existence of the Siberian Free Workers' Republic. Today it is led by Stepan Yelyseevich Valenteev, the most senior surviving member of the Black Army, drawing heavily on the territory the Black Army once held.\n\nAfter recent events, the Black Army remnants reformulated their military-anarchist theory, now claiming to put the doctrine of people's war into practice: the rural population waging a protracted armed struggle against the enemy to defend 'free territories.'\n\nValenteev reluctantly became the movement's leader, for it was drifting ever further from the anarchist vision he had fought for. Yet whether he supports it or not, these ideas have taken deep root among the local people."

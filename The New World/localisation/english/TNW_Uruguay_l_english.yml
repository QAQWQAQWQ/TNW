 URG_Victor_Haedo_hog_desc: "§YPresident of the Council\nHerrerism§!\n--------------\n§LIn any case, it must be said that Haedo truly ranks among the figures who make Uruguayan politics entertaining. Though his mansion in Punta del Este is lavishly appointed - and if you stroke his vanity he might even invite you in - it was all built from scratch. He came from a poor family and reached his position entirely through political maneuvering.\n\nHaedo had been a loyal Herrerist, but a recognized caudillo cannot stay on one path forever. After countless betrayals and zigzags, Haedo finally found his own way. He openly espoused fascism, offending his Herrerist colleagues who wanted this disreputable character gone. Yet recently he has come to admire Castro and Guevara. Herrera's death gave him the chance to seize control of the Herrerists, and he will not let it go.§!"
 URG_Faustino_Harrison_hog_desc: "§YPresident of the Council\nRight-Wing Populism§!\n--------------\n§LA former high school teacher finds himself in the historic position of being the last President of the Council of the Herrerist-Ruralist government elected in 1958. Certainly, Harrison has reasons to be proud of all that his movement has accomplished. But he can't shake off the feeling that tells him that he should do more, that he should try to save his country.\n\nGraduating as a notary public in 1928, Harrison developed his activity in the department of Florida. After the resignation of Alberto Gallinal Heber from the intendancy in 1951, Harrison took over as his alternate. Afterwards he was one of the founders and most important leaders of the Federal Ruralist Action League. Many Ruralists, like their leader Benito Nardone, have become disappointed in politics and want to retreat from the political arena and focus on unionism. But Harrison still sees the merit in political participation.§!"
 URG_Luis_Batlle_Berres_hog_desc: "§YPresident of the Council\nSocial Radicalism§!\n--------------\n§LLeft orphan at age 11, Luis was adopted and raised by his uncle, the renowned José Batlle y Ordóñez. José ended up being a father for Luis, and the young man decided to honor his memory by entering politics and expanding on his work. It was non an easy road, first he had to flee thanks to the Terrist dictactorship. And when it seemed that Baldomir would end it, he fell and Charlone took his place. When democracy was finally restored, his cousins, jealous of Luis' popularity, managed to name him Vice President of Tomás Berreta in a bid to stop his rise. But Berreta died and Luis proved to be an independent operator. None could stop now his attempts on honoring the life of his beloved uncle.\n\nCredited by the prosperities of the 50s and the economic crash that shattered the Colorado hegemony in Uruguay, Luis always maintained that the Uruguayan people voted for the National Party in 1958 due to them being tricked or as some kind of joke, not thinking they would win. It seems that Luis can't deal with the fact that he has some responsibility on the first electoral defeat of his party in a century, a defect that could sink his third tenure, as has sunk his relationship with other batllist like Zelmar Michelini.§!"
 URG_Amilcar_Vasconcellos_hog_desc: "§YPresident of the Council\nSocial Radicalism§!\n--------------\n§L§!"

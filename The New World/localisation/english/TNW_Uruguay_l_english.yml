 URG_Ventura_Rodriguez_hog_desc: "§YInterior Minister\nConservatism§!\n--------------\n§LWith Nardone's help, Aguerrondo became Chief of Police of Montevideo and, owing the favor, decided to make a substantial contribution to the Blanco agenda. He began politicizing the police, filling it with Blanco members more loyal to the party than to their duty. This is the context in which Ventura Rodriguez appeared.\n\nRodriguez had an authoritarian style and soon made a name for himself in the police. He was deeply tied to Aguerrondo and volunteered as his assistant in staging the coup that would liberate Uruguay from the Council. After the coup succeeded, when Aguerrondo looked for an Interior Minister, he chose not another politician but one of his own men. Rodriguez accepted gladly; though taking the civilian post required retiring from the military, he was awarded a general's rank as a consolation prize. Even if he never commanded another soldier, people had to call him 'General.'§!"
 URG_Ventura_Rodriguez_marzist_hog_desc: "§YInterior Minister\nConservatism§!\n--------------\n§LWith Nardone's help, Aguerrondo became Chief of Police of Montevideo and, owing the favor, decided to make a substantial contribution to the Blanco agenda. He began politicizing the police, filling it with Blanco members more loyal to the party than to their duty. This is the context in which Ventura Rodriguez appeared.\n\nRodriguez had an authoritarian style and soon made a name for himself in the police. He was deeply tied to Aguerrondo and volunteered as his assistant in staging the coup that would liberate Uruguay from the Council. Unfortunately, for the conspiracy to succeed they had to request Charlone's help, and the veteran politician exploited this, demanding influence over the resulting government. He had to make concessions; one of them was appointing one of Aguerrondo's loyalists as the new Interior Minister.§!"
 URG_Aparicio_Mendez_hog_desc: "§YInterior Minister\nConservatism§!\n--------------\n§L§!"
 URG_Adolfo_Tejera_hog_desc: "§YInterior Minister\nLiberal Progressivism§!\n--------------\n§L§!"
 URG_Gabriel_Terra_Ilarraz_hog_desc: "§YInterior Minister\nGuided Democracy§!\n--------------\n§L§!"
 URG_Alberto_Demicheli_hog_desc: "§YInterior Minister\nGuided Democracy§!\n--------------\n§L§!"
 URG_Julio_Cesar_Ribas_hog_desc: "§YInterior Minister\nFalangism§!\n--------------\n§L§!"
 URG_Homero_Martinez_for_desc: "§YChancellor of the Republic\nHerrerism§!\n--------------\n§LPeople get jobs through ability, recommendations, or nepotism, and Homero Martínez Montero, a naval officer appointed Chancellor by the Blancos, is an interesting case. Martínez Montero knew his naval background; he was also a prolific author, publishing works on the geography, history, and geopolitics of the Uruguay River and its waters and islands, and on Montevideo's importance as a naval base in the 18th and 19th centuries. But he was no diplomat, and he was the first to admit it.\n\nThe new government sought to build international bridges between Argentina and Uruguay, and its priority was demarcating the border on the Río de la Plata, work that depended on Martínez Montero's research - hence this appointment. Thus Martínez Montero was sent to face Argentine diplomats, and he would carry out the task according to military discipline. Even when the tangled Cold War situation often left him bewildered, he would keep striving, for the party and for the nation.§!"
 URG_Francisco_Forteza_for_desc: "§YChancellor of the Republic\nLiberal Radicalism§!\n--------------\n§L§!"
 URG_Cesar_Charlone_for_desc: "§YChancellor of the Republic\nAnocracy\nFu Manchu§!\n--------------\n§LDr. Charlone is known by various names. You might be familiar with his most famous name 'Fu Manchu', given to him thanks to his Revaluation Law of 1935, which provided the state with almost 50 million pesos without modifying the legal gold backing of the Uruguayan currency. Another nickname given to him is 'Nazi', but only the perfidious left calls him that. César Charlone is not a Nazi; he is only a conservative awarded a Golden Eagle and might have been a guest of honor in Germany two or three times.\n\nHe already served his country as Finance Minister and President during the March Revolution, but he has returned to his old post to save Uruguay once again from the Batllist demagogy and its Colegiado. Charlone truly doesn't desire to govern again, he is just a very special advisor for the President, who is kind enough to regularly follow his advice.§!"
 URG_Alejandro_Zorilla_de_San_Martin_for_desc: "§YChancellor of the Republic\nHerrerism§!\n--------------\n§L§!"
 URG_Juan_Felipe_Yriart_for_desc: "§YChancellor of the Republic\nHerrerism§!\n--------------\n§L§!"
 URG_Omar_Diaz_for_desc: "§YChancellor of the Republic\nPeronism§!\n--------------\n§LSince Artigas betrayed the United Provinces, the newest name on Uruguay's notorious traitor list is Omar Díaz. Historically, Venancio Flores had allowed the Brazilians to ravage Paysandú, and Díaz is no less guilty: he fully supports an enemy that wants to crush Uruguay underfoot. If you ask which fascist sympathizer in the eastern republic is the worst, the answer depends on who you ask, but Omar Díaz is certainly on the list. Because he is a genuine Peronist, through and through.\n\nBut to describe Díaz himself, 'loser' is probably more accurate than 'traitor.' Díaz was tasked with spreading Peronism in Uruguay, but over the years he has mustered all of 1,500 votes. The only reason Díaz became Chancellor of the Republic is that he has ties with every nationalist group, from conservatives to Nazi partisans; everyone has dealings with him, and his negotiations with all sides helped ensure Aguerrondo's coup succeeded. But the truth is ugly: because he trumpets Peronism and scorns Artiguism, the nationalists are enraged and are plotting how to take him down...§!"
 URG_Juan_Carlos_Quagliotti_for_desc: "§YChancellor of the Republic\nAristocratic Conservatism§!\n--------------\n§L§!"
 URG_Juan_Carlos_Quagliotti_marzist_for_desc: "§YChancellor of the Republic\nAristocratic Conservatism§!\n--------------\n§LThe tenure of Juan Carlos Quagliotti as Chancellor of the Republic was another of the conditions that Aguerrondo and the Blancos demanded from Charlone to accept his proposal of him being appointed as the new Finance Minister, and Ribas being chosen as the 'apolitical' military ruler of the nation until the 1966 elections if the coup was to succeed. It wasn't a surprise that Aguerrondo would demand for him to have a post in the administration, after all both were personal friends and Quagliotti supported his putschist ambitions with the relatively small network of aligned businessmen he had established.\n\nSaid network (and much of Quagliotti's merits to be considered a candidate for the Chancellery), were born of the myth that Quagliotti has built around himself, that he is a kind of 'superspy', just a few phone calls away from the Führer. Charlone appears willing to tolerate these lies for the time being in virtue of having a reliable man, Juan Carlos Blanco, as the Vice Chancellor.§!"
 URG_Juan_Carlos_Blanco_for_desc: "§YChancellor of the Republic\nNational Conservatism§!\n--------------\n§L§!"
 URG_Armando_Acosta_y_Lara_for_desc: "§YChancellor of the Republic\nNational Conservatism§!\n--------------\n§L§!"
 URG_Juan_Eduardo_Azzini_eco_desc: "§YMinister of Finance\nRight-Wing Populism§!\n--------------\n§L'The Reformer', as he has been nicknamed, is an unusual sight in Uruguayan politics. Before Nardone, with Herrera's consent, appointed him Minister of Finance, Azzini was a political independent and a professor. The Ruralists trust him implicitly as the perfect man to implement their economic agenda. For the other Blancos, Azzini is their best hope to destroy the dirigiste economics that in their eyes have nearly bankrupted Uruguay.\n\nAzzini's pet project was the Exchange and Monetary Reform Law, which ended a byzantine, corruption-prone foreign-currency exchange system. During his tenure protectionism has also been largely abandoned, leading to the closure of local industries. But Azzini claims that job-creating foreign investment will eventually make up for this.§!"
 URG_Arturo_Lezama_eco_desc: "§YMinister of Finance\nSocial Radicalism§!\n--------------\n§L§!"
 URG_Luis_Alberto_Brause_eco_desc: "§YMinister of Finance\nProgressive Conservatism§!\n--------------\n§L§!"
 URG_Salvador_Ferrer_Serra_eco_desc: "§YMinister of Finance\nLiberal Conservatism§!\n--------------\n§L§!"
 URG_Juan_Jose_Gari_eco_desc: "§YMinister of Finance\nPopulist Conservatism§!\n--------------\n§LBack in 1959, the Ruralists insisted on nominating Garí as president of the Bank of the Republic, but Herrera flatly refused, leaving behind the famous line: 'I firmly refuse to vote for this candidate because I know him very well. He would put four wheels under the bank and drive it home.'\n\nLike Nardone and Harrison, Garí believed the military had to stage a coup to save the nation. In fact, though an important Ruralist leader, Garí became one of Aguerrondo's most important supporters through his own wealth, connections, and influence. The Ruralists and the military were allies, so the Finance Ministry was bound to go to them, but choosing Garí surprised observers. Though Garí had no particular attachment to democratic values, if democracy had been restored he had a bright future ahead; he threw it all away. But for him it did not matter; as long as economic power was in hand, he could line his pockets.§!"
 URG_Cesar_Charlone_eco_desc: "§YMinister of Finance\nAnocracy\nFu Manchu§!\n--------------\n§LDr. Charlone is known by various names. You might be familiar with his most famous name 'Fu Manchu', given to him thanks to his Revaluation Law of 1935, which provided the state with almost 50 million pesos without modifying the legal gold backing of the Uruguayan currency. Another nickname given to him is 'Nazi', but only the perfidious left calls him that. César Charlone is not a Nazi; he is only a conservative awarded a Golden Eagle and might have been a guest of honor in Germany two or three times.\n\nHe already served his country as Finance Minister and President during the March Revolution, but he has returned to his old post to save Uruguay once again from the Batllist demagogy and its Colegiado. Charlone truly doesn't desire to govern again, he is just a very special advisor for the President, who is kind enough to regularly follow his advice.§!"
 URG_Mario_Garbarino_eco_desc: "§YMinister of Finance\nNational Conservatism§!\n--------------\n§L§!"
 URG_Modesto_Rebollo_sec_desc: "§YMinister of Defense\nHerrerism§!\n--------------\n§LGeneral Modesto Rebollo, unlike some of the Batllist-appointee civilian defense ministers, is unambiguously fit for the job. His experience is more than sufficient: he has service as director of the Military Institute of Higher Studies and Inspector-General of the Army under his belt.\n\nFurthermore, as he is affiliated with the National Party, the Blancos view him as a perfect candidate. Afraid of the Colorado-controlled military overthrowing them in service to the party of Batlle, the Blancos hope to use Rebollo to politicize the military in their favor. His willingness to support repression against students and unions is also a bonus in their eyes. But Rebollo, for all his perceived merits or demerits, is not Pablo Moratorio - he lacks the support of the Blanco-affiliated putschist in the army. He apparently doesn't want for a coup, even in favor of the Blancos, to happen.§!"
 URG_Glauco_Segovia_sec_desc: "§YMinister of Defense\nSocial Radicalism§!\n--------------\n§L§!"
 URG_Antonio_Francese_sec_desc: "§YMinister of Defense\nConservatism§!\n--------------\n§L§!"
 URG_Pablo_Moratorio_sec_desc: "§YMinister of Defense\nDespotism§!\n--------------\n§LCoups are not strangers to Pablo Moratorio, not because he is particularly a serial plotter, but because his older brother was involved with the Motincito back in 1938. Moratorio didn't participate, but he certainly knew of it. In truth Moratorio doesn't have any problems with joining military conspiracies, it is just that if he senses that is not going to work, he will leave it and treat the whole endeavor as something that never existed and/or that he was never involved with.\n\nBeing a Blanco, he was appointed as the President of the Frigorífico Nacional in 1959. In this position he became a familiar face to the people of the Interior; therefore, recruiting him was essential for the success of the Marzist coup. Now he controls the Defense Ministry both as a reward and to allay Blanco fears about Charlone stealing the torch of the revolution for himself.§!"
 URG_Pablo_Moratorio_marzist_sec_desc: "§YMinister of Defense\nDespotism§!\n--------------\n§LCoups are not strangers to Pablo Moratorio, not because he is particularly a serial plotter, but because his older brother was involved with the Motincito back in 1938. Moratorio didn't participate, but he certainly knew of it. In truth Moratorio doesn't have any problems with joining military conspiracies, it is just that if he senses that is not going to work, he will leave it and treat the whole endeavor as something that never existed and/or that he was never involved with.\n\nBeing a Blanco, he was appointed as the President of the Frigorífico Nacional in 1959. In this position he became a familiar face to the people of the Interior; therefore, recruiting him was essential for the success of the Marzist coup. Now he controls the Defense Ministry both as a reward and to allay Blanco fears about Charlone stealing the torch of the revolution for himself.§!"
 URG_Pablo_Moratorio_falangist_sec_desc: "§YMinister of Defense\nDespotism§!\n--------------\n§L§!"
 URG_Juan_Pedro_Ribas_sec_desc: "§YMinister of Defense\nDespotism§!\n--------------\n§L§!"
 URG_Alberto_Demicheli_sec_desc: "§YMinister of Defense\nGuided Democracy§!\n--------------\n§L§!"
 URG_Tydeo_Larre_Borges_sec_desc: "§YMinister of Defense\nNational Conservatism§!\n--------------\n§L§!"
 URG_switzerland_mirage_0:0 "Swiss Mirage: Happy Paradise"
 URG_switzerland_mirage_0_desc:0 "PLACEHOLDER"
 URG_switzerland_mirage_1:0 "Swiss Mirage: Living Up to the Name"
 URG_switzerland_mirage_1_desc:0 "PLACEHOLDER"
 URG_switzerland_mirage_2:0 "Swiss Mirage: §fDoubt Creeps In§!"
 URG_switzerland_mirage_2_desc:0 "Uruguay once shone bright. But this city upon a hill, envied by its neighbors, now grows weak. Admittedly, objectively, Uruguay remains a beacon of democracy in Latin America, where even leftists can participate in politics as they please. But look out the window and you will see Uruguay's young people queuing outside passport offices, skilled but unable to find any position at home. People cannot find work, nor accumulate capital, and this fills them with doubt about the current system.\n\nElected corrupt bureaucrats cannot solve the problem, merely repeating platitudes: as long as the world still demands Uruguayan goods, the crisis will end sooner or later. People hope so, but they cannot help worrying: what if that is not the case? What if the democratic system Batlle built has been irreparably damaged?\n\n§fUruguay has fallen off the cliff, but has not yet hit bottom.§!"
 URG_switzerland_mirage_3:0 "Swiss Mirage: §RMirror, Mirror§!"
 URG_switzerland_mirage_3_desc:0 "Uruguayan exceptionalism was never meant to be a matter of faith, yet it has become one. The current crisis does not signal a temporary problem but a fundamental fracture - not just economic, but spiritual. The republic was once world-famous for its lofty civic virtue and progressive democratic ideals, but those illusions now lie shattered in the smoke of gunfire and the blood of the innocent.\n\nSome refuse to acknowledge this truth, but they know it is self-deception. Some still try to fight through legitimate channels: political participation, demonstrations, things that once made Batlle smile. But others wonder in secret: do the unspeakables speak the truth? Would giving them a chance really be so terrible?\n\n§RAs Uruguay sinks, the Orientals ask themselves: is daring to believe truly a sin?§!"
 URG_switzerland_mirage_4:0 "Swiss Mirage: §xVanished into Thin Air§!"
 URG_switzerland_mirage_4_desc:0 "Anyone who calls Uruguay the 'Switzerland of the Americas' is a fool, but it is the Orientals who believed it who are mocked. They actually thought that as South Americans they could build a civilization like Europe's, surpass the world's low expectations. How dare they harbor such delusions? Because Batlle sold them lies? How foolish!\n\nAdmittedly, foreign powers or subversives can always be scapegoated for the current predicament, but the truth is clear and can no longer be hidden. As Rivera said: since independence, the Orientals have never known such catastrophe. The nation's collapse is self-inflicted; they have no one to blame but the reflection in the mirror. Is it not fitting that the national hero is Artigas? A bankrupt, betrayed exile who died abroad, long forgotten by his own people.\n\n§xThe dream is dead, or perhaps eternal.§!"
 URG_the_lost_limb: "The Lost Limb"
 URG_the_lost_limb_desc: "Fascism triumphed in Europe, but was defeated in Uruguay by the heroic resistance of López Silvera and the people of Montevideo. Yet it did not end there; even across the vast ocean, the Nazi yoke still encircles the republic. Germany imposes unfair tariffs on all Uruguayan exports.\n\nThe European market, vital to Uruguay, has slowly closed its doors. Uruguay adopted a 'pivot to the OFN' strategy, drawing close to the United States to open the American market. While this strategy succeeded, Uruguay's dependence on the northern giant grew. Though the republic also reached trade agreements with Iberia and Japan, the permanent loss of the European market made balancing foreign influence an enormous challenge. To return to the European market, Uruguay must improve relations with Germany. But Germany's consistent aggression and the broad fascist background of those who support this view make the issue almost impossible to even discuss."
 URG_merchants_of_death: "Merchants of Death"
 URG_merchants_of_death_tt: "§YCan profit from overseas conflicts.§!"
 URG_merchants_of_death_desc: "§VFray Bentos goes to war, oh woe, oh pity, oh regret!§!\n\nWhat made the Switzerland of the Americas? The secret is simple: success was built on the export of salted beef and textiles. But to many Uruguayans' shame, during the Second World War, while British soldiers ate corned beef, the same product was exported in bulk to Germany. Uruguay was not without efforts to diversify exports, but the truth remains: only war guaranteed exports of Uruguayan goods, and only war sustained the welfare republic. The economic collapse of the late 1950s after a long peace proved this perfectly.\n\nThough in this rotten world war never truly ends, mere falling fat cattle cannot magic Uruguay back to its golden age. Uruguay's development model is obsolete, but its people and ruling class dare not face it: to save the republic, Uruguay must profit from every war §Owhile also modernizing production§!. §ROtherwise, the republic will decay completely until it collapses§!."
 URG_the_enemy_within: "Enemy Within"
 URG_the_enemy_within_desc: "The existence of Marchist remnants is no rumor: hidden in Uruguay is a Nazi subversive organization made up of conservative class elements, masking their political goals and pursuit of dictatorship. To counter their threat, §MNazi hunters§! are organized, scouring every corner of Uruguay for traces of the §rNazi Party (Foreign Organization - Uruguay Branch)§!, exposing conspiracies and grand schemes. Most of the time they make mountains out of molehills, clamoring that another §ggrey scare§! is coming and urging official investigations; sometimes their 'evidence of fascist infiltration' is entirely fabricated; worse, some even hope to use the opportunity to become the next Fernández Artucio.\n\nSince people no longer believe in the Swiss dream of the Americas, why not blame all the nation's problems on vague foreign forces? By exploiting Uruguayan fear of foreign subversion and purging all opponents, the republic will stand with the OFN and the free world, forever."
 POLITICS_WILSON_FERREIRA_ALDUNATE_DESC: "Wilson Ferreira Aldunate's enemies call him a sophist. Others claim his 'restless voice' and 'handsome face' turned 'generations of women's heads.' But to the Blancos, he embodies the new generation's hope for the party.\n\nWilson himself never used the word, but people call him a progressive. To some this is odd - he is a Blanco, a National Party man, surely a dyed-in-the-wool conservative, is he not? Only a fool would doubt it: did his political differences with the National Party make him ashamed of his Blanco blood? That blood runs in the family. Though Wilson Ferreira Aldunate was actually born in José Batlle y Ordónez, his birth certificate was registered in Nicolich, miles away - because his family would rather die than let a newborn's records bear a Colorado name.\n\nLoyalty to the National Party cannot be twisted into blind tolerance of evil. In his youth Wilson was a Herrerist - but Herrera's treachery led the Wilson family to defect to the Independent National Party. Under Carlos Quijano's wise guidance, Wilson began his political career, participating in the struggle against the Marchists and supporting the Republicans in the Spanish Civil War.\n\nYears passed. The Ferreira of the early 1960s was, apart from supporting the 'heresy' of land reform, a traditional liberal conservative - for which his fellow ranchers denounced him as a class traitor. But by the late 1960s he had transformed into Wilson, the warrior for public liberties against corruption - by this period he had awakened: Uruguay needed profound change. The left cheered his speeches; the 'cheap Blancos' denounced him; in the end none of it mattered. When Wilson told the nation about anti-corruption, land reform, and bank nationalization, conservatives and leftists united in rare accord and imprisoned him in the Suárez Residence.\n\nThe new President raises the banner once held by the late Aparicio Saravia: free elections and clean government. Saravia achieved his goal in death; the question now is whether Wilson can achieve his in life."

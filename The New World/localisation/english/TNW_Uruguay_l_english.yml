l_english:
 POLITICS_COUNCILURG_DESC: "The National Council of Government, known simply as 'the Council', is an executive body created by José Batlle y Ordóñez based on the Swiss Federal Council. Batlle believed that if Uruguay were ruled not by a president but by a decentralized executive, dictatorship would never take root.\n\nHowever, after the Batllists seized control of the Colorado Party, the party fractured, and conservatives resented Batlle's reforms. Thus a compromise was struck: the presidency would not be abolished when the Council was established, and the two would share executive power. This arrangement did not last; President Gabriel Terra abolished the Council and became a dictator.\n\nAfter the March regime fell, Uruguay democratized, and the Batllists were finally able to restore the Council in 1952 as Batlle had intended. Yet the Council did not benefit the country. On the contrary, the National Council of Government perpetually dragged its feet on state matters, to the public's great exasperation. Congress debated endlessly about abolishing the Council and restoring the presidency, but never reached a conclusion. Under the Uruguayan constitution, a constitutional referendum can only take effect if a ticket wins 35% of the vote on election day. The right-wing of the National Party believed this threshold, even if achievable, would take a very long time. Thus politicians began exploring §Oalternative, extreme measures to abolish the Council§!.\n\nAs §Rsomeone§! put it: 'As long as this Council exists, within five years the §WBlancos§! will win the election, and within fifteen years §sthe military will stage a coup§!.'\n\nLet us hope it does not come to that."
 POLITICS_AMILCAR_VASCONCELLOS_DESC: "A common criticism of Batllists is that they treat their ideology as a religion, dogmatically and refusing to compromise. Vasconcellos may be the finest embodiment of this trait, for his staunch defense of the Council system has made the road to power, which should have been smooth, thorny.\n\nBorn in Artigas, Vasconcellos moved to Montevideo as a young man for higher education. After becoming an elementary school teacher, he began his teaching career in 1938, developing a lifelong and unshakable sense of mission toward education.\n\nWhile in Montevideo, he witnessed Terra's coup and the Marchist dictatorship, which led him into politics. He eventually became one of the dictatorship's opponents, participating in protests. This experience brought him into contact and friendship with Luis Batlle, and he became one of the latter's 'young Turk' followers. Through his involvement in the Group of Fifteen, Vasconcellos served as editor of Acción, Minister of Livestock, and Minister of Finance. After Luis's death, he was clearly expected to be the successor, but his insistence on defending the Council system even after it had proven a liability to governance put his position at risk - he nearly lost the primary to Jorge Batlle.\n\nHe survived that challenge, but orthodox Batllism has now split into his followers, the 'Colorado Unity Front' supporting the Colorado-Batllista alliance, and Zelmar Michelini's Lista 99. Vasconcellos knows Jorge is waiting in the wings. To honor Luis's political legacy, he must find a way to govern effectively while reuniting the Batllist camp."
 POLITICS_MANUEL_FLORES_MORA_DESC: "Perhaps Flores Mora would be better suited as a Councilman than President of Uruguay, but the voters have clearly endorsed restoring the presidency, so he will follow the popular will and discharge presidential duties.\n\nA descendant of Venancio Flores, the notorious 19th-century dictator, Manuel Flores Mora ('Maneco') was born in 1923. He showed literary talent from childhood and loved writing. Influenced by Uruguayan writer Juan Carlos Onetti and Spanish writer José Bergamín, Flores Mora became a member of the 'Generation of 45' - an artistic group of writers active during the rapid urbanization of Montevideo and the interior.\n\nFollowing the common Uruguayan trajectory, Flores Mora entered politics through journalism. His uncle secured him a position at El Día, then he moved to Marcha. His political articles during this period caught the attention of Luis Batlle Berres, who saw potential in the young man. Maneco accepted Luis's invitation to join Acción, became a young Turk, and was elected to the Chamber of Deputies in 1954, re-elected in 1958.\n\nIn the struggle between Vasconcellos and the Abdala-Jorge Batlle faction for control of Lista 15, Flores Mora, a supporter of the Council system, remained firmly loyal to Vasconcellos, even regarded as his second-in-command. Thus when the 1966 election approached, he was nominated as the presidential candidate to reward his loyal service. The only surprise was that he was elected President rather than Council Chairman, but Maneco seems equal to the unusual situation fate has dealt him."
 POLITICS_JORGE_BATLLE_DESC: "History does not repeat itself, but it often rhymes. Because his own son turned to conservative right-wing politics, José Batlle y Ordóñez's true heir was his nephew Luis. Now a similar story unfolds - Luis's son Jorge has become a liberal.\n\nRaised under his father's protective shadow (a father who wanted to give him everything he had lacked in his own childhood), the young Jorge was forced into exile with his family during the Marchist crackout, wandering foreign countries. After tensions eased, Jorge returned and began his political career during the 1946 election, working with his cousin at Radio Ariel, eventually joining Acción, the paper his father had founded. These experiences honed his political skills, and he was elected a Montevideo deputy in 1958.\n\nBut by then Jorge had developed independent views, gradually diverging from his father's political beliefs. While Luis insisted his policies were blameless after the 1950s crisis and that the Batllist system worked well, Jorge began to have doubts. At the time he was dating an Argentine girlfriend, and during a visit he happened to attend a lecture by the Austrian School economists Hayek and Mises, which sparked his love for free-market economic theory - an academic passion that outlasted the relationship.\n\nHis father's death created the opportunity for his liberal vision to take over Lista 15. He succeeded, but had to adopt a disguise: he had to present himself as a developmentalist, knowing this was the baseline the faction would accept. Now, as President, he faces the ultimate test of his career: just how far can he shift this left-leaning group to the right without being devoured?"
 POLITICS_OSCAR_GESTIDO_DESC: "Among the many officers who began their military careers during the Marchist era, Oscar Gestido belonged to the group without fascist sympathies who simply followed orders, maintaining political neutrality throughout.\n\nGestido had a deep passion for the Air Force and, upon entering the military, was determined to become a pilot. He achieved this goal; in 1926 he flew a single-engine biplane from Montevideo to Asunción as part of the official Uruguayan delegation to Paraguayan commemorations. But this was only the beginning - he rose steadily, becoming Director-General of Military Aviation in 1938, promoted to general in 1949, and as Inspector-General of the Army in 1951 he shepherded the Air Force's formal establishment as an independent service, a source of great pride.\n\nAfter retiring, his record as a reliable soldier earned him the post of Auditor-General of the Uruguayan State Railways. Gestido demonstrated outstanding administrative skill, especially in budget balancing. But what truly shaped his legend was his performance during the 1959 floods, when he chaired the National Emergency Committee. The Uruguayan public watched this upright official work tirelessly to ensure disaster victims received the aid they deserved, and politicians soon came calling, inviting him to enter politics.\n\nNow as President, Gestido faces multiple challenges: this self-described left-leaning politician leads the Colorado right wing, must weaken the Charlone faction while maintaining party unity, and bears the weight of governing. Though diligent, when confronted with the complex political machine, he may find himself wondering which button to press."
 POLITICS_OSCAR_GESTIDO_SAD_DESC: "Gestido had publicly condemned the Blanco attempt to politicize the military, stating that 'any nation that §Rpoliticizes§! its §garmed forces§! will end up as a §Blamentable example§!.' But wise counsel goes unheeded, and the nation now reaps what it sowed.\n\nThe Supreme Court government did what it could, but lawyers were never going to lead the nation after a coup backed by foreign funding and a treasonous regime. A new solution was needed, and the nation demanded strong leadership. Thus the people looked to a hero, and eventually turned to Oscar Diego Gestido, whose legend had been forged in the 1959 flood relief.\n\nIn this movement to bring him to the Suárez Residence, Gestido himself was the last to join. True, after Vasconcellos failed to win the candidacy himself, he endorsed Gestido - perhaps the retired general could be the impartial leader the nation needed, filling the gap Vasconcellos had left. In the end, the Blancos and Colorados together persuaded the old general to serve once more.\n\nHe finally relented and took the presidential sash. The new President of Uruguay faces a daunting mission: fending off foreign powers seeking to strangle democracy, while calming the domestic fury demanding that traitors be punished. Fortunately he is not alone: the national unity cabinet supported by Vasconcellos and Tejera, and Pereira and rising star General Ceres in the military, all stand by him. If all work together, perhaps a bright path out of the crisis can be found.\n\n§YRight?§!"
 POLITICS_OSCAR_GESTIDO_MARZIST_DESC: "Oscar Gestido is haunted by the past. In 1935, as a pilot, he helped locate the rebel camp in the 'Bandit Gorge' on the Negro River - Basilio Muñoz and five hundred of his men were eating when cooking smoke betrayed their position. Rumors swirled after the camp was bombed, but Gestido had actually only conducted aerial reconnaissance and did not participate in the strike. By then the revolution had already failed; this operation was merely the final blow.\n\nGestido did not dwell on it until after the 1938 'little uprising,' when he watched the Marchist regime grow increasingly authoritarian and sympathetic to fascism. As left-wing ideas took root, he began to realize the error of having served the government. He had had the chance to join the patriotic movement, but instead fought for pro-German forces - the powers ravaging Europe, especially Britain. He could excuse himself with 'I was following orders,' but it was really a lack of courage. López Silvera had shown the younger generation of soldiers how to stand by justice in adversity.\n\nWhen he heard that the democratic opposition was planning a cross-border liberation operation, Gestido volunteered. With his military experience and the heroic reputation forged in the 1959 floods, he was quickly chosen as the operation's leader. Now victory may place his fame alongside national heroes like Leandro Gómez, but the old general only worries whether he has fully washed away his past sins."
 POLITICS_SUPREME_CORTE_DE_JUSTICIA_DESC: "Article 150 of the 1952 Uruguayan Constitution states: the §YNational Council of Government§! shall consist of nine members directly elected by the people, with an equal number of alternates, serving four-year terms. Elections and rules shall be as stipulated in Chapter III, with the entire nation voting as a single district.\n\nArticle 155 states: if the inauguration date of the §YNational Council of Government§! arrives and new members have not yet taken their oath, the §MSupreme Court§! shall temporarily exercise executive power during the interim.\n\nIn theory, this meant the Supreme Court should only have taken power after March 1965, but because the elected Herrerist-Ruralist councilors had conspired with Aguerrondo and, worse, Juan Domingo Perón, the Colorado-controlled military decided to accelerate the transfer of power to preserve Uruguay's rule-of-law tradition distinct from the rest of Latin America.\n\nUltimately, after removing all National Party councilors and alternates, executive power was transferred to the Supreme Court.\n\nSome worry that the Supreme Court is ill-equipped to lead a nation that needs to recover from a foreign-backed coup and faces a new round of §ggrey scare§!, and these concerns are not unfounded. But in this hour of crisis, every citizen, regardless of station, must step forward to serve the fatherland."
 POLITICS_JORGE_PACHECO_ARECO_DESC: "A politician evaluated by the US embassy as 'well-meaning but of mediocre intelligence, unlikely to govern after César's death' would naturally struggle to command respect. To be fair, this was the common public perception, but since Gestido chose Pacheco, he became President of Uruguay.\n\nPacheco was born in 1920 into a political family; his father, Dr. Manuel Pacheco, was a deputy and related by marriage to José Batlle y Ordóñez through the female line (his father was the brother of Batlle's wife). His maternal grandfather, Ricardo Aréco, was a Vieirist, and the young Pacheco chose to follow that path. This proved a wrong choice - the Vieirists, squeezed between the Batllists, Riverists, and Sosists, eventually vanished from lack of presence, with some followers like Eduardo Blanco Acevedo even defecting to the Marchists.\n\nBut fate intervened. Pacheco might have become a Charlone lackey, but his friendship and family ties with Laumar Jader changed things. Jader's father, Raúl, suggested he use the Batlle family connections to get a job at El Día, the Batllist mouthpiece. Pacheco seized the opportunity, became a journalist, wrote articles supporting Gestido's campaign, built his reputation, and eventually won nomination for deputy and senator.\n\nThe road to the presidency was truly accidental: Gestido and the Colorado-Batllista leadership were unwilling to resign their council seats to run, and the general's close friends refused the presidency. To prevent Charlone from placing his own man, a candidate was urgently needed, and Pacheco was chosen. Critics call him mediocre and dull; whether this judgment is true remains to be seen during his term."
 POLITICS_MARTIN_ECHEGOYEN_DESC: "Known as 'the wise man serving the caudillo Herrera,' Echegoyen soon defied his mentor's wishes, insisting on allying with the Ruralists and softening the Herrerist anti-American line. Perhaps his considerable intelligence allowed him to realize that if breaking with Herrera was more profitable, he should do it without hesitation.\n\nThis leader of the orthodox Herrerist faction began his political career unexpectedly - in his youth he belonged to the Radical Blancos, the anti-Herrerist left-wing split in the National Party. But this episode was brief; Echegoyen reversed course and gave his full support to Herrera, which boosted his career: he won Herrera's trust and entered Terra's cabinet as a minister. His ties to the Marchist regime went further; he represented Uruguay in negotiating financing for the Bonete Point Dam with Nazi Germany, visiting the Third Reich and being received by Hitler, who awarded him the Nazi Golden Eagle Medal.\n\nThe 'fascist' label stuck thereafter. The alliance with the Ruralists softened the faction's anti-American stance, weakening the accusations, but this was clearly a betrayal of Herrera's political legacy. In the 1962 election, orthodox Herrerists won a respectable vote, enough to alarm Echegoyen into acting.\n\nThe path forward was clear: only by fighting fire with fire could he consolidate his position. If successful, he would fully control the Herrerist movement, going down in history as the caudillo's worthy heir and a great leader.\n\nOf course, the Americans may have something to say about his plans."
 POLITICS_ALBERTO_GALLINAL_HEBER_DESC: "Alberto Gallinal Heber could have lived life however he pleased - he could have been a painter, pianist, opera singer, renowned orator, writer-poet, performance artist, or a famous barrister - God knows how many possibilities. But he chose public service, fighting poverty, hunger, illiteracy, and disease. Repairing hospitals, building schools, clearing wasteland, eradicating locusts, digging canals - and now he is President of Uruguay.\n\nThe fourth son of Alejandro Gallinal, a famous rancher and politician from the Batlle y Ordóñez era, Gallinal Heber managed the family estate in his early years before joining the Rural Association. Through his contributions to horse breeding and combating mange and foot-and-mouth disease, he quickly rose to become president of the Florida department branch, then formally entered politics. In 1956 he helped found the Democratic Blanco Union; though he lost the 1958 Councilman election, he had established his political base.\n\nAlongside politics, he continued his signature charitable work: serving on the National Emergency Committee chaired by Gestido, leading construction of new rural school buildings, and renovating the maternity ward of Pereira Rossell Hospital and the Maciel Hospital. His political involvement did not slacken; in 1964, judging the Democratic Blanco Union corrupt and incompetent and soft on union activity, he split with a few comrades to found the Rocha National Movement, signaling the effective demise of the Democratic Blanco Union.\n\nThe Rocha National Movement alone was clearly not enough to win, even with Gallinal Heber at its head. So he allied with the rump of the Democratic Blanco Union, the 'Blanco Reconstruction,' and won the election. But to continue his political ideals, his first priority is maintaining the alliance's unity."
 POLITICS_JUAN_PEDRO_RIBAS_MARZIST_DESC: "Ribas was just one of many conservative officers in the Marchist regime - a Uruguayan patriot loyal to the fatherland, a fervent supporter of the Spanish Nationalists. He got to meet his idol Franco and was promoted to general, a handsome reward for his loyalty. But his tenure was brief; the Batllist agitators soon took over the country and falsely accused him of being an Argentine traitor. To imply he would betray beloved Uruguay was an outrage, forcing him to resign to defend his honor.\n\nAn admirer of Eduardo Blanco Acevedo, he joined Blanco's movement after the Marchist regime fell. Thanks to political compromise, his career was revived - the former 'coup plotter' was actually given the task of preventing coups and entered the cabinet. His tense relationship with Luis Batlle quickly escalated into a macho duel: Ribas resigned and challenged Luis. This made him a favorite of the far right; when the media claimed 'people are begging for a coup,' he always declined, saying he 'did not wish to be the nation's schoolmaster.'\n\nClearly, Ribas has changed his tune. The Council was exactly the evil the Marchists had sworn to destroy in 1933. When Charlone proposed that he serve as interim President until new elections to restore order, Ribas could not refuse. But now serving under Charlone, Ribas encounters the same condescending paternalism he knew from Luis's time, and he wonders whether he is being shown the respect he deserves."
 POLITICS_JUAN_PEDRO_RIBAS_FALANGIST_DESC: "Ribas's loyalty to Uruguay is above all else. He dutifully served in the army under the Marchist regime, and would have continued serving Luis's government had Luis Batlle not falsely branded him an Argentine stooge - an insult any man with self-respect would have answered as he did, by resigning.\n\nRibas entered and left the cabinet as quickly as he had arrived. He hated Luis's condescending paternalism, and capped his political career by fighting a duel with Luis. This macho performance won him fervent adulation from the far right; they claimed to have begged him to stage a coup, which he declined saying he 'did not wish to be the nation's schoolmaster.' His rising reputation led to an invitation to join Aguerrondo's coup, but he withdrew when he discovered the plotters were colluding with Argentina, confirming that Aguerrondo was a Peronist stooge.\n\nEvents forced Ribas to form his own paramilitary, the Nationalist Armed Defense, to help crush the coup. Though the coup was put down, the eternal Uruguayan enemy, the 'porteños,' could not accept defeat, and Perón began a bloody reprisal. After the Plata Blitz, Uruguayan women and children who had dared defy Buenos Aires lay dead in the streets. The people of the Banda Oriental roared to hang every traitor from Montevideo's lampposts. It was this thirst for vengeance that propelled Ribas to the pinnacle of power, as he promised the anxious people what they had long awaited:\n\n§VUruguayans, never humiliated again!§!"
 POLITICS_MARIO_OSCAR_AGUERRONDO_DESC: "Admittedly, Mario Óscar Aguerrondo was not the first officer to attempt to overthrow the Uruguayan government, nor the first to answer Benito Nardone's call to resolve the Council problem via coup, but he is the first in the 20th century to actually succeed and eventually crown himself the nation's ruler.\n\nWhat were his motives? First, Aguerrondo was a Herrerist, at least in principle an opponent of the Batllists. Like many hardliners (not just Herrerists but the Uruguayan right as a whole), he believed the Batllists were either socialists or Communist puppets intent on destroying the nation, and must be purged and eliminated. This hostility to the Batlle legacy and the red threat was no secret, which is why Nardone appointed him Chief of Police of Montevideo. Though he seemed out of his depth at first, he used it as a stepping stone for his military career. Promoted to general, his unabashed fascist sympathies allowed him to crush the opposition that worried about his rise.\n\nIt was precisely his admiration for fascism that led people to call him a fascist, or at least so he would have it. Though many in his coup alliance worshipped Hitler, Mussolini, Franco, or Perón, to Aguerrondo these were all foreign ideologies; he saw himself as a pure Uruguayan nationalist, an Artiguist.\n\nWould José Gervasio Artigas have supported what Aguerrondo is about to do? He is convinced of it, and anyone who would contradict him is either behind bars or in the grave - after all, no one can shake his convictions."
 POLITICS_PABLO_MORATORIO_DESC: "Pablo Moratorio's story begins in 1938, when he was only an army colonel. His brother Sol participated in the 'little uprising' plot, and Moratorio knew about it all along. He reportedly informed the authorities of the conspiracy, though this story's credibility is doubtful. In any case, he benefited greatly from his brother's actions. In the 1940s Moratorio was promoted to general; he was universally regarded as a Marchist, and after democratic reconstruction in 1946 he remained under the protection of Blanco Acevedo and Charlone.\n\nAfter the Blanco 1958 election victory, he was appointed director of the National Refrigerator Plant on the basis of loyalty. This made him well known in the interior, a valuable ally in the eyes of the putschist officers. They once believed he would help establish the military government they dreamed of, but were ultimately disappointed - compared to a conspirator loyal to an ideology, Moratorio was more of an opportunist. He would join a cause without hesitation, but if he saw signs of defeat he would abandon it just as quickly. Personal safety and well-being were his highest creed.\n\nRibas had been removed for trying to turn the interim presidency into a permanent one, and Charlone urgently needed a new president acceptable to both the nationalist and putschist factions (the army had already been purged). Moratorio was the ideal choice. Unlike Ribas, he was content to play second fiddle, as long as he was well paid."
 POLITICS_PABLO_MORATORIO_AGUERRONDO_DESC: "Pablo Moratorio's story begins in 1938, when he was only an army colonel. His brother Sol participated in the 'little uprising' plot, and Moratorio knew about it all along. He reportedly informed the authorities of the conspiracy, though this story's credibility is doubtful. In any case, he benefited greatly from his brother's actions. In the 1940s Moratorio was promoted to general; he was universally regarded as a Marchist, and after democratic reconstruction in 1946 he remained under the protection of Blanco Acevedo and Charlone.\n\nAfter the Blanco 1958 election victory, he was appointed director of the National Refrigerator Plant on the basis of loyalty. This made him well known in the interior, a valuable ally in the eyes of the putschist officers. They once believed he would help establish the military government they dreamed of, but were ultimately disappointed - compared to a conspirator loyal to an ideology, Moratorio was more of an opportunist. He would join a cause without hesitation, but if he saw signs of defeat he would abandon it just as quickly. Personal safety and well-being were his highest creed.\n\nYet there remained a shred of principle in Moratorio's character. He sincerely loathed Perón and Peronism. Though he had misgivings about relying on Perón's support for Aguerrondo's coup, foreign aid was essential to making the coup a reality at the time, so he suppressed his unease. It proved a wrong move; as Moratorio had feared, Aguerrondo grew increasingly close to Perón. Fearing the colonel would reduce Uruguay to a vassal, he deposed the puppet he himself had installed. Now he sits in Aguerrondo's place, and given that he has not announced whether the 1966 elections will be held, he is clearly consolidating his power."
 POLITICS_VENTURA_RODRIGUEZ_DESC: "There are so many hypocrites hiding behind the concept of a 'necessary evil.' How many have used it as an excuse to indulge their appetites and commit countless crimes. But Ventura Rodriguez is different. He is one of the few lucid ones - he knows what he is doing is wrong, yet he persists through the muck. He will not beg for forgiveness; he just wants to finish this inevitable job as quickly as possible and retire home.\n\nOn his own merits, Rodriguez was unremarkable, but his National Party background made him attractive to Aguerrondo. Aguerrondo brought Rodriguez into his personal fiefdom, the Montevideo Police, and the two soon became close. Whether rising or being driven out by the Colorados, Aguerrondo needed someone he could trust with his legacy, and Rodriguez was that man. When Aguerrondo finally launched the coup, Rodriguez was his core ally.\n\nThey succeeded; the republic was saved from the Batllist Council government. But Rodriguez soon realized Uruguay faced a greater crisis: Aguerrondo and his clique refused to hand over power. To his shock, he discovered his colleagues, unlike him, had no intention of restoring any form of democracy.\n\nThis discovery chilled Rodriguez. To avoid becoming the 'second Baldomir' in history books, he began to plot. When Moratorio decided to overthrow Aguerrondo, Rodriguez contributed the forces under the Interior Minister's command. But he was no loyal fool; he knew Moratorio had to be removed as well, and struck when ready. Now he is doing the thankless work of persuading the military to accept the return of democracy. Beyond this, Rodriguez will accept no alternative."
 POLITICS_DOMINGO_TORTORELLI_DESC: "From Magadan to Monterrey (west, not east, damn it), no man or woman has heard of Domingo Tortorelli's greatness (read: absurdity). In the wild lands of Esenpei, not a single motherless, cockless creep trying to whitewash a masked child abuser knows him; as for the wastes who write SCP entries so brain-dead or funny that Alex Kister collects them in the Mandela Record - no matter how you question them, they could not possibly know who he is.\n\nSurprised, asshole? This guy is just a crazy Montevideo politician from the 1950s, barely known; you didn't actually think he was somebody, did you, idiot?\n\nIn 1938, seeing Batllists and other leftists banned from running, Domingo Tortorelli whimsically decided to run for President on behalf of his own Labor Concord Association. He appointed his wife Anatolia Manrupe as his running mate, on the obvious grounds of nepotism. He felt he had destiny on his side, and indeed he did... except he did not become President, but rather became entertainment for the Uruguayans who still bothered to stop and listen to his futile rants.\n\nTortorelli's platform included: milk taps on every street corner; a road from Rivera to Montevideo that was entirely downhill so trucks could save fuel; he said if elected he would decree the workday to be fifteen minutes; he said he would pass a law guaranteeing public office to everyone over eighteen. And best of all: he promised to cut the price of herbs, sugar, and liquor in half if the people voted for him!\n\nClearly Uruguayans are an ungrateful bunch who failed to recognize the momentous significance of electing Tortorelli as President. The result: he won no more than 50 votes - not 50 seats, 50 ballots. Well, he found a face-saving excuse: he claimed Tommy Douglas, Juan Perón, and Luis Batlle Berres had conspired to steal his slogans! Of course, such a conspiracy theory is utter nonsense. He lost because and only because he is a brain-dead idiot.\n\nAnd you are a brain-dead idiot too. This country currently has fuck-all content, why are you wasting your time hitting the ~ key and typing 'set_ruling_party esoteric_nazism'? Maybe you developmental-biology-deficient cretins should go watch a Minecraft YouTuber pretend to be Steve (they do that shit every day, don't @ me), or play TNO Brazil for a bit before coming back! Or go boil an egg and peel it; the shell and potato chips look about the same to you anyway.\n\n(Translation team note: just a joke, don't take it seriously.)"
 POLITICS_PILAR_BARRIOS_DESC: "In 1930, Dr. Ceredonio Nin y Silva wrote while celebrating Uruguay's centenary: 'Fortunately, Uruguay has no troubling Negro or Indian problem such as afflicts the nations of the Americas.' Even though everyone knew the great Artigas had a friend like the Black man Ansina, and candombe is revered as a unique element of Uruguayan culture, the situation of Afro-Uruguayans remained dire; they were still completely excluded from Uruguayan society.\n\nIn 1936, to break this situation, a new party joined the fight between the whites and the reds, only their party represented themselves in black. The Black Native Party was the successor to the journal Nuestra Raza, founded by Elíseo Cabral and the Barrios brothers to 'struggle tenaciously for the interests of people of color' and support 'every work, idea, or initiative that benefits the advancement and improvement of people of color.' Italy's invasion of Ethiopia prompted them to establish the 'Black Anti-War Anti-Fascist Committee,' and later they conceived the idea of building a proper party to defend Afro-Uruguayan interests.\n\nSadly, these efforts bore no fruit, and the Black Native Party dissolved after failing to win parliamentary seats. With the Middle Area tenements demolished, Barrios did the unthinkable out of desperation: he opened the console and typed 'How do you turn this on.' Twenty years later the Black Native Party rose from the ashes, empowered by sports car energy, and Barrios began fighting the racists.\n\nHaving spawned countless monks with cheat money, Barrios converted the Uruguayan people to his great cause. The political establishment tried to resist, but even the New World Order's stoogs could not withstand the power of 'i r winner.' Pan-Africanist Uruguay was born; the new Uruguay took a keen interest in West Africa, and Barrios hoped to save it from French colonialism and Cameroonian imperialism."

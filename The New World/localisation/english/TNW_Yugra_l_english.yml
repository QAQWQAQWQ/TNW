 POLITICS_JABA_IOSELIANI_DESC: "During Bukharin's rule, the Komi ASSR was dotted with Gulag labor camps, where political dissidents, criminals, and other Soviet undesirables were forced into harsh labor programs for the good of the state. Even after the Soviet collapse, the West Russian Revolutionary Front continued this practice, shipping trainloads of prisoners to concentration camps and monitoring them closely through the Red Navy base at Vorkuta. Jaba Konstantinovich Ioseliani was one of those sent into this system. A university dropout from Georgia who found bank robbery more profitable than academia, he was quickly convicted by a military tribunal and thrown onto the first boat bound for Vorkuta. He joined the vory v zakone, the so-called thieves who follow the thieves' law that controlled many Gulag criminal networks, and began what he expected would be decades of hard labor.`n`nFortunately, the Soviet Union collapsed a few weeks later, cutting off Vorkuta's supply lines. The prisoners split into two camps: those who wanted to work with the guards to survive, and those who refused to break the thieves' law and become sukasti. After a few short, bloody clashes, the traitors fled to the Urals, and Ioseliani helped organize a mass breakout of criminals further inland, away from Vorkuta's restless jailers. This greatly elevated his standing, earning him a place among the vory leaders who represented their faction. As the West Russian Revolutionary Front rose to the west and its enemies declined, Ioseliani's influence grew, and he was elected chairman of the organization. He also struck several quite profitable deals with the arms merchants of Dragunov and Zlatoust, agreeing to act as a buffer against remaining West Russian forces in exchange for their weaponry. But within the prison hierarchy, some considered Ioseliani's deals a betrayal of the thieves' code, and people whispered that he lacked ambition of conquest, that he had grown complacent and lazy..."
 POLITICS_IVAN_ISTOMIN_DESC: "Ivan Grigorievich Istomin is a native Siberian who became leader of a warlord state in a chaotic country almost by accident. A Nenets with Komi ancestry, he is typical of the indigenous people who struggle to keep their native language alive. He taught it in schools and later even became a writer, spreading his words and ideas among a war-ravaged people, never truly entering politics.`n`nLater, as the Urals Republic rose as a regional power, a power vacuum formed in parts of western Siberia, which the arms merchants of Zlatoust exploited by establishing loyal satellite states.`n`nIn the far north, where the indigenous people live, Istomin was found to be a relatively popular intellectual who agreed to lead Nenetsia. In this way, he might be able to keep alive the dream of an indigenous democratic state."
 POLITICS_IVAN_ISTOMIN_ONEGA_DESC: "Ivan Grigorievich Istomin is a native Siberian who became leader of a warlord state in a chaotic country almost by accident. A Nenets with Komi ancestry, he is typical of the indigenous people who struggle to keep their native language alive. He taught it in schools and later even became a writer, spreading his words and ideas among a war-ravaged people, never truly entering politics.`n`nLater, as the North Russian Republic rose as a regional power, a power vacuum formed in parts of western Siberia, which the anti-communist volunteer army of Onega exploited by establishing loyal satellite states.`n`nIn the far north, where the indigenous people live, Istomin was found to be a relatively popular intellectual who agreed to lead Nenetsia. In this way, he might be able to keep alive the dream of an indigenous democratic state."
 YGR_selfmade_men: "Self-Made Men"
 YGR_selfmade_men_desc: "The composition of our government is unique in the Russian wasteland, because most of our officials were... entrepreneurs in the former Soviet Union. Though outsiders see us as nothing more than a thieves' state, our leaders' unusual profession has its uses; deals get done and trade works. Our methods may be rough, but they always deliver results — and that is what matters most."
 YGR_zlatoust_made_government: "Zlatoust-Built Government"
 YGR_zlatoust_made_government_desc: "This has always been the reality; without our sister republic of Zlatoust, we would be nothing more than leaves in the wind. However, with their protection, we can ensure our... unique speculative activities proceed without foreign interference."
 YGR_siberian_democracy: "Siberian Democracy"
 YGR_siberian_democracy_desc: "With the vory overthrown, we will have a chance to build a proper democratic system on this Siberian wasteland. Our new leaders have no intention of letting this opportunity slip away."
 YGR_siberian_faithful: "Siberian Faith"
 YGR_siberian_faithful_desc: "The corrupt secular rule of Yugra has finally been overthrown, replaced by God's grace. Now we have the chance to properly show our people the path to salvation, and then extend this grace to Siberia, all of Russia, and beyond."
 YGR_pechora_war: "Pechora War"
 YGR_pechora_war_desc: "The Pechora War is the latest conflict between the two northern powers of Vorkuta and Yugra. But this time, both sides intend to see things through to the end."

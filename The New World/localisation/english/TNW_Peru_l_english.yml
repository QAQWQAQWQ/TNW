 PRU_Carlos_Moreyra_hog_desc: "§YPresident of the Council of Ministers\nSecond Vice President\nConservatism§!\n--------------\n§LMoreyra was born in 1898 and worked as an engineer and politician. He served as Minister of Development and Public Works under Prado, opposing Prado's pro-Allied neutrality policy during WWII. After the war, he worked at the National Agricultural Society until Prado's 1956 re-election. Having lost landowner support by keeping an open door to Japan, Prado was persuaded by Moreyra to join the National Democratic Conservative Action and name him second vice president. When Beltran criticized the Prado government, Moreyra acted as mediator. Beltran later became Minister of Economy and President of the Council of Ministers - the Peruvian prime minister. After Beltran's resignation, Moreyra took over as prime minister and maintained his friendship with Prado.§!"
 PRU_Gallo_Porras_eco_desc: "§YMinister of Economy and Finance\nFirst Vice President\nConservatism§!\n--------------\n§LGallo Porras was born in 1894 and is one of Peru's finest politicians. His experience as mayor of Miraflores and Lima in the 1930s gave him invaluable experience. After joining the National Democratic Conservative Action in 1955, he became Prado's running mate in the 1957 election. When former Minister of Economy and Finance Beltran resigned, Gallo took over. His friendship with Prado endured even through these difficult times.§!"
 PRU_Ricardo_Elias_sec_desc: "§YMinister of Interior and Police\nConservatism§!\n--------------\n§LElias Aparicio was born in 1906 and is an experienced lawyer. In 1938, the Benavides government commissioned him to study German and Italian penal systems, sparking his interest in Peruvian penal reform. He later began working with the military and police. In 1960, Prado appointed him Minister of Security. Recently, Elias has grown concerned about the ominous silence in the north and occasional terrorist attacks in the countryside.§!"
 presidente_peru_latin: "President"
 presidente_junta_latin: "Junta President"
 POLITICS_MANUEL_PRADO_UGARTECHE_DESC: "Manuel Prado y Ugarteche was born in 1889 into a prominent Peruvian family; his father Manuel Ignacio Prado had served as president. This civil engineer became a towering figure in Peruvian politics from the 1940s to the 1950s. Rising through politics, he was hand-picked by President Oscar R. Benavides as his successor and won the 1939 election. Prado continued Benavides's repression of the outlawed APRA party and the Peruvian Communist Party. When Nazi boots marched into Poland, the Prado government rewrote Peru's fate with a new foreign policy. After Pearl Harbor, to maintain friendly relations with Washington, Prado publicly supported the US and Allies while leaving room for Japan. By 1944, with the war's outcome uncertain but America still standing, Prado continued his 'neutral' diplomacy - until that history-changing moment: Pearl Harbor vanished in a blinding flash, and the United States surrendered conditionally to the Axis.\n\nThe fall of the northern giant shocked Manuel Prado, but he remained convinced he had chosen correctly and expected everything to continue as before. After his term, he went to the US and Canada to watch from afar as his country descended into turmoil, returning in 1956 to contest the 1957 election. Weak popular support forced him to form the National Democratic Conservative Coalition with Beltran and reach the Montrico Agreement with Manuel Odria - covering up Odria's corruption scandals in exchange for the coalition's nomination. During his second term, Prado abolished the National Security Law but maintained bans on APRA and the Revolutionary Union, releasing only their moderate members, and successfully stabilized the economy with Pedro Beltran.\n\nAfter five years in office, much remains undone. Facing the approaching election, divisions within the coalition, the investment war, and the APRA threat, Prado is planning his final moves before leaving office. He will continue his traditional strategy - patience, letting events resolve themselves. This philosophy has worked before, and it should work again.§R...right?§!"
 POLITICS_FERNANDO_BELAUNDE_TERRY_DESC: "Born in Lima on October 7, 1912, Fernando Belaunde - affectionately called 'Belaunde the Architect' by his followers and the Peruvian press - is both a typical Peruvian politician and a man who broke the mold. He came from an aristocratic family whose lineage traced back to Lima's earliest Spanish settlers; his father Rafael Belaunde served twice as Peru's prime minister. Privilege paved his way.\n\nAfter studying in the United States, Belaunde returned to Lima as a wealthy industrialist, renowned for his academic writings and architectural works. Leveraging his father's political connections, he held various government posts, interrupted only briefly during the Odria regime. In 1956, he formally entered politics by founding the National Front of Democratic Youth, a group of young reformists that nominated him to run against Manuel Prado. Though he finished second, Belaunde transformed the organization into the mature party Popular Action. Based on the political philosophy of 'Peru as Creed,' he traveled the nation, planting Popular Action chapters in every city he visited, making him the most prominent and influential opposition leader during the Prado government.\n\nNow, having achieved what he failed to in 1956, a long road still lies ahead for the Architect. Many reform plans await implementation, but whether this successor possesses the political wisdom his predecessors lacked, only time will tell."
 POLITICS_LUIS_BEDOYA_REYES_DESC: "Luis Fernan Bedoya Reyes was born on February 20, 1919, in the port city of Callao. Though from humble origins, he excelled from childhood, graduating with honors from San Marcos University - the oldest in the Americas - and embarking on a promising legal career.\n\nDeeply influenced by Christian democracy since his student days, he became one of the earliest members of the Peruvian Christian Democratic Party. When the party allied with Belaunde's Popular Action in the 1963 election, he was appointed Minister of Justice by the Belaunde government. His outstanding performance led Belaunde to endorse him as the candidate for Mayor of Lima in 1964, where he won a decisive victory over the popular former First Lady Maria Delgado de Odria. As mayor, he earned national fame as 'the most efficient mayor in Lima's history,' admired for achieving remarkable results without corruption. Disillusioned with both Belaunde and the Christian Democrats, he founded the Christian People's Party - a new party that upheld Christian social doctrine while leading national reform.\n\nNow he has achieved both expected and unexpected greatness - reaching the pinnacle of Peruvian power. As democratic systems falter worldwide, perhaps by providence or fortune, this Andean nation has found the best person to lay democratic foundations. Whether Peru can sustain this fortune will be a miracle to behold."
 POLITICS_MANUEL_ARTURO_ODRIA_DESC: "Manuel Arturo Odria is the very model of a Latin American political figure. Born on November 26, 1896, into a prominent military family in Peru's Tarma province, he was raised on martial tradition and entered the army, standing out among his peers for his intelligence and discipline. He rose steadily through the ranks, eventually reaching the highest Peruvian command during the first Ecuadorian-Peruvian War.\n\nAfter the 1947 APRA terrorist attack, he became Minister of War in President Jose Bustamante y Rivero's government. When Bustamante refused to outlaw APRA again, Odria led the armed forces in a coup that overthrew him in October 1948. After the 'perfectly fair' 1950 election, Odria ruled as constitutional president. His tenure was known for massive infrastructure programs like the National Stadium and expanded social security, but also for the brutal repression of APRA and its militants. Under pressure from the OFN and the United States, Odria began democratization in 1956, transferring power to election winner Manuel Prado y Ugarteche. They had a secret agreement: Odria would hand over power peacefully in exchange for Prado not investigating his corruption.\n\nNow that Peruvian civilian politicians have once again plunged the nation into crisis, Odria takes the presidency once more. The unfinished work of the 1948 revolution will be completed, whether the Yankees like it or not!"

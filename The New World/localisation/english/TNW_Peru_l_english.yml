 PRU_idea_fake_democratic_dream: "Illusory Dream"
 PRU_idea_fake_democratic_dream_desc: "On the surface, Peruvian democracy seems solid and functional. But scratch beneath the surface and the truth is far more complex. Indeed, after Prado's 1939 election, democracy was finally restored, but it soon faced its greatest test - the Battle of Lima. Fortunately, Peruvian democracy emerged victorious, convincing the people of its invincibility... but then in the 1950s, the Odria government was tarnished by accusations of 'electoral fraud,' once again damaging democracy's image.\n\nWill Peru achieve its long-awaited democratic dream? Or will historical tragedy repeat itself? In seeking answers, we must tread carefully. Because if we fail, our dreams will fall forever, dragging §Rthe people's faith in democracy§! down with us. But if we succeed, §mdemocracy will weather the winter and finally be realized§!."
 PRU_idea_silent_liberation: "Silent Liberation"
 PRU_idea_silent_liberation_desc: "After the Battle of Lima, pro-APRA northern regions continued to resist the Bustamante and Odria governments, but one day their actions suddenly stopped... and silence fell. Soldiers reported no firefights, police confidently said everything was under control, and citizens went about their mundane lives as if nothing had happened. But for Lima, this silence is no good omen. We must ensure the north remains under our control, §Rbecause we know APRA is still there, hiding, lying in wait...§!"
 PRU_idea_two_super_powers_one_economy: "Two Superpowers, One Economy"
 PRU_idea_two_super_powers_one_economy_desc: "After the signing of the Akagi Agreement, Prado began attracting Japanese investment to Peru. Since then, Peru has hosted an investment war between the US and Japan. In the view of many political theorists, Peru could be Japan's gateway to South America, and both nations have poured billions into the country for their own purposes.\n\nSeveral Peruvian presidents in the 1950s welcomed American and Japanese investment. President Odria attracted billions of yen to Peru. Meanwhile, the US, unwilling to let Japan expand its sphere without firing a shot, also invested heavily in Peru.\n\nAcross the country, especially in the industrial northwest and the Talara refinery zone, US-Japan economic conflicts flare up periodically. If Peru can continue attracting major power investment, more wealth will flow in. However, wealth brings problems. Wealthy Japanese and American families have profited enormously from investment, their assets rivaling the Peruvian upper class, exacerbating domestic inequality. While Peru's economy benefits, this will also spark strong working-class opposition. If mishandled, the situation could escalate into violent conflict."
 PRU_idea_peru_diverse_problems: "Diverse Problems of a Diverse Nation"
 PRU_idea_peru_diverse_problems_desc: "As the heartland of the former Inca Empire, our beautiful land boasts diverse cultural traditions - from our own mestizo culture, to that of foreign immigrants, to indigenous cultures. But more people mean more problems. Previous governments neglected agricultural reform, integrating the jungle regions, and developing the Andes, and even popular protests failed to make them understand the importance of these issues. We must not repeat their mistakes! These problems must be addressed sooner or later, and if we solve them successfully, §nwe will win the people's hearts permanently.§!"
 PRU_idea_death_of_dream: "Death of a Dream"
 PRU_idea_death_of_dream_desc: ""
 PRU_idea_peruvian_armed_forces: "Peruvian Armed Forces"
 POLITICS_SALEM_MARGARET_DESC: "Salem and Margaret, like yin and yang.\n\n\n\n\n\nTwo cats, one Peru.\n\n\n\n\n\nTwo cats, one Anthony.\n\n\n\n\n\nOne Anthony, one Peru.\n\n\n\nLong live the Republic.\n\nLong live Peru!"
 national_socialism_party: "Social and Democratic Union"
 national_socialism_party_long: "Social and Democratic Union (Union Democratica y Social)"
 PRU_Alvarado_Garrido_for_desc: "§YMinister of Foreign Affairs\nConservatism§!\n--------------\n§LAlvarado Garrido was born in 1907 with a legendary 40-year career in law and politics. He taught at the National University of San Marcos and the Pontifical Catholic University of Peru, and served as ambassador to Bolivia in the 1950s. His long and brilliant career earned him President Prado's favor, and in 1960 he was appointed Foreign Minister. He currently bears the heavy responsibility of navigating the Ecuadorian diplomatic impasse and maintaining friendly relations with both the US and Japan.§!"

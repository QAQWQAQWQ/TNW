l_english:
 MCW_ultranationalism_schorner_party:0 "Schörner's Clique"
 MCW_ultranationalism_schorner_party_long:0 "Schörner's Clique"
 MCW_despotism_postSR_party:0 "Einheitspakt Commission for Russia"
 MCW_despotism_postSR_party_long:0 "Einheitspakt Commission for Russia (Einheitspaktausschuss für Russland)"
 MCW_The_Marshals_Fiefdom:0 "The Marshal's Fiefdom"
 MCW_The_Marshals_Fiefdom_desc:0 "Marshal Ferdinand Schörner and his clique of aggressive militarists quickly seized power in the Moscow district, establishing a brutal military dictatorship. Though he claims to be maintaining order against the slave uprisings of the Untermenschen, he has effectively turned this snowy wasteland into his personal fiefdom."
 MCW_Brutal_Repression:0 "Brutal Repression"
 MCW_Brutal_Repression_desc:0 "The Marshal has sworn not only to crush the slave uprisings in Moscow, but to suppress all dissidents who dare resist his regime. Rebel politicians, Wehrmacht officers, German settlers, and Russian natives — all are treated the same, summarily executed by loyal militarist patrols. No one knows if the brutal repression will end — or if it has only just begun."
 MCW_Schorners_Ambition:0 "Schörner's Ambition"
 MCW_Schorners_Ambition_desc:0 "Governing this land as Moscow Marshal is merely one step on the bloody road to ruling the entire Greater German Reich. Schörner's eyes are set on the West, hoping the chaos of the slave uprisings will conveniently pave the way for his victorious march on Germania, bringing down Albert Speer."
 MCW_Schorners_Ambition_tooltip:0 "§RIf Schörner is not dealt with quickly, he may well realize his ambition and cross the Dnieper...§!"
 MCW_Russia_in_ruins:0 "Russia in Ruins"
 MCW_Russia_in_ruins_desc:0 "The slave uprisings were an unmitigated disaster for the Moscow district, coming on top of its already troubled state. Due to Schörner's brutal repression of protesters and other innocent civilians during Operation Otto, this suffering land is on the verge of collapse. It is now unlikely that Germany can occupy it under its old plan."
 MCW_Pakt_Commission:0 "Einheitspakt High Commission"
 MCW_Pakt_Commission_desc:0 "As a result of the slave uprisings, and to present an image of cooperation, the Moscow district has been formally placed under the joint administration of the Einheitspakt. Though the facade has been relaxed, occupation policy is still directed by the Greater German Reich, and the fate of the Moscow district will be decided by the Germania government."
 MCW_minister_Otto_Wohler:0 "Otto Wöhler"
 MCW_minister_Otto_Bradfisch:0 "Otto Bradfisch"
 MCW_minister_Otto_Abetz:0 "Otto Abetz"
 MCW_minister_Otto_Ambros:0 "Otto Ambros"
 POLITICS_FERDINAND_SCHORNER_MOSKOWIEN_DESC:0 "Ferdinand Schörner could never tolerate being treated with disrespect. Ever since he was exiled to the Moscow Generalbezirk on some flimsy pretext, this Marshal has grimly performed his duties, ruling his forces with an iron fist and cracking down hard on partisans. All this time, he and his militarist clique have been grinding their teeth, staring wide-eyed at Germania, waiting for the perfect moment for revenge.
\nWhatever he was waiting for, Schörner could never have predicted the slave uprisings. Across the entire Rusland district, Russian slaves rose up in rebellion, throwing off their masters and plunging the Moscow region into chaos. Schörner seized power brutally, establishing a new military government. Reports of his violent suppression of the uprisings have spread far and wide, and his treasonous threats to march on Germania to crush the rebellion have not gone unheeded.
\nWhile the legitimacy of his threats is debatable, only a fool would believe that Ferdinand Schörner's ambition would stop merely at establishing a dictatorship in Russia."

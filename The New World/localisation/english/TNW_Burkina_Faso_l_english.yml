 BKF_idea_remnant_francophilia: "Remnant Francophilia"
 BKF_idea_remnant_francophilia_desc: "Upper Volta is one of the few former French colonies that continues to view cooperation with the French as the only path for its foreign policy and economy — and the only way to ensure stability.

Though the Francophiles are slowly being replaced one by one, the ghost of French colonialism still haunts every decision of the Upper Voltan government."
 BKF_idea_remnant_francophilia_tt: "§YUpper Volta's fate is inextricably tied to France, and its future will be decided in a few years.§!"
 BKF_idea_relative_democracy: "Relative Democracy"
 BKF_idea_relative_democracy_desc: "Though Upper Volta's democratic system is far from perfect, it at least continues to function, and remains comparatively democratic.

Though logistical issues make it difficult for the state to maintain this system, for now it seems to satisfy the people of Upper Volta. Whether this satisfaction will last remains to be seen."
 POLITICS_MAURICE_YAMEOGO_DESC: "To understand why Maurice Yaméogo is so enamored with the ideal of "Franco-African co-prosperity" — earning him the nickname "Mister Maurice" — one must know his past. Yaméogo was rejected and scorned by his own family, all because of his unusual interest in Christianity. He left home and studied hard to enter a seminary — but his personal life fell far short of the standards required by the Church. Yaméogo wanted to become a priest, but he was too fond of women and parties. In 1939, he left the seminary without graduating and joined the French colonial administration as a clerk. This prestigious position meant success, security, and status. When war swept across West Africa, Yaméogo was sent to Abidjan, a paradise for "civilized" Africans.

The Free French' generous rewards, combined with Yaméogo's ambition, made him fiercely loyal to the French cause in West Africa. When he returned to his homeland, he restored the administration of Upper Volta and won popular acclaim, but he refused to cooperate with other Africanist leaders like Senghor. Subsequently, Yaméogo purged all opposition from the assembly, eliminated all his enemies, and established a one-party state.

Yaméogo claims Upper Volta is a free, unified, and democratic republic, a shining model of African liberation — but this is far from the truth. Upper Volta is a divided, weak, and authoritarian little country, entirely dependent on French assistance to defend against the stronger warlords of neighboring states. Though this strategy works for now, if Free France withdraws its support, Yaméogo will soon find himself isolated. Though he meets frequently with de Gaulle to maintain good relations, he will find that the situation is gradually turning against him…"

 GER_Espionage.31.t:0 "TEMP: Unternehmen Fallschirm event"
 GER_Espionage.31.desc:0 "Event is about Liana Clemente being extracted to Germany and some info about her past life (she was one of the children taken from Poland and adopted and germanised, she doesn't remember this but has some memories of it)"
 GER_Espionage.31.a:0 "OK"
 GER_Espionage.32.t:0 "TEMP: Unternehmen Schild 1st event"
 GER_Espionage.32.desc:0 "German event - report of minor politicians in the PSP from defecting and a rallying effect around Adhemar"
 GER_Espionage.32.a:0 "OK"
 GER_Espionage.33.t:0 "TEMP: Unternehmen Schild 2nd event"
 GER_Espionage.33.desc:0 "Event for Germany focuses on the blackmail Antônio Carlos Magalhães, a major figure in the PSD and a close associate of Juscelino Kubitschek. Damning corruption allegations force him to support Adhemar in the coma crisis. He also reveals information on Kubitschek allowing Germany to further blackmail him."
 GER_Espionage.33.a:0 "OK"
 GER_Espionage.34.t:0 "TEMP: Unternehmen Schild 3rd event"
 GER_Espionage.34.desc:0 "Event for Germany, event revolves around blackmailing Kubitschek over his affair and corruption over an apartment in Ipanema that he owned. event for this shows Kubitschek stop actively supporting the impeachment of adhemar to prevent the stress of corruption and a exposed affair hurting his wife and two children"
 GER_Espionage.34.a:0 "OK"
 GER_Espionage.35.t:0 "TEMP: Unternehmen Ouroboros event"
 GER_Espionage.35.desc:0 "Event for Germany, kills two US agents in the CIA FBI mechanic"
 GER_Espionage.35.a:0 "OK"

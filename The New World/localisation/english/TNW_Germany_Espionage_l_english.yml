 GER_Espionage_strengthen_PSP: "§hUnternehmen Lauffeuer§!"
 GER_Espionage_strengthen_PSP_desc: "However degenerate democracy may be as a form of government, it is undeniable that it carries within the seeds of its own destruction. Nowhere else is clearer than in Brazil, where the Partido Social Progressista under Adhemar de Barros managed to win the latest presidential elections in a stunning upset. While President de Barros is not openly a National Socialist, he made several public statements praising the Reich and its accomplishments, and decrying American influence in Brazil. If we can help him consolidate his power, we may be able to turn Brazil into a de facto ally of the Reich, and a spearhead into South America."
 GER_Espionage_strengthen_PSP_success: "§Gthe mission succeeding, boosting the popularity of the $BRA_party_psp_c$.§!"
 GER_Espionage_weaken_UDN: "§hUnternehmen Aussterben§!"
 GER_Espionage_weaken_UDN_desc: "The mongrel nation of Brazil has elected a new president, Carlos Lacerda from the União Democrática Nacional. Known for his rabid anti-Reich rhetoric and his close ties to America, Lacerda has vowed to expunge all German influence from Brazil, and one of his objectives is to have Brazil join the OFN. This is a development that we cannot allow to stand. If we can convince the Brazilian public that Lacerda goes against their interests, we may be able to force him out of office and replace him with someone more amenable to us."
 GER_Espionage_weaken_UDN_success: "§Gthe mission succeeding, reducing the popularity of the $BRA_party_udn_c$.§!"
 GER_Espionage_extract_BRA_assets:0 "§hUnternehmen Fallschirm§!"
 GER_Espionage_extract_BRA_assets_desc:0 "Terrible news from Brazil: President Adhemar de Barros has suddenly fallen into a coma. While no one in Germania cares whether he lives or dies, should he pass away, our spy network in Brazil would be in grave danger of being exposed and dismantled by the next President. We must act quickly to extract all our assets from Brazil, before it's too late."
 GER_Espionage_extract_BRA_assets_cost:0 "§Y20%§!£GFX_expertise, §Y100M§!£GFX_dollar_sign"
 GER_Espionage_extract_BRA_assets_cost_blocked:0 "§R20%§!£GFX_expertise, §R100M§!£GFX_dollar_sign"
 GER_Espionage_operation_schild:0 "§hUnternehmen Schild§!"
 GER_Espionage_operation_schild_desc:0 "President Adhemar de Barros of Brazil has made it clear several times that he wishes to see closer ties between Brazil and the Reich. However, there is one obstacle in the way: the United States of America and its network of allied nations in the Organization of Free Nations. Should Brazil disengage from America too quickly, it would risk American retaliation. Instead we should propose to President de Barros a secret deal that would see the Reich send industrial and pharmaceutical experts from Germany into Brazil through corporations like Deutsche Bank and IG Farben. As Brazil becomes more dependent on our help, the more we can pull the country closer into our sphere of influence."
 GER_Espionage_operation_schild_cost:0 "§Y20%§!£GFX_expertise, §Y[?GER_Espionage_operation_schild_cost_var_loc]M§!£GFX_dollar_sign"
 GER_Espionage_operation_schild_cost_blocked:0 "§R20%§!£GFX_expertise, §R[?GER_Espionage_operation_schild_cost_var_loc]M§!£GFX_dollar_sign"
 GER_Espionage_operation_Ouroboros:0 "§hUnternehmen Ouroboros§!"
 GER_Espionage_operation_Ouroboros_desc:0 "With one foot in Brazil's door, we can now directly challenge America in its own backyard. Thanks to President de Barros, a golden opprtunity has been presented to us: using our newfound influence to neutralize American secret service agents operating in Brazil. We can immediately start sending covert agents to track down and eliminate enemy spies, the more we neutralize them, the harder it will be for Americans to maintain their grip on Brazil."
 GER_Espionage_operation_Ouroboros_cost:0 "§Y20%§!£GFX_expertise, §Y[?GER_Espionage_operation_Ouroboros_cost_var_loc]M§!£GFX_dollar_sign"
 GER_Espionage_operation_Ouroboros_cost_blocked:0 "§R20%§!£GFX_expertise, §R[?GER_Espionage_operation_Ouroboros_cost_var_loc]M§!£GFX_dollar_sign"
 GER_Espionage_strengthen_PRP:0 "§QUnternehmen Parasit§!"
 GER_Espionage_strengthen_PRP_desc:0 "Just like Hitler once did, we need to destroy democracy with the weapons of democracy. By spreading the idea of National Socialism among the Brazilian electorate, we can destroy the democratic system from within. The Partido de Representação Popular, or PRP, is a far right party espousing Integralist and Italian-style Fascist ideas. While they are not National Socialists, the PRP is the only party in Brazil ideologically close to us, and we can use them as a tool to spread our influence in Brazil."
 GER_Espionage_strengthen_PRP_cost:0 "§Y20%§!£GFX_expertise ，§Y[?GER_Espionage_strengthen_PRP_cost_var_loc]M§!£GFX_dollar_sign"
 GER_Espionage_strengthen_PRP_cost_blocked:0 "§R20%§!£GFX_expertise ，§R[?GER_Espionage_strengthen_PRP_cost_var_loc]M§!£GFX_dollar_sign"
 GER_Espionage_operation_belgrano:0 "§QUnternehmen Belgrano§!"
 GER_Espionage_operation_belgrano_desc:0 "With the election of Carlos Lacerda as President of Brazil, we must turn to other nations in South America to find new allies. Argentina, the perennial rival of Brazil, is a promising candidate. If we support the military of Argentina with arms and funding, it may be able to stand up to Brazil in proxy conflicts."
 GER_Espionage_operation_befehl:0 "§QUnternehmen Befehl§!"
 GER_Espionage_operation_befehl_desc:0 "Recently in Brazil, the mob has taken to the streets in strike, rioting and protesting against the government of President Lacerda. While strikes are communist degeneracy, this is a golden opportunity for us to further destabilze Brazil. We can secretly inflitrate the protests and turn them violent, causing the public to lose faith in President Lacerda and turn to more radical solutions."
 BOV_industrial_battalions: "Form Industrial Battalions"
 BOV_rebuild_plast: "Rebuild the Plast"
 BOV_banderite_virtue: "Foster Banderite Virtue"
 BOV_souls_slag: "More Souls For The Slag"
 BOV_every_soldier: "Every Man A Soldier"
 BOV_ukrainian_purity: "Guardians of Ukrainian Purity"
 BOV_reverse_shackles: "Reverse the Shackles"
 BOV_reclaim_crimea: "Reclaim Crimea"
 BOV_bandera_triumphant: "Bandera Triumphant"
 BOV_decapitated_azhdaya: "The Decapitated Azhdaya"
 BOV_third_final_struggle_desc: "The end has begun. All that is left to be decided is whether we win, or we die. Blood shall be spilt in honor of Bandera's legacy, either as victors, or martyrs. No matter the cost, no matter the opponent, we have the will to fight for Ukraine. For Bandera. For all Ukrainians persecuted, killed, raped, mutilated, treated as dirt. Our struggle for freedom is coming to an end, one drenched in blood.\n\nSlava Ukraini!"
 BOV_empower_peasantry_desc: "Many years spent in the shadows, pursued by the most efficient and ruthless of killers, has made us well understand the danger of arming those who you do not trust. So it is with the national peasantry. Far too many are, or were, collaborators. Or worse.\n\nYet, we have no choice. We must have men to fill out the ranks, to fill out the line, or we shall be overrun. They will be recruited and given nominal training. Perhaps some will discover their heroism. For those who prove themselves unreliable, well, there are far more direct solutions."
 BOV_demons_thicket_desc: "While it cannot be denied that we are in desperate need of manpower, in desperate need of armed formations of any kind, we cannot allow that need to drive us into potentially catastrophic mistakes. We do not have that luxury. So it is with the question of arming the peasantry.\n\nWhile it is true that to do so would give us a much-needed influx of militiamen, we cannot be assured of their loyalty on a national scale, and so they will remain in their local defense areas. Our trained fighters might be spread increasingly thin, but at least they will be reliable."
 BOV_rivne_heart_desc: "For many years, Rivne functioned as the black heart of the German administration, and while we may hate what it represented, we cannot afford to ignore a resource. For the old tractor factory complexes there still operate, and they present a tremendous opportunity for us if turned to the war effort.\n\nRepurposed vehicles, converted from tractors to technicals, would give us a significant advantage in the battles to come, especially against other irregular forces. It will not be without cost, but the rewards cannot be denied."
 BOV_galicia_veins_desc: "Under the invaders, Galicia was turned into a marvel of decentralized industry. Small workshops, artisanal factories, and production facilities dot the landscape - decadent constructions that would disgust any true Ukrainian. Yet, we cannot afford to ignore this resource in such dire times.\n\nWhat can be repurposed for military production will be, after expropriation. Whatever cannot be sold on, and the windfall reinvested into the struggle. Galicia's industry will serve the cause, one way or the other."
 BOV_oaken_ramparts_desc: "The UNRA is pressing us hard, indeed. Fortunately for us, however, most of the frontage in their areas is in harsh terrain, especially woodlands. Long experience hiding in those same forests has made our men something of an expert in their use - and exploitation.\n\nThese skills can be put to use, rapidly and ingeniously fortifying those forested areas against the Guard. Every defensive line created strengthens our position and releases some of the pressure on precious manpower. We must encourage such labor with all haste."
 BOV_define_innocence_desc: "What separates a guilty man from an innocent one in Ukraine? The innocent man holds the injustices committed against our nation close to his heart, never once allowing his mind to wander into feelings of compromise or reconciliation. He is steadfast in prosecuting the enemies of the people, staying his hand only when the last enemy of Ukraine lies dead at his feet. The guilty man, meanwhile, hardly requires introduction. He is an opportunist; a snake who sells out his countrymen out of cowardice, indifference, or even malice.\n\nSadly, there are some amongst the ranks of the UPA who have begun to see the guilty in a different light: sympathizing with the view that a select few of those who collaborated with Germany are not beyond salvation. This is a childish, fantastical notion at best, and we must root it out before it has time to blossom. Treason is treason, after all, and the guilty will be punished without hesitation or remorse."
 BOV_cauldrons_steel_desc: "Our forces fight valiantly, and it is agreed by all that the Republicans cannot, will not, and shall not breach our lines - anywhere. But if they somehow do, if the unthinkable were to come to pass, we must be ready. We must be prepared.\n\nIn such a case, our last bastions will be in the cities, and we shall make them cauldrons of steel, extracting barrels of blood for each step taken inside them. Every vehicle and building will be made a strongpoint, and they will be bled white, street by street."
 BOV_perdition_guilty_desc: "The traitors who once lorded over their own kinsmen like slave drivers now rot in musty, crowded cells awaiting the day of retribution. These worms are bastards to a man, each and every one condemned for putting their own interests, as well as the interests of foreign invaders, ahead of Ukraine's: a heinous crime that can only be washed away with blood.\n\nSome of them beg for clemency, offering their services to the cause and singing hollow songs of their allegiance to the nation. It is, after all, only in their nature to yield meekly to their captors! Whatever skills these scum may possess are but a drop in the ocean compared to the depth of their sins. Public executions have been arranged in every city that currently lies under UPA control, to demonstrate to all the heavy price of turning your back on your countrymen."
 BOV_second_struggle_avenged_desc: "After a hard-fought campaign in the western fringes of Ukraine, the so-called UNRA lies vanquished before us. Their feeble republican movement has been scattered to the wind, marking a new chapter in the quest for a free and independent Ukraine: one shaped by patriotic Banderite thought rather than the milquetoast republicanism espoused by the Guard and their puppeteers. All that remains is to march to the aid of our brethren to the East, who still languish under the rule of tyrants. The final step to unification is at hand, and the destiny of Ukraine hangs in the balance. The struggle shall not end until victory is ours, no matter how many must give their lives in the name of liberation!"
 BOV_nourishing_bodies_desc: "Ukraine was once one of the most fertile lands in all of Eurasia, her endless fields of grain serving as the breadbasket for nations the world over. Those days, regretfully, are long over. Sucked dry by the Soviet and Nazi machines, and scorched away by the war that now ravages our homeland, the people of Ukraine have been left with very little to keep their bellies full. While our own forces too are struggling to find sustenance each day, it would be a severe dereliction of our duties to Ukraine to let the people starve. Our already meager rations will be cut even further to provide some relief, fleeting as it may be, to the people. Let this act of kindness serve as another reminder of the UPA's benevolence, and its commitment to Ukraine's wellbeing!"
 BOV_enriching_minds_desc: "For most, the UPA's ultimate objectives are simple enough to understand. We seek only the total liberation of Ukraine from foreign oppressors and traitors alike, and to avenge the decades of injustices inflicted upon her people. There are those, however, who doubt our sincerity, whose minds have been clouded by a vast web of lies spun by our many enemies.\n\nMurderers! Rapists! Barbarians! All of these hyperbolic words and more are used to decry our just cause, and if action is not taken, the people may begin to be seduced by these slanderous accusations. An education program shall be started to espouse the virtues of the UPA and make our countrymen understand that we come as liberators, not conquerors. Victory may only be achieved when the hearts of the nation beat as one, and when everyone from the highest-ranking general to the lowliest peasant is able to stand in common cause."
 BOV_swell_ironworks_desc: "As we have retaken more of Ukraine, we have also retaken resources and industrial potential, and restored some of the supply and input lines cut in the conflict's outbreak. This does not, however, mean that they are immediately operational again, and it will take work to restore dormant factories to operation.\n\nWork that will, shall, be carried out. The fight is not yet over, and we must have more war material to support the fronts that are still active. It will benefit all to see these great foundries once again operational."
 BOV_industrial_battalions_desc: "Years of occupation and collaborator 'schooling' has, unfortunately, left few of our countrymen with anything that could be considered technical skills. We must therefore find ways to remedy this if we are to expand our expert workforce, and a proposal has been received.\n\nThose few engineers we do have will be given officer ranks and positioned in command of workers battalions, tasked with skills transfer. It will be an agonizingly slow process, yes, but it will, in time, serve to grow our technical workforce."
 BOV_rebuild_plast_desc: "In days long gone, the Plast was the crucible in which many of the UPA's current general staff were forged. It was once a scouting organization for young students, intended to teach them in the ways of wilderness survival and crucial leadership skills. This organization provided a plethora of talented officers for the UPA, and if we wish to lay the seeds for the next generation, a new Plast will be needed.\n\nWith the scout troops revived, the youth of Ukraine will be reinvigorated with patriotic ideals, learning from a young age to put their fatherland ahead of all else. It is in the newly restored Plast where the idea of the new Ukrainian warrior will be born: fiercely devoted to the defense of his country, tempered with a deep care for the wellbeing of his countrymen. Coupled with the skills needed to lead their brethren to victory even in the hardiest of circumstances, they will make for a fine body of soldiers indeed!"
 BOV_banderite_virtue_desc: "Many have pushed for us to send every man - regardless of age - to the front, in order to push for victory. But we resistrealize the folly of this, for there is no victory to be had if our next generation is destroyed in achieving it, and sending teenagers to the battlefield would only guarantee such an outcome.\n\nThey can, instead, be far better utilized through their education in Bandera's tenets. They can act as loyal sentries in their community, reporting on and protecting against ethical decay, acting as role models for younger children, and more."
 BOV_souls_slag_desc: "It cannot be denied that we have an excess of brave patriots willing to fight - and die - for the dream that is Ukraine. Yet, we do not have an excess of weaponry, and a man with no weapon is worse than useless on the battlefield. The same cannot be said of the foundry.\n\nMany factories remain severely understaffed as a result of accidents and dangerous conditions, and these men can serve there. Surely they will brave the slag if doing so helps secure victory."
 BOV_every_soldier_desc: "In our existential struggle, there is no resource, no man, that can sit unused. All must serve - in one way or another - if Ukraine is to be free. There can be no exceptions. Such is the case with our division of manpower between the front and the factories.\n\nThere are those who may think they possess exemptions from the factory, and this may be true. But they have no exemptions from the fight, and clearly if they can be spared from the assembly line, they can, will, and shall contribute to the front line. The fight demands it."
 BOV_ukrainian_purity_desc: "Who can deny that it is we - us - who are the only ones acting with conviction to protect Ukraine from the menaces that circle it? That we are the only ones protecting the traditions of old, and the only ones who can properly build a future? None who speak the truth, surely.\n\nWe are Ukraine, and Ukraine is us, and this has never been more true than it is now, with enemies circling around who would see our people and our culture erased from existence. Anyone who so denies is clearly an enemy to be fought - and we will do so with conviction."
 BOV_reverse_shackles_desc: "As the conflict subsides, the rats naturally try to flee, and the German settlers imposed on our lands are no different. They, however, have not been as successful as they desperately hoped, and many have been captured by our forces. They must answer for the crimes of their beloved Reich.\n\nSo they shall. The debt owed can, of course, never fully be repaid - but a start can be had. They can take the place of the slaves they so cruelly exploited for so long, and so contribute to the continuing war effort. We will see how long they last."
 BOV_reclaim_crimea_desc: "After countless battles, and years of struggle, finally we stand on the precipice of victory. The communists have been decapitated, dispersed, and driven into the forests and wilds, unable to mount attacks. The Germans and their collaborators have been almost entirely vanquished. But the fight is not yet over.\n\nCrimea still stands as an odious bastion of German influence, and this cannot stand. We will push forward, and drown the Teutonic scourge in the sea!"
 BOV_bandera_triumphant_desc: "For the first time in many, many, many years, Ukraine is free. Of communists. Of Germans. Of all those who would see it shackled, oppressed, and trampled underfoot. Ukraine stands triumphant over its foes, and stands even stronger as a free nation for the Ukrainian people.\n\nThis victory was near-eternity in the making, and though Bandera is not here to see it, surely he smiles down from the heavens upon us, and upon the fulfillment of our, and his, lifelong dream.\n\nSlava Ukraini!"
 BOV_decapitated_azhdaya_desc: "What is going on?\n\nCommunications have been suddenly and totally lost with cities and military units across Ukraine, from north to south and east to west. Nothing is working - radios, telephones, even messengers - and we exist in a near-total information blackout.\n\nNo -one that we can talk to, be they politician, military officer, civilian, or anything else, has any answers, and cannot even begin to decide upon a course of action.\n\nWhat are we to do now?"
 BOV_deluge_deceit: "The Deluge of Deceit"
 BOV_gut_sb: "Gut the SB"
 BOV_emergency_restructuring: "Emergency Restructuring"
 BOV_autumn_anarchy: "The Autumn of Anarchy"
 BOV_peasant_pawns: "Our Peasant Pawns"
 BOV_polish_scourge: "The Polish Scourge"
 BOV_roaches_rats: "Roaches Among The Rats"
 BOV_shumskyi_white: "Bleed Shumskyi White"
 BOV_galvanize_galicians: "Galvanize the Galicians"
 BOV_melnyk_vermin: "Exterminate Melnyk's Vermin"
 BOV_op_golov: "Operation Golovinsky"
 BOV_deluge_deceit_desc: "We have been betrayed. Roman Shukhevcyh and Yaroslav Stetsko, both former Banderites, have defected to the Melnykites, exposing systemic disloyalty to the UPA, and the legacy of Stepan Bandera, who shaped this nation. Where else could there be disloyalty? The Sluzha Bezpeky? The very administration? Now, we can't trust anyone.\n\nMoving forward, we must be vigilant; it is crucial that no more defectors arise. To do this, we must thoroughly and diligently purge all disloyalty from the country. We will be vulnerable to the opposition, who will almost definitely attempt to overthrow us in our moment of weakness. This is the greatest challenge the UPA will ever face. If we prevail, our revolution will live on. Should we not, the dream of a Greater Ukraine will be extinguished."
 BOV_gut_sb_desc: "The Sluzhba Bezpeky, our secret police force, has done its part in securing the destiny of our revolution. However, in light of recent events that occurred in the UPA, we have to make some intensive changes to how it is run, and who runs it.\n\nThe SB was run by Mykola Lebed, a lapdog of Stetsko. The SB, having been run by Lebed with no oversight, has left it compromised. These two facts create an extremely concerning issue, something that can be consequential if it isn't fixed immediately."
 BOV_emergency_restructuring_desc: "There is systemic disloyalty everywhere in our government. The administration is no exception, according to our secret police. The Sluzhba Bezpeky is aware of the administrators who need to go.\n\nThe SB will round up the administrators, interrogate them, relieve them of their duties, and dispose of them. The Vozhd is prepared for this and has handpicked new administrators to replace them. Our government requires honest, loyal, and diligent administrators to function. Should our administrators not meet those requirements, they will have to be excised."
 BOV_autumn_anarchy_desc: "As predicted, the Communists and Melnykites noticed our reorganization. Like ravens on a corpse, they have once again revolted, hoping to topple our regime. Although they don't know it, they are gravely mistaken. Our revolution is not a corpse. It is alive and thriving; we shall crush them, quickly and decisively.\n\nHowever, we must act fast. These savages are ravaging the countryside, attempting to rally the people against us. To succeed, we must match their rampage with one of our own."
 BOV_peasant_pawns_desc: "The King and the Peasant. In feudal times, the King ruled and protected the peasants who worked for him. While Europe moved past this relationship, the Russians didn't. Under their incompetent rule, Russia lagged behind the rest of Europe. Now, we must modernize the relationship between the State and the Peasant.\n\nThese peasants are very conservative, and most would enthusiastically join our ranks against the Melnykites and the Bolsheviks. Should we use the peasants against them, they will help our cause. In this grand game of Chess, the peasants are nothing but our pawns."
 BOV_polish_scourge_desc: "For centuries, the Polish have oppressed the Ukrainian people. After the Polish-Soviet War, they seized western Galicia, rightful Ukrainian territory, from us. To the present day, they still own it, briefly interrupted by the invasion of Poland.\n\nSimilarly to us, the Poles only just got independence from the Germans. They are still weak. If we plan well and strike fast, we may continue our quest; to create a Greater Ukraine."
 BOV_roaches_rats_desc: "There were many German collaborators. They are rats, scum of the earth. Although the Vozhd and Bandera collaborated with the Nazis, they viewed it as an alliance. When the Nazis attempted to assert authority, they broke their pact with the Nazis. However, those who continue to collaborate with the Nazis are rats.\n\nHowever, some don't like the Nazis. Yet, they collaborate, fearing for their lives. These are the cockroaches, and we can easily filter them out from the rats. These roaches can be very useful to us; they have valuable experience and can be easily beaten into compliance."
 BOV_shumskyi_white_desc: "Throughout recent history, the Communists persevered, even when defeat seemed imminent. Lenin never gave up on his revolution, and eventually, they overthrew the Russian Empire. Bukharin never gave up on the Soviet Union during Operation Barbarossa. However, for Bukharin, the outcome was quite different. Yet, the Communists will continue to live on, and one spark of hope could lead to a fire of resistance.\n\nTo prevent this, we must act quickly and decisively. We must strike, again, again, and again. If we give the Communists time to lick their wounds, we will be putting our government at risk. No matter the cost, no Communists shall gain an inch of land in Ukraine!"
 BOV_galvanize_galicians_desc: "To continue preparations for our annexation of Galicia, we must send a message to our Galician brothers. Right now, they are under Polish oppression. Soon we will liberate them, and we must establish contacts there. Perhaps they can assist us in our cause. Our success relies on the cooperation of our countrymen to resist the subcultural Polish swine."
 BOV_melnyk_vermin_desc: "After painstaking efforts from what remains of the Sluzhba Bezpeky, we have tracked down the remnants of the militant Melnykite movement, which is in Chernihiv. The faction is nothing but a shadow of its former self, now under Roman Sushko.\n\nOnce we purge the remnants of the Melnykites, we will destroy all factionalism in the OUN; once more, we will unite the OUN as one party, an occasion which merits a 'Slava Ukraini!'"
 BOV_op_golov_desc: "After meticulous planning by our officers and the Vozhd, it's ready. Operation Golovinsky, our operation to liberate Galicia, has been extensively planned. Now, the only thing separating us and reunification with our countrymen is the simple go-ahead of an order from the supreme Vozhd and Poland shall once again know our fury!"
 BOV_last_roman: "The Last Roman"
 BOV_shattered_front: "A Shattered Front"
 BOV_insuring_insurgencies: "Insuring the Insurgencies"
 BOV_line_in_sand: "A Line in the Sand"
 BOV_uneasy_truce: "An Uneasy Truce"
 BOV_ukrainian_triumvirate: "A Ukrainian Triumvirate"
 BOV_excise_excess: "Excise Extremist Excess"
 BOV_fractured_organization: "A Fractured Organization"
 BOV_humiliate_honorless: "Humiliate the Honorless"
 BOV_emboldening_embers: "Emboldening the Embers"
 BOV_score_unsettled: "A Score Unsettled"
 BOV_last_roman_desc: "On many occasions the Romans of old were rent asunder by civil war, and only by the victory of one claimant was some form of order recovered. So it is today, with Shukhevych standing atop the remains of a once-unified front, and the pillars of Klyachkivsky and Stetsko torn down.\n\nThe reins of Ukraine, of the future of the state and its people, are in his hands - and he will have to act quickly to solidify his hold. For Ukraine - and for the promises of prosperity that seem so far away."
 BOV_shattered_front_desc: "It was taken for granted that the unity once achieved by Bandera would endure among all Ukrainians. That fantasy has been shattered - at staggering cost to the people as a whole. Different militias, movements, and individuals fought each other as much as they did the invaders, and so consigned all to decline.\n\nThis must be corrected. The effort required will be truly enormous, but the rifts between these groupings must be mended and a common front established. We are all, first and foremost, whatever our differences, Ukrainian."
 BOV_insuring_insurgencies_desc: "Regardless of overtures made, the Communists and Republicans continue to fight expecting, as has happened many times in the past, their families to suffer the consequences if they are betrayed. We have no such intention, but we cannot blame them - the scars run deep.\n\nThey will not yet join us, but this does not mean we need be punitive. We can fight them as honorably as possible, treat their prisoners with respect, and peacefully occupy the lands we take from them - absent reprisals. In time, they will learn our sincerity, and join us as brothers."
 BOV_line_in_sand_desc: "No matter what we do or say, the Communists and Republicans fight on, wasting lives, effort, and resources against fellow Ukrainians instead of against those who wish us all erased. We must put a stop to this, and if we cannot outright defeat them in the field, we can at least make a deal.\n\nWe shall pledge to eschew any reprisal action against them or their families as long as they refrain from attacks on or destruction of critical infrastructure. It will be a suspicious truce, to be sure, but it will serve our needs for now - and that must be good enough."
 BOV_uneasy_truce_desc: "Though there are still skirmishes between our forces and those of our common ideological foes, they have declined in recent times owing, at least in part, to the repeated overtures of peace that have been extended by our leadership. Cautious questions have been sent to us in reply, and while it is obvious that they are using this lull to recover from the wounds we have inflicted upon them, it is at least a peace, of sorts.\n\nOnly time will tell if this 'peace' will truly last, but if we make the effort to preserve it, perhaps in time a true understanding can be reached."
 BOV_ukrainian_triumvirate_desc: "Without a doubt one of the most damaging decisions of Klyachkivsky was the over-centralization of power in only one man's hands - his own. It turned him into a tyrant, repressing any dissent, and the results were disastrous for all. We will not repeat this mistake.\n\nExecutive power will be invested in a council, and though Shukhevych will necessarily retain its chairmanship, he will not be a dictator. Checked and informed by fellow patriots, the worst excesses will be avoided, and consensus will be obtained before decisions."
 BOV_excise_excess_desc: "Shukhevych's legacy as a former collaborator is a somewhat messy one, but one more than exonerated of through his actions. Many followed with him, even before the Ukrainian Civil War, but it's no well-hidden secret that those who fled with him during and after the Civil War were certainly not well-meaning, and were only looking out for their own hides. These collaborator scum must be purged from our ranks, and doing so will come with great ease.\n\nWhile treasonous shrews like the now-dead Stetsko will inevitably protest, they have hardly any say in this matter, and that point besides, their complaints will only make it easier to track down these backstabbing elements. Ukraine has no place for traitors and the criminally evil, and the former employees of Nazis are no exception."
 BOV_fractured_organization_desc: "The void of charisma and unifying presence left by the death of Konovalets has left the OUN as a bickering, infighting - often literally - mess ever since, and Shukhevych's triumph has not resolved this. Every day, disparate factions bite at each other like rabid dogs in the halls of the government, impeding operations; if we hope for our organization to stand the test of time, or even five years, this must be eliminated.\n\nNothing generates unity like justice, and, fortunately, now provides an excellent opportunity. With the defeat of the Reichskommissariat, we have an abundance trials of traitors and oppressors to be put on trial, to receive due retribution for lifetimes and lives lost, bringing true justice for the past to Ukraine.\n\nThis is far from the beginning of our efforts on unifying the OUN, and far from the beginning of a unified OUN, but even still, we must begin, or all will be lost."
 BOV_humiliate_honorless_desc: "A bureaucratic system is a spine that keeps any nation floating, so it is deeply ironic that our bureaucracy is filled with those who have none whatsoever. Leftovers from the accursed Reichskommissariat, most of the current basis of our government consists of former collaborators who managed to escape the rope during initial trials of the collaborators; most pointing to their past incompetences as proof of resistance, which they may as well have been. While this cannot be allowed to persist, we regretfully cannot outright cleanse ourselves of most of our bean-counting office workers. As a result, the solution is obvious.\n\nTo eliminate the highest ranking survivors of the purges will ensure that examples are made publicly, while parading around the rest as those who sold out their country and must be fixed to love it as they once did will allow us to ensure they are sufficiently dedicated to the cause once more. They simply do not yet know they have it in them."
 BOV_emboldening_embers_desc: "Many former collaborators were left with no choice but to follow the Melnykites to express their nationalism, but the most righteous path has revealed itself, and all were given the choice to follow it, and so they have.\n\nReunifying the OUN has come as no easy feat, but to solidify these gains we must make efforts to appeal to their total support. No organization such as ours can fully function without total cooperation, and we are certain these initially more avid collaborators will be able to offer such - or will prove themselves useful in other ways. The OUN now stands taller than ever, perhaps even now rivalling the age of Konovalets, and we could never be prouder of it."
 BOV_score_unsettled_desc: "Galicia has always been Ukrainian, no matter the endless Polish ethnic cleansing efforts since the tragedy of their war with the Russians in the '20s. Ever since, the Piedmont of Ukraine has remained separate from its nation, and regardless of whatever throwaway promises the Germans made to the Melnykite traitors they saw no reason to change this situation. As such, with the overthrow of the Generalgouvernment, the Poles still hold half of Ukraine, and our homes, families, and people still rest under their thumb. It is high time we bring Galicia home.\n\nThe Poles will obviously not be grateful for the deal we are offering them, but for all their oppressions of our people in the past, it is more than generous enough.\n\nThe Poles will return our rightful lands.\n\n§ROr their blood will water our land before we return.§!"
 BOV_fortune_infamous: "Fortune Favors the Infamous"
 BOV_yaroslav_wisdom: "Yaroslav's Wisdom"
 BOV_twist_dagger: "Twist the Dagger"
 BOV_streets_rage: "Streets of Rage"
 BOV_reassure_settlers: "Reassure the Settlers"
 BOV_media_blackout: "Blackout the Media"
 BOV_our_bloodlands_await: "Our Bloodlands Await"
 BOV_fortune_infamous_desc: "At every level, and at every obstacle that the Vozhd faced, people said that he could not overcome them. 'Stetsko will fail this time' was a thought widely shared. But he never did - and never will. The actions taken to secure ultimate power have inspired rage, hatred, and plotting against him, but he will solve all of these, in time.\n\nThe odds have always been against him, both internally and externally, and yet fortune's favor cannot be denied. The Vozhd will endure this trial as well. As he always has."
 BOV_yaroslav_wisdom_desc: "Whereas others in Ukraine focus on the immediate, Stetsko looks beyond. Towards history, both past and future. Emulating Yaroslav the Wise, he sees the larger picture and how, regardless of recent events, the real enemy of millenia past are the Russo-Mongolian hordes.\n\nGermany, for all its many failings, won a great victory against them for the Aryan race and for the European peoples, and this cannot be understated. Taking this wisdom, Stetsko will carefully guide the ship of state, and bring Ukraine to stand as an equal with its contemporaries."
 BOV_twist_dagger_desc: "The mighty Vozhd was forced to make unfortunate deals and compromises to seize our independent state's reigns. The underhanded and covert nature of these efforts has seen disgruntled voices in our movement make startling comparisons between our Vozhd and the Jewish parasites that defiled our homeland. This is unacceptable! The wise Stestko represents a new future for the Aryans of Ukraine, and like a true Aryan, he shall triumph over all who question his reign."
 BOV_streets_rage_desc: "Even after all that our nation has been through, marching through blood, sweat, and tears from decades of warfare with Bolshevism and traitors, our country remains polluted. The Slavic-Mongol bands of Poles and Russians, now free of their imprisonments, scour the countryside in roving bands, causing disorder and terror. Enough is enough; we shall remind these scum of their place in Ukraine, even if we have to commit some terrors of our own!"
 BOV_reassure_settlers_desc: "Since the end of the Reichskommissariat and our force's triumph in the civil war, our Aryan brethren amongst the settlers have watched us with a growing sense of dread and paranoia, doubtlessly beset by fear of treasonous psychopaths like Klyachkivsky. Fear not, beloved cousins! We are not madmen, traitors, or degenerates, but fellow Aryans and model Ukrainians, and there is nothing to fear..."
 BOV_media_blackout_desc: "The Jews that control the media within America and its decadent vessels have smelt blood. The troubles within Germany have given them newfound motivation to sneak their degenerate values into the minds of anyone no longer shielded by German censors. Ukrainians are unfortunately no exception.\n\nIn order to prevent the degradation of our values caused by this onslaught of Jewish propaganda, Ukraine must double its censorship efforts and flood the airwaves to counter any and all liberal and communist influence. If our newfound state is to survive for any time, our people's minds must be free of any corruptive influence."
 BOV_our_bloodlands_await_desc: "Galicia is Ukrainian - It always has been, and it always will be. Whether it was ruled by Poles, Austrians, Russians or Poles again did not change this fact. Those Poles who still occupy Galicia may try to deny this and deny us our homes. If they do not relinquish territory, we will have to remind them of our legitimate claim.\n\nThe Germans seem somewhat convinced of our right to Galicia, giving Ukrainians autonomy within the Polish Administration. In addition, both Bandera and Shukhevych have made efforts in the past to cleanse the land. It could take only one final push to see Galicia populated wholly by Ukranains and to see no Pole or any other race haunt these lands again."

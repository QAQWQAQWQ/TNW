 BOV_subdue_serpents: "Subdue the Supreme Serpents"
 BOV_subdue_serpents_desc: "Many of those former collaborators who aided in the liberation from before the start have been exceptionally dedicated to the cause, though some were limited to collaboration as it was the only way forward for a Ukrainian state. Not their leaders, however. Those leaders who did everything to collaborate above promoting nationalism do not deserve the beat of their hearts or the breath in their lungs. Depriving them of both will prove the only way forward for Ukraine.\n\nWhile Stetsko has already perished, executing Stsiborskyi and Shtul immediately will prove itself the greatest boon to Ukrainian nationalism since Taras Shevchenko's first writings. They will not be missed. In their absence, Ukraine will prosper, the nation will grow stronger, and political divisiveness will fade into the past. May their graves be forgotten, and the unity of the OUN stand forevermore."
 UKR_BOV_last_roman_tt: "§WAt last, reason has returned to §MUkr§!§Yaine§!'s patriots. Klyachkivsky's madness and Stetsko's treason have been crushed - liberty awaits us!§!"
 UKR_BOV_shattered_front_tt: "§YFirst, let us mend old wounds.§!"
 UKR_BOV_uneasy_truce_tt: "§YPeace at last, for now at least.§!"
 UKR_BOV_ukrainian_triumvirate_tt: "§YOne man - one Vozhd - cannot rule alone.§!"
 UKR_BOV_excise_extremist_excess_tt: "§YSome of us have not gotten the memo it seems. Unfortunate.§! §RThey will have to go.§!"
 UKR_BOV_fractured_organization_tt: "§YLet us bring justice, and thus unity, to our people.§!"
 UKR_BOV_emboldening_embers_tt: "§YLet us stand together. We will die alone otherwise.§!"
 UKR_BOV_a_score_unsettled_tt: "§RThe §WPo§!§Vles§! will given a chance to see reason.§!"
 UKR_BOV_fortune_infamous_tt: "§WIt didn't have to be this way, but it's too late now - §RKlyachkivsky and Shukhevych are dead§!.§!"
 UKR_BOV_yaroslavs_wisdom_tt: "§YRefusal to collaborate is simply a refusal to grow - an insistence on suicide, if you will.§!"
 UKR_BOV_twist_the_dagger_tt: "§YThere shall be no more dissent in my §MUkr§!§Yaine§!.§!"
 UKR_BOV_reassure_settlers_tt: "§YWe are liberators, not butcherers. Our German friends will surely see this.§!"
 UKR_BOV_bloodlands_await_tt: "§RWe shall reclaim our rightful land from §WPol§!§Vish§! rot.§!"

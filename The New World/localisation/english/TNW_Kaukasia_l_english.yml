 CAU_bergbaureich:0 "Mining Reich"
 CAU_bergbaureich_desc:0 "The Caucasus is known the world over not for its land, but for what lies beneath it. The earth provides endless flows of oil and tons of metals and minerals, and the German occupiers share generously and greedily in this bounty."
 CAU_shipments_to_ger:0 "Shipments to Germany"
 CAU_shipments_to_ger_desc:0 "Ukraine may be Germany's breadbasket, but the Caucasus is Germany's fuel tank. The Caucasian oil industry exists solely to satisfy German demand."
 CAU_stratified:0 "Stratified Society"
 CAU_stratified_desc:0 "A hierarchy has emerged in the commissariat. At the bottom are Georgians, Armenians, and Circassians who continue to rebel. Above them are other minorities, then German skilled workers, and at the top the bureaucracy and military ruled by Josias's men."
 CAU_german_investments:0 "German Investments"
 CAU_german_investments_desc:0 "Oil must flow, and the Caucasus has plenty of it. Josias's past cold attitude kept Reich experts away, but now the oil barons are happy to hire them, boosting productivity to unprecedented heights!"
 cau.10002.t:0 "The Monarchy Question"
 cau.10002.desc:0 "Is Josias going to be a mad monarch?"
 cau.10002.a:0 "No"
 cau.10002.b:0 "Yes"
 cau.10003.t:0 "Business Conspiracy"
 cau.10003.desc:0 "Josias has gone too mad, and the industrialists have staged a coup."
 cau.10003.a:0 "No, he's cool"
 cau.10003.b: "Down with Josias!"
 cau.10004.t:0 "Kaiser Josias!"
 cau.10004.desc:0 "The madman actually did it - he has crowned himself King of the Caucasus!"
 cau.10004.a: "God save Emperor Josias!"
 cau.10005.t:0 "The Businessmen's Choice"
 cau.10005.desc:0 "The German Civil War has begun, and we face a choice. Do we back Bormann or Goering?"
 cau.10005.a:0 "Bet on Bormann winning!"
 cau.10005.b:0 "Follow Goering!"

 POLITICS_John_XXIII_DESC:0 "Pope John XXIII, born Angelo Giuseppe Roncalli, is the reigning Pope of the Catholic Church, Vicar of Christ on Earth, and spiritual leader of millions of Catholics worldwide. Angelo was born into a family of tenant farmers in northern Italy and later joined the Franciscan Order: the young Angelo showed administrative talent from his ordination and rose quickly through the hierarchy. During WWI, Angelo served as a military chaplain in the Royal Italian Army and later became a Vatican nuncio; when WWII began, the now-Bishop Angelo was in Bulgaria, secretly helping local Jews escape persecution to the Levant.\n\nAfter the war, Angelo was recalled to Rome and elevated to Cardinal by Pope Pius XII. When Pius XII died in 1958, the Church lost the man who had led it through the upheavals of WWII. With fierce divisions between opposing political factions, the conclave decided to choose an inarticulate old man as Pope, who would accomplish almost nothing in his pontificate, allowing the smaller factions in the Church to continue their squabbling - and so they chose the humble former nuncio Angelo Roncalli, and they could not have been more wrong.\n\nPope John XXIII proved to be an energetic, charismatic reformer; though traditionalist in doctrine, the new Pope became a stern critic of European fascist regimes, speaking out in support of democracy and denouncing Catholics who collaborated with oppressive policies. As a symbol of hope, he even inspired non-Catholics and was widely beloved among the people. Despite his friction with the fascist government, the Italian people even nicknamed him 'the Good Pope.' Yet the Church led by John XXIII remains divided, and as he ages and his health declines, no one knows whether the path set by this 'Good Pope' will be followed by his flock - perhaps only God, in His infinite wisdom, knows all this."
 POLITICS_CHARLOTTE_DESC:0 "Princess Charlotte Louise Juliette Grimaldi is the reigning ruler of the Principality of Monaco, though most of the time she truly wishes she was not. Her road to rulership has been filled with strife and conflict since her birth in 1898: she is the illegitimate daughter of Prince Louis II, who had no siblings and no legitimate children. She was made heir presumptive (though it violated Monegasque law) solely to prevent the Principality from being inherited by a German prince who was the dynastic heir, avoiding an international crisis between France and the German Empire.\n\nThe young Princess later married a French count: however, he was homosexual, and her marriage was unhappy, with a well-known affair before they finally divorced. During WWII, Monaco was occupied by Mussolini's forces, and Charlotte asked Louis II to let her renounce her succession in favor of her son Rainier. Louis refused, as Rainier was known to sympathize with the Allies, and as the Axis won victories worldwide, the Prince feared making him heir would mean the end of the small state.\n\nThe Axis ultimately won, and doom did not come. Monaco submitted to the new European hegemon, and after Louis died in 1949, Charlotte became Princess. Yet her political role is very limited, with most power ultimately resting in a circle of ministers and administrators around her increasingly active son Rainier. As Monaco grows wealthier and more glamorous, foreign celebrities and businessmen flock to squander their fortunes on the beaches and in the casinos, while the Princess sits in her palace, gazing out at the luxury hotels and the Riviera coastline. To some, Monaco is but a dot on the European map, a place forgotten by history; to others, Monaco is a wonderland of indulgence and refined pleasure; to the Princess, Monaco will always be a cage, no matter how gilded."
 POLITICS_Leonida_Suzzi_Valli_DESC:0 "The Most Excellent Leonida Suzzi Valli is the newest elected Captain-Regent of the Most Serene Republic of San Marino, a small republic perched on Monte Titano in the Apennines. Valli was a high school teacher of mathematics and physics who later entered the Republic's political arena, working in diplomacy and becoming San Marino's envoy to Italy and Germany during WWII. Though Valli resented fascism and its impact on his small country's once-free and democratic life, he was forced to join the Sammarinese Fascist Party to continue his political career.\n\nAfter WWII, despite his country being controlled by the fascists and the powerful Gozzi family, who repeatedly placed family members in the Captain-Regency, Valli continued his political activity. Over the years, Valli became the leading figure opposing the Gozzi family, ultimately succeeding in becoming Captain-Regent with the goal of undoing the undemocratic and unfree policies of the past and restoring some freedom to the ancient Republic.\n\nThough San Marino's ancient democratic traditions were tarnished by fascism, the Republic has developed greatly over the past decades, and new troubles have come to trouble this ancient republic. With accelerating industrialization and urbanization, the country's economy grows increasingly dependent on Italy, eroding San Marino's precious independence, while workers and the proletariat grow increasingly discontent with the Republic's institutions. Now Valli and his allies must navigate the tangled web troubling Monte Titano, while carefully avoiding drawing too much unwanted attention from neighboring Italy."

 MOC_casino_monte_carlo:0 "Casino de Monte-Carlo"
 MOC_casino_monte_carlo_desc:0 "The Monte Carlo Casino is Monaco's most famous landmark, drawing wealthy foreigners from around the world to gamble their fortunes in its lavish halls. Yet the casino's charm and elegance are not merely for show: it contributes enormously to our small country's revenue. However, since WWII ended, the European aristocracy who were the casino's traditional clientele have mostly been impoverished, exiled, or dead, causing serious economic problems for our Principality. If we cannot find other sources of revenue, we will go bankrupt, and the glamour and hedonism associated with Monaco will become a distant memory."
 MOC_rainier_reform:0 "Rainier's Reformism"
 MOC_rainier_reform_desc:0 "The current heir apparent, Prince Rainier III, is arguably more famous at home and abroad than his mother, the reigning Princess. To the gossip columns, he is known for his marriage to American film star Grace Kelly. To diplomats, he is known for openly sympathizing with the Allied cause during WWII, which led the Axis powers to occupy the small Principality and nearly erase it from the map. Despite this, Rainier remains very politically active: while his mother spends most of her time on her own affairs, Rainier manages the country to a considerable degree, even forming a circle of ministers and bureaucrats very influential in the national government."
 MOC_italian_oversight:0 "Italian Oversight"
 MOC_italian_oversight_desc:0 "The very fact that our country still exists is something of a minor miracle: during WWII, Monaco was occupied successively by German and Italian forces, saved only by its economic value to the Axis occupiers. Because its casino was a stable source of precious foreign exchange, Monaco continued to exist as a legally independent state, though firmly within Italy's sphere of influence. Yet Rome has not been gentle in managing Monaco's affairs, and every move we might make to reduce the Principality's dependence on Italy is viewed with suspicion by their fascist government. If we are too careless in trying to improve our country's fate, the consequences could be very serious."
 SNM_princely_sovereign_council:0 "Sovereign Council"
 SNM_princely_sovereign_council_desc:0 "San Marino is the world's oldest republic, with a long tradition of democratic freedom - or at least, it once did. Since 1923, the Sammarinese Fascist Party has dominated the small state's politics, every opposition party is banned by law, and the ancient Grand Council has been transformed into today's Sovereign Council. While this was partly meant to appease Italy, it also greatly enhanced the power of wealthy families like the Gozzi - the fascist party's original core, which has held the Republic firmly in its grip for forty years. Though dissent within the fascist party grows, it seems unlikely to bring the party down quickly."
 SNM_burgeoning_indust:0 "Rapid Industrialization"
 SNM_burgeoning_indust_desc:0 "Since Mussolini's time, Italy and San Marino have undertaken a series of collaborative infrastructure projects, such as the railway from San Marino to Rimini. This has increased our economic dependence on Italy, but also allowed our old agrarian economy to begin developing a strong industrial base. As more peasants flood into the developing industrial cities to work in factories, San Marino's traditional social structure, once dominated by a landowning elite, is also changing. Urban dwellers grow increasingly important to our country's political balance."
 SNM_rising_discontent:0 "Rising Discontent"
 SNM_rising_discontent_desc:0 "Despite our country's recent industrial development, economic inequality remains a very serious problem in the Republic. Combined with the fascist government's restrictions on labor rights and the political unfreedom caused by the Sammarinese Fascist Party's absolute rule, these issues are causing serious discontent among the workers and lower classes. Though our law enforcement agencies are still working to contain the situation, there is reason to suspect the underground Sammarinese Communist Party is exploiting the situation to spread its incendiary extremism among the proletariat. Unless we address this situation, we may be in serious trouble."
 VAC_lateran_pacts:0 "Lateran Pacts"
 VAC_lateran_pacts_desc:0 "The Lateran Pacts were signed in 1929 by the Mussolini government and the Holy See, and are the legal and diplomatic foundation for the existence of Vatican City. The signing of the Lateran Pacts ended sixty years of hostility between the Papacy and Italy, which began with Italy's occupation of Rome during the Risorgimento. The Lateran Pacts not only re-established a formal Papal State (even if confined to the Vatican), but also granted the Church other concessions, such as state financial support, recognition of Catholicism as Italy's state religion, and permission for the Church to continue teaching Catholic doctrine in public schools. As long as the Lateran Pacts remain in effect, we can rest assured that under Italy's protection, our state faces no threat whatsoever."
 VAC_one_holy_catholic:0 "One Holy Catholic and Apostolic (and Divided) Church"
 VAC_one_holy_catholic_desc:0 "As the world's largest religious organization and spiritual home to millions of Catholics, though the Church should in essence be holy and undivided, it naturally faces many human divisions. Faced with the many challenges of a changing world, the Church is divided on how it should proceed as Christ's dwelling on Earth: Should it continue to collaborate with regimes that mouth Christian doctrine while committing tyranny and oppression, ignoring their violence? Should it rise up against the tyranny of fascism and imperialism, truly helping the poor and meek? Or should it sever ties with secular politics entirely, caring only for the spiritual needs of God's flock? These and many other questions have torn the Church, and perhaps only God knows how to resolve them."
 VAC_good_pope:0 "The Good Pope"
 VAC_good_pope_desc:0 "After the controversial pontificate of Pius XII, the election of John XXIII marked a major shift in Vatican politics. Where Pius XII was rigorous, dignified, and detached, John XXIII is far more approachable: he preaches directly to the crowds, participates in the revitalization of Catholic secular political associations, and denounces the oppressive activities of fascist regimes in Europe and beyond. Pope John's lofty reputation has earned him the nickname 'the Good Pope' inside and outside Italy, and made him a thorn in the side of some nations. Yet due to his declining health, the Good Pope knows his time to guide the Church in the direction he wishes is running out before he is called to the Lord."

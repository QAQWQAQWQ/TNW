 NOV_Interact_TakeOver_tt: "§gOnce our§! §WTakeover Progress§! §gin the region reaches§! §Y100%§!§g, we can diplomatically annex this target.§!\n\n§ROnly neighboring states can be influenced. Far Eastern warlords may be influenced after 1969, and all Russian warlords after 1971.§!\nBase: §Y[?NOV.NOV_Takeover_Power]§!\nOur §Yideological similarity§! with this nation grants us a §G[?NOV.NOV_Dummy_Id_Sim]§! bonus\nOur megacorps' §RPower§! and §GLoyalty§! grant us a §Y[?NOV.NOV_dummy_megacorp_boost]§! bonus\n\nThis nation's ideology means its megacorp bonus comes from [GetNovosibirskWhichMegaCorp]"
 NOV_Interact_1_tt: "§Y10-day cooldown§!\n\n[!NOV_Interact_1_click_enabled]\nThis will cost §Y30§! £political_power_texticon Political Power"
 NOV_Interact_2_tt: "§Y10-day cooldown§!\n\n[!NOV_Interact_2_click_enabled]\nThis will cost §Y25§! £command_power §RCommand Power§!"
 NOV_Interact_3_tt: "§Y10-day cooldown§!\n\n[!NOV_Interact_3_click_enabled]\n[!NOV_Interact_3_click]"
 NOV_Interact_3_click_enabled_tt: "§Y[ROOT.GetNameWithFlag]§! has unified §YWest Siberia§!."
 NOV_interact_1_flag: "§YPolitical pressure§! was already increased in the last §Y10§! days."
 NOV_interact_2_flag: "§YMilitary pressure§! was already increased in the last §Y10§! days."
 NOV_interact_3_flag: "§YEconomic pressure§! was already increased in the last §Y10§! days."
 NOV_Silovik_GUI_extra_button_1_tt: "Our primary goal is to §Gtake over§! neighboring states in §YWest Siberia§!, and then move on to §Rall of Russia§!. To this end, we must §Ypressure§! those warlords in various ways, §Yby selecting a region on the map GUI above§!.\n\nTo accelerate this process as much as possible, we should strive for §Yideological alignment§!: the closer we are to the warlord's ideology, the §Gfaster§! the takeover will be; conversely, it will be §Rslower§!. We can press §Rthe red button below this button§! to observe our current ideological stance.\n\nTo influence our current ideological stance, we §Ycan pursue certain national focuses§! or §Ygrant autonomy to certain megacorps§!; the stronger a megacorp, the more we lean toward their ideology. We can press §Rthe red button below this button§! and hover over £GFX_NOV_GUI_Political_Compass_circle to observe our current §Yideological drift§!.\n\nMegacorps help not only with ideology; the §Ystronger§! a megacorp, the easier it is to assimilate warlords whose ideology aligns with that megacorp. §RHowever, if a megacorp's §GLoyalty§! falls below §Y50§!, the assimilation bonus becomes a penalty.§!\nTo learn about the megacorps and their ideologies, click the i below the corporation's name."

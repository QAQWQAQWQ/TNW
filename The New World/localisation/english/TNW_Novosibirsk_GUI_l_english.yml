 NOV_Silovik_GUI_PC_circle_tt: "The §RPower§! of each §YMegacorp§! will greatly influence the political situation.\nA strong §YPhoenix§! will move us toward §PUnitarianism§!,\nA strong §YSibir§! will move us toward §GFederalism§!,\nA strong §YTitan§! will move us toward §YCorporatism§!,\nWhile a strong §YPeople§! will move us toward §xCollectivism§!.\n\n§PPhoenix§! drift: [?NOV_unit_drift]\n§GSibir§! drift: [?NOV_federal_drift]\n§YTitan§! drift: [?NOV_corp_drift]\n§xPeople§! drift: [?NOV_coll_drift]"

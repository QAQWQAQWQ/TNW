l_english:
 NOV_Silovik_State_GUI_Open_Button_tt: "Open the 'Silovik State' interface"
 NOV_megacorp_1_name: "Phoenix"
 NOV_megacorp_1_desc: "The Phoenix Group is one of the Federation's three economic pillars and has long-standing ties with Alexander Pokryshkin. As the Federation's primary arms dealer and manufacturer, Phoenix is both the legs that carry the Federation's great army and its powerful heart.\n\nThe group was established by the Silovik shortly after the Soviet collapse. With their close relationship with Pokryshkin and the invaluable services they provide the military, the Phoenix Group is a true ally of our nation."
 NOV_megacorp_2_name: "Sibir"
 NOV_megacorp_2_desc: "The Sibir Group was founded after the Soviet collapse by bourgeois landowners and has deep ties with the Mayor of Barnaul. They represent and control agricultural production across the Federation and throughout West Siberia. They not only produce agricultural goods but also farm machinery. And it may surprise you to learn that they also underpin many of the Federation's financial institutions. Sibir is without doubt the heart of the Federation's civilian industry.\n\nAs noted above, combined with the Sibir Group's close ties to civilian politicians within the Silovik-led government and its quiet support for Vasily Shukshin, it is unquestionably a critical part of the Federation's economy."
 NOV_megacorp_3_name: "Titan"
 NOV_megacorp_3_desc: "If Phoenix is the Federation's brawny muscle and Sibir its beating heart, then Titan is its wise brain. Their motto is as simple and precise as the group's mission: 'Progress.' And progress is precisely what Titan does best.\n\nTitan has long been the leader in mechanization and various technological advances, pushing the Federation's technological level ever forward; at one point they could even compete directly with the Modernists of Tomsk."
 NOV_megacorp_4_name: "The People"
 NOV_megacorp_4_desc: "The Federation is not merely composed of the great corporations and the resources they produce. The people - the citizens under our rule - are the backbone of the entire Federation and its economy. From the lowliest peasant to the highest government official, the people are, at least in name, the helmsmen of our nation.\n\nIt is essential that we understand how the people are faring, how loyal they are to our nation, how popular the government is, and how much influence they wield."
 NOV_megacorp_1_modifiers: "Army Organization: [?NOV_MC1_army_org_factor|%+]\nArmy Attack: [?NOV_MC1_army_attack_factor|%+]\nMonthly Army Professionalism Change: [?NOV_MC1_army_professionalism_monthly_rate|+]"

 VEN_Gustavo_Machado: "Gustavo Machado"
 VEN_black_gold_raw_gold: "Black Gold is True Gold"
 VEN_black_gold_raw_gold_desc: "If Italy's lifeblood is like wine and Russia's like vodka, then Venezuela's is like oil - purer and stronger. Since independence, Venezuela's economy has been built on the Orinoco River and the economic belt running through it. Heaven's bounty has made it shine in the FNO, earning respect from all nations. Venezuela may be in its golden age, but this prosperity has clearly lasted too long; soon Venezuela will witness its passing."
 VEN_game_of_the_three_kings: "Game of the Three Kings"
 VEN_game_of_the_three_kings_desc: "When a tyrant falls, the kingdom collapses, warlords emerge and fight each other, plunging the people into strife. Since Perez Jimenez fell and national hero Romulo Betancourt died, the three giants began their long power struggle: Raul Leoni's Democratic Action, Rafael Caldera's COPEI, and Jovito Villalba's Democratic Republican Union, fiercely competing for the nation's future.\n\nThough the election of People's Admiral and coup hero Wolfgang Larrazabal in 1958 temporarily eased tensions, as the next election approaches, factional strife - and never-distant hostility - will once again resurface."
 VEN_democracys_fraying_lifeline: "Democracy's Fraying Lifeline"
 VEN_democracys_fraying_lifeline_desc: "Marcos Perez Jimenez's fall ended 150 years of military intervention in Venezuelan politics, preserving the brief democratic experiment begun by Betancourt and Gallegos in 1945. But in the military, from high-ranking officers to cadets, the end of the military-political tradition deeply troubles those shaped by past military governments. Old and new ideologies are sprouting, in the name of Venezuela's only true king beyond democracy or dictatorship:\n\n§YBol§!§mi§!§Rvar§!."
 VEN_the_crimson_spectre: "The Crimson Spectre"
 VEN_the_crimson_spectre_desc: "In the green mountains, a low ballad echoes, half mourning the dead, half celebrating hope. In 1958, they were one step from proving themselves, but right-wing traitors and the Bald Eagle conspired to tear a free Venezuela from their hands.\n\nTime flies; under the call of a new generation of revolutionaries, the Revolutionary Left Movement and the rapidly growing National Liberation Armed Forces have taken up arms. From the tropical jungles of Zulia to the vast plains of Bolivar, the faint whispers have never faded, and as Venezuela enters its most turbulent decade, they may yet become a nationwide cry."
 VEN_el_esequibo_es_nuestro: "The Essequibo is Ours!"
 VEN_el_esequibo_es_nuestro_desc: "§Y'First seized by the British, then stolen by the Yankees.'§!\n\nThough Guyana and Venezuela have both joined the FNO and nationalist sentiment has cooled, the desire to recover lost land has never faded. Venezuela Mother's anger has been temporarily calmed, only so as not to harm her children across the border; once this delicate balance breaks, her wrath will reignite."
 VEN_Alfredo_Tarre_Murzi: "Alfredo Tarre Murzi"
 VEN_Alfredo_Tarre_Murzi_sec_desc: "§YMinister of Defense\nChristian Progressivism§!\n--------------\n§LWriters and politicians are often closely linked - the clash of ideas, the noise of the mind, fueled by caffeine and alcohol, becomes the suppressed joy of writing. For Alfredo Tarre Murzi, this combination made his career perfectly complementary.\n\nWhen writing, Tarre Murzi at his typewriter was a precise, unwavering critic; as a politician, he showed frugality, passion, and exceptional negotiation skills. These abilities made him a key figure in Jovito Villalba's cabinet; he saw clearly the trends of Venezuela's new decade, all in the aftermath of Perez Jimenez's dictatorship.\n\nTarre Murzi worked tirelessly to build a compromise Venezuela between military, police, and people. This was no easy task; the riots and military dissent of Larrazabal's first two years remain the nation's core challenge, but at least the former adversaries have laid down their arms in temporary reconciliation.\n\nAs for Tarre Murzi, he always played the mediator. While others swayed with the wind or bowed to both sides, he used the warmth of an aging statesman to remind Venezuela's factions that their loyalty was not to him, but to their country.§!"
 VEN_Miguel_Angel_Burelli: "Miguel Angel Burelli"
 VEN_Miguel_Angel_Burelli_for_desc: "§YMinister of Foreign Affairs\nLiberal Conservatism§!\n--------------\n§LIn smoke-filled rooms, sweating men flip through policy papers and reports, eager to win in the eternal horse race of politics - but Miguel Burelli Rivas is calm. Whether the schizophrenia of foreign policy or the anxiety of economic policy, the qualities that support politics from behind are his specialty.\n\nRivas has an Italian father, so learning languages was easy for him in his youth. Even after graduating from university in Madrid, he continues to learn new languages. He is a committed internationalist who has traveled widely. Later he came under Jovito Villalba's guidance and became his protege. During visits, his square jaw, signature smoky voice, and dogged determination earned him fame, and many saw him as a rising young star in the Republican Union. But Burelli himself is ambivalent.\n\nLooking ahead, Burelli trusts Villalba - Venezuela needs strong leadership first, politics second. After a decade of suffering, Burelli now seeks only the power to stabilize the nation, wherever it comes from.\n\nGood governance requires good people.§!"
 ojeda_eco_trait: "Protector of the Poor"
 VEN_Fabricio_Ojeda_eco_desc: "§YMinister of Economy\nRevolutionary Gaitanism§!\n--------------\n§LAmong the heroes of the 1958 Venezuelan revolution, one name is passed among the oppressed and confused Venezuelan people between clock towers and slums.\n\nFabricio Ojeda, a young politician of only seventeen, quickly became a pillar of the emerging Democratic Republican Union. Yet the hope of truly breaking free and achieving a republican society scattered like ashes in the wind - Venezuelan democracy ended on a cold January morning, just like its founder Romulo Betancourt.\n\nUnder Perez Jimenez, society was lifeless; his lofty ambitions oppressed the common people as if they were ants. Ojeda chose to stand with his compatriots and resist openly. Though Larrazabal led the revolution, without Ojeda's call and his standing in Venezuelan society, their coup would never have succeeded.\n\nIn the new postwar government, Ojeda earned Larrazabal's trust as Minister of Economy and showed exceptional talent. Within a few years, Perez Jimenez's iron rule was finally overthrown and the burden on the people lifted. Yet Ojeda harbored a deeper wish: that the mountain once pressing on the people would one day become a mountain of gold belonging to the poor - he would not only lead them to a bright future, but give them the courage to pursue it.§!"
 VEN_Jovito_Villalba_hog_desc: "§YMinister of Interior\nNational Liberalism§!\n--------------\n§LTo dismiss Jovito Villalba as an ordinary-looking man would be a grave mistake. Though he has polite manners, a calm gaze, and looks more like a civil servant or accountant than a revolutionary, without Villalba, Venezuela would have lost its vitality long ago. Amazon warriors defend their tribes with rifles and will; Villalba serves the nation with impassioned speeches and sleepless writing.\n\nFrom his youth as an idealistic student opposing Gomez, to later rising against Perez Jimenez, passion and integrity have always been Villalba's soul. Though he suffered greatly for it - imprisonment and exile - he was never broken. In 1952, he defeated the powerful Perez Jimenez in military elections and openly declared war on the dictator. In the years that followed, exiled Villalba became a symbol of resistance, igniting the revolution that erupted in 1958.\n\nLarrazabal saw a kindred spirit in Villalba and was even willing to set aside his position to campaign alongside this new ally. They then launched a populist movement aimed at restoring the people's livelihood; if Larrazabal maintained the movement's amiable public image, Villalba was its driving force.\n\nJovito Villalba has finally built the government he was denied in 1952, earning the people's trust and confidence in the future. He hopes to stir a new trend in politics, turning his vision for the Democratic Republican Union and the fatherland into reality. This is not just a hopeful party, but a symbol of national unity, gathering all of Venezuela's lost children and lighting their way forward.§!"

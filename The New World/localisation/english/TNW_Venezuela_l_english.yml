l_english:
 
 VEN_Puntofijo_Pact_desc: "Since the Jimenez government fell in a coup and was replaced by democracy, authorities have taken measures to ensure Venezuelan democracy better resists tyranny. The Puntofijo Pact embodies these plans - a written guarantee requiring signatories to respect election results, prevent one-party dominance, and jointly resist dictatorship.\n\nHowever, all good things must end, and the pact's end seems to have come swiftly. Cracks are showing in the once-unbreakable agreement, and no one can say whether it will be reborn or destroyed."
 VEN_Essequibo_Dispute: "The Essequibo is Ours!"
 VEN_Essequibo_Dispute_desc: "The Guyanese Essequibo region means to Venezuela what the Eastern Plains mean to Bolivia and the Malvinas to Argentina - among all such disputed territories in Latin America, it is always claimed by neighbors and a constant source of frustration for the region's people.\n\nAny Venezuelan politician elected above the level of environmental health officer (whose main job is catching rats) speaks passionately about this land; everyone wants to recover it, a desire that briefly unites socialists and hardline conservatives.\n\nClearly, unless rational means are used to manage or resolve the dispute, the Free Nations Organisation - which both Venezuela and Guyana belong to - faces the risk of splitting over this issue."
 VEN_King_of_Oil: "King of Oil"
 VEN_King_of_Oil_desc: "Indeed, Venezuela is the undisputed King of Oil, our natural advantages on full display. The national economy shines; since previous governments successfully nationalized the entire industry, we control every drop of crude oil - yes, every drop belongs to us.\n\nThrough mastery of this bottomless oil reserve, Venezuela wields diplomatic influence on the world stage far beyond its geopolitical size. We can make friends or enemies as we please without the hesitation of Colombia - all thanks to the flowing black gold."

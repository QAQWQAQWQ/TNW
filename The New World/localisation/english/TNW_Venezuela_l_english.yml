 VEN_Wolfgang_Larrazabal: "Wolfgang Larrazabal"
 POLITICS_VEN_WOLFGANG_LARRAZABAL: "For a naval officer, long voyages have a unique beauty - the wind on the face, the chill of the tide, and above all, loyalty to crew and ship. Even when the Miraflores Palace took the sailor from the coast, this duty did not fade - it accompanied him like the murmur of the tide, waking and sleeping, guiding him through storms. Now, the ship Wolfgang Larrazabal commands is far larger than when he was an admiral, and the crew number more than he once imagined, yet the captain's duty remains unchanged.\n\nFrom sea to land, the 1958 coup propelled Wolfgang Larrazabal to unprecedented heights. In its aftermath, he and his colleagues carved a new Venezuela from the ruins of the Perez Jimenez government. Larrazabal's unwavering commitment to democratic principles, his charming smile and elegant demeanor are deeply embedded in the hearts of the Venezuelan people. But he will not stop there. With extraordinary charisma, he won the 1958 election, enabling him to rebuild from ruins a Venezuela that can withstand the tides of the times - a nation of hope.\n\nFrom the ship's wheel in the Caribbean to the nation's steering wheel, Wolfgang Larrazabal carefully steers this rising country. Though tragedy follows tragedy, Larrazabal's dream remains unchanged. Venezuela's years of suffering will end, replaced by a modern Venezuela founded by Betancourt years ago - a nation thriving under his prudent guidance and steady gaze."

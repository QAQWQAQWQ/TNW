 SAFWAR.37.t:0 "Chemical Weapons Used In South Africa!"
 SAFWAR.37.d:0 "The news first consumed the Pentagon, then the White House, and by morning it was the talk of the nation. A thousand variations of the same headline all conveying the same horror; chemical warfare has erupted in Africa. In an emergency meeting of the Joint Chiefs of Staff the President was briefed on the full scale of the attack. Launched from bases in Ostafrika, low flying bombers dispersed nerve agent across OFN positions in Africa now identified as primarily Sarin gas, along with VX nerve agent.\n\nOur death toll currently stands at 283 US Soldiers killed and a further 639 being treated for exposure. Several high ranking officers are among the dead, with our OFN and South African allies having taken casualties of their own. Whilst many are hopeful this was a rogue one off attack, military intelligence and the CIA have advised the President that further deployments of chemical weapons are both likely and imminent.\n\nIn response, two proposals have been developed. Rather than triggering our massive retaliation doctrines, we could instead deploy chemical protection gear for our soldiers and press on. Whilst expensive, it would hopefully halt any further escalations of the war. The second proposal, supported by the Pentagon, is to utilize the widespread horror of the nation to push Congress into authorizing a formal declaration of war against Ostafrika, and for the OFN to enter the South African War directly with the full might of the US Army."
 SAFWAR.37.a:0 "Whilst the nation calls for blood, we must show reason and restraint."
 SAFWAR.37.b:0 "Today our nation goes to war once again, may God go with us."
 SAFWAR.38.t:0 "Reichskommissar Müller Flees!"
 SAFWAR.38.d:0 "Breaking news has arrived today from Léopoldville. Siegfried Müller, the longtime Reichskommissar of Zentralafrika, has fled his colonial domain. This development comes mere hours after the murder of Müller's delegation at an Ostafrikan state dinner, in which all attendees were slaughtered by Hüttig and his SS.\n\nMüller's lack of attendance had spared his life, and Hüttig's blind fury was a blessing to the Reichskommissar, who soon inevitably caught wind of the massacre in Bouhlerstadt. The Reichskommissar, fearful that SS agents were likely en-route to finish their task of high profile slaughter, wasted no time in returning to Léopoldville from his hunt. Without so much as a stop to gather belongings, Müller boarded an aircraft destined for Germany, suddenly eager to leave the Afrikan continent behind.\n\nAs Müller soars back to Germany, and Reichskommissar Schenck lays dead upon the floor of a dining hall in Bouhlerstadt, Hans Hüttig's conquest of the Afrikan Reichskommissariate appears to be inevitable. Those inside the borders of Zentralafrika and Angola look to the future with despair as the SS banner parades through their streets."
 SAFWAR.38.a:0 "Heil Hüttig!"
 SAFWAR.38.b:0 "Perhaps it is time to leave Afrika."
 SAFWAR.39.t:0 "Reichskommissar Schenck Murdered!"
 SAFWAR.39.d:0 "Appalling news has today arrived in Südwestafrika. Reichskommissar Wolfgang Schenck, hero of the Second World War and longtime Reichskommissar over Germany's oldest Afrikan colony, is dead.\n\nPersuaded into visiting Bouhlerstadt, Ostafrika for a state dinner, Schenck discovered far too late that the intent of the invitation was malicious. The delegation sent by Müller in his stead, as well as Schenck and several of his officers, were murdered where they sat by Hüttig's SS cronies. None of those in attendance had a chance to flee for their lives.\n\nAs Reichskommissar Schenck now lays dead in a dining hall in Bouhlerstadt, his throat slit like a common farm animal, and Müller flees the Afrikan continent in fear for his life, Hüttig's SS already move to assume direct control over the now leaderless Zentralafrika and Südwestafrika. With Schenck gone, Südwestafrika stands in little position to resist as the SS banner begins to fly through our streets."
 SAFWAR.39.a:0 "Heil Hüttig!"
 SAFWAR.39.b:0 "Perhaps it is time to leave Afrika."

 ITA_The_Sly_Fox_and_the_Wolf_Pack:0 "The Sly Fox and the Wolf Pack"
 ITA_The_Sly_Fox_and_the_Wolf_Pack_desc:0 "Beneath the court, among the marketplaces, in the year of our Lord 2002, the 81st year of the Fascist era. The warships of the Italian Empire still cleave the waves of the Mediterranean. When the winds occasionally die down, the world may remember the leader who ruled the Empire for more than two decades.\n\nHis death came neither too soon nor too late. Years of illness had already eroded his body, and the idol collapsed so suddenly. Sly foxes prowled at home, wolves circled within the National Alliance, countless eyes had fixed upon him. Now, the watched man was dead, and the political forces he had suppressed in life rushed out like floodgates opened, from the Youth to the Party, from the Italian mainland to the overseas territories; political infighting swept the entire Empire like a plague. Decrees changed by the day, cabinets turned like a lantern show, royalists and orthodox fascists grappled endlessly. The Empire welcomed an economic boom amid this chaos, then plummeted after a brief prosperity. The royalists gradually gained the upper hand, the fascist revolution came to an abrupt halt, and the corporatist national transformation ran aground. The era of Mussolini was over, and the era of the National Alliance was over as well.\n\nWill Italians miss that period? Not necessarily."

 ITA_Iconoclasm:0 "Iconoclasm"
 ITA_Iconoclasm_desc:0 "In 754 AD, Constantine V summoned a council in Constantinople and formally declared: the veneration of icons is idolatry, contrary to Scripture and the teachings of the Fathers.\n\nIn life, Mussolini deliberately fashioned himself into the Duce, into a fatherly figure. He became the icon of the Italian state, fantasizing that he would be remembered forever like Caesar. Until the icon collapsed. After his death, his political legacy was thoroughly liquidated. The cult of personality painstakingly built over years came crashing down, his policies denounced as the root of national corruption. Countless newspapers and writers swarmed to deconstruct and defame him; the truth no longer mattered. He had become part of Italian culture.\n\nThe movement to smash icons could no longer be stopped by any individual. It spread into a societal wave of collective deconstruction of the previous fascist era, yet it also shook the Emperor's rule and social order. Only at this moment had it not yet revealed its true power."

 ITA_Sarcophagus:0 "Sarcophagus"
 ITA_Sarcophagus_desc:0 "No one can be held responsible, or rather, no one is willing to admit it.\n\nThe economic stagnation and social chaos of the Italian Empire from the fifties to the eighties was like a murder without a killer. Every participant's hands were clean, every faction's conscience was clear. Royalists blamed the fascist radical legacy, fascists denounced royalist betrayal and appeasement, the Youth cursed the older generation's decay, the older generation sighed at the youth's frivolity. Everyone was looking for a sinner.\n\nThe sarcophagus of Constantine V was dragged from the cathedral, burned, and cast into the sea. Those opposed to iconoclasm said it was this Emperor who brought about the Empire's destruction; those who supported iconoclasm insisted that precisely the end of the iconoclast movement caused the Empire's collapse. They stared at one another, same race, same skin, same blood, yet could not stop the hostility in each other's eyes.\n\nSo they joined hands and killed Italy. They placed her in a sarcophagus and buried her with themselves. Let this land, with its glory and its shame, sink into long slumber, until the world collapses and the kingdom of heaven descends."

 ITA_Scourging_the_Rooster_the_Lamb_and_the_Ghost:0 "The Scourging, the Rooster, the Lamb, and the Ghost"
 ITA_Scourging_the_Rooster_the_Lamb_and_the_Ghost_desc:0 "The youth once looked upon the partisans and felt it had nothing to do with him. He had reported, despised, and hostile them, until the crisis truly swept him away, and then he understood.\n\nSo he killed himself. He turned himself into a ghost. He did not know how hideous his face now was, how ragged his clothes, he did not even know whether he was still alive. He truly seemed to have become a ghost.\n\n'The Lord scourges the world, that the world may become human. The Lamb of God comes to take away the sins of the world. The cock crows, the betrayal of the Lord by mankind. And now he has become a ghost.\n\nIt is night.'"

 ITA_Arson_in_the_Mist:0 "Arson in the Mist"
 ITA_Arson_in_the_Mist_desc:0 "'Nero fastened the guilt and inflicted the most exquisite tortures on a class hated for their abominations, called Christians by the populace... All were covered: some were sewn in wild beasts' skins and torn to pieces by dogs, some were crucified, some were smeared with combustible matter and set alight when darkness fell to serve as torches. Nero opened his gardens for the spectacle.' - Tacitus, Annals 15.44\n\nA great fire is spreading through Italian society. The arsonist's face is hidden in the mist; perhaps it is the Emperor, perhaps the fascists, perhaps the royalists, perhaps the partisans. Who cares? Rome is but a high pile of dead wood; whoever wishes to set it ablaze may come.\n\nHe is now being sewn into animal skins and torn apart by wild dogs. He is now being nailed to a cross. A hatred without cause, a fire of clear love and hate, and the weeping of Romans.\n\nNero is not dead. He will return from Parthia."
 

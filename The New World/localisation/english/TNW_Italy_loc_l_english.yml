 ITA_Vincenzo_Trentino:0 "Vincenzo Trentino"
 POLITICS_VINCENZO_TRENTION_DESC:0 "For in one day shall her plagues come, death, and mourning, and famine; and she shall be utterly burned with fire: for strong is the Lord God who judgeth her.\nAnd ye shall hear of wars and commotions, but when ye shall see Jerusalem compassed with armies, then know that the desolation thereof is nigh... For these be the days of vengeance, that all things which are written may be fulfilled.\nSee ye not all these things? verily I say unto you, There shall not be left here one stone upon another, that shall not be thrown down.\n\nAnd a mighty angel took up a stone like a great millstone, and cast it into the sea, saying, Thus with violence shall that great city Babylon be thrown down, and shall be found no more at all. Salvation, and glory, and honour, and power, unto the Lord our God: For true and righteous are his judgments: for he hath judged the great whore, which did corrupt the earth with her fornication, and hath avenged the blood of his servants at her hand."
 ITA_Pino_Rauti:0 "Pino Rauti"
 ITA_Silvio_Berlusconi:0 "Silvio Berlusconi"
 ITA_Salvo_Lima:0 "Salvo Lima"
 ITA_Luca_Romagnoli:0 "Luca Romagnoli"
 ITA_Pino_Rauti_hog_desc:0 "§YDeputy Prime Minister\nGraveism§!\n--------------\n\nFor that day shall not come, except there come a falling away first, and that man of sin be revealed, the son of perdition; Who opposeth and exalteth himself above all that is called God... so that he as God sitteth in the temple of God, shewing himself that he is God.\n\nAnd then shall that Wicked be revealed, whom the Lord shall consume with the spirit of his mouth, and shall destroy with the brightness of his coming: Even him, whose coming is after the working of Satan with all power and signs and lying wonders, And with all deceivableness of unrighteousness in them that perish... For there shall arise false Christs, and false prophets, and shall shew great signs and wonders; insomuch that, if it were possible, they shall deceive the very elect.\n\nAnd then shall that Wicked be revealed."
 
 ITA_Silvio_Berlusconi_for_desc:0 "§YForeign Minister\nChristian Democracy§!\n--------------\n\nAnd the merchants of the earth shall weep and mourn over her; for no man buyeth their merchandise any more: The merchandise of gold, and silver, and precious stones, and of pearls, and fine linen, and purple, and silk, and scarlet, and all thyine wood, and all manner vessels of ivory...\n\nThe merchants of these things, which were made rich by her, shall stand afar off for the fear of her torment, weeping and wailing. And in her was found the blood of prophets, and of saints, and of all that were slain upon the earth. Thy riches and thy merchandise are the things wherein thou hast delighted: the ships of the sea and the mariners of the sea came nigh unto thee, and in the time of thy reckoning. Tyre hath built herself a strong hold, and heaped up silver as the dust, and fine gold as the mire of the streets.\n\nHear this, I pray you, ye that swallow up the needy, even to make the poor of the land to fail, Saying, When will the new moon be gone, that we may sell corn? and the sabbath, that we may set forth wheat? Making the ephah small, and the shekel great, and falsifying the balances by deceit? That we may buy the poor for silver, and the needy for a pair of shoes; yea, and sell the refuse of the wheat?\n\nA false balance is abomination to the LORD: but a just weight is his delight."
 

 ITA_Salvo_Lima_eco_desc:0 "§YFinance Minister\nChristian Progressivism§!\n--------------\n\nYe adulterers and adulteresses, know ye not that the friendship of the world is enmity with God? whosoever therefore will be a friend of the world is the enemy of God. Be ye not unequally yoked together with unbelievers: for what fellowship hath righteousness with unrighteousness? and what communion hath light with darkness? What agreement hath the temple of God with idols? for ye are the temple of the living God; as God hath said, I will dwell in them, and walk in them; and I will be their God, and they shall be my people. No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other. Ye cannot serve God and mammon.\n\nWhen the enemy shall come in like a flood, the Spirit of the LORD shall lift up a standard against him. A double minded man is unstable in all his ways. Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded. How long shall it be ere ye are perfect in heart?\n\n 
 ITA_Luca_Romagnoli_sec_desc:0 "§YInterior Minister\nRight-Wing Populism§!\n--------------\n\nFor ye were as sheep going astray; but are now returned unto the Shepherd and Bishop of your souls.\n\nBrethren, if any of you do err from the truth, and one convert him; Let him know, that he which converteth the sinner from the error of his way shall save a soul from death, and shall hide a multitude of sins. What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it? And when he hath found it, he layeth it on his shoulders, rejoicing. And when he cometh home, he calleth together his friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost. I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance.\n\nAll we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all."


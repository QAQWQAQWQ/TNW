 ITA_Albertine_Statute_of_1848_law:0 "£GFX_ITA_law_icon_one §L1848§! Statuto Albertino "
 ITA_Albertine_Statute_of_1848_law_desc:0 "Revolutions swept across Europe; Sicily, Naples, Milan, and Venice all fell into turmoil. If the Kingdom of Sardinia did not take the initiative to establish a constitution, it risked being swallowed by the revolutionary tide. §mCarlo Alberto struck first, promulgating the Statute on March 4, transforming absolute monarchy into constitutional monarchy§!, thereby seizing the position of §A'Leader of Italian Nationalism'§! and drawing a line with Austria's absolute monarchy.\n\nThe Statute established the §fKing§! as §hHead of State§!, §,Commander of the Armed Forces§!, and §Qfount of Justice§!, with the throne hereditary in the male line of the House of Savoy. Unlike Britain's 'King in Parliament' after the Glorious Revolution, the Albertine Statute was in truth 'King above the Statute' - Carlo Alberto's calculation was plain to see.\n\nThe Statute declared: §*'All citizens, regardless of rank, are equal before the law.'§! Property, personal freedom, and freedom of the press were guaranteed; the press law of §LMarch 1848§! only prohibited material offending public order and the normal functioning of government, far looser than the previous dual ecclesiastical and secular censorship. §UCatholicism§! remained the sole state religion, but other faiths were tolerated. Between §LMarch and June 1848§!, Jews were granted equal civil status with Catholics."

 ITA_Head_of_Government_Powers_and_Prerogatives_Act_Fascist_Year_III_law:0 "§&Fascist Era§! §LYear III§! £GFX_ITA_law_icon_two Law on the Powers and Prerogatives of the Head of Government§X [Repealed]§!"
 ITA_Head_of_Government_Powers_and_Prerogatives_Act_Fascist_Year_III_law_desc:0 "The §f'King above the Statute'§! order established by the §L1848§! Statute was, by the time of his great-grandson §aVittorio Emanuele III§!, completely dismantled by the §&Mussolini§! regime.\n\nThe §HHead of Government§! was no longer responsible to §mParliament§!, but only to the §fKing§!; yet the §fKing§! was by then largely controlled by §&Mussolini§!, so the so-called 'responsibility to the King' was in truth 'responsibility only to himself'. §oCabinet formation was at the Head's sole discretion, and neither chamber could introduce a bill without the Head's assent;§! the Head could also, 'when he deemed it necessary', directly issue decrees with the force of law without consulting other offices.\n\nThis was the work of the §LDecember 24, 1925§! §.'Christmas Eve Law'§! - Mussolini's title was changed from §j'Minister-President'§! to §H'Head of Government'§!, cabinet responsibility and parliamentary oversight were stripped away, and the 'King-Parliament' balance since the Statute became nominal. The §A'Leader of Italy'§! position the §aHouse of Savoy§! had seized via the §LStatute§! eighty years earlier had, after §Leighty years§!, instead enabled another §&Duce§! to hollow out the dynasty itself."

 ITA_Political_Parties_Dissolution_Decree_Fascist_Year_IV_law:0  "§&Fascist Era§! §LYear IV§! £GFX_ITA_law_icon_four Decree on the Dissolution of Political Parties§X [Repealed]§!"
 ITA_Political_Parties_Dissolution_Decree_Fascist_Year_IV_law_desc:0 "On §LOctober 31, 1926§!, the §&Fascist government§! first promulgated the §UEmergency Decree for the Defense of the State§!, dissolving all §Santi-fascist parties and groups§!, banning §mopposition newspapers§!, establishing a §rSpecial Tribunal for political crimes whose judgments were not appealable, and exiling suspects without trial§!. Between §November 5 and 26§!, a series of additional emergency decrees landed, dissolving all parties except the §&Fascist Party§!; §Santi-fascist deputies§! were §,stripped of their seats, arrested, and exiled in one stroke§!. §XGramsci§!, despite his parliamentary immunity, was seized in his §fRome§! residence on §LNovember 8§!, aged §dthirty-five§!; on §Lthe 24th§! he was shipped to Ustica, north of Sicily, like a small stone cast into the sea, sinking forever in silence.\n\nThe Law on the Government's Power to Issue Decrees was retroactive to the §LDecember 24, 1925§! §.'Christmas Eve Law'§! and the §LJanuary 31, 1926 supplementary chain§!, allowing the government to legislate on its own; parliamentary oversight was reduced to zero, and §&legislative power was vested entirely in Mussolini§!.\n\nBy now, the Albertine Statute's §m'two chambers, multiple parties, elections'§! system had been physically erased. The Statute's text still hung on the wall, but in the phrase §f'King above the Statute'§!, even the word §f'King'§! had become hollow; inside the wall was §&Mussolini§!, outside an empty shell. The paper Statute by which the §aHouse of Savoy§! had protected itself in 1848 and seized the §A'Leader of Italy'§! title had, after eighty years and three changes of hand, become §Ea frame of decoration§!."

 ITA_Grand_Council_of_Fascism_Competences_Act_Fascist_Year_VI_law:0 "§&Fascist Era§! §LYear VI§! £GFX_ITA_law_icon_four Law on the Competences of the Grand Council of Fascism§X [Repealed]§!"
 ITA_Grand_Council_of_Fascism_Competences_Act_Fascist_Year_VI_law_desc:0 "On §LDecember 9, 1928§!, §&Mussolini§! pushed through §,the Law on the Grand Council of Fascism§!, formally embedding the previously party-internal §,Grand Council§! into the §mstate constitutional framework§!. From then on, the §,Grand Council§! not only had the right to nominate to the §fKing§! the §HHead of Government§! and §hministers§! (a right originally the King's constitutional prerogative under Article 5 of the Albertine Statute), but also deeply intervened in legislation, administration, and succession:\n\nThe §,Grand Council§! participated in the legislative process, proposed the single candidate list for national elections, §jand could issue decrees covering political, economic, and social domains. The most fatal provision was its right to participate in determining the heir to the throne§! - this struck at the very foundation of Articles 1-5 of the Albertine Statute, 'male hereditary succession of the House of Savoy'. §fRoyal succession§! had been a dynastic family matter and constitutional iron law; now a party-internal body could weigh in, effectively announcing that the §Zexistence or abolition§! of the §aHouse of Savoy§! also depended on §&fascist§! whim.\n\nThis was the true §&'constitutionalization of the party-state'§!. The §L1925-26§! §.'Christmas Eve Law'§! and §E'emergency decrees'§! could still be argued as 'special laws for a state of emergency'; this §L1928§! law sewed the §&Fascist Party's organizational machine§! directly into the §mKingdom's constitution§!. The original Albertine triangle of '§fKing§! - §mParliament§! - §nMinisters§!' had been replaced by a new triangle: '§&Duce§! - §,Grand Council§! - §fKing§! (hollowed out)'. The Statute remained, its text unchanged, but the center of power had long since moved out of the palace. The §aHouse of Savoy§!, which had used the §L1848§! Statute to protect itself and then reach the §Awork of Italian unification§!, had by now been reduced to a decorative seal of the fascist regime."

 ITA_Racial_Laws_Fascist_Year_XVI_law:0 "§&Fascist Era§! §LYear XVI§! £GFX_ITA_law_icon_four Racial Laws§X [Repealed]§!"
 ITA_Racial_Laws_Fascist_Year_XVI_law_desc:0 "In §LJuly 1938§!, §&fascist scientists§! jointly published the Manifesto of Race; of its ten points, the first established the reality of human races and Aryan civilization, §Othe seventh explicitly declared that Italians should call themselves racialists§!, the eighth divided Mediterraneans, Europeans, Orientals, and Africans, the ninth went straight to the point - §UJews were not of Italian race§! - and the tenth: '§nThe pure European physique and spirit of Italians must not be altered by other peoples§!.'\n\nOnce these words were out, on §LNovember 11§! the front page of the Corriere della Sera previewed the racial protection law passed by the Council of Ministers; on §LNovember 17§!, §fRoyal Decree No. 1728 landed§! - §UJews§! were §obanned from public office and higher education, and books by Jewish authors were banned; supplementary decrees followed, stripping property, restricting movement, and culminating in internal exile alongside political prisoners§!.\n\nIn the §LRisorgimento§! era, what §dJewish scholars§! of Manzoni's and Luzzatto's circles had hoped from §nItaly§! was that the §*new nation§! would break the old order with civic equality; §Leighty years later§!, under the same §adynasty§! and the same Statute, Jews had become aliens driven into exile camps. The §A'Leader of Italy'§! title the §aHouse of Savoy§! had seized in 1848 was by now not only used by fascism but personally endorsed the racial laws - §jthe dynasty's moral bankruptcy§! was more thorough than even the §L1926§! emergency decrees."

 ITA_European_Confederation_Treaty_Fascist_Year_XXIV_law:0 "§&Fascist Era§! §LYear XXIV§! £GFX_ITA_law_icon_three European Confederation Treaty"
 ITA_European_Confederation_Treaty_Fascist_Year_XXIV_law_desc:0 "The §rAnti-Comintern allies§! gathered in §jVienna§! to discuss and initial the treaty. Its text is in two volumes: §Qthe Treaty on Economic and Monetary Union§! and §rthe Treaty on Political Union§!, together called §Qthe European Confederation Treaty§!. §oNationals of all allies are §dCitizens of the Union§!, with the right to move freely throughout the Confederation, settle where they wish, and §fvote§! in municipal elections where they reside. Capital flows freely, markets are integrated, and regulations converge§!.\n\n\n§n'Italy...§! wishes to treat §.other nations as equals§!, and §<as an international organization for peace and justice§!, it considers this its bounden duty.'"

 ITA_Trade_Union_Act_Amendment_1966_law:0 "§L1966§! £GFX_FRS_1969_Grenell_Agreement Trade Union Act Amendment"
 ITA_Trade_Union_Act_Amendment_1966_law_desc:0 "In §nItaly§! §Lthe early 1950s§!, the §meconomic miracle was at its height§!, and northern factory workers moved frequently, with arbitrary dismissals.\n\n§hThe just cause system was established: every individual dismissal must be based on one of two categories§!: namely, 'cause' and 'reason' (i.e. §Xfor serious worker misconduct, the employer may not dismiss at will§!). Dismissal without just cause allowed the worker to §iseek reinstatement or compensation, covering both fixed-term and open-ended contracts§!, §Eexcept that small enterprises (under 15 employees) were exempt - this small-shop exemption has been litigated ever since§!, and is the most tangled part of §nItalian labor law§!."

 SFG_national_socialism_party_long: "Oberkommando Südafrika (Oberkommando Südafrika)"
 SFG_huttig_division: "Hüttig's Forces"
 SFG_huttig_division_desc: "The Oberkommando Südafrika has assembled the most experienced and cold-blooded soldiers of the Second South African Civil War. These veterans of the South African War and countless subsequent counterinsurgency operations are intimately familiar with the combat patterns and terrain unique to this war. Now, with new orders in hand, the veterans of the Oberkommando Südafrika are prepared to crush the South African resistance once and for all."
 SFG_restoring_order_in_sudafrika: "Restoring Order in Südafrika"
 SFG_restoring_order_in_sudafrika_desc: "Hüttig's orders to the Oberkommando Südafrika are simple: tame South Africa by any means necessary. The iron heel of the Oberkommando is constrained by no moral shackles, nor do they bother with any superficial courtesies. This army has only three missions: destroy, conquer, suppress — nothing more."

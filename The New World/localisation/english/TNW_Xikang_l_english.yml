 POLITICS_LIU_WENHUI_DESC:0 "Liu Wenhui was born in 1895, a military man through and through. Graduating from the Baoding Military Academy in 1916, Liu returned to Sichuan and first joined Liu Cunhou's Sichuan clique, before switching to the Kuomintang in 1926. He rose quickly through the ranks of the National Revolutionary Army, soon becoming commander of the 24th Army, and in 1929 was appointed Chairman of the Sichuan Provincial Government. In the Sichuan of the time, where five warlord factions fiercely competed, forging alliances, instigating defections, manufacturing frictions, and plotting assassinations formed the main themes of his rule. But in 1934, this iron-fisted figure was defeated by his nephew Liu Xiang and driven out of Sichuan, later becoming Chairman of Xikang Province. Liu Wenhui's relationship with Chiang Kai-shek was just as turbulent as his rule over Sichuan itself. Based far in the southwest frontier, Liu repeatedly defied the central government, refusing to obey the Chairman's transfer orders.

During the war against Japan, Liu Wenhui prudently preserved his strength, strictly forbidding his forces from participating in large-scale battles. When the Japanese army invaded Sichuan under Operation No. 5, the most powerful remaining lord of the Sichuan chaos immediately gathered his forces and retreated deep into the Xichang mountains to set up a fortified camp. Faced with the Japanese surrender demand, Liu sternly refused, and the Japanese, viewing the barren mountain province as not worth the effort, did not pursue.

Now, more than a decade has passed since the Japanese attacked Sichuan. Liu Wenhui, isolated on the frontier, may be the only truly independent warlord left in China. His home province of Sichuan, though nominally under central control, has actually fallen back into chaos, with numerous factions and armed separatist forces vying for power. Though Liu himself is determined to restore a free China, he faces collective resistance from his subordinates, who bluntly say that fighting Japan would be suicide. If he wants to raise the banner and march eastward, it may take a miracle from heaven to make it happen..."

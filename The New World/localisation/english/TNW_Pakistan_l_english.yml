 PAK_between_the_worlds: "Between the Worlds"
 PAK_between_the_worlds_desc: "Since the end of British rule over the Indian subcontinent, the North-West Frontier Province has been roiled by disputes over its affiliation. Some fervently desire the unification of Pashtunistan, others remain loyal to the idea of Pakistan, and yet another sizable bloc continues to advocate a pro-India position.\n\nBrother has turned against brother. The various tribes that rule this land are deeply divided over where it should go. Even schools and pubs are torn by this division: intellectuals cannot agree, student groups fight endlessly. Fear, discontent, and anxiety hang over all of society. Although Nawabzada and his government hold a clear pro-Afghan position, the Pakistan Movement upon which he relies holds the opposite view."
 PAK_the_sandcastle: "The Sandcastle"
 PAK_the_sandcastle_desc: "The security situation in the North-West Frontier Province is like a sandcastle on the brink of collapse, besieged on all sides by mischievous children. As popular discontent boils over, panic spreads, famine ravages, and the people live in fear, the government is both incapable and unwilling to act. Most emblematic of this are the inter-tribal violent clashes that erupt one after another - the NWFP authorities accept these almost daily bloodletting incidents with equanimity.\n\nWorse still, the NWFP authorities are forced to rely on the ideologically hostile National Guard of the Muslim League. Aside from Peshawar and a few loyal princely states in the far north, the government's writ does not extend beyond a few dozen miles; its administration operates through vassal tribes or the nearly openly rebellious Muslim League National Guard, which seems poised at any moment to sweep away Nawabzada's political sandcastle."
 PAK_pashtun_rule_british_policies: "Pashtun Rule, British Law"
 PAK_pashtun_rule_british_policies_desc: "Although on paper the NWFP has achieved full autonomous status, nothing meaningful has changed since the end of British colonial rule. Just as in the days of the Raj, the province still relies on a network of maliks and other local notables to administer rural areas, and ruthlessly eliminates any force it perceives as a threat.\n\nOne of the most prominent victims of the Nawabzada regime's brutal stability policies is the Khudai Khidmatgars, a nonviolent resistance movement tracing its origins to the days of British India. In a joint crackdown by NWFP government forces and the Muslim League National Guard, thousands have been killed, and the organization is on the brink of destruction."
 PAK_carrying_all_before_them: "Carrying All Before Them"
 PAK_carrying_all_before_them_desc: "Stoke the furnace of war white-hot, and let the Pakistan Movement blossom! The Pakistan Movement has finally overthrown Nawabzada's pitiful little kingdom, and now imposes its order with bayonets and gunpowder. They will refine and reshape this land in the furnace's fires, forging it into a sharp weapon to pierce the infidels, communist bandits, and polytheists across the Indus.\n\nAfghan rule has ended, at least for now. Under the guidance of Abdul Qayyum Khan and his allies, the NWFP finally sees a glimmer of light. But how many souls will be reduced to slag and ash in the war furnace before their vision becomes reality?"
 PAK_one_flag_a_thousand_nations: "One Flag, A Thousand Nations"
 PAK_one_flag_a_thousand_nations_desc: "Even in a world where social, ethnic, and religious stratification is commonplace, Pakistan stands out as one of the most socially stratified.\n\nIn Pakistan, countless laws and informal policies aimed at politically and economically disenfranchising non-Muslims trample upon any nominal religious freedom. Punjabis stand atop the wobbly ethnic pyramid, treating the other peoples who make up the nation with discrimination and other means to maintain their tenuous dominance over national affairs, while each nationality suffers from internal divisions. Officially, the caste system is condemned as a remnant of \"Hindu heresy\" and legally \"does not exist,\" but in reality it still exerts powerful influence, permeating most political and social affairs."
 PAK_the_parliamentary_dictatorship: "The Parliamentary Dictatorship"
 PAK_the_parliamentary_dictatorship_desc: "The rentier landowning classes of the Islamic Republic of Pakistan have \"creatively\" emulated the rotten borough system of pre-Reform Act Britain, manipulating parliament and coercing tenant farmers to vote as they demand political change. Pakistan is theoretically a democracy and retains a semblance of electoral politics in practice - but only the various factions of the landed gentry enjoy the right to compete fairly.\n\nMost popular parties are banned as soon as they attempt to contest elections. The National Assembly is therefore constitutionally incapable of representing the popular will. The Prime Minister is accountable to parliament but not to the people - a system that makes Pakistan a thoroughgoing parliamentary dictatorship, the most fitting contemporary example of oligarchy."
 PAK_an_administrative_chimera: "An Administrative Chimera"
 PAK_an_administrative_chimera_desc: "The nascent Pakistani state is built upon contradictory, fragmented legal principles. There is no current constitution; all laws carry over from British India. Pakistan is nominally still a British dominion - a move intended to claim independence in 1945 rather than 1965. At the same time, the country daily proclaims its adherence to Islamic principles and sharia.\n\nIn reality, neither the common law tradition nor the teachings of Allah and his Prophet hold any weight in the actual operation of the Pakistani state. Real power rests with the Martial Law Administrator and his allies. In this land, no hadith or legal precedent holds sway as utterly as naked violence."
 PAK_the_scrap_of_paper: "The Scrap of Paper"
 PAK_the_scrap_of_paper_desc: "The constitution of the Islamic Republic of Pakistan makes many promises. It guarantees freedom of speech, multi-party democracy, and equality of all nationalities, vowing to build an Islamic state guided by the Quran and Sunnah. Yet in the eyes of its founding fathers, the nation's founding fathers, the constitution is worth no more than the paper it is printed on.\n\nTo understand the true governing law of this nascent Islamic republic, the paper-thin Pakistani constitution is entirely useless. The real charter is faithfully practiced by Abdul Qayyum Khan and piously carried forward by his successors. The answer is not found in desk documents, but by looking out the window at the land - at the countless visible and hidden tombs along the route from Peshawar to Karachi."
 PAK_the_fires_must_burn: "The Fires Must Burn"
 PAK_the_fires_must_burn_desc: "In the financial center of Frankfurt, glossy brochures touting the great achievements of the \"Pakistan Model\" are ubiquitous. Pakistan is entering an industrial age that can rival any competitor. European capital pours into Karachi and Lahore like sharks drawn to blood, seeking a share of this abattoir-frenzied market.\n\nThe real abattoir exists in the factory floors that constitute the flesh and blood of this prosperity. Industrial safety regulations are glossy on paper and nonexistent in practice. Child labor is devouring the futures of urban and rural poor children, bound by chains of perpetual debt and turned into fuel for the industrial furnaces under the lash of cold-hearted overseers. For Pakistan's upper classes, only one tenet remains unshakable: development must never slow down - no matter the cost in human lives."
 PAK_networks_upon_networks: "Networks Upon Networks"
 PAK_networks_upon_networks_desc: "In Pakistan, the influence of the Muslim League National Guard is truly omnipresent. Every corner of government is almost entirely dominated by the \"patronage and reciprocity\" network they built during Pakistan's independence process.\n\nThe government cannot perform most of its functions without the National Guard's intervention. The judiciary is seriously dysfunctional, consistently handing down hasty and unjust verdicts. Even tax revenues are pocketed entirely by them, as if deliberately emulating the old adage: \"If they must send a tax collector, they must also hire a thug.\"\n\nTo prevent the National Guard from further interfering in non-military matters, the authorities must take strict measures promptly, or they will lose control of most institutions - and then it is anyone's guess what the military will do."
 PAK_an_army_of_patronage: "An Army of Patronage"
 PAK_an_army_of_patronage_desc: "The Islamic Republic of Pakistan maintains two armed forces: a small, well-trained, well-equipped Pakistani Army; and a large, patronage-run Pakistani militia, an offshoot of the Muslim League National Guard, organized independently at the local level.\n\nMilitia units generally take their orders from local notables. Appointments are crude and corruption is staggering: lower positions are filled by nepotism, and offices are bought and sold openly. The militia's effectiveness as a military force is debatable, but as a tool for co-opting support it works every time."
 PAK_power_vacuum: "Power Vacuum"
 PAK_power_vacuum_desc: "When the government ceases to exist, a power vacuum follows - just as it has in Pakistan following the German withdrawal.\n\nWithout clear leadership, the remnants of the Muslim League National Guard have become leaderless, and desertions are rampant. The army that should be guarding the border is now busy restoring order in the streets. Peasant uprisings sweep the country, and the remaining government is helpless. The most fatal blow comes from the police: they have declared complete neutrality, hoping the Indian National Army will treat them leniently when they cross the border."
 POLITICS_NAWABZADA_SHAHABUDDIN_KHAN_DESC: "Khan of Jandol, Nawab of Dir, Nawabzada Shahabuddin Khan, second son of Nawab Shah Jahan Khan, is a ruthless and dutiful man.\n\nGiven that his second job was being appointed by Afghanistan as military governor of the frontier provinces, this assessment is quite fitting - a position created by the Kingdom of Afghanistan to suppress remaining Pakistani forces on the border. His duty was to ensure that Pakistani forces remained at most as remnants in this borderland, and did not intrude into Afghan territory. As a loyal subordinate of the Afghans, he performed this duty gladly.\n\nOnce, when Shahabuddin Khan was not tasked with suppressing Pakistanis, he ruled over two small princely states in northwestern Pakistan - two territories that rightfully belonged to Pakistan. At the time, many praised his efforts to modernize his states, including personally funding schools, hospitals, fortifications, and roads within his jurisdiction. But many also criticized the ruthlessness he displayed in all his dealings.\n\nNow, his autocratic rule over the frontier provinces has improved many people's lives while ruining others. Countless tribes see him as an enemy because he constantly expropriates tribal lands for development, and aside from the Jandol and Dir regions he once governed, the people of the frontier provinces do not hold him in particularly high regard - many are dissatisfied with his autocratic and ruthless rule, leading to pro-Pakistani, even pro-India, sentiments locally.\n\nFaced with such matters, Nawabzada will simply do as he always has: maintain his authority, suppress dissent, until the situation blows over. Since this approach worked before, what could possibly go wrong by using it again?"
 POLITICS_ABDUL_QAYYUM_KHAN_DESC: "Abdul Qayyum Khan is a man of blood. That is the briefest assessment of him.\n\nHe once supported the Khudai Khidmatgar movement allied with the Indian National Congress, but in the late 1940s he switched to the All-India Muslim League, proving his loyalty to the new cause by massacring supporters of his former party. In 1959 he was elected leader of the All-India Muslim League, and today he is the most powerful Pashtun in the party.\n\nWherever the Muslim League National Guard - a paramilitary force loyal only to him personally - holds sway, his power is strongly felt. But this has also damaged his reputation among the landowning classes, who resent that the National Guard answers only to him. The other two branches of the Pakistan Movement - the Jammu and Kashmir Regiment and the Frontier Force - also have grievances against him, considering the National Guard undisciplined thugs and a liability to the Pakistan Movement.\n\nBut for now, Abdul Qayyum Khan sits firmly in power. The entire All-India Muslim League, from top to bottom, understands that to realize the dream of Pakistan from Kashmir to Baluchistan, a leader like him is needed."
 POLITICS_FEROZ_KHAN_NOON_DESC: "It is quite ironic that Feroz Khan Noon, who did not want to see Pakistan's independence, was selected to lead the nascent Pakistan out of its infancy. A brief examination of his thoughts reveals where his true loyalty has lain all these years - from beginning to end, Feroz Khan Noon was loyal only to Britain. He spent the happiest years of his life in Britain and supported British rule until the last moment of British India's existence.\n\nTime passed, and by 1965, more and more Punjabi towns were raising the star and crescent. Noon smelled which way the wind was blowing and realized this shift would benefit him. He promptly contacted his old friends in the All-India Muslim League.\n\nWhen Pakistan Movement soldiers prepared to plant their flag in Noonpur, the village where Feroz Khan Noon resided, they found the star and crescent already flying overhead. After the war, Feroz Khan Noon eagerly recruited former League members into the Pakistan Muslim League; this mobilization proved quite successful. During the Constituent Assembly, he used this as capital to oust Qayyum Khan and enter the halls of power.\n\nUndoubtedly, Feroz Khan Noon will do his utmost to govern Pakistan, ensuring the nascent Islamic republic serves the only legitimate purpose he can imagine: protecting and serving the elite class from which he comes."
 POLITICS_MUMTAZ_DAULTANA_DESC: "Long ago, Mumtaz Daultana gave his full support to the vision of an independent Pakistan. As early as 1942, he defied the colonial authorities' ban and joined the All-India Muslim League. Afterward, he maintained contacts with his former comrades and used his personal connections to build an extensive network, to the point that by 1965 he was the covert commander of the Muslim League National Guard in the Multan region.\n\nIn Mumtaz Daultana's view, he deserved the post of Prime Minister after the war. However, before he could persuade his Unionist Party colleagues to support him, he found that his family rival and political opponent, Feroz Khan Noon, had secured the support of the Punjabi aristocracy.\n\nBut all things come to an end. Feroz Khan Noon fell from power, the aristocrats shifted to Mumtaz Daultana, and even the ulama all supported him. If he can withstand the ulama's fierce attacks on Pakistan's religious minorities, they might even elevate him higher than Prime Minister."
 POLITICS_MAHMUD_AHMED_DESC: "Mahmud Ahmed was not born a terrorist, but a Muslim born in Ludhiana in the early days of the Indian Republic. His childhood was entirely unremarkable, no different from any typical Indian Muslim child. Then again, no one is born a villain - or, as Ahmed's astonishingly large base of supporters would have it, a hero.\n\nBy what path Ahmed learned terrorist tactics and various national liberation ideologies remains unresolved. Some say he was inspired by the Indian National Army's methods during the Independence War, but by his own account he witnessed signs of God in his childhood, and God commanded him to wage jihad against the Hindus. He did not wish to serve the Hindus, so he deserted military service and hid in the unguarded border mountains. There he vanished into the vast ranges, continuing to receive signs from the one true God.\n\nYears have passed since he vanished, and now Ahmed has come to liberate his people. He fights alongside countless followers, revered by all as \"Azad\" - \"the free one\" in Urdu. At any cost, he will drive the Hindus from this pure land and build a new Islamic nation on its ruins. After centuries of oppression, the Muslims of all India will finally break the chains binding them in the name of faith, unity, and discipline. For the glory of Allah, Ahmed and the mujahideen will fight the Indian kuffar to the bitter end, like the great warriors of old who stood against the Christian crusaders."
 POLITICS_INTERNAL_COMMOTION_OF_THE_STATE_DESC: "Whereas the government of the Islamic Republic of Pakistan has become incapable of meeting the needs of its people;\n\nWhereas its dysfunction has plunged the entire republic into internal disorder, with military forces stretched thin, militia units deserting, and rural uprisings erupting one after another;\n\nWhereas the German government's attempt to exploit the Pakistani people for its own profit ended in failure, and it evacuated only those useful to it, leaving the rest in dire straits;\n\nWhereas the Machiavellian maneuvering of both governments has left the former Pakistani territory effectively in a state of anarchy, a situation that cannot be tolerated or allowed to continue;\n\nWe, the citizens, police, and soldiers who care for the welfare of this region, on behalf of the North-West Frontier Province, West Punjab, Sindh, Baluchistan, Azad Kashmir, and other territories occupied by the vanished government, assure the President of Free India of our full support for the Free Indian Army in restoring order within these lands - and hereby respectfully request that the executive and legislative bodies of the Free Indian Republic immediately assume governance of the former Islamic Republic of Pakistan.\n\nSigned: Rawalpindi Emergency Convention"
 POLITICS_ZULFIKAR_ALI_BHUTTO_DESC: "In 1928, when the sun rose over the town of Larkana in Sindh, illuminating the newborn Zulfikar Ali Bhutto, the entire family sensed that this child was destined for great things.\n\nHis father, Sir Shah Nawaz Bhutto, was one of the most powerful landowners in Sindh and later became the province's Chief Minister. From the beginning, his father fully supported him in realizing his political ambitions. At first, the founding of the Islamic Republic of Pakistan seemed a setback, as his father had served as head of the Sindh Ittehad Party. However, fear and worry soon gave way to realpolitik: Pakistan's birth allowed Zulfikar Ali Bhutto to fully deploy his intellect and abilities, and the country could offer him far more power than India ever could.\n\nThe problem is that when the moment arrived, he also had to confront a chaotic situation. Today, Zulfikar Ali Bhutto leads a highly unstable regionalist coalition, born of Sindhi resentment against Punjabi high-handedness and Pashtun anger at the atrocities and betrayals committed by the government during the state of emergency.\n\nZulfikar Ali Bhutto's family always knew he was destined for greatness, but they did not know how long that glory would last. If Bhutto cannot stabilize the governing coalition around him, his term as Prime Minister may be far shorter than he imagines."
 POLITICS_JAHANARA_SHAHNAWAZ_DESC: "Jahanara Shahnawaz is the only surviving conservative in the Muslim League of the latter half of the 20th century.\n\nActive in the All-India Muslim League since the 1910s, she campaigned for the creation of Pakistan - until she was stripped of all party posts in the 1940s for refusing to boycott British colonial institutions.\n\nAfter defecting to the Unionist Party, she smoothly inherited her family's provincial assembly seat after the war, forming a close alliance with Feroz Khan Noon. Although some mocked her political trajectory as that of a duckling following its mother, when Noon returned to his old party, Shahnawaz was the first to follow. She subsequently served as Minister of Justice in Noon's cabinet.\n\nWhen Noon's death in 1972 triggered a leadership crisis in the Muslim League and factions deadlocked, the late Prime Minister's widow, Viqar-un-Nisa Noon, cast the decisive vote for Shahnawaz, propelling her to the pinnacle of power."
 PAK_Germany.1.t: "Operation Menander Summary"
 PAK_Germany.1.desc: "TOP SECRET\nEYES ONLY\nFor all members of [getGermanIntelAgencyCaps]\nOperation Menander\n\nPeshawar - North-West Frontier Province\n\nThe Pakistan Movement is based on the logic that, due to the history of Hindu oppression of Muslims, the two religious communities cannot coexist peacefully in one state. It advocates the creation of Pakistan, the \"Land of the Pure,\" to ensure the safety of Muslims on the Indian subcontinent. Members of the Pakistan Movement tend to admire European-style governance, including our own, viewing it as superior and more martial than the Hindu \"infidels\" to the east.\n\nRecently, the Chief Martial Law Administrator of Pakistan, Abdul Qayyum Khan, contacted us with the consent of the Pakistan Movement. He is a rather cold-blooded individual who shares some of our views, but more importantly, like other members of the movement, he recognizes the reliability and superiority of our country as a potential partner and ally of Pakistan. For background on Qayyum Khan and other data on the Pakistan Movement provided by V.N., see Appendix B for further study. End of report.\n\nMay Germany be faithfully guarded."
 PAK_Germany.1.a: "So we have our people on the South Asian subcontinent, do we?"
 PAK_Germany.2.t: "One Step Closer"
 PAK_Germany.2.desc: "\"So, Mr. Qayyum Khan, I hear you've made rapid progress in Baluchistan, is that right?\" The German Foreign Minister nodded to his guest, who sat in the seat usually reserved for the Iranian ambassador.\n\nAbdul Qayyum Khan smiled. \"We have, Mr. Foreign Minister. We didn't even smell a whiff of gunpowder - we came, we saw, we conquered. Just as your late Fuehrer so skillfully accomplished the Anschluss thirty years ago, may he rest in peace. When I read about it in the newspapers back then, it left quite an impression on me.\"\n\nAt the mention of Hitler, the Foreign Minister tilted his head slightly, offering a warm smile. \"Yes, I can see the parallel. But more importantly...\" At this, Qayyum Khan perked up, \"...I see a broad road ahead, one where the Pakistan Movement will no longer have to struggle for supplies and armaments. Mr. Qayyum Khan, we have successfully opened a line of contact directly with you.\"\n\n\"You mean -\"\n\n\"Yes, exactly what you're thinking. The first shipment of weapons is already on its way. Germany never shortchanges its loyal allies.\"\n\nQayyum Khan bowed deeply in his seat."
 PAK_Germany.2.a: "\"Mr. Minister, your generosity will be repaid, I assure you.\""
 PAK_Germany.3.t: "Operation Menander Summary"
 PAK_Germany.3.desc: "TOP SECRET\nEYES ONLY\nFor all members of [getGermanIntelAgencyCaps]\nOperation Menander\n\nPeshawar - North-West Frontier Province\n\nOver the past 72 hours, [getGermanIntelAgency] operatives have noted a large-scale Pakistani offensive against Indian positions in Punjab and Sindh; Pakistani sources have confirmed this. Although many Indian positions were overrun or broken in the first hours, they have since received reinforcements, and heavy fighting continues on both sides.\n\nChief Martial Law Administrator Abdul Qayyum Khan claims to us that without continued support from our country, he has no absolute confidence in victory. Per our previous commitments to the Pakistan Movement, we must provide ample supplies to the Pakistani forces in their war against the Indian government. End of report.\n\nMay Germany be faithfully guarded."
 PAK_Germany.3.a: "We must seize this opportunity!"
 PAK_Germany.4.t: "From the Middle to the East"
 PAK_Germany.4.desc: "Ali gazed out from the cruise ship's deck. Voluntarily helping oppressed Muslim brethren does indeed bring unexpected rewards - though he wasn't sure this was quite what they'd promised when they recruited volunteers at the jamaat khana. Still, the halal food served on this German cruise ship was excellent, and the crew's courtesy beyond reproach.\n\nThe loudspeaker crackled to life: \"Ladies and gentlemen, we will arrive in Gwadar in a few hours. Please gather your belongings and prepare to disembark. Please be careful, watch for the swell.\"\n\nAli grabbed his gear and went below, heading for the nearest Pakistani flag. He gave his name and nationality, received a military salute and the greeting \"Thank you for making the long journey to support Pakistan,\" and then entered basic training.\n\nBasic training was brutal. The Pakistani instructor, a veteran of the Muslim League National Guard, was harsh and merciless, with only the five daily prayers offering brief respite. Fortunately, the training camp gathered comrades from all Islamic nations: Sunnis, fellow Shia brothers, and even a few Germans in charge of ordnance and auxiliary training.\n\nAbout two weeks later, Ali found himself on the front line. He loaded his rifle, whispered the shahada to steady his nerves before moving out with his squad, and plunged into the fight."
 PAK_Germany.4.a: "The show begins."
 PAK_Germany.5.t: "From the Indus to the Rhine"
 PAK_Germany.5.desc: "Click. Channel changed. The TV camera panned slowly toward the German Foreign Minister, whose name had just been mentioned.\n\nThe shot changed again - the Danish representative, another foreign dignitary. Another foreign envoy, and then -\n\n\"- and today, the Foreign Minister of the Islamic Republic of Pakistan attends the Permanent Council for the first time. Ladies and gentlemen, with the Minister's arrival, the process of the Islamic Republic of Pakistan's accession to the Compact of Solidarity and the European Economic Community is now formally complete.\"\n\nThe Pakistani envoy rose to a round of applause from all delegates, then read out a prepared address in German. He lavishly praised Germany's achievements in maintaining European cultural diversity and regional stability, and pledged Pakistan's unwavering support to its Compact and EEC allies.\n\nThe entire chamber rose in applause. Meanwhile, the man watching on television nodded in appreciation and quietly left the room."
 PAK_Germany.5.a: "Birds of a feather."
 PAK_Germany.6.t: "Double, Double"
 PAK_Germany.6.desc: "\"In that case, Mr. Minister. My government wishes to explore the possibility of Pakistan's further integration into the European Economic Community, particularly deep integration with the German economic sphere.\"\n\nThe Pakistani Foreign Minister looked at the German Finance Minister, who nodded slowly: \"Indeed. In fact, we have already identified several commodities beneficial to the German economy.\"\n\nThe Pakistani Foreign Minister flipped through his files: \"We can certainly supply these materials. We have also identified several German goods and services beneficial to Pakistan's development. In the long term, we expect Pakistan to rival German prosperity, and at the very least leave India far behind.\"\n\nThe Finance Minister rested his knuckles against his chin, considering, then decided to shift the topic slightly: \"Mr. Minister, we will certainly do our best. But for now, I hear your country is renowned for its carpet craftsmanship. The Fuehrer's birthday is approaching, and I've been struggling to choose a suitable gift. Perhaps you could...\"\n\nThe Pakistani diplomat broke into a wide smile: \"It would be my pleasure, Mr. Minister.\""
 PAK_Germany.6.a: "\"We have many samples.\""
 PAK_Germany.7.t: "Hard Labor"
 PAK_Germany.7.desc: "Children labor away at the looms, their stories varying in detail but sharing the same tragedy - parents who sold their own children, either because they could not feed them or because they craved money.\n\nOnce upon a time they could look out and see the world beyond. But in this cage, there are only a few stingy shafts of light, the roar of the looms, the overseer's barking curses, and endless toil. The few children who manage to get hold of books cannot read them at all. If they were literate, perhaps they would understand they have become debt slaves - but the time that should have been spent learning has long since been bowed away at the loom into eternal ignorance.\n\nFinally, when blood has stained the yarn red, the latest carpet is finished. The overseer roughly yanks it away to the factory manager's office, where the manager surveys the work with satisfaction. It may not be the factory's finest product, but what do the Germans know of quality?\n\nWhen the manager sells the carpet to the middleman, he immediately extinguishes the fleeting thought of reducing the debt - even if he showed mercy, the debt would never be repaid. Besides, he needs every penny to build his new mansion and buy more looms to keep the children bowed. He turns, and a fresh round of curses rains down on another group of trembling small figures.\n\nThe carpet is laid out in the Fuehrer's office, humbly prostrated in the place of honor beneath Hitler's portrait. The Fuehrer gazes upon it with admiration. Beauty is all that matters; as for where it came from? No one cares - and even if they knew, it would still be a sacrifice irrelevant to him."
 PAK_Germany.7.a: "Meanwhile, the factory keeps running."
 PAK_German_technical_assistance: "German Technical Assistance"
 PAK_German_training: "German Training"
 PAK_Germany.8.t: "Smoke and Mirrors"
 PAK_Germany.8.desc: "Thick smoke fills the velvet-lined luxury governor's suite at the Galle Face Hotel in Colombo, even dimming the light from the chandeliers and shrouding the tight faces of the German and Japanese diplomats in shifting shadows. On the right side of the large round table sit three senior German diplomats, wearing deep blue-black uniforms with silver piping and peaked caps. Opposite them are the stoic Japanese, flipping through documents like merchants, whispering to each other in low voices.\n\nBaron Otto von Steinbach lazily puffed on a cigarette, surveying the terms proposed by the wooden figures opposite. One of the afflictions of modern diplomacy is this tedious insistence on satisfying populations who could not care less about these matters if not agitated by ambitious men. The Co-Prosperity Sphere's opening remarks focused on \"bilateral recognition of the status quo,\" \"arms reduction and controlled competition,\" and \"reciprocal personnel exchanges for cooperation.\" Had their German translator had too much sake?\n\nAt no point was there any mention of recognition of Pakistan, no border limits, no declaration of recognition, no diplomatic relations. And this suited the esteemed Baron just fine - his task at the moment was not to negotiate in earnest, but to buy time. Clearly, the Co-Prosperity Sphere was doing the same. An aide behind him quietly slipped a note: \"Drag it out two more days.\" He ground out his cigarette in the ornate ashtray and cleared his throat."
 PAK_Germany.8.a: "\"Gentlemen, I believe the priority now is how to supply the on-site observers...\""
 PAK_Germany.9.t: "Herding Cats"
 PAK_Germany.9.desc: "Colonel Lützow's brow dripped with sweat, the desk fan churning the humid air to no avail. Being posted to Punjab was like being dropped into a boiling steamer, but decades of Prussian discipline meant he did not loosen his tie despite the discomfort. A knock on the door announced the arrival of a Pakistani local unit commander - come to report on a deployment in two weeks' time.\n\n\"So, Corporal Khan? How goes the training on the new rifles? The men should prefer the NF-LAG over the old Lee-Enfields, yes? Have the desert rations been distributed?\"\n\n\"Herr Colonel, I respectfully report that the relevant funds have vanished, the local commander is nowhere to be found, and the new rifles have not arrived. Furthermore, the ration stockpile has shrunk considerably, with some portions claimed by peasants disguised as soldiers, hence our unit has been reduced in number.\"\n\nA vein pulsed at Colonel Lützow's temple. It took an iron will not to explode on the spot; he merely whitened his knuckles where he leaned on the desk.\n\n\"Corporal, what percentage of the new recruits attended the last instructional meeting?\"\n\n\"Herr Colonel, I respectfully report we retain 32% of our original strength.\"\n\n\"You -\"\n\n\"Terribly sorry to interrupt, Herr Colonel. There is another report - this morning during anti-tank training, an unfortunate accident occurred, and a round fell to the ground and discharged.\"\n\n\"...and the result?\"\n\n\"Herr Colonel, of our current 32% strength, 18% require hospitalization.\""
 PAK_Germany.9.a: "\"This must be a joke. It has to be a joke.\""
 PAK_Germany.10.t: "Return to Darkness"
 PAK_Germany.10.desc: "The iron leviathan of the German Navy cleaves through the boiling waves of the Arabian Sea, its massive hull carving a crisp white wake through the swells. The pitch-black superstructure contrasts sharply with the deep cobalt of the ocean - a paint job that brazenly flouts tactical doctrine, a deliberate provocation. The aircraft carrier Adolf Hitler leads the V-formation, the giant swastika on its flight deck pointed toward the depths. On its right flank sail the cruiser Friedrich Barbarossa and the destroyers Emden, Wotan, and Erich Koellner; on its left, the cruiser Admiral Hipper and the destroyers Panzerfaust, Uebermut, and Erich Giese. Beneath the waves, six U-boats lurk silently, their armament enough to devastate the entire subcontinent. This navy, which sank with the broken empire, now returns to the open sea.\n\nAmid the wailing air-raid sirens and shouts of the people in Karachi harbor, a deep unease pervades. The dockworkers, who have watched a hundred ships enter and a thousand leave, have long heard the whispers: the Germans are not allies but new masters; the movement that liberated them from the tyranny of Delhi hides new chains within; and rumors from the eastern border say that when Japan can endure no more, Karachi will be the first patch of scorched earth under the Rising Sun.\n\nDeep beneath Wünsdorf, in the pure-white war room of the Oberkommando der Wehrmacht, Navy Commander-in-Chief Erich Topp's face is grave. Staff officers use long pointers to push miniature ship models across the wall-sized map of the Arabian Sea. Across the Indian subcontinent peninsula, the red markers indicating the Imperial Japanese Navy in the Bay of Bengal sit nearly motionless - the submarine flotilla last spotted near Sri Lanka has not moved in hours."
 PAK_Germany.10.a: "Bring it on. We won our place in the sun, and we'll keep it too."
 PAK_Germany.11.t: "Don't Blink"
 PAK_Germany.11.desc: "\"Baron von Steinbach, if your side lacks sincerity, negotiations will naturally prove difficult. According to reliable intelligence, at least ten nuclear submarines are transiting the Suez Canal into the Arabian Sea - photographic evidence will be made public within days.\"\n\nThe Baron's eyes narrowed slightly. Where this Oriental had learned German was beside the point; he clearly had no grasp of aristocratic courtesy. Decades of diplomatic experience kept his reply measured:\n\n\"I assure you, any movements into the Arabian Sea are strictly in accordance with the guidelines the Fuehrer signed a week ago. If you possess evidence to the contrary, please produce it immediately. I would, however, remind our friends in Tokyo that thus far you have rejected every proposal we have put forward - who exactly is obstructing the peace process?\"\n\nThey were no longer in the comfortable governor's office. The grand Jubilee Hall had been opened to accommodate delegates on all sides, the long table flanked by Co-Prosperity Sphere envoys and Compact dignitaries, with a few international observers seated in the southern corner. The Americans were not present, but sharp-eyed observers would notice several \"Latin American\" observers with conspicuous tans listening intently. Had the Japanese accusations not hit home - the Wehrmacht and Navy deployments were indeed running nearly two weeks late - the Baron would almost have laughed aloud. After all, the French and British would hesitate and flinch, but these old allies were samurai who preferred death to surrender."
 PAK_Germany.11.a: "The temperature rises, and the devil plays his unholy tune."
 PAK_Germany.12.t: "Buying the Way In"
 PAK_Germany.12.desc: "\"Thank you all for taking the time to meet.\" Major General Sayyid Abid Hussein laced his fingers on the conference table. \"I trust the brother nations of the Compact of Solidarity will lend a helping hand in our hour of need.\" The three men opposite had names, but he preferred to think of them by his private nicknames: the \"Arms Dealer,\" leaning back in his chair and peering down through sunglasses; the \"Merchant,\" whose smile showed teeth but no crinkles at the eyes; and the \"Minister,\" whose face was a mask of ice.\n\n\"My pleasure, my friend.\" The Arms Dealer sniffed. \"How's this gun?\" Lying in the hard case before Hussein was a brand-new Carl Gustaf m/45 submachine gun, \"fresh from the factory.\" The Major General took one out; the precision forging was far superior to the militia's gear.\n\n\"Now we talk payment.\" The Merchant opened his folder. \"These guns can be on a five-year lease, with your government paying annually -\"\n\n\"That won't be necessary.\" Hussein spoke before he thought. Three pairs of eyes turned to him, but he did not flinch: \"I will be the main lessee. Send the bills directly to me.\" He knew full well this was a fortune, but as a major landowner he had the means. The government could not afford the militia; paying out of his own pocket burdened him, but it also presented an opportunity to earn political capital - he would not pass it up.\n\nThe Minister frowned at this irregular arrangement, but sighed and nodded to the Arms Dealer under the Major General's steely gaze. The latter clapped his hands: \"Excellent! I'll send my people over to finalize the details. Pleasure doing business, Major General.\""
 PAK_Germany.12.a: "Hussein could only hope the weapons would arrive on schedule."
 PAK_Germany.13.t: "The EEC's Eastern Frontier"
 PAK_Germany.13.desc: "The banquet hall blazed with light: crystal chandeliers, glassware, polished and waxed floors, gilded wall trim. To the European ambassadors attending the latest EEC conference, it was the garish display of a small country punching above its weight. But some quietly noted that the venue had been thrown together in a matter of days, with some furnishings so new you could still find faint fingerprints on the surface - that such quality could be achieved under such rushed conditions was itself impressive.\n\nIt was only when a poised white woman took the stage that the European guests paid attention. She introduced herself as Jennifer Musa, an Irish-Pakistani citizen, come to demonstrate that South Asia and the West were far more closely related than anyone thought. The gold embroidery on her emerald anarkali caught the chandelier light, and her voice, once a nurse's, flowed clearly:\n\n\"My experience of moving between two worlds has taught me that Europa and Pakistan share the same blood. We are both committed to defending strong, pure, supreme national virtues. Even when traditional values are trampled by heretical invaders, we guard the flame of civilization with iron will. The details may differ, but we share loyalty to family, nation, and God. I ask you all to recognize this kinship and entrust your confidence to the Compact's newest member. One day, you will all see as I do that this trust will be richly rewarded.\"\n\nMost of the German delegates looked dismissive, but some in the audience were moved. A French businessman, a representative from Renault who had previously admired local commercial acumen, was visibly affected. The moment Musa left the stage, he hurried to the nearest phone booth and called his local partner."
 PAK_Germany.13.a: "\"René? It's me. There's a money-making project here - you interested?\""
 PAK_Germany.14.t: "Farewell"
 PAK_Germany.14.desc: "Anyone of even minor importance in the Pakistani government has been herded onto German planes in Lahore. The Germans issued tickets and visas to everyone who might be useful, ordering them to bring their belongings and board.\n\nThe highest-ranking officer left behind is Commander-in-Chief General Akbar Khan, who will continue to direct operations. Civilian and military vehicles surge toward the airport; the army and militia try to maintain order but to no avail. People scramble to board the planes, others are pushed off, families are separated - the longer the evacuation is delayed, the more uncontrollable the chaos becomes.\n\nAkbar Khan cursed the chaos a hundred times over, watching a VIP transport take off and thanking Allah for small mercies. At least the Prime Minister and cabinet were safely evacuated.\n\nAboard the plane, the Prime Minister covered his face in despair.\n\n\"Damn it all! How did it come to this,\" Feroz Khan Noon muttered, bitterness welling up. \"This broken ship is no different from the Titanic - it was going to sink sooner or later. When these separatists came to Noonpur, I should have run to India, I never should have joined them.\" Noon cursed his life choices as Pakistan receded beyond the cabin window."
 PAK_Germany.14.a: "Gone, never to return."
 PAK_Germany.15.t: "A Land in Ruins"
 PAK_Germany.15.desc: "Whereas the government of the Islamic Republic of Pakistan has become incapable of meeting the needs of its people;\n\nWhereas its dysfunction has plunged the entire republic into internal disorder, with military forces stretched thin, militia units deserting, and rural uprisings erupting one after another;\n\nWhereas the German government's attempt to exploit the Pakistani people for its own profit ended in failure, and it evacuated only those useful to it, leaving the rest in dire straits;\n\nWhereas the Machiavellian maneuvering of both governments has left the former Pakistani territory effectively in a state of anarchy, a situation that cannot be tolerated or allowed to continue;\n\nWe, the citizens, police, and soldiers who care for the welfare of this region, on behalf of the North-West Frontier Province, West Punjab, Sindh, Baluchistan, Azad Kashmir, and other territories occupied by the vanished government, assure the President of Free India of our full support for the Free Indian Army in restoring order within these lands - and hereby respectfully request that the executive and legislative bodies of the Free Indian Republic immediately assume governance of the former Islamic Republic of Pakistan."
 PAK_Germany.15.a: "Signed: Lahore Emergency Convention"
 PAK_Germany.16.t: "A Dying Army"
 PAK_Germany.16.desc: "A colonel slammed his desk. The war with Free India had never gone well, and now the NWFP was bearing the brunt of it - nowhere was this clearer than at a militia camp in the province.\n\n\"Where the hell are those units? Where in God's name have they gone?\"\n\nThe colonel's secretary set down the phone irritably, letting the receiver fall on the desk. \"I've called every single unit, even those nowhere near the Indians. No answer anywhere - it's as if they've vanished into thin air.\"\n\n\"Keep looking, damn it.\" The colonel roared. As the secretary began calling again, angry shouting rose from outside. A lieutenant burst in, face pale, stammering: \"There's an armed mob outside! They... they're demanding we release the militia families!\"\n\nThe colonel waved him away. \"Don't they know we're looking for them? We'll hand them over once we find them.\"\n\n\"We can't hand them over,\" the secretary said. \"Most of them are probably dead, we -\""
 PAK_Germany.16.a: "The camp was overrun shortly thereafter."
 PAK_Germany.17.t: "Watching the Havel"
 PAK_Germany.17.desc: "The planes that abandoned Akbar Khan disgorged wave after wave of exiles, who put down roots across Germany.\n\nSome tried to integrate into the new world, putting their displacement behind them. Another group clung to the dream of rebuilding the Islamic republic, forming restoration societies that denounced Free India as an illegitimate Hindu occupation of Pakistan, vowing to drive out these Japanese puppets with a righteous army.\n\nBut it all came to nothing. They could not even rouse support among the local population. The few Germans who still deigned to listen to the Pakistani exiles' rants could not resist poking holes in the narrative: there was a reason the German army had tucked tail and fled the Indus valley, that Pakistan had been ejected from the Compact. Wherever they went, the Germans who cared enough to engage were caught between \"puncturing the myth\" and \"letting them drown.\"\n\nOne year, two years, three years passed. No word of the uprising. No word from Akbar Khan. No movement from the Pakistani militias. The National Guard uprising was even more of a pipe dream. The few who could get news from the Indus valley heard that no one there talked about Pakistan anymore. At the exiles' gatherings, despair hung like a cloud, though they still mechanically repeated the mantra that \"free Pakistan will come.\"\n\nAmid the stalemate, a certain realization began to dawn. But no one would admit that it was Germany that had pushed Pakistan into the void. So they continued to curse the Indian invaders and the Japanese infidels, like men who poke at cold embers and wonder why no fire catches."
 PAK_Germany.17.a: "No acceleration, no force."

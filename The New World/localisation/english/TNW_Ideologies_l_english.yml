 communist_subtype_desc: "Communism is, without exaggeration, an ideology of extreme polarisation. As many people see it as the broad path to human self-liberation, as many others see it as the evil road to human self-destruction. Along with National Socialism, it is one of the most decisive ideologies since the twentieth century. But what exactly is communism?

Communism originates from the ideas of Marx and Engels, claims to inherit the revolutionary legacy of Lenin, and its ultimate goal is to build a humane society without classes or states, based on public ownership of the means of production and free distribution according to individual needs. Its followers firmly believe in the concept of class struggle, aiming to overthrow bourgeois rule and establish the dictatorship of the proletariat—a society in which the working class and the state are one and the same.

Although some communist movements firmly believe in the ballot box, most communist schools advocate violent revolution and tirelessly promote achieving their revolution through "practice"—or "direct action," as they call it. In this respect, they consciously imitate Lenin and deny any room for reform or improvement. Of course, criticism comes from all sides: from claims of human selfishness to socialist attacks on the means of proletarian dictatorship, communism never lacks opposition. Yet the "red bandits" of every stripe continue fighting, because they know that once the workers of the world unite, they have nothing to lose but their chains."
 socialist_subtype_desc: "Socialism is all-encompassing, and different people understand it differently. Whether revolutionary or reformist, Marxist or utopian, its various schools differ greatly from one another. Yet one thing remains constant: it is created by the people and serves the people.

Undoubtedly, one of socialism's main features is public ownership of the means of production. Whether achieved through steady transformation or through revolution in one leap, it is one of its set goals—socialism's supporters believe this path leads to a fairer and more just economic system that serves the many rather than the few; in addition, implementing democracy in the workplace is also an important part of socialism, giving workers a voice in business operations; moreover, political democracy, whether through public elections or representative elections, is also highly valued.

Though times have changed and its reputation has been mixed, socialism has never stopped advancing. Fearless of hardship and obstruction, socialism always takes as its mission the liberation of workers and the masses from capitalist tyranny, marching forward with head held high."
 progressivism_subtype_desc: "As a moderate way to counter unbridled capitalism, the moderate wing of social democracy and the centre-left progressives created progressivism, seeking a middle ground between social liberalism and social democracy, with emphasis on maintaining economic efficiency, building a regulated welfare state, and paying great attention to social justice issues. Progressivism is practical and willing to compromise; it accepts gradual reform and focuses on making capitalism more humane, taking its essence and discarding its dross.

Progressivism holds that room should be left for the free market, while also maintaining a welfare system as a social safety net. Rather than economic equality, progressivism focuses more on solving systemic problems that undermine equality of opportunity. It believes protecting the vulnerable is the government's duty, so racial discrimination, gender discrimination and other forms of discrimination are its main enemies.

Economically, progressivism holds that government intervention is inefficient. Instead, a privately-run market under public supervision benefits both government and market. This principle can be extended to infrastructure, health insurance, and even the basic operation of government. As long as economic efficiency is ensured, the saved welfare spending and the many opportunities to improve life can utterly eradicate poverty."
 liberalism_subtype_desc: "A single seed, planted in the civic halls of ancient Athens, germinated in the revolutionary storms of America, and finally blossomed after the Congress of Vienna. This seed, named "liberalism," originates from the word "liberty" and has become one of the most revolutionary political philosophies in human history.

Liberalism's basic doctrine comes from a self-evident truth: all people are born equal, enjoy rights equally under the law, and perform equal obligations, without distinction based on birth, class, or motherland. Although in many places, who is entitled to this truth remains a long-debated question, fundamentally, any civilisation that adheres to liberal principles holds the principles of liberty and equality as its guiding star.

In fact, this truth has made nearly every form of liberalism the principal enemy of fascism, totalitarianism, and their fanatical believers—fanatics who disregard the new world order and seek to become its masters. Although the liberal cause was defeated in the Second World War and suffered a devastating blow, with once-great liberal democracies such as France and Britain crushed beneath the Nazi jackboot, liberalism still stands among the free democracies of the Western Hemisphere. Even if they—even if this whole world—were destroyed, liberalism would never vanish from human ideology.

As long as a single person possesses free will, the torch of liberalism will never be extinguished."
 liberal_conservatism_subtype_desc: "In a world full of radicals, extremists, and the breeding ground that produces them—idle drifters—those who abide by reason may be humanity's greatest hope. Democratic values require discipline and a strong will to defend them; this is the wisdom inscribed on the Acropolis atop Athens, and liberal conservatives are just such a group of resolute, disciplined, and rational people.

Unlike conservatives in the pure sense, liberal conservatives take a relatively open attitude toward change in society as long as the authorities can ensure that change does not spiral out of control. Most support the free-market capitalist system, though a few occasionally wish for more or less government intervention in the economy. To date, liberal conservatives have established footholds in the Organization of Free Nations and in some non-aligned democracies of Africa, Latin America, and Asia. Whether these moderates can survive the persecution of authoritarian violence and greet the dawn of the new millennium remains to be seen."
 conservatism_subtype_desc: "Whether in philosophical politics or in ideology and culture, conservatism has always lived up to its name, upholding traditional values and seeking to preserve and improve the existing social and human landscape on the basis of recognised social norms. Though by traditional standards conservatism sits on the right of the political stage, it is fundamentally not opposed to cooperating with individuals or groups more inclined toward liberalism in certain circumstances, though such occasions are rare. Conservatives tend to favour laissez-faire market economics and generally prefer austerity over increased government spending, though exceptions exist.

With Britain and France—once praised as the greatest liberal democracies in the world—successively fallen beneath the iron heel of fascism, conservatism has revived in lands not yet tainted by fascism's tendrils, casting itself as democracy's last line of defence in a world sliding ever deeper into the abyss of totalitarianism.

Although many conservative-leaning politicians and even governments do not oppose reform, they still frequently clash in the public sphere with those more inclined toward liberty and progress."
 paternalism_subtype_desc: "The political philosophy loosely lumped together as paternalism has for thousands of years been held as a guiding principle by countless leaders, from dictators to monarchs to emperors. Paternalist regimes generally view the rise of liberal political thought as a trampling of ancient culture and moral norms, an insult to truth and law, and a source of injustice and turmoil. To this end, the state must teach its citizens as parents carefully teach their children, and counter the above influences by temporarily or permanently restricting civil rights and freedoms, as a means of protecting the nation, society, and culture, and of achieving a brighter future.

In this respect, the ideologies of the many authoritarian regimes ruling across Eurasia bear undeniable similarities. Liberals and conservatives who support democracy mostly detest the dictatorial tendencies of paternalist regimes, claiming they are either the budding form of emerging fascist thought or simply undisguised fascism. On the other hand, paternalist regimes rarely care about their neighbours' opinions, and often fiercely fight political or military threats, domestic or foreign, that attempt to end their position as the great patriarch."
 despotism_subtype_desc: "Despotism is a broad term that can cover any regime concentrating power in a single person or a small clique. These people rule the nation according to their own will and rely almost entirely on the military and police to prevent civil unrest. Despotic governments rarely tolerate the existence of other ideologies and establish systems to prevent other organisations from taking power. The opposition is treated as a public enemy and harshly suppressed; as for any elections that may be held, even if they are not rigged farces, they elect only powerless decorative offices.

Despotic governments usually also wish to control or dominate other nations and maintain vast military forces for conquest and to sustain their rule. Although despotic regimes may use nationalism as justification for their power, they are not as extreme as fascism or National Socialism—nationalism is more often used as a pretext than as part of their governing doctrine."
 ultranationalism_subtype_desc: "Although every nation places its own interests above those of others, ultranationalists are undoubtedly the most arrogant and blatant of all. The reactionary regimes controlled by ultranationalists tend to view foreign governments and peoples with extreme suspicion, and they care about only one thing: the survival of their own nation. Their extreme measures often stem from fanatical devotion to race, religion, or even national identity, and include enduring present hardship in the belief that it will ease the burden on future generations.

Ultranationalism is mostly born of peoples who have suffered extraordinary hardship and oppression, often manifesting as an unorthodox, radical government promoting itself as the redemption of the nation, with its ruling party generally originating from various radical nationalist political or religious groups. Once in power, they quickly become international pariahs. Yet in the eyes of ultranationalists, this is more a badge of pride than a major problem: extreme national self-determination is one of the key pillars of such regimes' belief structure."
 fascism_subtype_desc: "Among the many ideologies born in the turmoil after the First World War, the only one that seized great-power status in Europe and successfully maintained it is fascism. Influenced by disillusioned communism and authoritarian nationalism, fascism is often labelled the "third position" for its inspiration from both far-left and far-right ideologies. Although a trace of Marxist thought can still be found in its worldview (the dialectical opposition of production and parasitism), it replaces economic class with the nation—this poisonous nationalism leads it to oppose socialism's internationalist currents and inevitably led to the internal conflicts of Germany, Spain, and Italy after the First World War. But the fascist parties ultimately won and buried their socialist opponents.

The feature that best emphasises fascism comes from the almost blindly loyal devotion to the state it promotes. Government is usually controlled by a strongman who plays the role of the state's arbiter and supreme authority. Religious institutions, trade unions, and private enterprises may be permitted to exist in restricted forms, but they must inevitably flatter the state apparatus. Fascist governments also promote national myths, telling of a superior noble people once glorious in the past who have been stripped of their honour, and demanding that the people unite to reclaim what was lost. They mock democratic nations for clinging to their fading dignity and socialist nations for succumbing to backwardness—yet, quite paradoxically, view these nations as threats intent on seizing or destroying everything they hold dear."
 national_socialism_subtype_desc: "After the Russian Revolution pushed communism onto the world stage, a violent reaction born of fear followed. In Italy, this reaction manifested as fascism; in Germany, it developed into National Socialism. With the decline of Bolshevism, National Socialism became the ideology dominating Europe's fate.

National Socialism was born in the ruins of Germany's defeat in the First World War, developed through the radical anti-Semitic and nationalist rhetoric of Adolf Hitler and the National Socialist German Workers' Party. Thanks to the institutional flaws of the Weimar Republic and the impact of the Great Depression, this idea spread like wildfire. With the "master race" exalted above and the enslaved "inferior races" below, National Socialist theorists elevated their followers as Aryans—the top of their pseudoscientific racial hierarchy—while degrading enemies to subhumans fit only for extermination or enslavement, to make room for the superior race to expand its living space. Totalitarian rule is the social norm, and democracy is as evil as communism and liberalism. As for class struggle, it is not even worth mentioning, replaced by the corporatist concept of the "people's community" that defends the nation and ignores class; struggle and competition become the meaning of individual life.

National Socialism defined the twentieth century after the Second World War, seen as one of the greatest evils ever inflicted on the world. Nations untouched by the Nazi scourge loathe it deeply, while Germany regards it as an expression of fear, proof that this reaction precisely confirms the supreme will to power and its inevitable victory. Some doubt whether it can survive the Cold War, let alone achieve victory; others lament that things have come to this, and nothing can ever be repaired."

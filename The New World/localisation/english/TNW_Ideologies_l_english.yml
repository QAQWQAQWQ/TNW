 progressivism_social_republicanism_subtype: "Social Republicanism"
 progressivism_social_republicanism_subtype_desc: "The republic, like the state itself, belongs both to us and to them. A state cannot endure by favouring particular groups; only when the whole people work as one can it stand firm and achieve true prosperity.

In this world where ultranationalism flaunts its ugliness, social republicanism strives to build a fine new society, extending the national spirit to all the nation's groups and striding into the future rather than sinking into the sectarian feuds of the past. Social republicanism places particular value on the common people, nearly deifying their role in driving social change and reform, and vigorously promotes egalitarianism in every field, giving all the people their just reward and thereby liberating them. At the same time, it emphasises economic nationalism, advocating the liberation of natural resources and institutions from the aristocratic elite and their return to the broad masses. Yet it must be clear that these policies must never be misconstrued as communism; social republicanism's intellectual foundation is not Marxism, but the more popular socialist ideas.

Though social republicans have not fully reached consensus, they usually push decentralisation to some degree, returning part of the power to local institutions. Core power, however, remains firmly in the central government's hands, especially on matters of national security such as military affairs. The government believes only this approach can keep the republic out of the imperialists' control and prevent the nation from returning to the detested old aristocracy. This draws criticism from some, who see it as overprotecting the people. But many hold it a necessary measure to guarantee the wellbeing of all and the nation's long-term stability."

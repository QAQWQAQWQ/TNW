 despotism_military_socialism_subtype: "Military Socialism"
 despotism_military_socialism_subtype_desc: ""More than the political rights proclaimed countless times, we wish to emphasise the people's economic rights: the right to live, the right to work, and the right to fully enjoy the fruits of labour."

The idea of "military socialism" was born of the attempt by Bolivians David Toro and Germán Busch to fuse fascism with eternal scientific socialism. Though the experiment did not succeed, Villarroel's second presidency gave it new life, making it the state's official guiding thought—and, for a time, a beacon of hope for Latin America's leftists, for whom both the Soviet revolutionary experiment and their own countries' gradual reforms had dead-ended. From Peru to the River Plate basin, the experience of Bolivia's nationalist-popular movement forced many Marxists to re-examine their relationship with the military.

Military socialism advocates a corporatist tripartite alliance among the army, the labour movement, and leftist parties. Though seemingly contradictory, its adherents proclaim that the army is the true revolutionary vanguard, capable of leading the people against the ills left by the old oligarchy: bureaucracy, regionalism, caudillismo, corruption, and anarchy—the vices of the old era that linger even after the oligarchy's fall.

Though Marxists at home and abroad often call military-socialist states allies of the socialist movement, these regimes are almost without exception anti-socialist in substance, their essence in many ways approaching a new form of oligarchy. When asked why they still support such regimes, sincere leftists reply bluntly that these dictators have genuinely improved the people's lives—at least far more than the old regime. This attitude itself reflects the deep helplessness and despair of the Latin American left in the face of capitalism's and gradual reform's failure."
 fascism_aristocratic_fascism_subtype: "Aristocratic Fascism"
 fascism_aristocratic_fascism_subtype_desc: "The traditional image of fascism is bound to the man of action—the resentful petit bourgeois, sworn to fight the evil forces corroding the nation. Yet fascism can also arise from above, from the landed aristocracy rather than the impoverished masses.

For the old elite, fascism is the perfect weapon to suppress social change. This old but powerful steel roller can both flatten the dangerous currents corrupting the lower orders and forge the elite's interests into a blood-bound class fortress. It is the guillotine for the leftist labour movement, a reactionary fortress built of congealed blood—an ivory tower gazing down upon the masses from the clouds, its doors forever closed to the working class, let alone to mass organisations harbouring communist hearts.

Time flows backward here. The spirit of the Enlightenment crumbles like an ancient monument, and progressive thought turns to the dust of history. The ruling aristocrats relish this: it is precisely the eternal order they dream of. The old monarchy collapsed under liberalism and radicalism, but now returns in fascism's body. The return of the twentieth century may yet forge a blood dynasty enduring a thousand years."

 conservatism_Onenation_conservatism_subtype_desc: "One-Nation Conservatism traces its intellectual roots to Edmund Burke's conservative tradition, but as a distinct political idea it was established by Disraeli after he became Prime Minister in 1868, in response to Britain's deepening class divisions. With the rise of free trade and commercial bourgeois interests in the late nineteenth and early twentieth centuries, it receded to the margins.

After the Second World War, Britain "rediscovered" this legacy and made it the philosophical foundation of the postwar welfare state. The state, in the guise of a benevolent patriarch, returned to the forefront of the political stage. In Disraeli's view, society is not an arena of free competition but an organic whole; the wealthy elite bear an inescapable moral responsibility for the "suffering poor," promoting mutual support across classes while preserving the existing social order.

The key to understanding One-Nation Conservatism is recognising its foundation: it is conservative, not leftist. It seeks to "dissolve" class conflict, not to "abolish" the class order itself."
 national_socialism_rosenbergite_tendency_subtype: "Rosenbergite Tendency"
 communist_bolshevism_subtype_desc: "Bolshevism is the revision and reform of Leninism made by Nikolai Bukharin, former General Secretary and de facto leader of the Soviet Union, based on his personal views. Like Leninism, Bolshevism calls for the violent overthrow of capitalism and upholds the total rule of the vanguard. But Bolshevism also emphasises freedom of socialist thought and political pluralism within the vanguard, advocates a cultural environment minimally controlled by the state, and holds that the building of a communist society should proceed with caution, stability, and education. The core of Bolshevism is that building communism by coercion, even military rule, is inhumane and likely to backfire; only by awakening the people's spontaneous longing for communism can a communist society truly be built. For the Soviet Union, this idea led Bukharin and his supporters in the Party to make several highly controversial decisions, including relaunching the New Economic Policy and loosening control over agricultural production.

Because Bukharin's rule was overthrown by Joseph Stalin in 1942, and because of the Soviet Union's total collapse over the following three years, the "orthodoxy" of Bolshevism has been much questioned. From the marginalised Party cadres gathered around Stalin to the warlords who inherited the Soviet legacy across Russia, all blamed the dictatorship of the vanguard and its contradictory relativism for the Soviet disaster—though most historians of these events reject this argument. Whatever Bolshevism's current state, from quasi-reformists taking the parliamentary road to radical left communism that still values pluralism, most of the world's communist parties still uphold many of Bolshevism's principles in different ways."
 communist_marxism_leninism_subtype_desc: "Joseph Stalin was one of the candidates to succeed Lenin. He agreed with Bukharin's theory of "socialism in one country," but opposed the market-oriented development of the NEP. Instead, he held that the state should fully control the economy to stimulate rapid industrial and agricultural growth. Private enterprise is unreliable in building a socialist state, so collectivisation of industry and agriculture must be carried out under Party leadership and supervision. A key corollary is that the state apparatus—far from withering away after the revolution, as the outdated Leninists claimed—must be strengthened a thousandfold on the road to full communism.

Surprisingly, Stalin gradually regained prominence—first through his key role in the USSR's final years, then through his ideas. His rump government may have been no more successful than Bukharin's, but its state-oriented, exportable doctrine spread worldwide, even surpassing Bukharin's Bolshevism in some fields. Just as the Soviet Union fell into civil war, so its ideology is now split in two, famed for mutual contempt."
 communist_left_communist_subtype_desc: "Left communists follow what they see as the purest Marxist theory, rejecting all major political changes after Lenin's death—some even those during his lifetime. This does not mean they cling to the texts of Marx and Engels, but they do try to follow their original intent as closely as possible, even at the cost of some present-day practicality.

Firm opposition to parliamentary politics, rejection of the Party vanguard and its false democratic façade, and belief in the historical inevitability of revolution form the movement's main features. Their anti-populist stance and emphasis on theory over practice earn them ridicule from other leftists, but historically left communists have rarely felt threatened by these "opportunists.""
 communist_stratocratic_communism_subtype_desc: "Stratocratic communism arose from both circumstances and ideology. Though the far left generally despises traditional militaries, this antipathy often vanishes once they control the armed forces, and nothing has ever stopped soldiers from entering politics. Some even indulge in the long leftist tradition of "theorising"—when the spirit of their chosen profession fuses with Marxist theory, a new mode of thought emerges, one rarely accepted by other radical leftists.

Its most important tenet is a revolutionary socialist government composed entirely of soldiers. Critics call this a power-grab to hijack the revolution, building only a revisionist junta. These critics—before being summarily executed—face the rebuttal that an army of conscripted proletarians must necessarily be the vanguard of revolution. Such regimes also hold that military supremacy is the only road to socialism's final victory: if the bourgeoisie cannot be defeated from within, the armed workers of the nation must liberate their oppressed comrades by force."
 communist_mao_zedong_thought_subtype_desc: "Although the Chinese Communists were defeated in the war of resistance against Japan, the ideas of Mao Zedong—one of their founders and their leader—did not die. They bided their time in the mountains, awaiting the wavering of imperialism.

Mao Zedong Thought draws on Mao's writings during the Long March and at the Yan'an base, borrowing elements of agrarian socialism but far more than a minor patch. It inherits Marx, Engels, Lenin, and Bukharin, founded on internationalism and anti-imperialism, but unlike traditional Bolshevism it values the rural masses far above the urban proletariat. In largely rural nations struggling against capitalist rule, it advocates revolutionary land reform, a new democracy suited to national conditions, and guerrilla war as the best form of revolutionary struggle—a "protracted people's war.""
 communist_amazonism_subtype_desc: "A split within the Communist Party of Brazil gave birth to a new revolutionary idea that changed the course of Latin American socialism. As many of the region's communist parties turned to parliamentary politics, João Amazonas, chief theorist of the Brazilian CP, argued that communists must wage a long "people's war" of guerrilla warfare in rural areas far from population centres to violently overthrow capitalism.

Amazonism rejects any ties with capitalist powers as a betrayal of anti-imperialism, but urges its organisations to cooperate with other revolutionary groups. Its economic autarky and diplomatic isolationism make other leftist factions distrustful. Amazonas insisted only a vanguard party can lead the masses and awaken their revolutionary consciousness, firmly opposing the decentralised revolutionary line of the Guevarists."
 communist_national_communism_subtype_desc: "When Karl Marx wrote his fateful works, he envisioned a global communist utopia where the workers of the world would be free and nationalist oppression a distant memory. That vision failed. Bukharin's "socialism in one country" also failed.

But internationalism was never communism's only destiny. National communism answered the national question: communism is not the enemy of nationalism—it is true nationalism. Imperialism and capitalism bleed nations dry; communism is the key to escaping these twin devils. From Ukraine to Central Asia to Africa, national communists are as diverse as the nations that host them, united by a shared belief in national self-determination, communism, and anti-imperialism."
 communist_workerism_subtype_desc: "Workerism—or autonomist Marxism—describes the system of thought that arose in early-1960s Italy and linked its mass movements and individuals. Its early core was a small group of Marxist intellectuals who critically revised the mainstream Marxist interpretation popular since Lenin's time. Its central idea is that the traditional view—that the working class's class struggle responds to capitalist development—actually gets history backwards: capitalist development is a response to the struggles of exploited workers.

The working class is thus the "passive engine" of capitalism; every revolutionary strategy must arise spontaneously from the workers themselves, resisting bourgeois corporatist unions and the exploitative "vanguard party." The workers must rely on themselves and seize power through violent revolution and tight grassroots organisation."
 communist_harmonism_subtype_desc: "Nikolai Bukharin, once despairing, spent twenty years in the Siberian wilderness seeking answers to questions he could not even describe. One fateful night he found a strange crystal that let him glimpse a society built on a single principle:

§CFriendship is magic.§!

Harmonist communism is an idealised ideology blending Bukharinism with the belief that friendship is the path to socialism. Its followers believe §Cfriendship is magic§!, and that every problem of society should be resolved through harmony, not violence. Harmonists have not abandoned class struggle, but believe there are ways other than violent revolution. Through the power of friendship, class barriers crumble, and the peaceful coordination of workers' struggles evolves naturally into the dictatorship of the proletariat."
 communist_trotskyism_subtype_desc: "Trotskyism began as a term of derision in the 1920s, later embraced by Trotsky's exiled followers. Trotsky always held revolutionary convictions, organising opposition within the Comintern until he was expelled by the Bukharin-Stalin bloc. Believing international revolution paramount, he founded the Fourth International. He argued that, given Russia's backward economy, only international revolution could complete its transition from pre-capitalism to socialism—his doctrine of "permanent revolution," adopted by revolutionaries outside Europe to bypass Bukharin's two-stage theory.

Trotskyists believe conditions for socialism are already ripe, lacking only the right leadership. Their strategy crystallised in the 1938 Transitional Program: pushing revolution forward through ever-escalating demands. Trotsky died in 1940, but the upheavals of the forties seemed to vindicate his foresight. Whether his followers can build the democratic, internationalist, and highly planned socialist society he envisioned—or once more meet a Thermidor—remains to be seen."
 communist_guevarism_subtype_desc: "Among the many participants in the Cuban Revolution, only the Argentine Marxist Ernesto "Che" Guevara rivalled Fidel Castro's fame. His ideas are called Guevarism.

Guevarism is a radical, mainstream-detached current: it rejects the vanguard party leading the Marxist revolution. Instead, the small guerrilla band is itself the vanguard, as in Che's experience in Cuba. Through stirring discontent, propaganda, and guerrilla war among the peasantry, the guerrillas can pressure any corrupt oligarchy until armed uprising erupts.

Its core is the emphasis on the peasantry and rural areas over traditional urban workers, armed struggle, internationalism, and faith in revolutionary will—with thought and arms, revolution is invincible."
 communist_peoples_democracy_subtype_desc: "In the 1930s, communists adapting to parliamentary democracy proposed the Popular Front, allying with bourgeois parties against fascism. Fascism won, but the idea did not vanish—it evolved, or "mutated," into a new united-front ideal of a democracy determined by the proletariat.

In theory, parties representing the proletariat, peasants, petty bourgeoisie, and even national bourgeoisie can participate, but power rests firmly with the dominant proletariat. In practice, the ruling communists exercise broad power over the democratic process, deciding who may stand for election. The parties unite in a national front as the sole legitimate governing body under communist leadership. Compromise is often the key to avoiding cracks in the alliance."
 socialist_revolutionary_gaitanismo_subtype_desc: "Revolutionary Gaitanismo is less an ideology than a set of convictions held by Fidel Castro and his comrades, which spread across Latin America after the success of the Cuban Revolution. Its followers believe Marxism and Gaitanismo's radical republicanism are fully compatible and reject Leninism. They call on all progressive forces—the proletariat, students, bourgeois nationalists, even clergy and the petty bourgeoisie—to unite under the revolutionary banner, whether through armed struggle led by a guerrilla vanguard or through civic struggle led by a mass populist party.

Their goal is a true proletarian republic, a multi-party direct democracy bound by revolutionary consensus, with the people participating through councils elected at local and provincial levels, defended by guerrillas who would bury warlordism and capitalism."
 socialist_anarcho_communist_subtype_desc: "From the streets of Barcelona to the fields of China, anarchism is as tenacious as rats and as impossible to stamp out as the Hydra—kill, imprison, or "disappear" one anarchist and two more take his place.

As a leftist ideology, anarcho-communism is more radical than Marxism or democratic socialism. It firmly opposes authoritarianism, viewing it as no different from the evils of capitalism. Anarcho-communists are known for their aversion to large-scale industrialisation, preferring communes and farms for production. Their most famous moment came with Nestor Makhno's Free Territory of Ukraine in 1920. Yet anarcho-communist societies, united by common goals, divide over everything else; infighting, chaos, and confusion sow the seeds of their downfall.

Modern anarcho-communism originates from the mid-19th-century writings of Proudhon and Bakunin. Its goal is the total abolition of every form of oppression—capitalism, racism, the state itself. Thus they often survive only on the political margins: the left scorns them, the right hates them. Yet for those abandoned by existing systems, anarcho-communism remains a beacon of hope. No matter how dark and authoritarian the world becomes, anarchists will lurk in the shadows, awaiting the moment to rise and realise their cry: "No gods, no masters.""
 socialist_christian_socialism_subtype_desc: "Christian socialism is a broad umbrella term for the various creeds that combine the moral teachings of Jesus Christ with the economic theories of leftist thinkers. This union of idealism and materialism may seem contradictory, but that has not stopped thinkers and theologians from uniting them. They regard themselves as devout as any Christian and reject the Marxist view that religion is the opium of the people.

Many hold socialism and Christianity to be irreconcilable, but Christian socialists counter that it is capitalism that cannot coexist with them: capitalism is a form of idolatry, a sect worshipping the almighty dollar that encourages greed and condemns charity. They cite Scripture, noting Jesus's words that one cannot serve both God and money, and the early Christians' sharing of wealth. Only collectivist social policy, they argue, can help others while following Christian doctrine."
 socialist_revolutionary_frontism_subtype_desc: "In theory, a revolutionary front is a united alliance of socialists, communists, and left anarchists cooperating to seize power and build socialism. In practice, it means people of wildly different ideas must set aside their differences for socialism's sake—democratic socialists who believe in the ballot box working alongside authoritarian socialists who loathe "bourgeois democracy."

Such alliances inevitably lack unity; their policies arise from internal compromise or one faction's victory over another. Usually, where revolutionary fronts exist, the left can only hold power through a big-tent alliance, or must unite against a right wing that threatens the left's very survival.

Their leaders are as diverse as their organisational base. Whether the front survives depends on whether its members are willing to sacrifice ideological purity for political survival—even their own lives."
 socialist_ultravisionary_socialism_subtype_desc: "Since first glimpsing the heavens, humanity has dreamed of reaching higher than the ground beneath its feet. To that end, humanity evolves, unites, and climbs ever higher peaks of knowledge, until one day the dream is fulfilled. While many are content with communism as humanity's next revolutionary step, ultravisionary socialists are not satisfied with resting on their laurels.

Communism, combined with an extreme emphasis on science, is today's ultravisionary socialism. It holds that socialism is not merely the next step of social development, but one aspect of the next stage of human progress—the complete unification of the scientific disciplines and laws.

The stars are no longer out of reach. To those who look to the future, glory belongs forever."
 socialist_ultravisionary_socialism_pink_subtype_desc: "Since first glimpsing the heavens, humanity has dreamed of reaching higher than the ground beneath its feet. To that end, humanity evolves, unites, and climbs ever higher peaks of knowledge, until one day the dream is fulfilled. While many are content with communism as humanity's next revolutionary step, ultravisionary socialists are not satisfied with resting on their laurels.

Communism, combined with an extreme emphasis on science, is today's ultravisionary socialism. It holds that socialism is not merely the next step of social development, but one aspect of the next stage of human progress—the complete unification of the scientific disciplines and laws.

The stars are no longer out of reach. To those who look to the future, glory belongs forever."
 socialist_agrarian_socialism_subtype_desc: "Unlike Marx's socialism, which makes the urban proletariat the engine of revolution, agrarian socialism places the peasantry at the revolutionary forefront.

Popular in underdeveloped nations with little industry, its vision of an ideal society is based on agrarian society: land should belong to the broad masses, not the landlord class. Through a socialist economy and collective ownership of the means of production, agrarian socialism aims to build an agrarian utopia where peasants can labour joyfully, knowing they will finally reap the fruits of their own work.

Importantly, agrarian socialism is not inherently revolutionary—it can be achieved through the ballot box or the gun, making it broadly appealing. Critics abound: the left claims socialism cannot be built without industrialisation, while the right offers more "traditional" attacks denying socialism any merit."
 socialist_syndicalism_subtype_desc: "What is socialism? Simply, workers owning the means of production, directly or through the state. So what is more socialist than syndicalism—where workers seize control of society and the economy from the bourgeoisie through the revolutionary act of the general strike, then build a new society directly on unions of workers, with no intermediate class?

Syndicalism advocates direct action—strikes, sabotage, and demonstrations—against capitalism, both to improve workers' conditions under it and ultimately to overthrow it. Though the October Revolution and other factors drove the syndicalist movement into decline and marginalisation, it never truly left the stage. Perhaps one day a new generation of syndicalists will again terrify the bourgeoisie and politicians, like the radicals and saboteurs of the early twentieth century."
 socialist_panafricanism_subtype_desc: "Pan-Africanism arose in the early twentieth century as a product of decades of colonial oppression by Britain, France, Germany, and other European powers. Its adherents reject a single racial identity, socialism, or any other creed; against the European colonisers, they proclaim that Africa must unite under one banner. Pan-Africanism sits on the far left, its leaders emphasising an anti-imperialist stance that distinguishes it from African socialism. Where Europeans called Africa the "Dark Continent," Pan-Africanists firmly uphold a pan-African national identity.

Its followers are concentrated mainly in West Africa's Cameroon and in South Africa, where the ANC flourishes, but thinkers espousing the idea can be found from Cape Town to Cairo, and its fame reaches Black communities in America and the Caribbean. Organised, angry, and energetic, they spread their influence outward—and those with vested interests in Africa would do well to watch them closely."
 socialist_baathism_subtype_desc: "$despotism_baathism_subtype_desc$"
 socialist_left_wing_nationalism_subtype_desc: "From East to West, from the most developed to the least developed nations, a new current has emerged in modern politics: left-wing nationalism. Valuing equality, class consciousness, and socialist modernity, its adherents aim to challenge imperialism by shaping these ideas into a resonant call for national self-determination and independence. Through their efforts, socialism's agitational power becomes a weapon against imperialist encroachment.

During the Cold War, left-wing nationalism was a broad label covering both revolutionary tendencies and electoral reform; its adherents are found from Europe to Asia, Africa to the Americas. Despite the breadth, they share common ground: nationalism and socialism are not irreconcilable, and national self-determination and political independence are necessary steps toward equality and freedom."
 socialist_african_socialism_subtype_desc: "People say socialist experiments all end in failure, but how much has capitalism achieved on African soil? African socialism is the product of many former British and French colonies gaining sudden independence after the Second World War; its supporters do not wish to build capitalism like the Europeans who colonised them, but seek an ideology better suited to African realities.

The main difference from traditional socialist schools is its greater emphasis on redistributing economic resources through traditional African means. Some African socialists are convinced that the unique tribal communal structures of African society show that socialism is the traditional way of life of African peoples—a fact that can even overshadow the theory of class struggle.

African socialism is also deeply pan-African, yet differs from Cameroon's ideology: it is more moderate, decentralised, and close to the masses, and more respectful of the people's traditional customs and social structures. Its regimes are also usually less expansionist, though not necessarily opposed to violence."
 socialist_islamic_socialism_subtype_desc: ""Look at all the religions of the world. Was Moses not a revolutionary before the three signs appeared to him? Korah, who attacked Moses for power and gain, was the greatest capitalist of his age; Balaam, who cursed the Israelites, was the high priest of polytheist heresy; and Pharaoh, the greatest symbol of political power of his time. Did he not rise against all of them?" — Ali Shariati

The rise of Islam was the greatest political, social, and economic revolution in the history of the Arabian Peninsula, indeed the world. The selfish, corrupt polytheism was utterly destroyed and its traces swept from every corner of Arab society. A new revolutionary order, promising justice and equality, unified the Arab tribes. Yet after the death of the Seal of the Prophets, many—including the Prophet's companion Abu Dharr al-Ghifari—saw the return to wealth-accumulation as a betrayal of Islam's principles.

On these arguments, the obligation of zakat, and the revolutionary nature of the first Islamic state, Islamic socialists—Sunni and Shia alike—aim to free the Islamic world from the chains of capitalism, decadent reactionary culture, and exploitative social structures. On the ruins of capitalist empire, the ancient Ummah will be remade into a revolutionary, socialist, anti-colonial community, where wealth is fairly redistributed so that no one is homeless, naked, hungry, or labouring without reward."
 socialist_social_democracy_subtype_desc: "After the October Revolution, social democracy grew from the world of socialist mass politics into the mainstream. Though generally opposed to wholesale reformism, it equally distrusted Bolshevism's revolutionary organisational line, evolving into a road ultimately agnostic on "reform or revolution." Social democratic parties trace their ideology to the orthodox Marxism of the Second International and the centrist Marxism of the Two-and-a-half International, tending to participate in liberal democracy on pragmatic grounds.

After defeat in the Second World War, modern social democrats often became the core of revolutionary movements worldwide, showing a willingness to build broad consensus within anti-fascist and anti-capitalist blocs rather than adhering to the strict revolutionary line of the communists. Yet this approach can also expose the movement to subversion by opportunists, destroying social democracy's struggle."
 socialist_buddhist_socialism_subtype_desc: "Buddhist socialism, sometimes called "Dhammic socialism," refers broadly to a range of ideas in Asia that combine, to some degree, the economic and social equality associated with socialism with the traditional doctrines, precepts, and ethics of Buddhist thought. The term is broad and not confined to any particular sect; those identifying with it differ on democracy, monarchy, Marxism, and many other key issues. Buddhist socialism has inspired parts of the visions of Dengduke Kula, Bolejide Gendun, Buddhadasa, and others.

Yet this doctrinal divergence does not erase the term's practical meaning. On one hand it describes the movement of many leaders and groups to modernise Buddhist thought by combining it with Western philosophy; on the other, it covers some resistance to the Western idea of separating church and state. For Buddhist socialists, the world described by Western socialists is incompatible with their worldly values—without the Buddha's teaching, how could an equal world free of craving ever come to be?"
 socialist_socialist_zionism_subtype_desc: "The Zionism expounded by Theodor Herzl originally aimed to turn the Jews from their abnormal state of dispersion into a normal nation living on their own land, building a national economy and gaining international acceptance. Though the liberal Herzl is hailed as the father of modern Zionism, he was not the first to discuss the bond between a people and its homeland. Before him, the outstanding socialist Moses Hess stood further left, striving to solve the Jewish historical question through nationalism as a Jew. Hess believed the gravest problem facing the dispersed Jews was their disconnection from labour, forcibly isolated for generations and unable to achieve natural economic development. He proposed that Jews return to their homeland, work the land, and establish a federation in Palestine based on land and agriculture.

Forty years later, Hess's socialist Zionism found worthy heirs: Jewish socialists and social democrats who formed the second wave of immigration to Palestine at the turn of the century. They founded agricultural communities called "kibbutzim" on strict socialist principles, with communal ownership of property and social life, and children raised and educated by the community. The kibbutz is the heart of the socialist Zionist movement, seen by many as humanity's closest approach to true socialism."
 progressivism_gaitanismo_subtype_desc: "For Colombia, Gaitanismo is not an ideology but a new national ideal of Latin America's own making, inspiring many leftist politicians across the region.

Gaitanismo arose with the rise of Jorge Eliécer Gaitán, offering liberal socialism, staunch anti-fascist populism, and a democratic alternative to Bolshevism. It is eclectic in social policy, aiming to draw in the broadest possible base and extend democracy to every corner of society.

Gaitanists do not speak of bourgeoisie and proletariat, but of the political country and the national country—the former the oligarchic elite, the latter the common masses. The national country must overthrow the political country to build a true liberal democracy, united as one nation and reaching peaceful compromise between employers and workers. Welcoming foreign investment and socialist economic policies that consolidate democratic reform are hallmarks of Gaitanismo. Geopolitically it calls for Americanism—close cooperation with the OFN and other liberal democracies to fund revolutionary reform."
 progressivism_reformist_socialism_subtype_desc: "Reformist socialism is a broad umbrella term covering leftist movements that, for various reasons, still wish to operate within the basic capitalist framework. Its adherents do not seek the immediate abolition of the market as a decisive factor in production—nor do they plan to in the foreseeable future. Instead, they place great emphasis on democracy in the workplace and government, believing workers must have at least a minimum input into the production of goods and services, often expressed as cooperation between parliamentary alliances and labour organisations.

Its theory can be vaguely traced to Eduard Bernstein of the German SPD, but a Marxist origin is not a requirement. Indeed, many modern reformist socialist parties actively distance themselves from their Marxist roots."
 progressivism_left_wing_populism_subtype_desc: "When the masses chase wealth and power, hoping one day to climb into the masters' class; when inequality and hunger run rampant even in developed nations; when the elite deceive and line their own pockets—then someone will stand up and say "no." No to poverty, no to hunger, and above all no to the wealth gap, for injustice anywhere threatens justice everywhere.

These people unite under the banner of left-wing populism. Though lacking a unified theory, they have stirred a vast political wave: combining anti-elitism, leftist slogans, and populist economic policy, they present themselves as "protectors of the common people," at odds with the economic titans and establishment that oppress the vulnerable. This theory is not rooted in socialism; it often deliberately avoids Marx and Lenin while praising the words of James Connolly or Léon Blum. The most radical part of left-wing populism is its slogans, calling for the uprooting of political and economic elites and a government of, by, and for the people."
 progressivism_left_kemalism_subtype_desc: "For decades, Kemalism has held near-absolute dominance in Turkish politics, followed by left, right, and centre. In recent years, however, Turkey's right wing has gradually drifted from Kemalism's Western-oriented progressivism, mainly because Kemalism bans religious expression and because the new fascist-inspired system increasingly wins adherents. In response, many Kemalists have chosen to emphasise the progressive nature of their ideology and Atatürk's ideas, seeking to reposition Kemalism toward the centre-left and promise more social welfare. Unlike their more nationalist orthodox cousins, left Kemalists emphasise populism and reform—though they still promote a Turkey-centred national identity, which may alienate certain minority groups."
 progressivism_popular_front_subtype_desc: "United we stand, divided we fall.

No ideology better illustrates this maxim than the "Popular Front." Popular fronts usually encompass an extremely broad range of leftist ideologies, from hardline communists to democratic liberals—and, rarely, even conservatives in extreme cases. Such temporary cooperation often forms amid sudden upheaval or the threat of it, when the opposition sets aside its differences to resist through elections, armed conflict, and other means.

The concept's application is as broad as its composition. A front usually first finds some minimal common ground—generally moral reasons—to oppose an emerging threat. Then its policy is unity: voting together, or supporting one another in direct action and street clashes.

So broad is the term that it resists precise definition; it may not be an ideology at all, but a strategy by which parties advance their ideological claims."
 progressivism_social_radicalism_subtype_desc: "Under the banner of liberalism, while most wholly reject Marxist principles and their derivative ideologies, many others find common ground on many reasonable points. Equality, after all, is a value shared by radicals and socialists. While mainstream radicalism opposes all socialists and their philosophy in principle, social radicals have found common cause with them, setting aside historic struggles to pursue shared goals.

Yet not rejecting Marxism does not mean potential agreement—quite the opposite: social radicalism aims to build a state sufficient to meet the people's needs and aspirations, so that Marxism can never appear as a viable alternative. Its methods: establishing equality in every field, generous welfare programs, and a state strong enough to protect all citizens from outside forces seeking to control their lives.

Its supporters insist its revolutionary character stems solely from the ideals of the French Revolution, which they hold essential to the modern state—lest the light of the Enlightenment be extinguished forever."
 progressivism_christian_progressivism_subtype_desc: "Christian progressivism is a form of Christian democracy that places great emphasis on the justice, inclusiveness, and care for the poor and oppressed preached by Jesus Christ. Unlike most other forms of Christian democracy, it focuses more on advancing social change than preaching conservatism, though it still believes democracy is the best means of realising Christian values. Generally, Christian progressives interpret Christian doctrine through modern knowledge, science, and ethics rather than citing scripture. Economically it tends to be centrist, though it can lean either way depending on circumstances; socially it is usually centre-left, especially on civil rights. Yet, still largely bound by Christian thought, it often turns conservative on certain issues, valuing Christian values and ethics over adherence to particular dogma."
 progressivism_left_wing_agrarianism_subtype_desc: "Long before the Russian Revolution of 1917, the world had already learned of a distinctive type of socialism fused with rural political activity: left-wing agrarianism. Born in the minds of thinkers like Alexander Herzen and Pyotr Lavrov, it has its own rules but is fundamentally rooted in agriculture—agriculture's dominance in the economy, the peasantry's prominence in ideology, and an attempt to advance equality for all society.

Left-wing agrarianism clashes with classical Bukharinist-Marxist categories, steadfastly promoting the peasantry's preeminence in daily life and state functions as a separate class. For this, this distinctive socialism has never shied from being branded heresy time and again."
 progressivism_utopian_socialism_subtype_desc: "Utopian socialism is the embryonic form of socialism, one that socialists have always both loved and hated. Emerging in the late eighteenth and early nineteenth centuries, it rests mainly on a strong aversion to class conflict and an unshakable faith in the perfectibility of human society. Whether through local communes, the nationalisation of certain products and services, or government intervention to raise society's moral outlook, utopian socialists believe all humanity can reach a higher standard of living than capitalism can provide.

The greatest difference from their Marxist cousins is their undisguised aversion to class conflict and revolution, believing instead in a system persuasive and binding to all classes. This puts them at odds with pragmatic socialists who uphold a Marxist materialist worldview and seek a working-class alliance to seize power. Though most utopian experiments have failed, many persist in their efforts, believing a perfect social system will one day be created for all humanity to enjoy."
 progressivism_eastern_progressivism_subtype_desc: "For most on the left of the American political spectrum, Franklin Delano Roosevelt is their beacon. Deeply rooted in the Democratic Party and surrounded by his brain trust and senior experts, he was able to implement vast programs laying the foundations of a modern welfare state. But Franklin was not the only inspiration. For some on the left, the Hyde Park Roosevelt is too establishment, too traditional. They instead find inspiration in his eccentric distant cousin Teddy, who fought within New York's corrupt system to change the status quo. Eastern progressives are inspired by him: they know the establishment well and believe firmly in radical change.

Eastern progressivism is an ideology of reformers and popular support, one shaped by old money and big capitalists who—whether from duty or political survival—oppose the system their forebears built. They see an urgent need for cutting-edge technology, economic development, and political freedom to improve the people's welfare.

Though sharing much with their western counterparts, eastern progressivism differs in a few notable ways: it is inspired by large, stable, orderly cities like New York and Boston, not the open West; it is less confrontational, organised around existing centres of power; and its familiarity with the establishment makes it often unwilling to tear the whole system down, preferring instead to repair and expand it to include new groups and new peoples."
 progressivism_western_progressivism_subtype_desc: "For better or worse, the forging of American national consciousness is inseparable from the frontier. The rivers and plains of the West are a land of opportunity, where anyone, regardless of origin, can advance with courage and determination. Now the American West has become the source of a thought pushing America further toward its creed of freedom and justice—a thought called western progressivism.

Western progressives scorn the pragmatism of their eastern comrades, who wave the banner of change while compromising with America's traditional social structure and political brokers. In their view, every traditional organ of political power—from corporations to party machines to career politicians—is a tool for the powerful to suppress ordinary citizens. Western progressives enjoy a distinctive reputation as more genuinely representative of the people's will than the Washington politicians steeped in political games. Yet this can leave them lacking cohesion and common purpose, and unwilling to compromise—even when compromise is necessary for political success.

Now western progressives have found a home in the Progressive caucus of the National Progressive Convention, hoping to lead a new American revolution that sweeps away the legacy of racial and class inequality once and for all."
 progressivism_neocorporatism_subtype_desc: "Corporatism was once a marginal political creed, but has become one of the guiding philosophies of the twentieth century. It is the mark of the New Order, yet even in the democracies of the old order its influence is not small. The hybrid product is neocorporatism, somewhat similar to its fascist origins, but different too.

Neocorporatism rejects class interests in the traditional sense, seeing them as the cause of decades of conflict and war. Instead it advocates "pillarisation"—organising society around specific interest groups centred on religion, ethnicity, political background, or other factors. Each group has its own institutions and organisations, as inclusive as possible to avoid tension and unrest. These groups are also interconnected, reducing conflict between opposing groups like unions and corporations and enabling better coordination in economic challenges. In the end, the labour disputes that would cause economic disaster become structured consultations among a few dedicated actors.

In short, neocorporatism discards corporatism's rampant nationalism and totalitarianism, though some adherents have grander visions: the tripartite institutions for simple economic affairs could do more—govern the state more efficiently than the traditional majoritarian liberal democracy. Whether this holds beyond the textbook, only reality and time can tell."
 liberalism_national_liberal_subtype_desc: "National liberalism originated in the democratic movements of nineteenth-century continental Europe, a fusion of liberal political theory and nationalist philosophy on the question of the nation-state. It retains liberalism's emphasis on individual and economic freedom, but holds that the healthy development of both depends on sustainable and unthreatened national sovereignty. It is chiefly expressed in anti-immigration and economic protectionist policies, as well as support for certain industrial programs and state subsidies for key economic sectors.

In practice, however, national liberalism has not strictly followed its ideological creed. Because its theory stresses such prominent issues as sovereignty and freedom, some secondary policy areas remain open to redefinition. Protectionist economics can yield to free-trade agreements, and industrial programs to free enterprise, whenever this is judged to serve national sovereignty and individual liberty."
 liberalism_liberal_radicalism_subtype_desc: "As a relic of old times, radicalism is rooted in the Enlightenment and the French Revolution, closer to their sources than other liberal creeds. For radicals, democracy, secularism, the development of human rights, and progress stand above all.

Though the radical mainstream tends toward costly state programs, such programs may be hard to implement—even wholly impractical—given many nations' economic realities. Some radicals therefore adjusted their positions to fit the liberal model—and liberal radicalism is the full ideology born of that adjustment. Unlike social radicalism, which is more influenced by Marxism, liberal radicalism emphasises the ideal of positive liberty and the dimension of "freedom" from the Enlightenment. In practice it is espoused by groups from centre-left to centre-right, each finding something to commend.

For liberal radicals, embracing liberalism is not a choice but a necessity. The future cannot be cast aside over difficulty, for doing so would betray the very essence of the Enlightenment."
 liberalism_christian_liberalism_subtype_desc: "Among the many gospels Scripture brings, one is "love thy neighbour as thyself." In many communities that follow the Bible and the charitable philosophy of Jesus Christ, a political idea known as "Christian liberalism" has quietly risen on this commandment. Unlike churches that are often conservative and pedantic on political matters, Christian liberals believe that, broadly speaking, all people deserve equal respect and treatment; dividing people on economic or social grounds is not only a contempt for natural rights and individual freedom but a betrayal of the Christian principle of equality. Christian liberals are often compassionate and charitable, glad to aid and shelter the poor.

Christian liberals usually do not oppose, and sometimes strongly support, social reform. Following "render unto God what is God's, and unto Caesar what is Caesar's," they oppose government interference in citizens' private lives on religious (including Christian) grounds. Though opposed to overly radical progressive and socialist movements and terrified of the communists' vision, Christian liberals remain reliable allies of all who cherish liberal democracy. By the Lord's will, they will stand firm in the great cause of defending democracy and the people."
 liberalism_liberal_agrarianism_subtype_desc: "Since agrarianism rose as a system of thought, liberal agrarianism has stood out among the many agrarian-leaning political currents. Liberal agrarians are keen to protect personal and economic freedom—especially that of farmers, yeomen, and ordinary rural citizens—while upholding the proud tradition founded by liberal peasant parties, particularly those of Europe.

Liberal agrarianism differs greatly from other ideologies in the agrarian category. It rejects the traditionalism and social conservatism of right-wing agrarians, preferring moderate or even liberal positions. It also rejects the socialist-tinged economic justice advocated by left-wing agrarians. For liberal agrarians, economic justice can only be achieved under a properly reformed capitalist system, so that rural people may live comfortably."
 liberalism_social_liberalism_subtype_desc: "If a person steps into society with no concept of their class or social status, logic and self-interest demand they shape that society so that its most destitute members gain the greatest opportunity—this is the goal of social liberals.

Traditionally, liberalism has valued civic and economic freedom above all. But in the twentieth century, poverty and ruin spread across the globe, driving many liberal theorists to rethink their positions—and social liberalism is the fruit of that reflection. It places the common good on equal footing with individual freedom; to this end, the state must step in to help, resolving citizens' difficulties in education, employment, health care, housing, and more, and providing welfare for those in need. Government must also intervene in cultural matters, such as expanding civil rights and suffrage.

To critics, such intervention throttles market freedom. To supporters, any loss of individual liberty is more than compensated by the opportunities granted to the nation's most vulnerable: on the road to a just society and the eradication of poverty, curtailing the boundless luxury of the rich is a small price to pay."
 liberalism_classical_liberalism_subtype_desc: "Classical liberalism sees itself as heir to the democratic ideology of ancient Greece and Rome, a branch of contemporary liberal democratic philosophy. After democracy re-emerged in the eighteenth century, its ideas gained wide popularity—most notably in the American Revolution. America, as pioneer in this field, proudly reintroduced the idea of liberty to world politics.

Classical liberalism is usually held up as the standard by liberal thinkers, pursuing individual equality, a free-market economy, and social cohesion through moderation and reform. Classical liberals tend to focus on the defence of human rights, unlike market liberals fixated on economics, traditional and belligerent conservatives, or contemporary progressives who would expand civic government at the expense of the free market to combat social inequality."
 liberalism_dynastic_liberalism_kennedy_subtype_desc: "To be a member of America's Democratic Party is to devote oneself to the great liberal tradition handed down through the generations. One must believe, like Madison and Jefferson, in society's need for democratic constitutional government; be, like Wilson, a model of sound institutions in internationalism; look to Franklin Delano Roosevelt, who founded and defended the welfare state, and to his successors who burnished that cause, Dwight D. Eisenhower and Estes Kefauver. Today's American liberals outshine their predecessors—staunch defenders of civil rights, equality, social justice, and a government-regulated market economy, firmly rooted in tradition yet ever looking to the future.

The liberalism of John F. Kennedy is of this kind. With extraordinary eloquence and unadorned optimism, he encourages the American people to look to new opportunities and new frontiers. Taught by this era's "best and brightest," Kennedy has no wish to rely on bureaucratic process, instead inspiring the whole people to unite—to eliminate poverty, cast off ignorance, and push the nation toward the stars. Domestically, his liberalism centres on reversing America's decline: cutting taxes, sharply raising the minimum wage, and cracking down on racial segregation. Abroad, it centres on a complete foreign policy: maintaining strong military deterrence against Germany and Japan while resuming support for other nations' development in Asia, Africa, and Europe.

Yet whether such liberalism can withstand the storms at home and abroad remains to be seen. The vision gleams and the speeches stir, but America still faces enormous social and political challenges. Kennedy's grand ideals are always at risk of being mired—or cut short by the far left and far right."
 liberalism_dynastic_liberalism_lbj_subtype_desc: "To be a member of America's Democratic Party is to devote oneself to the great liberal tradition handed down through the generations. One must believe, like Madison and Jefferson, in society's need for democratic constitutional government; be, like Wilson, a model of sound institutions in internationalism; look to Franklin Delano Roosevelt, who founded and defended the welfare state, and to his successors who burnished that cause, Dwight D. Eisenhower and Estes Kefauver. Today's American liberals outshine their predecessors—staunch defenders of civil rights, equality, social justice, and a government-regulated market economy, firmly rooted in tradition yet ever looking to the future.

Lyndon B. Johnson's liberalism holds that America, though its development has stalled, remains the most prosperous nation on earth, with the resources to end every human ill. Here, each generation of Democrats renews itself, giving the nation both the strength to care for its people and the freedom and approachability to secure domestic tranquility. Through this all-capable government, poverty, hunger, disease, even prejudice may be eliminated—bounded only by the President's ability to push legislation and the bureaucracy's to implement it. Johnson's liberalism aims to keep righting wrongs: expanding medical and retirement security, enshrining transformative civil-rights law, and utterly eradicating poverty.

Yet whether such liberalism can withstand the storms at home and abroad remains to be seen. For all his tireless work to perfect the state, America still faces enormous social and political challenges. If President Johnson fails to deliver at home, to carry on the New Deal, or to honour America's promises to its allies abroad, the resulting threats will endanger liberalism's hard-won gains and its very future."
 liberalism_dynastic_liberalism_hart_subtype_desc: "To be a member of America's Democratic Party is to devote oneself to the great liberal tradition handed down through the generations. One must believe, like Madison and Jefferson, in society's need for democratic constitutional government; be, like Wilson, a model of sound institutions in internationalism; look to Franklin Delano Roosevelt, who founded and defended the welfare state, and to his successors who burnished that cause, Dwight D. Eisenhower and Estes Kefauver. Today's American liberals outshine their predecessors—staunch defenders of civil rights, equality, social justice, and a government-regulated market economy, firmly rooted in tradition yet ever looking to the future.

Philip A. Hart holds that liberalism is a force that can change the world. Yet he does not seek to expand executive power through New Deal-style methods; instead he aims to cooperate with local government, using the bureaucracies of each state to enact and carry out good, humane policy, thereby continuing the party's generational renewal. Domestically, such a program aims to revive cities, develop infrastructure, combat crime, and create unprecedented opportunities for consumers in markets and workplaces; abroad it takes a pragmatic line, easing US-Japan relations and lowering Pacific Cold War tensions so as to further isolate Germany.

Yet whether such liberalism can withstand the storms at home and abroad remains to be seen. The vision and concern for rights gleam in speech, but America still faces enormous social and political challenges. A single misstep could make fair governance backfire, leaving regions isolated and polarised and policy to fail; over-emphasising urban economic development could drive those who are neither urban nor minorities toward nationalism."
 liberalism_dynastic_liberalism_gabor_subtype_desc: "To be a member of America's Democratic Party is to devote oneself to the great liberal tradition handed down through the generations. One must believe, like Madison and Jefferson, in society's need for democratic constitutional government; be, like Wilson, a model of sound institutions in internationalism; look to Franklin Delano Roosevelt, who founded and defended the welfare state, and to his successors who burnished that cause, Dwight D. Eisenhower and Estes Kefauver. Today's American liberals outshine their predecessors—staunch defenders of civil rights, equality, social justice, and a government-regulated market economy, firmly rooted in tradition yet ever looking to the future.

But Zsa Zsa Gabor couldn't care less. Must one join the Democrats to make history or hold some lofty ideal? Zsa Zsa refuses—if the old men can be liberals, so can she. In her view, a sexy girl in a pink gown is far more charming than a preacher of liberalism, and who would claim people prefer muddled policy posters to a $600,000 ruby-and-diamond set at a film premiere? At home, the rising Gabor-liberals can't wait to pour new ideas into those stuffy, sexless middle-aged men—out-of-touch relics who would sooner take church hymns and reruns of I Love Lucy for truth than learn what today's women are like. No wonder they're still virgins in their forties. Let these men who refuse to change be forgotten! Let the killjoy military-industrial complex step aside! What diplomacy needs is cocktails! Parties! Sexual liberation! Cold war or hot war, so long as this dreadful show never ends, our party never ends!"
 liberalism_dynastic_liberalism_chep_subtype_desc: "To be a member of America's Democratic Party is to devote oneself to the great liberal tradition handed down through the generations. One must believe, like Madison and Jefferson, in society's need for democratic constitutional government; be, like Wilson, a model of sound institutions in internationalism; look to Franklin Delano Roosevelt, who founded and defended the welfare state, and to his successors who burnished that cause, Dwight D. Eisenhower and Estes Kefauver. Today's American liberals outshine their predecessors—staunch defenders of civil rights, equality, social justice, and a government-regulated market economy, firmly rooted in tradition yet ever looking to the future.

Chep Morrison's liberalism is the defence of this handed-down tradition. The accidents of history thrust deLesseps Story Morrison to the front, forced to stake everything on uniting the party's quarrelsome factions. Chep is trying to use the public's fond memory of the Hart administration and the popularity he built as Mayor of New Orleans—with political allies focused on urban voters—to ensure the success of Hart's urban-renewal program and remake America into a new, modern nation. Thus Chep's term will see little change. Chep cannot inspire like Kennedy the liberal beacon, nor manipulate politics like the seasoned Johnson. If he can simply maintain America's current momentum at home and abroad, the President hopes this administration will be judged a success."
 liberalism_dynastic_liberalism_kirk_subtype_desc: "To be a member of America's Democratic Party is to devote oneself to the great liberal tradition handed down through the generations. One must believe, like Madison and Jefferson, in society's need for democratic constitutional government; be, like Wilson, a model of sound institutions in internationalism; look to Franklin Delano Roosevelt, who founded and defended the welfare state, and to his successors who burnished that cause, Dwight D. Eisenhower and Estes Kefauver. Today's American liberals outshine their predecessors—staunch defenders of civil rights, equality, social justice, and a government-regulated market economy, firmly rooted in tradition yet ever looking to the future.

Jean Kirkpatrick's liberalism is about strength. At home, strength is the power to let people write their own lives—strengthening unions, eliminating workplace discrimination, and enriching ordinary people. Beyond that, the government must sideline the unpatriotic, apathetic, "able-bodied yet idle" extremists at home and consolidate America's executive institutions. Abroad, liberalism means exporting democratic ideals through military power, letting the military and intelligence agencies put an end to every totalitarianism. Peaceful coexistence will be a thing of the past, and America will relentlessly defend its interests in every corner of the world.

Yet whether such liberalism can withstand the storms at home and abroad remains to be seen. To mainstream feeling, this liberalism sweeps aside the welfare-centred policies of the previous administration, becoming radical and selfish. Marginalised groups are not only alienated but see Kirkpatrick's conduct as playing straight into their hands—proof that America has always sought to push imperialism. With one misstep, liberalism could lose hearts at home and abroad."
 liberalism_liberal_technocracy_subtype_desc: "Technocracy can be distilled to one core idea: those most qualified and experienced in the academic fields vital to the nation's welfare should govern. To technocrats, the ideal ruler is a problem-solver—researcher, theorist, scientist, business elite, or engineer.

Liberal technocrats strive to strip liberal democracy of party politics (or "party dictatorship"), determined to drive the nation's transition to technocracy. They follow meritocracy, minimising the power of elected officials and party cadres. This seems to run against the spirit of democracy, and doubts abound. To this, liberal technocrats often point to the bloated, rigid bureaucracy—the very malady that produced their reformist impulse.

Truly, stripping power from incompetent elected officials contradicts democratic form. But is it any more democratic to let the bureaucracy decay into a political mafia, paralysing the state? To let officials meant to serve the people run rampant with shocking corruption and nepotism, gnawing at the state's foundations?

If some see such disorder as the price of freedom, they may keep their view—but liberal technocrats cannot agree. The state exists to serve the people, not to parasitise them; only technocracy can provide the fundamental guarantee for such a state."
 liberal_conservatism_market_liberalism_subtype_desc: "There was a time when trade liberalism was the mainstream of Western political thought. In Britain's Liberal Party, America's Republican Party, or France's Radical Party, this current dominated the West with its three most famous policies: freedom of speech, freedom of election, and freedom of trade.

Today, however, trade liberalism is criticised by alternative ideas from both its right and left, which hold that it has never faced the social costs of its policies. Yet its followers remain numerous, especially in the Americas. Trade liberalism holds that government should not meddle in the economy or citizens' private lives, seeking to create a society where all can succeed through labour and talent.

Implementing these policies means lowering taxes, removing trade barriers, and ensuring a "level playing field" for all. Yet sometimes trade liberals are also willing to intervene to speed development, through subsidies or tax breaks. They regard the free market as sacred, believing "a rising tide lifts all boats"—whether those boats are poor or rich."
 liberal_conservatism_christian_democracy_subtype_desc: "Christian democracy rests on two pillars: God's faithful have a duty to aid the people, and democracy is the best form of government. Beyond this, Christian democracy has almost no fixed standard, and ideas about how to achieve it are equally diverse.

Some parties reject capitalism and socialism as the two great "materialist" ideologies; others support the social market economy—a free market combined with a strong social safety net and institutional regulation built by government. Still others who call themselves Christian democratic may be classed as conservative or liberal depending on their nation and history. They may also straddle the divide: centre-left on economic and civil-rights issues, centre-right on social, cultural, and moral ones.

Christian democracy can belong to almost any denomination, though most are some variant of Catholic or Protestant. Though its European birthplace—Germany, Austria, Belgium—is held by anti-religious Nazis, the movement is flourishing in Latin America. They hope one day this humble, virtuous, blessed democracy will return to Europe."
 liberal_conservatism_big_tent_subtype_desc: "The essence of big-tent politics is inclusiveness. This political form is like a great canopy sheltering all kinds of personalities and ideologies. People often marvel that such a "political buffet" holds together, and the answer lies at its core.

Pragmatism—this is the foundation of big-tent parties and ideas. Without the tent, the groups sheltered within know they would become scattered stragglers, losing political energy. The big tent gives them a cohesive force greater than the sum of their parts. More importantly, such alliances need a common goal to bind their diverse ideas. In the current political climate, opposing fascism often becomes the consensus. Yearning (usually in a liberal fashion) to defend democracy's vision, politicians and citizens across the Overton window join hands to protect their cherished values. However fierce the quarrels inside the tent, all are acutely aware of the dangers outside."
 liberal_conservatism_moderate_technocracy_subtype_desc: "Technocracy can be distilled to one core idea: those most qualified and experienced in the academic fields vital to the nation's welfare should govern. To technocrats, the ideal ruler is a problem-solver—researcher, theorist, scientist, business elite, or engineer.

Moderate technocrats, like liberal technocrats, graft technocratic ideas onto democratic politics. Both are keen to hire experts from outside the political-administrative class to help govern, and both hold considerable suspicion of politicians and party men.

Unlike their sharper counterparts, however, moderate technocrats are quite happy to work within the existing political system. Defending the state requires pragmatism; clinging to dogma only harms it. Those technocrats obsessed with principle attack the problem itself, which merely adds risk. The better course is to correct overzealous partisanship—to detoxify it and render it harmless."
 liberal_conservatism_oligarchic_liberalism_subtype_desc: "Over the past centuries the feudal aristocracy has suffered disaster after disaster, the embers of revolution ever able to ignite fresh conflagrations that forced the lords to yield and their Byzantine systems of oppression to collapse. The torch of liberalism stood upon the ruins of the old regime—but with the power vacuum left unfilled, a new class rose to occupy it: the oligarchs.

The great liberal tradition proclaims certain inalienable rights and hopes to build democracy, letting the people elect their rulers and so become the source of the state's authority. At first glance this seems to contradict oligarchy—yet once strict ideological limits are transcended, the contradiction dissolves, and two things seemingly impossible to join become one. Oligarchs of vast wealth may be out of touch with the radical, fierce masses, but they always find ways to position themselves as the vanguard of the public interest, placing themselves at the head and summit of the democratic process.

Power belongs to the people and flows from the people, but the people can never truly rule themselves. Fortunately, the merciful oligarchs will hold aloft the torch of liberalism in their name, wielding the sceptre as their personally chosen democratic representatives."
 liberal_conservatism_islamic_modernism_subtype_desc: ""I went to the West, where there are no believers, yet people live obedient to the Lord's will; I walked toward the East, where all invoke the Lord's name, yet they deceive Him."

As an Arab response to the colonialism and imperialism of nineteenth-century European powers, Islamic modernism is seen as the intellectual fruit of Islam's ulama and clergy studying the changes of the age. From Muhammad Abduh onward, through Jamal al-Din al-Afghani, Ali Abdel Raziq, and Rifa'a al-Tahtawi, people came to realise the Muslim world must reform its age-old ways of life and political traditions, or else be unable to withstand the invasion of Western powers.

Islamic modernists are not ostriches with heads in the sand, nor do they wish to turn the Arab world into an outcast cut off from modernity; but neither do they wish to abandon Islam's intellectual heritage and blindly follow everything the West preaches. They seek to combine the secrets of Western prosperity—the new ideas of the Enlightenment—with traditional Islamic thought, leading the Near East out of ignorance toward a golden age rivaling the West socially, culturally, and economically.

Islamic modernists do not follow the Salafi school preached by the Saudis of the Nejd, nor the secular nationalism or even heretical socialism of the so-called anti-colonial revolutionaries. They reject atheism and secularism, and refuse blind obedience to centuries of interpretation of Sharia—popular as it remains among jurists and ulama—seeking instead to re-examine and reinterpret the Qur'an's revealed text from a modern perspective.

Islamic modernists rack their brains to destroy the old feudal order and lay the foundations of modernity on pre-modern ruins. They want a democratic state operating within a "moral economy," with citizens as its sovereign. In such a state, the obedient faithful hold power and the fallen are aided. To shake off colonialism's chains, Muslims must build a harmonious society where all of God's creation, regardless of gender, faith, race, or class, enjoys equal dignity."
 liberal_conservatism_centrist_progressivism_subtype_desc: "Progressivism is not the monopoly of the left; some take other roads to its goals. Today many centrists—whether influenced by economic nationalism or realising that certain policies once denounced by conservatives as "too radical" are in fact right—have set out on the path of progress.

Supporters of centrist progressivism put forward this new ideology. Though on the progressive wing, it does not go further than the traditional centre-left. Centrist progressives act with deliberation; in their ideal, moderates who accept some leftist policies and leftists who are for now content with centre-left policy together form the bedrock of their support. Some therefore accuse them of merely deceiving leftists to win votes.

In some cases this is true. But it is also true that reactionaries will oppose centrist progressivism with the same zeal they reserve for the left. The reactionaries' fear is not unfounded: they know centrist progressives can build a grand coalition against their interests. And for the oligarchs, worse news: the trick of branding them pro-communist is largely useless, since many of them are in fact die-hard anti-communists."
 conservatism_agrarianism_subtype_desc: "From Jeffersonian democracy to Emiliano Zapata's Mexican revolutionaries, the ideal of "peasant supremacy" is nearly as old as democracy itself. Even today, in every society there remain countless parties devoted to raising the peasants' status; everywhere their priority is to place the peasantry—and strong traditional values—at the nation's forefront.

Typical agrarian nations share relatively simple, similar policies: promote self-sufficient agriculture, increase communal participation in national agricultural development, and improve the peasants' overall condition so that they attain an important national status—as they had at humanity's very beginning."
 conservatism_paternalistic_conservatism_subtype_desc: "Some societies yearn for equality, hoping all may voice their opinions equally and shape the world around them, while others embrace hierarchy, wanting every class to recognise its place and fulfil its duties. Paternalistic conservatism represents the latter.

Paternalistic conservatism values responsibility, honour, and the notion that the privileged are best able to care for the poor around them. It encourages humanitarianism and private charity, seeing the elite as benefactors who can guarantee economic opportunity for the lower classes. Though it supports social security systems and other government interventions to ensure working conditions for the poor, it strongly opposes anything resembling a command economy. It yearns to balance individual and state interests through the elite, bringing stability to society as a whole."
 conservatism_islamic_conservatism_subtype_desc: ""A Muslim's faith is not complete unless there exists a strong, independent Islamic state able to implement Sharia without opposition or external interference."

God chose Muhammad (peace be upon him) as His messenger and through him revealed the Qur'an to the world. It is not only an eternally perfect holy scripture but a treasury brimming with knowledge and virtue. Supplemented by the Prophet's Sunnah, the Qur'an outlines a sublime code that can replace all man-made law: Sharia.

Though rejecting Sharia means rejecting the word of God, Sharia is only a legal system, not a form of government. Many seize on this to oppose the backward, authoritarian rule of the nobility and ulama, preferring instead a purely Islamic democratic system—neither fully Westernised nor fully traditional.

Islamic conservatives support the people's right to be masters of their own affairs while firmly defending Sharia and its jurisprudential principles; they wish to continue Islam's age-old traditions, shielding them from the so-called apostasy of liberals, modernists, socialists, and Western forces.

For Islamic conservatives, only under the guidance of God's revealed code, united as a stable, democratic, and prosperous community, can the Ummah crush imperialism's tendrils and return to the summit of the world."
 conservatism_populist_conservatism_subtype_desc: "People often hold a stereotype of conservatives: whether against the far left or far right, the image of the stubborn, rigid, unchanging defender is deeply ingrained. But there is another kind of typical conservative, quite the opposite of the common view in many ways. To defend the nation and the people's will, these populist conservatives are noisy, radical, and extremely pragmatic—no less than socialist and fascist agitators.

Usually these conservatives not only do not resist reform but actively push reforms directly tied to the public interest. These reforms, however, often aim to curb radical sentiment and keep the status quo under long-term control.

Thus populist conservatives are most successful in rural areas, where they respect tradition while keeping a finger on the pulse of ordinary people's struggles. If mobilised well, these supporters can become one of the strongest forces in most nations—which is why such populists are often mocked as demagogues and hell-raisers."
 conservatism_christian_conservatism_subtype_desc: "Today's world is dim. Fascists dominate the fate of the continent and enslave the nations; horrors beyond the comprehension of our forebears fill modern society. No wonder so many cry "to hell with the future, long live the old days"—clearly the old days were far holier than now.

Though the separation of church and state is a relatively novel concept in the long course of history, most Christian conservatives firmly believe it is the ruin wrought by today's faithless, rabble-rousing politicians. It is but one of the world's many sins—an expression of mankind's abandonment of tradition and replacement of charity with anger. Tradition guides modern life: if the great men of the past lived by upright Christian values, what right have we to claim we understand these doctrines better than they?

Christian conservatives' social attitudes may lean conservative, but their economic positions vary. Many hold that state influence on the economy is a socialist excess best avoided, and that functions like welfare should be left to the church and generous charities. Others are more pragmatic, opposing pure laissez-faire and believing the state can extend a nurturing hand, encouraging—even instilling—Christian morality and suppressing the sparks of class conflict. These small disputes aside, they remain united by God and by their common struggle against today's totalitarianism—though whether religion can again lead the world, with the New Order at its height, remains to be seen."
 conservatism_progressive_conservatism_subtype_desc: "Conservatism is not monolithic. One might say conservatism is a hotbed in which many creeds take root, loosely united against the world's dozens or hundreds of other political ideologies. It is therefore no surprise that one conservative ideology should evolve to embrace values other conservatives deem "excessive."

Progressive conservatism is the work of those who seek compromise—or a means to reassure themselves and their voters—including welfare relief, social equality, and limited economic intervention. All this, without endangering the cornerstone that binds the nation and its traditions, eases social conflict, guides society and the electorate toward a healthier ecosystem, and avoids the earth-shattering change they still abhor."
 conservatism_silent_conservatism_subtype_desc: "In a world awash in radicalism and tyranny, the United States needs a steady, conservative hand to keep the nation from being destroyed by the current. To this end, Richard Milhous Nixon developed a conservatism unique to America, ensuring the nation continues to prosper and develop stably amid constant threats at home and abroad. "Silent Conservatism" takes its name from Nixon's appeal to the so-called "silent majority" of American politics; it also serves the interests of pro-Republican business groups and culturally conservative Democratic voters, creating a prudent, pragmatic approach to the Union's economic and social problems.

Though still conservative in essence, Silent Conservatism seeks to create a moderate alternative to reform, replacing what it sees as the naive liberals and ruthless reactionaries threatening American democracy. To oppose radicalism from both ends of the spectrum, Nixon seeks to appeal to the broad American electorate through wide-ranging populist rhetoric, flexible reform, and a paternalistic attitude toward the nation's citizens.

Because of Nixon's own pragmatism, Silent Conservatism is often reluctant to take hard positions on political issues, preferring to stick to the centrist ground of majority opinion on any given matter. While Nixon has so far largely succeeded in keeping the deeply divided Republican-Democratic coalition together, only time will tell whether his approach can keep walking the tightrope between the issues that continue to plague and divide the nation."
 conservatism_natural_conservatism_subtype_desc: "Americans have always distrusted a powerful central government. Thomas Jefferson feared that a strong government would undermine individual rights; in the Federalist Papers, James Madison repeatedly stressed that only a federal system can effectively restrain the abuse of governmental power; even John Adams held that "whoever would establish a nation and enact laws must assume that men are by nature evil."

Natural conservatism is the latest work of this current. Centred on the Sun Belt, natural conservatives worry that the ever-expanding modern welfare system will ultimately harm their communities. They believe that only when each level of government can act on its own, free of outside interference, is humanity's most "natural" form of organisation achieved; moreover, the federal government's duty is not to impose standards or manipulate society's structure, but to remain as unobtrusive as possible, intervening only to protect individual rights and promote commerce.

Of course, different natural conservatives envision society very differently: chambers of commerce see the protection of free speech and economic freedom as paramount, while the Deep South will seize the chance to push theories discriminating against minorities. Only time will tell whether these groups can coexist peacefully, and what consequences their conflicts with outside organisations will bring."
 conservatism_urban_populism_subtype_desc: "Modern society is rife with ills. Many Americans believe these problems are deep-rooted and insoluble. Millions look around and see injustice everywhere, while liberal democracy stands helpless. So domestic experts have proposed a modern approach that has attracted a large following. This is modern conservatism.

Modern conservatism, promoted mainly by moderate Republicans like George Romney, holds that solving today's political chaos requires the expertise of "model citizens." Thus it firmly believes in the importance of volunteerism and actively engages with the nation's think tanks, non-profits, and businesses. Its supporters prefer "evidence-based policymaking" over moral principle and ideological dogma, favouring massive expertise, precise calculation, and eventual consensus over party-driven, lived-experience policies like flat income taxes and housing desegregation.

Though popular among managers, this ideology neither stirs the blood nor wins debates. On the contrary, modern conservatism is often seen as corporate rule, technocracy, and paternalism, which can alienate liberals and rural conservatives alike. Can this new movement persuade the sceptics, or will it only deepen public alienation? We shall see!"
 conservatism_prairie_populism_subtype_desc: "As a political creed, prairie populism is born of the traditions and material circumstances of the frontier, insisting on the wisdom and honesty of the common people against the immoral corruption of the elite. Prairie populists praise the virtues of the common folk and stand with them in condemning the so-called misdeeds and dishonour of the powerful, blaming society's ills and the government's failures on those who rely more on money and connections than on reason and decency. In their eyes, the selfish elite are out of touch with the ordinary men and women who toil—the former's errors breed society's problems, and only by stripping these elites of power can such problems be solved.

Prairie populist leaders tend toward pragmatic, "common-sense" governance, flexible in policymaking and putting the people's will first. They can advocate moderate or even progressive solutions to economic and social problems, though often laced with moralism and reverence for tradition, opposing radical, revolutionary changes to the social structure. At the same time, they firmly believe in democracy and national institutions; what they wish to demolish is the corrupt officials and do-nothings who soil the halls of power, not the halls themselves. Their slogan, most representative of workers and farmers, is: "Throw the rascals out!"—a powerful call for those marginalised by government and feeling deceived and belittled by politicians."
 conservatism_goken_conservatism_subtype_desc: "Japan's political environment is unique and full of unwritten rules. Goken (constitution-defending) conservatism was born of the Goken movement of the 1910s, attempting to build representative democracy while observing all the unwritten rules. For instance, "democracy" can be translated into Japanese as "national sovereignty," a challenge to the theory of imperial sovereignty that naturally violates taboo; "goken" (defending the constitution) sidesteps the sovereignty question and is a perfect substitute. It historically focused on defending the popular rights granted by the Emperor and outlined in the Meiji Constitution against the machinations of evil forces like the genro and the Tōseiha officers.

Undoubtedly, as a branch of conservatism, Goken conservatism upholds many traditional values—patriotism, traditional gender roles, and an aversion to Western-style democracy. Its adherents seek both to ensure, through electoral politics, that state policy reflects the people's will, and to interpret that will according to the theory of imperial sovereignty. Though its narrative makes it especially vulnerable to the constitutional loopholes that empowered the Emperor in the Meiji era, it is still an attempt to restart the Taishō democracy experiment that collapsed midway after a decade of totalitarian politics."
 conservatism_liberal_corporatism_subtype_desc: "A century ago, the classical liberal ideas of Adam Smith, John Stuart Mill, and David Ricardo seemed at last to reach their end, and the future of European capitalism faced a fundamental challenge. As the Nazi flag flew over the streets of Paris, Moscow, and London, cheering on cold Bismarckian collectivism, liberal philosophy fell apart. Those few who still clung to capitalism could only rely on rigid authoritarian regimes as instruments of rule, destined merely to entrench the dominance of the Prussian "family state."

Liberal corporatism originated in the early twentieth-century compromises between Scandinavian governments and trade unions, a distinctive continental European model of capitalist development. A liberal corporatist order can only arise spontaneously when government can solve the problem of "co-determination" and overcome the resistance of entrenched labour and capital. Efficient enterprise bargaining is its core, and democracy becomes a question of efficiency. Social politics raises organisation and productivity; labour disputes become "non-political" issues. The stronger the unions as monopoly interest groups, the more attractive free-market ideas become to them.

The old socialists found their ideas abandoned by the fast-developing economy, and central planning lost its persuasive power. The radical formula propagated in the works of the Acton-Tocqueville Society may find suitable adherents among Europe's "new" capitalists. The state will act as the free market's arbiter, promoting its vitality, ensuring its equality, and preserving its wealth. Whether this so-called "neoliberalism" can find a way out of the unstable balance of citizen welfare remains to be seen."
 conservatism_oligarchic_conservatism_subtype_desc: "In the past, the people did not rule themselves, but were led by enlightened sovereigns chosen by God's omnipotent reason, leading the people for their own good and that of others. So it should be, and ever shall be.

Now, with the New Order over the world, emperors, kings, and queens are relics of the past. Yet the powerful have found new ways to guide the masses through modern democratic means toward the outcomes they desire. Even the most reactionary must learn to keep pace with the times, if only to rule effectively. Thus the new oligarchs of the kind described have chosen to accept liberal democracy—all the better if they can hold it firmly in their grasp. Their ideal state will carry on the guiding philosophy handed down from aristocracy to oligarchy, leading the nation toward a loftier ideal of life.

Oppression and repression are skills the oligarchs inherited from their forebears, and tools of their power. Elections are no exception—but if the pendulum of power swings against them, the oligarchs will also accept fair defeat, licking their wounds while plying every worn-out trick to return. In the end, they know they can never win the voters' hearts, but when the truth shakes the ballot box, the oligarchs know the voters will make the right choice for the nation and its people."
 conservatism_right_kemalism_subtype_desc: "For decades, Kemalism has almost dominated Turkish politics, with left, centre, and right all marching under its banner. In recent years, however, Turkey's left has drifted from Kemalism's Western-style democratic ideals, mainly because Kemalists prioritise nationalism while underinvesting in social welfare and development. In response, many Kemalists have chosen to emphasise the nationalist component of their ideology and Atatürk's legacy, repositioning Kemalism toward the centre-right and taking another step toward nationalism. Unlike their more welfare-oriented left-wing counterparts, right Kemalists value democracy and statism, competing with other more conservative groups through the discourse of national unity."
 conservatism_free_market_conservatism_subtype_desc: "By definition, market liberalism holds that government intervention in the nation should be kept to a minimum. As long as the state uses its power for regulation rather than control, free competition and social operation can achieve the best self-regulation under current conditions. But the main difference between classical market liberalism and its conservative branch lies at the social level.

Supporters of free-market conservatism have this trait: they support lowering tariffs while preaching traditional family values; they support shrinking the bureaucracy, so long as it does not let those "troublemakers" appear where they would harm the nation; in most cases they support reducing economic regulation, while imposing extra tariffs on nations whose values clash with theirs.

For them, the "freedom" of market liberalism lies at the economic level. On other matters, clearly, the conservatives do better."
 paternalism_Herrenvolk_Democracy_subtype_desc: "In a fair, democratic nation, individuals of every race can vote and exercise power. Yet this is not universal among democracies; biased systems still exist. "Herrenvolk democracy" is often the product of a colonial settlement system's transition to self-governing democracy, while preserving—even in some cases expanding—the racial segregation of the colonial era.

Democracy is for the "Herrenvolk" (the "master race"), regardless of class or social status. Though this seems contradictory, its supporters see it as democracy's natural state. To them, racial equality is a myth—and so democracy remains the privilege of the "master race," the so-called elite of the racial pyramid. In their eyes, true equality can only be achieved through racial segregation.

Sophistry aside, Herrenvolk democracy conceals a simple truth: for those outside the master group, it is often little more than oligarchy in sheep's clothing."
 paternalism_Institutionalized_authoritarianism_subtype_desc: "In economy, politics, and daily life alike, the Führer should remain the nation's guiding, intervening hand. He yearns to lead France into a new era as a "great" and "wise" ruler. To this end, he does not shrink from any stratagem—harsh or gentle—all being means to his grand design. The people are almost puppets on his strings, while he, a captain at the helm, steers the great ship through the waves with firm will and seasoned judgment. Surveillance and manipulation will seep into every corner of the Frenchman's daily life, a reality they must accept and endure.

Only by concentrating power in a single capable individual—or a united, talented political clique—can the nation's problems be efficiently solved, avoiding the endless, fruitless debates of old. Yet concentrating power in few hands invites self-interest; on the other hand, to consolidate authority, rulers often strike secret deals or pay political bribes, breeding corruption within the system. Thus authoritarian rule and the nation's fate are tightly intertwined. In his ideal France, power is highly centralised, guided by politicians versed in the art of rule, and the economy also accepts the state's firm hand."

 paternalism_national_conservatism_subtype_desc: "Nationalism proved its might in the twentieth century, shattering Frankensteins like Yugoslavia and the Soviet Union. Thus consolidating the nation against fifth columns of every sort became necessary—else a nation might, like Austria, become a mere footnote of history.

For national conservatism, unity is the overriding goal. And what better way to achieve it than to rally the whole people around the world's greatest nation—our nation? Opposing the state is unforgivable; only unity is the right path. Tradition is the ballast that maintains a stable social structure, never to be abandoned unless clinging to it would ignite class struggle. Economically it adopts flexible orthodox policies—corporatism, state intervention, even the free market, whatever narrows the class gap; rigid elite doctrines only harm national unity.

Though most national conservative governments either tolerate or directly cooperate with fascist states, they generally consider themselves above fascism, seeing it as an affront to the natural order. Despite firm right-wing beliefs and nationalism, it is more conservative than extreme. The faint connections between the two show mainly in their attitude to democracy. After all, when so many other nations have cast off democracy's cloak, what is wrong with sacrificing a little to protect one's own people's future?"
 paternalism_National_Republicanism_subtype_desc: "National republicanism holds that the republic is not one option among forms of government, but the sole legitimate institutional expression of the national community. It is neither a continuation of monarchy nor a variant of parliamentary democracy, but the common negation of both. Monarchy means the chance privilege of blood; parliamentarism means endless factional strife; the republic means the national will cast into institutions, no longer subject to personal ambition or the tyranny of the majority.

This idea is not of continental origin but of England itself. In 1649, Cromwell proved one thing: the nation needs no crown. Order need not depend on heredity; authority can come from duty itself. Three centuries later, this principle was rediscovered and institutionalised—the republic replaced the crown, civic duty replaced subject loyalty, and the state ceased to be the private property of a family, becoming the common enterprise of the whole nation.

Within national republicanism, the citizen is not an isolated individual but an organic part of the community. Rights are not natural but derived from duties—you are first a servant of the republic, then its beneficiary. Political life is permitted within the republic; different voices may speak, but all must echo in the same direction. Pluralism is not an end, but a managed reality.

The republic rejects class struggle, for the national community recognises no class divisions. It rejects laissez-faire, for freedom without guidance leads only to decay. It likewise rejects nostalgia for the past—the crown has been removed and will not be restored.

The revolution is complete. The republic is established. What remains is only the duty to defend it."

 paternalism_social_nationalism_subtype_desc: "The worst crime one people can commit against its kin is colonialism. To colonise a land, enslave the generations born there, and turn their nation into a machine for private gain is, in effect, to strip those people of the right to live. It eats away the colonised nation's soul, leaving only an empty shell. And the colonisers? They become rats in the granary and borers in the timber, their own society losing the ability to develop normally. Whether the deeds of Americans and Europeans in Africa or the Japanese atrocities in Asia, all merely repeat this law for the world to see.

Justice will not be absent forever; crimes must be judged, and the most direct answer to brutal colonialism is social nationalism. Unlike the nationalism that spawned Nazi Germany and Shōwa fascism, social nationalists take the whole nation's united struggle against colonialism as the nucleus of national unity. They unite the people not through racial or cultural superiority but by stressing the necessity of defeating foreign national oppression. Though social nationalists remain pragmatic on economics, most also support building some form of socialist economy on their own soil.

In the first postwar decade, social nationalism was crushed by the combined strangulation of German and Japanese colonialists—but the situation is changing. If the social nationalists can play their current hand well, there is still a chance for a turnaround."
 paternalism_oligarchy_subtype_desc: "Oligarchy—rule by a small clique—comes from the Greek "oligos" (few) and "arkho" (to rule). Cut off from the common masses, the oligarchs may be immensely wealthy, monopolise education, command force, or hold political power; for various reasons they keep control of the majority. Such governments may be established by legal mandate, under the guise of a provisional government or state of emergency, or through illegal and covert means. Though some oligarchic power is hereditary, the rule is not universal.

Oligarchies arise for different reasons. The upper class's growing power may hand the reins to the elite, after which the rich dominate the government openly or covertly; or after a coup, a victorious general may entrench his faction or the military's power nationwide.

Though the ruling groups of different oligarchic states vary greatly, their tight control over the common people never does. Civil liberties are usually strictly limited, and voting at any level is closely monitored. Some oligarchic states, however, maintain a carefully designed—or falsely practiced—decorative democracy. Rigged elections lend such states a democratic façade, but the common people can never shake their leaders by even a hair."
 paternalism_solidarism_subtype_desc: "Solidarism, the ideology of Vyatka's Solidarist National Union, strongly opposes communism, seeks a twentieth-century solution to contemporary problems, and rejects a purely materialist approach to social, economic, and political issues. It also advocates solidarity and friendship between classes, Christian tolerance, and charity. It claims to encourage democratic participation in government (whether or not a Russian monarch is restored) and to promote individualism and civil liberties. The solidarists' ultimate goal is a second revolution: they say they march "neither left nor right, but forward," seeking Russia's rebirth without retracing the mistaken roads of the Bolsheviks and the Tsar.

Opponents argue that solidarism shows corporatist tendencies and an excessive eagerness to achieve "moral and spiritual rebirth" through "temporary" autocracy. To critics, its resemblance to Italian fascism, Salazar's Portuguese corporatism, and pre-Anschluss Austria is striking and troubling."
 paternalism_dixiecrat_subtype_desc: ""Dixiecrat" (a portmanteau of Democrat and Dixie) is a catch-all term for the political factions and figures of the American South who were once Democrats but for various reasons defected to the far right of the National Progressive Convention. The term was first coined by a journalist in 1948 to describe the States' Rights Party that Richard Russell founded in Georgia for that year's presidential election, but it has now become shorthand for the southern faction of the Convention.

Economically, the Dixiecrats are deeply divided; many follow the rural populist tradition represented by Huey Long, Thomas E. Watson, and Benjamin Tillman, while others follow traditional liberal or conservative economic policy. But their differences aside, they are united in opposing civil rights and federal interference in "the internal affairs of the states."

Depending on the candidate, the Dixiecrat base may be white labourers, southern industrialists and business owners, social conservatives, or the entrenched agricultural magnates who still control southern politics a century after the Civil War. Many remember the "horrors" of Reconstruction and are determined to use whatever power they hold at every level of government to maintain segregation—by any means necessary."
 paternalism_corporate_paternalism_subtype_desc: "Among the many civic duties of a corporatist state, earning profit for investors and corporate experts stands above all. To adapt to the international environment, most corporate states maintain the form of the nation-state, their rich fruits accumulated through the labour of countless "employees"—the people, silenced machines, endless profit.

Among these corporate elites a heterodox idea has sprouted, challenging the traditional notion that capital can only be an exploitative enterprise opposed to labour. Its advocates stress the stability brought by "reasonably" reflecting labour's needs in business decisions, whose returns exceed purely economic interest; in the long run, a contented workforce creates more value.

Though such labour relations are not uncommon in capitalist society, the peculiar political system centred on the corporation inevitably gives this economic doctrine major political weight. Its advocates envision the government playing a broader role in providing public services for the new "citizen-employees," in exchange for their labour and their acceptance of corporate and market domination of public life."
 paternalism_social_credit_subtype_desc: "Social Credit is an economic theory proposed by the British engineer C. H. Douglas after the First World War. In the 1920s, he argued that depressions arise from the gap between the market price of goods, their production cost, and producers' wages. He noticed that merchants always sell their goods far above what their own workers can afford; this artificial scarcity for profit breeds poor working conditions, and falling consumer spending hampers growth. Douglas therefore called on governments to distribute money—"social credit"—to consumers to narrow the gap between products and purchasing power, boosting spending and growth.

In Canada, Douglas's theory, together with Christian fundamentalism, formed the program of right-wing populism. The Social Credit Party's reverence for individualism and enterprise is nearly equal to its worship of Christ; it calls for direct credit to consumers and producers to massively expand the money supply, and condemns the national debt system as a tool for international bankers to loot the economy. Though advocating the free market, it fiercely opposes moral free choice; Social Credit members are extreme opponents of counterculture, believing their conservative reading of Christianity should become Canada's official doctrine. Some even praise the economic policies of the two Iberian caudillos and Italy's late leader—so progressive Canadians worry greatly about where the party may lead the nation."
 paternalism_semi_constitutional_monarchy_subtype_desc: "As absolute monarchy lost ground worldwide and was replaced by constitutionalism, a different option appeared. While in most constitutional monarchies power is granted to officials, the state administration, and the legislature, in a dyarchic (semi-constitutional) monarchy this is not the case.

In this system, restraints on the monarch's power are few and often formal in practice, allowing the monarch enormous power to interfere in both executive and legislative affairs by personal will. Semi-constitutional monarchies are often established by monarchs themselves, wishing to improve their image without surrendering existing power. Though not as unconstrained as absolute monarchy, the monarch remains ultimately immovable, and the state remains under his domination."
 paternalism_peronism_subtype_desc: "While the world's eyes were fixed on the falls of London and Moscow, Colonel Juan Perón was relegated to a backwater post in Argentina—Minister of Labour and Welfare. Yet he accepted gladly.

Perón had already calculated that this was only the first step of his ambition: to secure control of the working class and the unions, incorporating them as a whole class into the political system, so that Argentina might escape the communist spectre. In pursuit of this, Colonel Perón drew in supporters of every stripe—socialists, conservatives, Christian liberals, even fascists—all gathering around the rising star. Their views gradually intermingled, finally giving birth to the ideology that bears Perón's name. Which faction's view prevails on any given day depends entirely on Perón's own will. Yet years of backroom dealings, inside and outside government, have stretched and twisted Peronism's meaning almost beyond recognition.

Peronism—or officially "Justicialism"—aside from its vagueness, retains a few recognisable traits: reverence for the ignorant masses who resist the decadent oligarchy, an economic fondness for nationalism, and respect for the unions—these are nearly all that remain. Of course, these traits also give Peronism the possibility of outliving its founder in some form, despite its original personalist colouring."
 paternalism_kemalism_subtype_desc: "As its name suggests, Kemalism is rooted in the ideals of Mustafa Kemal Atatürk, founder of the Turkish Republic. Born of the rejection of the backward ideas of the late Ottoman Empire, it seeks to build a modern Turkish nation-state on six principles: republicanism, populism, nationalism, secularism, statism, and reformism. Kemalism's ties to democratic principles have always been fragile; the official ideology of every governing and opposition party must be Kemalism. In the decades after the Second World War, Turkish nationalism among the six principles has been increasingly emphasised—both as a gesture toward fascist European powers and as a counter to domestic far-right forces."
 paternalism_provisional_government_subtype_desc: "The end of conflict does not mean the end of war. Its scars remain, and the risk of renewed chaos or regime collapse still threatens the people. In the ruins, people establish provisional governments to carry out a transitional mission.

After a long period of chaos, a provisional government works to rebuild social order and the rule of law. Endless war, the bloodshed of revolutionary waves—the quasi-anarchy left by the previous era is swept away, and the relative stability under its rule brings comfort and cheers to the exhausted people. Past conflicts are set aside, and a nationwide political dialogue reopens so that the provisional government can draft a new legal framework for the permanent government to follow. It does much in national reconstruction: reviving long-neglected, corruption-eaten state institutions, reinterpreting the law, assessing the nation's wounds, and devising rebuilding plans through political and economic means, dealing with the old regime's mess through practical measures. They hope their efforts will set a fundamentally shaken nation fully back on track and free the people from lingering fear."
 paternalism_right_wing_populism_subtype_desc: "Contrary to what some believe, populism is a double-edged sword. Driven by the left, it can cry out for social equality and justice on the people's behalf; in the hands of the right, it becomes a tool to seize power—making it hard to classify under any single ideology. Yet there are always exceptions.

Right-wing populism is one. Several easily identifiable core claims set it apart: first, its anti-elitist stance, claiming the upper elite are corrupt, insatiable, and opposed to the people. Unlike left-wing populism, however, right-wing populism holds that these elites may also represent the interests of the nation's ethnic or minority groups. At the same time, right-wing populists believe the state must still guarantee welfare, even at the risk of harming economic development.

Though most right-wing populists embrace economic populism, they are generally conservative on social issues—indeed a fair portion openly declare themselves anti-communist. Combine all these traits, and right-wing populism is a menace without end; yet for now the populist wave seems to roll forward unstoppably. Only God knows when it will recede."
 paternalism_anocracy_subtype_desc: "The term "anocracy" is broad, applied to governments around the world. When a regime sits between democracy and dictatorship—yet is more complex than that description—scholars call it an anocracy. They usually argue it is the result of incomplete democratisation or its interruption; former authoritarian states on the road to democracy can be classed as anocracies.

In other words, the opposite may also be true—the world has often seen democracy's decline. From corrupt presidents to military juntas permitting partial democracy, this is nothing new.

How long an anocracy lasts varies by nation. Some are short-lived, sliding rapidly from democracy into dictatorship, or vice versa; others sink into stalemate, persisting for years. All depends on the struggle between the people's will and the dictator's."
 paternalism_left_wing_corporatism_subtype_desc: "Corporatism is a collectivist ideology, originating from the Latin corpus (body), advocating the organisation of society according to the common interests of social groups. Its ultimate goal is a society of class cooperation under state leadership, opposing the class struggle preached by communism.

Unlike technocratic and fascist corporatism, left-wing corporatism softens on racial matters. It is willing to cooperate with leftists, or at least to absorb some leftist ideas. This may stem from genuine belief in left-wing thought, or simply from seeing no other way to silence the proletariat."
 paternalism_transitioning_democracy_subtype_desc: "Democracy is not merely a system but a social ideal. It must therefore undergo a process of growth, cultivation, and development. This is the purpose of a transitioning democracy.

At this stage, democratic institutions are either not yet consolidated or still rudimentary. Political and civil rights—freedom of speech, assembly, and the press—are restricted but beginning to be realised. The police and military still wield considerable influence, often clashing with civilian government. Thus the essence of a transitioning democracy is its yearning for freedom and freedom's future.

Many reasons drive a nation's transition to democracy. Old officers may have launched a long-awaited revolution to consolidate power, or an old government may have pragmatically accepted a new ideology. In any case, a transitioning democracy is like a fledgling eagle—any blow may break its wings. But if it safely weathers this period, it can grow into an eagle soaring over the world."
 paternalism_paleoconservatism_subtype_desc: "Though paleoconservatism is an ideology in its own right, it is more a reaction to America's other political ideas. When liberals celebrate abortion with drumbeats, paleoconservatives loudly protest; when so-called conservatives hand city councils to godless commies, paleoconservatives firmly object, crying, "This cannot go on!" Their resolve stems from their belief that they represent the core of the American family: a married couple, two children, and a white picket fence.

Paleoconservatives believe Americans have forgotten their essence: schools should teach Christian doctrine; women should marry men; wives should follow their husbands' wishes; boys must act like boys. The Reds want socialism? Fine—but they can go elsewhere; Americans celebrate freedom, not false equality. Blacks want whites to build them big apartments with tax money and let criminals run amok in quiet neighbourhoods, but paleoconservatives firmly resist: "Not in my backyard! They'll only take a mile."

Foreign intervention will become a thing of the past; everything will focus on domestic affairs. The working class need no longer fear that government will take their income, freedom, and culture. But liberals think otherwise, brazenly plundering ordinary people: they strip religion from schooling, tear children from parents, and trample everything this nation takes pride in. Paleoconservatives watch all this and vow they will not strip religion from education, for "In God We Trust." American families will no longer stay silent; they stand tall and cry "I stand for mom and apple pie," and the wheel of history rolls slowly forward—America can rest easy."
 paternalism_poujadism_subtype_desc: "Pierre Poujade, an ordinary paper manufacturer of Saint-Céré, could bear it no longer. He had had enough of the greedy financiers lording it over the people; enough of France's miserable state; enough of the National Party's high-handed rule. Enough! He had had enough! But what could he do?

Poujade was not one to perish in silence, so he began to preach openly. Down with the tyranny of transnational finance, down with their puppets in politics! Down with the big banks, down with the heads of the Judeo-Masonic lodges! Direct democracy now—of the people, by the people, for the people!

Astonishingly, no matter what the elites did, the people still sat and listened to Poujade. Tired of the decay of Pétainism and unswayed by technocratic sweet-talk, the people awoke. They sent Poujade to the centre of state power. The era of the new state system had come at last.

Now France is ruled by an ultra-populist coalition gathered around the personality cult of Pierre Poujade. Pro-free-enterprise, anti-transnational-finance; pro-traditional-values, anti-decadent-liberalism; pro-direct-democracy, anti-corrupt-politicians.

All for France, and enemies to all who would harm her."
 paternalism_paternalistic_developmentalism_subtype_desc: "Unlike other authoritarian regimes, paternalistic developmentalist regimes are usually produced by relatively democratic elections; they do not deny their responsibility to the voters and acknowledge the people's right to political participation. Yet when it comes to the great goal of economic growth—for the sake of improving the wellbeing of all—paternalistic developmentalists feel justified in temporarily suspending "politically excessive" democratic rule and free speech to maximise development.

In short, a paternalistic developmentalist regime's legitimacy depends on the leader's ability to sustain growth, not on his voters' ballots. If the leader fails to deliver, he is usually either forced out or tries to hold power by writing the people an even bigger cheque, redeemable later.

Most of the time the latter is extremely risky, because the masses support the regime only for their own benefit, "selling" their rights for wealth. If the leader keeps issuing unpayable cheques, he will face threats inside and outside government—and his fate may well be worse than simply accepting a peaceful transfer of power in the first place."
 paternalism_herrerism_subtype_desc: ""In short, we must never sink to the level of the brown-shirted Nazis, nor become yet another star on the imperialist banner."

To be a true Herrerist is not merely to follow the political blueprint drawn by Dr. Luis Alberto de Herrera, but to reawaken the caudillo tradition that dates from the nineteenth century. A Herrerist must remember the deeds of Manuel Oribe, who fought valiantly against the intervention of European powers in the River Plate basin, and of Aparicio Saravia, whose struggles gave the common people true political representation. Herrerists are steadfast guardians of the liberal-conservative tradition; they will not bow to the radical Jacobins. They are the true champions of social justice: so long as the government devises pretexts for its flashy projects, or drains the rural population's pockets to feed the insatiable greed of city-dwellers, they will rise up, striving to build genuine government transparency and accountability.

Herrera's supporters believe themselves true nationalists. They stood firm when Anglo-Saxon culture eroded Spanish tradition; they never flinched when America sought to turn their homeland into its backyard. Though some radical Americanists are insufferable, Herrerists clearly recognise that they must cooperate with nationalists like the Sandinistas to fight Latin America's true great enemy—the United States—believing this the only road against oppression.

Yet in their opponents' eyes, the Herrerists are controversial. They have left many stains on liberal democratic principles, and their fondness for anti-democratic ideas is hardly concealed. Like other caudillo movements, Herrerism shares the same weaknesses. Now Dr. Herrera lies buried six feet under; without his guidance, the interpretation of Herrerism has fallen into the mouths of the new caudillos, plunging the Herrerists into endless infighting."
 despotism_Postcolonial_Elitism_subtype_desc: "Postcolonial elitism is common in the politics and society left after the collapse of colonial systems, usually found among the upper bureaucracy, urban bourgeois class, colonially educated intelligentsia, and technocratic elites of newly independent states. This group advocates continuing existing institutions, absorbing the former colonial power's administrative experience, and integrating into international capital and the global market, in order to achieve modernisation and social stability.

Many critics hold that postcolonial elitism is only an "imitation" of colonialism. Power has been localised, but the social structures left by the colonial era have not truly changed. It may continue to reproduce the old class stratification, cultural hierarchy, and ethnic prejudice, leaving the politically independent nation still dependent on the old colonial centre in economy, culture, and discourse. The state apparatus is held by the native elite, but social relations, consumer tastes, standards of knowledge, and developmental goals remain deeply shaped by the colonial era.

To its supporters, however, a newly independent nation needs swift international recognition. The native elite familiar with Western education, law, finance, and diplomacy are thus seen as best suited to lead the nation's transformation, understanding national development as finding a place on the margins of the global system."
 despotism_Three_People_Principles_subtype_desc: " "
 despotism_Pan_Asian_Three_People_Principles_subtype_desc: "Pan-Asianism is not imperialism; the evil colonial forces of the old West must be ended at this starting point."
 despotism_absolute_monarchy_subtype_desc: "Absolute monarchy describes the ideology in which the monarch holds all power, all governmental authority under his supervision. The monarch usually delegates day-to-day decisions to ministers but reserves the right to overturn or reverse them at any time. This system's history stretches back thousands of years, among the world's oldest political institutions.

From antiquity through the long medieval era, the monarch's control gradually weakened as the nobility's power grew; in some cases the nobility were only nominally loyal. Yet as Eurasia's feudal age drew to a close, this trend soon reversed.

As kingdoms and empires centralised, the nobility's power was reclaimed by monarchs and their ministers, especially in Europe. Though European monarchs' power was constrained by the turn to constitutionalism, absolute monarchy has stubbornly survived in the Middle East, Asia, and Africa. Today, in an age when the whole world craves hope, some may come to see monarchy as a saviour. As the great Sun King Louis XIV said: "One king, one law, one faith.""
 despotism_military_junta_subtype_desc: "A military junta is a government in which the military directly holds political power without any democratic form. It usually means the military has set aside the constitution and its provisions, allowing itself to force the whole nation to obey military rule at will.

A hallmark of the junta is oligarchic dictatorship: political power rests mainly in the hands of a few military leaders rather than one person. In some cases a civilian apparatus may continue to function, but under the junta's supervision or guidance. Juntas generally rule openly, maintaining legitimacy through promises of future democratisation or the recovery of lost territory.

Juntas usually take power through a coup, though occasionally a government in crisis must invite the military to take control. Beyond emphasising the maintenance of military force and national security, different juntas' politics vary widely with circumstances. Yet all share one belief: the soldier exists to defend the nation, not to serve it."
 despotism_civilian_dictatorship_subtype_desc: "Life without authority is nasty, brutish, and short. The experience of recent decades shows that democracy cannot maintain peace or resist chaos. Freedom was given a chance, but sterner measures proved necessary.

A civilian dictatorship usually wears a thin veneer of respectability—a dominant party as a means of control, a constitution tailored to the dictator's needs or exploited for indefinite rule, and written statutes meant to preserve stability—these small ornaments are the regime's "carrot." Yet these symbolic gestures toward true freedom are inevitably seen through, and the dictator must wield the stick to keep order. The security apparatus detains and persecutes any who oppose the government; the law is twisted nearly beyond recognition; imprisonment, torture, and execution maintain authority against threats—all an acceptable price for order and stability.

Politically, such regimes often lean right, favouring traditional values and concentrating economic power in friendly institutions. Yet they often pragmatically adopt such ideological elements to further entrench power, diluting or discarding them when convenient. In the end, though most civilian dictatorships are not established merely to seize power, they tend to abandon their goals and wield the instruments of rule indefinitely."
 despotism_theocracy_subtype_desc: "A theocratic government explicitly sets God or other deities as its supreme authority and openly claims divine mandate, exercising secular functions through earthly institutions. Thus such a state's organs of power are composed largely of clergy, and the religious doctrine, creed, and scripture it follows usually dominate policymaking and implementation.

Theocratic states usually feature: large-scale religious ritual; a national or parish system; and extremely high civic religious participation, whether voluntary or coerced. The religion the state follows, and the ruling class's interpretation of the divine, largely determine foreign relations. Whether they truly act so, or merely claim to for other purposes, only time will tell."
 despotism_papacy_subtype_desc: "Among the world's many ideologies, the Vatican is unique, practising a distinctive polity that blends elements of monarchy, theocracy, and semi-democracy into a coherent whole. The Pope is not chosen by inheritance or blood but by the College of Cardinals—the Catholic Church's senior bishops—in a secret conclave held to elect the next Pope, elected for life.

Once elected, the Pope becomes the leader of the Holy See, Vatican City, and the Catholic Church, granted the authority of an absolute monarch. His prestige and authority are immense, transcending traditional borders thanks to Catholics worldwide. Though it can hardly be called substantive power, this gives the Pope's words more weight than those of some heads of state—and for this reason few nations openly make an enemy of the Vatican."
 despotism_interim_government_subtype_desc: "An interim government, also called a caretaker government, is fundamentally a temporary regime existing only between more formal governments (whether democratically elected, produced by a coup, or otherwise). It is usually established quickly after the fall of its predecessor, but whatever the reason for that fall, an interim government's inherent legitimacy is generally low. If it is not soon replaced, domestic chaos and unrest will surely follow.

Even when apolitical, such governments are often relatively authoritarian, mainly to ensure the status quo of state institutions is maintained until their successor formally takes power. They are also unlikely to have the political will or capacity to carry out any meaningful policy. In essence, the nation remains "frozen" until the interim government is replaced."
 despotism_colonial_government_subtype_desc: "Empire is one people lording over myriad peoples, one nation gazing down upon the masses—overlooking its dependencies, yet by no means sustainable through national spirit alone. After all, hegemony forged in blood must be defended in blood. To sacrifice the freedom of the few in the name of the many's progress is a small price.

A colonial government is the empire's core instrument for maintaining oppressive rule. Its administrative centre is held by governors and bureaucrats sent from the mother country, a force wholly unaccountable to the vast majority it governs. Their justifications vary—the "civilising mission," claiming natives must be educated before self-rule, or the frank need to extract resources forever to feed the empire. Traditionally, this legitimacy rests on three things: guns pointed at the crowd, the noose for traitors, and jackboots on the backs of the resigned.

To keep order, colonisers often combine the native educated class with the threat of force, using collaborators in the traditional hierarchy to pacify the people. These lackeys willingly work within the colonial framework to secure their own positions, knowing well the serpent they appear in their countrymen's eyes—but so long as the master grants them a place, or even power, they can survive, at least for now."
 despotism_baathism_subtype_desc: ""One nation, bearing an eternal mission."

Ba'athism, born of the ideas of Michel Aflaq and Zaki al-Arsuzi, is an Arab revolutionary nationalist current aiming to achieve the "resurrection" (Ba'ath) of the entire Arab world through revolution against foreign oppression. Ba'athists fuse pan-Arabism, Arab socialism, and secularism into a single ideological program, seeking through revolutionary struggle to mobilise and ultimately unify the whole Arab nation—a unity transcending religion and region.

The Ba'ath Party serves as the vanguard of the Arab nation, accelerating its progress and spreading resurrection through every facet of society. On the surface its goals are modernisation, freedom, and—by Aflaq's definition—a socialism "suited to the Arab world." As champions of modernisation and progress, the Ba'ath Party opposes not only foreign rule but also the feudal and elite forces rampant across the Arab world. Yet freedom in the Ba'athist sense does not necessarily mean free parliamentary democracy, which risks subverting the revolution; and they replace the Marxist idea of class struggle with the national struggle against colonialism, seeing "Arab socialism" as a means to resurrection rather than an end in itself.

In fact, the ideological purity of the various Ba'ath parties across the Middle East varies widely, their cores deeply shaped by local traditions and foreign political theories. From advocating militarism to promising representative democracy and socialism to the masses, the policies of the movement's branches are diverse; their sole common goal is a unified Arab state stretching from the Atlantic to the Gulf."
 despotism_eurasianism_subtype_desc: "Eurasianism is a peculiar nationalist ideology whose core is the Eurasian "super-ethnos": the social concept that all Eurasian peoples from the Carpathian Basin to the Mongolian steppe must unite into a single socio-political entity to foster national strength and resist the destructive encroachment of outside forces. Through perfected theory and practice, the "enterprising spirit" of the Eurasian peoples will be fully unleashed, achieving greatness for society as a whole.

The theory's key concept is the historical relationship between the Russian people and the West. Eurasianism rejects the idea that Russia is a European nation, holding that, owing to its ties with the Mongols and other Asian peoples, Russia must not mingle with Western culture; Eurasian unity is seen as a means of resisting Western influence and fostering cultural development. Eurasianism encourages greater contact among Eurasian peoples, strengthening ties with Asia rather than Europe, and firmly opposes "parasitic internationalism" and European concepts deemed outside the super-ethnos."
 despotism_corporatocracy_subtype_desc: "Across the developed world, though private capital and the public interest are always in tension, in the great majority of cases the levers of political power remain firmly in public hands, with corporations merely one interest group among many. In the peculiar environment of the corporate state, however, this social norm is reversed.

Whether through lax regulation, political corruption, or deliberate design, the interests and representatives of corporations dominate national politics—indirectly through bribery and regulatory capture, or directly by seizing power and issuing orders. In the corporate state, the interests of companies, shareholders, and investors always come first—the people's wellbeing a distant second."
 despotism_vanguard_anarchism_subtype_desc: "Freedom is too precious to be left to the foolish masses.

Vanguard anarchism seeks to combine a decentralised anarchist society with a disciplined regular army to protect the whole. When the survival of this anarchist society is at stake, the final decisions often fall to the army's core leadership. Its advocates argue this is necessary to prevent more organised, more stable outside threats from crushing the communes. Critics, on the other hand, hold that this is not even revision—it is an insult to anarchism: the army, in the name of defence and protection, practises authoritarianism, and the people's will and needs are often ignored. Moreover, whoever commands the army wields power so great as to seem little different from the dictators who so labour to prettify themselves."
 despotism_aristocratic_conservatism_subtype_desc: "Whether republic or monarchy, whether a state is democratic has never been a settled question; few ideologies embody this view in so subtle, even insidious, a form as aristocratic conservatism. Such states usually do have a constitution and all the institutions and political structures of a democracy.

Yet many people—representatives, bureaucrats, local officials, even the head of state—are indebted to, paid by, or threatened by the state's behind-the-scenes rulers. These manipulators may be new money in a fledgling democracy, or defenders of monarchy with one added simple ceremony adapted to an abstract "court." Or they may be immensely wealthy farmers and landlords, able to ensure that taxation and government programs do not harm, but rather increase, their interests.

To say no one objects would be wrong. After all, to maintain the democratic façade, an opposition is indispensable. But this opposition is either blessed by its many patrons and "opposes on command," or is neutered and crushed, without backbone. Reaction is the rule; for those in power, no golden age exceeds the present, and the status quo is the summit. If you disagree, your forehead is stamped as enemy of the state or subversive.

In this muddy world, no man is a saint—everyone has a price. And the state's behind-the-scenes rulers know this better than anyone."
 despotism_warlordism_subtype_desc: "Sovereignty is not always achieved through a mature state; more often it rests on a leader's personal authority—derived from wise governance, charisma, or... more direct means. Warlords clearly master the latter.

Such regimes are usually born amid war or the collapse of central authority, inherently rough-and-ready. Lacking the necessary civil apparatus, their law is forcibly militarised, subject to the whims of its enforcers. So too the economy—whether through rampant corruption, militarism, or resource exhaustion—the basic rights of the vast majority go unguaranteed; all revenue comes from plundering natural resources, and the people of the territory may themselves be treated as a resource, stripped of their meagre income through crushing taxes.

Different warlords span a wide ideological spectrum: some hold fanatical revolutionary ideals of a bright future, some are content to rule for power's sake. These ideas are gradually distorted as they descend the pyramid of power. In the end, the warlord always breaks out of the rough pattern through conquest or independence."
 despotism_personalistic_dictatorship_subtype_desc: "Dictators take many forms in the history books. Whether thinkers or lawgivers, saints or tyrants, the greatest dictators share one thing: they will stake everything they command on realising their ideals. From Augustus burying the republic and donning the crown to Napoleon's revolutionary ambitions across Europe, their marks on history are indelible.

Of course, these are the exceptions, not the rule.

Most dictators have no grand ideal and no fondness for ideology, nation-building, or anything of the sort. For them, power is both end and means: "Everything for me, and none of your concern." Self-interest defines their rule and governance. The dictator's rule stems neither from the people's mandate nor from the guidance of a great cause, but by himself, for himself. Widespread nepotism and violent misrule make their regimes, however infamous, hard to overthrow."
 despotism_partisan_movement_subtype_desc: "To reclaim freedom in blood is better than drowning in tyranny's blood—this is the partisan movement's creed. If war with a foreign oppressor is inevitable on the road to liberating the people, then unleash the hounds and raise the cry. Beyond devotion to the liberation struggle and guerrilla warfare, partisan movements can encompass nearly any ideology, be composed of any class or people, and organise in any conceivable way. Whether in streets and alleys or the open field, the dense forest or the cliff's face, wherever a single fighter can hide is a partisan's battlefield.

As Europe gasps beneath the Nazi jackboot, as Asia weeps beneath the scorching sun, as the Italian colonies writhe beneath Rome's black eagle, partisan movements rise like an avalanche to crush the accursed gangs. From the united partisan organisations lurking in the "model colony" to the anti-Japanese united front ranging the Malay jungles, partisans the world over fight on. The oppressors will be ground to dust, the tyrants will burn, and the partisans will reach the dazzling flame on the horizon—their promised land, to which they march against all odds. Though the long night has dimmed everything, the spark of hope will reignite in the people's hearts. The executioners who caused this suffering will pay under just judgment.

And above all, the partisans will reclaim what they fought and bled for: freedom. For their people, never to be lost again."
 despotism_national_catholicism_subtype_desc: "As long as state and religion exist, their bond will never truly disappear. Since ancient times, secular and spiritual affairs have not merely coexisted in harmony but been interwoven and mutually reinforcing—this cannot be overstated. In modern society, the Catholic faith is no different.

National Catholicism firmly believes the best way to govern a nation is to practise traditional Catholic values, and to enforce them by force, lending it an authoritarian and quite conservative cast. National Catholics' reverence for traditional values is not merely verbal but enforced as strict norms—this is what sets them apart from other Catholic political groups.

National Catholics do not seek to imitate theocracy by placing clergy directly in leadership; instead they promote a model of church-state joint governance, which can enforce the law more efficiently. In most cases—especially in predominantly Catholic nations—the military acts as the executive arm of the national Catholic regime, and is naturally the state's armed force. This is, of course, necessary, and a necessary means to stop the nation sliding into decadence and futile infighting."
 despotism_managerial_state_subtype_desc: "A managerial state is a political system in which the state is controlled by, and serves the interests of, a selected elite bureaucracy. Its leaders are usually technocrats chosen by merit rather than personal whim, micro-managing every aspect of society through professionals to maximise the efficiency of the state machine. The managerial state does not ignore the needs of its citizens, but concern for their welfare is merely one variable in the technocrats' equations. Listening and responding to citizens' demands serves only to avoid unrest and boost economic output.

The leaders of a managerial state believe their system avoids the inefficiency of electoral politics and are convinced that professionals are the key to national prosperity. Yet history shows they often fail to account for the elusive factor of human feeling—and perish by it in the end."
 despotism_institutional_despotism_subtype_desc: "When an authoritarian state dons the cloak of "liberal democracy," many are taken in, believing it has a democratic government—but their conclusion is often the opposite of the truth. Institutionalised despotism does not venerate democracy; rather it creates and maintains a "perfect dictatorship," its deceptive appearance fooling many. A new decade has come, and the current example is Mexico under the Institutional Revolutionary Party.

In such a state, a powerful party—or a political clique monopolising the state bureaucracy—has deeply rooted influence, seeping into every corner of life, while real power within the party rests in the hands of a few oligarchs. At the same time, the government holds arbitrary power, reaching into any field of society, backed by laws regulating everything in minute detail. Though many organised opposition groups may exist, they are either "official oppositions" acting on the ruling party's orders, or simply its subordinate organisations under its leadership. These clever means together create the illusion of political pluralism. Thus, unless the whole of society organises and acts in concert, the ruling party's position remains unshakable.

Whether the government acts or refrains, is cautious or abusive, its measures all seem to serve some ruling clique's or ideology's "lofty goal"—even one grown unrecognisable or absurd. Thus arises an institutionalised, disguised despotism, in which the state ideology and civil society are deeply bound to one overwhelming abstract goal, which political oligarchs often cite to justify their own interests."
 despotism_aristocratic_republicanism_subtype_desc: "National identity was once a brilliant flame, born of the struggle against foreign monarchical oppression and the bondage of foreign capital. But when this flame passed into the hands of the common masses, it gradually dimmed amid petty disputes. Now the torch is held by an alliance of nearly aristocratic capitalists, landlords, and political elites.

To outsiders, this idea is at best naive, at worst contradictory. But to those who see themselves as heirs to the republic's founders, it is only natural that the vested interests inherit the republican revolution—only they can transcend class and creed to unite the people against the lurking historical oppressor; only they can guard the people from famine, revive the cultural blood trampled by imperialism, and let every citizen share in the nation's wealth.

Yet practice often belies the declaration. The landlord's sweet words cannot fill the rumbling bellies of eight-member families huddled in shantytowns; patriotic pageants that beautify ethnic slaughter cannot warm the cold hearts of survivors' descendants branded "social parasites." Nationalists dismiss these demands as the clamour of red agitators and uncivilised nobles—but when the roar of protest hits the headlines of dissident newspapers, and when hardship shakes the government's workings, the mask of idealism will finally peel away. How many cracks can this "great national unity," sewn together with sacred banners, truly mend—and how many new wounds will it open? Only time can answer."
 despotism_islamic_nationalism_subtype_desc: "The Prophet Muhammad said: "Whoever fights for sectarianism under a misguided banner, his martyrdom is of the Age of Ignorance." Though the hadith rejects nationalist thought, in some eyes loyalty to the nation and piety to the faith are inseparable—this very idea fuses the two irreconcilable ideologies.

Where Turkey and Iran have sought to build secular national identity by weakening religion's status, Islamic nationalists do the opposite, making Islamic tradition the core of their national identity. Though Islam dominates this ideology, it is by no means its only element. Such states are usually racist and extremely xenophobic, excluding minority and other sectarian communities from the ruling class, discriminating against, persecuting, and violently suppressing them. In such a state, the military is revered second only to God, seeing itself as the nation's sole guardian and God's shadow on earth; if necessary, it gladly replaces the civilian government to fulfil its duty as vicegerent.

This ideology draws criticism from more traditional Islamists for betraying the sacred norms set by the Prophet, preaching narrow sectarianism rather than building a unified Ummah. But these nationalists are happy to defend their apostasy, believing that fervent devotion to the nation-state is the truer expression of pan-Islamism."
 despotism_technocratic_corporatism_subtype_desc: "Corporatism is a collectivist ideology, originating from the Latin corpus (body), advocating the organisation of society according to the common interests of social groups. Its ultimate goal is a society of class cooperation under state leadership, opposing the class struggle preached by communism.

Technocratic corporatism explicitly opposes trade unions, seeing them as obstructing the broad road to class cooperation, and in policy resembles the traditional right. It does not cater to left-wing currents, but is more based on traditional corporatist ideas. Yet it is not as extreme as fascism, and does not take hardline nationalism as the cornerstone of its social practice."
 despotism_radical_kemalism_subtype_desc: "The will to power gives a nation strength, and the great men of the past gave the masses a reason—a single, unified, iron-clad reason. Turkey's great man is Atatürk, and like the great men of Germany and Italy, his ideals inspired a nation and unified our society's understanding of the world.

The state is the subject of this battle of wills; as the vanguard fighting the forces of reaction and regression, it is attacked and condemned at every moment of our society's march toward progress. The Party will be the firm position, the vanguard of Kemalist values, never cowed by the onslaught of opinion. Whenever necessary, it will firmly hold the instrument of government to prevent the revolution from being reversed by foolish fervour. The workers will labour for their nation, throwing themselves wholeheartedly into the cause of strengthening Turkey's ability to fight its enemies. Their reward is not slavery to materialism, but the fruits of honest labour.

For Turkey, for all the Turkish people, there must be no mercy for those who undermine our sacred national unity; we must uphold the republic's ideals and let the white crescent flag fly proudly over every corner of the motherland. If these principles are acknowledged, the Turkish revolution will endure a thousand years, and ten thousand more."
 despotism_wang_jingwei_thought_subtype_desc: "Since the Kuomintang's founding, the Three People's Principles of Dr. Sun Yat-sen have guided the party's path, striving for the Chinese people's independence and, ultimately, the democratisation of government and the establishment of a comprehensive welfare system for the happiness of all citizens.

When Wang Jingwei and his followers announced their anti-Chiang government in Nanjing, they likewise needed to justify their own version of the Three People's Principles to fit Japan's pan-Asian vision—and Wang Jingwei Thought was born. In this new interpretation, Wang raised the banner of "peace, anti-communism, and nation-building," advocating domestic corporatism and an anti-Western foreign policy, achieving national welfare through pan-Asian cooperation and casting off Western interference and influence. At first his ideas were denounced as a distortion of Dr. Sun's ideals, but within the Nanjing government he had loyal followers. Japan's victory in the Greater East Asia War transformed Wang's ideas into the thought of the times, spreading them more widely. He was held up as a pioneer of Asia, and his writings and speeches even circulated throughout the Co-Prosperity Sphere, making Wang Jingwei Thought increasingly popular among East Asian people and politicians.

After Wang's death in the 1950s, many other interpretations of the Three People's Principles began to circulate among the KMT's factions. Even so, Wang Jingwei Thought remains the most influential ideology among the people—years of indoctrination of the young, the early economic successes of President Wang's tenure, and Nanjing's broad recognition as China's legitimate government have produced popular acceptance. Undoubtedly, Wang Jingwei Thought still firmly occupies the throne of Chinese orthodoxy; only a truly attractive alternative could hope to displace it."
 despotism_chiang_kai_shek_thought_subtype_desc: "With the outbreak of the War of Resistance, the book China's Destiny was produced under the Generalissimo's guidance, meant to reaffirm the KMT's historical role in national unification and rejuvenation. This programmatic declaration, drafted by Chen Lifu and later reinterpreted by various theorists after the war, became the theoretical cornerstone of "Chiang Kai-shek Thought."

Chiang held that Dr. Sun's Three People's Principles could only be realised through unceasing struggle—a struggle permeating every aspect of life: life is like rowing a boat through a bitter sea, requiring constant struggle of body and mind. Thus the individual must always be ready for struggle, and the state must set order and security as its highest principles.

In Chiang's system, the nation's poverty and weakness stem from disorganisation and spiritual lassitude; the people must cast off individualism, cultivate national consciousness and revolutionary faith, and form a sense of collective responsibility. The political structure will serve as the vanguard uniting society, bearing the heavy task of saving the nation, and every nation and class must unconditionally submit to the leadership of this organ.

Chiang Kai-shek Thought denounces liberalism and communism as "sources of decadence," praising the national unity of Germany and Italy while remaining silent on their racism. It emphasises anti-imperialism and anti-colonialism, vigilance against foreign infiltration, and national self-reliance. Unlike the Nanjing government, which loudly exalts the great leader, this ideology does not particularly stress the leader's status, instead maintaining a degree of intra-party democracy (at least in theory) on principled grounds, avoiding the cult of personality and factional strife.

Chiang's followers are convinced that only by implementing this system of thought can the great ideal of the Three People's Principles be realised, making a revived China a civilised model of justice and order, and an example to the oppressed nations of the world struggling for liberation."
 ultranationalism_stratocracy_subtype_desc: "A stratocracy in the usual sense is a military organisation that compresses civilian spending to the limit and devotes every resource to the military and its related fields. In essence, it is an army that possesses a state; all its policies ultimately serve military operations, which are based almost entirely on a fanatical, ultra-hardline nationalist ideology.

To achieve its goals, such regimes are filled with ubiquitous nationalist propaganda; to maintain military rule, they are often extremely aggressive on the world stage, invading neighbours and other nations deemed "enemies" on historical, political, or other grounds. This usually plunges the nation into endless conflict—but for its leaders and people, that is precisely the goal."
 ultranationalism_reactionary_nationalism_subtype_desc: "Like many other ideologies, reactionary nationalism burst forth from the countless minds oppressed by twentieth-century industry. The weary workers who step through their doors find themselves unable to reconcile the grand narratives to which they have devoted their lives with the real world they inhabit. Modernity seems to thwart them at every turn, blurring clear goals and shattering unity. The glory of soldiers' triumphant return and the legends of martial virtue, passed by word of mouth, prove in the end only dreams. Subjectivity has swept away the myths of stability; years roll by, revolutions come and go, shame rises—and the generations ruled by materialist moralising are left with nothing but endless emptiness. Tradition is thrown on the scrap heap, while suffering, similar yet not the same, only grows.

Reactionary nationalism proposes that the nation must return to the social organisation of old to shake off the decadent spirit imposed by twentieth-century modernity. It selects a romantic, short-lived fragment of society from the torrent of history as its model, or violently transplants outdated moral codes into the colonies and other corners of the empire. The resulting policy often aims at extermination rather than assimilation, for reactionary nationalism sees homogeneity as the root of nationhood.

Reactionary nationalism is by nature belligerent and xenophobic—but this is the inevitable price of its perverse heroism. Reactionary nationalists believe their justice is to reshape the world as it should be, confirming in the process the hierarchy of races. Yet the self-styled knights either chase virtues that never existed, or merely herd modernity-weary people into portraits of a bygone golden age. Hollow reactionary nationalism prostrates before shallow aesthetics, bowing to the knight in armour, stern-faced and sword planted in the earth. After all, any politician can imagine himself an apostle of the past.

In mingled ideals and overflowing romance, lies matter not at all."
 ultranationalism_fundamentalist_zionism_subtype_desc: "Since Theodor Herzl and Moses Hess, the initial goal of so-called "mainstream" Zionism was to turn the Jews from their abnormal state of dispersion into a normal nation living on their own land, building a national economy and gaining international acceptance—an idea born mainly of nineteenth-century secular Western Jews, though many religious Eastern European Jews also accepted its premise. As the world entered the twentieth century and Jewish settlement in Palestine expanded rapidly, however, a different view quietly spread, its most notable voices Rabbi Avraham Yitzhak HaCohen Kook and his son, also a rabbi, Zvi Yehuda Kook. Their interpretation of Zionism veered to the extreme, overturning the desire for a normal life and instead proposing "redemptive Zionism." Fundamentalist Zionists hold that the Jewish people are in fact never—and can never be—"normal": their covenant with God has ordained this fate—to live according to Torah law in the Land of Israel, the holy land of the southern Levant.

Though religious Zionism is a fairly broad definition, with interpretations varying—including practical and tolerant branches—Rabbi Zvi Yehuda Kook and his fundamentalist followers see it as the sacred path to the messianic redemption of the Jewish people and the world. The greatest expression of this devotion is the patriotic, pioneering religious settler: even against the whole world, only the liberation of all Israel can complete the mission. On this path any sacrifice may be made—whether Jews polluted by weak Western culture, or outside enemies, especially Arabs, any folly resisting God's will is tantamount to suicide. The Jews must truly live as Jews, following the sacred redemption centred on the people of Israel, the Torah of Israel, and the Land of Israel."
 ultranationalism_stratocratic_corporatism_subtype_desc: "Stratocratic corporatism is not identical to fascism, but it does draw inspiration from fascist doctrine. Its totalitarian corporatist social structure, tightly controlled by the military, is the clearest sign of this borrowing. The rest of society is mobilised to support the army, and thereby to strengthen the whole nation.

Stratocratic corporatism can also transcend the other features of its corporatist and totalitarian framework. Governments of this ideology do not necessarily—but often do—believe in racial superiority. Unlike National Socialism, which fabricates a master race through pseudoscience, stratocratic corporatism usually promotes its own race's supremacy through national spirit and myth.

For such a society, peace is but a brief interlude in endless war, and all the nation's material and cultural resources must be ready at all times for wartime mobilisation. Its government must constantly solve the problem of what to do with the independent masses—how to make them transcend themselves and devote themselves to the abstract "destiny" of the state. From forcing citizens into patriotic organisations and mobilising the marginalised into the labour force to making constant "symbolic sacrifices" in the name of an ever-growing army, these regimes stop at nothing. So long as the people's faith in stratocratic corporatism holds firm, such a nation is invincible."
 fascism_statist_corporatocracy_subtype_desc: "Money can buy many things—steel pavilions, mountains of gold and jewels, the loyalty of the cowardly—but it cannot buy a monopoly on violence. Nor can it buy a state. At least, not yet.

Though the inexhaustible capital of the oligarchic corporations flows through every vein of the corporate state—something other nations dare not imagine—the government still enjoys its privilege: even as corporate tentacles creep into every field of society and their vast demands cannot be ignored, their desires and schemes are ultimately subject to the will of one particular leader. Even as private enterprise rules every aspect of economic and social life, the great helm of this nation is still firmly held by a single pair of hands, driving all toward some purpose beyond profit. Labour and capital alike must follow the helmsman's whim!"
 fascism_corporate_statism_subtype_desc: "Just as fascism is the twentieth century's most striking ideology, corporatism is its principal economic system. Though both have undergone great change and evolution, they are often both a raw instrument of power—a way of upholding what is deemed good and true, and crushing all that is not.

Corporate statism reflects the original intent of the corporation: institutions composed of each economic class, each class a basic unit of society, taught that its greatest interest is served through class cooperation rather than class struggle. Capitalist individualism breeds only opportunism and selfishness, while socialist collectivism leads only to radicalism and meaningless destruction, offering no solution. The corporate state, by contrast, brings reconciliation and peace between classes—all classes as gears in the state machine. It rejects social radicalism for tradition, preferring a stable social structure over anything that might undermine it.

The economy is composed of industry-based corporations encompassing both workers and employers, which act as their representatives before the state. To some this creates a hierarchical, hardly democratic state; to others it is an organic form of democracy in which the diverse interests of ordinary people are better accommodated than in majoritarian democracy, which tends to neglect minorities. Though the corporate system may be repressive and totalitarian, dissent is often drowned in a silent sea."
 fascism_sansepolcrismo_subtype_desc: "Sansepolcrismo takes its name from Benito Mussolini's speech in Milan's Piazza San Sepolcro; it is the original form of fascist ideology—from before the founding of the National Fascist Party, when the fascists still called themselves "Fasci di Combattimento" (Combat Leagues). The movement was then not a party with an entrenched bureaucracy but a loose alliance of young political extremists and disgruntled First World War veterans: people of often conflicting ideals united by a common hatred of socialism and liberalism, ready to achieve their goals by violence.

Sansepolcrismo's core tenets revolve around the revolutionary remaking of society: restructuring Italy's capitalist economy along corporatist lines, discarding the rotten bourgeoisie, and reviving the national spirit through mass mobilisation and expansionism. The new Italy, baptised in this revolution, would be sustained by a new elite—not corrupt capitalists or weak aristocrats, but the patriots who bled in the trenches of the Great War and, during the "Red Biennium," crushed the socialist Hydra in the factories and fields.

Though the revolutionary spirit was gradually replaced over the years by more moderate policies to court the middle class, the embers of Sansepolcro still burn in the hearts of party extremists like Roberto Ricci, Ugo Spirito, and Ettore Muti. With Muti's rapid rise, it has finally returned to the heart of political discourse. Though this ideology is fickle and elusive, it is undeniably incendiary among the lower classes and the military, a weapon against the spread of socialism. Only time will tell whether it can usher in a new era of national frenzy and class cooperation, or be forgotten by history once more."
 fascism_fascist_mysticism_subtype_desc: "The School of Fascist Mysticism was founded by Niccolò Giani, who spent years conducting a comprehensive analysis of philosophy, society, and religion, ancient and modern. Over the years, its members searched for the causes behind history's great events, concluding that the questions of state, economy, religion, morality, and race are closely intertwined. Something must therefore bind them all together, upholding the supreme good and casting down the supreme evil—and the answer is fascism.

In Giani's view, fascism is not merely a political ideology; it preaches undying loyalty to the state, firm faith in God, and absolute devotion to family, comrades, and countrymen—a comprehensive code of values applicable to every moment of life, even replacing all other social structures, including religion. In fact, the ultimate form of Christianity is fascism: the leader, the incarnation of the saviour, is the model of virtue, holding supreme authority in political and religious affairs, while the decadent clergy will be utterly abandoned by history.

Giani was once bound by academic halls and hollow theoretical debates, but he rose swiftly in the Italian Empire; the importance of fascist mysticism climbed ever higher, its followers multiplied, and its doctrine brought hope to despairing Italians: duty replaced uncertainty, devotion replaced doubt. As the faithful grow and the movement expands, the leader smiles from the heart—each new convert not only fully comprehends the essence of fascism but is elevated in body and soul..."
 fascism_fascist_populism_subtype_desc: "The national leader is enshrined on the altar—a warm smile to soothe those angered by the flaws of modern life; flattering words praising job security, growing wealth, and patriotism. For some, plain speech is enough; for those in the know, the words carry deeper meaning—they ceaselessly expose the corruption pervading society, whether liberalism, Marxism, or something ineffable. In any case, the voice assures both that only it can solve life's problems.

Such a leader does not blindly rely on dogma for authority. When the armband gives way to the flag, certain elements of fascism are emphasised to maintain moral control, while others are played down to stir a vague national fervour. He spends popular support as currency, buying the regime time until the people come to see the leader as the embodiment of the nation—the two merged into one.

Avoiding concrete policy, he often uses bombastic, populist rhetoric to touch on real or imagined grievances, substituting charisma for substance. This is usually accompanied by abundant corruption, backroom deals, and political stunts that paper over governance problems—so long as the leader's voice can be heard, telling them everything will be all right, it all seems to matter little."
 fascism_revolutionary_nationalism_subtype_desc: "The empire decays; where lofty towers once stood, only ruins remain. Yet a new energy bursts forth from beneath the rubble, proclaiming a new era to the colonised peoples above: the fervent "revolutionary nationalism" has arrived. Wherever imperialists have set foot, it is found. Britain's unequal treaties, France's resource plunder, Germany's imperial decrees—this new nationalism resists the metropolitan oppressors, roaring in the shadow of the continental empires, denouncing the colonial governments' past atrocities.

Owing to long historical exploitation, many post-colonial territories have rigid, underdeveloped economies. Yet when the authorities force modernisation upon them, the local people are often united around a strongman or clique by patriotism, revanchism, or mere rhetoric. The new nation is the centre of all political activity: workers must toil to strengthen the nation, soldiers must fight to defend the newly won freedom; public opinion is divided on moral standards and individual autonomy, but in this new era most agree on building a single, unified cultural identity. As Europe trembles beneath the German jackboot, the colonisers can no longer squeeze them—the liberated people cheer for independence."
 fascism_revolutionary_zionism_subtype_desc: "Since Theodor Herzl and Moses Hess, the initial goal of so-called "mainstream" Zionism was for the Jewish people to possess their own land and national economy and gain international acceptance—a product of nineteenth-century Western European anti-Semitism, their political action driven by the need for a place to call "homeland," which Europe then denied the Jews. But lacking a clear road, the Zionist movement inevitably split. Liberals and Marxists embraced Zionism because they believed liberation could be achieved through democracy or revolution. Revolutionary Zionists, however, reject Herzl's vision. They hold that Herzl's followers are too passive, merely waiting for Israel to come without acting. Instead, based on their reading of Torah and history, revolutionary Zionism holds that the Jewish people are forever bound to the Land of Israel—even after Israel's destruction, it lives in the blood of every Jew. For the Jewish people's liberation, any extreme act is acceptable, including bloody terror: the Jews long for the Land of Israel as a lover longs for the beloved.

Revolutionary Zionism is extremely heterogeneous; beyond extreme nationalism and open calls for political violence, its supporters share almost no common ideal. Most revolutionary Zionists do not practice religion in the usual sense, but their deeply held romantic nationalist reading of history has itself become a secular religion. Most also draw inspiration from European fascist movements, many admiring Italian fascism. But since the 1950s, under Israel Eldad's leadership, the movement has come increasingly under the sway of local messianic thought. Its followers now believe their goal is to rebuild the Kingdom of Israel as defined by their unorthodox reading of Scripture—a centralised, militarised state for Jews alone, its new Third Temple the symbol of the Jewish nation's triumphant return."
 fascism_ordosocialism_subtype_desc: "In 1847, Karl Marx shook the world's core, creating an ideology that surpassed the old order and clarified what ordinary people must truly strive for. Now Marx's true heir has finally arrived: Ivan Serov, founder of ordosocialism, who believes there is no contradiction between love of the fatherland and the nation's class struggle. If German ideology does contain something worth using for the revolution, why demonise it? Ordosocialism is the solution to these contradictory questions and ideas.

Ordosocialism fuses class struggle and national struggle, uniting all forces opposed to capitalism and cosmopolitanism, aiming to utterly destroy reactionaries—and holding that these groups' reactionary tendencies are, to a large degree... inherited.

Certain ignorant fools accuse ordosocialism of being reactionary corporatism at heart, a complete betrayal of Marxism; others denounce Serov as a madman in the same mould as Hitler. These people try to smear the revolution with filth, protecting the hereditary reactionaries naturally opposed to it. Serov and his supporters will not be troubled by such baseless rumours, for they are about to launch a new revolution—this time shedding all the ills that corrupted the previous ones."
 fascism_reform_bureaucracy_subtype_desc: "Like most great powers, Japan faced severe social division in the interwar period. Barely sixty years before the First World War, Japan had been an isolated feudal society; now it was an industrially developed modern nation-state. This rapid transformation naturally brought a series of temporary problems, concentrated especially in the economy. After all, the free market's present condition began with long-standing laissez-faire development, and the arrival of revolutionary socialism further aggravated pre-existing social problems. Thus the uniquely Japanese phenomenon of the "reform bureaucrats" (kakushin kanryō) rose amid the changing times, the experiments of various ideologies, and the convergence of colonial experience.

Though its name is unassuming, the reform bureaucrats' tradition is ruthless: they squeeze every resource without mercy, as best shown by Japan's puppet state Manchukuo—undisguised inhumanity, the embrace of corporatism, and even a certain fascist tinge. To the reform bureaucrat, the economy is but a pile of numbers and countless well-oiled gears—gears serving entirely the state's war mobilisation. Borrowing the "total war" economy of the late German Empire, the "economic normalisation" policies of the Weimar Republic, and the planned-economy models favoured by many hardline socialists, the reform bureaucrats sketch their ultimate goal: to make the economy wholly subservient to the state's needs, with the military and administrative bureaucrats as its chief beneficiaries."
 fascism_neosocialism_subtype_desc: "The global economic crisis of the Great Depression brought unprecedented polarisation to the world politics of the 1930s. In this wrenching upheaval and disillusionment with traditional political paradigms, a seed called neosocialism sprouted in the minds of the right-wing theorists of the French Section of the Workers' International and the Belgian Labour Party.

Neosocialism seeks to rescue society from imbalance and chaos, bringing unity and stability. Neosocialists reject the Marxist worldview and class theory; instead, the movement's new generation of theorists—such as Hendrik de Man and Marcel Déat—developed and advocated their own supposedly visionary concepts like "planism" and "constructive revolution." Neosocialism calls on the people to entrust the state to a technocratic elite, who would launch a top-down revolution to achieve radical social reconstruction. Though at first glance this idea has nothing to do with nationalism, the neosocialist theorists' authoritarian bent, and their reality of ideological flirtation with fascism, would soon turn them toward nationalism to bridge many of the state's cracks—producing a seamless transition into a technocratic, planist, corporatist, socialist society.

The Soviet Union, the exegete of international socialism, has fallen, and neosocialism's era seems to have arrived. Many former socialists whose worldview was shattered by Bolshevism's failure, and former fascists disillusioned by the Axis victors' stagnation and despair, turn to neosocialism, choosing to believe its promises to salve the pain of their resentment of the world's injustice."
 fascism_integralism_subtype_desc: "Integralism has many variants, often shaped by its adherents' own circumstances. Its core principles, however, are nearly identical, born of the same foundation: staunch fundamentalism and traditional Catholicism.

Integralism rejects the values of the Enlightenment, rejecting secularisation, democracy, and freedom. Rather than embrace "progress" and change, integralists insist that the people's only road back to morality and dignity is a return to a medieval asceticism rooted in society's firm faith in God.

Based on the idea that society operates as an organic whole, like the human body, integralism is not born of an ancient ideal's hope for a bright future, but of a determination to bring the glorious past back by any means—though that glory usually exists only in imagination."
 fascism_falangism_subtype_desc: "The Second Spanish Republic passed through chaos and disorder, yet ultimately arrived at order. For many, that order came from the Falange and its firm faith in national supremacy. The state would hold absolute authority over the nation, building a rigid hierarchy and finally restoring order.

Falangism opposes both capitalism and communism, seeking a third way distinct from the two ideologies once deemed the mainstream of the twentieth century. Depending on the local chief theorist, its solution to economic problems may follow state capitalism or corporatism, or the more radical path of national syndicalism. Whatever their economic views, however, both sides firmly oppose the evils of so-called democracy, believing the people's will cannot be expressed through hollow mechanisms like the ballot box. Instead, Falangist leaders venerate nationalism and religious tradition, usually tightly binding the two as the cornerstone of the state's existence, while tirelessly promoting traditional family values.

Because this ideology is well known across the Hispanophone world, it has won the favour of many Catholic traditionalists and more radical right-wing thinkers, held up by fascists as a model. For many in these nations, the Iberian project is the grand blueprint for realising their national aspirations. As countless dreamers watch the turbulent political situation with fear, they remain convinced that one day they will transform from political agitators into the caudillos who lead their age."
 fascism_clerical_fascism_subtype_desc: "Piety in the breast, victory in the field. Through the millennia of human history, no force has inspired the people and empowered the faithful like belief. It accompanies every idea and flourishes in every mind, altering behaviour, opinion, and human nature. Though it is everywhere, reality shows that it has gradually merged with the state, forming an ideology called clerical fascism.

This ideology proclaims an intrinsic bond between state and religion; thus the separation of church and state is unnecessary, and policy takes on a distinctly religious colour. Yet it is not quite a theocracy—though political leaders and church leaders are close, the clergy do not directly wield power; any organised religious activity is subject to the state's leadership. When speaking of national history, clerical fascists stress the interwoven bond between nation and religion, holding up the devout as models, such as Serbia's Saint Sava or France's Joan of Arc. They are praised not only for their faith but for their historical role; they become political figures, religious figures, even symbols of the nation. Religion is politics, politics is religion. Gazing upon clerical fascism, one cannot help but wonder: is it the true meaning of faith, or religion wielded as a political trick?"
 fascism_social_credit_subtype_desc: "A core element of C. H. Douglas's economic model is providing citizens with debt-free purchasing power, which he saw as a way to overcome the conspiracy of the "higher financial circles." Fascists who believe in Social Credit make no secret of these circles' implied identity. They see domestic and foreign financial institutions as a conspiracy dominated by Jewish swine, seeking to overturn it by implementing Social Credit.

To Social Credit fascists, it is the influence of Jewish bankers that has destroyed the nation's traditions. Through market manipulation, they make virtue worthless and vice profitable; thus people are lured into abandoning faith in God and nation for chaotic, unbridled decadence. For these fascists, this is merely another man-made problem, solvable by distributing purchasing power. Subsidise the righteous, make virtue valuable again through Social Credit. These fascists are convinced they can restore national values in the modern moral desert.

Critics are many and arguments abundant, yet Social Credit remains the youngest ideology on the world stage, its fascist offshoot younger still. Time will tell whether their dreams come true, or whether their delusions crash against the boulder of reality and shatter."
 fascism_baathism_subtype_desc: "$despotism_baathism_subtype_desc$"
 national_socialism_naturalised_nazism_subtype_desc: "National Socialism was born in Germany, forged by German circumstances and German racial identity. After this profoundly Germanic ideology spread across much of Europe, problems followed. In the East European nations under German colonial rule, a wave of collaborators emerged who struggled to reconcile their own national identity with the ideology that sought to crush them beneath the German jackboot. Out of this conflict, naturalised Nazism was born.

Naturalised Nazism is not an ideology in the traditional sense; in Eastern Europe it often appears in highly personalised forms, at best a stopgap. Born of the opposition between collaborators' national identity and National Socialist ideology, it lacks the systematic character an ideology requires. Its core is to separate the holder's own national-cultural identity from Nazi colonial thought, while acknowledging the supremacy of the Germania's masters.

Naturalised Nazism's creed often diverges greatly from the policies Germania's government enacts in its territory. Sometimes this is because its holders wear National Socialist skin while practising another ideology; most often it is because they over-emphasise their own national identity while trying to imitate Germania's government. Whether these ideologically self-contradictory regimes can be as smooth and flexible as the thousand-year Greater Germanic Reich remains to be seen."
 national_socialism_palingenetic_nazism_subtype_desc: "Once upon a time, the National Socialist movement designed for the whole world a revolutionary vision that could shake off modernity's decay. But those former revolutionaries grew idle, complacent, and short-sighted with the years, bowing to populism to seize power. Fortunately, in the world they opened, a new revolutionary generation is rising—one that will walk firmly on the road of national rebirth.

National Socialism is not an ideology for politicians to decorate themselves with, but a way of life. The true National Socialist is a warrior, one hundred and ten percent loyal to the revolutionary vanguard, devoting every moment of life to the struggle to change the status quo. When the revolution erupts, it will sweep away and destroy every institution like a tempest, bringing about National Socialism's second birth. These politically conscious warriors, model Aryans, and new elites will guide every facet of this reborn society. National Socialism is thus enshrined on the altar, sweeping away the materialism and superstition of the past—unless they still offer some traditional ceremonial use. Agnostics and the politically apathetic will find no foothold; only warriors who hold the revolutionary ideal deep in their hearts are worthy to wield power, and only through them can the utopia be defended against renewed corruption.

Alas, the road ahead is hard; the National Socialist utopia these revolutionaries yearn for is a unique vision existing only in their minds, with a million variations in every detail and no systematic ideological theory to guide it. Yet one point is widely accepted: wherever they come from, they share the common Aryan skin. In time, they will break the bonds of borders and unite under the shared banner of race—and that day will be the day of revolutionary victory."
 national_socialism_reformed_national_socialism_subtype_desc: "Every ideology, once it seizes power, undergoes change during its rule, and National Socialism is no exception. In its first decades, Adolf Hitler, as the authority on National Socialism, reduced the ideology to the "Führerprinzip": the Führer decides everything, and the meaning of National Socialism is also decided by him. As time passed, however, Hitler gradually lost real influence within the party, no longer able to impose his personal will as the sole spokesman of National Socialist thought. One man seized the opportunity this vacuum offered: Albert Speer.

A hallmark of Speer's practice of National Socialism is reforming and softening many of Hitler's excesses: harsh racial control, futile economic autarky, the unrestrained empowerment of the military, even the blind worship of Hitler himself—Speer does not consider these principles sacrosanct and plans to abolish them. His opponents, who believe in these principles, will surely mock him: revisionist, factionalist, trying to replace National Socialism with a vacillating Italian-style fascism; some even accuse him of being a democrat in secret, bent on utterly destroying National Socialism.

Yet they do not realise that Speer reforms not to destroy National Socialism, but to save it: under the name of pragmatism, he compromises ideologically to cut away the gangrene and preserve the whole; he suppresses militarism to prevent tyranny in the officer corps; he permits criticism of Hitler to appear enlightened while preserving the cult of personality.

If all goes according to plan, Speer can transform the bloated, self-contradictory, self-destructive National Socialism into a truly promising ideology without changing its core. Germany will remain a one-party state, racial purity will be preserved—and above all, the Führer will remain alone at the summit, omniscient and almighty."
 national_socialism_revolutionary_nazism_subtype_desc: "Within the Nazi movement, the question of how far the National Socialist revolution has actually progressed often sparks fierce internal debate. Loyal National Socialists privately ask whether their ideology has advanced deeply enough and has the strength to reshape social relations. The typical answer is a resounding "no," accompanied by a determination to redouble their efforts and accept no compromise. The so-called revolutionary answer is fury at the compromising posture of other Nazis.

Revolutionary Nazism is a tendency within National Socialism advocating an uncompromising ideological vision. The Nazi Party will act as the backbone, mobilising the masses into a reactionary revolutionary movement, destroying class barriers, and comprehensively remaking social and economic life. They will eliminate the so-called conservatives and replace them with the party-state; the market system, the churches, the military and civil service outside party control will all vanish. In pursuing corporatism, reorganisation, and nationalisation, large private enterprise will also dissolve. A state-controlled corporatist economy will govern the scope of small and medium enterprises and their middle-class managers. Every aspect of social and economic life will revolve around the party-state, which will be both the subject and object of the National Socialist revolution.

Revolutionary Nazism largely vanished after 1934. The purge of Röhm and the events that followed seemed to crush it. But revolutionary Nazi thought still lives on in the hearts of a few of the most fanatical Gauleiters, SA men, and German Labour Front bureaucrats. Perhaps the clamour of the Cold War will grant them a heaven-sent chance to take the stage again and direct their totalitarian movement."
 national_socialism_idiosyncratic_nazism_subtype_desc: "National Socialism is an ideology, a way of thinking, a way of life that takes the Aryan race as its core and foundation. To make cowardly compromises for so-called reality, or to confine the Aryans to a so-called Germanic Reich, is extreme folly. The National Socialist has a dream, but that dream has long been shelved by corrupt tyrants.

Yet the dream lives on. The idiosyncratic Nazi movement led by Theodor Oberländer and Georg Leibbrandt advocates a new road: they neither make unlimited compromises with liberalism like Speer in the name of "pragmatism," nor, like other Nazi adherents, obsess over purging the so-called degenerates. All their work serves one purpose: the welfare of the Aryans. On race, some idiosyncratic Nazis believe that among the so-called "inferior Slavs" many carry Aryan blood; others, while judging the Slavic peoples inferior to the Aryans, do not mean the Slavs are a subhuman race. In any case, they cannot accept the East remaining the chaotic, stinking slave-pen it is now; they want to turn the East into the true living space of the Aryans. They are willing to seek allies worldwide against Judeo-Bolshevism. Many in the movement advocate returning to the populist theoretical roots of National Socialism, re-centring the state on the Aryans themselves.

To outsiders, the idiosyncratic Nazis' theories are utterly incoherent, doomed to crumble under reality's weight. But to their adherents, what they practise is true National Socialism, the expression of the people's will."
 national_socialism_technocratic_nazism_subtype_desc: "Some of the more radical members of the Nazi movement hold that all social and economic life should revolve around the National Socialist German Workers' Party. Their arguments claim the Party should bring the various fields closer together, making them collide and coalesce into a society uniting party, people, and economy. Another faction, styling themselves pragmatic National Socialists, seek instead to place the state, not the Nazi Party, at the centre.

Though some debate remains over how far the Party should be subordinated to the state, in the state-party dichotomy the technocratic Nazis firmly stand on the state's side. Some advocate a return to the "loose" system of the 1930s, others that the Party should be a purely cultural institution. But all members of this National Socialist faction agree that state and party must have clearly defined roles—the state supreme, the party controlled.

Having seized the state's supreme power, a technocratic Nazi leader can calibrate the state more or less as he pleases. They will abandon the Führerprinzip, establish an oligarchic cabinet of ministers, weaken the Gauleiters, and purge the bureaucracy of ambition, corruption, and redundant layers. They will invest in education and science and smash corporate cartels through economic reform. Above all, the technocrats will hand the organs of government to an educated expert class and dutiful National Socialists. After all, a thousand-year Reich needs talents who can plan a thousand years ahead."
 national_socialism_spartanism_subtype_desc: "Some believe National Socialism's immortal achievements have proven it eternally great and correct, blaming its failures solely on calamity. They say that, despite the fatherland's flaws, minor reform or a change of personnel will fix them. They will sit and let the status quo remain, allowing Germany to gradually sink into just another senile empire.

But Reinhard Heydrich, and his followers in the Germanic SS, will never stop there—never.

Himmler's faction plunged headlong into esotericism, and the Waffen-SS betrayed the great cause for wealth and power, but Heydrich and his disciples have inscribed their mission on their hearts: they will break utterly with the corrupt Nazi Party and part ways with the degenerate liberals. They will reform the old classical society and return to a plain, pure past: men charge into battle, women bear children, and all debauchery and weakness will be swept away. They will raze the filthy cities and tear off the mask of mercy forced upon the inferior races by reality. Towns become garrison-camps where Aryan warriors drill day and night; estates spread across the countryside where the pure race toils; and the Aryan's descendants will be perfected in the bloodbath of racial cleansing. Heydrich declares flatly that they are the Spartans, the resurrection of Aryan superiority—and when the whole world revolves around Germany, history itself will bow to the Führer's will.

Only the SS—the faithful of National Socialism—can shoulder the task of realising this promised land. The Spartan spirit will be infused into the fatherland's blood, hammered on the anvil of the Volksgemeinschaft, and the reborn fatherland will endure for a thousand years. Even if rivers of blood flow and corpses cover the land; even if all humanity must be sacrificed to lay utopia's foundation, all will be worth it. The fatherland will not hesitate over the balance of gains and losses."
 national_socialism_clerical_fascism_subtype_desc: "Fascism is by nature a malleable, adaptable ideology; even when Benito Mussolini first proposed it, it was always able to adjust in time to suit its followers' ideological needs and peculiarities. Given religion's vast influence over millions worldwide, it is no surprise that many fascist movements—from the infamous Romanian Iron Guard to Croatia's Ustaše—sought to follow both religion and fascism in pursuit of power and control over a nation's soul. The freakish offspring of this often-recurring odd coupling is called clerical fascism.

Though religion's influence in fascist movements is not rare, these regimes' fanaticism and extremism rival the National Socialists. They are obsessed with theories of "redemption," theories inseparable in their practitioners' minds from race and nation. These modern zealots warn that unless their pure vision is realised, the people will soon fall into eternal damnation, in this world and the next. Frankly, is there anyone more dangerous than those absolutely certain of their own righteousness?"
 national_socialism_burgundian_system_subtype_desc: "After losing fortune's favour in the Second World War, certain fanatical Nazis—led by Reichsführer-SS Heinrich Himmler—sought to reconcile their faith in National Socialism's superiority with the increasingly bleak reality through an unorthodox form. They concluded that the Nazi Party had lost itself in confusion and fallen into decadence, and that only they could uphold National Socialism's true values. They quietly isolated themselves from the Third Reich's political architecture and built parallel systems of their own. And when Himmler seized power in the SS Order-State of Burgundy, he was able to pursue his purified vision of Nazism without hindrance.

Just as Germany's ideological goals depended heavily on Hitler's increasingly erratic pronouncements, so the Burgundian System's principles are likewise vague. To understand it, one can only analyse Himmler's increasingly mystical behaviour and obscure beliefs, ranging from vague, seemingly self-contradictory agrarianism-cum-ultra-industrialism to establishing Germanic neopaganism as the state religion and exploring the occult. What is certain is that he pushed the means of Nazi policy to new extremes: the SS above all other classes, the forced enforcement of harsh racial-eugenic laws, and the deliberate infusion of National Socialist theory into every facet of life. He also imposed an unparalleled totalitarianism upon the whole nation, solely to eliminate every potential source of decadence and conservative thought. Whether this has succeeded—or ever will—only Reichsführer Himmler knows; for once a secret enters the Order-State, it never leaves."
 national_socialism_imperial_cult_subtype_desc: "On the night of 17 July 1918, Bolshevik revolutionaries executed the Tsar's family in a basement somewhere in Yekaterinburg. Their deaths were meant to mark the end of the Romanov dynasty, yet Russia remained ravaged. Across a land scarred by revolution, war, and decay, rumours spread—some swore one of Nicholas's children had survived. After the Soviet collapse, still more believed the Romanov heir still hid somewhere, and that one day he would return and restore Russia's former glory. These delusions crystallised into the Imperial Cult that Sergei Taboritsky shaped around Alexei.

The Imperial Cult, a centipede cobbled together from fear, imperial nostalgia, and extreme anti-Semitism, has but one goal: to return His Imperial Highness Alexei to Russia as soon as possible. To this end, its adherents hold that all resources must be mobilised to purify the nation, hoping the saviour will return once the Russian people have proven themselves worthy. They also support the organised extermination of Russia's minorities, the exploitation of the destitute masses, and the construction of grandiose imperial monuments. Its ubiquitous informants and brutal punishments model themselves on the purified kingdom of Josias, leader of the Caucasus Reichskommissariat (whom Taboritsky once publicly worshipped).

Yet no one knows whether this movement can endure. As time ticks by and the saviour has still not returned, the cult's faithful grow ever more desperate. Many observers fear that Alexei may never return to the Russian land."
 national_socialism_rosenbergite_tendency_subtype_desc: "Every political movement, great or small, has members who oppose orthodoxy. Some are great, fighting desperately against evil systems and defending rights and freedom with their lives; but some, like Alfred Rosenberg, fight only for their own small political gain. Yet even years later, when the situation is clear and the dust has settled, their ideas, opinions, and notions can still survive.

The Rosenbergite tendency is not an organised political movement, but a catch-all term for the ideological inclinations of several unconnected political figures. For Rosenberg, a Baltic German, Eastern Europe was more than land for settlement. He held that the peoples of Eastern Europe should be given the chance to be elevated and purified, becoming the Aryans' sharpest wedge to utterly destroy the inferior Russian people. Though Germania's bureaucrats have long forgotten Rosenberg's existence, his views still hold sway in Eastern Europe, and his vision for the eastern Reichskommissariats has not wholly faded.

Intellectuals and thinkers still study Rosenberg's ideas, seeing them as a pragmatic and humane ideology that can keep the tide from the East at bay. But one thing must be remembered: his followers follow Hitler's views on every other question. They are wrapped in the same brutality of the Greater Germanic Reich as their colleagues. However beautifully Rosenberg may speak, a Nazi is still a Nazi."

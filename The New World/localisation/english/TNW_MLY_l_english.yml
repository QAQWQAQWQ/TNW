 POLITICS_CHIN_PENG_DESC: "Chin Peng, originally named Ong Boon Hua, has had his life shrouded in myth and legend. Now he is Public Enemy Number One of the Shonan Military Administration. Operating in the remote, wild hills and forests of central and northern Malaya, he gradually grew into a resolute and ruthless fighter. In 1957, amid the collapse of the Malayan Presidency, Chin Peng stepped forward to lead the anti-Japanese uprising, commanding the Malayan People's Anti-Japanese Army through victories and defeats alike, with the secrets of it all captured in the old saying: only the strongest grass survives the wind, only the purest gold is tested by fire.\n\nYet for this battle-hardened guerrilla, the light seemed to fade all too quickly. In the dark years from 1959 to 1961, the People's Army fell into extreme hardship, bordering on despair. To keep fighting and survive, they had to raid villages and settlements along the Thai-Malay border — the very people they had claimed to protect from the Japanese bloodbath. The hourglass seemed about to run out when Chin Peng received a telegram from rebels within the Wataniah ranks. Thus, in early 1961, the United Malayan Anti-Japanese Front was born amid the flames of war.\n\nThe resistance's fortunes soon turned. The Front successfully held on to the vital port on the west coast of the Malayan Peninsula, and aid flowed in from the Indian Republic (some say there was an even bigger patron behind India). Since the nations sending aid were all anti-Japanese, Chin Peng chose compromise on this issue, though he was not unaware of the growing strength of non-communist anti-Japanese forces. Having chosen neither to seize power nor to dissolve the Front, Chin Peng had to set aside his political ambitions and form an alliance with the relatively moderate Ahmad Boestamam. Boestamam had ambitions of his own, but for now the two worked well together: Boestamam needed the People's Army's strength, and the People's Army needed Boestamam's popular legitimacy."
 POLITICS_CHIN_PENG_POSTWAR: "After twenty years of bloody war, two devastating campaigns, traitorous conspiracies, and the collapse of the United Malayan Anti-Japanese Front, the jungle fighters of the Malayan Communist Party have reached their darkest hour. The bold gambit of once allying with reactionaries and nationalists for independence has ended in failure, and the Front's dissolution has all but driven Chin Peng and his guerrillas to the brink. They retreated into the primeval jungle, becoming shadow warriors in a double collapse of will and body. But this time, the collapse of the Yasuda zaibatsu has shaken the foundations of the Rising Sun regime, and the traitors can no longer penetrate the last redoubt of the revolution.\n\nNaive observers might claim that the Chin Peng regime, surrounded by Rising Sun puppet forces, is destined to be short-lived. But the revolutionary who once fought under the name Ong Boon Hua is rewriting that prophecy with his actions. Who could have imagined that the Malayan Communist Party would break out of its tiny village confines and plant the red flag across multiple states? No — even amid military setbacks, the communist spirit of the MCP has soaked into the marrow of its leadership. He solemnly declares to all the people of Malaya: as long as the Japanese running dogs continue to defile this land, as long as colonists continue to plunder Malaya's wealth, the sword shall never be sheathed.\n\nBut Malaya lies in ruins; can it endure yet another war of freedom to throw off the Japanese yoke? Can Chin Peng's regime consolidate itself in this desperate situation and march south to unleash a revolutionary tide? Or is this land fated to be trampled repeatedly by foreign boots? Only time will tell."
 MLY_Dismal_Infrastructure: "Devastated Infrastructure"
 MLY_Dismal_Infrastructure_desc: "The relentless Rising Sun, a long war of resistance. Our homeland is a wasteland, its infrastructure destroyed beyond measure. The back-and-forth between rebels and collaborators may only have steeled our resolve, but it has carved deep scars into our people and our land.\nThe anti-Japanese united front has never lacked spirit — but spirit seems to be all we have left."
 MLY_The_UMAJF: "United Malayan Anti-Japanese Front"
 MLY_The_UMAJF_desc: "Every other nation in Southeast Asia has bowed to the Empire of Japan, yet we stand against the wind. Since the arrogant Japanese soldiers set foot on our soil, we have waged an endless struggle against the 25th Army. Time and again we have reclaimed our land from them, only for those damned Japanese running dogs to emerge and force us back into hiding. Every bullet, every tear, every son and daughter of Malaya who has given their life — it is all for one dream: that our children may never live under oppression and tyranny.\n\n§GFreedom or death.§!"
 MLY_driven_to_the_countryside: "Into the Countryside"
 MLY_driven_to_the_countryside_desc: "For ten years, Malaya has witnessed an endless war between her children and foreigners from the East. Singapore changed hands repeatedly between our forces and the traitors, and now the Japanese have once again stolen this southern jewel. Though sympathetic villages and towns welcomed her exhausted soldiers, that will not happen again. No time to lick our wounds, no waiting for the right moment — we strike decisively, hoping for the best.\n\n§GEven death is no worse.§!"
 MLY_operation_nassau: "Operation Nassau"
 MLY_operation_nassau_desc: "Across the ocean, our honorary leaders and representatives have sought aid and supplies from Japan's adversary — the United States. Ten years of anti-Japanese war have plunged our country into the mire; another ten years and the people of Malaya would never recover. American supplies and guns flow in steadily, and once Malaya is liberated, this will be our guarantee of security. Our neighbors will call us American running dogs for accepting help from the free world, but at least we will have freedom — a word they will never be able to say themselves."

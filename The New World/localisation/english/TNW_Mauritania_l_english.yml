 TRZ_idea_mauritanian_claims: "Mauritanian Claims"
 TRZ_idea_mauritanian_claims_desc: "Mustapha Ould Mohamed Saleck and the Military Committee for National Recovery claim they are the rightful rulers of the former French colony of Mauritania. These claims include vast areas currently controlled by the Iberians. Though the international community rarely takes Mauritania's ambitions seriously, domestically these bold claims are essential to maintaining political stability. Without them, the ruling Military Committee for National Recovery would lose all reason to exist. Whether they have the chance to press their claims remains to be seen."
 TRZ_idea_mauritanian_claims_tt: "§YIf the opportunity arises, the Military Committee for National Recovery will press their claims.§!"
 TRZ_idea_military_committee_national_recovery: "Military Committee for National Recovery"
 TRZ_idea_military_committee_national_recovery_desc: "To ensure the stability and unity of the nation and prepare for the reclamation of other parts of Mauritania, the country's military leaders established a military government, banned other political organizations, and abolished all forms of democracy in the name of eliminating political division and uniting the people. At least for now, Mauritania is a nation without politics."

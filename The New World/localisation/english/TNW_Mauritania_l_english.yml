 POLITICS_MOUSTAPHA_OULD_MOHAMED_SALECK_DESC: "Mustapha Ould Mohamed Saleck was only three years old when the European war broke out. But Saleck's youth does not diminish his will, and now he will bring a new dawn to Mauritania, uniting the forgotten peoples of West Africa into a strong and free nation, completely free from Iberian and French influence.

When the French were driven to the Ivory Coast and the Iberians seized control of their lands by force, Saleck was still a teenager, and he joined the "Mauritanian People's Movement" even then. He honed his skills, rising through the ranks in five years until he became one of Dadah's most trusted generals. Rumors of how this young man single-handedly repelled an entire Iberian brigade made him an icon of Mauritanian freedom fighters.

But Saleck, like many others, had issues with Dadah. He saw only weakness in this man — a socialist who possessed as little in the way of Islamic values as other apostates, a coward who refused to take any form of decisive large-scale action against the Iberian scum occupying Mauritanian soil. In the end, conspiracies were hatched, plans were drawn up, and the military's plan was set in motion. Moktar Ould Dadah was asked to step down from the party leadership with a gun at his back to avoid causing alarm, and the "Mauritanian People's Movement" was reorganized into the "Military Committee for National Recovery," composed of a group of generals committed to building a true Mauritanian state.

But Saleck still faces opposition within Mauritania: from the more socialist-leaning populace who hope Dadah will return, from other generals in his own faction, and from the threat of the Iberians retaking their "rightful" land — a move he suspects they are ready to make at any moment…"

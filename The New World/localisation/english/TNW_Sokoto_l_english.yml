 HAU_idea_islamic_influences: "Islamic Influences"
 HAU_idea_islamic_influences_desc: "Islam plays an important role at all levels of Sokoto Sultanate society. From ordinary people to the highest levels of government, every action and decision is made with the advice of imams and other religious counselors. Although the control of Islam is not absolute, its influence is everywhere, and the Prophet's words are never far from the Sultanate's rulers' hearts."
 POLITICS_SIDDIQ_ABUBAKAR_III_DESC: "Siddiq Abubakar III is the Sultan of Sokoto, "Leader of the Faithful" and "Commander of the Muslims," as well as the head of the Nigerian branch of the Qadiriyya Sufi order. He is the last link in an ancient historical chain in this corner of Africa. Abubakar was born in 1903, the very day the British finally conquered the Sokoto Sultanate. He is a descendant of the founders of Sokoto, who played a key role in establishing Islam in northern Nigeria. Abubakar received a religious education, distinguished himself as a skilled administrator, mastered his people's traditional law, and finally became Sultan in 1938.

As the de facto absolute monarch and spiritual guide, Abubakar is supported by most of the traditional Fulani upper class, but growing opposition from reformist elements in the region has begun to threaten the Sultan's legitimacy.

Worse still, the Hausa people of Sokoto have long been denied any real form of representation, and they have begun to resent the Fulani-dominated Sultanate as demands for Hausa self-determination grow louder. Finally, other ethnic groups in the border regions of the Sokoto Kingdom — primarily the Zarma and Fulbe peoples — are also growing restive under the Fulani yoke and may well secede from the Sultanate. Despite all this, Sultan Abubakar perseveres, and only time will tell whether his adherence to the ancient and venerable ways of his ancestors is enough to survive in this cruel new world."

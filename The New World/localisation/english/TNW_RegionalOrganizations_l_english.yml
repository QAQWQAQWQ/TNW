 RegionalOrganization_UN: "United Nations"
 RegionalOrganization_UN_colored: "§m$RegionalOrganization_UN$§!"
 RegionalOrganization_UN_desc_0:  "£zollverein_texticon With the fall of Switzerland, the League of Nations truly came to an end. In 1948, delegates from dozens of nations gathered in San Francisco, USA, for the United Nations Conference on International Organization, jointly drafting and adopting the UN Charter, which the representatives solemnly signed. In the same year, France, Britain, the United States, and most other signatories submitted their instruments of ratification, the Charter came into force, and the United Nations was formally established.\n\nTo develop friendly relations among nations based on respect for the principle of equal rights and self-determination of peoples, and to achieve international cooperation in solving international problems of an economic, social, cultural, or humanitarian character, and in promoting and encouraging respect for human rights and fundamental freedoms for all - to achieve these noble purposes, the United Nations established seven core principles, centered on: the sovereign equality of all member states; the peaceful settlement of disputes; the prohibition of the use or threat of force; the UN's right to ensure non-member states also abide by these principles within the necessary scope for maintaining international peace and security; and the principle of non-interference in matters essentially within the domestic jurisdiction of any state."

 RegionalOrganization_IOSC: "International Organization for Service and Cooperation"
 RegionalOrganization_IOSC_colored: "§r$RegionalOrganization_IOSC$§!"
 RegionalOrganization_IOSC_desc_0: "£zollverein_texticon §c$RegionalOrganization_IOSC$§! 'Welt-Dienst' was originally an anti-Semitic news agency founded by Ulrich Fleischhauer in Erfurt in 1933, later absorbed into the Rosenberg Office and becoming a major instrument of Nazi propaganda during World War II. As Germany's fires swept across the old world, spreading the flames of the 'New Order' across every inch of the old order, 'Welt-Dienst' gradually reorganized into an international organization, merging with the German Fichte Federation and the Friends of Germany organization.\n\nThus, we may simply call it the 'Nazi International' - its exclusionary nature and ideological aspirations are sufficient to bear that name. Through this institution, the master of the European continent continuously channels theory to Nazi governments and organizations around the world, forging alliances and cooperation at the political and economic level. Ulrich Fleischhauer's original vision has finally been realized: for the first time in world history, an international organization of experts on the Jewish question has been established to counter the 'Jewish International.' And Erfurt has thus become revered as the 'Mecca' of anti-Semites."
 

 RegionalOrganization_OAS: "Organization of American States"
 RegionalOrganization_OAS_colored: "§a$RegionalOrganization_OAS$§!"
 RegionalOrganization_OAS_desc_0: "From Capitol Hill in Washington to the icy reefs of Tierra del Fuego, the fate of the New World is nominally bound together by a sacred bond. The establishment of the 'Organization of American States' was once touted as the ultimate beacon of democracy, sovereignty, and peaceful cooperation in the Western Hemisphere. In its lofty official charter, it vowed to defend every American nation against foreign aggression, resolve internal crises through economic mutual aid and diplomatic consultation, and build a 'New World Community' free of strife. Yet behind this veneer of warmth lies the cold, calculating geopolitical machinations of a great power.\n\nOn the political map of the Western Hemisphere, the organization has effectively become a strategic long arm for the northern colossus to consolidate its backyard hegemony. Washington's gold dollars and stationed American forces have become an insurmountable shadow in every nation's diplomatic decision-making. Whenever radical ideologies or revolutionary movements emerge in Latin America seeking to break free, the organization quickly gathers under the pretext of 'maintaining democratic order,' turning disobedient regimes away through political isolation, economic sanctions, and even acquiescence in armed intervention. Though the Latin American member states seethe beneath the surface, complaining about this unequal suzerain-vassal relationship, under the weight of external pressure and realpolitik, the OAS nominally maintains the seemingly monolithic but fragile 'front of freedom' across the American continent."

 RegionalOrganization_CollabCommonwealth: "Commonwealth of Nations"
 RegionalOrganization_CollabCommonwealth_colored: "§Z$RegionalOrganization_CollabCommonwealth$§!"
 RegionalOrganization_CollabCommonwealth_desc_0: "The Commonwealth once envisioned a free association of nations bound together by the Crown, and indeed operated as such in its early years, until the monarchy fell and this free union fell apart. Today, the Commonwealth has been transformed into a hegemonic organization entirely centered on Britain, reduced to a cultural tool for whitewashing and propaganda for the British Empire.\n\nThe imperial government-in-exile in Ottawa can only console itself with the ethereal bonds between it and its shrinking overseas territories. As for the present Commonwealth, its membership has dwindled to just three blocs: first and foremost, war-torn Britain itself; second, the British African territories still under the iron-boot heel of occupation; and finally, the pro-German states tied to Britain by geopolitics and historical ties. This absurd composition mercilessly punctures its old pretensions of freedom. The Commonwealth's remaining international legitimacy and diplomatic appeal are now deeply intertwined with the British war machine. Whitehall's politicians know full well that the Commonwealth is no longer a family that can be maintained through hollow oaths; its ultimate survival and legal continuity depend entirely on whether British arms can achieve final victory on the blood-soaked battlefields of Africa."


 RegionalOrganization_AfricanLabourBoard: "African Labour Board"
 RegionalOrganization_AfricanLabourBoard_colored: "§r$RegionalOrganization_AfricanLabourBoard$§!"
 RegionalOrganization_AfricanLabourBoard_desc_0: "The African Labour Board is both an international treaty and an international organization, whose members encompass the various colonial empires, settler states, and independent majority-rule nations across the African continent. The institution primarily manages issues of common concern through bilateral coordination, including immigration control, labor allocation, and remittance affairs.\n\nMigrant labor is the backbone of the entire African economy. The Board was established to bring the cross-border flow of labor and remittance transactions under formalized management. This ensures that immigration quotas are met while also making it convenient for the Board and related signatory states to take their cut and levy taxes. Signatory states are divided into two categories: 'labor-exporting' and 'labor-importing' nations. South Africa is purely an importing state, independent African nations are mostly exporters, and colonial empires play both roles.\n\nCountless Africans leave their homes to sell their labor abroad. For them, the Board is an official threshold they cannot avoid; to feed their families, they must follow the rules. At the same time, it is a tool for the authorities to monitor and scrutinize their political views and backgrounds. By contrast, European settlers face no such restrictions on work or travel. The life circumstances of the vast majority of migrant laborers are nothing more than cold data in a ledger. As long as there is work to be done, they must silently endure all manner of abuse, exploitation, and humiliation. And here, the work never ends."

 RegionalOrganization_SACU: "Southern African Customs Union"
 RegionalOrganization_SACU_colored: "§J$RegionalOrganization_SACU$§!"
 RegionalOrganization_SACU_desc_0: "The Southern African Customs Union was born after the bitter Boer War and is the oldest customs union still in operation. It was originally established to strengthen trade links between the southern African colonies, thereby securing tax revenue and resource supplies. However, with the fall of Britain to German forces and the annexation of the High Commission territories by newly independent South Africa, the Union's function has undergone a fundamental transformation.\n\nIn essence, the colonial-era plunder of wealth and minerals continues, except that Pretoria now collects the net profits, and the Union has become a tool for South Africa to expand its economic hegemony over its neighbors. Though the Union originally covered only South Africa, Bechuanaland, Basutoland, and Swaziland, new proposals have been put forward to establish a 'Southern African Community' between this apartheid state and its surrounding partners, in order to expand its scope and further entrench this hegemonic system."

 RegionalOrganization_CADAT: "Central African Development and Assistance Treaty"
 RegionalOrganization_CADAT_colored: "§l$RegionalOrganization_CADAT$§!"
 RegionalOrganization_CADAT_desc_0: "In the war-torn lands of Central Africa, the 'Central African Development and Assistance Treaty' (CADAT) is often joked about as a piece of iron-clad dark humor in the history of international diplomacy. On its face, the treaty is filled with modern, civilized phrases like 'humanitarian relief,' 'infrastructure development,' and 'transnational economic cooperation.' Yet in the eyes of the international community, everyone knows the treaty's actual purpose: it is an excellent shield for the major geopolitical powers to legally intervene in Central Africa's civil wars, support their own proxies, and maintain a fragile geopolitical balance without triggering full-scale war.\n\nSince the treaty framework looks 'completely fine' from the outside, the behind-the-scenes division of spoils can proceed safely beneath the most elegant of suits. From arms embargoes run in the dark to joint development of contested mining areas, CADAT has become the default set of rules for all sides. It neither expects to truly bring prosperity to Central Africa nor intends to eradicate poverty; its true core function is merely to serve as a highly efficient crisis buffer. As long as the signatories can each take their slice of the cake, Central Africa's turbulent situation will be maintained under the treaty's stabilization efforts in an exquisite and cruel 'peace on the surface.'"


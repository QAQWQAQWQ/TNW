 RegionalOrganization_ExileCommonwealth: "Commonwealth of Nations"
 RegionalOrganization_ExileCommonwealth_colored: "§V$RegionalOrganization_ExileCommonwealth$§!"
 RegionalOrganization_ExileCommonwealth_desc_0: "The Commonwealth is like a remnant of the pre-war world. Once intended to build a 'free association of nations bound by the British Crown,' it has now fallen apart. This organization is like a torso without a head; the economic, political, and military centers that once tightly linked its members have been severed. Though Canada has de facto assumed the position of first among equals, it has never been able to establish true leadership authority.\n\nCanada has abandoned the cruelty and brutality of the old British Empire, preferring a more moderate approach, attempting to coordinate relations between member states through diplomatic means. These member states have vastly different situations - from the 'white dominions' and the West Indies to the radical pan-African republics - yet these efforts have borne little fruit. The complex ideologies within the Commonwealth have even spilled over into the organization's geopolitical landscape; though pro-OFN sentiment dominates among members, it is far from consensus, and internal disputes are common. Today's Commonwealth is barely held together by nominal allegiance to the 'Overseas Queen,' and has become largely hollow, struggling to find its own position and value in the New Order."


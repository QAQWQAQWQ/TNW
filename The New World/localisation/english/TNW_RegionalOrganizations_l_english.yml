 RegionalOrganization_EU: "European Union"
 RegionalOrganization_EU_colored:  "§Q$RegionalOrganization_EU$§!"
 RegionalOrganization_EU_desc_0: "£zollverein_texticon §Q$RegionalOrganization_EU$§! emerged as the European Economic Community evolved toward a political direction. This emerging political union includes numerous pro-German European nations, tightly bound together by the iron bonds between the Axis powers' European states. Its organizational structure and institutions are dedicated to advancing European integration, with the ultimate goal of building an alliance of brother nations - or, more accurately, of making the nations of Europe voluntarily bow their heads and submit forever to the greatest empire in Europe, the Greater German Reich of the German people."
 

 POLITICS_A_D_PATEL_DESC: "Like many of his fellow Indo-Fijians, A. D. Patel was not born in Fiji, yet he dedicated his entire life to building a better homeland for all Fijian citizens. Born in Gujarat, India, Patel's family immigrated to Fiji when he was young. While studying in India, he was inspired by the reformist Congress Party leaders Nehru and Gandhi. Returning to Fiji full of passion and idealism, Patel entered politics, organizing the marginalized Indo-Fijian community to resist oppression by white settlers and native Fijians. After the Second World War, the sugar plantation economy faltered, and relations between the country's ethnic groups grew increasingly tense. By this time, Patel was not only demanding independence but also large-scale social and political reforms.

Though the American press often called Patel the "George Washington of Fiji," the failed assassination attempt against him proved crucial in winning OFN support. The OFN agreed to Fiji's independence under a presidential republic, catapulting Patel to power as Fiji's first president. Patel is a contradictory figure: he sought rapid social reforms, but this trampled on the traditional privileges of the native Fijians who already viewed him with hostility; and allegations of corruption within his party split his Indo-Fijian voter base."
 FIJ_A_D_Patel: "A. D. Patel"
 FIJ_divided_islands: "Divided Islands"
 FIJ_divided_islands_desc: "During the colonial era, Britain brought large numbers of South Asian indentured laborers to Fiji to work the island's numerous sugar plantations. Today, the descendants of these laborers make up the majority of the population, yet they still live in poor conditions and hold far less political power than the native Fijians. Meanwhile, the native Fijians resent the new republic's ambitious reforms aimed at eliminating past discrimination, believing they will undermine their existing privileges."
 FIJ_the_pacific_vanguard: "Pacific Vanguard"
 FIJ_the_pacific_vanguard_desc: "As the OFN's largest forward island base in the Pacific, and given its proximity to Japanese territory, Fiji has been transformed into a fortress, complete with several military bases and round-the-clock air and sea protection. Even so, the Japanese threat and occasional incursions by Japanese fishermen still keep the population on edge."
 FIJ_economic_doldrums: "Economic Doldrums"
 FIJ_economic_doldrums_desc: "In the 1950s, with the dissolution of the British Empire, the shrinking of the Free World, and the collapse of trade with the non-Free World, Fiji's once-prosperous sugar plantation economy slumped, triggering intense social unrest. OFN capital investment and "soldier dollars" from military bases injected new life into the market, barely stabilizing the domestic economy. However, Fiji has yet to find its unique niche in the changing world. With economic stagnation, the country's future remains uncertain."

 SER_King_Andrei_I: "King Andrew I"
 POLITICS_KING_ANDREI_I_DESC: "§HBy the Grace of God and the Will of the People, King of Serbia — Andrew I.§!
§W--------------§!
Andrew Karađorđević, grandson of Peter I, third son of King Alexander I Karađorđević of Yugoslavia and Princess Maria of Romania. By his father's command, the prince was born in Bled and baptized with a Slovene name. "Andrew" is also a Serbian name, occupying a place in the Serbian Orthodox liturgical calendar, carrying profound meaning in Christian tradition and culture — for it is the name of the Apostle Peter's brother, the first-called. Thus all regard this prince as baptized in the name of a saint, the very saint honored by the Karađorđević family at their christenings.

His Majesty graduated from Clare College, Cambridge, with a degree in mathematics, succeeding Peter II, and has apologized repeatedly for his brother's resistance against Germany. His Majesty is mild-tempered, and on this Serbian soil he feels no fervor for anything. He is like a heavy stone, just there, a silent sunstone. Nothing happens to him, just as nothing happens to a sunstone. As for Serbia, he only wishes the kingdom to be as he is, inheriting his character. Yet where Serbia will ultimately sail remains a mystery."

 SER_the_vanguard: "The Vanguard"
 SER_the_vanguard_desc: "§H"And you, child, will be called the prophet of the Most High... to go before the Lord to prepare the way for Him." (1:76)§!

The Vanguard Ljotić demonstrated through action and conviction to the world and to the Serbian people: first and foremost he is an Orthodox Christian, and only secondarily a revolutionary; he is a patriot, a true Serb. Together with his cabinet, he brought the king home and rebuilt the Orthodox state. On Yugoslav soil, the Serbs still stand proud. The Lord loves mankind, and the Vanguard, as His thought projected upon this land, created clerical fascism, founded the National Revolutionary Alliance, and shaped Serbia. Of this there is no doubt. He built this country; he is its father, the father of countless souls. Now, people of Serbia, behold him. Raise your hands, open your mouths and eyes, and gaze upon him.

For he is a true Christian, a forerunner."

 SER_the_realm_of_orthodoxy: "The Realm of Orthodoxy"
 SER_the_realm_of_orthodoxy_desc: "§H"The Serbs... came to the emperor, were baptized by the emperor, and received teachers sent by the emperor back to their land." — De Administrando Imperio§!

You were once the guide to eternal life, archbishop and teacher. For you have reached the other shore, O holy Sava, and enlightened your homeland, renewing it with the Holy Spirit. Like planting an olive tree in a spiritual garden, you raised your most sacred children... therefore I send you to open their eyes, to turn them from darkness to light, from the power of Satan to God; that they may receive forgiveness of sins and an inheritance among all those who are sanctified.

Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit; teaching them to observe all that I have commanded you."

 SER_the_nations_economic_state_catalyzed_stagnation: "National Economic State — §eStagnation§!"
 SER_the_nations_economic_state_catalyzed_stagnation_desc: "§H"Keep your lives free from the love of money and be content with what you have..." Hebrews 13:5§!

The nations are separated as a shepherd divides sheep from goats. I was hungry and you gave me food; I was thirsty and you gave me drink... whatever you did for one of the least of these brothers and sisters of mine, you did for me. If a brother or sister is without clothes and daily food, and you say to them, "Go in peace; keep warm and well fed," but do nothing about their physical needs, what good is that?

Whoever is kind to the poor lends to the Lord, and He will reward them for what they have done.

So avoid godless chatter and endless genealogies; such things promote speculation rather than God's work, which is by faith."

 SER_the_national_military_turmoil_unchecked: "National Military — §rDisorder§!"
 SER_the_national_military_turmoil_unchecked_desc: "§H"The centurion came to Jesus and begged Him, saying, 'Lord, my servant lies paralyzed at home in terrible suffering.' Jesus said, 'I will go and heal him.' The centurion replied, 'Lord, I do not deserve to have You come under my roof... I myself am a man under authority, with soldiers under me...' When Jesus heard this, He was amazed and said to those following Him, 'Truly I tell you, I have not found such great faith even in Israel.'"§!

Put on the full armor of God: buckle the belt of truth around your waist, put on the breastplate of righteousness... take up the shield of faith... put on the helmet of salvation... and the sword of the Spirit.

Share in suffering as a good soldier of Christ Jesus. A soldier in active service does not entangle himself in civilian affairs, so as to please his commanding officer."

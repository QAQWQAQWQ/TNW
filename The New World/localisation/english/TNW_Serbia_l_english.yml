 SER_Radova_Karadzic: "Radovan Karadžić"
 POLITICS_RADOVA_KARADZIC_DESC: "Karadžić was born on June 19, 1945, in Petnica near Šavnik. His father, Vuk, was a craftsman by trade, working as a shoemaker and tailor, and was skilled on the gusle, double-pipe, and diple. The Karadžić family had originally migrated from Kosovo and Metohija, settling in Lijeva Rijeka, Banjani, and the Durmitor region. He completed his primary education in Nikšić, and at fifteen went to Sarajevo to study at the medical faculty, later transferring to the Sarajevo School of Medicine.

As Bosnian nationalism grew and the government of national salvation stabilized, Karadžić moved with his father to Belgrade, where he settled. In 1990, he entered politics, and due to his reputation among the diaspora, quickly secured a position in the Serb bloc, rivaling Šešelj.

He is a devout Orthodox Christian, regarded as patient, calm, mild-mannered, and highly skilled at negotiation — fitting for a man of the Serbian people."

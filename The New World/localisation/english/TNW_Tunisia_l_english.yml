 TUN_Enrico_Bombieri:0 "Enrico Bombieri"
 POLITICS_MUHAMMAD_VIII_DESC:0 "Tunisia today is like the old saying: you can dodge the first day of the fifteenth, but not the fifteenth itself. When the Axis armies swept across North Africa, Tunisia joyfully threw off the French yoke, only to find itself under Rome's harsher rule. Over the past thirty years, the European order has been crushed and mangled beyond recognition, yet Tunisia remains as it always was. In Bey Muhammad VIII Amin of the Husainid dynasty, the stagnation amid upheaval is embodied perfectly.

Muhammad VIII, better known as Lamine Bey, was the cousin and chosen heir of Moncef Bey. Moncef Bey, who during the war worked to throw off French hegemony, built post-war Tunisia. Though the Bey's concessions to Italy aroused strong resentment among some of the people, he is still considered a national hero of Tunisia. After Italy's plans to annex Tunisia into its African territories failed, Rome selected Lamine Bey as regent of the protectorate. Ironically, this regime was no different from France's handiwork from long ago.

Italy is both Tunisia's liberator and its enslaver; Lamine Bey is both Italy's accomplice and the driving force of resistance against it. Legally, the Bey is the representative of Rome's king, but like his cousin, he too hopes to negotiate with Italy to bring freedom to Tunisia. The Destour party he is connected to is both a collaborative institution and a truly reliable nationalist force, seeking a cautious, legal path toward a free homeland. Yet Tunisia is a deeply divided place, and the Bey grows ever more frail — if the Bey were to die suddenly, the delicate balance the Destour has carefully built could crumble in an instant."
 TUN_the_second_treaty_of_bardo:0 "Second Treaty of Bardo"
 TUN_the_second_treaty_of_bardo_desc:0 "In 1881, France and the then-Bey of Tunisia signed the Treaty of Bardo, completely stripping him of his autonomy. Some naively thought France's defeat would make life easier, but the result was another humiliation.

Under Italy's manipulation, the Bey has become a powerless regent. As for the meager economic benefits, whether in industry, agriculture, or tourism, all are drained and exploited dry by the suzerain.

But rumors of Tunisian oil may yet bring a stream of gold to the kingdom…"
 TUN_destour_hegemony:0 "Destour Hegemony"
 TUN_destour_hegemony_desc:0 "The fate of the Destour party is ironic: its original purpose was to organize Arabs to collectively oppose French colonialism, yet now it must reluctantly align itself with the Italian colonizers.

After the Neo-Destour collapsed, it had to merge into the old Destour, making it the only legal party in Tunisia. But political violence and domestic tensions are making the party increasingly unstable: torn apart by internal factions on one side, and challenged by growing dissident movements like communism on the other."
 TUN_the_italo_tunisians:0 "Italo-Tunisians"
 TUN_the_italo_tunisians_desc:0 "For hundreds of years, Tunisia has been a refuge for Italian immigrants who had nowhere to go and nothing to their name. Under French colonial rule, the Italo-Tunisians suffered greatly, and the promises of fascist glory and connection to the motherland once captivated them.

Now that Tunisia has truly fallen under Italian rule, this group has split sharply: the lofty promises of fascism remain unfulfilled, and anti-fascist and left-wing ideas have gained support among parts of the population. The Italians of Tunisia have formed two fiercely opposed camps, and only struggle will decide which one prevails."

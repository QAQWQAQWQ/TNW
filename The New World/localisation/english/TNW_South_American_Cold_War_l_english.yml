 SACW_big_cold_war_info_button: "§WAfter WWII, §hParaguay§! defeated §oBolivia§! in the First Chaco War, winning independence for §nSanta Cruz§!. §KBrazil§! and §DArgentina§! added new grievances to old ones, hostility and confrontation intensified, and South America became a microcosm of the global Cold War. Rivalry between the two nations has existed since independence from colonial powers, and war has visited these lands. It is foreseeable that future conflicts will only grow fiercer, bringing more destruction.\n\nUnfortunately, despite politicians' best efforts, this Cold War has only grown colder. §nThe Axis§! won decisively; §DArgentina§! sought diplomatic and economic ties with the victors, while §KBrazil§! sought close relations with its new American ally. The gulf of suspicion only deepened.\n\nConflicts between §DArgentina§! and §jChile§! over §aAntarctica§!, §KBrazil§!'s occupation of §QFrench Guiana§!, and the Second Chaco War between §oBolivia§! and §hParaguay§! combined to make this Cold War §Vinevitable§!.\n\nClashes of interest between nations will directly affect the fates of millions across the continent. Violence and chaos spread like wildfire across South America, and we must remember...\n\n§V'The hard part of playing chicken is knowing when to swerve.'§!"
 cold_war_info_tt: "§WThe balance of power between §KBrazil§! and §DArgentina§! is influenced by:\n- §YPolitical§! influence over other Latin American nations\n- §YEconomic§! success as measured by GDP\n- §YMilitary§! strength across army, navy, and air force\n\nThough other powers may draw nations into their spheres, the diplomatic situation between §KBrazil§! and §DArgentina§! is the only true Cold War in the Americas."
 SAmap_nation_debug_tt: "§Y[THIS.GetNameWithFlag]§!\nAlliance: [GetSacwAllignment]\nVictory Score: [?SA_cold_war_value|Y0]\nX = [?SA_cold_war_map_x?|Y0]\nY = [?SA_cold_war_map_y|Y0]"
 SAmap_nation_tt: "[GetSATooltip]"
 SAmap_tenstion_tt: "§WThough few deny the §GSouth American Cold War§! is a reality, many prefer peaceful means to resolve conflicts.\n\nIf §Glow tension is maintained§!, proxy conflicts are more likely to be resolved through mutually beneficial agreements, offering a glimmer of hope for a peaceful end to the Cold War.\n\nHowever, if §Rtension continues to rise§!, a continent-spanning war that drenches the land in blood becomes unavoidable, even if Latin American nations have no desire for military conflict.§!\n\nCurrent tension is [GetSAColdWarTensionLevel], with effects:\n[GetSAColdWarTensionLevelEffects]"

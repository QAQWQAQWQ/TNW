 SACW_nuclear_mechanic_tooltip_tt: "We need nuclear weapons to secure our defense. Our progress depends on budget and supporters: neither side has the ability to build nuclear weapons alone, requiring foreign support.\n\nAdditionally, project security is critical, especially regarding superpowers: no superpower wants to see nuclear proliferation, and if they learn what we are doing, they will retaliate economically and perhaps through covert means. If their retaliation succeeds, our program could be permanently damaged."

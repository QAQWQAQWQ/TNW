 TNO_TIPS_AND_TRICKS_CLOSE_TT: "§FYou can reopen this window by left-clicking the §Mquestion mark§! button to the left of the §GAlert Level§! counter.\n§YGood luck, and have fun!§!§!"
 TNO_tips_and_tricks_entry_title_0: "Introduction"
 TNO_tips_and_tricks_entry_desc_0: "Welcome to §WThe New Order§!!\n- This mod is massive and deep, and some mechanics may overwhelm new players. We have prepared this guide to help you get up to speed faster.\n- You can switch tips using the arrow buttons at the bottom, click the dice button for a random tip, or directly click the §YContents§! on the left to view specific topics.\n- You can reopen this guide at any time by clicking the §Mquestion mark button§! to the left of the §GAlert Level§! counter in the top-right corner."
 TNO_tips_and_tricks_entry_title_100: ""
 TNO_tips_and_tricks_entry_desc_100: ""
 TNO_tips_and_tricks_entry_category_1: "§GEconomy§!"
 TNO_tips_and_tricks_entry_category_2: "§RArmy and Warfare§!"
 TNO_tips_and_tricks_entry_category_3: "§YConstruction§!"
 TNO_tips_and_tricks_entry_title_1: "Introduction"
 TNO_tips_and_tricks_entry_desc_1: "- One of §WTNO§!'s distinguishing features is its simulation of the economy. The system looks complex, but with a little guidance you will master it after your first game.\n- Check the economy panel at least once a week and adjust spending accordingly.\n- Do not fear deficits, but keep them below GDP growth rate. Note that any deficit means debt-to-GDP ratio rises over time.\n- In your first few games, aim for a balanced budget to learn the mechanics."
 TNO_tips_and_tricks_entry_title_2: "Production Units"
 TNO_tips_and_tricks_entry_desc_2: "- £tt_prod_unit §GProduction Units§! abstract national industrial power, replacing vanilla factories.\n- £tt_prod_unit §GProduction Units§! come mainly from §YGDP§!, but you can also gain more through focuses and decisions.\n- In the §YEconomy§! and §YProduction§! panels, you can manually allocate £tt_prod_unit §GProduction Units§! to £tt_civ_factory §Rcivilian§! or £tt_mil_factory §Gmilitary§! production. A portion is also automatically allocated to produce £tt_consumer_goods §Bconsumer goods§!."
 TNO_tips_and_tricks_entry_title_3: "Power Grid"
 TNO_tips_and_tricks_entry_desc_3: "- £tt_prod_unit §GProduction Units§! need grid £tt_power §Ypower§! to function. Hover over the §Ylightning icon§! in the top status bar to see the grid's £tt_power §Ynet power production§!.\n- £tt_power §Ypower§! is mainly §Ggenerated§! by §Ythermal power plants§!, §Ynuclear plants§!, and other generation facilities; it is §Rconsumed§! by §Yoffice buildings§!, §Yschools§!, and other structures. §Ycivilian power consumption§! is also an important expense (detailed below).\n- To keep the economy running smoothly, plan ahead and ensure generation always meets growing demand."
 TNO_tips_and_tricks_entry_title_4: "Civilian Consumption"
 TNO_tips_and_tricks_entry_desc_4: "- In-game, the various goods citizens need for daily life are abstracted as £tt_consumer_goods §Bconsumer goods§!, and the state must allocate some production capacity to them. The grid also must supply £tt_power §Ypower§! to civilian businesses and homes.\n- In the §YProduction Units§! section of the §YEconomy§! panel, you can adjust the share of capacity allocated to civilian supply: §Gabove§! 100% gives a §Gbonus§!, §Rbelow§! gives a §Rpenalty§!.\n- Watch this indicator closely and adjust promptly."
 TNO_tips_and_tricks_entry_title_5: "Budget Management"
 TNO_tips_and_tricks_entry_desc_5: "- The §YEconomy§! panel shows all economic information; the four buttons around the center are the core functions.\n- §RFiscal Austerity§! controls spending scale, while §RTax Cuts§! and §RTax Hikes§! adjust §Gfiscal revenue§!. Below them are draggable §Ysliders§! that change your §Yspending§!.\n- Moderate §Rfiscal deficits§! stimulate growth, but always keep the §Rdeficit§! under 10%; remember that any §Rdeficit§! increases §Rdebt§!."
 TNO_tips_and_tricks_entry_title_6: "Central Bank Policy"
 TNO_tips_and_tricks_entry_desc_6: "- §YCentral Bank Policy§! gives you §Gstrategic bonuses§! to make the economy easier to manage.\n- Click the button below the §JMonetary Expansion§! slider on the left to set a §YCentral Bank Policy§!. Policies take a year to take effect, so plan ahead.\n- §YMonetary Overdrive§!: raises §Geconomic growth rate§!, most effective when £inflation_texticon §Rinflation§! is below 4%.\n- §YBalanced Budget§!: lowers £inflation_texticon §Rinflation§!, most useful when £inflation_texticon §Rinflation§! is above 4%.\n- §YPower Surge§!: provides extra £tt_power §Yelectricity§! scaled to §YGDP§!, especially effective for small nations."
 TNO_tips_and_tricks_entry_title_7: "Preventing Crises"
 TNO_tips_and_tricks_entry_desc_7: "- Preventing §ecrises§! is all about prevention. Watch the indicators in the bottom-right of the §YEconomy§! panel and adjust §Yfiscal spending§! promptly.\n- To avoid §efiscal crisis§!, ensure §Rdebt§! stays below the §Rdebt ceiling§! shown in the top-left of the economy panel.\n- Maxing out §Yspending§! gives many §Guseful bonuses§!, so consider other ways to cut costs.\n- During war or when playing as a Russian warlord, you can raise §Gfiscal revenue§! by imposing a §Ywar tax§!.\n- In peacetime, save money by reducing deployed army divisions and air force size."
 TNO_tips_and_tricks_entry_title_8: "Economic Sliders"
 TNO_tips_and_tricks_entry_desc_8: "- §YAdjusting sliders§! is not mutually exclusive with §RFiscal Austerity§! and §RTax Hikes§!. Consider their effects and synergy together.\n- Click the §Ggear§! icon to the left of a slider name to open the category panel and use sub-sliders for more precise fund allocation.\n- Each slider directly affects policy implementation rate. For example, the §Obureaucracy funding§! slider under the §Oadministrative spending§! category raises §Gtax efficiency§!, increasing §Grevenue§!.\n- Recommend keeping §Obureaucracy funding§! and §Oscience spending§! at maximum at all times."
 TNO_tips_and_tricks_entry_title_11: "Production"
 TNO_tips_and_tricks_entry_desc_15: "- §YField guns§! are obsolete weapons in modern warfare. Though their firepower is undeniable, many §Rdrawbacks§! make them quite outdated.\n- Artillery is slow and cumbersome; putting §Yartillery battalions§! in divisions §Rreduces§! their speed.\n- Artillery can deal devastating fire, but also significantly §Rreduces§! a division's §Gequipment capture rate§!.\n- On top of that, compared to all other §Ybattalions§!, §Yartillery§! also §Roverall reduces§! organization and recovery speed.\n- §YAnti-tank guns§! and §Yanti-air guns§! are similarly obsolete, replaced by man-portable infantry weapons."
 TNO_tips_and_tricks_entry_category_0: "§WIntroduction§!"
 Tips_and_Tricks_Contents_Folder_button_tt: "§FClick to open the introduction for \"[GetTipContentsFolder]\"§!"
 Tips_and_Tricks_Contents_Content_button_tt: "§FClick to open tips related to \"§Y[GetTipContentsContent]§!\"§!"
 TNO_tips_and_tricks_entry_title_9: "Social Development"
 TNO_tips_and_tricks_entry_desc_9: "- Scroll to the very bottom of the §YPolitics§! panel to see Social Development.\n- Click the §Mblue box§! to the right of a social development category name to see all levels and their effects.\n- Hover over §Opoverty rate§! to see the impact of the current level.\n- Hover over the progress bar to the right of \"Trend:\" to see monthly progress for that category.\n- Beyond the shown effects, §YSocial Development§! also affects national §Gproduction§! and §Mscience§! efficiency. Recommend §Gimproving§! all indicators to stay competitive."
 TNO_tips_and_tricks_entry_title_10: "Introduction"
 TNO_tips_and_tricks_entry_desc_10: "- War in the §YCold War§! era may differ from what you are used to. Great powers avoid direct war with each other, instead building allies through §Yproxy conflicts§! and expanding influence worldwide.\n- Factions like §ZYunnan§! and §&Russian warlords§! offer more traditional war-focused gameplay.\n- Whichever nation you choose, note that §WTNO§! also brings many changes to combat, divisions, and logistics; this entry will guide you through them.\n- Before you start, remember that increasing §Oarmy spending§! during conflicts makes your forces fight harder."
 TNO_tips_and_tricks_entry_desc_11: "- To win wars, you need to produce weapons. You can manufacture weapons in the §YProduction§! panel.\n- You can allocate more £tt_prod_unit §GProduction Units§! to £tt_mil_factory §Gmilitary production§! by clicking the §Ggreen gear button§!.\n- If §YSocial Development§! is too low, you may only be able to use £tt_mil_workshop §Omilitary workshops§!, which provide twice the §Yproduction§! slots but at much lower efficiency.\n- Given limited production capacity, recommend standardizing production. For small nations, consider producing only §Yinfantry equipment§!."
 TNO_tips_and_tricks_entry_title_12: "Division Templates - Basics"
 TNO_tips_and_tricks_entry_desc_12: "- §WTNO§!'s extensive changes also extend to §MAI§!. To defeat enemies in combat, upgrading and optimizing your §Ydivision templates§! is crucial.\n- In §WTNO§!, §Rterrain penalties§! are significantly stronger. Pay attention to what terrain you will fight in when designing divisions.\n- Most §Yproxy conflicts§! can be resolved by sending §Yvolunteer forces§!. Since only a few units can be sent to a given proxy conflict, make sure the divisions you send are §Rfully combat-ready§!, with a §Ycombat width§! of 20 or higher.\n- In §WTNO§!, §Ysupport companies§! provide considerable §Gbonuses§!; recommend including as many as possible."
 TNO_tips_and_tricks_entry_title_13: "Division Templates - Infantry"
 TNO_tips_and_tricks_entry_desc_13: "- §YInfantry§! is the mainstay of the army, cheap to produce and suffers the lightest §Rterrain penalties§!. §YInfantry§! comes in three types:\n1) §.Light infantry§!, weaker overall but cheaper and with faster organization recovery.\n2) §sRegular infantry§!, balanced in all respects.\n3) §wElite infantry§!, expensive but the strongest fighters.\n- You can also field §Bmarines§! and §bmountain infantry§!, which consume less supply than other infantry types. In §WTNO§!, §Yspecial forces§! have no cap and can be fielded freely."
 TNO_tips_and_tricks_entry_title_14: "Division Templates - Mobile"
 TNO_tips_and_tricks_entry_desc_14: "- Unlike §Wvanilla§!, in §WTNO§! almost all §Ybattalions§! and §Ysupport companies§! affect a division's §Gequipment capture rate§!. If you win a battle, the division's §Gequipment capture rate§! is calculated based on the hours the battle lasted.\n- §YMobile battalions§! have the highest §Gequipment capture rate§!.\n- In most terrain, §Ymobile forces§! also suffer significant §Rpenalties§!, limiting their flexibility; they usually perform worse than §Yinfantry§! in combat.\n- Since §Radverse terrain§! is common in §Yproxy conflicts§!, focus on other §Ybattalions§! when designing templates."
 TNO_tips_and_tricks_entry_title_15: "Division Templates - Artillery"
 TNO_tips_and_tricks_entry_title_16: "Division Templates - Armor"
 TNO_tips_and_tricks_entry_desc_16: "- In modern warfare, §Ycombined arms§! tactics are crucial. Fielding §Yarmor§! in divisions §Greduces§! casualties, noticeably §Gincreases§! firepower, and §Genhances§! breakthrough.\n- §YArmor§! also benefits from a fairly high §Gequipment capture rate§!.\n- §RTerrain and organization penalties§! are the biggest §Rweakness§! of §Yarmor battalions§!, but they can be fairly easily §Goffset§! by using them alongside §Yinfantry battalions§!.\n- Though you may lack modern §Yarmor§! tech, you can compensate by improving available §Ychassis§! templates."
 TNO_tips_and_tricks_entry_title_17: "Armor Types"
 TNO_tips_and_tricks_entry_desc_17: "In §WTNO§!, there are three types of §Yarmor§! units:\n1) §YMain battle tanks§!, the standard armor unit. §RExpensive§! and suffer §Rsevere terrain penalties§!, but quite §Gpowerful§! in combat.\n2) §YHeavy tanks§!, still viable but obsolete; they can fight equipment about §Bone tier above§! current tech. That is, §Y1950s heavy tanks§! can fight §Y1960s MBTs§!. As a balance, they are §Rslower§! and suffer §Yworse terrain penalties§!.\n3) §YArmored fighting vehicles§!, often underestimated; these light armored units are §Gfast§!, §Gcheap§!, and suffer the §Glightest terrain penalties§!. If properly equipped, their combat power can even §Gexceed§! that of §Ymain battle tanks§!."
 TNO_tips_and_tricks_entry_title_18: "Supply and Terrain"
 TNO_tips_and_tricks_entry_desc_18: "- A well-developed §Ylogistics system§! is key to winning wars. When planning operations, note the location of strategic terrain: §Yrailways§!, §Ysupply hubs§!, §Brivers§!, §bmountains§!.\n- If divisions lack §Gsupply§!, consider adding a §Ylogistics company§! and building §Ysupply hubs§!.\n- Unlike §Wvanilla§!, §Ysupply hubs§! are relatively §Gcheap§! to build, so do not avoid them; the cap is §Rtwo per state§!.\n- Certain technologies improve supply and §Greduce§! §Rterrain penalties§! you may suffer."
 TNO_tips_and_tricks_entry_title_19: "Support Companies"
 TNO_tips_and_tricks_entry_desc_19: "- §YSupport companies§! provide §Gbonuses§! such as §Yorganization§!, §Yorganization recovery§!, §Ysupply consumption§!, and §Gequipment capture rate§!. Here is some information on their effects:\n- §YRecon§! and §Yengineer companies§! give the most and strongest bonuses - always include them.\n- §YLogistics companies§! give the largest §Yorganization recovery§! §Gbonus§!.\n- §YMaintenance companies§! give the largest §Gequipment capture rate§! §Gbonus§!.\n- §YSignal companies§! fall between the two, with the notable highlight of providing a §Yinitiative§! §Gbonus§!, letting divisions enter battle §Gfaster§!."
 TNO_tips_and_tricks_entry_title_20: "Helicopters"
 TNO_tips_and_tricks_entry_desc_20: "- §YHelicopters§! are a modern invention used to field the strongest §Ysupport companies§!. They deal §Gtremendous damage§!, have §Gvery low terrain penalties§!, but §Rsignificantly increase fuel consumption§! and §Rreduce equipment capture rate§!.\n- Adding an §Yair assault infantry support company§! to divisions makes them §Gfaster§!, giving a clear edge in combat.\n- §YAttack helicopter support companies§! fill most of the roles formerly handled by §Yartillery§!, with §Gfewer§! penalties.\n- §YAnti-submarine helicopters§! and §Ymedevac companies§! can also be fielded, but there are §Gcheaper§! and §Gstronger§! alternatives.\n- Note that you can win even without §Yhelicopters§!."
 TNO_tips_and_tricks_entry_title_21: "Air Warfare"
 TNO_tips_and_tricks_entry_desc_21: "- Providing §zclose air support§! to units gives a §Ghuge advantage§! on the battlefield.\n- The main aircraft types to focus on are §Yinterceptors§! and §Yclose air support planes§!.\n- Though §Yfighters§! exist, the §Ymaneuverability§! of §Yinterceptors§! is usually §Gsuperior§! in dogfights.\n- Note that while aircraft help greatly, they are §Rexpensive to produce§!, so only consider building them once you have some industrial strength.\n- Of course, you can win wars relying on ground forces alone. But to compensate, consider fielding §Yanti-air equipment§! in your units, such as §Yman-portable air-defense systems§!."
 TNO_tips_and_tricks_entry_title_22: "Naval Warfare"
 TNO_tips_and_tricks_entry_desc_22: "- In §WTNO§!, §Bnaval battles§! are rare, but navies may still be useful in certain §Yproxy conflicts§!. Generally, recommend §Rcompressing§! the naval budget and not organizing shipbuilding programs.\n- §BAmphibious landings§! are also rare. Unless you plan to fight a §Ysuperpower§!, there is no need to station troops on the coast.\n- §KItaly§!, §mthe United States§!, §qGermany§!, and §eJapan§! can gain §Gspecial bonuses§! by building a certain number of ships, including a §Gbonus§! to §Mpolitical power§!. You can view this in the §YCold War§! panel."
 TNO_tips_and_tricks_entry_title_23: "Winning Wars"
 TNO_tips_and_tricks_entry_desc_23: "- Victory in war depends heavily on §Ydivision templates§!. If you lose to §MAI§!, simply look at their §Ytemplate§! and adjust yours accordingly.\n- Note that the §Gequipment capture rate§! bonus means attritional warfare is a viable strategy in §WTNO§!. Also, §Renveloping§! enemy forces is still a §Gfaster§! way to end conflicts.\n- In §Yproxy conflicts§!, §Renveloping§! and §eannihilating§! the opponent's §Yvolunteers§! gives a §Ghuge advantage§!. Sending §Ymilitary advisors§! and §Yequipment aid§! is equally important to victory in such conflicts."
 TNO_tips_and_tricks_entry_title_24: "Introduction"
 TNO_tips_and_tricks_entry_desc_24: "- You may notice §WTNO§! has many unfamiliar new §Ybuildings§!. This entry explains their purpose and when to build them.\n- Since direct wars are rare, there is no need to build §Yforts§! or §Yfort complexes§!. If needed, you can acquire them through §Ydecisions§! or the §Yfocus tree§!.\n- The most important §Ybuildings§! are £tt_power §Ypower plants§! and §Yinfrastructure§!.\n- All §Ybuildings§! require £tt_prod_unit §GProduction Units§! allocated to £tt_civ_factory §Rcivilian factories§! to construct; you can allocate them via the menu with the §Ggreen gear§! on the right side of the panel."
 TNO_tips_and_tricks_entry_title_25: "Infrastructure"
 TNO_tips_and_tricks_entry_desc_25: "- §YInfrastructure§! has a maximum level of 10; each level §Gimproves§! a state's §Yresource extraction§!, §Yunit speed§!, §Ylogistics supply§!, and gives §Gadditional§! §Ybuilding slots§!. Most importantly, it also gives §Gadditional§! §Yconstruction speed§!.\n- Thus, higher-level §Yinfrastructure§! lets you build all other buildings §Gfaster§!. Building infrastructure should be your top priority.\n- Build §Yinfrastructure§! first in states that are §Grich in resources§!. Note that if other nations import the §Yresources§! you produce, you gain §Grevenue§! and £tt_prod_unit §GProduction Units§!.\n- Recommend building §Yinfrastructure§! to level 8.\n- §YInfrastructure§! and §Ypower plants§! also provide §GGDP growth rate§!."
 TNO_tips_and_tricks_entry_title_26: "Power Plants"
 TNO_tips_and_tricks_entry_desc_26: "- Your second priority should be building §Ythermal power plants§! and §Ynuclear reactors§!.\n- Though conversion ratios vary by nation, the general target is 5 £tt_power §Ypower§! per billion §GGDP§!. For §eJapan§!, the target should be 10 £tt_power §Ypower§! per billion §GGDP§!.\n- Note that researching §Ypower plant§! upgrades in §mindustrial tech§! gives extra £tt_power §Ypower generation§! for all plants; prioritize this tech.\n- §YPower plants§! also provide §Ybuilding slots§!, §Gincrease§! §Yconstruction speed§!, and §G§!§Yincrease resource extraction§!.\n- Focus on building power plants in states with well-developed §Yinfrastructure§!."
 TNO_tips_and_tricks_entry_title_27: "Building Coverage"
 TNO_tips_and_tricks_entry_desc_27: "- §YSchools§!, §Yhospitals§!, §Yprisons§!, §Ymilitary bases§!, and §Yadministrative buildings§! provide national §Gbonuses§! based on §Ynational coverage§!.\n- You can enter §Ybuilding map mode§! by clicking the §m<§! button to the left of the §mstatistics§! icon in the bottom-right, to see where buildings are most effective.\n- Click the circle with the corresponding building icon in the §YConstruction§! tab to see the building's §Ynational coverage§! and the §Gbonuses§! it provides.\n- These §Ybuildings§! also affect your §Ypolicy implementation rate§!.\n- Buildings are ranked by §Rimportance§! of §Ycoverage§!: §Yadministrative buildings§!, §Yschools§!, §Yprisons§!, and §Ymilitary bases§!."
 TNO_tips_and_tricks_entry_title_28: "Logistics"
 TNO_tips_and_tricks_entry_desc_28: "- The last §Ybuildings§! to note are §Ysupply hubs§! and §Yrailways§!.\n- §YRailways§! are ground §Ysupply§! routes. Note that §Ysupply§! can also be transported via §Brivers§!, though less efficiently.\n- §YSupply hubs§! are nodes that route §Ysupply§! to §Yunits§!; §Ynaval bases§! are nodes for §Bsea transport§!. These bases should already be at a sufficient level.\n- In §WTNO§!, the §Yconstruction cost§! of both types of §Ybuildings§! is §Glower§! than vanilla, so do not avoid building them.\n- Note that a state can only have 2 §Ysupply hubs§!, so choose locations carefully."

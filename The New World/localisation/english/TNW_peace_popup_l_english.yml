l_english:
 TNO_PEACE_POPUP_TITLE: "Diplomatic Alert"
 TNO_PEACE_POPUP_DESCRIPTION: "[GetWarStatus]"
 TNO_PEACE_POPUP_FLAVOR: "[GetFlavor]"
 TNO_PEACE_POPUP_CLOSE: "Close"
 TNO_PEACE_POPUP_FLAG1_TT: "§GWinner:§![winning_country.GetFlag]§Y[winning_country.GetName]§!"
 TNO_PEACE_POPUP_FLAG2_TT: "§RLoser:§![losing_country.GetFlag]§Y[losing_country.GetName]§!"
 TNO_PEACE_POPUP_COUNTRY_PLURAL: "and its allies"
 TNO_PEACE_POPUP_COUNTRY_SINGULAR: ""
 TNO_PEACE_POPUP_COUNTRY_PLURAL_HAS: "and its allies have"
 TNO_PEACE_POPUP_COUNTRY_SINGULAR_HAS: "has"
 TNO_PEACE_POPUP_WAR_CONCLUSION: "[GetWarConclusionLoc]"
 TNO_PEACE_POPUP_WAR_CONTINUING: "[GetWarContinuationLoc]"
 TNO_PEACE_POPUP_WAR_CONCLUSION_OSTLAND: "§Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas] defeated §Y[losing_country.GetNameWithFlag]§![GetLoserAllies],\nbut the struggle for control of §YOstland§! continues to rage."
 TNW_PEACE_POPUP_WAR_CONCLUSION_NIGERIAN_CIVIL_WAR: "The guns of brother against brother have finally fallen silent. In this civil war,\n§Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas] defeated §Y[losing_country.GetNameWithFlag]§!. All that remains of this land is scorched earth and endless regret."
 TNO_PEACE_POPUP_WAR_CONCLUSION_UKRAINE: "§RBlood is being shed§! in the §Ybreadbasket of Germany§!, as §Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas] defeated §Y[losing_country.GetNameWithFlag]§![GetLoserAllies]."
 TNO_PEACE_POPUP_WAR_CONCLUSION_SAF_WIN: "The §YSouth Africa War§! has finally come to an end.\n§Y[winning_country.GetNameWithFlag]§![GetWinnerAllies] has finally defeated §Y[losing_country.GetNameWithFlag]§![GetLoserAllies]."
 TNO_PEACE_POPUP_WAR_CONCLUSION_SAF_LOSE: "The §YSouth Africa War§! has finally come to an end.\n§Y[winning_country.GetNameWithFlag]§![GetWinnerAllies] has finally defeated §Y[losing_country.GetNameWithFlag]§![GetLoserAllies]."
 TNO_PEACE_POPUP_WAR_CONCLUSION_GCW: "The delicate balance of power in the §YGerman Civil War§! has been broken as §Y[winning_country.GetNameWithFlag]§![GetWinnerAllies] has conquered §Y[losing_country.GetNameWithFlag]§![GetLoserAllies]."
 TNO_PEACE_POPUP_WAR_CONCLUSION_DEFAULT: "§Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas] defeated §Y[losing_country.GetNameWithFlag]§![GetLoserAllies] in war."
 TNO_PEACE_POPUP_WAR_IBERIAN_WARS: "As the §YIberian Wars§! intensify,\n§Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas] has defeated §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_AMERICAN_POLICING: "In an §YAmerican peacekeeping operation§!,\n§Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas] defeated §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_TURKISH_VICTORY: "In the §Yborder conflict§! following the §YMalta Conference§! bombing, §Y[winning_country.GetNameWithFlag]§! has seized the territory it claimed from §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_IME_VICTORY: "In the §Yborder conflict§! following the §YMalta Conference§! bombing,\n§Y[winning_country.GetNameWithFlag]§! successfully repelled the attack by §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_GER_PLANZEROWIN: "§Y[winning_country.GetNameWithFlag]§! has once again firmly clamped down on §Y[losing_country.GetNameWithFlag]§!,\nending its bold secession attempt."
 TNO_PEACE_POPUP_WAR_CONCLUSION_INS_LOSE: "§Y[winning_country.GetNameWithFlag]§! has thrown off the chains of enslavement, defeating §Y[losing_country.GetNameWithFlag]§! and §YSukarno§!'s corrupt regime in the §YIndonesian Civil War§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FRI_LOSE: "§Y[winning_country.GetNameWithFlag]§! has maintained the unity of the archipelago in the §YIndonesian Civil War§!, repelling the rebels of §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_PHI_BLITZ: "In the fires of the Bataan Blitz, §Y[winning_country.GetNameWithFlag]§! defeated §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_PHI_BLITZ_REBEL_WIN: "In the fires of the Bataan Blitz, [UPH.GetFlag]§Y[UPH.GetName]§! and [SPH.GetFlag]§Y[SPH.GetName]§! freed the Philippines from the yoke of §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_PHI_LANDING: "After the §YXIV Corps invasion§!, §Y[winning_country.GetNameWithFlag]§! conquered §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_SRT_DEAD: "The military boots of §Y[winning_country.GetNameWithFlag]§! once again tread upon the chests of the fearless warriors of §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_SCHORNER_DEAD: "In the chaos of the §YSlave Revolt§!, §Y[winning_country.GetNameWithFlag]§! successfully crushed the rebels of [losing_country.GetFlag]§Ythe Rossland Military District§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_WAA_1: "In the bitter §YWest African War§!, [winning_country.GetFlag]§Ythe West African Alliance§! repelled the invasion by [losing_country.GetFlag]§Ythe Pan-African Liberation Front§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_PALF_1: "In the bitter §YWest African War§!, [winning_country.GetFlag]§Ythe Pan-African Liberation Front§! drove out [losing_country.GetFlag]§Ythe West African Alliance§! imperialists and their collaborators."
 TNO_PEACE_POPUP_WAR_CONCLUSION_WAAvsFMA_2: "In the melee of the §YWest African War§!, [winning_country.GetFlag]§Ythe West African Alliance§! expelled the imperialists of [losing_country.GetFlag]§Ythe French Military Alliance§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_WAAvsPALF_2: "In the melee of the §YWest African War§!, [winning_country.GetFlag]§Ythe West African Alliance§! repelled the invasion by [losing_country.GetFlag]§Ythe Pan-African Liberation Front§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FMAvsWAA_2: "In the melee of the §YWest African War§!, [winning_country.GetFlag]§Ythe French Military Alliance§! defeated [losing_country.GetFlag]§Ythe West African Alliance§!, reestablishing hegemony in the region."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FMAvsPALF_2: "In the melee of the §YWest African War§!, [winning_country.GetFlag]§Ythe French Military Alliance§! repelled the invasion by [losing_country.GetFlag]§Ythe Pan-African Liberation Front§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_PALFvsWAA_2: "In the melee of the §YWest African War§!, [winning_country.GetFlag]§Ythe Pan-African Liberation Front§! repelled the counterattack by [losing_country.GetFlag]§Ythe West African Alliance§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_PALFvsFMA_2: "In the melee of the §YWest African War§!, [winning_country.GetFlag]§Ythe Pan-African Liberation Front§! expelled the imperialists of [losing_country.GetFlag]§Ythe French Military Alliance§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FMA_3: "In the bitter §YWest African War§!, [winning_country.GetFlag]§Ythe French Military Alliance§! repelled the invading [losing_country.GetFlag]§YPan-African Liberation Front§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_PALF_3: "In the bitter §YWest African War§!, [winning_country.GetFlag]§Ythe Pan-African Liberation Front§! defeated the imperialists and collaborators of [losing_country.GetFlag]§Ythe French Military Alliance§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_URL4: "§Y[winning_country.GetNameWithFlag]§! declares it has captured §Y[losing_country.GetNameWithFlag]§! in the §YSoural diplomatic contest§!"
 TNO_PEACE_POPUP_WAR_CONCLUSION_RUS: "In the struggle for the §YFate of Russia§!, §Y[winning_country.GetNameWithFlag]§! conquered §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_RUS_tabby: "§Y[winning_country.GetNameWithFlag]§! has conquered §Y[losing_country.GetNameWithFlag]§!, and the §RFate of Russia is sealed§!.\n\n§IGod save Russia, for no one else can save her from the fire.§!"
 TNO_PEACE_POPUP_WAR_CONCLUSION_PRC_MEN: "§Y[winning_country.GetNameWithFlag]§! defeated §Y[losing_country.GetNameWithFlag]§!, sending them fleeing."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FIN_red: "§Y[winning_country.GetNameWithFlag]§! has reclaimed its historical territory from §Y[losing_country.GetNameWithFlag]§!, avenging the §YWinter War§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FIN: "§Y[winning_country.GetNameWithFlag]§! has reclaimed its historical territory from §Y[losing_country.GetNameWithFlag]§!, avenging past defeats."
 TNO_PEACE_POPUP_WAR_CONCLUSION_BRY_IRK_AF_2022: "The §Y[IRK.GetFlag] Irkutsk§! government and the §Y[BRY.GetFlag] Buryatia§! government, under the auspices of the §Y[OMO.GetFlag] Harmonious Realm§!, have joined together in §CHarmony§! as §Y[BRY.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONSLUSION_DISSOLUTION: "In the darkest hour of the Moscow jurisdiction, §Y[winning_country.GetNameWithFlag]§! has taken all of §Y[losing_country.GetNameWithFlag]§!'s §RFortune§! for itself."
 TNO_PEACE_POPUP_WAR_CONSLUSION_WI_GAW: "In the struggle against Japanese imperialism, §Y[winning_country.GetNameWithFlag]§! defeated the puppet regime of §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONSLUSION_WI_LOSE: "§Y[winning_country.GetNameWithFlag]§! has defeated §Y[losing_country.GetNameWithFlag]§! before the western uprising could spiral out of control, and set about restoring order in the southwest."
 TNO_PEACE_POPUP_WAR_CONSLUSION_GAW_LOSE: "§Y[winning_country.GetNameWithFlag]§! has defeated the rebellious §Y[losing_country.GetNameWithFlag]§!, and order is restored. China's fate is settled."
 TNO_PEACE_POPUP_WAR_ECW_HMMLR_WIN: "§Y[winning_country.GetNameWithFlag]§! defeated §Y[losing_country.GetNameWithFlag]§!, taking the first step toward reunifying Britain."
 TNO_PEACE_POPUP_WAR_ECW_HMMLR_WIN2: "§Y[winning_country.GetNameWithFlag]§! crushed §Y[losing_country.GetNameWithFlag]§!, sweeping German influence from the British Isles once and for all."
 TNO_PEACE_POPUP_WAR_ECW_COLLABS_WIN: "In the fight against §Y[losing_country.GetNameWithFlag]§!, §Y[winning_country.GetNameWithFlag]§! has successfully defended its existence, preventing the nation from descending into chaos."
 TNO_PEACE_POPUP_WAR_ENG_WALES: "§Y[winning_country.GetNameWithFlag]§! defeated §Y[losing_country.GetNameWithFlag]§!, taking another step toward the reunification of §YBritain§!."
 TNO_PEACE_POPUP_WAR_ENG_WALES_LOSE: "§Y[losing_country.GetNameWithFlag]§!'s attempt to defeat the §RRed Dragon§! has failed, and §Y[winning_country.GetNameWithFlag]§! stands tall amid the rubble."
 TNO_PEACE_POPUP_WAR_SCOTLAND_WIN: "§Y[winning_country.GetNameWithFlag]§! conquered §Y[losing_country.GetNameWithFlag]§! and became the heir to the British Isles."
 TNO_PEACE_POPUP_WAR_SCOTLAND_LOSE: "§Y[winning_country.GetNameWithFlag]§! has eliminated §Y[losing_country.GetNameWithFlag]§! in its own way, conquering the British Isles once more."
 TNO_PEACE_POPUP_WAR_CONCLUSION_COL_CW: "In the burning valleys and ruined rainforests of §YColombia§!, §Y[winning_country.GetNameWithFlag]§! defeated §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FRA_CW: "In the chaos of the §YFrench Civil War§!, §Y[winning_country.GetNameWithFlag]§! defeated §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FFR_CW_win: "In the course of the §YLiberation of France§!, [FFR.GetFlag]§Ythe French National Liberation Committee§! swept away the [losing_country.GetFlag]§Ytraitors§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_FFR_CW_lose: "In the course of the §YLiberation of France§!, §Y[winning_country.GetNameWithFlag]§! eliminated [FFR.GetFlag]§Ythe French National Liberation Committee§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_CAL_DOM: "The §YPuerto Plata invasion§! is over, as §Y[winning_country.GetNameWithFlag]§! repelled the §Yfascists§! of §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_DOM_CAL: "The §YPuerto Plata invasion§! is over, as §Y[winning_country.GetNameWithFlag]§! crushed the [losing_country.GetFlag]§Yrebels and invaders§!."
 TNO_PEACE_POPUP_WAR_CONCLUSION_CAL_DOM_ceasefire: "§Y[winning_country.GetNameWithFlag]§! has liberated §Y[losing_country.GetNameWithFlag]§! in the §YDominican Civil War§!"
 TNO_PEACE_POPUP_WAR_CONCLUSION_DOM_CAL_ceasefire: "§Y[winning_country.GetNameWithFlag]§! has crushed the [losing_country.GetFlag]§Yrebels§! in the §YDominican Civil War§!"
 TNO_PEACE_POPUP_WAR_CONTINUING_DEFAULT: "In an ongoing conflict,\n§Y[winning_country.GetNameWithFlag]§! has successfully defeated §Y[losing_country.GetNameWithFlag]§!."
 TNO_PEACE_POPUP_FLAVOR_DEFAULT: "War is hell."
 TNO_PEACE_POPUP_FLAVOR_BORMANN: "The earth is not an idyll but a struggle for existence."
 TNO_PEACE_POPUP_FLAVOR_SPEER: "History will prove that judgment was necessary."
 TNO_PEACE_POPUP_FLAVOR_GOERING: "The victor will always be the judge, and the vanquished the judged."
 TNO_PEACE_POPUP_FLAVOR_HEYDRICH: "This world is but a barrel organ, played by God Himself.\nAnd we all can only dance to the notes drawn from the bellows."
 TNO_PEACE_POPUP_FLAVOR_SPEIDEL: "You fight like lions, yet take orders from asses."
 TNO_PEACE_POPUP_FLAVOR_SCHOERNER: "The lost child has strayed from the path,\nNo trace remains in the gray woods.\nLooking back at the shadow of home,\nWho will tread the road back?"
 TNO_PEACE_POPUP_FLAVOR_SLAVE_REVOLT: "Looking back on my life, I have always known:\nThere is no situation so desperate that it cannot be worse."
 TNO_PEACE_POPUP_FLAVOR_SCHORNER_MUTINY: "I will hold the position we currently occupy to the last man, regardless of casualties, regardless of ammunition."
 TNO_PEACE_POPUP_FLAVOR_KOVNER: "But when the dream is delayed, what then?"
 TNO_PEACE_POPUP_FLAVOR_MEYER: "The caged bird no longer sings."
 TNO_PEACE_POPUP_FLAVOR_OSTLAND: "The status quo has been broken."
 TNO_PEACE_POPUP_FLAVOR_JECKELN: "The sun of the SS has set."
 TNO_PEACE_POPUP_FLAVOR_VITUSKA: "The crown of the pariah is shattered."
 TNO_PEACE_POPUP_FLAVOR_DRECHSLER: "The talons have been clipped."
 TNO_PEACE_POPUP_FLAVOR_FUK: "No! I live! I will live forever!\nThere is something in me that will never die!"
 TNO_PEACE_POPUP_FLAVOR_BOV: "You cannot raise a man on pain, nor feed him on anger."
 TNO_PEACE_POPUP_FLAVOR_UKS: "...thin and ragged, with the hunger of years, craving death, pale of face, and carrying packs upon their backs..."
 TNO_PEACE_POPUP_FLAVOR_UKR: "Germany would make Ukraine their breadbasket, and then a graveyard."
 TNO_PEACE_POPUP_FLAVOR_MEN: "The living do not sit at table, but the dead lie in coffins."
 TNO_PEACE_POPUP_FLAVOR_MON: "Order has returned to the steppe."
 TNO_PEACE_POPUP_FLAVOR_PRC_MEN: "Mongolia has been unified."
 TNO_PEACE_POPUP_FLAVOR_YUN_NPA: "This is a battle for the very existence of the Chinese nation; all proud sons and daughters of China will go forth to defend all of China with the resolve to die."
 TNO_PEACE_POPUP_FLAVOR_YUN_NPA_LOSE: "The mad dog has been struck down, and order is restored in the southwest."
 TNO_PEACE_POPUP_FLAVOR_CHI_GAW: "As Japanese troops marched into Shanghai, Beijing, and Nanjing, all hope of freedom vanished. Japan defeated China, and the entire East toppled with it."
 TNO_PEACE_POPUP_FLAVOR_SPR: "\"We have passed through!\""
 TNO_PEACE_POPUP_FLAVOR_SPA: "All who draw the sword shall perish by the sword."
 TNO_PEACE_POPUP_FLAVOR_SPS: "At last, the tablecloth is torn, and the rose petals fall, in the corners of the worn tabletop."
 TNO_PEACE_POPUP_FLAVOR_CNT: "\"The dream is dead.\""
 TNO_PEACE_POPUP_FLAVOR_CTL: "In our hearts, Catalonia is forever free."
 TNO_PEACE_POPUP_FLAVOR_IBR: "This tormented alliance has come to an end."
 TNO_PEACE_POPUP_FLAVOR_MOR: "Morocco is once again history."
 TNO_PEACE_POPUP_FLAVOR_BSQ: "Once again, a young nation has triumphed over an old one."
 TNO_PEACE_POPUP_FLAVOR_TBA: "The fire of youth has burned out."
 TNO_PEACE_POPUP_FLAVOR_FSR: "The mercy of our Lord Jesus is boundless; grant them rest."
 TNO_PEACE_POPUP_FLAVOR_GAL: "The road to Santiago has ended."
 TNO_PEACE_POPUP_FLAVOR_WAI: "The Dada dream has been overturned."
 TNO_PEACE_POPUP_FLAVOR_POR: "The New State has been brought to an end."
 TNO_PEACE_POPUP_FLAVOR_RPP: "The carnations have withered."
 TNO_PEACE_POPUP_FLAVOR_RIF: "History always repeats itself."
 TNO_PEACE_POPUP_FLAVOR_INS: "Even when the fire of life burns to its last breath, the spirit of the Youth Oath endures."
 TNO_PEACE_POPUP_FLAVOR_SRB: "The mandala of revolution has entered nirvana in this life, to bloom again in the next."
 TNO_PEACE_POPUP_FLAVOR_MKS: "Walls of iron may fall, but the spirit of the warrior endures forever."
 TNO_PEACE_POPUP_FLAVOR_BKB: "The buffalo has been slaughtered, and the villagers feast on its remains."
 TNO_PEACE_POPUP_FLAVOR_FRI: "Hatta waved farewell to his homeland one last time; his dream of a truly free Indonesia would never be realized."
 TNO_PEACE_POPUP_FLAVOR_DMP: "Steel and gasoline fire consumed the highlands of Sumatra, and with them, the warlords' indomitable will."
 TNO_PEACE_POPUP_FLAVOR_DMS: "The great Susuhunan wept for Priangan, and the mountains of West Java fell silent."
 TNO_PEACE_POPUP_FLAVOR_PMT: "As in days past against the invaders, the Minahasan fought bravely, but the collective spirit was not invincible."
 TNO_PEACE_POPUP_FLAVOR_SLS: "Kahar lives on in death: relentless, unrepentant, fearless, forever true to his word."
 TNO_PEACE_POPUP_FLAVOR_NII: "May the Merciful One on the throne protect them."
 TNO_PEACE_POPUP_FLAVOR_ABD: "The torch of revolution has been extinguished — perhaps this time, forever."
 TNO_PEACE_POPUP_FLAVOR_GUY: "Injustice anywhere is a threat to justice everywhere."
 TNO_PEACE_POPUP_FLAVOR_WIN: "The West Indies, like a house divided, can no longer stand."
 TNO_PEACE_POPUP_FLAVOR_IME: "\"Oh, my homeland, so beautiful and charming!\""
 TNO_PEACE_POPUP_FLAVOR_TUR: "He who lights the fire will eventually learn that the warmth comes with the burn."
 TNO_PEACE_POPUP_FLAVOR_ARM: "The citizens of Yerevan wail, wandering in a foreign land until death."
 TNO_PEACE_POPUP_FLAVOR_MAD: "They risked destruction so that two or three truths might light the world."
 TNO_PEACE_POPUP_FLAVOR_MDG: "They died defending the lie of Western civilization."
 TNO_PEACE_POPUP_FLAVOR_MDM: "Order has returned to the island."
 TNO_PEACE_POPUP_FLAVOR_ANC: "The Pan-African dream is shattered."
 TNO_PEACE_POPUP_FLAVOR_BOR: "The Boer State has been reduced to ash, but the conflict continues."
 TNO_PEACE_POPUP_FLAVOR_SAF: "The light of democracy in Africa has been extinguished."
 TNO_PEACE_POPUP_FLAVOR_ANG: "Even African airfields could not withstand American aircraft."
 TNO_PEACE_POPUP_FLAVOR_GRO: "Hütig's reign of terror has come to an end."
 TNO_PEACE_POPUP_FLAVOR_COG: "The sun rises over the winding coast of the Congo."
 TNO_PEACE_POPUP_FLAVOR_CZE: "Bohemia, for all its courage, has once again become prey to Germany."
 TNO_PEACE_POPUP_FLAVOR_SLO: "Bratislava burns, the last bastion of a bright future burns. The Slovak people have no hope left."
 TNO_PEACE_POPUP_FLAVOR_POL: "For all that Poland's men and women have given, Poland has fallen once more. Perhaps this time, forever."
 TNO_PEACE_POPUP_FLAVOR_GGN: "The red and white flag flies once more over Warsaw."
 TNO_PEACE_POPUP_FLAVOR_SCO: "Brave are the deeds that reach the sky, the Scottish Highlands are my home,\nMay your proud banners wave on high!"
 TNO_PEACE_POPUP_FLAVOR_SCO_LOSE: "The bagpipes of Edinburgh no longer sing."
 TNO_PEACE_POPUP_FLAVOR_ENG: "Bind her, torture her, burn her to ash, scatter her to the sea\nBut she will break free, she will awaken, she will come to liberate all."
 TNO_PEACE_POPUP_FLAVOR_FEN: "Countless names are unknown, their deeds unremembered.\nThis is a war of unknown soldiers."
 TNO_PEACE_POPUP_FLAVOR_CRN: "What return shall we make for you, O nation that gave us birth?\nYour borders were widened, broad and ever broader;\nGod worked through you, making you firm and strong."
 TNO_PEACE_POPUP_FLAVOR_WAL: "The Red Dragon has breathed its last."
 TNO_PEACE_POPUP_FLAVOUR_ULS_TWOMEY: "We have not feared you in 800 years, and we will fight you for another 800."
 TNO_PEACE_POPUP_FLAVOUR_ULS_PAISLEY: "In Ulster, some would rather die than lower the flag."
 TNO_PEACE_POPUP_FLAVOUR_IRE: "You cannot conquer Ireland. You cannot extinguish Ireland's passion for freedom. If this day does not win us freedom, our children and grandchildren will win it by better means."
 TNO_PEACE_POPUP_FLAVOR_PHI: "On shifting sand, no edifice can stand."
 TNO_PEACE_POPUP_FLAVOR_SPH: "They will wither and be forgotten.\nThe people will cast them out."
 TNO_PEACE_POPUP_FLAVOR_UPH: "I died without seeing the dawn rise over my homeland."
 TNO_PEACE_POPUP_FLAVOR_FGB: "He who would curse another must dig two graves."
 TNO_PEACE_POPUP_FLAVOR_FIN: "My dear son, are you now in Manala beneath the earth?\nTerrible Tuoni, plant the crops, till the fields for Death's goddess Kalar!"
 TNO_PEACE_POPUP_FLAVOR_WRS: "Only death is the end of duty."
 TNO_PEACE_POPUP_FLAVOR_VOL: "Wide as the Russian land is, not one inch belongs to peace."
 TNO_PEACE_POPUP_FLAVOR_KOM: "Pandora's box is closed forever."
 TNO_PEACE_POPUP_FLAVOR_GAY: "The loyal and true shall be filled with blessings."
 TNO_PEACE_POPUP_FLAVOR_VYT: "The double-headed eagle no longer screams."
 TNO_PEACE_POPUP_FLAVOR_MAR: "Russia cannot tolerate dual power."
 TNO_PEACE_POPUP_FLAVOR_SAM: "The traitor will never again tell his story."
 TNO_PEACE_POPUP_FLAVOR_GOR: "The war machine has broken apart."
 TNO_PEACE_POPUP_FLAVOR_PRM: "Some justice remains in chaotic Russia."
 TNO_PEACE_POPUP_FLAVOR_TAR: "Freedom is worth any sacrifice."
 TNO_PEACE_POPUP_FLAVOR_BKR: "The muezzin has nowhere to call."
 TNO_PEACE_POPUP_FLAVOR_ONG: "The gate to Europe stands open — the scent of war returns."
 TNO_PEACE_POPUP_FLAVOR_VOR: "Cursed souls need no longer guard their hell."
 TNO_PEACE_POPUP_FLAVOR_YGR: "How can bandits stand against an army?"
 TNO_PEACE_POPUP_FLAVOR_SVR: "Old soldiers never die; they just fade away."
 TNO_PEACE_POPUP_FLAVOR_TYM: "The land of steel, the place of sorrow."
 TNO_PEACE_POPUP_FLAVOR_OMS: "In death, they shall at last find peace."
 TNO_PEACE_POPUP_FLAVOR_ZLT: "The merchants have been hanged on the ropes they sold."
 TNO_PEACE_POPUP_FLAVOR_FAV: "She smiled sadly and vanished into the endless night sky."
 TNO_PEACE_POPUP_FLAVOR_NOV: "Strong as a falcon, yet cannot bear the sudden storm and gale."
 TNO_PEACE_POPUP_FLAVOR_TOM: "The poet is dead, that captive of honor!"
 TNO_PEACE_POPUP_FLAVOR_SBA: "And the river of anarchy will continue to flow."
 TNO_PEACE_POPUP_FLAVOR_KRS: "Andreyev's mutiny was but a flash in the pan."
 TNO_PEACE_POPUP_FLAVOR_KEM: "The reign of the Mad King is over."
 TNO_PEACE_POPUP_FLAVOR_ALT: "The drums of war thunder, drowning out the voice of tradition."
 TNO_PEACE_POPUP_FLAVOR_PRC: "The last thing they thought of was home, and the people they loved."
 TNO_PEACE_POPUP_FLAVOR_IRK: "There are no heroes in the face of suffering."
 TNO_PEACE_POPUP_FLAVOR_BRY: "We sing of the fierce spirit of the warriors!"
 TNO_PEACE_POPUP_FLAVOR_YAK: "The diamonds of Yakutsk no longer sparkle."
 TNO_PEACE_POPUP_FLAVOR_CHT: "There is no choice: the Tsar of Russia must either rule or perish!"
 TNO_PEACE_POPUP_FLAVOR_AMR: "Russian fascism rose in tragedy and fell in farce."
 TNO_PEACE_POPUP_FLAVOR_MAG: "Be it man or mouse,\nThe best-laid schemes of mice and men often go awry."
 TNO_PEACE_POPUP_FLAVOR_KMC: "Their sorrow turned to ash, scattered across the pitiless sea."
 TNO_PEACE_POPUP_FLAVOR_OMO: "He will wipe every tear from their eyes, and there shall be no more death."
 TNO_PEACE_POPUP_FLAVOR_PLS: "I told myself I'd be a general by thirty, or die on the battlefield."
 TNO_PEACE_POPUP_FLAVOR_UKH: "No smoke without fire."
 TNO_PEACE_POPUP_FLAVOR_DRL: "The monster of the Urals is dead, and no one will mourn him."
 TNO_PEACE_POPUP_FLAVOR_MGN: "The secrets of the Black Mountains will remain unknown forever."
 TNO_PEACE_POPUP_FLAVOR_ORE: "Alas, even the mountain villages of Orenburg cannot know peace."
 TNO_PEACE_POPUP_FLAVOR_URL: "The end is also part of the journey."
 TNO_PEACE_POPUP_FLAVOR_OMO_AF_2022: "Harmony cannot survive in a land where disorder runs rampant."
 TNO_PEACE_POPUP_FLAVOR_BRY_IRK_AF_2022: "Friendship is the only struggle worth undertaking."
 TNO_PEACE_POPUP_FLAVOR_TMA_AM: "The bleak wind shakes the withered graves."
 TNO_PEACE_POPUP_FLAVOR_TMV_AM: "Slaves are not bricks to pave your road; their lives are not plot points in your story of redemption."
 TNO_PEACE_POPUP_FLAVOR_KOM_AM: "The Regent's ugly creation did not live to see tomorrow."
 TNO_PEACE_POPUP_FLAVOR_TMU_AM: "The pale horse no longer gallops."
 TNO_PEACE_POPUP_FLAVOR_TMS_AM: "You have made us for Yourself, O Lord, and our hearts are restless until they rest in You."
 TNO_PEACE_POPUP_FLAVOR_TML_AM: "Poland has fallen for the third time, drowned in its own blood."
 TNO_PEACE_POPUP_FLAVOR_TMQ_AM: "Our enemies are near, warlike, bent on weakening us; if our name is despised, if our reputation is shamed, what becomes of our character as a people?"
 TNO_PEACE_POPUP_FLAVOR_TMN_AM: "The end justifies the means, but something must justify the end."
 TNO_PEACE_POPUP_FLAVOR_TMT_AM: "Sing your death song and die like a hero going home."
 TNO_PEACE_POPUP_FLAVOR_TMI_AM: "The light of progress in Russia has been extinguished."
 TNO_PEACE_POPUP_FLAVOR_TMP_AM: "The mad dog has fallen."
 TNO_PEACE_POPUP_FLAVOR_TMK_AM: "A man weeps for his lost wife until she is buried;\nA man weeps for his lost country until he is buried."
 TNO_PEACE_POPUP_FLAVOR_TMD_AM: "The hand of fate reached into the sky and tore them apart."
 TNO_PEACE_POPUP_FLAVOR_TMO_AM: "After the crisis has passed, the illness tends to return."
 TNO_PEACE_POPUP_FLAVOR_TMB_AM: "Though immortal, he is as one dead, sunk in the fiery abyss; this punishment only deepens his rage, for he has lost happiness and is tormented by endless suffering."
 TNO_PEACE_POPUP_FLAVOR_TMF_AM: "They no longer shout for freedom."
 TNO_PEACE_POPUP_FLAVOR_TME_AM: "The republic, born full of hope, was strangled in its cradle."
 TNO_PEACE_POPUP_FLAVOR_TMJ_AM: "We must never forget that art is not propaganda but a form of truth."
 TNO_PEACE_POPUP_FLAVOR_TMW_AM: "They died for freedom, and that is as it should be."
 TNO_PEACE_POPUP_FLAVOR_TMX_AM: "You cannot buy a revolution, nor manufacture one. You must become the revolution. It must sink into your very soul, or it has nowhere to rest."
 TNO_PEACE_POPUP_FLAVOR_TMH_AM: "The blood of Rurik has flowed away, beyond all trace."
 TNO_PEACE_POPUP_FLAVOR_TMG_AM: "Aleksei is gone forever, beyond your reach and mine."
 TNO_PEACE_POPUP_FLAVOR_TMY_AM: "Another king joins the Russian nobility of the underworld."
 TNO_PEACE_POPUP_FLAVOR_TMR_AM: "Good deeds are always rewarded with evil."
 TNO_PEACE_POPUP_FLAVOR_TMM_AM: "The river of wealth runs red with blood."
 TNO_PEACE_POPUP_FLAVOR_TMC_AM: "No one can keep them safe now."
 TNO_PEACE_POPUP_FLAVOR_NOV_SBA: "The emancipation of the working class must be the work of the working class itself."
 TNO_PEACE_POPUP_FLAVOR_KEM_SBA: "The second Mad King met the same end as the first."
 TNO_PEACE_POPUP_FLAVOR_SBA_SBA: "The cherries of Kansk weep aloud."
 TNO_PEACE_POPUP_FLAVOR_KRS_SBA: "I was born into a kind world and loved it with all my heart.\nI died in an evil world, with nothing left to say at parting."
 TNO_PEACE_POPUP_FLAVOR_PRC_SBA: "We will awaken the beast in people's souls and march to war."
 TNO_PEACE_POPUP_FLAVOR_ALT_SBA: "He who does not work, neither shall he eat."
 TNO_PEACE_POPUP_FLAVOR_TAN: "I was born among the crags and pines of the mountains, and that is why I am so strong."
 TNO_PEACE_POPUP_FLAVOR_MSK_ORL: "Those who feel nothing for life will meet their reward."
 TNO_PEACE_POPUP_FLAVOR_MSK_TVR: "There is but one step from fanaticism to barbarism."
 TNO_PEACE_POPUP_FLAVOR_MSK_SNP: "Better to lose honorably than win by treachery."
 TNO_PEACE_POPUP_FLAVOR_MSK_PAU: "Justice is always violent to the party offending, for every man believes himself innocent."
 TNO_PEACE_POPUP_FLAVOR_ARGENTINA: "The free peoples of the world answer: \"They died with glory.\""
 TNO_PEACE_POPUP_FLAVOR_BRAZIL: "I leave the mortal world and merge into history."
 TNO_PEACE_POPUP_FLAVOR_CHILE: "The refuge from oppression is no more; here shall forever be the grave of freedom."
 TNO_PEACE_POPUP_FLAVOR_PANAMA: "This land has been permanently divided."
 TNO_PEACE_POPUP_FLAVOR_URUGUAY: "Who will weep for the neutral?"
 TNO_PEACE_POPUP_FLAVOR_PARAGUAY: "Another Paraguayan war, another Paraguayan shame."
 TNO_PEACE_POPUP_FLAVOR_GERMANY_SPEER: "A grand war will ultimately destroy human civilization."
 TNO_PEACE_POPUP_FLAVOR_GERMANY_SCHMIDT: "I do not wish to be young again; I only wish to keep growing old."
 TNO_PEACE_POPUP_FLAVOR_GERMANY_OBERLANDER: "Ethnic strife is nothing but war by other means under the guise of peace."
 TNO_PEACE_POPUP_FLAVOR_BURGUNDY_COLLAPSE: "Greatness is a curse, built upon piles of corpses."
 TNO_PEACE_POPUP_FLAVOR_FLANDERS_COLLAPSE: "Those who love intrigue will most likely end in the shadows."
 TNO_PEACE_POPUP_FLAVOR_BELGIUM_COLLAPSE: "The enemy wants your life, so you must train harder than they do.\nYou'll have plenty of time to rest once you're in your coffin."
 TNO_PEACE_POPUP_FLAVOR_CHARLEMAGNE_COLLAPSE: "They climbed the peaks only to fall into the abyss."
 TNO_PEACE_POPUP_FLAVOR_SSCW_DSG: "Rescue and war are at odds with each other."
 TNO_PEACE_POPUP_FLAVOR_SSCW_FPG: "They became heroes, if only for a day."
 TNO_PEACE_POPUP_FLAVOR_SSCW_SSL: "Imitation is suicide."
 TNO_PEACE_POPUP_FLAVOR_SSCW_SSW: "Palaces fall of their own accord."
 TNO_PEACE_POPUP_FLAVOR_SSCW_OER: "Lady Justice will distribute wisdom to those who suffer."
 TNO_PEACE_POPUP_FLAVOR_SSCW_FSP: "I hope you will follow in my footsteps."
 TNO_PEACE_POPUP_FLAVOR_SSCW_PRK: "No pardon without bloodshed — such is the sin of slavery."
 TNO_PEACE_POPUP_FLAVOR_SSCW_KLB: "If you are truly murdered, it cannot be called paranoia."
 TNO_PEACE_POPUP_FLAVOR_SSCW_KSS: "If honor is loyalty, then this is indeed dishonorable."
 TNO_PEACE_POPUP_FLAVOR_SSCW_ISS: "Can we not see that industry, a competent servant, may become a terrible master?"
 TNO_PEACE_POPUP_FLAVOR_SSCW_SSF: "Speechless."
 TNO_PEACE_POPUP_FLAVOR_SSCW_APF: "Our concern, our responsibility, is our people and our blood. We can be indifferent to everything else."
 TNO_PEACE_POPUP_FLAVOR_SSCW_LHH: "There must be no mercy. The enemy must be defeated; it is either him or us."
 TNO_PEACE_POPUP_FLAVOR_SSCW_AGS: "Coward! Traitor! Scum!"
 TNO_PEACE_POPUP_FLAVOR_SSCW_SSN: "The faster humanity progresses, the more important preemption becomes."
 TNO_PEACE_POPUP_FLAVOR_SSCW_OKL: "If any man lacks the stomach for this fight, let him fall out and we'll give him a pass."
 TNO_PEACE_POPUP_FLAVOR_SSCW_FHH: "No spy, however clever, can withstand torture."
 TNO_PEACE_POPUP_FLAVOR_SSCW_DSH: "Any free man caught committing robbery shall be put to death."
 TNO_PEACE_POPUP_FLAVOR_SSCW_AUS: "All's fair in war."
 TNO_PEACE_POPUP_FLAVOR_SSCW_KHP: "They were products of total war."
 TNO_PEACE_POPUP_FLAVOR_WOL: "What we call the Cold War and decolonization are but symptoms of bitter labor. The world to come will be born from this, and all divisions will be healed."
 TNO_PEACE_POPUP_FLAVOR_FFR: "Let us be resolute, pure, and loyal. At the end of sorrow lies the greatest glory on earth, the glory reserved for those who never yield."
 TNO_PEACE_POPUP_FLAVOR_CAO: "To seek private gain is selfish pleasure; to seek the common good makes you immortal."
 TNO_PEACE_POPUP_FLAVOR_EWE: "Crown your enemy with love, and he will become your servant in peace."
 TNO_PEACE_POPUP_FLAVOR_EWE_soc: "I know that death cannot extinguish the torch I have lit in Ghana and in Africa."
 TNO_PEACE_POPUP_FLAVOR_MLI: "Despite all obstacles, defying all pressure, we must keep our feet on the ground and set our eyes only on the ideal of liberation and African unity."
 TNO_PEACE_POPUP_FLAVOR_SWB: "Better to die upright as a man than live on one's knees as a slave."
 TNO_PEACE_POPUP_FLAVOR_GBE: "Unity is strength. African nations must unite, or they will sell themselves to imperialist and colonialist exploiters for a mess of pottage."
 TNO_PEACE_POPUP_FLAVOR_GBE_soc: "As long as one Nigerian goes to sleep hungry, the Nigerian cause is not complete."
 TNO_PEACE_POPUP_FLAVOR_SUS: "To join the African revolution, it is not enough to write a revolutionary song. You must shape the revolution together with the people, and then someone will write the song."
 TNO_PEACE_POPUP_FLAVOR_FTF: "The Fulani farce has come to an end."
 TNO_PEACE_POPUP_FLAVOR_YOR: "No matter how tall a tree grows, it is still just a tree and cannot alone become a forest."
 TNW_PEACE_POPUP_FLAVOR_NNG: "\"Truly, to Allah we belong, and truly, to Him we shall return.\" (Quran 2:156)"
 TNW_PEACE_POPUP_FLAVOR_NGA: "A broken gourd, even when pieced together, cannot hold water."
 TNW_PEACE_POPUP_FLAVOR_BFR: "An enemy defeated by weapons will return; an enemy defeated by truth will not."
 TNO_PEACE_POPUP_FLAVOR_HAU: "The kingdom of Sidji has returned to the sands of oblivion."
 TNO_PEACE_POPUP_FLAVOR_BKF: "Their wishes have become the worst of nightmares."
 TNO_PEACE_POPUP_FLAVOR_KAY: "He who fights against his own homeland can never be a hero."
 TNO_PEACE_POPUP_FLAVOR_FTF_postWAC: "It is far easier to forgive an enemy than to forgive a friend."
 TNO_PEACE_POPUP_FLAVOR_LIB_postWAC: "Those who judge only by our achievements would do well to remember that we came from the deepest abyss."
 TNO_PEACE_POPUP_FLAVOR_MDI_postWAC: "If a cockroach wishes to rule the rooster, it must hire the fox as its bodyguard."
 TNO_PEACE_POPUP_FLAVOR_ZAR_postWAC: ""
 TNO_PEACE_POPUP_FLAVOR_KAY_postWAC: ""
 TNO_PEACE_POPUP_FLAVOR_CAO_collapse: "The Pan-African dream is shattered once more."
 TNO_PEACE_POPUP_FLAVOR_BFR_collapse: "They will never see freedom again."
 TNO_PEACE_POPUP_FLAVOR_CHD_collapse: "The memory of Kousséri will weigh on them forever."
 TNO_PEACE_POPUP_FLAVOR_NNG_collapse: ""
 TNO_PEACE_POPUP_FLAVOR_NGA_collapse: "Building Nigeria under another flag is their greatest regret."
 TNO_PEACE_POPUP_FLAVOR_YEM: "The Italians must stand alone now."
 TNO_PEACE_POPUP_FLAVOR_NYM: "They shed their last drop of blood defending the gravel of the sand."
 TNO_PEACE_POPUP_FLAVOR_SAU: "Brothers, I beg you to regard me as a brother and a servant. \"Your Majesty\" is reserved for Allah alone, and the \"throne\" is that of Him who rules over heaven and earth."
 TNO_PEACE_POPUP_FLAVOR_OMA: "Though yesterday was dark, with Allah's blessing, Muscat, Oman, and its people will see a bright tomorrow."
 TNO_PEACE_POPUP_FLAVOR_OMI: "All revolutions in the Arab world are led by colonels... and I have no Arab colonels in my army."
 TNO_PEACE_POPUP_FLAVOR_OMB: "What is taken by force can only be retaken by force."
 TNO_PEACE_POPUP_FLAVOR_EGY: "Soon there will be only five kings left in the world: the King of Italy, and the Kings of Spades, Clubs, Hearts, and Diamonds."
 TNO_PEACE_POPUP_FLAVOR_EGB: "I have been a conspirator for too long to trust anyone."
 TNO_PEACE_POPUP_FLAVOR_EGQ: "Believers fall one after another, and the scourge of ignorance spreads."
 TNO_PEACE_POPUP_FLAVOR_RPS: "Freedom is both fire and light. If you only wish to follow the light, you had best stay away from the fire."
 TNO_PEACE_POPUP_FLAVOR_SDF: "They say this unit does not speak its own people's language. Very good!"
 TNO_PEACE_POPUP_FLAVOR_SDS: "Missionaries, radicals, and politicians all fear us, leaving us no room."
 TNO_PEACE_POPUP_FLAVOR_IRQ: "The fact is plain: he whom the state rejects is an outsider. Therefore, he will be met with bullets."
 TNO_PEACE_POPUP_FLAVOR_BIR: "This great duel, the mother of all battles, has begun... this great confrontation has begun, and the dawn of victory is near!"
 TNO_PEACE_POPUP_FLAVOR_IRP: "You claim to be a leader of free men — the audacity. As for me, I naturally oppose all exploitation."
 TNO_PEACE_POPUP_FLAVOR_SNI: "All martyrs are blessed."
 TNO_PEACE_POPUP_FLAVOR_KUR: "Death is a possibility, but I will not surrender.\nDeath is a possibility, but I will not be imprisoned.\nTherefore, only one possibility remains — to stay in the mountains forever."
 TNO_PEACE_POPUP_FLAVOR_SYR: "O homeland, your soil is my camphor,\nAnd my magazine sings in the trenches."
 TNO_PEACE_POPUP_FLAVOR_AZA: "When a hero dies in his own land, the people do not weep."
 TNO_PEACE_POPUP_FLAVOR_AYA: "O my people, my people, who will bring you freedom?"
 TNO_PEACE_POPUP_FLAVOR_PER: "A bloodline that cannot stand scrutiny cannot bear a throne or crown."
 TNO_PEACE_POPUP_FLAVOR_IRL: "Praise be to Allah, we Iranians have never desired nor needed the suffering of democracy."
 TNO_PEACE_POPUP_FLAVOR_IRC: "The word \"Shah\" is something of magic to the Persian people."
 TNO_PEACE_POPUP_FLAVOR_IRA: "Bury your gun well. For Iran, one day a sapling will sprout from its barrel."
 TNO_PEACE_POPUP_FLAVOR_IRI: "Compared to enduring a tyrant's hellish rule, death is a blessing."
 TNO_PEACE_POPUP_FLAVOR_IRB: "If history writes its course, then the Baloch believe they will no longer live as slaves."
 TNO_PEACE_POPUP_FLAVOR_FRV_CW: "Even as the Grim Reaper rages,\nWe bear suffering for the people's cause!"
 TNO_PEACE_POPUP_FLAVOR_FRM_CW: "The organization will never be known."
 TNO_PEACE_POPUP_FLAVOR_FMM_CW: "We knelt on one knee and swore,\nThe militia will sing even in death,\nAll for New France!"
 TNO_PEACE_POPUP_FLAVOR_FIT_CW: "In the end, faith alone is not enough."
 TNO_PEACE_POPUP_FLAVOR_FGR_CW: "The poisonous seed of French fascism has finally been burned to ash."
 TNO_PEACE_POPUP_FLAVOR_FRD_CW: "In some lands, men still lie in bed dreaming sweet dreams,\nWhile here, look, we charge the enemy and laugh at death."
 TNO_PEACE_POPUP_FLAVOR_FRD_CW_reclamation: "The end of hope, the beginning of ruin."
 TNO_PEACE_POPUP_FLAVOR_CLL_CW: "Nothing is more cruel and inhuman than war, nothing more desirable than peace. But without mutual respect for rights as the cause, there can be no peace as the effect."
 TNO_PEACE_POPUP_FLAVOR_CLC_CW: "In Colombian history, whenever men begin to think that hollow respect for formal frameworks can replace genuine obedience to moral duty, the bloodthirsty demon of violence returns to earth."
 TNO_PEACE_POPUP_FLAVOR_COL_CW: "There is one small fact that no one disputes, no one questions, but which must be borne in mind: all men are mortal. We know this because we are still alive."
 TNO_PEACE_POPUP_FLAVOR_NAZI: "If nature opposes us, then we shall fight it and make it submit to us."
 TNO_PEACE_POPUP_FLAVOR_PARTISANS: "Only you know within yourself how you have mixed the years spent in dissipation with those spent in reflection, tangled and twisted and burning. Your life moves forward and backward at once."
 TNO_PEACE_POPUP_FLAVOR_ARIO: "We are the children of Bolívar. The supreme father of the Americas judges us with care; we kiss his boots like grooms in stirrups, and he is proud of our kisses."
 TNO_PEACE_POPUP_FLAVOR_Trujillo: "God is in heaven, Trujillo is in the underworld."
 TNO_PEACE_POPUP_FLAVOR_DOM_Ceasefire: "They are either blind, deaf, or mute.\nThough still breathing, they are as good as dead."
 TNO_PEACE_POPUP_FLAVOR_CAL_DOM: "History will do them justice."
 TNO_PEACE_POPUP_FLAVOR_CRO: "This is a most terrible tomb of the living dead, and its worst horror is that to live here is no different from being dead."
 TNO_PEACE_POPUP_FLAVOR_ZUL: "The proud children of the Nguni are silent once more."
 TNO_PEACE_POPUP_FLAVOR_SLF: "One mountain after another blocks the way."
 TNO_PEACE_POPUP_FLAVOR_KAZ_TASHENEV: "Kazakhstan is fated to cling forever to the Russian giant."
 TNO_PEACE_POPUP_FLAVOR_KAZ_NURMAGAMBETOV: "The traitor rode off on his warhorse, vanishing into the night."
 TNO_PEACE_POPUP_FLAVOR_KZR_SHCHELOKOV: "Shchelokov could not fathom the answer."
 TNO_PEACE_POPUP_FLAVOR_KZR_SOLOMENTSEV: "Soviet rule has completely collapsed."
 TNO_PEACE_POPUP_FLAVOR_CLD_CW: "Enduring all the heat of the sun and all the hardships of campaign, for our path is to traverse the universe."
 TNO_PEACE_POPUP_FLAVOR_SEALION_II: "Ah, my children! Are they weeping, do they hear their father's sighs?\nNow they run outside to look, now return to grieve for me."
 TNO_PEACE_POPUP_WAR_CONCLUSION_BRG_FRS: "In the chaos of the §YGerman Civil War§!, §Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas] seized the lands of §Y[losing_country.GetNameWithFlag]§!"
 TNO_PEACE_POPUP_FLAVOR_FRS: "Shadow hangs over France."
 TNO_PEACE_POPUP_FLAVOR_FRS_CW: "You have suffered much in the past, you will suffer more in the future, your lives are hard. I will not give you false comfort with words."
 TNO_PEACE_POPUP_FLAVOR_CRO_YUGO: "The Yugoslavs did not want fascism. They did not want a totalitarian regime. They did not want to be slaves of the Italians."
 TNO_PEACE_POPUP_FLAVOR_GRE: "In peace, sons bury their fathers; in war, fathers bury their sons."
 TNO_PEACE_POPUP_FLAVOR_MLY: "Their struggle for liberation has been forced to pause."
 TNO_PEACE_POPUP_FLAVOR_SHO: "The head of Pan-Asianism is dead."
 TNO_PEACE_POPUP_WAR_CONCLUSION_2SACW: "In the §YSecond South African Civil War§!, §Y[winning_country.GetNameWithFlag]§! defeated [losing_country.GetFlag], and the Cape runs §Rred with blood§!"
 TNO_PEACE_POPUP_FLAVOR_CAM_VIC: "This is why Cambodian youth ask themselves, almost instinctively, whether Cambodia can survive as a nation."
 TNO_PEACE_POPUP_FLAVOR_CAM_JAP: "What was done to Cambodia was not a mistake but a crime."
 TNO_PEACE_POPUP_FLAVOR_VIC: "Two tigers cannot share one mountain."
 TNO_PEACE_POPUP_FLAVOR_LAO: "No one can monopolize a country."
 TNO_PEACE_POPUP_FLAVOR_PAK_IND: "Only one nation can stand upon the ruins of the subcontinent."
 TNO_PEACE_POPUP_FLAVOR_PAK_AZH: "When men ask why Pakistan died, there is only one answer: it died because it lived."
 TNO_PEACE_POPUP_FLAVOR_IND: "The lamp of our life has gone out, and all around is darkness so deep we cannot see our hands. I do not know what to say to you, nor how to begin."
 TNO_PEACE_POPUP_FLAVOR_AZH: "All compromise is based on mutual concession, but there can be no mutual concession on fundamental principles. Any compromise on fundamental principles is surrender. For there is only taking, no giving."
 TNO_PEACE_POPUP_FLAVOR_SANTA_CRUZ: "One day the Collas will drive us out, but I will not live to see that day, for I am already dead."
 TNO_PEACE_POPUP_FLAVOR_BOLIVIA: "We chose the wood, measured the coffin together, sipped some singani, and said our goodbyes calmly."
 TNO_PEACE_POPUP_FLAVOR_HAC: "I took up arms for the freedom of my color. It is our own — we will either defend it or die."
 TNO_PEACE_POPUP_FLAVOR_HAI: "The Haitians are fated to suffer."
 TNO_PEACE_POPUP_FLAVOR_KAL: "The soldiers will also go on strike; they will leave the ranks and refuse to fight..."
 TNO_PEACE_POPUP_FLAVOR_BRAZIL_CIVIL_WAR_GOV: "One day, your weary body will feel youth again."
 TNO_PEACE_POPUP_FLAVOR_BRAZIL_CIVIL_WAR_JUNTA: "Our failure is the end. We have completed our task."
 TNO_PEACE_POPUP_FLAVOR_BRAZIL_CIVIL_WAR_AMAZONAS: "They turned away in shame, weak-willed, unwilling to face the harsh light, afraid to lose the hope that had inspired them."

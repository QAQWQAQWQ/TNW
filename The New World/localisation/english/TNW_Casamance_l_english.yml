 POLITICS_EMILE_BEDIANE_DESC: "The Jola nation is a relatively new concept. Before modern times, the Casamance region was just another part of Senegal. The people there lived much like the Wolof, and the region was as unremarkable as any other corner of West Africa's chaos.

That is, until one man started making a fuss.

Born in 1915, Émile Badiane excelled in school. His passion for learning never faded, and after graduation he became a schoolteacher. For a time, it seemed this would be the highest position he would ever reach in life. But when war came, Badiane saw his opportunity. He wanted to go further, and so he entered politics. There he discovered a movement he could support — the independence of the Jola people, of whom he was one.

In the mid-1950s, he deftly sidestepped any opposition and became the spokesman for Casamance. Then, a series of mass protests, lengthy speeches, and relentless filibustering forced Senegal to hold an independence referendum, which passed by a narrow margin. After that, Badiane formally proclaimed the founding of the Republic of Casamance and seceded from Senegal.

Now, Badiane leads Casamance into a new era in West Africa. As a staunch isolationist, Badiane will continue to rest on the honors and achievements of the past few years. Though this has earned him respect as the founding father, it has not won him many supporters. With the rising threat of the opposition surging forward, it remains to be seen whether Badiane can continue his rule. If he cannot control Casamance's politics the way he once controlled the classroom, his days are surely numbered."

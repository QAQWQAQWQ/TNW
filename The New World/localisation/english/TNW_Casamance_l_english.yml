 JOL_idea_under_shadow_wolofia: "Under Senegal's Shadow"
 JOL_idea_under_shadow_wolofia_desc: "Casamance is a very small country, with almost no armed forces. In the chaotic world of West Africa, unarmed nations do not survive for long. Casamance was forced to seek protection from its neighbors. Senegal offered the Casamance government the best terms and the greatest autonomy. Now, Casamance remains an independent state under Senegalese protection, though the influence of its larger neighbor is increasingly felt."
 JOL_idea_home_exiled_paigc: "Home of the Exiled PAIGC"
 JOL_idea_home_exiled_paigc_desc: "Casamance, located north of the Iberian colony of Guinea-Bissau, has become a home for many exiles. When the PAIGC's uprising failed, the party was forced into exile. A split emerged: a faction under Luís Cabral broke away from the organization and reestablished itself in Casamance, where Cabral continues to lead the party."

 BRI_Workshop_DeutscheBank_desc:0 "Deutsche Bank is one of Europe's largest multinational banks, representing much of Germany's financial power in its conquered territories. When many British banks collapsed after Sealion, Deutsche Bank moved in to pick up the pieces, absorbing or finishing off the survivors."
 BRI_Workshop_Reichswerke_desc:0 "Founded in 1937, Reichswerke is a sprawling industrial conglomerate specializing in coal and steel extraction. Though Britain has a storied history of innovation in heavy industry, the mines that once fueled the British Empire now power the Nazi war machine under Reichswerke oversight."
 BRI_Workshop_BlohmVoss_desc:0 "Once it was said that the fleets sailing from British dockyards were the finest in history. Blohm & Voss, a shipbuilding firm engaged in both merchant and warship construction, now uses those same ports to arm the German navy, leveraging the resources already at hand."
 BRI_Workshop_AEG_desc:0 "Unlike its more military-focused rival Siemens, Allgemeine Elektricitäts-Gesellschaft (commonly shortened to AEG) is a major producer of consumer electronics. AEG's affordable home appliances are in use in many wealthy British households."
 BRI_Workshop_Volkswagen_desc:0 "Volkswagen, the 'people's car,' was founded by the German Labour Front in 1937 to produce cheap, practical automobiles. After great success elsewhere in Germany, Volkswagen entered the British market, where it faced relatively little opposition."

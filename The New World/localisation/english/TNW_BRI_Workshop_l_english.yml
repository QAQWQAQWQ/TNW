 BRI_Workshop_Northern_Ireland_tt:0 "Northern Ireland is the United Kingdom's phantom limb; after the war it was torn away (with the help of traitors) by a pack of cowards, yet we still yearn for it. For those of us who dream of a united nation again, it is a point of pride. But beyond the postwar treaties, other factors make reclaiming it a distant dream.\n\nThe current Irish government has no idea how to stabilize this troubled region, which seems to breed paramilitaries and terrorists. Meanwhile, our own government is busy dealing with HMMLR. Even though few true Irish remain there, the IRA will fight for their delusions, and the Unionists swear loyalty to Queen Elizabeth, scorning our legitimate government.\n\nFor now, best not to mention this hotbed of rebellion."

 BRI_Workshop_InfoButton_tt:0 "§F§YInformation§!\n--------------\n§ROdd, how the tables have turned§!. The §qIndustrial Revolution§! began in §JBritain§!, refined by the finest §Lhandicraftsmen§!, §otextile workers§!, and §Mengineers§!, building toward the dream of a §Gnew tomorrow§!. And now, §oGermany§! walks hand in hand with us within the §oNew Order§!, yet we must admit the §Bpartnership§! between Germany and Britain is not equal, and we can only §Lmake do and build something§!.\n\nTo launch §Mindustrial projects§!, you must make full use of the §qcorrupt megacorps§! before you. Each region carries the §Ginfluence§! of the five §qmegacorps§!, and lists the approximate shares of §Rstate§!/§qcorporate§!/§Jprivate§! ownership, each with its own unique §Gbenefits§! and §Rdrawbacks§!.\n\n§fEach year§!, the §RChancellor of the Exchequer§! announces the year's fiscal targets to the Commons. You must deliver on these promises, or the economy will be §Rwrecked§! by §qspeculative beneficiaries§!. On the road to each goal, the §qmegacorps§! can be your §Mgreatest asset§! or your §jworst enemy§!, depending on how you deal with them.\n\nFurthermore, to the §Jgovernment's§! great frustration, Britain is plagued by a number of §Rcrises§!. Whether through §nabove-board§! means or §Junderhanded§! tactics, you must resolve each §Rcrisis§! with the tools at your disposal, or your §Rfailure§! will lead to the most §Iterrible§! consequences.§!"

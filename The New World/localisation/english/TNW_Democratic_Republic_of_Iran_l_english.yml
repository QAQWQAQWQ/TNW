 POLITICS_KARIM_SANJABI_DESC: "Karim Sanjabi is not a man who gives up easily. As an old guard of Iranian national democracy, he and his National Front of Iran have always bravely stood on the front lines opposing the Shah, suffering countless hardships for it. Despite the increasingly harsh measures SAVAK used to suppress the opposition, Sanjabi himself never gave up fighting for his dream of a strong, free, and independent Iran. It was his courage and determination that made him the de facto leader of Iran's democratic opposition, and when the Iranian revolution erupted, he turned his dream of a democratic Iranian republic into reality.

The revolution brought opportunities, as well as support from new friends on the other side of the world. Sanjabi's faction tried to win over all the forces they could reach, appealing to the United States for aid, while also making whatever promises were necessary to ensure Washington's support. The fight may be hard, but perhaps Sanjabi and his friends can turn the tide. If Sanjabi succeeds, a new sun will rise over a democratic Iran, and beneath that new sun, the people will enjoy prosperity and freedom."

 LAO_Amkha_Soukhavong: "Amkha Soukhavong"
 POLITICS_AMKHA_SOUKHAVONG_DESC: "Soukhavong, hero of Samneua, though he fought for political change his whole life, is not really a political figure. He became a captain in the Free Lao government early on, rising to general; he was the staunch defender of the cities against Nosavan's collaborationist forces, and his name became renowned. Samneua was the turning point in the Free Lao government's fortunes, and Soukhavong was a shrewd man who could have used this success to pave his own political future. But Soukhavong never cared about his political career, only whether the system being built was one worth fighting for. No sooner had Operation Issara ended than Soukhavong returned to the Royal Army, dutifully serving as a general, far from the turmoil of Vientiane.\n\nAfter that, the turncoat Nosavan marched on Vientiane. Soukhavong had no choice but to rally loyalists in resistance, and the Battle of Samneua repeated itself; once again, history saw Soukhavong overthrow Nosavan.\n\nHe understands why, despite his best efforts to avoid the premiership, everyone else has pressed him into the position. Though he feels the job is beyond his abilities, he also knows the weight of his responsibility. To select the next Prime Minister, free elections must be held and a smooth transition ensured. Amkha Soukhavong is undoubtedly the best man to defend Lao democracy - even if all this takes place in the Vientiane office he detests most."

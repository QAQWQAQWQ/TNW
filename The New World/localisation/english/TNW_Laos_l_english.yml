 POLITICS_SOUKANE_VILAYSARN_DESC: "The Vietnamese revolution revealed Souphanouvong for what he is: a viper, a traitor to the Lao nation. Laos needs stability, and Soukane Vilaysarn is the guide for post-communist Laos.\n\nSoukane's ties with Japan run deep, sown even before Laos won independence from French rule. They span his entire life. During Operation Issara, he served in the Lao Issara armed forces. Aside from this brief episode, the Japanese helped him at every step of the way up to his position as Vientiane police chief.\n\nUntil now, Soukane has been aligned with his brother Souvanna Phouma and the National Progressive Party, sharing their pro-Japanese stance. He is also the main contact of the Kwantung Army's Special Operations Division in Laos, and it was he who first warned Tokyo of Souphanouvong's hidden communist beliefs - but by the time Tokyo acted, it was already too late.\n\nNow Soukane sits on the highest seat of power in Laos, but he has no intention of being a strongman. Once the work is done, he will gladly restore democracy, confident that Souvanna Phouma will be elected in free and fair elections. But until then, he must purge the nation of its rot and the communist plague, so that it never again takes root."
 LAO_Postcolonial_Backwater:0 "Post-Colonial Backwater"
 LAO_Postcolonial_Backwater_desc:0 "Lao modern history is rife with misfortune, humiliation, and backwardness. Since the late nineteenth century, from the Three Kingdoms period to Operation Issara, Laos has been viewed by neighboring powers as nothing more than a remote frontier.\n\nWeak administration, widespread illiteracy, rampant corruption, and infrastructure barely worth the name are but a few of the many problems Laos faces after centuries of isolation. Subsistence agriculture remains the country's largest industry, while modern urban industry struggles to take root. Thus, Lao leaders have decided to use Japanese capital to develop the nation, but only time will tell whether this strategy succeeds."
 LAO_Legacy_of_Operation_Issara_Unmitigated:0 "Legacy of Operation Issara - Unmitigated Disaster"
 LAO_Legacy_of_Operation_Issara_Unmitigated_desc:0 "The military invasion known to Thailand as 'Operation Issara' undid in an instant all the progress Laos had made toward modernization. Promising young bureaucrats were forced from their homes, civilians were displaced, railways and roads were reduced to rubble, industrial development ground to a halt, and the entire nation was paralyzed during the invasion. This invasion directly caused a total collapse in Lao administration, livelihoods, economic development, and infrastructure.\n\nThough the situation is dire, the Lao government has done nothing. Since 1957, Vientiane politics has nearly ground to a halt, providing neither relief to the devastated regions nor launching any substantive reconstruction to restore state industry and infrastructure. Because the government has failed to help the people and their communities rebuild, most Lao people live in worse conditions than under colonial rule, and they have little reason to care about the nation's future."
 LAO_King_Sisavang_Vatthana:0 "King Sisavang Vatthana"
 LAO_King_Sisavang_Vatthana_desc:0 "His Majesty, the Supreme Grand Monarch, rightful heir, glorious guardian of the Kingdom of the White Umbrella of Vientiane, Dharmaraja of Laos, supreme victor, warrior-noble, sun-like protector, great and glorious guardian of auspicious prosperity - that is to say, King Sisavang Vatthana - is the monarch of the Kingdom of Laos.\n\nOnce, the monarchy symbolized supreme dignity and reverence. Yet as Prince Phetsarath Ratanavongsa worked to reduce the monarchy's influence in politics, and as King Vong Savang was forced to collaborate with Thailand during Operation Issara, the prestige of the crown plummeted. King Sisavang Vatthana's frequent interference in governance, his opinions on state affairs, and his fondness for parading his limited power further eroded popular respect for the monarchy, reducing it from its once unassailable position to an object of public criticism.\n\nEven so, thanks to the King's populist public image and devout Buddhist faith, the royal family remains beloved by the people. Thus, so long as the King balances his public image with his political ambitions, radical republicans will remain confined to the fringes of Lao politics."
 LAO_The_Golden_Triangle:0 "The Golden Triangle"
 LAO_The_Golden_Triangle_desc:0 "After China's defeat in the Second World War, General Li Mi's 93rd Division retreated into Southeast Asia, establishing with unofficial Thai support the so-called 'Golden Triangle': a region encompassing Burma, the Shan states of Thailand, and northern Laos, a haven for the production, transport, and refinement of opium in Southeast Asia. Amid the chaos of Operation Issara, the Lao National Army - predecessor of the Royal Lao Army - established secret contacts with the National Revolutionary Army in Burma, sparking an unprecedented wave of drug production and trafficking.\n\nAs Operation Issara neared its end, the Lao National Army betrayed its Thai allies, and cooperation with the National Revolutionary Army quickly collapsed. Almost overnight, the two armies went from partners to rivals: the NRA withdrew its personnel from Laos, while the Lao National Army tried to fish in troubled waters to gain a foothold in the Shan states. Later, the Lao National Army reorganized into the Royal Army, and Indochina gradually settled down, but the conflict in the Golden Triangle never ended; the Royal Army and the NRA continue to fight for control there."
 LAO_The_Royal_Lao_Army:0 "The Royal Lao Army"
 LAO_The_Royal_Lao_Army_desc:0 "The Lao National Army was renamed the Royal Lao Army after its reorganization, intended to shed its dark history as a tool of Thai aggression against the Lao people during Operation Issara. Yet to call the Royal Lao Army an army is to insult the word. The rank-and-file are numb and untrained; unit leaders practice nepotism and are unfit to lead; senior officers are a horde of gluttons with general's titles but no ability to accomplish anything.\n\nYet though the Royal Lao Army is unfit to be called a proper army at nearly every level, it still poses a threat to the country's existing democratic order. The military is deeply right-wing, and men like General Phoumi Nosavan hold the so-called democratic process in contempt. The Army's leadership is like a malignant tumor: if not excised, the patient will die; but because any action against the military risks retaliation, the civilian government must tread carefully - keeping the Army out of government affairs while avoiding provoking them outright."
 LAO_Indochinese_Communist_Party_Insurgency_Minor:0 "ICP Insurgency - Minor"
 LAO_Indochinese_Communist_Party_Insurgency_Minor_desc:0 "In 1947, Laos declared independence and all anti-colonial fighters were granted amnesty, but one organization continued the struggle, vowing to lead Laos from all forms of imperialism: the Lao branch of the Indochinese Communist Party. Supported by their Vietnamese comrades and the countryside, the communists effectively prevented the fledgling Lao government from securing its northeastern border with Vietnam. For a time, the government considered the communists an annoying nuisance, but the situation changed rapidly with the outbreak of Operation Issara.\n\nTo strike the Thai forces during Operation Issara, remnants of the legitimate Lao government reached a gentleman's agreement with the ICP, which greatly aided the Lao liberation movement. The communists were idolized by Lao peasants for their contributions, and returned to their bases in Phongsali and Houaphan. Thereafter, the communist 'liberated zones' in the northeast expanded greatly, limiting government control over the area. That said, the communists are still just a nuisance, merely on a much larger scale than before. They have neither the military nor the political means to confront the government, and thus pose no threat to the status quo... for now."
 LAO_Stung_Treng_Dispute:0 "Stung Treng Dispute"
 LAO_Stung_Treng_Dispute_desc:0 "Stung Treng province is the youngest and southernmost territory of Laos. Though most of its population is ethnic Lao, it was under Cambodian rule from 1905 to 1949. During Operation Issara, Laos was split into the Kingdoms of Luang Prabang and Champassak; because the latter was close to the Thai government, Stung Treng and Nakhon Champassak were assigned to it. In 1956, after the war ended, the Taipei Accords restored pre-war borders between Thailand and its Indochinese neighbors, but contained no clause restoring the pre-war border between Cambodia and Laos. Laos thus refused to return occupied Stung Treng, sparking a dispute between the two nations.\n\nTo resolve the dispute, the Japanese government dispatched experts to the region to broker a compromise. During their investigation, they found the lowland population of Stung Treng was almost entirely Lao, and the Japanese government chose to support Laos' claim. Though the dispute was formally settled, the Cambodian government remains furious over losing Stung Treng. Northeastern Cambodia was rapidly militarized, political discontent within the country grew significantly, and bilateral relations between the two nations were thoroughly wrecked."

 LAO_Kou_Abhay: "Kou Abhay"
 POLITICS_KOU_ABHAY_DESC: "With the legendary Prince Phetsarath Ratanavongsa's premiership at an end, Phoumi Nosavan exhausted his political legacy and last measure of goodwill to install Kou Abhay as Prime Minister. Kou Abhay is an aristocratic soldier who cooperated with Thailand during Operation Issara, but this is a minor detail unlikely to cause controversy. Nosavan believed choosing this man would balance between increasing the power of the Royal Lao Army and continuing Phetsarath's liberal legacy.\n\nEven so, Abhay obtained only a narrow majority; he is but a caretaker of the regime, having supported or offended no faction. From the end of Phetsarath's term in 1959 to the 1962 election, Abhay was a harmless, inactive prime minister. Now, with the election approaching, Abhay can finally prepare to pack his bags.\n\nThere is little to say about Kou Abhay himself. He is the son of southern aristocracy, and his son is the prominent general Kouprasith Abhay. He is now a dying old man who does nothing but sign documents and review parades. He is the door through which Laos enters its next historical chapter."
 LAO_Souvanna_Phouma: "Souvanna Phouma"
 POLITICS_SOUVANNA_PHOUMA_DESC: "Perhaps Souvanna Phouma was born to lead the Lao people. Younger brother of the late legendary Prince Phetsarath Ratanavongsa, connected to every strand of the Lao political tapestry, he performed yeoman service for the Free Lao government during Operation Issara, inheriting his brother's glorious legacy of service to Laos.\n\nSouvanna Phouma gives the impression of an unremarkable politician with a peculiar ideology. Sometimes stubborn, sometimes quick to concede. He cooperates with the left, yet yields to the right. He invokes nationalism, yet enjoys Japanese support. He senses every undercurrent of shadow politics, yet is too clumsy to profit from them.\n\nPhouma is certainly no incompetent, but he is too slow-witted to truly inherit his brother's legacy. After all, it was precisely this legacy that placed him in this position, burdened by the weight of succession, and he will do his utmost to lead Laos. Yet Phouma also knows there is a dagger waving behind him, waiting for a show of weakness to drive it into his back."
 LAO_Souphanouvong: "Souphanouvong"
 POLITICS_SOUPHANOUVONG_1_DESC: "Souphanouvong is the younger brother of Prince Phetsarath Ratanavongsa, father of the modern Lao state. Educated in France, his thinking was alien to the royal court. The great cities turned him against imperialism, though that same imperialism had brought untold wealth to his aristocratic family. When the fires of Operation Issara burned, he returned to Laos to join his brother in Samneua, where he made his name through contact with the resistance movement. He built deep ties with the peasantry, and combined with his leftward sympathies, it is no wonder he is called the Red Prince.\n\nNow Souphanouvong leads Laos by popular support rather than royal investiture. As Prime Minister, he has vowed to fight for urban workers and rural peasants. He calls for increased social welfare, investment in infrastructure, and industrial development. To underpin these national goals, Souphanouvong places special emphasis on deepening ties with Japan, seeing the Co-Prosperity Sphere as the greatest opportunity to develop Lao industry. The right calls him an Indochinese Communist Party agent, and the left's fervor has been diluted by his pan-Asian rhetoric - but whatever his critics say, Souphanouvong knows he is a patriot, willing to give his life for Laos."
 POLITICS_SOUPHANOUVONG_2_DESC: "Some might say a leftist aristocrat is a contradiction in terms; it is hard to imagine someone of royal blood seeking to abolish the monarchy and establish a communist state. But Souphanouvong is such a man, smiling, knife in hand, slicing the monarchy's throat cleanly and watering the people's soil with its blood.\n\nMany knew of his sympathies for the leftist movement, but few knew how far the Red Prince's sympathies extended. Since 1949, Souphanouvong has been a secret ally of the Indochinese Communist Party, using his connections within the Free Lao government to secretly fund and equip them. His time in Paris introduced him to communism, and the foreign occupation of Laos steeled his resolve to put theory into practice. But he knew the time was not ripe for revolution; Laos was backward, and reactionaries lurked all around. So he chose to wait, letting the Lao Patriotic Front weather the post-Issara period.\n\nWith Vietnam as his ally, the greatest Trojan Horse of the twentieth century has revealed itself. Souphanouvong has declared his true colors to the world: he follows the teachings of Marx, Lenin, and Bukharin, and will fight on until their vision is realized in Laos. No nation is more shocked than Japan, deceived by Souphanouvong for years as he took countless benefits, investments, and loans under the banner of pan-Asian co-prosperity - all now wasted. Japan will surely be furious, but Souphanouvong is exhilarated - Laos is free, and by the sweat of the working class, it will remain free forever."
 LAO_Phoui_Sananikone: "Phoui Sananikone"
 POLITICS_PHOUI_SANANIKONE_DESC: "For the past decade, Phoui Sananikone has been patching together the reputation shattered by his younger brother. During Operation Issara, Oudone led collaborators alongside Phoumi Nosavan; though Phoui hid within the Lao bureaucracy at the time, the Sananikone family was thoroughly branded as traitorous. Now Phoui has become Prime Minister, as if he and his family have been forgiven. Or perhaps Phoui is simply skilled at whitewashing himself well enough for the Lao people to accept.\n\nBorn to a northern aristocratic family known as the 'Rockefellers of Laos,' Phoui could have lived out his life in comfort, but his brother's choice to serve as a Thai collaborator during Operation Issara brought suspicion upon him as well. Even so, he leveraged his family name to secure a high position in the bureaucracy, far from the mire he despised. After the Free Lao government's victory, Phoui quietly returned to the political stage, branding himself a moral traditionalist, a moderate aristocrat, a monarchist who refused to collaborate with Thailand.\n\nNow he is Prime Minister, riding on the landed gentry's call for moderate rule and the peasantry's resentment of Japan. He loudly proclaims a stronger, more moral Laos, but any discerning eye can see his corruption. Phoui Sananikone is deeply connected to the elite and the military, and is not shy about profiting from it."
 LAO_Boun_Oum: "Boun Oum na Champassak"
 POLITICS_BOUM_OUM_NA_CHAMPASSAK_DESC: "Ask a Lao person what they think of the Issara period, and their answer is usually bittersweet: it was indeed an era of blood and chaos, but without it, national independence would have been impossible. Yet one man breaks this consensus, believing the Issara period was the only time he felt truly free - when he became a king with real power. That man is Boun Oum na Champassak.\n\nUnder the Pakse Accords he signed with Phoumi Nosavan, Boun Oum became King of Champassak, in the south of the country, but he wanted more. Then Nosavan's betrayal and the Free Lao government's victory overthrew this petty kingdom; though he fought to preserve his power, the Lao throne fell to the Sisavang line. And the decadent liberal Prince Phetsarath pushed the nation ever further from royal autocracy. Boun Oum was sidelined, with only the staunchest monarchists rallying around him.\n\nWith a string of mistakes by his political rivals, Boun Oum's time on the backbench has come to an end. Exploiting the chaos after the referendum and the political immaturity of the new King Vong Savang, he became Prime Minister of Laos, able to easily manipulate the King. In truth, he covets Vong Savang's title even more - after all, that is a king, a king with real power. But regardless, Boun Oum holds power now, and he will use it to increase the monarchists' influence in Lao politics."
 LAO_Somsanith_Vongkotrattana: "Somsanith Vongkotrattana"
 POLITICS_SOMSANITH_VONGKOTRATTANA_DESC: "Has Prince Somsanith Vongkotrattana ever had independence? If we mean political independence, the answer is clearly no. During Operation Issara, the rebel Nosavan forced him into the position of head of the Lao secret police, before this unpopular post was soon handed over to one of Nosavan's cronies. After the Issara period, he slipped back into the civil service to take up a sinecure, appearing only occasionally and holding an unimportant post in the last cabinet. Now, after the failed attempt to abolish the monarchy, the new King Boun Oum na Champassak has singled out Vongkotrattana and appointed him Prime Minister.\n\nHe knows full well what he represents: a messenger between King and subjects, a rubber stamp for monarchist policy. Boun Oum has realized his royal dream, and appointing Vongkotrattana as Prime Minister is merely to further strengthen his control over Laos. All he need do is sit in his chair and free one hand to sign documents - nothing more. Thus, in the dead of night, when no one is around, Vongkotrattana cannot help but sob and ask: why him?"
 LAO_Sisouk_na_Champassak: "Sisouk na Champassak"
 LAO_Phoumi_Nosavan: "Phoumi Nosavan"
 POLITICS_PHOUMI_NOSAVAN_DESC: "Come, look at this man before you - the man who launched three coups against the Lao government: one to support Thailand, one to resist Thailand, and the third to make himself the undisputed leader of Laos.\n\nDuring Operation Issara, he was one of the principal figures among the Thai collaborators. Politically astute though he was, he was less so strategically; he commanded most of the collaborationist forces against the Free Lao government, scoring easy victories as well as numerous defeats. In 1951, Thailand withdrew its support, and Nosavan sustained his war through opium trafficking and robbing Thai army arsenals. It was only in 1955, when the Thoroughly lost faith in him, that he turned to the Free Lao government, helping them win the final victory. Afterward he faded from sight, returning to the Royal Army to build absolute loyalty from the military - his bedrock, and the only support he needed.\n\nThe Royal Lao Army's performance in Operation Setthathirat exceeded all expectations, and Nosavan rode this wave of excitement, telling the military they could teach the civilian government's desk-jockeys how to run a country. So another coup happened, and Nosavan got the power he had dreamed of since 1949. Yet he held the scepter without knowing how to wield it. He could only delegate matters to yes-men slightly more competent than himself, and rely on brute force to solve the problems he faced.\n\nAnd this is far from over."
 LAO_Bong_Souvannavong: "Bong Souvannavong"
 POLITICS_BONG_SOUVANNAVONG_DESC: "Bong Souvannavong is perhaps one of the most controversial and bizarre politicians of twentieth-century Laos. His peculiar ideology is built on a keen political instinct and a complex web of connections - precisely what brought him to the premiership.\n\nSouvannavong has long advocated a compromise that perfectly blends traditional social beliefs, monarchy, and democratic elections; on the economic front, he combines Buddhist moralism with a heady mix of left-wing thought. These elements are united under the banner of Buddhist socialism, which is Souvannavong's interpretation of the teachings of Buddhadasa Bhikkhu and socialist thought. Yet most people, far from supporting this system, cannot even fathom its feasibility. Even his own son has joined the Patriotic Front, believing in their more complete ideology. But he also knows how to consolidate his power through political maneuvering and rallying support.\n\nThe failure of the conservative regime has brought this unique reformer to the forefront of history. Souvannavong knows his political rivals are watching him like hawks, but he trusts his own political skill. To put it another way, bringing him down would be no easy task. If all goes well, perhaps some of his policies can be implemented - perhaps an isolated, independent, neutral Laos lies ahead."

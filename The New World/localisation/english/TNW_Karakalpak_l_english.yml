 KRK_Ibrahim_Yusupov: "Ibrahim Yusupov"
 POLITICS_IBRAHIM_YUSUPOV_DESC: "Ibrahim Yusupov's father was a religious leader and wealthy landowner — a status that brought disaster in the 1930s, when the Soviet government saw him as a prime enemy, imprisoned him, and declared him missing. Ibrahim was thus raised by a single mother and had to work from childhood to support his brothers and sisters. Such hardship did not extinguish his love of poetry; by the age of twenty, Ibrahim had earned a bachelor's degree in literature.`n`nYusupov's homeland is Karakalpakstan, a region long controlled by the Russian Empire and then the Soviet Union. After enjoying the best years of the century, Karakalpakstan's autonomy was gradually eroded over decades. It was no surprise, then, that the Karakalpaks quickly declared independence and successfully resisted the warlord incursions following the Soviet collapse. The Karakalpaks were fortunate to transition from communist rule to a free and democratic government, avoiding strongman politics and tyrannical rule. Despite the weight of so many authoritarian regimes pressing down like lead, Karakalpak society's natural love of freedom allowed poets and journalists like Yusupov to flourish. Yusupov first became a newspaper editor and literature professor, but eventually entered politics, elected President of the Republic of Karakalpakstan in 1961. Even before the election, Yusupov was a popular writer with a solid reader base, which gave him a strong electoral foundation, and his eloquence made him a standout in debates. Yet after Ibrahim Yusupov was elected president, he faced far more complex problems than poetry, and had to deliver on the policies he had so passionately promised."
 KRK_Kadyrov_Abdurashit: "Kadyrov Abdurashit"
 POLITICS_KADYROV_ABDURASHIT_DESC: "What defines the world as you know it? Different people give different answers: a German youth might say the West Russian War, which tore the world apart and put it back together as if it were meant to be; a young Russian communist might say the day the Revolutionary Front collapsed; Abdurashit Kadyrov would say it was the day the Germans halted at the A-A line — the day that changed the course of history.`n`nAs Russian forces regrouped around Syktyvkar, Kadyrov's loyalty to the West Russian Revolutionary Front gradually eroded as his homeland grew more turbulent. But when the West Russian War broke out, his loyalty was tested. Through willpower, he did not desert and flee back to Karakalpakstan. And as the Front neared collapse, Kadyrov happened to be on the southern front. He used the chaos to seize the last chance to return home. His compatriots were running about like headless flies; he decided to take the lead, and with the help of his people and persecuted Uzbek political exiles, he established a Karakalpak state.`n`nKadyrov is widely respected for his distinguished service in the West Russian War and his leadership during the founding of the state. He has become a thorn in the side of anyone who would seek to destroy Karakalpakstan, and he must ensure the safety of his people."

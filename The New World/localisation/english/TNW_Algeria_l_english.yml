l_english:
 ALG_Ferhat_Abbas: "Ferhat Abbas"
 POLITICS_FERHAT_ABBAS_DESC: "For 20 years, Ferhat Abbas has fought for the civil rights of Algerians under French rule. He fought for true equality, for the repeal of discriminatory clauses in French law, and for an end to the omnipresent racism of the so-called 'Europeans.' But he never sought to end French rule over Algeria itself. He was counted among the 'assimilated' new Algerians who could work alongside the French to build a new 'French Algeria.'

Yet history chose another path. The political will for reform was nowhere to be found. The French Republic fell during the Second World War, and the iron fist of the Nazis led to growing unrest in Algeria, culminating in the Constantine massacre of 1947. There, demented European militias slaughtered his brothers and sisters, with the forces of the French State acting as their accomplices. He could only watch.

As repression intensified, Abbas realized his dream was dead. An Algeria united between European and Algerian could no longer exist, and his moderate efforts would be seen as a thorn in the side of the Europeans. He relocated to the more politically friendly Tunisia, joined the political apparatus of the National Liberation Front, and sought Algerian independence in his own way.

As someone who can mediate between the various factions and incompatible personalities within the National Liberation Front and the National Liberation Army, he has much work ahead of him. To win the war... and to secure the peace."

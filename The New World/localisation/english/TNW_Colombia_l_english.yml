 CLC_Hernando_Currea_Cubides_sec_desc: "@@TODO_1139@@"
 CLC_Belisario_Betancur_hog_desc: "§YPrime Minister\nNational Conservatism§!\n--------------\n§LMoreno's attempts to reform the party are meant to bring new life into the Colombian Colossus, to make it live up to its founding ideals and to the new order it preaches, it is only fitting then that his right-hand man, Belisario Betancur be the manifestation of this new spirit.\n\nBorn in Antioquia in 1923, Belisario belongs to the young guard of the party, he has become a rising star in the party in the last ten years, acquiring a reputation for being a pragmatist, a bold fighter and a poet, yet above all a staunch nationalist, his exploits caught the attention of Augusto Moreno, to whom Belisario has become something of a protégé.§!"

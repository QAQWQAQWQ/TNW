 CLC_Silvio_Villegas_hog_desc: "§YExecutive Secretary of the ANP\nCorporate Statism§!\n--------------\n§LFew men can claim to rival the Duce in reputation in the ANP, yet Silvio Villegas is one of those few. One of the original Leopardos, a group of far-right thinkers which inspired the Duce, Silvio was viewed as the most theoretical minded of the group and the one responsible for their manifestos, or in other words, its idealogue.\n\nHis expansive knowledge of philosophy, good writing skills and oratory abilities paint the picture of a true eminence of the revolution. This, alongside his close friendship with the Duce dating back to the founding of the party, of which he was one of the first members, means his position as Executive Secretary should be no surprise.§!"
 CLC_Carlos_Echeverri_Cortes_for_desc: "§YChancellor\nAristocratic Conservatism§!\n--------------\n§LCarlos Echeverri Cortés is perhaps one of the most fitting people to represent New Granada on the world stage, for he matches the regime's ruling class' defining characteristics perfectly. An egotistical sycophant known to be rather unscrupulous, a hardline reactionary and anti-communist, a lover of fine art and European culture, particularly that of Italy, with which he fell in love with during his tenure as Ambassador.\n\nIt is this exact appointment that has led him here for he was the first Ambassador to Italy after the Second World War, assisting the Kingdom in entrenching its influence in Colombia, something that would directly lead to the ANP being forged. Now, Echeverri is tasked with ensuring New Granada does not forget who its biggest benefactor is.§!"
 CLC_Diego_Garces_Giraldo_eco_desc: "§YFounder of the Supremo Consejo Económico\nOligarchy§!\n--------------\n§LDon Diego as he is commonly known is one of the most renowned figures in his home department of Valle, a millionaire and polyglot with a long background including a doctorate from Trinity College and tenures as diplomat, senator and businessman.\n\nDon Diego is known as the man responsible for New Granada's momentous growth over the past 10 years. Founder of the Supreme Economic Council, a cabal of New Granada's leading industrialists, his portfolio includes ownership of JGB, the sole provider of pharmaceutical goods in New Granada, and Conciviles, its main construction company. For better or worse, all economic decisions in New Granada have to go through him.§!"
 CLC_Julio_Mario_Santo_Domingo_hog_desc: "§YHead of Government\nAuthoritarian Developmentalism§!\n--------------\n§L§!"

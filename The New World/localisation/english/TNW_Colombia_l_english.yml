 CLC_Leon_Maria_Lozano_sec_desc: "§YEl Rey de los Pájaros\nWarlordism§!\n--------------\n§LLa Violencia has left deep wounds on Colombian society and its scars will be felt for many years to come. Lozano is one such scar. A meager cheesemaker before the death of the Caudillo, the man used the chaos to organize a network of paid killers under his command.  The network, known as Los Pajaros or \"The Birds\", served the interests of the Conservative party, being funded directly by aristocrats like Valle's ex-governor Nicolás Borrero Olano.\n\nThis servitude continues under New Granada, where the organization has evolved to become the regime's blackshirts, expanding both in operations and in manpower accordingly. What did stay the same is their leader, El Rey de los Pájaros, The King of the Condors, León María Lozano, now a shriveled old man.§!"

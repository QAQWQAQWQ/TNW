 POLITICS_TAIMUR_DESC: "In an increasingly unstable region, the Sultanate of Oman sits at the center of a growing wave of chaos, surrounded by dangers on all sides. To the north and east lies the Italian Empire: fragile, but with a growing appetite for oil and enough guns, influence, and diplomacy to seize it. To the west is Saudi Arabia, whose fanatical Wahhabi leaders have only halted further conquest out of fear of the colonial powers. To the east is the sea, where the tigers, eagles, and dragons grow ever closer. In the desert interior, Arab nationalists and rebel imamate forces grow stronger by the day, their numbers matched only by their devotion. One would assume that in such perilous times, the sultanate can rely on strong, focused leadership?

Unfortunately, the royal descendant tasked with facing these dangers is Sa'id bin Taimur, a man who can barely rule his own household and palace, let alone the rest of the country. Forced to choose between Italian protection and the dangers of isolation, he chose a cowardly middle path — signing a humiliating "treaty of friendship" while refusing to join the Triumvirate or accept their advisors. Rather than using Oman's oil wealth to improve the lot of his miserable people, Taimur chose to buy liquor and fast cars, and maintain loyalty by banning such "moral hazards" as tape players and film projectors.

As the nominal sultan sinks further into paranoia and isolation, alternating between drunken rages, power alternates between scheming ministers and his son Qaboos, who is nominally under house arrest by his father. To international observers, it is increasingly clear that Oman's survival in this dangerous new era owes itself to little more than luck and the distraction of its rivals. How long this arrangement can hold remains deeply doubtful."
 OMA_Said_Bin_Taimur: "Said bin Taimur"
 OMA_Qaboos_bin_Said_Al_Said: "Qaboos bin Said Al Said"
 OMI_Ghalib_Ahinai: "Ghalib al-Hinai"
 OMB_Layla_Fakhro: "Layla Fakhrø"
 OMA_the_old_sultan: "The Old Sultan"
 OMA_the_old_sultan_desc: "Sultan Said bin Taimur is truly a great man — how could he not be? The sultan is so confident in his reign that he need not even leave his palace, instead luxuriating in the opulence earned by one of true power. Some whisper that the country's modest oil reserves could never support such lavish spending, that the true source of funds must be darker — but they are addle-brained fools. Without a doubt, the dynasty that has led Oman for two hundred years will continue to lead it for another thousand."
 OMA_the_young_heir: "The Young Heir"
 OMA_the_young_heir_desc: "One of the endless tragedies of declining empires is that weak rulers typically sire weak sons. Strangely, Qaboos is nothing like his father, having proven himself bright and hardworking from boyhood, hungry for the rights and responsibilities of rule. Yet now, aside from occasional speeches from the balcony, neither man has appeared in public. Onlookers can only wonder whether their relationship is that of father and son, monarch and subject, or jailer and prisoner."
 OMA_whispers_in_the_desert: "Whispers in the Desert"
 OMA_whispers_in_the_desert_desc: "For a thousand years, the Middle East has belonged to sultans and emirs. Yet now, new forces with new ideas can be found in every alley and every patch of sand. Shadows lurk in the Yemeni desert; tribesmen go out hunting and never return. Youth lay down their plows, take up rifles and balaclavas, and tell tales of socialist liberation or Islamic revival. According to Sultan Said bin Taimur, these rumors are nothing but nonsense, and those who spread them are nothing but traitors deserving of punishment."

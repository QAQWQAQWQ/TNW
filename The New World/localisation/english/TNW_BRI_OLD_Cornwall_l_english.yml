 CRN_national_socialism_party:0 "Military Administration of the British Isles"
 CRN_national_socialism_party_long:0 "Military Administration of the British Isles (Militärverwaltung der Britischen Inseln)"
 POLITICS_FRANZ_HALDER_DESC:0 "Franz Halder — a name that will go down in history. Who crushed the Soviet Union? Who destroyed Poland? Franz Halder. Who defeated the twin giants of Europe, France and Britain? As Chief of the General Staff of the Oberkommando, Franz Halder oversaw the plans to crush both nations, and directly participated in the planning of Operation Sea Lion, which destroyed the once-mighty British Empire in a single campaign. Such feats are everything a soldier could ever dream of — and is there a better way to cap off a glorious military career than having a collaborationist government bow down before a tiny border garrison? This honor certainly belongs to Halder, but if he had known what he would face, he would never have accepted Hitler's offer.

Mosley was too incompetent, which cost him the premiership, and the worthless successors who followed were equally unable to govern the English people, forcing Halder to become the power behind the English government. But then the Russians launched their invasion in 1953, and for a moment, Halder seemed poised to escape this semi-retirement and once again be ordered to the Eastern Front to command thousands of troops. This was supposed to be his final battle, his final victory. And then the Communists launched an uprising in London.

Mountbatten ignored the situation as it developed, letting the uprising escalate into rebellion, but rumors of his contact with British society's criminal elements sealed his fate. Not long after the uprising began, Mountbatten was gone. In the weeks that followed, Franz Halder took up the burden, driving the Communists out of London block by block. Due to the OKH's doubts about his record, Halder could never convince Hitler to let him retire. Over the past decade, this veteran has been stationed in Cornwall, dealing with trivial terrorist groups while listening to the so-called London allies' pointless complaints. Now, all Franz has is a forgotten, decaying garrison and memories of past glory."
 CRN_the_paper_lion:0 "Paper Lion"
 CRN_the_paper_lion_desc:0 "The core of the German forces in Cornwall is a group of battle-hardened veterans, among the finest soldiers the Wehrmacht has ever produced. Tempered by years of combat, they would go through fire and brimstone. However, today's ranks are mostly filled with the children of Germanian officials who want a safe job for their kids. It goes without saying that the garrison's current combat effectiveness may be little more than a paper figure."
 CRN_the_fading_generaloberst:0 "The Fading Generaloberst"
 CRN_the_fading_generaloberst_desc:0 "Franz Halder wanted his final battle to be on the frozen plains of Russia, one last service to the Fatherland before enjoying a comfortable retirement. In fact, over the past twenty years, he has been stuck in a remote corner of Britain, suppressing Communists and royalists. In truth, Franz Halder just wants to spend his last years in peace, but that seems an unlikely wish."

 FTF_idea_murtalas_realm: "Murtala's Realm"
 FTF_idea_murtalas_realm_desc: "There was a young officer from Sokoto who, in the 1950s, watched as Cameroonian raiders displaced his people; later, he saw their plight under the Sokoto government. He resolved to rebel, and Futa Massina came into being. This officer was named Murtala Mohammed, born into a Fulbe ruling class; leveraging his status, he quickly established a nation in the desert. It was here that Futa Massina was born, and freedom arrived."
 FTF_idea_nascent_nationalism: "Nascent Nationalism"
 FTF_idea_nascent_nationalism_desc: "Futa Massina's will is Murtala's will, and Murtala asks for nothing more: he only wishes his people could freely choose their own destiny. In Africa, the idea of nationalism is still in its infancy, and it cannot be built in a single day.

Despite these difficulties, Murtala remains focused on building a Massina identity, hoping these efforts will soon make that identity legitimate enough for the Massina people to become a complete and mature nation."

 EWE_idea_language_barrier: "Language Barrier"
 EWE_idea_language_barrier_desc: "Ghana was formed from the merger of two former colonies — the British Gold Coast and French Togoland — and thus has roots in two European cultures. With no national standard language, Ghana's administrative system is split in two, making unified reform difficult. This bilingual African nation is still on the long road to linguistic standardization; though it has taken its first steps toward linguistic unity, it is far from a coordinated government."
 EWE_idea_bloated_high_command: "Bloated High Command"
 EWE_idea_bloated_high_command_desc: "Conflict has been rife on Ghana's path to unification, and each battle has been accompanied by mass promotions. As a result, the Ghanaian army is unusually top-heavy, crowded with senior officers. Rivalry among these important officers means the ranks are filled with competition and factional conflict. Unfortunately, Ghana's army has become bloated, ineffective, and divided."
 POLITICS_KOMLA_AGBELI_GBEDEMAH_DESC: "Historically speaking, Ghana's politics are chaotic. Ghana was formed from the merger of two former colonies — the British Gold Coast and French Togoland — the Gold Coast a British colony, Togoland having passed from German to French rule until independence after World War II. The two governments cooperated to bring about the merger, and the Republic of Ghana was born. The local United Gold Coast Convention was tasked with building Ghana into a strong and free republic — and in fact, they did.

Naive as you might think. In truth, the United Gold Coast Convention is entirely under the control of the "Big Six," an alliance of Ghanaian political strongmen. Through their control of the UGCC, the Big Six dominate every aspect of Ghanaian politics, and no one can resist their rule. The current president, Komla Agbeli Gbedemah (nicknamed "Gbed of Africa"), won the 1956 election only because they arranged it. Gbedemah began as a humble timber trader, but after joining the UGCC, he rose quickly through its ranks thanks to his friendship with two of the Big Six — former president Edward Akufo-Addo and Convention People's Party founder Kwame Nkrumah. Grateful, he kept Akufo-Addo in the cabinet as prime minister and promised full support to Nkrumah. Yet Nkrumah advocated anti-colonialism and wanted Ghana to become a socialist state, which clashed with Gbedemah's liberalism and pro-Western stance.

The inaction of Gbedemah's faction has caused the CPP's support to collapse entirely, while opposition support is rising sharply. The situation in Togoland grows more tense by the day, and the military is preparing for the worst. If the Gbed of Africa doesn't act quickly, his own plans — and the Big Six's — will collapse, dealing a severe blow to both."

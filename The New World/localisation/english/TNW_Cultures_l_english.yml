 var_nationality.900: "French Southern and Antarctic§F, the inhabitants include colonial soldiers, career bureaucrats, greedy whalers, and naive adventurers. Though all residents of the Kerguelen Islands are §YFrench§!, they are hardly homogeneous. Struggling to survive in this harsh, desolate wasteland, they have forged a shared identity. They have even developed a §YFrench§! dialect known as the Southern and Antarctic dialect. This unique dialect arises from a mix of military and technical terminology, combined with jokes and literature long circulated internally§!"

 POLITICS_VICEROY_DAVIDE_FOSSA_DESC:0 "After the reconquest of Italian East Africa, Italy needed someone trustworthy to hold the colony firmly in hand. Davide Fossa was undoubtedly the best choice - he had served as labor inspector in Italian East Africa and was the most important PNF party official in the Horn of Africa for over twenty years. Both administrator and party member, he was soon appointed viceroy.\n\nFossa firmly believed that Italy was destined to dominate the Horn of Africa, and immediately set about restoring order, rebuilding Italian rule throughout the colony. On one hand, the last rebel strongholds must be eliminated; on the other, infrastructure must be repaired, and public order maintained through day-to-day administration to avoid emergency measures. These formidable tasks will keep the new viceroy and the IEA bureaucracy and police busy for the rest of the decade."

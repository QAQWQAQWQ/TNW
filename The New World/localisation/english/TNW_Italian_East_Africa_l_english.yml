 POLITICS_VICEROY_AMEDEO_DESC:0 "Amedeo di Savoia-Aosta is a striking figure - some may love him, some may hate him, but no one can ignore him. Known as the Iron Duke, the hero of Amba Alagi was born into a cadet branch of the Italian royal family and eventually became a general in the Regia Aeronautica. In 1937, Amedeo was appointed Viceroy of Italian East Africa due to his noble blood, but unlike his unfortunate brother Aimone (Tomislav II), Amedeo quickly seized real power in the IEA government. In WWII, he personally led Italian forces against the British, winning a great victory at Amba Alagi that checked the British advance in East Africa.\n\nAfter the war, Amedeo once again devoted himself to colonial administration. As a capable viceroy who opposed the fascist system (and thus earned the sympathy of new leader Ciano), Amedeo did his best to protect the natives of Italian East Africa from the expanding fascist authorities and Italian companies seeking to exploit Ethiopian, Eritrean, and Somali labor. Living conditions for IEA natives were far superior to those in the rest of German-controlled Africa, largely thanks to Amedeo's tireless efforts.\n\nHowever, Amedeo's rule still carried the trappings of colonialism, meaning many natives still despised him and all Italians. Paramilitary groups and rebel bands hiding in the mountains and countryside remained a serious problem, and even natives who did not oppose the Italians still faced unequal treatment and poorer lives relative to Italian settlers. Amedeo is old and has not yet named an heir, and sometimes the viceroy cannot suppress his homesickness - who knows if all his efforts will end in vain..."

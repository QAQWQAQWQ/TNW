 ZOM_Zombies:0 "Shambling Horde"
 ZOM_Zombies_desc:0 "The dead have crawled from their graves in every corner of the world, shambling forth. The world's armies were caught completely off guard; they had fought across oceans and blue skies, but never against creatures so uncanny: they look just like us, yet are driven only by a bloodthirsty hunger. Never before has humanity faced these most terrifying reflections of itself: their numbers exceed the sum of all armies, their terrible predation is not stopped by bullets to the body, and their speed and endurance surpass human limits - so fast the eye cannot follow. When the hordes swarm forth, their terrible assault does not stop for casualties or lack of supply. How many must die to stop them? Tens of millions? Hundreds of millions? Humanity cannot win this war. We can only await the end of history in despair."
 ZOM_Zombies_hidden:0 "Shambling Horde"
 ZOM_Zombies_hidden_desc:0 ""
 Anti_Zombie_Weaponry_1:0 "Early Flamethrowers"
 Anti_Zombie_Weaponry_1_desc:0 "Though little more than machines that spew burning gas, these primitive weapons can effectively kill the undead - though the user faces significant risk."
 Anti_Zombie_Weaponry_2:0 "Basic Flamethrowers"
 Anti_Zombie_Weaponry_2_desc:0 "After standardization and measurement of accuracy, these weapons have better precision and greater range than before. Though still in early mass production, this is enough to slow the horde's advance."
 Anti_Zombie_Weaponry_3:0 "Improved Flamethrowers"
 Anti_Zombie_Weaponry_3_desc:0 "Factories across the world have begun manufacturing the same thing - flamethrowers. Clearly, only fire can destroy the horde, and innovative new flamethrowers have proven devastatingly effective."
 Anti_Zombie_Weaponry_4:0 "Advanced Flamethrowers"
 Anti_Zombie_Weaponry_4_desc:0 "The horde's wailing echoes across the world. Fire sweeps through cities, alleyways, and mountains. Yes, it is extravagant and impractical. Yes, it may be difficult to handle. But the spreading waves of heat it unleashes can incinerate vast swathes of the horde in minutes - a feat no other weapon can match."
 Anti_Zombie_Weaponry_5:0 "Semi-Modern Flamethrowers"
 Anti_Zombie_Weaponry_5_desc:0 "This seems a construction of paper. Bright and smooth. The nozzle and barrel gleam. A small canister of gasoline. Perhaps fire, the great destroyer, will become our savior."
 Anti_Zombie_Weaponry_6:0 "Modern Flamethrowers"
 Anti_Zombie_Weaponry_6_desc:0 "Listen, undead! Sleep once more. Let your weary bodies lie. This is your fate: face the flames. Return to your home, beneath the graves of this broken world. I will be your shepherd, my lamb."

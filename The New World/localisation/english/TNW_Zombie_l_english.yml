 POLITICS_ZOMBIE_JOSEPH_GOEBBELS_DESC:0 "A rotting, skeletal hand reaches up from beneath a sealed tomb. Once, the owner of this hand held high office - now it reeks of rats. A muffled groan escapes, barely recognizable as the resonant voice this corpse once wielded. Aside from the light breeze sweeping across Germania and the whispers of the horde from the north, all is silent tonight. Germany's War Minister Goebbels has awakened from his brief slumber.\n\nThough his vocal cords have long rotted, his oratorical gifts have not faded. With the dawn light, Goebbels shamble toward the horde to the north, muttering complaints about these Germans. He sees the crumbling metropolis and weeps. He beholds the shattered nation and can barely breathe. With sorrow, he walks toward the horde. Piles of corpses form a natural podium. Goebbels steps forward and begins to speak.\n\nFor the glory of the undead and Germania. For the power of war. For prophecy and fulfillment. For a new war, a war where everyone is a warrior. All the undead will unite under this banner - no more guns, no more farming; only slaughter, and then feasting.\n\nLife still stirs within Goebbels' rotting form. He sees his audience's reaction and smiles faintly. Perhaps this time, true total war will descend upon the world."
 ZOM_Rodomo_Virus:0 "Ludomo Virus"
 ZOM_Rodomo_Virus_desc:0 "The Ludomo virus was born of Burgundy's hubris. It spreads through the air and infects within days. The only known course of action is quarantine and hope for the best.\n\nAnd of course, burning the corpses. The undead are not to be trifled with."

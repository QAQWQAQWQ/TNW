 spook_news.1.t:0 "[Get_newspaper_header]Whispers from the Black Sun"
 spook_news.1.d:0 "For years, the fog of the SS's eternal war has hung over the quiet Burgundian territory, obscuring the dark deeds beneath. In recent months, the trickle of rumors leaking from the Ordenstaat has gone silent, leaving world leaders in an unsettling intelligence vacuum. From scattered reports, global leaders can confirm only that the Ordenstaat has been secretly transporting sealed components and protective equipment through Brittany.\n\nFollowing the French State's official condemnation, which claims the SS is truly responsible for the Paris rabies outbreak, this secret has come to light. More governments have begun scrutinizing viral outbreaks in their own cities, and the news has swept international headlines. Now, the eyes of the world turn toward this dark corner of Europe, all wondering whether these harbingers of death are about to unleash a new plague."
 spook_news.1.a:0 "The silver skull grins."
 spook_news.1.a.tt:0 "§RUndead events fully enabled.§!"
 spook_news.1.b:0 "Watch this closely."
 spook_news.1.b.tt:0 "§WUndead portraits and events only.§!"
 spook_news.1.c:0 "Perhaps nothing will happen..."
 spook_news.1.c.tt:0 "§GUndead events disabled.§!"
 spook_news.2.t:0 "[Get_newspaper_header]Germany Accuses Burgundy of Bioweapon Attack"
 spook_news.2.d:0 "Today, the German Foreign Ministry formally issued a statement to the Burgundian Ordenstaat, condemning it for launching what it called a 'cruel and barbaric attack' against Germany.\n\nThough the statement was vague and lacking detail, many suspect it relates to the recent official announcement in Strassburg of a measles outbreak that shut down the entire city. Burgundy denied responsibility for any 'German medical system failure,' which to outsiders looked like a rare admission.\n\nThe announcement has heightened tensions between Germany and its vassals. After the CIA released photos of German troops in protective gear and gas masks entering Alsace, many have begun preparing for a possible nuclear exchange."
 spook_news.2.a:0 "Has the Black State gone too far?"
 spook_news.3.t:0 "[Get_newspaper_header]Nuclear Explosion in the Ludomo Industrial Zone"
 spook_news.3.d:0 "Seismologists in England have confirmed visible nuclear blast signatures from a series of tremors stretching across the English Channel from Normandy. The nuclear explosion occurred Thursday at 5:28 AM.\n\nUS President [USA.GetLeader] and Japanese Prime Minister [JAP.GetLeader] both condemned Germany for launching a nuclear attack that allegedly killed millions in Burgundian territory. In response, the Fuhrer denied Germany had fired any nuclear weapons. CIA analysts rebutted the statement, citing the recent deployment of German NBC defense forces to Alsace.\n\nBy words and by fact, England and several other European nations are bracing for the fallout, and the nuclear exchange may be only the beginning of a far wider war."
 spook_news.3.a:0 "Are they mad? They'll kill us all!"
 spook_news.3.b:0 "Let's have some fun..."
 spook_news.3.b.tt:0 "§RPlay as the horde.§!"
 spook_news.4.t:0 "[Get_newspaper_header]The Ordenstaat Goes Quiet"
 spook_news.4.d:0 "The city once known as Greater Rouen is now a nuclear wasteland, and an eerie silence has fallen over all of Burgundy. 'Quiet as a grave,' one worried intelligence officer half-joked. The dealings with Brittany have ceased, and no refugees flee into the French countryside. Germany is slightly more talkative than its monstrous western bastard; the Chancellery, preoccupied with domestic crisis, continues to deny any responsibility for the bombing of Ludomo that outsiders assume it bears.\n\nYet two signs concern anxious onlookers more than any other. Aircraft flying patrols near Burgundy's airspace report that cities with night lighting are growing fewer. More concerning still, people living in the Netherlands and southern England report that Burgundy's radio signal jammers seem to be failing one by one."
 spook_news.4.a:0 "Is anything moving in the darkness here?"
 spook_news.5.t:0 "[Get_newspaper_header]The Battle of Gomorrah"
 spook_news.5.d:0 "After meeting with federal and state officials, New York Mayor Robert F. Wagner Jr. announced that as of noon EST today, New York City is under a state of emergency. He urged the five borough authorities to prepare for the worst and implement the strictest quarantine measures in response to 'civil disturbances' in Lower Manhattan and Brooklyn. The mayor was last seen disheveled, leading his family in a motorcade into the Holland Tunnel.\n\nBefore all non-essential broadcasting went silent nationwide, regular Army and National Guard units quickly cordoned off the Big Apple. Despite the news blackout, scattered reports have emerged of troops using lethal force to disperse crowds at checkpoints - [USA.GetLeader] is expected to address the nation on television later this evening."
 spook_news.5.a:0 "What war has come to our homeland's shores...?"
 spook_news.6.t:0 "[Get_newspaper_header]Imperial Japanese Army May Withdraw"
 spook_news.6.d:0 "Just days ago, the first cases of the global pandemic now sweeping Western Europe and recently appearing in New York emerged in Shanghai. This Asian metropolis has confirmed its first outbreak, and given Shanghai's dense urban layout, the disease is undoubtedly spreading rapidly.\n\nThe threat of an uncontainable outbreak has prompted the Imperial Japanese Army to concentrate all its forces in China, possibly preparing to withdraw to the Japanese home islands for epidemic control. Suddenly, Japan may pull out, and President Gao Zongwu has mobilized ROC forces to quarantine Shanghai and prevent the disease from spreading to other Chinese megacities or international ports. Whether these measures will work remains to be seen."
 spook_news.6.a:0 "What has plague and death made of the East?"
 spook_news.7.t:0 "[Get_newspaper_header]Massacre on the Bering Sea"
 spook_news.7.d:0 "An operation report has been leaked to the public, believed to belong to a small US Navy patrol near Alaska, and what it describes is quite horrifying. It was a dark, moonless night when the patrol encountered an unknown flotilla; they immediately fired signal flares and requested to communicate. According to an anonymous source, the flotilla was carrying Russian refugees, presumably departing from ports in the Russian Far East seeking asylum in America. An unknown virus had broken out locally, which in their words 'had destroyed their homes and turned their families into insane killers.' But shortly after communication was established, the patrol suddenly opened fire on the refugee convoy, slaughtering them all.\n\nThe President has not commented on the matter, but a White House spokesperson claims they will do everything within their authority to ensure national security and secure the border."
 spook_news.7.a:0 "The world has already grown dim."
 spook_news.12.t:0 "[Get_newspaper_header]Anarchy Grips the British Isles"
 spook_news.12.d:0 "Today, the already anxious world turns its attention to the British Isles, where a series of troubling events has unfolded. Several military outposts across a rapidly expanding region have lost contact, and more go dark each day. The government has exhausted every effort to stop the deterioration. Almost nothing is known of the truth behind these terrible developments, though increasingly worrying scattered reports describe the British Isles as a living hell, with both the island interiors and coastal areas like London engulfed in raging flames.\n\nWhether these events are connected to one another, or to the catastrophes that have befallen other parts of the world, no one knows. This meager information leaves people to wonder whether any organized government still exists on the British Isles, and whether they can emerge from this chaos is a mystery."
 spook_news.12.a:0 "Will the British Isles fall once more?"
 spook_temp.11.t:0 "Breaking the Seal"
 spook_temp.11.desc:0 "I looked, and there before me was a pale horse! Its rider was named Death, and Hades was following close behind him. They were given power over a fourth of the earth to kill by sword, famine and plague, and by the wild beasts of the earth.\n\nYou are worthy to take the scroll\nand to open its seals,\nbecause you were slain...\n\nWorthy is the Lamb, who was slain,\\nto receive power and riches and wisdom,\nand strength and honor and glory and blessing!\n\nWill the Lamb dare break the seal and see what is hidden in the scroll?"
 spook_temp.11.a:0 "...Praise, honor, glory and power be to the Lamb!"
 spook_temp.11.a_tt:0 "§RThe earth will break free from its seal and gain eternal liberation.§!\nPlay as the undead horde."
 spook_temp.11.b:0 "Some seals should not be broken."
 spook_temp.11.b_tt:0 "Perhaps you will be shaken by what follows, but §Ryou know that chaos is coming.§!\nFight against the undead horde."

 POLITICS_TENZIN_GYATSO_DESC: "The great upheavals of the twentieth century have overturned the order of all things, time and time again. Yet the Tibetan people have not wavered, standing firm as always. The 14th Dalai Lama remains firmly at the helm of this resilient nation. Known also as Tenzin Gyatso, he is the spiritual and political leader of all Tibet. Though he lacks direct political power, his influence over Tibet and the entirety of Tibetan Buddhism is unmistakable.

Like other Dalai Lamas before him, Tenzin Gyatso is believed to be the reincarnation of the 13th Dalai Lama, an incarnation of the Bodhisattva of Compassion. Tenzin Gyatso was born on July 9, 1935, in the village of Hongya on the Tibetan-Chinese border. At the age of four, he was discovered by Tibetan lamas and, through their traditional tests, identified as the next Dalai Lama.

From that moment on, he became the spiritual and political leader of Tibet. Though when he ascended, real power in Tibet lay in the hands of the lamas who served beneath him. Such an open theocratic system invites curiosity and criticism from outsiders, and some have criticized Tibet and its internal system of rule. Yet this system preserved Tibet's independence for half a century after the fall of the Qing dynasty."

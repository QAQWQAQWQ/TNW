 POLITICS_FELIX_ROLAND_MOUMIE_DESC: "What is not, should not be. For two hundred years, European vampires have marched across Africa under the banner of humanitarianism, ignoring a thousand years of local history, using their tricks and machinations to impose a heavy shadow upon this continent. After being polished by guns, banknotes, and unequal treaties, this continent has become a living testament — proof of the limits of human greed, and proof of how unscrupulous imperialism can be in pursuit of its goals. For a few coins, millions have turned to bone and ash, while the bankers say: we had no choice.`n`nThis is the age of Félix-Roland Moumié. He did not live at the terrible apex of European colonialism like so many of his countrymen; this age is more like the final curse spat out as the beast lies dying. Hütig's concentration camps, barbed wire tangled like roots, Italy's North African territories where natives have all but vanished... colonialism seems determined to drag the entire continent into the abyss. But they will not succeed. Africa wants its rightful place, and that can only come through force — pure, ruthless force.`n`nAfrica will only become Africa when the colonists scream and flee the plantations, when the chains of capitalism are smashed above their heads. Africa will only become Africa when the disputes between tribes are forever stilled. Africa will only reclaim all that is rightfully hers when justice and freedom belong to all.`n`nFor Félix-Roland Moumié, only Africans can save Africa. Oh! Africa! Wellspring of our ancestors' blood! (French)"

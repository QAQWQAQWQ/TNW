 CAO_ACA: "African Continental Army"
 CAO_ACA_desc: "The African Continental Army's finest hour dates back to the Central African Crisis of the 1950s, when it proved its remarkable combat capabilities. Those glory days are long gone; the army is now a motley militia, disorganized, undisciplined, poorly equipped, and held together only by an incompetent command structure. It has clearly been overstretched and rapidly aging, and carries no deterrent among the colonial powers in this region."
 CAO_ACA_2: "African Continental Army"
 CAO_ACA_2_desc: "West Africa rises.`n`nThe African Continental Army is reorganizing, transforming itself into an efficient vanguard force against the imperialism lurking at our gates. Its ranks swell daily, filled with people who seek liberation, and they will proclaim a simple message to the world:`n`nEnough!"
 CAO_ACA_3: "African Continental Army"
 CAO_ACA_3_desc: "We have surpassed all who came before.`n`nThe Continental Army is no longer an inexperienced defensive force; now powerful and efficient, it will only grow more experienced. We will march forward, ready to deliver the final blow to imperialism.`n`nWest Africa will be liberated first, and then we will liberate the entire African continent."
 CAO_idea_pan_african_vanguard: "Pan-African Vanguard"
 CAO_idea_pan_african_vanguard_desc: "Though the concept of Pan-Africanism did not originate in Cameroon, Cameroon has made it its goal. The Pan-African Vanguard sees Africa as it truly is: a playground for world powers, a nightmare for African natives beneath the iron heel of imperialism. Cameroon promises: liberation of all Africa from colonial oppression and from the unnatural, inhumane democracy that has been imposed upon it. The Pan-African Vanguard will clothe this continent in the eternal freedom that belongs only to Africans, and it will never surrender."
 CAO_idea_tense_borders: "Tense Borders"
 CAO_idea_tense_borders_desc: "Cameroon is adrift in an ocean of disorder and destruction. From the Central African Republic in the southeast to Yorubaland in the west, rampant insurgents make Cameroon's borders anything but safe. Yet defending the wild borderlands has proven prohibitively costly. But if Cameroon is to survive, it must resolve this issue quickly and secure its borders, or it will collapse."
 CAO_idea_political_rivalries: "Political Rivalries"
 CAO_idea_political_rivalries_desc: "The African Liberation Party maintains a facade of unity in Cameroon, but the organization is far from unified. Rival factions from various political backgrounds vie for control of the party, including Félix-Roland Moumié's centralist faction, Ruben Um Nyobé's federalist faction, the militarist faction, and the republican faction. Each faction consolidates power within the party, and some have developed their own militias. Eventually, one faction will emerge and decide Cameroon's ultimate fate."
 CAO_idea_egyptian_intelligence: "Egyptian Intrusions"
 CAO_idea_mano_blitz: "Battle of the Mano River"
 CAO_idea_mano_blitz_desc: "After centuries of foreign oppression, exploitation, and humiliation, we finally bear the fate of West Africa: for the final liberation of our people, rise up! Fight the final struggle! We can no longer stand by and let Western imperialists and their Yankee financiers trample our homeland! Rise up, children of the fatherland! Heaven has heard your cries, and no one will be ignored any longer! Forward, soldiers! Fight fast! Fight true! Fight hard! Let every invader find their grave in the shadows of the jungle!"
 CAOnews.1.t: "[Get_newspaper_header]Cameroon Collapses!"
 CAOnews.1.desc: "After a crushing defeat at the hands of the Anti-Pan-African Liberation Front coalition, the African State of Cameroon is on the brink of collapse. The pan-African dream, though supported by so-called revolutionaries, has been abandoned by those it was meant to help — the African people themselves. Now, this young nation lies dying — but it has no chance left.`n`nToday, the world bathes in the fires of an African hell. Domestic opposition leader Ahmadou Ahidjo has forcibly seized power in Cameroon. Though some in the country have sworn loyalty to him, most have taken up arms, and many minority groups have seized this opportunity to declare independence. War has returned to Cameroon, this time with the enemy within."
 CAOnews.1.a: "The pan-African dream is precious, yet distant."
 CAOnews.2.t: "[Get_newspaper_header]Biafra Wins!"
 CAOnews.2.desc: "This morning, reports emerged from the region of a ceasefire between Nigerian militias and the Igbo fighters controlling the west bank of the Niger Delta, followed shortly by a formal armistice announcement. The war was particularly brutal for the people of the region. Both sides committed atrocities too numerous to list, and the massacre of villages housing thousands was a common occurrence throughout the conflict.`n`nNow, peace is at hand. Chukwuemeka Odumegwu Ojukwu, President of the Republic of Biafra, has promised that a new era of African democracy, of the people and by the people, is coming. Another promise is the opening of Biafran ports to all who wish to trade. Whatever happens next for Biafra, both sides seem to have chosen to lay down their arms."
 CAOnews.2.a: "The faint spark of Pan-Africanism has lit the torch of democracy."

 ALB_Maliq_Bushati: "Maliq Bushati"
 POLITICS_TEFIK_MBORJA_DESC: "For most of the past few decades, Tefik Selim Mborja has lingered in the background of Albanian history, his importance only recently coming to the attention it deserves. Born in 1888, Mborja was one of Albania's fortunate few: born into a wealthy southern landowning family, rich enough to afford a higher education - which, since Albania had no universities, meant going abroad. Like many of his countrymen, he chose Italy, traveling to Rome to study law, where he became acquainted with the Ciano family. Returning to Albania, he became a member of parliament, one of the growing number of anti-Zogist vanguard politicians.\n\nThe Italian invasion ended Zog's regime. The operation was personally planned by Count Ciano, and Mborja was rewarded for his well-known pro-Italian sentiments with the post of General Secretary of the newly formed Albanian Fascist Party. In this position, he was able to exert influence over the Albanian populace, directing the party's propaganda and policy and leading the nation into a new Fascist era. Mborja has long struggled to counter the permanent presence of Italy and its envoys, and has used negotiation to secure a measure of autonomy for Albania within the new Roman Empire.\n\nBut in truth? All Mborja and his allies can do is paper over Albania's intractable problem: the destructive relationship between the nation and Italy. In theory, Albania is an independent state united with Rome under a single crown; in practice, it is a puppet that wins concessions and greater autonomy only in the face of imminent disaster - and one manifestation of that national disaster is the seemingly endless, spreading insurgency of partisans and bandits. Now, on Ciano's advice, Mborja becomes Prime Minister of Albania, determined to bring an end to the ceaseless conflict - a daunting prospect: in the Land of the Eagles, there is almost no unity between the various tribes, classes, or even regions."

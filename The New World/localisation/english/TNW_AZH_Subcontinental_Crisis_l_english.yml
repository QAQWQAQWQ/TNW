 SC_info_tt: "§W§YThe Subcontinental Crisis§! has become the forward battlefield of the §YCold War§!, with tensions rising by the day. Neither side wishes to see the §BIndian subcontinent§! fall into enemy hands, and the final fate of India and indeed §fAsia§! will be decided by who is more skilled at the art of maximum pressure.\n\n§OReadiness§! is the core metric of the crisis, quantifying both sides' will and ability to defend their interests and hold their ground. If one side's §OReadiness§! reaches §Y100%§!, it means that side will not yield before aggression; conversely, if it drops to §Y0%§!, that side will §Pback down§! and flee before the §xnuclear crisis§!.\n\nOur §OReadiness§! is fully visible; the enemy's §OReadiness§! is hidden in the §Lfog of war§! of the Cold War. This uncertainty is represented by the §juncertainty§! in the enemy's §OReadiness§! bar, reflecting our latest estimate of their state. It can be gradually §jrevealed§! through decisions.\n\nBoth sides must do their utmost to raise §OReadiness§!, and if the situation demands it, find ways to lower the opponent's §OReadiness§!. Some decisions will have greater effect depending on the enemy's §OReadiness§!. §OReadiness§! at §Y80%§! is the §xred line§!; once §xacross the red line§!, there is no turning back. §xThe enemy is no different§!.§!\n\nThere are two ways to end the crisis: if either side's §OReadiness§! drops to §Y0%§!, that side has §Plost§!, and the other takes all the spoils.\n\nA prolonged standoff inevitably breeds change. As the crisis develops, a countdown begins, and the §Ybreaking point§! approaches. If both sides are evenly matched, or both have §OReadiness§! below 30%, the crisis stalemates; otherwise, the side with lower §OReadiness§! is §Putterly defeated§!, equivalent to its §OReadiness§! dropping to §Y0%§!.\n§RIf §xboth sides§! are stuck in the §xred zone§!...§!§!"

 STC_oriental_racist_party: "Eastern Racist Party"
 STC_oriental_racist_party_desc: "The two dominant political currents in Santa Cruz — unionism and separatism — both direct their attention to their self-imagined racial superiority over the inferior Collas of the west.`n`nWhether expressed through praise for pure Spanish-white blood, or admiration for the descendants of Guarani-Mestizo warriors, or sometimes both, people hold to their views, which confirms what western newspapers have long claimed: there is indeed an Eastern racist party in the country, bent on making Santa Cruz the source of Bolivia's most feared disasters."
 STC_pozo_cano_ghost: "Ghost of Pozo Cano"
 STC_pozo_cano_ghost_desc: "Since 1938, the primary objective and top priority of Paraguayan foreign policy has been achieving genuine independence in the east as a springboard for annexing Santa Cruz.`n`nRaúl del Pozo Cano and Benjamín Varilla have played crucial roles in this diplomatic effort, and the Paraguayan embassy in Santa Cruz where they once served remains a hotbed nurturing separatist propaganda. A storm of propaganda, combined with Paraguay's formidable military power, has had a powerful impact, successfully shaking the hesitant sentiments of the eastern population."
 STC_masonic_shadow_war: "Two Lodge System"
 STC_masonic_shadow_war_desc: "Ever since Freemasonary surfaced, Western conspiracy theories about it have never ceased. Such theories often wore the cloak of antisemitism, especially in Germany: Hitler denounced Jews as the hidden hands behind Freemasonry, directly catalyzing mass purges against Jewish communities. The Masonic conspiracy became the perfect political scapegoat, and those in power freely blamed national suffering on it, regardless of truth or consequence.`n`nThe great irony is that such conspiracy theories have some grounding in reality only where the two great lodges actually broke away from the Masonic system.`n`nThe Eastern Knights and the Shelter Tree were once of the same origin; the latter's schism ignited a brutal shadow war that engulfed all of Santa Cruz — in politics, business, and the military, whoever held power belonged to one faction or the other. In Santa Cruz, without swearing allegiance to either lodge, advancement in society was impossible."
 STC_rapid_growth: "Eastern Miracle"
 STC_rapid_growth_desc: "Twenty years ago, even ten years ago, Santa Cruz was nothing but a backwater, synonymous with backwardness in the eyes of Bolivians. But like Arabia, black gold has made poverty a thing of the past. Today, any reasonably educated Cruceño half-jokingly calls their home the Eastern Pearl.`n`nThe discovery of major oil fields spurred industrial and economic growth, and the population swelled, nurturing urbanization in this backward region. Infrastructure projects of unprecedented scale were also underway, all for Santa Cruz's continued development.`n`n§GNeedless to say, this is Santa Cruz's golden age.§!"

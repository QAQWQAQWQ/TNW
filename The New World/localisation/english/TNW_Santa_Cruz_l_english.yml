 STC_Luis_Sandoval_Moron: "Luis Sandoval Morón"
 POLITICS_LUIS_SANDOVAL_MORON: "Lucho has returned to his city. Those few words tell the whole story.`n`nLuis Sandoval Morón poured his life's blood into the struggle for Santa Cruz — not the Santa Cruz fabricated by the fascist opportunists of the Eastern racist party, but the real Santa Cruz of the poor and all Bolivians. The revolutionary struggle against Paraguayan invaders and their separatist accomplices was his life's pride. When he took the leadership of the Santa Cruz Revolutionary Nationalist Movement from Froilán Calleja Castro, he foresaw the dawn of victory. But like Icarus flying too close to the sun, fate had already laid its trap.`n`nThe betrayers were not the people who remembered his fight against the landowning class, but his own brothers-in-arms. The opportunism-corrupted Chávez Ortiz brothers drew their poison blades in the Fifth Chaco War, not only refusing to support Bolivia's liberation of its countrymen but kneeling before the enemy. They dared condemn Sandoval's iron measures during the war, slandering his iron-fisted policies to consolidate the army — what absurd accusations!`n`nThe brothers swept most of the Revolutionary Nationalist Movement with them and drove Sandoval out of his Santa Cruz homeland. In exile, the venom of revenge coursed through his veins, vowing to make all betrayers pay in blood. Hatred accumulated in his heart day by day, and now the moment of reckoning has come. The whole city trembles in his palm; the Chávez Ortiz brothers are about to become prey, and the separatists will be sent to the guillotine. As for their wives? All's fair in love and war."

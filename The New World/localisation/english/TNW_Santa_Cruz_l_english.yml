 STC_Carmelo_Ortiz_Taborga: "Carmelo Ortiz Taborga"
 POLITICS_CARMELO_ORTIZ_TABORGA: "The Second Chaco War sparked by President Busch was arguably Bolivia's greatest catastrophe, but a peculiar organization in the east seized the opportunity for an unearned windfall, and its leader Carmelo Ortiz Taborga stepped into the ring.`n`nA faction within this organization known as the Separatists — men and women mired in the quagmire of the Asunción Chaco War, having shed blood for what their Integrationist peers called a sane war. That said, both factions exhibited strong racist tendencies and contempt for the western highland population, even its white minority, craving autonomy. The main disagreement between the two lay in whether this eastern region known as Santa Cruz and its white population should actually take power or leave everything to one side. As Paraguay won a great victory and entered the city of Santa Cruz, the Separatists gained strong propaganda support and successfully took control of civil administration in the occupied zone.`n`nTaborga had been a merchant and telegraph operator; he was also the first to request independence aid from Paraguay. Bolivia repeatedly tried to retake the city, only to fail again and again. His legitimacy among the Santa Cruz elite grew, and people on both sides of the ceasefire line viewed him very differently. Moreover, the civil administration in the occupied zone was composed of Taborga's early supporters, mainly surviving Eastern Socialist Party members and a new generation bound to the depoliticized pro-Santa Cruz committee leadership. Though they encompassed all political opinions here, the latter two groups included many who were not entirely convinced by independence — after all, Santa Cruz's guarantee of independence was firmly tied to Paraguay's military fortunes, and who could guarantee that Paraguay would never lose?"

 STC_the_reign_of_terror: "Reign of Terror"
 STC_the_reign_of_terror_desc: "The wealth of Santa Cruz is built on bloody capital, piled up by Morón's butchers. Residents who did not immediately become sacrifices of the Revolutionary Nationalist Movement's tyranny often faced even more terrible fates — many had their homes ransacked in broad daylight by frenzied neighbors, who soon followed in the plunderers' footsteps. The few who held to morality and refused to loot often ended up dead in the alleys from arrogance. The path of redemption was already closed; only death could wash away the sins of the living."
 STC_revolutionary_army: "Revolutionary Army"
 STC_revolutionary_army_desc: "A loyal army is not the same as a capable one; the two often go together but are not causally linked. Today, the Santa Cruz army obeys Sandoval Morón's every word, and occasional disobedience is liable to bring sudden disaster. Tragically, these troublemakers are mostly battle-hardened veterans. Though Morón's loyalists and old guard are equally brave, the collapse of the command structure has greatly reduced the legion's effectiveness."

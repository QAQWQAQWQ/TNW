 EGY_farouks_hedonism_desc:0 "Our king, Farouk I, is world-famous for his extravagance and prodigality. Claiming to eat six hundred oysters a week, he is more a spoiled rich kid than a king. This not only makes the people discontented with their monarch but also leaves the national treasury far from "full.""

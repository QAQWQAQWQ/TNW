 KAZ_Dinmukhamed_Kunaev: "Dinmukhamed Kunaev"
 POLITICS_DINMUKHAMED_KUNAEV_DESC: "Dinmukhamed Kunaev inherited not only the post of First Secretary of the Communist Party of Kazakhstan, but also a miracle. Secretary Shayakhmetov's decade leading Kazakhstan had been anything but ordinary; through two disasters, Kazakhstan seemed as though it should have perished. Shayakhmetov was gravely ill, and the burden of lifting isolated Kazakhstan to the next level in the coming decade fell to Kunaev. Kunaev believed he was ready for the challenge.\n\nYet though Kazakhstan endured, the wounds of the past had not healed, and new ones kept appearing. Years of neglect and destruction had left the Kazakh people barely a majority in their own homeland. In the north, endless waves of refugees and bandits poured down, tilting the scales further. Even now, the legacies of Stalin and Bukharin refused to die. Should Kazakhstan dare to stray from their path, their forces would intervene.\n\nSo far, Kunaev had fared well on his own path - Kazakhstan was indeed gradually moving away from the former secretary's course. Kunaev had consistently supported Kazakh industry and culture, placing Kazakh citizens above Russian exiles and going beyond Shayakhmetov in promoting local industry.\n\nYet opponents of this line were legion. From Fitin to Yusupov, and even Shayakhmetov himself, they were among the dissenters. Many feared Kunaev's approach, believing that breaking the balance between Russians and Kazakhs would surely bring catastrophe. Kunaev believed that a decade hence, Kazakhstan would be stronger and more independent than ever. Perhaps the world would not agree."
 POLITICS_ISMAIL_YUSUPOV_DESC: "As Kazakhstan's ethnic divisions and instability deepened, Ismail Yusupov came to be defined more by what he was not than by what he was. He was a Uyghur, a war hero, and a seasoned bureaucrat - but crucially, he was neither Kazakh nor Russian.\n\nAfter years as Karaganda regional party secretary, few expected Yusupov to rise to power with Kunaev's downfall. Yusupov was a conspirator of middling status, hoping for a more important post, but nothing more. Yet when neither Fitin nor Shayakhmetov could take the First Secretary's chair, they sought a compromise figure without too many power resources. Who they chose speaks for itself.\n\nThis promotion was no clean victory. Yusupov had many powerful 'allies' whose interests he must protect. But if Yusupov truly wanted to survive, he had to solve a larger problem: the independence question could no longer be ignored, and the conflict between the two nations over its outcome grew more open by the day. He must choose, but whatever the choice, the country could not escape destruction.\n\nSo Yusupov had no choice. His plan aimed to bring the two nations together through industrial and agricultural development projects, regardless of the chauvinistic demands of his patrons. If the 'Virgin Lands Campaign' succeeded, he might end the crisis without firing a shot. But if it failed, contradictions and conflicts would only intensify, and Yusupov, Kazakhs, Russians, and everyone else would not escape unscathed."
 KAZ_Pavel_Fitin: "Pavel Fitin"
 POLITICS_PAVEL_FITIN_DESC: "Throughout his distinguished career in Kazakhstan, Fitin had always regarded this land not merely as a state, but as a fortress. The Soviet Union had crumbled and been reviled on Russian soil, but survived in Kazakhstan as an unbreakable bond between peoples. When Kunaev tried to break that bond, Fitin did what he had to do.\n\nSoon, Pavel Fitin symbolically elevated some Kazakhs to senior posts and tried to reassure the public that stability and security would soon return to the Kazakh SSR. For Russians and other exiles, this was a cause for celebration, meaning the glorious Soviet Union might soon return.\n\nBut he had realized his calculations contained subtle errors. Kazakhs were not excited by this prospect; they took to the streets, enraged that their representatives had been exiled or disappeared. As he tried to understand this anger, a voice from behind told him that his Russian allies were pleased to see a world ruled by them.\n\nPavel Fitin was a Russian. That unchangeable bloodline brought him endless frustration, meaning a stark contradiction between his Soviet ideals and political reality. Yet this was also the truth of his government, its plans, its leadership, and its rhetoric. The Kazakhs and Russians around him asked the same question: 'Who will break first?'"
 KAZ_Stanislaw_Skrzeszewski: "Stanisław Skrzeszewski"
 POLITICS_STANISLAW_SKRZESZEWSKI_DESC: "In 1939, Stanisław Skrzeszewski watched his homeland burn, tear apart, and rot in the flames of nationalism and mass extermination. He led a small cadre of communist loyalists and a large column of refugees out of eastern Poland, eventually arriving in Kazakhstan. As time passed, they lost all hope of returning home. Kazakhstan became their new home, the last refuge of the Polish people.\n\nNow, in the mid-1960s, their new home seemed on the brink of collapse, facing the same terrible fate.\n\nSkrzeszewski was never meant to be Kazakhstan's leader. He led an ethnic minority community and held an important economic post, but was no major political figure for the country. He was chosen merely because he was a minority, and Kazakhstan's tense ethnic situation left Kazakhs and Russians unable to reach consensus. His rise was merely an expedient; given time, Kazakhstan would surely crush him."
 KAZ_Zhumabek_Tashenev: "Zhumabek Tashenev"
 POLITICS_ZHUMABEK_TASHENEV_DESC: "Since Stalin's era, the Kazakh people had been moving step by step toward independence. A new generation of thinkers in Almaty and other great cities believed they were not continuing Soviet ideology, but a uniquely Kazakh thought, a set of values that allowed the Kazakh military to protect Central Asia when most of Russia fell into division and crisis. Zhumabek Tashenev was once merely one of many such thinkers; now he led the country.\n\nFrom publishing a series of works to later serving as Dinmukhamed Kunaev's deputy, Tashenev had consistently promoted a socialist vision for Kazakhstan largely free of Soviet influence, for the simple reason that the Soviet Union no longer existed. He believed that failing to restructure and redevelop the country was a concession to the Russians; as long as Kazakhstan remained dependent on Russian agricultural goods, Russians would continue treating it as their colony.\n\nAs the civil war intensified, he began to fear he was right."
 POLITICS_SAGADAT_NURMAGAMBETOV_DESC: "In hard times, a true patriot must always be ready to seize control by any means necessary. Sagadat Kozhametovich Nurmagambetov understood this, and he was fighting to defend the very concept of the Kazakh nation.\n\nNurmagambetov had served with distinction in the Great Patriotic War, earning a reputation as a war hero among the Kazakh people. Even after his colleague Momyshuly was purged, Nurmagambetov continued to serve honorably in the military, proving himself once more during the West Russian War.\n\nAn admirer of Kunaev and his nationalist rhetoric, Nurmagambetov became one of the most powerful representatives of the Kazakh armed forces in government. This made him a thorn in Fitin's side after the Soviet faction took power, and led to his military career gradually coming to an end as Fitin purged all potential enemies.\n\nNurmagambetov feared a future where Kazakhstan became a Russian vassal once more; rebellion was the only way to prevent it. Now, he led his band of patriots fighting for independence, for the ship of Kazakhstan to slip the anchor of Russia."
 KAZ_the_gates_of_hell: "Gates of Hell"
 KAZ_the_gates_of_hell_desc: "Kazakhstan may still be stable, but the Russian order has long since collapsed. As violence flared across the northern borderlands, the frontier became porous and fragile, and refugees easily bypassed outposts and patrols. In many northern regions, desperate Russians had become the local majority, hungry for more resources, while Kazakhs were unwilling to hand over their wealth.\n\nThe border was a fragile political mine, waiting for the right moment to detonate. One day, Kazakhstan would either open its doors to the Russians or close them forever. Whichever choice was made would have enormous consequences for both nations for decades to come."
 KAZ_red_kenesary_watches: "The Red Kenesary Watches"
 KAZ_red_kenesary_watches_desc: "If anyone defined Kazakhstan today, it was Zhumabay Shayakhmetov. To some, he was a tyrant, notorious for his authoritarian tendencies and ties to the NKVD. Yet to most Kazakhs, he was a modern Kenesary - the protector of the Kazakh people, a heroic fighter for independence, who not only prevented Kazakhstan from falling into Nazi hands but built it into a modern state.\n\nNow, Shayakhmetov had retired, handing control of the country to Kunaev, his loyal student. But make no mistake: Shayakhmetov was as beloved in retirement as in power. Whenever he spoke, the entire party followed his teachings."
 KAZ_spymasters_legion: "Legion of Spymasters"
 KAZ_spymasters_legion_desc: "Whenever you walked into any communist activity room or Russian party apparatchik's office, you might see a gift Pavel Fitin had sent them. As head of the NKVD in Kazakhstan, he had actively promoted Kazakhstan's investment in the wider world, though this also drew unwanted attention to his country. His NKVD division operated like a state within a state, its tendrils reaching across the entire country, closely watching the precarious alliance.\n\nFor now, the arrangement was mutual; as long as the party helped him, he helped the party. Yet since Shayakhmetov's downfall, relations had grown tense. If the thread snapped, no one knew what would happen."
 KAZ_the_kazakh_identity_reforged: "Kazakh Identity, Reforged"
 KAZ_the_kazakh_identity_reforged_desc: "On cool evenings in Almaty, residents gathered on the town square, sharing stories and singing folk songs. Children ran through the streets, mimicking Koblandy and Tengri in their games, laughter echoing through the air. In bustling camps across the vast steppe, soldiers laughed, their chests swelling with pride. After centuries of Russian rule, Kazakhstan had perhaps finally won its freedom, and they were willing to sacrifice their lives to see it come true."
 KAZ_almaty_in_our_hands: "Almaty in Our Hands"
 KAZ_almaty_in_our_hands_desc: "Almaty had a fairly diverse population, nearly half Kazakh and half Russian. At first, people feared this would lead to Fifth Column-style traitors in the city. Fortunately, loyal Kazakhs who formed an overwhelming majority in the surrounding rural hinterland helped their brethren swiftly crush all resistance. Now, this Kazakh metropolis, its industrial and economic power fully unleashed, might turn its strength toward liberating other sister states."
 KAZ_the_momyshuly_doctrine: "The Momyshuly Doctrine"
 KAZ_the_momyshuly_doctrine_desc: "Under Momyshuly's oversight, the Kazakh armed forces had trained endlessly according to Soviet-style static deep defense doctrine, preparing for a German invasion that would never come. This rigid approach might leave the Kazakh army caught off guard by the more mobile Russian forces, and they could only hope that the general staff's professionalism and discipline would compensate for the disadvantage."
 KAZ_the_ship_survives_without_a_captain: "Ship Survives Without a Captain"
 KAZ_not_divided_but_torn: "Not Divided, but Torn"
 KAZ_orda_without_alash: "Orda Without Alash"
 KAZ_the_ship_survives_without_a_captain_desc: "Though Kunaev was gone, the First Secretary's legacy endured in the powerful central government he had led. Now that reactionaries and chauvinists in the militias had shown their true colors, the government was more united than ever, and the petty disputes of the past were set aside. As for the rampaging bandits who defied them, they were still at each other's throats. The First Secretary's legacy would continue to shine."
 KAZ_not_divided_but_torn_desc: "Whatever form of bureaucracy existed, it had reached its limits. Departments competed for jurisdiction, project funds appeared and vanished in the blink of an eye, and commissars wavered over which government they owed loyalty to. Even keeping departments functioning on the surface had become a distant ideal, not a firm reality."
 KAZ_orda_without_alash_desc: "Sagadat Nurmagambetov commanded an army without a state or government. His followers were not professors, farmers, or politicians, but fighters for a just cause. Yet a just cause could not replace a functioning administration. As his army occupied more and more land, Nurmagambetov would learn this lesson the hard way."

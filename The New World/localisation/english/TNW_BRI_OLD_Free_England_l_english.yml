 POLITICS_WILLIAM_ALEXANDER_DESC:0 "§wBorn:§! June 10, 1910. Ringwood, Hampshire, England.\n\n§wCareer:§! William 'Bill' Alexander was born to a carpenter's family, with seven sisters. He graduated from Reading University with a chemistry degree and was initially a civilian industrial chemist. Out of deep communist conviction and visceral hatred of fascism, he took to the streets several times, most famously at the 1936 Battle of Cable Street. In 1937, outraged by the British government's helplessness against Franco in Spain, he joined the British International Brigades out of conviction and went to war against Franco. In Spain, Alexander was assigned to an anti-tank unit and soon distinguished himself for bravery and discipline. In January 1938 he was promoted to captain, but was discharged wounded only a month later. When the great war broke out, he was recommended by the Duchess of Atholl to study at Sandhurst, graduating top of his class in 1940. He rose to captain in the British Army and served in reconnaissance in Africa and England. After the war, he was active in the Communist Party's underground, took part in the Third Battle of Cable Street in 1953, and after the failed uprising miraculously escaped the authorities' brutal crackdown on the British Communist Party, fleeing to Russia. Having witnessed the rise and fall of the West Russian Revolutionary Front, he became all the more convinced that revolution in Britain required a broad anti-fascist united front. Thus, faced with various political groups, he made political concessions for cooperation, including the Left Resistance formed with Labour and Trotskyists in 1958, and cooperation with Claude Auchinleck's English Resistance in 1960.\n\n§wKey:§! Alexander's influence within the Left Resistance far exceeds Auchinleck's, and he is regarded as the rebels' number two."
 POLITICS_CYRIL_LLOYD_DESC:0 "Born: April 14, 1906, England. Career: Educated at Brighton and Cambridge, Lloyd was commissioned into the Royal Artillery in 1929. In 1935 he rose to captain in the Territorial Army and studied at the Camberley Staff College. He joined the BEF in the early war and served as acting major in the 12th Infantry Division (Eastern). In June 1940 he was evacuated from Cherbourg and became a deputy director at the War Office. When the Germans landed in Britain, he was reluctantly placed in a combat command with an acting colonel's rank. When news of Britain's surrender came, Lloyd refused to side with those who sacrificed freedom for survival and resigned his commission. He then made contact with the English Resistance and took part in the failed London Uprising of the fifties. Though Lloyd has no firm political beliefs, he deeply respects the Left Resistance, who stood together even when the odds seemed hopeless."
 POLITICS_David_Stirling_DESC:0 "§wBorn:§! November 15, 1915, Lecropt, Perthshire, United Kingdom.\n\n§wMilitary Career:§! Archibald David Stirling was born to a Scottish aristocratic family and dropped out of Trinity College after a year to focus on art. When war broke out, he abandoned his training for an Everest expedition and joined the Scots Guards in 1939. In 1940 Stirling volunteered for No. 8 Commando and was sent to the Mediterranean and North Africa. His experience of mechanized warfare gave him the idea of sending a small unit behind enemy lines to wreak havoc. Over the following months he refined the concept, then walked into British headquarters in Cairo and pitched it directly to high command. Middle East commander Claude Auchinleck deemed it worthwhile, and the army allowed Stirling to form his unit, named the 'Special Air Service.' Though after a disastrous first airborne operation the SAS abandoned parachute jumps, its raids behind German lines showed the British the possibility of heroes and offensive action - both of which were in short supply. When Britain surrendered, Stirling, many of his men, and other seasoned regulars broke from the army and reorganized the SAS into a resistance organization, swearing to kill every German and collaborator. Through a series of constant but low-key operations against the enemy - daring raids, ambushes, assassinations - the SAS soon became famous. These achievements owed to the SAS's rigorous training, the support of the British exile community in Scotland, and Stirling's own insight and drive. Despite this success, the SAS initially did not cooperate with other resistance groups, for Stirling thought the communists too far left and the younger HMMLR too enamored of the monarchy. In 1960, however, the alliance of the major resistance groups convinced Stirling that a general uprising would occur and that his paramilitary should join in. He led his men into HMMLR, only to discover to his surprise that the unit was led by his old commander.\n\n§wNote:§! Stirling is a militant, but also highly dedicated. He commands the best-trained, highest-morale rebel force in England."
 POLITICS_RICHARD_HULL_DESC:0 "Richard Hull was never a run-of-the-mill figure. As one of the most outstanding armored commanders of the early war, he won not only some creditable victories during the disastrous North African retreat but even briefly delayed the German advance on London during the invasion of Britain. As one of the officers who refused to obey General Montgomery's surrender order, he slipped away with what command he could salvage and was eventually defeated and captured by David Stirling's tough commandos. Now that Stirling leads Britain, he chose Hull - a countryman long since proven loyal and trustworthy. As his second-in-command, Hull will do his duty to the utmost."
 POLITICS_ORDE_WINGATE_HMMLR_DESC:0 "§wBorn:§! February 26, 1903, Nainital, United Provinces of Agra and Oudh, British India.\n\n§wMilitary Career:§! Orde Charles Wingate was born to a military family, graduating from Sandhurst in 1923 and commissioned into the Royal Artillery. In 1927 he was posted to the Sudan Defence Force, learned Arabic, and led several desert expeditions. Returning to Britain in 1933, he retrained the Royal Artillery in mechanization. In 1936 he was sent to Palestine as an intelligence officer, where he came under the influence of Zionism. His Special Night Squads proved highly effective against Arab rebels, earning him the Distinguished Service Order, though his collective punishment policy caused considerable controversy. Though he was popular among Jews, high command recalled him in 1939, deeming him too involved in the Zionist movement. When the Second World War began he was sent again to the Middle East to organize a local raiding force behind Italian lines in Abyssinia, with considerable success. He then clashed with his superiors over treatment, leading to depression and a suicide attempt. In 1942 he was posted to the Far East, beginning work on long-range penetration groups in the Burmese jungle, attacking the Japanese in the most unexpected places. These became the famous 'Chindits,' operating from fortified points deep in enemy territory, supplied by air and radio. Though their tactical and strategic utility was much questioned, they were highly regarded in London. Eventually Wingate and many of his men were captured and spent years in Japanese POW camps. The Kingdom of England ultimately secured his release, and he returned to active service in 1955.\n\n§wNote:§! Wingate is a firm proponent of small-unit raiding, has a hard-charging mentality, and often clashes with colleagues and superiors."
 POLITICS_PETER_KERRIGAN_DESC:0 "Born: June 26, 1899, Glasgow, England. Career: Peter Kerrigan was born in Glasgow. He began as a railway apprentice, joining the Royal Scots in 1918 and serving two years. Kerrigan joined the Communist Party of Great Britain in 1921 and made his name during the 1926 General Strike. In 1927 he was elected a senior official on the CPGB Central Committee and became the party's Comintern delegate in 1935. When the Spanish Civil War broke out, Kerrigan volunteered for the International Brigades, serving as political commissar for the English-speaking units. After the fall of the Spanish Republic he served as the CPGB's liaison from 1939 until the party was banned. Kerrigan took part in the ill-fated London Uprising and was one of the few rebels to escape the government's brutal manhunt. When International Brigades veteran Bill Alexander merged the Left Resistance with the English Resistance, Peter extended goodwill to non-leftist resistance fighters. Yet his heart was always with Bill and the remnants of the Left Resistance."
 POLITICS_FRED_COPEMAN_DESC:0 "Born: 1907, Suffolk, England. Career: Fred Copeman devoted his life to class struggle and workers' liberation. Born in a union workhouse, raised amid family hardship, he was sent to Watts Naval School at age 12. Just two years later he enlisted in the Royal Navy. Stationed in Malta, he witnessed the wretched conditions of the Maltese people, and the cruelty of life shook his beliefs. In 1931 he took part in the Invergordon Mutiny against the government's drastic pay cuts for sailors, further shaking his faith. He was on the strike committee of HMS Norfolk. Though the strike ended peacefully, Copeman and many other agitators were discharged, some dismissed with only 12 shillings and a train ticket. After this decisive event, Copeman joined the unemployed workers' movement and was imprisoned repeatedly for organizing marches and demonstrations. Like many British socialist comrades, Copeman volunteered for the International Brigades in the Spanish Civil War. Though wounded after months of service, he recovered and was promoted to battalion commander of the British Battalion in 1937. Like many veterans, Copeman lost some faith in communism; as a member of the CPGB Executive he made a disastrous visit to the Soviet Union, after which he left the party for good. When the Nazis bombed Britain, Copeman played a vital role in home defense, running an air-raid shelter in the London Underground and saving many lives. Now Copeman is an elite of the Left Resistance within the English Resistance. Though he holds to his traditional communist beliefs, his ties with Harold Wilson have grown closer - perhaps because Copeman resents the hardliners in the organization, the very people who once nearly threw him out."
 POLITICS_JAMES_KLUGMANN_DESC:0 "Born: February 27, 1912, London, England. James Klugmann sympathized with communism from childhood. Visitors to the Klugmann home recalled that, with his father a tobacco merchant, the family oozed bourgeoisie from every pore. Despite his upbringing, Klugmann did not follow his father into business; he was educated at Trinity College, Cambridge, hoping for an academic career. Yet after joining the CPGB in 1933, Klugmann abandoned academia for the communist cause. He traveled the world, making friends and building anti-fascist popular fronts. His activities drew the attention of MI5, though it could find no solid evidence of crime. Meanwhile, Klugmann played a key role in recruiting Soviet spy networks such as the Cambridge Five. On Klugmann, London NKVD personnel chief Arnold Deutsch said: 'He devoted himself entirely to party work, very careful and diligent; everyone who knew him rated his steady, reliable character highly.' In 1940 Klugmann joined the logistics corps, and thanks to his language skills was transferred to SOE's Yugoslav section, where he also persuaded the British government to support Tito's communists rather than the Serbian royalists. Though he and the Yugoslav partisans successfully tied down several Wehrmacht divisions, the tide had turned; when he learned of Britain's surrender, he slipped away. Years later Klugmann reappeared in Britain and made contact with the Left Resistance, to the surprise of Bill Alexander and many others who thought he had died in Yugoslavia. James Klugmann, whose name was feared by all traitors on the Yugoslav front, is respected within the Left Resistance, second only to Bill himself."
 WORLD.60000.t:0 "[Get_newspaper_header] The Resistance Wins the English Civil War!"
 WORLD.60000.desc:0 "His Majesty's Most Loyal Resistance has announced the successful defeat of Sir Alec Douglas-Home's collaborationist government and the British garrison in Cornwall. The Free English government, led by Claude Auchinleck, has swept across the Kingdom, victory after victory, and now it will restore the democracy brutally stripped away by the Germans decades ago.\n\nRumor has it that the Resistance is backed by the Organization of Free Nations - an undeniable defeat for German interests in Northern Europe. Whether the loose coalition of revolutionaries that makes up the Resistance can work together in peacetime remains to be seen."
 WORLD.60000.a:0 "The night ends, and the light of freedom shines all the brighter."

 FEN_Reg_Birch:0 "Reg Birch"
 FEN_Reg_Birch_eco_desc:0 "§YChancellor of the Exchequer\n$communist_bolshevism_subtype$§!\n--------------\n§LWithin Wilson's government, there are two main political factions. One is loyal to Wilson himself, the other to the ideals of the martyred communist Harry Pollitt. As one of the few surviving leaders after the Battle of Cable Street, Reg Birch leads these dedicated communist hardliners. Birch and the Pollittists broadly support the current government in advancing its policies, but they also believe it falls far short of their ideals. What they so carefully conceal should sharply worsen the situation in Britain.§!"
 FEN_Heinrich_HMMLR:0 "Heinrich HMMLR"
 FEN_YDL_Government:0 "New Democratic Law Government"
 FEN_David_Eccles:0 "David Eccles"
 FEN_David_Eccles_hog_desc:0 "§YDeputy Prime Minister\nConservatism§!\n--------------\n§LMr. Eccles's political career suffered a major upheaval shortly after he was elected MP: the Nazis came. For years he served as an anonymous backbencher in the collaborationist government, while passing intelligence to the English Resistance - a source as valuable as Kim Philby. Like Philby, his contributions earned him senior posts in the postwar government. As a close ally of Jellicoe and his democrats, he works to maintain the status quo in Britain, accepting only the most necessary reforms.§!"
 FEN_Shirley_Williams:0 "Shirley Williams"
 FEN_Shirley_Williams_eco_desc:0 "§YChancellor of the Exchequer\nLiberalism§!"
 FEN_Norman_St_John_Stevas:0 "Norman St John-Stevas"
 FEN_Norman_St_John_Stevas_for_desc:0 "§YForeign Secretary\nLiberalism§!"
 FEN_Enoch_Powell:0 "Enoch Powell"
 FEN_Pauline_Gower:0 "Pauline Gower"
 FEN_Pauline_Gower_hog_desc:0 "§YDeputy Prime Minister\nNational Conservatism§!\n--------------\n§LIf David Stirling is the king of the veterans' movement, then Pauline Gower, his close associate, is unquestionably its vizier. When Stirling finally ascended, he naturally did not forget Gower. But who exactly is Pauline Gower?\n\nBorn in 1910, Gower was fascinated by flying from childhood and became famous during the Second World War, leading the newly formed Women's Auxiliary Air Transport. When the British Isles fell to the Nazis, she joined the English Resistance and built close friendships with like-minded figures such as David Stirling and Arthur Harris. Now, with her own people in supreme power, Pauline Gower's future looks bright, for Britain will finally rise again.§!"
 FEN_John_Woodhouse:0 "John Woodhouse"
 FEN_John_Woodhouse_eco_desc:0 "§YChancellor of the Exchequer\nNational Conservatism§!\n--------------\n§LIf you ask someone with even a passing knowledge of the SAS to name some of its most distinguished figures, beyond David Stirling you might well hear another name: John Woodhouse. Born in 1922, the son of a Dorset Regiment colonel, he felt his military career was preordained. After enlisting in 1942, he remained loyal to Britain even as the Allies lost more and more ground in the war. Yet he could not bear to watch his country become a German vassal, so he soon joined the Resistance. There he rose quickly and was soon serving directly under Stirling himself.\n\nNow that the collaborators have been overthrown and the elections are over, Stirling sits secure in Downing Street. Woodhouse is no politician, but he could only answer his old friend's call and take the post of Chancellor. The nomination has shaken some in British politics and surprised many. But one thing is certain: John Woodhouse is here, and he intends to stay.§!"
 FEN_Arthur_Harris:0 "Arthur Harris"
 FEN_Arthur_Harris_for_desc:0 "§YForeign Secretary\nDespotism§!\n--------------\n§LWhere does one even begin with Arthur Harris?\n\nA veteran of both world wars, a celebrated air genius, a hero of the English Resistance: none of this fully captures him. After all, this Air Marshal wears many hats, most of them little known. He was one of Stirling's earliest collaborators and closest friends, and the key to air command during the civil war. Now that the guns are silent and the dust has settled, he stands once more among the Resistance's most popular idols.\n\nYet Stirling's rise has given Harris's life an unexpected twist, suddenly carrying him to a slightly safer but equally brutal battlefield: politics. As the government's Foreign Secretary, Harris will surely bring Britain back onto the world stage, and in the process distance it from the fascist shadow and secure a place in the sun.§!"
 FEN_Richard_Hull_sec_desc:0 "§YHome Secretary\nDespotism§!\n--------------\n§LIn Stirling's cabinet, many names stand out. But at least in recent memory, perhaps none stands out quite like Richard Hull. Like many of his colleagues in the veterans' movement, Hull is a career soldier who proved himself an effective general during the British Civil War and made his name in the Resistance. This is no surprise to those who know him, but the conflict was the decisive factor that brought him to the stage.\n\nHull already knew Stirling before the civil war; the latter kept the tradition of nominating most military men and named him Home Secretary, which is no great surprise. After all, without them, what would military support amount to?§!"
 FEN_Philip_Toynbee:0 "Philip Toynbee"
 FEN_Philip_Toynbee_hog_desc:0 "§YDeputy Prime Minister\n$communist_bolshevism_subtype$§!\n--------------\n§LWhen the Nazis invaded Britain, communists became their most urgent targets. As the German tide swept over the British Isles, many savvy communist supporters either fled or went underground. Philip Toynbee, a writer and newspaperman, was one of that small, dedicated band who went under. After meeting Reg Birch, the two built an odd friendship, even when most of the party was arrested at Cable Street. Now that communism has risen again, Toynbee finds himself the trusted deputy of the party secretary, though in practice he spends more time writing for the government.§!"
 FEN_Reg_Birch_hog_desc:0 "§YDeputy Prime Minister\n$communist_bolshevism_subtype$§!"

 POLITICS_AVRAHAM_STERN_DESC: "Ruthless doesn't even begin to describe Avraham Stern; dictator isn't sufficient; and saying he devoted his life to the ideal of a Jewish state would be the mildest way of putting it. Stern was born in Russia in 1907, and at age 18 (in 1925) he immigrated to British-occupied Palestine. He quickly joined the Haganah in 1929 and immediately became a radical, soon embracing the ideal of a Jewish state encompassing the entire Levant. Later he left the Haganah and joined the Irgun. When World War II broke out, he left the Irgun as well and began fighting alone for his beliefs. Thus, Fighters for the Freedom of Israel — Lehi — was born.\n\nStern came to believe that there truly was a chosen people, though his view differed from the Germans. No, the true masters of the world were the sons of Israel — the Jews. During the war, Stern sought to fight alongside Germany and Italy, and when no aid was forthcoming, he resolved to fight alone for Israel. His dream of an authoritarian, German-style Israel went unrealized, but he and his nameless soldiers would not stop fighting.\n\nFor twenty years, Stern and Lehi have stood together, Lehi members fighting, bleeding, and dying for the dream, their lives shrouded in the shadows of fear and death. Hundreds of men, women, and children perished in the fighting, but now none of that matters — Lehi's dream has come true.\n\nTo say that the future of the many peoples and faiths of the Levant is bleak would be the grossest understatement. Now, above the towns of Israel, above Tel Aviv and Jerusalem, countless flags have risen, each inscribed with Defense and Conquest."
 POLITICS_SHIMON_PERES_DESC: "If only one word could sum up Shimon Peres, it would be dutiful.`n`nPeres was born in the Polish Republic in 1923. By his account, thanks to the care of a local scholar, his family joined the Aliyah movement in 1934, and he plunged into the politics of the Yishuv in Mandatory Palestine. Hardworking from his youth, he devoted his life to politics and Zionism, becoming a key member of David Ben-Gurion's circle and inheriting many of the founding father's ideas. He performed his tasks admirably in kibbutzim and party meetings.`n`nAs a Labor Zionist, he was known for his sympathy toward and willingness to cooperate with local Arabs, making him certainly one of the few who would support a Levantine federation. In his words, this is the only way to maintain lasting peace in the Levant, occupied for decades, and the only solution to realize the dream of Jewish-Arab coexistence. Thus, though he was known as a tireless worker, his views made him deeply unpopular within the party. Were it not for his mentor seeking a young, promising leader dedicated to Zionism and willing to mediate and heal the Mapai's wounds and grievances, he would likely have held no real power. Peres has done everything within his ability in his duties. Even his detractors must admit he is a hard worker. Whether in internal Mapai meetings or in the protest marches erupting across Tel Aviv, he has been the very model of devotion.`n`nWith this support, Peres quickly outpaced his only rival — the hawkish Golda Meir — and, gazing at the stars, confidently waded through the minefield of Levantine politics toward a peaceful future. That said, much work remains to be done."
 POLITICS_GOLDA_MEIR_DESC: "One cannot erase historical relics just because they clash with the modern world. The Jews know this well. For thousands of years, the children of Canaan have suffered terribly, and the memories of fear and massacre are etched into their souls. No wonder that when the Jews finally gained their own nation-state, they embraced nationalism and militarism. Among the power contenders in the Knesset, no one embodies this emotion more than Golda Meir — Israel's Iron Lady.`n`nMeir was born in Kiev before the Russian Empire collapsed. One of her earliest memories was watching her father leave home by carriage never to return, taken by racial persecution; she also remembered five of her siblings dying of poverty. The hardships of her childhood before her family emigrated to America forged her character: even at a young age, she showed strong leadership and an interest in politics. At fourteen, Meir moved to Denver to live with her sister. There she first encountered Zionist thought, which marked the beginning of her political career as a Zionist. In 1921, Meir and her husband moved to the Levant and were elected secretary of the leading Jewish women's organization in the region. There she continued to fight for the political status of Levantine Jews while advancing the Zionist movement in America. Even when Italy replaced Britain as the ruling power in the Levant, the authorities could not break Meir: she led the Old Guard (Bitchonist), and was a leader of the Haganah; opposed to them were the New Guard (Bitzoist), composed of new settlers who sought cooperation with the Arabs.`n`nNow that Italy has lost control of the Levant and the Jews have reclaimed their ancestral homeland of two thousand years ago, Meir has become the leader of a newborn nation, bowing neither to the Arabs nor to imperialists. She firmly believes the State of Israel must fight for itself and become the dominant power in the Levant. Only when neighboring nations respect their military might will there be peace for the Yishuv. David Ben-Gurion will one day pass; perhaps after the old father is gone, the she-eagle will spread her wings."
 POLITICS_DAVID_BEN_GURION_DESC: "If one word could describe Jewish history, it would be sacrifice. Since the great diaspora, only countless sacrifices could preserve their identity, fathers protecting their children so they might continue to live. When the Jews finally established their own state, they turned to the father for guidance and shelter. Though David Ben-Gurion wants nothing more than rest, he will always place Israel before his own needs.`n`nBorn David Green in Russian Poland in 1886, Ben-Gurion had been passionate about Zionism since teaching Hebrew in Warsaw as a young man. His commitment to the cause was so firm that in 1906 he became one of the first Jews to immigrate to Palestine, with a clear purpose: to establish a Jewish homeland in the Holy Land. Yet he faced the distrust of the local people and the atrocities of the Ottoman army. With the outbreak of World War I, Ben-Gurion was exiled to Egypt, where he joined the British Army's Jewish Legion, formed to liberate Palestine from Ottoman rule and place it under British administration. But the struggle was not over, for Ben-Gurion soon realized the Jews needed self-defense, so he founded the Haganah, the Yishuv's main paramilitary organization. Yet when the Italians invaded Palestine and established their own colony, his pro-British leanings availed him little, marking a new phase in the Yishuv's struggle. Ben-Gurion chose not to resist openly; instead, he pressured the Italians to allow the Jews to form a state. This decision was deeply unpopular in the Yishuv and Haganah, but Ben-Gurion, now leading the organization, insisted on his course and achieved the impossible: establishing a state for the Yishuv, granted by those who had persecuted them only years before.`n`nNow Ben-Gurion stands at the summit, having finally achieved the goal he fought for so long — Zion is established. But he does not wish to retain power; rather, he believes the nation's future should rest with the young people who shed blood and tears to build the state, for perhaps they are the ones who truly seek peace. He does not know if he will live to see that day; he only knows how tired he is, how old. When will an old man finally rest?"

 POLITICS_MENACHEM_BEGIN_DESC: "Twenty years ago, the dream of a Jewish homeland seemed to many a distant, naive fantasy crushed under the jackboots of the Nazis — and now, the Jews have found it, that Zion stretching across the Mediterranean coast and beyond the Jordan, free from British, German, or Italian rule. It is all thanks to one man. Menachem Begin was born in Brest in the summer of 1913, and had fought for a homeland since childhood. Before being sent to Palestine in 1942, Begin joined the Revisionist Zionist organization Betar and was imprisoned for a time by the NKVD. As a student of Ze'ev Jabotinsky, the father of Revisionist Zionism, Begin naturally joined Jabotinsky's paramilitary organization, the Irgun. Begin firmly opposed cooperation with the British, and with the support of the extremist Revisionist group Lehi, he launched an armed revolt. This rebellion, combined with the Italian and German invasions, forced the British occupiers to withdraw from Palestine.`n`nBut when the Italians established a military governorate, Begin's dream of a free Israel shattered, and the Irgun resolved to fight the fascists as they had fought the British.`n`nFor years, Irgun members fought and bled for freedom, even assassinating the original governor Rodolfo Graziani and many other colonial occupiers — now, the time has finally come. Critics denounce Begin as an authoritarian and anti-democratic tyrant, but only Begin himself knows what plans he has for the Levant. A new day has dawned in the land of Israel, and Menachem Begin will lead the Jewish people into the future."

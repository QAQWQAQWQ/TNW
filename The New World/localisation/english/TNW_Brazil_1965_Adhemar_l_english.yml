 BRA_adhemaredna_impending_strife: "A Crisis in Leadership"
 BRA_adhemaredna_impending_strife_trigger: "§hAdhemar§! and §VEdna§! have §Yfound common ground§!."
 BRA_adhemaredna_impending_strife_fail_effect: "§VEdna§! will recklessly attack the government, causing a schism and spelling its §Yinevitable doom§!!"

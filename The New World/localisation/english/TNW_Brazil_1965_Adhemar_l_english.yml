 BRA_adhemaredna_bar_tooltip_adhemar_overwhelming: "§hPresident Adhemar's§! influence is currently §hoverwhelming§!!"
 BRA_adhemaredna_bar_tooltip_adhemar_dominant: "§hPresident Adhemar§! is currently dominant."
 BRA_adhemaredna_bar_tooltip_edna_dominant: "§VVice President Edna§! is currently dominant."

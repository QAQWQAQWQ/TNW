 BRA_adhemar_support_congressional: "Fund Congressional Campaigns"
 BRA_adhemar_support_congressional_desc: "Adhemar will use his personal wealth to fund congressional campaigns for the PSP, ensuring that the party has a strong presence in the next legislature."
 BRA_adhemar_cash_in_media: "Cash In with Media Connections"
 BRA_adhemar_cash_in_media_desc: "Adhemar will make sure that his friends in the media are well compensated for their support of his latest initiatives."
 BRA_adhemar_cash_in_supporters: "Siphon Funds from Supporters"
 BRA_adhemar_cash_in_supporters_desc: "Adhemar will invoke the envelope system, requesting that his supporters help top up the slush fund to ensure that he can continue to govern effectively."
 BRA_adhemar_make_headway_with_the_nikkei: "Bribe the Nikkei Community"
 BRA_adhemar_increase_personal_legacy: "Fund Legacy Programs"
 BRA_adhemar_increase_personal_legacy_desc: "Adhemar will utilise his personal wealth to build up his legacy, supporting charitable endevours and promoting advertisments to improve the public's view."

 BRA_adhemaredna_bar_tooltip_balanced: "Executive power is currently §Ycontested§!."
 BRA_adhemaredna_edna_influence: "§VEdna's§! Influence"
 BRA_adhemaredna_adhemar_influence: "§hAdhemar's§! Influence"
 BRA_adhemaredna_remove_edna_desc: "Edna's days are limited. For too long has she born a thorn in the side to the government, and now we have clear unrefutable evidence that she is a Judas and must be brought to immediate justice."
 BRA_adhemaredna_improve_relations: "[BRA_adhemaredna_improve_relations_dyn_title]"
 BRA_adhemaredna_improve_relations_desc: "[BRA_adhemaredna_improve_relations_dyn_desc]"
 BRA_adhemaredna_worsen_relations: "Reroute Cabinet Spending"
 BRA_adhemaredna_worsen_relations_desc: "Giving the cabinet too much control over their own finances is a mistake - too many opulent banquets and too much overpriced equipment. Adhemar will personally ensure it's used for better things - like lining his pockets."
 BRA_adhemaredna_improve_relations_3: "Host a Joint Press Conference"
 BRA_adhemaredna_improve_relations_3_desc: "The President and Vice President will host a joint press conference where they will outline their strategy to address Brazil's problems."
 BRA_adhemaredna_improve_relations_0: "Greet Foreign Dignitaries Together"
 BRA_adhemaredna_improve_relations_0_desc: "Adhemar and Edna will set aside time to speak with visiting foreign diplomats and to attend a banquet in their honor."
 BRA_adhemaredna_improve_relations_2: "Arrange a Cabinet Meeting"
 BRA_adhemaredna_improve_relations_2_desc: "The Presidential cabinet will meet to ensure implementation of the current agenda goes as planned."
 BRA_adhemaredna_improve_relations_1: "Deal with Governors' Complaints"
 BRA_adhemaredna_improve_relations_1_desc: "Adhemar and Edna will hear out governors, working in concert to placate their concerns."
 BRA_adhemaredna_increase_adhemar_influence: "[BRA_adhemaredna_increase_adhemar_influence_dyn_title]"
 BRA_adhemaredna_increase_adhemar_influence_desc: "[BRA_adhemaredna_increase_adhemar_influence_dyn_desc]"
 BRA_adhemaredna_increase_adhemar_influence_money: "Reward Civil Servants"
 BRA_adhemaredna_increase_adhemar_influence_money_desc: "Off-the-books bonuses will be given to civil servants who have been loyal to the President, ensuring their continued support for his agenda."
 BRA_adhemaredna_increase_adhemar_influence_0: "Bring in Paulista Politicians"
 BRA_adhemaredna_increase_adhemar_influence_0_desc: "Former Governor of São Paulo, Adhemar de Barros, has an extensive network of allies all across the city. Adhemar will bring in these political allies to his administration and shore up support for him."
 BRA_adhemaredna_increase_adhemar_influence_2: "Bribe Military Officals"
 BRA_adhemaredna_increase_adhemar_influence_2_desc: "President Adhemar will have his Chief of Staff, Laudo Natel, sit down with members of the military, offering favours and bribes for their continued support."
 BRA_adhemaredna_increase_adhemar_influence_3: "Coordinate with the PSP"
 BRA_adhemaredna_increase_adhemar_influence_3_desc: "While the PSP may not be the strongest party in Brazil, it's dominated by Adhemar and acts as his sword and shield. The President will strategize with party leaders to finalize the congressional agenda."
 BRA_adhemaredna_increase_adhemar_influence_1: "Prepare a Presidential Address"
 BRA_adhemaredna_increase_adhemar_influence_1_desc: "Adhemar will reinforce his position as figurehead of the Brazilian government through a public speech. Edna's presence will not be necessary."
 BRA_adhemaredna_increase_edna_influence: "[BRA_adhemaredna_increase_edna_influence_dyn_title]"
 BRA_adhemaredna_increase_edna_influence_desc: "[BRA_adhemaredna_increase_edna_influence_dyn_desc]"
 BRA_adhemaredna_increase_edna_influence_2: "Court the Opposition"
 BRA_adhemaredna_increase_edna_influence_2_desc: "Vice President Edna will hear out the administration's detractors in the PSD and PTB and PSP, reminding them that Adhemar must be fought against."
 BRA_adhemaredna_increase_edna_influence_3: "Enlist the Cabinet"
 BRA_adhemaredna_increase_edna_influence_3_desc: "Bureaucracy is one of the biggest obstacles to solving Brazil's problems. Edna will attempt to persuade and negotiate with members of the cabinet to side with her against Adhemar in meetings."
 BRA_adhemaredna_increase_edna_influence_1: "Promote Clean Government"
 BRA_adhemaredna_increase_edna_influence_1_desc: "Corruption is the greatest weakness and largest target that can be used against Adhemar. Edna will hold speeches and rallies calling for a end to corruption in Brazil."
 BRA_adhemaredna_increase_edna_influence_0: "Secure Union Backing"
 BRA_adhemaredna_increase_edna_influence_0_desc: "Trade Unions have been longtime supporters of the PTB, so the Vice President will meet with Union leaders to hear out their concerns and undermine Adhemar."

 POLITICS_ANTONIO_DE_OLIVEIRA_SALAZAR_WARS_DESC:0 "It would be quite unfair to dismiss António de Oliveira Salazar, who has ruled Portugal since 1932, as nothing more than a meddlesome bureaucrat. Salazar seized power in his homeland on his own, a few years before Franco controlled Spain. But under pressure from the German invasion of Angola and Mozambique, he ultimately decided to accept a deal with the devil. When Franco approached Salazar and proposed transforming their defensive treaty into a single nation, Salazar agreed with reservations to merge Portugal with fellow right-wing Spain. The Iberian Union was proclaimed, and the former two nations would stand united and side by side… at least in theory.

However, reality fell far short of the ideal. Salazar cared little for the well-being of the Iberian Union and everything for Portugal's own benefit. On one hand, Salazar wanted to protect Portugal from any harm or trouble; on the other, he was almost pathologically obsessed with vetoing any proposal that sought to consolidate the federation, quickly earning a reputation in the commission as a notorious obstructionist. His paranoia about "Spanish oppression of Portugal" led to multiple confrontations with Franco himself, who saw him as one of many factors that could lead to the breakup of Iberia. Franco had attempted to push through the Law of Succession, which would mean that after the two caudillos died, the monarchy would be restored and Portugal would be absorbed into Spain — this deepened the rift between the two nations. Salazar, for his part, purged a group of Falangist "old shirt" members who had attempted a coup against the Union.

Yet it was not Salazar's obstructionism that caused the Union to collapse. The blame for that rests entirely with Franco, who failed to handle the Basque rebellion effectively. Shortly after, Salazar fled Madrid for Lisbon and declared Portugal's independence from the war-torn, fractured Iberian Union."
 POLITICS_ANTONIO_DE_OLIVEIRA_SALAZAR_DIVORCE_DESC:0 "It would be quite unfair to dismiss António de Oliveira Salazar, who has ruled Portugal since 1932, as nothing more than a meddlesome bureaucrat. Salazar seized power in his homeland on his own, a few years before Franco controlled Spain. But under pressure from the German invasion of Angola and Mozambique, he ultimately decided to accept a deal with the devil. When Franco approached Salazar and proposed transforming their defensive treaty into a single nation, Salazar agreed with reservations to merge Portugal with fellow right-wing Spain.

However, dreams always differ from reality. Internal strife with his fellow caudillo, domestic turmoil, the fatigue and pressure of age — the Union had a thousand reasons to split, but in the end, none of those reasons mattered. Now, he stands in his manor, overseeing the reconstruction of Portugal — a nation alone once again in a rapidly changing world.

Of one thing he is certain: he will not live to see the end of this decade."

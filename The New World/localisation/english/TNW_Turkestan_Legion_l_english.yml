 UTL_Veli_Rides_Again: "Veli Kayum Rides Again!"
 UTL_Veli_Rides_Again_desc: "Veli Kayum is a man of pleasure; he wanted the best life has to offer, readily accepting all the perks of corruption — from endless money to countless favors, he wanted it all. Now, he seems to have realized what he truly wants most in life. Corruption and extravagance were a mistake; what he really craves is achievement, earned through struggle, making sure no one dares dream of freedom — though no one dares oppose him anyway.`n`nFate has given Kayum a chance to experience how a warrior's life should be lived, and he is well pleased with what fate has given him. Now he must shoulder the mission of leading the Legion, fulfilling his duty to Turkestan."
 UTL_Black_Dogs: "Black Dogs"
 UTL_Black_Dogs_desc: "The Legion has become a pack of dogs — betrayed, stabbed in the back, cast aside to fend for itself. Former allies have kicked it aside, letting it foam at the mouth.`n`nNow, foreign powers have contacted the Legion, seeking its help, asking it to fight for their ideas. What answer can the Legion give but No? The Legion now holds what some call the strategic key to Central Asia, the so-called Gate of Central Asia. The Legion cares nothing for that; today it only wants to tear apart those who would bring it into their sphere of influence. The Legion has made its resolve: from this day forward, it will bar all foreign influence. The Legion will never fight for anyone else."
 UTL_Veli_Kayum_Khan: "Veli Kayum Khan"
 POLITICS_VELI_KAYUM_KHAN_DESC: "Veli Kayum Khan toyed with anti-communist and nationalist ideas as the Soviet Union he despised rose. He moved to Germany to study, choosing never to return to the USSR. Through his pan-Turkic and anti-Soviet statements and views, he rose to prominence in the Turkic emigre movement. When war broke out in Europe, he chose to help the Nazis, who shared much of his ideology. To this end, he became one of the founders of the Turkestan Legion — an army of Turkestani collaborators and prisoners of war. Though the Nazis considered them an inferior race, this attitude soon changed, as the Nazis hoped to exploit the anti-Soviet sentiments of the Central Asian Turkic peoples during Operation Barbarossa. The Legion played a secondary role in the rapid conquest of Bukharin's Soviet Union.`n`nWith the end of the war, the state that had long oppressed Kayum Khan's people collapsed entirely, and Uzbekistan finally had a chance at freedom. The attempt to secure independence ultimately failed, and only years later did he get another chance. With the right timing and Afghan support, the Legion reaped rich rewards. Kayum advocates pan-Turanism; his ultimate goal is to unify all the peoples of Central Asia. The first step in this process, of course, is to defeat all who would stand in his way, no matter who the enemy may be.`n`nKayum rules with an iron fist, yet he still faces powerful opposition. Many are not loyal to his fascist government, and some even sympathize with Fayzulla. If Kayum wants to become the leader of Turkestan, he must first consolidate his power in this unstable little state. Then he must make all of Central Asia revere him and trust in his pan-Turkic ideas."
 POLITICS_BAYMIRZA_HAYIT_DESC: "Twenty years ago, the most powerful Turkic fighting force in modern world history gathered and marched against its enemies. For twenty years, its incompetent leadership squandered the blood and lives of brave soldiers.`n`nBaymirza Hayit was born in 1917 in Yar-Gorgan, a small village in present-day Uzbekistan. From childhood, Baymirza showed great interest in literature and religious matters, an interest interrupted only by the outbreak of war in 1939, when he graduated from Tashkent University and was conscripted. For two years, Hayit served the Soviet Union, fighting the Germans, until he was captured in 1941. Yet it was not the Red Army that determined the rest of his life, but the Legion formed from German Turkic prisoners of war — the Turkestan Legion.`n`nThough World War II has ended, the Turkestan Legion's mission is not yet complete. Under Veli Kayum, they returned to their homeland, but incompetence and greed left the Legion controlling only a small part of the country. Despite all their sacrifices, the Legion's destiny remains unfulfilled. Veli Kayum trumpeted his new plans, but the Great Ergenekon he had hoped to build fell apart like his other half-baked schemes. Now it is Baymirza's turn to pick up the pieces; the great and glorious Turkic destiny is about to unfold, and the project of unification is now in the hands of a passionate, determined, and above all, capable man. The path forward is clear; all that is needed now is the strength to see it through."
 POLITICS_SHER_MUHAMMAD_DESC: "Sher Muhammad-bek Ghazi has a stern face, dark glasses, and an imposing bearing. Few would have expected a mercenary to seize control of the Turkestan Legion. Yet since his escape from a Russian prison as a boy, he has surprised many who underestimated him.`n`nMuhammad-bek played a key role in the Fergana uprising before joining the guerrilla war against the Soviet Union. He built an extensive network along the Afghan-Soviet border and sold information to Turkey, Japan, and Germany. This network was later used by the Germans to help restore the former Emir of Bukhara to his throne.`n`nAfter the Nazi victory, Muhammad-bek took up the mercenary life, earning the nickname the Blind. Yet he realized that what he truly sought was not wealth, but power. This desire led him to join the Turkestan Legion, and when the time was right, he seized power.`n`nNo one can say for certain whether luck, foreign influence, or his own scheming led to his rise — but it does not matter. With the Legion under his control, few obstacles stand between him and the final battle that will decide the fate of Central Asia."

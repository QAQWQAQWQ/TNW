 USA_wal64_gauge_indian_interests:0 "Gauge Indian Interests"
 USA_wal64_gauge_indian_interests_desc:0 "Across the Pacific, within the foreign lands sprawling across Asian lands, lies a powerful force to contend against the Japanese Empire's coercians: India. The Indian people of the subcontinent have managed to survive against the prowling of imperial predators for centuries, and now, they are forced to protect themselves against the Empire's growing sphere of influence. In this, they have strived to protect their interests in an individual standoff; however, we know better. We know that the fight against the Japanese does not require a single fiery will for change, but a group's collective fury in destroying the gross force in the world, not from theories and estimates, but from American blood. Now, although we may seem foreign, or even alien towards the Indian government, we must extend our hand through ambassadors to discuss the joining of the Pacific Trading Zone, to fight against the Japanese Empire not one on one, but as brothers in arms."

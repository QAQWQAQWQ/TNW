 USA_wal64_the_indian_market:0 "@@TODO_44740@@"
 USA_wal64_the_indian_market_desc:0 "Sitting right outside the Sphere's outer limits is the Republic of India. Despite being blessed with the world's most fertile farmland, millions of square miles of mineral deposits, and the second largest population on Earth, the newly-independent nation still remains a dysfunctional state years after having broken free from the hold of the Raj. Nevertheless, India still has plenty of untapped potential -- potential which, in smart hands, can be harnessed into a very tidy profit.\n\nThis is where we come into the picture. Several Indian magnates and business leaders had attended the Perth Conference as self-proclaimed observers \"acting upon Delhi's behest\". At length they spoke of the need for the Republic of Indian to formally join the CPFTCA -- God, that's a handful -- and how both we and they can benefit from the arrangement. Far be it from any good American businessman to decline free money, so we sent them away with a promise to \"take their words under advisement\", a wink, and a nudge.\n\nAfter a few dinners and dealings with our congressmen, they..."
 USA_wal64_breach_the_market:0 "@@TODO_44741@@"
 USA_wal64_breach_the_market_desc:0 "...are fully on board with letting the Republic of India join the organization. It didn't take much to convince them; in fact, we may have gone overboard with the graphs and charts the interns had prepared days before. All they really asked for was how much money the companies putting jobs into their districts and \"donations\" into their campaign funds would make out of it. You can understand why it looked as if dollar signs popped out of their eyeballs when we multiplied the price of a can of Spam by five hundred million.\n\nNow that we've taken care of things on our end, it's time to send Delhi the good news. Soon they'll be card-carrying members of the largest trade zone in the world -- and soon we'll get an extra half-billion loyal customers to profit from. Score another point for American business, baby!"
 USA_wal64_quota_agreements:0 "@@TODO_44742@@"
 USA_wal64_quota_agreements_desc:0 "...are fully on board with letting the Republic of India join the organization -- under one condition: We'll have to ensure that our dealings with them are as fair as they can get. That means letting them decide how much of our goods will enter their markets every year, which of them get to enter and which don't, how much of a cut they'll get from our profits there, and so on and so forth. Likewise, we'll be able to set up quotas and restrictions for their own goods entering our borders.\n\nNow why our Senators and Congressmen are all suddenly so gung-ho about trade barriers and regulations -- the very things we aimed to break -- we'll never know. They prattled on to a man about how we should assist \"Indian development\" and insulate ourselves from a supposed flood of Indian goods, but you can't help but think they were all led by wild guesses pulled straight from where the sun doesn't shine.\n\nNow that we've taken care of things on our end, it's time to send Delhi the good news. We might not get as much money as we should've, but if our congressmen are right, then we'll have secured ourselves a good ally for a lifetime."

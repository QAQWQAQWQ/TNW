 USA_WAL_new_deal:0 "Cutting a Deal"
 USA_WAL_new_deal_desc:0 "President Wallace won his election on a promise to defend the little guy from two bullies: §RFederal tyranny§! and §Rcrippling poverty§!. To make good on the latter, he has proposed new expansions to §YMedicare§! and §YSocial Security§! programs to provide Americans with health insurance and retirement benefits. Yet while they are meant to promote §Gunity§! within the £GFX_npp_texticon §ONational Progressive Pact§!, these bills may prove to be as controversial as his §Sstates' rights§! legislation.\n\nThe Dixiecrat wing of the §LNationalist§! Bloc supports the general goals of the new programs but insists on restricting their coverage to exclude Black Americans. Meanwhile, the £GFX_npp_c_texticon §KProgressives§! Bloc and the northern £GFX_rd_d_texticon §BDemocrats§! demand equal access to these programs for all, regardless of race or color. Finally, the fiscally conservative §RRepublicans§! and Northern §LNationalist§! Senators are ambivalent on the race issue but are averse to expanding the §Ywelfare state§!.\n\nThe President's political acumen will be put to the test as he juggles the competing ambitions of these factions in hopes of securing enough votes to pass these bills. §ySuccess§! will cement Wallace's credibility as a bridge-building statesman, while §xfailure§! will damage his reputation for years to come.\n\n§YHealthcare Reform§!\n\n§Y[?USA.WAL_New_Deal_Dixie_FR_Support_healthcare]§! out of §Y[?USA.NPP_FR_South_senators]§! Dixiecrat £GFX_npp_fr_texticon §gNationalist§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_North_FR_Support_healthcare]§! out of §Y[?USA.NPP_FR_North_senators]§! Northern £GFX_npp_fr_texticon §gNationalists§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_C_NPP_Support_healthcare]§! out of §Y[?USA.NPP_C_senators]§! £GFX_npp_c_texticon §KProgressives§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_R_RD_Support_healthcare]§! out of §Y[?USA.RD_R_senators]§! £GFX_rd_r_texticon §RRepublicans§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_D_RD_Support_healthcare]§! out of §Y[?USA.RD_D_senators]§! £GFX_rd_d_texticon §BDemocrats§! senators support our efforts.\n\n§YSocial Security Expansion§!\n\n§Y[?USA.WAL_New_Deal_Dixie_FR_Support_SS]§! out of §Y[?USA.NPP_FR_South_senators]§! Dixiecrat £GFX_npp_fr_texticon §gNationalist§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_North_FR_Support_SS]§! out of §Y[?USA.NPP_FR_North_senators]§! Northern £GFX_npp_fr_texticon §gNationalist§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_C_NPP_Support_SS]§! out of §Y[?USA.NPP_C_senators]§! £GFX_npp_c_texticon §KProgressives§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_R_RD_Support_SS]§! out of §Y[?USA.RD_R_senators]§! £GFX_rd_r_texticon §RRepublicans§! senators support our efforts.\n§Y[?USA.WAL_New_Deal_D_RD_Support_SS]§! out of §Y[?USA.RD_D_senators]§! £GFX_rd_d_texticon §BDemocrats§! senators support our efforts."

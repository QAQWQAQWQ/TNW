 POLITICS_YAMAMOTO_MOICHIRO_DESC: "For Major General Yamamoto Moichiro, Malaya was meant to be the final stroke in a long and bloody political career - the coda and climax of Japan's conquest of China and the Dutch East Indies. When negotiations between the Malay Assistance Society and the increasingly centralizing Republic of Indonesia collapsed and the Malayan uprising erupted, Yamamoto - a key architect of Indonesia's 'independence' talks - was transferred from Java to take direct command of the Japanese intervention.\n\nThe early phase of the intervention was successful; aside from resource-rich and strategically vital northern Perak and Pahang, the United Malayan Anti-Japanese Front was driven from most of Malaya's population centers. But from that point on, Yamamoto's final stroke rapidly turned into a deteriorating swamp as he was forced to fight a shadowy jungle foe again and again. Yet that was not the worst of it - it was even worse than Yamamoto's worst imaginings.\n\nWith the Indian Republic - some say propped up by the OFN - extending aid to the ubiquitous anti-Japanese insurgents, Yamamoto's methods grew ever more extreme: extreme measures, in his view, were justified by the Malayan people's unbelievable resistance to Japanese cooperation. To that end, he brought in some of the men who had built Japan's victories, such as the notorious counterinsurgency strategist Nishiura Susumu. Yet Yamamoto's time was running out. He was about to retire - and the Front's momentum was growing by the day."
 SHO_Zaibatsu: "Bounty of the Rising Sun"
 SHO_Zaibatsu_desc: "Since Shōnan became a Japanese puppet, political and economic problems have sprung up endlessly; a prominent example of the latter is the Japanese zaibatsu's stranglehold on the economy. Under the zaibatsu's whip, Malayan laborers work long hours in atrocious conditions for starvation wages, little better than slaves. Shōnan is full of potential; she will grow into the Co-Prosperity Sphere's brightest star - and all we need to do is crush the rebellion once and for all."
 SHO_Dai-nijyugo: "25th Army Headquarters"
 SHO_Dai-nijyugo_desc: "The 25th Army - Shōnan's shield, the Empire's flower!\nAt least... on paper.\nThe 25th Army today is a hollowed-out shell. A decade of grinding counterinsurgency has worn this once-proud army to the bone: manpower depleted, food short, rifles and ammunition scarce. What keeps it in the field now is only Japanese resupply and the enemy's exhaustion. For better or worse, the 25th Army desperately needs a victory. Another defeat, and it loses everything..."
 SHO_Dai-nijyugo_2: "25th Army Headquarters"
 SHO_Dai-nijyugo_2_desc: "The 25th Army - Shōnan's shield, the Empire's flower!\nAt least... on paper.\nThe 25th Army today is a hollowed-out shell. A decade of grinding counterinsurgency has worn this once-proud army to the bone: manpower depleted, food short, rifles and ammunition scarce. What keeps it in the field now is only Japanese resupply and the enemy's exhaustion. For better or worse, the 25th Army desperately needs a victory. Another defeat, and it loses everything..."
 SHO_minority: "Fractured Collaboration Network"
 SHO_minority_desc: "A decade of war with the Malayan rebels has shattered our network of collaborators, pushing some toward radicalism. Informants we once trusted have become double agents; those we thought 'neutral' now sympathize with the rebellion; and our 'loyal' collaborators are every one of them greedy and scheming. Even so, these are the only cards Major General Yamamoto has to play, so for better or worse we must swallow our pride and use them."
 SHO_Marai_Giyugun_Auxiliaries: "Malayan Volunteer Army"
 SHO_Marai_Giyugun_Auxiliaries_desc: "Across Malaya, militia units, supporters of our regime, and pan-Asianists still persevere against the insolent rebels and their Western masters. Yet even as things improve, all we can do is nod and approve of their efforts; we have nothing more to give. The 25th Army is on the brink of collapse, and anyone who can hold a rifle is welcome."
 SHO_Marai_Giyugun_Auxiliaries_2: "Malayan Volunteer Army"
 SHO_Marai_Giyugun_Auxiliaries_2_desc: "Across Malaya, militia units, supporters of our regime, and pan-Asianists still persevere against the insolent rebels and their Western masters. Yet even as things improve, all we can do is nod and approve of their efforts; we have nothing more to give. The 25th Army is on the brink of collapse, and anyone who can hold a rifle is welcome."
 sho.0.t: "Shōnan - Light of the South"
 sho.0.d: "Malaya and Singapore are among the graveyards of the former British Empire. In February 1942, Commonwealth garrisons collapsed completely and surrendered in low morale, but this was not the Empire's last failure. Since then, the former colony has remained firmly in the hands of the Japanese and their collaborators.\n\nNow, education is conducted in Japanese, and Emperor worship and mass celebrations of imperial holidays are enforced. The local economy has been drained to support Japan's various projects. To realize this 'rebirth,' Singapore was renamed Shōnan, meaning 'Light of the South.'\n\nIn Malaya, the sultanates were preserved and granted broad autonomy, but Perlis, Kedah, Kelantan, and Terengganu were ceded to Thailand. Japanese merchants and settlers soon flooded onto the peninsula.\n\nBy 1962, Shōnan remains a vital part of Japan's vast empire, its rich raw materials fueling a growing population. Yet beneath the surface of peace and prosperity, resentment against the Japanese has never run deeper."
 sho.0.a: "We are the Emperor's lighthouse on the equator!"
 sho.1.t: "Light of the South"
 sho.1.desc: "On the surface, the Co-Prosperity Sphere seems to function as intended, bringing prosperity to all the peoples of Asia and the Pacific under a benevolent Japanese-led order. Unlike the tyrannical Pakt or the hypocritical OFN, the Sphere clings to its founding mission: progress under Japanese benevolence - provided the peoples cooperate.\n\nYet they will not cooperate. The Republic of the Philippines can barely hold back the communists in the north and the American-aligned regime in the south. Then there is Malaya, the millstone around the neck; if the Front takes Shōnan Island, the consequences will be catastrophic.\n\nInoue's phone finally rang. He turned from his office window - Tokyo's streets bustling below - and picked up dutifully.\n\n'We hold the cities, but the jungle is a bloodbath - and Thailand can't help us; they're too busy with their own insurgents to even reach their own border.' Yamamoto's voice was harsh and crackling through the receiver, and Inoue took a moment to collect his thoughts.\n\nFor too long Malaya had been a bottomless pit swallowing funds, the 25th Army's repeated defeats consuming resources like Urol's republic. The Sphere's wounds had festered for too long. It was time to remind the opportunists why the sun rose in the east, and why the southern light always flickered."
 sho.1.a: "'Hold Shōnan Island at any cost!'"
 sho.2.t: "Logistical Problems"
 sho.2.desc: "Admiral Thomas H. Moorer and his Indian Ocean Command staff stared wearily at the map spread across the table, its lines tracing the contours of Southeast Asia from the vast Indonesian archipelago to the Indochinese jungle. Yet at this moment, every mind was bent on the task of supplying the rebels on the Malayan Peninsula.\n\n'We can't do much unless the rebels take a port,' said an aide bluntly.\n\n'Thank you, Commander, for stating the obvious,' the admiral replied. 'But that does not mean we do the impossible.'\n\n'We could refit the Balao-class submarine Perch as a transport. We might also bring the Sealion around from the Atlantic. It may not help much, but it's better than nothing,' said another officer.\n\n'What about Ceylon?' said a third, pointing boldly at the map. 'If we get Trincomalee, the run to Southeast Asia is a stroll.'\n\n'Then you'd have to ask the State Department. Don't count on it,' the admiral replied.\n\n'What about Military Airlift Command? We could try running C-130s out of the Cocos Islands, refueling along the way.'\n\n'Then I'd have to talk to the Air Force about it,' Moorer cut in. 'They'd need a few trial runs first, but I agree with the aide - until the rebels take a port...'"
 sho.2.a: "'We want to help, but we can't.'"
 sho.3.t: "Echoes of Cries"
 sho.3.desc: "'As you all know, we have taken a port. This is a breakthrough; we can finally get our boys into the fight from here.' Davis picked up the map from the table before him and pinned it to the wall. 'As you can see, this route is fraught with difficulty, and actually completing it is even harder. We'll have to be careful; we can't let the IJN or Sukarno catch wind of this.'\n\nDavis grinned. American boots would finally set foot in Asia, shaking the cruel rule of these Japanese imperialist maniacs. 'You understand, General Hafiz - that is the correct name? It is an honor to serve in combat with you. The Japanese destroyed my life. Those bastards took my wife and child in Hawaii; they took everything I held dear.' Davis's smile faded, and tears welled in his eyes. That day he had not been able to follow them, and afterward the image never left him: poor Marisa and Jack screaming and crying, their mother's eyes brimming with tears as she breathed her last. From the first moment he imagined their fate, his mind had betrayed him.\n\n'I have a child too. His name is Amin. He was always happy just playing in the dirt. That day, when those bastards burst in, he was playing in the dirt as usual. My wife Halimah and I told him to get inside, but he wouldn't listen. When the Jap came over, he even tried to invite the soldier to play with him. The cruel bastard didn't hesitate for a second; he shot him dead. I watched from the window, but my body wouldn't move. I didn't dare confront the murderer; I could only watch his soul leave his body, watch his blood stain the earth.'\n\nSilence filled the room. The soldiers stopped whispering. Only the crickets sang. In the quiet hall, two men held each other tightly, guns in hand, tears flowing like a river."
 sho.3.a: "Revenge for loved ones, even at the cost of life."
 sho.4.t: "Morning in Washington"
 sho.4.desc: "The Tidal Basin glowed in the morning light, and the President's heart was light. For the first time in months, Nixon had slept well. Haldeman handed him a memo with some heartening Ohio polling. The Washington Times headline read: 'United Malayan Anti-Japanese Front Triumphs in Malaya,' with several photos of the rebels raising their colors - well shot. This was what Nixon loved. After voters forgot where Malaya was and why it mattered, these striking images would remain in their minds.\n\nNixon leaned against a column, eating his breakfast - cottage cheese with ketchup and grapefruit. He savored the rich creaminess. Even Kennedy couldn't spoil his mood.\n\nOf course, even at this hour, that kid was probably still dealing with those annoying liberal reporters from the Boston Globe or New York Times. He'd bet the Sulzberger crowd was already trying to claim this victory for their 'golden boy' so Kennedy could beat Nixon in '64. But in the end, Nixon was the President. He was the one who had beaten the Japanese black and blue, who had ended years of conflict in the Pacific, who had brought America a strategic ally. The photographs in the papers were his doing, his own doing. As long as America kept winning overseas, his re-election was a foregone conclusion.\n\nThe President stood for a while longer, thinking of the favorable press he would receive. He wished he could savor this sweet moment a little longer."
 sho.4.a: "Nixon is especially happy today."
 sho.41.t: "Midnight in Washington"
 sho.41.desc: "Richard Milhous Nixon sat on the White House steps, eyes fixed on the blinking red light atop the Washington Monument - on, off, on, off - as he pondered his political career. Whenever bad news came - whether the situation in the Aleutians or the media's criticism of him on civil rights - he would take a solitary midnight walk, and it had become a habit. Tonight, bad news came from East Asia. After years of sporadic fighting, Japan had announced its victory over the United Malayan Anti-Japanese Front in Malaya. Tomorrow the Post would surely run photographs of American-equipped soldiers' corpses, or the haggard, defeated face of Chin Peng.\n\nOn, off, on, off.\n\nThis was just one more in a string of failures, the President thought, just another mistake. Tomorrow there would surely be articles and editorials criticizing the President, saying he had let another ally be crushed by fascism, that he had weakened the OFN, that he had lost vital American trade routes. Countless fools and commentators would question whether he had the 'stamina' to run again in '64 - as if Kennedy could do any better. At least Nixon knew how to face adversity. If Kennedy were President, he wouldn't last a month.\n\nThe monument's light stayed dark for a long while before coming back on, longer than usual. Nixon stood up shakily.\n\nThe defeat in Malaya was regrettable, but he would put it out of his mind. Perhaps the negative coverage would last a few days, perhaps Congress would hold hearings, and then the people would forget Malaya existed. There would be new crises, perhaps bigger and more explosive, and the boys would march off to fight. All he needed was to find something new to distract the public, and the nation would rally around him again.\n\nNixon walked slowly into the White House, not looking back."
 sho.41.a: "On, off, on, off."
 sho.5.t: "A Bone in the Throat"
 sho.5.desc: "For the first time in his life, Tokuda felt a strange sensation. Was it unease? Worry? Surprise? He could not say; it was unpleasant, whatever it was.\n\nHe had answered the call early, joining the effort to help the Shōnan forces crush the American puppet rebels in Malaya. The Westerners had tricked the peoples of Asia into hating and killing one another, and the peoples of Asia had endured this humiliation for too long. Now that some force was trying to drive a wedge between the brotherhood of the Greater East Asia Co-Prosperity Sphere, it filled him with righteous anger.\n\nFor the first time in history, the people had become the masters of Asia, thanks to the wisdom of the Empire and the Emperor. No foreigners, no imperialists, only peoples united in mutual benefit. How could anyone want to leave such an alliance? He had heard rumors of rebels and dissenters, but those were just American or Nazi propaganda. Besides, some people would do anything for money and power - or so he had thought.\n\nIt was not until he set foot in the Light of the South that he woke up.\n\nWhat awaited them was not the proud Shōnan army he expected. The collaborators were exhausted, fewer than he had expected, and undersupplied - no wonder they needed help. But what disturbed him even more was... the feeling that he was not needed here - nor were the collaborators. He did not feel like he had come to help his Asian brothers fight off American imperialism.\n\nHe felt like an intruder, an outsider. He was here because the people here had to tolerate their arrival, not because the people wanted them. Somehow, the people did not seem to be on their side. He could not blame the Americans, or half the people on Shōnan Island would have to be spies. But why did they not welcome Japanese help with open arms? The question troubled him, and he felt it would haunt him long after he returned home."
 sho.5.a: "Unwelcome allies."
 sho.7.t: "Light of the South"
 sho.7.desc: "Shōnan is a beautiful place at Pacific dawn. The glittering skyline meets the earth, reaching up into the hazy sky, while the flames of factories and refineries flicker on either side of the zaibatsu windows. A babble of voices in a creole of Malay, Chinese, Japanese, and residual English (the old trade tongue has not died out) spills into the streets, flowing into teahouses, hotels, and factories. Thousands of businesses open, waiting for the profits of the trade routes to roll in on trucks and cars along the crowded, poorly maintained roads - which have become a focus of political debate. The slums too are awake: the coolies and workers of the new Southern Light, the oil burning under fire, must be thrown back into the incandescent glow of the Sphere's jewel. What if a few people do not come back?\n\nThe politicians in the Diet worry, as they always do, about the thousand problems that have brought the city low: trade infrastructure, worn out by heavy use and occasional communist sabotage, has collapsed; the 18th raid on Chin Peng ended in a self-congratulatory victory, but with no body to prove it; Malays and Indians continue to push for greater autonomy in their fee-paying schools (ignoring the zaibatsu's generous donations that made them possible); and of course the Sultans have their own influence on this infuriatingly successful city behind them. At the top of the city are all the Japanese, proud and unrestrained, utterly insufferable; beneath the Japanese are the Chinese, who endure long suffering endlessly like gargoyles propping up the walls of a crumbling cathedral.\n\nThis is a kind of peace. But one thing is certain: in the heat and endless ostentation, nothing lasts - who can say what the next morning will bring, gold or fire?"
 sho.7.a: "The city that never sleeps."
 sho.8.t: "The Coffeehouse Fire"
 sho.8.desc: "Most disturbances are brewing long before the streets fill with fire and garbage. They curl in damp spaces, their voices soft enough for the police not to hear; each near-whisper spawns a chain of rumors and doubts, condensing anger into hatred - and finally into violence. Long before it erupted, long before the government knew, the unrest was brewing: on a day forgotten by history, far from the ears of the Kempeitai and the Diet, outside a damp coffeehouse reeking of sake in the outskirts of the Central District, the beginning of the Shōnan Island uprising took shape.\n\nLike so many disturbances in the world, it began with a conversation that went on too long, and made one uneasy. The participants may be forgotten by history - Shōnan always has ways to erase such disputes for the public good - but this much is known: on October 13, among the coffeehouse's customers were some Japanese merchants, some middle-class Chinese civil servants, and some Malays and Indians whose families ran shops. The latest round of zaibatsu import quotas from Tokyo had everyone whispering, but no one agreed on what to make of it. The Chinese civil servants were the sharpest and harshest in their criticism: the yoke of taxes and overwork was universal, but it fell heaviest on them. The Japanese merchants thought Tokyo's intentions were good, but those below had misread the script; the Indians and Malays naturally worried about the hegemony of Japanese companies - was that not only natural? No one could ignore that the old Indian-Malay economy, on a land still called Malaya by some, was slowly collapsing.\n\nThree viewpoints, one disagreement, and the quarrel fermented into drunkenness and arson. The shopkeeper later testified to a bar brawl that dispersed when the police arrived, but the perpetrators had slipped away beforehand. One of them prophesied that everything Japan owned would burn across all of Malaya - and then he was gone, a Cassandra lost in the hot Malayan night wind."
 sho.8.a: "Is this a threat, a promise, or a prophecy?"
 sho.9.t: "Tinder, Sparks, Matches"
 sho.9.desc: "Within a week of the coffeehouse incident (local authorities quickly suppressed it to avoid provoking the irritable garrison command, which kept constant watch on the local situation), anger continued to grow, but in private. The Kempeitai were far less brutally corrupt than they once had been - preferring quiet graft to open atrocity - but their capabilities had not diminished, and they remained deadly when the moment required. The rumors grew louder, disappearing from sight like dragonflies skimming a calm lake, sending ripples outward -\n\nOctober 17: Sumitomo announced a small-scale restructuring of its Shōnan Island branch, laying off dozens of workers to integrate operations under Tokyo's chain of regional managers. Most of those laid off were Malays and Indians. The numbers affected were small, but to many already skeptical of the zaibatsu, this was proof that the Japanese intended to squeeze local interests; they wanted to uproot native industry and bind Malaya permanently to the Sphere. Security reports noted brawls in factories and angry rhetoric in minority enclaves in the eastern and central districts, with calls for action and the use of force.\n\nOctober 19: A Chinese coolie was found murdered outside a hotel. Initial reports were sketchy. Since follow-up investigation was impossible, the body was only partially examined. Notable witnesses to the corpse included several Japanese merchants and managers, several police, and a Chinese gang from the boundless slums of the north-central district. The latter retreated hastily but vowed revenge for the blood spilled.\n\nOctober 20: A crowd of Chinese, Malays, and Indians, roused by surrounding fear and rhetoric, marched through the city. Months earlier, the Prophet's Birthday celebrations had passed smoothly and the crowd had been well controlled, but local guards made two serious mistakes this time: they sent a detachment in which every member was Japanese."
 sho.9.a: "That doesn't sound bad at all."
 sho.10.t: "Burning Dawn"
 sho.10.desc: "Given the chaos that followed, it is unclear what actually triggered the uprising. With police reports burned along with government buildings, the details are lost to history. Later, some suspected elements in the Diet were covering up evidence - these voices were quickly suppressed, either through legal means or... well, there was plenty of space under the docks for those who did not know better.\n\nBut this much is clear: two groups met on Rochor Road, separated by a line of Japanese guards. These men had just been conscripted and pulled straight from their barracks, and were not fluent in the local lingua franca: halting Malay was poor balm for restless hearts - especially Chinese ones. The detachment commander thought the two groups of protesters were jointly demonstrating and asked to speak with both leaders. Through his mistake, the crowd jeered at him in a language he did not understand and poured into the street, frightening local shopkeepers into closing up. The Diet, of course, said nothing. The crowd distrusted one another: the Malay and Indian middle classes saw the Chinese as agitators; worse, the Chinese despised the Malays and Indians who had been elevated by the Japanese over their heads.\n\nThe situation slipped from the commander's control, and he radioed headquarters for aid and support: this is where the two narratives diverged. The Chinese protesters insisted he had ordered the police to open fire on them; the Indian protesters claimed he had ordered the police to ignore the Chinese and only drive back the Malays and Indians. Both accounts spread through their respective crowds, inflaming tempers further. Both groups of protesters decided the police were about to attack and charged forward at once to seize the initiative, breaking through the thin blue line. The commander vanished in the melee."
 sho.10.a: "Fuck."
 sho.11.t: "Burning Day"
 sho.11.desc: "The riot raged through the streets and spread. Words were weapons too powerful to contain - a plague-like transmission fermenting them into rumors. As crowds poured out of cramped homes, threats, fear, and grief grew more dangerous, and the urge for revenge beat louder with every heartbeat. Beneath it all, old grudges festered, blooming into blood-red flowers. Mobs and gangs made a hell of the streets, sealing factories and smashing every house they deemed 'too rich, too solid, too large, too Japanese.'\n\nAfter violence unseen in Malaya since the conquest, the garrison responded with an eye for an eye. Residents retreated into enclaves, taking up rusted parangs and bayonets, ready to kill anyone who seemed threatening. (Many villagers protected local minorities - a quiet resistance that went almost unnoticed by others.) Anger spread quickly from the economic to the political sphere, and police stations and many prominent zaibatsu office buildings were burned. The Diet was in disarray, waiting for order to be restored, pulling soldiers from vital defensive positions to protect itself. The Malay Sultans condemned the riot without hesitation, just as they condemned the Diet's inaction. The Diet might not control its own territory, but at least it defended itself indignantly; the ensuing war of words made the entire Shōnan government look even more pathetic as the dead piled up outside the glass windows.\n\nIn one famous photograph, the fires burning through the city shrouded sky and horizon in thick smoke: reporters speculated that to prevent 'communist saboteurs' from looting an arms depot amid the chaos, the stockpile near Keppel had been destroyed, sending up a column of black smoke. There was no evidence of communist infiltration of the protests."
 sho.11.a: "Are you kidding me? Can no one restore order?"
 sho.12.t: "P. Ramlee Releases New Film 'Labu dan Labi'!"
 sho.12.desc: "'Kuala Lumpur is sweltering, but no one seems to care: everyone is waiting for the cinema to open. They say this is his best work yet, even though they say that every time he releases a film. Many still look forward to the next blockbuster from the legendary P. Ramlee - '\n\n'--for this Japanese filmmaker, filming a buddy comedy is a surprising investment, but our Central District sources say P. Ramlee says working with the enterprising director has been pleasant. We believe this striking precedent will only bring greater hope to the fledgling Malay film industry - '\n\n'--the story is deeper than you think. Look at the plot! Labu and Labi work for a rich but stubborn man, right? They want to be judges, doctors, but it falls through because working for the rich man gives them no freedom. Who does the rich man work for? That's right, a zaibatsu. The whole film is a metaphor for the true face of the Co-Prosperity Sphere, oppressing us while - '\n\n'--well, I think the film is great, but I think he might be getting a little overrated. Ramlee is the only film star the Japanese can trust, a symbol of pan-Asian unity, of course, but don't you think we should have more than one? If we're putting on a show, at least make it a big one! --'\n\n'--look, I really don't care what you think. All I know is I'm a diehard Ramlee fan, and if you don't like it, jump off the Malacca docks. Enough talk, we've got to save on bus fare for the next film - we'll take the bus into town when it comes out --'"
 sho.12.a: "The Malay film master has stunned the screen once again!"
 sho.13.t: "Behind the Mask"
 sho.13.desc: "Excerpt from Malayan Eiga News, 19XX, XXXXXXX\n\nNeither the bustling audience, the smiling officials at the Malay National Film Company, nor the many producers and extras knew this man. P. Ramlee kept his mask half-on, smiling at all who knew him: but for now, Shōnan knew nothing else about this consummate actor. Who was he really? The answers shifted, seeming to be whatever the Malay people wanted him to be - a reformer or a smiling establishment man, a pious Muslim or a cheerful secularist, anyone's ally or no one's close friend. After all, deflection is a form of reflection, and who does not want to see their own shadow in Malay's greatest film star? And who is Tan Sri P. Ramlee? What becomes of him when P. Ramlee takes off the greasepaint and steps out of the spotlight?\n\nWe entered a comfortable townhouse in an affluent Kuala Lumpur suburb, his residence. A strong jasmine fragrance greeted us: apparently Saloma (or Salmah Ismail, as she preferred to be called) liked perfume, and Zakaria had gone to great lengths to procure it. As she busied herself in the kitchen, he greeted us with a smile and talked about the weather: they had been married for seven years, but due to their busy work they had no children (though of course the two had worked together in film and music for a long time).\n\nWhen we turned to his most striking commentary on the deepening racial and economic divides in Shōnan Island and urban Malaya, his expression grew serious: he spoke of how he had spent his childhood in a poor family, and how the Japanese had later rescued him from a life of poverty, bringing him to naval school, and finally to the start of his career: Tokyo. 'Without the Japanese, I would have been poor forever!' He smiled, then grew serious. 'So what makes me different from the coolies and the hungry outside? Did not the Prophet tell us to have compassion for all people as he did?'"
 sho.13.a: "Wise words from a great man."
 sho.14.t: "P. Ramlee Releases New Film 'Tokyo Holiday'!"
 sho.14.desc: "'--oh wow, Ramlee took a big swing this time and connected! I mean, I cried my eyes out at the ending, but if only he'd make a good romance without political subtext - '\n\n'--our reporters say this may be the most dramatic film Ramlee has ever made; it combines all the subtle emotional anguish of the love triangle our protagonist finds himself in, with a subtle commentary on the 'unequal' relationship between Malays and Japanese, our Japanese allies in Tokyo and Kuala Lumpur - '\n\n'--it depicts a sordid unrequited love deep within the heart of a tour group from Tokyo to Kuala Lumpur. Mariko loves Kunio, but Kunio is drawn to Rosnah, though he cannot say so due to the burden of class and race - while Rosnah's lover struggles against the zaibatsu in the employ of Kunio's uncle. An emotional, stormy conflict, the stage is set to depict the extreme rural poverty that has emerged as the Sphere locks Malaya into its economic system - '\n\n'--undeniably bold, yes, but this might push the Shōnan Island Diet and Japanese advisors too far, don't you think? Stirring up a little trouble is one thing, but won't this really bring them knocking? I'm afraid Ramlee might bring the Japanese army back into the Diet because he cares too much about the poor - '\n\n'--look, I don't care what it says. What matters to me is that when Rosnah and Kunio said goodbye, I cried! OK? If it makes me cry, it's a good film, whatever its subtext! Who wants to see it again? --'"
 sho.14.a: "Everyone knows Ramlee is testing the red lines."
 sho.16.t: "Gibraltar of the East"
 sho.16.desc: "The sun rises over the jagged sandy coast and picturesque beaches, but this place has become a charnel house of slaughter and suffering. Singapore, or Shōnan, Britain's former eastern bastion and Japan's key projection point in Malacca and the Indian Ocean, is now in rebel hands.\n\nFor the soldiers of the Malayan People's Anti-Japanese Front entrenched in the Gibraltar of the East, peace seems a distant memory. Day after day of relentless shelling, punctuated by air raids and the 25th Army's ferocious, desperate counterattacks. Fresh water, medicine, and ammunition are rationed. It is a war of attrition wearing both sides to the bone.\n\nYet the spirit of freedom burned long and bright. Through fire and sleepless nights, exhausted, the soldiers took turns going to the southern tip of Singapore Island and shouting. At last, the first ships of the OFN fleet appeared on the horizon, the blue-and-white ensign fluttering in the breeze - the promise waited for decades had finally been fulfilled.\n\nHope, joy, gratitude, all overflowed. These feelings were colored by relief at the easing of confusion and worry, by satisfaction that a foreign power had brought freedom, by optimism about an uncertain future. For now, the appearance of peace and victory prevailed over all."
 sho.16.a: "Uncle Sam finally came."
 sho.17.t: "The End of the Emergency?"
 sho.17.desc: "In any case, the situation on the Malayan Peninsula seems to have stabilized. According to our intelligence, due to quite serious developments in the Japanese home islands, the 25th Army has completely suspended operations to annihilate the United Malayan Anti-Japanese Front. The sudden collapse of the mighty Yasuda zaibatsu has caused a total breakdown of Japan's economic sector, and even the Imperial Japanese Army garrisoned in Malaya has found itself unable to resist the shockwave. With logistics in chaos, the 25th Army's operations halted immediately, and a ceasefire was declared shortly after.\n\nPeace has finally come to war-ravaged Malaya, and today's front lines may be tomorrow's borders - assuming, of course, that peace holds. Yet with Japan currently hobbled by economic crisis, a renewed conflict is unlikely in the near term.\n\nNow that the war is over, we can shift focus to our relationship with the rebels. If our ties survive the dust settling, the OFN may yet establish a strong partner deep in the Co-Prosperity Sphere's heartland."
 sho.17.a: "Let's hope they remember their friends."
 SHOUS.1.t: "Socialism in Kuala Lumpur?"
 SHOUS.1.desc: "Malaya's first post-war general election has concluded, and the results are not to our liking.\n\nNeedless to say, the winner was Ahmad Boestamam, a committed socialist - and unfortunately, not one particularly sympathetic to our interests. He is no ideological hardliner; rather, he advocates combining socialist principles with Malaya's specific national conditions, believing that blindly following the old Bolshevik path is unsuitable. Instead, his vision of socialism turns to the side Malaya's wreckage most urgently needs: national reconstruction.\n\nThough Boestamam's election is far preferable to the Japanese staying on, it is still a setback for us. Compared to Razak, he is less friendly to the OFN and will not be joining our cause any time soon; given the vast resources we poured into this conflict, we have missed an opportunity. Even so, the fact that the Japanese have been driven out of Malaya is still worth celebrating; Tokyo's hold over Asia has been dealt a severe blow, and that is cause for celebration.\n\nThanks to the election results, we have recently observed a small uptick in NPP Progressive polling. Perhaps the American public believes that Boestamam's victory is the reasonable result of our support for the war, and thus represents our direct endorsement of socialism."
 SHOUS.1.a: "Perhaps a peaceful revolution is exactly what Malaya needs."
 SHOUS.2.t: "Out with the Japanese, in with the OFN"
 SHOUS.2.desc: "Malaya's first post-war general election has concluded, and thank goodness our candidate won.\n\nAbdul Razak Hussein has won the hearts of the Malayan people and ascended to the pinnacle of power, ready to begin his reconstruction plans. As a conservative, Razak's rise is exactly what we hoped for: he is moderate, friendly to the OFN, and seems enthusiastic about rebuilding the nation - exactly what war-torn Malaya needs.\n\nRazak's victory is the best possible outcome for us. Unlike his opponent, he is very much in line with our interests, and there is no doubt he will cooperate with us sooner or later. We have already begun negotiations on Malaya becoming an OFN observer state; clearly, Razak's victory means the nation has become an American ally.\n\nBut Malaya is not finished yet. Since Malaya is almost certain to join the OFN, we should provide economic and humanitarian aid rather than leave Razak and the Malayan people to clean up the mess alone. This will be expensive, but strongly supporting Malaya will ensure it becomes our most loyal ally."
 SHOUS.2.a: "Our efforts were not in vain after all."
 SHOUS.3.t: "CIA Report: Malaya"
 SHOUS.3.desc: "--TOP SECRET--\nMalayan situation, (abridged for brevity)\nConclusions:\nI. Situation Assessment\n(1) Malaya's potential as a bulwark against expanding Japanese influence is declining significantly. The CIA station chief in Malaya reports that the current regime is unlikely to be overthrown. The station chief also comments that though the Homeland Legion government is well-disposed toward the OFN, closer relations are nearly impossible.\n(2) Ambassador Bell believes Japan will not tolerate American presence in the Strait of Malacca and may seek to destabilize Malaya through various means (though given Japan's recent economic crisis, no large-scale action is expected for now).\n\nII. Current Regime\n(1) The rebellion has severely split the United Malayan Anti-Japanese Front. Throughout the conflict, both left-wing and right-wing moderates have shown clear signs of radicalization. Much of the country remains under martial law. Troops are still stationed in major cities such as Johor Bahru, Kuala Lumpur, and Klang.\n(2) The Homeland Legion's military rule seems popular, but is fragile in Malaya's delicate post-war situation. The Malayan Communist Party still retains considerable strength in rural areas.\n\nIII. War Damage\n(1) The Malayan Peninsula has been devastated by the war; large parts of the population lack basic necessities, and infrastructure is severely damaged (see Appendix C: Report by Martin).\n(2) The aid requested by the Homeland Legion government is enormous, estimated at $1.5 billion per year (approximately 40% of the foreign aid budget).\n(3) Malayan reconstruction, combined with the conflicts in the Philippines and South Africa, will place enormous strain on finances.\n(abridged for brevity)\n--TOP SECRET--"
 SHOUS.3.a: "A missed opportunity."
 SHOUS.4.t: "Marxist Malaya"
 SHOUS.4.desc: "The Malayan Emergency is over, and it seems the king of ruins presiding over the destruction is not friendly to us.\n\nChin Peng, a committed anti-colonialist, now leads the nation torn apart by years of war. As a staunch communist, Chin Peng intends to rebuild Malaya along the Marxist-Bukharinite line, and his past actions show he will stop at nothing to achieve a free and unshackled Malaya.\n\nThough the ideal is noble, reality is harsh. Chin Peng cares little for America or the OFN. Though we came with good intentions, he sees us as no better than the Japanese, and cooperating with us is merely trading one master for another. Thus, our cooperation with Malaya seems to end here. The nation has chosen independence, free from foreign influence.\n\nThis is a major setback for us: if Chin Peng's opponents, especially Razak, had managed to take control of the country, things might have gone more our way. Still, the fact that the Japanese have been driven out of Malaya is some consolation, given that their influence has been severely damaged. Of course, we should keep an eye on the country and hope its politics develop in our favor, but we should not expect too much, lest we be disappointed."
 SHOUS.4.a: "At least they're independent..."
 SHOUS.5.t: "Great Ambitions"
 SHOUS.5.desc: "Kennedy turned back to the public, doing his best to keep the smile on his face. Shaking hands with a man of iron resolve is not easy, and of course the dozens of cameras flashing before them added to the pressure. When the last media lens had flashed between the Vice President of the United States and Abdul Razak, the two finally sat down to discuss American intervention in Malaya.\n\nBefore Razak even sat down, he could not wait to speak: 'Mr. Vice President, we both know that if the OFN wants to hold its ground in the Pacific, it needs a reliable ally, and if you could send us some more supplies...'\n\nKennedy frowned. 'We're doing what we can, airdropping supplies to you. If one more rifle flows into Malaya, the Japanese will smell blood, and then you'll face a situation entirely different from the one now.'\n\nAbdul frowned, lacing his fingers. 'You can handle those problems, can't you?' Kennedy smiled and took a sip of water. 'I'm serious! We both know what you'd do. This is a chance to redeem America's image as a defender of freedom, and Nixon doesn't seem to want to take it. As long as you show you're different from him, I'm sure it won't be long before you're President.' Kennedy thought for a moment about what Abdul had said.\n\n'Perhaps I can send a little more material to Malaya. I would not see any civilization destroyed. But beyond what you have already received, do not expect anything more. I will talk to the President when I return and ask his thoughts.'"
 SHOUS.5.a: "'But this is not a guarantee.'"
 razak_victory_tt: "§GThe tense seas have returned to normal.§!"
 SHOUS.6.t: "Necessary Sacrifices"
 SHOUS.6.desc: "'Eleven thousand nine hundred and fifty-two.'\n\nThe number echoed in Nehru's mind as he hesitated to accept the reality. 'That's just last month's dead?'\n\n'Yes, the casualties have been consistently that high. The situation is very...' Ahmad Boestamam drew out his words, noticing Nehru's eyes wide and vacant. 'Malaya needs them. These warriors died for something worth fighting for.'\n\n'But I do not want anyone to die, Ahmad. In truth, I do not want anyone to die, not to give up their lives for this, not...' He shook his head.\n\n'Not for freedom, Pandit? I know, I do not want them to die either, but I know they died content, having fought for freedom in life. If they knew that their sacrifice would bring not just freedom but a better world, they would accept their fate. If these eleven thousand nine hundred and fifty-two died for freedom, then every one of them died for a brighter future.' Boestamam looked at Nehru and saw him deep in thought, pondering the casualty figures. 'You see, one cannot build a nation - let alone a socialist nation - on hope alone. People must fight for it, whether those in their way are willing or not. No one will appreciate what we build.' Nehru looked up at Boestamam. 'But it is work that must be done.'\n\nNehru sighed, trying to clear his thoughts. 'Listen... next time, make sure communications are in order, understand? We have already lost enough good men. We made mistakes, we learned the lessons, and we cannot make them again, or even more people will die.' Boestamam stood from the chair opposite Nehru and walked to the window, overlooking the lush, beautiful Indian countryside. 'Of course, Pandit. But we must return to Malaya first.'"
 SHOUS.6.a: "Easier said than done."
 Boestamam_victory_tt: "§GBread, shelter, and work should be every Malayan's right.§!"
 SHOUS.7.t: "Spoils of Victory"
 SHOUS.7.desc: "Nixon never liked dealing with Congress - pushing legislation, handling civil rights, or persuading stubborn old congressmen were usually left to Kennedy. Foreign policy was not usually his domain, but today there was something worth celebrating.\n\n'Japan Defeated in Malaya' read one newspaper headline; another read 'Sphere Hits a Brick Wall.' The news of Japan's defeat in the Southeast Asian jungles was sincerely admired by the nation, especially by Nixon's home state of California - the kind of admiration he had not earned in two busy years as President of the United States. Even the most hostile outlet, the New York Times, ran an editorial praising the Nixon administration's foreign policy.\n\nThough the communist leading the uprising had not had the courtesy to call him, he did not want a phone call to spoil the moment anyway. Of course, he would have to call Dulles to make sure Malaya did not slip from his grasp. The first domino had fallen; if Nixon's methods worked, it would not be the last."
 SHOUS.7.a: "America vs. Japan, one-nil."
 SHOUS.10.t: "Two Warriors"
 SHOUS.10.desc: "Watching his comrades march down the streets of San Diego, Hussein Onn, seated in his place, noticed he was drenched in sweat. Needless to say, the uniform and the chestful of medals were weighing on him, and the blazing sun pushed his discomfort to the limit. Not that his army reassured him much; they had forgotten half of what they had trained on the way from India, which was risky enough. Yet if he won this bet, OFN aid would go a long way toward solving the manpower shortage. The soldiers' crooked marching, clumsy salutes, and gloomy faces all became beads of sweat dripping from Hussein's forehead. Feeling something nudge his shoulder, Hussein was briefly released from the pressure. A good friend's cigar could indeed act as a temporary tranquilizer. 'Relax, Hussein, it'll be all right.' General LeMay's silver lighter flickered, and as the flame rose, the cigar did its work and settled comfortably between Hussein's lips. A wisp of white smoke dissipated as LeMay slipped the lighter back into his tunic breast pocket, and almost without pausing for breath began discussing the NPP's new plan to mobilize artists, urging people to 'Fight for Malaya!'\n\n'Believe me, Mr. Onn, the NPP will do everything it can to fight for a free Malaya. Of course, that means more soldiers for the war, more rifles for the freedom fighters. But it also means a brighter future for America - and for the OFN as well. Judging from operations in the region, we may not be able to completely remake Malaya...'\n\nA tall American walked up to the two, looked at General LeMay, and asked: 'Excuse me, sir, that Hussein Onn over there - isn't he Malayan?' LeMay sized the man up; he was not thin, but not fat either. He just stood there, radiating the confidence of either a genius or a fool. A crooked nose sat bluntly above his roughly shaved stubble, and his eyes held a pure hatred. LeMay leaned forward slightly, staring him dead in the eye."
 SHOUS.10.a: "'Get lost, Francis.'"
 SHOJAP.1.t: "The Taste of Independence"
 SHOJAP.1.desc: "The Malayan rebellion has been quelled, but the nation's new leader leaves something to be desired.\n\nMalaya's new Prime Minister, its first after the uprising, has been confirmed as Burhanuddin al-Helmy. Al-Helmy is a Malay nationalist and a Muslim who dreams of remaking Malaya in his own vision as an Islamic, anti-colonial state, hand in hand with its Asian partners.\n\nYet his attitude toward Indonesia is a little too friendly for Japan's liking, and he is also too radical, not subservient enough. His pursuit of Malayan independence is well known, and unfortunately it resonates with the Malayan people. His reconciliation and friendly gestures toward Indonesia could even upset the Sphere's balance of power, replacing our influence with that of Sukarno's regime in this region.\n\nStill, the new Prime Minister is broadly cooperative, meaning the situation is stable enough for now. In any case, there is nothing we can do about him for the time being; this over-radical collaborator will remain in his post."
 SHOJAP.1.a: "Let's hope he doesn't cause too much trouble..."
 SHOJAP.2.t: "Night of Shattered Dreams"
 SHOJAP.2.desc: "Dato' Onn Jaafar felt a headache as the weight settled on his shoulders. It was five minutes to two in the morning, and he had only just struggled out of that endless string of meeting hell. Jaafar took out the last two cigarettes from his bag; not enough, but better than nothing. He looked up at the clouds and silently mourned his situation.\n\nWhat a cruel irony: he, a proud Malay, was now to crush his own people with an iron fist. He remembered the early years when he had actively fought for equal rights for the Malayan people. Yet the moderate rebels who had stood with him were gone, replaced by radicals filled with wild fantasies, and those who fought in the jungle could never create a free Malaya. Even if power did fall into their hands, they would only replace one dictatorship with another. Besides, they were fighting a hopeless battle against a rising empire.\n\nPerhaps in twenty, fifty, a thousand years, a truly free Malaya would come into being. But Jaafar believed that until that day came, those who wanted freedom should cooperate with those who could destroy it, negotiating with Malaya's colonizers for a surface independence. But now, even that thought was a little too optimistic. The party Jaafar founded was splitting, and his dream of a free Malaya was breaking with it. Was tonight's headache a dark spot on the long road to freedom, or another collapse of Sisyphus's hopeless struggle?"
 SHOJAP.2.a: "The cigarette burned out. He stubbed it out, and the founder of the Persatuan Melayu Semenanjung returned to his hotel room."
 jaafar_victory_tt: "§RA man with no choice, no way back. The perfect puppet.§!"
 SHOJAP.3.t: "Albar's Promotion"
 SHOJAP.3.desc: "Our earlier prediction that the Malayan situation had stabilized for now appears to have been somewhat inaccurate.\n\nDato' Onn Jaafar's death at the age of 69 was somewhat unexpected, and his successor has been confirmed as Syed Jaafar Albar, a nationalist firebrand. The new Prime Minister, a radical Malay supremacist, has already announced he will build a Malay-first state. This development has raised many questions; some in our government believe that if the new Prime Minister engages in excessively harsh repression of non-Malay ethnic groups, it will damage the Sphere's international reputation and Japan's image as the pan-Asian liberator.\n\nStill, Albar has been relatively cooperative so far, so we can tolerate his nationalist tendencies as long as he does not cause too much trouble. Beyond this, we believe that a Malaya under Albar can serve as a counterweight to contain Thailand - something his predecessor was unable to do.\n\nOverall, Albar's promotion to Prime Minister changes little for Japan. We hope he will not overly disrupt the balance of power in Southeast Asia. After all, Malaya remains Japan's puppet - and a useful one at that."
 SHOJAP.3.a: "The more things change..."
 SHOJAP.4.t: "Prime Minister of Ruins"
 SHOJAP.4.desc: "The Malayan people have fallen on hard times in every respect. The death of Dato' Onn Jaafar and the killing of Burhanuddin al-Helmy in a guerrilla raid have left us with no choice; besides Syed Jaafar Albar, we could find no one else to administer this land of ruins.\n\nA radical Malay supremacist, he has announced his vision: to make this nation a country where the Malay people come first. This effort, at the end of the day, is nothing but a joke. Some in our government believe that, now that non-Malays are already sick of the damage from the civil war, if he orders harsh rule over these people, it will damage both the Sphere's international reputation and our image as pan-Asian liberators.\n\nStill, Albar has been relatively cooperative so far, meaning that as long as he does not cause trouble every day, we can temporarily tolerate him posing as a nationalist. After all, judging from the state of the country he has inherited, we are confident he will not cause us any headaches for quite some time. In the meantime, we have every confidence that we can install a more... pliable Prime Minister."
 SHOJAP.4.a: "The light grows dimmer."
 SHOJAP.5.t: "The Long-Awaited Phone Call"
 SHOJAP.5.desc: "It was an ordinary day for Ino Shuuya. But then again, what day could he complain about? In politics, no news is usually the same as good news. Yes, he thought it was a perfectly ordinary day - at least until the phone rang.\n\n'This is Ino Shuuya. Who is this?'\n\n'Mr. Prime Minister!' came the ecstatic reply. 'We've done it. We've annihilated the Front!'\n\n'Ah, wonderful news!' the Prime Minister replied. The quagmire of the Malayan Emergency was finally ending. The 25th Army had finally done what it should have done years ago, and the radical uprising was gone. But what should he do now? Thoughts raced through Ino Shuuya's mind. Perhaps the best approach was to pump funds into Malaya immediately, integrating it fully into the Sphere. But it could become a bottomless pit consuming vast resources, and given the unstable domestic situation, he was not sure he could afford it. No, something else was needed, something less drastic. And then?\n\n'Mr. Prime Minister, what do we do now?'\n\n'Right, right, sorry. Listen, I want you to find a few politicians willing to work with us. Once that's done, install them in office.' With that, Ino Shuuya hung up. He considered that it was still a relatively ordinary day, at least compared to some. But after this news arrived?"
 SHOJAP.5.a: "Much better."
 sho.51.t: "The Bitter Taste of Failure"
 sho.51.desc: "Though on the surface Ino's expression had not changed much, the rage beneath the Prime Minister's calm facade was barely containable: millions of yen in investment; years of effort, tens of thousands of lives; the energy spent for years dealing with the southern problem - all wasted. The last 25th Army soldier had withdrawn from Malaya, and the rebels had fallen into the Americans' embrace - the Americans, of all people. Even though a single government order could prohibit all trade and diplomatic contact between the Sphere and Malaya, the OFN's regard for it, plus the existence of Australia and the Indian Republic, directly eliminated any possibility of the United Malayan Anti-Japanese Front starving. Plans to reinvade Malaya could be taken off the agenda for now: the 25th Army was now a hollow shell, and the exhausted force had finally succumbed to the offensive and rapidly disintegrated after the war. There were more pressing matters now.\n\nIn short, this was an unmitigated disaster for his tenure. He could almost feel the military about to call him to account for the failure, and the pressure was like a knife at his throat. To keep his patrons happy and his detractors off his back for now, he needed to cash in more favors, allocate more funds, and make more promises - at least while he focused on the second problem. The instability of the Urol government in the Philippines remained a major problem; now that Malaya had slipped from their grasp, the rebels would no doubt act with even greater impunity.\n\nWith a long sigh, Ino prepared to dial a series of familiar phone numbers; he was going to call in some favors owed for years."
 sho.51.a: "The foundations of the house of cards are shaking."

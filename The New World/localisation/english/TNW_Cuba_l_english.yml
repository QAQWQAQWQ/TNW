 CUB_Fulgencio_Batista_hog_desc: "§YPresident\nMilitary Junta§!\n--------------\n§LFulgencio Batista, born in 1901, was a poor rural child who dreamed of greatness. As a teenager, he joined the army and rose from a lowly sergeant to the most powerful man in Cuba. In 1933, he overthrew the existing government in the Sergeants' Revolt, and by 1940 he was elected president, holding absolute power behind the throne.\n\nNow, twenty years later, Batista has taken power again, but times have changed. The once-united Cuban people are now divided by the class struggle, and he must control his allies as much as his enemies. The good old days are gone; Batista faces his greatest crisis."
 CUB_Ramón_Grau_San_Martín_eco_desc: "§YLeader of the Opposition\nCuban Revolutionary Party - Authentic§!\n--------------\n§LRamón Grau, born in 1887, was a medical doctor who entered politics in 1924, becoming a prominent figure in the University of Havana. In 1933, he led the revolution against the existing government, but his government was short-lived.\n\nNow, almost thirty years later, Grau is the leader of the Authentic Party and Batista's most vocal opponent. He is old and tired, but his fight for a free Cuba continues."
 CUB_Carlos_Prio_Socarrás_for_desc: "§YFormer President\nCuban Revolutionary Party - Authentic§!\n--------------\n§LCarlos Prio, born in 1907, was a lawyer and politician who became Cuba's youngest president in 1948. He was the first president to serve a full term since 1928.\n\nBut in 1952, Batista's coup ended Prio's presidency. He has since been in exile, planning his return to Cuba. His revolution is coming, and Batista will not be able to stop it."
 CUB_Eduardo_Chibás_sec_desc: "§YLeader of the Opposition\nCuban People's Party§!\n--------------\n§LEduardo Chibás, born in 1907, was a fierce critic of corruption and a charismatic leader. He was the founder of the Orthodox Party, which fought against government corruption.\n\nIn 1951, Chibás shot himself on live radio, but his death was not in vain. His legacy lives on in the hearts of the Cuban people, and his revolution continues."
 CUB_Fidel_Castro_hog_desc: "§YLeader of the 26th of July Movement\nRevolutionary§!\n--------------\n§LFidel Castro, born in 1926, was a lawyer and revolutionary who led the attack on the Moncada Barracks in 1953. He was captured and exiled to Mexico, where he met Che Guevara and planned his return to Cuba.\n\nNow, Castro is in the Sierra Maestra mountains, leading a small band of rebels against Batista's regime. The revolution has begun, and nothing will stop it."
 CUB_Ernesto_Guevara_eco_desc: "§YSecond-in-Command of the 26th of July Movement\nRevolutionary§!\n--------------\n§LErnesto Guevara, known as Che, was born in Argentina in 1928. He was a doctor who fought in the Guatemalan revolution, and later met Fidel Castro in Mexico.\n\nChe is now the comandante of the revolutionary army, leading the guerrilla campaign against Batista. His dream is a free and socialist Cuba."
 CUB_Nicolás_Guillén_for_desc: "§YPoet and Diplomat\nPeople's Socialist Party§!\n--------------\n§LNicolás Guillén, born in 1902, was Cuba's greatest poet. He was a communist and a supporter of the Cuban revolution.\n\nNow, Guillén is the diplomatic face of the Cuban communists, using his poetry to spread the message of revolution."
 CUB_idea_the_cuban_revolution: "The Cuban Revolution"
 CUB_idea_the_cuban_revolution_desc: "The revolution that began with the attack on the Moncada Barracks continues in the mountains of the Sierra Maestra. Fidel Castro and his rebels are fighting against Batista's regime, and the future of Cuba hangs in the balance."
 CUB_idea_batistas_corrupt_regime: "Batista's Corrupt Regime"
 CUB_idea_batistas_corrupt_regime_desc: "Batista's regime is known for its corruption and brutality. The people of Cuba are suffering, and the revolutionaries are gaining strength. The end is near for Batista."

 POLITICS_DAVID_LANSANA_DESC: "When the world trembled before German panzers and Japanese warships, the old masters fell, and new nations hoped to break their chains of bondage and rise from the ruins of old empires. Among them was a nation called the Republic of Sierra Leone — once just another of Britain's many African colonies, now a fledgling democracy that seemed doomed not to last. Four days after the republic's founding, the new government was established through democratic elections, only for Brigadier David Lansana to order his troops to occupy the capital.

David Lansana was born in 1922 into a prominent Mende family, and was one of the few selected from the colony to receive military training in Britain. Returning home, he married the daughter of a Mende chief, further expanding his political connections. When the British hastily withdrew from Africa, Lansana became commander of the Sierra Leone army. Though he claimed to support Sierra Leone's democracy, when the opposition party won Sierra Leone's first election, he did not hesitate to overthrow the elected government — now, he is the new head of state of the Republic of Sierra Leone.

To outside observers, Lansana's regime looks precarious, riddled with serious ethnic conflict (thanks to the waves of Sierra Leonean nationalism and supremacism), while military men like Andrew Juxon-Smith and local warlords have risen through the ranks thanks to their open alliance with Lansana. As the power in Lansana's hands shifts more frequently, Sierra Leone's economy grows ever more turbulent. It seems that if the general wants to hold onto his power and his paper-thin regime, he must hope that the opposition does not stand united — not yet, at least."

 MDI_idea_disloyal_army: "Disloyal Army"
 MDI_idea_disloyal_army_desc: "The army mirrors Sierra Leone's precarious political situation: chaotic, divided, and fractured. The military backed David Lansana's coup, and the most powerful generals recognize him; yet the ranks remain rife with dissent, most notably a small faction centered around Andrew Juxon-Smith.

The army is not only disloyal but also disunited. Mende-born generals and officers generally support their kinsman Lansana, but Creoles, Temnes, and other ethnic groups see Juxon-Smith as a more amiable leader. That is bad enough, but rumors of a counter-coup are spreading like wildfire, making the situation even worse. Lansana has no intention of giving up the throne he barely warmed. One thing is certain: the struggle between Sierra Leone and its army is far from over."
 MDI_idea_disorganized_political_spheres: "Disorganized Political Spheres"
 MDI_idea_disorganized_political_spheres_desc: "Coups d'état on the ruins of West Africa tend to share certain traits: rapid, frequent, and utterly chaotic. By that measure, David Lansana's Sierra Leone coup seems perfectly on script. Now, supporters of every movement are loudly proclaiming their policies in the capital, and Lansana's new government is trying to gain a foothold on this most ungovernable of lands.

With the various opposition groups fueling the chaos, Lansana's government grows ever more disorganized. Supporters of the ousted Prime Minister Milton Margai have not dispersed and still wield some influence in politics; the people are cheering for the rising star Siaka Stevens; the generals are whispering that they need a more unified leader, and they have already set their sights on Andrew Juxon-Smith. Everything points to the Sierra Leonean sonata reaching its climax on waves of chaos."

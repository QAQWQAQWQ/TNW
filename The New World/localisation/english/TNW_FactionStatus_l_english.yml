 ITA_Rome_Pact_Member: "Rome Pact Member"
 ITA_Rome_Pact_Member_desc: ""
 ITW_temp_faction_member: "Levant Defense Agreement Member"
 ITW_temp_faction_member_desc: "[This.GetNameDefCap] is a member of [This.GetFactionName]. They are in a faction, so if a member is attacked or enters a war, other members will join to support their allies. In this great world, faction members help each other, projecting collective will upon other nations. Factions are not limited to the military; they extend to economic cooperation and other forms of mutual benefit."
 OFN_Suspended_Member: "OFN Membership Suspended"
 OFN_Suspended_Member_effect: "[!OFN_Suspended_Member]"
 OFN_Suspended_Member_desc: "Suspension of OFN membership is rare, and offending states usually face sanctions and other penalties. Suspension is usually for human rights violations, subversion of democracy, or other conduct contrary to core OFN values. For the suspended state, this is a diplomatic disaster; Germany, Japan, and even the United States will not want to work with them. The road back to the OFN is long and hard, but not impossible."
 BRA_Hegemon_of_South_America: "South American Hegemon"
 BRA_Hegemon_of_South_America_effect: "[!BRA_Hegemon_of_South_America]"
 BRA_Hegemon_of_South_America_desc: "The bells of war have rung, and millions of Brazilians march, fighting to win their country the position of South American hegemon. Allies brought in by the Foreign Ministry and small states forced into Brazil's orbit join the fight. They proclaim that if no one stands up to stop Argentina's crimes, they are letting them run riot and ravage the South American continent.\n\nThis is a battle they cannot lose: God is on their side, on the side of South American justice."
 ARG_Hegemon_of_South_America: "South American Hegemon"
 ARG_Hegemon_of_South_America_effect: "[!ARG_Hegemon_of_South_America]"
 ARG_Hegemon_of_South_America_desc: "In the streets of Buenos Aires, patriotic men, women, and children line up to defend their homes, to stop the northern barbarians' iron hoofs and throw off Brazilian imperialist oppression. Their allies are across the Río de la Plata; they will destroy the barbarian threat once and for all, so that the South American continent has only one hegemon.\n\nThis is a battle they cannot lose: God is on their side, on the side of South American justice."
 BRA_aligned_state: "South American Defense Alliance Member"
 ARG_aligned_state: "Plate Basin Alliance Member"

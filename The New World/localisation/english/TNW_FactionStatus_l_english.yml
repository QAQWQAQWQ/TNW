l_english:
 CURRENT_FACTION_STATUS_SHORT_TT: "§Y[This.GetFactionStatus_name]§![This.GetFactionStatus_effect]"
 CURRENT_FACTION_STATUS_TT: "[This.GetFactionStatus_tooltip]"
 CURRENT_FACTION_STATUS_SHORT_FROM_TT: "§Y[FROM.GetFactionStatus_name]§![FROM.GetFactionStatus_effect]"
 CURRENT_FACTION_STATUS_FROM_TT: "[FROM.GetFactionStatus_tooltip]"
 FactionStatus_tooltip: "§L[This.GetFactionStatus_desc]§!"
 Generic_Faction: "[This.GetFactionName] Member"
 Generic_Faction_desc: "[This.GetNameDefCap] is a member of [This.GetFactionName]. They are in a faction, so if a member is attacked or enters a war, other members will join to support their allies. In this great world, faction members help each other, projecting collective will upon other nations. Factions are not limited to the military; they extend to economic cooperation and other forms of mutual benefit."
 #Stahlpakt#
 Stahlpakt_Leader: "Stahlpakt Council Chair"
 Stahlpakt_Leader_desc: "Annual GDP Growth modifier: §Y+10%§!\n\nThe Stahlpakt was founded jointly by Germany and Italy, marking the rebirth of a pan-European order. The old decaying nations and their rotten alliances have long since vanished; under the guidance of the European great powers, the continent has remade its own destiny with brotherhood and unity.\n\nThe Führer and the Duce created it, and those who came after forged it stronger. Driven by shared needs, an alliance bound by economic, political, and military ties stands atop Europe. The council chairs, backed by power, hold absolute sway over this alliance."
 Stahlpakt_roma_Leader: "Stahlpakt Council Chair"
 Stahlpakt_roma_Leader_desc: "Annual GDP Growth modifier: §Y+10%§!\n\nThe Stahlpakt was founded jointly by Germany and Italy, marking the rebirth of a pan-European order. The old decaying nations and their rotten alliances have long since vanished; under the guidance of the European great powers, the continent has remade its own destiny with brotherhood and unity.\n\nThe Führer and the Duce created it, and those who came after forged it stronger. Driven by shared needs, an alliance bound by economic, political, and military ties stands atop Europe. The council chairs, backed by power, hold absolute sway over this alliance."
 Stahlpakt_member: "Stahlpakt Member"
 Stahlpakt_member_desc: "Annual GDP Growth modifier: §Y+8%§!\n\nA member state is a country that has formally signed a treaty, completed accession procedures, and achieved allied status de jure and de facto. Such a state enjoys all rights conferred by the pact while bearing all obligations stipulated by treaty. They acknowledge the council's supreme leadership and abide by its decisions in military, diplomatic, and economic affairs."
 Stahlpakt_Reichskommissariat: "Reichskommissariat"
 Stahlpakt_Reichskommissariat_desc: "Annual GDP Growth modifier: §Y+10%§!\nGDP sent to sphere leader ratio modifier: §Y10%§!\n\nReichskommissariate are occupation administrations established by Germany in the east, exercising governance on Germany's behalf. Each is headed by a Reichskommissar with nearly unlimited authority, overseeing settlement and resource extraction, though legislation still follows the East Ministry's directives."
 Stahlpakt_observer: "Friendly State"
 Stahlpakt_observer_desc: "Annual GDP Growth modifier: §Y+2%§!\n\nFriendly states have not formally signed treaties or joined the Stahlpakt. They maintain this state for two reasons: strategic needs, and complex or unfavorable geopolitical circumstances.\n\nStrictly speaking, they are not alliance members, but the Stahlpakt still regards them as important partners and targets for outreach. In certain circumstances, they may be invited to relevant conferences, maintaining coordination outside the alliance framework."
 Stahlpakt_Commonwealth: "Commonwealth"
 Stahlpakt_Commonwealth_desc: "GDP Growth Rate: §Y+3.5%§!\n\nAfter the Second World War, the once-mighty British colonial empire was devastated. The former foremost colonial power now clings to a few isolated islands, sustaining a weak, hollowed-out Commonwealth. Unlike the strategy-minded Germans, the Italians' hunger for colonies was direct and urgent; they sought to become the new colonial great power, and decaying Britain was their first target.\n\nToday's Commonwealth is effectively moribund. Overseas colonies have broken away, African territories have been carved up. Its remaining value seems to be as a piece in Germany's United Pact propaganda, meant to attract members of the old British system into its fold. Yet even this last propaganda value has evaporated before the hard reality of power politics."
 Pakt_French_community: "French Community"
 Pakt_French_community_desc: "Annual GDP Growth modifier: §Y+5%§!\n\nAfter the Second World War, the crisis-ridden French colonial empire urgently needed to reform its rigid governance. At the same time, Germany needed a more legitimate identity for intervening in colonial affairs. Thus, at Germany's behest, the \"French Community\" was born. Nominally meant to maintain ties between France and its overseas territories, its true purpose was to consolidate German indirect rule over the vast colonies.\n\nThough called \"common,\" real power always rests with Germany. France is pushed to the front as the nominal leader, actually handling governance duties Germany prefers not to handle directly. This French-speaking political circle is on one hand a symbol of \"stable continuation of the colonial empire,\" and on the other a diplomatic banner Germany uses to attract other French-speaking regions into its sphere."
 UA_Member: "Ural Alliance Member"
 UA_Member_effect: "[!UA_Member]"
 UA_Member_desc: "Defense modifier: §Y5%§!\n\nIn the former Soviet Union, Orenburg and the Ural Alliance in the southern Urals have formed a military alliance to jointly counter the threat of the Magnitogorsk and Dillerwange bands."
 AS_Member: "African Shield Member"
 AS_Member_effect: "[!AS_Member]"
 AS_Member_desc: "Defense modifier: §Y5%§!\n\nAs Germany sinks into chaos after the death of Führer Adolf Hitler, the three Reichskommissariats of §YCentral Africa§!, §YSouth West Africa§!, and §YEast Africa§! have, under Commissioner Hans Hüttig, formed the §YAfrican Shield§! military alliance to ensure German interests in Africa are safe from foreign interference until Germania's return."
 Pakt_Leader: "Master of Europe"
 Pakt_Leader_effect: "[!Pakt_Leader]"
 Pakt_Leader_desc: "The United Pact is the pan-European alliance forged by the Nazi New Order. The old order of decadent states and their corrupt vassals has crumbled; under German hegemony, Europe has replaced it with brotherhood and unity. The Pact's numerous statutes regulate economic, military, and political ties among member states, all ultimately aimed at German interests. With unparalleled control over European affairs, the United Pact truly plays a pivotal role, and the §YMaster of Europe§! - Germany - remains the key to dominating the world."
 Pakt_Military_Authority: "Military Administration Zone"
 Pakt_Military_Authority_effect: "[!Pakt_Military_Authority]"
 Pakt_Military_Authority_desc: "GDP Growth Rate: §R-3.5%§!\n\nThe §YMilitary Administration Zone§! is a German authority established after military occupation, directly answering to the Army High Command. With its special powers, the military administration manages all affairs in its territory, overseeing police, intervening in local administration, and most importantly, closely monitoring the garrison for any misconduct. By all these means, the §YMilitary Administration Zone§! is recognized as the most tightly controlled region under German rule."
 Pakt_Protektorat: "Protectorate"
 Pakt_Protektorat_effect: "[!Pakt_Protektorat]"
 Pakt_Protektorat_desc: "GDP Growth Rate: §Y3.5%§!\nGDP sent to sphere leader ratio modifier: §Y3.5%§!\n\nThe §YProtectorate§! is a rump of a former state almost fully integrated into Germany. According to Germania's description, the §YProtectorate§! is a special German region with the right to handle internal affairs and a degree of autonomy. But behind this surface autonomy, political and economic power still rests with Germania. Their economies are dominated by German corporations, their politics approved by the German seal. The §YProtectorate§! is an extension of the German shadow, though not all German dependencies use this name, nor may the §YProtectorate§! be the same."
 Pakt_Integrated_Reichskommissariat: "Integrated Reichskommissariat"
 Pakt_Integrated_Reichskommissariat_effect: "[!Pakt_Integrated_Reichskommissariat]"
 Pakt_Integrated_Reichskommissariat_desc: "GDP Growth Rate: §R-7.5%§!\nGDP sent to sphere leader ratio modifier: §Y5%§!\n\nThe §YIntegrated Reichskommissariat§! is a colonial administration run by Germany, preparing for future annexation. The government is increasingly tied to the German mainland, to the point where corporations and personnel can now cross borders freely. Likewise, more and more political appointments within the §YReichskommissariat§! are merely signs that it will soon become another German province."
 Pakt_Autonomous_Reichskommissariat: "Autonomous Reichskommissariat"
 Pakt_Autonomous_Reichskommissariat_effect: "[!Pakt_Autonomous_Reichskommissariat]"
 Pakt_Autonomous_Reichskommissariat_desc: "GDP Growth Rate: §R-5%§!\nGDP sent to sphere leader ratio modifier: §Y7.5%§!\n\nLike the integrated Reichskommissariat, the §YAutonomous Reichskommissariat§! is not a state but a colonial government of Greater Germany, preparing for inevitable annexation. These administrative regions are led by commissioners appointed by the Führer, usually granted a degree of autonomy under strict Germania supervision. This autonomy stems either from distance from the center or special regional circumstances. Whatever the reason, this facade of autonomy applies only to the elite, who alone decide how to use it."
 Pakt_Reichsland: "Reichsland"
 Pakt_Reichsland_effect: "[!Pakt_Reichsland]"
 Pakt_Reichsland_desc: "GDP Growth Rate: §Y4%§!\nGDP sent to sphere leader ratio modifier: §Y2.5%§!\n\nThis region is a §YReichsland§!. Though legally and internationally still part of Germany, its government consists of local collaborators who legitimize and coordinate German rule."
 Pakt_Marionettenstaat: "Puppet State"
 Pakt_Marionettenstaat_effect: "[!Pakt_Marionettenstaat]"
 Pakt_Marionettenstaat_desc: "GDP Growth Rate: §Y4.5%§!\n\nThe §YPuppet State§! is nominally an independent member of the United Pact, yet its relationship with Germany is so close that during Pact council votes it votes entirely according to the German position, fully following the stance proposed by the German representative. Germans fill the streets, corporations, barracks, and government halls of these states, reflecting their support for the pan-European ideal. Comrade states are all Germany's comrades, but the §YPuppet State§! is closer, dancing to its master's control to the loud strains of the Horst-Wessel-Lied."
 Pakt_Mitstreiter: "Comrade State"
 Pakt_Mitstreiter_effect: "[!Pakt_Mitstreiter]"
 Pakt_Mitstreiter_desc: "GDP Growth Rate: §Y7.5%§!\n\nGreater Germany's §YComrade States§! have thrown off the shackles of decadence and entered a new era. Under the United Pact's banner of European unity and prosperity, they are regarded as Germany's close comrades, their fates intertwined with Germany's. Germania insists this is a relationship of mutual aid and shared prosperity, though in reality the so-called comradeship is less an equal partnership and more an instrument."
 Pakt_Bundnispartner: "Friendly State"
 Pakt_Bundnispartner_effect: "[!Pakt_Bundnispartner]"
 Pakt_Bundnispartner_desc: "GDP Growth Rate: §Y10%§!\n\nAs §Yfriendly states§! of Greater Germany, these nations see the opportunity to cooperate peacefully with and receive mutual aid from Europe's greatest nation, joining the United Pact as equal partners. Now regarded as Germany's ally on the global stage, they must abide by the numerous treaties and responsibilities the alliance entails. Though brotherly unity is nominally why they joined, the lure of economic prosperity and security is often what actually draws nations into this less-than-equal relationship."
 Pakt_Ordensstaat: "Order State"
 Pakt_Ordensstaat_effect: "[!Pakt_Ordensstaat]"
 Pakt_Ordensstaat_desc: "GDP Growth Rate: §R-10%§!\n\nThe §YOrder State§! stands apart in the United Pact as a military-administrative entity controlled by the SS. Though politically, militarily, and economically part of Germany and obeying the Führer, in fact the §YOrder State§! is nothing less than the private domain of Reichsführer-SS Heinrich Himmler. Little information about its inner workings is public, but rumors claim it is rife with total, absolute control over citizens' behavior, speech, and even thoughts. Germany's surface control over the §YOrder State§! is shaky, and a single spark could ignite into flame."
 Pakt_Observer: "United Pact Observer State"
 Pakt_Observer_effect: "[!Pakt_Observer]"
 Pakt_Observer_desc: "GDP Growth Rate: §Y5%§!\n\nThis country has close relations with Germany and its United Pact partners, and has been granted §Yobserver status§! in the organization. While independent of the United Pact, it has the right to participate in some Pact-related projects and activities, as well as share some of the duties and obligations of Pact member states."
 Anti_Heydrich_Pact: "Anti-Heydrich Pact"
 Anti_Heydrich_Pact_effect: "[!Anti_Heydrich_Pact]"
 Anti_Heydrich_Pact_desc: "A terrible, unthinkable outcome is now a startling possibility. Reinhard Heydrich - the butcher of Prague, the executioner, Himmler's protégé - might win the German Civil War and become the next Führer.\n\nOne might say such an outcome is surely delusion. To prevent the fatherland from falling, the other factions in the civil war have agreed to set aside their differences and accept an informal truce. As long as Heydrich lives, as long as he threatens Germany and everything Germany represents, the factions will not fight each other. They will unite to destroy this madman and his allies.\n\n§xIf they fail, then only God can have mercy on Germany.§!"
 Anti_Himmler: "Anti-Himmler Encirclement"
 Anti_Himmler_effect: "[!Anti_Himmler]"
 Anti_Himmler_desc: "In the eyes of many Germans, forming the so-called \"Anti-Himmler Encirclement\" is unnecessary. After all, who outside the SS hasn't opposed Himmler and his lunatics over the decades? Still, no name suits this vast, disorderly alliance better, united under Reinhard Heydrich - once Himmler's star pupil - to resist Himmler's black legions. Once again, any action that unites everyone from democrats to militarists to SS men must be rooted in a common hatred of a shared enemy.\n\nIt is the human devil Himmler, who planned in his Nanzig bunker the plan that would end the world, and only he could make all his rivals set aside their disputes and unite. Once Himmler is in hell, this fragile alliance will disintegrate, and today's united comrades will become tomorrow's mortal enemies. Though everyone knows this, only a complete fool would stab others in the back; after all, if the world ends today, what's the point of scheming for tomorrow?"
 GER_HGR_Anti_Himmler: "Anti-Himmler Encirclement"
 GER_HGR_Anti_Himmler_effect: "[!Anti_Himmler]"
 GER_HGR_Anti_Himmler_desc: "In the eyes of many Germans, forming the so-called \"Anti-Himmler Encirclement\" is unnecessary. After all, who outside the SS hasn't opposed Himmler and his lunatics over the decades? Still, no name suits this vast, disorderly alliance better, united under Reinhard Heydrich - once Himmler's star pupil - to resist Himmler's black legions. Once again, any action that unites everyone from democrats to militarists to SS men must be rooted in a common hatred of a shared enemy.\n\nIt is the human devil Himmler, who planned in his Nanzig bunker the plan that would end the world, and only he could make all his rivals set aside their disputes and unite. Once Himmler is in hell, this fragile alliance will disintegrate, and today's united comrades will become tomorrow's mortal enemies. Though everyone knows this, only a complete fool would stab others in the back; after all, if the world ends today, what's the point of scheming for tomorrow?"
 Anti_Heydrich: "Himmler Loyalists"
 Anti_Heydrich_effect: "[!Anti_Heydrich]"
 Anti_Heydrich_desc: "It is hard to find anyone still standing with a devil like Himmler after he showed his hand. Germany is already torn apart, and the man who brought this about is Reinhard Heydrich, once hailed as the future of the Aryan race and now the most powerful renegade alive. His rebellion has forced every person in Europe, German or not, to choose sides. These people chose to stand with Himmler.\n\nThey were once weak, but now they are more united and powerful than ever. Heydrich's brilliant victory in the German Civil War has won the Himmler-loyal SS countless weapons and ready high offices, which they now use to destroy the decadent barbarians who would undo the Aryan struggle. Among them, many fight for the Burgundian system and Aryanist faith, others for Himmler himself, and only a tiny handful defend - or even know - Himmler's true plan. But aside from this difference, they are all well-equipped, well-trained, death-defying, and highly dangerous warriors. It stands to reason they will not stop until Burgundy's black sun shines over every inch of Europe."
 Sphere_Leader: "Master of the Sphere"
 Sphere_Leader_effect: "[!Sphere_Leader]"
 Sphere_Leader_desc: "The Greater East Asia Co-Prosperity Sphere, usually shortened to \"the Sphere,\" is an East Asian international organization established during the 1943 Greater East Asia Conference. The Joint Declaration for the Greater East Asia was formally signed at this conference, later revised, formally establishing the Sphere as an international political entity, with various sub-organizations at the political, economic, and military levels.\n\nAside from a few voluntary members, the Sphere is filled with colonial governments in name and reality, serving their Japanese masters. Most importantly, it is a further extension of the Empire's chains.\n\nAs the permanent chair of the Sphere Council and the Greater East Asia Peace Agency, we receive a large share of membership dues and have the authority to deploy member states' armies in times of crisis. Furthermore, we can transfer a portion of member states' industrial capacity to our use based on their degree of dependence on the Sphere."
 Sphere_Core_Member: "Sphere Member - Core Member"
 Sphere_Core_Member_effect: "[!Sphere_Core_Member]"
 Sphere_Core_Member_desc: "GDP Growth Rate: §Y10%§!\nGDP sent to sphere leader ratio modifier: §Y7.5%§!\n\nWhen Pan-Asian co-prosperity was founded under the special Japan-Manchukuo-China relationship, Xinjing and Nanjing were pressured in 1940 to tie their economies to Japan's war machine. The cultural ties between the two puppet regimes and Japan, plus their early participation in Japan's so-called \"holy war to liberate Asia,\" won them permanent seats on the Sphere Council.\n\nYet though the two are legally above other Sphere members, reality is far less rosy. Both Xinjing and Nanjing must send more defense and infrastructure funds to Japan because of their important Sphere status. Not to mention the so-called \"core member\" is merely a pretext for extorting the Chinese people, but neither the southern \"Republic\" nor the northern \"Empire\" will abandon the title on which their legitimacy depends."
 Sphere_Coequal: "Sphere Member - Independent Member"
 Sphere_Coequal_effect: "[!Sphere_Coequal]"
 Sphere_Coequal_desc: "GDP Growth Rate: §Y10%§!\n\nThis country is an independent member of the Greater East Asia Co-Prosperity Sphere, having joined voluntarily rather than as a forced puppet. Most of these states participated in the 1943 Greater East Asia Conference as founding members.\n\nThough independent members' internal affairs are not directly interfered with by Tokyo, their economies are still influenced by the Japanese economic sphere, so Japan can still exert significant influence."
 Sphere_Economic_Dependent: "Sphere Member - Economic Dependent"
 Sphere_Economic_Dependent_effect: "[!Sphere_Economic_Dependent]"
 Sphere_Economic_Dependent_desc: "GDP Growth Rate: §Y3%§!\nGDP sent to sphere leader ratio modifier: §Y2.5%§!\n\nThis country's economy depends on Sphere financial support to survive. To receive Japanese aid, it must accept supervision by Sphere-appointed \"advisers\" and repay debts to the Japanese treasury annually.\n\nThese \"advisers\" ensure the government does not abuse its limited autonomy or act against Tokyo's wishes.\n\nIn certain common misfortunes, if a country cannot repay its loans to Japan on time, it has no choice but to make further concessions, becoming a fully dependent Sphere member."
 Sphere_Fully_Dependent: "Sphere Member - Fully Dependent"
 Sphere_Fully_Dependent_effect: "[!Sphere_Fully_Dependent]"
 Sphere_Fully_Dependent_desc: "GDP Growth Rate: §Y3%§!\nGDP sent to sphere leader ratio modifier: §Y5%§!\n\nDue to defaulted Japanese debts, policy failures, and so on, this country's internal affairs are completely controlled by Japan through Japanese \"advisers\" in its government departments.\n\nIn this country, head of state, head of government, ministers, and military leaders are almost entirely ceremonial. Any government decision must first be reviewed by these \"advisers\" to ensure it does not go against Tokyo's wishes. Thus, the entire state machine actually serves only Japanese interests, while the interests of its own citizens come second, or perhaps worse."
 Sphere_Imp_Protectorate: "Japanese Military Government"
 Sphere_Imp_Protectorate_effect: "[!Sphere_Imp_Protectorate]"
 Sphere_Imp_Protectorate_desc: "GDP Growth Rate: §R-3%§!\nGDP sent to sphere leader ratio modifier: §Y3.5%§!\n\nThis region is administered by a Japanese military government established temporarily or long-term, directly answering to the High Command in Tokyo, with the local civilian government holding essentially no real power. This is the most direct form of Japanese influence over a country short of outright annexation."
 Sphere_Corporate_Dependency: "Corporate Dependency"
 Sphere_Corporate_Dependency_effect: "[!Sphere_Special_Econ_Zone]"
 Sphere_Corporate_Dependency_desc: "GDP Growth Rate: §Y10%§!\nGDP sent to sphere leader ratio modifier: §Y10%§!\n\nThe state of Guangdong is less a country than a playground for giant corporations, its main purpose being to facilitate trade and cheap manufacturing for local electronics firms, allowing the latter to exert political influence through representatives seated in the legislature. The entire country - especially its urban areas - is essentially unbound by trade law, with no restrictions whatsoever. Sweatshops are everywhere, and corporate imagery is omnipresent, to the point where people forget that Japan, not the corporations, is the ultimate beneficiary of this monstrosity."
 Sphere_Observer: "Sphere Observer State"
 Sphere_Observer_effect: "[!Sphere_Observer]"
 Sphere_Observer_desc: "GDP Growth Rate: §Y5%§!\n\nThrough multilateral political-economic agreements and relatively low-level joint military training, this country is gradually becoming a formal member of the Greater East Asia Co-Prosperity Sphere. Though such countries suffer from Japanese product dumping and their economies are constrained by Japanese investment, they can usually avoid Japanese political interference at the political level, so Tokyo does not fully control them."
 NLF_Leader: "Third United Front Leader"
 NLF_Leader_effect: "[!NLF_Leader]"
 NLF_Leader_desc: "After the defeat of the Second United Front, China was trampled by Japan, its nation broken and its people destroyed.\n\nThis must never happen again.\n\nLong Yun, known as the \"Yunnan King,\" has returned. The remnants of the Second United Front scattered across Southeast Asia have united; from Yunnan to the northeast, anti-Japanese forces have joined together in the Third United Front to resist Japanese imperialist oppression of the people. Some cast aside by history dismiss this as futile, mere empty bloodshed. But the spark of hope in Chinese children's hearts can start a prairie fire, and no one can extinguish it. When liberation day comes, the surging hope of the people's march will make even the Empire of the Rising Sun fall."
 NLF_Member: "Third United Front Member"
 NLF_Member_effect: "[!NLF_Member]"
 NLF_Member_desc: "Unit Attack: §G+10%§!\nUnit Defense: §G+10%§!\nDivision Org Recovery: §G+10%§!\nSuggested War Support: §G+30%§!\n\nThe War of Resistance never truly ended - but will this latest confrontation end the same way, or end in victory?\n\nThis is the question posed by the numerous warlords who still rule large swathes of China. Once, the people of this territory fought tirelessly to stop Japan from conquering the Chinese nation. But when the Japanese defeated Mao and Chiang, who had defended Chongqing, the desperate people scattered, and the United Front dissolved. After twenty years of suffering, a new United Front is born, and the Chinese people are united once more. Though some may condemn overthrowing Japanese tyranny as suicidal, we feel no regret. Better to be a hero for one day than to serve Japan willingly like a Nanjing traitor. The legacy of the Third United Front, win or lose, will inspire the Chinese people to overcome all hardships and rise up against their oppressors."
 OFN_Leader_of_The_Free_World: "Leader of the Free World"
 OFN_Leader_of_The_Free_World_effect: "[!OFN_Leader_of_The_Free_World]"
 OFN_Leader_of_The_Free_World_desc: "Under threats to its survival from both the Atlantic and Pacific, the United States must seek allies wherever possible and draw a red line the enemy must never cross. This superpower swears that no matter the cost, no matter the circumstances, its leader and its military will stand guard faithfully on the narrow border between the sane world and the mad world.\n\nGovernments and oppressed peoples who recognize this look to Washington for guidance, shelter, and material support. Yet America's glory comes with an unwritten rule: America must continue to uphold its self-proclaimed high moral standards internationally, lest the children of the free world suddenly discover that the ideal nation they pursue does not actually exist..."
 OFN_Independent_Member: "OFN Independent Member"
 OFN_Independent_Member_effect: "[!OFN_Independent_Member]"
 OFN_Independent_Member_desc: "GDP Growth Rate: §Y10%§!\n\nThe OFN is first and foremost a mutual defense alliance of free, democratic nations, composed of signatories to the San Francisco Charter, who (except in certain cases) must abide by Article 3: \"maintain and develop their own and collective capacity to resist armed attack.\" The council consists of representatives from member states, each with one vote, managing the alliance's day-to-day and long-term affairs.\n\nIndependent members are states politically, economically, and militarily independent of the United States. The first independent members were Canada, Australia, Iceland, and New Zealand."
 OFN_Dependent_Member: "OFN Dependent Member"
 OFN_Dependent_Member_effect: "[!OFN_Dependent_Member]"
 OFN_Dependent_Member_desc: "GDP Growth Rate: §Y5%§!\n\nFor member states without the resources or manpower to maintain self-defense forces, Article 5's requirement that signatories \"assist one or more parties under attack... by employing armed force\" would severely strain their economies by maintaining large standing armies. Given these constraints, small OFN states often argued fiercely until a compromise was written into the San Francisco Charter.\n\nThe current \"dependent status clause\" exempts member states meeting a strict set of criteria from Article 5 obligations. American forces effectively bear the military burden on their behalf. As of 1962, only the West Indies Federation, Haiti, British Honduras, Guyana, Suriname, Fiji, and the Faroe Islands hold this special status."
 OFN_Military_Government: "American Military Government"
 OFN_Military_Government_effect: "[!OFN_Military_Government]"
 OFN_Military_Government_desc: "GDP Growth Rate: §R-2.5%§!\n\nSince the reconstruction era, the US has had experience establishing military districts, where occupied populations are under military law rather than local civil law. To achieve immediate peace and stability in war-torn or disputed regions, military governments are overseen by generals and include a significant number of American troops. The administration may for some reason decide to continue this practice in the modern day."
 OFN_Mandate: "OFN Mandate"
 OFN_Mandate_effect: "[!OFN_Mandate]"
 OFN_Mandate_desc: "GDP Growth Rate: §R-5%§!\n\nGiven the objectives laid out by its founders, the OFN is not only expected but required to intervene in conflicts affecting the free world's interests. Political entities born from these states often lack the stability, institutions, and experience to sustain their post-independence democracies.\n\nArticle 12 of the San Francisco Charter foresightfully authorizes the OFN to establish civil administrations in such political entities until local governments are capable of independently overseeing free, fair elections within their jurisdiction. It is hoped that this transitional period will help build nations that can better control their own destinies than before."
 OFN_Interim_Authority: "Interim Authority"
 OFN_Interim_Authority_effect: "[!OFN_Interim_Authority]"
 OFN_Interim_Authority_desc: "Stability modifier: §G+15%§!\n\nThe OFN has no authority to directly govern other nations' territory. However, the alliance can cooperate with other governments to establish stable, democratic regimes in war-affected regions. An Interim Authority is a kind of embryonic state, its security and stability ensured by OFN forces stationed in the country, while government functions are carried out by transitional institutions.\n\nInterim Authorities can be established under various circumstances, but their purpose is always to establish a democratic regime closely tied to the United States. The Interim Authority is the foundation by which a country gradually evolves from military force into a nascent regime, and eventually into the next OFN member."
 OFN_Observer: "OFN Partner State"
 OFN_Observer_effect: "[!OFN_Observer]"
 OFN_Observer_desc: "GDP Growth Rate: §Y5%§!\n\nThough not a formal OFN member, this country still has close defense ties with the United States and has become an important OFN partner through various agreements. OFN Partner State is an informal designation, characterized mainly by multiple conditional defense extension agreements signed with numerous OFN members.\n\nThe partner program began with the 1950 OFN-OAS defense agreement, which allowed the OFN to guide defense modernization among Organization of American States members. The partner program also facilitates military operations, grants, and other OFN aid. By joining, partners gain observer seats on the OFN Security Council and eventually the path to full OFN membership."
 TRI_Founder_IT: "Triumvirate Founder State"
 TRI_Founder_IT_desc: "GDP Growth Rate: §Y10%§!\n\nItaly's greatest conquest of the 20th century is widely considered to be the creation of the Triumvirate. This alliance is the crown jewel of Imperial diplomacy. As the name suggests, the Triumvirate is a mutual defense treaty between three Mediterranean regional powers, aimed against Greater Germany to the north. But in practice, it is a clever Italian foreign policy. Italy occupies the center of the Mediterranean, and its overseas colonies send a steady stream of wealth to the homeland, making her the Triumvirate's leader.\n\nThe alliance has been on the decline since its founding. Italy is the Triumvirate's main beneficiary and most eager to preserve its integrity. But its allies Iberia and Turkey seem to gain little diplomatic benefit from this partnership. Unless radical action is taken, this political bloc may indeed become little more than Italy and its puppets."
 TRI_Founder_IB: "Triumvirate Founder State"
 TRI_Founder_IB_desc: "GDP Growth Rate: §Y10%§!\n\nOf the Triumvirate's three founder states, the Iberian Union faces the wrathful Germans directly. After all, they seized the former Portuguese African colonies by force and then tried to impose the Gibraltar Dam on them. So far, aside from a pile of grey stones, Iberia and all Mediterranean states have gained nothing but suffering. What of Italy's power projection projects, what of its concerns over Turkish border issues - these are matters of Iberian survival, so Iberia has fought for the Triumvirate's formation and maintenance since its inception.\n\nBut times have changed. In recent years, the Germans seem to be contracting inland, or at least stagnating, and Iberia no longer feels the German threat so acutely. It is time to ask what the Iberian Union's ambitions are and whether the Triumvirate helps achieve them. If not, perhaps it is time to leave; Iberia need not play second fiddle to Italy."
 TRI_Founder_TR: "Triumvirate Founder State"
 TRI_Founder_TR_desc: "GDP Growth Rate: §Y10%§!\n\nUnlike Western nations like Italy and Iberia, the Turkish Republic found itself allied with Italy and the Triumvirate not out of fear of the Germans to the north, but because it provided security for its borders and foreign policy, allowing it to focus on its internal struggles. In the 20th century, this young republic achieved great things, along with a considerable burden: the troubled field of regional minorities. Turkey needed breathing room to address these threats, and the Triumvirate obliged.\n\nBut times have changed, and nations must adapt to survive. Frankly, the Triumvirate is a corpse that refuses to die. It no longer provides Turkey with the security or support it once did, and over the years it has devolved into a prestige project for the Italian leadership. Turkey is once again pressuring the Triumvirate, seeking to break the constraints it imposes on Turkey."
 TRI_Member: "Triumvirate Member"
 TRI_Member_desc: "GDP Growth Rate: §Y5%§!\n\nAs its name suggests, the Triumvirate has three founder states. Even so, the alliance includes more than Italy, Iberia, Turkey, and their respective puppets. Smaller states, caught between several regional powers, have for one reason or another petitioned the founders to join as junior partners.\n\nThese states retain legal autonomy and independence, but economically and diplomatically their interests are largely subordinated to the \"Big Three\" of the Triumvirate. All of this, of course, in exchange for Triumvirate protection. Even so, many consider membership more burden than aid; though these states retain their de jure sovereignty, everyone knows that Rome, Istanbul, and Madrid exert considerable influence over small states seeking to join the Triumvirate."
 TRI_Member_Client: "Triumvirate Client State"
 TRI_Member_Client_desc: "GDP Growth Rate: §R-2.5%§!\n\nLegally, the Triumvirate's various client states, puppet regimes, and regional authorities do not represent subordinate states of the Triumvirate so much as extensions of the mother country. The legal status of Triumvirate clients is unclear; the founders wish to recognize their clients as formal members while trying to prevent the other two from doing the same.\n\nThus, from now until the Triumvirate's dissolution (a matter of when, not if), the status of client states and territories will remain ambiguous. Though they gain little real benefit from the Triumvirate, considerable restraint has so far prevailed within it, but as disintegration becomes reality, every client state realizes one truth: when elephants fight, the ants suffer..."
 TRI_Observer: "Triumvirate Observer State"
 TRI_Observer_desc: "GDP Growth Rate: §Y2.5%§!\n\nOutside the Triumvirate's Mediterranean sphere, one can find associated states known as Triumvirate observer states. Though not formal members, they still participate in relevant affairs and benefit from them. Perhaps one day these states will seek to join as full members... provided the Triumvirate lasts that long."
 LEV_UNION_Member:0 "Levant Union Member"
 LEV_UNION_Member_desc:0 "This country is a member of the Levant Union, a multilateral alliance, economic bloc, and pact born after the Jerusalem Conference - young and vibrant. If the Union survives, perhaps it will pioneer a new model of cooperation between nations..."
 LEV_UNION_Mandate:0 "Levant Union Mandate"
 LEV_UNION_Mandate_desc:0 "This \"state\" is a Levant Union mandate. The Levant Union is a multilateral alliance, economic bloc, and pact born after the Jerusalem Conference. Theoretically, Jerusalem is a completely neutral region, free of the sectarian conflicts that divide the rest of the Levant. However, with the rapid turn of events, whether the Union's mandate system can continue to exist remains to be seen..."
 UFF_Faction: "United Front of the Philippines Co-Founder"
 UFF_Faction_desc: "United we stand, divided we fall.\n\nThis is the credo the United Front of the Philippines lives by. In fact, this expedient alliance is more than that. The §RPeople's Revolutionary Socialist Republic of the Philippines§! and the §DFree Republic of the Philippines§!, though adhering to vastly different ideals, share a common goal: defending Philippine independence and freedom from any rapacious aggressor. Perhaps this alliance will be key to their struggle for freedom; perhaps it will not be enough, for the light of the Rising Sun flickers above their heads..."
 PALF_Faction: "Pan-African Liberation Front Member"
 PALF_Faction_desc: "Unit Attack: §G+15%§!\nDivision Org Recovery: §G+5%§!\n\nThe Pan-African Liberation Front was born from the dreadful Luftwaffe bombings and the Yaoundé Revolution Hall, dedicated to liberating Africa from the demons of colonialism. Headquartered in Cameroon, it crosses borders and cultures, fighting for one goal - the freedom and unity of all Africans.\n\nOf course, Pan-Africanism is not without enemies. The Germans and British occupy everything south of the Sahara, the Italians control another swathe, and the rest has been swept up by the Iberians and French, leaving only a few barren patches. Even so, the PALF continues to fight, biding its time. Opportunity is sure to come, for nothing can oppress the African people forever."
 PALF_Satellite: "Liberation Front Satellite State"
 PALF_Satellite_desc: "Unit Defense: §G+10%§!\nDivision Org Recovery: §R-5%§!\n\nThis country is a Liberation Front satellite, liberated from colonial and reactionary forces by the PALF. Its newly established administration has chosen to cooperate with and accept oversight from the Pan-African Front to eliminate imperialist remnants. Its leaders now pursue Pan-Africanism, dedicated to African unification, even though the country is nominally still independent of the Front and its allies. Under a shared ideology, these liberated satellites will fight alongside the Pan-African Front to build a new future for Africa."
 WAA_Faction: "West African Pact Signatory"
 WAA_Faction_desc: "Core Territory Defense: §G+15%§!\nReinforcement Rate: §G+10%§!\n\nThe rising red flags of the Pan-African movement across West Africa (both metaphorical and literal) led Senegal and other states to spontaneously form a defensive alliance to ensure their security against great powers seeking to violate the region's neutrality. Of course, this alliance is a reluctant measure, not a regional union. In this situation, West African states have no choice but to band together lest they collapse entirely."
 WAA_Protectorate: "West African Protectorate"
 WAA_Protectorate_desc: "Trench Speed: §G+10%§!\n\nThis country is a West African Union protectorate, overseen by a powerful West African Union member. The protectorate may be there by voluntary cooperation or violent coercion. Whatever the reason it became a WAA protectorate, it depends on its ally's military protection and internal stabilization. Without Union support, its government could not survive long. Fortunately, the West African Union is willing to invest in its members."
 FMA_Faction: "French Military Alliance Signatory"
 FMA_Faction_desc: "Division Organization: §G+15%§!\nReinforcement Rate: §G+10%§!\n\nFor nearly twenty years, the French giant was knocked to the ground, but it has found a new home in its former colonies. As its name suggests, the French Military Alliance is a Free France-led bloc of states within the French sphere. Whether from goodwill or pragmatism, the alliance has drawn a line in the West African jungle that radical Pan-Africanists may not cross, and French influence will revive from here.\n\nThe alliance's long-term goals are ambitious, not merely playing power games in the bomb-baptized West African wasteland. Its stated formal purpose is to reclaim the homeland - France itself, four thousand kilometers away. Whether the alliance can achieve such a feat is naturally debatable, but for now its focus is on the West African situation. Free France will reestablish its position in Africa, or go down trying - after so much sacrifice, failure is not acceptable."
 FMA_Puppet: "French Military Puppet State"
 FMA_Puppet_desc: "Division Organization: §G+5%§!\nUnit Defense: §R-5%§!\nGDP sent to sphere leader ratio modifier: §Y5%§!\n\nA familiar flag flies over West African cities - the French tricolor, taken from the dusty boxes where it was stored twenty years ago and once more flying proudly in the wind. Yet a tricolor does not necessarily mean a French city. Instead, these flags also represent certain West African French puppet governments.\n\nCompared to the old colonies, these regions are in every way deeply tied to France except in name. Though the local government is led by African natives, one cannot miss the French soldiers maintaining order on the streets, nor how every decision aligns with Free France's established policy. Soon, these citizens inevitably discover a new truth - they are nothing more than stepping stones on de Gaulle's quest to reclaim France itself."
 PALF_Faction_peace: "Pan-African Liberation Front Member"
 PALF_Faction_peace_desc: "GDP Growth Rate: §Y5%§!\n\nThe Pan-African Liberation Front was born from the dreadful Luftwaffe bombings and the Yaoundé Revolution Hall, dedicated to liberating Africa from the demons of colonialism. Headquartered in Cameroon, it crosses borders and cultures, fighting for one goal - the freedom and unity of all Africans.\n\nOf course, Pan-Africanism is not without enemies. The Germans and British occupy everything south of the Sahara, the Italians control another swathe, and the rest has been swept up by the Iberians and French, leaving only a few barren patches. Even so, the PALF continues to fight, biding its time. Opportunity is sure to come, for nothing can oppress the African people forever."
 PALF_Satellite_peace: "Liberation Front Satellite State"
 PALF_Satellite_peace_desc: "GDP Growth Rate: §Y2%§!\nGDP sent to sphere leader ratio modifier: §Y7.5%§!\n\nThis country is a Liberation Front satellite, liberated from colonial and reactionary forces by the PALF. Its newly established administration has chosen to cooperate with and accept oversight from the Pan-African Front to eliminate imperialist remnants. Its leaders now pursue Pan-Africanism, dedicated to African unification, even though the country is nominally still independent of the Front and its allies. Under a shared ideology, these liberated satellites will fight alongside the Pan-African Front to build a new future for Africa."
 WAF_Faction: "West African Federation Member"
 WAF_Faction_desc: "GDP Growth Rate: §Y5%§!\n\nAs the West African Union shed its last blood for independence, further threats to member independence vanished, and dissolution seemed inevitable. But as the West African conflict ended, the benefits of alliance became apparent, and further cooperation clearly outweighed the alternatives. With no reason to disband, relations between states improved greatly, and consensus was reached."
 WAF_Supervised: "West African Supervised State"
 WAF_Supervised_desc: "GDP Growth Rate: §Y2.5%§!\n\nThis country is a West African supervised state, jointly overseen by West African Federation members to ensure internal stability and help with administrative governance once the country returns to normalcy. These supervised states were born from the ashes of the recent conflict; their situations remain unstable and require external aid to survive. Though nominally not WAF members, they are inextricably tied to the federation and expected to be fully integrated into it in due course."
 FRU_Faction: " "
 FRU_Faction_desc: "The smoke of world war had not cleared when the French colonial empire entered its own storm, its rigid system crying out for reform. At the same time, Germany, hiding its intentions, needed a suitable identity to intervene in colonial affairs.\n\nThus, at Germany's secret behest, the \"French Community\" was born, its true purpose being to consolidate German indirect rule over the French colonies, like an egg hatched in another's nest.\n\nThough called \"common,\" all power rests with Germany behind the scenes. France is pushed to the front as nominal leader, merely handling the \"dirty work\" Germany prefers not to do itself, like a puppet on strings. This French-speaking circle is on one hand a fig leaf for \"stable colonial empire,\" and on the other an enticing banner Germany uses to attract other French-speaking regions into its sphere - impressive in appearance, hollow in substance.\n\nAs for actual colonial administration and control, Germany can rest easy. They need only control the French government to reap the benefits, while all the矛盾 and blame fall on France. A classic shell game, shifting the trouble elsewhere."
 FRU_Associated: " "
 FRU_Associated_desc: "GDP Growth Rate: §Y1.5%§!\nGDP sent to sphere leader ratio modifier: §Y12.5%§!\n\nFrench Community associated states receive the Community's military protection and economic support, but there is no free lunch in this world.\n\nWhat they receive is not merely protection but direct French oversight. In practice, there are limits; French control over associated states varies by location, and most retain considerable autonomy.\n\nRegardless, French influence is everywhere, and they almost completely control the associated states' economies. French expectations are blunt: they want associated states to consider \"when to join the French Community,\" not \"whether to join.\""
 Mano_Member: "Mano River Convention Signatory"
 Mano_Member_desc: "Pan-Africanism won out, but the enemy it identified is not welcome in all West African states. Sierra Leone and Liberia remain stumbling blocks that could trip up the PALF - provided they stand together rather than face off along the river that gives their alliance its name."
 UAS_Member: "Arab United States Member"
 UAS_Member_desc: "From the ashes of the crumbling Italian colonial empire, the Arab United States was born, as many nascent states declared their sovereignty and united to cast off the chains of colonialism and control their own destiny. These revolutionary new states hope to unite the Arab world, building a nation from the Atlas Mountains to the dunes of the Arabian Peninsula, belonging to all Arabs, to defend against the greatest threat to the Pan-Arab experiment - the old imperialist powers."
 INS_leader: "Central Government Leader"
 INS_leader_desc: "The Garuda's promise was empty talk even before the war. Sukarno, Indonesia's founding father, now faces an unprecedented rebellion - one that splits the unitary Republic of Indonesia in two. Sukarno is no stranger to unrest. Separatist rebellions have erupted under his rule, and he has purged those who disagreed with his vision of a united archipelago. \"Unity in Diversity,\" the Garuda promises, its talons raised clutching a Sanskrit scroll bearing these words. Sukarno and his followers are prepared to enter this protracted struggle and persevere in defending this ideal."
 INS_loyalist: "Central Government Loyalist"
 INS_loyalist_desc: "The unitary Republic of Indonesia consists of numerous emergency governments and loyal regional commands, with one faction each in the Sukarnoist strongholds of Jakarta, Surabaya, Makassar, and Palembang - four factions in total. Each harbors its own agenda. Even so, they form a united front against the rebels led by Hatta, and every hard-won victory lays the foundation for the loyalist cause."
 PRIM_leader: "Free Indonesian Republic Government Leader"
 PRIM_leader_desc: "The Garuda's promise was empty talk even before the war. Unity in diversity is the first proposition every Indonesian nationalist should strive for, but the central government always chooses to betray this ideal at the critical moment. Mohammad Hatta once considered himself among the most loyal of Sukarno's inner circle. Now, his disillusionment has transformed the suffering of the nation's thirty years of independence into a wildfire of rebellion. The broken ideal is now realized amid brother fighting brother, and countrymen shed blood for it."
 PRIM_loyalist: "Free Indonesian Republic Government Loyalist"
 PRIM_loyalist_desc: "Though the Free Indonesian government's forces are loose and motley, they still can fight on the battlefield. Since Sukarno decided to continue the centralization path begun by the Sjidik government, resentment of the central government has deepened, ultimately uniting them under this banner. Military committees led by colonels across the country, Islamists in South Sulawesi, separatists in Aceh, and communist militias in Madiun and Surakarta must together face the united front led by the unitary Republic of Indonesia government."
 HUF_Faction: "Haitian United Front Member"
 HUF_Faction_desc: "The alliance between the Haitian government and the People's Party for National Liberation guerrillas led by Jacques Stephen Alexis is a reluctant measure born of necessity. Faced with Trujillo's invasion, the Port-au-Prince government and the PPNL agreed to set aside their feud and jointly repel the Dominican offensive. Perhaps this common struggle will reconcile both sides, or perhaps once Trujillo retreats, the alliance will immediately collapse. Who knows what the future holds? For now, just survive the present."
 HRF_Faction: "Hispaniola Revolutionary Fighters"
 HRF_Faction_desc: "The Dominican Republic after the revolution and the Haitian PPNL once had a sorry, confrontational past, but now the common cause of fighting for the working class unites them. Now, faced with the reactionary forces entrenched in Port-au-Prince and their capitalist masters in Washington, they have officially stood together. From Les Cayes to Punta Cana, the Hispaniola Revolutionary Front will bring liberation to the island's proletariat."
 Sphere_Chinese_Warlord: "Chinese Warlord"
 Sphere_Chinese_Warlord_effect: "[!Sphere_Chinese_Warlord]"
 Sphere_Chinese_Warlord_desc: "Core Territory Defense: §G+20%§!\n\nThe Republic of China was never as unified as it claimed to be. Long before China was engulfed in war, many warlords allied with Chiang Kai-shek surrendered to Wang Jingwei and his government, either out of a simple desire to survive under the New Order or to preserve their strength until a wise leader emerged to turn the tide.\n\nYet though these regimes were nominally subordinate to the Nanjing government, they were highly autonomous politically and militarily. Neither Nanjing nor Tokyo could exert any real influence over warlord-held territory; it is no exaggeration to say that, apart from lacking formal independence, these Chinese \"provinces\" were little different from mature sovereign states."
 ITA_Mediterranean_Bloc_Leader: "Mediterranean Bloc Leader"
 ITA_Mediterranean_Bloc_Leader_desc: ""
 ITA_Mediterranean_Bloc_Member: "Mediterranean Bloc Member"

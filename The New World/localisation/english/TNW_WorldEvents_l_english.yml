 ##### #SPA-basque_war# #####
 Spa_WORLD.1.t:"Basque Conflict Resumes"
 Spa_WORLD.1.d: "Days of tense standoff in the Cantabrian Sea finally erupted today as Basque and Spanish naval vessels collided, sharply escalating the situation.`n`nIn the early hours, Spanish Navy destroyers fired missiles at the Basque capital, and large-scale fighting broke out along the Basque-Spanish border. Following the explosions, both the Greater German Reich and the French State condemned Spain's aggression and mobilized forces along their borders, stating they stand ready to respond to the call of their ally, the Basque Republic.`n`nA U.S. Defense Department spokesperson urged both sides to exercise restraint and resolve the situation through negotiation rather than force, though intelligence indicates that U.S. forces stationed in Spain have already entered their highest state of readiness."
 Spa_WORLD.1.a: "Contact the Pentagon. Keep a close eye on German movements."
 #Manchoukuo event#
 TNW_WORLD.2.t: "Death of Choi Kyu-ha"
 TNW_WORLD.2.d: "At six o'clock this morning, Choi Kyu-ha, incumbent President of the Great Manchurian Republic, suddenly fell into a coma at Jianguo Hospital in Xinjing. Doctors immediately began rescue efforts, performing CPR and other emergency procedures, but ultimately could not save him. Jianguo Hospital issued a statement stating that he had suffered from senile heart disease and circulatory system disorders for years, with a sudden cardiac event as the direct cause of death.`n`nThe Manchurian government convened an emergency committee meeting that evening and, in accordance with the Presidential and National Funeral Act, decided to hold a state funeral for Choi Kyu-ha. His remains were laid to rest at the Xinjing Cemetery of Loyal Patriots. The government appointed former Premier and Vice Chairman of the National Committee Assembly, Iwasato Masao, as the new President."
 TNW_WORLD.2.a: "Pay our highest respects."
 TNW_WORLD.3.t: "Tani Tsuneichi Succeeds to the Presidency"
 TNW_WORLD.3.d: "Following the end of President Iwasato Masa'o's term, the government appointed Tani Tsuneichi, a minister of the National Committee Assembly who won an absolute majority vote, as the new President.`n`nTani had long been a rising star in politics; his aristocratic background and excellent credentials made him a prominent figure in political circles. His election to the presidency came as no surprise to many. Some say this represents a reshuffling of Manchurian politics, potentially meaning more young people will appear in the government.`n`nI will give everything I have for this country. My presidency is for Manchuria, for East Asia, and for the countless people who live on this land."
 TNW_WORLD.3.a: "Nothing seems to have changed..."
 TNW_WORLD.4.t: "Committee Assembly Collapses, National Coalition Elected"
 TNW_WORLD.4.d: "The National Coalition, an organization formed by merging the Progressive Party and the Constitutional Committee, defeated the long-ruling National Committee Assembly in elections. National Coalition chair Tsai Ing-wen assumed the presidency.`n`nAs a long-time leftist activist in the Manchurian Republic, Tsai Ing-wen's proposed political measures run counter to domestic policy. Her opponents attack her as an American-Russian spy. Nevertheless, the facts speak for themselves, and the dissenters must accept reality — though to others, this is only a small step."
 TNW_WORLD.4.a: "Democracy on the black soil."
 TNW_WORLD.5.t: "Iwasato Masa'o Succeeds to the Presidency"
 TNW_WORLD.5.d: "After completing his first term, Iwasato Masa'o successfully won re-election through his absolute authority and seniority within the Assembly.`n`nSome foreign media claim Iwasato is trying to emulate Park Chung-hee, while others are amazed by his frequent, cordial meetings with opposition democratic figures. Some interpret this as outright bribery of other opposition parties by the National Committee Assembly, while others see it as the Manchurian Republic's attempt to create an official opposition."
 TNW_WORLD.5.a: "Undercurrents stir..."
 TNW_WORLD.6.t: "Republic Enters Martial Law, Emergency Committee Established"
 TNW_WORLD.6.d: "At one o'clock in the morning, an explosion occurred near the Parliament building on Xinjing Square, killing eleven and injuring an as-yet-undetermined number. The scene showed signs of perpetrators dressed as members of the Anti-Manchurian People's Revolutionary United Front, a foreign terrorist group.`n`nAt four o'clock, the Fifth Division of the Xinjing Special City Army, led by Major General Xu Caigao, entered Parliament, declaring the building temporarily sealed and martial law imposed. A National Emergency State Committee was established, all political parties banned, and all government affairs placed under the authority of the Manchurian Republican Army.`n`nThe next day, Major General Xu Caigao issued a statement confirming that the terrorist attack had been perpetrated by the pro-Russian foreign terrorist group known as the Anti-Manchurian People's Revolutionary United Front, and that the machinery of state would be temporarily controlled by the Emergency State Committee."
 TNW_WORLD.6.a: "Truth and falsehood need no distinction..."
 TNW_WORLD.7.t: "UN Security Council Holds Consultations on Indonesian Situation, Japan States Principled Position"
 TNW_WORLD.7.d: "The Security Council held an informal meeting today on the current situation in Indonesia. According to diplomatic sources, Japanese Permanent Representative to the UN Tōgō Kazuhiko clearly stated Tokyo's core position in his address, drawing attention from all sides.`n`nThe Japanese representative first emphasized that respect for national sovereignty and non-interference in internal affairs are fundamental principles of the UN Charter, and that Indonesia's internal political process should be driven by the Indonesian people themselves, with no external solutions imposed by the international community. Japan also noted that as a regional power located on key maritime channels, Indonesia's stability has important implications for the overall security environment of Southeast Asia and is closely tied to regional cooperation under the East Asian co-prosperity framework.`n`nAnalysts noted that Japan's statement continues its consistent diplomatic style: taking a clear stance on principles while maintaining prudence in action, demonstrating concern for regional stability while avoiding entanglement in other nations' internal affairs. This position is seen as balancing the tension between cooperation obligations within the Co-Prosperity Sphere and the principle of non-interference."
 TNW_WORLD.7.a: "Trouble will surely rise in the South Seas..."
 TNW_UN_TT: "A delaying tactic, swimming against the current."
 TNW_WORLD.8.t: "Economic Order Declaration Formally Adopted, Japan-US Relations Ease"
 TNW_WORLD.8.d: "The week-long UN Future Summit opened at UN headquarters in New York. The assembly adopted the Declaration on Economic Order and its annexes, aiming to further strengthen the foundations of multilateralism, follow the trends of the times, and work together to build a safe, peaceful, just, equal, inclusive, sustainable, and prosperous world.`n`nThis declaration was born to ease tensions between Japan and the United States, open markets, and promote deeper cooperation between the two sides while defusing the confrontation of the Cold War. We solemnly declare our resolve to establish without delay a new international economic order — one rooted in the principles of equal treatment for all nations, sovereign equality, interdependence, mutual benefit, and cooperative effort, regardless of their economic and social systems. Only thus can we correct the inequalities and injustices of the world, narrow the widening gap between developed and developing countries, ensure the well-being of present and future generations, steadily accelerate economic and social development, and promote peace and justice.`n`nTo this end, we declare — the Japanese representative emphasized that the most magnificent achievement of recent decades has been the emancipation of a great many nations and peoples from colonial rule and foreign domination, their successive winning of independence, and their entry with heads held high into the community of free nations. At the same time, over the past thirty years, humanity has made remarkable technological progress in all fields of economic activity, providing a solid and reliable potential force for enhancing the welfare and well-being of peoples worldwide."
 TNW_WORLD.8.a: "Now it seeks to make equality endure forever."
 TNW_Japan_US_relations_TT: "It can create better conditions for all peoples of the world to win a life worthy of human dignity."
 TNW_WORLD.9.t: "UN Convenes Counter-Terrorism Conference"
 TNW_WORLD.9.d: "Recently, the United Nations held a high-level counter-terrorism conference at its New York headquarters. This is the first global counter-terrorism conference ever held by the UN, covering topics including global counter-terrorism strategy, containment of Islamic extremism, and international counter-terrorism cooperation.`n`nAt the conference, Indian President Subhas Chandra Bose noted that the global threat of Islamic terrorism is becoming increasingly complex, with activities long since crossing national borders and spreading transnationally. Only through concerted international cooperation can an effective counter-terrorism network be woven. He called on all nations to build consensus, forge closer counter-terrorism partnerships, and jointly formulate and implement a global counter-terrorism strategy.`n`nHe stated that Islamic terrorist forces often resurge amid the turmoil in Afghanistan, then raid across India's borders. But the Indian people are determined to drive terrorism out of their country at any cost — this war between India and Islamic terrorism will never see an armistice."
 TNW_WORLD.9.a: "We will forever fight for India's independence and freedom."
 TNW_Counter_terrorism_conference_TT: "That all nations of the world may find their rightful place, and that all may share in mutual support and common prosperity — this is the foundation of world peace."

 FRS_General_Regulations_for_Civil_Servants_1941_law_desc:  "§LAutumn 1941§! §SDarlan's government§! promulgated the §iGeneral Statute for Civil Servants§!, the first systematic code in §zFr§Wan§Xce§! to regulate the civil service. The Statute set out recruitment, promotion, conduct, discipline, even pay and pensions. Later, as the §oVichy regime§! gradually took back the northern territories, the law was amended several times and grew more detailed. In §VMaurice Thorez's§! words, the civil servant the nation then required was to be 'a cog in the administrative machine with no will of its own,' showing absolute loyalty to the §fnation§! and its §mHead of State§! (the President), not only in duty but even in private life. At the same time, Jews and those cast as the new symbol of 'Algerians' were expressly barred from public office, reduced to standardized 'non-citizens.' The §iGeneral Statute§! thus built a strictly ordered §Jbureaucracy§! stressing obedience downward. Though its stated aim was a more loyal and better-run administration, in practice the §zFr§Wan§Xce§! government could find no way to stop the nepotism and systemic corruption bred by the institution itself."

 FRS_Decentralization_Act_of_1957_law_desc:  "Under pressure from §ucolonial independence movements§!, the §aFrench government§! devolved some authority from Paris to elected local bodies in the §*French African colonies§!, introducing universal suffrage and ending the multi-college electoral system to remove remaining inequalities in voting. This was the first step toward the §zFr§Wan§Xce§!§KCommunity§!, akin in nature to the §EBritish Commonwealth§!. Most French African colonies held elections on 31 March 1957 under the new universal-suffrage §mDecentralization Act§!; exceptions were §nCameroon§!, which had voted earlier on 23 December 1956 (later annulled by armed unrest), and Togo, which waited until 17 April 1958."

 FRS_1958_Declaration_of_the_Francophonie_law_desc:  "'§nMember states§! enjoy broad §pautonomy§!, freely governing themselves and choosing their own internal institutions. Powers reserved to the Community include §hforeign policy§!, §Vdefense§!, §Ucurrency§!, common economic and financial policy, and strategic raw materials policy. Control over justice, higher education, external and public transport, and telecommunications also rests with the §KCommunity§!, but may be delegated to the §nmember states§!.'\n\nAfter the bitter lesson of the §XCongo war§!, the §<French conservatives§! grew tired of §&colonial enterprise§! and wished to cut every tie with the colonies §*south of the Sahara§!. Though the original constitution held that a member's independence would end its Community membership, the §L1950§! amendment changed this, allowing a state to remain in the Community 'by agreement' even after independence.\nThe amendment also noted that a §windependent state§! might rejoin the §KCommunity§!, though this was never applied. The §KCommunity§!'s §zPresident§! was also §zFr§Wan§Xce§!'s President; all §nmember states§! took part in the electoral college choosing him. The Community had an executive council chaired by the §zPresident§!, including the §mFrench Prime Minister§!, the heads of government of the §nmember states§!, and the ministers in charge of §KCommunity§! common affairs.\n\nLegislative power lay with the Community Senate, formed by representatives from the §aFrench§! parliament and the states' parliaments. There was also an arbitration court to settle disputes among Community members."

 FRS_Higher_Education_Guidance_Act_1968_law_desc:  "'The fundamental mission of the university is to develop and spread knowledge, to advance research and to train people.' In the field of higher education, the new law's context was much like that of the university reforms begun a few years earlier. Since §L1945§!, as §hhigher education§! opened to the common people, §Pwomen§! entered in growing numbers, and the §Cbaby boom§! swelled the student body. In every period, the §aadministration§! never paused.\nNew modern buildings rose in Paris and the provinces, and new university centers were added. Staff numbers grew, and hiring practices began to change. Yet these quantitative measures soon proved insufficient: in §L1967§!, the §QMontpellier Faculty of Letters§!, built for 600 students, held about 4,000. The reforms were meant to meet the new challenges facing §hhigher education§!. In §Ithe 1960s§!, their best-known achievements were the '§mDiploma of Literary Studies§!' and the '§mDiploma of Scientific Studies§!.' Yet the reforms were questioned a year before the §L1968§! May events, and faced continued challenges during the movement.\n\nOne side was almost unchanged, not only since §L1945§! but in many ways reaching back to the §aFaure Law§! of §L1896§!: the way universities operated and divided authority within. This system gave the president and deans heavy power, yet many decisions still required the minister's ruling. Professors were prominent in university bodies, while students had almost no voice. The law also tied teaching and research together through the status of teacher-researcher, encouraging interdisciplinary work. Thus this framework law marked a turning point in §aFrench§! education, incorporating some of the §L1968§! May demands, such as letting all parties involved in education take part in institutional governance and promoting communication between disciplines."

 FRS_1969_Grenell_Agreement_law_desc:  "The §xGrenelle Agreements§! were the result of talks in §LMay 1969§! between the government and representatives of §Remployees§! and §Oemployer organizations§!. Though not ratified by §mparliament§! nor declared §Vlegal§!, the §fPonchard's government§! still put the 'agreement's' main measures into effect. What it contained was social progress unseen since the reforms, and even since the great social innovations of the §XPopular Front§! in §L1936§!. Even into §Mthe 21st century§!, its clauses remain meaningful. Besides a general rise in pay for §Rall employees§!, the agreements covered shorter working hours and protections for §Zunion rights§! within firms; they also agreed to continue talks on pensions, old-age welfare and family allowances."

 FRS_Safety_and_Freedom_Act_desc:  "In early §L1970§!, Justice Minister §*Alain Peyrefitte§! and his personal adviser §<Vincent Ramonda§! drafted the §$Safety and Freedom Act§!, which was finally passed and enacted in late §L1973§!. The law was meant to balance §Mliberty§! and §fsecurity§!.\nNot to be overlooked was the rise of §sFrench terrorism§! in the second half of §Lthe 1970s§!, which pushed §*Minister Peyrefitte§! to write a new chapter. The law replaced the old '§Vflagrant offence§!' procedure (Articles 48-52) with a more orderly system of '§Jimmediate referral to the criminal court§!.' Its roots reach back to the §L20 May 1863§! decree on §Vflagrant offences§!, under which a defendant caught in the act was at once brought before the prosecutor and sent either to the police court or held for trial the next day. Though this old procedure was formally abolished by the §ACode of Criminal Procedure§! in §L1958§!, its spirit lived on in §wArticles 393-397 of the new code§!, essentially unchanged: the procedure was to be §Sswift and simple§!, while §rthe defendant's rights§! were tightly limited.\n\nThe new rules of the Safety and Freedom Act changed this: from then on a §ilawyer§! had to be present (no such rule before), and §rthe defendant§! was given more time to prepare a defense."

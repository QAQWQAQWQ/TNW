 FRA_Francois_Durand:  "Francois Durand de Grossouvre"
 FRA_Francois_Durand_hog_desc:  "§YHead of Government\nCorporate Statism§!\n--------------\nOnce a man of Darnand, Grossouvre would rather bury that past deep. The reason is plain: the militias fell to Bousquet, Darnand lost power, and the past withered. He knew Mitterrand, yet did not join the Convention club he built, instead turning to the notoriously extreme Watch Club. With seniority and connections, he soon earned respect and, borne forward by the extremists, stepped onto the stage.\n\nDrawing on a network he had cultivated for years, he managed to thwart Mitterrand's covert scheming and smash the divide-and-conquer plot against the Watch Club. This raised his standing within the faction to its peak, but also meant a complete break with Mitterrand, dragging the whole faction with it. The factional struggle won, and for the first time in Watch Club history, a man became Prime Minister. Amid flowers and crowds, Grossouvre took the seat.\nHe saw the smiling faces around him, and also those silent, sidelong glares in the corners. He looked into twinkling eyes and knew they harbored their own designs. Between the perfume and the toasts, he suddenly felt clearly: his life had changed. Not on the battlefield, not in parliament, but in this refined and hollow splendor, quietly and definitively.\n\nOnly, what of tomorrow, when today's flowers fade?"

 FRA_Roland_Dumas:  "Roland Dumas"
 FRA_Roland_Dumas_for_desc:  "§YForeign Minister\nProgressive§!\n--------------\nIn the public mind, a man who joined the Resistance and took up arms against the new regime could hardly expect a place in that regime afterward. Yet Roland Dumas broke the rule, rising to the inner circle and becoming a close ally of former President Mitterrand. Whether it was the special value of his Resistance record in identity politics, or his ties to the upper echelons, for some, hiding the past and washing clean was never hard. Dumas was such a case.\n\nReleased from prison, he met Mitterrand, then serving in Vichy, and the two became close. As Mitterrand founded the Convention club and gathered power, Dumas was promoted, serving as Minister of State and then Foreign Minister, entering the highest circles. Yet outside the Convention club, he was not widely accepted in the party, even frozen out by Mitterrand's inner circle. Now the sitting president is from a different faction, and the camp that should row together is itself divided. As an elder of the party, Dumas seems only to sit on his high seat day after day, waiting for the next to take his place.\n\nWho truly cares? No one but himself."

 FRA_Jean_Louis_Debre:  "Jean-Louis Debre"
 FRA_Jean_Louis_Debre_eco_desc:  "§YInterior Minister\nPaternalist Developmentalism§!\n--------------\nWhen Louis Debre is mentioned, people first think of his father Michel Debre and the Debre family, so rooted in political history. Raised in that deep political air, he took a law degree with help from his father's old acquaintances and entered politics. By chance he met Maurice Papon and began to serve him. Yet his rise to Interior Minister owed to more than that link. As the Winter Velodrome faction's man most tightly bound to the business federation, winning him over was a net gain for the faction.\n\nYet within the Winter Velodrome camp, not all were won over. A leading advocate of constitutional normalization, he was looked on askance by the radicals and not truly accepted by the so-called orthodox. Burdened with party administration, Jean-Louis Debre had little leisure to tend hearts and minds. He must soothe the aging president, calm endless factional quarrels, and handle piles of repetitive, tedious paperwork. If words alone could solve everything, his lot would be far lighter."

 FRA_Ernest_Antoine_Seilliere:  "Ernest-Antoine Seilliere"
 FRA_Ernest_Antoine_Seilliere_sec_desc:  "§YFinance Minister\nCorporate State§!\n--------------\nThe Seilliere name reaches back to the Napoleonic era, the title of Baron de Rome a witness to its lineage. Ernest-Antoine Seilliere grew up bathed in that long glow. His record is almost spotless: studied law, graduated from the ENA, served in the Algerian War with distinction. After leaving the service he met Jospin, worked with him, then joined a party and entered the Central League's network.\n\nSo far it seems a typical tale of a well-born, well-rounded political elite rising from the bottom. Yet Ernest-Antoine Seilliere is never just a politician; he is also chairman of the business movement, the political face of France's plutocracy. He firmly opposes any policy by any government that challenges the plutocrats' standing, and is always ready to march out, a piece and a vanguard in the Central League's hand, pushed forward to challenge the aging president.\n\nWhat Seilliere himself thinks may not matter. The Baron de Rome cares first for his own interest, then for the plutocracy he represents. The gains and losses of others were never his concern."


 POLITICS_ANDRE_BETTENCOURT_DESC:  "In this office that holds the highest power in France, President Bettencourt enjoys one of the few quiet moments of the day. '2-'2 has proven his lucky year: first, by seniority and connections, he climbed to the presidency in a fierce contest; then, continuing economic growth and victory in the African colonial war cemented his authority. He lights a cigarette, lets his nerves relax in the curling smoke, and looks out at the setting sun. The gentle dusk pulls his thoughts back to that night decades ago.\n\nAndre Bettencourt was not a loud name in the rushing river of French politics. Often overlooked, though from the Foreign Office and once afforded meetings with the Germans and Abetz, in the shadow of Rochat's personal prestige the whole Quai d'Orsay looked dim, and Bettencourt seemed a quiet, ordinary clerk. Yet fate turns. On that night in 1988, he was nominated by his old acquaintance President Mitterrand to be Foreign Minister. Long-built connections, deep seniority and practiced political skill finally let him thrive, carrying him all the way to this chair.\n\nTo be sure, being President of the French Social Republic is no easy thing. Fierce party strife and colonial troubles often make the throne a hard seat. Yet Bettencourt's term has so far been calm. This gives him confidence that in this first, and perhaps last, term he may lead France toward renewal and leave himself at least an 'above average' place in history.\n\nOnly, will the future really stay this calm?"

 FRS_millennium:  "The Millennium"
 FRS_millennium_desc:  "§Q'In the days of light, I am with you; in the dark days, so too shall I be...' - Philippe Petain§!\n\nSince the Great War ended, a new order has dawned on the European continent. Faced with this century's upheaval, nations once crushed by the iron fist have broken the chains of the old order, and, aided by the Steel Pact, built independent nation-states of their own.\n\nHere, the three great powers of the Pact deserve much credit. For the youth of Europe, the Steel Pact has shown a clear path: to strive for a Europe of the Europeans. The youth of the three great powers especially must bear the burden, setting the example on this great endeavor.\n\nNo one doubts, no one opposes. The new Europe will surely march firmly toward a brighter future. The children of France will give their all to this great cause, charging ahead, for all time, for the millennium."

 FRS_Party_strife:  "Turbulent Factions"
 FRS_Party_strife_desc:  "§Q'But I am sure you will forgive me, for you know that I live and struggle only for you.' - Pierre Laval§!\n\nThe French Social Republic, strictly speaking, never became a finely tuned administrative machine. Even under President Laval, factional strife raged, tearing court and country apart. After the turmoil of the fifties, President Brinon tried to reform, yet the Paris collaborators and the old Vichy hands were at odds, central commands barely left Paris, local opposition parties grew louder, and palace cabals piled on, making affairs a worse tangle.\n\nIn this crisis, President Bousquet took charge with an iron hand, slowing the breakup and pulling France back from the edge of near-civil war, finally steadying the League. Yet local governments remained too strong, and comrades from every quarter were often half-distant from the central will. The rising was pacified, yet factions still swarmed - the National Front, the People's Party, the Action Party and the various militia camps clashed without end.\n\nSince the fall of the English puppet regime, the French Social Republic has stumbled into the new millennium. Bousquet did not know whether later hands could mend the rift, yet he still let go, entrusting the political edifice of his life's struggle to his successor. Alas, President Legay lacked the stature to heal the old League's wounds, and the late president's work slowly drained away. As the new century's bell rang, France still gasped on in the swirling eddies of unceasing factional war."

 FRS_The_river_is_going_downhill:  "Fallow Fields, Sinking River"
 FRS_The_river_is_going_downhill_desc:  "§Q'His gray eyes gave us a beautiful look, not the stare of a dotard, but the beautiful gaze that once appeared on the 194- posters...' - Dr. Schillemans§!\n\nThe path of agricultural modernization in the French Social Republic has been winding and hard, every step a struggle. The whole nation argues about it; the Peasants' Party, the Agricultural Party and even the People's Party all criticize the government for pressing on blindly, ignoring rural hearts, and widening the rift between city and country. Every policy runs into resistance, like walking in mud. President Bousquet forced the work through with iron will, and France's farmlands were remade, at the cost of his own exhaustion.\n\nAfterward, hunger was beaten, small farmers grew better off, and townsfolk and traders all gained. Yet a great exodus from the land followed. Cities could not bear the weight, and the housing crisis deepened. The government tried again and again to ease the pain, yet the tide was too strong for human hands. Countless farmers were torn from their roots at history's turning; old grievances between town and country went unsolved, and new rifts opened.\n\nAt the turn of the millennium, the nation is in the churning rapids of transition. Would that the people stand together, strong of purpose, and find a way forward through the rifts."

 FRS_Only_the_best_and_the_most_focused:  "The Best and the Focused"
 FRS_Only_the_best_and_the_most_focused_desc:  "§Q'The France of today, run down as she is, will soon be clothed in green again and bloom. May the springtime of your youth soon flower in the springtime of France's renewal.' - Philippe Petain, 'Address to French Youth'§!\n\nAfter the constitution of 1946, the reconstruction of the French Social Republic was gradually completed. Technocrats were brought in on a large scale; ten years of peace, ten years of building, ten years of development, thirty years of solid achievement. Yet renewal has never been easy - above, high officials took bribes; in the middle, harsh officials squeezed the people, and economic growth often dripped with the blood and tears of ordinary folk; and colonial wars dragged on, repeatedly setting back recovery.\n\nNot until President Legay's time did the national economy enter a steady upward track. By the nineties and into the new millennium, the French Social Republic's economy had largely stabilized: plutocratic power was curbed, markets opened gradually, a social security system took shape, and social conflicts were no longer as sharp as before.\n\nFrance today still walks with a heavy step, yet has truly found her feet. The old scars are slowly smoothed by time; the road ahead is long, but at last it can be looked up to."

 FRS_Unpolished_Gold_and_Jade:  "Rough Jade, Unpolished Gold"
 FRS_Unpolished_Gold_and_Jade_desc:  "§Q'He can do no more for France... but he is absolutely obliged not to do anything that might tarnish his name...' - Gabriel Brunetton§!\n\nThrough all the ages, since Caesar's northern campaigns, the soldiers of Gaul have been famed for hard fighting. The Sun King's glory and the Emperor's feats both witness the long and fierce tradition of French arms; their skill and will are like iron and steel; their obedience, endurance and resolve laid the foundation of France's borders today. Since the capital's return in 1944, the army was rebuilt; Prime Minister Laval himself reviewed the force that carried France's new hope. By the time the constitution was formally adopted, the army had taken shape.\n\nYet of late the French army has been hampered. The stray soldiers and colonial troops once taken in lowered the overall quality for a time, tarnishing the army's name. Reform was urgent. Under President Bousquet, weak units were cut, formations tidied, and the navy and air force developed by leaps, while the banditry that had scourged the colonies was curbed.\n\nToday, the French army's duty can no longer be shirked. Colonial banditry remains, awaiting the final blow. Now that the ranks are restored and the people love arms, if we would not betray the late president's work of rebuilding, there is only one way: to fight to the death for the nation, to be its shield."







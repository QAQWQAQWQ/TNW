 FRS_The_homeland_of_the_French_nation:  "Homeland of the French Nation"
 FRS_The_homeland_of_the_French_nation_desc:  "After untold suffering and a thousand tragedies, the French nation has at last returned home and built a new homeland. It is a state driven by institutions, forged by the Marshal and the Prime Minister together - from the new regional councils to the two national chambers, the national revolution remade the French Social Republic.\nYet twenty years of change have left the bureaucracy bloated, barely keeping the nation running.\n\nFrance today is neither republican nor dictatorial;\nit has become a true bureaucratic machine. Though administratively inefficient, it is self-contained, a tangled web of institutions. Any who covet the throne atop that spiderweb must know: this bureaucratic beast can swallow any individual, whoever he is."
 FRS_Dim_Star:  "Dim Star"
 FRS_Dim_Star_desc:  "The Social Republic rose from the ruins of the Third Republic. Built by left progressives and the Workers-Peasants Party, it was born of the ashes and broken walls of the old order. In 1946, Flandin and the generals' rule collapsed, and the far right, in the chaos, reached for power to drag the nation into the abyss. Yet the workers stepped forward at once; the Workers-Peasants Party and the remnants of the SFIO organized a flood that smashed the old world to pieces.\n\nYet the new regime's reconciliation with the Communists and the Resistance was always limited. Faced with Germany's territorial claim on Alsace-Lorraine, the Social Republic's recognition of it roused fierce anger from Free France and many parties; the rift was cut then, and neither side could reach agreement. Internal differences grew into thirty years of guerrilla gunsmoke, until time slowly stilled the fighting.\n\nSixty years on, the economy limps forward, and diplomacy is trapped in isolation. Germany's attitude grows subtle, hard to read. Crisis after crisis surges toward this young Social Republic - and she stands at the fork of history."
 FRS_Reich_Shackles:  "Shackled Red Flag"
 FRS_Reich_Shackles_desc:  "From its first breath, the Social Republic was bound by the black eagle's chains. The Reich gazed at the western border, craving stability, and every policy we pushed had to maneuver within that constraint. Happily, France knows diplomacy well, and with practiced hands kept the Empire content with our posture. Things could of course be better, yet Franco-German relations are enough for both sides to get what they need, and we only hope they last.\n\nThe threat of German intervention in France once hung like a sword of Damocles; now it seems a distant nightmare, receding. Germany will never be fully satisfied with us, but we do not need that fullness - we are not its underlings, but comrades-in-arms.\n\nThat is how it should be."
 FRS_Jaures_Path:  "Jaures' Path"
 FRS_Jaures_Path_desc:  "Jaures held that within the tracks of democratic republic, universal suffrage and parliament, a moderate yet firm transformation was possible; through lawful struggle, the cooperation of unions and cooperatives, a broad left alliance, and gradual nationalization, capitalism would be forged, piece by piece, into socialism, without the cost of violent revolution.\n\nIn the light of the republic and universal suffrage, the party should not treat parliament as a mere 'soapbox,' but forge it into a weapon for taking power and reform. The state is not the tool of one class alone, but the arena where class forces contend; the working class can, through the ballot, turn it to serve its own interests.\n\nDemocratic republic, universal suffrage and parliament; lawful struggle, unions and cooperatives, left alliance and gradual nationalization - along this road, capitalism slowly transforms into socialism, rather than wasting years waiting for violent revolution.\n\nThis is the guiding thought of the Social Republic."
 FRS_Workers_and_Peasants_Army:  "Army of Workers and Peasants"
 FRS_Workers_and_Peasants_Army_desc:  "The smoke of victory had barely cleared when the flags of the People's Army, the party's vanguard, the militias, and the awakened progressives from the old ranks all merged into the Workers-Peasants Self-Defense Force and the Workers-Peasants Navy. On this rubble, the Social Republic began the long road of rebuilding its armed strength.\n\nYet the fires of Algeria mercilessly exposed this mixed force to the light. Fighting spread out of control, widening, until Algeria itself was handed over to Germany as a mandate. The first battle was a disgrace.\n\nFor over thirty years since, the Workers-Peasants Self-Defense Force and Navy have regrouped in silence, yet never tasted real battle, never proven themselves on the field. Now we hope they will show their edge in this unfinished trial, and earn for the Social Republic the international weight it deserves."
 FRS_World_Bearer:  "Standard-Bearer of the World"
 FRS_World_Bearer_desc:  "The Social Republic led the international left through the quiet decades of the forties to the sixties, accumulating unmatched prestige in the silence. In the ideological fever of the sixties and seventies, the shape of left Latin America was set; but the defeat in Argentina and the fascist resurgence left the world communist movement looking worn again, grinding away at the comrades' resolve. They began to question whether their line was right, and France itself was sunk in the same doubt.\n\nThe doors of the Paris government building are shut; the hope of world revolution seems so slim. Yet a single spark can start a prairie fire. The torch of revolution has never gone out; it only waits for a time, waits for the world's proletarians to unite once more and break the chains that were never theirs."
 FRS_continuous_rain:  "Endless Rain"
 FRS_continuous_rain_desc:  "The French nation has known much sorrow. Colonial fires burn this hard-luck land; endless security wars tear at the social fabric; once the master of Europe limps into a long, rain-soaked age.\nTo call it ill fortune may be closer. The nation's past is steeped in darkness; when the fever years burned out, they left only spreading desolation and endless cold rain.\n\nAnd the French nation, through all this damp and gloom, has lived a full twenty years."
 FRS_lost_future:  "The Lost Future"
 FRS_lost_future_desc:  "In the years when France's new generation grew up, disappointment walked beside them, and confusion clouded their eyes. Their fathers, their ancestors, had fought endlessly for this nation, believing they belonged to a superior people, promised a great destiny.\n\nSo they struggled, struggled without cease, until one day they woke to find the throne of the master of Europe long overturned, and the system that claimed to serve the French nation quietly rotted within. Then anger welled, pain gnawed, despair spread. The road ahead seemed ended, and only a deep sorrow rose up from below. This is the state of society, a pervading sickness.\n\nThe French nation has sunk into a strange melancholy, unspoken yet everywhere. If this melancholy lingers, where will it lead?\nOnly time can answer, perhaps."
 FRS_economic_stagnation:  "National Economy - §JStagnant§!"
 FRS_economic_stagnation_desc:  "France today is still sunk in the old economic mire, as if six decades ago. Politics churns, the economy stands still, and meager wages cannot keep up with rising prices.\nThe treasury drains, the financial market is a stagnant pool, and starting a business is almost like digging one's own grave. The people, in silence, have gradually accepted this gray reality.\n\nNow and then, someone pauses and recalls the bright years of the seventies and eighties, or the thick darkness of the post-struggle era. They set that history against this rain-soaked, endless age.\n\nDisappointment, or pain? Perhaps neither matters anymore."

 FRA_Jean_Poperen:  "Jean Poperen"
 FRA_Jean_Poperen_hog_desc:  "§YHead of Government\nReformist Socialism§!\n--------------\nPoperen is a well-known left-wing figure in the party, his left color plain to all. Yet it is precisely this color that won him the premiership, to check the power-hungry President Lang. Whatever reform Lang tries, the Socialist opposition behind Poperen can make every bill laid before the Council of Ministers 'pause' for a while.\n\nThe sitting president is long tired of Poperen and the opposition behind him; and Poperen knows full well that the president is moving against them. How heavy the blow will fall, and whether the opposition can weather it, no one yet knows. Yet in his seat, Jean Poperen will do all he can to block the power-swollen president.\nA small cold war is quietly under way inside the Socialist Party, every faction moving in secret.\n\nAnd Jean Poperen? He is more like a banner, a symbol. What the opposition is truly planning, he does not know, and perhaps never truly will."

 FRA_Jean_Pierre_Chevenement:  "Jean-Pierre Chevenement"
 FRA_Jean_Pierre_Chevenement_for_desc:  "§YInterior Minister\nConservatism§!\n--------------\nThe Chevenement family came from Switzerland; the original name 'Schwenemann' was Francized to 'Chevenement' in the eighteenth century. He was born in Belfort, near the Swiss border, speaks German, and studied in Vienna. From 1981 to 1983 Chevenement served as Minister of Research and Industry, then resigned - the first resignation of his career, and later he made a similar choice again.\nMany Socialists blamed Chevenement for Lionel Jospin's poor showing in the first round of the presidential election, but he did not care.\n\nAs he said of the sitting president: 'Ministers must be silent; if they wish to speak, let them resign.'"

 FRA_Edouard_Balladur:  "Edouard Balladur"
 FRA_Edouard_Balladur_eco_desc:  "§YFinance Minister\nModerate Technocrat§!\n--------------\nBalladur was born in Izmir, Turkey, his family of Levantine Armenian stock, long tied to France. In the mid-to-late 1930s, the family, with five children, moved to Marseille and put down roots in France.\n\nHis political career began in 1966, first as an adviser to Prime Minister Peyrefitte. After the democratic reforms, he threw himself into the Socialist Party's rebuilding and kept close contact with Mitterrand of the Social Revolutionary Party, helping bring about the cohabitation around 1973. Though this experience made him controversial and even drew Jospin's exclusion, after Mitterrand was forced out, Balladur built a steady working relationship with Lang, helping him win the party's internal contest.\nWhen Jospin lost the 1988 presidential bid, some in the party blamed Balladur, yet Lang still trusted him and, after winning, named him a cabinet minister."

 FRA_Alain_Richard:  "Alain Richard"
 FRA_Alain_Richard_sec_desc:  "§YDefense Minister\nPaternalism§!\n--------------\nRichard studied at the Lycee Henri-IV, took his baccalaureate, and entered politics. From 1978 to 1993 he was a deputy for Val-d'Oise in the National Assembly; in 1995 he was elected senator, and then appointed Defense Minister.\n\nIn office he pushed the policy of a leaner army, launching a disarmament plan in 1996 to cut French forces in Africa from 30,000 to 20,000 by 2002. Though he did his duty, he stood apart in the sitting government. He was widely seen as a Jospin ally - though he always denied it, the rumors never stopped.\nUnder a controlling president in particular, such speculation would not die. In time, Richard cared no longer to tangle with the whispers; after all, if rumor could shake a minister's seat, then the votes of some street celebrity might outnumber the president's."

 POLITICS_JACK_LANG_DESC:  "Jack Lang studied political science at Sciences Po in Paris, then took a graduate degree in public law, and entered politics after graduating. He is known for acting on 'intuition,' and is even infamous for it. Though many titles have been given him, the one he loves most is 'the man who crossed the Rubicon.'\n\nAt first Lang entered politics as a deputy of the Social Revolutionary Party; after the democratic reforms, he threw himself into the Socialist Party's reorganization and was chosen as the party's National Assembly candidate for the second constituency of the Vosges. Since working with Mitterrand, his standing in the party has always been disputed. During the redistricting of national constituencies, his own seat was abolished; after several failed nominations elsewhere, he finally won a seat in Pas-de-Calais. Having built a following, he gradually showed a strong hunger for power; suppressing rivals deepened the rift in the Socialist Party, even forcing Jospin out of the presidential race. This drew wide criticism in the party, but Lang did not care,\n\nAs he boldly declared. 'No one can erase me from the map of French politics.'"


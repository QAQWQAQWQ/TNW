 ANG_Gerhard_Homuth:0 "Gerhard Homuth"
 ANG_Gerhard_Homuth_for_desc:0 "§YGesandter nach Germanien\nNational Socialism§!\n--------------\n§LGehard Homuth, like many in the Afrikan Reichskommissariats, achieved his position by pure virtue of serving alongside the unlikely sap chosen to be Reichskommissar. A former pilot in the Luftwaffe and a good friend of Schenck's, Homuth was chosen to assist Südwestafrika in their bombardment efforts. He has little experience leading men, but this is something that Schenck has seemed more than happy to overlook.\n\nEver since a near-fatal encounter on the Eastern Front, Homuth has avoided participating in the bombardments himself, instead helping to train and supply braver, more stupid pilots. Like Schenck, Homuth spends much of his time in the skies above Windhuk. Unlike Schenck, however, he does not take the time to engage himself in politics and scheming, even whilst grounded.§!"
 ANG_Otto_Herrigel:0 "Otto Herrigel"
 ANG_Otto_Herrigel_eco_desc:0 "§YEntwicklungsdirektor\nNational Socialism§!\n--------------\n§LOtto Herrigel is a young up-and-comer in politics of the region, strangely appointed as economic minister of Südwestafrika upon his own request. After completion of Herrigel's degree in economics in Germany, he wrote Schenck a letter asking to assist with the economics of his home Reichskommissariat. Surprisingly, Schenck responded by offering him the position of head economic advisor, despite his lack of practical experience in the field.\n\nDespite his position, Herrigel is rather far from being in control of Südwestafrika's economy. Schenck and von Leipzig treat his advice as something of light suggestions, and oftentimes Herrigel will be unable to make sense of the books he is given by his superiors and subordinates alike. Despite multiple entreaties to Schenck to change the total disorder the economy is in, Schenck often merely shrugs and asks Herrigel to switch the numbers around, something the young man dutifully does.§!"

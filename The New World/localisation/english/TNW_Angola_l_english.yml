 ANG_The_Market:0 "The Market"
 ANG_The_Market_desc:0 "Our entire economy is nothing but a mean to an end. Both the funds we receive from the Reich, and the investments we get from private companies, are meant to improve Angola and prepare it for its eventual independence; of course, if we manage to develop the colony through legal means, the Heimat will be only too glad to increase our funding.\n\nOur money and raw materials will allow us access to the world market, and thence contracts with both German and foreign companies. By selling what we have and buying what we don't have, we'll exponentially increase the rate Angola grows; additionally, we'll unlock more opportunities for improvements as the region develops."
 ANG_request_civilian_investment:0 "Woo Civilian Investors"
 ANG_request_military_expansion:0 "Request Industrial Support"
 ANG_request_infrastructure_buildup:0 "Expand Infrastructure Projects"

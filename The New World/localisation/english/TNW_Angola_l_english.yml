 ANG_Sell_fighters:0 "Sell Old Fighters"
 ANG_Sell_interceptors:0 "Sell Old Interceptors"
 ANG_Sell_bombers:0 "Sell Old Bombers"
 ANG_Sell_fighters_desc:0 "Our fellow Reichskommissars in Afrika have expressed interest in purchasing some of our older planes. Finalizing the transaction will take some time, but we estimate §G3 million USD§! for §Y30 of our planes§! - a lower price than they're worth, but necessary given the nature of our dealings."
 ANG_Sell_interceptors_desc:0 "Our fellow Reichskommissars in Afrika have expressed interest in purchasing some of our older interceptors. Finalizing the transaction will take some time, but we estimate §G4 million USD§! for §Y40 of our planes§! - a lower price than they're worth, but necessary given the nature of our dealings."
 ANG_Sell_bombers_desc:0 "Our fellow Reichskommissars in Afrika have expressed interest in purchasing some of our older bombers. Finalizing the transaction will take some time, but we estimate §G5 million USD§! for §Y25 of our planes§! - a lower price than they're worth, but necessary given the nature of our dealings."
 ANG_sell_stockpiles_decision:0 "£decision_icon_small §HDecisions§! to sell our old stockpiles to Zentralafrika and Ostafrika will be unlocked.\n\n"
 ANG_sell_oil_stockpiles_decision:0 "\n£decision_icon_small §HDecisions§! to sell our oil surplus will be unlocked.\n\n"
 ANG_SKL_RD_Decisions:0 "The SKL"
 ANG_SKL_RD_Decisions_desc:0 "§rSchenck§! is a man with passion for little else besides §Yairplanes:§! the gorgeous metal birds that carry him hundreds of feet beyond his §Gearthly concerns§!. The dedicated aeronautics research facility §YSüdwestafrikanisches Kolonialamt für Luftfahrtforschung§!, or §YSKL§!, is simply another facet for this passion. Within its aerodynamics labs and enormous hangars, §rSchenck§! can spend his days dreaming not in the sky but of it - of §Mhis sky§!, beckoning like an aluminum dream - designing new airplanes that can take him §Yfaster§! and §Yhigher§! than ever before."
 ANG_unlock_Academy:0 "£decision_icon_small §HDecisions§! to expand the SKL, allowing us to research and produce better planes, will be available.\n\n"
 ANG_build_bombers:0 "£decision_icon_small §HDecisions§! to build up our Bomber fleet will be unlocked."
 ANG_build_fighters:0 "£decision_icon_small §HDecisions§! to build up our Fighter Fleet will be unlocked."
 ANG_build_transports:0 "£decision_icon_small §HDecisions§! to build up our Transport Fleet will be unlocked."
 ANG_Transport_Production_Funding:0 "Fund Transport Plane Production"
 ANG_Bomber_Production_Funding:0 "Fund Bomber Production"
 ANG_Fighter_Production_Funding:0 "Fund Interceptor and Fighter Production"
 ANG_RD_Funding:0 "Expand the R&D Operations"
 ANG_Air_Exercises:0 "Testing Exercises"
 ANG_transport_production:0 "Expanded Transport Production"
 ANG_transport_production_desc:0 "Prioritizing raw material deliveries and streamlining assembly at production facilities has greatly improved the efficiency of our transport construction. Our runways now service an increasing number of transport planes rolled straight off the assembly lines."
 ANG_fighter_production:0 "Expanded Fighter Production"
 ANG_fighter_production_desc:0 "Prioritizing raw material deliveries and streamlining assembly at production facilities has greatly improved the efficiency of our fighter construction. Our runways now service an increasing number of fighter planes rolled straight off the assembly lines."
 ANG_bomber_production:0 "Expanded Bomber Production"
 ANG_bomber_production_desc:0 "Prioritizing raw material deliveries and streamlining assembly at production facilities has greatly improved the efficiency of our bomber construction. Our runways now service an increasing number of bomber planes rolled straight off the assembly lines."
 ANG_SKL_RD_Expanded:0 "Increased Research Funding"
 ANG_SKL_RD_Expanded_desc:0 "By diverting some of the budget to the funding of aircraft research, we have increased the rate of progress on several promising designs. Soon a new generation of planes shall rule Afrika's skies!"
 ANG_Bomber_Plans:0 "A New League of Bombers"
 ANG_Bomber_Plans_desc:0 "New bomber designs are being incorporated into our squadrons, performing notably better than their now-outdated counterparts. Higher altitude ceilings and more accurate bombsights have made these planes the air fleet's crown jewels - and the enemy's worst nightmare."
 ANG_fighter_plans:0 "A New League of Fighters"
 ANG_fighter_plans_desc:0 "New bomber designs are being incorporated into our squadrons, performing notably better than their now-outdated counterparts. Heavier armaments and thicker armor have made these planes the air fleet's crown jewels - and the enemy's worst nightmare."
 ANG_air_attack_plans:0 "A New Type of Assault"
 ANG_SKL_Air_Exercises:0 "Air Training Missions"
 ANG_SKL_Air_Exercises_desc:0 "Our pilots are undergoing extensive training to ensure that they are performing at the peak of their abilities. Soon Südwestafrika shall have the finest airmen in the world!"
 ANG_need_5_million_for_tree:0 "We must have §Y5 million USD§! to invest in this program before continuing down this path.\n\n"
 ANG_need_3_million_for_tree:0 "We must have §Y3 million USD§! to invest in this program before continuing down this path.\n\n"
 ANG_repairyard_increase_vars:0 "This will increase our §YProduction Efficiency Cap and Retention§! by §G2.5%§!.\n\n"
 ANG_repairyard_increase_vars_greatly:0 "This will increase our §YProduction Efficiency Cap and Retention§! by §G5%§!.\n\n"
 ANG_upgrade_tooltip:0 "As we begin specializing in repair and construction, we will get a bonus to our §YProduction Efficiency Cap and Retention§!.\n\n"
 ANG_fueling_increase_vars:0 "This will increase our §YMaximum Fuel as well as our Fuel Gain§! by §G2.5%§!.\n\n"
 ANG_fueling_increase_vars_greatly:0 "This will increase our §YMaximum Fuel and Fuel Gain§! by §G5%§!.\n\n"
 ANG_fueling_off_the_top:0 "£decision_icon_small §HDecisions§! to begin skimming our oil production will be unlocked.\n\n"
 ANG_upgrade_fueling_tooltip:0 "As we begin building up our refineries and silos, we will get a bonus to our §YMaximum Fuel and Fuel Gain§!.\n\n"
 ANG_mining_increase_vars:0 "This will increase our §YResource Gain§! by §G2.5%§!.\n\n"
 ANG_mining_increase_vars_greatly:0 "This will increase our §YResource Gain§! by §G5%§!.\n\n"
 ANG_upgrade_mining_tooltip:0 "As we begin building up the mines and infrastructure, we will get a bonus to our §YResource Gain§!.\n\n"
 ANG_sell_the_gold:0 "£decision_icon_small §HDecisions§! to sell our excavated gold and diamonds to Germany will be unlocked.\n\n"
 ANG_Afrika_Mirakle_Tooltip:0 "§GGermania has been observing our progress with great pleasure, and is now ready to make a giant investment in our Reichskommissariat!§!\n\n"
 ANG_Native_Situation_Decisions:0 "The Native Situation"
 ANG_Native_Situation_Decisions_desc:0 "Native unrest throughout Deutsche-Afrika is slowly but steadily rising to a boil as the war rages on. As Südwestafrika is no exception, we will have to deal with both bandit attacks and civilian unrest.\n\nThe militant organizations are currently our most pressing concern. §GUNITA§! and §SPLUAA§! have been the bane of our garrisons for a decade; while fractured, and sometimes even in open competition, it seems they have brokered an uneasy peace and concentrated their efforts towards destroying us. Of course, this increases the danger they constitute by several orders of magnitude, and the stronger they get, the likelier they will declare open revolt and strike at Windhuk itself. We can't let that happen.\n\nOn the other hand, §YNative Unrest§! is the smallest concern in the short term, but should it rise above a certain threshold, disgruntled locals will become more §OMilitant§! and join their extremist brothers in the jungles and hills, swelling their numbers with eager freedom fighters. We can try to soothe the civilians by increasing their living standards and granting them concessions, but it will only buy us time before things escalate.\n\nCurrently, §YNative Unrest§! is [GetNativeUnrest] high, while §ONative Militancy§! is [GetNativeMilitancy] high."
 ANG_Expand_Native_Outreach:0 "Expand Native Outreach"
 ANG_Expand_Native_Outreach_desc:0 "More resources can be allocated into our native outreach program, lowering unrest by establishing working relationships with town and village heads."
 ANG_Use_A_Lighter_Hand:0 "Use a Lighter Hand"
 ANG_Use_A_Lighter_Hand_desc:0 "We can review guidelines for interacting with the natives. More emphasis on respect and understanding from our delegates, and stricter enforcement thereof, may reduce tensions between us and them."
 ANG_Crack_Down_on_Cell:0 "Crack Down on Bandit Cells"
 ANG_Crack_Down_on_Cell_desc:0 "We can launch operations against suspected rebel cells. Deprived of opportunities to act violently, native populations are bound to be more peaceful."
 ANG_Double_Patrols:0 "Double Patrols"
 ANG_Double_Patrols_desc:0 "Doubled up patrols allow for more coverage over the hinterlands, in turn better consolidating our presence there, but worsen our manpower shortage."
 ANG_Raid_Their_Headquarters:0 "Raid Their Depots"
 ANG_Raid_Their_Headquarters_desc:0 "The rebels store their weapons in caches hidden beneath both the desert sands and the jungle foliage. With some effort, we can cripple their operations by finding and destroying these stockpiles."
 ANG_Send_Out_Aid:0 "Send Out Aid"
 ANG_Send_Out_Aid_desc:0 "The war has been hard on everyone. By giving rural communities first aid supplies and food relief, we can earn goodwill at the cost of some support equipment."
 ANG_Conduct_Bombing_Raids:0 "Conduct Bombing Runs"
 ANG_Conduct_Bombing_Raids_desc:0 "We can use our aerial supremacy to pulverize any rebel hotspot. Bombing runs will stop native attacks now, but may radicalize more later on."
 ANG_Reprisal_Attacks_Warning_1:0 "Begin Reprisal Attacks"
 ANG_Reprisal_Attacks_Warning_1_desc:0 "Any attack on Germans is responded to with an attack on natives. Blood for blood must be the order of the day, so that rebels think twice about attacking us."
 ANG_Reprisal_Attacks_Warning_2:0 "Smother the Villages"
 ANG_Reprisal_Attacks_Warning_2_desc:0 "At great cost to our troops, we can flood rebellious regions with soldiers. Such a show of force will surely cow its villages and root out the rebels hiding within."
 ANG_Send_To_Ostafrika:0 "Send Troublemakers to Ostafrika"
 ANG_Send_To_Ostafrika_desc:0 "Even the rebels in Angola know what happens to natives in Ostafrika. We can crush their will by sending their worst offenders to our eastern colleague."
 ANG_Protect_The_Villages_1:0 "Protect the Villages"
 ANG_Protect_The_Villages_1_desc:0 "The war has brought on a breakdown in order in many areas. By patrolling rural areas and shielding villages from bandits, we can earn their goodwill."
 ANG_Protect_The_Villages_2:0 "Lock Down the Countryside"
 ANG_Protect_The_Villages_2_desc:0 "Some districts harbor more bandits than we can feasibly detect, much less uproot. We can cordon these districts off as a last resort. The natives will despair at the imposed lockdown, but we're sure to quarantine the bandit's rot this way."
 ANG_Arm_The_Villages:0 "Arm the Villagers"
 ANG_Arm_The_Villages_desc:0 "Arming villagers with some old guns to let them fend for themselves has never been popular with our general staff. Nevertheless, doing so will free up men and increase rural security."
 ANG_Reducing_Native_Unrest:0 "We are not already reducing §YNative Unrest§!."
 ANG_Reducing_Native_Militancy:0 "We are not already reducing §ONative Militancy§!."
 ANG_Native_Unrest_Up_Low:0 "This will §Sslightly increase§! the §wnatives' unrest.\n§!"
 ANG_Native_Unrest_Up_Medium:0 "This will §Rincrease§! the §wnatives' unrest.\n§!"
 ANG_Native_Unrest_Up_High:0 "This will §xhighly increase§! the §wnatives' unrest.\n§!"
 ANG_Native_Unrest_Down_Low:0 "This will §Bslightly decrease§! the §wnatives' unrest.\n§!"
 ANG_Native_Unrest_Down_Medium:0 "This will §Gdecrease§! the §wnatives' unrest.\n§!"
 ANG_Native_Unrest_Down_High:0 "This will §yhighly decrease§! the §wnatives' unrest.\n§!"
 ANG_Native_Militancy_Up_Low:0 "This will §Sslightly increase§! the §Onatives' militancy.\n§!"
 ANG_Native_Militancy_Up_Medium:0 "This will §Rincrease§! the §Onatives' militancy.\n§!"
 ANG_Native_Militancy_Up_High:0 "This will §xhighly increase§! the §Onatives' militancy.\n§!"
 ANG_Native_Militancy_Down_Low:0 "This will §Bslightly decrease§! the §Onatives' militancy.\n§!"
 ANG_Native_Militancy_Down_Medium:0 "This will §Gdecrease§! the §Onatives' militancy.\n§!"
 ANG_Native_Militancy_Down_High:0 "This will §Ghighly decrease§! the §Onatives' militancy.\n§!"
 ANG_Native_Militancy_Down_Very_high:0 "This will §yincredibly decrease§! the §Onatives' militancy.\n§!"
 ANG_Borrow_From_Huttig_Tooltip:0 "By using §RHüttig's lessons§!, we might be able to stamp out the bandits for good.\n\n"
 ANG_Stop_Terror_tt:0 "More £decision_icon_small §HDecisions§! to fight back the bandit threat will be unlocked.\n"
 ANG_Send_In_The_Troops:0 "Hüttig will loan two §RSS Divisions§! to help us put down our rebellions.\n\n"
 ANG_Use_Camps:0 "Decisions to §Rsend our more troublesome citizens to Ostafrika§! will be unlocked.\n"
 ANG_German_Sus_idea_1:0 "Very Low German Displeasure"
 ANG_German_Sus_idea_1_desc:0 "The Reich does not suspect anything. As far as it's concerned, war hero and famed aviator Wolfgang Schenck is the man for the job in Südwestafrika."
 ANG_German_Sus_idea_2:0 "Low German Displeasure"
 ANG_German_Sus_idea_2_desc:0 "The Reich is slightly displeased with us of late. Delays in fulfilling requests and inconsistencies in our reports have begun piling up. While much of Germania understands our Reichskommissar governs with a light touch, some are beginning to wonder..."
 ANG_German_Sus_idea_3:0 "German Displeasure"
 ANG_German_Sus_idea_3_desc:0 "The Reich is displeased with us. Lengthy delays in audits, the large number of irregularities they contain, and confusing reports from the colonies have each contributed to heaps of suspicion leered our way. Many now whisper that only treason excuses such gross incompetence..."
 ANG_German_Sus_idea_4:0 "High German Displeasure"
 ANG_German_Sus_idea_4_desc:0 "The Reich is highly displeased with us. Calls for the Reichskommissar's replacement, and for extensive inquiries over his conduct, are no longer the exclusive domain of Hüttig's paranoia. Now even phlegmatic bureaucrats in Germania call for an investigation."
 ANG_German_Sus_idea_5:0 "Very High German Displeasure"
 ANG_German_Sus_idea_5_desc:0 "The Reich is very highly displeased with us. News from Germania has gone quiet as the last bureaucrats skeptical of our wrongdoings have given up defending us. If this level of suspicion does not change, the Reichskommissar is in great danger."
 ANG_Safetey_is_paramount_idea:0 "Safety First"
 ANG_Safetey_is_paramount_idea_desc:0 "Safety is the number one priority of our ground support staff, during both landing and take off. Never again shall a pilot's life be wasted, or a precious fighter jet damaged, by inattention and recklessness."
 ANG_pit_stop_model_idea:0 "The Pit Stop Model"
 ANG_pit_stop_model_idea_desc:0 "Our ground crews have mastered the art of speed, both in preparing themselves and in refuelling aircrafts. Our flyers can now run many more sorties in a day, as their support crew handle the additional refuelling work."
 ANG_pit_stop_modeland_saftey_idea:0 "Reformed Runway Practices"
 ANG_pit_stop_modeland_saftey_idea_desc:0 "Our support crews never rush to do anything, for all know their place and what needs to be done. Nevertheless, the rapidity at which they prepare, refuel and then stow away planes will render our enemies jealous. Our ground crews now operate at peak performance!"
 ANG_Native_Militancy_1:0 "Native Compliance"
 ANG_Native_Militancy_1_desc:0 "The natives are not resisting our rule. Highways throughout the Reichskommissariat run smoothly between orderly cities and garrisons. In the field and in factories, locals do their work dutifully. All is well."
 ANG_Native_Militancy_2:0 "Limited Native Resistance"
 ANG_Native_Militancy_2_desc:0 "Some of the natives are beginning to resist our rule. Rumors of strikes and protests have begun spreading towards more distant areas."
 ANG_Native_Militancy_3:0 "Native Unrest"
 ANG_Native_Militancy_3_desc:0 "The natives are overall not happy with us, and tension continues to rise. Settlers and German soldiers stare worriedly at graffiti sprouting from clean walls overnight."
 ANG_Native_Militancy_4:0 "General Disorder"
 ANG_Native_Militancy_4_desc:0 "The natives have gone from mere planning to action. Street protests and wildcat strikes have paralysed many regions of the Reichskommissariat. No amount of threats seems to cow the natives' troublemaking."
 ANG_Native_Militancy_5:0 "Full Scale Riots"
 ANG_Native_Militancy_5_desc:0 "Native militancy has spun out of control. Active riots in almost every city and village have threatened our increasingly tenuous grip over the Reichskommissar. Death does not seem to worry the rioters too much as they continue to defy our troops."
 ANG_build_quickly_idea:0 "Enforced Mining Quotas"
 ANG_build_quickly_idea_desc:0 "It is time to enforce some mining quotas in the Reichskommissariat. While we do not wish to burden the natives too much, they must still contribute to our stockpiles of steel and other industrial metals. Ample reserves of raw material will help us rely on our own industrial sector for plane parts and other necessities."
 ANG_air_control_sudwestafrika_econ:0 "The Südwestafrikaner Air Control"
 ANG_bomber_plans_econ:0 "Formulating New Bomber Plans"
 ANG_fighter_plans_econ:0 "Formulating New Fighter Plans"
 ANG_air_attack_plans_econ:0 "Formulating Air Attack Plans"
 ANG_better_than_new_econ:0 "Salvaging Equipment and Parts"
 ANG_planesforfactories_econ:0 "Trading Planes for Industrial Power"
 ANG_conqueringthedesert_econ:0 "Constructing Air Bases on the Desert"
 ANG_thesouthernskies_econ:0 "Constructing Air Bases in the South"
 ANG_Slipping_The_Plans:0 "Cracked Codes"
 ANG_Slipping_The_Plans_desc:0 "Our worst fears have been confirmed: the OFN has somehow managed to crack our codes and can now read our moves with as much accuracy as we do ourselves. We had our suspicions aroused when they began intercepting our flights with growing regularity, but we had brushed it off as simply bad luck. There is no denying it now, however. If only it were as easy to fix as changing the codes, even daily if we have to, but our attempts thus far are fruitless. We have no idea how they have so easily acquired sensitive information; Reichskommissar Schenck seems convinced a mole hides among the air control service. He has vowed to flush them out, whoever they may be."
 ANG_Constant_Partisans:0 "The Unsecured Homeland"
 ANG_Constant_Partisans_desc:0 "Rebels have increased their attacks against government patrols, facilities and production plants. With no discernible reason for such a sudden development, our planners have begun assuming a "third party" is supplying them with funds and weapons.\n\nWhether said party is the CIA, South Africa, or someone else entirely, remains a mystery. At least for now."
 ANG_Broken_Fuel_Lines:0 "Broken Fuel Lines"
 ANG_Broken_Fuel_Lines_desc:0 "Our frontline troops' access to fuel is becoming more uncertain by the day, Reichskommissar Schenck talks of accidents at refineries, American air strikes and ambushes by natives as reasons for his numerous delays. Unfortunately, we are dependent on him; If he is not competent enough to solve the issues plaguing our supply lines, our troops may suffer shortages that could stop our war machine on its tracks."
 ANG_Token_Troops:0 "Token Troops"
 ANG_Token_Troops_desc:0 "We are not committing our entire army to the frontlines, but only the bare minimum necessary to deceive the other two Reichskommissars of our participation in their futile war. We've already shed too much blood in this vain adventure to herd German and African youth like wildebeests into South Africa's minefields, rotting just the same. While we keep as much suspicion off our backs and offer excuses of partisan sabotage and native uproar, we will be hard at work preparing the future Angolan state that will take our place on this continent and its weight off our souls. Müller will be easy to fool, and even if Hüttig suspects something is amiss, he will have neither the evidence nor the breathing room to stop us."
 ANG_No_One_In_No_One_Out:0 "No One In, No One Out"
 ANG_No_One_In_No_One_Out_desc:0 "Threats of saboteurs and dissidents entering Südwestafrika from commercial routes has compelled Reichskommissar Schenck to ground all flights to and from the colony for the time being. Cargo and passenger flights now line departure runways, and Luftwaffe wings stew in their bases after having been recalled mid-flight. In effect, Schenck has wilfully clipped the Schild's wings just as its conflict with the OFN enters a new, intense stage."
 ANG_USA_Infiltrated_RK_Armies:0 "Infiltrated RK Armies"
 ANG_USA_Infiltrated_RK_Armies_desc:0 ""
 ANG_Disrupted_Comms:0 "Disrupted Communication"
 ANG_Disrupted_Comms_desc:0 "Lines of communication between frontline units and their commanding officers are being regularly disrupted, greatly hampering our troops' effectiveness in the field. We will invite disaster if we do not soon take steps to restore them."
 ANG_Muller_Airlift:0 "Zentralafrikaner Airlift"
 ANG_Muller_Airlift_desc:0 "By diverting some of our helicopters to assist Müller's troops we have increased their somewhat lacking effectiveness and help keep them well supplied far from their normal centers of operation. Of course, this means we have less helicopters available to assist our own troops."
 ANG_Muller_sus_idea_1:0 "Müller's Suspicion"
 ANG_Muller_sus_idea_1_desc:0 "Müller does not suspect anything. In general our northern colleague pays us little attention, instead balancing it between the local bar scene and yet another hunting expedition."
 ANG_Muller_sus_idea_2:0 "Müller's Suspicion"
 ANG_Muller_sus_idea_2_desc:0 "Müller's curiosity has been piqued. With lingering stares and probing questions, the hunter's flair for small details has broken through some of his indifference. This is most likely still a game for him."
 ANG_Muller_sus_idea_3:0 "Müller's Suspicion"
 ANG_Muller_sus_idea_3_desc:0 "Müller's suspicions have grown. Our northern colleague now spends an inordinate amount of time reviewing evidence about us. Perhaps the man only seeks to satisfy his curiosity. More likely, however, is that he has a vague idea of what we are really up to, and seeks to profit from this information."
 ANG_Muller_sus_idea_4:0 "Müller's Suspicion"
 ANG_Muller_sus_idea_4_desc:0 "Müller is now very suspicious of us. If we don't get rid of his attention somehow, the consequences will be disastrous."
 ANG_Lords_Of_The_Air:0 "Lords Of The Air"
 ANG_Lords_Of_The_Air_desc:0 "Other Reichskommissariats may have us beat in terms of land forces, but there is a reason we are the linchpins of the Afrika-Schild's strategies. While Hüttig butchered natives and Müller hunted the beasts in his jungles, we had produced and maintained the world's greatest planes and pilots. Our bombers can ravage formations and raze cities, and our fighters can cut the prime of the West's airfleets to the grain. We can ferry our troops to the front in a few hours' time, we are the cavalry of the modern age - the knights of the sky. The Amerikaner know it, Hüttig and Müller refuse to admit it, and we flaunt it: we are the lords of the air!"
 ANG_Lords_Of_The_Air_2:0 "Gods of the Sky"
 ANG_Lords_Of_The_Air_2_desc:0 "Trails of fire streak the skies above South Africa day in and day out. They are the OFN's answer to our skill and cunning, yet look at how they fall to Earth! Like Icarus they flew towards the Sun to match our prowess and power, their wings clipped as punishment for their hubris. We wonder how they can keep sending more young men to their deaths, well aware of their actions' futility - but they do not stop. In the heart of every sky night lurks visions of that smoke-filled descent from the clouds of freedom to unforgiving dirt. To the West's dogs, we have become the harbingers of that fate."
 ANG_Joint_Offensive_Shit:0 "Coordinated Attacks"
 ANG_Joint_Offensive_Shit_desc:0 "The only way for our war to succeed is if we come up with a well crafted strategy with the rest of the Schild. That may be almost as difficult as actually fighting the South Africans, but we will leave ourselves vulnerable to being picked off one by one should we fail to coordinate. We control the air fleets of Africa, so we shall provide air support while Müller provides his boundless resources and Hüttig provides his veteran killers. Together we will work as a single body crushing the Amerikaner as they come."
 ANG_PlanesInOurHand_1:0 "Centralized Air Control"
 ANG_PlanesInOurHand_1_desc:0 "With our near full monopoly over Luftwaffe aircraft and resources in Afrika, we may rest assured that all airborne operations shall proceed as we intend them to. While this may be upsetting for our partners in the Schild, this will prevent any incidents due to conflicting orders from three separate chains of command, otherwise precluding flight operations from proceeding smoothly and with great effect."
 ANG_PlanesInOurHand_2:0 "Efficient Air Control"
 ANG_PlanesInOurHand_2_desc:0 "With a great fleet of aircraft comes a great need for skilled personnel to pilot them. While allowing any layman with minimal training to take to the skies might suffice to some, Südwestafrika's aircraft shall only be piloted by the best and brightest. As such, all of our existing aviators, as well as any prospective new blood, are put through a long, rigorous training process.\n\nForced to develop and prove both their physical strength and mental prowess, our pilots will be ready to face any foe once they graduate. Many will not, but such is a small price to pay for a new generation of ace pilots."
 ANG_PlanesInOurHand_3:0 "Improved Air Control"
 ANG_PlanesInOurHand_3_desc:0 "Day by day, our best and brightest take to the skies in a campaign of conquest - the conquest of the air. Our pilots, their skills and abilities honed by a rigorous training program from which only an elite few graduate, have become a terror to all. These men have since been put to good use in concurrent air operations, where they have. Foreign pilots surely tremble at the thought of dogfighting a Südwestafrikan aviator!"
 ANG_RANDR:0 "Rest and Rehabilitation"
 ANG_RANDR_desc:0 "In the Second World War, Schenck saw first hand the dangers of pushing soldiers harder than a human being can handle physically and mentally. Burn out, shell shock, even suicide; In other words, a recipe for total disaster.\n\nBeing a soldier is stressful enough as it is, but asking a man to fly an aluminum death trap sortie after sortie, with decreasingly low odds of survival in the sky and no chance of survival when shot down? Bravery like that deserves a little R&R every now and then, if only so our most advanced pieces of equipment are not handled by sleep-deprived, traumatized men."
 ANG_RANDR_2:0 "Veteran-Led Training"
 ANG_RANDR_2_desc:0 "Most of our pilots are still greenhorns; after all, they've never fired a shot in actual combat discounting mock-ups and simulations ill-fitted for preparing a man for real battle. Sending them into the meat grinder as they are now will only waste us manpower and planes at unacceptably high rates.\n\nHaving a good deal of real life experience himself, Schenck has designed a crash-course veteran's led training regime these pilots will be subjected to. There they'll hopefully learn how not to fall from the sky minutes after contact."
 ANG_Natives_In_The_Air_1:0 "Integrated Native Support"
 ANG_Natives_In_The_Air_1_desc:0 "Schenck is not too proud to admit that the war will not be won by Aryan might alone. Despite Hüttig's fantasies, we will eventually run out of German-born pilots; if we continue adhering to his delusions, we will soon find ourselves at the mercy of OFN bombers.\n\nWe may not have a large reserve of our own pilots, but we do have quite a large population of natives that could be better put to use as pilots than slaves or, worse yet, completely unutilized. A program to train the natives' best and brightest in the art of flight might just edge us past the tenuous line between victory and defeat."
 ANG_Natives_In_The_Air_2:0 "Native Squadrons"
 ANG_Natives_In_The_Air_2_desc:0 "We've received the reports from the air wings with our first native recruits; so far, the results are impressive. The natives are not yet the equals of our own extensively trained pilots, but with the rate at which they soak lessons both theoretical and applied, native aces will not be long in coming.\n\nReichskommissar Schenck agrees with this assessment, so much so that he has ordered half a dozen all-native air squadrons raised at once. Rumblings in Bouhlerstadt carry hardliners' dissent, but results are results - purity is a luxury we can't afford at present."
 ANG_Mutual_Assistence_Pact:0 "The Mutual Assistance Agreement"
 ANG_Mutual_Assistence_Pact_desc:0 "Afrika's designated airport was never built to handle a land war; moreover, with our supply lines from the Vaterland cut, we will eventually run out of supplies and fuel sooner rather than later. That is, unless we actually cooperate with our fellow Reichskommissarriats. How helpful they'll end up being is questionable; after all, Hüttig seems to hate us with a passion and Müller... well, we have no indication that Müller will necessarily care any more about our life or death struggle than he ever did about running his colony. Still, if we can actually get them to take the pressure off of our land forces we can better fight the air war. Everyone will win, but only if we bother to."
 ANG_Mutual_Assistence_Pact_COG:0 "The Mutual Assistance Agreement"
 ANG_Mutual_Assistence_Pact_COG_desc:0 "We may not really like our friends here in the colonies - Schenck is a bit of a bore and Hüttig is a bit of a stiff asshole - but we have no choice now but to work with them if we wish to survive, and we certainly fucking do. So if Schenck needs our boys' feet on his ground so he and his planes can fuck about in the sky for us, then he'll get what he wants. Likewise with Hüttig and the ores he needs to make guns for gunning kids down or whatever he does for fun.\n\nOf course, any trade comes with give and takes. Our bases better damn well start seeing transports and anti-partisan units soon."
 ANG_Mutual_Assistence_Pact_GRO:0 "The Mutual Assistance Agreement"
 ANG_Mutual_Assistence_Pact_GRO_desc:0 "It pains to admit, but for the moment at least, we need those degenerate failures in Windhuk and Léopoldville to give us support if we wish to drive the OFN's race traitors to Hell. Naturally, we do this only out of pure practicality. The idea of collaborating with Müller, the incompetent bastard, or bleeding-heart Schenck is almost enough to make us nasueous - but we all have to make sacrifices in a crisis. With a little luck and a few million liters of spilt American and South African blood we can end this farce quickly. After then... well, then we won't need dead weight any longer, now will we?"
 ANG_Road_Of_Life:0 "Der Weg des Lebens"
 ANG_Road_Of_Life_desc:0 "It is an unfortunate geographical fact that Südwestafrika, with a good air force but poor army, borders South Africa whereas Zentralafrika, with a good army but poor air force, does not. Still, crying over truths will get us nothing, and technology will carve a path across the barriers Nature has set up between our brothers in the north and the front.\n\nWe have set up a deal with Müller where our sizable complement transport planes and helicopters will establish an "air highway" between his divisions and our airports. The Afrikaner Luftwaffe will ensure Müller's men march into combat as fresh as before they left the Congo."
 GRO_Financed_Shit:0 "Financed Industry"
 GRO_Financed_Shit_desc:0 "As Ostafrikan marks flow in to help pay Südwestafrikan industries' expenses, the colonial elite find themselves with enough cash to expand their enterprises. With the generous inflow of capital comes warming opinions of Hüttig among Südwestafrika's self-made men. Reichskommissar Schenck cannot pretend to detest this gesture, even if personal relations between the two Reichskommissars remain chilly."
 ANG_Roll_Them_Off_The_Line:0 "Factory Efficiency Reforms"
 ANG_Roll_Them_Off_The_Line_desc:0 "The office of the Reichskommissar has announced a sweeping program of regulations and reforms aimed to drastically improve efficiency, specifically in fighter production. Südwestafrika's air fleets may be the most impressive in all of the continent, but now that the OFN has begun to deploy their squadrons by the dozens above South Africa, the Schild's own airbase must step up to the task of matching Amerikaner planes in numbers."
 ANG_Using_Our_People:0 "Native Squadrons"
 ANG_Using_Our_People_desc:0 "Tired of the unending transgressions of Hüttig's SS cronies, Reichskommissar Schenck has refused to accept their services any longer. However, a Reichskommissariat would be nothing without its army; hence, Südwestafrika has begun conscripting natives into the Südwestafrikan Kolonialgarnison to address the abrupt shortage of armed men the Ostafrikan troops left behind. While we can expect little out of these men other than what they are forced to do for next to no pay, they can hold a rifle, shoot at the enemy, and plug the gaps within our ranks. Somewhat."
 ANG_Using_Our_People_Paid_Well:0 "Well Paid Native Squadrons"
 ANG_Using_Our_People_Paid_Well_desc:0 "The Südwestafrikan native recruitment program has been ramped up, with handsome pay offered to those men who take part. As a result, fit and willing men from across the Reichskommissariat have abandoned their meager lives for their promised, wealthy keep in the Kolonialgarnisons. Not only are their numbers impressive, but these men are also highly motivated in fighting hard for what they're, literally, worth. Their loyalties are secure."
 ANG_Using_Our_People_Paid_Enough:0 "Compensated Native Squadrons"
 ANG_Using_Our_People_Paid_Enough_desc:0 "Whilst the native KolonialGarnisonen are technically paid for their service, it is little more than a pittance. The only ones who appear to be enticed by such small payments are destitute farmers and peasants who have few other options to feed themselves and survive the next month. Whilst this pay may bring in more bodies to hold rifles, it is merely enough to ensure the men do their jobs without question. Little more can be expected of such recruits."
 ANG_Using_Our_People_Paid_Well_2:0 "Well Paid Native Patrols"
 ANG_Using_Our_People_Paid_Well_2_desc:0 "Reichskommissar Schenck has expanded his native Kolonialgarnison program to include a near luxurious pay cheque for every volunteer involved. Luxurious enough, in fact, that men all across Südwestafrika have drop their tools of labour to flock towards the recruitment offices in record numbers. In exchange for such grand payments, the native squadrons have gone above and beyond in their duties for the Reichskommissariat. If one were to look only upon their deeds, they could easily be mistaken for the German soldiery. Perhaps men and their happiness really can be bought."
 ANG_Using_Our_People_Paid_Enough_2:0 "Compensated Native Squadrons"
 ANG_Using_Our_People_Paid_Enough_2_desc:0 "Whilst the native KolonialGarnisonen are technically paid for their service, it is very meager. A salary this small seems to only appeal to young boys who have not known better pay, or men who have fallen upon hard times. Regardless of the kinds of men attracted by such meager pay, the increase in performance has been noticeable. Although it inspires few acts of valour, it would appear that the prospect of going home with a pocket full of marks is an exciting one to some, and they're much more willing to fight and serve to earn it."
 ANG_SS_Anti_Terror:0 "SS Anti-Terror Operations"
 ANG_SS_Anti_Terror_desc:0 "As a show of good-will between our two Reichskommissariats, Hüttig has sent several SS brigades he assured us were "experts" in counterinsurgency and anti-terror operations. He was not lying; these SS men are good and what they do. Perhaps too good in fact.\n\nReports from our own counter-insurgency teams report entire villages razed to the ground, and even evidence of mass graves close to some of these ruins. While some in our administration have voiced concerns that such actions may damage long-term stability, we have observed a noticeable decrease in raids on our forces. These measures may be difficult to stomach, but war demands sacrifices."
 ANG_SS_Anti_Terror_2:0 "Trained SS Squadrons"
 ANG_SS_Anti_Terror_2_desc:0 "Given the SS' laudable performance since their arrival, Schenck has felt compelled to request further support from Hüttig. Despite the personal disagreements the two have had, it seems that Hüttig genuinely enjoys stomping out native movements wherever he can find them, even if he has to work with men he personally despises. The newest batch of SS troops he has deployed within Südwestafrika are highly competent butchers, many of whom have significant experience from service in Ostland and Moskowien.\n\nWhile any help is appreciated, some are beginning to wonder if the price is worth Hüttig's own. We've since received more reports of partisan actions against civilian population centers than before, especially by groups heretofore unsuspected of participating in reprisals. Native representatives are outraged, and more than one of Schenck's aides have blanched when shown photos of what the SS has done to two prominent native communities in Angola."
 ANG_Reprisal_Attacks:0 "Reprisal Attacks"
 ANG_Reprisal_Attacks_desc:0 "When the first reports of widespread attacks on supply lines and depots began to filter in, we assumed it was the work of OFN spec ops units. It wasn't until local barracks started getting hit that we realized the truth was far more concerning: native reprisals, far more coordinated than anything we had ever seen from them before, occurring on a daily basis.\n\nIt seems that we could only keep them checked in fear for so long, but now that our attention is fixed firmly south, they have chosen their moment to strike like snakes in the grass. If we are unable to resolve this situation we risk having our attention dangerously divided."
 ANG_Secure_The_Homefront:0 "Our Skies Stay Clear"
 ANG_Secure_The_Homefront_desc:0 "As we empty our hangars and deploy our mighty air fleets to combat the OFN's squadrons, we must take great care not to leave our own lands as ripe targets for American bombers. With most of our fighters committed to South Africa's skies, it seems only a matter of time before even the dimmest of their commanders realize how vulnerable we really are.\n\nOf course, we don't have to be as weak as they assume. While we will still be pumping out new aircraft as fast as they can be assembled we will also put substantial resources into establishing fixed anti-aircraft flakturmen that can tear bomber flights to shreds within minutes."
 ANG_Boer_Help:0 "A Lended Hand"
 ANG_Boer_Help_desc:0 "The Boers are on the front line of this battle against the OFN, yet they are severely lacking in air power save for a few retrofitted civilian planes from private donors. While we and our fellow RKs have mobilized to their aid, the fact remains that these brave warriors are easy pickings for the West's air fleets.\n\nWe have begun shipping out planes from our surplus to the air bases under Boer control in the hope that they can make more effective use of them than we currently can. We have also sent several of our flight instructors to build up their pilot cadres."
 ANG_In_The_Nuts:0 "Concentrated Effort"
 ANG_In_The_Nuts_2:0 "Concentrated Effort"
 ANG_In_The_Nuts_3:0 "Concentrated Effort"
 ANG_In_The_Nuts_2_desc:0 "War is no place for weak-kneed idealists or conscientious ethicists. Modern war is a brutal, mechanistic affair that prioritises pure results over any notion of morality or "fair play". We did not create this truth, but we are damn well going to carry it out. Shooting down enemy planes and bombing enemy formations is all well and good, but planes can be made on assembly lines and divisions can always be pulled back and reinforced.\n\nBut rebuilding a city is no easy task. Their industries, their logistics, even their culture and people will be ground to dust to show our foes the price of their actions. Perhaps their soldiers will think twice about going into battle when they must remember the fact that we can wipe their and their comrades' families from the face of the planet."
 ANG_In_The_Nuts_3_desc:0 "War is no place for weak-kneed idealists or conscientious ethicists. Modern war is a brutal, mechanistic affair that prioritises pure results over any notion of morality or "fair play". We did not create this truth, but we are damn well going to carry it out. Shooting down enemy planes and bombing enemy formations is all well and good, but planes can be made on assembly lines and divisions can always be pulled back and reinforced.\n\nBut rebuilding a city is no easy task. Their industries, their logistics, even their culture and people will be ground to dust to show our foes the price of their actions. Perhaps their soldiers will think twice about going into battle when they must remember the fact that we can wipe their and their comrades' families from the face of the planet."
 ANG_In_The_Nuts_desc:0 "War is no place for weak-kneed idealists or conscientious ethicists. Modern war is a brutal, mechanistic affair that prioritises pure results over any notion of morality or "fair play". We did not create this truth, but we are damn well going to carry it out. Shooting down enemy planes and bombing enemy formations is all well and good, but planes can be made on assembly lines and divisions can always be pulled back and reinforced.\n\nBut rebuilding a city is no easy task. Their industries, their logistics, even their culture and people will be ground to dust to show our foes the price of their actions. Perhaps their soldiers will think twice about going into battle when they must remember the fact that we can wipe their and their comrades' families from the face of the planet."
 ANG_In_The_Nuts_4:0 "We Rule Supreme"
 ANG_In_The_Nuts_4_desc:0 "There is no respite for South Africa's people. We have filled their skies with our fighters and sent bombers to deliver grim deeds to their cities. Fires are left to rage and burn themselves out, bodies left to decay and rot, as their government is stretched to its breaking point by our air fleets. They beg us to end the torture our bombers inflict; there will be no end until they submit.\n\nThe West was foolish to forget what the Luftwaffe accomplished in the Second World War. Hopefully they'll remember more clearly this time around."
 ANG_Afrikaner_Airstrip_desc:0 "The deserts of Südwestafrika host the largest, most developed airfields on the entire continent. For access to their mightiest airhub, Reichskommissar Schenck charges the Reich every step of the way - for fuel, runway use, hangar space, and more. These bring a steady stream of income straight back into developing, operating, and maintaining our air force. The land may be volatile, but we rule the skies."
 ANG_Away_In_The_Clouds:0 "Away In The Clouds"
 ANG_Away_In_The_Clouds_desc:0 "Our lands are filled with poverty, disease and rebels. But in the skies, our Reichskommissar can find peace. Preferring to spend his time on his pet projects than in any government building, Schenck can be found more often flying than he can be found ruling. Our administration of the region has inevitably suffered as a result, forcing us to empower more and more local leaders."
 ANG_Incoherent_Bookkeeping:0 "Incoherent Bookkeeping"
 ANG_Incoherent_Bookkeeping_desc:0 "Südwestafrika's economic administration is a bureaucratic labyrinth. It seems impossible to track any amount of money from revenue to expense. How this system actually works appears reserved to the minds of a select few accountants in Schenck's service, who has consistently postponed proposals to reform the system."
 ANG_Incoherent_Bookkeeping_2:0 "Incoherent Bookkeeping"
 ANG_Incoherent_Bookkeeping_2_desc:0 "Südwestafrika's economic administration is a bureaucratic labyrinth. It seems impossible to track any amount of money from revenue to expense. How this system actually works appears reserved to the minds of a select few accountants in Schenck's service, who has consistently postponed proposals to reform the system."
 ANG_Incoherent_Bookkeeping_3:0 "Incoherent Bookkeeping"
 ANG_Incoherent_Bookkeeping_3_desc:0 "Südwestafrika's economic administration is a bureaucratic labyrinth. It seems impossible to track any amount of money from revenue to expense. How this system actually works appears reserved to the minds of a select few accountants in Schenck's service, who has consistently postponed proposals to reform the system."
 ANG_Incoherent_Bookkeeping_4:0 "Fixed Books"
 ANG_Incoherent_Bookkeeping_4_desc:0 "With its increased economic power, Südwestafrika has begun exploiting its subsidiary activities to fund several projects all throughout its lands.\n\nWhile some in Germania complain that there's no way that such a poor Reichskommissariat could be able to afford such large expenses, the accounting books say otherwise. How much of the hodgepodge of interlocking numbers and investment sub-categories is actually true, on the other hand, is up for interpretation..."
 ANG_Afrikaner_Airstrip:0 "Afrikaner Airstrip"
 ANG_The_Fatherland_Arrives:0 "The Heimat Arrives"
 ANG_The_Fatherland_Arrives_desc:0 "Following immense delay and widespread perceptions of abandonment, support from Germany has at last arrived to assist us in the struggle against the OFN. While the forces from the Heimat are officially in the Afrikan Reichskommissariats strictly to conduct routine colonial duties - training, garrison duty, pacification - with due diligence, they also bring with them expertise, cutting edge equipment, and veteran leadership. Given the public image Germania wishes to preserve, German forces will be hard pressed to assist us in the conducting of offensive operations. We may rest assured, however, that the Heimat will not abandon its colonies to be savaged by the OFN!"
 ANG_Air_Empire_Dynmod_Dummy:0 "The Air Empire"
 ANG_Air_Empire_Dynmod_Dummy_desc:0 "§DResource Gain Efficiency: [?ANG_Air_Empire_Resource_Extration|+%]\nProduction Efficiency Retention: [?ANG_Air_Empire_Production_Retention|+%]\n£prod_eff_cap Production Efficiency Cap: [?ANG_Air_Empire_Max_Production|+%]\nFuel Gain per Oil: [?ANG_Air_Empire_Fuel_Gain|+%]\nFuel Capacity: [?ANG_Air_Empire_Max_Fuel|+%]§!\n§g--------------§!\nReichskommissariat Südwestafrika is often nicknamed the so-called "The Air Empire" for its crucial role as the base of operations for the Luftwaffe in the sub-Saharan region of Africa. Though ridiculous in speech, many within the Südwestafrikaner government have taken this nickname seriously, and thus, it shall truly be the Air Empire.\n\nFor this 'empire' to thrive, the Reichskommissariat must ensure that excels in its role. Thus, efficiency, production, management, and everything the Reichskommissariat does must have the highest of standards to truly live up to its title."

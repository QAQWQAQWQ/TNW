 DFK_national_socialism_party:0 "Baku Industrialists"
 DFK_national_socialism_party_long:0 "Baku Industrialists"
 POLITICS_OTTO_WEIDINGER_DESC:0 "Slave uprisings swept across the eastern territories of the Reich, and the Caucasus was hit hardest. Since this region was notorious for the abuse of slaves and locals, the fires of rebellion burned all the hotter here, and the old order was shattered in the violent whirlpool. The last remnants of German rule retreated into Baku — the center of the Empire's oil production — and were forced to fill their decimated garrisons with mercenaries from various corporations, a move that sealed their doom.\n\nOtto Weidinger is no bureaucrat; he is a soldier through and through. Ever since he left the SS to become a mercenary, Weidinger has spent most of his time on the move with his mercenary group, taking whatever job offered a good price. From hunting down partisans to guarding company property, Weidinger took it all — he and Siegfried Müller were both typical mercenaries. However, he had no experience whatsoever in how to run a country; that was left to the corporations.\n\nWeidinger was nothing more than a puppet; the ones who truly held power were the corporations behind him — oil companies, tungsten companies, all sorts of companies gathered under Schörner's banner to restore the old glory. Their forces overthrew the former pro-German government, pushed Weidinger to the forefront, and gave him the power to deal with the slaves. Weidinger had no qualms about his situation — apart from commanding his own mercenaries, the rich rewards and control over the company's armed forces were enough for him. Whether he helped Germany restore its past glory was none of his concern. As for commanding troops, this was the job he had always dreamed of — assuming he could keep it up."
 DFK_Otto_Weidinger:0 "Otto Weidinger"
 DFK_Funding_from_the_Shadows:0 "Funding from the Shadows"
 DFK_Funding_from_the_Shadows_desc:0 "Small streams of gold flow in the depths of the shadows, and Weidinger is only too happy to pocket them. To maintain their rule over the Baku region of the Caucasus, the German Freikorps has received secret support from powerful financial magnates and the Moscow district marshal — Ferdinand Schörner."
 DFK_Band_of_Brothers:0 "Band of Brothers"
 DFK_Band_of_Brothers_desc:0 "Apart from blood ties and heritage, the only thing that binds men together is war. The German Freikorps is a band of mercenaries who have fought side by side through thick and thin. In peacetime they laugh and joke together; on the battlefield they charge forward shoulder to shoulder. The flames of war have forged the Freikorps into one, and nothing can tear them apart."
 DFK_Rule_of_the_Mercenaries:0 "Mercenary State"
 DFK_Rule_of_the_Mercenaries_desc:0 "Baku has fallen under the chaotic rule of the German Freikorps, a horde of brutal German mercenaries with no experience in governing a country. Given the nature of such a mercenary government, Baku is now heavily militarized and in extreme instability — both socially and militarily — which comes as no surprise to anyone."

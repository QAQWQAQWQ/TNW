 SAU_kingdom_of_black_gold: "Kingdom of Black Gold"
 SAU_kingdom_of_black_gold_desc: "The Saudi regime, once just a tribe in the Arabian interior, rose to fortune through God's blessing and the gift of oil. Black gold gushes from the sands as if endless; as the backbone of the Saudi economy, its importance completely overshadows all other industries. Thanks to its alliance with Italy, Saudi Arabia has amassed enormous wealth by selling oil to the world — so much they hardly know how to spend it."

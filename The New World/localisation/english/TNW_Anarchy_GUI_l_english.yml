l_english:
 TNO_Anarchy_ToolTip: "[GetAnarchyGUIToolTip]"
 TNO_Anarchy_ToolTip_Delayed: "§L[GetAnarchyGUIToolTipDelayed]§!"
 TNO_Anarchy_diplo_tt: "This is an anarchic region, we cannot interact with it."
 TNO_Anarchy_ZZZ_tt: "§oAnarchy§!"
 TNO_Anarchy_ZZZ_tt_delayed: "Before thinkers like Proudhon and Kropotkin formulated anarchist theory, anarchy had only one definition: chaos. This is what Thomas Hobbes called the 'state of nature,' a time when every man was against every other, and life was 'solitary, poor, nasty, brutish, and short.' This was the earliest state humanity experienced, gradually abandoned for settled agricultural life beginning with the hunter-gatherer era. Unfortunately, some have returned to this state.\n\nWhether through war, natural disaster, or political upheaval, some region of the world lacks any governing body capable (or willing) to maintain its authority. The end result is not merely the withering away of any form of state, but the total collapse of all centralized authority. No power extends beyond the smallest village, and any administration or infrastructure beyond the local level has crumbled to dust. Those who live outside remote villages have become nomads, hunting and gathering while evading beasts and bandits. This is a way of life that permits no art, culture, or higher learning; after all, even those inclined to pursue such things are too busy surviving to devote themselves to it. With time, the conditions that caused this collapse may disappear, and civilization may flourish again. But until then, there will be no god here, and no master."
 TNO_Anarchy_ZZZ_Heydrich_tt: "§EGerman Anarchy§!"
 TNO_Anarchy_ZZZ_Heydrich_tt_delayed: "§LThe world is but a hand-cranked organ, played only by God Himself. And we all can only dance to the notes drawn forth by the bellows.§!"
 TNO_Anarchy_ZZZ_Nuclear_tt: "§xNuclear Wasteland§!"
 TNO_Anarchy_ZZZ_Nuclear_tt_delayed: "Once, everything had a reason. Perhaps it began with a misunderstanding, a game of chicken, or a terrible war. But it grew too large, leaving those who lived no choice.\n\nThose reasons no longer exist. The nations that expressed concern, the leaders who made the fatal decisions, the people who could only watch - all have turned to mere dust. The wind howls, carrying away the stories, flesh, and souls of billions. The creatures struggling to survive amid the ruins have died off one by one.\n\nHumanity has not perished. Embers cling to their ancestors' relics, marveling at the wonders and ruins of antiquity, slowly digging unity and knowledge from the mud.\n\nIf they are lucky, perhaps in the future they will repeat the same mistakes."
 TNO_Anarchy_OMO_tt: "§BVast Wastes of Northeastern Siberia§!"
 TNO_Anarchy_OMO_tt_delayed: "After the Soviet collapse, no successor power or splinter state emerged in the most isolated reaches of Siberia. Lacking a centralized bureaucracy, infrastructure, industry, large-scale trade, or long-distance communications to unify the region, these villages have largely reverted to a way of life centuries old: subsistence agriculture, hunting, and herding. The local Yakuts, Evenks, and Chukchi have been free to return to their shamanic beliefs without interference, and the Orthodox Russian villages do not trouble them. Usually the farthest anyone travels is to another village, and residents may wait years to hear a scrap of news from the outside world.\n\nThough the region may be rich in resources, the warlords in the more habitable lands to the south and west see no need to conquer it. The vast expanse, backward infrastructure, and brutal winters are enough to deter any sensible dictator from such a foolish venture. Leaving it alone carries almost no danger - most villages can field only a handful of elderly men, armed even with old-fashioned hunting rifles. It seems that unless the Siberian peoples can somehow unite, or be conquered by someone who has successfully inherited Russia's legacy, they will continue their accustomed life: isolated, living on the edge of the world."
 TNO_Anarchy_VIL_after_midnight_tt: "§sDead Wasteland of Northeastern Siberia§!"
 TNO_Anarchy_VIL_after_midnight_tt_delayed: "In distant and faded memory, in this desolate and remote land, there was once a dream. A dream of a peaceful Russia, untroubled by strife and suffering, which would stand as a child of God, cared for and guided by one of God's many servants.\n\nBut God's grace was not enough to protect him, and this land suffered under the usurper's rule, who wrote unspeakable tragedy in his own name.\n\n§xNow, this cradle of hope holds nothing but poison and death, for God dares give Russia no false hope again.§!"
 TNO_Anarchy_DRL_tt: "§sSouth Urals Anarchy,§! §oOskar Dirlewanger's§! legacy"
 TNO_Anarchy_DRL_tt_delayed: "The monster is dead. What he left behind is not a great empire fit to rival Alexander, but blood and suffering.\n\nDirlewanger's vile and perverted personal tastes were well known among his men, but his ambition was not; men served Dirlewanger and his fiefdom only out of fear and greed. With the king dead, loyalty among the bandits shattered utterly: rival gangs fight one another over the remains of the South Urals.\n\nThe victims have found no respite either. Though the Dirlewanger Brigade is no more, suffering continues. In the endless fighting, no new government with more authority than a village elder has been established. Each village must look after itself, protecting what little remains from bandits who believe only in violence and cruelty. The chaos of the South Urals will persist until an outside force can one day put an end to the local anarchy.\n\nBut for now, the people of the South Urals must endure; life here is nasty, brutish, and short."
 TNO_anarchy_NRL_tt: "§BIsolated Villages of Northern Siberia§!"
 TNO_anarchy_NRL_tt_delayed: "When Soviet economists drafted the Siberian Plan, the northern reaches of central Siberia were viewed with great promise. Highways would connect the endless tundra to the rest of Russia; industry would spring up atop rich mineral veins; cities would rise where nothing had stood before. As the 1930s arrived, all these grand designs soon turned to ash. Shovels were no match for permafrost, and forced labor was everywhere. Compared to the industrial cities to the south, the roads here were crude, barely connecting a few towns and Gulag complexes. When the Great Patriotic War began, all development plans were abandoned except for the rapid extraction of the northernmost mining areas using forced labor. After the war ended, the region fell into total disrepair and isolation.\n\nToday, the great works of the Siberian Plan are nothing but rotting metal husks, silently recounting their story to the few who venture here from southern Siberia. The Gulags are abandoned, the mines long since derelict, and the few roads built in the region have largely been swallowed by the Siberian cold. The small population that exists on this edge of the world now resembles the fishing, hunting, and subsistence agricultural communities that existed centuries before industrialization briefly touched this edge of the world. And as long as anarchy persists elsewhere in Russia, all this will continue."
 TNO_anarchy_UZB_tt: "§nSilent Turkmen and Uzbek Lands§!"
 TNO_anarchy_UZB_tt_delayed: "How can a people's mindset be so thoroughly erased? How can the pillars of a nation, a history, be so completely destroyed that even the Soviet Union's destruction pales in comparison?\n\nIf you ask an Afghan or a Japanese, the answer is systematically destroying every fulcrum and core on which a nation operates, while broadcasting the process of killing its ideals to the world.\n\nWhen the head of the production chain is murdered in his sleep, how can the nation maintain production? When representatives of every sector of society, burdened with responsibility, vanish into thin air, how can the nation make laws? If that is not enough, what if the world witnesses a great explosion that scatters a nation's hopes, heroes, and symbols to the winds?\n\nYou can break a people's spirit completely, but there is a limit to everything. Once that limit is reached and exceeded, they revert to a stable, primitive yet self-contained system. These regions have returned to tribalism, and they deeply distrust the outside world - the outside power that shattered their world twice, beating everything to pieces and then leaving them to pick up the remnants.\n\nWhatever happens to the lands of Turkmenistan and Uzbekistan, one thing is certain: the crimes other nations have committed against them will never be forgiven, and never forgotten."
 TNO_anarchy_MCW_Dissapearance_tt: "§JChaos of the Moscow Directorate§!"
 TNO_anarchy_MCW_Dissapearance_tt_delayed: "In the popular imagination, the word 'frontier' often signifies something transient and ever-changing. Here, the culture and ethnicity of a given society intermingles with elements regarded as 'other.' The very concept of the frontier contains a pair of conflicting contradictions: on one hand, the hope of expanding outward, plundering resources, and replacing them with 'civilization'; on the other, the fear that civilization will crumble and be devoured by the wild it had nominally subdued.\n\nIn the German settlers' fondest fantasies, the wilderness seemed already tamed, and exploitation and development proceeded smoothly. Yet when the sun shines brightly and all is revealed, such illusions burn away. The reality is clear: the colonists' struggle was not against any metaphorical 'wilderness,' but against the living people of this land - the people Germany had already slaughtered by the millions over decades, and would continue to abuse.\n\nThe Holocaust finally bore its horrifying fruit, and Nazi rule collided head-on with a new challenge. They had created this wasteland with their own hands, and it now became a hotbed of partisan resistance that tormented the Nazis. Sand piled upon sand until the partisan movement had grown into a full-scale uprising requiring the full force of the Moscow garrison to suppress.\n\nThe walls of the colony are caving inward, and the frontier the Hitlerites built may yet swallow them whole. Yet all that remains of Moscow now are mountains of corpses and ash - and so everyone trapped here knows full well that the prison called 'the frontier' will endure."
 TNO_Anarchy_MDM_Collapsed_Authority_tt: "§JAftermath of the Collapse of the Madagascar Government§!"
 TNO_Anarchy_MDM_Collapsed_Authority_tt_delayed: "From the moment the gendarmes in Antananarivo declared their rebellion against the colonial government, French rule over Madagascar came to an end. The former French colonial offices were replaced by the German-established Madagascar Military Committee, while the coastal regions fell entirely to the insurgents. Yet most of Madagascar has no government at all, and some places are even unaware of the upheavals on the island.\n\nThe reality of change spreads along telephone lines, and anxiety begins to spread among the French planters and elite. In some areas, the once-grand estates and villas stand empty overnight; in others controlled by the Communists of the Congress Party, the people seize the property and lands of the wealthy for local communal administration. Furthermore, in the 'uncontrolled zones,' ad-hoc tribunals trying colonial officials have become increasingly common, but by and large these regions govern themselves in peace.\n\nYet this calm self-rule will not last long. The insurgents and the imperialist counterattackers fight endlessly for control of the entire island, leaving no settlement untouched. Perhaps the insurgents will exercise restraint, but the Germans will not stint on violence; compared to the French before them, they are even worse. Those spared the fighting can only wait, savoring the brief peace, and preparing for the war to come."
 TNO_anarchy_Antarctica_tt: "§WInterior Antarctica§!"
 TNO_Anarchy_Antarctica_tt_delayed: "§W'The snow falls like flour, packing into every hollow and crevice in the ground, and stings our faces like a sandstorm.\n\nThe sun, its edges blurred, peeks shyly through a halo of clouds, casting a pale, feeble light.\n\nThe white desert is dead, and only eternal silence hangs over it. A pale yellow pillar of cloud-wreathed snow sweeps up from the south, and the blizzard follows, polishing this land smooth and spotless.\n\nThe blizzard is nature's wrath, and the cracks in the ground are nature's traps, utterly deadly to the unwary. No hunter could hide a trap so perfectly. Its position cannot be guessed; by the time man or beast realizes they have stepped into it and struggles to rise, it is already too late.\n\nAt last, the silence is broken by the sound of a marching column.'§! - §YRobert Falcon Scott, 1911§!"
 TNO_Anarchy_GUN_tt: "§JAnarchy of Guanabara§!"
 TNO_Anarchy_GUN_tt_delayed: "The Christ the Redeemer statue is forced to look down upon the burning city and its people killing one another. Guanabara was once Carlos Lacerda's fiefdom, now awash in blood thanks to his reckless decisions. When the legitimate monopoly on violence collapsed of its own accord, Rio de Janeiro plunged like a severed kite into the abyss of anarchy. The military, which should have contained the chaos, was paralyzed by internal strife, to the point that even entering the region became a luxury.\n\nThe massive explosion of the suburban gas plant set off chain reactions and an out-of-control firestorm that swept across the metropolis. Burst dams caused floods and frequent blackouts. The thud of helicopter rotors never ceased day or night - the airborne rescue teams' futile attempts to restore order ended in failure again and again. Though the mass killing ceased after thirty-six hours, the devastation was shocking.\n\nNow only two forces maintain a fragile order. In the many relatively orderly wealthy neighborhoods, Catholic clergy became the last symbol of authority. Around the Rio cathedral and along the main avenues, the Archbishop's insistence on standing with his flock made these rare pockets of peace in the fallen city. In the favelas, where even peace was hard to reach, gang networks formed a temporary alliance with the remaining Communists, using weapons supplied by the Party or looted from police stations to shoot down the rescue teams' helicopters one by one.\n\nPolice forces were already stretched thin and helpless before the chaos - unless they were cooperating with the airborne rescue teams in some kind of self-annihilation scheme. The roads out of the city are choked with fleeing vehicles and pedestrians, and the ruined rail lines force people to huddle in stations and churches seeking shelter.\n\n§xWhat must He think, watching the people He guards fall into such madness?§!"
 TNO_Anarchy_Amazon_tt: "§JBurning Amazon Rainforest§!"
 TNO_Anarchy_Amazon_tt_delayed: "In an ideal world, Brazil's chaos would have given the jungle a chance to breathe, letting the land and its people grow naturally, free from the encroachment of industrialization. But the world today is not an ideal one.\n\nWith the regime's collapse, the so-called government's rule has shrunk to the state capitals, while the vast countryside has become a place where violence reigns. Ranchers fight one another to expand their holdings; deals are settled with lead and receipts signed with corpses. Illegal mining and rubber plunder run rampant, driven not just by greed but by Bolivia and Peru quietly infiltrating and profiting from Brazil's porous borders. The federal army withdrew to deal with coastal rebellions, leaving behind nothing but 'jagunços' loyal only to private capital and their capacity to kill, and the natural beauty untouched for a millennium was turned to rubble in an instant. The indigenous peoples were forced to fight for their survival, their identities, cultures, and languages erased one by one for a handful of cruzeiros. The brief peace in the surviving cities dissolved quickly: hospitals overflow, refugees make their homes anywhere, supplies run low, and time ticks toward the end.\n\nNow, the 'Leviathan' is dead, and no one can restrain human desire. The mob takes power through the gun, justice through the knife, and buries the farce of 'civilization.' Before his cruel violence, the only thing the sufferers can hope for is that the legend of the Curupira is true - that now, only a miracle can end this cruel and lawless cycle."

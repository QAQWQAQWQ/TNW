 YAK_Georgy_Basharin: "Georgy Basharin"
 POLITICS_GEORGIY_BASHARIN_DESC: "Georgy Prokopyevich Basharin is regarded as the representative of the Yakut independent spirit in this turbulent era. Born into a large family of poor peasants, he was determined to achieve success in education. He studied history and literature in Moscow, then returned home in the final years of Russia's peace. He avoided conscription during both the war against Germany and the Siberian War, instead joining the free nationalist movement fighting for the freedom of the Yakut people. Soon, the troops of the Supreme Soviet were driven out, and intellectual circles seemed to realize their dream.

The brand-new democratic government carried forward the cause, proclaiming the establishment of a new Yakut Republic and promising grand reforms to provide freedom for the people. However, this newborn state was dealt a blow by reality soon after its founding. Rich natural resources like diamonds, though thought to help the nation's development, became a curse. Local companies monopolized the mining industry, using profits to fund their own projects. They accumulated power within Yakutsk, even forming their own "state within a state." To facilitate their operations, they established independent armies. Crime was rampant, and oligarchs colluded with criminal organizations, operating freely without government interference.

Amid all this, Georgy Basharin remained an honest and open defender, doing his best to administer the republican government. He may be respected by most, but he has few means to fight the oligarchy that constrains him. For now, all he can hope for is that the flame of Yakut nationalism continues to burn."

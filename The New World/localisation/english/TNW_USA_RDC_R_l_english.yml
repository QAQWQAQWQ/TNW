 USA_gld_68_rumsfields_plan: "Rumsfeld's Plan"
 USA_gld_68_rumsfields_plan_desc: "A vaguely technocratic ideal of the military, Donald Rumsfeld's program is one for endorsing hardware over manpower, while paring down, refining, and reapplying the select droves of men we already have enlisted (usually in more sparing placements and field assaults, but on what are deemed to be more strategic contact points). Rumsfeld specifically has an interest in higher technology, aeronautic war-making, including using satellites more robustly, developing sleeker spy planes with better photographic powers, and honing airstrikes into a precise art form which devastate pressure points rather than merely carpet bombing South Africa into whatever predated the Stone Age. Goldwater in his air force background finds this appealing if a tad wishy-washy in its forcefulness. Nonetheless, it would prove an immense shift in American war doctrine, and, if the war is lost, we'll lose more money than men."
 USA_gld_68_mcnamaras_vision: "McNamara's Vision"
 USA_gld_68_mcnamaras_vision_desc: "In Washington quite a few of the big wigs in Goldwater's military cabinet, chiefly Robert McNamara, have had a mana from heaven realization; more troops mean we can simply swarm the RK forces with raw numbers. The Nazis are already reliant on strained slave labor conditions for their resources, even a good portion of their conscripts. If they can be exhausted thoroughly via good ole fashioned G.I. mass deployments and mass encirclements, they can be driven back, their resolve as well as their personnel depleted and broken. No nation on Earth save Japan could withstand the full blooming mobilization of America's young men against it all at once. Those paltry few that could would usually need weapons of mass destruction to definitively repel the pressurized application of so many well-coordinated invaders. Enough men will send the Reich packing, of this McNamara is positive."
 USA_gld_68_rumsfields_plan_tltp: "§YRumsfield's ideas are focused on more moderate policies.§!"
 USA_gld_68_mcnamaras_vision_tltp: "§YMcNamara's ideas are much more uncompromising.§!"

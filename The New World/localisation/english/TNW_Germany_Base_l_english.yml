l_english:
 GER_gerhard_kaindl:0 "Gerhard Kaindl"
 POLITICS_GERHARD_KAINDL_DESC:0 "Gerhard Kaindl rose to political prominence during a turbulent era in German politics.`n`nIn 1993, Paul Wegner resigned as Führer, transferring power to Otto Musgnug's protégé, Gerhard Kaindl. Suffering from cardiovascular disease, Musgnug decided to step back to the position of Deputy Chancellor, continuing to pull the strings from behind the scenes. Discontent with Kaindl within the party began to spread quietly from that point on. Though he was Musgnug's star pupil, he was not the most popular successor within the party.`n`nArmaments Minister Udo Voigt and the party's military establishment already harbored reservations about Kaindl's succession. After Musgnug's death in 1997, the various factions, no longer balanced by their patron, quickly sharpened their contradictions with Kaindl, and fierce internal party struggle began in earnest."

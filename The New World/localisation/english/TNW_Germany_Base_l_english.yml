 GER_national_socialism_2_party:0"NSDAP - South German Faction"
 GER_national_socialism_2_party_long:0 "National Socialist German Workers' Party (Nationalsozialistische Deutsche Arbeiterpartei)"
 GER_national_socialism_party:0 "NSDAP"
 GER_national_socialism_party_long:0 "National Socialist German Workers' Party (Nationalsozialistische Deutsche Arbeiterpartei)"
 GER_Leadership_rejuvenation:0 "Leadership Rejuvenation"
 GER_Leadership_rejuvenation_desc:0 "In the past, an ambitious party member who wished to reach a senior leadership position had to accumulate long years of service, prove themselves at the grassroots, rotate through multiple postings, and undergo systematic training at cadre training schools, before finally passing through organizational selection and appointment procedures to formally assume office.`n`nAs NSDAP leaders at all levels increasingly came from specialized training schools, such institutions emerged. The party school, as the core venue for training leadership cadres, became the main channel for forging party and administrative backbone at all levels. Its primary task was: to train party and government officials, administrators, economic leaders, military commanders, youth cadres, theoretical propaganda specialists, elite talent, grassroots leaders, and ordinary party members.`n`nThis system has continued to advance, and the rejuvenation of the national leadership has become increasingly pronounced, with more and more youthful faces appearing in key positions. They possess greater energy and sharper minds than the older generation; whether this represents progress or cause for concern, only future generations can judge."
 GER_European_integrated_economy:0 "European Integrated Economy"
 GER_European_integrated_economy_desc:0 "The great Hitler and the German Reich he built were a powerful nation of unprecedented corruption. For decades, soldiers under its hegemony swept across Europe like a storm, trampling every inch from the western coast of France to the Russian wasteland, establishing a series of puppet regimes in newly conquered territories.`n`nNow, Germany no longer simply occupies countries militarily, but rules indirectly through its overwhelming economic power. The European Community established after the war is ostensibly an equal and mutually beneficial economic organization among European nations, but in reality it is a convenient tool for Germany to control the currency and trade of the entire European continent.`n`nThe Empire's light has seeped into every crevice of Europe. Beneath the scorching sun of the New Order, its neighbors are bound by the chains of economics, bringing both ruins and the so-called sixty years of peace."
 GER_Legacy_of_party_system_reform:0 "Legacy of Party System Reform"
 GER_Legacy_of_party_system_reform_desc:0 "To eliminate old abuses and adapt institutions to the needs of modernization, Gerhard Klopfer and Paul Wegner reformed the party. In the context of current policy, this institutional reform went far beyond a single economic field; it was a systematic project driven by economic reform, with all areas interconnected.`n`nToday, the reform legacy left by the two leaders still shines for the fatherland. They transformed Germany, and on this new journey, the great tide of historical change surges forward. And Germany, together with her sons and daughters, will face the waves of the next millennium."
 GER_Half_the_world_center:0 "Center of Half the World"
 GER_Half_the_world_center_desc:0 "The Empire's power has spread from Europe to Latin America and Africa, from Paris to Moskau, from the fires of the North African coast to the highlands of South Africa, through the Arab world and into the rainforests of Latin America. All eyes turn toward the world capital, Germania.`n`nThe light of the New Order covers more than half the world. There is no doubt that Germany is the center of half the world today. Measured by population rather than geography, scholars have proposed: a circle centered on Germania with a radius of four thousand kilometers would sweep across most of Europe, all of Africa, the Middle East, South Asia, Central Asia, and West Asia, capturing nearly all the population hotspots of the Eurasian-African landmass.`n`nThis circle happens to cover the core of human civilization's old world — from the Atlantic to the Pacific, from the Mediterranean to all densely populated areas south of the Arctic Ocean."
 GER_Consolidating_the_maritime_borders:0 "Securing the Maritime Borders"
 GER_Consolidating_the_maritime_borders_desc:0 "After final victory, no land power remained that could directly challenge the Empire. However, at the end of liberalism, the United States of America still stands. To confront the naval and ideological struggle, the Empire has gradually shifted its focus to naval construction and ideological resistance against America.`n`nIn the eyes of countless fanatical German youth, America is the root of all their hardships — a weak lion, a defeated foe from decades ago. They believe that once America is struck down, all their troubles will be resolved.`n`nBut is that really the case?"
 GER_Jurgen_Schutzinger_hog:0 "Jürgen Schutzinger"
 GER_Jurgen_Schutzinger_hog_desc:0 "§YDeputy Chancellor of the Reich`nOrthodox National Socialism§!`n--------------`nJürgen Schutzinger is a contemporary of Martin Musgnug, an old-timer who witnessed the party fall apart in the chaos after Musgnug's death.`n`nThe era of the triumvirate is long past. As a former political ally, he cannot help but feel a sense of mourning. His real purpose these days is to look after Musgnug's protégés. Yet the ambitions of the Dresden Circle and Hock have gradually surfaced — what can he do to stop them now?`n`nHis soul is trapped in this aging body. He feels himself walking step by step toward death — everyone walks toward death. The winner of today, who will conquer tomorrow? He has little time left. Who knows how long he has? Twenty years, thirty years, or... tomorrow."
 GER_Helmut_Kohl_for:0 "Helmut Kohl"
 GER_Helmut_Kohl_for_desc:0 "§YForeign Minister of the Reich`nOrthodox National Socialism§!`n--------------`nFor the young Kohl, his brother Walter's death in service during World War II was the earliest and deepest imprint on his life.`n`nIn 1946, still in school, he joined the party early. During his years in office, he transformed previously backward states, one by one, toward modernization. This impressive record carried him into the upper echelons of the party. To many colleagues, he was a doer, a reliable figure with ample diplomatic experience who could be trusted. For this reason, as a staunch supporter of the state-led European economic integration blueprint, he received unprecedented promotion and recognition.`n`nIn Germany of 2002, Helmut Kohl is an old man. Undercurrents swirl in the Foreign Ministry, restlessly stirring — but he no longer has the strength to rein them all in.`n`nThe exit is not far off."
 GER_Gunter_Deckert_eco:0 "Günter Deckert"
 GER_Gunter_Deckert_eco_desc:0 "§YMinister of the Interior`nOrthodox National Socialism§!`n--------------`nGünter Deckert's strong character and deep sense of responsibility are widely recognized, and his political conviction is a major reason he has attracted so many followers.`n`nTo Deckert, who dedicates himself to this cause, his ideology distills the essence of Adolf Hitler's thought — the backbone of the Führer's final victory and Germany's new world order. The purity and loyalty of fanatical hardliners are far beyond ordinary men; they are destined to control every aspect of society for the party.`n`nWhether his vision is truly National Socialist is beside the point. To him, this is simply the logical next step: his Germany is Hitler's Germany — and, if anything, even more so."
 GER_Udo_Voigt_sec:0 "Udo Voigt"
 GER_Udo_Voigt_sec_desc:0 "§YChief of the General Staff`nHeterodox Nazism§!`n--------------`nUdo Voigt was his parents' only son. From childhood, his father was his only role model. The elder Voigt was a staunch party member, who joined the SA in his early years and later became a sergeant-major in the Wehrmacht.`n`nIn 1972, Voigt was conscripted into the Wehrmacht, training as an air force officer candidate at the Neubiberg Air Force Officer School. He subsequently served as an officer in multiple units, and as a operations officer in the Freising anti-aircraft missile unit.`n`nAfter his air force service, he was promoted to the General Staff. In the years when internal party struggle grew increasingly fierce, his high position inevitably drew him into the rivalry with Kaindl. As yet, the outcome remains undecided."

 FEN_SLP_Econ_the_health_and_needs_division:0 "The Health and Needs Division"
 FEN_SLP_Econ_the_health_and_needs_division_desc:0 "We have in recent times done a great deal of legislation and policy making which focuses towards societal matters. Healthcare, wages, housing, education and so on. It might better serve the people of England to bring changes to these things under the banner of one governmental organisation.\n\nThe Health and Needs Division, HAND, will be at the forefront of implementing future governmental aid and support programmes of our welfare state. HAND will also act to advise the government on the potential effects of new changes and current policies, assisting us in maintaining a high state of living for the average Englishman regardless of his personal wealth."

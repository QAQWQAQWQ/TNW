 ENG_IT_Macmillan_O_Canada:0 "O' Canada"
 ENG_IT_Macmillan_O_Canada_desc:0 "Relations haven't been good with Canada lately. They refused to view us as anything other than a Nazi puppet state, which, let's be honest, we were. And our bondage prevented us from making any overtures to the Commonwealth. But now, we don't have the Huns on our back, so we can take advantage of this new state of affairs to rebuild our relationship with our oldest dominion. We can agree to an exchange of ambassadors and normalization of relations. Granted, our difference in monarchs may be an issue, but we do not seek to make them a colony again, only to have them see us as an equal on the world stage."

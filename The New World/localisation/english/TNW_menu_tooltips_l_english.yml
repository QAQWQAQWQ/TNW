 TNO_ugly_american_icon_tt: "§MBright Future§!"
 TNO_ugly_american_icon_tt_delayed: "§*I lost my strength and my life, and I lost my friends and my joy.
I even lost the pride that made me think myself a genius.
When I knew truth, I believed she was a friend,
but after understanding and grasping her, I grew tired of her.
Yet she endures forever.
Whoever ignores her is completely foolish in this world.
God asks, and must be answered.
The only treasure I have left is the tears I sometimes shed.
— Alfred de Musset, "November"§!
\n§uBerlin, 1947§! — at least that's what it's still called at this moment. The stadium is packed with party members, workers, journalists, and bosses, and the venue is silent. Adolf dictated the speech to be read to the national congress by telephone, recorded by Friedrich Hosbach, formally announcing the victory in the war. The moment felt so unreal that everyone gasped, then thunderous applause erupted, as if to suck all the air out of the room. No savior descended, no hope of change, no resounding voice from above — only §eAdolf Hitler§!, only silence.
\n"On this memorable day, I want to say one thing to the nation." Adolf Hitler unfolded another sheet of paper, studied it carefully, and said, "I will resign as Führer, and §jReichsmarschall Hermann Göring§! will succeed me."
\nThunderous applause, loud and rapid, gradually turned into a thunderous ovation. The Nazi Party's fifteen-year-old dream came to a successful end, their hero stepping down to support a sickly war hero and Reichsmarschall. They had expected a flood, §Auntil the towering waves actually crashed upon them§!.
\n1968, Germania. Führer Bormann is smoking a cigar in his office. In this moment of leisure, he begins to empty his thoughts, enjoying this brief tranquility. So exhausted, someone might ask him: "Are you alright, Martin?" And the Führer would answer: "I am just resting." Or some other false evasion. The impending economic crisis, the world conflicts brewing in Europe, Asia, and the Americas, all weigh heavily on his mind. Victory has come, yet he sees only fog, and after the euphoria, he can never escape this vicious cycle.
\n§&2002, Germania, orderly as ever§!, Germany and Japan have new leadership, the Americas, Asia, Africa, and Europe have new enemies. This contest is not just about holding onto one's own patch, but about driving the other side out, about reshaping the world in one's own image. §GThe victors have a duty to steer these questions, to survive in this constantly evolving new order, and to become stronger than ever before.§!"

 TNO_menupic_tooltip_1: "Fifty§q years§! of mortal life, §Dcompared to eternity§!, are but a tiny thing. §gLook at the world's affairs§!, §flike a dream dissolving like water§!."

 TNO_menupic_tooltip_2: "§&Do not bow and scrape just to survive§!, §g...§! §jstand up§!."

 TNO_menupic_tooltip_3: "§fLive on§!, §Eif you believe me§!, §Cdo not wait for tomorrow§!. Pluck today the §Proses of life§!."

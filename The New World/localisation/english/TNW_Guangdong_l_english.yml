 GNG_Econ.0.t: "Economy Alert"
 GNG_Econ.0.desc: "You aren't supposed to see this, yet here you are"
 GNG_Econ.0.a: "Much love from Guangdong Team!"
 GNG_Econ.1.t: "Economy Pulse"
 GNG_Econ.1.desc: "You aren't supposed to see this, yet here you are"
 GNG_Econ.1.a: "Much love from Guangdong Team!"
 GNG_Econ.2.t: "Not a Day Late, Not a Dollar Short"
 GNG_Econ.2.desc: ""As you can see, gentlemen, with productivity increasing and wages being kept static, Guangdong's Gross Domestic Product has increased two-fold since fiscal year 1962. We expect to see profits rising into the next fiscal year, alongside new investments and greater productive efficiency from better R&D."\n\nSuzuki looked out onto the room of idle men in business suits listening in on his presentation. The fluorescent bulbs above them gave their nods of approval a gaseous quality. He could feel the projection seep into his eyes, as it drew graphs of various lines and arrows on the wall behind him. The shareholders did not quite care for Suzuki, and Suzuki did not quite care for them, but he knew that they were the real commanders of the Pearl River Delta. The fact that what he had to say and show was making them happy would mean that Guangdong could go forward.\n\n"And with 1963 dawning upon us, I expect Guangdong to remain a shining example of economic success in the Greater East Asia Co-Prosperity Sphere."\n\nThe suits took in the information for a moment, before giving Suzuki a standing ovation."
 GNG_Econ.2.a: "A miracle on the Pearl River!"
 GNG_Econ.3.t: "A Day Late, A Dollar Short"
 GNG_Econ.3.desc: ""Unfortunately, overall economic productivity has not increased greatly since the previous fiscal year, imposing a chilling effect on profits and investments. With some financial and economic reforms, however, we should be able to make some of these losses up before the first quarter of 1964."\n\nSuzuki felt a dozen pairs of daggers dig into his soul as he explained the economic shortings of the region he governed. They knew his proposals of contingency and recovery were nothing but walls of paper, meant to give the impression of foresight. He knew that the goals for 1963 put forward by Tokyo were preposterous, but he did not have much room for maneuver to begin with. The business of governing is a fickle one, and at times you have to keep your head down and take a beating.\n\nWith the shareholders in strong disapproval, Tokyo will not be far behind, and the Pearl River Delta will become a more marginal piece of the puzzle that is the Sphere."
 GNG_Econ.3.a: "For a better next year!"
 GNG_Econ.4.t: "1964 Economic Review"
 GNG_Econ.4.desc: "Chief Executive [Root.GetLeader] and Consul-General Takashima Masuo sat silently in their seats, eyes shifting from each other, to the floor, to anywhere else. Neither was particularly keen to open today's meeting, a formality observed for the sake of formality, even as Yasuda's collapse had robbed both men of their time and sanity in equal abundance.\n\n"Even though Guangdong's performance this year has fallen short of what we discussed last year," Takashima finally ventured, removing his glasses with a weary hand, "I think we would both claim extenuating circumstances are to blame."\n\nChief Executive [Root.GetLeader] nodded silently, stifling a bitter chuckle at Takashima's assessment. Even if Tokyo proper had been supremely unhelpful, having Takashima acknowledge the utter bedlam that had followed Yasuda's collapse was more than he'd hoped for.\n\n"Be that as it may," Takashima continued, replacing his glasses with a sigh, "Tokyo has communicated that they will expect Guangdong to do its part in the Sphere's economic recovery."\n\nTakashima looked exhausted - having spent most of the past year fighting for resources from Tokyo, even as Japan itself plunged into economic and political meltdown. Chief Executive [Root.GetLeader] hoped the coming year would be slightly easier for them both, now that the Yasuda collapse was behind them and the Companies started looking back to the future.\n\nThe air in the room remained heavy and still, even as the clock ticked relentlessly onwards."
 GNG_Econ.4.a: "We should both get back to work."
 guangdong_economic_targets_tooltip: "For the next year, our shareholders expect a real growth of [?GNG_Next_Year_Growth_Var_tt|3W%], or a §YGDP§! of [?GNG_Next_Year_Target_GDP_Var_tt|3W] billion USD.§!"
 GNG_Econ.5.t: "[GetYear] Economic Review"
 GNG_Econ.5.desc: "Chief Executive [Root.GetLeader] leaned back in his chair, smiling faintly as Consul-General Takashima Masuo took a seat opposite him, holding the [GetYear] copy of Guangdong's economic data. They both knew the thick tome's contents in advance, and Takashima only made a cursory show of idly turning its pages before setting it aside.\n\n"Guangdong has met all its economic targets for last year," Takashima said, a wry smile tugging on his lips. "Industrial output, factory investment, export revenues: all indicators show an economy performing at its best. Tokyo is very pleased."\n\nChief Executive [Root.GetLeader] nodded, letting the Consul-General's praise settle comfortably within him. Of course Guangdong had met the expectations set out for it by its stakeholders. Between his policies and the efforts of the Companies, Guangdong had proven it could perform economic alchemy - and it would do so for however long was required.\n\nThe two men talked for another fifteen minutes, the two largely exchanging compliments and conversing in generalities about the coming year's economic initiatives. The meeting was on course to end early, as the conversation petered out, with Takashima fiddling with his glasses, waiting to be excused."
 GNG_Econ.5.a: "Get back to work."
 GNG_Econ.6.t: "[GetYear] Economic Review"
 GNG_Econ.6.desc: "Chief Executive [Root.GetLeader] folded his hands on his desk, suppressing a frown as Consul-General Takashima Masuo took a seat opposite him, holding the [GetYear] copy of Guangdong's economic data. Not that there was a great need for it; both men had followed Guangdong's performance anxiously as their fears became a foregone conclusion.\n\n"Output, investment, exports. All performing well under expectations." Takashima said curtly, a hard edge to his voice. "This is hardly what you promised us a year ago, Chief Executive. Tokyo is deeply disappointed."\n\nChief Executive [Root.GetLeader] nodded slowly, the Consul-General's words sinking in. There was no denying it; Guangdong had promised much, and delivered little. Despite his policies and the efforts of the Companies, Guangdong had let its stakeholders down, inviting whispers about its - his - credibility.\n\nThe two men conversed for another thirty minutes, examining in detail the plans to make up the difference in the coming year. Takashima's expression hardly changed throughout the conversation, entirely focused on the task at hand - completely engrossed by work, even as the end of the allotted time approached."
 GNG_Econ.6.a: "End the meeting on time."
 GNG_Econ.7.t: "[GetYear] Economic Review"
 GNG_Econ.7.desc: "Chief Executive [Root.GetLeader] suspected Japanese Consul-General Takashima Masuo hadn't slept well for several months. The prominent bags under his eyes and disheveled combover clearly indicating there was no real time for personal care in the Japanese government in the midst of the Oil Crisis.\n\nThen again, he suspected Takashima would say much the same about himself.\n\n"Chief Executive," Takashima said, his voice subdued from exhaustion. "You might be aware that Tokyo has been dealing with... other issues, as of late."\n\n[Root.GetLeader] nodded. "If Japan has its hands full with the Oil Crisis, I hope they have some sympathy for our predicament. Factors outside of our control."\n\n"Indeed." Takashima sighed, sinking into his seat. "There's no insistence for Guangdong to meet the pre-crisis economic targets now.""
 GNG_Econ.7.a: "A brief respite."
 GNG_Econ.8.t: "[GetYear] Economic Review"
 GNG_Econ.8.desc: "Chief Executive [Root.GetLeader] scarcely noticed the passage of the original, scheduled date for the annual economic catch-up with the Japanese Consulate-General, its original embellished entry on his desk calendar completely obscured behind the scribbled chaos of resolving the ongoing Riots.\n\nThe Japanese Consulate-General hadn't called to ask about the meeting or to schedule an alternate date, either. They - just like [Root.GetLeader] - had more urgent, dangerous matters to attend to.\n\nThe earnings reports, fiscal projections, or growth forecasts that had been prepared for the meeting sat unused in a corner of the Chief Executive's office, gathering dust. If the Riots ever reached the Government Complex -"
 GNG_Econ.8.a: "- then they would all burn together."

 GNG_legco_komai_dead_leader: "\n\n\n\n\n\n£GNG_Hitachi_No_Komai\n\n\n\n\n\n\n\n\n[GNG_legco_current_faction_color_dynamic]§!§VNO AUTHORITY§!\n\n"
 GNG_legco_sony_desc: "Initially incorporated as the Sonus-Li Electronics Company in 1954, Sony is Morita Akio's second commercial venture following the acquisition of Tokyo Telecommunications in 1952. Sony's ability to drive audio-visual innovation at affordable prices, with a mixed Zhujin-Japanese workforce, has made it the unofficial representative of Guangdong's Zhujin population.\n\nHaving rebuilt his business in the shadow of the Japanese, Morita consciously advocates for Zhujin interests in Guangdong, culminating in the creation of his own faction in the Legislative Council in 1960. Sony is now too influential to be ignored - a reputation that Morita bears proudly against his Japanese rivals, with no rivalry as bitter as his vendetta against his former partner, Ibuka Masaru of Fujitsu."
 GNG_legco_fujitsu_desc: "Established in 1935 as a joint venture between Siemens and the second-tier Furukawa Zaibatsu, Fujitsu has since established itself as a pioneer in the field of telecommunications and computing. After Ibuka Masaru joined Fujitsu in 1952, the firm has aggressively expanded its operations in Guangdong, dedicated to commercializing bleeding-edge computing technology with its Japanese-led core engineering staff.\n\nFor Ibuka, however, machinery is but a means; the end lies in the total intellectual uplifting of the man and woman. More so than any other company on the Legislative Council, Fujitsu advocates for a vision of a future driven by science and engineering - a meritocracy of limitless ambition where anyone who has what it takes can and will excel. In Ibuka's world, the only way is up."
 GNG_legco_matsushita_desc: "Founded in 1918, Matsushita Electric is one of Japan's most prestigious electronics manufacturers - starting from selling electrical sockets to developing a vast selection of leisure and home appliances. Ever hungry for new opportunities, Matsushita was one of the first to enter Guangdong as the vanguard of Japanese capitalism on the Chinese mainland.\n\nAmong the major companies leading the Legislative Council, Matsushita is a firm member of the Japanese corporate establishment, neither as soft-hearted as Sony nor as bullheaded as Fujitsu. Its representative in Guangdong, Matsushita Masaharu, is both reliable and adaptable to Guangdong's ever-changing conditions - with both eyes firmly on the bottom line."
 GNG_legco_cheungkong_desc: "When Li Ka-shing left Sony's leadership team in 1958, many Japanese executives hoped it would end the Morita-Li partnership that had upended Guangdong. They were sorely mistaken; Li, now head of Cheung Kong Holdings, had merely shifted his attention to providing the necessities of modern life for the Chinese masses, a sorely underserved market.\n\nSupermarkets, pharmacies, wholesalers, and cinemas: Cheung Kong has its fingers on the pulse of the poorer Zhujin and Chinese communities across Guangdong, an inescapable presence in the post-Yasuda landscape. For Li, doing good and good business are one and the same - for nobody should experience want as he once did, especially if he can profit from making sure they do not."
 GNG_legco_hitachi_desc: "Created in 1910 as a manufacturer of electric motors, Hitachi is the electronics subsidiary of the Mangyō Zaibatsu - itself subsumed under the Manchurian Industrial Development Corporation, the preeminent state-owned company of [MAN.GetNameDef]. Backed by the Manchurian state and its captive workforce, Hitachi has a presence in nearly every segment of the electronics market.\n\nHitachi's chief executive, Komai Kenichirō, is a man both familiar and alien to Guangdong's tycoons - blending a shared emphasis on technology with a devotion to total control and state intervention that is anathema to Guangdong's more freewheeling capitalism. To many, Komai is a reminder of a darker time, of total mobilization for the state; a Manchurian agent coming to haunt Guangdong."
 GNG_legco_yasuda_desc: "The Yasuda financial conglomerate is one of the Big Four Zaibatsu in Japan - and the one most aggressive in expanding overseas, including in Guangdong. From major corporate loans to payday lending, Yasuda Holdings is deeply intertwined with the economy of the entire Co-Prosperity Sphere, expanding at a breakneck pace overseas to make up for constrained opportunities on the Home Islands.\n\nYasuda's prominence - as the only one of the major Zaibatsu among the Four Companies of Guangdong - gives it outsized influence in the Legislative Council. Deep pockets can buy many favors, and Matsuzawa Takuji is well aware of the power that entails, serving as first among equals among Guangdong's corporate titans."
 GNG_legco_yasuda_post_collapse_desc: "Pride comes before a fall, and in the wake of the storm left behind by the Minezaka scandal, Yasuda lies broken. With a balance sheet in tatters and its senior leadership implicated in the worst corruption scandal in Japanese history, nobody in Tokyo is lifting a finger to save Yasuda - overturning its position in Guangdong almost overnight.\n\nEven as more self-interested men abandon ship, Matsuzawa Takuji - now Chief Executive - leads a battered remnant of Yasuda officers to see Guangdong through its greatest crisis. Their loyalty will no longer buy them riches or renown - only the knowledge that they served their master until the bitter end."
 GNG_legco_suzuki_desc: "While the Four Companies control the lion's share of the seats in the Legislative Council, a sizable bloc remains loyal to the Civil Administration of Guangdong and the Chief Executive. These individuals - a collection of Japanese expatriates and politically reliable 'notables' - flock to the Chief Executive both for his proximity to power and the sizable 'gifts' given to maintain their favor.\n\nThe base motivations of these men make them reliable enforcers of Chief Executive Suzuki's will in the Legislative Council - so long as he keeps them satiated with the fruits of power and influence. With a strong mandate from Tokyo and a partnership with Yasuda in hand, Suzuki is confident he can keep his courtiers in line."
 GNG_legco_civil_authority_desc: "How quick to turn are those kept loyal by promises of wealth and power, when both are found to be wanting! Such is the way of things in Guangdong, and of Chief Executive Suzuki's men in particular: having crowded around him in times of plenty, they disavow him in the wake of Yasuda's collapse in hopes of saving their own skin.\n\nBut spare a thought for the few who continue to make cause with the stricken Chief Executive. Whether out of long-buried principles, petty rivalries, sunk costs, or self-delusion, these men have tied themselves to the mast of Suzuki's sinking ship, come what may."
 GNG_legco_hitachi_no_authority_desc: "§VFROM THE GUANGDONG PEOPLE'S ANTI-JAPANESE GUERRILLA:\n\nDEATH TO THE JAPANESE INVADERS\n\nAVENGE LEE CHUN§!"

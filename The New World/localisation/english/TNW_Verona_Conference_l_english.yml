l_english:
 vc.1.t:0 "The Congress Begins"
 vc.1.d:0 "Delegates, politicians, bureaucrats, Blackshirts, and more from every stratum of the PNF's vast political machine have gathered in Verona. The medieval city is draped in Italian tricolors and fascist black flags: crowds cheer as the Duce's motorcade passes through the city with an escort of elite Blackshirts, finally arriving at the venue - Castelvecchio, a castle just outside the city center. Built during the medieval Scaliger dynasty, it is now packed with curious onlookers, journalists, and armed Blackshirts.\n\nThe guests enter the castle with gossip and intrigue, while Blackshirts stand guard around the building, rifles in hand, watching quietly. Men in uniform and suits cluster in groups, separating, whispering, then dancing endless circles around tables. Fine wines and plates of snacks on the tables are emptied and refilled in the politicians' plans. Agreements and alliances are made and broken, and when all delegates are summoned to the hall, General Secretary Scorza and Prime Minister Ciano lock eyes for the second time, as Ciano prepares to speak at the congress's opening. A tense silence fills the air - the battle for Italy's future has begun."
 vc.1.a:0 "Woe to the losers."
 vc.2.t:0 "The Future of MinCulPop"
 vc.2.d:0 "The Ministry of Popular Culture was founded in 1937 to control and regulate Italy's media and arts industries, ensuring they follow the party line. Created as a counterpart to the German propaganda ministry, MinCulPop quickly became a bloated, bureaucratic joke - easily circumvented, its censorship useless at best and harmful at worst, not to mention its laughable efficiency. Even its name makes Italians laugh: its acronym 'MinCulPop' sounds remarkably like the Italian word for buttocks.\n\nTo change this sorry state of affairs, many party officials propose a revitalization of MinCulPop. Under the leadership of General Secretary Carlo Scorza, this reform would fundamentally change MinCulPop's bureaucratic ways, making it more efficient, more appropriate, and above all, more effective in spreading fascist values to the common people. The Duce quickly vetoed these proposals, as he and many others saw them as a waste of resources; MinCulPop had largely outlived its purpose. Regardless, the issue has been raised in Verona and is now under discussion by the congress."
 vc.2.a:0 "Couldn't they at least change the acronym?"
 vc.3.t:0 "Ciano Publicly Opposes MinCulPop Reform"
 vc.3.d:0 "Galeazzo Ciano addressed the congress on the proposed MinCulPop reform, and as expected, he publicly opposed reforming the institution. Italian censorship was no longer as necessary as it had been in the 1920s and 1930s, when communism and subversion remained serious threats. Rather than reforming MinCulPop, Ciano proposed using the funds needed for reform on more pressing matters.\n\nThe Duce continued, saying he supports Italy's film, literature, and television industries, which have proven profitable and popular abroad; MinCulPop would only slow the production of new cultural products, stifling the creativity and talent of Italian directors and writers to their detriment.\n\nThough scattered applause erupted in parts of the hall, many fascist politicians were far less enthusiastic about the proposal, fearing that loosening controls on the entertainment industry could cause dissent to spread more quickly among the population."
 vc.3.a:0 "Everyone loves Italian cinema!"
 vc.4.t:0 "Scorza Stresses the Importance of the Culture Ministry"
 vc.4.d:0 "Greeted by much of the party, Carlo Scorza took the Verona podium for the first time. He presented a plan to reform MinCulPop that would account for the Duce's concerns about the ministry while giving it the importance it deserves. Through internal bureaucratic streamlining, an advisory board of directors and entertainment industry experts, and a slight relaxation of censorship, MinCulPop could easily and conveniently be transformed into a modern, efficient institution.\n\nScorza went on to remind the congress of the importance of defending and upholding the values of the fascist revolution among the people, warning of the danger of subversive, salacious, and thoroughly decadent artistic products entering people's lives, corrupting Italian youth, and weakening the nation's moral strength. Many at the congress were clearly interested in the General Secretary's words, but more were puzzled and somewhat convinced that this was nothing more than Scorza's naked grab for power."
 vc.4.a:0 "Seriously, change the acronym."
 vc.5.t:0 "The Grand Council Votes on MinCulPop"
 vc.5.d:0 "Though Scorza succeeded in persuading the Duce to let the Grand Council vote on the MinCulPop reform proposal, there is no guarantee it will pass, and it is likely to be rejected by the Grand Council's delegates, who have sided with Ciano. Yet Scorza has also garnered some support, so victory is not impossible.\n\nIn closed session, the Grand Council votes in silence. 'Yes' and 'No' are written down one by one, and when the ballots are counted..."
 vc.5.a:0 "Scorza's proposal is rejected!"
 vc.5.b:0 "Scorza's proposal passes!"
 vc.6.t:0 "Reform the Blackshirts?"
 vc.6.d:0 "Since the March on Rome, the Volontary Militia for National Security (MVSN), known as the Blackshirts, has grown in power. The Blackshirts now wield considerable influence in Italy, even rivaling the Carabiniers. Blackshirt units are feared by the people, and they occasionally assault American tourists, university students, colonial subjects, and anyone else deemed an 'enemy of fascism.' The Blackshirts have also become one of the most reactionary organizations within the PNF, especially as they effectively form a network of prominent hardline fascists at the upper levels.\n\nCiano came to the Verona congress hoping to limit the Blackshirts' power. He proposed setting a retirement age and strictly limiting the Blackshirts' arrest powers. Scorza hopes to consolidate support from the Blackshirts and conservative fascists, so he opposes these reforms with all his might. The potential confrontation between Ciano and Scorza is poised to erupt - and the MVSN's members? They are certainly neutral about Ciano's proposals."
 vc.6.a:0 "Hope they don't come to blows."
 vc.7.t:0 "Ciano Speaks in Support of Blackshirt Reform"
 vc.7.d:0 "Ciano stepped onto the podium, and the atmosphere around him seemed ready to ignite. He first thanked the Blackshirts, at least verbally acknowledging their achievements over the past forty years. He also praised those Blackshirts who had fought bravely in Africa and Europe and stood up to communist insurgents. This earned Ciano applause from most in the hall, though notably the Blackshirt commanders in attendance did not join in.\n\nAfter a brief pause, Ciano began to condemn certain Blackshirt excesses. He criticized the Blackshirts for suppressing protesters and dissenters with excessive zeal, as well as their many outrages in the colonies. The hall filled with grumbles and whispers, and several Blackshirt commanders walked out directly. Undaunted, Ciano continued his speech and laid out his reform plan. First, he proposed that Blackshirt members be forced to retire at a certain age, using the sharpest language of his entire address to target the 'gerontocracy' among Blackshirt senior officers. After that, he proposed a substantial reduction in the Blackshirts' civil powers, including their arrest authority, to address their abusive behavior.\n\nCiano's speech made the atmosphere in the hall even more tense. When Scorza spoke next, the congress seemed to be on the very edge of a cliff."
 vc.7.a:0 "This didn't help matters."
 vc.8.t:0 "Scorza Opposes Blackshirt Reform"
 vc.8.d:0 "Scorza began his speech. At the outset, he thanked each attending Blackshirt commander for their 'long service to Italy' - a clear rebuttal of Ciano's 'gerontocracy' remark. Scorza then defended the Blackshirts and their actions, arguing that suppressing disloyal elements sometimes required harsh measures. This earned him cheers and applause from the Blackshirts in the hall. Scorza next launched into a fierce attack on protesting students, which seemed only tangentially related to the topic, before finally thanking the Blackshirts for putting them down.\n\nScorza then attacked the proposal to strip the Blackshirts of their arrest powers. He argued that these powers were essential to the MVSN's status, and that removing them would be tantamount to a death sentence for the Blackshirts, while also ending the PNF's control over Italian life. The Blackshirts cheered again, though the rest of the hall reacted more coolly. As Scorza concluded, he took time to dwell on what he saw as the fascist ideology drifting off course - a problem he said was evident at the congress - and expressed hope that in the upcoming vote, the Grand Council would support the proposal to 'strengthen fascist ideology.'"
 vc.8.a:0 "Fascism needs its enforcers."
 vc.9.t:0 "Vote on Blackshirt Reform"
 vc.9.d:0 "As expected, the reform proposal deadlocked and was sent to the Grand Council. The vote there is expected to be equally tense, with both Scorza and Ciano courting the swing centrists on the Grand Council. As the Grand Council members begin to vote, trust between the two factions on the Council appears to have evaporated entirely, and the goodwill at the congress is gone.\n\nThe Grand Council votes once more, with voters writing 'Yes' or 'No,' and when the ballots are counted..."
 vc.9.a:0 "Blackshirt reform passes!"
 vc.9.b:0 "Blackshirt reform fails!"
 vc.10.t:0 "Loosen Government Control of Unions?"
 vc.10.d:0 "Since the fascist era began, the fascist government has exercised strict control over trade unions throughout Italy. In the 1920s, a new fascist union - the National Syndical Confederation (CNdCS) - was formed and became the only legal union in Italy; all other unions, especially left-wing ones, were soon banned by the government, and the rest absorbed into the CNdCS.\n\nThough designed from the start as one of the pillars of the new fascist state, the bloated bureaucracy and endless power struggles within the regime turned the CNdCS into a tool of repression rather than the power institution it was meant to be - especially after the Grand Council declared strikes illegal in 1939 and began cracking down harder on workers. Genuine workers' representation within the CNdCS is rare, as its purpose has devolved into a PNF tool to prevent workers from forming independent unions - and the working people in the cities are waiting for independent unions to help them grow angrier and more militant.\n\nThe Duce has proposed a radical solution: he intends to break up the national confederation into smaller, more independent unions, allowing workers genuine representation and autonomy within them. Needless to say, this proposal is deeply controversial; many within the PNF have rallied under Carlo Scorza's banner to vocally oppose it."
 vc.10.a:0 "Solidarity forever?"
 vc.11.t:0 "Ciano's Position on Unions"
 vc.11.d:0 "The Duce addressed the assembled fascists in Verona once more. This time, Ciano's speech was not demagogic rhetoric and grand declarations, but cold numbers. Production targets, GDP growth rates, purchasing power - a bombardment of charts, tables, and pie charts straight out of an economics textbook. Through these figures, Ciano claimed the national confederation had reinforced Byzantine bureaucracy in social production, stifling Italy's economic development.\n\nEven more worrisome, he said, evidence showed that the lack of workers' representation was a primary cause of dissent and anger spreading among the lower classes, making them fertile ground for extreme communist ideas. These problems could be solved by a simple measure: allowing smaller, more autonomous, more manageable unions. The speech received some applause, but most attendees were simply overwhelmed by the mass of numbers and charts thrown at them."
 vc.11.a:0 "It's the economy, stupid!"
 vc.12.t:0 "Scorza's Position on Unions"
 vc.12.d:0 "Carlo Scorza once again publicly opposed Ciano in Verona. The Duce's plan to reform unions had enraged broad swathes of the party, most of whom felt that a key component of the fascist political edifice was under direct attack. Scorza's speech was far less fact-heavy than Ciano's; he reminded attendees of fascism's national-syndicalist origins, invoked vague fears of the lingering communist specter, and congratulated fascism on all the great contributions it had made to the Italian working class. Scorza sang the praises of fascist unions, and the hall erupted in thunderous applause.\n\nYet Scorza's speech was severely lacking in concrete proposals to address the problems facing the national confederation and the troubles it had brought to the Italian economy. Some murmurs rippled through the hall, and whether Scorza could win majority support remained to be seen."
 vc.12.a:0 "Fascism for the working class?"
 vc.13.t:0 "The Grand Council Votes on Unions"
 vc.13.d:0 "Neither Ciano nor Scorza could garner breakthrough support, and the debate over the most contentious issue yet once again deadlocked the congress. Once more, to avoid splitting the PNF, the Grand Council will vote on the issue. The atmosphere grows tense, as though the air itself has turned cold, and everyone knows this vote will be historic.\n\nOnce more, the Grand Council members gather, writing down 'Yes' and 'No' one by one, in dead silence. Once more, the vote is counted, and the result is..."
 vc.13.a:0 "Ciano's plan passes!"
 vc.13.b:0 "Ciano's plan is defeated!"
 vc.14.t:0 "The Acerbo Law"
 vc.14.d:0 "As the Verona congress nears its close, an unbelievable and deeply controversial new issue - the electoral law, also known as the Acerbo Law - is raised. Named after the fascist politician Giacomo Acerbo and designed by the PNF to ensure Mussolini and his coalition gained total and complete control, Acerbo drafted the bill in 1923 with the support of various right-wing parties and submitted it to the Italian parliament. The law stipulated that the party winning a plurality of votes - as long as it won at least 25% of the total vote - would receive two-thirds of the seats in parliament.\n\nThe law was used in only one election, in 1924, and unsurprisingly the PNF won an absolute majority in parliament. Afterward, more and more laws were passed to establish fascist dictatorship and give Mussolini sweeping power. Now in Verona, some pro-Ciano PNF members propose reviewing this series of laws, including the original 1924 Acerbo Law. Their proposal includes certain revisions to the electoral law that, while maintaining PNF dominance, open the door for independent parties to run - and even defeat the fascists.\n\nNeedless to say, most attendees are furious. The debate grows heated, Ciano remains largely silent - yet the argument escalates, and some party members even come to blows."
 vc.14.a:0 "Comrades, please be civil."
 vc.15.t:0 "Scorza's Secret Plot"
 vc.15.d:0 "That evening, at a lavish restaurant in Verona's old town, Carlo Scorza and several key PNF representatives meet for dinner. In a private, elegant dining room, all of Scorza's guests can see the cold calculation, scheming, and terrible anger on the General Secretary's face. Ciano has proven a tougher target than expected, and despite the situation, most PNF members still support the cowardly traitor sitting on the Duce's throne.\n\nYet the backlash against the proposal to revise the Acerbo Law has given Scorza a precious opportunity - a chance to ride a wave of various opinions within the PNF and overthrow the current Duce in one stroke. Not one step back - defend the Acerbo Law at all costs. Scorza makes his view clear: the fate of the fascist revolution, and of Italy itself, rests on this."
 vc.15.a:0 "Will Ciano's days be long?"
 vc.16.t:0 "Ciano's Closed-Door Meeting"
 vc.16.d:0 "By evening, as delegates retire to their hotels, the day's fierce clashes subside, and Ciano gathers with his inner circle for a closed-door meeting. Several generals, some senior politicians, and a few lesser-known figures - all are worried about the growing din from Scorza and his faction. This is the final battle; if Scorza can successfully ride the wave of defending the Acerbo Law and gain more and more supporters, the result could be the end of Ciano's tenure as Duce.\n\nAction must be taken to fend off Scorza's offensive - a compromise solution is essential. Without abolishing the Acerbo Law, revise it to allow the people freer choice of PNF representatives in local elections. This is not just a battle over electoral law - it is a battle over who will control Italy - and now, the Duce is unwilling to make a single concession to Scorza."
 vc.16.a:0 "We're at endgame."
 vc.17.t:0 "The Grand Council's Final Vote"
 vc.17.d:0 "After Ciano proposed a more moderate plan to revise the Acerbo Law, the chaos at the congress vanished, replaced by dead silence. Suddenly, everyone realized this was not a battle between supporters and opponents of the Acerbo Law - this was a battle between Ciano and Scorza. The Grand Council members said nothing more, filing one by one into the room for the final vote.\n\nTime seems to drag on endlessly, and finally, all the ballots are cast. The Council's spokesman stammers for a moment, then looks at the tally and announces the result..."
 vc.17.a:0 "The Acerbo Law will be revised!"
 vc.17.b:0 "The Acerbo Law will remain!"
 vc.18.t:0 "The Final Gambit"
 vc.18.d:0 "After the speeches, all party members line up to cast a vote of confidence in Ciano. Though not legally binding, this vote will allow Ciano to continue pushing through some or all of his reform plans. The ballots are counted, and General Secretary Scorza takes the podium to announce the result..."
 vc.18.a:0 "The delegates stand with Ciano!"
 vc.18.b:0 "The delegates oppose Ciano!"
 vc.18.c:0 "Shocking - the vote is tied!"
 vc.19.t:0 "Ciano Declares the Congress a Success"
 vc.19.d:0 "Despite the odds and strong opposition within the party, the Verona congress ends in Ciano's victory. In Ciano's closing address, the fascist delegates sit in silence; the Duce expresses satisfaction with the party's new thinking and the new coalition within, and Ciano promises to push forward reforms and experiments to achieve Italy's great rejuvenation. Scorza remains silent, his face dark. When Ciano's speech ends, warm applause erupts - but Scorza does not clap.\n\nPower struggles within the fascist state can be unpredictable, but one thing is certain: Ciano has won the PNF, and Italy itself. His influence is stronger than at any time before. From leaked information and rumors within the party, Scorza's circle is rapidly disintegrating, with many political heavyweights defecting to Ciano's faction; the outcome is already clear. As the Duce rides in the motorcade to the airport, the Verona crowds chant Ciano's name. The Duce intends to waste no time - once back in Rome, he will complete the work planned in Verona.\n\nThough Ciano controls the entire PNF, Italy's future remains uncertain; the most optimistic observers believe this change will send Italy straight toward democracy. Yet the credibility of Ciano's program remains to be seen."
 vc.19.a:0 "Long live Ciano!"
 vc.20.t:0 "Scorza Seizes Power in Verona!"
 vc.20.d:0 "Italian crowds at home and abroad are stunned by the breaking news - on the final morning of the Verona congress, Scorza submitted a stunning proposal to the Grand Council. Many Council members wondered at the Duce's absence, but everything became clear when the General Secretary's proposal was read aloud: it was a motion of no confidence, intended to remove Ciano from his posts as Prime Minister of Italy and Leader of the Fascist Party.\n\nThis was the final piece of Scorza's political masterpiece - he would seize control of Italy from within the fascist party. Urged on by pro-Scorza party members, the vote was held immediately, and the result was read aloud by the General Secretary himself. After the no-confidence motion passed, Galeazzo Ciano was stripped of all his positions in the Italian government and the PNF. At the same time, an urgent telegram was sent from Rome to Verona - Scorza's agents in the capital had successfully taken control of the King, just as Mussolini himself had done in the 1920s. King Umberto II agreed to grant the position of Prime Minister to Carlo Scorza, General Secretary of the PNF, with his inauguration scheduled shortly at the Palazzo Venezia.\n\nShortly after receiving the telegram, the Grand Council held two more votes: nominating Scorza as Leader of the Fascist Party, and ordering the arrest of former Duce Galeazzo Ciano. Both proposals passed by overwhelming margins. News reports traveling between Verona and Rome are filled with confusion, chaos, and anxiety - but one thing is certain: Ciano's era is over."
 vc.20.a:0 "Long live Scorza!"
 vc.21.t:0 "The Congress Ends"
 vc.21.d:0 "With the final vote tied, both Ciano and Scorza sought some measure of success, but both knew they had failed; the PNF had lost its direction. The second vote was canceled. Neither Ciano nor Scorza spoke to the press, and dark clouds hung over Rome."
 vc.21.a:0 "We'll get through this..."
 vc_ciano_wins:0 "Ciano's influence grows..."
 vc_scorza_wins:0 "Scorza's influence grows..."
 vc.22.t:0 "Preparing for the Verona Congress"
 vc.22.d:0 "Over the past months, the rift between Ciano and Party General Secretary Carlo Scorza has grown increasingly irreconcilable. Scorza has firmly opposed every proposal and reform Ciano has put forward, bringing the government to a weekly standstill; all sides realize something must be done to salvage the situation. We will prepare for the Verona congress to resolve the future of Italy's government and party."
 vc.22.a:0 "Reform or death."
 vc.23.t:0 "Ciano's Speech"
 vc.23.d:0 "'Friends, countrymen. Though I will be a member of our great party past and future, the creed that sustains our nation is not set in stone.'\n\nCiano spoke in Rome today, urging the PNF to 'evolve.'\n\n'The world today is utterly different from the world of 1921. Our great founder never foresaw television, modern medicine, or the rise of other inventions of our new era. Just like the economy, our government must adapt to our times.'"
 vc.23.a:0 "His era is over..."
 vc.24.t:0 "Scorza Meets with His Supporters"
 vc.24.d:0 "In the weeks before the Verona congress, Party General Secretary Carlo Scorza met with several conservatives within the party. Though these meetings were held in secret, Scorza deliberately leaked some information to the press.\n\n'We need to return to our roots,' he said at a press conference earlier this week. 'In these increasingly turbulent times, we must hold fast to our values.'"
 vc.24.a:0 "He needs all the support he can get!"
 vc.25.t:0 "Possible Red Brigade Sighting at the Congress Venue"
 vc.25.d:0 "Despite our newspapers' best efforts to bury the story, reports have emerged that police arrested three Red Brigade agents this week, caught snooping near the Verona congress venue. They have resisted 'enhanced interrogation' since arrest and have not confessed, but we suspect they were looking for security vulnerabilities in the buildings, including back entrances and exits.\n\nThe public has already grown worried about this congress, fearing it could spiral from a party-unifying conference into a bloodbath."
 vc.25.a:0 "Stay vigilant!"
 vc.26.t:0 "Ciano Meets the King"
 vc.26.d:0 "Though King Umberto is little more than a figurehead, he received Ciano this week and endorsed his plans for the congress. Following last month's security incident, this move reassured many ordinary people, who believe this congress will be good for Italy's long-term stability."
 vc.26.a:0 "An important conference, clearly."
 vc.27.t:0 "Scorza Addresses the Grand Council"
 vc.27.d:0 "While Ciano met the King, Scorza prepared his address to the Fascist Grand Council. This morning he took the podium to the applause of the hardliners.\n\n'Gentlemen, fascism will remain as it always was! We need no reforms to appease the decadent left and liberals, nor any more rumors of believing in democracy! Our goals are one and the same, for our goal is what won us the war and made us great!'"
 vc.27.a:0 "Perhaps he has a point..."

 antarctica_aaa_alert_event.10.t:0 "The Proud Sergeant"
 antarctica_aaa_alert_event.10.desc:0 "Sergeant Tancredo López took pride in two things: the army of his fatherland, and his men. But as his squad waited foolishly outside Chile's Bernardo O'Higgins Station, he began to wonder if his pride had been misplaced. First there was the visible age of the weapons the quartermaster had issued: young Private Ortege brandished a Mauser that would be more at home in a museum exhibit, with matching scarce and shoddy ammunition. Most importantly, rations were precariously low, and they had been forced to take time off to hunt penguins for food.\n\nLópez's men sat around the fire boiling penguin meat, and the grumbling started.\n\n\"Why are we stuck in this godforsaken place? Do those idiot officers even care about this wasteland?\" muttered Private Díaz.\n\nOrtega sat across the fire, rusty Mauser in hand, and retorted sharply: \"Are you serious? We are soldiers, and our mission is to protect the honor of our great fatherland from those Chilean bastards.\" Compared to the others' apathy, his voice sounded young and earnest.\n\n\"Kid, if there was anything besides snow out there that could buy me a decent meal, I'd be gone already.\" Díaz's remark drew nods of support from several others. Ortega started to reply but was cut off by López: \"Rodríguez, you should be grateful we only have one magazine each, otherwise I'd shoot you without mercy for your words.\" Díaz sat in his chair, a killing intent in his cold eyes as he glared at Sergeant López. As night deepened, the soldiers fell asleep, and López stayed awake all night.\n\nThe next morning, López and his men spotted Chilean forces approaching, wearing thick gray coats and carrying new M-14 rifles supplied by Uncle Sam. López shouted, \"Fall back!\"\n\n\"But - but sir, with our courage I believe we can - \" Ortega started, but was cut off by López's uncompromising gaze. He fell silent and followed the others back to the snow vehicle. They returned to Esperanza Station in shame, and no one felt it more than Sergeant López."
 antarctica_aaa_alert_event.10.a:0 "Pride remains before defeat."
 antarctica_aaa_alert_event.11.t:0 "Death of Hope"
 antarctica_aaa_alert_event.11.desc:0 "The cold, sticky meat stayed between Mateo's teeth only a moment before he spat it into the sea below. Rations had gone bad again. Mateo could not understand how canned beef spoiled in Antarctica, an eternal outdoor refrigerator; the Institute's incompetence truly was endless.\n\nIn his years of military service before being transferred to Antarctica, Mateo had always regarded the navy - which suppressed the reckless adventures of incompetent bureaucrats and politicians - as a bulwark of order and discipline. But recent experiences had finally disabused him of this notion. Argentina's claim to Antarctic hegemony should have been a national celebration, a recreation of the old Argentine spirit of conquering the pampas. Instead, while the chief explorer ventured deep into the Antarctic interior, consuming rivers of blood and wealth on unrealistic fantasies, foreign powers were crudely trampling on their territorial claims.\n\nNo, corruption was not born among the civilians; its roots went far deeper than that. Mateo's musings were suddenly interrupted by an order as several ships appeared nearby. His first reaction was annoyance, for they should have been the only ships in the area. Had his superiors become so incompetent as to waste precious fuel on superfluous convoys? But when the captain's voice came again, fear immediately overcame annoyance. These were Chilean warships intruding into Argentine waters.\n\nA thunderclap split the frigid air, and Mateo glimpsed the flash of distant artillery. Was this a warning shot, or had the Chilean cabrones actually dared to fire on Argentine vessels? The Argentine captain did not even take time to determine their intent before quickly ordering a turn back. If the Argentine navy was so cowardly and incompetent that it could not even patrol its own waters, then it was truly finished. Thinking this, Mateo hurled the rotting meat can in the direction of the Chilean fleet, then returned to his cabin, unwilling to face the cold wasteland."
 antarctica_aaa_alert_event.11.a:0 "Hope for Argentine Antarctica has died."
 antarctica_aaa_alert_event.20.t:0 "Cartographic Error"
 antarctica_aaa_alert_event.20.desc:0 "\"No, I can't calm down about this!\" Beltramino shouted into the phone. \"What do you mean it's just a map?! Use your damn eyes and look! This ridiculous map shows Chile taking almost the entire Antarctic Peninsula!\" The more explanations he heard from the Argentine diplomat on the other end, the angrier he became.\n\n\"Is this even a big deal? Whatever the Chileans say doesn't matter, right?\"\n\n\"What do you think will happen if the American media, military, and politicians make a big deal out of this? The map is 'wrong' now, but if the Yanks act according to what it shows, it becomes true. Now the whole world sees us as squatters on Chilean territory! I can't stand for this! This land is as non-negotiable as Buenos Aires itself!\"\n\nHe sighed: \"Colonel Leal will come clean up this mess. Right now we need to focus on raising our international legitimacy, and fast.\"\n\nBefore hanging up, he left one last word: \"Next time... don't let this happen again. A cartographer's brush can start a war as easily as a bullet.\""
 antarctica_aaa_alert_event.20.a:0 "Sovereignty over Argentine Antarctica hangs in the balance..."
 antarctica_aaa_alert_event.21.t:0 "Death of Hope"

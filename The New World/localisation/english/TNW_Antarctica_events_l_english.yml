 antarctica_aac_alert_event.10.t:0 "Burning with Rage"
 antarctica_aac_alert_event.10.desc:0 "Merino slammed the toilet door shut and began pacing. He could not sit through another second of this briefing. He had always known Guzmán was a slippery, Machiavellian two-faced operator, but he had not realized this honey-tongued liar was also a complete idiot. The reports showed the situation growing worse by the day; those Buenos Aires insects were expanding, and their birdshit Argentine flags were planted brazenly on Chilean soil. From the start, Merino had seen only one way out: kill them to the last man.\n\nBut Guzmán insisted on wasting time with his idiot underlings, trying to negotiate a path with the Argentines. Everyone knew you couldn't get ivory out of a dog's mouth. Meanwhile, their supplies were running dry while Argentine insects ran amok on the fatherland's territory. In the old days, a fool like Guzmán would never have risen in politics; he would have been dragged off for sterilization. Something was wrong. Unless... Jaksic! That snake-hearted red bandit! Merino did not know what the Argentines had used to bribe that well-dressed worm for intelligence, but perhaps it was the universal red-bandit weakness: Jaksic envied the great strength forged from national pride. Enough talk. Merino would not cede the territory. He immediately drew up a plan. Step one was rationing; there was no surplus food at the base for idle fat pigs to squander. Then Merino would issue everyone a uniform and send them to the front lines on patrol. With the enemy at the gates, one misstep meant the entire territory was doomed. The Argentines would certainly strike suddenly, and when they did, Jaksic would have little time to find his confederates. No - Merino would find him first, and then..."
 antarctica_aac_alert_event.10.a:0 "He would hang the bastard and make an example of him to all traitors to the fatherland."
 antarctica_aac_alert_event.11.t:0 "Consumed by Flames"
 antarctica_aac_alert_event.11.desc: "The station cabinets crashed to the floor. Professor Guzmán picked up a few scattered documents, glanced back at his desk, looked around the office, and finally rested his eyes on the map of Chilean Antarctic Territory. Then he closed the door, thinking: perhaps there would be no next time. Mountainous piles of documents turned to ash in the stove in the next room. Guzmán fed the fire his files, maps, telegrams, and other materials.\n\nOutside Guzmán saw towering columns of smoke everywhere. Arturo Prat Station was a sea of fire, orange flames lighting every window, station personnel running in all directions. Some dragged what few possessions and supplies remained, preparing to leave the station; others fetched more documents to burn. It was over. Long supply shortages had brought the tragedy of Bernardo O'Higgins Station to repeat itself. Like the Chilean islands along the Antarctic coast, it had fallen into Argentine hands.\n\nWhen the Argentines attacked from the sea, only garbled signals came from the radio room. The station at Rafael Sotomayor Coast reported sighting Japanese troops. Guzmán walked alone through the chaos, carrying two suitcases with an indifferent expression.\n\nJaksic, Villaroel, and Miranda were coordinating evacuation in the port of Punta Arenas. As for Merino? Guzmán sneered. Some said he had taken his cruiser out for a last-ditch fight with the Argentines. Others said he had caught the first plane home.\n\nThe last engine started on the frozen runway. Guzmán climbed aboard; beside him were the last Chileans to leave Antarctica. A group of broken people, their idealism shattered by a world that only respected force. Arturo Prat Station shrank into a hazy shadow amid the roaring flames. Guzmán stared at it blankly. He saw Chile's history of Antarctic exploration come to an end, and everything he had done here consumed by fire."
 antarctica_aac_alert_event.11.a:0 "The column recedes; the past cannot be recalled, but the future may yet be pursued. Farewell, Antarctica."
 antarctica_aac_alert_event.20.t:0 "Mole Syndrome"
 antarctica_aac_alert_event.20.desc:0 "Professor Guzmán slumped into his chair cushions, gazing out at the Antarctic abyss. His office was a mess, with documents and empty bottles scattered everywhere. On the desk sat a half-eaten long-cold lunch.\n\nFor over an hour he had sat frozen, not moving an inch.\n\nHe had just opened the letters from Villaroel and Miranda, which said the same thing: whispers had spread throughout Latin America, and it was widely accepted that Argentina had gained the upper hand and was entitled to its claimed territory; Chile's Antarctic operations had become an international laughingstock, and Chileans were seen as stubborn clowns who refused to see or hear the plain truth.\n\nBut Guzmán knew how it had come to this. In the end he must bear primary responsibility. The nation had entrusted him because they believed he could win Chile a place in Antarctica and earn international respect. Instead, reality had dealt them a crushing blow; the leader they had chosen was merely a diplomatic impostor, a poseur.\n\nGuzmán believed it would not be long before he could rally again, turning passion into action and standing for justice against this mad world. Then the people here would have a leader who was truly worthy."
 antarctica_aac_alert_event.20.a:0 "But today... at this moment, Guzmán had to admit defeat."
 antarctica_aac_alert_event.21.t:0 "Chilean Antarctic Claim Points Exhausted"
 antarctica_aac_alert_event.21.desc:0 "You have failed"
 antarctica_aac_alert_event.21.a:0 "You have failed"
 antarctica_aac_alert_event.30.t:0 "For a Paltry Profit"
 antarctica_aac_alert_event.30.desc: "The captain stepped aside, a cunning smile on his face: \"Gentlemen, the supplies are this way, if you please?\" Jaksic smiled back, clicked his ballpoint pen, and stepped into the shadows.\n\n\"Of course, gentlemen, I assure you everything is in order.\" But as Jaksic and his team filled in their clipboards, a sense of unease gradually spread. Supply problems in the Antarctic territory were common; the paper numbers never matched what actually arrived, and everyone was in on it. At first the discrepancies were minor - for example, 11 cases of snow boots on paper but 10 delivered, or rations meant for 17 weeks running out in week 15. But things soon escalated wildly, and the supply manifests were as dark as the hold itself. Jaksic rapped lightly on an oil drum; only a hollow echo came back. The group froze. Jaksic's face darkened. He turned to scrutinize the captain, his voice ice-cold: \"Captain, you know the Chilean government ordered 150 gallons of fuel for the Antarctic territory. Now, would you be so good as to tell me how many gallons are actually in this hold?\" For a moment only the creaking of the ship at sea could be heard, and the captain quickly deflated like a punctured ball.\n\n\"Mr. Jaksic, sir, I... I'd have to ask my first mate, but I reckon we're carrying about... uh... 83 or 84 gallons... give or take.\" The captain stammered his confession, cold sweat glistening in the dim light. The inspection team realized they had been fooled all along. Jaksic was furious; he wanted to tear into the captain for what he had done, which could indirectly kill dozens of brave Chileans, all for at most a few thousand pesos! Finally Jaksic tried to suppress his rage; he could feel a host of numbers scurrying around in his head, and a fierce headache was coming on."
 antarctica_aac_alert_event.30.a: "\"I need to find a more reliable supplier for Arturo Prat Station,\" Carlos thought gloomily."
 antarctica_aac_alert_event.31.t:0 "Chilean Antarctic Supply Exhausted"
 antarctica_aac_alert_event.31.desc:0 "You have failed"
 antarctica_aac_alert_event.31.a:0 "You have failed"
 antarctica_aag_alert_event.10.t:0 "The Frontier"
 antarctica_aag_alert_event.10.desc:0 "The last gunshots echoed in the valley, and silence settled in. Herbert Freytag's knees ached as he struggled up from cover and raised his binoculars. Looking down the valley, he could see American soldiers retreating on snowmobiles and tractors. He checked his squad: two men dead, the rest more or less wounded, and no ammunition left.\n\nFreytag did not understand his superiors' thinking: they refused to provide enough heavy weapons for his outpost bordering OFA Antarctica Directorate territory, making it impossible to hold. That they had repelled this attack was a miracle; next time his men would not be so lucky.\n\nFreytag found the radio operator in the nearby camp: \"I need you to get a message to Meier,\" he said. \"American forces have launched a probing attack across the border. We desperately need heavy weapons support; we cannot hold much longer.\"\n\nFreytag hoped Meier would notice the request; he seemed like an intelligent man. Now his only hope was to watch the border closely and pray the Americans did not return.\n\n- At Schirmacher Station, an exhausted Meier was jolted awake by an urgent message from the border, sitting bolt upright from his warm bed. He read it and sighed: \"They're at it again?\"\n\nAnton Grassel nodded heavily: \"It seems those bastards have noticed our patrol frequency has dropped. Tell them we're not frozen yet, at least not yet!\""
 antarctica_aag_alert_event.10.a:0 "\"Agreed,\" Meier replied. \"Move reserve units to the front.\""
 antarctica_aag_alert_event.11.t:0 "Canadian Engineering"
 antarctica_aag_alert_event.11.desc:0 "Freytag pushed the snow tractor's engine to the limit, possibly burning out the fuel, but he had to get it back to Schirmacher Station immediately. He had new information to deliver, and a duty to get the few survivors back to safety.\n\nIn the rearview mirror he saw smoke rising from the wreckage of the border outpost, and a dozen sets of dazzling headlights sweeping the dark. The OFA forces had launched a raid under cover of night; it would have been all too easy to wipe out these light border guards. Against the Canadians' snowtracks, Freytag and his men's light firepower was nothing. They smashed through the fragile fortifications like a crazed plow through soil, crushing everything in their path.\n\nNew Swabia's weapons supply and overall combat effectiveness had deteriorated severely. Freytag knew the OFA would be at Schirmacher Station within a week. They had seven days to destroy everything that should not be captured and evacuate this shitpit of a continent.\n\nHe prayed his engine would hold out, and that Meier was prepared for this emergency."
 antarctica_aag_alert_event.11.a:0 "A soldier without a rifle is not an army."
 antarctica_aag_alert_event.20.t:0 "Legitimacy"
 antarctica_aag_alert_event.20.desc:0 "To: German Polar Research Institute\n\nFrom: Ernst Herrmann\n\nSubject: Argentine and Chilean territorial incursions\n\nOver recent weeks we have noted an increasing number of Argentine and Chilean vessels and aircraft crossing our territorial waters and airspace. These craft have refused repeated orders to alter course; on the Abwehr's instructions we have not fired on them. Reconnaissance indicates these intruders are poorly equipped, taking the most direct route to their destinations, and appear to be crossing borders for convenience rather than any military purpose.\n\nHowever, this blatant violation of our territory threatens the integrity and legitimacy of our Antarctic claim, exposing us to Japanese and American attack as they circle like vultures, aware that we have not taken necessary action. I formally request that the Polar Research Institute publicize and consolidate Germania's authority over New Swabia. If we fail to respond to similar threats, our Great Germanic claim to Antarctica will be jeopardized, and we will be unable to prevent rivals from partitioning our colonies and research facilities.\n\nSieg Heil!"
 antarctica_aag_alert_event.20.a:0 "P.S. If you can, send a few more crates of hard liquor to boost morale."
 antarctica_aag_alert_event.21.t:0 "Coming Apart"
 antarctica_aag_alert_event.21.desc:0 "To: Ernst Herrmann\n\nFrom: German Polar Research Institute\n\nSubject: Foreign incursion into New Swabia\n\nWe have received your letter and take it most seriously. We immediately dispatched diplomatic envoys to Argentina and Chile to protest their blatant incursions into our territory. They have entirely denied the facts and publicly derided this as a Great Germanic ploy to discredit its Antarctic rivals. This condemnation came as a surprise to us, since Argentina and Chile are at least nominally friendly to the Great Germanic Reich.\n\nWe also have bad news: through contacts in Adwal, we have discovered that the so-called harmless actions by Chile and Argentina are in fact part of a plan to partition New Swabia. Both the OFA Antarctica Directorate and - per certain intelligence - the Japanese authorities have negotiated a plan to carve up our territory and seize our research data and sensitive documents. The Chileans and Argentines are willing to participate in this adventure, which shows exactly how far our legitimacy in Antarctica has fallen. We therefore recommend immediate evacuation of the colony and destruction of everything the enemy could use against us. Needless to say, the German fatherland will not start a world war over a patch of ice, especially not given the deteriorating domestic situation.\n\nSieg Heil!"
 antarctica_aag_alert_event.21.a:0 "P.S. Whatever you do, don't return to Germany proper. Have Schirmacher use his contacts in South America and settle in the Caribbean. And send us some liquor."
 antarctica_aag_alert_event.30.t:0 "Rationing"
 antarctica_aag_alert_event.30.desc:0 "Quartermaster Elias Baumann entered the office and saluted Meier. \"At ease,\" Meier said. \"Come, sit down.\"\n\nBaumann's bulky frame squeezed into the wooden chair before Meier; the old oak armrests seemed barely able to contain him. Meier lit a cigarette, stared at its glowing tip, and began speaking with the quartermaster: \"I've had complaints from several departments about food, fuel, and supply. Current rations may not be enough for basic needs.\" He glanced at Baumann.\n\nThe quartermaster sighed: \"I've explained this to the department heads. Navy resupply is becoming more sporadic. We shouldn't act as if we have unlimited resources, especially with Schumann's demands growing ever more extravagant. I'm worried that if things continue like this, no one will be happy.\"\n\nMeier puffed on his cigarette: \"What's the current shortfall, and what do you recommend?\"\n\n\"This quarter's food consumption has already far exceeded projections, and the fuel situation is dire. If we don't implement full rationing immediately, everyone will starve and the test planes will be grounded before the next navy resupply. I recommend cutting per-person rations to three-quarters of normal, stopping all unnecessary vehicle use, and reducing border patrols until supply levels recover.\""
 antarctica_aag_alert_event.30.a:0 "\"Do what needs to be done, Baumann.\""
 antarctica_aag_alert_event.31.t:0 "The Last Generator"
 antarctica_aag_alert_event.31.desc:0 "Sitting before the last functioning generator, Meier sipped his last prized bottle of whiskey. He had tried, with the help of armed guards, to protect the base's remaining supplies and keep the research station lit until the next resupply, but his efforts had failed. Poor resource management by the staff had put both Schirmacher Station and New Swabia's viability at risk.\n\nMeier had heard that the OFA had already taken over the vacated border outposts, and those damn Ahnenerbe types were still firing on any German soldier who came too close to anything they could see. Therefore Meier had made an unbelievable decision: evacuate Antarctica. Everything that could be used against them would be destroyed, and the rest of them packed like sardines onto the handful of leaky navy ships at Port Spee. They were going home, but not as victors. Meier knew he and his command had to flee beyond German-controlled territory to avoid a court-martial on return.\n\nThe generator rumbled and died completely, sleeping beneath the frozen, merciless Antarctic earth along with New Swabia's hopes."
 antarctica_aag_alert_event.31.a:0 "\"Burn everything we can't carry,\" Meier shouted. \"We're leaving this iceberg.\""

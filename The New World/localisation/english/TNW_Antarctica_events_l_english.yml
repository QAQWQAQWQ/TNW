 antarctica_aaa_alert_event.30.t:0 "Supply Shortage"
 antarctica_aaa_alert_event.30.desc:0 "Sub-Lieutenant José Madeira thought a blizzard was about to sweep the base as he stared through binoculars at the rapidly approaching storm clouds. When he saw his attendants around him stripping the base apart for the last scraps of fuel and food, stuffing supplies into snow vehicles, he thought calling this place a \"base\" was giving it too much credit.\n\nThere were too few supplies to stay, and not just here - a host of bases across the territory had recently been abandoned due to logistics failures.\n\nHe sighed and looked around; the orange parkas people wore stood out starkly against the endless white wasteland. His attention moved to the flag marking the camp boundary, its bright blue stripes contrasting sharply with the slowly approaching black clouds. The white in the middle depicted the surrounding landscape and the sun, which he missed terribly as he stood on this desolate frozen earth.\n\n\"Is it all worth it?\" he asked himself. Though José was a patriotic soldier, he could not help thinking that among all the ways a nation could win territory and prestige, surely a few did not involve freezing and starving at the end of the world.\n\nApproaching bootsteps pulled him from his reverie. José turned on his heel to face Dr. Lucas T. Crespo. Over the past few months of lonely hardship, he had come to respect the glaciologist. \"The data we got here is decent, but unfortunately we cast too wide a net to get anything meaningful,\" he muttered dejectedly, and José laughed in response.\n\n\"Don't get me started. Blame Leal's damn obsession with reaching the Pole.\" A gust of wind swept away their words, urging each to return to their packing in silence."
 antarctica_aaa_alert_event.30.a:0 "Only the Argentine flag remains here, alone against the ever-growing storm."

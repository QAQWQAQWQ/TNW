 antarctica_alert_event_legitimacy:0 "§REmergency Diplomatic Efforts will no longer be available.§!"
 antarctica_alert_event_equipment:0 "§REmergency Reserves will no longer be available.§!"
 antarctica_news_events.1.t:0 "[Get_newspaper_header] Shield of Africa Aids New Swabia"
 antarctica_news_events.1.desc:0 "The international community has learned of a miraculous transoceanic rescue in the distant Southern Hemisphere, and the identity of the rescuer is stunning. Since the outbreak of the German civil war, Germany's Antarctic possession of New Swabia had long been suspected of facing chronic supply shortages, but recent reports show that the isolated \"prison nation\" of East Africa has decided to intervene to aid the beleaguered outpost.\n\nThough New Swabia and East Africa have revealed little, the further deployment of American, Chilean, and Argentine air forces to the Antarctic region shows that Antarctica remains a focus of rivalry among the world's major powers. With the German civil war nearing its end, no one knows how the new Führer of the Great Germanic Reich will reassert control over the far south."
 antarctica_news_events.1.a:0 "Has the Great Germanic Reich's most distant colony been saved?"
 antarctica_news_events.2.t:0 "[Get_newspaper_header] Argentina Aids New Swabia"
 antarctica_news_events.2.desc:0 "The stranded residents of German Antarctica have received the most unlikely of support. Earlier this morning, Jorge Edgar Leal, the charismatic leader of the Argentine Antarctic administration, submitted an emergency request to aid his German neighbors.\n\nWith supply lines from Quelimane disrupted by the recent unrest in the German homeland, Leal selflessly aided New Swabia despite past border conflicts between them. For this, Rudolf Meier expressed his gratitude, saying he was \"forever indebted to the Argentine people.\"\n\nAfter this, Argentina was condemned by the OFN but praised by the Speer's faction. The Co-Prosperity Sphere has not yet commented, but the 1st Airborne Regiment stationed in Antarctica has recently been unusually active over Argentine territory."
 antarctica_news_events.2.a:0 "An act of mercy."
 antarctica_news_events.3.t:0 "[Get_newspaper_header] OFA Aids New Swabia"
 antarctica_news_events.3.desc:0 "Shocking news from the coldest front of the Cold War: the OFA Antarctica Directorate has approved sending emergency supplies to German Antarctica. Even before the unrest in the German homeland, New Swabia had already been experiencing supply shortages, and the recent upheavals forced them to seek aid elsewhere.\n\nWhen asked about this, US Navy Vice Admiral William Raborn said: \"Under other circumstances we'd tell them to go to hell, but here things are different. Under the ice, everyone is equal.\"\n\nThough Vice Admiral Raborn's decision has drawn criticism, he stands by his choice; given his illustrious career, he is unlikely to be removed over such a minor matter."
 antarctica_news_events.3.a:0 "An act of mercy."
 antarctica_news_events.4.t:0 "[Get_newspaper_header] New Swabia Collapses"
 antarctica_news_events.4.desc:0 "An elite CIA SOG team raided New Swabia. The German forces had no will to fight and surrendered with little resistance. Reportedly, no firefight even took place. German General Anton Grassel tried to lunge at a nearby officer and seize his sidearm, nearly triggering a clash, but was quickly subdued and imprisoned along with other high-value targets. Beyond this, surviving SS forces in Antarctica have occupied a small strip of territory in western New Swabia.\n\nThe OFA Antarctica Directorate issued a statement on the annexation, calling it a necessary measure to maintain peace, though critics called it a naked land grab to expand its own influence. Vice Admiral William Raborn congratulated Rip's troops, saying he was \"gratified that they secured the situation without firing a shot.\""
 antarctica_news_events.4.a:0 "The SS declined to comment."
 antarctica_news_events.5.t:0 "[Get_newspaper_header] Antarctic Explorer Alfred Ritscher Dies"
 antarctica_news_events.5.desc:0 "A bit of news from the German morass: explorer Alfred Ritscher, aged 83, has died. He died at Germany's most chaotic moment; though Karl Dönitz held a small funeral for him, he never received greater glory.\n\nAs a captain in the Kriegsmarine, he led Germany's third Antarctic expedition in the 1930s, laying the groundwork for Germany's claim to New Swabia during the Antarctic partition. Ritscher had a longstanding rivalry with US Navy Admiral Richard Evelyn Byrd, each having led his nation's first Antarctic expedition. After the expedition, Ritscher served for life as president of the German Polar Research Institute. Now his post passes to another veteran of the third Antarctic expedition, Karl-Heinz Lbke, a staunch conservative Nazi Party member."
 antarctica_news_events.5.a:0 "A giant of an age has fallen, with no successor."
 antarctica_news_events.6.t:0 "[Get_newspaper_header] Germany Returns to Antarctica"
 antarctica_news_events.6.desc:0 "After the civil war ended, the German navy was determined to return to New Swabia, committing the nation's full resources to consolidating its Antarctic claim. Unexpectedly, they discovered that the soldiers and scientists abandoned there when the civil war began were still alive - at least some of them were. While the German homeland burned, they had steadfastly guarded the fatherland's territory against foreign incursion. The rescue arrived just as the stranded men's supplies and reserves were nearly exhausted; compared to the dark future that had awaited them, this reunion kindled a brilliant flame of joy.\n\nNow, Germania must decide how to handle this new territory. At least for now, the new Führer intends to expand this distant base under the banner of \"safeguarding the fatherland's future,\" though the feasibility of achieving this goal remains to be seen."
 antarctica_news_events.6.a:0 "What will Germany do?"
 antarctica_news_events.7.t:0 "[Get_newspaper_header] Nazi War at the End of the World"
 antarctica_news_events.7.desc:0 "Bizarre news has come from the southern continent. A soldier who served in the German Antarctic colony of New Swabia has revealed to OFA military authorities that their colonial headquarters, Schirmacher Station, was attacked by the SS!\n\nThe German whistleblower, who wished to remain anonymous, said that a clash had broken out between the colonial forces and rebel SS. Though headquarters was besieged, they were lucky enough to drive the SS out of the base. The incident left dozens of Germans dead or wounded and caused thousands of marks in property damage.\n\nMany are deeply concerned about the reason for the attack, suspecting it was a politically motivated lie, a plot to purge internal opponents. Was the attack ordered directly by the East Paris authorities? Or was it the sole work of the Ahnenerbe's Antarctic division?"
 antarctica_news_events.7.a:0 "They were lucky."
 antarctica_news_events.8.t:0 "[Get_newspaper_header] New Swabia Collapses"
 antarctica_news_events.8.desc:0 "Recently, the German Antarctic territory of New Swabia has collapsed after supply shortages and unrest. The OFN has deployed forces to the region and has evidently taken control. Beyond this, surviving SS forces in Antarctica now occupy a small strip in western New Swabia.\n\nThe OFA Antarctica Directorate issued a statement on the annexation, calling it a necessary measure to maintain peace, though critics called it a naked land grab to expand its own influence. Vice Admiral William Raborn congratulated Rip's troops, saying he was \"gratified that they secured the situation without firing a shot.\""
 antarctica_news_events.8.a:0 "The SS declined to comment."
 antarctica_news_events.9.t:0 "[Get_newspaper_header] Ice Hell"
 antarctica_news_events.9.desc:0 "The situation in Germany has taken a sharp turn for the worse, and no sphere has been spared. The Sydney Morning Herald has learned from sources in the OFA Antarctica Directorate that the Nazi colony of New Swabia has collapsed. After a long silence in the German-occupied zone, OFA personnel crossed the border to investigate and found a horrific scene at Schirmacher Station.\n\nWith supply lines cut by the German civil war, the stationed personnel appear to have starved or perished in the ice. Initial autopsies show scurvy was rampant in the base. Beyond this, unconfirmed reports claim bite marks on the skeletons, suggesting these people may have resorted to cannibalism like many polar explorers before them."
 antarctica_news_events.9.a:0 "Another mass grave added to German history."
 antarctica_news_events.11.t:0 "[Get_newspaper_header] Italy Leases Galindez Island from Argentina"
 antarctica_news_events.11.desc:0 "According to news from Rome earlier today, the Italian and Argentine governments have agreed to lease Galindez Island to Italy for ten years. This Antarctic island was occupied by Argentina during the Battle of Snipe Island, and few nations recognize its sovereignty claim over it. The Chilean government declined to comment, though reports indicate it is taking diplomatic action on the matter. Regardless of the agreement's legality, the Italian government plans to establish a civilian research base on the island within the month. The statement says nothing about whether Galindez Island will be militarized, but given Rome's support for Argentina's Antarctic adventures and the high degree of militarization across all Antarctic administrations, there is no doubt that the Italian navy will appear in Antarctica before long.\n\nWith this agreement now in effect, the Italian-Argentine alliance on Antarctic affairs has been consolidated.\n"
 antarctica_news_events.11.a:0 "The balance of power on the white continent has shifted."
 antarctica_news_events.11.b:0 "Great, another \"new friend.\""
 antarctica_news_events.11.c:0 "The Cold War grows colder."
 antarctica_news_events.12.a:0 "Hey! That's our turf!"
 antarctica_news_events.12.b:0 "This will benefit our Antarctic interests."
 antarctica_news_events.12.c:0 "Looks like open season on South Georgia."
 antarctica_news_events.12.d:0 "The frozen continent's situation keeps heating up..."
 antarctica_news_events.13.t:0 "[Get_newspaper_header] South Africa Establishes Base in Antarctica"
 antarctica_news_events.13.desc:0 "After surviving the bloodiest war since the end of the Second World War, South Africa has returned to the world stage with the announcement of the South African National Antarctic Programme. As its name suggests, South Africa will immediately begin its first Antarctic expedition. As part of the programme, a permanent base of the same name will be established. This base will be built along the coast of Holme Bay, near Australia's Mawson Station. Beyond this, South Africa will begin taking on part of Antarctica's defense; in return, the South African government will gain a voice in the OFA Antarctica Directorate. Though Washington is generally optimistic about South Africa's entry, some claim it will only make the OFA Antarctica Directorate more bloated. Only time will tell whether this is good or bad for the OFA Antarctica Directorate."
 antarctica_news_events.13.a:0 "A great day for our nation!"
 antarctica_news_events.13.b:0 "Let's hope they actually contribute to defense..."
 antarctica_news_events.13.c:0 "Let's hope this ties the OFA's hands in Antarctica..."
 antarctica_news_events.13.d:0 "Great, now the OFA Antarctica Directorate is even more bloated."
 antarctica_news_events.14.t:0 "[Get_newspaper_header] Hyman Rickover Appointed New Head of OFA Antarctica Directorate"
 antarctica_news_events.14.desc:0 "US Navy Vice Admiral William Raborn announced today that he will retire from his post as head of the OFA Antarctica Directorate, and named his successor: Vice Admiral Hyman Rickover. Among all predictions for Raborn's successor, Hyman Rickover was always the leading contender.\n\nBorn to a Jewish family in Poland, Rickover later emigrated to the United States. As the father of the US nuclear navy and a staunch advocate of reactor safety, his first act upon taking office was to overhaul a critically important nuclear power plant at McMurdo Station that had been nicknamed the \"nuclear outhouse\" due to its repeated accidents. It seems that in any case, American control of the OFA Antarctica Directorate has been maintained."
 antarctica_news_events.14.a:0 "It seems things don't change even at the end of the earth."
 antarctica_news_events.14.b:0 "Of course, he's American."
 antarctica_news_events.14.c:0 "Our interests here are secure."
 antarctica_news_events.15.t:0 "[Get_newspaper_header] Howard Beale Appointed New Head of OFA Antarctica Directorate"
 antarctica_news_events.15.desc:0 "US Navy Vice Admiral William Raborn Jr. announced today that he will retire from his post as head of the OFA Antarctica Directorate, and named his successor: the Australian Howard Beale.\n\nDuring Beale's tenure as financial officer of the OFA Antarctica Directorate, he oversaw the establishment of Mawson Station and Davis Station, and provided strong support for the construction of the nuclear power plant at McMurdo Station. Analysts believe that upon becoming head of the OFA Antarctica Directorate, he will prioritize infrastructure and security, as well as maintaining Australian interests on the continent."
 antarctica_news_events.15.a:0 "A new face at the end of the earth."
 antarctica_news_events.15.b:0 "A minor setback at the end of the earth."
 antarctica_news_events.15.c:0 "Antarctica has returned to those who truly care for her."
 antarctica_news_events.15.d:0 "A bright future for the frozen continent!"
 antarctica_news_events.16.t:0 "[Get_newspaper_header] Hillary Takes Up Raborn's Mantle"
 antarctica_news_events.16.desc:0 "US Navy Vice Admiral William Raborn Jr. announced today that he will retire from his post as head of the OFA Antarctica Directorate, and named his successor: New Zealand Air Commodore Sir Edmund Hillary. Among all predictions for Raborn's successor, no one expected Hillary to take the helm.\n\nHillary hails from the smallest nation in the region, and is also a famous explorer, one of the first men to summit Mount Everest in 1953. Recently, he had represented New Zealand in the OFA Antarctica Directorate. His address on assuming the post indicated that peaceful coexistence with all Antarctic parties and a focus on scientific research, expedition, and environmental issues will be his main goals, leading some to worry he may undermine the OFA's position in the region."
 antarctica_news_events.16.a:0 "A new face at the end of the earth."
 antarctica_news_events.16.b:0 "What, a New Zealander?"
 antarctica_news_events.16.c:0 "A bright future for the frozen continent!"
 antarctica_news_events.17.t:0 "[Get_newspaper_header] Argentine Expedition Reaches South Pole"
 antarctica_news_events.17.desc:0 "History was made today on the frozen Antarctic continent as the Argentine expedition \"Operation 90 South,\" led by Colonel Jorge Edgar Leal, successfully achieved its goal of planting the Argentine flag at the South Pole, with the stated purpose of \"confirming the integrity of Argentine territory.\"\n\nLeal led his men through fearsome blizzards, freezing temperatures, across glaciers and mountains, over 3,000 kilometers to the Pole. They were the first humans to set foot here since Roald Amundsen and Scott's ill-fated expeditions of 1912. Leal and his men were warmly welcomed in Buenos Aires and showered with honors. However, the impact of this achievement on Antarctic border disputes remains unclear."
 antarctica_news_events.17.a:0 "An Argentine star is rising."
 antarctica_news_events.18.t:0 "[Get_newspaper_header] Argentina Mourns Its Antarctic Dead"
 antarctica_news_events.18.desc:0 "Today, Buenos Aires held a mourning ceremony for the explorers of Operation 90 South. The expedition, led by Colonel Jorge Edgar Leal, had set out to plant the Argentine flag on Antarctica to further legitimize the nation's claim.\n\nThe explorers should have returned two weeks ago, but no word has been received from them. The Argentine government has reluctantly confirmed that the expedition must have run out of supplies by now, and that there is no rescue plan. Thereafter, Argentina's Antarctic claim will be administered ad interim by the recently promoted Admiral Emilio Massera.\n\nIt is suspected that Leal and his men met the same fate as Scott's Antarctic expedition. Starvation and the cold of Antarctica's forgotten wastes consumed them entirely."
 antarctica_news_events.18.a:0 "Argentina mourns a frozen grave."
 antarctica_news_events.20.t: "[Get_newspaper_header] Operation Southern Cross"
 antarctica_news_events.20.desc: "Breaking news from Antarctica: the OFN has announced an international operation to de-Nazify German New Swabia's claimed territory. A joint force of American, Australian, New Zealand, and Canadian units has begun attacking Germany's Antarctic territory. At the same time, eyewitnesses have spotted a Brazilian-Uruguayan task fleet sailing south, confirming earlier reports of strengthened military cooperation between the two nations and the OFN.\n\nThe various powers on Antarctica have long stood in confrontation. Though skirmishes are not uncommon, this is the first open fighting on the continent since the Snipe Island incident of 1958. Some question why blood should be spilled over this worthless wasteland, while others see it as an extension of the fighting in Africa. Whatever the truth, any conflict in such harsh conditions will bring immense suffering to all combatants.\n"
 antarctica_news_events.20.a: "Liberate every continent at any cost."
 antarctica_news_events.20.b: "To the ends of the earth, the Thousand-Year Reich endures!"
 antarctica_news_events.20.c: "This is sheer manslaughter."
 antarctica_news_events.21.t:0 "[Get_newspaper_header] Argentine Antarctic Operation Draws Congratulations"
 antarctica_news_events.21.desc:0 "After news of the Antarctic expedition reached Buenos Aires, Argentina held grand celebrations across the nation today. The adventurous officer Jorge Edgar Leal has returned from Operation 90 South, completing his daring journey to the Pole, though far fewer returned than had set out. The major powers, though their attitudes varied - some lukewarm, some ecstatic - all extended their congratulations. Colonel Leal's feat has allowed Argentina to successfully build its own legitimacy in this bitterly contested frontier.\n\nThough many rumors circulate about the lost members, the Argentine government has established memorials and monuments for all survivors and dead of Operation 90 South. Colonel Leal says he will publish his memoirs, inspired by the accounts of Antarctic life written by Richard Evelyn Byrd."
 antarctica_news_events.21.a:0 "Mother Nature has nowhere left to hide."
 antarctica_news_events.12.t.a:0 "[Get_newspaper_header] Canada Transfers South Georgia to OFA Directorate"
 antarctica_news_events.12.t.b:0 "[Get_newspaper_header] Britain Transfers South Georgia to OFA Directorate"
 antarctica_news_events.12.desc.a:0 "This morning, the Canadian Foreign Minister announced the transfer of South Georgia and the South Sandwich Islands to the OFA Antarctica Directorate. Though these islands have no permanent population, they hold important strategic positions in the Antarctic rivalry. Bringing them under OFA jurisdiction will greatly strengthen the alliance's naval power projection in the region.\n\nBeyond this, the Foreign Minister announced that Canada will take a more active role in Antarctic affairs, including contributing to the Antarctic defense budget. Though the transferred islands never had a large population, they were once a major whaling station before the large-scale militarization of Antarctica. If one day civilian ships can travel safely to and from Antarctica, the whaling station may return."
 antarctica_news_events.12.desc.b:0 "This morning, the British Foreign Secretary announced the transfer of South Georgia and the South Sandwich Islands to the OFA Antarctica Directorate. Though these islands have no permanent population, they hold important strategic positions in the Antarctic rivalry. Bringing them under OFA jurisdiction will greatly strengthen the alliance's naval power projection in the region.\n\nBeyond this, the Foreign Secretary announced that Britain will take a more active role in Antarctic affairs, including contributing to the Antarctic defense budget. Though the transferred islands never had a large population, they were once a major whaling station before the large-scale militarization of Antarctica. If one day civilian ships can travel safely to and from Antarctica, the whaling station may return."
 BRA_antarctica.1.t: "Frozen Destiny"
 BRA_antarctica.1.d: "\"In short, we will encounter no meaningful resistance.\"\n\nAdmiral Rademaker and a group of immaculately uniformed officers gathered around a huge map of the frozen continent. Their faces were as bright as the overhead lights. Rademaker stroked his chin: \"Can we trust the Americans?\"\n\n\"They conducted extensive reconnaissance before reaching this conclusion, sir.\" The junior officer gestured at the map. \"The Americans are convinced that Germany has abandoned all land between these longitudes, right up to the Argentine border.\"\n\n\"So it will be a swift operation.\"\n\nRademaker stepped back from the group and walked to the window of the Minas Gerais' command deck. The Brazilian navy's proud flagship lay beneath his feet, a steel leviathan in all its glory. Modern aircraft lined the deck like falcons riding the waves. Hundreds of crew kept the great ship alive, slicing through the broad South Atlantic on the admiral's orders.\n\nRademaker reflected that it must be fate: Germany was in turmoil at this very moment, and he would lead this endless fleet to win Brazil its next great victory, sweeping south to earn renown in Antarctic territory. The insult Germany had dealt Brazil in the Lobster War would be repaid; Argentina would also be driven to the wall.\n\nAnd best of all, it would cost Brazil nothing to add another triumph, and him another medal. Rademaker smiled faintly and turned to the officers: \"Gentlemen, let us do our duty.\""
 BRA_antarctica.1.a: "Futile resistance."
 BRA_antarctica.2.t: "Southern Front"
 BRA_antarctica.2.d: "Admiral Rademaker led the first wave of marines into Ritscher Station. The soldiers held their rifles, bullets chambered, aimed at the blackened buildings in the white wasteland.\n\nThe only structure still standing was the hospital, but even it had only four bare walls and a rotted roof. The marines prodded rows of corpses on beds with their rifles, finding limbs frozen stiff, unnatural purple-blue skin hanging loosely from bone like tattered bedsheets. The thought that their own comrades had left them here to die sent a sudden chill down Rademaker's spine.\n\n\"Lucky us,\" one marine said with a laugh. \"There's not a living German here.\"\n\nBut casualties came anyway: two marines were blown up by a minefield around the abandoned radio station; another, barely old enough to be called a soldier, was blown apart by a tripwire. American intelligence had been half right: though the Germans had abandoned the only major outpost, they had not left it undefended - they had left \"gifts,\" intent on taking as many Brazilian lives as possible.\n\nRademaker walked through the ash-blackened snow, inspecting the charred alleys. He had not expected the Germans to simply burn the base to the ground; this was no temporary withdrawal but near-total destruction. The situation in New Swabia must have been far worse than intelligence reports suggested. The admiral watched his men throw frozen German corpses onto the pile outside the hospital, then carry their own wounded onto the beds. But they had nothing to shield them from the cold except the bedsheets left by the dead.\n\nThe marines huddled together for warmth; the polar wind whispered in Rademaker's ears. With no proper shelter, how were they to survive for weeks? How long until the next supplies arrived? The admiral's mind was as blank as the ice plain stretching for miles around, hollow and cold. Though the Germans had long since fled, they still faced another enemy, one more terrible and deadly than any soldier..."
 BRA_antarctica.2.a: "The real fight has only just begun."
 BRA_antarctica.3.t: "Striking First"
 BRA_antarctica.3.d: "Admiral Rademaker paced his cabin, feeling the slight vibration of the waves against the carrier. The operation seemed a mistake; Brazil had been lucky to encounter little enemy resistance in occupying the place, but in Antarctica, nature and logistics were the greatest enemies.\n\nThere were not enough shelters to stave off the cold, nor enough supplies being transported. The Americans had offered to help, but Rademaker felt that once bitten, twice shy. If he accepted, the Antarctic forces would become more dependent on the Americans, who would want a guarantee: if the Germans returned, Brazil would open a second front on New Swabia's flank. But given the sorry state of the marines on shore, the admiral doubted how long they could hold on. Short on supplies and morale, the soldiers could barely eke out an existence in the Antarctic cold, and winter was coming soon. No, he needed a backup plan. Retreat home was impossible, but perhaps there were other options.\n\nHe sat back at his command desk and pored over the Antarctic map. To the east lay the vast expanse of German New Swabia; Brazilian territory was negligible by comparison. But to the west were easier prey. Argentina's territory was well-equipped but thinly defended; its commander, obsessed with grudges against Chile and fanciful expeditions, could not hold out long against a Brazilian offensive. Rademaker smiled. Leal struck him as laughably naive: he actually believed that leading an expedition to the Pole would make the world respect Argentina's borders. When push came to shove, reputation and glory would not protect their claims.\n\nA plan was forming in the admiral's mind. Not merely an escape, but a conquering escape, one that would preserve the prestige of both the fatherland and his own cause when the worst came. For now, Rademaker would continue to hold his position..."
 BRA_antarctica.3.a: "But who knows what the future will bring."
 antarctica_news_events.22.t: "[Get_newspaper_header] Military Overthrows Chilean Antarctic Institute"
 antarctica_news_events.22.d: "Today, the discordant, jarring notes of the Chilean national anthem rang out over the Antarctic continent. Navy Captain José Toribio Merino declared to the fatherland and its Argentine arch-enemy that the Chilean Antarctic Territory had come under his control. Merino claimed he had thwarted an \"Argentine-Bolshevik conspiracy\" within the previous territorial administration and arrested Professor Guzmán and his aides. Their whereabouts are currently unknown.\n\nThe Chilean armed forces have pushed Antarctica into a new phase of confrontation, abandoning the diplomatic process the Chilean Antarctic Institute had pursued through the Organization of American States, and vowing to avenge the defeat at Snipe Island at any cost. Merino and his marines are the weak party on the Antarctic continent, and their campaign to reclaim lost territory is fated to be a road of frozen blood."
 antarctica_news_events.22.a: "Revenge is a dish best served cold."
 antarctica_news_events.23.t: "[Get_newspaper_header] Chilean Antarctic Military Coup Fails"
 antarctica_news_events.23.d: "A bizarre report came today from Arturo Prat Station in the Chilean Antarctic Territory. Inside the base, rebellious marines had been defeated in their standoff with civilian officials and the civilian population, and the mutinous leader, Navy Captain José Toribio Merino, was captured. According to reports, the officer and his loyalists had attempted to overthrow the territorial administration and provoke a war with Argentina to avenge the humiliation of Snipe Island.\n\nFor now, Professor Guzmán and the Chilean Antarctic Institute are pinning their hopes on diplomacy to turn around Chile's desperate position in Antarctica, launching a lightning diplomatic offensive across the Americas to win support in the OAS to counterbalance Argentina. With the internal threat eliminated, Guzmán seems set to remain firmly committed to a peaceful solution to the Antarctic question."
 antarctica_news_events.23.a: "Blessed are the peacemakers..."
 antarctica_news_events.23.b: "They must have been in that corner too long and lost their minds, right?"

 antarctica_alert_event.10.t: "Special Operation Available!"
 antarctica_alert_event.10.desc: "We have been carefully gathering intelligence on the Argentine Antarctica Territory. After immense effort, the intelligence is sufficient to support a special operation against their main base in Antarctica. Whether sabotaging military facilities, reducing their legitimacy, or destroying supplies, this mission can deliver a fatal blow to one of their core capabilities. Such an operation will require diverting some intelligence assets, but may give our faction a major strategic advantage over the Argentine Antarctica Territory."
 antarctica_alert_event.10.a: "Briefing immediately!"

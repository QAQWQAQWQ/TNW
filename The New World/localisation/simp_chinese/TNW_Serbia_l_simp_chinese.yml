 SER_King_Andrei_I: "安德鲁一世"
 POLITICS_KING_ANDREI_I_DESC: "§H赖上帝之恩佑与人民之意志，塞尔维亚国王-安德鲁一世。§!\n§W--------------§!\n安德鲁·卡拉乔尔杰维奇，彼得一世之孙，南斯拉夫王国君主亚历山大一世·卡拉乔尔杰维奇与罗马尼亚公主玛丽亚·卡拉乔尔杰维奇的第三子。遵父命，王子生于布莱德，受洗时取斯洛文尼亚之名。“安德鲁”亦为塞尔维亚之名，在塞尔维亚东正教圣年中占有一席之地，于基督教传统与文化中意义深远——因它是耶稣基督首位使徒之名。故此，众人视此王子以圣人之名受洗，而这位圣人，正是卡拉乔尔杰维奇家族庆洗礼所敬奉者。\n\n国王陛下毕业于剑桥大学克莱尔学院数学系，继彼得二世之位，为其兄抵抗德国之举多次致歉。陛下性情温和，在这片塞尔维亚土地上，他对万事万物皆无炽热之情。他如同一块沉重的石头，就在那里，一块沉默的太阳石。在他身上，什么也不曾发生，正如一块太阳石那般。至于塞尔维亚，他只愿这个国度如他一般，承袭他的品格。只是塞尔维亚终将驶向何方，至今仍是个谜题。"

 SER_the_vanguard: "先驱"
 SER_the_vanguard_desc: "§H“你这孩子，将要称为至高者的先知……要走在主前面，预备他的道路。”（1:76）§!\n\n先驱利约蒂奇以行动与信念，向世人与塞尔维亚子民昭示：他首先是东正教徒，其次才是革命者；他是爱国者，是真正的塞尔维亚人。他与内阁迎回国王，重建东正之国。在南斯拉夫的土地上，塞尔维亚人依然骄傲屹立。主爱世人，先驱者作为祂的意念投射于这片土地，他缔造了教权法西斯，创立了国家革命联盟，塑造了塞尔维亚。这一切，无可置疑。他缔造了这个国家，是此国家的国父，是万千子民的父亲。如今，塞尔维亚的子民们，请瞻仰他吧，挥动你们的双手，张开你们的嘴与眼，注视着他。\n\n因为他是一位真正的基督徒，一位先驱。"

 SER_the_realm_of_orthodoxy: "正教之国"
 SER_the_realm_of_orthodoxy_desc: "§H“塞尔博人……来到皇帝这里，受洗于皇帝，并接受皇帝所派的教师回到其地。”—《帝国治理书》§!\n\n你曾是通往永生的引路人，首席主教与导师。因你已抵达彼岸，哦，神圣的萨瓦，便启迪了你的故土，以圣灵使之重生。如同在属灵的花园中栽下一株橄榄树，你培育了你最神圣的儿女……所以我打发你去开他们的眼睛，使他们从黑暗转向光明，从撒旦的权下归向上帝；使他们因信我而得蒙赦罪，并在一切成圣的人中同得基业。\n\n你们要去使万民作我的门徒，奉父、子、圣灵的名给他们施洗；凡我所吩咐你们的，都教导他们遵守。"

 SER_the_nations_economic_state_catalyzed_stagnation: "国家经济状态 — §e僵化停滞§!"
 SER_the_nations_economic_state_catalyzed_stagnation_desc: "§H“你们存心不可贪爱钱财，要以现有的为足……”《希伯来书13:5》§!\n\n万民被分开，如同牧人分别绵羊与山羊，我饿了，你们给我吃；我渴了，你们给我喝……这些事你们既做在我这弟兄中最小的一个身上，就是做在我身上了。若是弟兄或姐妹赤身露体，又缺了日用的饮食，你们却对他们说：“平平安安地去吧，愿你们穿得暖、吃得饱”，却不给他们身体所需用的，这有什么益处呢？\n\n怜悯贫穷的，就是借给耶和华；他的善行，耶和华必偿还。\n\n所以，不要留意荒渺的言语和无穷的家谱；这等事只生辩论，并不能发明神在经纶中的安排。"
 
 SER_the_national_military_turmoil_unchecked: "国家军队 — §r紊乱§!"
 SER_the_national_military_turmoil_unchecked_desc: "§H“百夫长进前来，哀求耶稣说：‘主啊，我的仆人害瘫痪病，躺在家里甚是痛苦。’耶稣说：‘我去医治他。’百夫长回答说：‘主啊，你到我舍下，我不配你去……我也在人的权柄之下，也有兵在我以下……’耶稣听见就稀奇，对跟从的人说：‘我实在告诉你们，这么大的信心，就是在以色列中，我也没有遇见过。’”§!\n\n要穿戴神所赐的全副军装，用真理当作带子束腰，用公义当作护心镜遮胸……拿着信德的藤牌……戴上救恩的头盔……拿着圣灵的宝剑。\n\n你要和我同受苦难，好像基督耶稣的精兵。凡在军中当兵的，不将世务缠身，好叫那招他当兵的喜悦。"
 SER_Radova_Karadzic: "拉多万·卡拉季奇"
 POLITICS_RADOVA_KARADZIC_DESC: "卡拉季奇于1945年6月19日生于沙夫尼克附近的佩特尼察。其父武科，工匠出身，操鞋匠与裁缝之业，兼擅古斯勒琴、双管齐奏与迪普勒琴。卡拉季奇家族本自科索沃与梅托希亚迁出，辗转居于利耶瓦里耶卡、巴尼亚尼及杜米托尔一带。他在尼克希奇完成小学学业，十五岁赴萨拉热窝，入医学院修习，后转入萨拉热窝医学院深造。\n\n波斯尼亚民族主义日盛，救国政府稳定之后，卡拉季奇随父迁往贝尔格莱德，自此定居。1990年，他踏入政坛，因侨民中声望卓著，在塞人联中迅速占据一席之地，与舍舍利分庭抗礼。\n\n他是一名虔诚的东正教徒，被视作极具耐心、冷静、温和且谈判技艺高超之人，恰如其人于塞尔维亚人民而言。"

 POLITICS_GUAN_WONUAN_DESC:0 "£GFX_kmt_party §i中国国民党党籍§!\n\n关沃暖，生于广东开平，一九四四年举家迁港，幼承港澳风雨，少经殖民学堂，后负笈大洋彼岸，于美利坚经商立业。既而投身侨社，入中国国民党，终胜选，成为香港特别市市长。\n\n以此资历，他在海外侨胞中声望颇著。商海沉浮的经历，亦让他对经济实务驾轻就熟。然而，当其身居香港特别市市长之位，荣光之下，重压随之。这座城市位处冲要，经济命脉牵动四方，市长一职绝非美差，上有中枢目光如炬，下有洋行财阀掣肘，暗流深处，更是中日两股势力角力不休。\n\n每日公门行事，无异于履钢丝、走悬索。时局翻涌如潮，他在这夹缝中勉力周旋，恰似艺人弄丸，竭力维持着两碗水的平衡，进退维谷，身不由己。任凭政局几度更迭，时代洪流呼啸而过，只见荆花零落，篱菊依旧年年盛放；西风虽暂衰，东风仍岁岁重临。"
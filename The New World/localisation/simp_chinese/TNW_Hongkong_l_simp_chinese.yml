 HKC_qlws:0 "群龙无首"
 HKC_Liang_fuhua:0 "梁富华"
 POLITICS_GUAN_WONUAN_DESC:0 "£GFX_kmt_party §i中国国民党党籍§!\n\n关沃暖，生于广东开平，一九四四年举家迁港，幼承港澳风雨，少经殖民学堂，后负笈大洋彼岸，于美利坚经商立业。既而投身侨社，入中国国民党，终胜选，成为香港特别市市长。\n\n以此资历，他在海外侨胞中声望颇著。商海沉浮的经历，亦让他对经济实务驾轻就熟。然而，当其身居香港特别市市长之位，荣光之下，重压随之。这座城市位处冲要，经济命脉牵动四方，市长一职绝非美差，上有中枢目光如炬，下有洋行财阀掣肘，暗流深处，更是中日两股势力角力不休。\n\n每日公门行事，无异于履钢丝、走悬索。时局翻涌如潮，他在这夹缝中勉力周旋，恰似艺人弄丸，竭力维持着两碗水的平衡，进退维谷，身不由己。任凭政局几度更迭，时代洪流呼啸而过，只见荆花零落，篱菊依旧年年盛放；西风虽暂衰，东风仍岁岁重临。"
 HKC_Golden_Light_Shining:0 "金光普照"
 HKC_Golden_Light_Shining_desc:0 "香港特别市的乱象，已无需赘言。彼时枭雄遍地，黑籍横行。帮会堂口盘根错节；诸众亦各据一方，割地自雄，择肥而噬。此辈更与密探、通译勾连，商贾小贩，无不备受勒索，或纳保护之资，或被劫掠一空。烟馆赌场，番摊牌九，骰宝喧嚣，公然开赌，无法无天。\n\n九龙其乱甚于港岛。盖因宪兵重兵驻守中区，此地乃前港府机关、金融中枢，富户殷商云集，故常以宪查小队巡逻震慑。加之巨商大贾纷纷设铁木闸门以固守，横街窄巷亦设卡防备，更出赀雇佣黑道“看更”，以此维系一方苟安。有此层层设防，港岛之纷乱，较之九龙，尚略胜一筹。"
 HKC_Rights_and_Wrongs:0 "是是非非"
 HKC_Rights_and_Wrongs_desc:0 "南溟之畔，香港一跃而起，诚为二十世纪东亚之璀璨明珠。大战既息，东瀛商贾挟巨资以入，本土及海外行商亦竞逐香江，万商云集，盛况空前。\n\n百业兴旺，四方辐辏，移民如潮涌至，斯土遂成脱胎换骨之变。港人笃信，世事浮沉，朝夕轮转，只要金风未歇，香江儿女便可永享此繁华盛景，岁岁年年。\n\n然则浮华之下，实败絮之。香江经济日见疲敝，金融脉络渐趋收缩。加以粤地诸港次第重开，分流吞吐，香港咽喉之势，早已非复昔时独占。所幸背倚三国财阀，余资尚厚，故繁华表象，犹可勉力支撑，强弩末势耳。岂知大厦之将倾，非一木所能支乎？"
 HKC_Strange_Future:0 "陌生的未来"
 HKC_Strange_Future_desc:0 "盛世飙轮之下，香江犹滞原地。旧日枢纽之位，今已风光不再；落差既巨，人心愈难自照，遂陷迷障。值此鼎新之际，世代更迭，港人青春如劳燕纷飞，似黄莺一去，杳无踪迹，徒留满城唏嘘。\n\n值此鼎革之际，港人立于时代夹缝，神色仓皇，莫辨西东。前路漫漫，既无明灯指引，亦无智者指津。\n\n纵有万家广厦叠如梯田，遮天蔽日，港人目光所及，唯脚下寸土而已。至于香江命脉所系，未来何往，则如坠五里雾中，无人能答，亦无人敢答。"


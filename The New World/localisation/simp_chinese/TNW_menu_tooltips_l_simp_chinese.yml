 TNO_ugly_american_icon_tt: "§M美丽未来§!"
 TNO_ugly_american_icon_tt_delayed: "§*我失去力量和生命，也失去朋友和欢乐。\n甚至失去那种使我以天才自负的豪气。\n当我认识真理之时，我相信她是个朋友\n而在理解领会之后，我已对她感到厌腻。\n可是她却永远长存。\n对她不加理会的人，在世间就完全愚昧。\n上帝垂询，必须禀告。\n我留有的惟一至宝，乃是有时流过眼泪。\n—阿尔弗雷德·德·缪塞《忧愁》§!\n\n§u1947年的柏林§!，至少它此时此刻仍旧叫着这个名字，体育场坐满了党员、工人、记者和老板，会场鸦雀无声。阿道夫通过电话口述、由弗里德里希·霍斯巴赫记录了宣读致全国大会的演讲，正式宣告了战争的胜利。这个时刻是如此不真实，所有人都倒吸一口气，随即掌声雷动，仿佛要将会场里的空气抽尽。没有救星降临，没有变革希望，更没有没有来自高处的洪亮话音，只有§e阿道夫·希特勒§!，只有静默。\n\n“值此值得纪念的一天，我想对全国人民说一句话。”阿道夫·希特勒展开又一张纸，仔细端详着内容，说道，“我将辞去元首的职务，由§j赫尔曼·戈林元帅§!接任。”\n\n掌声雷动、响亮而又急促，渐渐化作雷鸣般的喝彩。纳粹党延续十五年之久的梦想到此圆满结束，他们的英雄将要退位，去支持一个病痛缠身的战争英雄与元帅。他们曾预料一场洪水，§A直到滔天巨浪当真扑面而来§!。\n\n1968年，日耳曼尼亚，鲍曼元首正在他的办公室中抽着雪茄，在这个空闲之余，他开始放空自己的思绪，享受着这片刻的宁静，如此疲态，也许有人会问他：“你还好吗，马丁？”而元首会如是回答：“我只是在休息。”或是一句别的什么虚假的搪塞。迫在眉睫的经济危机、欧洲、亚洲与美洲正不断酝酿着的世界冲突，无不沉甸甸地压在他的心头。胜利已然来临，而他却只看到了迷雾，在狂喜之后，他永远无法从这种恶性循环中解脱。\n\n§&2002年，日耳曼尼亚秩序井然§!，德国、日本会有新的领导层，美洲、亚洲、非洲和欧洲都会有新的敌人，这场竞赛并不只是保住自己一亩三分地，更是为了赶走对方，为了以自己图景重塑世界。§G胜者都有义务给这些问题掌舵，在这个不断演进的新秩序中生存下去，变得比以往任何时候都更强大。§!"


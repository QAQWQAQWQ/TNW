 TNW_Flavor_Events.1.t: "越洋的试探"
 TNW_Flavor_Events.1.desc: "对来自伊利诺伊州的贝拉克·奥巴马来说，受邀访德绝对不是什么好差事。\n\n若不是上一位参议员在公开场合的愚蠢失言，这个堪称“政治自杀”的名额无论如何也轮不到他。对奥巴马和他的团队来说，踏入德国领土无异于羊入虎口。尤其是目的地——慕尼黑，德国人究竟会如何拿他的肤色大做文章、公开羞辱美国，他连想都不敢想。\n\n但这也是他政治生涯中最致命的一次豪赌。贝拉克顶着巨大的压力坐在机舱里，心里很清楚：如果这次访问圆满成功，下一次总统选举，他将轻而易举地拿下党内候选人提名；可要是出半点纰漏，别说提名了，党内的保守派绝对会擦亮皮鞋，毫不犹豫地把他一脚踢出门外。他的仕途，也将就此彻底完蛋。\n\n就在贝拉克被这些可怕的设想压得喘不过气时，他的顾问约翰坐到了对面。\n\n“嘿，贝拉克，听着，我们现在已经进入德国领空了，位置在萨克森上空。估计不出几个小时，我们就到目的地了。”顾问的声音里透着一丝紧绷。\n\n“哦，那太好了。我觉得……没什么大不了的，”贝拉克咽了口唾沫，故作轻松地回答，“我们也和德国人接触过，不是吗？在……那些文化交流晚会上。”\n\n“不，贝拉克，你到底在想什么？”约翰皱起眉头，身子往前探了探，“你真觉得，你在美国见到的那些德国人……就是真正的德国人吗？我敢打赌，那些不知道是联邦调查局从哪个穷乡僻壤找来的几代移民。听我说，华盛顿刚刚传来消息，他们交代得很死：非必要，绝对不要和当地官员私下交流，一切按流程走，明白吗？”\n\n“为什么……我们……”贝拉克有些发愣。\n\n“别问为什么，贝拉克。”约翰打断了他，深吸了一口气，“我说句不该说的，在他们眼里，你就是最该被处决的‘劣等人’。别以为你顶着‘美利坚合众国参议员’的头衔，他们就会高看你一眼。我这么说，纯粹是为了保住你的命。”\n\n“我知道了，约翰。”贝拉克声音低沉。\n\n约翰拍了拍他的肩膀，站起身走开了。\n\n没过多久，飞机开始下降。贝拉克转头盯着窗外。两架德国战斗机正紧紧贴着他们伴飞，机尾上的万字图标刺眼得很。他看不见那些飞行员的脸，因为对方的机舱盖是纯黑的，死死地遮挡着。\n\n贝拉克回想起约翰的话。如果那两个德国飞行员此刻能看到他，或许也会像他一样，死死地盯着对方。但不同的是，自己眼里可能满是忐忑，而那层黑色机舱盖背后的眼神，估计只有看动物一样的冷漠无情。\n好在，这种令人窒息的脑内交锋没有持续太久，飞机最终平稳地降落在了机场跑道上。\n\n轮胎触地的震动让贝拉克从刚才的恍惚中缓过神来。他深吸了一口气，整理了一下西装领带，转过头看着机舱里忐忑的幕僚们，挤出一个标准的政客微笑："
 TNW_Flavor_Events.1.a: "都打起精神来，各位。我们走吧"
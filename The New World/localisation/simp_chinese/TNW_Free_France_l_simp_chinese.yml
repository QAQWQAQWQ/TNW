 FFR_Definition:0"定义......？"
 FFR_Blossoms_and_Rum:0"鲜花和朗姆酒"
 FFR_Memories_of_a_Grey_Era:0"灰色时代的记忆"

 FFR_Definition_desc:0"如何界定法国海外省的地位？是流亡政府，地区政权，抑或是法国的正统？时光倒回六十载，他们曾自视为法兰西正统的延续；四十年前，其自称悄然转为“地区政府”；而时至今日，他们已坦然承认自己作为法兰西国家的一部分，成为法兰西国的海外省与特殊行政区\n\n显而易见，戴高乐的时代与军政府岁月早已落幕。然而民主化之后，定义权却从未真正掌握在海外省的民众手中。他们只需在每一场选举中，将选票投给一个又一个高谈阔论的候选人，便算完成了属于自己的民主\n\n至于最终由谁来定义，无非取决于谁的票仓更深、谁的声势更盛罢了"
 FFR_Blossoms_and_Rum_desc:0"美国对海外省的所谓“支援”从来不是无偿的馈赠。尽管五十年代末华盛顿已与巴黎恢复关系正常化，却仍在暗中支持戴高乐政权，他们赌的是法兰西将从内部崩解，届时自可趁乱分得一杯羹。然而这场算计最终落空，法国没有倒下，海外省的战略价值也随之黯淡\n\n四十年代末至五十年代初昙花一现的经济腾飞，就这样骤然终结。经济停滞催生社会矛盾，军政府在六十年代初的瓦解并未带来转机。左翼政府执政数十载，海外省的经济依然沉寂\n\n面对这般光景，民众还能做什么？在这座被称作“鲜花之岛”的土地上，他们握着选票，却一无所有。鲜花年年盛开，朗姆酒依然流淌，除此之外，他们手中空无一物。"
 FFR_Memories_of_a_Grey_Era_desc:0"军政府时代，是海外省老一辈人记忆里最晦暗的章节。集会受限，言论收紧，而戴高乐将军的形象被精心塑造成圣像，被尊为全体国民的“父亲”。军政府刻意将意识形态模糊化，以利其统治，政府要职皆由戴高乐的亲信与军人把持，异己者遭受着无声而普遍的排斥与压制\n\n矛盾在沉寂中不断堆积，社会经济的长久停滞最终点燃了引信。革命的浪潮袭来，军政府轰然垮台，左翼联盟随之执政。那座曾经高耸的圣像，也就此崩解。\n\n他的雕像被推倒，宣言被撕毁，从军政府竭力塑造的“国家大家长”，还原回一个专断独行的老人。然而无可否认，这种长久的家长制威权统治，已在海外省的政治肌体与集体记忆中，刻下了难以磨灭的烙印\n\n它始终是那片土地上最为灰暗、却也至为沉重的遗产之一。"

 


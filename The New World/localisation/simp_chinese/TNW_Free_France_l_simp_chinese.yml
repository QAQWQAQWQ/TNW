 FFR_Michele_Alliot_Marie:0"米谢勒·阿利奥-玛丽"
 POLITICS_MICHELE_ALLIOT_MARIE_DESC:0"当米谢勒·阿利奥-玛丽跟随母亲流亡至这座鲜花之岛时，年幼的她与母亲都未曾料到，此后数十载乃至一生，都将在此地度过。自她有记忆起，母亲的叹息便萦绕在侧。那时的她尚不能理解母亲的叹息，直到少年时代，她也同岛上数万青年一样，坠入了身份认同的迷惘之海。直到那时，她才真正懂得母亲为何叹息\n\n此后，她投身政治，在保卫共和同盟瓦解后的残局中重建新党，汇集戴高乐主义者与保守派的力量，最终赢得大选。权力与岁月或许是最温柔的遗忘剂，如今的米谢勒·阿利奥-玛丽已改变太多，多到连她自己都感到几分陌生。"
 

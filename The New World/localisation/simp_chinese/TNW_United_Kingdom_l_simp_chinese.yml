 ENG_Lee_Anderson_hog_desc:0 "§Y内政大臣\n右翼民粹主义§!\n--------------\n李·安德森出生于诺丁汉，早年曾是亚瑟·斯卡吉尔领导的全国矿工工会一员，年轻时也公开声援过迈克尔·富特。他自称早期的政治信念深受斯卡吉尔、丹尼斯·斯金纳与托尼·本的影响\n\n他曾长期隶属于工党，却在工党加剧左转、倒向“瑞典派”之际选择脱离，转而投入保守党阵营。也正是在这一过程中，他的民粹倾向显露无遗，善于操弄社会议题，紧抓民众关心的痛点大做文章。与此同时，其鲜明的反犹太倾向更令马尔科姆·里夫金德深感厌恶。然而这一切似乎并不困扰安德森本人，于他而言，抓住一切机会向上攀升才是真理，手段与过程皆可退居其次\n\n这样的作风使他在党内人缘平平。不过，或许正如他曾面对媒体时直言不讳的那样：“我会把他们送到皇家海军的护卫舰，或者其他什么船上，然后开到加莱外海对峙。这样一来，他们就不会再来了。"

 ENG_John_Major_for_desc:0 "§Y外交大臣\n中间派进步主义§!\n--------------\n约翰·梅杰生于1943年3月29日，萨里郡圣赫利尔是他生命开始的地方。次年，德国V-1飞弹袭击该地，造成多人死亡，战争的阴影从此刻进他童年的背景。此后数年，梅杰一家移居诺福克郡的萨哈姆托尼村。1948年，他进入切姆公立小学就读。他的童年整体是明亮的 ，他热爱阅读、着迷运动，尤其是板球和足球，也曾养过心爱的兔子，在田野与书页间度过了一段平静的时光\n\n1959年，梅杰加入了布里克斯顿的青年保守党，很快成为其中活跃的一员。这段经历帮助他走出了学业受挫的低谷，重拾信心。在同为保守党人的德里克·斯通的鼓励下，他走上布里克斯顿市场的街头，站在木箱上发表演讲，政治生命在叫卖与议论声中悄然萌芽\n\n他始终是保守党内充满活力的成员，尤其积极投身于欧洲经济一体化的讨论。他曾会见密特朗，并对英法经济竞赛的终结表示欣慰，视之为两国友谊的见证。尽管身居外交大臣之位，他却未曾完全获得首相的信任——后者更倾向于听取身边顾问的意见，而非梅杰的独立判断。这使他逐渐在权力核心中失却光彩\n\n如今的梅杰，怀抱着两个清晰的愿望：一是将英国重新引回欧洲经济一体化的道路，二是确保1946年的悲剧不再重演。"

 ENG_Catherine_Blaiklock_eco_desc:0 "§Y财政大臣\n民族保守主义§!\n--------------\n凯瑟琳·布莱克洛克从不循规蹈矩。作为极地探险家肯·布莱克洛克的女儿，她继承了父亲身上那份勇于挑战的心\n\n1981年，她凭借奖学金进入牛津大学基督教会学院，此后广泛涉足企业界，并于1989年加入保守党。她是个典型的保守派，尽管党内对她的评价褒贬不一，她仍坚持己见，甚至常因此招致亲左翼媒体的批评，至于外界的喧嚣，她似乎从未真正放在心上。\n\n1999年，在法拉奇的举荐下，她出任财政部长。布莱克洛克在殖民地问题上从不妥协，对宗教事务亦持强硬立场，正是这种毫不摇摆的姿态，使她在一片温和声中脱颖而出，迅速赢得民族保守主义者的青睐。"

 ENG_Malcolm_Rifkind_sec_desc:0 "§Y国防大臣\n自由市场保守主义§!\n--------------\n马尔科姆·里夫金德出生于1946年爱丁堡的一个英国犹太家庭，先后就读于乔治·沃森学院与爱丁堡大学，先修法律，后又攻读政治学研究生学位。尽管英国关于犹太人的法令已历经三次修订，他仍亲身体会到身为犹太人在这个社会中所遭遇的诸多无形壁垒\n\n尽管出身犹太背景，里夫金德却深深认同欧洲一体化的理想，并多次公开发表言论，推动英国更深入地融入欧洲共同经济体系。在殖民地问题上，他立场相对宽松温和，支持逐步赋予殖民地自主权，经济政策上也更倾向于自由市场\n\n这些立场使他在保守党内并不受多数人欢迎。然而，作为约翰·梅杰的密友与盟友，他仍拥有屹立不倒的政治资本——他信任梅杰，梅杰也信任他。与此相应的是，他在外交与国防事务上表现出不同寻常的强硬姿态\n\n而对于德国政府而言，一位犹太人出任英国国防大臣的消息则令人颇感不适。德方曾向英国政府委婉表达过遗憾，两国政府间的暗流，正在不安中悄然加深。"
 


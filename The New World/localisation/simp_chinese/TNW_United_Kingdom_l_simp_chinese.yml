 ENG_The_Land_of_Nowhere:0 "乌有乡"

 ENG_Galloping_Across_the_Eternal_Land_desc:0 "英国自诩为日不落之国，旧世界的守护者，始终笼罩在旧秩序遗留的浮华雍容之中。无数英国人曾为此前仆后继，共同维系那个伟大的帝国之梦。无论这信念是否确当，它始终指引着英国人民向前走去，成为这个国家的立身之本。\n\n然而，随着大德意志的凯歌步步逼近，昔日的帝国骤然坠入漫漫长夜。黑暗并未随时间彻底消散，曙光之后，英国人依然看不清前路。纳粹与法西斯的阴影再度蔓延，共和思想的灰烬亦悄然复燃，整个民族被炽热的民族主义浪潮裹挟，踉跄步入新的千年。\n\n没有人过问他们是否已经疲倦——这并不重要。对英国人民与乔治七世而言，这仍是平淡如常的一年。人们照旧上班、下班，国王依旧驾车于庄园之中。只是车上那个身影，正带着不列颠驶向未明的命运。"

 ENG_The_Land_of_Nowhere_desc:0 "战后，随着德国有意识地拆解旧有政治势力，英国陷入了无可避免的党同伐异之中。无数小党在政治的残局中诞生，又在一片狼藉里悄然而逝。工党也在此浪潮中逐渐沉寂，整个四五十年代至七十年代，英国的政治图景被右翼势力反复撕裂与重组。\n\n然而，随着瑞典社会民主主义，时人称之为“瑞典派”的成功实践，基金社会主义的思潮如暗流般渗入英伦，引导着工党缓慢转向。历经民粹浪潮裹挟的英国人民，仿佛在迷雾中望见一处乌有乡，他们开始渴望在死亡的现实与虚幻的梦境之间，选择一条哪怕看不清方向的道路。\n\n或许，英国人从来就没有真正的选择。右翼政府与保守党带给他们的，始终是两个英国：一个是唐宁街的英国，一个是街头巷尾的英国。若非要说出这两者之间还有什么联系，那大概便是，他们都住在伦敦，也都需要带一把伞。"

 ENG_The_English_Patient_desc:0 "成长于战后英国的新一代，已很难想象那个曾横跨世界的庞大帝国是否真实存在。他们只能透过父辈闪回的记忆碎片去拼凑它，在政客慷慨激昂的口号间捕捉它，在无数集会与演说所重复的叙事里想象它。甜美的追忆与刻骨的现实不断碰撞，断裂的叙事撕扯着他们对国家的认知，他们不禁困惑，脚下这片土地，是否真如众人所说，曾那般伟大而光荣。\n\n没有答案的问题被暂时搁置，然后默默交到下一辈人手中。而新的一代，仍将活在相似的口号与集会之间，继续背负着同样的惘然。"


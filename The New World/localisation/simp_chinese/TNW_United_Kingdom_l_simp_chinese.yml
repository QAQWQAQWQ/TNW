 ENG_the_crownless_realm_desc:0 "\n\n\n\n£GFX_ENG_the_crownless_realm\n\n\n\n\n\n爱德华八世离世的那个夏天，旧秩序随他一同入土。紧随其后的公投毫无悬念——当反对党只存在于监狱名单，自由媒体只剩下地下传单时，结果便不再是选择，而是宣判。圣爱德华王冠被安静地卸下，锁进了博物馆的防弹玻璃柜。从那天起，“共和国”这三个字像野草一样疯长，爬满了文件抬头，盖住了墙上的裂缝，甚至塞进了孩子们的书包。关于公正的讨论早已烟消云散。\n\n因为在权力的天平上，每个人都很明白，重要的从来不是过程，而是万无一失且完美的结果。"

 ENG_dictum_of_the_protector_desc:0 "\n\n\n\n£GFX_ENG_dictum_of_the_protector\n\n\n\n\n\n在不列颠民族共和国的叙事里，克伦威尔不是一个历史人物，而是一种国家精神。他代表纪律、克制、对散漫议会的蔑视，以及对国家责任的绝对服从，政权迫切需要一个比那个动荡年代更久远、更纯粹的精神锚点。克伦威尔是不二之选：他是秩序的化身，是本土的永远的守护者。\n\n最重要的是，对于这些自称继承人的那些政治家，资本家，野心家，独裁者而言，坟墓里的克伦威尔是最安全的盟友——因为他永远无法跳出来否认这一切。"

 ENG_orderly_dissent_desc:0 "\n\n\n\n£GFX_ENG_orderly_dissent\n\n\n\n\n\n不列颠民族共和国有四个合法政党。它们在议会里辩论预算，在报纸上发表不同意见，在选举中互相竞争。外国观察者有时会因此感到困惑——这看起来几乎像一个正常的民主国家。\n但如果仔细观察，所有的候选人都要经过同一个委员会的审查，所有报纸都在同一条红线内运作，所有辩论都在同一个前提下进行：共和国是不可质疑的。这就像德国友邦对我们的看法一样，一切行为只要在不跨越底线的情况下都是可以被允许的，这句话同样适用于在国家主导的分歧下。"

 ENG_the_weight_of_duty_desc:0 "\n\n\n\n£GFX_ENG_the_weight_of_duty\n\n\n\n\n\n"权利"这个词总是出现在"义务"之后。每一位公民在十八岁那年会收到一封来自国家的信件。信的内容很简短：无非表明你业已成年，应当担负国家公民的义务，\n而这份义务，没有终止日期。国民服役、社区值勤、行业协会义务劳动——国家总有需要你的地方。\n而人们没有说不的权利。因为这无关乎任何缘由，这只是你作为燃料必须履行的唯一功能。"

 ENG_planned_prosperity_desc:0 "\n\n\n\n£GFX_ENG_planned_prosperity\n\n\n\n\n\n工厂在运转。商店里有面包、有茶叶、有肥皂。失业率是政府公布的数字，而政府公布的数字总是令人满意的。行业协会按照国家的指示调整产量，工人按照协会的安排完成任务。\n\n没有罢工，因为罢工是非法的。没有破产，因为破产需要上级批准。这个经济体在一步一步的去按照计划运转，像一台保养良好的机器。\n只是每个人都被眼前的纸醉金迷遮住双眼，无人再去关心，也无人再去询问，这辆全速前进的经济列车，还要多久才会冲出没有刹车的悬崖"
 
 


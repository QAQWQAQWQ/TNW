 ENG_George_VII:0 "乔治七世"
 POLITICS_GEORGE_VII_DESC:0 "§H蒙上帝恩典的大不列颠及英属海外自治领国王，信仰的守护者，印度皇帝§!\n--------------\n詹姆斯·乔治·亚历山大·班纳曼·卡内基，莫德公主的独子，在民众的口中，人们更愿意称他为乔治七世。风雨欲来的战间期，国王陛下在父亲的陪伴下长大，先后求学于卢德格罗夫预备学校、苏格兰的戈登斯顿，以及赛伦塞斯特皇家农业学院\n\n陛下热爱运动，痴迷跑车。在那些平静的岁月里，他的人生似乎只是一个皇室成员寻常的爱好篇章。然而，随着爱德华八世的逝世，王位意外地落在了他的肩上\n\n蒙承上帝恩典，新千年的英国依旧雍容。岁月虽在国王面容上留下痕迹，却未曾带走他对速度的眷恋。他仍时常驾车穿梭于庄园之间，窗外的风景掠过眼帘，是英格兰的田园，也是苏格兰的低云。车辆渐行渐远，如同英国自身，在无声的时光中缓缓驶离它曾经的轮廓。"
 ENG_Norman_Tebbit:0"诺曼·泰比"
 POLITICS_NORMAN_TEBBIT_DESC:0 "诺曼·泰比特没有建立这个共和国。他没有在1940年代走上街头，没有签署建国文件，没有站在讲台上宣告一个新英国的诞生。当他踏入政坛时，革命早已结束，内战早已胜利，王冠早已被摘下。他不是奠基者。他是比奠基者更有用的东西——一个管理者。\n\n1931年，泰比特出生在恩菲尔德的一个工人家庭。他成长在一个已经被重塑的英国。他不需要被说服共和国的合法性——他从未见过别的东西。十九岁那年，他加入了人民党，不是出于意识形态的狂热，而是出于一种本能——当比赛已经结束时，选择赢的那一方。他在体制内的晋升方式，和所有奖励沉默与能力的体制一样：稳定、安静，不制造负担不起的敌人。\n\n同僚们形容他高效。反对者——那些仍在被允许的异议范围内存在的少数人——形容他冷酷。两者都是对的。泰比特发表关于牺牲与民族使命的演讲，不是因为他像老一辈那样真心信仰这些词汇，而是因为这些词汇管用。他明白，一个存在了六十年的政权不再靠信仰运转。它靠习惯运转，靠程序运转，靠一个简单的事实运转——活着的人中没有谁还记得别的制度是什么样子。\n\n他就任总统那天，街上没有庆祝。也没有抗议。权力交接被安排在晚间新闻里，夹在天气预报和足球赛果之间播出。这也许是他最大的成就：他让权力变得无聊了。而无聊的权力，才是持久的权力。\n\n\日耳曼尼亚打来电话时，他会接。他并不假装享受这件事。但他每次都接。"

 ENG_John_Redwood_hog_desc:0 "§Y国务总理\n不列颠民族共和主义§!\n--------------\n"约翰·雷德伍德从未在内阁会议上提高过嗓音。三十年的公职生涯中，没有一位同僚记得他笑过、发过脾气、或表达过任何没有至少三页数据支撑的观点。这不是性格缺陷。按照他的标准，这是担任公职的最高资质。雷德伍德1951年出生，属于完全在阴影下成长的一代人。内战结束时他十一岁，君主制被废除时他二十一岁。他对旧英国没有记忆，也没有怀念。他在牛津大学学习数学——政权保留的少数几所大学之一，尽管课程已被重新编排，教务委员会里也安排了一名常驻的党联络官。他以优异成绩毕业。他的论文导师后来对一位同事说，雷德伍德是他教过的最聪明的学生，也是最令人不安的。"他解决问题，"导师说，"但看不出他关心那些问题究竟是关于什么的。\n\n他在1974年进入公务员系统，和泰比特加入人民党是同一年。泰比特在党的架构中攀升，雷德伍德则在国家机器中攀升——计划局、工业协调署、财政部。到九十年代初，他已经成为那个真正撰写经济计划的人，而部长们只是把这些计划拿到会议上宣读。1997年泰比特就任总统时，他的第一项任命就是雷德伍德担任国务总理。这个决定没有让任何人感到意外。每台机器都需要一个工程师，而雷德伍德是现有的最好的那个。\n\n对于日耳曼尼亚来说，雷德伍德是理想的合作伙伴：他从不谈论尊严，只谈论条款；从不制造麻烦，只解决问题。\n他像一个尽职的管家，打理着一座不属于他的庄园，确保草坪修剪整齐，账目分毫不差。至于庄园的主人是谁，对他来说只是一个法律上的注脚"

 ENG_Douglas_Hurd_for_desc:0 "§Y外交部长\n指导式民主§!\n--------------\n道格拉斯·赫德拥有一种旧时代的优雅，这种优雅在粗鄙的民族共和国里显得格格不入，却又不可或缺，他是这个政权对外展示的一张体面面具，用无可挑剔的礼仪掩盖着来自丧失主权之国的尴尬现实，\n赫德的工作不是制定外交政策，对他来说，不列颠没有外交政策，只有对日耳曼尼亚的“协调义务”。他的工作是解释、缓冲和润滑，当领袖的某些国内政策可能引起德国主子的不快时，赫德会用最委婉的外交辞令进行修饰；当日耳曼尼亚索要更多的资源配额时，赫德会用最体面的方式讨价还价，赫德的能力不在于此，他也会通过合适的中间点为自己和国家讨得好处，\n当然，他并不为此感到羞耻。在他看来，维护不列颠残存的尊严需要的是现实主义的妥协，而不是自杀式的反抗。他在办公桌上放着塔列朗的传记，自诩为在巨人脚下为国家争取生存空间的智者。\n\n久而久之，赫德已经成为共和国中一种稀有的存在：一个伦敦和日耳曼尼亚都认为可靠的人。伦敦信任他，因为他总是为最好的条件而争取。日耳曼尼亚信任他，因为他总是接受最终的答案。"

 ENG_Nigel_Lawson_eco_desc:0 "§Y国家财政与经济部长\n企业家长制§!\n--------------\n奈杰尔·劳森懂钱。更重要的是，他懂得如何在一个钱不应该重要的体制里处理钱,共和国的官方经济学说是社团主义的行业在国家指导下合作，市场服务于民族目标，利润是工具而非目的。劳森整个职业生涯都在这个框架内运作，同时默默确保这个框架不会在自身的矛盾下崩塌。他是一个在账本从来没被设计成能平衡的国家里平衡账本的人,\n劳森1932年出生，最初接受新闻训练，后来政权的媒体整合使独立的财经报道变得不可能。1968年他转入财政部，在那里他发现自己分析数字的才能对国家而言比写文章的才能更有价值。到七十年代中期，他已经成为财政部的首席分析师,那个告诉内阁经济实际在干什么的人，而不是党的宣传说经济在干什么。这使他同时变得不可或缺又不被信任,\n\n1997年他被任命为国家财政与经济部长，是泰比特最务实的决定。民族共和国的经济已经停滞多年——没有崩溃，没有增长，只是以一种没有人去调整时机器会继续运转的方式继续着。劳森的任务很简单：让通货膨胀保持在人们开始注意到之前的水平以下，让工业产出保持在柏林开始抱怨之前的水平以上，并让两者之间的差距不要变得可见。他基本上做到了。货架上有货。工厂在运转。失业数字每季度公布一次，总是令人满意的。至于它们是否准确，劳森认为这是一个无关紧要的问题。他的工作不是描述现实。他的工作是防止现实变成真正的问题"

 ENG_Liam_Fox_sec_desc:0 "§Y国防与国家安全部长\n无支配体制§!\n--------------\n利亚姆·福克斯是内阁中最年轻的成员，也是最像泰比特本人的门徒。作为一名医生出身的政客，他看待国家安全的方式就像看待病理切片：冷酷、客观、且以切除为手段。他不相信改造，只相信隔离和消灭。\n国防部在他的领导下已经完全变质。它不再是为了防御外敌——因为在这个世界上，英国唯一的'敌人'就是自己的人民。不列颠国防军被重组为一支准治安部队，主要任务是协助国家安全局维持国内稳定，以及配合德国驻军进行‘联合演习’。\n福克斯与驻英德军最高参谋部的关系比与任何一位内阁同僚都要密切。他定期与德国将军们打高尔夫球，交换情报，协调防务。对于那些指责他'卖国'的地下传单，他嗤之以鼻。\n\n在他看来，真正的爱国是确保国家不会因为愚蠢的反抗而化为焦土。在他看来，英国人民必须忍受这种沉默带来的痛苦，起码要把潜伏在国家内部的真正敌人消灭之前，因为这是保护国家的唯一方法.而这种沉默不是耻辱，而是义务。"


 ENG_Charter_of_the_BPP_law_desc:0 "§J英国人民党§!，创设于海狮战役之后。彼役中，德意志军队横渡英吉利海峡，登陆不列颠南岸，战时内阁仓皇出逃，旧秩序于数周之内土崩瓦解。德方旋即扶植以§S巴里·多姆维尔§!等亲德政客为核心之§o合作政府§!，§J英国人民党§!应运而立，成为不列颠唯一合法之政党。创党宪章以一种近乎慈父之口吻宣告：国家当转化为§<心怀仁善之有机体§!，§J人民党§!为英国人民福祉与生命权之唯一监护者，其使命在于妥善保护民众免受高利贷、投机及一切类此之威胁侵害。此等措辞读来温厚可亲，仿佛一位医者向病人许诺平安。然在践履之中，"唯一监护者"之身份赋予了政府不受约束之独裁权柄——界定何者为"威胁"之权、惩处一切被认定为威胁者之权、乃至不经审判即§V诛杀政敌之权§!。自§L一九四三年§!至§L一九七二年§!,此宪章为§o合作政府§!一切暴行提供了法理之遮羞布。§L一九七二年§!,§E爱德华八世§!薨逝，全民公投废除君制，§X不列颠民族共和国§!成立。宪章遂行其迄今唯一之全面修纂。修订之要有三,\n\n其一，"唯一合法政党"之表述被删去，代以"§X不列颠民族§!之政治领导力量"。措辞变了，实质未动——人民党依旧掌控一切权力枢纽，其余四个合法政党之存在与否、活动宽窄，悉由人民党辖下之§U宪政与公共秩序委员会§!裁量，\n\n其二，"§<心怀仁善之有机体§!"与"§.唯一监护者§!"之原始表述被完整保留于宪章序言，一字未改。党内曾有人建议以更现代之措辞替换此等用语。此议被否决。此等用语已成共和国立国宪章之一部分。留之则为一切超越法律之行动提供永久正当性。一个"监护者"有权做任何事——只要他声称是为了§*被监护者§!的§e利益§!。\n\n其三，修订后第七条之措辞尤当留意。此条规定："§X不列颠民族§!之统一、损害人民福祉与生命权者，党有责任代表国民予以一切必要之处置。"此条直接承袭自§f创党宪章§!中赋予政府独裁权力之核心条款，但措辞被重新包装——不再提"惩罚"与"消灭"，而以"一切必要之处置"涵盖之。何谓"必要"，宪章未予界定。亦无人要求界定。在共和国的法律体系中，此六字为一切镇压行为之终极依据——从行政拘留到秘密处决，从查封报刊到整肃异己，皆可溯源至此。"

 ENG_Constitution_of_the_British_National_Republic_law_desc:0 "《§X不列颠民族共和国根本宪章§!》，§L一九七二年§! §P六月制宪议会§!通过，§E温莎旧统§!既废，§X共和国体§!乃立,宪法经全民公投确认施行，宪章之序言以一种庄重的历史叙事为共和国寻根溯源。它将§L一六四九年§!§Q克伦威尔之共和国§!称为"第一共和"，将§L一九四三年§!海狮战役后§o合作政府§!之建立称为"§e不列颠民族§!复兴之肇始"，与§L一九七二年§!之公投定义为"§&民族自决§!之最终完成"。\n\n宪章凡九章。首章定国体："§X不列颠民族共和国§!，§h统一§!而不可§V分割§!、以§X全不列颠民族§!为本之§f权威共和国§!。"次章列根本原则。三章立§U总统制§!。四章规§,国民议会§!。五章定§a司法§!。六章列§$公民权利§!——每条缀但书。七章保§Z劳动者§!有机地位 八章定§X英§!§r德§!§o同盟条约§!之宪法位阶——此章在制宪辩论中未经任何讨论即获通过，\n据参与者回忆，§r日耳曼尼亚§!方面事先传达了"建议"。九章为§m修宪程序§!——门槛之高迄未有援用者。宪章历§L一九八四§!、§L一九九六§!两度技术修正，§w核心条款§!纹丝未动。于学校被诵，于法庭被援，于政争中被各派执为兵器"

 ENG_Constitutional_and_Public_Order_Act_law_desc:0 "《公共秩序法》，§L一九七三年§!颁行，乃国家控制§A政治§!与§u社会§!局势，以免进入混乱事态之特别法典。§L一九四三年§!后§f三十年§!间不列颠仅有§J人民党§!一党合法存在。§L一九七二年§!共和国成立后，时任§i务实派§!总统§l拉布·巴特勒§!认为有必要营造§O有限多元之表象§!——非为开明，而为实用：一个看起来有选择的体制比一个明确没有选择的体制更容易维持。此法精妙不在所禁者何而在令"合法"与"非法"之界限永处模糊。§U委员会§!握终审解释权。任何政党可于任何时以任何由被裁定违规。然迄今未有政党真被取缔——然其法典威胁之价值永大于行刑之实"

 ENG_Industrial_Cooperation_Act_law_desc:0 "《§&行业协作法§!》，§L一九四九年§!初颁、§L一九七五年§!修订，乃§e社团经济§!之法理基石。海狮战役后英国工业遭受重创——不列颠空战中工厂区被大面积轰炸，占领初期§r德方§!又系统拆卸了部分军工设备运往大陆。§o合作政府§!面临的首要任务是在废墟上重建经济，同时确保重建之成果不会滋生反抗之力量。此法将罢工遂§J非劳动问题§!而为§U安全问题§!。此分类效验卓著：共和国有史以来大规模罢工次数为零。人民党宪章许诺保护人民免受"投机"之害——行业协作法正是此承诺的制度化,随即一切经济活动编入二十三个行业委员会。\n名义上§<企业方§!、§V劳动者方§!、§X国家方§!三方平等。实则§X国家方§!由§J人民党§!委任，§<企业方§!须§X国家方§!认可，§V劳动者方§!由§Z劳工党§!推举。协商之果遂总与国家计划一致"

 ENG_Republic_Land_Act_law_desc:0 "战后的§o合作政府§!面临一个微妙的选择.英国§h传统地主阶层§!虽大多支持旧秩序，但彼等对§x布尔什维主义§!之恐惧远甚于对§r德国人§!之厌恶。§o合作政府§!只需给出正确的价码便可收买其沉默。§o土地法§!即此价码。私有土地保全然附二端：须入§b国土委员会§!接受指导；庄园逾五百英亩者身故后移交百分之三十予国家土地基金。此法收买又驯服了§n乡村旧族§!——保住土地失去自由。§a国家保守党§!根基即立于此等妥协。"
 
 
 ENG_Anglo_German_Alliance_Treaty_law_desc:0 "此法其源头可溯至§L一九四三年§!八月§h英国全境沦陷§!后§r德方§!与§o合作政府§!签署之§A《英德合作备忘录》§!——彼时不过数页之薄纸，由一方以征服者之姿态递出，另一方以战败者之屈辱接受。嗣后此文经§L一九四四年§!、§L一九七二年§!、§L一九七四年§!三度扩订，终由备忘录膨胀为六编一百三十七条之庞然法文，并被写入§X共和国根本宪章§!第八章获宪法位阶,\n\n六编要旨：\n首编定"特殊同盟"。\n次编定§w安全合作§!——德国驻军,规模由比例为三德二英构成之"§I联合安全委员会§!"确定,驻军享治外法权。\n三编定§i经济协调§!——须与§r日耳曼尼亚§!"保持协调"即须§r日耳曼尼亚§!默许，\n四编定§&情报共享§!——§Q国安总局§!定期向§r德国§!汇报。\n五编定§P文化合作§!——德语为第一外语。\n六编定§f争端仲裁§!——比例为一德三英构成仲裁庭" 

 ENG_National_Corporatist_Labour_Code_law_desc:0 "《§Z全国职团劳动法典§!》规定废罢一切独立工会，尽纳举国劳工于“民族劳工阵线”麾下。薪酬之数，非由市价，乃由职团理事会一言而决；迁徙之权，亦须有司特许，方得成行。此法为《§&行业协作法§!》在车间层面之延伸也。协作法定行业与国家之关系，纪律法则定工人与工厂之关系——一种以律令凝固、§j不容商榷之服从关系§!。\n法定§P无故旷工逾三日者§!，行业理事会施以警告并扣减工资；\n连续§E旷工逾七日者§!移交§w治安法庭§!；\n§I旷工致生产亏损者§!须以延长工时补偿。\n未经§h行业理事会§!批准，工人不得§A自行变更岗位§!——换工须持现§<雇主§!、§h委员会§!及§X地方劳动局§!三方联署之"§V劳动力流动许可§!，法末条——引用最寡然影响至深者——设"§J生产英雄§!"制。每季各行业委员会评选产量最高之工人，授"§u共和国劳动勋章§!"。其姓名肖像被刊于工厂告示栏及《§e劳动者之声§!》报上。彼等非明星，乃标尺——一种温和之提示，告知众人"足够"之标准何在"

 


 

 ENG_George_VII:0 "乔治七世"
 POLITICS_GEORGE_VII_DESC:0 "§H蒙上帝恩典的大不列颠及英属海外自治领国王，信仰的守护者，印度皇帝§!\n§W--------------§!\n詹姆斯·乔治·亚历山大·班纳曼·卡内基，莫德公主的独子，在民众的口中，人们更愿意称他为乔治七世。风雨欲来的战间期，国王陛下在父亲的陪伴下长大，先后求学于卢德格罗夫预备学校、苏格兰的戈登斯顿，以及赛伦塞斯特皇家农业学院\n\n陛下热爱运动，痴迷跑车。在那些平静的岁月里，他的人生似乎只是一个皇室成员寻常的爱好篇章。然而，随着爱德华八世的逝世，王位意外地落在了他的肩上\n\n蒙承上帝恩典，新千年的英国依旧雍容。岁月虽在国王面容上留下痕迹，却未曾带走他对速度的眷恋。他仍时常驾车穿梭于庄园之间，窗外的风景掠过眼帘，是英格兰的田园，也是苏格兰的低云。车辆渐行渐远，如同英国自身，在无声的时光中缓缓驶离它曾经的轮廓。"
 ENG_Kenneth_Clarke:0 "肯尼斯·克拉克"
 POLITICS_KENNETH_CLARKE_DESC:0 "肯尼斯·哈里·克拉克出生于诺丁汉，早年曾对奥斯瓦尔德·莫斯利抱有过同情。他性情温和，在党内斗争日渐激烈的年代里并不惹眼，却自1970年代起历任财政大臣、内政大臣、司法大臣等要职，逐渐成为保守党内一尊资历深厚的巨兽。那道由岁月与权柄垒成的壁垒，足以将大多数挑战者无声拒之门外。\n\n克拉克对雪茄、爵士乐和赛车的热爱人尽皆知，甚至与国王陛下会面时，他们也常能就此聊上片刻。他还是个十足的体育迷，是诺茨郡足球俱乐部的忠实支持者，也热衷于F1赛车的轰鸣。而在许多个午后，他的办公室时光是靠雪茄陪伴度过的\n\n喝彩声在耳边呼啸而过，他的思绪回到了现在，暮色渐沉，肯尼斯·哈里·克拉克首相静享着他的闲暇，而英国也随着雪茄无声燃尽、夕阳缓缓沉落，默默迎来又一个明天。"


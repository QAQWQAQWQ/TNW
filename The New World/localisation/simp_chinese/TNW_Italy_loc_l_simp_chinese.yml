l_simp_chinese:
 ITA_Vittorio_Emanuele:0 "埃马努埃莱四世"
 ITA_EMP:0 "意大利帝国"
 ITA_EMP_DEF:0 "意大利帝国"
 ITA_EMP_ADJ:0 "意大利帝国"
 ITA_Vincenzo_Trentino:0 "文森佐·特兰蒂诺"
 POLITICS_VINCENZO_TRENTION_DESC:0 "因她的灾殃要在同一日临到死亡、悲哀、饥荒，她还要被烈火吞灭；因为审判她的主神，大有能力。\n你们看见罗马被兵围困，就知道它荒凉的日子近了……这是报应的日子，要使经上所写的一切都应验。\n你们不是看见这殿宇吗？我实在告诉你们：将来在这里，没有一块石头能留在另一块石头上，而不被拆毁。\n\n有一位大力的天使举起一块如同大磨石的巨石，抛入海中，说：“巴比伦大城也必这样猛烈地被投下去，决不能再见了。”救恩、荣耀、权能，都属于我们的神！祂的判断是真实而公义的；祂审判了那用淫行败坏世界的大淫妇，并追讨了她手中仆人流血的债。"
 ITA_Pino_Rauti:0 "皮诺·劳蒂"
 ITA_Silvio_Berlusconi:0 "西尔维奥·贝卢斯科尼"
 ITA_Salvo_Lima:0 "萨尔沃·利马"
 ITA_Luca_Romagnoli:0 "卢卡·罗马尼奥利"
 ITA_Pino_Rauti_hog_desc:0 "§Y大臣会议副主席\n圣墓主义§!\n--------------\n\n那日子以前，必有离道反教的事，又有那大罪人，就是沉沦之子显露出来。他是抵挡主，高抬自己超过一切称为神的……甚至坐在神的殿里，自称是神。\n\n这不法之人的到来，是照着撒但的运行，行各样的异能、神迹和一切虚假的奇事，并在那沉沦的人身上施行各样不义的诡诈。因为假基督、假先知将要起来，显大神迹、大奇事，倘若能行，连选民也被迷惑了.\n\n那时，这不法之人必要显露出来；主耶稣要用口中的气灭绝他，用降临的荣光将他废去。"
 
 ITA_Silvio_Berlusconi_for_desc:0 "§Y外交大臣\n基督教民主主义§!\n--------------\n\n地上的商人就为她哭泣悲哀，因为再也没有人买他们的货物了——那些金银、宝石、珍珠、细麻布、紫色料、丝绸、朱红料、各样香木、各样象牙器皿……\n\n贩卖这些货物、借她致富的客商，因惧怕她的痛苦，就远远站着，哭泣悲哀。你曾在海中输出货物，使许多邦国得享丰足；你以无数资财使地上君王富足，也使沿海的居民得以富饶。航海的都为你惊惶，你使他们战栗；你必令人恐惧，从此不再存留于世上。推罗倚仗财富，因骄傲而倾覆。\n\n你们这些要吞吃穷人、灭绝地上困苦人的，当听这话！你们说：“月朔几时才过去，我们好卖粮？安息日几时才过去，我们好摆出麦子？”你们用小升斗量出，用大戥子收取银钱，用诡诈的天平欺哄人；用银子买贫寒人，用一双鞋换穷乏人，连坏掉的麦子也一并卖出……\n\n诡诈的天平，为耶和华所憎恶；公平的法码，为他所喜悦。"
 

 ITA_Salvo_Lima_eco_desc:0 "§Y财政大臣\n基督教进步主义§!\n--------------\n\n你们这些淫乱的人哪，岂不知与世俗为友就是与神为敌吗？所以凡想要与世俗为友的，便是与神为敌了。你们不要与不信的人同负一轭……基督和彼列有什么相合？一个人不能事奉两个主……你们不能又事奉神，又事奉玛门。\n\n我们不再作小孩子，被一切教训之风摇动，飘来飘去；心怀二意的人，在他一切所行的路上都没有定见。有罪的人哪，要洁净你们的手；心怀二意的人哪，要清洁你们的心。你们心持两意，还要到几时呢？"

 
 ITA_Luca_Romagnoli_sec_desc:0 "§Y内政大臣\n右翼民粹主义§!\n--------------\n\n们从前好像迷途的羊，如今却归回你们灵魂的牧人与监督了。\n\n我的弟兄们，你们中间若有人偏离了真道，有人使他回转，这人便救一个灵魂脱离死亡，并且遮盖许多的罪。“你们中间谁有一百只羊，丢失了一只，不把九十九只撇在旷野，去寻找那只迷失的，直到找着呢？找着了，就欢欢喜喜地扛在肩上，回到家里，请朋友邻舍来，对他们说：‘你们与我一同欢喜吧，因为我丢失的那只羊已经找到了。’我告诉你们：一个罪人悔改，在天上也要这样为他欢喜，比为那九十九个无需悔改的义人欢喜更大。”\n\n我们都如羊走迷，各人偏行己路；耶和华使我们众人的罪孽都归在他身上。"


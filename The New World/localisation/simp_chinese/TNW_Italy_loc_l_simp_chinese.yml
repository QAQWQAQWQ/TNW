 ITA_Albertine_Statute_of_1848_law:0 "£GFX_ITA_law_icon_one §L1848年§!阿尔贝蒂诺宪章 "
 ITA_Albertine_Statute_of_1848_law_desc:0 "欧洲革命风起云涌，西西里、那不勒斯、米兰、威尼斯诸地皆陷动荡。撒丁王国若不主动立宪，恐为革命洪流所吞噬。§m卡洛·阿尔贝托遂先发制人，于三月四日颁行宪章，改君主专制为君主立宪§!，以此抢占§A“意大利民族主义领袖”§!之位，并与奥地利之绝对君主制划清界限。\n\n宪章定§f国王§!为§h国家元首§!、§,军队统帅§!、§Q司法名义§!之首脑，王位由萨伏伊王朝男性世袭。此制与英国光荣革命后“王在议会”不同，阿尔贝蒂诺宪章实乃“王在宪章之上”卡洛·阿尔贝托之算计，昭然若揭。\n\n宪章明文：§*“所有臣民，无论等级，法律面前一律平等。”§!财产、人身、出版自由皆得保障；§L一八四八年三月§!底配套新闻法，仅禁妨害公序及政府正常运转者，较前教俗双重审查宽松多矣。§U天主教虽§!为唯一国教，然他教亦得容留。§L一八四八年三月至六月§!间，犹太人获与天主教徒同等之民事地位。"

 ITA_Head_of_Government_Powers_and_Prerogatives_Act_Fascist_Year_III_law:0 "§&法西斯纪年§!§L第三年§!£GFX_ITA_law_icon_two 政府首脑职权与特权法§X【已废除】§!"
 ITA_Head_of_Government_Powers_and_Prerogatives_Act_Fascist_Year_III_law_desc:0 "§L一八四八年§!宪章所立§f"王在宪章之上"§!之局，至其曾孙辈§a维托里奥·埃马努埃莱三世§!手中，竟为§&墨索里尼§!一朝拆尽。\n\n§H政府首脑§!不复对§m议会§!负责，唯对§f国王§!负责，而§f国王§!此时已大致为§&墨索里尼§!所控，故所谓"对王负责"，实则“只对自己负责”耳。§o内阁组成由首脑独断，议会两院非经首脑首肯不得擅提一案；§!首脑更可于“认为必要时”径颁具法律效力之法令，毋须咨议他署。\n\n此即§L一九二五年十二月二十四日§!§.“平安夜法”§!之所为——墨氏头衔由§j“大臣会议主席”§!改§H“政府首脑”§!，内阁责任与议会监督权一并削去，宪章以来"王—议会"之制衡架构，至此名存实亡。§a萨伏伊王朝§!当年借宪章抢来的§A"意大利领袖"§!之位，经§L八十载§!，反成就了另一位§&领袖§!把王朝本身架空。"

 ITA_Political_Parties_Dissolution_Decree_Fascist_Year_IV_law:0  "§&法西斯纪年§!§L第四年§!£GFX_ITA_law_icon_four 解散政党令§X【已废除】§!"
 ITA_Political_Parties_Dissolution_Decree_Fascist_Year_IV_law_desc:0 "§L一九二六年十月三十一日§!，§&法西斯政府§!先颁§U“保障国家安全紧急法令”§!，解散一切§S反法西斯政党团体§!、取缔§m反对派报纸§!，设§r特别法庭审政治罪，判决不得上诉，流放嫌疑分子毋须审讯§!。§十一月五日、二十六日间§!，复颁一系列非常法令随之落地，除§&法西斯党§!外，诸党悉数解散；§S反法西斯议员§!§,资格褫夺、逮捕、流放，一气呵成§!。§X葛兰西§!虽身负议员豁免，仍于§L十一月八日§!在§f罗马§!寓所被擒，时年§d三十五§!；§L二十四日§!押赴西西里以北乌斯蒂卡岛，如小石投海，永沉无声。\n\n《政府颁布法令的权力法》溯及§L一九二五年十二月二十四日§!§.“平安夜法”§!、§L一九二六年一月三十一日补链§!，政府可自行产法，议会监督彻底归零，§&立法权尽付墨索里尼一人§!。\n\n至此，阿尔贝蒂诺宪章§m“两院、多党、选举”制度§!，已被物理清除殆尽。宪章条文仍悬于墙上，然§f“王在宪章之上”§!一句，连§f“王”§!字亦已虚化，墙内是§&墨索里尼§!，墙外是空壳。§a萨伏伊王朝§!一八四八年借以自保、且抢得§A“意大利领袖”§!名号的那纸宪章，经八十载三易其手，终成§E一帧装潢§!。"

 ITA_Grand_Council_of_Fascism_Competences_Act_Fascist_Year_VI_law:0 "§&法西斯纪年§!§L第六年§!£GFX_ITA_law_icon_four 法西斯大委员会职权法§X【已废除】§!"
 ITA_Grand_Council_of_Fascism_Competences_Act_Fascist_Year_VI_law_desc:0 "§L一九二八年十二月九日§!，§&墨索里尼§!再推§,《法西斯大委员会法》§!，将此前仅为党内机构的§,大委员会§!正式嵌入§m国家宪政框架§!。自此，§,大委员会§!不仅有权向§f国王§!提名§H政府首脑§!及§h各部部长人选§!此项原属国王依据阿尔贝蒂诺宪章第5条的宪法特权，更深度介入立法、行政、继嗣诸端：\n\n§,大委员会§!参与立法程序，为全国大选提出唯一候选人名单，§j并可颁布涉及政治、经济、社会各领域之法令。最致命者，乃其有权参与决定王位继承人，§!这一条直捣阿尔贝蒂诺宪章第1至5条“萨伏伊王朝男性世袭”之根基。§f王位传承§!本系王朝家事、宪法铁律，今竟由一党内机构置喙，等于宣告§a萨伏伊王室§!之§Z存废§!，亦须仰§&法西斯§!鼻息。\n\n此乃真正的§&“党国宪法化”§!。此前§L一九二五、二六年§!之§.“平安夜法”§!与§E“非常法令”§!，尚可辩称为“紧急状态特别法”；§L一九二八年§!此法，则是将§&法西斯党之组织机器§!直接缝入§m王国宪政§!，阿尔贝蒂诺原设之“§f国王§!—§m议会§!—§n大臣§!”三角，已被置换为“§&领袖§!—§,大委员会§!—§f国王§!（被架空）”新三角。宪章仍在，条文未改，然权力中枢早已移出王宫。§a萨伏伊王朝§!借§L一八四八年§!宪章自保、进而问鼎§A意大利统一之功业§!，至此沦为法西斯体制的一枚装饰印章"

 ITA_Racial_Laws_Fascist_Year_XVI_law:0 "§&法西斯纪年§!§L第十六年§!£GFX_ITA_law_icon_four 种族法§X【已废除】§!"
 ITA_Racial_Laws_Fascist_Year_XVI_law_desc:0 "§L一九三八年七月§!，§&法西斯科学家§!联名出《种族宣言》，十款之中，先立人类种族实存雅利安文明之说，§O第七款明言意大利人须自称为种族主义者§!，第八款分地中海人、欧洲人、东方人、非洲人，第九款直下——§U犹太人非意大利人种§!，第十款：“§n意大利人纯正之欧洲体格与精神，不可为他族所改§!”。\n\n此番言论一出，§L十一月十一日§!《晚邮报》头版已预告种族保护法经部长会议通过；§L十一月十七日§!，§f皇家法令第一七二八号落地§!——§U犹太人§!§o禁任公职、禁入高等学府，犹太作家之书悉数查禁；续之以补充令，剥夺财产、限其行动，终至内部流放，与政治犯同伍。§!\n\n§L复兴运动年代§!，§d曼佐托笔下、卢扎托辈§!§U犹太学人§!之所期于§n意大利者§!，谓§*新国度§!当以公民平等破旧秩序；§L八十年后§!，同一§a王朝§!同一宪章名下，犹太人反成非我族类遭逐入流放营。§a萨伏伊§!自一八四八年抢来之意大利领袖名号，至此不惟为法西斯所用，且亲为种族法背书——§j王朝道德之破产§!，较之§L一九二六年§!那纸非常法令更为彻底。"

 ITA_European_Confederation_Treaty_Fascist_Year_XXIV_law:0 "§&法西斯纪年§!§L第二十四年§!£GFX_ITA_law_icon_three 欧洲邦联条约"
 ITA_European_Confederation_Treaty_Fascist_Year_XXIV_law_desc:0 "§r反共产国际诸盟国§!聚于§j维也纳§!，共议草签之约。其文分作二卷：一曰§Q《经济与货币联盟条约》§!，二曰§r《政治联盟条约》§!，合称§Q《欧洲邦联条约》§!。§o凡属盟国国民，即为§d欧联公民§!，得于全邦之内自由迁徙、择地安居，并于居所所在之市镇选举中享有§f投票之权§!。资本可自由流通，市廛一体，规制趋同。§!\n\n\n§n“意大利§!……愿与§.他国平等相待§!，§<为促成和平正义之国际组织§!，当义不容辞。”"

 ITA_Trade_Union_Act_Amendment_1966_law:0 "§L1966年§!£GFX_FRS_1969_Grenell_Agreement 工会法修正案"
 ITA_Trade_Union_Act_Amendment_1966_law_desc:0 "§n意国§!§L一九五〇年代之初§!，§m经济奇迹方炽§!，北部厂佣频徙，黜退任意。\n\n§h乃立正当理由之制，凡个体解雇必据之，分为二类§!：一曰因由，二曰理由即§X工人严重违纪，雇主不得擅黜。无正当理由而解雇§!，工人可§i诉请复职或索偿，定期、不定期皆管§!，§E惟小微企业（十五人以下）得豁免，此小肆豁免一条，累讼至今§!，为§n意国劳工法最纠葛处§!。"
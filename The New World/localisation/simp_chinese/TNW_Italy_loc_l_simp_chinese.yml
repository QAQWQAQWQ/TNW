 ITA_The_Sly_Fox_and_the_Wolf_Pack:0 "狡狐群狼"
 ITA_The_Sly_Fox_and_the_Wolf_Pack_desc:0 "朝堂之下，市井之间，公历二零零二年，法西斯纪年八十一年。意大利帝国的战船依旧在地中海上劈波前行。风浪偶尔平息时，世人或许会想起那位执掌帝国二十余载的领袖。\n\n他的死来得不急不缓。长年的病痛早已侵蚀了他的躯体，圣像崩塌得那样突然。国内狡狐横行，国家联盟内群狼环伺，无数双眼睛曾死死盯住他。如今，被凝视的人死了，那些被他生前压制的政治势力，如同开闸之水，从青年团到党，从意大利本土到海外领地，政治内斗如瘟疫般席卷了整个帝国。政令朝令夕改，内阁更迭如走马灯，保皇派与正统法西斯派缠斗不休。帝国就在这样的混乱中迎来了经济腾飞，又在短暂的繁荣后急速坠落。保皇派逐渐占据上风，法西斯革命戛然而止，法团化的国家改造就此搁浅。墨索里尼的时代结束了，国家联盟的时代，也结束了。\n\n意大利人会怀念那个时期吗？倒也未必。"

 ITA_Iconoclasm:0 "圣像破坏"
 ITA_Iconoclasm_desc:0 "公元754年，君士坦丁五世于君士坦丁堡召集宗教会议，正式宣告：圣像崇拜即偶像崇拜，违背圣经与诸教父之训诫。\n\n墨索里尼生前，刻意将自己塑造成领袖，塑造成父亲般的角色。他成了意大利国家的圣像，幻想自己能如凯撒一般被永世铭记。直到圣像崩塌。他死后，政治遗产被悉数清算。多年苦心经营的个人崇拜轰然倒地，他的政策被指为国家腐败的根源。无数报社、作家蜂拥而上，对他进行解构与诋毁，真相如何，已不重要。他已化作意大利这个国家的文化之一。\n\n毁坏圣像运动早已不是个人所能阻挡。它蔓延成全社会对上一个法西斯时代的集体解构浪潮，却也动摇了皇帝的统治与社会秩序。只是此刻，它尚未展现出真正的威力"

 ITA_Sarcophagus:0 "石棺"
 ITA_Sarcophagus_desc:0 "无人能为此负责，或者换个说法，无人愿意承认。\n\n五十至八十年代，意大利帝国的经济低迷与社会混乱，像一场没有凶手的谋杀。每一个参与者都双手干净，每一股势力都问心无愧。保皇派指责法西斯派的激进遗毒，法西斯派控诉保皇派的背叛与绥靖，青年团咒骂老一代的腐朽，老一代叹息青年的轻狂。所有人都在寻找罪人。\n\n君士坦丁五世的石棺被人从大教堂中拖出，焚毁后抛入大海。反对毁坏圣像者说，正是这位皇帝造就了帝国的毁灭；支持毁坏圣像者则坚称，恰恰是毁坏圣像运动的终止导致了帝国的崩溃。他们面面相觑，同一人种，同一肤色，同一血脉，却无法阻止彼此眼中的敌意。\n\n于是他们联手杀死了意大利。将她装入石棺，与自己一同埋葬。让这片土地连同她的荣光与耻辱，一起沉入漫长的沉睡，直到世界崩塌，直到天国降世。"

 ITA_Scourging_the_Rooster_the_Lamb_and_the_Ghost:0 "鞭笞、公鸡与羔羊和鬼"
 ITA_Scourging_the_Rooster_the_Lamb_and_the_Ghost_desc:0 "青年曾望着游击队的身影，觉得那一切与自己无关。他举报过，厌弃过，敌视过，直到那场危机真的将他席卷，他才恍然明白。\n\n于是他亲手杀死了自己。他把自己变成了鬼。他不知道自己的面目如今何等狰狞，不知道自己衣衫如何褴褛，他甚至不知道自己是否还在活着。他仿佛真的变成了鬼。\n\n"主鞭笞世人，使世人成人。神的羔羊，是为除去世人罪孽而来。公鸡啼鸣，是世人对主的背叛。而他如今成了鬼。\n\n现在正是夜。"

 ITA_Arson_in_the_Mist:0 "疑云放火"
 ITA_Arson_in_the_Mist_desc:0  "“尼禄嫁祸的对象，是一个被称为'基督徒'的、因作恶而招恨的族群……他们被施以酷刑：有的披兽皮被狗撕碎，有的被钉十字架，天黑后浇油点燃当路灯。尼禄把自家花园开放当剧场。”—塔西佗 15.44 \n\n一场大火正向意大利社会蔓延而来。纵火者的面容隐没在迷雾之中，也许是皇帝，也许是法西斯派，也许是保皇派，也许是游击队。谁在乎呢？罗马不过是枯木堆砌的高楼，谁愿意纵火，便让他来吧。\n\n他此刻正披上兽皮，任由野狗撕咬。他此刻正被钉上十字架。一场无缘由的恨，一场爱憎分明的火，以及罗马人的哭泣。\n\n尼禄未死。祂将从帕提亚归来。"

 

 SWE_The_Anti_Marriage_Rape_Act_of_1965:0 " §L1965年§!£GFX_SWE_woman_rights_laws §h反婚内强奸法§!"
 SWE_The_Anti_Marriage_Rape_Act_of_1965_desc:0 "§h婚内强奸§!的法律认知与社会态度的演变，是一个§s漫长而曲折§!的过程。在很长一段历史时期内，§Z强奸§!虽被视为§X重罪§!，但其概念却将§p婚姻关系§!排除在外。§L1864年§!，瑞典法律将虐待妻子定罪，但§h婚内强奸§!却未受追究，其根源在于当时普遍认为§S丈夫§!对§P妻子§!的身体享有权利，婚姻内的性强制不被视为侵犯。这种观念深深植根于将§P女性§!视作§S男性§!附属物的§A社会结构§!之中，§Z强奸§!在当时更多地被理解为对§S男性§!“§J荣誉§!”或“§Q财产§!”的侵害。\n\n§L19世纪末§!兴起的§O妇女解放运动§!，开始从根本上挑战这一逻辑。§P女性§!要求§K经济独立§!、§j受教育权§!与§U工作权§!，为§&法律人格§!的独立奠定基础。§r第一次世界大战§!更以§m现实方式§!加速了这一进程，§P女性§!广泛参与§A社会生产§!，其§u地位§!与§,自我意识§!显著提升。§L进入20世纪§!，改革§Z强奸法§!、将保护范围延伸至§I已婚妇女§!的呼声日益高涨，但在§i瑞典议会§!内引发了激烈辩论。§A反对者§!担忧法律会被滥用，成为妻子敲诈或骚扰丈夫的工具；尤其是在当时§o堕胎非法§!的背景下，他们担心§P女性会§!以§Z强奸§!为由获取§o堕胎§!许可。而§n支持者§!则坚称，§P女性§!的§E性自主权§!与§h身体自决权§!不应因§j婚姻状态§!而被剥夺，§I已婚妇女§!应与§U未婚女性§!享有同等的法律保护。\n\n司法实践同样反映了改变的艰难。直至§L20世纪50年代§!，§Z强奸案件§!在法庭上都颇为罕见，严苛的举证要求与社会的污名化，使大量§P受害者§!选择沉默。§L1965年§!，§i瑞典§!法律条文虽将婚内性行为纳入强奸罪的潜在范畴，但实践中，若双方存在亲密关系，则常被视为重大减刑情节，§Z强奸罪§!主要仍被界定为针对陌生人的暴力犯罪。真正的转折点发生在§L1984年§!，当时法律修订后，法官在判决时不再将§P受害人§!与§Q施暴者§!的关系纳入考量。自此，§h婚内强奸§!在法律上与事实上，才真正开始被作为§X独立的罪行§!对待，标志着§A社会§!在观念与司法实践上迈出了§V关键一步§!。"
 SWE_The_Parental_Leave_System_in_1974:0 " §L1974年§!£GFX_SWE_medical §<育儿假制度§!"
 SWE_The_Parental_Leave_System_in_1974_desc:0 "根据§<《育儿假法》§!，员工享有全额的§<育儿假§!权利，此项权利不以其是否领取§E育儿津贴§!为转移，§l假期§!可持续至§S子女§!§f年满一岁半§!。此外，在父母领取社会保险机构发放的§E育儿津贴§!或§h临时育儿津贴§!期间，同样依法享有§m休假权§!。\n\n在§S子女§!年满§j八岁§!或§U完成小学一年级学业§!之前，父母有权申请§u减少正常工作时间§!，最高减少幅度可达§.四分之一§!。\n\n依据§<《休假条例》§!，员工一般还可获得部分休假用于照顾§S子女§!，此项权利可延续至§S子女§!§n年满十二周岁§!所在学年的结束。\n\n关于§<育儿假§!的安排，该法规定员工可将§<育儿假§!（无论是否伴随§E津贴§!）分割为最多§*三个阶段§!，且每个日历年最多可休假三次。只有在雇主同意的前提下，§l育儿假§!方可进行进一步分割。需注意的是，此项分割规定不适用于领取§h临时育儿津贴§!的假期以及§d父母教育假§!。"
 SWE_The_1975_New_Abortion_Law:0 " §L1975年§!£GFX_SWE_christ_laws §o新堕胎法§!"
 SWE_The_1975_New_Abortion_Law_desc:0 "第 1 条   如果§C妇女§!要求终止妊娠，可以在妊娠§L第 18 周§!结束前进行§o堕胎§!，并且不能假定由于该§C妇女§!的疾病，§o堕胎§!会对其§S生命§!或§d健康构成§!§X严重危险§!。\n\n§E怀孕§!与§o堕胎§!远非黑白分明之事，它们往往牵动着纷繁复杂的§O情绪波澜§!。§E意外怀孕§!或许会带来§s生活危机§!，但若自主选择终止妊娠，亦能成为化解困境的途径。许多人因此深陷§.悲伤§!，只因现实境遇背离了内心所期。\n\n§o堕胎§!始终是一个充满争议的议题，§Q相关辩论§!在§A社会§!中不时激荡。在§f专业领域§!，§j助产士§!、§<医生§!与§h妇科医生§!热议的§K焦点§!之一，便是§o堕胎治疗质量登记制度§!目前，§&国家卫生福利委员会§!虽收集相关统计数据，却仅限于§l年龄段§!信息，难以将治疗个案与具体诊所相挂钩。反对登记个人数据的声音强调，必须保护接受§o堕胎手术§!§p女性§!的身份隐私，避免任何形式的泄露。\n\n在§i瑞典§!，§o堕胎法§!秉持着一种§U坚定信念§!：§p女性§!最懂得如何主宰自己的§u身体§!与§m人生§!，她们无需为自身选择辩解。女性选择终止妊娠的主因，往往源于对§*计划生育§!的深切渴望。在此背景下，§o堕胎§!已成为最普遍的医疗程序之一。"

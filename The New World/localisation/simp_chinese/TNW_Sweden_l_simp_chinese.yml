 ##内阁##
 SWE_Bjorn_von_Sydow: "比约恩·古斯塔夫·冯·西多"
 SWE_Bjorn_von_Sydow_sec_desc: "在踏入政坛之前，比约恩·古斯塔夫·冯·西多已在学术界留下了深刻的足迹。他曾出任斯德哥尔摩大学社会学院院长，其学识根基深厚，正是孕育于这所创办于 1878 年的瑞典知名学府——斯德哥尔摩大学，一座公立综合研究型大学的高等教育殿堂。在那里，他汲取了社会科学的精髓，奠定了往后从政的智识底蕴。\n\n进入佩尔森内阁后，他逐渐展露实干者的才华。他并非声名显赫之辈，更像是一位默然耕耘的实践者。时光如水，静静流淌，如此生涯似乎也自有其从容意味。只是，岁月长河是否真会因个人的意志而悄然转向？历史，从来不曾轻易为谁驻足。"
 SWE_Anna_Lindh: "安娜·林德"
 SWE_Anna_Lindh_for_desc: "林德的学术之路始于乌普萨拉大学的法学殿堂，1982年，她以法学副博士学位毕业，同年即当选南曼兰省议会议员，自此铺开了她的政治长卷。\n\n\她两度担任瑞典议会议员，任期分别为1982年至1985年，以及1998年起直至2003年离世。1991至1994年间，她出任文化与环境专员兼斯德哥尔摩副市长。1994年社会民主党胜选后，首相英格瓦·卡尔松任命她为环境部长。1998年大选后，首相约兰·佩尔松更将外交大臣的重任托付于她，接替莉娜·耶尔姆-瓦伦。\n\n早年担任瑞典社会民主青年联盟主席的经历，为她积累了广泛人脉，在世界各地结交了不少有影响力的友人。她以热忱推动与钢铁同盟的合作，主张通过加强贸易来重振瑞典经济。\n\n作为一名卓有成就的外交官，她已成为社会民主党不可或缺的支柱。佩尔松或许也曾暗自思忖，若失去她，党的前路又将由谁照亮？"
 SWE_Olof_Johansson: "奥洛夫·约翰逊"
 SWE_Olof_Johansson_eco_desc: "奥洛夫·约翰逊出生于克鲁努贝里省永比市。青年时期，他曾求学于斯德哥尔摩经济学院，并于1969年至1971年间担任中间党青年组织领导人。1971年，他首度当选瑞典议会议员，此后连任至1976年，后又于1978–1979年、1982–1998年两度重返议会。在1976–1978年及1979–1982年的中右翼政府中，他均出任内阁职务。\n\n1987年，因时任党魁卡琳·索德健康原因辞职，约翰逊接任中间党领袖。1991年中右翼再度执政后，他在卡尔·比尔特政府中担任环境部长。然而，因坚决反对修建厄勒海峡大桥，他于1994年夏辞去该职；不久后，社会民主党在9月大选中重新掌权。\n\n1994年大选，中间党表现未如理想，直至1998年大选前不足一年，民调依然落后。在此形势下，约翰逊作出了关键的政治决断：与社会民主党人达成联合执政协议，为政党前路开辟新的可能。"
 SWE_Lars_Engqvist: "拉尔斯·恩奎斯特"
 SWE_Lars_Engqvist_hog_desc: "拉尔斯·恩奎斯特的政治生涯始于1972年，他担任瑞典社会民主党青年组织主席直至1978年，之后转向新闻界，曾出任马尔默报纸《Arbetet》的总编辑。20世纪90年代初，他先后担任马尔默市市长与瑞典电影学院院长，并于1998年首次获得政府任命。\n\n在佩尔森政府中，这位已不年轻的内政部长留给公众的印象并不深刻。他不以显赫声名为追求，只是在日复一日的政务中沉稳耕耘。窗外，瑞典的雪静静落下，人们的生活依旧如常，而他的工作，也就在这静默的节奏中，继续向前。"

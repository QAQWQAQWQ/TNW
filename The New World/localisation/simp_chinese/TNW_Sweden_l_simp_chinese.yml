 SWE_The_1980_Law_on_Succession_to_the_Throne_desc:0 "未经§f国王§!与§i瑞典议会§!共同批准，§Q瑞典王室§!的§O王子§!和§U公主§!不得通过§J选举§!、§o继承§!或§P婚姻§!等§X任何方式§!，在§h外国§!担任§E摄政职务§!。否则，其§.本人§!及其§,后裔§!将自动丧失§a瑞典王位继承权§!。\n\n§u本宪法条文§!取代了原有的§a王位继承次序§!，其制定最初是为了规范§s让·巴蒂斯特·贝尔纳多特§!当选§m瑞典王储§!后的§l继承顺位§!，并明确规定§a王位继承权§!自他本人开始。然而，§L1980年§!的§d修正案§!将这一起始点更改为§f现任国王§!§h卡尔十六世·古斯塔夫§!，从而排除了§s贝尔纳多特家族§!其他所有支系的后裔——即便其先祖曾位列当时的§l继承顺序§!之中。此项修订旨在防止§E卡尔十四世·约翰§!那些此前已被§o排除在外§!的后代重新获得继承资格。由于当时§f国王§!的§O子嗣§!尚未成年，为保留§f国王§!的叔叔§I贝尔蒂尔亲王§!作为一位§A成年继承人§!的实际作用，法律特别设立了一项§,过渡规则§!，允许他在§h卡尔十六世·古斯塔夫§!的§Q直系后裔§!之后继承§f王位§!。该过渡条款已于§L1997年§!§I贝尔蒂尔亲王§!逝世后自动失效。\n\n除上述继承顺位的规定外，§Q《王位继承法》§!亦对王室成员的§m宗教信仰§!、§P婚姻§!，以及禁止在§h外国§!担任§E摄政等事项§!作出§<明确约束§!。\n\n根据未经修改的§d《奥格斯堡信纲》§!与§L1593年§!§s乌普萨拉会议§!决议，所有§Q王室成员§!必须信仰§.福音派路德宗§!，否则将丧失§a继承权§!。此项义务适用于§f君主§!、§O王子§!与§U公主§!。\n\n§P婚姻条款§!规定，§O王子§!或§U公主§!§P结婚§!须同时获得§f君主§!与§i政府§!的批准，否则将失去§a王位继承资格§!。尽管他们可自由选择婚配对象，但若未获上述许可，仍会导致§a继承权§!的§Z丧失§!。§f君主§!本人则§X不受此条款限制§!。\n\n此外，任何§Q王室成员§!如未经§f君主§!与§i议会§!同意，通过§o继承§!、§P婚姻§!或§J选举§!成为§r外国国家元首§!，其本人及其后代将§V永久丧失§!§a瑞典王位继承权§!。"
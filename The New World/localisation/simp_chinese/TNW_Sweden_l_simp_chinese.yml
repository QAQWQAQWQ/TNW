 SWE_The_Anti_Marriage_Rape_Act_of_1965:0 " §01965年§!£GFX_SWE_woman_rights_laws §i反婚内强奸法§!"
 SWE_The_Anti_Marriage_Rape_Act_of_1965_desc:0 "婚内强奸的法律认知与社会态度的演变，是一个漫长而曲折的过程。在很长一段历史时期内，强奸虽被视为重罪，但其概念却将婚姻关系排除在外。1864年，瑞典法律将虐待妻子定罪，但婚内强奸却未受追究，其根源在于当时普遍认为丈夫对妻子的身体享有权利，婚姻内的性强制不被视为侵犯。这种观念深深植根于将女性视作男性附属物的社会结构之中，强奸在当时更多地被理解为对男性“荣誉”或“财产”的侵害。\n\n19世纪末兴起的妇女解放运动，开始从根本上挑战这一逻辑。女性要求经济独立、受教育权与工作权，为法律人格的独立奠定基础。第一次世界大战更以现实方式加速了这一进程，女性广泛参与社会生产，其地位与自我意识显著提升。进入20世纪，改革强奸法、将保护范围延伸至已婚妇女的呼声日益高涨，但在瑞典议会内引发了激烈辩论。反对者担忧法律会被滥用，成为妻子敲诈或骚扰丈夫的工具；尤其是在当时堕胎非法的背景下，他们担心女性会以强奸为由获取堕胎许可。而支持者则坚称，女性的性自主权与身体自决权不应因婚姻状态而被剥夺，已婚妇女应与未婚女性享有同等的法律保护。\n\n司法实践同样反映了改变的艰难。直至20世纪50年代，强奸案件在法庭上都颇为罕见，严苛的举证要求与社会的污名化，使大量受害者选择沉默。1965年，瑞典法律条文虽将婚内性行为纳入强奸罪的潜在范畴，但实践中，若双方存在亲密关系，则常被视为重大减刑情节，强奸罪主要仍被界定为针对陌生人的暴力犯罪。真正的转折点发生在1984年，当时法律修订后，法官在判决时不再将受害人与施暴者的关系纳入考量。自此，婚内强奸在法律上与事实上，才真正开始被作为独立的罪行对待，标志着社会在观念与司法实践上迈出了关键一步。"
 SWE_The_Parental_Leave_System_in_1974:0 " §01974年§!£GFX_SWE_medical §i育儿假制度§!"
 SWE_The_Parental_Leave_System_in_1974_desc:0 "根据《育儿假法》，员工享有全额的育儿假权利，此项权利不以其是否领取育儿津贴为转移，假期可持续至子女年满一岁半。此外，在父母领取社会保险机构发放的育儿津贴或临时育儿津贴期间，同样依法享有休假权。\n\n在子女年满八岁或完成小学一年级学业之前，父母有权申请减少正常工作时间，最高减少幅度可达四分之一。\n\n依据《休假条例》，员工一般还可获得部分休假用于照顾子女，此项权利可延续至子女年满十二周岁所在学年的结束。\n\n关于育儿假的安排，该法规定员工可将育儿假（无论是否伴随津贴）分割为最多三个阶段，且每个日历年最多可休假三次。只有在雇主同意的前提下，育儿假方可进行进一步分割。需注意的是，此项分割规定不适用于领取临时育儿津贴的假期以及父母教育假。"
 SWE_The_1975_New_Abortion_Law:0 " §01975年§!£GFX_SWE_christ_laws §i新堕胎法§!"
 SWE_The_1975_New_Abortion_Law_desc:0 "第 1 条   如果妇女要求终止妊娠，可以在妊娠第 18 周结束前进行堕胎，并且不能假定由于该妇女的疾病，堕胎会对其生命或健康构成严重危险。\n\n怀孕与堕胎远非黑白分明之事，它们往往牵动着纷繁复杂的情绪波澜。意外怀孕或许会带来生活危机，但若自主选择终止妊娠，亦能成为化解困境的途径。许多人因此深陷悲伤，只因现实境遇背离了内心所期。\n\n堕胎始终是一个充满争议的议题，相关辩论在社会中不时激荡。在专业领域，助产士、医生与妇科医生热议的焦点之一，便是堕胎治疗质量登记制度。目前，国家卫生福利委员会虽收集相关统计数据，却仅限于年龄段信息，难以将治疗个案与具体诊所相挂钩。反对登记个人数据的声音强调，必须保护接受堕胎手术女性的身份隐私，避免任何形式的泄露。\n\n在瑞典，堕胎法秉持着一种坚定信念：女性最懂得如何主宰自己的身体与人生，她们无需为自身选择辩解。女性选择终止妊娠的主因，往往源于对计划生育的深切渴望。在此背景下，堕胎已成为最普遍的医疗程序之一。"
 SWE_The_1980_Law_on_Succession_to_the_Throne:0 " §11980年§!£GFX_SWE_Kings_laws §i《王位继承法》第八条§!"
 SWE_The_1980_Law_on_Succession_to_the_Throne_desc:0 "未经国王与瑞典议会共同批准，瑞典王室的王子和公主不得通过选举、继承或婚姻等任何方式，在外国担任摄政职务。否则，其本人及其后裔将自动丧失瑞典王位继承权。\n\n本宪法条文取代了原有的王位继承次序，其制定最初是为了规范让·巴蒂斯特·贝尔纳多特当选瑞典王储后的继承顺位，并明确规定王位继承权自他本人开始。然而，1980年的修正案将这一起始点更改为现任国王卡尔十六世·古斯塔夫，从而排除了贝尔纳多特家族其他所有支系的后裔——即便其先祖曾位列当时的继承顺序之中。此项修订旨在防止卡尔十四世·约翰那些此前已被排除在外的后代重新获得继承资格。由于当时国王的子嗣尚未成年，为保留国王的叔叔贝尔蒂尔亲王作为一位成年继承人的实际作用，法律特别设立了一项过渡规则，允许他在卡尔十六世·古斯塔夫的直系后裔之后继承王位。该过渡条款已于1997年贝尔蒂尔亲王逝世后自动失效。\n\n除上述继承顺位的规定外，《王位继承法》亦对王室成员的宗教信仰、婚姻，以及禁止在外国担任摄政等事项作出明确约束。\n\n根据未经修改的《奥格斯堡信纲》与1593年乌普萨拉会议决议，所有王室成员必须信仰福音派路德宗，否则将丧失继承权。此项义务适用于君主、王子与公主。\n\n婚姻条款则规定，王子或公主结婚须同时获得君主与政府的批准，否则将失去王位继承资格。尽管他们可自由选择婚配对象，但若未获上述许可，仍会导致继承权的丧失。君主本人则不受此条款限制。\n\n此外，任何王室成员如未经君主与议会同意，通过继承、婚姻或选举成为外国国家元首，其本人及其后代将永久丧失瑞典王位继承权。"

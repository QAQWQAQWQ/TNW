 ##ideas##
 SWE_European_Lighthouse: "欧洲灯塔"
 SWE_European_Lighthouse_desc: "六十年前，日耳曼的铁鹰曾几乎征服整个欧陆，在它的阴影之下，欧洲颤栗。瑞典虽幸免于战火，却未能摆脱那如芒在背的恐惧，目光始终紧锁南方。正因如此，这个国家守护着它最为完整而淳朴的民主形态。随着福利制度日趋完善，经济稳步向前，瑞典步入了自己的黄金时代。它如一座灯塔，巍然矗立于欧洲北境，以一国之光明，驱散了由钢铁同盟所投下的漫长阴霾。\n\n然而时光流逝，丰裕的福利渐渐显露出沉重的代价。财政负担日益加深，贫富差距过大，昔日的灯塔也随之暗淡。北方的天空下，旧日的阴影从未真正散去。\n\n乌鹊悲啼，北境微明"
 SWE_Peoples_Home_1: "人民之家—债台高筑"
 SWE_Peoples_Home_1_desc: "巨额资金如不竭的江河般源源注入民生支出的浩瀚海洋。在一项又一项政策中，它们逐渐消融，化作了缚在国家与企业身上的沉重枷锁。是的，这正是社民党苦心构筑的“人民之家”，从每个瑞典人呱呱坠地，直至生命逝去，他们的一生都在政府的庇佑之下度过。每一个瑞典人，都发自心底地为这“人民之家”感到幸福与自豪，哪怕如今它已债台高筑。"
 SWE_The_impact_of_European_integrated_economy: "欧洲一体化经济的影响"
 SWE_The_impact_of_European_integrated_economy_desc: "埃兰德时代的漫长帷幕落下后，属于瑞典的黄金岁月也宣告终结。经济增长渐趋停滞，平静的表象之下，社会的裂痕不断加深。与此同时，泛欧经济一体化的浪潮席卷而来，对这个北欧中立国的独特地位构成了严峻挑战。\n\n尽管斯德哥尔摩始终重申其绝对中立的立场，但环顾四周，钢铁同盟的影响无孔不入。在夹缝中，经济独立的姿态日益难以维系，而瑞典仿佛行走在一条渐窄的钢丝上，脚下，是晦暗不明的未来。"

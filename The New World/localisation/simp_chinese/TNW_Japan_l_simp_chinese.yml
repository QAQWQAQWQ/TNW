 JAP_emperor_akihito: "平成天皇"
 JAP_emperor_akihito_desc: "“皇祚连绵兮久长，万世不变兮悠长”——《君之代》\n\n明仁天皇，天照大神之血脉，帝国万世一系之象征，日本国体之代表。经历昭和初年皇道主义下日本的动荡，天皇变的比过去更加沉默寡言，不再轻易对政治事务做出暗示性的行动，而是尽力将政治的实际影响力收缩于宫中。可以说，权力的中心愈发远离天皇为核心的宫中集团，而转移到政党为首的众议院与内阁之下。\n\n明仁天皇相较于历来如空中楼阁般，统御着民众的超然君主，具有更为开明的政治视野与思想。他深刻认识到国家主义与皇道主义对日本政治的威胁性，希望以政党为藩幕维持政治的稳定，以实现即成体制下的“宪政常道”，并恪守作为一个现代国家“机关”的君主规范。但同时，天皇对于政治事务的默然状态，也不由得引起各省内部与民间人士的猜忌。"

 JAP_imperial_way_and_the_nation: "皇道与国家"
 JAP_imperial_way_and_the_nation_desc: "如果说国家主义是日本走向革新与战争的横轴，那么皇道主义就是其相伴而生的纵轴。战前的国家主义谱系，少有脱离皇道主义立场而独立发展的，其革新性与破坏性，也是借助皇道主义外化为行动。大战后至今，皇道主义思想在政治上日益衰落，反之秉承国家革新主义之人士，借助政党崛起的东风，在政坛拥有了自己的一席之地。但同时，军人的返乡与经济繁盛引发的贫富差异，又助长了皇道主义在民间的繁盛。一股可以被称为“反体制”的思想，在右翼青年之中深受欢迎，并在九十年代的危机中得到广泛的传播。\n\n政党革新派并不接受寄居与现有政党之下，皇道主义者也急需政治的宣泄口。以军为中心，广泛的串联式组织不断涌现出来。国家主义者也乐意看到破坏性力量的发展，以借起扩展自己的政治威慑力与合法性。可以肯定的是，一旦现有体制的危机涌现，他们必然将以汹涌之势破笼而出。"

 JAP_military_spirit: "军魂"
 JAP_military_spirit_desc: "皇军失去其自信力了吗？自六十年代政党政治的兴起，帝国陆军逐渐被挤出了权力的牌桌，军人面对民众的无力感，甚至比大正时代更为强烈。在这种背景下，不断有军人自愿放弃身份，加入政党展开政治活动。在军内，新的革新思潮要求军人与政党协调，借此实现军的现代化。许久未战之军早已丧失了旧日的锐气，如此看来，军的精神大抵已随千禧年的钟声遁入尘烟了吧……\n\n军的精神，在于其直属于天皇统制，而绝非私议政利者所能篡夺。如今陆军内外，虽一心协同党人，却未曾忘记皇军之精神。军绝不能只甘愿成为所谓空虚的骸骨，如若寄居于此，又何谈保卫皇体之责任呢？至少在陆军内部，依旧酝酿着落马者的不甘、屈辱亦或是复仇的心理。如此看来，军的精神仍旧存在着……"

 JAP_factional_infighting: "派阀倾轧"
 JAP_factional_infighting_desc: "尽管日本政治在六七十年代的动荡过后，以三大政党为核心逐渐形成了相对稳定的格局，但在议会中心主义体制下，各政党内部并非铁板一块。以党内派阀为基础的政治运作，始终牵动着政局的变动，各种利益主体之间错综复杂的关系，不断冲击着政治体系中最敏感的部分。\n\n执政党不仅要审慎处理与在野党的关系，更需时刻关注党内派阀的动向。九十年代危机后，旨在建立“举党体制”的超派阀运动逐渐兴起，然而，在团结的表象之下，似乎正酝酿着更深层的危机。"

 JAP_reform_bureaucracy_and_political_power: "革新、官僚与政权"
 JAP_reform_bureaucracy_and_political_power_desc: "官僚革新派一词，常被用来形容三十年代至六十年代活跃于日本政坛，并与总动员体制有着千丝万缕联系的“革新官僚”一派。但至政党政治兴起至今，这些技术官僚依然活跃于政坛之上，且以政党形态发挥其影响力，与党人分庭抗礼。其中，\n\n以进步党为官僚革新派之本营，该党部分继承革新官僚一系，奉行修正资本主义之理念，其所属议员多为出身省厅的技术官僚。其人士之主张，在于借助强大省厅之力量，奉行官吏协调之准则，统合并指导国家经济方方面面，以消除自由市场之惰性之官僚指导资本主义。\n\n为实现这样的构想，唯有借助强有力的内阁力量。官僚革新派主张强力内阁，加强对各省厅的统合领导，连结各省次官。但同时，由于各省厅“中心主义”思想并未完全消除，此种构想必然不会安稳落地。"

 JAP_party_officials_collaboration: "党吏协同"
 JAP_party_officials_collaboration_desc: "内务、大藏、外务三省自明治以来即为国政枢要，权柄之重非寻常省厅可比。其长官若非出身本省，亦必与省内官僚网络渊源深厚。长久以来，已然成为“省厅中心主义”之下的政治孤岛。此种政治形势，在大正昭和时期，逐渐成为行政之阻力。官僚与党人之间的矛盾、地方与中央之间的矛盾、中间层与决策层之间的矛盾无时无刻不影响着决策的稳健性，以至于昭和初年之政策失调，引发战端。\n\n六十年代以来，政党政治逐渐完善，以行政官僚出身，并与政党合流者不在少数。其中，以进步党为例，奉行“党吏协同主义”，以行政精英的视角协调党与各省的关系，达成政略的统一，并培植广泛的人脉，这也是其长期执政的关键因素。然则，在野各党与省厅日益脱离，各省的协调依赖于执政党内阁的稳定性。\n\n如若没有有力的协调力量，宪政常道下的政党轮替，或是强力内阁的统合主张，都有可能使得“中心主义”的势头死灰复燃。"

 JAP_house_of_peers: "贵族院"
 JAP_house_of_peers_desc: "贵族院依照《大日本帝国宪法》设立，属于日本国会两院中的上院。由非民选的皇族议员、华族议员、敕任议员所构成，不实施解散制度，议员多数是终身任期。\n\n七十年代改革以来，贵族院逐渐放弃超然主义、保守主义思维，转为奉行协调主义，保持与众院及政党内阁的良好关系。成为长期政党内阁“两院纵断”主义的坚实一环。近年来，具有开明务实思想的华族议员、敕任议员人数不断增加，相信在不远的未来，贵院也会呈现焕然一新的局面。\n\n\n\n————————————— \n\n— 当前贵院最大派阀 : 火曜会\n\n— 当前贵族院议长 : 近卫忠辉\n\n\n\n\n\n\n\n             £GFX_Kizoku_in_gicho_Konoe_Tadateru\n\n\n\n\n\n"

 JAP_house_of_representatives: "众议院"
 JAP_house_of_representatives_desc: "众议院依据《大日本帝国宪法》设立，属于日本国会两院中的下院。议员由选举产生，任期为4年，设有中途解散制度，内阁总理大臣拥有向天皇提请解散众议院的权力。\n\n众议院在过去长期处于政治上的劣势，受到贵族院、军部及枢密院等保守主义势力的压制。战后，政党势力重回政治中心，众议院的影响力也不断增加，成为国家机关中较为有实力的一极。\n\n\n\n————————————— \n\n— 当前众议院最大党 : 进步党\n\n— 当前众议院议长 : 渡部恒三\n\n\n\n\n\n\n\n             £GFX_Shugiin_gicho_Kozo_Watanabe\n\n\n\n\n\n "
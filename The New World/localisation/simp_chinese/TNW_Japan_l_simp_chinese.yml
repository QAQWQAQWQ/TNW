 JAP_Koichi_Kato: "加藤紘一"
 POLITICS_KOICHI_KATO_DESC: "“高堂之上，谁人呓语”\n\n大东亚战争既胜，英美鬼畜终被驱除，亚细亚民族自立之理想，似已告成。然则，帝国上下，沉醉虚骄，渐忘创业之艰。环顾亚太，民生凋敝，贫穷日甚，所谓共荣圈者，徒悬一纸空言，实利全无。当此之际，有识之士起而务实，池田勇人氏之宏池会，便是其中代表。其志不在夸诞，而在践履。经大平正芳，宫泽喜一数人，斯道传承，至于加藤紘一，遂以真正之泛亚主义自任，欲令共荣之名，副共荣之实。\n\n加藤紘一，遂以真正之泛亚主义自任，欲令共荣之名，副共荣之实。\n\n加藤紘一其人，少时入外务省，观四海之经纬，通国际之事故。旋负笈渡海，亲赴南京，就读于国立中央大学，博采唐地之学，亦深感日华亲善之可贵。其才为宫泽喜一所深赏，引为心腹。及归，入宏池会，以少壮之姿崛起，终成一派领袖。时值森喜朗氏失脚，朝野震动，群议汹汹，政坛亦乌烟瘴气，加藤遂受命于危难，出为内阁总理大臣。\n\n其为政也，主政治改革，整肃积弊；厚民生，修福利，不尚空谈。尤倡泛亚主义，力主裁军，以为帝国不可恃力凌人，共荣圈诸国当平等相待，互利共存。此举在帝国政坛可谓特立独行，迥异于流俗。然持节者往往孤鸣——保守派责其软弱，谓其有损国威；国家革新主义者目为通敌，讥其背弃皇国。内外交谤，左右为难。内阁之内，阁僚各怀心思，政令难行；党人掣肘，派阀阴霾蔽日。试看霞关，官僚貌合神离，阳奉阴违；大本营内，军部尤颐指气使，骄奢淫欲。至于天皇陛下，则超然物外，端居深宫，未尝一语明示支持。\n\n然其志未泯。每登坛演说，必言：“吾所愿者，真正繁荣之大日本帝国，真正繁荣之亚细亚。”此语传布四方，国民中颇有闻而感奋者，以为黑暗官场中一线曙光。然内外之复杂局势实为棘手，内阁亦根基尚浅，加藤一人撑持，步履维艰。不过，正所谓天无绝人之路，机遇非无也。若把握稍纵即逝之机，转危为安，反败为胜，则未始不可有为。加藤氏深知此理，故虽处荆棘之中，四面楚歌，未尝一日言弃。彼所待者，惟一时耳。时来则运转，志坚者终克其难。帝国前途，或系于此一人之肩。"

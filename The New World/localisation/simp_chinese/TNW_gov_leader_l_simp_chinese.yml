SER_government_leaders_tt: "§W[THIS.GetAdjective]§!国王陛下"
POLITICS_ANDREW_I_DESC: "国王陛下:§H安德鲁一世§!\n\n\n\n\n\n\n\n       £GFX_SER_king_Andrew_I_HM \n\n\n\n\n\n\n§H赖上帝之恩佑与人民之意志，塞尔维亚国王-安德鲁一世。§!\n§W--------------§!\n安德鲁·卡拉乔尔杰维奇，彼得一世之孙，南斯拉夫王国君主亚历山大一世·卡拉乔尔杰维奇与罗马尼亚公主玛丽亚·卡拉乔尔杰维奇的第三子。遵父命，王子生于布莱德，受洗时取斯洛文尼亚之名。“安德鲁”亦为塞尔维亚之名，在塞尔维亚东正教圣年中占有一席之地，于基督教传统与文化中意义深远——因它是耶稣基督首位使徒之名。故此，众人视此王子以圣人之名受洗，而这位圣人，正是卡拉乔尔杰维奇家族庆洗礼所敬奉者。\n\n国王陛下毕业于剑桥大学克莱尔学院数学系，继彼得二世之位，为其兄抵抗德国之举多次致歉。陛下性情温和，在这片塞尔维亚土地上，他对万事万物皆无炽热之情。他如同一块沉重的石头，就在那里，一块沉默的太阳石。在他身上，什么也不曾发生，正如一块太阳石那般。至于塞尔维亚，他只愿这个国度如他一般，承袭他的品格。只是塞尔维亚终将驶向何方，至今仍是个谜题。"
ITA_government_leaders_tt: "§W[THIS.GetAdjective]§!皇帝陛下"
POLITICS_EMANUELE_IV_DESC:  "皇帝陛下:§H维托里奥·埃曼努埃莱·迪·萨伏伊§!\n\n\n\n\n\n\n\n             £GFX_ITA_Emperor_Vittorio_Emanuele       \n\n\n\n\n\n\n§H承蒙上帝恩典与民族意志，意大利、埃塞俄比亚皇帝，撒丁、耶路撒冷及亚美尼亚国王、阿尔巴尼亚国王萨伏伊公爵。维托里奥·埃曼努埃莱四世§!\n§W---------------------------------------------------------------------------§!\n顺从神，不顺从人，是应当的。\n\n你们为主的缘故，要顺服人的一切制度——或在上的君王，或是君王所派罚恶赏善的臣宰……务要尊敬众人，亲爱教中的弟兄，敬畏神，尊敬君王。\n\n在上有权柄的，人人当顺服他；因为没有权柄不是出于神的，凡掌权的都是神所命的……掌权者并非空空佩剑，他是神的用人，伸张赏善罚恶之职。帝王藉我坐国位，君王藉我定公平；王子、首领和世上一切的审判官，都是藉我掌权\n\n然而有一婴孩为我们而生，有一子赐给我们；他名称为奇妙策士、全能的神、永在的父、和平之君，这所指的，乃是那终极的、非地上的君王。"
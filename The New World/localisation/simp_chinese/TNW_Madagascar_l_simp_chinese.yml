 Prosperous_all_over_the_world: "四海惟扬"
 Prosperous_all_over_the_world_desc: " §Z“今朕必往，‌我武惟扬‌，侵于之疆，取彼凶残，我伐用张，于汤有光。”《尚书·泰誓中》§!\n\n东亚战事方息，反殖民之潮已如惊雷骤起，自印度始，奔涌四方，声震八荒。西方殖民统治在各地民众的激昂浪潮中相继倾覆，时代更迭之势不可阻遏\n\n随之，三民主义之光如破晓晨曦，遍照诸邦，为觉醒之民所接纳、所践行，成为凝聚人心、共向未来的思想之树。\n\n列国皆以此精神为养分，孕育独立自强之愿景，推动命运相连，此实为时代之幸。"
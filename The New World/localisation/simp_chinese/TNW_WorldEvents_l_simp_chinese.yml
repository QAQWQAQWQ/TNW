##### #SPA-basque_war# #####
 Spa_WORLD.1.t:"巴斯克战端再起"
 Spa_WORLD.1.d: "位于坎塔布连海海域的多日紧张对峙在今日最终爆发，随着巴斯克与西班牙两方海军舰艇相撞，局势骤然升级，\n\n今日凌晨，西班牙海军驱逐舰向巴斯克首都发射导弹，巴斯克与西班牙边境也发生大规模交火，在爆炸袭击发生后，大日耳曼国与法兰西国相继对西班牙的攻击行为进行谴责，并在边境集结兵力，并表示随时响应盟友巴斯克共和国的呼唤，\n美国国防部发言人表示双方都应进行克制，以谈判而非武力来管控局势，但据情报显示，驻西班牙美军已经进入一级战备状态"
 Spa_WORLD.1.a: "联系五角大楼 密切关注德国人动向"

 #Manchoukuo evet#
 TNW_WORLD.2.t: "崔圭夏逝世"
 TNW_WORLD.2.d: "清晨六时，大满洲共和国现任总统崔圭夏在新京建国医院中突然昏迷，医生立马进行抢救，院方实施心肺复苏等全力救治，最终未能挽回生命。建国医院对外通报称，其多年患有老年性心脏病与循环系统疾病，突发心脏病为直接死因。\n\n大满洲共和国政府当晚召开临时委员会议，依照《总统葬礼与国民葬礼相关法律》，决定为崔圭夏举行总统葬礼，遗体最终安葬于新京忠贞志士墓园。\n大满洲共和国政府新认命原国家总理，国民委员大会副主席岩里正男现任就职国家总统。"
 TNW_WORLD.2.a: "致以崇高敬意"
 
 TNW_WORLD.3.t: "谷恒祯一继任总统"
 TNW_WORLD.3.d: "在岩里政男总统任期结束后，政府任命了以绝对票数优先的国家委员大会成员谷恒祯一部长作为新的总统人选。\n\n早在之前，谷恒祯一以政治新星位居于政界，名门望族的身份加上优秀的履历让他在政界一时风光无限，此次获选总统或许早就不意外了，也有人称，这是一次满洲共和国政治格局的重新洗牌，可能意味着更多年轻人会出现在政府中。\n\n“我将为国家奉上我的一切，我担任总统，是为满洲，也是为东亚，更是为这千千万万生活在这片土地上的人民。”"
 TNW_WORLD.3.a: "似乎没什么变化…"

 TNW_WORLD.4.t: "委员大会垮台，国民联合获选"
 TNW_WORLD.4.d: "国民联合，这一由进步党和宪政委员合并的组织，把自从革命后就长期执政的国家委员大在选举中击败，国民联合主席蔡英文担任总统。\n\n作为为长期活跃于满洲共和国的左翼人士，蔡英文提倡的政治措施与国内政策背道而驰，对手抨击她是美俄的间谍，尽管如此，事实已经摆在面前，那些意异者也只好接受事实，而对于她人而言，这只是一小步。"
 TNW_WORLD.4.a: "黑土地的民主"
 
 TNW_WORLD.5.t: "岩里政男继任总统"
 TNW_WORLD.5.d: "在第一任任期结束后，通过自己在大会绝对的权威以及资历，岩里政男成功的赢得了第二任获选。\n\n有外国媒体声称，岩里政男试图效仿朴正熙，而更多的是有人将他频繁与其他在野党民主人士现下会见，并且双方之间亲密的举动惊叹，有人试图解读为这是国家委员大会公开贿赂收买，其他在野党，更有人将其解读为这是满洲共和国试图营造出的官方反对派。"
 TNW_WORLD.5.a: "暗流涌动…"
 
 TNW_WORLD.6.t: "共和国进入戒严状态，紧急状态委员会成立"
 TNW_WORLD.6.d: "凌晨一时，新京广场国会大楼附近发生爆炸，死亡十一人，伤者未估计，现场疑似有着装为境外恐怖分子“反满群众革命统一战线”成员。\n\n凌晨四时，由序才高少将率领新京特别市第五分区陆军进驻国会，声称国会暂时封锁，进入戒严状态，成立国家紧急状态委员会，取缔一切政党，由满洲共和国军负责一切政务要求。\n\n次日，序才高少将发表声明，此次恐怖袭击事件已明确为境外通俄恐怖分子“反满群众革命统一战线”所为，国家机器由紧急状态委员会暂时掌控。"
 TNW_WORLD.6.a: "真假无需分辨…"

 TNW_WORLD.7.t: "联合国安理会就印尼局势举行磋商 日本阐述原则立场"
 TNW_WORLD.7.d: "安理会今日就印度尼西亚当前局势召开非正式会议。据外交人士透露，日本常驻联合国代表东乡和彦在发言中明确阐述了东京方面的核心立场，引发各方关注。\n\n日方代表首先强调，尊重国家主权与不干涉内政是联合国宪章的基本原则，印尼内部政治进程应由印尼人民自主推进，国际社会不应强加外部方案。日方同时指出，作为一个地处关键海上通道的区域大国，印尼的稳定对东南亚整体安全环境具有重要影响，也与东亚各国共荣互利框架下的区域合作息息相关。\n\n分析人士指出，日本此次表态延续了其一贯的外交风格：在原则问题上明确站位，在实际行动上保持审慎，既展现了对区域稳定的关切，又避免被卷入他国内部事务。这一立场被认为旨在平衡共荣圈框架内的合作义务与不干涉原则之间的张力。"
 TNW_WORLD.7.a: "南洋必起风波…"
 TNW_UN_TT: "缓兵之计，逆流而上"

 TNW_WORLD.8.t: "经济秩序宣言正式通过，日美关系缓和"
 TNW_WORLD.8.d: "为期一周的联合国未来峰会于纽约联合国总部拉开帷幕。大会通过了《经济秩序宣言》及其附件，旨在进一步夯实多边主义基石，顺应时代发展潮流，携手构建一个安全、和平、公正、平等、包容、可持续与繁荣的世界。\n\n此宣言的诞生，意在缓和日美两国间的紧张关系，开放市场，以推动双方深化合作、化解冷战对峙的锋芒。我们郑重宣告：决心刻不容缓地建立一种崭新的国际经济秩序——这一秩序须植根于一切国家待遇公平、主权平等、相互依存、共同受益与协力合作的原则之上，无论其经济制度与社会制度如何。唯有如此，方能矫正世间种种不平等与不公，消弭发达国家与发展中国家间日益扩大的鸿沟，切实保障当代人与后代人的福祉，稳步加快经济与社会的发展，弘扬和平与正义\n\n为此，我们谨声明——日方代表强调，近数十年来最宏伟的成就，莫过于一大批民族与国家挣脱殖民统治与外来支配，相继赢得独立，昂首步入自由民族之林。与此同时，三十年来，人类在经济活动的各个领域取得了长足的技术进步，这为增进世界各国人民的福祉与康乐，提供了坚实而可靠的潜在力量"
 TNW_WORLD.8.a: "如今，它力图使平等状况万古长存"
 TNW_Japan_US_relations_TT: "它能创造更好的条件，使全世界各国人民都赢得一种符合人类尊严的生活"

 TNW_WORLD.9.t: "联合国召开反恐会议"
 TNW_WORLD.9.d: "近日，联合国在纽约总部召开高级别反恐会议。这是联合国历史上首次举办的全球性反恐专题会议，议题涵盖全球反恐战略、伊斯兰极端主义遏制、反恐国际合作等诸多领域。\n\n会上，印度总统苏布拉塔·鲍斯指出，全球伊斯兰恐怖主义威胁正变得愈发复杂，其活动早已突破国界，呈跨国蔓延之势。唯赖国际社会同心协契、携手合作，方能织就一张有效的反恐之网。他呼吁各国凝聚共识，构筑更加紧密的反恐伙伴关系，共同制定并切实施行全球反恐战略。\n\n他表示，伊斯兰恐怖势力往往借阿富汗局势动荡之机死灰复燃，进而侵扰印度边境。但印度人民已下定决心，不惜一切代价，将恐怖主义彻底逐出国门——印度与伊斯兰恐怖主义之间的这场战争，永无休战之日。"
 TNW_WORLD.9.a: "我们将永远为印度的独立与自由而斗争"
 TNW_Counter_terrorism_conference_TT: "盖世界各国各得其所，万邦相倚相扶共享共荣之乐，乃确立世界和平的根本"
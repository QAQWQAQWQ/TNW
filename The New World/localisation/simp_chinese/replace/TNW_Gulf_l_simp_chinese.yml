 TNW_Gulf_event.1.t: "蓄势待发"
 TNW_Gulf_event.1.desc: "夜幕降下的黎明大厅里没有灯光，只有远处法拉赫堡军营方向偶尔亮起的探照灯，拉长了旧海关仓库里摇晃的人影。空气中弥漫着发霉的椰枣筐、机油以及潮湿海风带来的盐腥味.\n\n哈利法趴在二楼靠窗的木百叶窗后，指关节因为死死攥着那把老旧的卡尔卡诺而有些发白。木枪托已被海湾的湿气浸得发胀，上面的刻痕记录着它在巴尔干和北非的流转轨迹。但现在，枪背带上的意大利皇家陆军徽记已被用刀尖剔得一干二净。\n\n“他们真的在撤了？”\n\n靠在砖墙旁的贾西姆压低了声音，手上不停地往布弹带里塞着一枚又一枚的步枪弹。他的衬衫袖子高高卷起，露出在以前在炼油厂烧伤后留下的恐怖疤痕。意大利从海湾撤军的消息给了每个为自由解放而战的战士一针强心剂，罗马这头衰老的狮子终于再也没有力气巡视它的领地，帝国在波斯湾柔弱的侧翼正在像一块晒干的无花果饼一样碎裂。\n\n“海关大楼的电台半小时前就停了。”哈利法没有回头，紧张的目光从拥挤的撤离车队巡向港口的军舰。突然，他的眉目舒展，得意地扬了扬下颌“看那边，总督府那块破布灰溜溜地降下来了。”\n\n连接帝国与殖民地的脐带被切断了。极权统治的铁靴一撤走，留下的不是和平，而是一个散发着血腥味的权力真空。自由不会随着殖民者的撤退悉数奉还——它只能由工人自己的双手去夺取。从迪拜的废弃仓库到荒漠的游击据点，一队接一队的工人武装整装待发，只待一声简洁干练的命令。\n\n阿拉伯湾的潮水正拍打着海岸，不声不响。黎明前的黑夜最是沉寂，但所有人都知道，一场将彻底重塑海湾格局的暴风雨，已经在地平线上积聚完毕。"
 TNW_Gulf_event.1.a: "我不愿再做那沉默的羔羊"

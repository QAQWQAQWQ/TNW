 TNW_Gulf_event.2.t: "蓄势待发"
 TNW_Gulf_event.2.desc: "夜幕降下的黎明大厅里没有灯光，只有远处法拉赫堡军营方向偶尔亮起的探照灯，拉长了旧海关仓库里摇晃的人影。空气中弥漫着发霉的椰枣筐、机油以及潮湿海风带来的盐腥味.\n\n哈利法趴在二楼靠窗的木百叶窗后，指关节因为死死攥着那把老旧的卡尔卡诺而有些发白。木枪托已被海湾的湿气浸得发胀，上面的刻痕记录着它在巴尔干和北非的流转轨迹。但现在，枪背带上的意大利皇家陆军徽记已被用刀尖剔得一干二净。\n\n“他们真的在撤了？”\n\n靠在砖墙旁的贾西姆压低了声音，手上不停地往布弹带里塞着一枚又一枚的步枪弹。他的衬衫袖子高高卷起，露出在以前在炼油厂烧伤后留下的恐怖疤痕。意大利从海湾撤军的消息给了每个为自由解放而战的战士一针强心剂，罗马这头衰老的狮子终于再也没有力气巡视它的领地，帝国在波斯湾柔弱的侧翼正在像一块晒干的无花果饼一样碎裂。\n\n“海关大楼的电台半小时前就停了。”哈利法没有回头，紧张的目光从拥挤的撤离车队巡向港口的军舰。突然，他的眉目舒展，得意地扬了扬下颌“看那边，总督府那块破布灰溜溜地降下来了。”\n\n连接帝国与殖民地的脐带被切断了。极权统治的铁靴一撤走，留下的不是和平，而是一个散发着血腥味的权力真空。自由不会随着殖民者的撤退悉数奉还——它只能由工人自己的双手去夺取。从迪拜的废弃仓库到荒漠的游击据点，一队接一队的工人武装整装待发，只待一声简洁干练的命令。\n\n阿拉伯湾的潮水正拍打着海岸，不声不响。黎明前的黑夜最是沉寂，但所有人都知道，一场将彻底重塑海湾格局的暴风雨，已经在地平线上积聚完毕。"
 TNW_Gulf_event.2.a: "我不愿再做那沉默的羔羊"
 TNW_ready_to_spring_into_actionv_TT: "§x我要做那一日愤起的雄狮§!"

 TNW_Gulf_event.3.t: "紧急状态"
 TNW_Gulf_event.3.desc: "绝密\n仅供联邦总统阅览\n\n工人武装组织叛乱紧急事态报告\n请求立即支援\n\n--联邦内政部\n\n1.自意大利武装部队撤军以来，各地反政府情绪死灰复燃，由工人武装组织为首的反政府团体活动愈发频繁，多地公权力机关遭受冲击，偏远地域已陷入零星交火的局面。\n\n2.仅靠现有的警察部队规模，我方暂时无法填补由意大利撤军而造成的广泛权力真空，多地治安局势无法有效掌握，治安网络无法有效覆盖。根据意大利方面的情报，目前的骚动极有可能在未来72小时内升级为全国范围的武装叛乱。\n\n3.我部门呈请立即召开联邦安全会议，并尽快宣布进行全国范围戒严。建议将有限之警力优先派遣保卫中心城市与沿岸石油基地，同时向国际上各利益相关方陈明利害、请求支援。\n\n愿真主保佑。"
 TNW_Gulf_event.3.a: "这帮无法无天的共匪……"
 TNW_state_of_emergency_TT: "§x事端早已进入不可掌控的阶段§!\N\N§Z总统已经下令戒严§!\N§Y部署更多警力§!§Z的新决议已解锁§!"

 TNW_Gulf_event.4.t: "螳臂当车"
 TNW_Gulf_event.4.desc: "赛义德蜷缩在抛锚的巡逻车角落里，豆大的汗珠从不合尺寸的防暴盔间滴落，打在他皲裂的手上。空气里弥漫着浓烈的刺鼻气味，混杂着火药燃尽后残留的硝烟、烧焦的橡胶，以及从街角废墟里飘出的令人作呕的皮肉焦臭。\N\N车载电台里正发出刺耳的电流噪音，夹杂着前指断断续续的焦急呼喊：\N“……请求派往第4路口的增援呢？回答……重复，防线……”\N\N刺啦一声，电台彻底断电了。蓄电池耗尽了最后一丝力气。\N\N赛义德已经懒得去搭理任何试图进入他大脑的信息。就在两个星期前，他还在街头维持着那相对体面的秩序，仗着自己微小但够用的职权在小妓院里醉生梦死；现在他只想一脚油门逃离这该死的防区，混进迪拜的撤侨队伍，去到世界上任何一个离这儿几万里的地方。\N\N“赛义德！快开枪！他们从巷子里绕过来了！”他的搭档易卜拉欣跌跌撞撞地从前方的水泥民房里跑出来，警服被扯破了一半，手里死死攥着一支打空了弹匣的贝雷塔AR70。一同下车的六人小组只剩他一个，脸色惨白，嘴唇抖得厉害，连腿都在打颤。\N\N话音刚落，一颗流弹随着呼啸声将巡逻车的后视镜打了个粉碎，易卜拉欣将枪一扔，扑通一声抱着头趴倒在地上。\N\N紧接着，街角灰白色的硝烟中，黑压压的人影涌了出来。赛义德挤在车窗下方探出枪去，瞄向那无数张在火光映照下的脸，手指颤抖地搭在扳机上，只要他轻轻一扣，那一张张年轻的脸便会倒下，就像过去每一次驱散罢工时那样轻而易举——但他没有，或许出于恐惧，或许出于绝望，赛义德脑海中的思绪突然逃避似的闪过了空白。突击步枪从他的手中无力地滑落，他喘着粗气，倚着车门瘫软了下去，只能听见急促的心跳附和着耳畔的嗡鸣。\N\N几秒钟后，潮水般的人群将这辆抛锚的巡逻车彻底淹没。赛义德感觉到几双手将他从车里拖出来，没有审判，没有枪声，只有无数双粗糙的手将两个人推向路边。直到风慢慢地吹过，他才发现他的裤子湿了。"
 TNW_Gulf_event.4.a: "“玩什么命啊。”"
 TNW_futile_resistance_against_TT: "§Z“我还活着.....我还活着.....”§!"
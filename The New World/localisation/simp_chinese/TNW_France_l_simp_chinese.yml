 FRA_Francois_Durand:0 "弗朗索瓦·杜朗·德格罗苏夫尔"
 FRA_Francois_Durand_hog_desc:0 "§Y国家总理\n法团国家主义§!\n--------------\n曾为达南德麾下一员，德格罗苏夫尔却有意将这段过往深埋。原因不言自明：民兵派系已败于布斯凯之手，达南德失势，人走茶凉。他虽也结识了密特朗，却并未选择加入其缔造的公约俱乐部，反而转身投向以极端著称的钟表俱乐部。凭借深厚的资历与绵密的人脉，他很快在此赢得尊敬，并在一众极端分子的拥戴中，走向台前。\n\n依靠自身经营多年的关系网络，他竟成功挫败了密特朗暗中罗织的阴谋，一举粉碎了针对钟表俱乐部的分化图谋。此举使他在派系内部的声望抵达顶峰，却也意味着与密特朗的彻底决裂，整个派系由此遭受牵连。派系斗争虽告胜利，钟表俱乐部史上首次有人出任国家总理，德格罗苏夫尔在鲜花与簇拥中，坐上了总理的交椅。\n他看见簇拥在身旁的笑脸，也瞥见角落里那些无声排挤的目光；他望进一双双闪烁的眼睛，深知其中尽是各怀的打算。在衣香鬓影之间，在举杯寒暄之际，他忽然清晰地感受到，自己的人生已然转变。不是在战场，也非在议会，而是在这片精致而虚伪的浮华深处，悄然而确切的发生了转变。\n\n只是，今日鲜花满途，明日又将如何？"

 FRA_Roland_Dumas:0 "罗兰·杜马"
 FRA_Roland_Dumas_for_desc:0 "§Y外交部长\n进步主义§!\n--------------\n在公众的普遍认知中，一个曾参与抵抗运动、并以武力反对过新政权的人，想要在此后的政权中占据一席之地，几乎是天方夜谭。然而，罗兰·杜马却打破了这一铁律，他不仅跻身权力核心，更成为前总统密特朗的亲密盟友。若追根究底，或许可归因于其抵抗经历在身份政治中的特殊价值，抑或是与权力上层的紧密纽带。对某些人而言，隐藏过往、洗白上岸从来不是难事，杜马正是这样的例子。\n\n刑满获释后，杜马结识了当时任职于维希政府的密特朗，二人结为密友。随着密特朗创立公约俱乐部并逐步掌握大权，杜马也获得提拔，先后出任国务部长与外交部长，跻身政坛高层。然而，在公约俱乐部之外，他在党内并未获得广泛接纳，甚至受到密特朗核心圈子的排挤。如今，当权总统与他派系不同，而本应同舟共济的阵营内部也离心离德。作为党的元老，杜马仿佛只能日复一日静坐于高位之上，等待下一个来接替自己的人。\n\n这一切，又有谁真正在意？除了他自己"

 FRA_Jean_Louis_Debre:0 "让-路易·德勃雷"
 FRA_Jean_Louis_Debre_eco_desc:0 "§Y内政部长\n家长式发展主义§!\n--------------\n提起路易·德勃雷，人们首先想到的往往是他的父亲米歇尔·德勃雷，以及那个在政治史上盘根错节的德勃雷家族。自幼，他便浸润在家族深厚的政治氛围中，在父亲故旧的扶助下顺利取得法学学位，随后步入政坛。因缘际会，他结识了莫里斯·帕蓬，并开始为其效劳。然而，他能出任内政部长，远非仅靠这段关联。作为冬赛馆系中与企业联合会纽带最紧密的人物，争取他的支持，对派系而言无疑利大于弊。\n\n然而在冬赛馆系内部，并非人人都对他心悦诚服。身为宪法规范化的主要倡导者之一，他既不见容于激进派的视线，也难获所谓正统派的真正认可。但身兼党务管理之责，让-路易·德勃雷并无多少余裕去经营人心、收服众意。他必须安抚那位日渐年迈的总统，平息派系间无休无止的争执，更要处理成堆重复而繁琐的公务。倘若一切问题真能凭言语化解，他的处境或许会轻松得多。"

 FRA_Ernest_Antoine_Seilliere:0 "欧内斯特-安托万·塞利埃"
 FRA_Ernest_Antoine_Seilliere_sec_desc:0 "§Y财政部长\n企业国家§!\n--------------\n塞利埃家族的历史可追溯至法兰西帝国时代，罗马男爵的头衔，便是其世家荣光的见证。欧内斯特-安托万·塞利埃自幼便沐浴在这份绵延的辉光之中。他的履历丰富得近乎无可挑剔：攻读法学，毕业于国家行政学院，参加阿尔及利亚战争并立下战功。退役后，他结识了若斯潘，与之共事，随后加入政党，走进中央联盟的权力网络\n\n至此，这似乎只是一个出身显赫、经历完整、从基层起步的政治精英的典型叙事。然而，欧内斯特-安托万·塞利埃从不只是一位政治家，他同时是企业运动的主席，是法国财阀在政治前台的化身。他坚决反对历届政府任何挑战财阀地位的政策，也始终乐意出征，成为中央联盟手中一枚棋子、一位先锋，被推向前台，挑战那位日渐年迈的总统。\n\n至于塞利埃本人究竟作何想，或许并不重要。罗马男爵只在意自己的利益，其次是他所代表的财阀的利益。至于其他人的得失，从来与他无关。"


 POLITICS_ANDRE_BETTENCOURT_DESC:0 "在这间承载着法兰西最高权力的办公室里，总统贝坦库尔正享受着一天中为数不多的宁静。2002年被证明是他的幸运之年，先凭深厚的资历与绵密的人脉，在激烈的权力角逐中登上总统之位；随后，经济的持续增长与非洲殖民战事的胜利，进一步巩固了他的权威。他点燃一支烟，任神经在袅袅烟雾中渐渐松弛，目光投向窗外徐徐沉落的夕阳。暮色温柔，却将他的思绪拉回了几十年前的那个夜晚\n\n安德烈·贝坦库尔，这个名字在法兰西政坛的激荡长河中，曾并不响亮。他时常被忽视，尽管出身外交部，曾有机会与德国人及阿贝茨会面，但在罗沙个人威望的笼罩下，整个外交部都显得黯淡，贝坦库尔更像一个默默无闻的普通文官。然而，命运总有转折。1988年的那个夜晚，他获得了老相识弗朗索瓦·密特朗总统的提名，出任外交部长。长期积累的人脉、深厚的资历与娴熟的政治技艺，终使他如鱼得水，一路前行，直至坐上这总统之位。\n坦白而言，在法兰西民主社会共和国担任总统并非易事。激烈的党争、殖民地的纷扰，常使总统宝座如坐针毡。然而贝坦库尔的任期至今还算风平浪静。这赋予了他更多信心，在他这第一任，也或许是最后一任的执政岁月里，他愿引领法兰西走向复兴，为自己留下一个至少“中上”的历史评价\n\n只是，未来……真的会一直如此平静吗？"

 FRS_millennium:0 "千年"
 FRS_millennium_desc:0 "§Q“在光明的日子里，我与你们同在，在黑暗的日子里也将如此……”—菲利普·贝当§!\n\n自世界大战落幕，欧洲大陆迎来了崭新的局面。面对这百年未有之变局，曾受英美强权压制的诸国，纷纷挣脱旧秩序的枷锁，在钢铁同盟的扶助下，建立起属于本民族的独立国家。\n\n于此，同盟三大国功不可没,而对欧洲各国的新一代青年而言，钢铁同盟为他们指明了清晰的道路：为建立一个属于欧洲人的欧洲而奋斗。三大国的青年尤应肩负重任，成为这场伟大征程的表率\n\n无人怀疑，亦无人反对。新时代的欧洲必将向着更光明的未来坚定前行。法兰西的子民，愿为此大业鞠躬尽瘁，奋勇当先，直至永恒，直至千年。"

 FRS_Party_strife:0 "党争纷沓"
 FRS_Party_strife_desc:0 "§Q“但我确信你们会原谅我，因为你们知道，我活着和奋斗，仅仅是为了你们。”—皮埃尔·赖伐尔§!\n\n法兰西民主社会共和国，严格而言，从未成为一架运转精密的行政机器。早在赖伐尔总统主政之时，党争之势便已汹涌难抑，撕裂朝野。五十年代动荡过后，布里农总统虽力图改制，然巴黎合作者与维希旧部离心离德，中央政令难出宫门，地方在野党声势日隆，府内反对派更借机倾轧，使国事愈如乱麻\n\n当此危局，布斯凯总统临危受命，以铁腕暂遏分崩之祸，将几近内乱的法兰西从深渊边缘拉回，终使联盟得以初定,然地方政府尾大不掉，来自四方八方的同志，往往与中央意志若即若离。戡乱虽平，境内依旧派系林立，阵线、人民党、行动党及各系民兵彼此倾轧，纷争不息，令人徒叹奈何\n\n自英伪政权覆灭，法兰西民主社会共和国踉跄步入新千年。布斯凯虽不知后人能否弥合这裂痕，仍毅然放手，将毕生奋斗所凝的政治基业托付后继。惜勒盖总统资望不孚，无力愈合联盟旧创，先总统心血渐付诸东流。直至新世纪钟声敲响，法兰西依旧在这纷沓不绝的政争漩涡中，喘息前行。"

 FRS_The_river_is_going_downhill:0 "稻田休耕，江河日下"
 FRS_The_river_is_going_downhill_desc:0 "§Q“他那灰色的眼睛投给我们一个美丽的眼神，那不是昏聩老者的目光，而是1940年海报上曾出现过的那种美丽的凝视……”—Dr. Schillemans§!\n\n法兰西民主社会共和国的农业现代化之路，曲折坎坷，步步维艰。举国上下对此争议不断，农民党、农业党乃至人民党皆纷纷指摘，批评政府一意孤行，漠视乡土民心，致使城乡之间裂隙日深。政策推行处处掣肘，步步受阻，如行泥泞。布斯凯总统以铁意强行推动此业，终令法兰西农田面貌为之一新，而自身亦心力交瘁，难以为继\n\n此后，百姓果腹之忧虽去，小农渐裕，市民商贩皆享其惠，然大规模的离乡潮也随之而来。城市屋宇难承其重，住房之困日益严峻。政府虽屡欲缓解此番阵痛，然大势滚滚，非人力可全挽。无数农民在历史的转折中被迫离根，城乡之间旧怨未解，新隙又生\n\n值此新千年之交，国家正处于转型的湍流之中。唯愿国人同心自强，共赴时艰，于裂痕之中寻觅前路。"

 FRS_Only_the_best_and_the_most_focused:0 "惟精惟一，允执厥中"
 FRS_Only_the_best_and_the_most_focused_desc:0 "§Q“今日凋敝的法兰西，不日将重披绿装，再绽繁花。愿你们青春的春天，不久将在法兰西复兴的春天里尽情绽放。”—菲利普·贝当§!《致法国青年的讲话》\n\n一九四六年行宪之后，法兰西民主社会共和国的重建大业渐次落成。技术官僚被大量启用，十年和平，十年建设，十年发展，三十年间成绩斐然。然而复兴之路从来艰险——上有高官贪墨，中有酷吏横征，经济成长往往沾染黎庶血泪；兼以殖民地战事绵延不绝，民生复苏屡屡受挫。\n\n直至勒盖总统时期，国民经济方步入稳步向上之轨道。迨至九十年代乃至新千年初叶，法兰西民主社会共和国经济大体趋于稳定：财阀之势得以遏制，市场逐步开放，社会保障体系初建，社会矛盾亦不似往日尖锐\n\n今日之法兰西，虽步履仍显沉重，却已真正站稳身形。昔日累累伤痕，渐被时光抚平；未来之路，纵然漫长，却终可抬头眺望。"

 FRS_Unpolished_Gold_and_Jade:0 "有才韬藏，浑金璞玉"
 FRS_Unpolished_Gold_and_Jade_desc:0 "§Q“他不再有可能为法国做更多……但他绝对有义务不做任何可能玷污他声誉的事……”—加布里埃尔·布吕内顿§!\n\n纵览古今，自凯撒北伐以来，高卢子弟的军队便以强悍战力著称于世。太阳王的辉煌与皇帝陛下的赫赫战功，皆印证了法军悠久而彪悍的传统，其战斗素养与意志，如铁如钢；其服从、忍耐与坚定，为法兰西奠定了今日疆域之基。一九四四年还都以来，法军得以重建，赖伐尔总理曾亲自检阅这支承载法兰西新希望的队伍。至正式行宪之时，军队已初具规模\n\n然较之往昔，法军近年亦颇受掣肘。昔日收编的散兵游勇及殖民地部队，一度拉低整体素质，军誉蒙尘。重整军容，刻不容缓。布斯凯总统任内，大力裁汰冗弱，整顿编制，海军与空军获得长足发展，横行殖民地的盗匪气焰亦遭遏制\n\n今时今日，法军所负之责，已无可推诿。殖民地匪患犹存，正待最后一击。如今军容重振，民心尚武，若要不负先总统重整戎旅之苦心，唯有以死战之志报效国家，为国干城"







 RegionalOrganization_EU: "欧洲联盟"
 RegionalOrganization_EU_colored:  "§Q$RegionalOrganization_EU$§!"
 RegionalOrganization_EU_desc_0: "£zollverein_texticon §Q$RegionalOrganization_EU$§!是欧洲经济共同体向政治方向演进而产生的结果，这一新兴的政治联盟包括了诸多亲德的欧洲国家，在各国钢铁般的纽带之下，轴心国的欧洲各国紧密的连接，其组织架构和体制致力于欧洲一体化的推进，实现建立兄弟国家联盟的终极目标，当然，更准确的说，是让欧洲各国自愿俯首称臣，永远臣服于欧洲最伟大的帝国，德意志民族的大日耳曼国之下。"
 

 RegionalOrganization_ExileCommonwealth: "英联邦"
 RegionalOrganization_ExileCommonwealth_colored: "§V$RegionalOrganization_ExileCommonwealth$§!"
 RegionalOrganization_ExileCommonwealth_desc_0: "英联邦宛如战前世界留下的一抹残影。它曾旨在构建“由英国王室维系的自由国家联盟”，如今却沦为一盘散沙。这个组织犹如失去首脑的躯干，昔日将各成员国紧密相连的经济、政治与军事中枢早已被生生切断。尽管加拿大事实上接过了同侪之首的位置，其始终难以确立真正的领导威信。 \n\n加拿大摒弃了昔日大英帝国的残酷与暴虐，更倾向于采取温和手腕，试图通过外交途径协调各成员国间的关系。这些成员国情势迥异，既有“白人自治领”和西印度群岛，也有激进的泛非共和国，然而这番努力收效甚微。英联邦内部错综复杂的意识形态甚至波及了该组织的地缘政治格局，尽管亲自由国家组织的立场在成员国中占据主流，却远未达成共识，内部纷争更是屡见不鲜。当下的英联邦仅仅靠着对“海外女王”名义上的效忠勉强维系，已然形同虚设，只能在新秩序中艰难寻找自身的定位与价值。"


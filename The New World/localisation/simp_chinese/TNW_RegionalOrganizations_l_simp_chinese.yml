 RegionalOrganization_UN: "联合国"
 RegionalOrganization_UN_colored: "§m$RegionalOrganization_UN$§!"
 RegionalOrganization_UN_desc_0:  "£zollverein_texticon 随着瑞士的覆灭，国际联盟也真正意义上的灭亡，1948年，数十国代表齐聚美国旧金山，召开联合国国际组织会议，共同议定并通过了《联合国宪章》，与会各国代表郑重签署。同年，法国、英国、美国及其他多数签字国相继递交批准书，宪章随之生效，联合国遂告正式成立。\n\n而为发展国际间基于尊重各国人民平等权利与自决原则的友好关系，推动国际合作，以解决经济、社会、文化及人道主义诸般难题，并增进对全人类之人权与基本自由的普遍尊崇——为实现这些崇高宗旨，联合国确立了七项基本原则，其核心在于：各会员国主权平等；以和平方法化解争端；不得使用武力或武力威胁；联合国为维护国际和平与安全，在必要范围内可确保非会员国亦遵循上述准则；以及不得干涉本质上属于任何国家国内管辖之事项。"

 RegionalOrganization_IOSC: "国际服务与合作组织"
 RegionalOrganization_IOSC_colored: "§r$RegionalOrganization_IOSC$§!"
 RegionalOrganization_IOSC_desc_0: "£zollverein_texticon §c$RegionalOrganization_IOSC$§!“世界服务”原是乌尔里希·弗莱施豪尔于1933年在埃尔福特创办的一家反犹新闻机构，后并入罗森伯格办公室，成为第二次世界大战期间纳粹宣传的重要机关。随着德意志的战火席卷旧世界，将“新秩序”的火焰燃遍旧秩序的每一寸土地，“世界服务”也逐渐改组为一个国际性组织，并与德国费希特联盟和德国之友组织合并。\n\n因此，我们不妨直接称其为“纳粹国际”——其排外本性及意识形态诉求，足以承载这一名号。欧洲大陆之主通过这一机构，源源不断地向各地纳粹政府与组织输送理论，在政治与经济层面缔结联盟、开展合作。乌尔里希·弗莱施豪尔最初的构想终于达成：在世界历史上首次建立起一个国际性的犹太人问题专家组织，用以对抗“犹太国际”。而埃尔福特也因此被奉为反犹主义者的“麦加”。"
 

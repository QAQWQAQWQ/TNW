 RegionalOrganization_OAS: "美洲国家组织"
 RegionalOrganization_OAS_colored: "§a$RegionalOrganization_OAS$§!"
 RegionalOrganization_OAS_desc_0: "从华盛顿的国会山到火地岛的冰冷礁石，新大陆的命运名义上被一条神圣的纽带联系在了一起。“美洲国家组织”的建立，曾被宣扬为西半球民主、主权与和平合作的终极灯塔。在冠冕堂皇的官方章程中，它誓言要捍卫每一个美洲国家不受外来侵略，通过经济互助与外交协商来化解内部危机，打造一个没有硝烟的“新大陆共同体”。然而，在这层温情脉脉的面纱背后，潜藏着的却是冷酷无情的大国地缘政治算计。\n\n在西半球的政治版图上，该组织在实质上早已沦为北方巨擘巩固其后院霸权的战略长臂。华盛顿的金元与驻防美军成了各国外交决策时无法逾越的阴影。每当拉美本土涌现出试图摆脱控制的激进思潮或革命运动，该组织便会以‘维护民主秩序’的借口迅速集结，通过政治孤立、经济制裁乃至默许武装干涉，将不听话的政权拒之门外。尽管各拉美成员国在私下里暗流涌动，对这种不平等的宗主关系充满怨言，但在强大的外部压力与现实利益的裹挟下，美洲国家组织依旧在名义上维持着美洲大陆那看似铁板一块、实则脆弱不堪的“自由阵线”。"

 RegionalOrganization_CollabCommonwealth: "大英国协"
 RegionalOrganization_CollabCommonwealth_colored: "§Z$RegionalOrganization_CollabCommonwealth$§!"
 RegionalOrganization_CollabCommonwealth_desc_0: "英联邦曾设想构建一个由王室维系的自由国家联盟，早年也的确照此运转，直至王室倾覆，这一自由联盟随之分崩一析。时至今日，联邦已蜕变为完全以英国为核心的霸权组织，沦为替大英帝国粉饰门面、造势宣传的文化工具。\n\n渥太华的帝国流亡政府，只能靠着与日益萎缩的海外领地之间虚无缥缈的纽带聊以自慰。至于现在的大英国协，其成员已大幅缩减，仅囊括三大板块：首当其冲的是战火洗礼后的英国本土；其次是那些依旧处于铁甲履带高压统治下的英属非洲领地；最后则是由于地缘政治裹挟、与英国素有历史渊源的亲德国家。这种荒诞的成员构成，无情地戳破了其过去的自由伪装。当下的国协，其残存的国际合法性与外交号召力已与大英帝国的战争机器深度捆绑。白厅的政客们心知肚明，国协已不再是一个能靠着空洞宣誓就能维持的家族，其最终的生死存亡与法理延续，全凭英军在血肉横飞的非洲战场上能否取得最终的成败来定夺。"


 RegionalOrganization_AfricanLabourBoard: "非洲劳工理事会"
 RegionalOrganization_AfricanLabourBoard_colored: "§r$RegionalOrganization_AfricanLabourBoard$§!"
 RegionalOrganization_AfricanLabourBoard_desc_0: "非洲劳工理事会既是一项国际条约，也是一个国际组织，成员涵盖了非洲大陆上形形色色的殖民帝国、定民者国家以及实行多数统治的独立国家。该机构主要通过双边协调，统筹管理各方共同关注的议题，包括移民管控、劳动力调配以及侨汇事务。\n\n移民劳工是整个非洲经济的支柱。理事会的设立，旨在将劳动力的跨境流动及侨汇汇兑纳人正规化管理。这样一来，既能确保移民配额达标，又方便理事会及相关缔约国从中抽成并征税。缔约国按角色分为两类，即劳动力的“输出国”与“输入国”。南非是纯粹的输入国，独立的非洲国家多为输出国，而殖民帝国则兼具双重身份。\n\n无数非洲人背井离乡，赴海外出卖苦力。对他们而言，理事会是一道绕不开的官方门槛，想养家糊口就得按规矩办事；同时，这也是当局监视和审查他们政治立场与背景的工具。相比之下，欧洲定居者无论是工作还是出行，都不受该理事会的限制。绝大多数移民劳工的人生境遇，不过是账本上冷冰冰的数据。只要还有活干，他们就必须默默忍受各种虐待、剥削与屈辱。而在这里，活永远干不完。"

 RegionalOrganization_SACU: "南部非洲关税同盟"
 RegionalOrganization_SACU_colored: "§J$RegionalOrganization_SACU$§!"
 RegionalOrganization_SACU_desc_0: "南部非洲关税同盟诞生于惨烈的英布战争之后，是至今仍在运作的历史最悠久的关税同盟。其设立初衷是加强南部非洲各殖民地间的贸易联系，进而保障税收与资源供应。然而，随着英国本土沦陷于德军之手，加之新独立的南非吞并了高级专员领地，该同盟的职能发生了根本性的转变。\n\n实质上，殖民时代掠夺财富与矿产的勾当还在继续，只是坐收净利的换成了比勒陀利亚当局，该同盟也沦为南非向邻国扩张经济霸权的工具。尽管同盟最初涵盖的范围仅限于南非、贝专纳兰、巴苏陀兰和斯威士兰，但目前已有人提出新方案，企图在这个种族隔离国家与其周边伙伴之间建立“南部非洲共同体”，以此扩大版图并进一步巩固这一霸权体系。"

 RegionalOrganization_CADAT: "中非发展与援助条约"
 RegionalOrganization_CADAT_colored: "§l$RegionalOrganization_CADAT$§!"
 RegionalOrganization_CADAT_desc_0: "在硝烟弥漫的中非地带，“中非发展与援助条约”（CADAT）常被调侃为国际外交史上的铁血黑色幽默。该条约从字面上看，充斥着“人道主义救援”、“基础设施建设”与“跨国经济协作”等充满现代文明光辉的词汇。然而在国际社会眼中，谁都清楚这份条约的实际用处——它是各大地缘强国在不引发全面战争的前提下，合法介入中非混战、扶持本国代理人并维持脆弱地缘均势的绝佳挡箭牌。\n\n既然条约框架在外界看来‘完全无问题’，那么幕后的利益分赃就能在最优雅的西装革履下安全进行。从武器禁运的暗度陈仓，到对争议矿区的联合开发，CADAT成了各方势力默认的博弈规则。它既不指望能真正带来中非的繁荣，也不打算彻底消灭贫困，其真实的核心职能仅仅是充当一个高效率的危机缓冲阀。只要各签署国还能在这个大蛋糕上各取所需，中非那动荡不堪的局势，就会在条约的维稳下，维持着一种精巧而残酷的“表面和平”。"


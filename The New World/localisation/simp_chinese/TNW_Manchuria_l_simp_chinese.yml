 ###Manchou Assorted Laws###
 MAN_Manchuria_New_Constitution_law: "§L1965年§!·£GFX_MAN_Manchuria_New_Constitution §O大满洲共和国§!§f新宪法§!"
 MAN_Manchuria_New_Constitution_law_desc:"§f宪法§!§W第一条§!：§O大满洲共和国§!基于帝制落后，人民困苦不堪而成立，其根基成立于§V五§!§a族§!§W协§!§q和§!，§Y人民幸福§!为之标准\n\n§f宪法§!§W第五条§!：§O国民§!的§Q基本权利§!不得因§f宪法§!没有顾及被忽视。§f宪法§!还规定，国民的基本权利只有在与国家安全、法律和稳定或社会发生冲突之时才会受到§f宪法§!的§Z限制§!。§f宪法§!还明确规定了所有国民应履行国家法律的基本义务，包括但不限于§h纳税义务§!、§m教育义务§!、§J工作义务§!和维持§O共和国§!安全的§U国防义务§!\n\n§f宪法§!§W第十条§!：对成立、加入，诱劝、赞美§V共产主义意识形态§!团体或者组织、对反国家团体的称赞和鼓动的行为、对§e危害国家社会稳定§!、对§X国家宪法违反行为§!的不告知行为皆定为§x犯罪§!"

 MAN_Manchurian_Compulsory_Education_law: "§L1984年§!·£GFX_MAN_Manchurian_Compulsory_Education §O满洲共和国§!§I义务教育法§!"
 MAN_Manchurian_Compulsory_Education_law_desc: "“根据‘§X五族协和，泛亚共荣§!”的思想，§l国家义务教育§!的目的在于协助所有国民完善其§a个人的品德§!，§j培养独立生活能力§!和取得能参加§f建设国家§!和促进§V共荣圈§!繁荣活动的§n合格国民资格§!。”——《§O满洲§!·§I一九八三年教育厅§!》\n\n教育包含§m小学§!至§h初中§!共§L九年§!，§m小学§!六年，§h初中§!三年，§Q高中§!三年，§P大学§!四年。§m小学§!和§h初中§!在国家是§S免费义务教育§!，如有§j成绩优异者§!，可§A免费享受§!国家提供的§P大学教育§!。\n\n进入§L二十世纪八十年代§!，§K提高教育质量§!成为满洲教育的焦点。§l义务教育§!被纳入§f宪法条文§!中，并成为§O满洲§!四大国政目标之一。在§L一九八四年§!逐步推广至偏远地区，截至§L一九九零年§!，已§<全面落实小学义务教育§!，临进千禧，§O满洲共和国§!开始注重培养全面发展的复合型创造性人才用来面对§I新兴产业科技§!"

 MAN_Presidential_and_Public_Service_Act_law: "§L1990年·£GFX_MAN_Presidential_and_Public_Service_Act §U总统及公务员法§!"
 MAN_Presidential_and_Public_Service_Act_law_desc: "自§e革命§!成功以来，§U总统§!身边一直依赖一群§O满洲共和国军§!的§A军官§!、§q企业寡头§!、§o日本顾问§!以及§&部门官僚§!提供建议和专业知识。众所周知，§w国家委员会§!的大多数成员都是§U总统§!最亲密的伙伴，他们都在共和政府的核心位置中受益匪浅。其秘密的商议成为地下小册子谴责的对象，但这些都不能§h平民百姓§!容易理解其关系。\n\n§P现实情况§!并不平凡，但也当然不像§S新闻小报§!所宣称的那样肮脏不堪。§U总统§!的盟友全部是地地道道的§O满洲人§!在思想上，只要符合§U总统§!的意愿，他们就会有所收获，并且毫无疑问都要§.服从总统§!：那些有高超手段的人能施加巨大影响力的传言终究只是幻想,\n\n在§O满洲§!，§U总统§!的§.权力§!绝对凌驾于任何人之上。尽管过去有成员确实拥有很大的权力，但随着§Q崔圭夏§!的到来，§s公务员§!们影响§U总统§!的能力已经成为过去式，现在是一个§<民主§!的§,共和国§!即使§J官僚作风§!在政府内存在不少，但§O满洲人民§!们获得了可以自己组建§d政治团体§!参与§f国家事业§!的权力，§s公务员§!聘用的人选也不仅限于§l朝鲜族§!和§X大和族§!了，不少§s公务员§!拥有§*双重身份§!：他们不但是§O现政府§!的§s公务员§!，还是§p民间政治团体§!的参与者。更加开明的政策让不少人对政府仍抱有希望，或许将来的某一天，一切的一切都会被打乱"
 
 MAN_Manchuria_Intelligence_Bureau_law: "§L1973年§!·£GFX_MAN_Manchuria_Intelligence_Bureau_law §O满洲共和国§!§m情报厅§!"
 MAN_Manchuria_Intelligence_Bureau_law_desc: "在当今的§O满洲§!，人民对§B自由§!和§*民主§!的追求是历朝历代前所未有的，即使取缔了§j协和会§!的§G民族委员会§!重新替代了原有的生态位，但是现在人们不再满足于§S民族叙事§!，关于政府行政措施上的§*民主§!，§l言论§!的自由与否，已经深入了群众当中，§m情报厅§!由此而成立。\n\n§m情报厅§!在明面上是§O满洲共和国政府§!用来防止§X共产主义§!，处理§K北方§!的§n边境问题§!以及用来协助§e日本§!在§V共荣圈§!内的影响力而成立的。实际上，它是一种§r遏制§!和§j监视§!的§q秘密警察§!§O政府§!通过聘用“顾问”来保持直接对§d民间政治团体§!和组织的了解，在§O满洲共和国§!内，不少§d民间政治团体参与者§!被§m情报厅§!的§q秘密警察§!通过§X共产主义§!和§K俄国间谍§!的理由被迫受到拘留和严刑拷打"

 MAN_Manchurian_Military_Reform_law: "§L1985年§!·£GFX_MAN_Manchurian_Military_Reform §j新满洲共和国军改革法§!"
 MAN_Manchurian_Military_Reform_law_desc: "在§L一九七一年§!彻底解决完§e赤匪§!叛乱后，§O满洲共和国§!的§j常备武装力量§!弊端显现出了：严重缺乏训练、各兵种部门协调不合、后勤准备方面严重缺陷、国防厅臃肿的官僚障碍。在§U时任总统§!§A朴正熙§!的指示下，时任国防部长§S白善烨§!领导的§J国务院§!在§L一九七二年§!颁布了《§.满洲共和国军改革法§!》，在当时该法案的目标是为推动§O满洲共和国军§!军事理论，装备采购现代化，§u满洲共和国防厅§!行政、战术、战略能力现代化，并将§O满洲共和国军§!作战能力与§V大东亚共荣圈§!整体武装力量结合，同时将§X关东军§!和§,原宪兵队§!解散，统一整合进新的§O满洲共和国军§!，最重要的是将§O满洲共和国军§!从一支§*反游击劲旅§!改造为一个自给自足的§.国防武装§!。\n\n在朴死后，§r军事改革§!仍未完成，各部门长期的§&利益关系§!和腐败的§h官僚作风§!严重影响着§O满洲共和国军§!的§S现代化历程§!，通过§m情报厅§!和§o日本顾问§!的预测和建议，由§Q崔圭夏§!总统领导的§J国务院§!在§L一九八五§!推出了§u国防厅§!的《新满洲共和国军改革法》，皆在通过国家介入，将§u国防厅§!绑定其他部门，加强各部门之间协调，进一步将§!国防厅!行政效率化改革，针对§K北方边境问题§!实施§E特殊化军事处理§!，§*设立满洲特种部队§!，进一步深度绑定§O满洲共和国军§!与§V共荣圈§!军事安全。 "


 MAN_Manchurian_Republic_Special_Forces_law: "£GFX_MAN_Manchurian_Republic_Special_Forces §&满洲共和国特种部队§!"
 MAN_Manchurian_Republic_Special_Forces_law_desc: "§X关东军§!曾经在§O满洲§!只手遮天的日子成为了过往，取而代之的是新的§&满洲共和国特种部队§!：§m情报厅§!与§u国防厅§!合作的产物，§U总统§!可直接指挥。§o蛇鼠一窝§!可谓是形容特种部队最好的形容词，他们在§O满洲§!内的势力分布盘根错折：作为§O满洲国际开发集团§!的§Q对外承包安保§!，§m情报厅§!的§h线人§!，§u国防厅§!的§f新式武器承包商§!。但作为§U§U总统§!的§Z忠犬§!，§O满洲§!的§d白手套§!，很多国家方面不好直接出面解决的事全都由他们§A私下解决§!：§n北方边境§!的§K俄国间谍§!，§O集团§!的§E竞争对手§!，以及§a串通外国§!的§l贪污部长§!。\n\n相比§J官僚体制§!，是谁能左右§<王侯将相§!的§b命运§!，毫无疑问的就是§&满洲特种部队§!" 

 
 MAN_Manchuria_International_Development_Group_law: "£GFX_MAN_Manchuria_International_Development_Group §J满洲国际开发集团§!"
 MAN_Manchuria_International_Development_Group_law_desc: "当§R东北§!独立为§O满洲§!从§Z泛亚主义§!诞生时，§O满洲§!就是各个§o民族企业家§!的天堂，§X日本帝国§!在一日之间将这片§<王道乐土§!的秩序与权力统统规划为一颗§e钢铁心脏§!，§U企业国家§!的理想就是靠这颗§e心脏§!维持的。就在革命完成之后的那天起，作为横跨§V亚洲§!，§a美洲§!，§b非洲§!的§J世界级§!巨头资本,\n\n§J满洲国际开发集团§!继承了前身§f满洲重工业开发株式会社§!的衣钵，经过§.帝制时期§!的§E野蛮生长§!，到§O共和时期§!的§h国家干预§!，如今的§J满洲国际开发集团§!已经将效率与现代化刻到了骨子里，像一张蛛网编织着§V共荣圈§!和§I世界§!曾经被认为是§O满洲共和国§!肿瘤的托拉斯，§j政府§!通过其权威强迫成为§*国家权力机关§!的一部分，其力量为被转换为正常对外影响力的工具，并非往日的阻碍。如果§O满洲共和国§!想§S繁荣§!，他只用依靠其中的意志，并为政府条款而办事。"

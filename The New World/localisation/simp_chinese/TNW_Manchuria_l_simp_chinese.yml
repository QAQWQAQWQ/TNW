 MAN_New_Era_New_Manchuria: "新世纪，新满洲"
 MAN_New_Era_New_Manchuria_desc: "自我国独立，脱张氏之腐败，离蒋逆之暴政，兴于友邦日本之提携，共建东亚新秩序于有六十五年，自本国独立伊始，民族和协，人民勤奋，爱新觉罗氏称帝，朴氏兴起，兴盛满洲，即废帝制，建立共和，临近千禧，大东亚安泰久稳，大满洲欣欣向荣。"
 MAN_Pan_Asian_Comrades: "泛亚战友"
 MAN_Pan_Asian_Comrades_desc: "自大东亚战事告捷，亚细亚百年新格局自此展开，满洲兴于泛亚，为不负复兴东亚民族之使命，乃自身应全心投入泛亚共荣等彼之伟业。东京、新京、南京、皆为汝等促进东亚和平之同志，世界和平之战友，迈入新世纪，共守新秩序，乃吾辈楷模，吾等使命。"
 MAN_The_Chaos_Generation: "混沌的一代"
 MAN_The_Chaos_Generation_desc: "满洲共和国并非自发性的成立，而是通过朴正熙为首的军官团发动政变被迫诞生的，名义上是为了满洲各族人民的美好生活而建立，但事实上满洲共和国实施宪政却是在崔圭夏总统任期内实行的，在此之前已经有不少进步人士为了共和国的宪政化付出了生命，各种学生运动此起彼伏。人民的血在流，群众的泪在滴"
 

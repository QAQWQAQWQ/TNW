 MAN_Choi_Kyu_hah: "崔圭夏"
 POLITICS_CHOI_KYU_HAH_DESC: "崔氏其人，毕业于满洲大同学院，为人做事清廉简朴，举止措施儒雅低调，常年耕于东亚政界，混际于军警系统，擅长多国外语，在任职满洲帝国军警时期，恰逢朴氏发动革命政变，建立满洲共和国,\n被朴氏同僚举荐，遂被赏识，被提拔至外交部，此逢世界石油危机，出任造访阿拉伯，深获多国领导信赖，为东亚共荣圈解决一大危机，冠号为“一等功臣”，此事之后深获朴氏信赖，后遇领导改组内阁，崔圭夏沉默寡言、忠贞务实的特质受朴氏欣赏，因而选择了崔圭夏任总理。\n任职总理期间，崔圭夏担任朴氏外交事务，解决了多项外交订单，满洲与别国贸易来往与日增加，经济形势一片大好。\n\n一九八六年，满洲共和国正面临着巨大的政治危机，纸终究包不住火，高速发展的经济下是各民族的血泪，愤怒的人民冲上街头，即使军警前来镇压也潮涌不停，尸骨上的独裁者朴正熙终究难逃一死，作为总理的崔圭夏，这位在政府中以务实儒雅著称的总理用自己巧妙的方法化解了这场危机，他顺应了人民们的愤怒，他同意将满洲共和国真正的宪政化，同时允许人们应有的人权与自由，\n\n民众称这场改革为新京之春，毫无疑问，崔圭夏挽救了共和国，拯救了这个新生的国家，真正意义上成为了共和国。"
 MAN_Lee_Teng_hui: "岩里政男"
 POLITICS_Lee_Teng_hui_DESC: "岩里政男，出生于台湾岛，一九四三年，赴日本京都帝国大学留学，农业经济专业毕业，回台后主攻农业经济与物价的关系，成为农业经济专家，经熟人介绍来到满洲担任间岛省农业部长，\n\n由于其农业经济专家的身份，被朴正熙赏识后提拔为满洲共和国农业部副主任，后逢学生运动，因自身政治立场问题被革职，\n后复职担任农业部主任，朴氏死后，崔圭夏上任，对其栽培，劝其加入国家委员大会，后将其担任总理。"
 MAN_Sadakazu_Tanigaki: "谷恒祯一"
 POLITICS_Sadakazu_Tanigaki_DESC: "作为帝国陆军中将影佐祯昭的外孙，谷恒祯一走上了不同于爷爷为帝国开疆扩土的道路，一九七二年毕业于帝国名牌大学东京大学法学部后，随即投身于满洲政坛，此时的满洲恰逢为前身是满洲国军朴正熙的治下，\n\n通过家族的人脉关系，在满洲政府内平步青云，担任了新京市市长，建国大学教授，满洲国驻中大使等多项职位，在崔圭夏担任总统时期，加入国家委员大会，升任为财政部部长。"
 MAN_Cai_Ying_wen: "蔡英文"
 POLITICS_Cai_Ying_wen_DESC: "如果选出满洲的民主代表，无疑是蔡英文，素以反政府而出名的政治标准，但他的父亲是为满洲国的关东军而服务的，这让她有机会前往新京读书，在新京的学生时代可谓是蔡英文最难忘的时候，在这里她接受了来自民主的思想浪潮，于是参加了当时反对朴正熙政府的游行活动，尽管活动被当局残酷镇压，但是无疑为她以后的从政道路铺下了基础，立志为满洲实现民主，即使付出生命。"

 POLITICS_ZHANG_YU_DESC:0 "£GFX_kmt_party §i中国国民党党籍§!\n\n澳门兴旺，离不开真金白银，也离不开其深厚的文化传承。张裕，一九七五年毕业于濠江中学，后负笈澳门大学与葡萄牙国家行政学院，获公共行政学士学位，复于中山大学修毕行政管理硕士课程\n\n其人生阅历极丰，早岁执鞭杏坛，育人无数；继而醉心山水，以镜头捕捉世间光影，八十年代起便热衷自助旅游与摄影，屡办个展，著述颇丰，今为澳门自助旅游协会荣誉顾问，堪称行走与思考并重的文人型官员。\n\n然其志不止于此。自投身政界，历任葡澳市政议员，尤以廉署经历见知于世。这段与贪腐较量的岁月，铸就了他的清刚之气，也赢得了南京的高度信任。主政以来，他一手抚平博彩业的风浪，一手深耕澳门的文化厚土。在东西交汇的十字路口，他以稳健之姿掌舵，令这座昔日流光溢彩的赌城，渐次回归平缓与从容。中央对其信赖有加。"
 AOM_Thousands_of_Gold_and_Earth:0 "千金万土"
 AOM_Thousands_of_Gold_and_Earth_desc:0 "道光一朝，鸦片战起，香港崛兴。澳门昔日雄踞远东商埠之席，顿失其势，库藏空虚，度支维艰。为敛财自救，澳葡当局于公元一八四七年明令赌业合法，始征“赌饷”。此乃濠江博彩之滥觞，亦渐获“东方蒙特卡洛”之诨名。\n\n迨至一九三七年，高可宁、傅老榕之“泰兴娱乐总公司”夺专营之权，博彩始具规模，初现现代经营之象。公元一九六一年，葡国中枢正式认赌业为合法。翌年，何鸿燊、霍英东、叶汉等合组财团，即日后之“澳门旅游娱乐有限公司”，以些微价差挫败泰兴，执得赌牌。何氏主政四十载，将博彩铸成现代巨利之业，澳娱一家独大，基业遂固。\n\n新世纪之初，濠江夜色依旧璀璨，赌城之名响彻海宇。在这片寸土寸金之地，万金散尽只在一掷之间，满城皆是挥金如土的喧嚣。"
 AOM_Ease_Homesickness:0 "願君解鄉愁"
 AOM_Ease_Homesickness_desc:0 "七六回归，政权易手。面对前程之未卜，葡籍吏员与住民，或有仓皇离境者；然亦有累世居澳之土生葡人，及远方侨寓者，择此水土以为终老之乡。\n\n二十余载倏忽而过，世易时移。英文大行其道，兼之老人凋零，昔日曾风靡一时之“土葡语”，已基本消亡。年少一辈，能操纯正葡音者日稀，葡裔之文化认同，遂陷迷途。\n\n然无论世居之土生，抑或远来之客，泰半视濠江为桑梓。其生计也，既存西洋遗风，亦深染华夏习俗。正如一土生庖厨所言，朝饮咖啡以佐蛋挞，暮赴大排档而食镬气小炒，浑然天成，不知其为异也。曾有葡人作歌以记之，歌曰：\n\n送君花一翦    願君解鄉愁。"
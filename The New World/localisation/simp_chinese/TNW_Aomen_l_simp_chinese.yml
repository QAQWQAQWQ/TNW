 POLITICS_ZHANG_YU_DESC:0 "£GFX_kmt_party §i中国国民党党籍§!\n\n澳门兴旺，离不开真金白银，也离不开其深厚的文化传承。张裕，一九七五年毕业于濠江中学，后负笈澳门大学与葡萄牙国家行政学院，获公共行政学士学位，复于中山大学修毕行政管理硕士课程\n\n其人生阅历极丰，早岁执鞭杏坛，育人无数；继而醉心山水，以镜头捕捉世间光影，八十年代起便热衷自助旅游与摄影，屡办个展，著述颇丰，今为澳门自助旅游协会荣誉顾问，堪称行走与思考并重的文人型官员。\n\n然其志不止于此。自投身政界，历任葡澳市政议员，尤以廉署经历见知于世。这段与贪腐较量的岁月，铸就了他的清刚之气，也赢得了北京的高度信任。主政以来，他一手抚平博彩业的风浪，一手深耕澳门的文化厚土。在东西交汇的十字路口，他以稳健之姿掌舵，令这座昔日流光溢彩的赌城，渐次回归平缓与从容。中央对其信赖有加。"
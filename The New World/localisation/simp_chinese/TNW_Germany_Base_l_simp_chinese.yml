 GER_gerhard_kaindl:0 "格哈德·凯恩德尔"
 POLITICS_GERHARD_KAINDL_DESC:0 "格哈德·凯恩德尔登上政治舞台之时，正值德国政局风云激荡的年月。\n\n1993年，保罗·韦格纳辞去元首职务，将权力移交给奥托·穆斯格努格的门生，格哈德·凯恩德尔。穆斯格努格因心脑血管疾患，决定退居副总理之位，于幕后继续操纵大局。党内对凯恩德尔的不满，自此便悄然蔓延。他虽是穆斯格努格的得意门生，却并非党内最受拥戴的接班人。\n\n军备部长乌多·沃伊特与军队系统的党内实力派，对凯恩德尔的接任本就满腹牢骚。1997年穆斯格努格逝世后，失去“恩主”制衡的各方势力与凯恩德尔之间的矛盾迅速激化，党内的激烈斗争，就此拉开序幕。"

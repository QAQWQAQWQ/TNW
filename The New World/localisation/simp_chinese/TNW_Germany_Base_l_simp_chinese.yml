 GER_Leadership_rejuvenation:0 "领袖年轻化"
 GER_Leadership_rejuvenation_desc:0 "从前，一名有志者若想登上党的领导高位，必须历经漫长的工龄积累、基层淬炼、多岗位轮转，再经干部培训学校的系统训导，最后通过组织选拔与任命程序，方能正式履职。\n\n随着各级纳粹党领导人逐渐由专门培训学校培育而成，此类机构应运而生。党校，作为党所主导的培养领导干部的核心阵地，成为锻造各级党务与行政骨干的主渠道。其首要任务便是：“培训党政官员、行政管理者、经济界领袖、军事指挥官、青年干部、理论宣传骨干、精英人才、基层负责人以及普通党员。”\n\n这一制度持续推进，国家领导层的年轻化趋势日益显著，越来越多风华正茂的面孔出现在关键职位上。他们较之老一辈拥有更充沛的精力与更活跃的头脑；至于这究竟意味着进步还是隐忧，则留待后人评说。"
 
 GER_European_integrated_economy:0 "欧洲一体化经济"
 GER_European_integrated_economy_desc:0 "伟大的希特勒与他缔造的德意志国，是一个腐化程度前无古人的强大国度。几十年来，在她强权统治下的士兵以摧枯拉朽之势击溃了欧洲各国，踏平了从法国西海岸到俄罗斯荒原的每一寸土地，在新征服的领土上建立起一系列的傀儡政权。\n\n如今，德国已不再简单地对各国进行军事占领，而是以强大的经济实力为基础实行间接统治。于战后成立的欧共体，表面上是欧洲各国间平等互利的经济组织，实则是德国控制整个欧洲大陆货币和贸易的趁手工具。\n\n帝国的光芒已渗入欧洲的每一道缝隙，在新秩序的烈日下，她的邻邦被经济的锁链牢牢缚住，它带来一片废墟，也带来了所谓六十年的和平。"

 GER_Legacy_of_party_system_reform:0 "党体制改革的遗产"
 GER_Legacy_of_party_system_reform_desc:0 "为革除旧弊，使各项体制适配现代化建设之需，格哈德·克洛普弗与保罗·韦格纳对党进行了改造。而从当下的政策语境来看，这场体制改革绝非止步于单一的经济领域，而是一场以经济体制改革为牵引、各领域环环相扣的系统工程。\n\n如今，两位元首留给祖国的改革遗产仍在熠熠生辉。他们改造了德国，在这条新征程上，历史的新一轮变局大潮正奔涌向前。而德国，将与她的儿女一道，直面下一个千年的浪潮。"

 GER_Half_the_world_center:0 "半个世界的中心"
 GER_Half_the_world_center_desc:0 "帝国的力量已从欧洲蔓延至拉美与非洲，从巴黎到莫斯考，从北非海岸的烈焰到南非的高地，再到阿拉伯世界，直至拉美的雨林。所有目光，都投向那座世界之都，日耳曼尼亚。\n\n新秩序的光芒已笼罩大半个世界。毫无疑问，德国就是当下半个世界的中心。若以人口而非地理为尺度，有学者提出：以日耳曼尼亚为圆心、半径四千公里的圆，将扫过欧洲大部、整个非洲、中东、南亚、中亚与西亚，几乎将欧亚非大陆的人口热区一网打尽。\n\n这个圆，恰好将人类文明旧大陆的核心，从大西洋到太平洋、从地中海到北冰洋以南的所有人口稠密地带完整罩住。"

 GER_Consolidating_the_maritime_borders:0 "鼎定海疆"
 GER_Consolidating_the_maritime_borders_desc:0 "在最终胜利之后，陆地上已不存在能与帝国直接抗衡的国家。然而，在自由主义的尽头，美利坚合众国依然屹立于世。为应对海上对抗与意识形态之争，帝国逐步将重心转向海军建设，以及对美的意识形态抵抗。\n\n在无数狂热的德国青年眼中，美国是他们一切生活困顿的根源，一头疲弱的狮子，一个几十年前的手下败将。他们坚信，只要击倒美国，所有困境便会迎刃而解。\n\n然而，事实果真如此吗？"

 GER_Jurgen_Schutzinger_hog:0 "尤尔根·舒茨格"
 GER_Jurgen_Schutzinger_hog_desc:0 "§Y帝国副总理\n正统民族社会主义§!\n--------------\n尤尔根·舒茨格是与马丁·穆斯格努格同时代的元老，他亲眼见证了穆斯格努格死后党内四分五裂的乱局。\n\n三人小组的时代已成往事。作为曾经的政治盟友，他难免生出兔死狐悲之感。而他的存在，更多的意义在于“照顾”穆斯格努格留下的门生。然而，德雷斯顿圈与霍克的野心已渐渐浮出水面，他如今又能拿什么来阻挡他们？\n\n他的灵魂困在这具日渐衰朽的躯壳之中。他在感受自己正一步步走向死亡——所有人都在走向死亡。今日的胜者，又有谁能去征服明天？他所剩的时间已经寥寥无几。谁知道他还能活多久？二十年，三十年，或者……就是明天。"

 GER_Helmut_Kohl_for:0 "赫尔穆特·科尔"
 GER_Helmut_Kohl_for_desc:0 "§Y帝国外交部部长\n正统民族社会主义§!\n--------------\n对于年幼的科尔而言，兄长沃尔特在第二次世界大战中为国捐躯，成了他生命中最早、也最深的烙印。\n\n1946年，尚在校求学的他便早早入党。在他主政的岁月里，那些曾经落后的州，被他一列一列开向了现代化。这份亮眼的成绩单，将他一路送进党内高层。在许多同僚眼中，他是一个实干家，一个拥有充分外交经验、值得托付的可靠之人。正因为如此，在国家主导的欧洲经济统一化蓝图上，作为这项政策坚定的支持者，他受到了前所未有的重用与提拔。\n\n2002年的德国，赫尔穆特·科尔已是一位老人。外交部内暗流滚滚，蠢蠢欲动，只是他，已经没有余力再去一一约束了。\n\n退场，就在不远。"

 GER_Gunter_Deckert_eco:0 "君特·德克特"
 GER_Gunter_Deckert_eco_desc:0 "§Y帝国内政部长\n正统民族社会主义§!\n--------------\n君特·德克特那“坚强的性格与深沉的责任感”为无数人所公认，而他的“政治信念”，正是他能吸引大多数追随者的重要原因之一。\n\n在德克特这位甘愿为之献身的卫道士看来，他这种思想浓缩了阿道夫·希特勒思想的精华，是元首最终胜利与德国世界新秩序的主心骨。铁血狂热分子们的纯粹与忠诚，远非寻常人所能企及，他们注定将为党掌控社会的方方面面。\n\n至于他的构想是否合乎纳粹主义，其实无关紧要。对他而言，这不过是顺理成章的下一步罢了：他的德国就是希特勒的德国——而且，只会有过之而无不及。"

 GER_Udo_Voigt_sec:0 "乌多·沃伊特"
 GER_Udo_Voigt_sec_desc:0 "§Y统帅部参谋长\n异质纳粹主义§!\n--------------\n乌多·沃伊特是家中的独子。自幼年起，父亲便是他人生中唯一的榜样。那位老人是一名坚定的党员，早年加入冲锋队，后来成为德国国防军的一名军士长。\n\n1972年，沃伊特应征加入国防军，以空军军官候选人的身份，在诺伊比贝格空军军官学校接受训练。此后，他在多个部队担任军官，并在弗赖辛防空导弹部队出任作战军官。\n\n在空军的历练之后，他被升任至统帅部。在党内斗争愈演愈烈的年月里，他身居高位，也不可避免地被卷入了与凯恩德尔的角力之中。只是，胜负之数，至今尚无定论。"


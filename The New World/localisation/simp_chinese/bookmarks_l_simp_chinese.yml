 BM_HISTORY_TITLE: "简要历史"
 THENEWORDER_NAME: "美丽未来"
 THENEWORDER_DESC: "自“新秩序”重塑世界格局以来已有五十余载。世界虽又两次堕入战火，却也没能掀翻柏林、华盛顿与东京纵横博弈的棋盘。欧洲之主俯视半个寰宇，仿佛千年帝国之梦终将实现；星条旗拂过两洋之岸，计算着势力范围再平衡的新切入点；旭日灼烧古老大地，阴影下的窃窃私语又谁与有荣焉。不同的立场与价值观异口同声地许诺一个美好的未来，而未来如何，只道前路漫漫。"
 
  